# 配置版本号（不要手动修改，由模块自动管理）
config-version: 2
# AXS Map
# 作用: 提供全屏地图 GUI、小地图 HUD、世界配置、锚点、路径点、自定义图标和 AXMap 临时导航目标。
# 依赖: ArcartX；Vault、PlayerPoints、MythicMobs、NeigeItems 按功能选用。
# 重载: /axs map reload
# PAPI 输出: 无独立 PlaceholderAPI 输出。
# 可解析的 PAPI: 无；地图数据来自配置、玩家位置、世界坐标、锚点和运行时临时路径点。
# 关联资源: ui/map_menu.yml、ui/map_hud.yml

debug: false

ui:
  # menu-ui-id 全屏地图 UI；hud-ui-id 小地图 HUD。
  menu-ui-id: "AXS:map_menu"
  hud-ui-id: "AXS:map_hud"
  # packet-id 为客户端 Packet.send / 服务端 packetHandler 的通信标识。
  packet-id: "AXS_MAP"
  # 是否在启用/重载时自动注册 UI；overwrite-ui-files 为 true 时覆盖已导出的 UI 文件。
  register-ui-on-enable: true
  overwrite-ui-files: false

keybinds:
  # KeyBind 分类名和默认键位；default-key 使用客户端按键名。
  category: "AXS Map"
  open-menu:
    enabled: true
    display-name: "打开地图"
    default-key: "M"
  toggle-hud:
    enabled: true
    display-name: "切换小地图"
    default-key: "H"

# ─── 进服行为 ──────────────────────────────────────────
join:
  # 玩家进服后是否自动显示小地图 HUD
  show-hud-on-join: true
  # 进服后延迟多少 tick 再显示 HUD（等待客户端加载）
  show-hud-delay-ticks: 20

storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "<moduleId>.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: <N>
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_<moduleId>_"

# ─── 导航追踪 ──────────────────────────────────────────
navigation:
  # 是否启用导航追踪功能
  enabled: true
  # 路径点导航样式 ID
  waypoint-style-id: "default"
  # 锚点导航在客户端的 ID 前缀
  anchor-id-prefix: "AXS-map-anchor-"
  # 路径点导航在客户端的 ID 前缀
  waypoint-id-prefix: "AXS-map-track-"
  # 导航标记模型配置，控制路径标记实体的外观与行为
  marker:
    # 是否启用标记模型
    enabled: false
    # 模型 ID（资源包中的模型标识）
    model-id: "nav_beacon"
    # 缩放比例
    scale: 1.0
    # 默认状态
    default-state: "idle"
    # 动画类型
    animation: "rotate"
    # Y 轴偏移（方块）
    y-offset: 2.0
    # 路径标记间距（方块）
    path-interval: 3.0
    # 路径最大标记数
    path-max-markers: 20
    # 路径更新间隔（tick）
    path-update-ticks: 10
    # 路径最大距离（方块）
    path-max-distance: 64.0
    # 路径计算最大迭代次数
    path-max-iterations: 2000

# ─── 世界配置 ──────────────────────────────────────────
# 每个根键为世界 ID（对应 Bukkit world name），定义该世界的地图纹理与显示参数。
worlds:
  bskyblock_world:
    enabled: true
    display-name: "空岛"
    dimension: ""
    texture: ""
    image-width: 8192
    image-height: 8192
    pixel-offset-x: 0
    pixel-offset-z: 0
    default-zoom: 1.0
    hud-zoom: 0.18
    hud-size: 180
    # 不启用点亮机制（全亮）；后续通过 BentoBox 集成自动配区域
    regions: []
  bskyblock_world_nether:
    enabled: true
    display-name: "下界"
    dimension: ""
    texture: ""
    image-width: 1024
    image-height: 1024
    pixel-offset-x: 0
    pixel-offset-z: 0
    default-zoom: 1.4
    hud-zoom: 0.16
    hud-size: 180
    regions: []
  bskyblock_world_the_end:
