                      radius: 10
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  创建按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f新建
                      fontSize: 28
                      through: true
          # ─── 左下角：世界切换槽位 + 世界列表浮层（原神式）───
          世界槽位:
            type: Canvas
            attribute:
              point: ~top_left
              x: 28
              y: "var.viewH - 96"
              width: 72
              height: 72
            action:
