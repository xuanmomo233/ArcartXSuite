# 配置版本号（不要手动修改，由模块自动管理）
config-version: 1
# AXS Map
# 作用: 提供全屏地图 GUI、小地图 HUD、世界配置、锚点、路径点、自定义图标和 AXMap 临时导航目标。
# 依赖: ArcartX；Vault、PlayerPoints、MythicMobs、NeigeItems 按功能选用。
# 重载: /axs map reload
# PAPI 输出: 无独立 PlaceholderAPI 输出。
# 可解析的 PAPI: 无；地图数据来自配置、玩家位置、世界坐标、锚点和运行时临时路径点。
# 关联资源: ui/map_menu.yml、ui/map_hud.yml

debug: false

client:
  # packet-id 为客户端 Packet.send / 服务端 packetHandler 的通信标识。
  packet-id: "AXS_MAP"
  # menu-ui-id 全屏地图 UI；hud-ui-id 小地图 HUD。
  menu-ui-id: "AXS:map_menu"
  hud-ui-id: "AXS:map_hud"
  # 是否在启用/重载时自动注册 UI；overwrite-ui-files 为 true 时覆盖已导出的 UI 文件。
  register-ui-on-enable: true
  overwrite-ui-files: false

keybinds:
  # KeyBind 分类名和默认键位；default-key 使用客户端按键名。
  category: "AXS Map"
  open-menu:
    enabled: true
    display-name: "打开地图"
    default-key: "M"
  toggle-hud:
    enabled: true
    display-name: "切换小地图"
    default-key: "H"

# ─── 进服行为 ──────────────────────────────────────────
join:
  # 玩家进服后是否自动显示小地图 HUD
  show-hud-on-join: true
  # 进服后延迟多少 tick 再显示 HUD（等待客户端加载）
  show-hud-delay-ticks: 20

storage:
  # 存储模式: sqlite 本地文件；mysql 远程 MySQL。
  mode: "sqlite"
  sqlite:
    file: "map.db"
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "arcartxsuite"
    username: "root"
    password: ""
  pool-size: 4

# ─── 导航追踪 ──────────────────────────────────────────
navigation:
  # 是否启用导航追踪功能
  enabled: true
  # 路径点导航样式 ID
  waypoint-style-id: "default"
  # 锚点导航在客户端的 ID 前缀
  anchor-id-prefix: "AXS-map-anchor-"
  # 路径点导航在客户端的 ID 前缀
  waypoint-id-prefix: "AXS-map-track-"
  # 导航标记模型配置，控制路径标记实体的外观与行为
  marker:
    # 是否启用标记模型
    enabled: false
    # 模型 ID（资源包中的模型标识）
    model-id: "nav_beacon"
    # 缩放比例
    scale: 1.0
    # 默认状态
    default-state: "idle"
    # 动画类型
    animation: "rotate"
    # Y 轴偏移（方块）
    y-offset: 2.0
    # 路径标记间距（方块）
    path-interval: 3.0
    # 路径最大标记数
    path-max-markers: 20
    # 路径更新间隔（tick）
    path-update-ticks: 10
    # 路径最大距离（方块）
    path-max-distance: 64.0
    # 路径计算最大迭代次数
    path-max-iterations: 2000

# ─── 世界配置 ──────────────────────────────────────────
# 每个根键为世界 ID（对应 Bukkit world name），定义该世界的地图纹理与显示参数。
worlds:
  world:
    # 是否在地图菜单中显示此世界
    enabled: true
    # 显示名称
    display-name: "主世界"
    # 地图纹理文件路径（相对资源包目录）
    texture: "Map/world.png"
    # 地图图片宽度（像素）
    image-width: 2048
    # 地图图片高度（像素）
    image-height: 2048
    # 像素 X 轴偏移（用于校准地图与坐标对应关系）
    pixel-offset-x: 0
    # 像素 Z 轴偏移
    pixel-offset-z: 0
    # 全屏地图默认缩放
    default-zoom: 1.6
    # 小地图 HUD 缩放
    hud-zoom: 0.18
    # 小地图 HUD 尺寸（像素）
    hud-size: 180
  world_nether:
    # 是否在地图菜单中显示此世界
    enabled: true
    # 显示名称
    display-name: "下界"
    # 地图纹理文件路径（相对资源包目录）
    texture: "Map/world_nether.png"
    # 地图图片宽度（像素）
    image-width: 1024
    # 地图图片高度（像素）
    image-height: 1024
    # 像素 X 轴偏移
    pixel-offset-x: 0
    # 像素 Z 轴偏移
    pixel-offset-z: 0
    # 全屏地图默认缩放
    default-zoom: 1.4
    # 小地图 HUD 缩放
    hud-zoom: 0.16
    # 小地图 HUD 尺寸（像素）
    hud-size: 180

# ─── 默认解锁 ──────────────────────────────────────────
# 拥有指定权限的玩家在进服时自动解锁对应锚点列表。
default-unlocks:
  - permission: "ArcartXSuite.map.use"
    anchors:
      - "spawn"

# 锚点定义目录，路径相对模块数据目录。
# 目录下每个 *.yml 文件可包含多个锚点，根键即为锚点 ID。
# 同一个文件中可放多个锚点，不需要每个锚点单独一个文件。
anchors-directory: "anchors"

# ─── 路径点配置 ────────────────────────────────────────
waypoints:
  # 是否允许玩家创建自定义路径点
  enabled: true
  # 默认路径点样式 ID
  default-style-id: "default"
  # 路径点在客户端的 ID 前缀
  id-prefix: "AXS-map-wp-"
  # 自动命名前缀（玩家未命名时使用）
  auto-name-prefix: "标记点"
  # 默认路径点最大数量
  default-max-count: 5
  # 按权限设置不同的路径点上限
  limits:
    - permission: "ArcartXSuite.map.admin"
      max-count: 20
