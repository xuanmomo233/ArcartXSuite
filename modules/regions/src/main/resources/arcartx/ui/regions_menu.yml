# AXS 资源说明
# 用途: Regions 玩家测绘板：当前位置、权属登记、两点选区与区域详情。
# 打开方式: /axs regions menu
# 协议: AXS_REGIONS_MENU；页面与区域选择由服务端控制。
# 设计: 玩家端野外测绘记录；奶油纸底、网格绿测量线、地籍红权属印记。

ui:
  background: true
  escClose: true
  closeDied: true
  show: true
  through: false
  screenScale: true
  action:
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.boardW = var.viewW - 436
      var.currentFlagRowRefs = {}
      var.claimRowRefs = {}
      var.ownerRowRefs = {}
      var.memberRowRefs = {}
      var.detailFlagRowRefs = {}
      var.rowGeneration = 0
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.boardW = var.viewW - 436
  packetHandler:
    init: |-
      var.page = packet['page']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.currentRegion = packet['currentRegion']
      var.currentWorld = packet['currentWorld']
      var.currentPriority = packet['currentPriority']
      var.currentOwners = packet['currentOwners']
      var.currentMembers = packet['currentMembers']
      var.currentFlags = packet['currentFlags']
      var.myRegions = packet['myRegions']
      var.myRegionCount = packet['myRegionCount']
      var.selWorld = packet['selWorld']
      var.pos1Set = packet['pos1Set']
      var.pos2Set = packet['pos2Set']
      var.pos1 = packet['pos1']
      var.pos2 = packet['pos2']
      var.selComplete = packet['selComplete']
      var.selVolume = packet['selVolume']
      var.maxVolume = packet['maxVolume']
      var.regionId = packet['regionId']
      var.regionWorld = packet['regionWorld']
      var.regionPriority = packet['regionPriority']
      var.regionMin = packet['regionMin']
      var.regionMax = packet['regionMax']
      var.regionVolume = packet['regionVolume']
      var.regionParent = packet['regionParent']
      var.flags = packet['flags']
      var.owners = packet['owners']
      var.members = packet['members']
      // 将 Map 转为 List，供 VStack 行按 entryKey 整数索引访问
      var.curFlagList = []
      if(var.currentFlags != null){
        for(key in var.currentFlags.keys()){
          var.curFlagList.add(var.currentFlags[key])
        }
      }
      var.myRegionList = []
      if(var.myRegions != null){
        for(key in var.myRegions.keys()){
          var.myRegionList.add(var.myRegions[key])
        }
      }
      var.ownerList = []
      if(var.owners != null){
        for(key in var.owners.keys()){
          var.ownerList.add(var.owners[key])
        }
      }
      var.memberList = []
      if(var.members != null){
        for(key in var.members.keys()){
          var.memberList.add(var.members[key])
        }
      }
      var.detailFlagList = []
      if(var.flags != null){
        for(key in var.flags.keys()){
          var.detailFlagList.add(var.flags[key])
        }
      }
      // 行数随档案变化；保存 copy 返回值，数量不变时复用，避免固定池截断。
      var.rowGeneration = (var.rowGeneration + 1).round()
      count = var.curFlagList.length > 0 ? var.curFlagList.length : 1
      if(val.cur_flag_data.childrenCount() != count){
        for(key in var.currentFlagRowRefs.keys()){
          var.currentFlagRowRefs[key].remove()
        }
        var.currentFlagRowRefs = {}
        template = val.cur_flag_data.get(0)
        for(i in range(1, count - 1)){
          row = template.copy('标志行_' + var.rowGeneration + '_' + i.round())
          row.entryKey = i.round()
          var.currentFlagRowRefs[i.round()] = row
        }
      }
      count = var.myRegionList.length > 0 ? var.myRegionList.length : 1
      if(val.my_region_data.childrenCount() != count){
        for(key in var.claimRowRefs.keys()){
          var.claimRowRefs[key].remove()
        }
        var.claimRowRefs = {}
        template = val.my_region_data.get(0)
        for(i in range(1, count - 1)){
          row = template.copy('我的区域行_' + var.rowGeneration + '_' + i.round())
          row.entryKey = i.round()
          var.claimRowRefs[i.round()] = row
        }
      }
      count = var.ownerList.length > 0 ? var.ownerList.length : 1
      if(val.owner_data.childrenCount() != count){
        for(key in var.ownerRowRefs.keys()){
          var.ownerRowRefs[key].remove()
        }
        var.ownerRowRefs = {}
        template = val.owner_data.get(0)
        for(i in range(1, count - 1)){
          row = template.copy('所有者项目_' + var.rowGeneration + '_' + i.round())
          row.entryKey = i.round()
          var.ownerRowRefs[i.round()] = row
        }
      }
      count = var.memberList.length > 0 ? var.memberList.length : 1
      if(val.member_data.childrenCount() != count){
        for(key in var.memberRowRefs.keys()){
          var.memberRowRefs[key].remove()
        }
        var.memberRowRefs = {}
        template = val.member_data.get(0)
        for(i in range(1, count - 1)){
          row = template.copy('成员项目_' + var.rowGeneration + '_' + i.round())
          row.entryKey = i.round()
          var.memberRowRefs[i.round()] = row
        }
      }
      count = var.detailFlagList.length > 0 ? var.detailFlagList.length : 1
      if(val.detail_flag_data.childrenCount() != count){
        for(key in var.detailFlagRowRefs.keys()){
          var.detailFlagRowRefs[key].remove()
        }
        var.detailFlagRowRefs = {}
        template = val.detail_flag_data.get(0)
        for(i in range(1, count - 1)){
          row = template.copy('详情标志行_' + var.rowGeneration + '_' + i.round())
          row.entryKey = i.round()
          var.detailFlagRowRefs[i.round()] = row
        }
      }

controls:
  测绘纸底:
    type: Texture
    attribute: {point: ~stretch_all, normal: "~235,232,217,255"}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      主面板:
        type: Canvas
        attribute: {x: "-var.offX", y: 0, width: "var.viewW", height: "var.viewH"}
        children:
          标题栏:
            type: Canvas
            attribute: {x: 48, y: 28, width: "var.viewW - 96", height: 100}
            children:
              标题色标:
                type: Texture
                attribute: {x: 0, y: 8, width: 8, height: 84, normal: "~86,111,95,255", through: true}
              标题文字:
                type: Text
                attribute: {x: 28, y: 0, fontSize: 72, texts: "~&0领地测绘手册", through: true}
              标题索引:
                type: Text
                attribute: {x: 30, y: 64, fontSize: 36, texts: "~&8FIELD SURVEY / REGIONS   ·   当前位置、权属与两点测量", through: true}
              玩家页标记:
                type: Text
                attribute: {point: ~top_right, x: -228, y: 16, fontSize: 36, texts: "var.page == 'selection' ? '&2测量中 / FIELD' : '&2权属查询 / FIELD'", through: true}
              关闭按钮:
                type: Canvas
                attribute: {point: ~top_right, x: 0, y: 10, width: 180, height: 60}
                action:
                  click: Screen.close()
                children:
                  关闭底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "~220,223,205,255", hover: "~208,215,194,255", through: true}
                  关闭字:
                    type: Text
                    attribute: {point: ~middle_center, fontSize: 36, texts: "~&0关闭 / ESC", through: true}
          标题基线:
            type: Texture
            attribute: {x: 48, y: 134, width: "var.viewW - 96", height: 2, normal: "~86,111,95,255", through: true}
          导航栏:
            type: Canvas
            attribute: {x: 48, y: 152, width: 268, height: "var.viewH - 188"}
            children:
              导航纸底:
                type: Texture
                attribute: {point: ~stretch_all, normal: "~223,227,209,255", through: true}
              导航册脊:
                type: Texture
                attribute: {x: 0, y: 0, width: 6, height: "var.viewH - 188", normal: "~86,111,95,255", through: true}
              导航索引:
                type: Text
                attribute: {x: 18, y: 20, fontSize: 36, texts: "~&2B / 野外笔记", through: true}
              导航当前区域入口:
                type: Canvas
                attribute: {x: 18, y: 76, width: 232, height: 72}
                action:
                  click: |-
                    Packet.send(var.packetId, 'navigate', 'current')
                children:
                  导航当前区域背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "var.page == 'current' ? '52,80,64,255' : '238,240,224,255'", hover: "var.page == 'current' ? '70,104,80,255' : '198,214,190,255'", through: true}
                  导航当前区域文字:
                    type: Text
                    attribute: {point: ~middle_left, x: 16, fontSize: 36, texts: "var.page == 'current' ? '&f01  当前位置' : '&001  当前位置'", through: true}
              导航我的区域入口:
                type: Canvas
                attribute: {x: 18, y: 162, width: 232, height: 72}
                action:
                  click: |-
                    Packet.send(var.packetId, 'navigate', 'my')
                children:
                  导航我的区域背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "(var.page == 'my' || var.page == 'detail') ? '52,80,64,255' : '238,240,224,255'", hover: "(var.page == 'my' || var.page == 'detail') ? '70,104,80,255' : '198,214,190,255'", through: true}
                  导航我的区域文字:
                    type: Text
                    attribute: {point: ~middle_left, x: 16, fontSize: 36, texts: "(var.page == 'my' || var.page == 'detail') ? '&f02  我的领地' : '&002  我的领地'", through: true}
              导航选区入口:
                type: Canvas
                attribute: {x: 18, y: 248, width: 232, height: 72}
                action:
                  click: |-
                    Packet.send(var.packetId, 'navigate', 'selection')
                children:
                  导航选区背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "var.page == 'selection' ? '52,80,64,255' : '238,240,224,255'", hover: "var.page == 'selection' ? '70,104,80,255' : '198,214,190,255'", through: true}
                  导航选区文字:
                    type: Text
                    attribute: {point: ~middle_left, x: 16, fontSize: 36, texts: "var.page == 'selection' ? '&f03  两点测量' : '&003  两点测量'", through: true}
              目录说明:
                type: Text
                attribute:
                  x: 18
                  y: 362
                  fontSize: 36
                  texts: ["~&2查询顺序 / 01—03", "~&0确认当前位置", "~&0翻阅权属档案", "~&0记录两点测量"]
                  through: true
              导航分线:
                type: Texture
                attribute: {x: 18, y: 530, width: 232, height: 2, normal: "~151,169,142,255", through: true}
              坐标图例:
                type: Text
                attribute:
                  x: 18
                  y: 554
                  fontSize: 36
                  texts: ["~&4P1 / 左键起点", "~&2P2 / 右键终点", "~&8坐标顺序 X · Y · Z", "~&8使用木斧选点"]
                  through: true
              玩家标记:
                type: Text
                attribute: {point: ~bottom_left, x: 18, y: -22, fontSize: 36, texts: "~&8FIELD NOTES / 查询", through: true}
          内容区:
            type: Canvas
            attribute: {x: 340, y: 152, width: "var.viewW - 388", height: "var.viewH - 188"}
            children:
              内容纸底:
                type: Texture
                attribute: {point: ~stretch_all, normal: "~247,244,232,255", through: true}
              纸张左刻度:
                type: Texture
                attribute: {x: 12, y: 24, width: 2, height: "var.viewH - 236", normal: "~204,211,192,255", through: true}
              纸张右刻度:
                type: Texture
                attribute: {point: ~top_right, x: -12, y: 24, width: 2, height: "var.viewH - 236", normal: "~204,211,192,255", through: true}
              当前区域布局:
                type: Canvas
                attribute: {x: 24, y: 24, width: "var.boardW", height: "var.viewH - 236", visible: "var.page == 'current'"}
                children:
                  当前区域标题:
                    type: Text
                    attribute: {x: 0, y: 0, fontSize: 54, texts: "~&0当前位置 / 区域快照", through: true}
                  当前卷号:
                    type: Text
                    attribute: {point: ~top_right, x: -16, y: 8, fontSize: 36, texts: "~&2B—01  /  现场查询", through: true}
                  当前说明:
                    type: Text
                    attribute: {x: 0, y: 54, fontSize: 36, texts: "~&8当前位置的有效保护宗地  /  有重叠时显示最高优先级；规则只显示已设置项。", through: true}
                  当前分规:
                    type: Texture
                    attribute: {x: 0, y: 98, width: "var.boardW", height: 2, normal: "~189,202,179,255", through: true}
                  当前地块卡:
                    type: Canvas
                    attribute: {x: 0, y: 112, width: 450, height: "var.viewH - 388"}
                    children:
                      当前卡底:
                        type: Texture
                        attribute: {point: ~stretch_all, normal: "~224,232,211,255", through: true}
                      当前卡左刻度:
                        type: Texture
                        attribute: {x: 0, y: 0, width: 5, height: "var.viewH - 388", normal: "~86,111,95,255", through: true}
                      当前卡红线:
                        type: Texture
                        attribute: {x: 24, y: 24, width: 54, height: 4, normal: "~153,66,54,255", through: true}
                      当前卡编号:
                        type: Text
                        attribute: {x: 24, y: 44, fontSize: 36, texts: "~&2有效宗地 / PARCEL", through: true}
                      当前区域名称文字:
                        type: Text
                        attribute: {x: 24, y: 88, fontSize: 54, texts: "(var.currentRegion != none && var.currentRegion != '') ? '&0' + var.currentRegion : '&8荒野 / 无区域'", limit: 402, through: true}
                      当前区域世界文字:
                        type: Text
                        attribute: {x: 24, y: 174, fontSize: 36, texts: "~&8世界 / &0{var.currentWorld}", limit: 402, through: true}
                      当前区域优先级文字:
                        type: Text
                        attribute: {x: 24, y: 224, fontSize: 36, texts: "~&8优先级 / &0{var.currentPriority}", through: true}
                      当前权属分线:
                        type: Texture
                        attribute: {x: 24, y: 284, width: 402, height: 2, normal: "~151,169,142,255", through: true}
                      当前区域成员文字:
                        type: Text
                        attribute: {x: 24, y: 312, fontSize: 36, texts: "~&8所有者 &0{var.currentOwners} 人   &8成员 &0{var.currentMembers} 人", limit: 402, through: true}
                      当前卡提示:
                        type: Text
                        attribute:
                          x: 24
                          y: 392
                          fontSize: 36
                          texts: ["~&8当前位置没有边界坐标？", "~&8打开「我的领地」选择区域", "~&8即可查看完整边界与权属。"]
                          through: true
                      荒野说明:
                        type: Text
                        attribute: {x: 24, y: 540, fontSize: 36, texts: "~&8此处没有已登记区域。", visible: "var.currentRegion == ''", through: true}
                  当前标志文字:
                    type: Text
                    attribute: {x: 480, y: 112, fontSize: 48, texts: "~&0区域规则   &8{var.curFlagList.length.round()} 项 / 只读", through: true}
                  当前标志滑轨:
                    type: Texture
                    attribute: {x: "var.boardW - 12", y: 172, width: 12, height: "var.viewH - 448", normal: "~213,222,202,255", through: true}
                  当前标志滑块:
                    type: Texture
                    val: 当前标志滑块
                    attribute: {x: "var.boardW - 12", y: 172, width: 12, height: 88, maxDragY: "var.viewH - 536", normal: "~86,111,95,255", hover: "~153,66,54,255"}
                  当前标志滚动栏:
                    type: Scroll
                    attribute: {x: 480, y: 172, width: "var.boardW - 508", height: "var.viewH - 448", moveY: "self.parent['当前标志滑块'].getDragYRatio()"}
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['当前标志滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['当前标志滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      cur_flags_list:
                        val: cur_flag_data
                        type: VStack
                        attribute: {width: "var.boardW - 508", spaceBetween: 8}
                        children:
                          标志行:
                            type: Canvas
                            attribute: {entryKey: 0.round(), entry: "var.curFlagList.get(self.entryKey)", visible: self.entry != none, width: "var.boardW - 508", height: 110}
                            children:
                              标志行底:
                                type: Texture
                                attribute: {point: ~stretch_all, normal: "~235,236,221,255", through: true}
                              标志状态线:
                                type: Texture
                                attribute: {x: 0, y: 0, width: 4, height: 110, normal: "~177,183,168,255", through: true}
                              标志允许线:
                                type: Texture
                                attribute: {x: 0, y: 0, width: 4, height: 110, normal: "~86,111,95,255", visible: "self.parent.entry['state'] == 'allow'", through: true}
                              标志拒绝线:
                                type: Texture
                                attribute: {x: 0, y: 0, width: 4, height: 110, normal: "~153,66,54,255", visible: "self.parent.entry['state'] == 'deny'", through: true}
                              标志名称文字:
                                type: Text
                                attribute: {x: 18, y: 14, fontSize: 36, texts: "~&0{self.parent.entry['name']}", limit: "self.parent.width - 160", through: true}
                              标志描述文字:
                                type: Text
                                attribute: {x: 18, y: 60, fontSize: 36, texts: "~&8{self.parent.entry['desc']}", limit: "self.parent.width - 160", through: true}
                              标志状态文字:
                                type: Text
                                attribute: {point: ~middle_right, x: -18, fontSize: 36, texts: "~&8未设置", visible: "self.parent.entry['state'] != 'allow' && self.parent.entry['state'] != 'deny'", through: true}
                              标志允许状态:
                                type: Text
                                attribute: {point: ~middle_right, x: -18, fontSize: 36, texts: "~&2允许", visible: "self.parent.entry['state'] == 'allow'", through: true}
                              标志拒绝状态:
                                type: Text
                                attribute: {point: ~middle_right, x: -18, fontSize: 36, texts: "~&4拒绝", visible: "self.parent.entry['state'] == 'deny'", through: true}
                  当前规则空状态:
                    type: Text
                    attribute: {x: 504, y: 218, fontSize: 36, texts: "~&8没有已设置的区域标志；这不等于全部允许。", visible: "var.curFlagList.length == 0", through: true}
                  当前页脚:
                    type: Text
                    attribute: {point: ~bottom_left, x: 0, y: -4, fontSize: 36, texts: "~&2允许   &4拒绝   &8未设置 / 以服务端保护判定为准   |   滚轮或拖动滑条", through: true}
              我的区域布局:
                type: Canvas
                attribute: {x: 24, y: 24, width: "var.boardW", height: "var.viewH - 236", visible: "var.page == 'my'"}
                children:
                  我的区域标题:
                    type: Text
                    attribute: {x: 0, y: 0, fontSize: 54, texts: "~&0我的领地 / 权属登记", through: true}
                  权属卷号:
                    type: Text
                    attribute: {point: ~top_right, x: -16, y: 8, fontSize: 36, texts: "~&2B—02  /  {var.myRegionCount} 宗权属", through: true}
                  我的区域说明:
                    type: Text
                    attribute: {x: 0, y: 56, fontSize: 36, texts: "~&8你的区域索引  /  红标代表所有者，绿标代表成员；点击宗地可核对界址。", through: true}
                  权属表头底:
                    type: Texture
                    attribute: {x: 0, y: 116, width: "var.boardW - 28", height: 44, normal: "~219,225,205,255", through: true}
                  权属表头:
                    type: Text
                    attribute: {x: 20, y: 124, fontSize: 36, texts: "~&8区域编号 / 所在世界", through: true}
                  身份表头:
                    type: Text
                    attribute: {x: "var.boardW - 330", y: 124, fontSize: 36, texts: "~&8你的身份 / 查看", through: true}
                  我的区域滑轨:
                    type: Texture
                    attribute: {x: "var.boardW - 12", y: 176, width: 12, height: "var.viewH - 452", normal: "~213,222,202,255", through: true}
                  我的区域滑块:
                    type: Texture
                    val: 我的区域滑块
                    attribute: {x: "var.boardW - 12", y: 176, width: 12, height: 88, maxDragY: "var.viewH - 540", normal: "~86,111,95,255", hover: "~153,66,54,255"}
                  我的区域滚动栏:
                    type: Scroll
                    attribute: {x: 0, y: 176, width: "var.boardW - 28", height: "var.viewH - 452", moveY: "self.parent['我的区域滑块'].getDragYRatio()"}
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['我的区域滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['我的区域滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      my_list:
                        val: my_region_data
                        type: VStack
                        attribute: {width: "var.boardW - 28", spaceBetween: 12}
                        children:
                          我的区域行:
                            type: Canvas
                            attribute: {entryKey: 0.round(), entry: "var.myRegionList.get(self.entryKey)", visible: self.entry != none, width: "var.boardW - 28", height: 114}
                            action:
                              click: |-
                                Packet.send(var.packetId, 'select_region', self.entry['id'])
                            children:
