# Chemdah 会话：旅行商人·老陈（绑定 Adyeshach npcId = "merchant"）
# 部署：复制到 plugins/Chemdah/conversation/sk_merchant.yml

sk_merchant:
  npc id: 'adyeshach merchant'
  npc:
    - '&6客人，随便看看。'
    - '&7台座上的货都标着价——金币够，右键就能拿走。'
  format: generic
  player:
    - reply: '都有什么货？'
      then: |
        talk "&6[老陈] &f金块台座卖治疗（8金），红石台座卖两分钟力量（12金），"
        talk "&f钻石台座卖金苹果（15金）。钱不够就去多杀几只。"
    - reply: '便宜点行不行？'
      then: |
        talk "&6[老陈] &f深渊里的买卖，就是这个价。"
    - reply: '走了。'
      then: |
        talk "&6[老陈] &f慢走，别死在下面。"
