# 配置版本号（不要手动修改，由模块自动管理）
config-version: 1
# AXS Prop
# 作用: 管理快捷道具定义、玩家绑定、按键触发、冷却、消耗、提示文案和临时属性效果。
# 依赖: ArcartX；AttributePlus、MythicLib、MMOItems 按功能选用。
# 重载: /axs prop reload
# PAPI 输出: 无独立 PlaceholderAPI 输出。
# 可解析的 PAPI: 无；道具效果主要通过权限、物品、命令、属性和内部上下文执行。
# 关联资源: prop/key.yml、prop/language.yml、prop/props/*.yml

settings:
  # 是否输出调试日志
  debug: false

mythiclib:
  # 临时属性 modifier 前缀。
  # 是否生效由本体 config.yml 的 attribute-bridges.mythiclib 统一管理。
  # 最终会生成:
  #   <前缀>_<PROP_ID>_<STAT>
  source-prefix: "AXS_PROP"

auto-trigger:
  # 自动触发总开关。开启后服务端按固定间隔轮询在线玩家的快捷槽，
  # 对配置了 auto.enabled 且满足 auto.conditions 的道具自动执行使用流程。
  enabled: false
  # 全局轮询间隔（tick，20 = 1 秒）。
  # 单个道具可用 auto.interval 覆盖，但实际检查粒度不会比该值更细。
  interval: 20
  # 同一轮多个槽位道具同时满足触发条件时的处理模式:
  #   all   -> 全部尝试触发（各自受自己的冷却组限制）
  #   first -> 按槽位顺序，第一个成功触发后停止本轮
  mode: "all"
