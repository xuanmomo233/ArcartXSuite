ui:
  isHud: false
  defaultOpen: false
  show: true
  background: false
  through: false
  escClose: true
  closeDied: true
  screenScale: true
  level: 7
  hide:
    - "hotbar"
    - "experience_bar"
    - "crosshair"
    - "item_name"
    - "jump_bar"
    - "mount_health"
    - "player_state"
    - "player_health"
    - "armor_level"
    - "food_level"
    - "air_level"
  packetHandler:
    region: |-
      var.page = packet['view']
      var.title = packet['title']
      var.subtitle = packet['subtitle']
      var.regionId = packet['id']
      var.viewRows = packet['rows']
      var.viewPage = packet['page']
      var.viewPages = packet['pages']
    owned: |-
      var.page = 'owned'
      var.viewRows = packet['rows']
      var.viewPage = packet['page']
      var.viewPages = packet['pages']
    selection: |-
      var.page = 'selection'
      var.token = packet['token']
      var.world = packet['world']
      var.first = packet['first']
      var.second = packet['second']
      var.volume = packet['volume']
      var.limit = packet['limit']
  action:
    load: |-
      var.packetId = 'AXS_REGIONS_MENU'
      var.page = 'current'
      var.title = ''
      var.subtitle = ''
      var.regionId = ''
      var.token = ''
      var.world = ''
      var.first = ''
      var.second = ''
      var.volume = 0
      var.limit = 0
      var.viewRows = []
      var.viewPage = 0
      var.viewPages = 1
