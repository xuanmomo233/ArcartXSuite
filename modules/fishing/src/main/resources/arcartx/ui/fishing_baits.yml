# Lakeside field guide / 06 · Tackle preparation, queue first then inventory.
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    init: |-
      var.queueIconJsons = {}
      var.selectedInvSlot = none
      var.selectedQueueSlot = none
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.baitSlots = packet['baitSlots']
      var.baitSlotsBase = packet['baitSlotsBase']
      var.baitSlotsBonus = packet['baitSlotsBonus']
      var.queue = packet['queue']
      var.baits = packet['baits']
      if(var.queue != none){
        for(key in var.queue.keys()){
          json = packet['queueIconJson' + key]
          var.queueIconJsons[key] = (json != none && json != '') ? json : var.emptyItemJson
        }
      }
      for(key in var.queueRefs.keys()){
        var.queueRefs[key].remove()
      }
      var.queueRefs = {}
      var.queueGeneration = (var.queueGeneration + 1).round()
      for(i in range(1, var.baitSlots - 1)){
        key = i.round()
        e = val.饵料队列.get(0).copy('队列槽_' + var.queueGeneration + '_' + key)
        e.entryKey = key
        var.queueRefs[key] = e
      }
      var.iconDelay = 2
      var.selectedInvSlot = none
      var.selectedQueueSlot = none
  action:
    load: |-
      var.baitSlotsBase = 0
      var.baitSlots = 0
      var.baitSlotsBonus = 0
      var.packetId = 'AXS_FISHING_BAITS'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.queueRefs = {}
      var.queueGeneration = 0
      var.iconDelay = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send(var.packetId, 'refresh_baits')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    tick: |-
      if(var.iconDelay > 0){
        var.iconDelay = var.iconDelay - 1
        if(var.iconDelay == 0){
          val.饵料队列.get(0)['队列槽图标'].seticon()
          for(key in var.queueRefs.keys()){
            var.queueRefs[key]['队列槽图标'].seticon()
          }
        }
      }
controls:
  全屏玻璃底: {type: Texture, attribute: {point: ~stretch_all, normal: '~Frosted:18;20,43,52,170'}}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶栏:
        type: Canvas
        attribute: {x: '-var.offX', width: 'var.viewW', height: 96}
        children:
          顶栏底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,250'}}
          标题: {type: Text, attribute: {point: ~middle_left, x: 48, texts: '~&f湖畔手册', fontSize: 54}}
          页名: {type: Text, attribute: {point: ~middle_left, x: 340, texts: '~&7钓鱼 / &f行前饵料', fontSize: 36}}
          关闭按钮:
            type: Canvas
            attribute: {point: ~middle_right, x: -40, width: 112, height: 52}
            action: {clickLeft: 'Screen.close()'}
            children:
              关闭背景: {type: Texture, attribute: {point: ~stretch_all, normal: '~48,75,83,255', hover: '~73,107,106,255', shape: ~round_rect, radius: 12, through: true}}
              关闭文字: {type: Text, attribute: {point: ~middle_center, texts: '~&f关闭', fontSize: 36, through: true}}
      左侧导航:
        type: Canvas
        attribute: {x: '48 - var.offX', y: 120, width: 300, height: 'var.viewH - 144'}
        children:
          导航底: {type: Texture, attribute: {point: ~stretch_all, normal: '~231,222,196,250', shape: ~round_rect, radius: 18}}
          索引标题: {type: Text, attribute: {x: 24, y: 24, texts: '~&8FIELD GUIDE / 目录', fontSize: 36}}
          导航总览:
            type: Canvas
            attribute: {x: 16, y: 88, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_main')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f01  垂钓日志', fontSize: 36, through: true}}
          导航图鉴:
            type: Canvas
            attribute: {x: 16, y: 162, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_collection')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f02  鱼种图鉴', fontSize: 36, through: true}}
          导航奖励:
            type: Canvas
            attribute: {x: 16, y: 236, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_rewards')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f03  成长奖励', fontSize: 36, through: true}}
          导航天赋:
            type: Canvas
            attribute: {x: 16, y: 310, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_talents')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f04  技艺网络', fontSize: 36, through: true}}
          导航任务:
            type: Canvas
            attribute: {x: 16, y: 384, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_tasks')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f05  湖畔委托', fontSize: 36, through: true}}
          导航饵料:
            type: Canvas
            attribute: {x: 16, y: 458, width: 268, height: 62}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~157,190,169,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&006  行前饵料', fontSize: 36, through: true}}
          操作手记: {type: Text, attribute: {x: 24, y: 574, texts: ['~&8先选背包中的饵料', '~&8再点队列槽放入', '~&8左键 1 个 / 右键全部', '~&8队列左侧优先消耗'], fontSize: 36}}
          刷新按钮:
            type: Canvas
            attribute: {point: ~bottom_left, x: 16, y: -20, width: 268, height: 56}
            action: {clickLeft: "Packet.send(var.packetId, 'refresh_baits')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,255', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_center, texts: '~&f刷新饵料', fontSize: 36, through: true}}
      内容区:
        type: Canvas
        attribute: {x: '372 - var.offX', y: 120, width: 'var.contentW', height: 'var.viewH - 144'}
        children:
          内容底: {type: Texture, attribute: {point: ~stretch_all, normal: '~191,209,191,248', shape: ~round_rect, radius: 18}}
          页标题: {type: Text, attribute: {x: 32, y: 24, texts: '~&0行前饵料', fontSize: 64}}
          动态提示: {type: Text, attribute: {x: 32, y: 110, texts: "var.selectedInvSlot != none ? '&0已选背包饵料：点击队列放入；再次点击背包取消' : '&8先选择背包饵料，或左键队列取出饵料'", fontSize: 36}}
          交换提示: {type: Text, attribute: {x: 32, y: 158, texts: "var.selectedQueueSlot != none ? '&0已选队列槽：右键另一槽交换顺序' : '&8调整顺序：依次右键两个队列槽'", fontSize: 36}}
          饵料队列区:
            type: Canvas
            attribute: {x: 32, y: 216, width: 'var.contentW - 64', height: 240}
            children:
              队列区底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,255', shape: ~round_rect, radius: 16}}
              队列标题: {type: Text, attribute: {x: 24, y: 24, texts: '~&f01 / 装配队列', fontSize: 48}}
              队列说明: {type: Text, attribute: {point: ~top_right, x: -24, y: 34, texts: "'&7基础 ' + var.baitSlotsBase.round() + ' + 天赋 ' + var.baitSlotsBonus.round() + ' = ' + var.baitSlots.round() + ' 槽 · 左侧优先'", fontSize: 36}}
              队列滑轨: {type: Texture, attribute: {x: 24, y: 218, width: 'var.contentW - 112', height: 8, normal: '~53,76,85,255', shape: ~round_rect, radius: 4}}
              队列滑块:
                type: Texture
                val: 队列滑块
                attribute: {x: 24, y: 218, width: 100, height: 8, maxDragX: 'var.contentW - 212', normal: '~157,190,169,255', shape: ~round_rect, radius: 4}
              队列滚动区:
                type: Scroll
                attribute: {x: 24, y: 94, width: 'var.contentW - 112', height: 112, moveX: 'val.队列滑块.getDragXRatio()'}
                action:
                  wheel: |-
                    val.队列滑块.setDragXRatio(math.max(0, math.min(1, self.moveX - self.wheelValue * 0.1)))
                children:
                  饵料队列:
                    type: HStack
                    val: 饵料队列
                    attribute: {height: 112, spaceBetween: 16}
                    children:
                      队列槽:
                        type: Canvas
                        attribute: {entryKey: 0.round(), queueEntry: 'var.queue[self.entryKey]', visible: 'var.baitSlots > 0', width: 104, height: 108}
                        action:
                          clickLeft: |-
                            if(var.selectedInvSlot != none){
                              Packet.send(var.packetId, 'put_bait', var.actionToken, var.selectedInvSlot, self.entryKey, 1.round())
                            } else {
                              var.selectedQueueSlot = none
                              if(self.queueEntry != none){
                                Packet.send(var.packetId, 'take_bait', var.actionToken, self.entryKey, 0.round())
                              }
                            }
                          clickRight: |-
                            if(var.selectedInvSlot != none){
                              Packet.send(var.packetId, 'put_bait', var.actionToken, var.selectedInvSlot, self.entryKey, (-1).round())
                            } else {
                              if(var.selectedQueueSlot == self.entryKey){
                                var.selectedQueueSlot = none
                              } else {
                                if(var.selectedQueueSlot != none){
                                  Packet.send(var.packetId, 'swap_bait', var.actionToken, var.selectedQueueSlot, self.entryKey)
                                  var.selectedQueueSlot = none
                                } else {
                                  var.selectedQueueSlot = self.entryKey
                                }
                              }
                            }
                        children:
                          队列槽背景:
                            type: Texture
                            attribute: {point: ~stretch_all, normal: "self.parent.entryKey == var.selectedQueueSlot ? '23,49,64,255' : '53,89,96,255'", shape: ~round_rect, radius: 12, through: true}
                            effect: {stroke: {width: 2, color: "self.parent.entryKey == var.selectedQueueSlot ? '231,222,196,255' : '157,190,169,255'"}}
                          队列槽图标:
                            type: Slot
                            attribute: {x: 12, y: 8, width: 80, height: 64, slotType: ~Icon, itemScale: 0.8, normal: '~0,0,0,0', through: true, seticon: "self.setItemIcon(var.queueIconJsons[self.parent.entryKey] != none ? var.queueIconJsons[self.parent.entryKey] : var.emptyItemJson)"}
                          队列槽数量: {type: Text, attribute: {point: ~bottom_right, x: -8, y: -8, texts: "self.parent.queueEntry != none ? '&f' + self.parent.queueEntry['amount'].round() : none", fontSize: 36, through: true}}
                          队列槽序号: {type: Text, attribute: {point: ~bottom_left, x: 8, y: -8, texts: "'&7' + (self.parent.entryKey + 1).round()", fontSize: 36, through: true}}
                          队列槽空标: {type: Text, attribute: {point: ~middle_center, y: -8, texts: "self.parent.queueEntry == none ? '&7空' : none", fontSize: 36, through: true}}
              队列空状态: {type: Text, attribute: {point: ~middle_center, texts: '~&7当前鱼竿没有饵料槽位', fontSize: 36, visible: 'var.baitSlots == 0'}}
          背包区:
            type: Canvas
            attribute: {x: 32, y: 480, width: 'var.contentW - 64', height: 'var.viewH - 648'}
            children:
              背包区底: {type: Texture, attribute: {point: ~stretch_all, normal: '~231,222,196,255', shape: ~round_rect, radius: 16}}
              背包标题: {type: Text, attribute: {x: 24, y: 24, texts: '~&002 / 选择背包饵料', fontSize: 48}}
              背包说明: {type: Text, attribute: {point: ~top_right, x: -24, y: 34, texts: '~&8左键选择 / 再点取消', fontSize: 36}}
              背包网格:
                type: HGrid
                val: 背包网格
                attribute: {point: ~top_center, y: 96, width: 864, height: 324, column: 9, spaceBetweenX: 12, spaceBetweenY: 12}
                action:
                  create: |-
                    for(i in range(1, 35)){
                      slot = self['背包槽'].copy('背包槽' + i.round())
                      slot.entryKey = (9 + i).round()
                      slot.id = (9 + i).round()
                    }
                children:
                  背包槽:
                    type: Slot
                    attribute: {id: 9, entryKey: 9.round(), slotType: ~Backpack, itemScale: 0.72, lock: true, width: 84, height: 72, normal: "(self.entryKey == var.selectedInvSlot && self.getSlotItemStack() != none && self.getSlotItemStack().getCount() > 0) ? '157,190,169,255' : '23,49,64,255'", shape: ~round_rect, radius: 10}
                    action:
                      clickLeft: |-
                        item = self.getSlotItemStack()
                        if(item != none && item.getType() != 'null' && item.getCount() > 0){
                          if(var.selectedInvSlot == self.entryKey){
                            var.selectedInvSlot = none
                          } else {
                            var.selectedInvSlot = self.entryKey
                          }
                        } else {
                          var.selectedInvSlot = none
                        }
                    effect: {stroke: {width: 2, color: "self.isHovered() ? '99,141,142,255' : '191,209,191,255'"}}
