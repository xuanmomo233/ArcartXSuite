                          itemScale: 0.8
                          x: 12
                          y: 12
                          width: 48
                          height: 48
                          through: true
                          normal: ~35,40,36,220
                          shape: ~round_rect
                          radius: 8
                          seticon: self.setItemIcon(var.shopIconJsons[self.parent.entryKey])
                      商店名称:
                        type: Text
                        attribute:
                          x: 72
                          y: 24
                          texts: '''&f'' + var.shopTexts[self.parent.entryKey]'
                          fontSize: 36
                          through: true
                          limit: 12
                    action:
                      clickLeft: |-
                        if(self.entry != none && !var.actionBusy){
                          Packet.send(var.packetId, 'shop_list', self.entry['id'])
                        }
          空态:
