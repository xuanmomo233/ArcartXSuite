    attribute:
      enable: "var.rebuildPhase == 0"
      visible: "var.actionToken != ''"
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ═══ 顶栏 ═══
      顶栏底:
        type: Texture
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 108
          normal: ~15,17,18,250
          through: true
      返回钮:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 27
          width: 150
          height: 52
        action:
          clickLeft: "Packet.send(var.packetId, 'design_back', var.actionToken)"
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~48,54,52,245
              shape: ~round_rect
              radius: 9
              through: true
            effect:
              stroke:
                width: 1
                color: "self.parent.isHovered() ? '255,255,255,200' : '255,255,255,60'"
          字:
            type: Text
            attribute:
              point: ~middle_center
              texts: ~&f‹  路线图
              fontSize: 32
              through: true
      标题:
        type: Text
        attribute:
          point: ~top_left
          x: "224 - var.offX"
          y: 14
          texts: "'&6对象校准  &7/  ' + var.icon + ' &f' + var.objId"
          fontSize: 48
          limit: 30
          through: true
      摘要:
        type: Text
        attribute:
          point: ~top_left
          x: "226 - var.offX"
          y: 72
