                attribute:
                  point: ~middle_left
                  x: 20
                  width: 800
                  texts: "'&f天赋树 &7| &a可用: &f' + var.unspentTalentPoints.round() + ' &7/ &f' + var.talentPoints.round() + '  &7| &f等级: &e' + var.playerLevel.round() + '  &7| &b缩放: &f' + (var.zoomScale * 100).round() + '% &7[&fR重置&7]'"
                  fontSize: 26
              重置按钮:
                type: Canvas
                attribute:
                  point: ~middle_right
                  x: -12
                  width: 120
                  height: 34
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'reset_talents')
                children:
                  重置按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~80,30,30,200
                      hover: ~180,50,50,230
                      shape: ~round_rect
                      radius: 8
                    effect:
                      stroke:
                        width: 2
                        color: ~200,80,80,160
                  重置按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 120
                      texts: "~&f↻ 重置"
                      fontSize: 30
                      through: true

          # 滚动区：五系与联动节点常驻显示（拖拽滚动 + 滚轮缩放）
          滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 76
              width: "var.contentW - 48"
              height: "var.viewH - 236"
              moveX: "self.parent['横向滑块'].getDragXRatio()"
              moveY: "self.parent['竖向滑块'].getDragYRatio()"
            action:
              clickLeft: |-
                var.isDragging = true
                var.dragStartMX = Mouse.x()
                var.dragStartMY = Mouse.y()
                var.dragStartSX = val.横向滑块.getDragXRatio()
                var.dragStartSY = val.竖向滑块.getDragYRatio()
                var.dragMoved = false
              releaseLeft: |-
                var.isDragging = false
              wheel: |-
                // 滚轮缩放：wheelValue > 0 放大，< 0 缩小
                oldZoom = var.zoomScale
                delta = self.wheelValue > 0 ? 0.1 : -0.1
                newZoom = oldZoom + delta
                if(newZoom < 0.5){ newZoom = 0.5 }
                if(newZoom > 2.0){ newZoom = 2.0 }
                if(newZoom != oldZoom){
                  // 保持滚动位置：通过滑块 ratio 换算
                  viewW = var.contentW - 48
                  viewH = var.viewH - 236
                  oldRangeX = var.canvasW * oldZoom - viewW
                  newRangeX = var.canvasW * newZoom - viewW
                  oldRangeY = var.canvasH * oldZoom - viewH
                  newRangeY = var.canvasH * newZoom - viewH
                  oldSX = val.横向滑块.getDragXRatio()
                  oldSY = val.竖向滑块.getDragYRatio()
                  if(newRangeX > 0){
                    newSX = oldRangeX > 0 ? oldSX * oldRangeX / newRangeX : 0
                    if(newSX < 0){ newSX = 0 }
                    if(newSX > 1){ newSX = 1 }
                  } else {
                    newSX = 0
                  }
                  if(newRangeY > 0){
                    newSY = oldRangeY > 0 ? oldSY * oldRangeY / newRangeY : 0
                    if(newSY < 0){ newSY = 0 }
                    if(newSY > 1){ newSY = 1 }
                  } else {
                    newSY = 0
                  }
                  var.zoomScale = newZoom
                  var.needRebuild = true
                  // 重建后设置滑块位置
                  val.横向滑块.setDragXRatio(newSX)
                  val.竖向滑块.setDragYRatio(newSY)
                }
            children:
              树画布:
                val: 树画布
                type: Canvas
                attribute:
                  width: "var.canvasW * var.zoomScale"
                  height: "var.canvasH * var.zoomScale"
                children:
                  # 树标题模板
                  树标题模板:
                    type: Canvas
                    val: 树标题模板
                    attribute:
                      width: "(200 * var.zoomScale).round()"
                      height: "(40 * var.zoomScale).round()"
                      treeId: 'steady'
                      visible: false
                    children:
                      树标题文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: "(200 * var.zoomScale).round()"
                          texts: "var.treeNames[self.parent.treeId] != none ? var.treeNames[self.parent.treeId] : '&7未知'"
                          fontSize: "(34 * var.zoomScale).round()"
                          through: true
                  # 天赋节点模板（正方形 Slot + 连线 + Tooltip）
                  # tick 中 copy 后设置 entryKey/treeId/treeX/isLink
                  天赋节点模板:
                    type: Canvas
                    val: 天赋节点模板
                    attribute:
                      point: ~top_left
                      entryKey: 0.round()
                      treeId: 'steady'
                      isLink: false
                      entry: "self.isLink == true ? var.links[self.entryKey] : (var.trees[self.treeId] != none ? var.trees[self.treeId]['nodes'][self.entryKey] : none)"
                      visible: "self.entry != none"
                      width: "var.nodeSize * var.zoomScale"
                      height: "var.nodeSize * var.zoomScale"
                      brightColor: "self.treeId == 'steady' ? '72,238,112,255' : (self.treeId == 'swift' ? '48,208,248,255' : (self.treeId == 'pressure' ? '248,70,70,255' : (self.treeId == 'focus' ? '212,86,248,255' : (self.treeId == 'lucky' ? '252,198,42,255' : (self.treeId == 'endure' ? '255,165,0,255' : '255,128,42,255')))))"
                      dimColor: "self.treeId == 'steady' ? '48,156,82,255' : (self.treeId == 'swift' ? '34,138,170,255' : (self.treeId == 'pressure' ? '172,48,48,255' : (self.treeId == 'focus' ? '144,54,180,255' : (self.treeId == 'lucky' ? '180,138,30,255' : (self.treeId == 'endure' ? '180,110,20,255' : '190,76,30,255')))))"
                      lineColor: "self.entry != none && self.entry['unlocked'] == true ? self.brightColor : self.dimColor"
                      linkTree1: 'steady'
                      linkTree2: 'steady'
                      linkBright1: "self.linkTree1 == 'steady' ? '82,255,128,255' : (self.linkTree1 == 'swift' ? '60,220,255,255' : (self.linkTree1 == 'pressure' ? '255,78,78,255' : (self.linkTree1 == 'focus' ? '218,95,255,255' : (self.linkTree1 == 'lucky' ? '255,210,55,255' : '255,180,60,255'))))"
                      linkBright2: "self.linkTree2 == 'steady' ? '82,255,128,255' : (self.linkTree2 == 'swift' ? '60,220,255,255' : (self.linkTree2 == 'pressure' ? '255,78,78,255' : (self.linkTree2 == 'focus' ? '218,95,255,255' : (self.linkTree2 == 'lucky' ? '255,210,55,255' : '255,180,60,255'))))"
                      linkDim1: "self.linkTree1 == 'steady' ? '48,165,82,255' : (self.linkTree1 == 'swift' ? '38,145,178,255' : (self.linkTree1 == 'pressure' ? '178,48,48,255' : (self.linkTree1 == 'focus' ? '142,58,178,255' : (self.linkTree1 == 'lucky' ? '184,142,34,255' : '180,120,30,255'))))"
                      linkDim2: "self.linkTree2 == 'steady' ? '48,165,82,255' : (self.linkTree2 == 'swift' ? '38,145,178,255' : (self.linkTree2 == 'pressure' ? '178,48,48,255' : (self.linkTree2 == 'focus' ? '142,58,178,255' : (self.linkTree2 == 'lucky' ? '184,142,34,255' : '180,120,30,255'))))"
                      linkColor1: "self.entry != none && self.entry['prerequisiteStates'] != none && self.entry['prerequisiteStates'][0] == true ? self.linkBright1 : self.linkDim1"
                      linkColor2: "self.entry != none && self.entry['prerequisiteStates'] != none && self.entry['prerequisiteStates'][1] == true ? self.linkBright2 : self.linkDim2"
                      # 节点等级状态：0=未点亮, 1~maxLevel-1=部分升级, maxLevel=满级
                      nodeLevel: "self.entry != none && self.entry['level'] != none ? type.toNumber(self.entry['level']).round() : 0"
                      nodeMaxLevel: "self.entry != none && self.entry['maxLevel'] != none ? type.toNumber(self.entry['maxLevel']).round() : 1"
                      isMaxed: "self.nodeLevel >= self.nodeMaxLevel"
                    children:
                      # 节点图标（Slot 显示物品 icon）
                      节点图标:
                        type: Slot
                        attribute:
                          point: ~middle_center
                          width: "56 * var.zoomScale"
                          height: "56 * var.zoomScale"
                          slotType: ~Icon
                          itemScale: 0.75
                          normal: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? '24,30,38,255' : '16,20,28,255'"
                          shape: ~round_rect
                          radius: "(10 * var.zoomScale).round()"
                          seticon: "self.setItemIcon(self.parent.entry != none ? self.parent.entry['iconJson'] : var.emptyItemJson)"
                        effect:
                          stroke:
                            width: "(self.parent.entry != none && self.parent.entry['unlocked'] == true ? 5 : 3) * var.zoomScale"
                            color: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? self.parent.brightColor : self.parent.dimColor"
                          neon:
                            color: "self.parent.brightColor"
                            size: "(5 * var.zoomScale).round()"
                            intensity: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? 1 : 0"
                            animated: false
                        action:
                          clickLeft: |-
                            if(self.parent.entry != none){
                              if(self.parent.entry['canLevelUp'] == true){
                                Packet.send(var.packetId, 'level_up_talent', self.parent.entry['id'])
                              }
                            }
                      # 等级标签（右下角显示 当前等级/最大等级）
                      等级标签:
                        type: Canvas
                        attribute:
                          point: ~bottom_right
                          x: "(-2 * var.zoomScale).round()"
                          y: "(-2 * var.zoomScale).round()"
                          width: "(28 * var.zoomScale).round()"
                          height: "(16 * var.zoomScale).round()"
                          visible: "self.parent.entry != none && self.parent.entry['unlocked'] == true && self.parent.nodeMaxLevel > 1"
                        children:
                          等级标签底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.parent.isMaxed ? '40,80,40,220' : '20,30,45,220'"
                              shape: ~round_rect
                              radius: "(4 * var.zoomScale).round()"
                          等级文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: "(28 * var.zoomScale).round()"
                              texts: "self.parent.parent.nodeLevel + '/' + self.parent.parent.nodeMaxLevel"
                              fontSize: "(14 * var.zoomScale).round()"
                              through: true
                  # 联动连线段模板（作为树画布直接子控件，避免节点 Canvas 裁剪）
                  # tick 中 copy 后设置世界坐标 x/y/width/height/normal/visible
                  联动连线段:
                    type: Texture
                    val: 联动连线段
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      width: 1
                      height: 1
                      normal: ~120,120,120,255
                      visible: false
                      through: true
          # 操作提示（拖拽滚动 + 滚轮缩放）
          操作提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 24
              y: -8
              texts: "'&7拖拽滚动 &f| &7滚轮缩放 &f| &7R重置'"
              fontSize: 20
              shadow: true
          # 隐藏滑块：驱动 Scroll 的 moveX/moveY（不显示，仅用于程序化控制滚动位置）
          竖向滑块:
            type: Texture
            val: 竖向滑块
            attribute:
              visible: false
              width: 12
              height: 120
              normal: ~50,170,200,220
              maxDragY: "var.canvasH * var.zoomScale - (var.viewH - 236)"
          横向滑块:
            type: Texture
            val: 横向滑块
            attribute:
              visible: false
              width: 160
              height: 12
              normal: ~50,170,200,220
              maxDragX: "var.canvasW * var.zoomScale - (var.contentW - 48)"
