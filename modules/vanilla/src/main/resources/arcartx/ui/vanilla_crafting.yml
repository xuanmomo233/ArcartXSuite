# 工作台 / Craft workshop. Indigo drafting surface, fired-clay work area and paper recipe folio.
ui:
  isHud: false
  match:
    - 合成界面
  itemSize: 16
  through: true
  escClose: true
  background: true
  closeDied: true
  show: true
  jei: false
  level: 0
  screenScale: true
  action:
    load: |-
      var.showAll = true
      var.previewGrid = []
      var.searchText = ''
      var.recipeCanCraft = {}
      var.recipeJsons = {}
      var.recipes = {}
      var.allRecipes = {}
      var.recipeCount = 0
      var.刷新轮次 = 0
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.previewVisible = [true, true, true, true, true, true, true, true, true]
      var.previewMissing = [false, false, false, false, false, false, false, false, false]
      var.currentCategory = 'all'
      var.needFilterRefresh = false
      var.shiftHeld = false
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
    keyPress: |-
      if(self.currentKeyPress == 'LEFT_SHIFT'){
        var.shiftHeld = true
      }
    keyRelease: |-
      if(self.currentKeyReleased == 'LEFT_SHIFT'){
        var.shiftHeld = false
      }
    tick: |-
      if(var.needFilterRefresh){
        var.needFilterRefresh = false
        var.recipes = {}
        var.recipeJsons = {}
        var.recipeCanCraft = {}
        idx = 0.0
        for(key in var.allRecipes.keys()){
          recipe = var.allRecipes[key]
          cat = recipe['category']
          if(var.currentCategory == 'all' || (var.currentCategory == 'tools' && (cat == 'tools' || cat == 'equipment')) || (var.currentCategory == 'food' && (cat == 'food' || cat == 'misc')) || cat == var.currentCategory){
            name = recipe['resultName']
            zhName = recipe['resultZhName']
            if(var.searchText == '' || (name != none && name.contains(var.searchText)) || (zhName != none && zhName.contains(var.searchText))){
              canCraft = recipe['canCraft']
              if(var.showAll || canCraft == 1){
                rk = idx.round()
                var.recipes[rk] = recipe
                var.recipeJsons[rk] = recipe['resultJson']
                var.recipeCanCraft[rk] = canCraft
                idx = idx + 1
              }
            }
          }
        }
        var.recipeCount = idx.round()
        配方数 = idx.round()
        现有控件数 = val.配方展示区.childrenCount()
        if(现有控件数 > 配方数){
          while(val.配方展示区.childrenCount() > 配方数 && val.配方展示区.childrenCount() > 1){
            val.配方展示区.get(val.配方展示区.childrenCount() - 1).remove()
          }
        }
        if(现有控件数 < 配方数){
          var.刷新轮次 = var.刷新轮次 + 1
          for(序号 in range(现有控件数, 配方数 - 1)){
            icon = val.配方展示区['配方原型'].copy('配方图标_' + var.刷新轮次 + '_' + 序号.round())
            icon.entryKey = 序号.round()
          }
        }
        最大数 = 配方数
        for(i in range(0, 最大数 - 1)){
          icon = val.配方展示区.get(i.round())
          if(icon != none){
            icon.entryKey = i.round()
            icon.seticon()
          }
        }
      }
      if(var.selectedRecipe != none){
        slotNames = ['合成原型', '合成格1', '合成格2', '合成格3', '合成格4', '合成格5', '合成格6', '合成格7', '合成格8']
        for(i in range(0, 8)){
          slot = val.合成网格[slotNames[i.round()]]
          if(slot != none){
            item = slot.getSlotItemStack()
            var.previewVisible[i.round()] = (item == none || item.getType() == 'null' || item.getCount() == 0)
          }
        }
        resultItem = val.结果槽.getSlotItemStack()
        var.resultVisible = (resultItem == none || resultItem.getType() == 'null' || resultItem.getCount() == 0)
      }
    open: |-
      Packet.send('AXS:vanilla_crafting', 'request_recipe_book')
  packetHandler:
    recipe_book_toggle: |-
      var.recipeBookOpen = packet['open']
      if(!var.recipeBookOpen){
        var.selectedRecipe = none
      }
      if(packet['recipes'] != none){
        var.allRecipes = packet['recipes']
        var.needFilterRefresh = true
      }
      if(packet['catIcons'] != none){
        var.catIcons = packet['catIcons']
        if(val.配方书按钮 != none) {
          val.配方书按钮.setItemIcon(var.catIcons['book'])
        }
        if(val.显示切换 != none) {
          val.显示切换.setItemIcon(var.catIcons['toggle'])
        }
        if(val.分类栏['分类_全部'] != none) {
          val.分类栏['分类_全部'].setItemIcon(var.catIcons['all'])
        }
        if(val.分类栏['分类_工具'] != none) {
          val.分类栏['分类_工具'].setItemIcon(var.catIcons['tools'])
        }
        if(val.分类栏['分类_建筑'] != none) {
          val.分类栏['分类_建筑'].setItemIcon(var.catIcons['building'])
        }
        if(val.分类栏['分类_食品'] != none) {
          val.分类栏['分类_食品'].setItemIcon(var.catIcons['food'])
        }
        if(val.分类栏['分类_红石'] != none) {
          val.分类栏['分类_红石'].setItemIcon(var.catIcons['redstone'])
        }
      }
  defaultOpen: true
