            attribute:
              x: 32
              y: 28
              width: 920
              height: 44
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: '''&f通关排行  &7· '' + var.dungeonName'
                  limit: 28
                  fontSize: 56
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          表头底:
