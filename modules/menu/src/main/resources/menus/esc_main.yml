# ESC 暂停界面菜单 — 左侧滑出布局，替换原版暂停界面
# 当玩家按 ESC 键时弹出此菜单，覆盖原版暂停界面

# 菜单唯一标识，用于内部引用和 open: 动作跳转
id: esc_main

# 菜单标题，支持 & 颜色代码（&f = 白色，&l = 粗体）
title: "&f&l菜单"

# 布局模式：esc = 左侧滑出式（专用于 ESC 界面），其他可选：panel（居中面板）
layout: esc

# 每行按钮列数
columns: 2

# 每页最大按钮数量
buttons-per-page: 64

# 打开菜单所需权限，为空表示无权限要求
permission: ""

# 是否拦截 ESC 键并显示此菜单（true = 替代原版暂停界面）
match-esc: true

# 打开菜单的前置条件列表（支持 PlaceholderAPI 变量），为空表示无条件
open-requirements: []

# 打开菜单时执行的动作（如发送消息、播放音效等），此处省略
# open-actions:
#   - "message: &a欢迎！"

# 关闭菜单时执行的动作，此处省略
# close-actions: []

# 注册为命令打开菜单（可选），此处省略因为通过 ESC 键触发
# commands:
#   - "escmenu"

# 页面列表，每个页面包含一组按钮
pages:
  - id: main
    title: "&f菜单"
    buttons:
      # ——— 商城按钮 ———
      shop:
        text: "&f商城"
        details:
          summary: "旅途所需，皆备于此"
          category: "交易服务 / SHOP"
          accent: "#E2B76B"
          description:
            - "浏览服务器商店，选购装备、材料与补给。"
          action-hint: "点击进入商城"
        # 按钮排列顺序，数字越小越靠前
        order: 0
        icon:
          material: EMERALD
          name: "&f商城"
        # 按钮动作列表：
        #   command: 执行指令 | close: 关闭菜单 | open: 打开其他菜单
        #   page: 跳转页面 | message: 发送消息 | delay:N 延迟 N tick 后执行后续动作
        actions:
          - "close"
          - "delay: 10"
          - "command: market shop"

      # ——— 仓库系统按钮 ———
      warehouse:
        text: "&f仓库系统"
        details:
          summary: "为每一次冒险，留出新的空间"
          category: "物资管理 / STORAGE"
          accent: "#D6BE8F"
          description:
            - "把旅途中的收获妥善收藏，让背包轻装上阵。"
            - "在仓库中浏览、整理和存取你的物品。"
          action-hint: "点击打开仓库"
        order: 1
        icon:
          material: CHEST
          name: "&f仓库系统"
        actions:
          - "close"
          - "delay: 10"
          - "command: warehouse open"

      # ——— 邮件按钮 ———
      mail:
        text: "&f邮件"
        details:
          summary: "来自远方的讯息与心意"
          category: "社交联络 / MAIL"
          accent: "#9FC2E0"
          description:
            - "查收系统通知、好友留言与附件礼物。"
          action-hint: "点击查看邮件"
        order: 2
        icon:
          material: PAPER
          name: "&f邮件"
        actions:
          - "close"
          - "delay: 10"
          - "command: mail open"

      # ——— 在线奖励按钮 ———
      rewards:
        text: "&f在线奖励"
        details:
          summary: "旅途的每一步，都值得嘉奖"
          category: "福利活动 / REWARD"
          accent: "#B79FD9"
          description:
            - "累积在线时长，领取对应的阶段奖励。"
          action-hint: "点击领取在线奖励"
        order: 3
        icon:
          material: ENDER_CHEST
          name: "&f在线奖励"
        # 可选：添加条件限制（需 PlaceholderAPI）
        # condition:
        #   - "%player_level% >= 5"
        # deny-message: "&c需要达到 5 级才能领取在线奖励"
        actions:
          - "close"
          - "delay: 10"
          - "command: onlinerewards open"

      # ——— 任务导航按钮 ———
      quest:
        text: "&f任务"
        details:
          summary: "新的委托正在等待"
          category: "冒险委托 / QUEST"
          accent: "#D9B06B"
          description:
            - "查看进行中的任务目标与完成进度。"
          action-hint: "点击打开任务导航"
        order: 4
        icon:
          material: WRITABLE_BOOK
          name: "&f任务"
        actions:
          - "close"
          - "delay: 10"
          - "command: questgps open"

      # ——— 地图按钮 ———
      map:
        text: "&f地图"
        details:
          summary: "山河尽收眼底"
          category: "世界探索 / MAP"
          accent: "#93B98A"
          description:
            - "浏览大地图，查看锚点与当前所在位置。"
          action-hint: "点击展开地图"
        order: 5
        icon:
          material: FILLED_MAP
          name: "&f地图"
        actions:
          - "close"
          - "delay: 10"
          - "command: map open"

      # ——— 称号按钮 ———
      title:
        text: "&f称号"
        details:
          summary: "以名衔铭记你的旅程"
          category: "个性装扮 / TITLE"
          accent: "#D98F8F"
          description:
            - "查看并佩戴已获得的称号。"
          action-hint: "点击管理称号"
        order: 6
        icon:
          material: NAME_TAG
          name: "&f称号"
        actions:
          - "close"
          - "delay: 10"
          - "command: title open"

      # ——— 功能菜单（跳转到 example 子菜单） ———
      example:
        text: "&f功能菜单"
        details:
          summary: "更多功能，由此展开"
          category: "功能导航 / MENU"
          accent: "#9DB4E0"
          description:
            - "进入功能菜单，浏览服务器提供的全部玩法入口。"
          action-hint: "点击进入功能菜单"
        order: 7
        icon:
          material: NETHER_STAR
          name: "&f功能菜单"
        # open: 打开另一个菜单文件（通过目标菜单的 id 引用）
        actions:
          - "open: example"
          - "close"

      # ——— 帮助按钮 ———
      help:
        text: "&f帮助"
        details:
          summary: "初入旅途的指南"
          category: "新手指引 / HELP"
          accent: "#8FBFCE"
          description:
            - "查看服务器的基础玩法与指令说明。"
          action-hint: "点击获取帮助"
        order: 8
        icon:
          material: KNOWLEDGE_BOOK
          name: "&f帮助"
        actions:
          - "command: help"

# 底部固定按钮（ESC 布局专属），始终显示在菜单底部
footer-buttons:
  # 游戏选项 — 打开 Minecraft 原版设置界面
  options:
    text: "&f游戏选项"
    details:
      summary: "调整画面、声音与操作"
      category: "系统设置 / SETTINGS"
      accent: "#A8B0BC"
      description:
        - "打开游戏设置界面，调整视距、音量与按键。"
      action-hint: "点击打开游戏选项"
    # 按钮排列顺序，数字越小越靠前
    order: 0
    icon:
      material: COMPARATOR
      name: "&f游戏选项"
    # client-action: 触发客户端原生动作（options = 设置界面，quit = 退出游戏）
    client-action: "options"
  # 退出游戏
  quit:
    text: "&f退出游戏"
    details:
      summary: "好好休息，旅途再会"
      category: "系统操作 / SYSTEM"
      accent: "#C97B7B"
      description:
        - "结束本次游戏，返回标题界面。"
      action-hint: "点击退出游戏"
    # 按钮排列顺序，数字越小越靠前
    order: 1
    icon:
      material: BARRIER
      name: "&f退出游戏"
    client-action: "quit"
