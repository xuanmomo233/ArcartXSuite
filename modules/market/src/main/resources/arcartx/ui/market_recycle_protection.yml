                            scheduler.delay(50, -> {
                              if(val.确认物品 != none){
                                val.确认物品.seticon()
                              }
                            })
                        children:
                          底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~48,67,82,240
                              shape: ~round_rect
                              radius: 8
                          文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "~&c移除保护"
                              fontSize: 24
                              through: true
          空清单:
