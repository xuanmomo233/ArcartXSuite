# QQBot UI：服务端验证会话、权限和全部写操作；row0..row9 为明确复制的固定模板。
ui:
  isHud: false
  defaultOpen: false
  through: false
  background: true
  escClose: true
  closeDied: true
  screenScale: true
  show: true
  level: 15
  action:
    load: |-
      var.busy = true
      var.tab = 'binding'
      var.messages = {}
      var.msgCount = 0
      var.confirmUnbind = false
  packetHandler:
    init: |-
      var.busy = packet['busy']
      var.actionToken = packet['action_token']
      var.packetId = packet['packetId']
      var.bound = packet['bound']
      var.qqId = packet['qqId']
      var.bindTime = packet['bindTime']
      var.bindGuide = packet['bindGuide']
      var.bindEnabled = packet['bindEnabled']
      var.botConnected = packet['botConnected']
      var.canSend = packet['canSend']
      var.messages = packet['messages']
      var.msgCount = packet['msgCount']
      var.result = packet['message']
      var.resultType = packet['type']
      var.confirmUnbind = false
    update: |-
      var.busy = packet['busy']
      var.actionToken = packet['action_token']
      var.packetId = packet['packetId']
      var.bound = packet['bound']
      var.qqId = packet['qqId']
      var.bindTime = packet['bindTime']
      var.bindGuide = packet['bindGuide']
      var.bindEnabled = packet['bindEnabled']
      var.botConnected = packet['botConnected']
      var.canSend = packet['canSend']
      var.messages = packet['messages']
      var.msgCount = packet['msgCount']
      var.result = packet['message']
      var.resultType = packet['type']
      var.confirmUnbind = false
    messages: |-
      var.busy = packet['busy']
      var.messages = packet['messages']
      var.msgCount = packet['msgCount']
    result: |-
      var.busy = packet['busy']
      var.result = packet['message']
      var.resultType = packet['type']
      if(packet['sent'] == true && val.replyInput != none){
        val.replyInput.setContent('')
      }
controls:
  全局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1000
          height: 720
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~22,29,40,248
              shape: ~round_rect
              radius: 18
          标题:
            type: Text
            attribute:
              x: 30
              y: 24
              texts: "\"QQ 绑定与群消息\""
              fontSize: 54
              limit: 35
              visible: "true"
              through: true
          关闭:
            type: Canvas
            attribute:
              x: 910
              y: 22
              width: 60
              height: 48
              visible: "true"
            action:
              clickLeft: |-
                self.close()
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~60,130,180,245
                  hover: ~80,155,205,255
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&f×'"
                  fontSize: 36
                  through: true
          账号标签:
            type: Canvas
            attribute:
              x: 30
              y: 90
              width: 180
              height: 48
              visible: "true"
            action:
              clickLeft: |-
                var.tab = 'binding'
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~60,130,180,245
                  hover: ~80,155,205,255
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&fQQ 绑定'"
                  fontSize: 36
                  through: true
          消息标签:
            type: Canvas
            attribute:
              x: 226
              y: 90
              width: 180
              height: 48
              visible: "true"
            action:
              clickLeft: |-
                var.tab = 'messages'
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~60,130,180,245
                  hover: ~80,155,205,255
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&f群消息'"
                  fontSize: 36
                  through: true
          刷新:
            type: Canvas
            attribute:
              x: 790
              y: 90
              width: 180
              height: 48
              visible: "!var.busy"
            action:
              clickLeft: |-
                if(!var.busy && var.actionToken != none){
                  var.busy = true
                  Packet.send(var.packetId, 'refresh', var.actionToken)
                }
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~60,130,180,245
                  hover: ~80,155,205,255
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&f刷新'"
                  fontSize: 36
                  through: true
          连接状态:
            type: Text
            attribute:
              x: 440
              y: 102
              texts: "var.botConnected ? '&a● 机器人已连接' : '&c● 机器人未连接'"
              fontSize: 32
              limit: 60
              visible: "true"
              through: true
          绑定页:
            type: Canvas
            attribute:
              x: 30
              y: 150
              width: 940
              height: 480
              visible: "var.tab == 'binding'"
            children:
              绑定标题:
                type: Text
                attribute:
                  x: 0
                  y: 0
                  texts: "var.bound ? '&a已绑定 QQ：&f' + var.qqId : '&f绑定你的 QQ 账号'"
                  fontSize: 48
                  limit: 60
                  visible: "true"
                  through: true
              时间:
                type: Text
                attribute:
                  x: 0
                  y: 54
                  texts: "var.bound ? '&7绑定时间：' + var.bindTime : '&7验证码由 QQ 群发起，游戏端确认。'"
                  fontSize: 36
                  limit: 60
                  visible: "true"
                  through: true
              步骤一:
                type: Text
                attribute:
                  x: 0
                  y: 116
                  texts: "'&b1. &f在 QQ 群申请验证码'"
                  fontSize: 36
                  limit: 60
                  visible: "!var.bound && var.bindEnabled"
                  through: true
              申请说明:
                type: Text
                attribute:
                  x: 0
                  y: 164
                  texts: "'&7' + var.bindGuide"
                  fontSize: 32
                  limit: 56
                  visible: "!var.bound && var.bindEnabled"
                  through: true
              确认输入区:
                type: Canvas
                attribute:
                  y: 218
                  width: 940
                  height: 60
                  visible: "!var.bound && var.bindEnabled"
                children:
                  验证码:
                    type: Canvas
                    attribute:
                      x: 0
                      y: 0
                      width: 560
                      height: 50
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~35,44,57,245
                          shape: ~round_rect
                          radius: 8
                      框:
                        type: TextBox
                        attribute:
                          x: 12
                          y: 6
                          width: 536
                          height: 38
                          length: 64
                          fontSize: 36
                          emptyText: "~在此输入 QQ 收到的验证码"
                        action:
                          textChange: |-
                            var.codeInput = self.getContent()
                  确认绑定:
                    type: Canvas
                    attribute:
                      x: 580
                      y: 0
                      width: 200
                      height: 48
                      visible: "!var.busy && var.codeInput != none && var.codeInput != ''"
                    action:
                      clickLeft: |-
                        if(!var.busy && var.actionToken != none){
                          var.busy = true
                          Packet.send(var.packetId, 'confirm_bind', var.actionToken, var.codeInput)
                        }
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~60,130,180,245
                          hover: ~80,155,205,255
                          shape: ~round_rect
                          radius: 10
                      字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "'&f确认绑定'"
                          fontSize: 36
                          through: true
              停用说明:
                type: Text
                attribute:
                  x: 0
                  y: 130
                  texts: "'&7当前服务器未启用 QQ 绑定。'"
                  fontSize: 36
                  limit: 60
                  visible: "!var.bindEnabled"
                  through: true
              绑定后说明:
                type: Text
                attribute:
                  x: 0
                  y: 116
                  texts: "'&7解绑后，服务器可能要求你重新完成 QQ 绑定才能继续游戏。'"
                  fontSize: 32
                  limit: 55
                  visible: "var.bound"
                  through: true
              解绑:
                type: Canvas
                attribute:
                  x: 0
                  y: 218
                  width: 200
                  height: 48
                  visible: "var.bound && !var.confirmUnbind && !var.busy"
                action:
                  clickLeft: |-
                    var.confirmUnbind = true
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~150,70,60,245
                      hover: ~80,155,205,255
                      shape: ~round_rect
                      radius: 10
                  字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f解除绑定'"
                      fontSize: 36
                      through: true
              解绑确认区:
                type: Canvas
                attribute:
                  y: 218
                  width: 940
                  height: 160
                  visible: "var.confirmUnbind && var.bound"
                children:
                  确认文字:
                    type: Text
                    attribute:
                      x: 0
                      y: 0
                      texts: "'&e确认解除当前 QQ 与游戏账号的绑定？'"
                      fontSize: 36
                      limit: 60
                      visible: "true"
                      through: true
                  确认:
                    type: Canvas
                    attribute:
                      x: 0
                      y: 62
                      width: 200
                      height: 48
                      visible: "!var.busy"
                    action:
                      clickLeft: |-
                        if(!var.busy && var.actionToken != none){
                          var.busy = true
                          Packet.send(var.packetId, 'unbind', var.actionToken)
                        }
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~150,70,60,245
                          hover: ~80,155,205,255
                          shape: ~round_rect
                          radius: 10
                      字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "'&f确认解绑'"
                          fontSize: 36
                          through: true
                  取消:
                    type: Canvas
                    attribute:
                      x: 220
                      y: 62
                      width: 160
                      height: 48
                      visible: "!var.busy"
                    action:
                      clickLeft: |-
                        var.confirmUnbind = false
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~65,75,90,245
                          hover: ~80,155,205,255
                          shape: ~round_rect
                          radius: 10
                      字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "'&f取消'"
                          fontSize: 36
                          through: true
          消息页:
            type: Canvas
            attribute:
              x: 30
              y: 150
              width: 940
              height: 480
              visible: "var.tab == 'messages'"
            children:
              消息说明:
                type: Text
                attribute:
                  x: 0
                  y: 0
                  texts: "'&7最近 10 条群消息 · 新消息请点刷新 · 缓存共 ' + var.msgCount.round() + ' 条'"
                  fontSize: 32
                  limit: 60
                  visible: "true"
                  through: true
              空列表:
                type: Text
                attribute:
                  x: 20
                  y: 120
                  texts: "'&7还没有同步的群消息。'"
                  fontSize: 36
                  limit: 60
                  visible: "var.msgCount == 0"
                  through: true
              滚动区:
                type: Canvas
                attribute:
                  y: 46
                  width: 940
                  height: 350
                children:
                  滑块:
                    type: Texture
                    attribute:
                      point: ~top_right
                      width: 10
                      height: 64
                      maxDragY: 286
                      normal: ~100,140,170,230
                      shape: ~round_rect
                      radius: 5
                  内容:
                    type: Scroll
                    attribute:
                      width: 920
                      height: 350
                      moveY: self.parent['滑块'].getDragYRatio()
                    children:
                      消息列表:
                        val: messageList
                        type: RepeatGrid
                        attribute:
                          items: "['row0', 'row1', 'row2', 'row3', 'row4', 'row5', 'row6', 'row7', 'row8', 'row9']"
                          flow: ~row
                          column: 1
                          spaceBetweenY: 8
                          maxSize: 10
                          width: 910
                        children:
                          消息行:
                            type: Texture
                            attribute:
                              entryKey: self.item
                              entry: var.messages[self.entryKey]
                              visible: self.entry != none
                              width: 900
                              height: 86
                              normal: ~32,42,55,245
                              shape: ~round_rect
                              radius: 8
                            children:
                              来源:
                                type: Text
                                attribute:
                                  x: 12
                                  y: 8
                                  texts: "self.parent.entry != none ? '&b' + self.parent.entry['nick'] + '  &8' + self.parent.entry['time'] + '  · 群 ' + self.parent.entry['group'] : ''"
                                  fontSize: 32
                                  limit: 55
                                  visible: "true"
                                  through: true
                              消息:
                                type: Text
                                attribute:
                                  x: 12
                                  y: 46
                                  texts: "self.parent.entry != none ? '&f' + self.parent.entry['msg'] : ''"
                                  fontSize: 36
                                  limit: 48
                                  visible: "true"
                                  through: true
              发送区:
                type: Canvas
                attribute:
                  y: 414
                  width: 940
                  height: 50
                  visible: var.canSend
                children:
                  消息:
                    type: Canvas
                    attribute:
                      x: 0
                      y: 0
                      width: 740
                      height: 50
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~35,44,57,245
                          shape: ~round_rect
                          radius: 8
                      框:
                        val: replyInput
                        type: TextBox
                        attribute:
                          x: 12
                          y: 6
                          width: 716
                          height: 38
                          length: 200
                          fontSize: 36
                          emptyText: "~输入消息（最多200字）"
                        action:
                          textChange: |-
                            var.replyText = self.getContent()
                  发送:
                    type: Canvas
                    attribute:
                      x: 760
                      y: 0
                      width: 180
                      height: 48
                      visible: "!var.busy && var.replyText != none && var.replyText != ''"
                    action:
                      clickLeft: |-
                        if(!var.busy && var.actionToken != none){
                          var.busy = true
                          Packet.send(var.packetId, 'send_message', var.actionToken, var.replyText)
                        }
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~60,130,180,245
                          hover: ~80,155,205,255
                          shape: ~round_rect
                          radius: 10
                      字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "'&f发送'"
                          fontSize: 36
                          through: true
              无发送权限:
                type: Text
                attribute:
                  x: 0
                  y: 420
                  texts: "'&7当前账号只能查看群消息，发送权限由管理员配置。'"
                  fontSize: 32
                  limit: 60
                  visible: "!var.canSend"
                  through: true
          操作结果:
            type: Text
            attribute:
              x: 30
              y: 650
              texts: "var.resultType == 'error' ? '&c' + var.result : (var.resultType == 'success' ? '&a' + var.result : '&7' + var.result)"
              fontSize: 36
              limit: 52
              visible: "var.result != none && var.result != ''"
              through: true
          等待提示:
            type: Text
            attribute:
              x: 30
              y: 686
              texts: "var.busy ? '&7正在处理，请等待服务端返回…' : '&8QQBot · Esc 关闭'"
              fontSize: 28
              limit: 60
              visible: "true"
              through: true
