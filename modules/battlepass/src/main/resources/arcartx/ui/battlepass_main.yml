# AXS BattlePass 主界面
# 打开方式: /bp open 或 Packet 触发
# 数据交互: packetHandler init/update
# 奖励领取: 点击"领取奖励"按钮打开独立 battlepass_rewards.yml 界面

ui:
  isHud: false
  background: true
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 界面初始化时接收服务端数据包，将包字段写入 UI 变量
    # 包字段:
    #   - packetId: 包标识符，用于后续 Packet.send 回传
    #   - seasonName: 当前赛季名称
    #   - currentLevel: 玩家当前战令等级
    #   - maxLevel: 赛季最大等级
    #   - currentXp: 当前等级已获得经验值
    #   - xpPerLevel: 每级所需经验值
    #   - xpNeeded: 升级还需经验值
    #   - premiumUnlocked: 是否已解锁高级版（premium）
    #   - deluxeUnlocked: 是否已解锁豪华版（deluxe）
    #   - tier: 当前档位标识（FREE / PREMIUM / DELUXE）
    #   - tierDisplay: 档位显示文本（含颜色代码）
    #   - progressRatio: 当前等级进度比例（0~1）
    init: |-
      var.packetId = packet['packetId']
      var.seasonName = packet['seasonName']
      var.currentLevel = packet['currentLevel']
      var.maxLevel = packet['maxLevel']
      var.currentXp = packet['currentXp']
      var.xpPerLevel = packet['xpPerLevel']
      var.xpNeeded = packet['xpNeeded']
      var.premiumUnlocked = packet['premiumUnlocked']
      var.deluxeUnlocked = packet['deluxeUnlocked']
      var.tier = packet['tier']
      var.tierDisplay = packet['tierDisplay']
      var.progressRatio = packet['progressRatio']
    # packetHandler: update
    # 数据更新时接收服务端数据包，刷新 UI 变量（字段与 init 相同）
    update: |-
      var.packetId = packet['packetId']
      var.seasonName = packet['seasonName']
      var.currentLevel = packet['currentLevel']
      var.maxLevel = packet['maxLevel']
      var.currentXp = packet['currentXp']
      var.xpPerLevel = packet['xpPerLevel']
      var.xpNeeded = packet['xpNeeded']
      var.premiumUnlocked = packet['premiumUnlocked']
      var.deluxeUnlocked = packet['deluxeUnlocked']
      var.tier = packet['tier']
      var.tierDisplay = packet['tierDisplay']
      var.progressRatio = packet['progressRatio']
  action:
    load: |-
      var.packetId = 'AXS_BATTLEPASS'
      var.seasonName = '等待同步'
      var.currentLevel = 0
      var.maxLevel = 0
      var.currentXp = 0
      var.xpPerLevel = 1000
      var.xpNeeded = 1000
      var.premiumUnlocked = false
      var.deluxeUnlocked = false
      var.tier = 'FREE'
      var.tierDisplay = '&7免费'
      var.progressRatio = 0
      var.actionToken = ''
    open: |-
      Packet.send(var.packetId, 'refresh')

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      through: true
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1200
          height: 720
        children:
          # ── 面板背景层 ─────────────────────────────────────
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~28,30,42,244
              shape: ~round_rect
              radius: 24
            effect:
              gradient:
                color1: ~38,42,58,255
                color2: ~28,30,42,255
                type: 0
                angleDeg: 90
              stroke:
                width: 2
                color: ~90,170,255,150
          内描边:
            type: Texture
            attribute:
              point: ~middle_center
              width: 1184
              height: 704
              normal: ~0,0,0,0
              shape: ~round_rect
              radius: 20
              through: true
            effect:
              stroke:
                width: 1
                color: ~90,170,255,60
          顶部高光:
            type: Texture
            attribute:
              point: ~horizontal_stretch_top
              height: 180
              normal: ~255,255,255,0
              shape: ~round_rect
              radius: 24
              through: true
            effect:
              gradient:
                color1: ~90,170,255,30
                color2: ~90,170,255,0
                type: 0
                angleDeg: 90

          # ── 顶栏 ───────────────────────────────────────────
          顶栏:
            type: Canvas
            attribute:
              point: ~horizontal_stretch_top
              height: 80
            children:
              顶栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,255,255,14
                  shape: ~round_rect
                  radius: 22
              顶栏分隔线:
                type: Texture
                attribute:
                  point: ~horizontal_stretch_bottom
                  height: 2
                  normal: ~90,170,255,120
                  through: true
              顶栏高光:
                type: Texture
                attribute:
                  point: ~bottom_center
                  width: 360
                  height: 3
                  normal: ~120,200,255,220
                  shape: ~round_rect
                  radius: 2
                  through: true
                effect:
                  neon:
                    color: ~90,170,255,140
                    size: 8
                    intensity: 0.5
                    animated: false
              # 标题图标
              标题图标框:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 24
                  width: 44
                  height: 44
                  normal: ~50,56,76,240
                  shape: ~round_rect
                  radius: 12
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,180
              标题图标内:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 32
                  width: 28
                  height: 28
                  normal: ~90,170,255,220
                  shape: ~round_rect
                  radius: 8
                  through: true
                effect:
                  neon:
                    color: ~120,200,255,160
                    size: 8
                    intensity: 0.6
                    animated: false
              标题:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 80
                  texts: "~&e战令系统"
                  fontSize: 36
                  through: true
              标题竖线:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 260
                  width: 2
                  height: 30
                  normal: ~90,170,255,80
                  through: true
              赛季名:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 276
                  texts: "'&7赛季: &f' + var.seasonName"
                  fontSize: 28
                  through: true
              # 档位标签
              档位标签:
                type: Canvas
                attribute:
                  point: ~middle_right
                  x: -90
                  width: 200
                  height: 40
                children:
                  档位底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.deluxeUnlocked ? '120,70,180,220' : var.premiumUnlocked ? '200,160,60,220' : '60,64,76,200'"
                      shape: ~round_rect
                      radius: 20
                    effect:
                      stroke:
                        width: 2
                        color: "var.deluxeUnlocked ? '200,140,255,200' : var.premiumUnlocked ? '255,210,100,200' : '120,130,150,160'"
                  档位文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 200
                      texts: "var.tierDisplay"
                      fontSize: 28
                      through: true
              # 关闭按钮：Canvas + Texture(背景) + Text(文字)
              关闭按钮:
                type: Canvas
                attribute:
                  point: ~top_right
                  x: -20
                  y: 18
                  width: 44
                  height: 44
                action:
                  clickLeft: |-
                    Screen.close()
                children:
                  关闭背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~60,40,40,220
                      hover: ~Frosted:0;200,70,70,240
                      shape: ~circle
                    effect:
                      stroke:
                        width: 2
                        color: ~255,100,100,140
                  关闭文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 44
                      texts: "~&f✕"
                      fontSize: 28

          # ════════════════════════════════════════════════════
          # 信息面板
          # ════════════════════════════════════════════════════
          信息面板:
            type: Canvas
            attribute:
              point: ~stretch_all
              through: true
            children:
              # ── 等级展示卡片 ────────────────────────────────
              等级卡片:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 32
                  y: 110
                  width: 540
                  height: 280
                children:
                  等级卡片底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~42,46,62,220
                      shape: ~round_rect
                      radius: 20
                    effect:
                      gradient:
                        color1: ~52,58,80,230
                        color2: ~38,42,58,220
                        type: 0
                        angleDeg: 90
                      stroke:
                        width: 2
                        color: ~90,170,255,80
                  等级卡片标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 20
                      texts: "~&7当前等级"
                      fontSize: 28
                      through: true
                  # 大等级数字
                  等级数字:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 56
                      texts: "'&f&lLv.' + var.currentLevel"
                      fontSize: 72
                      through: true
                  等级上限:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 220
                      y: 88
                      texts: "'&7/ ' + var.maxLevel"
                      fontSize: 36
                      through: true
                  # 经验信息
                  经验文本:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 150
                      width: 492
                      texts: "'&7经验: &f' + var.currentXp + ' / ' + var.xpPerLevel"
                      fontSize: 28
                      through: true
                  还需经验:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 184
                      width: 492
                      texts: "'&8升级还需 &f' + var.xpNeeded + ' &8经验'"
                      fontSize: 24
                      through: true
                  # 进度条
                  进度条背景:
                    type: Texture
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 222
                      width: 492
                      height: 28
                      normal: ~20,22,32,200
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 1
                        color: ~90,170,255,60
                  进度条填充:
                    type: Texture
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 222
                      width: "(type.toNumber(var.progressRatio) > 1 ? 1 : type.toNumber(var.progressRatio)) * 492"
                      height: 28
                      normal: ~90,170,255,255
                      shape: ~round_rect
                      radius: 14
                    effect:
                      gradient:
                        color1: ~120,200,255,255
                        color2: ~70,140,220,255
                        type: 0
                        angleDeg: 0
                      neon:
                        color: ~120,200,255,120
                        size: 6
                        intensity: 0.4
                        animated: false
                  进度百分比:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 222
                      width: 492
                      height: 28
                      texts: "'&f' + ((type.toNumber(var.progressRatio) * 100).round()) + '%'"
                      center: true
                      fontSize: 24
                      through: true

              # ── 档位信息卡片 ────────────────────────────────
              档位信息卡片:
                type: Canvas
                attribute:
                  point: ~top_right
                  x: -32
                  y: 110
                  width: 560
                  height: 280
                children:
                  档位信息底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~42,46,62,220
                      shape: ~round_rect
                      radius: 20
                    effect:
                      gradient:
                        color1: ~52,58,80,230
                        color2: ~38,42,58,220
                        type: 0
                        angleDeg: 90
                      stroke:
                        width: 2
                        color: ~90,170,255,80
                  档位信息标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 20
                      texts: "~&7档位权益"
                      fontSize: 28
                      through: true
                  # 免费档
                  免费档行:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 64
                      width: 512
                      height: 48
                    children:
                      免费档底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~50,55,72,200
                          shape: ~round_rect
                          radius: 14
                        effect:
                          stroke:
                            width: 1
                            color: ~120,130,150,100
                      免费档图标:
                        type: Texture
                        attribute:
                          point: ~middle_left
                          x: 12
                          width: 24
                          height: 24
                          normal: ~120,130,150,220
                          shape: ~circle
                          through: true
                      免费档文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 48
                          texts: "~&7免费档 &8(默认)"
                          fontSize: 26
                          through: true
                      免费档状态:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -16
                          texts: "~&a已激活"
                          fontSize: 26
                          through: true
                  # 高级档
                  高级档行:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 120
                      width: 512
                      height: 48
                    children:
                      高级档底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "var.premiumUnlocked ? '60,50,30,220' : '50,55,72,180'"
                          shape: ~round_rect
                          radius: 14
                        effect:
                          stroke:
                            width: 1
                            color: "var.premiumUnlocked ? '255,210,100,160' : '120,130,150,80'"
                      高级档图标:
                        type: Texture
                        attribute:
                          point: ~middle_left
                          x: 12
                          width: 24
                          height: 24
                          normal: "var.premiumUnlocked ? '255,210,100,240' : '120,130,150,140'"
                          shape: ~circle
                          through: true
                        effect:
                          neon:
                            color: "var.premiumUnlocked ? '255,210,100,140' : '0,0,0,0'"
                            size: 6
                            intensity: 0.5
                            animated: false
                      高级档文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 48
                          texts: "~&6高级档 &8(额外奖励)"
                          fontSize: 26
                          through: true
                      高级档状态:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -16
                          texts: "var.premiumUnlocked ? '&a已激活' : '&7未激活'"
                          fontSize: 26
                          through: true
                  # 典藏档
                  典藏档行:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 176
                      width: 512
                      height: 48
                    children:
                      典藏档底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "var.deluxeUnlocked ? '50,30,60,220' : '50,55,72,180'"
                          shape: ~round_rect
                          radius: 14
                        effect:
                          stroke:
                            width: 1
                            color: "var.deluxeUnlocked ? '200,140,255,160' : '120,130,150,80'"
                      典藏档图标:
                        type: Texture
                        attribute:
                          point: ~middle_left
                          x: 12
                          width: 24
                          height: 24
                          normal: "var.deluxeUnlocked ? '200,140,255,240' : '120,130,150,140'"
                          shape: ~circle
                          through: true
                        effect:
                          neon:
                            color: "var.deluxeUnlocked ? '200,140,255,140' : '0,0,0,0'"
                            size: 6
                            intensity: 0.5
                            animated: false
                      典藏档文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 48
                          texts: "~&5典藏档 &8(专属奖励)"
                          fontSize: 26
                          through: true
                      典藏档状态:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -16
                          texts: "var.deluxeUnlocked ? '&a已激活' : '&7未激活'"
                          fontSize: 26
                          through: true

              # ── 操作按钮区 ────────────────────────────────
              按钮区:
                type: Canvas
                attribute:
                  point: ~horizontal_stretch_bottom
                  height: 130
                children:
