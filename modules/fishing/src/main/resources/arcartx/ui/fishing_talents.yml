# AXS 钓鱼天赋网络界面（五系常驻布局）
# 打开方式: /fishing talents 或主界面导航跳转
# 数据交互: packetHandler init/update (AXS_FISHING_TALENTS)
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航 + 内容区
#       内容区 = 天赋点信息栏 + 滚动树画布（5棵树横向排列+联动天赋底部一排）
#       每棵树 = 网格布局+xy位移调控，Texture纯色块连线，正方形Slot显示icon
# 视觉规范:
#   全屏玻璃 Frosted:24;12,22,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片底 26,34,46,210  卡片描边 80,200,220,240
#   主色（青蓝）50,170,200  已点亮 124,196,142  悬停高亮 80,200,220
#   连线已点亮 124,196,142,240  连线可点亮 50,170,200,120  连线锁定 80,200,220,100
#
# Java 端 pushTalentsData 发送字段:
#   packetId, seasonId, level, talentPoints, unspentTalentPoints,
#   unlockedTalents (Map<nodeId, level:int>),
#   trees (Map<treeId, {id, displayName, description, icon, iconJson,
#     nodeCount, nodes: Map<idx, {id, name, description, tier, branch, treeId,
#       unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>}>),
#   links (Map<idx, {id, name, description, tier, branch, treeId,
#     unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>),
#   linkCount
#
# 客户端回包:
#   Packet.send(packetId, 'level_up_talent', nodeId)  — 升级指定节点
#   Packet.send(packetId, 'reset_talents')             — 重置天赋树

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8

  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = {} }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.links = packet['links']
      if(var.links == none){ var.links = {} }
      var.linkCount = packet['linkCount']
      if(var.linkCount == none){ var.linkCount = 0 }
      var.needRebuild = true
    update: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = {} }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.links = packet['links']
      if(var.links == none){ var.links = {} }
      var.linkCount = packet['linkCount']
      if(var.linkCount == none){ var.linkCount = 0 }
      var.needRebuild = true
  action:
    # load: 初始化变量 + 视口换算 + 中心发散布局参数
    load: |-
      var.packetId = 'AXS_FISHING_TALENTS'
      var.seasonId = ''
      var.playerLevel = 1
      var.talentPoints = 0
      var.unspentTalentPoints = 0
      var.unlockedTalents = {}
      var.trees = {}
      var.links = {}
      var.linkCount = 0
      var.needRebuild = false
      var.iconDelay = 0
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      // 中心发散布局参数
      var.nodeSize = 48
      var.lineW = 3
      var.canvasW = 1800
      var.canvasH = 1800
      var.centerX = var.canvasW / 2
      var.centerY = var.canvasH / 2
      // 半径：T1 中心 → T2 → T3 → T4 → T5 → T6 → T7 → 联动
      var.R1 = 0
      var.R2 = 80
      var.R3 = 180
      var.R4 = 280
      var.R5 = 400
      var.R6 = 540
      var.R7 = 700
      var.RlinkA = 460
      var.RlinkB = 500
      var.RlinkC = 540
      // 6 棵树方向（从正上方开始顺时针）
      var.treeIds = ['steady', 'swift', 'pressure', 'focus', 'lucky', 'endure']
      var.treeNames = {}
      var.treeNames['steady'] = '&a稳健'
      var.treeNames['swift'] = '&b迅捷'
      var.treeNames['pressure'] = '&c威压'
      var.treeNames['focus'] = '&d专注'
      var.treeNames['lucky'] = '&e幸运'
      var.treeNames['endure'] = '&6持久'
      var.treeDescs = {}
      var.treeDescs['steady'] = '绿条稳定性与高度'
      var.treeDescs['swift'] = '降低鱼速与活跃度'
      var.treeDescs['pressure'] = '压制鱼逃离行为'
      var.treeDescs['focus'] = '进度获取与维持'
      var.treeDescs['lucky'] = '经验售价与稀有鱼'
      var.treeDescs['endure'] = '绿条物理与时间'
      // T2 分支映射
      var.t2Branches = {}
      var.t2Branches['t2-power'] = 'power'
      var.t2Branches['t2-control'] = 'control'
      var.t2Branches['t2-fortune'] = 'fortune'
      var.t2Children = {}
      var.t2Children['power'] = ['steady', 'swift']
      var.t2Children['control'] = ['pressure', 'focus']
      var.t2Children['fortune'] = ['lucky', 'endure']
      // 节点颜色映射
      var.treeColors = {}
      var.treeColors['steady'] = ['48,156,82,255', '72,238,112,255']
      var.treeColors['swift'] = ['34,138,170,255', '48,208,248,255']
      var.treeColors['pressure'] = ['172,48,48,255', '248,70,70,255']
      var.treeColors['focus'] = ['144,54,180,255', '212,86,248,255']
      var.treeColors['lucky'] = ['180,138,30,255', '252,198,42,255']
      var.treeColors['endure'] = ['180,110,20,255', '255,165,0,255']
      var.treeColors['meta'] = ['120,120,120,255', '180,180,180,255']
      // 角度参数（弧度）
      var.angleT4 = math.PI() / 12
      var.angleT5 = math.PI() / 12
      var.angleT6a = math.PI() / 8
      var.angleT6b = math.PI() / 24
      var.angleT7a = math.PI() / 8
      var.angleT7b = math.PI() / 24
      // 联动角度偏移
      var.angleLinkBase = math.PI() / 36
      var.angleLinkStep = math.PI() / 60
      // 拖拽滚动状态
      var.isDragging = false
      var.dragStartMX = 0
      var.dragStartMY = 0
      var.dragStartSX = 0
      var.dragStartSY = 0
      var.dragMoved = false
      // 缩放状态
      var.zoomScale = 1.0
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.s = s    open: |-
      Packet.send(var.packetId, 'refresh_talents')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.s = s
      var.needRebuild = true
    keyPress: |-
      // R 键重置缩放和滚动位置
      if(self.currentKeyPress == 'R' || self.currentKeyPress == 'r'){
        var.zoomScale = 1.0
        val.横向滑块.setDragXRatio(0)
        val.竖向滑块.setDragYRatio(0)
        var.needRebuild = true
      }
    releaseLeft: |-
      // 兜底：确保拖拽状态在鼠标移出滚动区后释放时也能重置
      var.isDragging = false
    # tick: 数据变化时重建中心发散天赋网络
    tick: |-
      // 拖拽中：位移超过阈值才滚动
      if(var.isDragging){
        dx = (Mouse.x() - var.dragStartMX) / var.s
        dy = (Mouse.y() - var.dragStartMY) / var.s
        if(!var.dragMoved){
          if(dx * dx + dy * dy > 25){
            var.dragMoved = true
          }
        }
        if(var.dragMoved){
          scrollRangeX = var.canvasW * var.zoomScale - (var.contentW - 48)
          scrollRangeY = var.canvasH * var.zoomScale - (var.viewH - 236)
          if(scrollRangeX > 0){
            newSX = var.dragStartSX - dx / scrollRangeX
            if(newSX < 0){ newSX = 0 }
            if(newSX > 1){ newSX = 1 }
            val.横向滑块.setDragXRatio(newSX)
          }
          if(scrollRangeY > 0){
            newSY = var.dragStartSY - dy / scrollRangeY
            if(newSY < 0){ newSY = 0 }
            if(newSY > 1){ newSY = 1 }
            val.竖向滑块.setDragYRatio(newSY)
          }
        }
      }
      if(var.needRebuild){
        var.needRebuild = false
        var.iconDelay = 2
        z = var.zoomScale
        // 清理动态控件
        while(val.树画布.childrenCount() > 3){
          val.树画布.get(3).remove()
        }
        // 辅助：根据 tree 和 branch 计算节点角度
        var.nodePositions = {}
        // 收集所有节点
        var.allNodes = []
        var.allNodeById = {}
        for(treeKey in var.trees){
          treeData = var.trees[treeKey]
          if(treeData != none){
            nodes = treeData['nodes']
            count = treeData['nodeCount']
            if(count == none){ count = 0 }
            for(i in range(0, count - 1)){
              node = nodes[i.round()]
              if(node != none){
                var.allNodes.add(node)
                var.allNodeById[node['id']] = node
              }
            }
          }
        }
        // 联动节点也加入
        for(i in range(0, var.linkCount - 1)){
          link = var.links[i.round()]
          if(link != none){
            var.allNodes.add(link)
            var.allNodeById[link['id']] = link
          }
        }
        // 第一遍：计算所有节点位置
        for(node in var.allNodes){
          id = node['id']
          tier = type.toNumber(node['tier']).round()
          branch = node['branch']
          treeId = node['treeId']
          // 计算角度和半径
          angle = 0
          R = 0
          if(tier == 1){
            angle = 0
            R = var.R1
          }
          if(tier == 2){
            // 3 个 T2 均匀分布在 360°
            if(branch == 'power'){ angle = -math.PI() / 2 }
            if(branch == 'control'){ angle = math.PI() / 6 }
            if(branch == 'fortune'){ angle = 5 * math.PI() / 6 }
            R = var.R2
          }
          if(tier == 3){
            // T3 是 6 棵树的根
            ti = treeId == 'steady' ? 0 : (treeId == 'swift' ? 1 : (treeId == 'pressure' ? 2 : (treeId == 'focus' ? 3 : (treeId == 'lucky' ? 4 : 5))))
            angle = -math.PI() / 2 + ti * math.PI() / 3
            R = var.R3
          }
          if(tier == 4 || tier == 5){
            ti = treeId == 'steady' ? 0 : (treeId == 'swift' ? 1 : (treeId == 'pressure' ? 2 : (treeId == 'focus' ? 3 : (treeId == 'lucky' ? 4 : 5))))
            baseAngle = -math.PI() / 2 + ti * math.PI() / 3
            angleOff = branch == 'a' ? -var.angleT4 : var.angleT4
            if(tier == 5){ angleOff = branch == 'a' ? -var.angleT5 : var.angleT5 }
            angle = baseAngle + angleOff
            R = tier == 4 ? var.R4 : var.R5
          }
          if(tier == 6 || tier == 7){
            ti = treeId == 'steady' ? 0 : (treeId == 'swift' ? 1 : (treeId == 'pressure' ? 2 : (treeId == 'focus' ? 3 : (treeId == 'lucky' ? 4 : 5))))
            baseAngle = -math.PI() / 2 + ti * math.PI() / 3
            angleOff = 0
            if(branch == 'a'){ angleOff = -var.angleT6a }
            if(branch == 'b'){ angleOff = -var.angleT6b }
            if(branch == 'c'){ angleOff = var.angleT6b }
            if(branch == 'd'){ angleOff = var.angleT6a }
            if(tier == 7){
              if(branch == 'a'){ angleOff = -var.angleT7a }
              if(branch == 'b'){ angleOff = -var.angleT7b }
              if(branch == 'c'){ angleOff = var.angleT7b }
              if(branch == 'd'){ angleOff = var.angleT7a }
            }
            angle = baseAngle + angleOff
            R = tier == 6 ? var.R6 : var.R7
          }
          if(tier == 0 || treeId == ''){
            // 联动节点（tier 0，无 tree）
            // 解析前置中的 T3 或前一级联动
            prereqs = node['prerequisites']
            // 基础联动（两个 T3）
            if(prereqs.size() == 2 && !prereqs[0].startsWith('link-')){
              p1 = prereqs[0]
              p2 = prereqs[1]
              n1 = var.allNodeById[p1]
              n2 = var.allNodeById[p2]
              if(n1 != none && n2 != none){
                a1 = var.nodePositions[p1][2]
                a2 = var.nodePositions[p2][2]
                angle = (a1 + a2) / 2
              }
              R = var.RlinkA
            }
            // 二级/三级联动（前置是 link）
            if(prereqs.size() >= 1 && prereqs[0].startsWith('link-')){
              parentId = prereqs[0]
              parent = var.allNodeById[parentId]
              if(parent != none){
                angle = var.nodePositions[parentId][2]
                R = var.nodePositions[parentId][3] + 40
              }
            }
          }
          worldX = var.centerX + R * math.cos(angle)
          worldY = var.centerY + R * math.sin(angle)
          var.nodePositions[id] = [worldX, worldY, angle, R]
        }
        // 第二遍：创建所有节点
        for(node in var.allNodes){
          id = node['id']
          pos = var.nodePositions[id]
          if(pos == none){ continue }
          treeId = node['treeId']
          if(treeId == ''){ treeId = 'meta' }
          n = val.天赋节点模板.copy('节点_' + id)
          n.entryId = id
          n.treeId = treeId
          n.isLink = (node['tier'] == 0)
          n.x = ((pos[0] - var.nodeSize / 2) * z).round()
          n.y = ((pos[1] - var.nodeSize / 2) * z).round()
          n.width = (var.nodeSize * z).round()
          n.height = (var.nodeSize * z).round()
        }
        // 第三遍：创建连线（父节点 → 子节点）
        for(node in var.allNodes){
          childId = node['id']
          childPos = var.nodePositions[childId]
          if(childPos == none){ continue }
          prereqs = node['prerequisites']
          if(prereqs == none || prereqs.size() == 0){ continue }
          for(prereq in prereqs){
            parentPos = var.nodePositions[prereq]
            if(parentPos == none){ continue }
            x1 = parentPos[0]
            y1 = parentPos[1]
            x2 = childPos[0]
            y2 = childPos[1]
            ldx = x2 - x1
            ldy = y2 - y1
            len = math.sqrt(ldx * ldx + ldy * ldy)
            if(len == 0){ continue }
            angDeg = math.atan2(ldy, ldx) * 180 / math.PI()
            midX = (x1 + x2) / 2
            midY = (y1 + y2) / 2
            // 颜色：子节点点亮用亮色，否则用父节点颜色
            childUnlocked = node['unlocked'] == true
            treeId = node['treeId']
            if(treeId == ''){ treeId = 'meta' }
            dimColor = var.treeColors[treeId][0]
            brightColor = var.treeColors[treeId][1]
            lineColor = childUnlocked ? brightColor : dimColor
            if(treeId == 'meta'){
              lineColor = childUnlocked ? '180,180,180,255' : '100,100,100,255'
            }
            line = val.联动连线段.copy('线_' + childId + '_' + prereq)
            line.x = ((midX - len / 2) * z).round()
            line.y = ((midY - var.lineW / 2) * z).round()
            line.width = (len * z).round()
            line.height = (var.lineW * z).round()
            line.rotate = angDeg
            line.normal = lineColor
            line.visible = true
          }
        }
      }
      if(var.iconDelay > 0){
        var.iconDelay = var.iconDelay - 1
        if(var.iconDelay == 0){
          for(ci in range(3, val.树画布.childrenCount() - 1)){
            ctrl = val.树画布.get(ci.round())
            if(ctrl != none && ctrl.entry != none && ctrl['节点图标'] != none){
              ctrl['节点图标'].setItemIcon(ctrl.entry['iconJson'])
            }
          }
        }
      }# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;12,22,38,110
  # 自适配布局：宽高 = 设计分辨率 1920x1080
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~80,200,220,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~50,170,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f钓鱼"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 168
              width: 1
              height: 30
              normal: ~80,200,220,230
          页名:
            type: Text
            attribute:
              point: ~middle_left
              x: 188
              texts: "~&f天赋树"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 40
                  texts: "~&f✕"
                  fontSize: 32
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~80,200,220,240
          导航总览:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_main')
            children:
              总览底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              总览文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f总览"
                  fontSize: 36
                  through: true
          导航图鉴:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_collection')
            children:
              图鉴底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              图鉴文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f图鉴"
                  fontSize: 36
                  through: true
          导航奖励:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_rewards')
            children:
              奖励底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              奖励文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f奖励"
                  fontSize: 36
                  through: true
          导航天赋:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
            children:
              天赋底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~50,170,200,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~50,170,200,230
              天赋高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~50,170,200,255
                  shape: ~round_rect
                  radius: 2
              天赋文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0天赋"
                  fontSize: 36
          导航任务:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 282
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_tasks')
            children:
              任务底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              任务文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f任务"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 364
              width: 264
              height: 2
              normal: ~80,200,220,220
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -84
              texts: "~&fESC 关闭界面"
              fontSize: 28
          重置天赋按钮:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 14
              y: -18
              width: 272
              height: 52
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'reset_talents')
            children:
              重置底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              重置文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 272
                  texts: "~&f↻ 重置天赋树"
                  fontSize: 30
                  through: true

      # ── 内容区（天赋树画布）──────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~80,200,220,240

          # 天赋点信息栏
          信息栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 16
              width: "var.contentW - 48"
              height: 48
            children:
              信息背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 2
                    color: ~80,200,220,230
              信息文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 20
                  width: 800
                  texts: "'&f天赋树 &7| &a可用: &f' + var.unspentTalentPoints.round() + ' &7/ &f' + var.talentPoints.round() + '  &7| &f等级: &e' + var.playerLevel.round() + '  &7| &b缩放: &f' + (var.zoomScale * 100).round() + '% &7[&fR重置&7]'"
                  fontSize: 26
              重置按钮:
                type: Canvas
                attribute:
                  point: ~middle_right
                  x: -12
                  width: 120
                  height: 34
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'reset_talents')
                children:
                  重置按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~80,30,30,200
                      hover: ~180,50,50,230
                      shape: ~round_rect
                      radius: 8
                    effect:
                      stroke:
                        width: 2
                        color: ~200,80,80,160
                  重置按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 120
                      texts: "~&f↻ 重置"
                      fontSize: 30
                      through: true

          # 滚动区：五系与联动节点常驻显示（拖拽滚动 + 滚轮缩放）
          滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 76
              width: "var.contentW - 48"
              height: "var.viewH - 236"
              moveX: "self.parent['横向滑块'].getDragXRatio()"
              moveY: "self.parent['竖向滑块'].getDragYRatio()"
            action:
              clickLeft: |-
                var.isDragging = true
                var.dragStartMX = Mouse.x()
                var.dragStartMY = Mouse.y()
                var.dragStartSX = val.横向滑块.getDragXRatio()
                var.dragStartSY = val.竖向滑块.getDragYRatio()
                var.dragMoved = false
              releaseLeft: |-
                var.isDragging = false
              wheel: |-
                // 滚轮缩放：wheelValue > 0 放大，< 0 缩小
                oldZoom = var.zoomScale
                delta = self.wheelValue > 0 ? 0.1 : -0.1
                newZoom = oldZoom + delta
                if(newZoom < 0.5){ newZoom = 0.5 }
                if(newZoom > 2.0){ newZoom = 2.0 }
                if(newZoom != oldZoom){
                  // 保持滚动位置：通过滑块 ratio 换算
                  viewW = var.contentW - 48
                  viewH = var.viewH - 236
                  oldRangeX = var.canvasW * oldZoom - viewW
                  newRangeX = var.canvasW * newZoom - viewW
                  oldRangeY = var.canvasH * oldZoom - viewH
                  newRangeY = var.canvasH * newZoom - viewH
                  oldSX = val.横向滑块.getDragXRatio()
                  oldSY = val.竖向滑块.getDragYRatio()
                  if(newRangeX > 0){
                    newSX = oldRangeX > 0 ? oldSX * oldRangeX / newRangeX : 0
                    if(newSX < 0){ newSX = 0 }
                    if(newSX > 1){ newSX = 1 }
                  } else {
                    newSX = 0
                  }
                  if(newRangeY > 0){
                    newSY = oldRangeY > 0 ? oldSY * oldRangeY / newRangeY : 0
                    if(newSY < 0){ newSY = 0 }
                    if(newSY > 1){ newSY = 1 }
                  } else {
                    newSY = 0
                  }
                  var.zoomScale = newZoom
                  var.needRebuild = true
                  // 重建后设置滑块位置
                  val.横向滑块.setDragXRatio(newSX)
                  val.竖向滑块.setDragYRatio(newSY)
                }
            children:
              树画布:
                val: 树画布
                type: Canvas
                attribute:
                  width: "var.canvasW * var.zoomScale"
                  height: "var.canvasH * var.zoomScale"
                children:
                  # 树标题模板
                  树标题模板:
                    type: Canvas
                    val: 树标题模板
                    attribute:
                      width: "(200 * var.zoomScale).round()"
                      height: "(40 * var.zoomScale).round()"
                      treeId: 'steady'
                      visible: false
                    children:
                      树标题文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: "(200 * var.zoomScale).round()"
                          texts: "var.treeNames[self.parent.treeId] != none ? var.treeNames[self.parent.treeId] : '&7未知'"
                          fontSize: "(34 * var.zoomScale).round()"
                          through: true
                  # 天赋节点模板（正方形 Slot + 连线 + Tooltip）
                  # tick 中 copy 后设置 entryKey/treeId/treeX/isLink
                  天赋节点模板:
                    type: Canvas
                    val: 天赋节点模板
                    attribute:
                      point: ~top_left
                      entryId: ''
                      treeId: 'steady'
                      isLink: false
                      entry: "self.isLink == true ? var.links[self.entryKey] : (var.trees[self.treeId] != none ? var.trees[self.treeId]['nodes'][self.entryKey] : none)"
                      visible: "self.entry != none"
                      width: "var.nodeSize * var.zoomScale"
                      height: "var.nodeSize * var.zoomScale"
                      brightColor: "self.treeId == 'steady' ? '72,238,112,255' : (self.treeId == 'swift' ? '48,208,248,255' : (self.treeId == 'pressure' ? '248,70,70,255' : (self.treeId == 'focus' ? '212,86,248,255' : (self.treeId == 'lucky' ? '252,198,42,255' : (self.treeId == 'endure' ? '255,165,0,255' : '255,128,42,255')))))"
                      dimColor: "self.treeId == 'steady' ? '48,156,82,255' : (self.treeId == 'swift' ? '34,138,170,255' : (self.treeId == 'pressure' ? '172,48,48,255' : (self.treeId == 'focus' ? '144,54,180,255' : (self.treeId == 'lucky' ? '180,138,30,255' : (self.treeId == 'endure' ? '180,110,20,255' : '190,76,30,255')))))"
                      lineColor: "self.entry != none && self.entry['unlocked'] == true ? self.brightColor : self.dimColor"
                      linkTree1: 'steady'
                      linkTree2: 'steady'
                      linkBright1: "self.linkTree1 == 'steady' ? '82,255,128,255' : (self.linkTree1 == 'swift' ? '60,220,255,255' : (self.linkTree1 == 'pressure' ? '255,78,78,255' : (self.linkTree1 == 'focus' ? '218,95,255,255' : (self.linkTree1 == 'lucky' ? '255,210,55,255' : '255,180,60,255'))))"
                      linkBright2: "self.linkTree2 == 'steady' ? '82,255,128,255' : (self.linkTree2 == 'swift' ? '60,220,255,255' : (self.linkTree2 == 'pressure' ? '255,78,78,255' : (self.linkTree2 == 'focus' ? '218,95,255,255' : (self.linkTree2 == 'lucky' ? '255,210,55,255' : '255,180,60,255'))))"
                      linkDim1: "self.linkTree1 == 'steady' ? '48,165,82,255' : (self.linkTree1 == 'swift' ? '38,145,178,255' : (self.linkTree1 == 'pressure' ? '178,48,48,255' : (self.linkTree1 == 'focus' ? '142,58,178,255' : (self.linkTree1 == 'lucky' ? '184,142,34,255' : '180,120,30,255'))))"
                      linkDim2: "self.linkTree2 == 'steady' ? '48,165,82,255' : (self.linkTree2 == 'swift' ? '38,145,178,255' : (self.linkTree2 == 'pressure' ? '178,48,48,255' : (self.linkTree2 == 'focus' ? '142,58,178,255' : (self.linkTree2 == 'lucky' ? '184,142,34,255' : '180,120,30,255'))))"
                      linkColor1: "self.entry != none && self.entry['prerequisiteStates'] != none && self.entry['prerequisiteStates'][0] == true ? self.linkBright1 : self.linkDim1"
                      linkColor2: "self.entry != none && self.entry['prerequisiteStates'] != none && self.entry['prerequisiteStates'][1] == true ? self.linkBright2 : self.linkDim2"
                      # 节点等级状态：0=未点亮, 1~maxLevel-1=部分升级, maxLevel=满级
                      nodeLevel: "self.entry != none && self.entry['level'] != none ? type.toNumber(self.entry['level']).round() : 0"
                      nodeMaxLevel: "self.entry != none && self.entry['maxLevel'] != none ? type.toNumber(self.entry['maxLevel']).round() : 1"
                      isMaxed: "self.nodeLevel >= self.nodeMaxLevel"
                    children:
                      # 节点图标（Slot 显示物品 icon）
                      节点图标:
                        type: Slot
                        attribute:
                          point: ~middle_center
                          width: "46 * var.zoomScale"
                          height: "46 * var.zoomScale"
                          slotType: ~Icon
                          itemScale: 0.75
                          normal: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? '24,30,38,255' : '16,20,28,255'"
                          shape: ~round_rect
                          radius: "(10 * var.zoomScale).round()"
                          seticon: "self.setItemIcon(self.parent.entry != none ? self.parent.entry['iconJson'] : var.emptyItemJson)"
                        effect:
                          stroke:
                            width: "(self.parent.entry != none && self.parent.entry['unlocked'] == true ? 5 : 3) * var.zoomScale"
                            color: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? self.parent.brightColor : self.parent.dimColor"
                          neon:
                            color: "self.parent.brightColor"
                            size: "(5 * var.zoomScale).round()"
                            intensity: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? 1 : 0"
                            animated: false
                        action:
                          clickLeft: |-
                            if(self.parent.entry != none){
                              if(self.parent.entry['canLevelUp'] == true){
                                Packet.send(var.packetId, 'level_up_talent', self.parent.entry['id'])
                              }
                            }
                      # 等级标签（右下角显示 当前等级/最大等级）
                      等级标签:
                        type: Canvas
                        attribute:
                          point: ~bottom_right
                          x: "(-2 * var.zoomScale).round()"
                          y: "(-2 * var.zoomScale).round()"
                          width: "(24 * var.zoomScale).round()"
                          height: "(14 * var.zoomScale).round()"
                          visible: "self.parent.entry != none && self.parent.entry['unlocked'] == true && self.parent.nodeMaxLevel > 1"
                        children:
                          等级标签底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.parent.isMaxed ? '40,80,40,220' : '20,30,45,220'"
                              shape: ~round_rect
                              radius: "(4 * var.zoomScale).round()"
                          等级文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: "(24 * var.zoomScale).round()"
                              texts: "self.parent.parent.nodeLevel + '/' + self.parent.parent.nodeMaxLevel"
                              fontSize: "(12 * var.zoomScale).round()"
                              through: true
                  # 联动连线段模板（作为树画布直接子控件，避免节点 Canvas 裁剪）
                  # tick 中 copy 后设置世界坐标 x/y/width/height/normal/visible
                  联动连线段:
                    type: Texture
                    val: 联动连线段
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      width: 1
                      height: 1
                      normal: ~120,120,120,255
                      visible: false
                      through: true
          # 操作提示（拖拽滚动 + 滚轮缩放）
          操作提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 24
              y: -8
              texts: "'&7拖拽滚动 &f| &7滚轮缩放 &f| &7R重置'"
              fontSize: 20
              shadow: true
          # 隐藏滑块：驱动 Scroll 的 moveX/moveY（不显示，仅用于程序化控制滚动位置）
          竖向滑块:
            type: Texture
            val: 竖向滑块
            attribute:
              visible: false
              width: 12
              height: 120
              normal: ~50,170,200,220
              maxDragY: "var.canvasH * var.zoomScale - (var.viewH - 236)"
          横向滑块:
            type: Texture
            val: 横向滑块
            attribute:
              visible: false
              width: 160
              height: 12
              normal: ~50,170,200,220
              maxDragX: "var.canvasW * var.zoomScale - (var.contentW - 48)"
