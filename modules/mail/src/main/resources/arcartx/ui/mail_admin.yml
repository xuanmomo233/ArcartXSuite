# AXS Mail 管理后台（翠绿信使重写版）
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航 + 内容区
# 布局: 左导航(收件箱/日志/写信/兑换码/管理) + 内容区(列表视图/编辑视图 切换)
# 配色: 翠绿信使 主色80,180,120 底30,32,38,110 抬升36,38,48,245 描边60,64,82,220
# 特殊: match 替换物品栏界面，through:true 让槽位可交互，background:false 无遮罩
# 逻辑: packetHandler 接收 preset-list/preset-detail/attachment-count/result；var.view 控制列表/编辑切换

ui:
  match:
    - AXS Mail Admin
  isHud: false
  background: false
  escClose: true
  closeDied: true
  show: true
  through: true
  screenScale: true
  level: 8
  itemSize: 16
  action:
    load: |-
      var.view = 'list'
      var.resultMsg = none
      var.editItemCount = 0
      var.maxPresetCount = 0
      var.isAdmin = false
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send('AXS_MAIL', 'admin-preset-list')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
  packetHandler:
    # packetHandler: preset-list
    # 包字段:
    #   - presets: 预设列表（Map，键为索引，每项含 id/displayName/subject/enabled/attachmentCount/commandCount）
    #   - total: 预设总数
    #   - maxPresetCount: 预设列表最大显示条数
    #   - is_admin: 当前玩家是否为管理员
    preset-list: |-
      var.presets = packet['presets']
      var.total = packet['total']
      var.maxPresetCount = packet['maxPresetCount']
      var.isAdmin = packet['is_admin']
      while(val.preset_data.childrenCount() > 1){
        val.preset_data.get(1).remove()
      }
      for(i in range(1, var.maxPresetCount - 1)){
        key = i.round()
        e = val.preset_data['预设行'].copy('预设行' + key)
        e.entryKey = key
      }
    # packetHandler: preset-detail
    # 包字段: id/enabled/displayName/subject/body/expiresAfterDays/currencyAttachments/itemAttachmentCount/claimCommands/claimConditions/found
    preset-detail: |-
      var.editId = packet['id']
      var.editEnabled = packet['enabled']
      var.editDisplayName = packet['displayName']
      var.editSubject = packet['subject']
      var.editBody = packet['body']
      var.editExpiresDays = packet['expiresAfterDays']
      var.editCurrencies = packet['currencyAttachments']
      var.editItemCount = packet['itemAttachmentCount'].round()
      var.editCommands = packet['claimCommands']
      var.editConditions = packet['claimConditions']
      var.editFound = packet['found']
      var.view = 'edit'
      var.resultMsg = none
    # packetHandler: attachment-count
    # 包字段: itemAttachmentCount
    attachment-count: |-
      var.editItemCount = packet['itemAttachmentCount'].round()
    # packetHandler: result
    # 包字段: success/message
    result: |-
      var.resultMsg = packet['message']
      if(packet['success']){
        var.view = 'list'
      }

# ─── 控件树 ────────────────────────────────────────────────────────
# 布局: 顶栏(标题色块+标题+关闭) + 左导航(5项) + 内容区(列表/编辑切换)
# 配色: 翠绿信使 深底浅字 — 抬升面36,38,48 描边60,64,82 强调80,180,120
# fontSize: 48(顶栏标题) / 36(区域标题/按钮/信息) / 32(小标签) — 全部标准档位
controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;30,32,38,110
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~60,64,82,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~80,180,120,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f邮件管理"
              fontSize: 48
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '60,64,82,220'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ──────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~60,64,82,220
          导航收件箱:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'open')
            children:
              收件箱底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '60,64,82,220'"
              收件箱文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f收件箱"
                  fontSize: 36
                  through: true
          导航日志:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'logs')
            children:
              日志底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '60,64,82,220'"
              日志文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f日志"
                  fontSize: 36
                  through: true
          导航写信:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'compose')
            children:
              写信底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '60,64,82,220'"
              写信文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f写信"
                  fontSize: 36
                  through: true
          导航兑换码:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'open')
            children:
              兑换码底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '60,64,82,220'"
              兑换码文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f兑换码"
                  fontSize: 36
                  through: true
          # 当前页：管理
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 282
              width: 272
              height: 58
              visible: "var.isAdmin == true"
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~80,180,120,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~80,180,120,230
              管理高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~80,180,120,255
                  shape: ~round_rect
                  radius: 2
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0管理"
                  fontSize: 36
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 364
              width: 264
              height: 2
              normal: ~60,64,82,220
          操作标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 382
              texts: "~&f快捷操作"
              fontSize: 36
          刷新列表按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 428
              width: 272
              height: 48
            action:
              clickLeft: |-
                var.view = 'list'
                Packet.send('AXS_MAIL', 'admin-preset-list')
            children:
              刷新列表底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '60,64,82,220'"
              刷新列表文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f刷新列表"
                  fontSize: 36
                  through: true
          新建预设按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 488
              width: 272
              height: 48
            action:
              clickLeft: |-
                var.editId = none
                var.editEnabled = true
                var.editDisplayName = none
                var.editSubject = none
                var.editBody = none
                var.editExpiresDays = 15
                var.editCurrencies = none
                var.editItemCount = 0
                var.editCommands = none
                var.editConditions = none
                var.editFound = false
                var.view = 'edit'
                var.resultMsg = none
                Packet.send('AXS_MAIL', 'admin-preset-new')
            children:
              新建预设底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~80,180,120,230
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: ~80,180,120,230
              新建预设文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0新建预设"
                  fontSize: 36
                  through: true

      # ── 内容区 ──────────────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          # ── 列表视图 ───────────────────────────────────
          列表视图:
            type: Canvas
            attribute:
              point: ~stretch_all
              visible: "var.view == 'list' || var.view == none"
            children:
              列表底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~Frosted:30;255,255,255,60
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 3
                    color: ~60,64,82,220
              # 表头
              表头:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 16
                  y: 12
                  width: "self.parent.width - 32"
                  height: 40
                children:
                  表头底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 8
                    effect:
                      stroke:
                        width: 2
                        color: ~60,64,82,220
                  编号列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 14
                      texts: "~&fID"
                      fontSize: 32
                  名称列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 200
                      texts: "~&f显示名"
                      fontSize: 32
                  主题列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 440
                      texts: "~&f标题"
                      fontSize: 32
                  启用列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 700
                      texts: "~&f启用"
                      fontSize: 32
                  操作列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 820
                      texts: "~&f操作"
                      fontSize: 32
              # 预设滑轨
              预设滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -12
                  y: 64
                  width: 10
                  height: "self.parent.height - 80"
                  normal: ~40,44,52,225
                  shape: ~round_rect
                  radius: 5
                effect:
                  stroke:
                    width: 2
                    color: ~120,220,160,230
              # 预设滑块
              预设滑块:
                type: Texture
                val: 预设滑块
                attribute:
                  point: ~top_right
                  x: -12
                  y: 64
                  width: 10
                  height: 50
                  normal: ~80,180,120,230
                  maxDragY: "self.parent.height - 130"
                  shape: ~round_rect
                  radius: 5
              # 预设列表
              列表滚动栏:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 16
                  y: 64
                  width: "self.parent.width - 44"
                  height: "self.parent.height - 80"
                  moveY: "self.parent.parent['预设滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent.parent['预设滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent.parent['预设滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  preset_stack:
                    val: preset_data
                    type: VStack
                    attribute:
                      width: "self.parent.width - 24"
                      spaceBetween: 6
                    children:
                      预设行:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.presets[self.entryKey]
                          width: "self.parent.width"
                          height: 56
                          visible: "self.entry != none"
                        children:
                          行底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~36,38,48,245
                              shape: ~round_rect
                              radius: 8
                            effect:
                              stroke:
                                width: 2
                                color: "self.isHovered() ? '120,220,160,255' : '60,64,82,220'"
                          行编号:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 14
                              texts: "self.parent.entry['id']"
                              fontSize: 32
                          行名称:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 200
                              texts: "self.parent.entry['displayName']"
                              fontSize: 32
                          行主题:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 440
                              texts: "self.parent.entry['subject']"
                              fontSize: 32
                          行启用:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 700
                              texts: "self.parent.entry['enabled'] ? '&a✔' : '&c✖'"
                              fontSize: 32
                          编辑按钮:
                            type: Canvas
                            attribute:
                              point: ~middle_left
                              x: 820
                              width: 72
                              height: 36
                            action:
                              clickLeft: |-
                                Packet.send('AXS_MAIL', 'admin-preset-get', self.parent.entry['id'])
                            children:
                              编辑底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~36,38,48,245
                                  shape: ~round_rect
                                  radius: 8
                                effect:
                                  stroke:
                                    width: 2
                                    color: "self.isHovered() ? '120,220,160,255' : '60,64,82,220'"
                              编辑文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "~&f编辑"
                                  fontSize: 32
                                  through: true
                          发送按钮:
                            type: Canvas
                            attribute:
                              point: ~middle_left
                              x: 900
                              width: 72
                              height: 36
                            action:
                              clickLeft: |-
                                Packet.send('AXS_MAIL', 'admin-preset-send', self.parent.entry['id'], 'all-online')
                            children:
                              发送底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~80,180,120,230
                                  shape: ~round_rect
                                  radius: 8
                                effect:
                                  stroke:
                                    width: 2
                                    color: ~80,180,120,230
                              发送文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "~&0派发"
                                  fontSize: 32
                                  through: true
                          删除按钮:
                            type: Canvas
                            attribute:
                              point: ~middle_left
                              x: 980
                              width: 72
                              height: 36
                            action:
                              clickLeft: |-
                                Packet.send('AXS_MAIL', 'admin-preset-delete', self.parent.entry['id'])
                            children:
                              删除底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~36,38,48,245
                                  shape: ~round_rect
                                  radius: 8
                                effect:
                                  stroke:
                                    width: 2
                                    color: "self.isHovered() ? '235,100,100,255' : '60,64,82,220'"
                              删除文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "~&f删除"
                                  fontSize: 32
                                  through: true
              # 空列表提示
              空状态提示:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&8暂无预设，点击左侧新建预设开始创建"
                  fontSize: 36
                  visible: "var.presets == none || var.total == 0"
              # 结果提示
              结果提示:
                type: Text
                attribute:
                  point: ~bottom_left
                  x: 16
                  y: -8
                  texts: "var.resultMsg != none ? '&e' + var.resultMsg : ''"
                  fontSize: 32

          # ── 编辑视图 ───────────────────────────────────
          编辑视图:
            type: Canvas
            attribute:
              point: ~stretch_all
              visible: "var.view == 'edit'"
            children:
              编辑底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~Frosted:30;255,255,255,60
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 3
                    color: ~60,64,82,220
              # 返回按钮
              返回按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 16
                  y: 12
                  width: 100
                  height: 40
                action:
                  clickLeft: |-
                    var.view = 'list'
                    Packet.send('AXS_MAIL', 'admin-preset-cancel')
                    Packet.send('AXS_MAIL', 'admin-preset-list')
                children:
                  返回底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '120,220,160,255' : '60,64,82,220'"
                  返回文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f返回"
                      fontSize: 36
                      through: true
              编辑标题:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 130
                  y: 12
                  texts: "var.editFound ? '&f编辑预设: &f' + var.editId : '&f新建预设'"
                  fontSize: 36
              # 左侧表单
              编号标签:
                type: Text
                attribute:
                  point: ~top_left
                  x: 16
                  y: 72
                  texts: "~&f预设 ID"
                  fontSize: 32
              输入编号框:
                type: ChatTextBox
                attribute:
                  point: ~top_left
                  x: 16
                  y: 104
                  width: 320
                  height: 40
                  fontSize: 36
                  background: ~36,38,48,245
                  shape: ~round_rect
