# AXS 钓鱼小游戏界面（Menu 模式，支持鼠标/键盘交互）
# 数据交互: packetHandler init/update
# 海洋主题 + 左侧竖直轨道（鱼/绿条竖直运动）+ 底部横向进度条 + 结果覆盖层
# 结束时服务端发送 state=success/failed 最终结果包，展示结果约1.5秒后由服务端关闭

ui:
  isHud: false  # Menu模式，弹光标界面，捕获鼠标/键盘交互
  background: false  # 不渲染半透明背景遮罩（保持游戏画面可见）
  escClose: false  # 按ESC不关闭（由服务端控制关闭）
  closeDied: true  # 玩家死亡时自动关闭
  through: false  # 不允许点击穿透，确保小游戏捕获交互
  screenScale: true  # 启用屏幕等比缩放
  show: false  # 由服务端 openUi/closeUi 控制显示
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包标识符，用于回传玩家输入
    #   - fishId: 当前钓到的鱼的ID
    #   - fishName: 当前鱼的显示名称
    #   - fishY: 鱼在轨道中的垂直位置（0.0~1.0，1为顶部）
    #   - barY: 绿色目标条的垂直中心位置（0.0~1.0）
    #   - barHeight: 绿色目标条的高度比例（0.0~1.0）
    #   - progress: 钓鱼进度值（0.0~1.0，1.0为完成）
    #   - state: 小游戏状态（playing/success/failed）
    #   - timeLeft: 剩余时间（ticks）
    #   - caughtSize: 已捕获鱼的尺寸数值
    #   - rarity: 鱼的稀有度等级（common/uncommon/rare/legendary）
    init: |-
      var.packetId = packet['packetId']
      var.fishId = packet['fishId']
      var.fishName = packet['fishName']
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.caughtSize = packet['caughtSize']
      var.rarity = packet['rarity']
      var.fishInside = false
      var.rarityTag = var.rarity == 'legendary' ? '&6' : (var.rarity == 'rare' ? '&9' : (var.rarity == 'uncommon' ? '&a' : '&f'))
      var.rarityLabel = var.rarity == 'legendary' ? '传说' : (var.rarity == 'rare' ? '稀有' : (var.rarity == 'uncommon' ? '罕见' : '普通'))
    # packetHandler: update
    # 包字段:
    #   - fishY: 鱼在轨道中的垂直位置（0.0~1.0）
    #   - barY: 绿色目标条的垂直中心位置（0.0~1.0）
    #   - barHeight: 绿色目标条的高度比例（0.0~1.0）
    #   - progress: 钓鱼进度值（0.0~1.0）
    #   - state: 小游戏状态（playing/success/failed）
    #   - timeLeft: 剩余时间（ticks）
    #   - fishInside: 鱼是否在绿色目标条内（布尔）
    update: |-
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.fishInside = packet['fishInside']
  action:
    # load: 控件初始化前设置默认变量（等待服务端 init 包覆盖）
    load: |-
      var.packetId = 'AXS_FISHING'
      var.fishId = none
      var.fishName = ''
      var.fishY = 0.5
      var.barY = 0.5
      var.barHeight = 0.24
      var.progress = 0.5
      var.state = none
      var.timeLeft = 600
      var.caughtSize = 0
      var.rarity = 'common'
      var.fishInside = false
      var.rarityTag = '&f'
      var.rarityLabel = '普通'
    # open: 控件初始化后，向服务端请求 init 数据
    open: |-
      Packet.send(var.packetId, 'open_minigame')
    # keyPress: 按下空格键时向服务端发送 input=true
    keyPress: |-
      if(self.currentKeyPress() == ' ' || self.currentKeyPress() == 'SPACE'){
        Packet.send(var.packetId, 'input', true)
      }
    # keyRelease: 松开空格键时向服务端发送 input=false
    keyRelease: |-
      if(self.currentKeyReleased() == ' ' || self.currentKeyReleased() == 'SPACE'){
        Packet.send(var.packetId, 'input', false)
      }
    # click: 鼠标按下时向服务端发送 input=true
    click: |-
      Packet.send(var.packetId, 'input', true)
    # release: 鼠标松开时向服务端发送 input=false
    release: |-
      Packet.send(var.packetId, 'input', false)

controls:
  # 自适应全局布局：以1920x1080设计分辨率等比缩放，居中锚点
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      # 左侧竖直轨道区：包含轨道背景、绿色目标条和鱼图标
      钓鱼轨道区:
        type: Canvas
        attribute:
          x: 100
          y: 200
          width: 140
          height: 560
          visible: "var.state != none"
        children:
          轨道背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,25,40,215
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 2
                color: ~50,160,190,120
              shadow:
                xOffset: 0
                yOffset: 2
                blur: 8
                color: ~0,0,0,120

          # 轨道顶部/底部装饰线（海浪刻度感）
          轨道顶线:
            type: Texture
            attribute:
              x: 20
              y: 8
              width: 100
              height: 2
              normal: ~50,160,190,60
              shape: ~round_rect
              radius: 1
          轨道底线:
            type: Texture
            attribute:
              x: 20
              y: 550
              width: 100
              height: 2
              normal: ~50,160,190,60
              shape: ~round_rect
              radius: 1

          # 绿条：玩家控制的目标条（海沫绿）
          绿条:
            type: Texture
            attribute:
              x: 10
              y: "(1 - var.barY - var.barHeight / 2) * 540"
              width: 120
              height: "var.barHeight * 540"
              normal: ~80,220,160,230
              shape: ~round_rect
              radius: 8
              visible: "var.state == 'playing'"
            effect:
              stroke:
                width: 1
                color: ~140,255,200,140

          # 鱼图标：CJK"鱼"字，按稀有度着色
          鱼图标:
            type: Text
            attribute:
              x: 35
              y: "(1 - var.fishY) * 540 - 18"
              width: 70
              texts: "var.rarityTag + '鱼'"
              fontSize: 36
              center: true
              visible: "var.state == 'playing'"
            effect:
              shadow:
                xOffset: 1
                yOffset: 1
                blur: 3
                color: ~0,0,0,200

      # 顶部信息区：轨道右侧横排展示鱼名、稀有度、尺寸、剩余时间、操作提示
      顶部信息区:
        type: Canvas
        attribute:
          x: 280
          y: 200
          width: 560
          height: 150
          visible: "var.state != none"
        children:
          信息背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,28,45,200
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 1
                color: ~50,160,190,80
          鱼名称:
            type: Text
            attribute:
              x: 20
              y: 12
              width: 520
              texts: "var.rarityTag + var.fishName"
              fontSize: 40
          稀有度尺寸:
            type: Text
            attribute:
              x: 20
              y: 58
              width: 520
              texts: "var.rarityTag + '◆ ' + var.rarityLabel + ' &7尺寸: &f' + var.caughtSize"
              fontSize: 24
          剩余时间:
            type: Text
            attribute:
              x: 20
              y: 90
              width: 520
              texts: "'&7剩余时间: &f' + (var.timeLeft / 20).round() + ' 秒'"
              fontSize: 24
          操作提示:
            type: Text
            attribute:
              x: 20
              y: 120
              width: 520
              texts: "~&7按住 空格 / 鼠标 控制绿条追踪鱼"
              fontSize: 20
              visible: "var.state == 'playing'"

      # 底部横向进度条区：显示钓鱼进度（满=成功）
      进度条区:
        type: Canvas
        attribute:
          x: 100
          y: 790
          width: 700
          height: 70
          visible: "var.state != none"
        children:
          进度标签:
            type: Text
            attribute:
              x: 0
              y: 0
              width: 700
              texts: "'&7进度: &f' + (var.progress * 100).round() + '%'"
              fontSize: 22
          进度条背景:
            type: Texture
            attribute:
              x: 0
              y: 28
              width: 700
              height: 34
              normal: ~15,25,38,225
              shape: ~round_rect
              radius: 12
            effect:
              stroke:
                width: 1
                color: ~50,160,190,70
          # 进度条填充：鱼在绿条内=青色，在外=红色，完成=绿色
          进度条填充:
            type: Texture
            attribute:
              x: 3
              y: 31
              width: "var.progress * 694"
              height: 28
              normal: "var.progress >= 1.0 ? '100,220,140,255' : (var.fishInside ? '60,190,220,245' : '220,100,90,245')"
              shape: ~round_rect
              radius: 10

      # 结果覆盖层：成功/失败时居中展示，约1.5秒后由服务端关闭
      结果覆盖层:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 440
          height: 220
          visible: "var.state == 'success' || var.state == 'failed'"
        children:
          结果背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: "var.state == 'success' ? '18,50,35,235' : '55,20,20,235'"
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: "var.state == 'success' ? '100,230,150,180' : '230,100,90,180'"
              shadow:
                xOffset: 0
                yOffset: 4
                blur: 14
                color: ~0,0,0,160
          结果文字:
            type: Text
            attribute:
              x: 0
              y: 40
              width: 440
              texts: "var.state == 'success' ? '&a&l✓ 捕获成功！' : '&c&l✕ 鱼逃走了...'"
              fontSize: 48
              center: true
              through: true
          结果详情:
            type: Text
            attribute:
              x: 0
              y: 120
              width: 440
              texts: "var.state == 'success' ? (var.rarityTag + var.fishName + ' &7尺寸: &f' + var.caughtSize) : '&7再试一次吧'"
              fontSize: 28
              center: true
              through: true
          结果稀有度:
            type: Text
            attribute:
              x: 0
              y: 160
              width: 440
              texts: "var.state == 'success' ? (var.rarityTag + '◆ ' + var.rarityLabel) : ''"
              fontSize: 24
              center: true
              through: true
