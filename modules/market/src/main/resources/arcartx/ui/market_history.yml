# AXS Market — 交易历史界面
# 打开方式: /market history
# 数据交互: packetHandler init/update；客户端 Packet.send(var.packetId, action, ...)

ui:
  isHud: false
  defaultOpen: false
  hide:
    - HUD
  itemSize: 16
  through: false
  escClose: true
  background: false
  closeDied: true
  show: true
  jei: false
  level: 8
  screenScale: true
  action:
    open: |-
      var.packetId = 'AXS_MARKET'
      var.page = 0
      var.totalPages = 1
      var.records = {}
      var.itemJsons = {}
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.maxRecordCount = 0
      Packet.send(var.packetId, 'history_list', '0')
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.page = packet['page']
      var.totalPages = packet['totalPages']
      var.records = packet['records']
      var.itemJsons = {}
      var.maxRecordCount = packet['maxRecordCount']
      for(key in var.records.keys()){
        json = packet['historyItemJson' + key]
        if(json != none){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      while(val.记录列表.childrenCount() > 1){
        val.记录列表.get(1).remove()
      }
      for(i in range(1, var.maxRecordCount - 1)){
        key = i.round()
        e = val.记录列表['记录行'].copy('记录行' + key)
        e.entryKey = key
      }
      for(i in range(0, var.maxRecordCount - 1)){
        key = i.round()
        e = val.记录列表.get(i.round())
        if(e != none && e['物品图标'] != none){
          e['物品图标'].entryKey = key
          e['物品图标'].seticon()
        }
      }
    update: |-
      var.packetId = packet['packetId']
      var.page = packet['page']
      var.totalPages = packet['totalPages']
      var.records = packet['records']
      var.itemJsons = {}
      var.maxRecordCount = packet['maxRecordCount']
      for(key in var.records.keys()){
        json = packet['historyItemJson' + key]
        if(json != none){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      while(val.记录列表.childrenCount() > 1){
        val.记录列表.get(1).remove()
      }
      for(i in range(1, var.maxRecordCount - 1)){
        key = i.round()
        e = val.记录列表['记录行'].copy('记录行' + key)
        e.entryKey = key
      }
      for(i in range(0, var.maxRecordCount - 1)){
        key = i.round()
        e = val.记录列表.get(i.round())
        if(e != none && e['物品图标'] != none){
          e['物品图标'].entryKey = key
          e['物品图标'].seticon()
        }
      }
  defaultOpen: false
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1400
          height: 860
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~32,32,42,238
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~180,160,255,180
              shadow:
                xOffset: 0
                yOffset: 4
                blur: 12
                color: ~0,0,0,140
          标题:
            type: Text
            attribute:
              x: 42
              y: 24
              texts: ~&d交易历史
              fontSize: 100
          关闭按钮:
            type: Texture
            attribute:
              x: 1332
              y: 28
              width: 48
              height: 48
              normal: ~180,70,70,210
              hover: ~Frosted:0;220,90,90,230
              shape: ~round_rect
              radius: 12
            action:
              clickLeft: Screen.close()
            effect:
              stroke:
                width: 1
                color: ~255,130,130,120
            children:
              文字:
                type: Text
                attribute:
                  x: 24
                  y: 9
                  through: true
                  center: true
                  fontSize: 48
                  texts: ~&f✕
          列表卡片:
            type: Canvas
            attribute:
              x: 32
              y: 110
              width: 1336
              height: 670
            children:
              列表卡片背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~42,45,58,220
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 2
                    color: ~180,160,255,100
              列表卡片文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 1336
                  texts: ~&8暂无记录
                  fontSize: 100
                  through: true
              列表纵向滑块:
                type: Texture
                val: 列表纵向滑块
                attribute:
                  x: 1320
                  y: 10
                  width: 6
                  height: 50
                  normal: ~120,120,120,200
                  maxDragY: 600
              列表滚动:
                type: Scroll
                val: 列表滚动
                attribute:
                  x: 10
                  y: 10
                  width: 1310
                  height: 650
                  moveY: "self.parent['列表纵向滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['列表纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['列表纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  记录列表:
                    type: VStack
                    val: 记录列表
                    attribute:
                      width: 1310
                      spaceBetween: 8
                    children:
                      记录行:
                        type: Texture
                        attribute:
                          entryKey: 0.round()
                          entry: var.records[self.entryKey]
                          visible: self.entry != none
                          width: 1310
                          height: 68
                          normal: ~50,53,66,220
                          hover: ~Frosted:0;180,160,255,180
                          shape: ~round_rect
                          radius: 14
                        effect:
                          stroke:
                            width: 1
                            color: ~180,160,255,60
                        children:
                          物品图标:
                            type: Slot
                            attribute:
                              entryKey: 0.round()
                              slotType: ~Icon
                              itemScale: 1.0
                              x: 12
                              y: 4
                              width: 56
                              height: 56
                              normal: ~40,42,54,220
                              shape: ~round_rect
                              radius: 10
                              through: true
                              seticon: self.setItemIcon(var.itemJsons[self.entryKey])
                          类型:
                            type: Text
                            attribute:
                              x: 84
                              y: 8
                              width: 140
                              texts: "self.parent.entry != none ? self.parent.entry['typeColor'] + self.parent.entry['typeText'] : none"
                              fontSize: 36
                              through: true
                          物品名:
                            type: Text
                            attribute:
                              x: 240
                              y: 8
                              width: 300
                              texts: "self.parent.entry != none ? '&f' + self.parent.entry['itemName'] : none"
                              fontSize: 36
                              through: true
                          对方:
                            type: Text
                            attribute:
                              x: 240
                              y: 40
                              width: 200
                              texts: "self.parent.entry != none ? '&7' + self.parent.entry['counterpart'] : none"
                              fontSize: 22
                              through: true
                          金额:
                            type: Text
                            attribute:
                              x: 580
                              y: 14
                              width: 280
                              texts: "'&e' + self.parent.entry['amount'].round()"
                              fontSize: 32
                              through: true
                          时间:
                            type: Text
                            attribute:
                              x: 900
                              y: 14
                              width: 380
                              texts: "self.parent.entry != none ? '&7' + self.parent.entry['time'] : none"
                              fontSize: 28
                              through: true
          上一页:
            type: Canvas
            attribute:
              x: 32
              y: 794
              width: 120
              height: 48
            action:
              clickLeft: |-
                if(var.page > 0){
                  Packet.send(var.packetId, 'history_list', (var.page - 1))
                }
            children:
              上一页背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,62,74,205
                  hover: ~Frosted:0;255,255,255,80
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 2
                    color: ~180,160,255,120
              上一页文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 120
                  texts: ~&f< 上一页
                  fontSize: 42
                  through: true
          页码:
            type: Text
            attribute:
              x: 700
              y: 806
              center: true
              texts: ~&7第 &f{(var.page + 1).round()} &7/ &f{var.totalPages.round()} &7页
              fontSize: 49
          下一页:
            type: Canvas
            attribute:
              x: 1248
              y: 794
              width: 120
              height: 48
            action:
              clickLeft: |-
                if(var.page < var.totalPages - 1){
                  Packet.send(var.packetId, 'history_list', (var.page + 1))
                }
            children:
              下一页背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,62,74,205
                  hover: ~Frosted:0;255,255,255,80
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 2
                    color: ~180,160,255,120
              下一页文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 120
                  texts: ~&f下一页 >
                  fontSize: 42
                  through: true
