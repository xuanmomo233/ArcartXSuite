# AXS 钓鱼小游戏界面（Menu 模式，星露谷风格）
# 左侧竖直轨道（鱼物品图标 + 绿条）+ 右侧信息面板 + 结果覆盖层
# 鱼图标使用 Slot 控件渲染 MC 物品图标（服务端发送 fishIconJson）

ui:
  isHud: false
  background: true
  escClose: false
  closeDied: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.fishId = packet['fishId']
      var.fishName = packet['fishName']
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.caughtSize = packet['caughtSize']
      var.rarity = packet['rarity']
      var.fishIconJson = packet['fishIconJson']
      var.fishInside = false
      var.rarityTag = var.rarity == 'legendary' ? '&6' : (var.rarity == 'rare' ? '&9' : (var.rarity == 'uncommon' ? '&a' : '&f'))
      var.rarityLabel = var.rarity == 'legendary' ? '传说' : (var.rarity == 'rare' ? '稀有' : (var.rarity == 'uncommon' ? '罕见' : '普通'))
      var.rarityColor = var.rarity == 'legendary' ? '255,200,50' : (var.rarity == 'rare' ? '80,140,240' : (var.rarity == 'uncommon' ? '100,220,120' : '200,200,200'))
      if(var.fishIconJson == none || var.fishIconJson == ''){
        var.fishIconJson = var.emptyItemJson
      }
      val.鱼图标.seticon()
    update: |-
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.fishInside = packet['fishInside']
  action:
    load: |-
      var.packetId = 'AXS_FISHING'
      var.fishId = none
      var.fishName = ''
      var.fishY = 0.5
      var.barY = 0.5
      var.barHeight = 0.24
      var.progress = 0.5
      var.state = 'playing'
      var.timeLeft = 600
      var.caughtSize = 0
      var.rarity = 'common'
      var.fishIconJson = ''
      var.fishInside = false
      var.rarityTag = '&f'
      var.rarityLabel = '普通'
      var.rarityColor = '200,200,200'
      var.emptyItemJson = '{"id":"minecraft:cod","Count":1b}'
    open: |-
      Packet.send(var.packetId, 'open_minigame')
    keyPress: |-
      if(self.currentKeyPress() == ' ' || self.currentKeyPress() == 'SPACE'){
        Packet.send(var.packetId, 'input', true)
      }
    keyRelease: |-
      if(self.currentKeyReleased() == ' ' || self.currentKeyReleased() == 'SPACE'){
        Packet.send(var.packetId, 'input', false)
      }
    click: |-
      Packet.send(var.packetId, 'input', true)
    release: |-
      Packet.send(var.packetId, 'input', false)

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      主卡片:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 960
          height: 800
        children:
          卡片背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~14,30,48,235
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~60,170,200,100

          标题栏:
            type: Canvas
            attribute:
              point: ~top_center
              width: 960
              height: 80
            children:
              标题背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~20,42,62,220
                  shape: ~round_rect
                  radius: 24
              标题文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&b钓鱼中"
                  fontSize: 44
                  through: true

          放弃按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -20
              y: 16
              width: 120
              height: 48
            action:
              click: |-
                Packet.send(var.packetId, 'give_up')
            children:
              放弃背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~80,30,30,220
                  hover: ~180,50,50,240
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 2
                    color: ~200,80,80,180
              放弃文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f放弃"
                  fontSize: 28
                  through: true

          轨道区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 50
              y: 110
              width: 240
              height: 660
            children:
              轨道背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~8,20,35,220
                  shape: ~round_rect
                  radius: 16
                effect:
                  stroke:
                    width: 2
                    color: ~50,160,190,120

              水深渐变:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 8
                  y: 8
                  width: 224
                  height: 644
                  normal: ~12,28,42,255
                  shape: ~round_rect
                  radius: 14
                effect:
                  gradient:
                    color1: ~18,45,70,200
                    color2: ~8,22,38,200
                    type: 0
                    angleDeg: 90

              绿条:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 16
                  y: "(1 - var.barY - var.barHeight / 2) * 644 + 8"
                  width: 208
                  height: "var.barHeight * 644"
                  normal: ~80,220,160,210
                  shape: ~round_rect
                  radius: 12
                  visible: "var.state == 'playing'"
                effect:
                  stroke:
                    width: 2
                    color: ~140,255,200,180

              鱼图标:
                type: Slot
                val: 鱼图标
                attribute:
                  slotType: ~Icon
                  itemScale: 1.0
                  point: ~top_left
                  x: 80
                  y: "(1 - var.fishY) * 564 + 8"
                  width: 80
                  height: 80
                  normal: ~0,0,0,0
                  through: true
                  visible: "var.state == 'playing'"
                  seticon: "self.setItemIcon(var.fishIconJson)"

          信息面板:
            type: Canvas
            attribute:
              point: ~top_left
              x: 320
              y: 110
              width: 590
              height: 660
            children:
              信息背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~12,28,42,200
                  shape: ~round_rect
                  radius: 16
                effect:
                  stroke:
                    width: 1
                    color: ~50,160,190,60

              鱼名称区:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 24
                  width: 542
                  height: 110
                children:
                  鱼名称背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: "var.rarityColor + ',40'"
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 1
                        color: "var.rarityColor + ',80'"
                  鱼名称:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 24
                      texts: "var.rarityTag + var.fishName"
                      fontSize: 44
                      through: true

              稀有度区:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 160
                  width: 542
                  height: 72
                children:
                  稀有度背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: "var.rarityColor + ',30'"
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 1
                        color: "var.rarityColor + ',60'"
                  稀有度文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 24
                      texts: "var.rarityTag + '◆ ' + var.rarityLabel + '  &7尺寸: &f' + var.caughtSize + ' cm'"
                      fontSize: 30
                      through: true

              时间区:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 256
                  width: 542
                  height: 72
                children:
                  时间背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~20,38,55,180
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 1
                        color: ~50,160,190,50
                  时间文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 24
                      texts: "'&7剩余时间: &f' + (var.timeLeft / 20).round() + ' 秒'"
                      fontSize: 30
                      through: true

              进度区:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 352
                  width: 542
                  height: 120
                children:
                  进度标签:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      texts: "'&7进度: &f' + (var.progress * 100).round() + '%'"
                      fontSize: 28
                      through: true
                  进度条背景:
                    type: Texture
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 44
                      width: 542
                      height: 52
                      normal: ~15,25,38,230
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 1
                        color: ~50,160,190,60
                  进度条填充:
                    type: Texture
                    attribute:
                      point: ~top_left
                      x: 4
                      y: 48
                      width: "var.progress * 534"
                      height: 44
                      normal: "var.progress >= 1.0 ? '100,220,140,255' : (var.fishInside ? '60,190,220,245' : '220,100,90,245')"
                      shape: ~round_rect
                      radius: 12

              操作提示区:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 496
                  width: 542
                  height: 140
                children:
                  提示背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~18,32,48,180
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 1
                        color: ~50,160,190,40
                  提示标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 18
                      texts: "~&e操作说明"
                      fontSize: 28
                      through: true
                  提示内容:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 60
                      texts: "~&7按住 &f空格 &7或 &f鼠标 &7控制绿条"
                      fontSize: 26
                      through: true
                  提示内容2:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 24
                      y: 96
                      texts: "~&7让绿条追踪鱼的位置以填满进度"
                      fontSize: 26
                      through: true

          结果覆盖层:
            type: Canvas
            attribute:
              point: ~middle_center
              width: 640
              height: 380
              visible: "var.state == 'success' || var.state == 'failed'"
            children:
              结果背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.state == 'success' ? '18,50,35,240' : '55,20,20,240'"
                  shape: ~round_rect
                  radius: 24
                effect:
                  stroke:
                    width: 3
                    color: "var.state == 'success' ? '100,230,150,200' : '230,100,90,200'"
              结果文字:
                type: Text
                attribute:
                  point: ~top_center
                  y: 70
                  texts: "var.state == 'success' ? '&a✓ 捕获成功！' : '&c✕ 鱼逃走了...'"
                  fontSize: 56
                  through: true
              结果详情:
                type: Text
                attribute:
                  point: ~top_center
                  y: 170
                  texts: "var.state == 'success' ? (var.rarityTag + var.fishName + ' &7尺寸: &f' + var.caughtSize + ' cm') : '&7再试一次吧'"
                  fontSize: 34
                  through: true
              结果稀有度:
                type: Text
                attribute:
                  point: ~top_center
                  y: 230
                  texts: "var.state == 'success' ? (var.rarityTag + '◆ ' + var.rarityLabel) : ''"
                  fontSize: 30
                  through: true
