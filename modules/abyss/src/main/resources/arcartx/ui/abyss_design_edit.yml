                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~128,49,38,245
                                  shape: ~round_rect
                                  radius: 6
                                  through: true
                              字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: ~删
                                  fontSize: 32
                                  through: true
