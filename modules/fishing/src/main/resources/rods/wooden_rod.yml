# 鱼竿定义：木制钓竿
# 基础钓竿 — 示例配置，新手默认钓竿
# 鱼竿物品通过 PDC 标签 axs_fishing_rod_id 识别
# 鱼竿文件位于 rods/ 目录，每个文件定义一种鱼竿

id: "wooden_rod"               # 鱼竿唯一标识符
display-name: "木制钓竿"        # 显示名称
item:                          # 鱼竿对应的物品定义
  source: "minecraft"          # 物品来源（minecraft=原版物品）
  item-id: "fishing_rod"       # 原版物品ID（钓鱼竿）
  amount: 1                    # 物品数量
# 宝藏概率加成（加到基础概率上）
treasure-chance-bonus: 0.05    # 宝藏概率额外+5%
# 绿条高度加成（像素）
green-bar-height-bonus: 8      # 小游戏绿色目标条高度+8像素（更容易捕获）
# 小游戏持续时间加成（ticks）
catch-duration-bonus: 60       # 小游戏持续时间+60 ticks（3秒，更充裕的操作时间）
# 经验倍率
exp-multiplier: 1.1            # 捕获经验×1.1倍
# 所需最低玩家钓鱼等级
min-player-level: 0            # 无等级要求，新手可用
