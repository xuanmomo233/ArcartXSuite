              height: 120
            children:
              快捷底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~50,160,190,180
              快捷标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 28
                  y: 20
                  texts: "~&f快捷入口"
                  fontSize: 34
              # 奖励按钮
              奖励按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 28
                  y: 64
                  width: 220
                  height: 44
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'open_rewards')
                children:
                  奖励按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~50,170,200,235
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '80,200,220,255' : '50,170,200,230'"
                  奖励按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 220
                      texts: "'&0领取奖励' + (var.claimableRewardCount > 0 ? ' (' + var.claimableRewardCount.round() + ')' : '')"
                      fontSize: 30
                      through: true
              # 天赋按钮
              天赋按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 268
                  y: 64
                  width: 220
                  height: 44
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'open_talents')
                children:
                  天赋按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~26,34,46,210
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
                  天赋按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 220
                      texts: "'&f天赋树' + (var.unspentTalentPoints > 0 ? ' (&b' + var.unspentTalentPoints.round() + '&f)' : '')"
                      fontSize: 30
                      through: true
              # 任务按钮
              任务按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 508
                  y: 64
                  width: 220
                  height: 44
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'open_tasks')
                children:
                  任务按钮底:
