                    val.shopNameInput.setContent('')
                    val.shopPermissionInput.setContent('')
                    val.shopNpcInput.setContent('')
                    var.hydrating = false
                    var.dirty = false
                    }
                    if(kind == 'new_offer'){
                    var.mode = 'offer'
                    var.offerNew = true
                    var.offerId = ''
                    var.offerName = ''
                    var.offerEnabled = true
                    var.offerPermission = ''
                    var.costCount = 1
                    var.rewardCount = 1
