              normal: ~42,50,66,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          商店滑块:
            type: Texture
            val: 商店滑块
            attribute:
              point: ~top_right
              x: -10
              y: 488
              width: 8
              height: 60
              normal: ~140,200,255,255
              maxDragY: "var.viewH - 712"
              shape: ~round_rect
              radius: 4
          商店滚动:
            type: Scroll
            val: 商店滚动
            attribute:
              point: ~top_left
              x: 20
              y: 488
              width: 260
              height: "var.viewH - 652"
              moveY: "self.parent['商店滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['商店滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['商店滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              商店列表:
                val: 商店列表
                type: VStack
                attribute:
                  width: 254
                  spaceBetween: 8
                children:
                  商店项:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.shops[self.entryKey]
                      visible: self.entry != none
                      width: 254
                      height: 56
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'shop_list', self.entry['id'])
                    children:
                      商店项底:
                        type: Texture
                        attribute:
                          point: ~top_left
                          x: 3
                          y: 0
                          width: 248
                          height: 56
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['id'] == var.shopId ? '70,150,250,210' : '62,66,74,210'"
