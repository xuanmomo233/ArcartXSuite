                                      shape: ~round_rect
                                      radius: 6
                                  编辑按钮文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      width: 70
                                      through: true
                                      fontSize: 26
                                      texts: "~&f编辑"
                              删除按钮:
                                type: Canvas
                                attribute:
                                  x: 730
                                  y: 8
                                  width: 70
                                  height: 34
                                action:
                                  click: |-
                                    Packet.send(var.packetId, 'delete_region', self.parent.entry['id'])
                                children:
