# 鱼类定义：传说鲤鱼
# 传说鲤鱼是游戏中最稀有的鱼类，仅在春季雨天的湖泊中、黎明时分出现，难度极高
# 鱼类文件位于 fishes/ 目录，每个文件定义一种鱼
# 以下展示全部可选扩展字段（未配置时使用全局默认值或无效果）

id: "legendary_carp"           # 鱼类唯一标识符
display-name: "传说鲤鱼"         # 显示名称
rarity: legendary              # 稀有度等级（legendary=传说级，最高稀有度）
min-size: 80                   # 最小尺寸（厘米）
max-size: 250                  # 最大尺寸（厘米）
base-price: 2000               # 基础售价（游戏货币，高价）
base-xp: 300                   # 基础经验值（捕获时获得，高经验）
seasons: [spring]              # 可捕获季节（仅春季）
weathers: [rain]               # 可捕获天气（仅雨天）
time-ranges:                   # 可捕获时间段
  - start: "05:00"             # 开始时间（05:00，黎明时分）
    end: "07:00"               # 结束时间（07:00，仅2小时窗口）
# item: 捕获后掉落的物品定义（IconDefinition 标准格式，与 battlepass/menu 一致）
#   source: 物品来源 — minecraft / mythic / neige / overture / mmoitems
#   id:     物品 ID  — 原版材质名（source: minecraft 时）或外部物品库 ID
#   其他可选字段: amount / name / lore / custom-model-data / glow / texture / texture-url / nbt / skull-texture / color / json
#   MMOItems 额外字段: mmo-type + mmo-id（代替 id）
# icon: 图鉴/小游戏中的鱼图标（字段同 item，未配置时回退到 item）
item:
  source: minecraft
  id: enchanted_golden_apple
  amount: 1                    # 物品数量
difficulty: 90                 # 钓鱼难度（0-100，极高难度）
line-tension:
  enabled: true
# 体型越小冲得越快，体型越大冲得越久、拉力越高。
size-difficulty:
  small: { rush-speed: 1.15, rush-duration: 0.90, pull: 0.85 }
  large: { rush-speed: 0.85, rush-duration: 1.20, pull: 1.25 }
stamina:
  rush-drain-per-tick: 3.0
  exhausted-ticks: 20
  progress-gain-multiplier: 1.40
personalities:
  normal-weight: 7
  variants:
    alert: { display-name: "警觉", weight: 2, first-miss-rush: true }
    resilient: { display-name: "顽强", weight: 1, stamina-drain-multiplier: 0.65 }
hook-set:
  tap-ticks: 12
  window-ticks: 8
  late-ticks: 12
  good-recovery-bonus: 8
  miss-recovery-penalty: 4
active-treasure:
  enabled: true
behaviors:                     # 小游戏中鱼的行为模式及权重
  - type: dart                 # 突进型：鱼快速跳跃移动
    weight: 0.5                # 权重0.5（主要行为）
  - type: sinker               # 下沉型：鱼向轨道底部移动
    weight: 0.3                # 权重0.3
  - type: floater              # 上浮型：鱼向轨道顶部移动
    weight: 0.2                # 权重0.2

# ─── 小游戏机制（可选，覆盖全局曲线的 base-rate） ──────────
# 每条鱼独立的进度速率（未配置时用全局 fishing.progress-gain/drain 的 base-rate）
# 仅覆盖 base-rate，formula 沿用全局曲线公式（全局默认 gain=0.01, drain=0.02）
progress-gain:
  base-rate: 0.008             # 鱼在绿条内时进度上升较慢（全局默认0.01）
progress-drain:
  base-rate: 0.032             # 鱼在绿条外时进度下降较快（全局默认0.02）

# 每条鱼独立的逃离参数（未配置的字段用全局默认值）
flee-params:
  base-chance: 0.35            # 基础逃离概率更高（全局默认0.25）
  speed-per-difficulty: 0.04   # 每点难度逃离速度增长更多（全局默认0.03）
  min-duration: 20             # 逃离持续更久（全局默认15）

# 多阶段行为：进度达到阈值后切换行为模式（模拟"鱼越挣扎越激烈"）
# threshold = 进度百分比（0.0~1.0），达到后切换到对应阶段的行为
behavior-stages:
  stage1:
    threshold: 0.0
    behavior-mode: sequence
    behaviors:
      - { type: sinker, duration-ticks: 17, tell-ticks: 12, recovery-ticks: 32 }
      - { type: floater, duration-ticks: 17, tell-ticks: 12, recovery-ticks: 32 }
  stage2:
    threshold: 0.5             # 进度 50% 后：更激进
    behaviors:
      - type: dart
        duration-ticks: 19
        tell-ticks: 10
        recovery-ticks: 32
        weight: 0.6
      - type: zigzag           # 之字型：规律性左右摆动
        duration-ticks: 16
        tell-ticks: 10
        recovery-ticks: 32
        weight: 0.4
  stage3:
    threshold: 0.8             # 进度 80% 后：疯狂挣扎
    behaviors:
      - type: mixed            # 混合型：随机切换所有行为
        duration-ticks: 16
        tell-ticks: 10
        recovery-ticks: 32
        weight: 0.5
      - type: idle             # 停滞型：长时间不动后突然突进
        duration-ticks: 16
        tell-ticks: 10
        recovery-ticks: 32
        weight: 0.5

# ─── 奖励（可选） ──────────────────────────────────────
# 货币奖励（单个，向后兼容）
currency-reward:
  currency-id: "money"  # 货币ID，默认money对应Vault经济，自定义货币请改为本体config.yml中currencies节定义的ID
  amount: 500

# 多货币奖励列表（与 currency-reward 叠加生效）
currency-rewards:
  reward1:
    currency-id: "gem"
    amount: 10
  reward2:
    currency-id: "reputation"
    amount: 50

# 多物品掉落（与 item 叠加，支持条件掉落）
# condition 支持的值："" (无条件)、"perfect" (完美捕获)、"size:N" (尺寸≥N)、"first_catch" (首次捕获)
# 多条件用逗号分隔（全部满足才掉落）
drops:
  rare_drop:
    item:
      source: minecraft
      id: nether_star
      amount: 1
    weight: 1.0
    condition: "perfect"       # 仅完美捕获时掉落
  big_fish_bonus:
    item:
      source: minecraft
      id: diamond
      amount: 3
    weight: 1.0
    condition: "size:200"      # 尺寸≥200cm 时掉落
  first_catch_reward:
    item:
      source: minecraft
      id: golden_apple
      amount: 5
    weight: 1.0
    condition: "first_catch"   # 首次捕获此鱼时掉落

# 命令奖励（捕获后以控制台身份执行）
# 支持占位符：{player}、{fish}、{size}
command-rewards:
  announce:
    command: "say {player} 钓到了一条 {size}cm 的传说鲤鱼！"
    condition: ""              # 无条件执行
  give_title:
    command: "title {player} title \"&6传说渔夫！\""
    condition: "perfect"       # 完美捕获时执行

# ─── 出现条件（可选） ──────────────────────────────────
min-player-level: 30           # 最低钓鱼等级30级才能钓到
require-permission: "axs.fishing.legendary"  # 需要此权限才能钓到

# 饵料偏好：指定饵料对该鱼的出现概率倍率
bait-preferences:
  worm_pref:
    bait-id: "worm"
    multiplier: 0.5            # 蚯蚓降低出现概率
  special_bait:
    bait-id: "golden_bait"
    multiplier: 3.0            # 金饵料大幅提高出现概率

# biome 限制（留空=不限 biome）
biomes: [river, ocean]         # 仅在河流和海洋生物群系出现

# 深度限制（从水面往下的方块深度）
depth-range:
  min-depth: 5                 # 至少5格深
  max-depth: 50                # 最深50格

# ─── 数据/展示（可选） ─────────────────────────────────
description: "传说中的金色鲤鱼，据说只有最虔诚的渔夫才能在黎明的雨中湖畔遇见它。"
icon:
  source: minecraft
  id: enchanted_golden_apple
record-weight: 2.0             # 图鉴排序权重（越大越靠前）
