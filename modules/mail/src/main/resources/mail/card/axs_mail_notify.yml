# ArcartXSuite Mail — 新邮件通知卡片模板
# 当玩家收到新邮件时，在聊天栏中显示此卡片
# 卡片宽度与高度由 UI 侧根据 Text 控件实际渲染尺寸自适应
root_control:
  type: card
  attribute:
    width: "Math.max(val.title_label.width, val.subject_label.width) + 200 < 550 ? 550 : Math.max(val.title_label.width, val.subject_label.width) + 200"
    height: "Math.max(100, val.subject_label.y + val.subject_label.height + 20)"
  children:
    background:
      type: Texture
      attribute:
        width: "self.parent.width"
        height: "self.parent.height"
        normal: ~30,30,45,200
      action:
        click: |-
          Chat.say('/axsmail')
    icon:
      type: Text
      attribute:
        fontSize: 300
        x: 5
        y: "self.parent.height/2 - 75"
        texts: "'§f✉'"
        through: true
    title_label:
      type: Text
      val: title_label
      attribute:
        fontSize: 64
        x: 160
        y: 15
        texts: "'§e§l新邮件 §7来自 §f' + self.parent.data['senderName']"
        through: true
    subject_label:
      type: Text
      val: subject_label
      attribute:
        fontSize: 64
        x: 160
        y: 60
        through: true
        texts:
          - "'§7主题: §f' + self.parent.data['msg0']"
          - "self.parent.data['msg1'] != none ? '§f' + self.parent.data['msg1'] : none"
          - "self.parent.data['msg2'] != none ? '§f' + self.parent.data['msg2'] : none"
          - "self.parent.data['msg3'] != none ? '§f' + self.parent.data['msg3'] : none"
          - "self.parent.data['msg4'] != none ? '§f' + self.parent.data['msg4'] : none"
          - "self.parent.data['msg5'] != none ? '§f' + self.parent.data['msg5'] : none"
          - "self.parent.data['msg6'] != none ? '§f' + self.parent.data['msg6'] : none"
          - "self.parent.data['msg7'] != none ? '§f' + self.parent.data['msg7'] : none"
          - "self.parent.data['msg8'] != none ? '§f' + self.parent.data['msg8'] : none"
          - "self.parent.data['msg9'] != none ? '§f' + self.parent.data['msg9'] : none"
