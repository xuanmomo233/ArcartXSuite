# ArcartXSuite ExtraBackpack - 额外背包模块配置
# 随身扩容背包：分类页是仓库内容的过滤器；物品直接存于玩家个人仓库
# （与仓库模块共用同一存储，容量=仓库已解锁格数，槽位购买价格走仓库配置）。
# 重载: /axs reload extrabackpack
# 管理命令: /axs extrabackpack help|status|info|give|reset
config-version: 2

ui:
  # 插件启用时是否自动注册背包 UI
  register-ui-on-enable: true
  # 是否覆盖用户已修改的 UI 文件
  overwrite-ui-files: false

storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "<moduleId>.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: <N>
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_<moduleId>_"

# ─── 额外背包配置 ───
extra-backpack:
  # 是否启用额外背包功能（false 时模块不注册 UI、不响应任何操作）
  enabled: true
  # 分类页定义，键名即分类 ID。
  # 注意：分类页只是仓库内容的「过滤器」，不是独立存储——
  # 容量由仓库统一管理（ArcartXWarehouse.yml 的 warehouses.personal:
  # base-slots/max-slots/slot-price），槽位购买也走仓库配置。
  categories:
    # 装备分类
    equipment:
      # 分类显示名称
      display-name: "装备"
      # 分类排序优先级 (数值越小越靠前)
      priority: 10
      slots:
        # 该页网格显示上限（应 >= 仓库 max-slots，否则多余格子在此页不显示）
        max: 99999
      # 物品自动归类匹配规则（过滤 + 严格放入校验共用）
      # 除 match.nbt 外还支持按物品注册键分类（与 match.nbt 为"或"关系）：
      #   material-ids: 注册键精确匹配，如 ["tacz:modern_kinetic_gun"]
      #   material-prefixes: 注册键前缀匹配，如 ["tacz:"] 命中全部 TaCZ 物品
      match:
        nbt:
          # NBT 路径，用于读取物品分类标签
          path: "pdc:arcartx:item_category"
          # 匹配的标签值列表，物品标签值在此列表中则归入该分类
          values: ["equipment", "weapon", "armor"]
    # 材料分类
    material:
      display-name: "材料"
      priority: 20
      slots:
        max: 99999
      match:
        nbt:
          path: "pdc:arcartx:item_category"
          values: ["material"]
    # 杂物分类 (兜底分类，未匹配其他分类的物品归入此处)
    weapon:
      display-name: "武器"
      priority: 40
      material-ids:
        - "minecraft:wooden_sword"
        - "minecraft:stone_sword"
        - "minecraft:iron_sword"
        - "minecraft:golden_sword"
        - "minecraft:diamond_sword"
        - "minecraft:netherite_sword"
        - "minecraft:bow"
        - "minecraft:crossbow"
        - "minecraft:trident"
        - "minecraft:mace"
    tool:
      display-name: "工具"
      priority: 41
      material-ids:
        - "minecraft:wooden_pickaxe"
        - "minecraft:wooden_axe"
        - "minecraft:wooden_shovel"
        - "minecraft:wooden_hoe"
        - "minecraft:stone_pickaxe"
        - "minecraft:stone_axe"
        - "minecraft:stone_shovel"
