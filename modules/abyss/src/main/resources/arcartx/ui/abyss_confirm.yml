# AXS 资源说明
# 用途: Abyss 进本确认框 —— 副本信息确认 + 进入/取消
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  background: true
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/dungeonId/dungeonName/difficulty/desc
    #         minPlayers/maxPlayers/staminaCost/moneyCost/cooldown/timeLimit
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonId = packet['dungeonId']
      var.dungeonName = packet['dungeonName']
      var.difficulty = packet['difficulty']
      var.desc0 = packet['desc0']
      var.desc1 = packet['desc1']
      var.desc2 = packet['desc2']
      var.minPlayers = packet['minPlayers']
      var.maxPlayers = packet['maxPlayers']
      var.staminaCost = packet['staminaCost']
      var.moneyCost = packet['moneyCost']
      var.cooldown = packet['cooldown']
      var.timeLimit = packet['timeLimit']
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      确认面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 520
          height: 400
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:24;24,28,38,200
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 2
                color: ~110,148,204,160
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 22
              texts: "'&b&l' + var.dungeonName"
              fontSize: 54
          难度:
            type: Text
            attribute:
              point: ~top_center
              y: 82
              texts: "'&7难度: &f' + var.difficulty"
              fontSize: 36
          条件:
            type: Text
            attribute:
              point: ~top_center
              y: 128
              texts: "'&8人数 ' + var.minPlayers.round() + '-' + var.maxPlayers.round() + '  体力 ' + var.staminaCost.round() + '  门票 ' + var.moneyCost.round() + '  限时 ' + var.timeLimit.round() + 's  冷却 ' + var.cooldown.round() + 's'"
              fontSize: 36
          描述:
            type: Text
            attribute:
              point: ~top_center
              y: 178
              texts:
                - "'&7' + var.desc0"
                - "'&7' + var.desc1"
                - "'&7' + var.desc2"
              fontSize: 36
          进入按钮:
            type: Canvas
            attribute:
              point: ~bottom_center
              x: -130
              y: -28
              width: 120
              height: 48
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'enter', var.dungeonId, var.actionToken)
                Screen.close()
            children:
              进入底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~60,140,80,240
                  hover: ~80,170,100,250
                  shape: ~round_rect
                  radius: 10
                  through: true
              进入字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f进入
                  fontSize: 36
                  through: true
          取消按钮:
            type: Canvas
            attribute:
              point: ~bottom_center
              x: 130
              y: -28
              width: 120
              height: 48
            action:
              clickLeft: "Screen.close()"
            children:
              取消底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~90,90,100,240
                  hover: ~115,115,128,250
                  shape: ~round_rect
                  radius: 10
                  through: true
              取消字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f取消
                  fontSize: 36
                  through: true
