              x: -10
              y: 546
              width: 8
              height: "var.viewH - 750"
              through: true
              normal: ~24,50,40,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          卖家滑块:
            type: Texture
            val: 卖家滑块
            attribute:
              point: ~top_right
              x: -10
              y: 546
              width: 8
              height: 60
              normal: ~183,149,86,255
              maxDragY: "var.viewH - 810"
              shape: ~round_rect
              radius: 4
          卖家滚动:
            type: Scroll
            val: 卖家滚动
            attribute:
              point: ~top_left
              x: 20
              y: 546
              width: 260
              height: "var.viewH - 750"
              moveY: "self.parent['卖家滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['卖家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['卖家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
