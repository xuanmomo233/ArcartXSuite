                          y: 0
                          width: 248
                          height: 48
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['id'] == var.currentCategory ? '70,150,250,210' : '62,66,74,210'"
                          shape: ~round_rect
                          radius: 10
                        effect:
