              x: "28"
              y: "258"
              texts: "'&7保护规则 ' + var.total.round() + '/' + var.maximum.round() + ' · 排除材质覆盖全部变体；收藏同款保留其他特征。'"
              fontSize: 24
              through: true
          保护滑块:
            type: Texture
            val: 保护滑块
            attribute:
              x: "var.pageW - 18"
              y: 312
              width: 6
              height: 58
              maxDragY: "var.pageH - 514"
              normal: ~131,177,196,245
          保护滚动:
            type: Scroll
            attribute:
              x: 24
              y: 312
              width: "var.pageW - 48"
              height: "var.pageH - 456"
              moveY: "val.保护滑块.getDragYRatio()"
            action:
              wheel: |-
                val.保护滑块.setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
