# 鱼类定义：传说鲤鱼
# 传说鲤鱼是游戏中最稀有的鱼类，仅在春季雨天的湖泊中、黎明时分出现，难度极高
# 鱼类文件位于 fishes/ 目录，每个文件定义一种鱼

id: "legendary_carp"           # 鱼类唯一标识符
display-name: "传说鲤鱼"         # 显示名称
rarity: legendary              # 稀有度等级（legendary=传说级，最高稀有度）
min-size: 80                   # 最小尺寸（厘米）
max-size: 250                  # 最大尺寸（厘米）
base-price: 2000               # 基础售价（游戏货币，高价）
base-xp: 300                   # 基础经验值（捕获时获得，高经验）
seasons: [spring]              # 可捕获季节（仅春季）
weathers: [rain]               # 可捕获天气（仅雨天）
water-types: [lake]            # 可捕获水域类型（仅湖泊）
time-ranges:                   # 可捕获时间段
  - start: "05:00"             # 开始时间（05:00，黎明时分）
    end: "07:00"               # 结束时间（07:00，仅2小时窗口）
item:                          # 捕获后掉落的物品定义
  source: "minecraft"          # 物品来源（minecraft=原版物品）
  item-id: "enchanted_golden_apple" # 原版物品ID（附魔金苹果，稀有物品）
  amount: 1                    # 物品数量
difficulty: 90                 # 钓鱼难度（0-100，极高难度）
behaviors:                     # 小游戏中鱼的行为模式及权重
  - type: dart                 # 突进型：鱼快速跳跃移动
    weight: 0.5                # 权重0.5（主要行为）
  - type: sinker               # 下沉型：鱼向轨道底部移动
    weight: 0.3                # 权重0.3
  - type: floater              # 上浮型：鱼向轨道顶部移动
    weight: 0.2                # 权重0.2
