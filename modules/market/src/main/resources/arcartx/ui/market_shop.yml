                          fontSize: 36
                          through: true
                      价格:
                        type: Text
                        attribute:
                          x: 123
                          y: 52
                          texts: "'&e价格: &f' + self.parent.entry['price'] + ' &7' + self.parent.entry['currencyName']"
                          fontSize: 32
                          through: true
                      库存:
                        type: Text
                        attribute:
                          x: 123
                          y: 88
                          texts: "'&7库存: &f' + self.parent.entry['stock']"
                          fontSize: 32
                          through: true
                      限购:
                        type: Text
                        attribute:
                          x: 123
                          y: 124
                          visible: "self.parent.entry != none && self.parent.entry['limitText'] != ''"
                          texts: "'&c' + self.parent.entry['limitText']"
                          fontSize: 32
                          through: true
                      购买按钮:
                        type: Canvas
                        attribute:
                          x: 15
                          y: 168
                          width: "var.cardW - 30"
                          height: 40
                          enable: "!var.actionBusy && var.actionToken != ''"
                        action:
                          clickLeft: |-
                            var.actionBusy = true
                            Packet.send(var.packetId, 'shop_buy', var.shopId, self.parent.entry['key'], '1', var.actionToken)
                        children:
                          购买底:
                            type: Texture
                            attribute:
                              point: ~top_left
                              x: 3
                              y: 0
                              width: "var.cardW - 36"
                              height: 40
                              through: true
                              normal: ~80,200,120,230
                              shape: ~round_rect
                              radius: 10
                            effect:
                              ripple:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '120,220,140,255' : '255,255,255,230'"
                          购买文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "~&f购买"
                              fontSize: 32
                              through: true
