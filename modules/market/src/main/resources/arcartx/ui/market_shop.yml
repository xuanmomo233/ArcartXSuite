# AXS Market — 供给目录与交易详情
ui:
  isHud: false
  defaultOpen: false
  hide:
  - hotbar
  - experience_bar
  - crosshair
  - item_name
  - jump_bar
  - mount_health
  - player_state
  - player_health
  - armor_level
  - food_level
  - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    update: |-
      oldShopId = var.shopId
      oldShopCount = var.maxShopCount
      oldItemCount = var.maxItemCount
      var.packetId = packet['packetId']
      var.shops = packet['shops'] != none ? packet['shops'] : {}
      var.shopTexts = packet['shopTexts']
      var.shopId = packet['shopId']
      var.shopName = packet['shopName']
      var.items = packet['items'] != none ? packet['items'] : {}
      var.maxShopCount = var.shops.size()
      var.maxItemCount = var.items.size()
      var.actionToken = packet['action_token']
      var.isAdmin = packet['isAdmin']
      var.itemJsons = {}
      var.shopIconJsons = {}
      for(key in var.shops.keys()){
        json = packet['shopIconJson' + key]
        var.shopIconJsons[key] = json != none && json != '' ? json : var.emptyItemJson
      }
      for(key in var.items.keys()){
        json = packet['shopItemJson' + key]
        var.itemJsons[key] = json != none && json != '' ? json : var.emptyItemJson
      }
      if(var.maxShopCount != oldShopCount){
        for(key in var.shopRefs.keys()){
          var.shopRefs[key].remove()
        }
        var.shopRefs = {}
        var.shopRound = var.shopRound + 1
        if(var.maxShopCount > 1){
          template = val.商店列表.get(0)
          for(i in range(1, var.maxShopCount - 1)){
            row = template.copy('商店项_' + var.shopRound.round() + '_' + i.round())
            row.entryKey = i.round()
            var.shopRefs[i.round()] = row
          }
        }
      }
      if(var.maxItemCount != oldItemCount){
        for(key in var.itemRefs.keys()){
          var.itemRefs[key].remove()
        }
        var.itemRefs = {}
        var.itemRound = var.itemRound + 1
        if(var.maxItemCount > 1){
          template = val.商品列表.get(0)
          for(i in range(1, var.maxItemCount - 1)){
            row = template.copy('商品卡片_' + var.itemRound.round() + '_' + i.round())
            row.entryKey = i.round()
            var.itemRefs[i.round()] = row
          }
        }
      }
      if(var.maxShopCount > 0){
        val.商店列表.get(0)['商店图标'].seticon()
        for(key in var.shopRefs.keys()){
          var.shopRefs[key]['商店图标'].seticon()
        }
      }
      if(var.maxItemCount > 0){
        val.商品列表.get(0)['商品图标'].seticon()
        for(key in var.itemRefs.keys()){
          var.itemRefs[key]['商品图标'].seticon()
        }
      }
      if(oldShopId != var.shopId){
        var.selectedItemId = none
        val.商品滑块.setDragYRatio(0)
      }
      var.selectedKey = none
      for(key in var.items.keys()){
        entry = var.items[key]
        if(entry['key'] == var.selectedItemId){
          var.selectedKey = key
        }
      }
      self.actions['refreshSelection']()
      var.actionBusy = false
      var.actionBusySeconds = 0
  action:
    load: |-
      var.shopUi = self
      var.packetId = 'AXS_MARKET'
      var.actionToken = ''
      var.shopId = ''
      var.shopName = ''
      var.shops = {}
      var.shopTexts = {}
      var.items = {}
      var.itemJsons = {}
      var.shopIconJsons = {}
      var.shopRefs = {}
      var.itemRefs = {}
      var.maxShopCount = 0
      var.maxItemCount = 0
      var.shopRound = 0
      var.itemRound = 0
      var.selectedKey = none
      var.selectedItemId = none
      var.selectedItem = none
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.isAdmin = false
      self.actions['resize']()
    open: Packet.send(var.packetId, 'shop_list', '')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.galleryW = var.viewW - 828
      var.scrollW = var.galleryW - 56
      var.cardW = (var.scrollW - 20) / 2
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    refreshSelection: |-
      var.selectedItem = var.items[var.selectedKey]
      val.selected_icon.seticon()
