# AXS 钓鱼小游戏界面（Menu 模式，星露谷风格）
# 删除主卡片底+关闭 ui.background，让玩家能透过 UI 看到周围环境
# 核心组件悬浮在游戏画面上：轨道区（鱼图标+绿条）+ 信息面板 + 结果覆盖层
# 视觉规范:
#   组件底 26,34,46,200  组件描边 50,160,190,180
#   主色（青蓝）50,170,200  绿条 80,220,160  成功 124,196,142  失败 230,100,90

ui:
  isHud: false
  background: false
  escClose: false
  closeDied: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.fishId = packet['fishId']
      var.fishName = packet['fishName']
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.caughtSize = packet['caughtSize']
      var.rarity = packet['rarity']
      var.fishIconJson = packet['fishIconJson']
      var.fishInside = false
      var.rarityTag = var.rarity == 'legendary' ? '&6' : (var.rarity == 'rare' ? '&9' : (var.rarity == 'uncommon' ? '&a' : '&f'))
      var.rarityLabel = var.rarity == 'legendary' ? '传说' : (var.rarity == 'rare' ? '稀有' : (var.rarity == 'uncommon' ? '罕见' : '普通'))
      var.rarityColor = var.rarity == 'legendary' ? '255,200,50' : (var.rarity == 'rare' ? '80,140,240' : (var.rarity == 'uncommon' ? '100,220,120' : '200,200,200'))
      if(var.fishIconJson == none || var.fishIconJson == ''){
        var.fishIconJson = var.emptyItemJson
      }
      val.鱼图标.seticon()
    update: |-
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.fishInside = packet['fishInside']
  action:
    load: |-
      var.packetId = 'AXS_FISHING'
      var.fishId = none
      var.fishName = ''
      var.fishY = 0.5
      var.barY = 0.5
      var.barHeight = 0.24
      var.progress = 0.5
      var.state = 'playing'
      var.timeLeft = 600
      var.caughtSize = 0
      var.rarity = 'common'
      var.fishIconJson = ''
      var.fishInside = false
      var.rarityTag = '&f'
      var.rarityLabel = '普通'
      var.rarityColor = '200,200,200'
      var.emptyItemJson = '{"id":"minecraft:cod","Count":1b}'
    open: |-
      Packet.send(var.packetId, 'open_minigame')
    keyPress: |-
      if(self.currentKeyPress() == ' ' || self.currentKeyPress() == 'SPACE'){
        Packet.send(var.packetId, 'input', true)
      }
    keyRelease: |-
      if(self.currentKeyReleased() == ' ' || self.currentKeyReleased() == 'SPACE'){
        Packet.send(var.packetId, 'input', false)
      }
    click: |-
      Packet.send(var.packetId, 'input', true)
    release: |-
      Packet.send(var.packetId, 'input', false)

controls:
  # 自适应全局布局：以1920x1080设计分辨率等比缩放，居中定位
  # 无全屏玻璃底、无主卡片底——玩家可透过 UI 看到周围环境
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      # ── 顶部标题栏（悬浮，无大卡片底）──────────────────
      标题栏:
        type: Canvas
        attribute:
          point: ~top_center
          y: 80
          width: 600
          height: 60
        children:
          标题背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:20;26,34,46,200
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 2
                color: ~50,160,190,120
          标题文字:
            type: Text
            attribute:
              point: ~middle_center
              width: 600
              texts: "~&b⚓ &f钓鱼中"
              fontSize: 36
              through: true
          # 放弃按钮（标题栏右侧）
          放弃按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: 8
              y: 10
              width: 100
              height: 40
            action:
              click: |-
                Packet.send(var.packetId, 'give_up')
            children:
              放弃背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~80,30,30,200
                  hover: ~180,50,50,230
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 2
                    color: ~200,80,80,160
              放弃文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 100
                  texts: "~&f放弃"
                  fontSize: 26
                  through: true

      # ── 轨道区（左侧竖直轨道，悬浮毛玻璃面板）──────────
      轨道区:
        type: Canvas
        attribute:
          point: ~middle_left
          x: 420
          y: -20
          width: 220
          height: 620
        children:
          轨道背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:20;26,34,46,200
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 2
                color: ~50,160,190,150
          水深渐变:
            type: Texture
            attribute:
              point: ~top_left
              x: 8
              y: 8
              width: 204
              height: 604
              normal: ~12,28,42,255
              shape: ~round_rect
              radius: 14
            effect:
              gradient:
                color1: ~18,45,70,200
                color2: ~8,22,38,200
                type: 0
                angleDeg: 90
          # 绿条（玩家控制的捕获区域）
          绿条:
            type: Texture
            attribute:
              point: ~top_left
              x: 16
              y: "(1 - var.barY - var.barHeight / 2) * 604 + 8"
              width: 188
              height: "var.barHeight * 604"
              normal: ~80,220,160,200
              shape: ~round_rect
              radius: 12
              visible: "var.state == 'playing'"
            effect:
              stroke:
                width: 2
                color: ~140,255,200,160
          # 鱼图标（Slot 控件渲染 MC 物品图标）
          鱼图标:
            type: Slot
            val: 鱼图标
            attribute:
              slotType: ~Icon
              itemScale: 1.0
              point: ~top_left
              x: 70
              y: "(1 - var.fishY) * 524 + 8"
              width: 80
              height: 80
              normal: ~0,0,0,0
              through: true
              visible: "var.state == 'playing'"
              seticon: "self.setItemIcon(var.fishIconJson)"

      # ── 信息面板（右侧，悬浮毛玻璃面板）──────────────
      信息面板:
        type: Canvas
        attribute:
          point: ~middle_left
          x: 680
          y: -20
          width: 560
          height: 620
        children:
          信息背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:20;26,34,46,200
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 2
                color: ~50,160,190,150
          # 鱼名称区
          鱼名称区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 20
              width: 520
              height: 100
            children:
              鱼名称背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.rarityColor + ',40'"
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 1
                    color: "var.rarityColor + ',80'"
              鱼名称:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 20
                  texts: "var.rarityTag + var.fishName"
                  fontSize: 40
                  through: true
          # 稀有度区
          稀有度区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 140
              width: 520
              height: 64
            children:
              稀有度背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.rarityColor + ',30'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 1
                    color: "var.rarityColor + ',60'"
              稀有度文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 20
                  texts: "var.rarityTag + '◆ ' + var.rarityLabel + '  &7尺寸: &f' + var.caughtSize + ' cm'"
                  fontSize: 28
                  through: true
          # 时间区
          时间区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 224
              width: 520
              height: 64
            children:
              时间背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,180
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 1
                    color: ~50,160,190,80
              时间文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 20
                  texts: "'&7剩余时间: &f' + (var.timeLeft / 20).round() + ' 秒'"
                  fontSize: 28
                  through: true
          # 进度区
          进度区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 308
              width: 520
              height: 110
            children:
              进度标签:
                type: Text
                attribute:
                  point: ~top_left
                  x: 0
                  y: 0
                  texts: "'&7进度: &f' + (var.progress * 100).round() + '%'"
                  fontSize: 26
                  through: true
              进度条背景:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 0
                  y: 40
                  width: 520
                  height: 48
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 1
                    color: ~50,160,190,100
              进度条填充:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 4
                  y: 44
                  width: "var.progress * 512"
                  height: 40
                  normal: "var.progress >= 1.0 ? '124,196,142,255' : (var.fishInside ? '50,170,200,245' : '230,100,90,245')"
                  shape: ~round_rect
                  radius: 10
          # 操作提示区
          操作提示区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 440
              width: 520
              height: 160
            children:
              提示背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,180
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 1
                    color: ~50,160,190,80
              提示标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 16
                  texts: "~&e操作说明"
                  fontSize: 26
                  through: true
              提示内容:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 54
                  texts: "~&7按住 &f空格 &7或 &f鼠标 &7控制绿条"
                  fontSize: 24
                  through: true
              提示内容2:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 88
                  texts: "~&7让绿条追踪鱼的位置以填满进度"
                  fontSize: 24
                  through: true

      # ── 结果覆盖层（成功/失败时显示，居中悬浮）──────────
      结果覆盖层:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 600
          height: 360
          visible: "var.state == 'success' || var.state == 'failed'"
        children:
          结果背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: "var.state == 'success' ? '18,50,35,240' : '55,20,20,240'"
              shape: ~round_rect
              radius: 20
            effect:
              stroke:
                width: 3
                color: "var.state == 'success' ? '124,196,142,200' : '230,100,90,200'"
          结果文字:
            type: Text
            attribute:
              point: ~top_center
              y: 60
              texts: "var.state == 'success' ? '&a✓ 捕获成功！' : '&c✕ 鱼逃走了...'"
              fontSize: 52
              through: true
          结果详情:
            type: Text
            attribute:
              point: ~top_center
              y: 150
              texts: "var.state == 'success' ? (var.rarityTag + var.fishName + ' &7尺寸: &f' + var.caughtSize + ' cm') : '&7再试一次吧'"
              fontSize: 32
              through: true
          结果稀有度:
            type: Text
            attribute:
              point: ~top_center
              y: 210
              texts: "var.state == 'success' ? (var.rarityTag + '◆ ' + var.rarityLabel) : ''"
              fontSize: 28
              through: true
