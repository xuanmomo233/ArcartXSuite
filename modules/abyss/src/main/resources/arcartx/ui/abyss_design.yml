          y: 148
          width: 210
          height: 54
        action:
          clickLeft: "Packet.send(var.packetId, 'design_pick_open', var.selNode, var.actionToken)"
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~190,137,65,245
              shape: ~round_rect
              radius: 8
              through: true
            effect:
              stroke:
                width: 1
                color: "self.parent.isHovered() ? '255,255,255,230' : '255,255,255,70'"
          字:
            type: Text
            attribute:
              point: ~middle_center
              texts: ~&0+  录入对象
              fontSize: 36
              through: true
      内容滑轨:
