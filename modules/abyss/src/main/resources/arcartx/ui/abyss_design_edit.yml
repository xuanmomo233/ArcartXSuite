                          limit: 9
                          point: ~top_left
                          width: self.parent.width
                          height: self.parent.height
                          limitControl: self.parent
                          through: true
                  输入壳:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -18
                      width: "var.colW - 320"
                      height: 48
                      visible: "self.parent.entry['editor'] == 'TEXT' || self.parent.entry['editor'] == 'NUMBER'"
                    children:
                      框底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~11,13,14,250
                          shape: ~round_rect
                          radius: 7
                          through: true
                      输入框:
                        type: TextBox
                        attribute:
                          x: 12
                          y: 8
                          width: "var.colW - 344"
                          height: 34
                          length: 8192
                          fontSize: 32
                          emptyText: ~&7输入值后回车提交
                        action:
                          enter: "Packet.send(var.packetId, 'design_set', var.objKey, self.parent.parent.entry['name'], self.getContent(), var.actionToken)"
                  # ── TOGGLE：开关钮 ──
