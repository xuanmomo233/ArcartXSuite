# AXS 资源说明
# 用途: Regions 管理员地籍工作台：区域登记、边界复核、成员与世界规则。
# 打开方式: /axs regions admin
# 协议: AXS_REGIONS_ADMIN；所有写操作保留服务端 action_token 顺序。
# 设计: 管理端地籍总簿；红色审批印记、奶油图纸与网格绿刻度。

ui:
  background: true
  escClose: true
  closeDied: true
  show: true
  through: false
  screenScale: true
  action:
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.boardW = var.viewW - 436
      var.regionRowRefs = {}
      var.memberRowRefs = {}
      var.flagRowRefs = {}
      var.worldRowRefs = {}
      var.rowGeneration = 0
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.boardW = var.viewW - 436
  packetHandler:
    init: |-
      var.newRegionName = ''
      var.renameValue = ''
      var.page = packet['page']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.regions = packet['regions']
      var.regionCount = packet['regionCount']
      var.selId = packet['selId']
      var.selWorld = packet['selWorld']
      var.selPriority = packet['selPriority']
      var.selParent = packet['selParent']
      var.selMin = packet['selMin']
      var.selMax = packet['selMax']
      var.selVolume = packet['selVolume']
      var.selFlags = packet['selFlags']
      var.selMembers = packet['selMembers']
      var.worlds = packet['worlds']
      var.worldCount = packet['worldCount']
      // 将 Map 转为 List，供 VStack 行按 entryKey 整数索引访问
      var.regionList = []
      if(var.regions != null){
        for(key in var.regions.keys()){
          var.regionList.add(var.regions[key])
        }
      }
      var.memberList = []
      if(var.selMembers != null){
        for(key in var.selMembers.keys()){
          var.memberList.add(var.selMembers[key])
        }
      }
      var.flagList = []
      if(var.selFlags != null){
        for(key in var.selFlags.keys()){
          var.flagList.add(var.selFlags[key])
        }
      }
      var.worldList = []
      if(var.worlds != null){
        for(key in var.worlds.keys()){
          var.worldList.add(var.worlds[key])
        }
      }
      // 按数据数量建立行；保留模板，并使用引用清理副本，避免固定池截断档案。
      var.rowGeneration = (var.rowGeneration + 1).round()
      count = var.regionList.length > 0 ? var.regionList.length : 1
      if(val.region_data.childrenCount() != count){
        for(key in var.regionRowRefs.keys()){
          var.regionRowRefs[key].remove()
        }
        var.regionRowRefs = {}
        template = val.region_data.get(0)
        for(i in range(1, count - 1)){
          row = template.copy('区域行_' + var.rowGeneration + '_' + i.round())
          row.entryKey = i.round()
          var.regionRowRefs[i.round()] = row
        }
      }
      count = var.memberList.length > 0 ? var.memberList.length : 1
      if(val.member_data.childrenCount() != count){
        for(key in var.memberRowRefs.keys()){
          var.memberRowRefs[key].remove()
        }
        var.memberRowRefs = {}
        template = val.member_data.get(0)
        for(i in range(1, count - 1)){
          row = template.copy('成员行_' + var.rowGeneration + '_' + i.round())
          row.entryKey = i.round()
          var.memberRowRefs[i.round()] = row
        }
      }
      count = var.flagList.length > 0 ? var.flagList.length : 1
      if(val.flag_data.childrenCount() != count){
        for(key in var.flagRowRefs.keys()){
          var.flagRowRefs[key].remove()
        }
        var.flagRowRefs = {}
        template = val.flag_data.get(0)
        for(i in range(1, count - 1)){
          row = template.copy('标志行_' + var.rowGeneration + '_' + i.round())
          row.entryKey = i.round()
          var.flagRowRefs[i.round()] = row
        }
      }
      count = var.worldList.length > 0 ? var.worldList.length : 1
      if(val.world_rule_data.childrenCount() != count){
        for(key in var.worldRowRefs.keys()){
          var.worldRowRefs[key].remove()
        }
        var.worldRowRefs = {}
        template = val.world_rule_data.get(0)
        for(i in range(1, count - 1)){
          row = template.copy('世界规则行_' + var.rowGeneration + '_' + i.round())
          row.entryKey = i.round()
          var.worldRowRefs[i.round()] = row
        }
      }

controls:
  测绘纸底:
    type: Texture
    attribute: {point: ~stretch_all, normal: "~235,232,217,255"}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      主面板:
        type: Canvas
        attribute: {x: "-var.offX", y: 0, width: "var.viewW", height: "var.viewH"}
        children:
          标题栏:
            type: Canvas
            attribute: {x: 48, y: 28, width: "var.viewW - 96", height: 100}
            children:
              标题色标:
                type: Texture
                attribute: {x: 0, y: 8, width: 8, height: 84, normal: "~153,66,54,255", through: true}
              标题文字:
                type: Text
                attribute: {x: 28, y: 0, fontSize: 72, texts: "~&0区域地籍总簿", through: true}
              标题索引:
                type: Text
                attribute: {x: 30, y: 64, fontSize: 36, texts: "~&8CADASTRE / ADMINISTRATION   ·   边界、权属与世界规则", through: true}
              区域数量:
                type: Text
                attribute: {point: ~top_right, x: -230, y: 16, fontSize: 36, texts: "var.page == 'world_rules' ? '&4世界卷  &0' + var.worldCount : '&4登记卷  &0' + var.regionCount", through: true}
              关闭按钮:
                type: Canvas
                attribute: {point: ~top_right, x: 0, y: 10, width: 180, height: 60}
                action:
                  click: Screen.close()
                children:
                  关闭底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "~220,223,205,255", hover: "~208,215,194,255", through: true}
                  关闭字:
                    type: Text
                    attribute: {point: ~middle_center, fontSize: 36, texts: "~&0关闭 / ESC", through: true}
          标题基线:
            type: Texture
            attribute: {x: 48, y: 134, width: "var.viewW - 96", height: 3, normal: "~153,66,54,255", through: true}
          导航栏:
            type: Canvas
            attribute: {x: 48, y: 152, width: 268, height: "var.viewH - 188"}
            children:
              导航纸底:
                type: Texture
                attribute: {point: ~stretch_all, normal: "~223,227,209,255", through: true}
              导航册脊:
                type: Texture
                attribute: {x: 0, y: 0, width: 6, height: "var.viewH - 188", normal: "~153,66,54,255", through: true}
              导航索引:
                type: Text
                attribute: {x: 18, y: 20, fontSize: 36, texts: "~&4A / 管理卷宗", through: true}
              导航区域入口:
                type: Canvas
                attribute: {x: 18, y: 76, width: 232, height: 72}
                action:
                  click: |-
                    Packet.send(var.packetId, 'navigate', 'regions')
                children:
                  导航区域背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "var.page == 'regions' ? '153,66,54,255' : '238,240,224,255'", hover: "var.page == 'regions' ? '181,79,64,255' : '198,214,190,255'", through: true}
                  导航区域文字:
                    type: Text
                    attribute: {point: ~middle_left, x: 16, fontSize: 36, texts: "var.page == 'regions' ? '&f01  区域登记' : '&001  区域登记'", through: true}
              导航编辑入口:
                type: Canvas
                attribute: {x: 18, y: 162, width: 232, height: 72}
                action:
                  click: |-
                    Packet.send(var.packetId, 'navigate', 'edit')
                children:
                  导航编辑背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "var.page == 'edit' ? '153,66,54,255' : '238,240,224,255'", hover: "var.page == 'edit' ? '181,79,64,255' : '198,214,190,255'", through: true}
                  导航编辑文字:
                    type: Text
                    attribute: {point: ~middle_left, x: 16, fontSize: 36, texts: "var.page == 'edit' ? '&f02  边界与权限' : '&002  边界与权限'", through: true}
              导航世界规则入口:
                type: Canvas
                attribute: {x: 18, y: 248, width: 232, height: 72}
                action:
                  click: |-
                    Packet.send(var.packetId, 'select_world_rule')
                children:
                  导航世界规则背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "var.page == 'world_rules' ? '153,66,54,255' : '238,240,224,255'", hover: "var.page == 'world_rules' ? '181,79,64,255' : '198,214,190,255'", through: true}
                  导航世界规则文字:
                    type: Text
                    attribute: {point: ~middle_left, x: 16, fontSize: 36, texts: "var.page == 'world_rules' ? '&f03  世界规则' : '&003  世界规则'", through: true}
              工作流说明:
                type: Text
                attribute:
                  x: 18
                  y: 362
                  fontSize: 36
                  texts: ["~&4登记流程 / 01—03", "~&0两点圈定边界", "~&0签入区域编号", "~&0复核权属与规则"]
                  through: true
              图例线:
                type: Texture
                attribute: {x: 18, y: 530, width: 232, height: 2, normal: "~151,169,142,255", through: true}
              管理提示:
                type: Text
                attribute:
                  x: 18
                  y: 554
                  fontSize: 36
                  texts: ["~&2绿 / 准许生效", "~&4红 / 禁止或移除", "~&8灰 / 未设置", "~&8列表可滚轮 / 拖动"]
                  through: true
              管理标记:
                type: Text
                attribute: {point: ~bottom_left, x: 18, y: -22, fontSize: 36, texts: "~&4ADMIN / 管理操作", through: true}
          内容区:
            type: Canvas
            attribute: {x: 340, y: 152, width: "var.viewW - 388", height: "var.viewH - 188"}
            children:
              内容纸底:
                type: Texture
                attribute: {point: ~stretch_all, normal: "~247,244,232,255", through: true}
              纸张左刻度:
                type: Texture
                attribute: {x: 12, y: 24, width: 2, height: "var.viewH - 236", normal: "~204,211,192,255", through: true}
              纸张右刻度:
                type: Texture
                attribute: {point: ~top_right, x: -12, y: 24, width: 2, height: "var.viewH - 236", normal: "~204,211,192,255", through: true}
              区域列表布局:
                type: Canvas
                attribute: {x: 24, y: 24, width: "var.boardW", height: "var.viewH - 236", visible: "var.page == 'regions'"}
                children:
                  区域列表标题:
                    type: Text
                    attribute: {x: 0, y: 0, fontSize: 54, texts: "~&0区域登记簿 / 全域索引", through: true}
                  登记卷号:
                    type: Text
                    attribute: {point: ~top_right, x: -16, y: 8, fontSize: 36, texts: "~&4A—01  /  {var.regionCount} 宗档案", through: true}
                  登记说明:
                    type: Text
                    attribute: {x: 0, y: 52, fontSize: 36, texts: "~&8登记索引  /  按编号核对世界、优先级与占地体积；新增区域使用当前两点选区。", through: true}
                  登记分规:
                    type: Texture
                    attribute: {x: 0, y: 92, width: "var.boardW", height: 2, normal: "~189,202,179,255", through: true}
                  新建区域字段:
                    type: Canvas
                    attribute: {x: 0, y: 104, width: 480, height: 64}
                    children:
                      输入纸底:
                        type: Texture
                        attribute: {point: ~stretch_all, normal: "~230,233,215,255", through: true}
                      新建区域输入框:
                        type: TextBox
                        attribute: {x: 12, y: 8, width: 456, height: 44, length: 32, fontSize: 36, emptyText: "~&8新区域编号 / 名称"}
                        action:
                          textChange: |-
                            var.newRegionName = self.text
                  创建区域按钮:
                    type: Canvas
                    attribute: {x: 496, y: 104, width: 184, height: 64, enable: "var.actionToken != none && var.actionToken != ''"}
                    action:
                      click: |-
                        if(var.newRegionName != null && var.newRegionName != ''){
                          Packet.send(var.packetId, 'create_region', var.actionToken, var.newRegionName)
                        }
                    children:
                      创建按钮背景:
                        type: Texture
                        attribute: {point: ~stretch_all, normal: "~52,80,64,255", hover: "~70,104,80,255", through: true}
                      创建按钮文字:
                        type: Text
                        attribute: {point: ~middle_center, fontSize: 36, texts: "~&f登记区域 +", through: true}
                  登记注意:
                    type: Text
                    attribute: {x: 710, y: 120, fontSize: 36, texts: "~&4前置条件  /  木斧选定两点", through: true}
                  表头底:
                    type: Texture
                    attribute: {x: 0, y: 202, width: "var.boardW - 28", height: 42, normal: "~219,225,205,255", through: true}
                  登记表头:
                    type: Text
                    attribute: {x: 20, y: 210, fontSize: 36, texts: "~&8区域编号 / 所在世界", through: true}
                  数值表头:
                    type: Text
                    attribute: {x: "var.boardW - 680", y: 210, fontSize: 36, texts: "~&8优先级     /     体积（方块）", through: true}
                  区域列表滑轨:
                    type: Texture
                    attribute: {x: "var.boardW - 12", y: 256, width: 12, height: "var.viewH - 532", normal: "~213,222,202,255", through: true}
                  区域列表滑块:
                    type: Texture
                    val: 区域列表滑块
                    attribute: {x: "var.boardW - 12", y: 256, width: 12, height: 88, normal: "~86,111,95,255", hover: "~153,66,54,255", maxDragY: "var.viewH - 620"}
                  区域滚动栏:
                    type: Scroll
                    attribute: {x: 0, y: 256, width: "var.boardW - 28", height: "var.viewH - 532", moveY: "self.parent['区域列表滑块'].getDragYRatio()"}
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['区域列表滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['区域列表滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      regions_list:
                        val: region_data
                        type: VStack
                        attribute: {width: "var.boardW - 28", spaceBetween: 8}
                        children:
                          区域行:
                            type: Canvas
                            attribute: {entryKey: 0.round(), entry: "var.regionList.get(self.entryKey)", visible: self.entry != none, width: "var.boardW - 28", height: 90}
                            children:
                              区域行底:
                                type: Texture
                                attribute: {point: ~stretch_all, normal: "~235,236,221,255", through: true}
                              区域行标尺:
                                type: Texture
                                attribute: {x: 0, y: 0, width: 4, height: 90, normal: "~86,111,95,255", through: true}
                              区域编号文字:
                                type: Text
                                attribute: {x: 20, y: 12, fontSize: 48, texts: "~&0{self.parent.entry['id']}", limit: "self.parent.width - 700", through: true}
                              区域世界文字:
                                type: Text
                                attribute: {x: 20, y: 54, fontSize: 36, texts: "~&8世界 / {self.parent.entry['world']}", limit: "self.parent.width - 700", through: true}
                              区域优先级文字:
                                type: Text
                                attribute: {x: "self.parent.width - 652", y: 30, fontSize: 36, texts: "~&2P {self.parent.entry['priority']}", limit: 160, through: true}
                              区域体积文字:
                                type: Text
                                attribute: {x: "self.parent.width - 470", y: 30, fontSize: 36, texts: "~&0{self.parent.entry['volume']}", limit: 220, through: true}
                              编辑按钮:
                                type: Canvas
                                attribute: {x: "self.parent.width - 236", y: 18, width: 108, height: 54}
                                action:
                                  click: |-
                                    Packet.send(var.packetId, 'select_region', self.parent.entry['id'])
                                children:
                                  编辑按钮背景:
                                    type: Texture
                                    attribute: {point: ~stretch_all, normal: "~52,80,64,255", hover: "~70,104,80,255", through: true}
                                  编辑按钮文字:
                                    type: Text
                                    attribute: {point: ~middle_center, fontSize: 36, texts: "~&f复核", through: true}
                              删除按钮:
                                type: Canvas
                                attribute: {x: "self.parent.width - 116", y: 18, width: 100, height: 54, enable: "var.actionToken != none && var.actionToken != ''"}
                                action:
                                  click: |-
                                    Packet.send(var.packetId, 'delete_region', var.actionToken, self.parent.entry['id'])
                                children:
                                  删除按钮背景:
                                    type: Texture
                                    attribute: {point: ~stretch_all, normal: "~153,66,54,255", hover: "~181,79,64,255", through: true}
                                  删除按钮文字:
                                    type: Text
                                    attribute: {point: ~middle_center, fontSize: 36, texts: "~&f删除", through: true}
                  登记空状态:
                    type: Text
                    attribute: {x: 24, y: 292, fontSize: 48, texts: "~&8尚无区域登记。先选定两点，再填写编号。", visible: "var.regionCount == '0'", through: true}
                  登记页脚:
                    type: Text
                    attribute: {point: ~bottom_left, x: 0, y: -4, fontSize: 36, texts: "~&4删除会移除区域保护   &8|   滚轮浏览 / 拖动右侧滑条", through: true}
              编辑布局:
                type: Canvas
                attribute: {x: 24, y: 24, width: "var.boardW", height: "var.viewH - 236", visible: "var.page == 'edit'"}
                children:
                  编辑标题:
                    type: Text
                    attribute: {x: 0, y: 0, fontSize: 54, texts: "~&4A—02 &0边界复核 / {var.selId}", limit: "var.boardW - 320", through: true}
                  返回按钮:
                    type: Canvas
                    attribute: {x: "var.boardW - 160", y: 0, width: 160, height: 56}
                    action:
                      click: |-
                        Packet.send(var.packetId, 'navigate', 'regions')
                    children:
                      返回按钮背景:
                        type: Texture
                        attribute: {point: ~stretch_all, normal: "~220,225,205,255", hover: "~205,216,195,255", through: true}
                      返回按钮文字:
                        type: Text
                        attribute: {point: ~middle_center, fontSize: 36, texts: "~&0返回登记簿", through: true}
                  重命名字段:
                    type: Canvas
                    attribute: {x: 0, y: 76, width: 380, height: 58}
                    children:
                      重命名纸底:
                        type: Texture
                        attribute: {point: ~stretch_all, normal: "~230,233,215,255", through: true}
                      重命名输入框:
                        type: TextBox
                        attribute: {x: 12, y: 8, width: 356, height: 38, length: 32, fontSize: 36, emptyText: "~&8新区域编号 / 名称"}
                        action:
                          textChange: |-
                            var.renameValue = self.text
                  重命名按钮:
                    type: Canvas
                    attribute: {x: 396, y: 76, width: 144, height: 58, enable: "var.actionToken != none && var.actionToken != '' && var.selId != none && var.selId != ''"}
                    action:
                      click: |-
                        if(var.renameValue != null && var.renameValue != ''){
                          Packet.send(var.packetId, 'rename_region', var.actionToken, var.selId, var.renameValue)
                        }
                    children:
                      重命名按钮背景:
                        type: Texture
                        attribute: {point: ~stretch_all, normal: "~52,80,64,255", hover: "~70,104,80,255", through: true}
                      重命名按钮文字:
                        type: Text
                        attribute: {point: ~middle_center, fontSize: 36, texts: "~&f重命名", through: true}
                  重定义按钮:
                    type: Canvas
                    attribute: {x: "var.boardW - 284", y: 76, width: 284, height: 58, enable: "var.actionToken != none && var.actionToken != '' && var.selId != none && var.selId != ''"}
                    action:
                      click: |-
                        Packet.send(var.packetId, 'redefine_region', var.actionToken, var.selId)
                    children:
                      重定义按钮背景:
                        type: Texture
                        attribute: {point: ~stretch_all, normal: "~153,66,54,255", hover: "~181,79,64,255", through: true}
                      重定义按钮文字:
                        type: Text
                        attribute: {point: ~middle_center, fontSize: 36, texts: "~&f用当前选区重定义", through: true}
                  编辑信息文字:
                    type: Text
                    attribute: {x: 0, y: 152, fontSize: 36, texts: "~&8所在世界 &0{var.selWorld}   &8优先级 &0{var.selPriority}   &8父区域 &0{var.selParent != none && var.selParent != '' ? var.selParent : '无'}", limit: "var.boardW", through: true}
                  边界测量卡:
                    type: Canvas
                    attribute: {x: 0, y: 206, width: "var.boardW", height: 108}
                    children:
                      坐标纸底:
                        type: Texture
                        attribute: {point: ~stretch_all, normal: "~222,230,210,255", through: true}
                      坐标顶规:
                        type: Texture
                        attribute: {x: 0, y: 0, width: "var.boardW", height: 4, normal: "~153,66,54,255", through: true}
                      坐标底规:
                        type: Texture
                        attribute: {x: 20, y: 96, width: "var.boardW - 40", height: 1, normal: "~189,202,179,255", through: true}
                      坐标分线:
                        type: Texture
                        attribute: {x: "var.boardW / 2", y: 16, width: 2, height: 76, normal: "~151,169,142,255", through: true}
                      最小坐标标签:
                        type: Text
