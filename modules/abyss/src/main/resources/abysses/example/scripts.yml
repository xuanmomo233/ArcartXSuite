# ═══ Boss 门解锁（每个战斗房 on-clear 都会跑：肃清数≥1 且未开 → 开封） ═══
f1_gate:
  - "if_var f1_cleared >= 1"
  - "if_var f1_gate_open == 0"
  - "setvar f1_gate_open 1"
  - "fillblocks 112,61,17 112,64,22 AIR"
  - "title @all 5 40 10 &e&eBoss 之门开启|&7循着咆哮声找去"
  - "sound @all ENTITY_ENDER_DRAGON_GROWL 0.6 0.8"
  - "message @all &e迷宫深处的咆哮——守层 Boss 之门已开启"
f2_gate:
