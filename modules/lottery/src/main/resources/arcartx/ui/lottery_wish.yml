                  概率4星行:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 20
                      y: 216
                      texts: "'&7基础4星: &f' + var.base4Rate"
                      fontSize: 36
                      through: true

      # ════════════════════════════════════════════════════════════
      # 等待层: 点击祈愿后覆盖全屏，result/batch_result 到达后切换到结果层
      # ════════════════════════════════════════════════════════════
      等待层:
