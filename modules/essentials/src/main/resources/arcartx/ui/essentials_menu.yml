# AXS 资源说明
# 用途: Essentials 玩家功能菜单，支持首页/家/传送点/TPA/设置五个子页面。
# 前置依赖: ArcartX；Essentials 模块启用后自动注册。
# 打开方式: /axs essentials menu
# 数据交互: packetHandler 接收 init 推送；客户端通过 Packet.send('AXS_ESS_MENU', ...) 发送操作指令。
# 布局: 弹窗式居中面板（Adaptive + middle_center）= 标题栏 + 左导航 + 内容区
# 视觉规范:
#   面板玻璃 Frosted:30;255,255,255,100  卡片 62,66,74,210  描边 255,255,255,230
#   强调色（蓝青）80,180,255  成功 124,196,142  危险 235,100,100

ui:
  isHud: false
  background: true
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - page: 当前页面 (home/homes/warps/tpa/settings)
    #   - packetId: 服务端回包 ID，用于客户端 Packet.send 回传
    #   - playerName: 玩家名称
    #   - isFlying: 是否正在飞行
    #   - isGod: 是否开启无敌
    #   - isAfk: 是否挂机
    #   - flySpeed: 飞行速度
    #   - walkSpeed: 行走速度
    #   - location: 当前位置信息
    #   - homes: 家列表数据
    #   - homeCount: 家数量
    #   - warps: 传送点列表数据
    #   - warpCount: 传送点数量
    #   - onlinePlayers: 在线玩家列表
    #   - replantEnabled: 自动补种是否开启
    #   - autotoolEnabled: 自动工具切换是否开启
    init: |-
      var.page = packet['page']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.playerName = packet['playerName']
      var.isFlying = packet['isFlying']
      var.isGod = packet['isGod']
      var.isAfk = packet['isAfk']
      var.flySpeed = packet['flySpeed']
      var.walkSpeed = packet['walkSpeed']
      var.location = packet['location']
      var.homes = packet['homes']
      var.homeCount = packet['homeCount']
      var.warps = packet['warps']
      var.warpCount = packet['warpCount']
      var.onlinePlayers = packet['onlinePlayers']
      var.replantEnabled = packet['replantEnabled']
      var.autotoolEnabled = packet['autotoolEnabled']
  action:
    load: |-
          var.flySpeed = '0'
          var.homeCount = '0'
          var.location = ''
          var.packetId = 'AXS_ESS_MENU'
          var.playerName = ''
          var.walkSpeed = '0'
          var.warpCount = '0'
    open: |-
      Packet.send(var.packetId, 'refresh', 'home')

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 自适配布局：宽高 = 设计分辨率 1920x1080，窗口分辨率变化时按比例缩放子控件
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      # 主面板（弹窗居中）
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 960
          height: 640
        children:
          面板底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # ── 标题栏 ───────────────────────────────────────
          标题栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 0
              y: 0
              width: 960
              height: 72
            children:
              标题栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~Frosted:30;255,255,255,100
                  shape: ~round_rect
                  radius: 14
              标题栏底线:
                type: Texture
                attribute:
                  point: ~horizontal_stretch_bottom
                  height: 1
                  normal: ~62,66,74,210
              标题色块:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 24
                  width: 6
                  height: 32
                  normal: ~80,180,255,255
                  shape: ~round_rect
                  radius: 3
              标题:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 44
                  texts: "~&f玩家工具"
                  fontSize: 48
              标题竖线:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 224
                  width: 1
                  height: 26
                  normal: ~62,66,74,210
              标题玩家:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 244
                  texts: "'&7' + var.playerName"
                  fontSize: 36
              关闭按钮:
                type: Canvas
                attribute:
                  point: ~middle_right
                  x: -24
                  width: 36
                  height: 36
                action:
                  clickLeft: |-
                    Screen.close()
                children:
                  关闭背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~62,66,74,210
                      shape: ~round_rect
                      radius: 9
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '235,100,100,255' : '255,255,255,230'"
                  关闭文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f✕"
                      fontSize: 36
                      through: true

          # ── 左侧导航 ─────────────────────────────────────
          导航栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 0
              y: 72
              width: 180
              height: 568
            children:
              导航底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~Frosted:30;255,255,255,80
              导航底线:
                type: Texture
                attribute:
                  point: ~vertical_stretch_right
                  width: 1
                  normal: ~62,66,74,210
              # 首页
              导航首页:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 12
                  y: 16
                  width: 156
                  height: 52
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'home')
                children:
                  首页底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'home' ? '80,180,255,210' : '62,66,74,180'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "var.page == 'home' ? '80,180,255,230' : (self.isHovered() ? '120,200,255,255' : '255,255,255,180')"
                  首页文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'home' ? '&0首页' : '&f首页'"
                      fontSize: 36
                      through: true
              # 家列表
              导航家列表:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 12
                  y: 76
                  width: 156
                  height: 52
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'homes')
                children:
                  家列表底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'homes' ? '80,180,255,210' : '62,66,74,180'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "var.page == 'homes' ? '80,180,255,230' : (self.isHovered() ? '120,200,255,255' : '255,255,255,180')"
                  家列表文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'homes' ? '&0家' : '&f家'"
                      fontSize: 36
                      through: true
              # 传送点
              导航传送点:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 12
                  y: 136
                  width: 156
                  height: 52
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'warps')
                children:
                  传送点底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'warps' ? '80,180,255,210' : '62,66,74,180'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "var.page == 'warps' ? '80,180,255,230' : (self.isHovered() ? '120,200,255,255' : '255,255,255,180')"
                  传送点文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'warps' ? '&0传送点' : '&f传送点'"
                      fontSize: 36
                      through: true
              # 传送请求
              导航传送请求:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 12
                  y: 196
                  width: 156
                  height: 52
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'tpa')
                children:
                  传送请求底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'tpa' ? '80,180,255,210' : '62,66,74,180'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "var.page == 'tpa' ? '80,180,255,230' : (self.isHovered() ? '120,200,255,255' : '255,255,255,180')"
                  传送请求文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'tpa' ? '&0传送' : '&f传送'"
                      fontSize: 36
                      through: true
              # 设置
              导航设置:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 12
                  y: 256
                  width: 156
                  height: 52
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'settings')
                children:
                  设置底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'settings' ? '80,180,255,210' : '62,66,74,180'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "var.page == 'settings' ? '80,180,255,230' : (self.isHovered() ? '120,200,255,255' : '255,255,255,180')"
                  设置文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'settings' ? '&0设置' : '&f设置'"
                      fontSize: 36
                      through: true
              导航提示:
                type: Text
                attribute:
                  point: ~bottom_left
                  x: 16
                  y: -16
                  texts: "~&7ESC 关闭"
                  fontSize: 36

          # ── 右侧内容区 ───────────────────────────────────
          内容区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 180
              y: 72
              width: 780
              height: 568
            children:
              # ─── 首页视图 ───
              首页布局:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 24
                  width: 732
                  height: 520
                  visible: |-
                    var.page == 'home'
                children:
                  首页标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      texts: "~&f玩家状态"
                      fontSize: 48
                  # 状态卡片
                  状态卡片:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 60
                      width: 732
                      height: 380
                    children:
                      状态卡底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~62,66,74,180
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,180
                      状态飞行:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 32
                          texts: "'&7飞行 &f' + (var.isFlying == 'true' ? '&a开启' : '&c关闭')"
                          fontSize: 36
                      状态无敌:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 80
                          texts: "'&7无敌 &f' + (var.isGod == 'true' ? '&a开启' : '&c关闭')"
                          fontSize: 36
                      状态闲置:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 128
                          texts: "'&7挂机 &f' + (var.isAfk == 'true' ? '&e是' : '&a否')"
                          fontSize: 36
                      状态速度:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 176
                          texts: "'&7飞行速度 &f' + var.flySpeed + '  &7行走速度 &f' + var.walkSpeed"
                          fontSize: 36
                      状态位置:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 224
                          texts: "'&7位置 &f' + var.location"
                          fontSize: 36
                      状态统计:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 272
                          texts: "'&7家数量 &b' + var.homeCount + '  &7传送点 &b' + var.warpCount"
                          fontSize: 36

              # ─── 家列表视图 ───
              家列表布局:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 24
                  width: 732
                  height: 520
                  visible: |-
                    var.page == 'homes'
                children:
                  家列表标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      texts: "~&f我的家"
                      fontSize: 48
                  设置家按钮:
                    type: Canvas
                    attribute:
                      point: ~top_right
                      x: 0
                      y: -2
                      width: 130
                      height: 44
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'set_home', var.actionToken, 'home')
                    children:
                      设置家底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~50,140,80,210
                          hover: ~70,170,100,230
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 2
                            color: "self.isHovered() ? '124,196,142,255' : '255,255,255,230'"
                      设置家文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&f设置家"
                          fontSize: 36
                          through: true
                  家滑块:
                    type: Texture
                    val: 家滑块
                    attribute:
                      point: ~top_right
                      x: -6
                      y: 60
                      width: 6
                      height: 50
                      normal: ~120,120,120,200
                      maxDragY: 410
                  家滚动栏:
                    type: Scroll
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 60
                      width: 726
                      height: 460
                      moveY: "self.parent['家滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      homes_list:
                        val: home_data
                        type: VStack
                        attribute:
                          x: 0
                          y: 0
                          width: 726
                          spaceBetween: 8
                        children:
                          家项目:
                            type: Canvas
                            attribute:
                              entry: var.homes[self.key]
                              visible: self.entry != none
                              width: 720
                              height: 60
                            children:
                              家项目底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~62,66,74,210
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  stroke:
                                    width: 2
                                    color: ~255,255,255,180
                              家项目名称:
                                type: Text
                                attribute:
                                  point: ~middle_left
                                  x: 20
                                  texts: "'&b' + self.parent.entry['name']"
                                  fontSize: 36
                                  through: true
                              家项目坐标:
                                type: Text
                                attribute:
                                  point: ~middle_left
                                  x: 200
                                  texts: "'&7' + self.parent.entry['world'] + ' ' + self.parent.entry['coords']"
                                  fontSize: 36
                                  through: true
                              传送家按钮:
                                type: Canvas
                                attribute:
                                  point: ~middle_right
                                  x: -106
                                  width: 80
                                  height: 40
                                action:
                                  clickLeft: |-
                                    Packet.send(var.packetId, 'teleport_home', var.actionToken, self.parent.entry['name'])
                                children:
                                  传送家底:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: ~60,140,200,210
                                      hover: ~80,170,230,230
                                      shape: ~round_rect
                                      radius: 8
                                    effect:
                                      ripple:
                                      stroke:
                                        width: 2
                                        color: "self.isHovered() ? '120,200,255,255' : '255,255,255,180'"
                                    传送家文字:
                                      type: Text
                                      attribute:
                                        point: ~middle_center
                                        texts: "~&f传送"
                                        fontSize: 36
                                        through: true
                              删除家按钮:
                                type: Canvas
                                attribute:
                                  point: ~middle_right
                                  x: -16
                                  width: 80
                                  height: 40
                                action:
                                  clickLeft: |-
                                    Packet.send(var.packetId, 'delete_home', var.actionToken, self.parent.entry['name'])
                                children:
                                  删除家底:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: ~180,50,50,210
                                      hover: ~220,70,70,230
                                      shape: ~round_rect
                                      radius: 8
                                    effect:
                                      ripple:
                                      stroke:
                                        width: 2
                                        color: "self.isHovered() ? '235,100,100,255' : '255,255,255,180'"
                                  删除家文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      texts: "~&f删除"
                                      fontSize: 36
                                      through: true

              # ─── 传送点视图 ───
              传送点布局:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 24
                  width: 732
                  height: 520
                  visible: |-
                    var.page == 'warps'
                children:
                  传送点标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      texts: "~&f传送点列表"
                      fontSize: 48
                  传送点滑块:
                    type: Texture
                    val: 传送点滑块
                    attribute:
                      point: ~top_right
                      x: -6
                      y: 60
                      width: 6
                      height: 50
                      normal: ~120,120,120,200
                      maxDragY: 410
                  传送点滚动栏:
                    type: Scroll
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 60
                      width: 726
                      height: 460
                      moveY: "self.parent['传送点滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['传送点滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['传送点滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      warps_list:
                        val: warp_data
                        type: VStack
                        attribute:
                          x: 0
                          y: 0
                          width: 726
                          spaceBetween: 8
                        children:
                          传送点项目:
                            type: Canvas
                            attribute:
                              entry: var.warps[self.key]
                              visible: self.entry != none
                              width: 720
                              height: 56
                            children:
                              传送点项目底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~62,66,74,210
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  stroke:
                                    width: 2
                                    color: ~255,255,255,180
                              传送点项目名称:
                                type: Text
                                attribute:
                                  point: ~middle_left
                                  x: 20
                                  texts: "'&e' + self.parent.entry"
                                  fontSize: 36
                                  through: true
                              传送点传送按钮:
                                type: Canvas
                                attribute:
                                  point: ~middle_right
                                  x: -16
                                  width: 90
                                  height: 40
                                action:
                                  clickLeft: |-
                                    Packet.send(var.packetId, 'teleport_warp', var.actionToken, self.parent.entry)
                                children:
                                  传送底:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: ~60,140,200,210
                                      hover: ~80,170,230,230
                                      shape: ~round_rect
                                      radius: 8
                                    effect:
                                      ripple:
                                      stroke:
                                        width: 2
                                        color: "self.isHovered() ? '120,200,255,255' : '255,255,255,180'"
                                  传送文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      texts: "~&f传送"
                                      fontSize: 36
                                      through: true

              # ─── TPA 视图 ───
              传送请求布局:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 24
                  width: 732
                  height: 520
                  visible: |-
                    var.page == 'tpa'
                children:
                  传送请求标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      texts: "~&f传送请求"
                      fontSize: 48
                  传送请求提示:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 52
                      texts: "~&7点击玩家名发送传送请求"
                      fontSize: 36
                  接受传送请求按钮:
