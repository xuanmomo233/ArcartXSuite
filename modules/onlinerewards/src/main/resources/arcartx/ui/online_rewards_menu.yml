                      height: 60
                      normal: ~50,170,200,220
                      maxDragY: "var.viewH - 324"
                      shape: ~round_rect
                      radius: 6
                  阶段奖滚动区:
                    type: Scroll
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      width: "var.contentW - 64"
                      height: "var.viewH - 264"
                      moveY: "self.parent['阶段奖滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['阶段奖滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['阶段奖滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
