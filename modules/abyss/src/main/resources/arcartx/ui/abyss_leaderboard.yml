# AXS Abyss 通关排行：独立列、动态行、空状态和滚动，不使用空格对齐。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonName = packet['dungeonName']
      var.rows = packet['boardRows']
      var.count = packet['boardCount']
      self.actions['rebuild']()
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.viewNonce = ''
      var.dungeonName = ''
      var.rows = {}
      var.count = 0
      var.builtCount = -1
      var.rowRefs = {}
      var.revision = 0
    open: |-
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'leaderboard', var.actionToken, var.viewNonce)
      }
    rebuild: |-
      if(var.builtCount != var.count){
        for(key in var.rowRefs.keys()){ var.rowRefs[key].remove() }
        var.rowRefs = {}
        var.builtCount = var.count
        var.revision = (var.revision + 1).round()
        template = val.rows.get(0)
        template.entryKey = 0.round()
        if(var.count > 1){
          for(i in range(1, var.count - 1)){
            row = template.copy('row_' + var.revision + '_' + i.round())
            row.entryKey = i.round()
            var.rowRefs[i.round()] = row
          }
        }
      }
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;16,12,30,220
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      visible: "var.actionToken != ''"
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1040
          height: 780
        children:
          面板底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~24,19,40,245
              shape: ~round_rect
              radius: 16
              through: true
          标题:
            type: Text
            attribute:
              height: 44
              limitControl: self
              x: 32
              y: 28
              width: 920
              texts: "'&f通关排行  &7· ' + var.dungeonName"
              limit: 28
              fontSize: 44
              through: true
          表头底:
            type: Texture
            attribute:
              x: 28
              y: 104
              width: 984
              height: 48
              normal: ~68,52,96,220
              shape: ~round_rect
              radius: 8
              through: true
          表头名次:
            type: Text
            attribute:
              height: 28
              limitControl: self
              x: 44
              y: 115
              width: 80
              texts: ~&f名次
              fontSize: 28
              through: true
          表头玩家:
            type: Text
            attribute:
              height: 28
              limitControl: self
              x: 140
              y: 115
              width: 320
              texts: ~&f玩家
              fontSize: 28
              through: true
          表头最佳时间:
            type: Text
            attribute:
              height: 28
              limitControl: self
              x: 508
              y: 115
              width: 220
              texts: ~&f最佳时间
              fontSize: 28
              through: true
          表头通关次数:
            type: Text
            attribute:
              height: 28
              limitControl: self
              x: 764
              y: 115
              width: 200
              texts: ~&f通关次数
              fontSize: 28
              through: true
          滑块:
            type: Texture
            val: slider
            attribute:
              x: 1000
              y: 166
              width: 8
              height: 72
              maxDragY: 432
              normal: ~186,140,232,235
              shape: ~round_rect
              radius: 4
          行滚动区:
            type: Scroll
            attribute:
              x: 28
              y: 164
              width: 964
              height: 504
              moveY: "val.slider.getDragYRatio()"
            action:
              wheel: |-
                val.slider.setDragYRatio(Math.max(0, Math.min(1, self.moveY - self.wheelValue * 0.1)))
            children:
              行列表:
                type: VStack
                val: rows
                attribute:
                  maxSize: 2147483647
                  width: 964
                  spaceBetween: 6
                children:
                  行:
                    type: Canvas
                    attribute:
                      width: 964
                      height: 52
                      entryKey: 0.round()
                      entry: "var.rows[self.entryKey]"
                      visible: "self.entry != none"
                    children:
                      行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~38,30,58,210
                          shape: ~round_rect
                          radius: 6
                          through: true
                      列名次:
                        type: Text
                        attribute:
                          height: 28
                          limitControl: self
                          x: 16
                          y: 12
                          width: 80
                          texts: "'&e#' + self.parent.entry['rank'].round()"
                          fontSize: 28
                          limit: 5
                          through: true
                      列玩家:
                        type: Text
                        attribute:
                          height: 28
                          limitControl: self
                          x: 112
                          y: 12
                          width: 320
                          texts: "'&f' + self.parent.entry['name']"
                          fontSize: 28
                          limit: 16
                          through: true
                      列最佳时间:
                        type: Text
                        attribute:
                          height: 28
                          limitControl: self
                          x: 480
                          y: 12
                          width: 220
                          texts: "'&e' + self.parent.entry['time']"
                          fontSize: 28
                          limit: 12
                          through: true
                      列通关次数:
                        type: Text
                        attribute:
                          height: 28
                          limitControl: self
                          x: 736
                          y: 12
                          width: 200
                          texts: "'&7' + self.parent.entry['completionsText']"
                          fontSize: 28
                          limit: 12
                          through: true
          空状态:
            type: Text
            attribute:
              point: ~middle_center
              texts: ~&7暂无通关排行记录
              visible: "var.count == 0"
              fontSize: 32
              through: true
          关闭:
            type: Canvas
            attribute:
              point: ~bottom_center
              y: -28
              width: 160
              height: 48
            action:
              clickLeft: "Screen.close()"
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~70,60,100,235
                  shape: ~round_rect
                  radius: 8
                  through: true
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f关闭
                  fontSize: 30
                  through: true
