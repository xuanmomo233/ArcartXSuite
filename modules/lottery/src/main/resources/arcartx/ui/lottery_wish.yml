                width: 4
                color: ~120,160,235,220
          标题:
            type: Text
            attribute:
              point: ~top_left
              x: 32
              y: 24
              texts: "~&f积分兑换"
              fontSize: 48
          关闭按钮:
            type: Canvas
            attribute:
              point: ~bottom_center
              y: -20
              width: 200
              height: 56
            action:
              clickLeft: |-
                val.兑换面板.visible = false
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~40,48,74,240
                  hover: ~62,78,120,245
                  shape: ~round_rect
                  radius: 26
                effect:
                  stroke:
                    width: 3
                    color: ~120,160,235,235
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 200
                  texts: "~&f关闭"
                  fontSize: 36
                  through: true
          顶部分界线:
            type: Texture
            attribute:
              point: ~top_left
              x: 24
              y: 140
              width: 936
              height: 2
              normal: ~120,160,235,180
              shape: ~round_rect
              radius: 1
          积分余额栏:
            type: HStack
            val: 积分余额栏
            attribute:
              point: ~top_left
              x: 24
              y: 76
              height: 60
              spaceBetween: 28
            action:
              create: |-
                for(i in range(1, 3)){
                  key = i.round()
                  e = self['积分条目0'].copy('积分条目' + key)
                  e.entryKey = key
                  e['图标'].entryKey = key
                  e['名称'].entryKey = key
                  e['余额'].entryKey = key
                }
            children:
              积分条目0:
                type: Canvas
                attribute:
                  entryKey: 0.round()
                  width: 210
                  height: 60
                  visible: "var.pointBalanceRows != none && var.pointBalanceRows[self.entryKey] != none"
                children:
                  条目底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~22,28,44,240
                      shape: ~round_rect
                      radius: 6
                    effect:
                      stroke:
                        width: 3
                        color: ~120,160,235,180
                  图标:
                    type: Slot
                    attribute:
                      entryKey: 0.round()
                      point: ~middle_left
                      x: 8
                      slotType: ~Icon
                      width: 44
                      height: 44
                      normal: ~0,0,0,0
                      seticon: "self.setItemIcon(var.pointIconJsons != none && var.pointIconJsons[self.entryKey] != none ? var.pointIconJsons[self.entryKey] : var.air)"
                  名称:
                    type: Text
                    attribute:
                      entryKey: 0.round()
                      point: ~middle_left
                      x: 60
                      y: -12
                      texts: "var.pointBalanceRows != none && var.pointBalanceRows[self.entryKey] != none ? '&7' + var.pointBalanceRows[self.entryKey]['displayName'] : ''"
                      fontSize: 32
                  余额:
                    type: Text
                    attribute:
                      entryKey: 0.round()
                      point: ~middle_left
                      x: 60
                      y: 14
                      texts: "var.pointBalanceRows != none && var.pointBalanceRows[self.entryKey] != none ? '&6' + var.pointBalanceRows[self.entryKey]['amount'].round() : ''"
                      fontSize: 36
          兑换滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -16
              y: 156
              width: 10
              height: 484
              normal: ~20,24,38,220
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 3
                color: ~120,160,235,180
          兑换滑块:
            type: Texture
            attribute:
              point: ~top_right
              x: -16
              y: 156
              width: 10
              height: 60
              normal: ~120,160,235,255
              maxDragY: 484 - 60
              dragY: 0
              shape: ~round_rect
              radius: 4
          兑换滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 156
              width: 880
              height: 484
              moveY: "self.parent['兑换滑块'].getDragYRatio()"
              through: false
            action:
              wheel: |-
                if(self.moveY >= 0){
                  if(self.wheelValue > 0){
                    self.parent['兑换滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                  }
                }
                if(self.moveY <= 1){
                  if(self.wheelValue < 0){
                    self.parent['兑换滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                  }
                }
            children:
              兑换列表:
                type: VStack
                val: 兑换列表
                attribute:
                  point: ~top_left
                  x: 0
                  y: 0
                  width: 880
                  spaceBetween: 12
                children:
                  兑换行0:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      width: 860
                      height: 64
                      visible: "var.exchangeRows != none && var.exchangeRows[self.entryKey] != none"
                    children:
                      行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~22,28,44,240
                          shape: ~round_rect
                          radius: 6
                        effect:
                          stroke:
                            width: 3
                            color: ~120,160,235,180
                      商品图标:
                        type: Slot
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 12
                          slotType: ~Icon
                          width: 44
                          height: 44
                          normal: ~0,0,0,0
                          seticon: "self.setItemIcon(var.exchangeIconJsons != none && var.exchangeIconJsons[self.entryKey] != none ? var.exchangeIconJsons[self.entryKey] : var.air)"
                      商品名称:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 68
                          y: -12
                          texts: "var.exchangeRows != none && var.exchangeRows[self.entryKey] != none ? '&f' + var.exchangeRows[self.entryKey]['name'] : ''"
                          fontSize: 28
                          limit: 16
                          through: true
                      消耗文本:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 68
                          y: 12
                          texts: "var.exchangeRows != none && var.exchangeRows[self.entryKey] != none ? '&7消耗 &6' + var.exchangeRows[self.entryKey]['costRows'][0]['displayName'] + ' x' + var.exchangeRows[self.entryKey]['costRows'][0]['amount'].round() + (var.exchangeRows[self.entryKey]['costRows'][1] != none ? ' &7+ &6' + var.exchangeRows[self.entryKey]['costRows'][1]['displayName'] + ' x' + var.exchangeRows[self.entryKey]['costRows'][1]['amount'].round() : '') : ''"
                          fontSize: 26
                          through: true
                      限购文本:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_right
                          x: -140
                          texts: "var.exchangeRows != none && var.exchangeRows[self.entryKey] != none ? (var.exchangeRows[self.entryKey]['limit'] == 0 ? '&7不限购' : '&7剩余 ' + var.exchangeRows[self.entryKey]['remaining'].round() + '/' + var.exchangeRows[self.entryKey]['limit'].round()) : ''"
                          fontSize: 26
                          through: true
                      兑换按钮:
                        type: Texture
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_right
                          x: -12
                          width: 110
                          height: 44
                          normal: "{var.exchangeRows != none && var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] == true ? '120,160,235,255' : '28,34,54,230'}"
                          hover: "{var.exchangeRows != none && var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] == true ? '160,200,255,255' : '28,34,54,230'}"
                          shape: ~round_rect
                          radius: 22
                          texts: "var.exchangeRows != none && var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] == true ? '&0兑换' : '&7已达上限'"
                          center: true
                          fontSize: 28
                          enable: "!var.actionBusy && var.actionToken != ''"
                        effect:
                          stroke:
                            width: 3
                            color: ~120,160,235,150
                        action:
                          click: |-
                            if(var.exchangeRows != none && var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] != none && var.exchangeRows[self.entryKey]['canExchange'] == true){
                              var.actionBusy = true
                              var.actionBusySeconds = 0
                              Packet.send(var.packetId, 'exchange_buy', var.exchangeRows[self.entryKey]['id'], var.actionToken)
                            }
          兑换空态:
            type: Text
            attribute:
              point: ~middle_center
              texts: "~&7暂无可兑换内容"
              fontSize: 36
              visible: "var.exchangeCount != none && var.exchangeCount == 0"

  # ── 资源不足提示 ────────────────────────────────────────
  资源不足提示:
    type: Canvas
    val: 资源不足提示
