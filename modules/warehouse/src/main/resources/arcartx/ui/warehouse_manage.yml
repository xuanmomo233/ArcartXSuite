              仓库底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple: null
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''100,110,120,220'''
              仓库文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: ~&f仓库
                  fontSize: 36
                  through: true
          导航银行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: Packet.send(var.packetId, 'bank')
            children:
              银行底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple: null
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''100,110,120,220'''
              银行文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: ~&f银行
                  fontSize: 36
                  through: true
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~180,190,200,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,255
              管理高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~180,190,200,255
                  shape: ~round_rect
                  radius: 2
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: ~&0管理
                  fontSize: 36
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 232
              width: 264
              height: 2
              normal: ~100,110,120,220
          仓库列表标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 250
              texts: ~&f仓库列表
              fontSize: 36
          新建名:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 296
              width: 160
              height: 48
            children:
              新建名底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~36,42,50,225
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''100,110,120,220'''
              输入框:
                type: TextBox
                attribute:
                  x: 10
                  y: 6
                  width: 140
                  height: 36
                  length: 24
                  emptyText: ~&7共享名
                  fontSize: 36
                action:
                  textChange: var.sharedName = self.getContent()
          创建:
            type: Canvas
            attribute:
              point: ~top_left
              x: 182
              y: 296
              width: 100
              height: 48
              enable: '!var.actionBusy && var.actionToken != '''''
            action:
              clickLeft: |-
                var.actionBusy = true
                Packet.send(var.packetId, 'shared_create', var.sharedName, var.actionToken)
            children:
              创建底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~160,170,180,235
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''160,170,180,255'''
              创建字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&0新建
                  fontSize: 36
                  through: true
          创建费用:
            type: Text
            attribute:
              point: ~top_left
              x: 14
              y: 352
              texts: '''&e'' + var.sharedCreateCostText'
              fontSize: 36
          仓库滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -12
              y: 396
              width: 10
              height: var.viewH - 590
              normal: ~40,44,52,225
              shape: ~round_rect
              radius: 5
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          仓库滑块:
            type: Texture
            val: 仓库滑块
            attribute:
              point: ~top_right
              x: -12
              y: 396
              width: 10
              height: 50
              normal: ~180,190,200,255
              maxDragY: var.viewH - 640
              shape: ~round_rect
              radius: 5
          仓库滚动:
            type: Scroll
            val: 仓库滚动
            attribute:
              point: ~top_left
              x: 14
              y: 396
              width: 258
              height: var.viewH - 590
              moveY: self.parent['仓库滑块'].getDragYRatio()
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              共享列表:
                val: 共享列表
                type: VStack
                attribute:
                  width: 258
                  spaceBetween: 8
                children:
                  项:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.manageWarehouses[self.entryKey]
                      visible: self.entry != none
                      width: 258
                      height: 48
                    action:
                      clickLeft: |-
                        var.deleteConfirm = false
                        if(var.manageWarehouseTypes[self.entryKey] == 'shared'){
                          Packet.send(var.packetId, 'shared', var.manageWarehouseTargets[self.entryKey])
                        }else{
                          Packet.send(var.packetId, 'warehouse', var.manageWarehouseTargets[self.entryKey])
                        }
                    children:
                      项背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: 'var.manageWarehouseSelected[self.parent.entryKey] ? ''64,72,82,225'' : ''44,50,58,245'''
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: 'self.isHovered() ? ''220,230,240,255'' : (var.manageWarehouseSelected[self.parent.entryKey] ? ''255,255,255,255''
                              : ''100,110,120,220'')'
                      项文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: '''&f'' + self.parent.entry[''name'']'
                          fontSize: 36
                          through: true
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: ~&fESC 关闭界面
              fontSize: 36
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: 372 - var.offX
          y: 120
          width: var.contentW
          height: var.viewH - 144
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~100,110,120,220
          设置区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 20
              width: var.halfW - 20
              height: var.viewH - 184
            children:
              设置区底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~36,42,50,225
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 3
                    color: ~100,110,120,220
              设置标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 20
                  texts: ~&f仓库设置
                  fontSize: 36
              拾取标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 64
                  texts: 'var.pickupScannerActive ? ''&f自动入库 · 扫描拾取模式'' : ''&f自动入库 · 自动拾取模式'''
                  fontSize: 28
              拾取关闭提示:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 108
                  visible: '!var.serverAutoPickup'
                  texts: ~&7服务器未开启自动拾取入库功能
                  fontSize: 36
              拾取组:
                type: HStack
                attribute:
                  point: ~top_left
                  x: 20
                  y: 108
                  width: var.halfW - 60
                  height: 48
                  spaceBetween: 8
                  visible: var.serverAutoPickup
                children:
                  自动入库:
                    type: Canvas
                    attribute:
                      width: 'var.serverMythicLoot ? (var.halfW - 76) / 3 : (var.halfW - 68) / 2'
                      height: 48
                      enable: '!var.pickupBusy && var.actionToken != '''''
                    action:
                      clickLeft: |-
                        var.pickupBusy = true
                        Packet.send(var.packetId, 'toggle_auto_pickup', var.actionToken)
                    children:
                      自动入库底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: 'var.autoPickup ? ''64,72,82,225'' : ''44,50,58,245'''
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: 'self.isHovered() ? ''220,230,240,255'' : (var.autoPickup ? ''255,255,255,255'' : ''100,110,120,220'')'
                      自动入库字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: 'var.autoPickup ? ''&a自动入库'' : ''&7自动入库'''
                          fontSize: 36
                          through: true
                  怪物战利品:
                    type: Canvas
                    attribute:
                      width: (var.halfW - 76) / 3
                      height: 48
                      visible: var.serverMythicLoot
                      enable: '!var.mythicBusy && var.actionToken != '''''
                    action:
                      clickLeft: |-
                        var.mythicBusy = true
                        Packet.send(var.packetId, 'toggle_auto_mythic', var.actionToken)
                    children:
                      怪物战利品底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: 'var.autoPickupMythic ? ''64,72,82,225'' : ''44,50,58,245'''
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: 'self.isHovered() ? ''220,230,240,255'' : (var.autoPickupMythic ? ''255,255,255,255'' : ''100,110,120,220'')'
                      怪物战利品字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: 'var.autoPickupMythic ? ''&a怪物战利品'' : ''&7怪物战利品'''
                          fontSize: 36
                          through: true
                  入库通知:
