# ArcartXBattlePass 主配置文件
# 定义战令系统的存储、赛季、任务、奖励、UI 及跨服同步等核心参数

config-version: 2  # 配置版本号，变更时触发迁移

# 存储配置：支持 sqlite 与 mysql 两种模式
storage:
  mode: sqlite  # 存储模式：sqlite 或 mysql
  sqlite-file-name: battlepass.db  # SQLite 数据库文件名
  pool-size: 1  # 数据库连接池大小
  mysql-host: localhost  # MySQL 主机地址
  mysql-port: 3306  # MySQL 端口
  mysql-database: axs_battlepass  # MySQL 数据库名
  mysql-username: root  # MySQL 用户名
  mysql-password: ""  # MySQL 密码

# 赛季配置：定义当前赛季的基本参数
season:
  season-id: "season-1"  # 赛季唯一标识
  display-name: "第一赛季"  # 赛季显示名称
  max-level: 100  # 赛季最大等级
  xp-per-level: 1000  # 每级所需经验值
  start-date: "2026-06-01"  # 赛季开始日期
  end-date: "2026-08-01"  # 赛季结束日期

# ---------------------------------------------------------------------------
# 任务配置
# ---------------------------------------------------------------------------
# 任务模板已拆分为外部文件，位于 <模块数据目录>/<tasks-directory>/ 下：
#   - daily.yml  : 每日任务池
#   - weekly.yml : 每周任务池
#   - season.yml : 赛季任务池
#
# 每日/每周任务从池中按 weight 加权随机抽取，抽取数量由 daily-count / weekly-count 控制
# ---------------------------------------------------------------------------
tasks:
  daily-count: 3                  # 每天分配给玩家的每日任务数量
  weekly-count: 2                 # 每周分配给玩家的每周任务数量
  tasks-directory: "tasks"        # 任务文件所在目录（相对模块数据目录）

# 等级奖励定义。
# 注意：本段必须为 Mapping（键值对）结构，顶层键为任意唯一标识，内部必须包含 level 与 free/premium/deluxe 奖励。
# 代码使用 section.getKeys(false) 遍历，若写成 YAML 列表会导致奖励无法加载。
rewards:
  "1":  # 奖励唯一标识（任意字符串，需全局唯一）
    level: 1  # 达到该等级时可领取
    free:  # 免费档奖励
      type: command  # 奖励类型：command（执行命令）
      data: "give {player} diamond 1"  # 奖励数据：执行的命令（{player} 为玩家名占位符）
    premium:  # 高级版档奖励
      type: command
      data: "give {player} diamond 5"
    deluxe:  # 豪华版档奖励
      type: command
      data: "give {player} diamond 8"
  "2":
    level: 2
    free:
      type: command
      data: "give {player} iron_ingot 8"
    premium:
      type: command
      data: "give {player} iron_ingot 32"
    deluxe:
      type: command
      data: "give {player} iron_ingot 48"
  "5":
    level: 5
    free:
      type: command
      data: "give {player} experience_bottle 4"
    premium:
      type: command
      data: "give {player} experience_bottle 16"
    deluxe:
      type: command
      data: "give {player} experience_bottle 24"
  "10":
    level: 10
    free:
      type: command
      data: "give {player} emerald 2"
    premium:
      type: command
      data: "give {player} emerald 8"
    deluxe:
      type: command
      data: "give {player} emerald 12"

# UI 配置：控制界面注册与绑定
ui:
  register-on-enable: true  # 模块启动时是否自动注册 UI
  main-id: "battlepass_main"  # 主界面 UI 标识
  tasks-id: "battlepass_tasks"  # 任务列表界面 UI 标识

# 跨服同步配置
cross-server:
  enabled: false  # 是否启用跨服数据同步
  sync-fields:  # 需要同步的字段列表
    - "progress"  # 战令等级与经验进度
    - "task-progress"  # 任务完成进度
    - "claimed-rewards"  # 已领取的奖励记录
