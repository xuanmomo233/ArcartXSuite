# 战利品野外工具组 / 附近清单：右侧羊皮纸目录，中心视野保持开放。
# 色签沿用物品名称首个颜色码；不推断服务器未提供的稀有度等级。
ui:
  isHud: true
  defaultOpen: false
  through: false
  show: true
  packetHandler:
    update: |-
      var.count = packet['count']
      var.selectedIndex = packet['selectedIndex']
      if(var.count == 0){
        var.menuOpen = false
      }
      var.item0Visible = packet['item0Visible']
      var.item0Amount = packet['item0Amount']
      var.item0ItemJson = packet['item0ItemJson']
      var.item1Visible = packet['item1Visible']
      var.item1Amount = packet['item1Amount']
      var.item1ItemJson = packet['item1ItemJson']
      var.item2Visible = packet['item2Visible']
      var.item2Amount = packet['item2Amount']
      var.item2ItemJson = packet['item2ItemJson']
      var.item3Visible = packet['item3Visible']
      var.item3Amount = packet['item3Amount']
      var.item3ItemJson = packet['item3ItemJson']
      var.item4Visible = packet['item4Visible']
      var.item4Amount = packet['item4Amount']
      var.item4ItemJson = packet['item4ItemJson']
      var.item5Visible = packet['item5Visible']
      var.item5Amount = packet['item5Amount']
      var.item5ItemJson = packet['item5ItemJson']
      var.item6Visible = packet['item6Visible']
      var.item6Amount = packet['item6Amount']
      var.item6ItemJson = packet['item6ItemJson']
      var.item7Visible = packet['item7Visible']
      var.item7Amount = packet['item7Amount']
      var.item7ItemJson = packet['item7ItemJson']
      var.dirty = true
    select: |-
      var.selectedIndex = packet['selectedIndex']
    open_interact: |-
      var.menuOpen = true
      var.actionToken = packet['action_token']
      Screen.open('AXS:loot_interact')
    menu_closed: |-
      var.menuOpen = false
  action:
    load: |-
      var.count = 0
      var.item0Amount = 0
      var.item1Amount = 0
      var.item2Amount = 0
      var.item3Amount = 0
      var.item4Amount = 0
      var.item5Amount = 0
      var.item6Amount = 0
      var.item7Amount = 0
      var.selectedIndex = 0
      var.dirty = false
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.nameColors = {'§0':'70,70,70,255', '§1':'70,90,166,255', '§2':'87,145,91,255', '§3':'70,156,156,255', '§4':'170,73,68,255', '§5':'158,99,183,255', '§6':'218,171,82,255', '§7':'161,169,155,255', '§8':'118,125,110,255', '§9':'112,145,222,255', '§a':'135,196,115,255', '§b':'129,206,203,255', '§c':'221,127,112,255', '§d':'206,150,217,255', '§e':'232,208,126,255', '§f':'230,223,204,255', '&0':'70,70,70,255', '&1':'70,90,166,255', '&2':'87,145,91,255', '&3':'70,156,156,255', '&4':'170,73,68,255', '&5':'158,99,183,255', '&6':'218,171,82,255', '&7':'161,169,155,255', '&8':'118,125,110,255', '&9':'112,145,222,255', '&a':'135,196,115,255', '&b':'129,206,203,255', '&c':'221,127,112,255', '&d':'206,150,217,255', '&e':'232,208,126,255', '&f':'230,223,204,255'}
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    tick: |-
      if(var.dirty){
        if(var.item0ItemJson != none){
          val.loot_slot_0.setItemIcon(var.item0ItemJson)
        }
        if(var.item1ItemJson != none){
          val.loot_slot_1.setItemIcon(var.item1ItemJson)
        }
        if(var.item2ItemJson != none){
          val.loot_slot_2.setItemIcon(var.item2ItemJson)
        }
        if(var.item3ItemJson != none){
          val.loot_slot_3.setItemIcon(var.item3ItemJson)
        }
        if(var.item4ItemJson != none){
          val.loot_slot_4.setItemIcon(var.item4ItemJson)
        }
        if(var.item5ItemJson != none){
          val.loot_slot_5.setItemIcon(var.item5ItemJson)
        }
        if(var.item6ItemJson != none){
          val.loot_slot_6.setItemIcon(var.item6ItemJson)
        }
        if(var.item7ItemJson != none){
          val.loot_slot_7.setItemIcon(var.item7ItemJson)
        }
        var.dirty = false
      }
    wheel: |-
      if(var.count > 0 && !var.menuOpen){
        if(self.wheelValue > 0){
          var.selectedIndex = var.selectedIndex - 1
          if(var.selectedIndex < 0){
            var.selectedIndex = var.count - 1
          }
          Packet.send('pickup', 'scroll_up')
        }
        if(self.wheelValue < 0){
          var.selectedIndex = var.selectedIndex + 1
          if(var.selectedIndex >= var.count){
            var.selectedIndex = 0
          }
          Packet.send('pickup', 'scroll_down')
        }
      }
controls:
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080, through: true}
    children:
      拾取面板:
        type: Canvas
        attribute:
          point: ~top_left
          x: "var.viewW - var.offX - 508"
          y: "(var.viewH - self.height) / 2"
          width: 460
          height: "(var.count > 8 ? 8 : var.count) * 62 + 220"
          visible: var.count > 0
        # 原选中拾取回包仅限清单范围，不让全屏 Adaptive 拦截世界点击。
        action:
          click: |-
            if(var.count > 0 && !var.menuOpen){
              Packet.send('pickup', 'pick', var.actionToken)
            }
        children:
          羊皮纸底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~220,205,168,246', shape: ~round_rect, radius: 6, through: true}
            effect:
              stroke: {width: 2, color: '~107,93,64,255'}
          装订线:
            type: Texture
            attribute: {point: ~top_left, x: 8, y: 8, width: 2, height: 'self.parent.height - 16', normal: '~174,149,98,255', through: true}
          清单页眉:
            type: Texture
            attribute: {point: ~top_left, x: 14, y: 8, width: 432, height: 100, normal: '~38,43,34,255', shape: ~round_rect, radius: 4, through: true}
          清单标题:
            type: Text
            attribute: {point: ~top_left, x: 28, y: 12, texts: '~&f附近战利品', fontSize: 48, through: true}
          数量:
            type: Text
            attribute: {point: ~top_right, x: -28, y: 20, texts: "'&e' + var.count.round() + ' &7组'", fontSize: 36, through: true}
          模式:
            type: Text
            attribute: {point: ~top_left, x: 28, y: 64, texts: "var.menuOpen ? '&a光标 / 点击拾取' : '&7滚轮选择 / 交互键'", fontSize: 36, through: true}
          拾取列表:
            type: VStack
            attribute: {point: ~top_left, x: 16, y: 118, width: 428, spaceBetween: 6, through: true}
            children:
              物品条目0:
                type: Canvas
                attribute:
                  width: 428
                  height: 56
                  visible: var.item0Visible
                  scrollAnim: none
                  itemName: "val.loot_slot_0.getSlotItemStack().getName()"
                  nameCode: "self.itemName.length() >= 2 ? self.itemName.substring(0, 2).toLowerCase() : 'uncolored'"
                  markColor: "var.nameColors[self.nameCode] != none ? var.nameColors[self.nameCode] : '161,169,155,255'"
                action:
                  clickLeft: |-
                    Packet.send('pickup', 'pick_0', var.actionToken)
                  enter: "self.scrollAnim = Lerp(0, 1, 2600)"
                  leave: "self.scrollAnim = none"
                children:
                  背景0:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "var.selectedIndex == 0 ? '66,70,43,255' : '43,48,39,244'", shape: ~round_rect, radius: 4, through: true}
                    effect:
                      stroke: {width: 'var.selectedIndex == 0 ? 2 : 1', color: "self.parent.isHovered() ? '235,210,143,255' : '133,122,87,255'"}
                  色签0:
                    type: Texture
                    attribute: {point: ~middle_left, x: 4, width: 4, height: 36, normal: 'self.parent.markColor', through: true}
                  图标0:
