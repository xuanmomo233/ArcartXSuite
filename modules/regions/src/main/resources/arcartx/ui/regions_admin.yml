                    type: Canvas
                    attribute:
                      x: 620
                      y: 0
                      width: 100
                      height: 40
                    action:
                      click: |-
                        if(var.newRegionName != null && var.newRegionName != ''){
                          Packet.send(var.packetId, 'create_region', var.newRegionName)
                        }
                    children:
                      创建按钮背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.isHovered() ? '60,160,80,230' : '40,140,60,200'"
                          shape: ~round_rect
                          radius: 8
                      创建按钮文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 100
                          through: true
                          fontSize: 28
                          texts: "~&f+ 创建"
                  区域列表滑块:
                    type: Texture
                    val: 区域列表滑块
                    attribute:
                      x: 834
                      y: 50
                      width: 6
                      height: 50
                      normal: ~120,120,120,200
                      maxDragY: 480
                  区域滚动栏:
                    type: Scroll
                    attribute:
                      x: 0
                      y: 50
                      width: 840
                      height: 530
                      moveY: "self.parent['区域列表滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['区域列表滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['区域列表滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      regions_list:
                        val: region_data
                        type: VStack
                        attribute:
                          x: 0
                          y: 0
                          width: 840
                          spaceBetween: 6
                        action:
                          create: |-
                            for(i in range(1, 50)){
                              row = self['区域行'].copy('区域行' + i.round)
                              row.entryKey = i.round()
                            }
                        children:
                          区域行:
                            type: Texture
                            attribute:
                              entryKey: 0.round()
                              entry: "var.regionList != null ? var.regionList[self.entryKey] : none"
                              visible: self.entry != none
                              width: 820
                              height: 50
                              normal: ~40,40,50,180
                              shape: ~round_rect
                              radius: 6
                            children:
                              区域编号文字:
                                type: Text
                                attribute:
                                  x: 16
                                  y: 12
                                  through: true
                                  fontSize: 28
                                  texts: "~&f{self.parent.entry['id']}"
                              区域世界文字:
                                type: Text
                                attribute:
                                  x: 260
                                  y: 14
                                  through: true
                                  fontSize: 26
                                  texts: "~&7{self.parent.entry['world']}"
                              区域优先级文字:
