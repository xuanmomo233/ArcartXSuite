                type: Texture
                attribute:
                  point: ~middle_left
                  x: 24
                  width: 44
                  height: 44
                  normal: ~50,56,76,240
                  shape: ~round_rect
                  radius: 12
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,180
              标题图标内:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 32
                  width: 28
                  height: 28
                  normal: ~90,170,255,220
                  shape: ~round_rect
                  radius: 8
                  through: true
                effect:
                  neon:
                    color: ~120,200,255,160
                    size: 8
                    intensity: 0.6
                    animated: false
              标题:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 80
                  texts: "~&e战令系统"
                  fontSize: 36
                  through: true
              标题竖线:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 260
                  width: 2
                  height: 30
                  normal: ~90,170,255,80
                  through: true
              赛季名:
                type: Text
