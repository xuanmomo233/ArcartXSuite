# 文件用途: ArcartXSuite Chat — @提及补全 HUD
# 以 HUD 形式挂载在聊天栏，服务端推送在线玩家列表，客户端轮询聊天输入并显示 @ 候选。
# 当玩家在聊天栏输入 @ 后，根据已输入的部分玩家名前缀匹配在线玩家，显示下拉候选列表。
ui:
  isHud: true                # 标记为 HUD 类型，常驻屏幕显示
  match:                     # 匹配替换的原版界面 ID 列表
    - '聊天栏'               # 挂载到原版聊天栏界面
  defaultOpen: true          # HUD 加载后立即打开
  through: true              # 开启穿透点击，重叠组件可同时触发事件
  level: 200                 # HUD 渲染优先级，数值越大越先渲染（显示在越底层）
  # packetHandler: updatePlayers
  # 包字段:
  #   - packet: 在线玩家名称列表（List<String>），由服务端推送
  # 用途: 接收服务端推送的在线玩家列表，存入 var.players 供 @ 补全匹配使用
  packetHandler:
    updatePlayers: |-
      var.players = packet
  action:
    # load 触发器: UI 加载完成时初始化变量
    load: |-
      var.players = []
      var.matches = []
      var.showDropdown = false
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
    # tick 触发器: 每逻辑帧执行，轮询聊天输入并匹配 @ 候选玩家
    # 逻辑: 获取当前聊天消息 → 查找最后一个 @ → 提取 @ 后的部分文本 →
    #       在在线玩家列表中前缀匹配 → 最多取 8 个候选 → 控制下拉列表显示
    tick: |-
      var.__msg = Chat.getMessage()
      var.matches = []
      var.showDropdown = false
      if(var.__msg != none && var.__msg.length() > 0){
        var.__atIdx = var.__msg.lastIndexOf('@')
        if(var.__atIdx >= 0){
          var.__partial = var.__msg.substring(var.__atIdx + 1)
          if(!var.__partial.contains(' ')){
            var.__lp = var.__partial.toLowerCase()
            if(var.players != none){
              for(__n in var.players){
                if(var.matches.size() >= 8){
                  break
                }
                if(__n.toLowerCase().startsWith(var.__lp)){
                  var.matches.add(__n)
                }
              }
            }
            if(var.matches.size() > 0){
              var.showDropdown = true
            }
          }
        }
      }
controls:
  # HUD 只在右下角绘制紧凑面板；视口换算保持与原版聊天输入框的距离。
  自适应布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      提及面板:
        type: Canvas
        attribute:
          point: ~top_left
          visible: var.showDropdown
          x: "var.viewW - var.offX - 464"
          y: "var.viewH - 92 - (var.matches.size() * 42 + 100)"
          width: 440
          height: "var.matches.size() * 42 + 100"
        children:
          面板底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:18;13,25,44,244
              shape: ~round_rect
              radius: 12
              through: true
            effect:
              stroke:
                width: 1
                color: ~71,112,146,230
          标题:
            type: Text
            attribute:
              point: ~top_left
              x: 18
              y: 12
              texts: ~&b@ &f提及玩家
              fontSize: 54
              through: true
          候选数量:
            type: Text
            attribute:
              point: ~top_right
              x: -18
              y: 18
              texts: "'&b' + var.matches.size().round() + '&7 位候选'"
              fontSize: 36
              through: true
          标题分隔:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 46
              width: 404
              height: 1
              normal: ~49,78,105,235
              through: true
          # 固定八个候选，不引入滚动；无匹配的行隐藏，面板随匹配数量收缩。
