# Lakeside field guide / 04 · A radial map of six techniques and their links.
# Sand index, allocation summary and a lake-green network with visible pan handles.
# Generation-based node/line references, delayed JSON icons, drag/zoom and guarded
# upgrade/reset contracts retain the existing interaction model.
#
# Java 端 pushTalentsData 发送字段:
#   packetId, seasonId, level, talentPoints, unspentTalentPoints,
#   unlockedTalents (Map<nodeId, level:int>),
#   trees (Map<treeId, {id, displayName, description, icon, iconJson,
#     nodeCount, nodes: Map<idx, {id, name, description, tier, branch, treeId,
#       unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>}>),
#   links (Map<idx, {id, name, description, tier, branch, treeId,
#     unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>),
#   linkCount
#
# 客户端回包:
#   Packet.send(packetId, 'level_up_talent', nodeId)  — 升级指定节点
#   Packet.send(packetId, 'reset_talents')             — 重置天赋树

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8

  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      var.trees = packet['trees']
      var.links = packet['links']
      var.linkCount = packet['linkCount']
      if(var.linkCount == none) {
        var.linkCount = 0
      }
      var.activeBonuses = packet['activeBonuses']
      var.actionBusy = false
      var.resetArmed = false
      var.allNodes = []
      var.allNodeById = {}
      layoutKey = ''
      for(treeKey in var.treeIds){
        treeData = var.trees[treeKey]
        if(treeData != none){
          nodes = treeData['nodes']
          for(key in nodes.keys()){
            node = nodes[key]
            var.allNodes.add(node)
            var.allNodeById[node['id']] = node
            layoutKey = layoutKey + '|' + node['id'] + ':' + node['tier'] + ':' + node['branch'] + ':' + node['treeId'] + ':' + node['prerequisites']
          }
        }
      }
      if(var.linkCount > 0){
        for(i in range(0, var.linkCount - 1)){
          node = var.links[i.round()]
          var.allNodes.add(node)
          var.allNodeById[node['id']] = node
          layoutKey = layoutKey + '|' + node['id'] + ':' + node['prerequisites']
        }
      }
      var.needRebuild = var.layoutKey != layoutKey
      var.layoutKey = layoutKey
      var.iconDelay = 2
  action:
    # load: 初始化变量 + 视口换算 + 中心发散布局参数
    load: |-
      var.dragStartMX = 0
      var.dragStartMY = 0
      var.dragStartSX = 0
      var.dragStartSY = 0
      var.iconDelay = 0
      var.linkCount = 0
      var.packetId = 'AXS_FISHING_TALENTS'
      var.playerLevel = 1
      var.talentPoints = 0
      var.unspentTalentPoints = 0
      var.zoomScale = 1.0
      var.needRebuild = false
      var.nodeRefs = {}
      var.lineRefs = []
      var.iconJsonCache = {}
      var.generation = 0
      var.actionBusy = false
      var.busySeconds = 0
      var.resetArmed = false
      var.resetSeconds = 0
      var.lastMouseX = 0
      var.lastMouseY = 0
      var.viewReady = false
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      // 中心发散布局参数
      var.nodeSize = 64
      var.lineW = 5
      var.canvasW = 1800
      var.canvasH = 1800
      var.centerX = var.canvasW / 2
      var.centerY = var.canvasH / 2
      // 半径：T1 中心 → T2 → T3 → T4 → T5 → T6 → T7 → 联动
      var.R1 = 0
      var.R2 = 80
      var.R3 = 180
      var.R4 = 280
      var.R5 = 400
      var.R6 = 540
      var.R7 = 700
      // 联动链：基础在 T4/T5 之间，沿径向向外穿过 T6/T7 间隙
      var.RlinkA = 480
      var.RlinkStep = 90
      // 所有树 ID（meta = T1/T2 根节点树）
      var.treeIds = ['meta', 'steady', 'swift', 'pressure', 'focus', 'lucky', 'endure']
      var.treeNames = {}
      var.treeNames['steady'] = '&a稳健'
      var.treeNames['swift'] = '&b迅捷'
      var.treeNames['pressure'] = '&c威压'
      var.treeNames['focus'] = '&d专注'
      var.treeNames['lucky'] = '&e幸运'
      var.treeNames['endure'] = '&6持久'
      var.treeDescs = {}
      var.treeDescs['steady'] = '绿条稳定性与高度'
      var.treeDescs['swift'] = '降低鱼速与活跃度'
      var.treeDescs['pressure'] = '压制鱼逃离行为'
      var.treeDescs['focus'] = '进度获取与维持'
      var.treeDescs['lucky'] = '经验售价与稀有鱼'
      var.treeDescs['endure'] = '绿条物理与时间'
      // T2 分支映射
      var.t2Branches = {}
      var.t2Branches['t2-power'] = 'power'
      var.t2Branches['t2-control'] = 'control'
      var.t2Branches['t2-fortune'] = 'fortune'
      var.t2Children = {}
      var.t2Children['power'] = ['steady', 'swift']
      var.t2Children['control'] = ['pressure', 'focus']
      var.t2Children['fortune'] = ['lucky', 'endure']
      // 节点颜色映射
      var.treeColors = {}
      var.treeColors['steady'] = ['81,119,99,255', '157,190,169,255']
      var.treeColors['swift'] = ['53,89,96,255', '131,183,188,255']
      var.treeColors['pressure'] = ['122,88,72,255', '211,156,127,255']
      var.treeColors['focus'] = ['91,92,116,255', '177,176,195,255']
      var.treeColors['lucky'] = ['137,118,68,255', '231,222,196,255']
      var.treeColors['endure'] = ['120,95,62,255', '202,177,132,255']
      var.treeColors['meta'] = ['23,49,64,255', '157,190,169,255']
      // 角度参数（弧度）
      var.angleT4 = math.PI() / 12
      var.angleT5 = math.PI() / 12
      // T6/T7 收窄散开角度，给联动链留出两树间空隙
      var.angleT6a = math.PI() / 10
      var.angleT6b = math.PI() / 30
      var.angleT7a = math.PI() / 10
      var.angleT7b = math.PI() / 30
      // 联动角度偏移
      var.angleLinkBase = math.PI() / 36
      var.angleLinkStep = math.PI() / 60
      // 拖拽滚动状态
      var.isDragging = false
      var.dragMoved = false
      // 缩放状态
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.s = s
    open: |-
      Packet.send(var.packetId, 'refresh_talents')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.s = s
      var.isDragging = false
    resetView: |-
      var.zoomScale = 1.0
      val.横向滑块.setDragXRatio(0.5)
      val.竖向滑块.setDragYRatio(0.5)
      var.isDragging = false
    keyPress: |-
      // R 键重置缩放和滚动位置
      if(self.currentKeyPress == 'R' || self.currentKeyPress == 'r'){
        self.actions['resetView']()
      }
    releaseLeft: |-
      // 兜底：确保拖拽状态在鼠标移出滚动区后释放时也能重置
      dx = (Mouse.x() - var.dragStartMX) / var.s
      dy = (Mouse.y() - var.dragStartMY) / var.s
      if(var.isDragging && !var.dragMoved && dx * dx + dy * dy <= 25 && val.天赋视口.isHovered()){
        node = var.allNodeById[var.pressedNode]
        if(node != none && node['canLevelUp'] == true && !var.actionBusy && var.actionToken != none){
          var.actionBusy = true
          var.busySeconds = 0
          Packet.send(var.packetId, 'level_up_talent', var.actionToken, var.pressedNode)
        }
      }
      var.pressedNode = none
      var.isDragging = false
    clickLeft: |-
      // UI 级点击：记录拖拽起点（不依赖 Scroll 子控件事件）
      var.isDragging = val.天赋视口.isHovered()
      if(var.isDragging){
        var.dragStartMX = Mouse.x()
        var.dragStartMY = Mouse.y()
        var.lastMouseX = var.dragStartMX
        var.lastMouseY = var.dragStartMY
        var.dragStartSX = val.横向滑块.getDragXRatio()
        var.dragStartSY = val.竖向滑块.getDragYRatio()
        var.dragMoved = false
      }
    seconds: |-
      if(var.actionBusy){
        var.busySeconds = var.busySeconds + 1
        if(var.busySeconds >= 3){
          var.actionBusy = false
          Packet.send(var.packetId, 'refresh_talents')
        }
      }
      if(var.resetArmed){
        var.resetSeconds = var.resetSeconds + 1
        if(var.resetSeconds >= 4){
          var.resetArmed = false
        }
      }
    # tick: 数据变化时重建中心发散天赋网络
    tick: |-
      // 拖拽中：位移超过阈值才滚动
      if(!var.viewReady && val.横向滑块 != none && val.竖向滑块 != none){
        var.viewReady = true
        self.actions['resetView']()
      }
      mx = Mouse.x()
      my = Mouse.y()
      if(var.isDragging && (mx != var.lastMouseX || my != var.lastMouseY)){
        var.lastMouseX = mx
        var.lastMouseY = my
        dx = (mx - var.dragStartMX) / var.s
        dy = (my - var.dragStartMY) / var.s
        if(!var.dragMoved && dx * dx + dy * dy > 25){
          var.dragMoved = true
        }
        scrollRangeX = var.canvasW * var.zoomScale - (var.contentW - 48)
        scrollRangeY = var.canvasH * var.zoomScale - (var.viewH - 376)
        if(scrollRangeX > 0){
          newSX = var.dragStartSX - dx / scrollRangeX
          if(newSX < 0) {
            newSX = 0
          }
          if(newSX > 1) {
            newSX = 1
          }
          val.横向滑块.setDragXRatio(newSX)
        }
        if(scrollRangeY > 0){
          newSY = var.dragStartSY - dy / scrollRangeY
          if(newSY < 0) {
            newSY = 0
          }
          if(newSY > 1) {
            newSY = 1
          }
          val.竖向滑块.setDragYRatio(newSY)
        }
      }
      if(var.needRebuild){
        var.needRebuild = false
        var.iconDelay = 2
        // 清理动态控件
        for(id in var.nodeRefs.keys()){
          var.nodeRefs[id].remove()
        }
        for(line in var.lineRefs){
          line.remove()
        }
        var.nodeRefs = {}
        var.lineRefs = []
        var.iconJsonCache = {}
        var.generation = (var.generation + 1).round()
        // 辅助：根据 tree 和 branch 计算节点角度
        var.nodePositions = {}
        // 收集所有节点
        // 联动节点也加入
        // 第一遍：计算所有节点位置
        for(node in var.allNodes){
          id = node['id']
          tier = type.toNumber(node['tier']).round()
          branch = node['branch']
          treeId = node['treeId']
          // 计算角度和半径
          angle = 0
          R = 0
          if(tier == 1){
            angle = 0
            R = var.R1
          }
          if(tier == 2){
            // 3 个 T2 均匀分布在 360°
            if(branch == 'power') {
              angle = -math.PI() / 2
            }
            if(branch == 'control') {
              angle = math.PI() / 6
            }
            if(branch == 'fortune') {
              angle = 5 * math.PI() / 6
            }
            R = var.R2
          }
          if(tier == 3){
            // T3 是 6 棵树的根
            ti = treeId == 'steady' ? 0 : (treeId == 'swift' ? 1 : (treeId == 'pressure' ? 2 : (treeId == 'focus' ? 3 : (treeId == 'lucky' ? 4 : 5))))
            angle = -math.PI() / 2 + ti * math.PI() / 3
            R = var.R3
          }
          if(tier == 4 || tier == 5){
            ti = treeId == 'steady' ? 0 : (treeId == 'swift' ? 1 : (treeId == 'pressure' ? 2 : (treeId == 'focus' ? 3 : (treeId == 'lucky' ? 4 : 5))))
            baseAngle = -math.PI() / 2 + ti * math.PI() / 3
            angleOff = branch == 'a' ? -var.angleT4 : var.angleT4
            if(tier == 5) {
              angleOff = branch == 'a' ? -var.angleT5 : var.angleT5
            }
            angle = baseAngle + angleOff
            R = tier == 4 ? var.R4 : var.R5
          }
          if(tier == 6 || tier == 7){
            ti = treeId == 'steady' ? 0 : (treeId == 'swift' ? 1 : (treeId == 'pressure' ? 2 : (treeId == 'focus' ? 3 : (treeId == 'lucky' ? 4 : 5))))
            baseAngle = -math.PI() / 2 + ti * math.PI() / 3
            angleOff = 0
            if(branch == 'a') {
              angleOff = -var.angleT6a
            }
            if(branch == 'b') {
              angleOff = -var.angleT6b
            }
            if(branch == 'c') {
              angleOff = var.angleT6b
            }
            if(branch == 'd') {
              angleOff = var.angleT6a
            }
            if(tier == 7){
              if(branch == 'a') {
                angleOff = -var.angleT7a
              }
              if(branch == 'b') {
                angleOff = -var.angleT7b
              }
              if(branch == 'c') {
                angleOff = var.angleT7b
              }
              if(branch == 'd') {
                angleOff = var.angleT7a
              }
            }
            angle = baseAngle + angleOff
            R = tier == 6 ? var.R6 : var.R7
          }
          if(tier == 0 || treeId == ''){
            // 联动节点（tier 0，无 tree）
            prereqs = node['prerequisites']
            if(prereqs != none && prereqs.size() >= 1){
              // 检查第一个前置是否是联动节点（tier==0）
              firstParent = var.allNodeById[prereqs[0]]
              isChainLink = firstParent != none && firstParent['tier'] == 0
              if(!isChainLink && prereqs.size() == 2){
                // 基础联动（两个 T4）：角度取两棵树中点
                p1 = prereqs[0]
                p2 = prereqs[1]
                pos1 = var.nodePositions[p1]
                pos2 = var.nodePositions[p2]
                if(pos1 != none && pos2 != none){
                  a1 = pos1[2]
                  a2 = pos2[2]
                  // 处理角度跨越 ±π 边界：差值 > π 时补一圈
                  diff = a2 - a1
                  if(diff > math.PI()) {
                    a2 = a2 - 2 * math.PI()
                  }
                  if(diff < -math.PI()) {
                    a2 = a2 + 2 * math.PI()
                  }
                  angle = (a1 + a2) / 2
                }
                R = var.RlinkA
              }
              if(isChainLink){
                // 二级/三级联动（前置是 link）：沿径向向外
                parentId = prereqs[0]
                parentPos = var.nodePositions[parentId]
                if(parentPos != none){
                  angle = parentPos[2]
                  R = parentPos[3] + var.RlinkStep
                }
              }
            }
          }
          worldX = var.centerX + R * math.cos(angle)
          worldY = var.centerY + R * math.sin(angle)
          var.nodePositions[id] = [worldX, worldY, angle, R]
        }
        // 第二遍：创建连线（父节点 → 子节点）—— 先创建，渲染在底层
        for(node in var.allNodes){
          childId = node['id']
          childPos = var.nodePositions[childId]
          if(childPos == none) {
            continue
          }
          prereqs = node['prerequisites']
          if(prereqs == none || prereqs.size() == 0) {
            continue
          }
          for(prereq in prereqs){
            parentPos = var.nodePositions[prereq]
            if(parentPos == none) {
              continue
            }
            x1 = parentPos[0]
            y1 = parentPos[1]
            x2 = childPos[0]
            y2 = childPos[1]
            ldx = x2 - x1
            ldy = y2 - y1
            len = math.sqrt(ldx * ldx + ldy * ldy)
            if(len == 0) {
              continue
            }
            angDeg = math.atan2(ldy, ldx) * 180 / math.PI()
            midX = (x1 + x2) / 2
            midY = (y1 + y2) / 2
            // 颜色：子节点点亮用亮色，否则用较亮的中性色（保证可见）
            childUnlocked = node['unlocked'] == true
            treeId = node['treeId']
            if(treeId == '') {
              treeId = 'meta'
            }
            dimColor = var.treeColors[treeId][0]
            brightColor = var.treeColors[treeId][1]
            // 未点亮统一用半透明亮灰，点亮用树亮色
            lineColor = childUnlocked ? brightColor : '160,160,170,200'
            if(treeId == 'meta'){
              lineColor = childUnlocked ? '220,220,230,255' : '160,160,170,200'
            }
            line = val.联动连线段.copy('线_' + var.generation + '_' + childId + '_' + prereq)
            line.worldX = midX - len / 2
            line.worldY = midY - var.lineW / 2
            line.worldLength = len
            line.childId = childId
            line.brightColor = (treeId == 'meta' ? '220,220,230,255' : brightColor)
            line.dimColor = '160,160,170,200'
            line.rotate = angDeg
            line.visible = true
            var.lineRefs.add(line)
          }
        }
        // 第三遍：创建所有节点 —— 后创建，渲染在连线之上
        for(node in var.allNodes){
          id = node['id']
          pos = var.nodePositions[id]
          if(pos == none) {
            continue
          }
          treeId = node['treeId']
          if(treeId == '') {
            treeId = 'meta'
          }
          n = val.天赋节点模板.copy('节点_' + var.generation + '_' + id)
          n.entryId = id
          n.treeId = treeId
          n.isLink = (node['tier'] == 0)
          n.worldX = pos[0] - var.nodeSize / 2
          n.worldY = pos[1] - var.nodeSize / 2
          n.brightColor = var.treeColors[treeId][1]
          n.dimColor = var.treeColors[treeId][0]
          var.nodeRefs[id] = n
        }
      }
      if(var.iconDelay > 0){
        var.iconDelay = var.iconDelay - 1
        if(var.iconDelay == 0){
          for(id in var.nodeRefs.keys()){
            ctrl = var.nodeRefs[id]
            node = var.allNodeById[id]
            json = node['iconJson']
            if(json == none || json == ''){
              json = var.emptyItemJson
            }
            if(var.iconJsonCache[id] != json && ctrl['节点图标'] != none){
              ctrl['节点图标'].setItemIcon(json)
              var.iconJsonCache[id] = json
            }
          }
        }
      }

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:18;20,43,52,170
  # 自适配布局：宽高 = 设计分辨率 1920x1080
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~23,49,64,250
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~53,89,96,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~157,190,169,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 48
              texts: "~&f湖畔手册"
              fontSize: 54
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 304
              width: 1
              height: 30
              normal: ~53,89,96,230
          页名:
            type: Text
            attribute:
              point: ~middle_left
              x: 340
              texts: "~&7钓鱼 / &f技艺网络"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 112
              height: 52
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~23,49,64,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '53,89,96,255' : '53,89,96,240'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f关闭"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~231,222,196,250
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~53,89,96,240
          索引标题: {type: Text, attribute: {x: 24, y: 24, texts: '~&8FIELD GUIDE / 目录', fontSize: 36}}
          导航总览:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 88
              width: 268
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_main')
            children:
              总览底:
