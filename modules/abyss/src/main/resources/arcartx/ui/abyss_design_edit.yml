                      width: 110
                      height: 34
                      visible: "self.parent.entry['editor'] != 'TEXT' && self.parent.entry['editor'] != 'NUMBER'"
                    action:
                      clickLeft: |-
                        e = self.parent.entry
                        if(e['editor'] == 'COORD' || e['editor'] == 'REGION'){
                          Packet.send(var.packetId, 'design_remark', var.objKey, e['name'], var.actionToken)
                          Screen.close()
                        } else {
                          if(e['editor'] == 'TOGGLE'){
                            nv = e['value'] == 'true' ? '0' : '1'
                            Packet.send(var.packetId, 'design_set', var.objKey, e['name'], nv, var.actionToken)
