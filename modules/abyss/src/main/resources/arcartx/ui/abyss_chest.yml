# AXS 资源说明
# 用途: Abyss 副本宝箱 —— roll 好的奖励物品展示 + 单个/全部领取
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/chestTitle/itemCount/itemJson0..itemJson8
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.chestTitle = packet['chestTitle']
      var.itemCount = packet['itemCount']
      var.itemJson0 = packet['itemJson0']
      var.itemAmount0 = packet['itemAmount0'] != none ? packet['itemAmount0'] : 0
      var.itemJson1 = packet['itemJson1']
      var.itemAmount1 = packet['itemAmount1'] != none ? packet['itemAmount1'] : 0
      var.itemJson2 = packet['itemJson2']
      var.itemAmount2 = packet['itemAmount2'] != none ? packet['itemAmount2'] : 0
      var.itemJson3 = packet['itemJson3']
      var.itemAmount3 = packet['itemAmount3'] != none ? packet['itemAmount3'] : 0
      var.itemJson4 = packet['itemJson4']
      var.itemAmount4 = packet['itemAmount4'] != none ? packet['itemAmount4'] : 0
      var.itemJson5 = packet['itemJson5']
      var.itemAmount5 = packet['itemAmount5'] != none ? packet['itemAmount5'] : 0
      var.itemJson6 = packet['itemJson6']
      var.itemAmount6 = packet['itemAmount6'] != none ? packet['itemAmount6'] : 0
      var.itemJson7 = packet['itemJson7']
      var.itemAmount7 = packet['itemAmount7'] != none ? packet['itemAmount7'] : 0
      var.itemJson8 = packet['itemJson8']
      var.itemAmount8 = packet['itemAmount8'] != none ? packet['itemAmount8'] : 0
      var.dirty = true
      self.actions['applyIcons']()
  action:
    load: |-
      var.accent = '226,196,132,255'
      var.accentDim = '150,128,90,180'
    open: |-
      Sound.self('minecraft:block.chest.open', 0.9, 10)
      self.delayAction(300, 'applyIcons')
    applyIcons: |-
      for(i in range(0, 8)){
        val.物品网格.get(i.round()).seticon()
      }
      var.dirty = false
    tick: |-
      if(var.dirty){
        self.actions['applyIcons']()
      }
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;16,12,30,210
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      宝箱面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 560
          height: 340
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;28,22,16,240
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 2
                color: var.accentDim
          标题标线:
            type: Texture
            attribute:
              point: ~top_center
              y: 26
              width: 24
              height: 3
              normal: var.accent
              through: true
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 42
              texts: "'&f' + var.chestTitle"
              fontSize: 48
              limit: 12
              through: true
          物品网格:
            type: HGrid
            val: 物品网格
            attribute:
