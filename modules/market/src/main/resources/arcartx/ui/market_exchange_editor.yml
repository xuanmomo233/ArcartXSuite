ui:
  isHud: false
  defaultOpen: false
  background: true
  escClose: false
  closeDied: true
  screenScale: true
  through: false
  jei: false
  itemSize: 16
  hide:
  - hotbar
  - crosshair
  - player_state
  - experience_bar
  - chat_panel
  action:
    load: |-
      var.whLayoutEnabled = false
      var.hydrating = true
      var.dirty = false
      var.busy = false
      var.token = ''
      var.mode = 'shop'
      var.modal = ''
      var.confirmKind = ''
      var.shopNew = true
      var.shopId = ''
      var.shopName = ''
      var.shopEnabled = false
      var.shopPermission = ''
      var.shopNpcs = ''
      var.revision = '0'
      var.shops = {}
      var.shopCount = 0
      var.shopPage = 0
      var.offers = {}
      var.offerCount = 0
      var.offerPage = 0
      var.offerId = ''
      var.offerName = ''
      var.offerPermission = ''
      var.offerEnabled = true
      var.offerNew = true
      var.costs = {}
      var.rewards = {}
      var.costRows = {}
      var.rewardRows = {}
      var.costCount = 0
      var.rewardCount = 0
      var.assetSide = 'cost'
      var.assetIndex = 0
      var.asset = none
      var.assetRowsDirty = false
      var.assetPreviewDirty = false
      var.inventory = {}
      var.pickDirty = false
      var.pickExact = false
      var.currencies = {}
      var.currencyCount = 0
      var.currencyPage = 0
      var.nearby = {}
      var.nearbyCount = 0
      var.nearbyPage = 0
      var.ledgerRows = {}
      var.ledgerCount = 0
      var.ledgerPage = 0
      var.ledgerSelection = ''
      var.exportPath = ''
      var.pendingShop = ''
      var.pendingOffer = 0
      var.shopPages = 1
      var.offerPages = 1
      var.currencyPages = 1
      var.nearbyPages = 1
      var.ledgerPages = 1
      var.requestedOfferId = ''
      var.session = ''
      var.noticeActive = false
      var.noticeText = ''
      var.noticeDetail = ''
      var.noticeFade = Fade(80, 1000, 220)
      var.noticePeaked = false
      var.noticeLines = []
      var.noticeCount = 1
    open: |-
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeText = ''
      var.noticeDetail = ''
      Packet.send('AXS:market_exchange_editor', 'list')
    close: Packet.send('AXS:market_exchange_editor', 'close', var.session)
    tick: |-
      if(var.assetRowsDirty && var.assetIcons != none){
        var.assetRowsDirty = false
        for(i in range(0, 7)){
          row = var.assetSide == 'cost' ? var.costRows[i.round()] : var.rewardRows[i.round()]
          var.assetIcons[i.round()].setItemIcon(row == none ? '' : row['icon'])
        }
      }
      if(var.assetPreviewDirty && val.assetPreview != none){
        var.assetPreviewDirty = false
        row = var.assetSide == 'cost' ? var.costRows[var.assetIndex.round()] : var.rewardRows[var.assetIndex.round()]
        val.assetPreview.setItemIcon(row == none ? '' : row['icon'])
      }
      if(var.pickDirty && var.pickIcons != none){
        var.pickDirty = false
        for(i in range(0, 35)){
          row = var.inventory[i.round()]
          var.pickIcons[i.round()].setItemIcon(row == none ? '' : row['icon'])
        }
      }
      if(var.noticeActive){
        var.noticeOpacity = var.noticeFade.get()
        if(var.noticeOpacity > 0){ var.noticePeaked = true }
        if(var.noticePeaked && var.noticeOpacity <= 0){
          var.noticeActive = false
          var.noticePeaked = false
          var.noticeText = ''
          var.noticeDetail = ''
        }
      }
  packetHandler:
    editor_list: |-
      var.shops = packet['shops']
      var.shopCount = packet['shopCount']
      var.token = packet['token']
      var.session = packet['session']
      var.currencies = packet['currencies']
      var.currencyCount = packet['currencyCount']
      var.inventory = packet['inventory']
      var.nearby = packet['nearby']
      var.nearbyCount = packet['nearbyCount']
      var.pickDirty = true
      var.hydrating = false
      var.shopPages = 1
      while(var.shopCount > var.shopPages * 8){var.shopPages = var.shopPages + 1}
      if(var.shopPage >= var.shopPages){var.shopPage = var.shopPages - 1}
      var.currencyPages = 1
      while(var.currencyCount > var.currencyPages * 6){var.currencyPages = var.currencyPages + 1}
      var.nearbyPages = 1
      while(var.nearbyCount > var.nearbyPages * 6){var.nearbyPages = var.nearbyPages + 1}
    editor_shop: |-
      if(packet['selectOffer'] == ''){var.mode = 'shop'}
      var.shopNew = false
      var.shopId = packet['id']
      var.shopName = packet['name']
      var.shopEnabled = packet['enabled']
      var.shopPermission = packet['permission']
      var.shopNpcs = packet['npcs']
      var.revision = packet['revision']
      var.offers = packet['offers']
      var.offerCount = packet['offerCount']
      var.token = packet['token']
      var.offerPage = 0
      var.hydrating = true
      val.shopIdInput.setContent(var.shopId)
      val.shopNameInput.setContent(var.shopName)
      val.shopPermissionInput.setContent(var.shopPermission)
      val.shopNpcInput.setContent(var.shopNpcs)
      var.hydrating = false
      var.dirty = false
      if(packet['selectOffer'] != ''){
        for(key in var.offers.keys()){
          if(var.offers[key]['id'] == packet['selectOffer']){ var.pendingOffer = key.toInt() }
        }
      }
      var.offerPages = 1
      while(var.offerCount > var.offerPages * 6){var.offerPages = var.offerPages + 1}
      if(packet['selectOffer'] != ''){var.offerPage = (var.pendingOffer / 6).toInt()}
      for(key in var.shops.keys()){if(var.shops[key]['id'] == var.shopId){var.shopPage = (key.toInt() / 8).toInt()}}
      if(packet['selectOffer'] != ''){var.requestedOfferId = packet['selectOffer']
      var.busy = true}else{var.busy = false}
    editor_result: |-
      var.token = packet['token']
      var.busy = false
      if(packet['saved'] == true){ var.dirty = false }
      if(packet['busy'] != true){
        noticeMessage = packet['message']
        if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
          var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
          noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
          var.noticeLines = noticeWrapped.split('\n')
          var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
          var.noticeFade.reset()
          var.noticePeaked = false
          var.noticeActive = true
        }
      }
    editor_deleted: |-
      var.mode = 'shop'
      var.shopNew = true
      var.shopId = ''
      var.shopName = ''
      var.shopEnabled = false
      var.shopPermission = ''
      var.shopNpcs = ''
      var.revision = '0'
      var.offers = {}
      var.offerCount = 0
      var.offerPages = 1
      var.offerPage = 0
      var.hydrating = true
      val.shopIdInput.setContent('')
      val.shopNameInput.setContent('')
      val.shopPermissionInput.setContent('')
      val.shopNpcInput.setContent('')
      var.hydrating = false
      var.dirty = false
    editor_inventory: |-
      var.inventory = packet['inventory']
      var.pickDirty = true
    editor_pick: |-
      parts = packet['target'].split(':')
      var.assetSide = parts.get(0.round())
      var.assetIndex = parts.get(1.round()).toInt()
      asset = var.pickExact ? packet['exactAsset'] : packet['asset']
      row = {'name': packet['name'], 'icon': packet['icon'], 'quantity': '1'}
      if(var.assetSide == 'cost'){
        var.costs[var.assetIndex.round()] = asset
        var.costRows[var.assetIndex.round()] = row
      }else{
        var.rewards[var.assetIndex.round()] = asset
        var.rewardRows[var.assetIndex.round()] = row
      }
      var.pickExact = false
      var.modal = ''
      var.dirty = true
      var.asset = var.assetSide == 'cost' ? var.costs[var.assetIndex.round()] : var.rewards[var.assetIndex.round()]
      var.hydrating = true
      val.assetIdInput.setContent(var.asset == none ? '' : var.asset['id'])
      val.assetAmountInput.setContent(var.asset == none ? '' : var.asset['amount'])
      var.hydrating = false
      var.assetRowsDirty = true
      var.assetPreviewDirty = true
    editor_preview: |-
      parts = packet['target'].split(':')
      idx = parts.get(1.round()).toInt()
      if(parts.get(0.round()) == 'cost'){ var.costRows[idx.round()] = packet['row'] }else{ var.rewardRows[idx.round()] = packet['row'] }
      var.assetRowsDirty = true
      var.assetPreviewDirty = true
    editor_ledger: |-
      var.ledgerRows = packet['rows']
      var.ledgerCount = packet['count']
      var.ledgerPage = 0
      var.ledgerSelection = ''
      var.modal = 'ledger'
      var.busy = false
      val.ledgerUuidInput.setContent('')
      var.ledgerPages = 1
      while(var.ledgerCount > var.ledgerPages * 6){var.ledgerPages = var.ledgerPages + 1}
    editor_export: var.exportPath = packet['path']
    editor_offer: |-
      if(packet['shop'] == var.shopId && packet['offer']['id'] == var.requestedOfferId){
        var.token = packet['token']
        var.revision = packet['revision']
        for(key in var.offers.keys()){
          if(var.offers[key]['id'] == packet['offer']['id']){var.pendingOffer = key.toInt()}
        }
        var.offers[var.pendingOffer.round()]['offer'] = packet['offer']
        var.offers[var.pendingOffer.round()]['costRows'] = packet['costRows']
        var.offers[var.pendingOffer.round()]['rewardRows'] = packet['rewardRows']
        var.busy = false
      offerRow = var.offers[var.pendingOffer.round()]
      if(offerRow != none){
        offer = offerRow['offer']
        var.mode = 'offer'
        var.offerNew = false
        var.offerId = offer['id']
        var.offerName = offer['name']
        var.offerEnabled = offer['enabled']
        var.offerPermission = offer['permission']
        var.costs = {}
        var.rewards = {}
        var.costCount = offer['costs'].size()
        var.rewardCount = offer['rewards'].size()
        for(i in range(0, 7)){
          idx = i.round()
          if(i < var.costCount){ var.costs[idx] = offer['costs'].get(idx) }
          if(i < var.rewardCount){ var.rewards[idx] = offer['rewards'].get(idx) }
        }
        var.costRows = offerRow['costRows']
        var.rewardRows = offerRow['rewardRows']
        var.hydrating = true
        val.offerIdInput.setContent(var.offerId)
        val.offerNameInput.setContent(var.offerName)
        val.offerPermissionInput.setContent(var.offerPermission)
        var.hydrating = false
        var.assetSide = 'cost'
        var.assetIndex = 0
        var.dirty = false
      }
      var.asset = var.assetSide == 'cost' ? var.costs[var.assetIndex.round()] : var.rewards[var.assetIndex.round()]
      var.hydrating = true
      val.assetIdInput.setContent(var.asset == none ? '' : var.asset['id'])
      val.assetAmountInput.setContent(var.asset == none ? '' : var.asset['amount'])
      var.hydrating = false
      var.assetRowsDirty = true
      var.assetPreviewDirty = true
      var.offerPage = (var.pendingOffer / 6).toInt()
      }
    ui_notice: |-
      noticeMessage = packet['message']
      if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
        var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
        noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = noticeWrapped.split('\n')
        var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
