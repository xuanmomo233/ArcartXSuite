# Abyss 原生战术面板。客户端只发送意图，救援与撤离由服务端验证。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: false
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.runMode = packet['runMode']
      var.runHint = packet['runHint']
      var.runRows = packet['runRows']
      var.runCount = packet['runCount']
      var.hasPrevious = packet['hasPrevious']
      var.hasNext = packet['hasNext']
  action:
    load: |-
      var.actionToken = ''
      var.viewNonce = ''
      var.packetId = 'abyss'
      var.runMode = 'rescue'
      var.runHint = ''
      var.runRows = {}
      var.runCount = 0
      var.hasPrevious = false
      var.hasNext = false
    open: |-
      Packet.send('abyss', 'view_ready', 'run')
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'run', var.actionToken, var.viewNonce)
      }
controls:
  布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      战术:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1160
          height: 940
          visible: "var.actionToken != ''"
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~28,22,44,248
              shape: ~round_rect
              radius: 14
              through: true
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 20
              texts: ~&fABYSS · 本局战术
              fontSize: 40
              through: true
          自救与救援:
            type: Canvas
            attribute:
              point: ~top_center
              x: -130
              y: 76
              width: 220
              height: 42
            action:
              clickLeft: "Packet.send(var.packetId, 'run_mode', 'rescue', var.actionToken)"
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.runMode == 'rescue' ? '110,78,150,255' : '60,50,78,245'"
                  shape: ~round_rect
                  radius: 6
                  through: true
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f自救与救援
                  fontSize: 30
                  through: true
          本局战利品:
            type: Canvas
            attribute:
              point: ~top_center
              x: 130
              y: 76
              width: 220
              height: 42
            action:
              clickLeft: "Packet.send(var.packetId, 'run_mode', 'loot', var.actionToken)"
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.runMode == 'loot' ? '110,78,150,255' : '60,50,78,245'"
                  shape: ~round_rect
                  radius: 6
                  through: true
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f本局战利品
                  fontSize: 30
                  through: true
          提示:
            type: Text
            attribute:
              point: ~top_center
              y: 136
              texts: "var.runHint"
              fontSize: 24
              limit: 42
              through: true
          空:
            type: Text
            attribute:
              point: ~middle_center
              texts: "var.runMode == 'loot' ? '&7当前没有已登记奖励' : '&7暂无可救援成员'"
              visible: "var.runCount == 0"
              fontSize: 32
              through: true
          行0:
