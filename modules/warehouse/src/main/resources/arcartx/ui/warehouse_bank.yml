                  height: 658
                  moveY: "self.parent['定期滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['定期滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['定期滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  定期列表:
                    val: 定期列表
                    type: VStack
                    attribute:
                      spaceBetween: 10
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.fixedDeposits[self.entryKey]
                          visible: self.entry != none
                          width: 494
                          height: 70
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'fixed_claim', self.entry['id'], var.actionToken)
                        children:
                          项背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~62,66,74,210
                              shape: ~round_rect
                              radius: 14
                            effect:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
                          项文字:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 12
                              y: 6
                              width: 470
                              texts: "var.fixedDepositTexts[self.parent.entryKey]"
                              fontSize: 28
                              through: true
