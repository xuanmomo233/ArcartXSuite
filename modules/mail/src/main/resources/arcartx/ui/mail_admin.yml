# 私人邮局 / 预设档案与派发工作台
# 象牙信纸、酒红印章、深色墨迹；与收件箱和写信页面共享邮局色板。
# 注册表 -> 信笺编辑 + 附件/规则副面板 -> 明确派发范围。
# 业务包、输入引用和延迟 setContent/seticon 生命周期保持不变。

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  level: 8
  itemSize: 16
  screenScale: true
  action:
    load: |-
      var.editItemCount = 0
      var.adminAttachmentSlots = 18
      var.view = 'list'
      var.subView = 'item'
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.presetDetailLoaded = false
      var.showDispatchConfirm = false
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 380
      // 档案工作台：左侧工具栏 260，正文 780，右侧附件面板弹性扩展
      var.editMainW = 780
      var.editSubX = var.editMainW + 16
      var.editSubW = var.contentW - var.editSubX - 16
    open: |-
      Packet.send('AXS_MAIL', 'admin-preset-list')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 380
      var.editMainW = 780
      var.editSubX = var.editMainW + 16
      var.editSubW = var.contentW - var.editSubX - 16
  packetHandler:
    # packetHandler: preset-list
    # 包字段:
    #   - presets: 预设列表（Map，键为索引，每项含 id/displayName/subject/enabled/attachmentCount/commandCount）
    #   - total: 预设总数
    #   - maxPresetCount: 预设列表最大显示条数
    #   - is_admin: 当前玩家是否为管理员
    preset-list: |-
      var.presets = packet['presets']
      var.total = packet['total']
      var.maxPresetCount = packet['maxPresetCount']
      var.isAdmin = packet['is_admin']
      var.adminAttachmentSlots = packet['adminAttachmentSlots']
      while(val.preset_data.childrenCount() > 1){
        val.preset_data.get(1).remove()
      }
      for(i in range(1, var.maxPresetCount - 1)){
        key = i.round()
        if(val.preset_data['预设行'] != none) {
          e = val.preset_data['预设行'].copy('预设行' + key)
          e.entryKey = key
        }
      }
    # packetHandler: preset-detail
    # 包字段: id/enabled/displayName/subject/body/expiresAfterDays/currencyAttachments/itemAttachmentCount/claimCommands/claimConditions/found
    # 注意: setContent 和 seticon 必须推迟到下一帧执行，因为 var.view = 'edit' 的 visible
    # 属性表达式要到下一帧才重新求值，同帧调用 setContent 会被渲染引擎丢弃（控件尚未可见）。
    preset-detail: |-
      var.resultMsg = none
      var.editId = packet['id']
      var.editEnabled = packet['enabled']
      var.editDisplayName = packet['displayName']
      var.editSubject = packet['subject']
      var.editBody = packet['body']
      var.editExpiresDays = packet['expiresAfterDays']
      var.editItemCount = packet['itemAttachmentCount'].round()
      var.editCommands = packet['claimCommands']
      var.editConditions = packet['claimConditions']
      var.editFound = packet['found']
      var.view = 'edit'
      var.subView = 'item'
      var.attachmentJsons = packet['attachment_jsons']
      // 货币附件和 CDK 结构化字典（Java 端以索引字符串为 key）
      var.editCurrencyList = packet['currencyAttachmentsList']
      var.editCdkList = packet['cdkList']
      // 标记 preset-detail 已加载，attachment-count 到达时跳过覆盖（session 为空）
      var.presetDetailLoaded = true
      // 推迟到下一帧再 setContent/seticon/动态行，确保编辑视图已可见、控件已就绪
      scheduler.delay(50, -> {
        tmpId = var.editId
        tmpDisplayName = var.editDisplayName
        tmpSubject = var.editSubject
        tmpBody = var.editBody
        tmpExpiresDays = var.editExpiresDays.round()
        tmpCommands = var.editCommands
        tmpConditions = var.editConditions
        if(val.编辑编号框 != none) {
          val.编辑编号框.setContent(tmpId)
        }
        if(val.编辑显示名框 != none) {
          val.编辑显示名框.setContent(tmpDisplayName)
        }
        if(val.编辑主题框 != none) {
          val.编辑主题框.setContent(tmpSubject)
        }
        if(val.编辑正文框 != none) {
          val.编辑正文框.setContent(tmpBody)
        }
        if(val.编辑过期框 != none) {
          val.编辑过期框.setContent(tmpExpiresDays)
        }
        if(val.编辑命令框 != none) {
          val.编辑命令框.setContent(tmpCommands)
        }
        if(val.编辑领取条件框 != none) {
          val.编辑领取条件框.setContent(tmpConditions)
        }
        // 重建货币附件行：模板作为第 0 行，再复制 size-1 个
        while(val.货币附件滚动区.childrenCount() > 1){
          val.货币附件滚动区.get(1).remove()
        }
        if(var.editCurrencyList.size() > 0){
          row = val.货币附件滚动区['货币行模板']
          row.entryKey = 0.round()
          entry = var.editCurrencyList['0']
          if(row['货币输入'] != none) {
            row['货币输入'].setContent(entry['currency'])
          }
          if(row['金额输入'] != none) {
            row['金额输入'].setContent(entry['amount'].round())
          }
          if(row['描述输入'] != none) {
            row['描述输入'].setContent(entry['description'])
          }
          // icon 字段
          if(row['图标材质输入'] != none) {
            row['图标材质输入'].setContent(entry['iconMaterial'] != none ? entry['iconMaterial'] : '')
          }
          if(row['图标CMD输入'] != none) {
            row['图标CMD输入'].setContent(entry['iconCustomModelData'] != none ? entry['iconCustomModelData'].round() : '')
          }
          if(row['图标纹理输入'] != none) {
            row['图标纹理输入'].setContent(entry['iconTexture'] != none ? entry['iconTexture'] : '')
          }
          if(row['图标URL输入'] != none) {
            row['图标URL输入'].setContent(entry['iconTextureUrl'] != none ? entry['iconTextureUrl'] : '')
          }
          if(row['图标名称输入'] != none) {
            row['图标名称输入'].setContent(entry['iconName'] != none ? entry['iconName'] : '')
          }
          // iconLore 是 List，拼接为多行文本
          loreText = ''
          if(entry['iconLore'] != none){
            for(j in range(0, entry['iconLore'].size() - 1)){
              if(loreText != ''){
                loreText = loreText + '\n'
              }
              loreText = loreText + entry['iconLore'][j.round()]
            }
          }
          if(row['图标描述输入'] != none) {
            row['图标描述输入'].setContent(loreText)
          }
        }
        for(i in range(1, var.editCurrencyList.size() - 1)){
          if(val.货币附件滚动区['货币行模板'] != none) {
            row = val.货币附件滚动区['货币行模板'].copy('货币行' + i.round())
            row.entryKey = i.round()
            row.isTemplate = false
            entry = var.editCurrencyList[i.round()]
            if(row['货币输入'] != none) {
              row['货币输入'].setContent(entry['currency'])
            }
            if(row['金额输入'] != none) {
              row['金额输入'].setContent(entry['amount'].round())
            }
            if(row['描述输入'] != none) {
              row['描述输入'].setContent(entry['description'])
            }
            // icon 字段
            if(row['图标材质输入'] != none) {
              row['图标材质输入'].setContent(entry['iconMaterial'] != none ? entry['iconMaterial'] : '')
            }
            if(row['图标CMD输入'] != none) {
              row['图标CMD输入'].setContent(entry['iconCustomModelData'] != none ? entry['iconCustomModelData'].round() : '')
            }
            if(row['图标纹理输入'] != none) {
              row['图标纹理输入'].setContent(entry['iconTexture'] != none ? entry['iconTexture'] : '')
            }
            if(row['图标URL输入'] != none) {
              row['图标URL输入'].setContent(entry['iconTextureUrl'] != none ? entry['iconTextureUrl'] : '')
            }
            if(row['图标名称输入'] != none) {
              row['图标名称输入'].setContent(entry['iconName'] != none ? entry['iconName'] : '')
            }
            loreText = ''
            if(entry['iconLore'] != none){
              for(j in range(0, entry['iconLore'].size() - 1)){
                if(loreText != ''){
                  loreText = loreText + '\n'
                }
                loreText = loreText + entry['iconLore'][j.round()]
              }
            }
            if(row['图标描述输入'] != none) {
              row['图标描述输入'].setContent(loreText)
            }
          }
        }
        // 重建 CDK 行：模板作为第 0 行，再复制 size-1 个
        while(val.CDK滚动区.childrenCount() > 1){
          val.CDK滚动区.get(1).remove()
        }
        if(var.editCdkList.size() > 0){
          row = val.CDK滚动区['CDK行模板']
          row.entryKey = 0.round()
          entry = var.editCdkList['0']
          row.cdkEnabled = entry['enabled']
          if(row['CDK码输入'] != none) {
            row['CDK码输入'].setContent(entry['code'])
          }
          if(row['最大领取输入'] != none) {
            row['最大领取输入'].setContent(entry['maxClaims'].round())
          }
          // 过期模式：absolute=绝对时间 / relative=相对时长 / none=不过期
          mode = entry['expireMode'] != none ? entry['expireMode'] : 'relative'
          row.expireMode = mode
          if(mode == 'absolute'){
            if(row['过期输入'] != none) {
              row['过期输入'].setContent(entry['expiresAt'] != none ? entry['expiresAt'] : '')
            }
          } else {
            if(row['过期输入'] != none) {
              row['过期输入'].setContent(entry['expiresAfter'] != none ? entry['expiresAfter'] : '')
            }
          }
        }
        for(i in range(1, var.editCdkList.size() - 1)){
          if(val.CDK滚动区['CDK行模板'] != none) {
            row = val.CDK滚动区['CDK行模板'].copy('CDK行' + i.round())
            row.entryKey = i.round()
            row.isTemplate = false
            entry = var.editCdkList[i.round()]
            row.cdkEnabled = entry['enabled']
            if(row['CDK码输入'] != none) {
              row['CDK码输入'].setContent(entry['code'])
            }
            if(row['最大领取输入'] != none) {
              row['最大领取输入'].setContent(entry['maxClaims'].round())
            }
            mode = entry['expireMode'] != none ? entry['expireMode'] : 'relative'
            row.expireMode = mode
            if(mode == 'absolute'){
              if(row['过期输入'] != none) {
                row['过期输入'].setContent(entry['expiresAt'] != none ? entry['expiresAt'] : '')
              }
            } else {
              if(row['过期输入'] != none) {
                row['过期输入'].setContent(entry['expiresAfter'] != none ? entry['expiresAfter'] : '')
              }
            }
          }
        }
        // 附件槽位为 Icon 类型，需要手动 seticon 刷新；背包槽位为 Backpack 类型，自动显示
        for(i in range(0, var.adminAttachmentSlots - 1)){
          if(val.管理附件网格 != none) {
            slot = val.管理附件网格.get(i.round())
            if(slot != none){
              slot.seticon()
            }
          }
        }
      })
    # packetHandler: attachment-count
    # 包字段: itemAttachmentCount/attachment_jsons/backpack_jsons
    attachment-count: |-
      // 添加/删除附件后由 attachment-count 更新；打开编辑时由 preset-detail 提供 attachment_jsons，
      // 此时 attachment-count 的 session 为空，不应覆盖。用 presetDetailLoaded 标志区分两种场景。
      if(var.presetDetailLoaded){
        var.presetDetailLoaded = false
      } else {
        var.attachmentJsons = packet['attachment_jsons']
        var.editItemCount = var.attachmentJsons.size().round()
      }
      // 附件槽位为 Icon 类型，需要手动 seticon 刷新；背包槽位为 Backpack 类型，自动显示
      for(i in range(0, var.adminAttachmentSlots - 1)){
        if(val.管理附件网格 != none) {
          slot = val.管理附件网格.get(i.round())
          if(slot != none){
            slot.seticon()
          }
        }
      }
    # packetHandler: result
    # 包字段: success/message/closeView
    # closeView=true: 保存/删除成功后切回列表；closeView=false: 附件增删后留在编辑视图
    result: |-
      var.resultMsg = packet['message']
      if(packet['success'] && packet['closeView'] == true){
        var.view = 'list'
      }

# ─── 邮局导航 / 档案工具 / 信笺工作台 ─────────────────────────────
controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~32,23,25,240
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~90,48,50,255
              through: true
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~151,138,112,150
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~175,147,97,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f管理"
              fontSize: 64
              through: true
          邮局副标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 300
              texts: ~&f私人邮局 / 预设档案与派发
              fontSize: 36
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 96
              height: 48
            action:
              clickLeft: |-
                var.dispatchTargetName = ''
                var.editBody = none
                var.editCdkList = []
                var.editCommands = none
                var.editConditions = none
                var.editCurrencyList = []
                var.editDisplayName = none
                var.editEnabled = true
                var.editExpiresDays = 15
                var.editId = none
                var.editSubject = none
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~249,243,230,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 1
                    color: "self.parent.isHovered() ? '175,147,97,255' : '151,138,112,150'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&0关闭"
                  fontSize: 36
                  through: true

      邮件导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 124
          width: "var.viewW - 96"
          height: 60
        children:
          导航收件箱:
            type: Canvas
            attribute:
              x: 0
              width: 160
              height: 60
            action:
              clickLeft: Packet.send('AXS_MAIL', 'open')
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~90,48,50,255
                  hover: ~119,65,64,255
                  through: true
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f收件箱
                  fontSize: 36
                  through: true
          导航日志:
            type: Canvas
            attribute:
              x: 176
              width: 160
              height: 60
            action:
              clickLeft: Packet.send('AXS_MAIL', 'logs')
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~90,48,50,255
                  hover: ~119,65,64,255
                  through: true
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f日志
                  fontSize: 36
                  through: true
          导航写信:
            type: Canvas
            attribute:
              x: 352
              width: 160
              height: 60
            action:
              clickLeft: Packet.send('AXS_MAIL', 'compose')
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~90,48,50,255
                  hover: ~119,65,64,255
                  through: true
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f写信
                  fontSize: 36
                  through: true
          导航管理:
            type: Canvas
            attribute:
              x: 528
              width: 160
              height: 60
              visible: "var.isAdmin == true"
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~90,48,50,255
                  through: true
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 1
                    color: ~175,147,97,255
              标记:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~175,147,97,255
                  through: true
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f管理
                  fontSize: 36
                  through: true
      页面说明:
        type: Text
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 212
          texts: ~&7先整理预设信笺，再选择收件范围派发；保存与派发是独立操作。
          fontSize: 36
          through: true
      # ── 管理工作流：档案 -> 附件与领取规则 ───────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 264
          width: 260
          height: "var.viewH - 312"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~238,228,210,255
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 1
                color: ~151,138,112,150
          工具栏标题:
            type: Text
            attribute:
              x: 20
              y: 24
              texts: ~&0档案工具
              fontSize: 48
              through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 20
              y: 78
              width: 220
              height: 2
              normal: ~151,138,112,150
          操作标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 238
              texts: "~&8信笺配置"
              fontSize: 36
          刷新列表按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 98
              width: 232
              height: 56
            action:
              clickLeft: |-
                var.view = 'list'
                Packet.send('AXS_MAIL', 'admin-preset-list')
            children:
              刷新列表底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.view == 'list' ? '90,48,50,255' : '249,243,230,255'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 1
                    color: "var.view == 'list' ? '175,147,97,255' : '151,138,112,150'"
              刷新列表文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.view == 'list' ? '&f刷新档案' : '&0返回档案'"
                  fontSize: 36
                  through: true
          新建预设按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 170
              width: 232
              height: 56
            action:
              clickLeft: |-
                var.editId = none
                var.editEnabled = true
                var.editDisplayName = none
                var.editSubject = none
                var.editBody = none
                var.editExpiresDays = 15
                var.editItemCount = 0
                var.editCommands = none
                var.editConditions = none
                var.editFound = false
                var.editCurrencyList = []
                var.editCdkList = []
                var.view = 'edit'
                var.subView = ''
                var.resultMsg = none
                // 推迟到下一帧再清空输入框，确保编辑视图已可见（与 preset-detail 同理）
                scheduler.delay(50, -> {
                  val.编辑编号框.setContent('')
                  val.编辑显示名框.setContent('')
                  val.编辑主题框.setContent('')
                  val.编辑正文框.setContent('')
                  val.编辑过期框.setContent('15')
                  val.编辑命令框.setContent('')
                  val.编辑领取条件框.setContent('')
                  // 清空货币附件和 CDK 动态行
                  while(val.货币附件滚动区.childrenCount() > 1){
                    val.货币附件滚动区.get(1).remove()
                  }
