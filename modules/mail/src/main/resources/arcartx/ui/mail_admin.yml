                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: "self.parent.parent.expireMode == 'absolute' ? '100,160,220,230' : '80,180,120,230'"
                                      shape: ~round_rect
                                      radius: 8
                                  过期模式文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      texts: "self.parent.parent.expireMode == 'absolute' ? '&0绝对' : '&0相对'"
                                      fontSize: 32
                                      through: true
                              过期模式分割线:
                                type: Texture
                                attribute:
                                  x: 404
                                  y: 12
                                  width: 2
                                  height: 32
                                  normal: ~255,255,255,230
                              过期输入:
                                type: TextBox
                                attribute:
                                  x: 408
                                  y: 12
                                  width: 160
                                  height: 32
                                  fontSize: 49
                                  emptyText: "~&730d 或 ISO时间"
                              CDK删除按钮:
                                type: Canvas
                                attribute:
                                  x: 576
                                  y: 8
                                  width: 40
                                  height: 40
                                  visible: "self.parent.isTemplate != true"
                                action:
                                  clickLeft: |-
                                    self.parent.remove()
                                children:
                                  CDK删除底:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: ~235,100,100,230
                                      shape: ~round_rect
                                      radius: 8
                                  CDK删除文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      texts: "~&f✕"
                                      fontSize: 32
                                      through: true
                  CDK滑块:
                    type: Texture
                    val: CDK滑块
                    attribute:
                      point: ~top_left
                      x: "var.contentW - 26"
                      y: 72
                      width: 6
                      height: 60
                      normal: ~120,120,120,200
                      maxDragY: 120
                  添加CDK按钮:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 16
                      y: "var.viewH - 144 - 48"
                      width: 120
                      height: 40
                    action:
                      clickLeft: |-
                        idx = val.CDK滚动区.childrenCount() - 1
                        row = val.CDK滚动区['CDK行模板'].copy('CDK行' + idx.round())
                        row.entryKey = idx.round()
                        row.isTemplate = false
                        row.cdkEnabled = true
                        row.expireMode = 'relative'
                        row['CDK码输入'].setContent('')
                        row['最大领取输入'].setContent('100')
                        row['过期输入'].setContent('30d')
                    children:
                      添加CDK底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~80,180,120,230
                          shape: ~round_rect
                          radius: 10
                      添加CDK文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&0+ 添加"
                          fontSize: 32
                          through: true
              # ══ 领取命令副面板 ════════════════════════════════
