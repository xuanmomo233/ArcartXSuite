                  through: true
                  normal: ~70,150,250,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              回收高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~70,150,250,255
                  shape: ~round_rect
                  radius: 2
                  through: true
              回收文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0回收商店"
                  fontSize: 36
                  through: true
          导航交易历史:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 282
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'history_ui_open')
            children:
              交易历史底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              交易历史文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f交易历史"
                  fontSize: 36
                  through: true
          导航上架:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 348
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'sell_ui_open')
            children:
              上架底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              上架文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f物品上架"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 14
              y: 420
              width: 272
              height: 1
              normal: ~62,66,74,210
              through: true
          # ── 回收信息面板 ──────────────────────────
          倍率标题:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 440
              texts: "~&f回收倍率"
              fontSize: 36
              through: true
          倍率值:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 480
              texts: "'&e' + var.multiplier + 'x'"
              fontSize: 48
              through: true
          收益标题:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 540
              texts: "'&f' + var.earningsTitle"
              fontSize: 36
              through: true
          收益列表容器:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 580
              width: 272
              height: "var.viewH - 724"
            children:
              收益列表:
                type: VStack
                attribute:
                  width: 272
                  spaceBetween: 6
                children:
                  收益项:
                    type: Text
                    attribute:
                      entryKey: 0.round()
                      visible: "var.earningsTexts[self.entryKey] != none"
                      texts: "'&a' + var.earningsTexts[self.entryKey]"
                      fontSize: 32
                      through: true
          # ── 一键回收按钮 ──────────────────────────
          一键回收按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: "var.viewH - 132"
              width: 272
              height: 48
              enable: "!var.actionBusy && var.actionToken != '' && var.maxRecycleCount > 0"
            action:
              clickLeft: |-
                var.actionBusy = true
                Packet.send(var.packetId, 'recycle_all', var.actionToken)
            children:
              一键回收底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~80,200,120,230
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,140,255' : '255,255,255,230'"
              一键回收文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f一键回收"
                  fontSize: 36
                  through: true
          刷新按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: "var.viewH - 76"
              width: 272
              height: 48
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'recycle_preview')
            children:
              刷新底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f刷新预览"
                  fontSize: 36
                  through: true

      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          内容标题:
            type: Text
            attribute:
              point: ~top_left
              x: 24
              y: 24
              texts: "~&f可回收物品"
              fontSize: 48
          空物品提示:
            type: Text
            attribute:
              point: ~middle_center
              x: 0
              y: -40
              fontSize: 64
              visible: "var.recyclables == none || var.recyclables.keys().length == 0"
              texts: "~&8背包中没有可回收物品"
              through: true
          物品滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -18
              y: 88
              width: 8
              height: "var.viewH - 232"
              normal: ~42,50,66,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          物品滑块:
            type: Texture
            val: 物品滑块
            attribute:
              point: ~top_right
              x: -18
              y: 88
              width: 8
              height: 80
              normal: ~140,200,255,255
              maxDragY: "var.viewH - 312"
              shape: ~round_rect
              radius: 4
          物品滚动:
            type: Scroll
            val: 物品滚动
            attribute:
              point: ~top_left
              x: 24
              y: 88
              width: "var.scrollW"
              height: "var.viewH - 232"
              moveY: "self.parent['物品滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              回收列表:
                val: 回收列表
                type: HGrid
                attribute:
                  width: "var.scrollW"
                  column: 3
                  spaceBetweenX: 16
                  spaceBetweenY: 16
                children:
                  回收卡片:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.recyclables[self.entryKey]
                      visible: self.entry != none
                      width: "var.cardW"
                      height: 220
                    children:
                      卡片底:
                        type: Texture
                        attribute:
                          point: ~top_left
                          x: 3
                          y: 0
                          width: "var.cardW - 6"
                          height: 220
                          through: true
                          normal: ~42,50,66,210
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
                      物品图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 0.72
                          x: 15
                          y: 12
                          width: 96
                          height: 96
                          normal: ~36,42,54,220
                          shape: ~round_rect
                          radius: 12
                          through: true
                          seticon: "self.setItemIcon(var.itemJsons[self.parent.entryKey] != none ? var.itemJsons[self.parent.entryKey] : var.emptyItemJson)"
                      物品名称:
                        type: Text
                        attribute:
                          x: 123
                          y: 16
                          texts: "'&f' + self.parent.entry['name']"
                          fontSize: 36
                          through: true
                      数量:
                        type: Text
                        attribute:
                          x: 123
                          y: 52
                          texts: "'&7数量: &f' + self.parent.entry['amount']"
                          fontSize: 32
                          through: true
                      单价:
                        type: Text
                        attribute:
                          x: 123
                          y: 88
                          texts: "'&7单价: &e' + self.parent.entry['unitPrice'] + ' &7' + self.parent.entry['currencyName']"
                          fontSize: 32
                          through: true
                      总价:
                        type: Text
                        attribute:
                          x: 123
                          y: 124
                          texts: "'&a总价: &f' + self.parent.entry['totalPrice'] + ' &7' + self.parent.entry['currencyName']"
                          fontSize: 32
                          through: true
                      回收按钮:
                        type: Canvas
                        attribute:
                          x: 15
                          y: 168
                          width: "var.cardW - 30"
                          height: 40
                          enable: "!var.actionBusy && var.actionToken != ''"
                        action:
                          clickLeft: |-
                            var.actionBusy = true
                            Packet.send(var.packetId, 'recycle_single', self.parent.entry['slot'].round(), var.actionToken)
                        children:
                          回收单底:
                            type: Texture
                            attribute:
                              point: ~top_left
                              x: 3
                              y: 0
                              width: "var.cardW - 36"
                              height: 40
                              through: true
                              normal: ~220,150,50,230
                              shape: ~round_rect
                              radius: 10
                            effect:
                              ripple:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '255,180,60,255' : '255,255,255,230'"
                          回收单文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "~&f回收此物品"
                              fontSize: 32
                              through: true
