                  任务按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 220
                      texts: "~&f任务列表"
                      fontSize: 30
                      through: true

          # 最近捕获记录流
          最近捕获区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 32
              y: 700
              width: "var.contentW - 64"
              height: "var.viewH - 876"
            children:
              最近底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~50,160,190,180
              最近标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 28
                  y: 20
                  texts: "~&f最近捕获"
                  fontSize: 34
              最近说明:
                type: Text
                attribute:
                  point: ~top_left
                  x: 160
                  y: 24
                  texts: "~&f最近的钓鱼记录（最多 10 条）"
                  fontSize: 28
              # 空状态提示
              空状态:
                type: Text
                attribute:
                  point: ~middle_center
                  y: 20
                  width: "var.contentW - 64"
                  texts: "~&7暂无捕获记录，去钓鱼吧！"
                  fontSize: 32
                  visible: var.recentCount == 0
              # 滚动滑块
              最近滑块:
                type: Texture
                val: 最近滑块
                attribute:
                  point: ~top_right
                  x: -12
                  y: 64
                  width: 8
                  height: 60
                  normal: ~50,170,200,200
                  maxDragY: "var.viewH - 940"
              # 滚动区
              滚动区:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 24
                  y: 64
                  width: "var.contentW - 120"
                  height: "var.viewH - 940"
                  moveY: "self.parent['最近滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['最近滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['最近滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  最近列表:
                    val: 最近列表
                    type: VStack
                    attribute:
                      width: "var.contentW - 120"
                      spaceBetween: 8
                    children:
                      # 捕获条目模板（索引0）
                      捕获条目:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.recentCatches[self.entryKey]
                          visible: self.entry != none
                          width: "var.contentW - 120"
                          height: 80
                        children:
                          条目底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~26,34,46,200
                              shape: ~round_rect
                              radius: 10
                            effect:
                              stroke:
                                width: 2
                                color: ~50,160,190,80
                          # 鱼物品图标（不开 through：穿透会导致 hover 事件丢失，tooltip 不显示）
                          鱼图标:
                            type: Slot
                            attribute:
                              x: 14
                              y: 10
                              width: 60
                              height: 60
                              normal: ~18,28,40,180
                              shape: ~round_rect
                              radius: 8
                              slotType: ~Icon
                              itemScale: 0.7
                              seticon: "self.setItemIcon(var.recentIconJsons[self.parent.entryKey] != none ? var.recentIconJsons[self.parent.entryKey] : var.emptyItemJson)"
                          # 稀有度色条
                          稀有度色条:
                            type: Texture
                            attribute:
                              point: ~middle_left
                              x: 84
                              width: 4
                              height: 50
                              normal: "self.parent.entry != none ? (self.parent.entry['rarity'] == 'legendary' ? '255,200,50,255' : (self.parent.entry['rarity'] == 'rare' ? '80,140,240,255' : (self.parent.entry['rarity'] == 'uncommon' ? '100,220,120,255' : '200,200,200,255'))) : '200,200,200,255'"
                              shape: ~round_rect
                              radius: 2
                              through: true
                          # 鱼名
                          鱼名:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 100
                              y: 10
                              width: "var.contentW - 340"
                              texts: "self.parent.entry != none ? (self.parent.entry['rarity'] == 'legendary' ? '&6' : (self.parent.entry['rarity'] == 'rare' ? '&9' : (self.parent.entry['rarity'] == 'uncommon' ? '&a' : '&f'))) + self.parent.entry['fishName'] : none"
                              fontSize: 30
                              limit: 24
                              through: true
                          # 尺寸 + 完美标记
                          尺寸:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 100
                              y: 44
                              width: "var.contentW - 340"
                              texts: "self.parent.entry != none ? ('&7尺寸: &f' + self.parent.entry['size'].round() + ' cm' + (self.parent.entry['perfect'] == true ? ' &a★ 完美' : '')) : none"
                              fontSize: 24
                              through: true
                          # 稀有度标签
                          稀有度标签:
                            type: Text
                            attribute:
                              point: ~middle_right
                              x: -16
                              texts: "self.parent.entry != none ? (self.parent.entry['rarity'] == 'legendary' ? '&6传说' : (self.parent.entry['rarity'] == 'rare' ? '&9稀有' : (self.parent.entry['rarity'] == 'uncommon' ? '&a罕见' : '&f普通'))) : none"
                              fontSize: 26
                              through: true
