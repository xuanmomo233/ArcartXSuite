                                  var.crossWorldTargetWorld = self.parent.entry['id']
                                  var.crossWorldTargetName = self.parent.entry['remote'] == true ? self.parent.entry['displayName'] + ' &7@ &f' + self.parent.entry['server'] : self.parent.entry['displayName']
                                  var.crossWorldRemote = self.parent.entry['remote'] == true
                                  var.crossWorldPromptVisible = true
                                }
                            children:
                              地图项目传送底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: "var.actionToken != none ? '74,144,226,255' : '60,60,66,255'"
                                  hover: "var.actionToken != none ? '94,164,246,255' : '60,60,66,255'"
