# ════════════════════════════════════════════════════════════════
# 电影序列示例配置
# ════════════════════════════════════════════════════════════════
# 本文件为示例模板，模块首次启动时导出到
#   data/conversation/cinematics/cinematic_example.yml
# 你可以参考此文件创建自己的序列文件，或直接修改本文件。
#
# 文件可包含 cinematic.cinematics 或顶层 cinematics 节。
# 模块启动/重载时会扫描 cinematics/ 目录下所有 .yml 文件并合并序列。
# 建议按主题分文件管理，例如 npc_shimei.yml、boss_intro.yml。
#
# 命令:
#   /axs conversation cinematic play <序列ID> [玩家名]
#   /axs conversation cinematic stop
#   /axs conversation cinematic list
#
# 动作类型 (type):
#   teleport       - 传送玩家到指定坐标
#   camera_path    - 沿路径平滑插值传送（模拟摄像机移动）
#   title          - 显示原版标题/副标题
#   action_bar     - 显示原版 Action Bar 消息
#   wait           - 纯等待（利用 delay-after-ms）
#   sound          - 播放原版音效
#   game_mode      - 切换游戏模式
#   npc_animation  - 对 Adyeshach NPC 播放动画
#   npc_model      - 对 Adyeshach NPC 设置模型
#   message        - 发送聊天消息
#   command        - 执行命令（as-console: true 以控制台执行）
#   speed          - 设置行走/飞行速度
#   lock_movement  - 锁定/解锁玩家移动（设置速度为 0）
#   subtitle       - 播放 Announcer 字幕组（打字机效果，需 Announcer 模块）
#   ui_packet      - 发送包到 ArcartX 客户端 UI（自定义 HUD/标题等）
#   arcartx_sound  - 播放 ArcartX 资源包自定义音效
#
# 每个动作可设 delay-after-ms: 执行后等待的毫秒数。
# ════════════════════════════════════════════════════════════════

cinematic:
  cinematics:

    # ── 示例：开场动画 ────────────────────────────────────
    intro:
      name: "开场动画"
      actions:
        - type: lock_movement
          locked: true
          delay-after-ms: 0
        - type: title
          title: "&6第一章"
          subtitle: "&7新的开始"
          fade-in: 10
          stay: 60
          fade-out: 10
          delay-after-ms: 2000
        - type: camera_path
          world: world
          duration-ms: 5000
          ticks-per-frame: 2
          points:
            - { x: 100, y: 70, z: 200, yaw: 0, pitch: 30 }
            - { x: 110, y: 75, z: 210, yaw: 45, pitch: 20 }
            - { x: 120, y: 80, z: 220, yaw: 90, pitch: 10 }
          delay-after-ms: 1000
        - type: npc_animation
          npc: "村长老王"
          animation: wave
          speed: 1.0
          transition-time: 5
          keep-time: -1
          delay-after-ms: 2000
        - type: title
          title: ""
          subtitle: "&a欢迎来到村庄"
          fade-in: 10
          stay: 40
          fade-out: 10
          delay-after-ms: 1500
        - type: lock_movement
          locked: false
          delay-after-ms: 0

    # ── 示例：ArcartX 动作演示 ────────────────────────────
    arcartx_demo:
      name: "ArcartX 动作演示"
      actions:
        - type: subtitle
          group-id: intro_subtitle
          delay-after-ms: 3000
        - type: ui_packet
          ui-id: AXS:custom_hud
          handler: show_title
          payload:
            text: "过场动画"
            color: gold
          delay-after-ms: 2000
        - type: arcartx_sound
          resource-path: sounds/cinematic_intro.ogg
          category: master
          at-player: true
          pitch: 1.0
          keep-time-ms: 5000
          delay-after-ms: 1000
