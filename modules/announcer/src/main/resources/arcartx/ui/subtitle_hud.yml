# 字幕 HUD — 打字机动画字幕显示界面
# 由服务端 Subtitle 模块推送字幕帧，客户端按打字机效果逐字显示。
# 支持背景板显示/隐藏、动画时长控制和自动关闭。
ui:
  isHud: true  # HUD 模式，覆盖在游戏画面上
  defaultOpen: false  # 不随启动自动打开
  through: false  # 鼠标不穿透
  background: false  # 无背景遮罩
  closeDied: false  # 关闭后不销毁（可复用）
  show: true  # 可见
  level: 1  # 渲染层级
  packetHandler:
    # packetHandler: play
    # 包字段:
    #   - text: 字幕文本内容
    #   - length: 打字机动画总字数（0 = 自动按文本长度计算）
    #   - time: 打字机动画时长（毫秒）
    #   - showBackground: 是否显示字幕背景板
    play: |-
      var.subtitleVisible = true
      var.subtitleText = packet['text']
      var.subtitleLength = packet['length']
      var.subtitleTime = packet['time']
      var.subtitleShowBackground = packet['showBackground']
      var.subtitlePlateW = var.subtitleLength * 54 + 216
      if(var.subtitlePlateW < 480){
        var.subtitlePlateW = 480
      }
      if(var.subtitlePlateW > 1360){
        var.subtitlePlateW = 1360
      }
      var.subtitleAnimation = Lerp(0, var.subtitleLength, var.subtitleTime)
    # packetHandler: close
    # 包字段: 无（仅通知客户端关闭字幕）
    close: |-
      var.subtitleVisible = false
      var.subtitleAnimation = Lerp(0, 0, 1)
  action:
    load: |-
      var.subtitleVisible = false
      var.subtitlePlateW = 480
      var.subtitleAnimation = Lerp(0, 0, 1)
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      字幕面板:
        type: Canvas
        attribute:
          point: ~top_center
          x: 0
          y: "var.viewH - 230"
          width: 1400
          height: 110
          through: true
          visible: var.subtitleVisible
        children:
          字幕背景:
            type: Texture
            attribute:
              point: ~middle_center
              width: "var.subtitlePlateW"
              height: 102
              normal: ~16,21,30,154
              shape: ~round_rect
              radius: 12
              through: true
              visible: var.subtitleShowBackground
          字幕顶线:
            type: Texture
            attribute:
              point: ~top_center
              y: 4
              width: 104
              height: 3
              normal: ~226,188,123,218
              through: true
              visible: var.subtitleShowBackground
          字幕标识:
            type: Text
            attribute:
              point: ~top_center
              y: 13
              texts: ~&7字幕  /  CAPTION
              fontSize: 36
              through: true
              visible: var.subtitleShowBackground
          字幕文字:
            type: Text
            attribute:
              point: ~middle_center
              y: 23
              limit: var.subtitleAnimation
              texts: "var.subtitleText"
              fontSize: 54
              through: true
              visible: var.subtitleVisible
