              point: ~top_left
              x: 14
              y: 304
              width: 258
              height: var.viewH - 482
              moveY: self.parent['仓库滑块'].getDragYRatio()
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              仓库列容器:
                type: VStack
                attribute:
                  width: 258
                  spaceBetween: 8
                children:
                  个人仓库列表:
                    type: VStack
                    val: 个人仓库列表
                    attribute:
                      width: 258
                      spaceBetween: 8
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.personalWarehouses[self.entryKey]
                          visible: self.entry != none
                          width: 258
                          height: 48
                        action:
                          clickLeft: Packet.send(var.packetId, 'warehouse', self.entry['id'])
                        children:
                          项底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: 'var.ownerType == ''personal'' && self.parent.entry != none && self.parent.entry[''id''] == var.warehouseId
                                ? ''64,72,82,225'' : ''44,50,58,245'''
                              shape: ~round_rect
                              radius: 12
                            effect:
                              stroke:
                                width: 3
                                color: 'self.isHovered() ? ''220,230,240,255'' : (var.ownerType == ''personal'' && self.parent.entry != none &&
                                  self.parent.entry[''id''] == var.warehouseId ? ''255,255,255,255'' : ''100,110,120,220'')'
                          项字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: '''&f'' + var.personalWarehouseTexts[self.parent.entryKey]'
                              fontSize: 36
                              through: true
                  共享仓库列表:
                    type: VStack
                    val: 共享仓库列表
                    attribute:
                      width: 258
                      spaceBetween: 8
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.sharedWarehouses[self.entryKey]
                          visible: self.entry != none
                          width: 258
                          height: 48
                        action:
                          clickLeft: Packet.send(var.packetId, 'shared', self.entry['id'])
                        children:
                          项底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: 'var.ownerType == ''shared'' && self.parent.entry != none && self.parent.entry[''id''] == var.ownerId ?
                                ''64,72,82,225'' : ''44,50,58,245'''
                              shape: ~round_rect
                              radius: 12
                            effect:
                              stroke:
                                width: 3
                                color: 'self.isHovered() ? ''220,230,240,255'' : (var.ownerType == ''shared'' && self.parent.entry != none &&
                                  self.parent.entry[''id''] == var.ownerId ? ''255,255,255,255'' : ''100,110,120,220'')'
                          项字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: '''&f'' + var.sharedWarehouseStorageTexts[self.parent.entryKey]'
                              fontSize: 36
                              through: true
