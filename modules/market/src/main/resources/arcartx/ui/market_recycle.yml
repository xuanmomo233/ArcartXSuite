          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~242,237,223,255
              shape: ~round_rect
              radius: 14
              through: true
            effect:
              stroke:
                width: 1
                color: 'self.parent.isHovered() ? ''175,147,97,255'' : ''151,138,112,150'''
