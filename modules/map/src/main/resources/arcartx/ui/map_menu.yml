                              texts: "self.parent.entry != none && self.parent.entry['selected'] ? '&3选' : '&8图'"
                              fontSize: 48
                              through: true
                          地图项目文字:
                            type: Scroll
                            attribute:
                              point: ~top_left
                              x: 56
                              y: 14
                              width: 244
                              height: 32
                              through: true
                              scrollAnim: none
                              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                            action:
                              tick: |-
                                if(self.parent.isHovered()) {
                                  if(self.scrollAnim == none) { self.scrollAnim = Lerp(0, 1, 3500) }
                                } else { self.scrollAnim = none }
                            children:
                              世界名称布局:
                                type: HStack
                                attribute:
                                  height: 32
                                  through: true
                                children:
                                  世界名称文字:
                                    type: Text
                                    attribute:
                                      texts: "'&0' + self.parent.parent.parent.entry['displayName']"
                                      fontSize: 36
                                      through: true
                          # 远程世界徽标：显示来源服务器名（worldRows[].remote/server 由服务端下发）
                          地图项目服务器:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 56
                              y: 54
                              texts: "'&3跨服 &8/ &0' + self.parent.entry['server']"
                              fontSize: 36
                              visible: "self.parent.entry != none && self.parent.entry['remote'] == true"
                              through: true
                          # 跨世界传送按钮：只对"非玩家当前世界"的条目显示，
                          # 点击直接传送到该世界出生点（tokenized 写操作）。
                          # 远程世界额外要求 canTeleport（目标服 allowArrive）
                          地图项目传送:
                            type: Canvas
                            attribute:
                              tip: ~&0传送到该世界
                              point: ~middle_right
                              x: -10
                              width: 40
                              height: 40
                              visible: "self.parent.entry != none && self.parent.entry['id'] != var.playerWorldId && (self.parent.entry['remote'] != true || self.parent.entry['canTeleport'] == true)"
                            action:
                              clickLeft: |-
                                // 跨世界传送统一走确认框（L16）：类型 teleport_world，
                                // 确认后由对话框按钮发 teleport_to_world；远程世界复合 id 原样回传
                                if (self.parent.entry != none && var.actionToken != none) {
                                  var.crossWorldPromptType = 'teleport_world'
                                  var.crossWorldTargetWorld = self.parent.entry['id']
                                  var.crossWorldTargetName = self.parent.entry['remote'] == true ? self.parent.entry['displayName'] + ' &8@ &0' + self.parent.entry['server'] : self.parent.entry['displayName']
                                  var.crossWorldRemote = self.parent.entry['remote'] == true
                                  var.crossWorldPromptVisible = true
                                }
                            children:
                              地图项目传送底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: "var.actionToken != none ? '132,182,193,255' : '191,186,166,255'"
                                  hover: "var.actionToken != none ? '157,201,208,255' : '191,186,166,255'"
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  stroke:
                                    width: "self.isHovered() ? 2 : 1"
