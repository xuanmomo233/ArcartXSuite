# 文件用途: CS 开箱风格抽奖界面（AXS:lottery_case）的客户端 UI 配置。
# 本文件只负责渲染与交互回传，抽奖逻辑、消耗校验、奖励发放全部在服务端。
# 界面结构: 单一 Adaptive 根 -> 主面板（奖池预览 + 操作栏）+ 开箱动画层 + 单抽/十连结果层 + 历史/详情弹层。
# 开箱流程为「包驱动」: 点击只发请求并进入等待态，result / batch_result 到达后才揭晓，
# 若服务端只回 update（消耗不足等失败情形），等待态会被自动解除，界面不会卡死。
ui:
  match:
    - "AXS:lottery_case"  # 匹配的界面 ID
  isHud: false  # 非 HUD，为弹出式菜单界面
  through: false  # 不穿透点击
  escClose: true  # 按 ESC 可关闭界面
  background: false  # 不渲染原版背景
  closeDied: false  # 玩家死亡时不关闭界面
  show: true  # 界面可见
  screenScale: true  # 启用屏幕等比缩放
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包 ID，回传操作时使用
    #   - poolName / poolDescription: 当前奖池名称与描述
    #   - poolList: 奖池名称列表（key 为 "0"、"1"… 的纯数字字符串）
    #   - currentPoolIndex: 当前奖池索引
    #   - action_token: 操作令牌，每次 update 都会换发，回传时必须带上
    #   - costRows: 单抽消耗条目（key "0"… ，每条含 type/id/amount/displayName/icon/owned）
    #   - costTenRows: 十连消耗条目，结构同上
    #   - tenAvailable: 当前奖池是否配置了十连消耗，false 时隐藏十连按钮
    #   - resourceRows: 当前奖池涉及的资源余额（含 displayName/icon/owned）
    #   - itemJsons / itemNames / itemRarities / itemCount: 奖池预览物品（key 为 "1" 起的数字字符串）
    # 说明: owned 为 -1 表示余额未知（外部货币桥不可用），界面显示 "—" 且不判定为不足。
    init: |-
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.packetId = packet['packetId']
      var.poolName = packet['poolName']
      var.poolDescription = packet['poolDescription']
      var.poolList = packet['poolList'] != none ? packet['poolList'] : {}
      var.currentPoolIndex = packet['currentPoolIndex'] != none ? packet['currentPoolIndex'] : 0
      var.actionToken = packet['action_token']
      var.costRows = packet['costRows'] != none ? packet['costRows'] : {}
      var.costTenRows = packet['costTenRows'] != none ? packet['costTenRows'] : {}
      var.tenAvailable = packet['tenAvailable'] == true
      var.resourceRows = packet['resourceRows'] != none ? packet['resourceRows'] : {}
      var.itemJsons = packet['itemJsons'] != none ? packet['itemJsons'] : {}
      var.itemNames = packet['itemNames'] != none ? packet['itemNames'] : {}
      var.itemRarities = packet['itemRarities'] != none ? packet['itemRarities'] : {}
      var.itemCount = packet['itemCount'] != none ? packet['itemCount'] : 0
      // 奖池预览网格: 刷新物品图标，缺失槽位用空气清图标
      for(i in range(1, 46)){
        key = i.round()
        e = val.奖励网格['奖励卡片' + key]
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      // 开箱动画滚动条: 用奖池物品填充滚动条卡片
      for(i in range(1, 25)){
        key = i.round()
        e = val.动画卡片带['动画卡片' + key]
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      // 消耗区与资源栏: 刷新图标
      for(i in range(0, 4)){
        key = i.round()
        e = val.消耗区['消耗条目' + key]
        if(e != none){
          e['图标'].seticon()
        }
        r = val.资源栏['资源条目' + key]
        if(r != none){
          r['图标'].seticon()
        }
      }
    # packetHandler: update
    # 包字段与 init 完全相同，用于切换奖池、抽奖结束后刷新界面数据。
    # 额外职责: 若处于等待态但本次没有结果包（抽奖失败），解除等待态并回到主面板。
    update: |-
      var.packetId = packet['packetId']
      var.poolName = packet['poolName']
      var.poolDescription = packet['poolDescription']
      var.poolList = packet['poolList'] != none ? packet['poolList'] : {}
      var.currentPoolIndex = packet['currentPoolIndex'] != none ? packet['currentPoolIndex'] : 0
      var.actionToken = packet['action_token']
      var.costRows = packet['costRows'] != none ? packet['costRows'] : {}
      var.costTenRows = packet['costTenRows'] != none ? packet['costTenRows'] : {}
      var.tenAvailable = packet['tenAvailable'] == true
      var.resourceRows = packet['resourceRows'] != none ? packet['resourceRows'] : {}
      var.itemJsons = packet['itemJsons'] != none ? packet['itemJsons'] : {}
      var.itemNames = packet['itemNames'] != none ? packet['itemNames'] : {}
      var.itemRarities = packet['itemRarities'] != none ? packet['itemRarities'] : {}
      var.itemCount = packet['itemCount'] != none ? packet['itemCount'] : 0
      for(i in range(1, 46)){
        key = i.round()
        e = val.奖励网格['奖励卡片' + key]
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      for(i in range(1, 25)){
        key = i.round()
        e = val.动画卡片带['动画卡片' + key]
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      for(i in range(0, 4)){
        key = i.round()
        e = val.消耗区['消耗条目' + key]
        if(e != none){
          e['图标'].seticon()
        }
        r = val.资源栏['资源条目' + key]
        if(r != none){
          r['图标'].seticon()
        }
      }
      // 抽奖失败时服务端只回 update: 解除等待态，避免界面永久停在开箱动画
      if(var.rolling != none && var.rolling == true && var.resultPending != none && var.resultPending != true){
        var.rolling = false
        var.spinV = 0
        val.开箱动画层.visible = false
        val.主面板.visible = true
      }
    # packetHandler: result（单抽结果，服务端仅在确实抽到物品时下发）
    # 包字段:
    #   - resultCount: 结果数量
    #   - resultItemJson: 中奖物品 itemJson
    #   - resultItemName: 中奖物品名称
    #   - resultRarity: 中奖物品稀有度
    result: |-
      var.resultCount = packet['resultCount'] != none ? packet['resultCount'] : 0
      var.resultItemJson = packet['resultItemJson']
      var.resultItemName = packet['resultItemName']
      var.resultRarity = packet['resultRarity']
      var.resultPending = true
      val.单抽结果卡片['物品槽'].seticon()
      // 结果已到达: 滚动条减速到目标位置，动画时长结束后揭晓
      var.spinTarget = 0.82 + math.random() * 0.04
      async {
        Thread.sleep(var.spinMs)
        val.开箱动画层.visible = false
        val.单抽结果层.visible = true
        var.rolling = false
        var.resultPending = false
      }
    # packetHandler: batch_result（十连结果）
    # 包字段:
    #   - batchCount: 实际结果数量
    #   - batchRequested: 请求数量
    #   - batchItemJsons / batchItemNames / batchItemRarities: 结果映射（key 为 "1" 起的数字字符串）
    batch_result: |-
      var.batchCount = packet['batchCount'] != none ? packet['batchCount'] : 0
      var.batchRequested = packet['batchRequested'] != none ? packet['batchRequested'] : 0
      var.batchItemJsons = packet['batchItemJsons'] != none ? packet['batchItemJsons'] : {}
      var.batchItemNames = packet['batchItemNames'] != none ? packet['batchItemNames'] : {}
      var.batchItemRarities = packet['batchItemRarities'] != none ? packet['batchItemRarities'] : {}
      var.resultPending = true
      for(i in range(1, 11)){
        key = i.round()
        e = val.十连网格['十连卡片' + key]
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      var.spinTarget = 0.82 + math.random() * 0.04
      async {
        Thread.sleep(var.spinMs)
        val.开箱动画层.visible = false
        val.十连结果层.visible = true
        var.rolling = false
        var.resultPending = false
      }
    # packetHandler: history（开箱历史）
    # 包字段:
    #   - historyPoolName: 奖池名称
    #   - historyCount: 记录条数
    #   - historyRows: 记录行（每行含 openTime/itemId/rarity/timeText/summary，界面只用 timeText 与 summary）
    history: |-
      var.historyPoolName = packet['historyPoolName']
      var.historyCount = packet['historyCount'] != none ? packet['historyCount'] : 0
      var.historyRows = packet['historyRows'] != none ? packet['historyRows'] : {}
      val.历史面板.visible = true
    # packetHandler: details（奖池详情）
    # 包字段:
    #   - detailPoolName: 奖池名称
    #   - detailCount: 条目数
    #   - detailRows: 条目行（每行含 name/rarity/weight）
    details: |-
      var.detailPoolName = packet['detailPoolName']
      var.detailCount = packet['detailCount'] != none ? packet['detailCount'] : 0
      var.detailRows = packet['detailRows'] != none ? packet['detailRows'] : {}
      val.详情面板.visible = true
  action:
    # load 事件: 初始化稀有度颜色表与界面状态变量
    load: |-
      var.rarityColors = {}
      var.rarityColors['COMMON']    = '192,195,198,255'  # 普通 - 灰色
      var.rarityColors['UNCOMMON']  = '176,195,217,255'  # 不凡 - 浅蓝灰
      var.rarityColors['RARE']      = '94,152,217,255'   # 稀有 - 蓝色
      var.rarityColors['EPIC']      = '136,71,255,255'   # 史诗 - 紫色
      var.rarityColors['LEGENDARY'] = '235,75,75,255'    # 传说 - 红色
      var.rarityColors['MYTHIC']    = '255,215,0,255'    # 神话 - 金色
      var.rarityColors['SPECIAL']   = '255,180,0,255'    # 特殊 - 亮金色
      var.rarityColors[none] = '128,128,128,255'         # 默认 - 中灰色
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.spinMs = 2600      # 开箱动画时长（毫秒），结果包到达后再等这么久揭晓
      var.spinV = 0          # 滚动条当前速度系数
      var.spinTarget = 0.85  # 滚动条停止位置比例
      var.rolling = false        # 是否正在开箱（防连点）
      var.resultPending = false  # 本次开箱是否已收到结果包
    # open 事件: 每次打开界面复位所有层
    open: |-
      var.rolling = false
      var.resultPending = false
      var.spinV = 0
      val.主面板.visible = true
      val.开箱动画层.visible = false
      val.单抽结果层.visible = false
      val.十连结果层.visible = false
      val.历史面板.visible = false
      val.详情面板.visible = false
    # tick 事件: 只在开箱过程中推进动画滚动条，减速并停在目标位置
    tick: |-
      if(var.rolling != none && var.rolling == true && val.开箱滚动条 != none){
        if(var.spinV != none && var.spinV < 1 && val.开箱滚动条.moveX < 0.8){
          var.spinV = math.max(var.spinV, 0.5)  # 最低速度保底
        }
        if(var.spinTarget != none && val.开箱滚动条.moveX < var.spinTarget){
          val.开箱滚动条.moveX = val.开箱滚动条.moveX + (0.0003 * var.spinV)  # 持续滚动
        } elif(val.开箱滚动条.moveX >= var.spinTarget){
          val.开箱滚动条.moveX = var.spinTarget  # 停在目标位置
          var.spinV = 0
        }
      }
  defaultOpen: true  # 界面打开时自动触发 open 事件

# ─── 控件树（书写顺序即叠层顺序，弹层写在最后）────────────────────
controls:
  自适应根:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      # 背景遮罩: 全屏半透明黑底
      背景遮罩:
        type: Texture
        attribute:
          point: ~stretch_all
          normal: ~0,0,0,200

      # 主面板: 奖池信息 + 奖励预览 + 操作栏
      主面板:
        type: Canvas
        val: 主面板
        attribute:
          point: ~middle_center
          width: 1560
          height: 900
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~24,24,32,235
              shape: ~round_rect
              radius: 12
            effect:
              stroke:
                width: 2
                color: ~226,196,132,220

          # 标题栏: 奖池名称/描述、翻页、资源栏、关闭
          标题栏:
            type: Canvas
            attribute:
              point: ~horizontal_stretch_top
              height: 96
            children:
              标题栏背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~250,250,254,245
                  shape: ~round_rect
                  radius: 12
              奖池名称:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 14
                  texts: "var.poolName != none ? var.poolName : ''"
                  fontSize: 66
              奖池描述:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 60
                  texts: "'&8' + (var.poolDescription != none ? var.poolDescription : '')"
                  fontSize: 30
              # 资源栏: 当前奖池涉及的资源余额，最多 4 项
              资源栏:
                type: HStack
                val: 资源栏
                attribute:
                  point: ~middle_right
                  x: -200
                  spaceBetween: 20
                action:
                  create: |-
                    for(i in range(0, 4)){
                      key = i.round()
                      e = self['资源条目'].copy('资源条目' + key)
                      e.entryKey = key
                      e['图标'].entryKey = key
                      e['名称'].entryKey = key
                    }
                children:
                  资源条目:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      width: 150
                      height: 66
                      visible: "var.resourceRows != none && var.resourceRows[self.entryKey] != none"
                    children:
                      图标:
                        type: Slot
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          slotType: ~Icon
                          width: 44
                          height: 44
                          normal: ~0,0,0,0
                          seticon: "self.setItemIcon(var.resourceRows != none && var.resourceRows[self.entryKey] != none && var.resourceRows[self.entryKey]['icon'] != none && var.resourceRows[self.entryKey]['icon'] != '' ? var.resourceRows[self.entryKey]['icon'] : var.air)"
                      名称:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 48
                          y: -12
                          texts: "var.resourceRows != none && var.resourceRows[self.entryKey] != none ? '&8' + (var.resourceRows[self.entryKey]['displayName'] != none ? var.resourceRows[self.entryKey]['displayName'] : '') : ''"
                          fontSize: 30
                      余额:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 48
                          y: 12
                          texts: "var.resourceRows == none || var.resourceRows[self.entryKey] == none || var.resourceRows[self.entryKey]['owned'] == none ? '' : (var.resourceRows[self.entryKey]['owned'] < 0 ? '&8—' : '&0' + (var.resourceRows[self.entryKey]['owned'] != none ? var.resourceRows[self.entryKey]['owned'] : 0))"
                          fontSize: 34
              上一页:
                type: Texture
                attribute:
                  point: ~middle_right
                  x: -156
                  width: 44
                  height: 44
                  normal: ~226,196,132,220
                  hover: ~78,82,104,240
                  shape: ~round_rect
                  radius: 6
                  visible: "var.currentPoolIndex != none && var.currentPoolIndex > 0"
                  texts: "~<"
                  center: true
                  fontSize: 34
                action:
                  click: "Packet.send(var.packetId, 'switch_pool', var.currentPoolIndex - 1, var.actionToken)"
              页码:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -110
                  texts: "'&8' + ((var.currentPoolIndex != none ? var.currentPoolIndex : 0) + 1) + '/' + (var.poolList != none ? var.poolList.size() : 0)"
                  fontSize: 30
              下一页:
                type: Texture
                attribute:
                  point: ~middle_right
                  x: -64
                  width: 44
                  height: 44
                  normal: ~226,196,132,220
                  hover: ~78,82,104,240
                  shape: ~round_rect
                  radius: 6
                  visible: "var.currentPoolIndex != none && var.poolList != none && var.currentPoolIndex < var.poolList.size() - 1"
                  texts: "~>"
                  center: true
                  fontSize: 34
                action:
                  click: "Packet.send(var.packetId, 'switch_pool', (var.currentPoolIndex != none ? var.currentPoolIndex : 0) + 1, var.actionToken)"
              关闭按钮:
                type: Texture
                attribute:
                  point: ~middle_right
                  x: -16
                  width: 44
                  height: 44
                  normal: ~120,52,58,230
                  hover: ~150,66,72,245
                  shape: ~round_rect
                  radius: 6
                  texts: "~X"
                  center: true
                  fontSize: 34
                action:
                  click: Screen.close()
          # 预览区: 该奖池可能开出的物品，9 列网格 + 纵向滑块
          预览区:
            type: Canvas
            attribute:
              point: ~top_center
              y: 120
              width: 1500
              height: 620
            children:
              区块标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 12
                  texts:
                    - ~这个箱子可能开出以下物品
                  fontSize: 44
              分界线:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 12
                  y: 44
                  width: 1470
                  height: 4
                  normal: ~226,196,132,220
                  shape: ~round_rect
                  radius: 4
              纵向滑块:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -4
                  y: 64
                  width: 10
                  height: 60
                  normal: ~226,196,132,255
                  maxDragY: 520 - 60
                  dragY: 0
                  shape: ~round_rect
                  radius: 4
              滚动视口:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 12
                  y: 64
                  width: 1440
                  height: 520
                  moveY: self.parent['纵向滑块'].getDragYRatio()
                  through: false
                action:
                  wheel: |-
                    if(self.moveY >= 0){
                      if(self.wheelValue > 0){
                        self.parent['纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                      }
                    }
                    if(self.moveY <= 1){
                      if(self.wheelValue < 0){
                        self.parent['纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                      }
                    }
                children:
                  奖励网格:
                    type: HGrid
                    val: 奖励网格
                    attribute:
                      column: 9
                      spaceBetweenX: 16
                      spaceBetweenY: 16
                    action:
                      create: |-
                        for(i in range(1, 46)){
                          key = i.round()
                          e = self['奖励卡片'].copy('奖励卡片' + key)
                          e.entryKey = key
                          e['卡片底'].entryKey = key
                          e['稀有度条'].entryKey = key
                          e['物品槽'].entryKey = key
                          e['物品名'].entryKey = key
                        }
                    children:
                      奖励卡片:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          width: 148
                          height: 148
                          visible: "var.itemJsons != none && var.itemJsons[self.entryKey] != none && var.itemJsons[self.entryKey] != ''"
                        children:
                          卡片底:
                            type: Texture
                            attribute:
                              entryKey: 0.round()
                              point: ~stretch_all
                              normal: ~250,250,254,245
                              shape: ~round_rect
                              radius: 8
                            effect:
                              stroke:
                                width: 1
                                color: "{var.rarityColors != none && var.itemRarities != none && var.rarityColors[var.itemRarities[self.entryKey]] != none ? var.rarityColors[var.itemRarities[self.entryKey]] : '128,128,128,255'}"
                          稀有度条:
                            type: Texture
                            attribute:
                              entryKey: 0.round()
                              point: ~horizontal_stretch_bottom
                              height: 4
                              normal: "{var.rarityColors != none && var.itemRarities != none && var.rarityColors[var.itemRarities[self.entryKey]] != none ? var.rarityColors[var.itemRarities[self.entryKey]] : '128,128,128,255'}"
                              shape: ~round_rect
                              radius: 4
                          物品槽:
                            type: Slot
                            attribute:
                              entryKey: 0.round()
                              point: ~top_center
                              y: 10
                              slotType: ~Icon
                              width: 88
                              height: 88
                              normal: ~0,0,0,0
                              seticon: "self.setItemIcon(var.itemJsons != none && var.itemJsons[self.entryKey] != none && var.itemJsons[self.entryKey] != '' ? var.itemJsons[self.entryKey] : var.air)"
                          物品名:
                            type: Text
                            attribute:
                              entryKey: 0.round()
                              point: ~bottom_center
                              y: 12
                              texts: "var.itemNames != none && var.itemNames[self.entryKey] != none ? '&0' + (var.itemNames[self.entryKey] != none ? var.itemNames[self.entryKey] : '') : ''"
                              fontSize: 30

          # 操作栏: 消耗提示 + 开箱/十连/历史/详情
          操作栏:
            type: Canvas
            attribute:
              point: ~horizontal_stretch_bottom
              height: 120
            children:
              操作栏背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~250,250,254,245
                  shape: ~round_rect
                  radius: 12
