                            color: 'self.parent.isHovered() ? ''175,147,97,255'' : ''151,138,112,150'''
                      物品图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 0.72
                          x: 15
                          y: 12
                          width: 96
                          height: 96
                          normal: ~242,237,223,255
                          shape: ~round_rect
                          radius: 12
                          seticon: 'self.setItemIcon(var.itemJsons[self.parent.entryKey] != none ? var.itemJsons[self.parent.entryKey] : var.emptyItemJson)'
                          hover: ~224,216,190,255
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,230
                      物品名称:
                        type: Text
                        attribute:
                          x: 123
                          y: 16
                          texts: '''&0'' + self.parent.entry[''name'']'
                          fontSize: 36
                          through: true
                      数量:
                        type: Text
                        attribute:
                          x: 123
                          y: 52
                          texts: '''&8数量: &0'' + self.parent.entry[''amount''].round()'
                          fontSize: 36
                          through: true
                      单价:
                        type: Text
                        attribute:
                          x: 123
                          y: 88
                          texts: '''&8单价: &2'' + self.parent.entry[''unitPrice''] + '' &8'' + self.parent.entry[''currencyName'']'
                          fontSize: 36
                          through: true
                      总价:
                        type: Text
                        attribute:
                          x: 123
                          y: 124
                          texts: '''&2总价: &0'' + self.parent.entry[''totalPrice''] + '' &8'' + self.parent.entry[''currencyName'']'
                          fontSize: 36
                          through: true
                      回收按钮:
                        type: Canvas
                        attribute:
                          x: 15
                          y: 168
                          width: var.cardW - 30
                          height: 40
                          enable: '!var.actionBusy && var.actionToken != '''''
                        action:
                          clickLeft: |-
                            if(!var.actionBusy && var.actionToken != ''){
                              var.actionBusy = true
                              var.actionBusySeconds = 0
                              Packet.send(var.packetId, 'recycle_single', self.parent.entry['slot'].round(), var.actionToken)
                            }
                        children:
                          回收单底:
                            type: Texture
                            attribute:
                              point: ~top_left
                              x: 3
                              y: 0
                              width: var.cardW - 36
                              height: 40
                              through: true
                              normal: '!var.actionBusy && var.actionToken != '''' ? ''35,76,63,255'' : ''105,104,93,220'''
                              shape: ~round_rect
                              radius: 10
                            effect:
                              ripple: null
                              stroke:
                                width: 1
                                color: 'self.parent.isHovered() ? ''175,147,97,255'' : ''151,138,112,150'''
                          回收单文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: ~&f回收此物品
                              fontSize: 36
                              through: true
