# AXS 资源说明
# 用途: Mail 模块预设邮件示例；管理员可直接批量派发。
# 前置依赖: ArcartX；Mail 模块启用后生效。
# 启用开关: config.yml -> modules.mail.enabled + modules.mail.password
# 关联文件: ArcartXMail.yml
# 重载命令: /axs mail reload
# 最小使用路径: preset.id + /axs mail preset send <presetId> <player|all-online|all-registered>
# 顶层 preset: 是固定配置节名称，不要改成预设 ID；只修改下面的 id 字段。
# 保存文件后执行 /axs mail preset reload，再用 /axs mail preset list 检查已加载的 ID。
# 重载影响后续派发的邮件；已经派发的邮件保留发送时的奖励数据。
#
# item-attachments 物品来源（source）支持：
#   minecraft  — 原版物品（id 为材质名，如 APPLE/DIAMOND）
#   mythic     — MythicMobs 物品（id 为 MythicMobs 内部物品名）
#   neige      — NeigeItems 物品（id 为 NeigeItems 物品 ID）
#   overture   — Overture 物品（id 为 Overture 物品 ID）
#   mmoitems   — MMOItems 物品（id 为 "类型ID;物品ID"，如 "SWORD;LEGENDARY_SWORD"）
# 物品库未安装时该附件会被跳过并在日志打印警告，其余附件正常发放。

preset:
  # 命令和 UI 使用的预设唯一 ID；建议与文件名一致，不要与其他预设重复。
  id: starter
  enabled: true
  display-name: 新手欢迎信
  subject: 欢迎来到服务器
  body: |-
    这是一封 AXS Mail 模块的示例邮件。
    你可以通过 /axs mail preset send starter <player> 进行派发。

  # 邮件默认过期天数。
  expires-after-days: 15

  # 货币附件；可定义多种货币附件。
  # icon 字段可选，与 menu 模块的 icon 配置一致，支持 material / custom-model-data / texture / texture-url / name / lore 等。
  currency-attachments:
    - currency: money
      amount: 88
      description: 新手金币礼包
      icon:
        material: GOLD_INGOT
        name: "&6金币"
      # 示例（资源包自定义贴图）：
      # icon:
      #   material: PAPER
      #   texture: "mail/icon_money"
      #   custom-model-data: 10001

  # 物品附件
  item-attachments:
    - source: minecraft
      id: APPLE
      amount: 8
      name: "§a欢迎苹果"
      lore:
        - "§7来自 AXS Mail 示例预设"

  # 物品库附件示例（取消注释以启用；需服务器安装对应物品库插件）：
  # item-attachments:
  #   - source: minecraft
  #     id: APPLE
  #     amount: 8
  #     name: "§a欢迎苹果"
  #     lore:
  #       - "§7来自 AXS Mail 示例预设"
  #
  #   - source: mythic
  #     id: "MythicStarterSword"
  #     amount: 1
  #
  #   - source: neige
  #     id: "NeigeStarterArmor"
  #     amount: 1
  #
  #   - source: overture
  #     id: "OvertureStarterGem"
  #     amount: 1
  #
  #   - source: mmoitems
  #     id: "SWORD;LEGENDARY_SWORD"
  #     amount: 1

  # 玩家领取邮件时额外执行的命令。
  claim-commands:
    - "tell <player> 你领取了示例邮件奖励。"

  # 领取条件（与 AXS 本体 ScriptCondition 同一套，详见 axs-api/condition/ScriptCondition.java）：
  #   内联:  "%placeholder% <op> <value>"   op ∈ == != >= <= > < contains regex
  #   Aria:  "aria: <expression>"            （global.player.* 门面可用，Suite 自动补 return）
  #   JS:    "js: <script>"
  #   也可写成 Map 列表 / 嵌套配置节: type: papi|aria|js + placeholder/operator/value
  # 例如: "%player_level% >= 10"
  claim-conditions:
    - "%player_level% >= 0"

  # 可选: 随预设同步到数据库的 CDK。
  # 执行 /axs mail reload 后会创建或更新固定 code；已有领取次数不会清零。
  # expires-at 使用 UTC ISO 时间；expires-after/ttl 按 CDK 首次创建时间计算。
  cdks:
    - code: STARTER2026
      enabled: true
      max-claims: 100     #CDK 全局共享的最大领取次数（所有玩家共用，领完即止；每玩家仅可领一次）
      expires-after: 30d  #CDK 本身的过期时长（从 CDK 首次创建时间算起，过期后任何人都无法领取）
      # expires-at: 2026-12-31T23:59:59Z  #可选；绝对过期时刻（UTC ISO 时间），优先级高于 expires-after/ttl
      # ttl: 30d                          #可选；expires-after 的别名，二者填其一即可
