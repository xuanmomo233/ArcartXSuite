name: Abyss checks and package

on:
  workflow_dispatch:
  push:
    branches: [main, 'codex/**']
    paths:
      - 'modules/abyss/**'
      - '.github/workflows/abyss-check.yml'
  pull_request:
    paths:
      - 'modules/abyss/**'
      - '.github/workflows/abyss-check.yml'

permissions:
  contents: read

concurrency:
  group: abyss-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  abyss:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10.2'
          cache-read-only: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install UI check dependency
        run: python -m pip install PyYAML==6.0.2
      - name: Check all bundled UI contracts
        run: python modules/abyss/src/test/ui/verify_abyss_ui.py
      - name: Test and build protected Abyss Jar
        run: gradle :modules:abyss:build -PskipNativeCheck=true --no-daemon --no-configuration-cache
      - name: Summarize test results
        if: always()
        run: |
          python - <<'PY'
          import glob, os, xml.etree.ElementTree as ET
          tests = failures = errors = 0
          for file in glob.glob('modules/abyss/build/test-results/test/TEST-*.xml'):
              suite = ET.parse(file).getroot()
              tests += int(suite.get('tests', 0))
              failures += int(suite.get('failures', 0))
              errors += int(suite.get('errors', 0))
              for issue in suite.findall('.//failure') + suite.findall('.//error'):
                  print((issue.text or '')[:12000])
          summary = f'JUnit: {tests} tests, {failures} failures, {errors} errors'
          print(summary)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as out:
              out.write(summary + '\n')
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: abyss-test-reports
          path: |
            modules/abyss/build/reports/tests/test/
            modules/abyss/build/test-results/test/
          if-no-files-found: warn
      - name: Upload protected Jar and changed map resources
        uses: actions/upload-artifact@v5
        with:
          name: abyss-protected-package
          path: |
            build/ArcartX-Suite/modules/ArcartXSuite-Abyss-*.jar
            modules/abyss/src/main/resources/abysses/example/scripts.yml
            modules/abyss/src/main/resources/room-sets/example/
          if-no-files-found: error
