          # 右侧：刷新按钮 + 关闭
          刷新按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -104
              width: 64
              height: 40
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'refresh')
            children:
              刷新底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,240
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,180,255,255' : '255,255,255,230'"
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 64
                  texts: "~&f刷新"
                  fontSize: 30
                  through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,240
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,180,255,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 40
                  texts: "~&f✕"
                  fontSize: 32
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # 导航：签到
          导航签到:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                var.currentPage = 'signin'
            children:
              签到底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.currentPage == 'signin' ? '90,150,250,240' : '62,66,74,240'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "var.currentPage == 'signin' ? '255,255,255,230' : (self.isHovered() ? '120,180,255,255' : '255,255,255,230')"
              签到高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  through: true
                  normal: ~90,150,250,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.currentPage == 'signin'"
              签到导航文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.currentPage == 'signin' ? '&0签到' : '&f签到'"
                  fontSize: 36
                  through: true
          # 导航：进度
          导航进度:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                var.currentPage = 'progress'
            children:
              进度底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.currentPage == 'progress' ? '90,150,250,240' : '62,66,74,240'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "var.currentPage == 'progress' ? '255,255,255,230' : (self.isHovered() ? '120,180,255,255' : '255,255,255,230')"
              进度高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~90,150,250,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.currentPage == 'progress'"
              进度导航文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.currentPage == 'progress' ? '&0进度' : '&f进度'"
                  fontSize: 36
                  through: true
          # 导航：奖励
          导航奖励:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                var.currentPage = 'rewards'
            children:
              奖励底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.currentPage == 'rewards' ? '90,150,250,240' : '62,66,74,240'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "var.currentPage == 'rewards' ? '255,255,255,230' : (self.isHovered() ? '120,180,255,255' : '255,255,255,230')"
              奖励高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~90,150,250,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.currentPage == 'rewards'"
              奖励导航文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.currentPage == 'rewards' ? '&0奖励' : '&f奖励'"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 232
              width: 264
              height: 2
              normal: ~255,255,255,230
          签到统计区标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 248
              texts: "~&f签到概况"
              fontSize: 30
          连续签到:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 282
              texts: "'&f连续 &e' + var.signInStreak.round(0) + ' &f天'"
              fontSize: 30
          累计签到:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 316
              texts: "'&f累计 &e' + var.signInTotal.round(0) + ' &f天'"
              fontSize: 30
          补签卡数:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 350
              texts: "'&f补签卡 &e' + var.makeupCardCount.round(0) + ' &f张'"
              fontSize: 30
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: "~&fESC 关闭界面"
              fontSize: 28

      # ── 内容区 ──────────────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230

          # ════════ 签到页 ════════
          签到页:
            type: Canvas
            attribute:
              point: ~stretch_all
              visible: "var.currentPage == 'signin'"
            children:
              # ── 左半：签到日历卡片 ──
              签到日历卡片:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 32
                  y: 24
                  width: "var.cardW"
                  height: "var.viewH - 192"
                children:
                  日历卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~62,66,74,240
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  日历卡标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 24
                      texts: "~&f每日签到"
                      fontSize: 40
                  日历月份标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 76
                      texts: "'&f签到日历 &7| &f' + var.calendarMonthText"
                      fontSize: 34
                  # 月份切换按钮
                  上月按钮:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: "var.cardW - 168"
                      y: 78
                      width: 40
                      height: 32
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'calendar_prev')
                    children:
                      上月背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~62,66,74,240
                          shape: ~round_rect
                          radius: 8
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '120,180,255,255' : '255,255,255,230'"
                      上月文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 40
                          texts: "~&f<"
                          fontSize: 48
                          through: true
                  本月按钮:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: "var.cardW - 124"
                      y: 78
                      width: 56
                      height: 32
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'calendar_today')
                    children:
                      本月背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~62,66,74,240
                          shape: ~round_rect
                          radius: 8
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '120,180,255,255' : '255,255,255,230'"
                      本月文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 56
                          texts: "~&f本月"
                          fontSize: 28
                          through: true
                  下月按钮:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: "var.cardW - 64"
                      y: 78
                      width: 40
                      height: 32
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'calendar_next')
                    children:
                      下月背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~62,66,74,240
                          shape: ~round_rect
                          radius: 8
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '120,180,255,255' : '255,255,255,230'"
                      下月文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 40
                          texts: "~&f>"
                          fontSize: 32
                          through: true
                  # 日历网格
                  日历网格:
                    type: HGrid
                    val: 日历网格
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 124
                      width: "var.cardW - 56"
                      height: 380
                      column: 7
                      spaceBetweenX: 6
                      spaceBetweenY: 6
                    children:
                      日历模板:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.calendarRows[self.entryKey]
                          width: 76
                          height: 56
                          visible: self.entry != none
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'preview_day', self.entry['date'])
                        children:
                          日历背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.entry == none ? '255,255,255,0' : (self.parent.entry['status'] == 'signed' ? '124,196,142,230' : (self.parent.entry['status'] == 'expired' ? '210,120,120,230' : (self.parent.entry['status'] == 'future' ? '62,66,74,240' : '90,150,250,230')))"
                              shape: ~round_rect
                              radius: 8
                            effect:
                              stroke:
                                width: 3
                                color: "self.parent.entry == none ? '255,255,255,0' : (self.parent.entry['date'] == var.selectedDateText ? '120,180,255,255' : '255,255,255,230')"
                          日历文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 76
                              texts: "self.parent.entry == none ? none : ('&f' + self.parent.entry['label'])"
                              fontSize: 32
                              through: true
                          日历今:
                            type: Text
                            attribute:
                              point: ~top_right
                              x: -4
                              y: 4
                              through: true
                              visible: "self.parent.entry != none && self.parent.entry['today']"
                              texts: "~&e今"
                              fontSize: 20
                  # 本月签到统计
                  统计分隔线:
                    type: Texture
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 524
                      width: "var.cardW - 56"
                      height: 2
                      normal: ~255,255,255,230
                  统计标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 540
                      texts: "~&f本月签到统计"
                      fontSize: 34
                  已签到统计:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 580
                      texts: "'&f已签到 &a' + var.calendarSignedCount + ' &f/ &7' + var.calendarCount.round(0) + ' &f天'"
                      fontSize: 30
                  签到进度:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 614
                      texts: "'&f签到进度 &a' + var.calendarRate + '%'"
                      fontSize: 30

              # ── 右半：选中日期预览卡片 ──
              选中日期卡片:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "64 + var.cardW"
                  y: 24
                  width: "var.cardW"
                  height: "var.viewH - 192"
                children:
                  选中卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~62,66,74,240
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  选中卡标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 24
                      texts: "~&f选中日期"
                      fontSize: 40
                  选中日期文本:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 70
                      texts: "'&f' + var.selectedDateText"
                      fontSize: 34
                  # 签到/补签操作按钮
                  操作按钮:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 112
                      width: 280
                      height: 56
                      enable: "!var.actionBusy && var.selectedActionEnabled && var.actionToken != ''"
                    action:
                      clickLeft: |-
                        if(var.selectedAction == 'signin'){
                          var.actionBusy = true
                          Packet.send(var.packetId, 'signin', var.actionToken)
                        }elif(var.selectedAction == 'makeup'){
                          var.actionBusy = true
                          Packet.send(var.packetId, 'makeup', var.selectedDateText, var.actionToken)
                        }
                    children:
                      操作按钮底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "var.selectedActionEnabled ? '90,150,250,235' : '62,66,74,240'"
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 3
                            color: "var.selectedActionEnabled ? (self.isHovered() ? '120,180,255,255' : '90,150,250,230') : '255,255,255,230'"
                      操作按钮文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 280
                          texts: "var.selectedActionEnabled ? '&0' + var.selectedActionText : '&7' + var.selectedActionText"
                          fontSize: 34
                          through: true
                  # 选中日期奖励列表
                  选中奖励标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 188
                      texts: "~&f当日奖励预览"
                      fontSize: 34
                  选中奖励空提示:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 228
                      visible: "var.selectedRewardRows.size() == 0"
                      texts: "~&7该日期暂无奖励预览"
                      fontSize: 30
                  选中奖励滑轨:
                    type: Texture
                    attribute:
                      point: ~top_right
                      x: -16
                      y: 228
                      width: 12
                      height: "var.viewH - 446"
                      normal: ~15,25,38,220
                      shape: ~round_rect
                      radius: 6
                    effect:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  选中奖励滑块:
                    type: Texture
                    val: 选中奖励滑块
                    attribute:
                      point: ~top_right
                      x: -16
                      y: 228
                      width: 12
                      height: 60
                      normal: ~50,170,200,220
                      maxDragY: "var.viewH - 506"
                      shape: ~round_rect
                      radius: 6
                  选中奖励滚动区:
                    type: Scroll
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 228
                      width: "var.cardW - 54"
                      height: "var.viewH - 446"
                      moveY: "self.parent['选中奖励滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['选中奖励滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['选中奖励滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      选中奖励堆叠:
                        val: 选中奖励堆叠
                        type: VStack
                        attribute:
                          width: "var.cardW - 62"
                          spaceBetween: 8
                        children:
                          选中奖励项:
                            type: Texture
                            attribute:
                              entryKey: 0.round()
                              entry: var.selectedRewardRows[self.entryKey]
                              width: "var.cardW - 62"
                              height: 64
                              normal: ~62,66,74,240
                              shape: ~round_rect
                              radius: 10
                              visible: self.entry != none
                            effect:
                              stroke:
                                width: 3
                                color: ~255,255,255,230
                            children:
                              选中奖励名称:
                                type: Text
                                attribute:
                                  point: ~top_left
                                  x: 14
                                  y: 8
                                  texts: "self.parent.entry != none ? '&f' + self.parent.entry['title'] : none"
                                  fontSize: 30
                              选中奖励条件:
                                type: Text
                                attribute:
                                  point: ~top_left
                                  x: 14
                                  y: 36
                                  texts: "self.parent.entry != none ? '&7' + self.parent.entry['trigger'] : none"
                                  fontSize: 26

          # ════════ 进度页 ════════
          进度页:
            type: Canvas
            attribute:
              point: ~stretch_all
              visible: "var.currentPage == 'progress'"
            children:
              # ── 在线时长统计卡片 ──
              在线时长卡片:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 32
                  y: 24
                  width: "var.contentW - 64"
                  height: 280
                children:
                  时长卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~62,66,74,240
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  时长卡标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 24
                      texts: "~&f在线时长统计"
                      fontSize: 40
                  今日在线:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 80
                      texts: "'&f今日在线   &e' + var.dailyTimeText"
                      fontSize: 34
                  本周在线:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 120
                      texts: "'&f本周在线   &e' + var.weeklyTimeText"
                      fontSize: 34
                  本月在线:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 160
                      texts: "'&f本月在线   &e' + var.monthlyTimeText"
                      fontSize: 34
                  总计在线:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 200
                      texts: "'&f总计在线   &e' + var.totalTimeText"
                      fontSize: 34
                  离线储蓄:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 240
                      visible: "var.offlineSavingsText != '0分钟'"
                      texts: "'&f离线储蓄   &e' + var.offlineSavingsText"
                      fontSize: 34

              # ── 阶段进度卡片 ──
              阶段进度卡片:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 32
                  y: 320
