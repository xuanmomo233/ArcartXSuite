  build-modules-encrypted:
    runs-on: ubuntu-latest
    needs: [detect-changes, gen-keys]
    if: needs.detect-changes.outputs.module_changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography
        run: pip install cryptography

      - uses: actions/download-artifact@v5
        with:
          name: protect-material
          path: protect-material

      - name: Restore keys (含 canonical root_seed.bin / ed25519 私钥)
        run: cp -r protect-material/keys keys

      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-read-only: true

      - name: Encrypt changed modules per-class (-Paxs.protectModules)
        run: |
          set -euo pipefail
          CHANGED='${{ needs.detect-changes.outputs.changed_modules }}'
          echo "变更模块: $CHANGED"
          TASKS=""
          for module in $(echo "$CHANGED" | jq -r '.[]'); do
            TASKS="$TASKS :modules:$module:encryptModuleAxb"
          done
          if [ -z "$TASKS" ]; then
            echo "没有需要构建的模块"; exit 0
          fi
          echo "Gradle tasks:$TASKS"
          # -Paxs.protectModules：逐类 AES-GCM/ChaCha20 加密（与本体同一 canonical root_seed）
          #   encryptModuleClasses 内部以 --no-native 调 encrypt-jar.py，复用 keys/ 里的 root_seed，
          #   不需要本体 native 库；任务链 jar→obfuscate→stringEncrypt→encryptClasses→axb 可独立运行。
          bash ./gradlew $TASKS -Paxs.protectModules -PskipNativeCheck=true --no-build-cache --parallel
          echo "=== 生成的 .axb ==="
          ls -la build/ArcartX-Suite/module-axb/ || echo "DIR NOT FOUND"

      - name: Verify protected Abyss journal schema
        if: contains(fromJSON(needs.detect-changes.outputs.changed_modules), 'abyss')
        run: python3 modules/abyss/src/test/protection/verify_journal_mapping.py

      - name: Upload encrypted modules (.axb) to cloud
        if: inputs.skip_upload != true
        env:
          CLOUD_CI_TOKEN: ${{ secrets.CLOUD_CI_TOKEN }}
          FLARE_BASE_URL: ${{ vars.FLARE_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_CI_TOKEN:-}" ]; then
            echo "SKIP: CLOUD_CI_TOKEN 未配置，跳过模块 .axb 上传"
            exit 0
          fi
          AXB_DIR="build/ArcartX-Suite/module-axb"
          if [ ! -d "$AXB_DIR" ]; then
            echo "ERROR: 未找到 .axb 目录 $AXB_DIR"; exit 1
          fi
          # 模块版本与本体统一为 <ver>-ci.<短sha>：ver 取自 gradle.properties（与本体同源）。
          BASEVER=$(grep -E '^version=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$BASEVER" ]; then
            echo "ERROR: 无法从 gradle.properties 读取 version"; exit 1
          fi
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${BASEVER}-ci.${SHORT_SHA}"
          CHANGED='${{ needs.detect-changes.outputs.changed_modules }}'
          for module in $(echo "$CHANGED" | jq -r '.[]'); do
            meta="$AXB_DIR/${module}.meta.json"
            axb="$AXB_DIR/${module}.axb"
            if [ ! -f "$meta" ] || [ ! -f "$axb" ]; then
              echo "WARN: $module 的 axb 或 meta 缺失，跳过"
              continue
            fi
            key=$(jq -r '.moduleKey' "$meta")
            iv=$(jq -r '.moduleIv' "$meta")
            version="$VERSION"
            echo "Uploading $module ($version) ..."
            FLARE_BASE_URL="${FLARE_BASE_URL:-https://flare.021209.xyz}"
            PRIMARY_OK=0
            FLARE_OK=0
            # ── 主云 ──
            RESP=$(mktemp)
            set +e
            curl -fS --http1.1 --connect-timeout 10 --retry 3 --retry-delay 3 --retry-all-errors --retry-max-time 90 --max-time 120 \
              -o "$RESP" \
              -F "axb=@$axb" \
              -F "version=$version" \
              -F "key=$key" \
              -F "iv=$iv" \
              -F "setCurrent=true" \
              -H "X-CI-Token: $CLOUD_CI_TOKEN" \
              "https://cloud.021209.xyz/v1/ci/modules/$module/versions"
            CURL_EXIT=$?
            set -e
            echo ""
            if [ $CURL_EXIT -eq 0 ]; then
              PRIMARY_OK=1
              cat "$RESP"; echo ""
              echo "OK: $module 已上传主云（setCurrent=true）"
            else
              echo "WARN: 主云模块 $module 上传失败 (curl exit=$CURL_EXIT)"
              [ -s "$RESP" ] && cat "$RESP" || true
            fi
            rm -f "$RESP"
            if [ "$PRIMARY_OK" -eq 1 ]; then
              echo "主云已接收 $module，FlareCloud 由主云复制任务同步"
              continue
            fi
            # 主云上传失败时才尝试直接写入处于接管状态的 FlareCloud。
            RESP_FLARE=$(mktemp)
            set +e
            curl -fS --http1.1 --retry 5 --retry-delay 5 --retry-all-errors --retry-max-time 300 --max-time 300 \
              -o "$RESP_FLARE" \
              -F "axb=@$axb" \
              -F "version=$version" \
              -F "key=$key" \
              -F "iv=$iv" \
              -F "setCurrent=true" \
              -H "X-CI-Token: $CLOUD_CI_TOKEN" \
              "${FLARE_BASE_URL}/v1/ci/modules/$module/versions"
            FLARE_EXIT=$?
            set -e
            echo ""
            if [ $FLARE_EXIT -eq 0 ]; then
              FLARE_OK=1
              cat "$RESP_FLARE"; echo ""
              echo "OK: module $module mirrored to FlareCloud"
            else
              echo "WARN: FlareCloud module $module upload failed (exit=$FLARE_EXIT)"
              [ -s "$RESP_FLARE" ] && cat "$RESP_FLARE" || true
            fi
            rm -f "$RESP_FLARE"
            if [ $PRIMARY_OK -eq 0 ] && [ $FLARE_OK -eq 0 ]; then
              echo "ERROR: 模块 $module 主云与 FlareCloud 均上传失败"
              exit 1
            fi
            echo "DONE: module $module (primary=$PRIMARY_OK flare=$FLARE_OK)"
          done

      - name: Upload ProGuard mappings (modules)
        uses: actions/upload-artifact@v5
        with:
          name: axs-modules-proguard-mapping
          path: build/ArcartX-Suite/modules-obf/*-proguard-mapping.txt
          if-no-files-found: warn
          retention-days: 1
