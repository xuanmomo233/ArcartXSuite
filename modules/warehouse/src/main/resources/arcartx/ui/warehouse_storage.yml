                  x: 32
                  texts: "var.ownerType == 'personal' ? (var.canUpgrade ? '&e+1格 ' + var.slotPriceText : '&f槽位已满') : ('&fLv.&e' + var.level.round())"
                  fontSize: 36
                  through: true
              等级状态:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -16
                  texts: "'&f' + var.capacityText + ' 格'"
                  fontSize: 36
                  through: true
          解锁行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 176
              width: 272
              height: 48
            children:
              解锁底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~100,110,120,220
              解锁圆点:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 14
                  width: 10
                  height: 10
                  normal: "var.readOnly ? '235,100,100,255' : (!var.hasPassword ? '235,160,60,255' : (var.unlocked ? '160,170,180,255' : '196,200,208,255'))"
                  shape: ~circle
              解锁文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 32
                  texts: "var.readOnly ? '&c只读 ' + var.lockOwner : (!var.hasPassword ? '&e未设置密码' : (var.unlocked ? '&e密码已解锁' : '&f密码未解锁'))"
                  fontSize: 36
          仓库列表分隔:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 240
              width: 264
              height: 2
              normal: ~100,110,120,220
          仓库列表标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 256
              texts: "~&f我的仓库"
              fontSize: 36
          仓库滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -12
              y: 304
              width: 10
              height: "var.viewH - 482"
              normal: ~40,44,52,225
              shape: ~round_rect
              radius: 5
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          仓库滑块:
            type: Texture
            val: 仓库滑块
            attribute:
              point: ~top_right
              x: -12
              y: 304
              width: 10
              height: 50
              normal: ~180,190,200,255
              maxDragY: "var.viewH - 532"
              shape: ~round_rect
              radius: 5
          仓库滚动:
            type: Scroll
            val: 仓库滚动
            attribute:
              point: ~top_left
              x: 14
              y: 304
              width: 258
              height: "var.viewH - 482"
              moveY: "self.parent['仓库滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              仓库列容器:
                type: VStack
                attribute:
                  width: 258
                  spaceBetween: 8
                children:
                  个人仓库列表:
                    type: VStack
                    val: 个人仓库列表
                    attribute:
                      width: 258
                      spaceBetween: 8
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.personalWarehouses[self.entryKey]
                          visible: self.entry != none
                          width: 258
                          height: 48
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'warehouse', self.entry['id'])
                        children:
                          项底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "var.ownerType == 'personal' && self.parent.entry != none && self.parent.entry['id'] == var.warehouseId ? '64,72,82,225' : '44,50,58,245'"
                              shape: ~round_rect
                              radius: 12
                            effect:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '220,230,240,255' : (var.ownerType == 'personal' && self.parent.entry != none && self.parent.entry['id'] == var.warehouseId ? '255,255,255,255' : '100,110,120,220')"
                          项字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "'&f' + var.personalWarehouseTexts[self.parent.entryKey]"
                              fontSize: 36
                              through: true
                  共享仓库列表:
                    type: VStack
                    val: 共享仓库列表
                    attribute:
                      width: 258
                      spaceBetween: 8
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.sharedWarehouses[self.entryKey]
                          visible: self.entry != none
                          width: 258
                          height: 48
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'shared', self.entry['id'])
                        children:
                          项底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "var.ownerType == 'shared' && self.parent.entry != none && self.parent.entry['id'] == var.ownerId ? '64,72,82,225' : '44,50,58,245'"
                              shape: ~round_rect
                              radius: 12
                            effect:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '220,230,240,255' : (var.ownerType == 'shared' && self.parent.entry != none && self.parent.entry['id'] == var.ownerId ? '255,255,255,255' : '100,110,120,220')"
                          项字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "'&f' + var.sharedWarehouseStorageTexts[self.parent.entryKey]"
                              fontSize: 36
                              through: true
