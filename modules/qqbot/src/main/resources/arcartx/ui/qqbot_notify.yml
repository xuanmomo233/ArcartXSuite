# QQBot / 群消息快讯 — 右上角消息带、纸色时标、8 秒消退，不接收输入
ui:
  isHud: true
  defaultOpen: true
  through: true
  escClose: false
  closeDied: false
  show: true
  level: 50
  screenScale: true
  packetHandler:
    notify: |-
      var.notifications.add({'nick': packet['nick'], 'msg': packet['msg'], 'time': packet['time'], 'alpha': 1.0, 'born': Time.now()})
      var.maxDisplay = packet['maxDisplay']
      var.showCount = var.notifications.size()
  action:
    load: |-
      var.notifications = []
      var.showCount = 0
      var.displayDuration = 8000
      var.maxDisplay = 4
    tick: |-
      if(var.notifications.size() > 0){
        var.now = Time.now()
        var.toRemove = []
        // ARIA range 包含结束值；只访问真实条目。
        for(i in range(0, var.notifications.size() - 1)){
          var.item = var.notifications.get(i.round())
          var.elapsed = var.now - var.item['born']
          if(var.elapsed > var.displayDuration){
            var.toRemove.add(i.round())
          }elif(var.elapsed > var.displayDuration - 1000){
            var.item['alpha'] = (var.displayDuration - var.elapsed) / 1000.0
          }
        }
        for(i in var.toRemove.reverse()){
          var.notifications.remove(i)
        }
        var.showCount = var.notifications.size()
      }
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_right
      width: 1920
      height: 1080
      through: true
    children:
      通知容器:
        type: Canvas
        attribute:
          point: ~top_right
          x: -24
          y: 96
          width: 384
          height: 440
          visible: var.showCount > 0
          through: true
        children:
          通知列表:
            val: notifyList
            type: VStack
            attribute:
              width: 384
              spaceBetween: 8
              through: true
            action:
              create: |-
                for(i in range(1, 3)){
                  row = self.get(0).copy('通知_' + i.round())
                  row.entryKey = i.round()
                }
            children:
              通知条目:
                type: Canvas
                attribute:
                  entryKey: 0.round()
                  # 只展示最近的 maxDisplay 条，保留原始缓存与 8 秒生命周期。
                  entry: "var.notifications.get((math.max(0, var.showCount - var.maxDisplay) + self.entryKey).round())"
                  visible: "self.entry != none && self.entryKey < var.maxDisplay"
                  width: 384
                  height: 104
                  through: true
                children:
                  通知底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~38,29,47,240
                      shape: ~round_rect
                      radius: 8
                      alpha: self.parent.entry['alpha']
                      through: true
                  连接强调:
                    type: Texture
                    attribute:
                      x: 0
                      y: 14
                      width: 4
                      height: 76
                      normal: ~28,232,205,255
                      alpha: self.parent.entry['alpha']
                      through: true
                  QQ图标:
                    type: Text
                    attribute:
                      x: 16
                      y: 12
                      texts: ~&bQQ
                      fontSize: 36
                      alpha: self.parent.entry['alpha']
                      through: true
                  发送者窗口:
                    type: Scroll
                    attribute:
                      x: 62
                      y: 12
                      width: 190
                      height: 36
                      through: true
                    children:
                      发送者布局:
                        type: HStack
                        attribute:
                          height: 36
                          through: true
                        children:
                          发送者:
                            type: Text
                            attribute:
                              texts: "'&f' + self.parent.parent.parent.entry['nick'].substring(0, math.min(9, self.parent.parent.parent.entry['nick'].length())) + (self.parent.parent.parent.entry['nick'].length() > 9 ? '...' : '')"
                              fontSize: 36
                              alpha: self.parent.parent.parent.entry['alpha']
                              through: true
                  时间标:
                    type: Canvas
                    attribute:
                      point: ~top_right
                      x: -16
                      y: 8
                      width: 100
                      height: 36
                      through: true
                    children:
                      时标底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~232,228,218,255
                          shape: ~round_rect
                          radius: 4
                          alpha: self.parent.parent.entry['alpha']
                          through: true
                      时间:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "'&8' + self.parent.parent.entry['time'].substring(math.max(0, self.parent.parent.entry['time'].length() - 5))"
                          fontSize: 36
                          alpha: self.parent.parent.entry['alpha']
                          through: true
                  消息预览窗口:
                    type: Scroll
                    attribute:
                      x: 16
                      y: 50
                      width: 352
                      height: 36
                      through: true
                    children:
                      预览布局:
                        type: HStack
                        attribute:
                          height: 36
                          through: true
                        children:
                          消息内容:
                            type: Text
                            attribute:
                              # HUD 只显示单行摘要，原文仍在通知缓存；群内对话在连接中心查看。
                              texts: "'&f' + self.parent.parent.parent.entry['msg'].substring(0, math.min(17, self.parent.parent.parent.entry['msg'].length())) + (self.parent.parent.parent.entry['msg'].length() > 17 ? '...' : '')"
                              fontSize: 36
                              alpha: self.parent.parent.parent.entry['alpha']
                              through: true
                  自动消退轨:
                    type: Texture
                    attribute:
                      x: 16
                      y: 94
                      width: 352
                      height: 2
                      normal: ~70,52,77,255
                      alpha: self.parent.entry['alpha']
                      through: true
                  自动消退进度:
                    type: Texture
                    attribute:
                      x: 16
                      y: 94
                      width: "352 * math.max(0, 1 - (Time.now() - self.parent.entry['born']) / var.displayDuration)"
                      height: 2
                      normal: ~28,232,205,255
                      alpha: self.parent.entry['alpha']
                      through: true
