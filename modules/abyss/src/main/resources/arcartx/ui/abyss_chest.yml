# AXS 资源说明
# 用途: Abyss 副本宝箱 —— roll 好的奖励物品展示 + 单个/全部领取
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/chestTitle/itemCount/itemJson0..itemJson8
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.chestTitle = packet['chestTitle']
      var.itemCount = packet['itemCount']
      var.itemJson0 = packet['itemJson0']
      var.itemJson1 = packet['itemJson1']
      var.itemJson2 = packet['itemJson2']
      var.itemJson3 = packet['itemJson3']
      var.itemJson4 = packet['itemJson4']
      var.itemJson5 = packet['itemJson5']
      var.itemJson6 = packet['itemJson6']
      var.itemJson7 = packet['itemJson7']
      var.itemJson8 = packet['itemJson8']
      // 预发包经缓存 replay 时控件可能尚未就绪（文档约定：预发包只适合初始化数据），
      // 控件操作统一延迟到 tick 由 var.dirty 驱动——槽位 seticon 属性表达式不变。
      var.dirty = true
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.chestTitle = '宝箱'
      var.itemCount = 0
      var.itemJson0 = ''
      var.itemJson1 = ''
      var.itemJson2 = ''
      var.itemJson3 = ''
      var.itemJson4 = ''
      var.itemJson5 = ''
      var.itemJson6 = ''
      var.itemJson7 = ''
      var.itemJson8 = ''
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.accent = '226,196,132,255'
      var.accentDim = '150,128,90,180'
      var.dirty = false
    open: |-
      Sound.self('minecraft:block.chest.open', 0.9, 10)
    # 控件就绪后统一应用物品图标（脏标记只执行一次）
    tick: |-
      if(var.dirty){
        var.dirty = false
        val.槽位0.seticon()
        val.槽位1.seticon()
        val.槽位2.seticon()
        val.槽位3.seticon()
        val.槽位4.seticon()
        val.槽位5.seticon()
        val.槽位6.seticon()
        val.槽位7.seticon()
        val.槽位8.seticon()
      }
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;16,12,30,210
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      宝箱面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 560
          height: 340
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;28,22,16,240
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 2
                color: var.accentDim
          标题标线:
            type: Texture
            attribute:
              point: ~top_center
              y: 26
              width: 24
              height: 3
              normal: var.accent
              through: true
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 42
              texts: "'&f' + var.chestTitle"
              fontSize: 48
              limit: 12
              through: true
          物品网格:
            type: HGrid
            attribute:
              point: ~top_center
              y: 120
              width: 512
              spaceBetween: 12
              column: 9
            children:
              槽位0:
                val: 槽位0
                type: Slot
                attribute:
                  width: 48
                  height: 48
                  slotType: ~Icon
                  normal: ~62,52,36,235
                  hover: ~82,70,48,245
                  shape: ~round_rect
                  radius: 8
                  itemScale: 0.8
                  seticon: "self.setItemIcon(var.itemJson0 != none && var.itemJson0 != '' ? var.itemJson0 : var.emptyItemJson)"
                  visible: "var.itemJson0 != none && var.itemJson0 != ''"
                action:
