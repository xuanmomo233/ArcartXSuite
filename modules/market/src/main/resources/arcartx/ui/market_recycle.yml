              玩家商店文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f玩家商店"
                  fontSize: 36
                  through: true
          导航系统商店:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'shop_ui_open')
            children:
              系统商店底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
