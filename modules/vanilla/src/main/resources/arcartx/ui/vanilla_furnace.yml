                val: 滚动条滑块
                attribute:
                  x: -18.5
                  y: -46.5
                  width: 5
                  height: 20
                  normal: ~Frosted:0;180,180,180,220
                  shape: ~round_rect
                  radius: 2
                  point: ~middle_right
                  maxDragY: 109
                  visible: true
                effect:
                  stroke:
                    width: 0.5
                    color: ~120,120,120,120
          背包区:
            type: Canvas
            attribute:
              width: 179
              x: 0
              y: 56
              point: ~middle_center
              height: 84
              visible: true
            children:
              背包网格:
                type: HGrid
                attribute:
                  spaceBetweenX: 1
                  spaceBetweenY: 0
                  column: 9
                  width: 171
                  x: 0
                  y: 0
                  point: ~top_center
                  height: 57
                  visible: true
                action:
                  create: |-
                    for(i in range(1, 26)){
                      slot = self['背包原型'].copy('背包格' + i.round())
                      slot.id = i.round() + 3
                    }
                children:
                  背包原型:
                    type: Slot
                    attribute:
                      normal: ~Frosted:0;95,95,95,255
                      hover: ~Frosted:0;255,255,255,255
                      shape: ~round_rect
                      radius: 6
                      slotType: ~Backpack
                      width: 19
                      id: 3
                      height: 19
                      itemScale: 0.7
                      visible: true
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
              快捷栏:
                type: HGrid
                attribute:
                  spaceBetweenX: 1
                  column: 9
                  width: 171
                  x: 0
                  y: 0
                  point: ~bottom_center
                  height: 19
                  visible: true
                action:
                  create: |-
                    for(i in range(1, 8)){
                      slot = self['快捷原型'].copy('快捷格' + i.round())
                      slot.id = i.round() + 30
                    }
                children:
                  快捷原型:
                    type: Slot
                    attribute:
                      normal: ~Frosted:0;95,95,95,255
                      hover: ~Frosted:0;255,255,255,255
                      shape: ~round_rect
                      radius: 6
                      slotType: ~Backpack
                      width: 19
                      id: 30
                      height: 19
                      itemScale: 0.7
                      visible: true
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
