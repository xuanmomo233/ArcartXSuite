                width: 1
                color: 'self.parent.isHovered() ? ''175,147,97,255'' : ''151,138,112,150'''
          物品滑块:
            type: Texture
            val: 物品滑块
            attribute:
              point: ~top_right
              x: -18
              y: 88
              width: 8
              height: 80
              normal: ~175,147,97,255
              maxDragY: var.viewH - 428 - 80
              shape: ~round_rect
              radius: 4
              through: true
          物品滚动:
            type: Scroll
            val: 物品滚动
            attribute:
              point: ~top_left
              x: 24
              y: 88
              width: var.scrollW
              height: var.viewH - 428
              moveY: self.parent['物品滑块'].getDragYRatio()
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              回收列表:
                val: 回收列表
                type: HGrid
                attribute:
                  width: var.scrollW
                  column: 2
                  spaceBetweenX: 16
                  spaceBetweenY: 16
                children:
                  回收卡片:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.recyclables[self.entryKey]
                      visible: self.entry != none
                      width: var.cardW
                      height: 220
                    children:
                      卡片底:
                        type: Texture
                        attribute:
