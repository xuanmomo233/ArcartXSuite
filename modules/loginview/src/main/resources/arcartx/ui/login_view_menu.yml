              反馈滑块:
                type: Texture
                attribute: {x: 646, y: 48, width: 6, height: 16, maxDragY: 24, normal: '~224,184,100,255', visible: "var.result != none && var.result != ''"}
              反馈滚动栏:
                type: Scroll
                attribute: {x: 16, y: 48, width: 612, height: 40, moveY: "self.parent['反馈滑块'].getDragYRatio()", visible: "var.result != none && var.result != ''"}
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['反馈滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['反馈滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  反馈内容:
                    type: VStack
                    attribute: {width: 612}
                    children:
                      结果:
                        type: Text
                        attribute: {texts: var.result, fontSize: 36, limit: 28, through: true}
