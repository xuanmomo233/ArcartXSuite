# ArcartXSuite ExtraBackpack - 额外背包模块配置
# 多分类额外背包系统，支持装备/材料/杂物等分类页，每页独立容量与付费扩容。
# 重载: /axs extrabackpack reload

settings:
  # 是否输出调试日志
  debug: false

ui:
  # 插件启用时是否自动注册背包 UI
  register-ui-on-enable: true
  # 是否覆盖用户已修改的 UI 文件
  overwrite-ui-files: false

storage:
  # 存储模式: sqlite 或 mysql
  mode: "sqlite"
  sqlite:
    # SQLite 文件名 (相对模块数据目录)
    file: "extrabackpack.db"
  mysql:
    # 以下仅在 mode: mysql 时生效
    host: "127.0.0.1"
    port: 3306
    database: "arcartxsuite"
    username: "root"
    password: ""
  # 数据库连接池大小
  pool-size: 4

# ─── 额外背包配置 ───
extra-backpack:
  # 是否启用额外背包功能
  enabled: false
  # 分类页定义，键名即分类 ID
  categories:
    # 装备分类
    equipment:
      # 分类显示名称
      display-name: "装备"
      # 分类排序优先级 (数值越小越靠前)
      priority: 10
      slots:
        # 初始槽位数
        initial: 9
        # 最大槽位上限
        max: 27
      price:
        # 购买槽位使用的货币类型 (points/vault)
        currency: "points"
        # 每个槽位的价格
        per-slot: 100
      # 物品自动归类匹配规则
      match:
        nbt:
          # NBT 路径，用于读取物品分类标签
          path: "pdc:arcartx:item_category"
          # 匹配的标签值列表，物品标签值在此列表中则归入该分类
          values: ["equipment", "weapon", "armor"]
    # 材料分类
    material:
      display-name: "材料"
      priority: 20
      slots:
        initial: 9
        max: 27
      price:
        currency: "points"
        per-slot: 80
      match:
        nbt:
          path: "pdc:arcartx:item_category"
          values: ["material"]
    # 杂物分类 (兜底分类，未匹配其他分类的物品归入此处)
    other:
      display-name: "杂物"
      priority: 9999
      # 是否为默认分类 (未匹配其他分类的物品自动归入)
      default: true
      slots:
        initial: 9
        max: 27
      price:
        currency: "points"
        per-slot: 60
