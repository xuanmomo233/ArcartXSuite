# AXS 资源说明
# 用途: Conversation 模块默认 NPC 选择 HUD，负责展示附近可触发对话的 NPC。
# 前置依赖: ArcartX、Chemdah、Adyeshach；Conversation 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.conversation.enabled + modules.conversation.password
# 关联文件: ArcartXConversation.yml、ui/conversation_dialog.yml
# 重载命令: /axs conversation reload
# 最小使用路径: ui + controls
# 结构提示: 靠近屏幕中间的选项 HUD，风格与 conversation_dialog.yml 选项一致。
#          Frosted 毛玻璃背景 + round_rect radius:25 + 白色描边高亮。
#          选中态用 selected 字段驱动描边高亮（选择器支持键盘导航）。
# 服务端 sync 字段:
#   token, packetId, title, hintText, selectedNpcId, selectedNpcIndex,
#   npcCount, npcScrollRatio, npcRows, maxNpcCount
# npcRows 单行字段:
#   id, text, distanceText, selected, index
# 客户端回包:
#   navigate_npc / confirm_npc / select_npc
# 回包格式:
#   action, token, targetId
ui:
  isHud: true
  defaultOpen: false
  through: true
  show: true
  screenScale: true
  level: 0
  packetHandler:
    # packetHandler: sync
    # 包字段:
    #   - token: 会话令牌，用于回包验证
    #   - packetId: 通信标识，用于 Packet.send 回包
    #   - title: 选择器标题
    #   - hintText: 操作提示文字
    #   - selectedNpcId: 当前选中的 NPC ID
    #   - selectedNpcIndex: 当前选中的 NPC 索引
    #   - npcCount: 可对话 NPC 总数
    #   - npcScrollRatio: 列表滚动比例
    #   - npcRows: NPC 行数据字典（每行含 id, text, distanceText, selected, index）
    #   - maxNpcCount: NPC 行模板最大复制数
    sync: |-
      var.token = packet['token']
      var.packetId = packet['packetId']
      var.title = packet['title']
      var.hintText = packet['hintText']
      var.selectedNpcId = packet['selectedNpcId']
      var.selectedNpcIndex = packet['selectedNpcIndex']
      var.npcCount = packet['npcCount']
      var.npcScrollRatio = packet['npcScrollRatio']
      var.npcRows = packet['npcRows']
      var.maxNpcCount = packet['maxNpcCount']

      if(val.selector_list.childrenCount() != var.maxNpcCount){
        while(val.selector_list.childrenCount() > 1){
          val.selector_list.get(1).remove()
        }
        for(i in range(1, var.maxNpcCount - 1)){
          key = i.round()
          if(val.selector_list['选择器模板'] != none){ ni = val.selector_list['选择器模板'].copy('选择器模板' + key) }
          ni.entryKey = key
        }
      }
    # packetHandler: close
    # 包字段:
    #   - packetId: 通信标识（可能为 none）
    close: |-
      var.token = none
      var.packetId = packet['packetId'] == none ? none : packet['packetId']
      var.title = none
      var.hintText = none
      var.selectedNpcId = none
      var.selectedNpcIndex = -1
      var.npcCount = 0
      var.npcScrollRatio = 0
      var.npcRows = {}
  action:
    load: |-
      var.maxNpcCount = 0
      var.maxNpcWidth = 150
      var.interactKey = Keyboard.getKeyBindingKeyName("AXS_INTERACT")
      var.navPrevKey = Keyboard.getKeyBindingKeyName("AXS_NAVIGATE_PREV")
      var.navNextKey = Keyboard.getKeyBindingKeyName("AXS_NAVIGATE_NEXT")
      if(var.navPrevKey == '上方向键'){
        var.navPrevKey = "↑"
      }
      if(var.navNextKey == '下方向键'){
        var.navNextKey = "↓"
      }
    tick: |-
      mw = 0
      for(i in range(0, val.selector_list.childrenCount())){
        w = val.selector_list.get(i)['NPC名'].width
        if(w > mw){
          mw = w
        }
      }
      var.maxNpcWidth = mw + 120
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      选择器面板:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 200
          y: 80
          width: var.maxNpcWidth + 10
          height: 280
        children:
          选择器标题:
            type: Text
            attribute:
              point: ~top_left
              texts: "'&b' + var.title"
              fontSize: 48
          选择器提示:
            type: Text
            attribute:
              point: ~top_left
              y: 28
              texts: "var.navPrevKey + '/' + var.navNextKey + ' 切换，' + var.interactKey + ' 确认'"
              fontSize: 32
          选择器滑块:
            type: Texture
            val: 选择器滑块
            attribute:
              point: ~top_right
              y: 56
              width: 4
              height: 30
              normal: ~150,150,150,255
              maxDragY: 148
          选择器滚动区:
            type: Scroll
            attribute:
              y: 56
              width: var.maxNpcWidth
              height: 178
              moveY: "self.parent['选择器滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['选择器滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['选择器滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              选择器列表:
                val: selector_list
                type: VStack
                attribute:
                  width: var.maxNpcWidth
                  spaceBetween: 5
                children:
                  选择器模板:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.npcRows[self.entryKey]
                      visible: self.entry != none
                      width: var.maxNpcWidth
                      height: 56
                    action:
                      clickLeft: |-
                        if(self.entry != none && self.entry['selected']){
                          Packet.send(var.packetId, 'confirm_npc', var.token, self.entry['id'])
                        }elif(self.entry != none){
                          Packet.send(var.packetId, 'select_npc', var.token, self.entry['id'])
                        }
                    children:
                      选项背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~Frosted:30;0,0,0,255
                          shape: ~round_rect
                          radius: 25
                        effect:
                          stroke:
                            width: 3
                            color: "(self.parent.isHovered() || (self.parent.entry != none && self.parent.entry['selected'])) ? '255,255,255,255' : '80,86,108,255'"
                      NPC名:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 14
                          y: 0
                          texts: "self.parent.entry != none ? self.parent.entry['text'] : none"
                          fontSize: 48
                          through: true
                      NPC距离:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -14
                          y: 0
                          texts: "self.parent.entry != none ? '&8' + self.parent.entry['distanceText'] : none"
                          fontSize: 36
                          through: true
