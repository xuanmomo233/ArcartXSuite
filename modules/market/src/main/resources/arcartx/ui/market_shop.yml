              height: 64
              maxDragY: var.viewH - 420 - 64
              normal: ~175,147,97,255
              shape: ~round_rect
              radius: 3
          商店滚动:
            type: Scroll
            val: 商店滚动
            attribute:
              point: ~top_left
              x: 24
              y: 128
              width: 224
              height: var.viewH - 420
              moveY: val.商店滑块.getDragYRatio()
            action:
              wheel: |-
                ratio = self.moveY - self.wheelValue * 0.1
                ratio = ratio < 0 ? 0 : ratio
                ratio = ratio > 1 ? 1 : ratio
                val.商店滑块.setDragYRatio(ratio)
            children:
              商店列表:
                type: VStack
                val: 商店列表
                attribute:
                  width: 216
                  spaceBetween: 12
                children:
                  商店项:
                    type: Canvas
                    attribute:
                      x: 0
                      y: 0
                      width: 216
                      height: 72
                      entryKey: 0.round()
                      entry: var.shops[self.entryKey]
                      visible: self.entry != none
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: 'self.parent.entry[''id''] == var.shopId ? ''53,87,65,255'' : ''27,49,41,255'''
                          shape: ~round_rect
                          radius: 8
                      商店图标:
                        type: Slot
                        attribute:
