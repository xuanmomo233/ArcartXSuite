# rooms.yml — 元气试炼之地 · 程序化迷宫房（gen 模式）
#
# source: gen 的层中，region/spawn/doors/exit 全部不写——由生成器每实例产出：
#   洞穴形 footprint（CA 平滑）+ 随机布点 + 门洞 + 锚点 + 刷怪点。
# gen.feature：entry|combat|altar|chest|shop|puzzle|elite|boss|plain（内饰+锚点方案）
# gen.radius：洞穴半径区间；gen.tall：挑高（净高走 gen.tall-height）。
# 怪组落点：location "auto"=洞内随机点 / "center"=房心 / "anchor:<名>"=房内锚点。
# 波次：w1a/w1b MANUAL 由 on-lock 掷签选包；w2 TRIGGERED 等首波包全清后休整刷怪。
# 可选房（floors.optional-rooms）没抽中时：其 interact/NPC/guide 锚点解析失败自动跳过。

rooms:
  # ═══════════ &a第 1 层 · 苔痕前哨 ═══════════

  # 入口营地
  f1_start:
    type: safe
    gen:
      feature: entry
      radius: [11, 14]
    on-enter:
      - "message @all &e跟 &6向导·艾琳 &e交谈——接取委托、了解地牢"
      - "sound @all ENTITY_VILLAGER_YES 1 1"

  # 苔痕战场
  f1_combat_a:
    type: combat
    gen:
      feature: combat
      radius: [13, 17]
    groups:
      w1a:  # 首波包A
        spawn-timing: MANUAL
        monsters:
          - mob-id: vanilla:zombie
            location: "auto"
            amount: 2
          - mob-id: vanilla:zombie
            location: "auto"
            amount: 2
          - mob-id: vanilla:skeleton
            location: "auto"
            amount: 1
      w1b:  # 首波包B
        spawn-timing: MANUAL
        monsters:
          - mob-id: vanilla:spider
            location: "auto"
            amount: 2
          - mob-id: vanilla:spider
            location: "auto"
            amount: 2
          - mob-id: vanilla:creeper
            location: "auto"
            amount: 1
      w2:
        spawn-timing: TRIGGERED
        trigger-after: [w1a, w1b]
        on-prespawn:
          - "title @all 5 30 10 &e第二波 &c3 秒后来袭！"
          - "sound @all ENTITY_RAVAGER_ROAR 0.6 0.8"
        monsters:
          - mob-id: vanilla:zombie
            location: "auto"
            amount: 2
          - mob-id: vanilla:spider
            location: "auto"
            amount: 2
          - mob-id: vanilla:creeper
            location: "auto"
            amount: 1
    wave-rest: 3          # 波次休整秒（改版后更紧凑）
    on-enter:
      - "title @all 10 30 10 &c遭遇战！|&7肃清房间以解除封锁"
      - "guide_clear f1_east"   # 东廊指引已到达
    on-lock:
      - "sound @all BLOCK_IRON_DOOR_CLOSE 1 0.6"
      - "random f1_combat_a_pack 1 2"
      - "run_script wpk_f1_combat_a_a"
      - "run_script wpk_f1_combat_a_b"
    on-clear:
      - "addvar f1_cleared 1"
      - "run_script f1_gate"
      - "title @all 5 30 10 &a房间肃清|&7走廊已解封"
      - "sound @all ENTITY_PLAYER_LEVELUP 1 1.4"

