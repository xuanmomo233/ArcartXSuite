# ============================================================
#  Market 模块消息文件
# ------------------------------------------------------------
#  支持 & 颜色码（如 &c 红色）和 {0} {1} 占位符。
#  修改后执行 /axs reload market 即可生效。
# ============================================================

# 消息前缀，所有 Market 模块消息都会自动附加此前缀
prefix: "&3◆ &6ArcartXSuite &7| &r"

# ── 通用 ──────────────────────────────────────────────
common:
  service-down: "&c市场服务尚未就绪"           # 服务未初始化或数据库连接失败
  unknown: "&e未知命令，使用 /{0} market help"  # {0}=插件主命令前缀
  only-player: "&c该命令只能由玩家执行。"
  no-permission: "&c你没有权限执行这个命令。"

# ── admin ─────────────────────────────────────────────
help:
  title: "&6Market 管理"
  status: "&7{0} status&f - 状态"
  reload: "&7{0} reload&f - 重载"
  clear-expired: "&7{0} clear-expired&f - 处理到期"
  remove: "&7{0} remove <auction|pshop> <ID>&f - 强制下架并退还"
  edit: "&7{0} edit [商店ID]&f - 编辑系统商店"
  open: "&7{0} open <auction|pshop|shop|recycle|history|sell> [商店ID]&f - 打开对应界面"

# ── 状态查询 ──────────────────────────────────────────
status:
  title: "&6AXS Market 状态"
  active-listings: "&7活跃拍卖: &f{0}"
  player-shop-listings: "&7玩家商店在售: &f{0}"
  subsystems: "&7功能状态: &f{0}"
  shops: "&7系统商店: &f{0}"
  recycle-entries: "&7回收条目: &f{0}"
  list-cache: "&7列表缓存(Redis): &f{0}"
  list-cache-connected: "&a已连接"
  list-cache-disconnected: "&c未连接"
  cross-server: "&7跨服通道: &f{0}"
  cross-server-active: "&a已启用"
  cross-server-inactive: "&e未启用"

# ── 管理操作 ──────────────────────────────────────────
admin:
  clear-expired-success: "&a已处理 {0} 个到期物品"
  remove-usage: "&e用法: /axs market remove <auction|pshop> <上架ID>（省略类型时为 auction）"
  remove-success: "&a已强制移除上架物品"
  remove-not-found: "&c未找到该上架ID"
  invalid-id: "&c无效的 ID 格式。"

# ── player ────────────────────────────────────────────
player:
  auction-unavailable: "&c拍卖行未启用"
  pshop-unavailable: "&c玩家商店未启用"
  sell-unavailable: "&c拍卖行和玩家商店均未启用"
  cancel-failed: "&c取消失败（不存在或非本人上架）"
  shop-unavailable: "&c系统商店未启用"
  recycle-unavailable: "&c回收商店未启用"

  auto-recycle-disabled: "&c自动回收功能已关闭"
  batch-recycle-disabled: "&c一键回收功能已关闭"
  help:
    title: "&6全球市场 命令"
    auction: "&7/market&f - 拍卖大厅；/market lot <ID> 打开拍品竞价厅"
    pshop: "&7/market pshop&f - 店铺目录；mine 我的店铺 / edit 装修 / market 全部商品"
    shop: "&7/market shop [商店ID]&f - 系统商店"
    sell: "&7/market sell <起拍价> [时长] [货币]&f - 拍卖上架；/market sellui 打开统一上架界面"
    recycle: "&7/market recycle [all|protect]&f - 回收商店 / 个人回收保护"
    history: "&7/market history&f - 四类交易历史"
    my: "&7/market my [auction|pshop]&f - 我的上架"
    search: "&7/market search <关键词>&f - 搜索"
    cancel: "&7/market cancel <ID> [auction|pshop]&f - 取消自己的上架"
  sell:
    usage: "&e用法: /market sell <起拍价> [时长秒] [货币]"
    air: "&c请手持要上架的物品"
    invalid-price: "&c价格格式无效"
    invalid-slot: "&c请选择有效的背包物品"
    invalid-duration: "&c上架时长不在允许范围内"
    invalid-currency: "&c所选货币不可用"
    price-out-of-range: "&c价格必须在 {0} - {1} 范围内"
    message-too-long: "&c留言不能超过 {0} 个字符"
    message-filtered: "&c留言包含敏感词，请修改后重试"
  cancel:
    usage: "&e用法: /market cancel <上架ID> [auction|pshop]"
    invalid-id: "&c无效的上架 ID 格式"
  search:
    usage: "&e用法: /market search <关键词>"

# ── 拍卖行消息 ──
auction-listed: "&a物品已成功上架！"                    # 上架成功提示
auction-bid-placed: "&a出价成功！当前最高出价: &e{amount}"  # {amount}=出价金额
auction-outbid: "&c您对 &e{item} &c的出价已被超越！新最高价: &e{amount}"  # 被超越通知，{item}=物品名
auction-expired: "&7您上架的 &e{item} &7已到期，已退回。"  # 到期退回通知
auction-sold: "&a您上架的 &e{item} &a已售出！收入: &e{amount}"  # 售出通知，{amount}=税后收入
auction-cancelled: "&7已取消上架。"                    # 取消上架成功
# ── 系统商店消息 ──
shop-bought: "&a购买成功！花费: &e{amount}&a，奖励已进入持久交付队列。" # {amount}=花费金额
shop-limit-reached: "&c该商品已达购买上限。"           # 限购商品达到上限
shop-condition-denied: "&c你不满足该商品的上架条件。"      # 商品 conditions 条件不满足
# ── 回收商店消息 ──
recycle-success: "&a回收已受理，收益等待入账: &e{amount}" # {amount}=已建立入账任务的金额
recycle-nothing: "&7背包中没有可回收的物品。"          # 无可回收物品
# ── 玩家商店消息 ──
player-shop-listed: "&a商品已上架到你的商店！"          # 上架成功
player-shop-bought: "&a购买成功！花费: &e{amount}"     # {amount}=花费金额
player-shop-sold: "&a你商店中的 &e{item} &a已售出！收入: &e{amount}"  # {item}=物品名 {amount}=税后收入
player-shop-expired: "&7你商店中的 &e{item} &7已到期，已退回。"  # 到期退回通知
player-shop-cancelled: "&7已下架商品。"                # 下架成功
# ── 通用错误消息 ──
insufficient-funds: "&c余额不足。"                    # 货币余额不足
item-blacklisted: "&c该物品不允许上架。"               # 物品在黑名单中

auto-recycle-disabled: "&c自动回收功能已关闭"          # 拾取自动回收功能未启用
batch-recycle-disabled: "&c一键回收功能已关闭"          # UI 一键回收功能未启用
