# Tab 定义: demo
# 完整版示例 definition：消费 map 形态 pack，对应内置 ui-id: tab-rich
# （文件位于 plugins/ArcartXSuite/ui/tab-rich.yml，模块启用时自动复制）。
# 该 UI 渲染玩家头像（PlayerSkin 纹理）+ 视觉风格 PAPI（PVP / vanish / ping）。
# 启用前请确认：
#   - settings.style.pvp-highlight / vanish-grey / ping-icon 按需打开
# 默认 enabled: false，避免与 online-tab 同时推送时玩家看到双 HUD。

enabled: false  # 是否启用此 Tab 定义（默认关闭，避免与 online-tab 同时推送导致双 HUD）
# 支持新格式 ui-targets（可同时发给多个 UI）或旧格式 ui-id + packet-handler（仅发一个 UI）。
ui-targets:  # 目标 UI 列表，同一个 payload 可同时发给多个 UI
  - ui-id: "AXS:tab-rich"  # 对应的 UI ID（plugins/ArcartXSuite/ui/tab-rich.yml）
    packet-handler: "tab"  # UI 端接收包的 handler 名称
client-refresh-packet-id: "TAB"  # 客户端回包请求刷新的 Packet ID
client-refresh-action: "update"  # 客户端回包请求刷新的 action 名称
max-entries: -1  # 最大条目数，-1 表示不限制
sort-keys:  # 多键复合排序（优先级高于 sort-mode）
  - { mode: prem, prem-group: [admin, vip3, vip2, vip1, default] }  # 第一优先级: 按权限组排序
  - { mode: name }  # 第二优先级: 按玩家名排序
pack:  # map 形态 pack，每个在线玩家渲染为一个字典，UI 端按字段取值
  uuid: "{player_uuid}"  # 玩家 UUID，UI 端用于渲染 PlayerSkin 头像
  name: "%axstab_pvp_color%%axstab_vanish_color%%player_name%"  # 玩家名称（含 PVP 红色/vanish 灰色颜色前缀）
  ping: "%axstab_ping_icon%"  # PING 延迟图标（由 settings.style.ping-icon 配置渲染）
  health: "%player_health%"  # 玩家当前血量
