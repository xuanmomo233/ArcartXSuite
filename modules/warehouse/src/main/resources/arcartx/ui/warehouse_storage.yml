# AXS Warehouse Storage - 翡翠宝库绿重写版
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航 + 内容区
# 布局: 左导航(仓库/银行/管理 + 底部仓库状态卡片) + 内容区(检索侧栏 + 仓库主区 + 背包区)
# 配色: 银灰金库 主色160,170,180 底20,24,28,110 抬升36,40,46,245 描边80,90,100,220 强调160,170,180
# 顶栏: fishing 风格(标题色块+固定标题+右侧关闭，无副标题/无竖线/无操作组)
# 逻辑: packetHandler/action/val引用/entryKey/copy 与原版一致，仅重构布局结构与配色

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 包标识符（'AXS_WAREHOUSE'）
    #   - action_token: 操作令牌（防重放）
    #   - ownerType: 仓库所有者类型（personal / shared）
    #   - ownerId: 所有者 ID
    #   - warehouseId: 仓库 ID
    #   - warehouseName: 仓库名称
    #   - categoryId: 当前分类 ID
    #   - search: 搜索关键词
    #   - categories: 分类列表
    #   - categoryTexts: 分类显示文本
    #   - personalWarehouses: 个人仓库列表
    #   - personalWarehouseTexts: 个人仓库显示文本
    #   - sharedWarehouses: 共享仓库列表
    #   - sharedWarehouseStorageTexts: 共享仓库存储显示文本
    #   - slots: 仓库槽位数据
    #   - selectedSlot: 当前选中的槽位索引
    #   - selectedItem: 当前选中的物品
    #   - backpack: 玩家背包数据
    #   - unlocked: 二级密码是否已解锁
    #   - hasPassword: 是否已设置二级密码
    #   - readOnly: 是否只读模式
    #   - sharedEditMode: 共享仓库是否处于编辑模式
    #   - sharedCanEdit: 当前玩家是否有编辑权限
    #   - lockOwner: 编辑锁持有者
    #   - page: 当前页码
    #   - pageTotal: 总页数
    #   - pageText: 页码显示文本
    #   - capacityText: 容量显示文本
    #   - used: 已使用容量
    #   - capacity: 总容量
    #   - level: 仓库等级（共享仓库等级；个人仓库恒为 1，逐格解锁不显示等级）
    #   - canUpgrade: 是否可扩容（个人=还能再买一格，共享=可升下一级）
    #   - slotPriceText: 个人仓库单格价格文本
    #   - nextUpgradeText: 扩容提示文本（个人=槽位价格提示，共享=下一级信息）
    #   - usedSlots: 已使用的槽位集合
    #   - matchedSlots: 搜索匹配的槽位集合
    #   - slotCount: 槽位总数
    #   - pageSize: 每页槽位数量
    #   - maxPersonalCount: 个人仓库最大数量（用于动态创建控件）
    #   - maxSharedCount: 共享仓库最大数量
    #   - maxCategoryCount: 分类最大数量
    update: |-
      var.itemJsons = {}
      // 保存旧数量，用于判断是否需要重建列表（首次 update 时旧数量为 0，数量从 0 变为 N 时触发重建）
      oldMaxPersonalCount = var.maxPersonalCount
      oldMaxSharedCount = var.maxSharedCount
      oldMaxCategoryCount = var.maxCategoryCount
      oldPageSize = var.pageSize
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.categoryId = packet['categoryId']
      var.search = packet['search']
      var.sortId = packet['sortId']
      var.sortText = packet['sortText']
      var.categories = packet['categories']
      var.categoryTexts = packet['categoryTexts']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseStorageTexts = packet['sharedWarehouseStorageTexts']
      var.slots = packet['slots']
      var.selectedSlot = packet['selectedSlot']
      var.selectedItem = packet['selectedItem']
      var.backpack = packet['backpack']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.sharedEditMode = packet['sharedEditMode']
      var.sharedCanEdit = packet['sharedCanEdit']
      var.lockOwner = packet['lockOwner']
      var.page = packet['page']
      var.pageTotal = packet['pageTotal']
      var.pageText = packet['pageText']
      var.capacityText = packet['capacityText']
      var.used = packet['used']
      var.capacity = packet['capacity']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.slotPriceText = packet['slotPriceText']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.usedSlots = packet['usedSlots']
      var.matchedSlots = packet['matchedSlots']
      var.slotCount = packet['slotCount']
      var.pageSize = packet['pageSize']
      var.maxPersonalCount = packet['maxPersonalCount']
      var.maxSharedCount = packet['maxSharedCount']
      var.maxCategoryCount = packet['maxCategoryCount']
      // ── 个人仓库列表：仅在数量变化时重建 ──
      if(var.maxPersonalCount != oldMaxPersonalCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.个人仓库列表.childrenCount() > 1){
          val.个人仓库列表.get(1).remove()
        }
        if(var.maxPersonalCount > 1){
          for(序号 in range(1, var.maxPersonalCount - 1)){
            if(val.个人仓库列表['项'] != none) {
              项 = val.个人仓库列表['项'].copy('个人仓库项_' + var.刷新轮次.round() + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      // ── 共享仓库列表：仅在数量变化时重建 ──
      if(var.maxSharedCount != oldMaxSharedCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.共享仓库列表.childrenCount() > 1){
          val.共享仓库列表.get(1).remove()
        }
        if(var.maxSharedCount > 1){
          for(序号 in range(1, var.maxSharedCount - 1)){
            if(val.共享仓库列表['项'] != none) {
              项 = val.共享仓库列表['项'].copy('共享仓库项_' + var.刷新轮次.round() + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      // ── 分类列表：仅在数量变化时重建 ──
      if(var.maxCategoryCount != oldMaxCategoryCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.分类列表.childrenCount() > 1){
          val.分类列表.get(1).remove()
        }
        if(var.maxCategoryCount > 1){
          for(序号 in range(1, var.maxCategoryCount - 1)){
            if(val.分类列表['项'] != none) {
              项 = val.分类列表['项'].copy('分类项_' + var.刷新轮次.round() + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      var.renderBackpackAmounts()
      if(var.slots != none){
        for(key in var.slots.keys()){
          json = packet['slotItemJson' + key]
          if(json != none){
            var.itemJsons[key] = json
          } else {
            var.itemJsons[key] = var.air
          }
        }
      }
      // ── 仓库网格（Slot 控件）：仅在数量变化时重建 ──
      if(var.pageSize != oldPageSize){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.仓库网格.childrenCount() > 1){
          val.仓库网格.get(1).remove()
        }
        if(var.pageSize > 1){
          for(序号 in range(1, var.pageSize - 1)){
            if(val.仓库网格['物品图标'] != none) {
              slot = val.仓库网格['物品图标'].copy('仓库物品图标_' + var.刷新轮次.round() + '_' + 序号.round())
              slot.entryKey = 序号.round()
            }
          }
        }
      }
      // 对已存在的 Slot 控件重新调用 seticon（数据变了但 seticon 不会自动刷新）
      // 注意：icon 为裸变量块级作用域，seticon 必须放在赋值所在的 if 块内
      for(i in range(0, var.pageSize - 1)){
        if(val.仓库网格 != none){
          icon = val.仓库网格.get(i.round())
          if(icon != none){
            icon.seticon()
          }
        }
      }
      // update 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.capacityText = '0/0'
      var.slotPriceText = ''
      var.canUpgrade = false
      var.categoryTexts = {}
      var.hasPassword = false
      var.lastBackpackClickTime = 0
      var.lastSlotClickTime = 0
      var.level = 1
      var.packetId = 'AXS_WAREHOUSE'
      var.page = 1
      var.pageText = '1/1'
      var.personalWarehouseTexts = {}
      var.selectedBackpackSlot = -1
      var.selectedSlot = -1
      var.sharedEditMode = false
      var.sharedWarehouseStorageTexts = {}
      var.sortText = '时间'
      var.unlocked = false
      var.warehouseName = 'AXS 仓库'
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.air = '{"id": "minecraft:air","Count":1b}'
      var.amount = 1.round()
      var.emptyItemJson = '{"id": "minecraft:air","Count":1b}'
      var.刷新轮次 = 0.round()
      var.renderBackpackAmounts = -> {
        if(val.背包网格 != none){
          for(raw in range(9,44)){
            control = raw == 9 ? val.背包网格['背包槽'] : val.背包网格['背包槽' + (raw - 9).round()]
            entry = var.backpack[raw.round()]
            if(control != none){
              amountText = none
              if(entry != none && !entry['empty']){
                amountText = '&f' + entry['amount'].round()
              }
              amountControl = control['数量']
              if(amountControl != none){
                amountControl.texts = amountText
              }
            }
          }
        }
      }
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.rightW = 300
      var.gridW = var.contentW - var.rightW - 24
      var.slotSize = 66
      var.gridGap = 6
      var.whGridW = 12 * var.slotSize + 11 * var.gridGap
      var.whGridH = 6 * var.slotSize + 5 * var.gridGap
      var.bpGridW = 12 * var.slotSize + 11 * var.gridGap
      var.bpGridH = 3 * var.slotSize + 2 * var.gridGap
      var.gridBgW = var.whGridW + 32
      var.toolW = 200
      var.gridAreaW = var.gridW - var.toolW - 30
      var.gridBgX = (var.gridAreaW - var.gridBgW) / 2
    open: |-
      Packet.send(var.packetId, 'refresh')
    # 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.rightW = 300
      var.gridW = var.contentW - var.rightW - 24
      var.slotSize = 66
      var.gridGap = 6
      var.whGridW = 12 * var.slotSize + 11 * var.gridGap
      var.whGridH = 6 * var.slotSize + 5 * var.gridGap
      var.bpGridW = 12 * var.slotSize + 11 * var.gridGap
      var.bpGridH = 3 * var.slotSize + 2 * var.gridGap
      var.gridBgW = var.whGridW + 32
      var.toolW = 200
      var.gridAreaW = var.gridW - var.toolW - 30
      var.gridBgX = (var.gridAreaW - var.gridBgW) / 2

# ─── 控件树 ────────────────────────────────────────────────────────
# 布局: 左导航(3项+搜索+分类滚动) + 中间主区(网格居中 + 右侧工具条竖排 + 底部操作区) + 右侧栏(仓库信息+我的仓库列表)
# 配色: 银灰金库 深底浅字 — 抬升面44,50,58 槽位52,58,66 选中64,72,82 描边100,110,120 输入/网格底36,42,50
# fontSize: 48(顶栏标题) / 36(区域标题/按钮/信息/输入/提示) — 全部标准档位
controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;20,24,28,110
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~100,110,120,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~180,190,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&fAXS 仓库"
              fontSize: 48
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                var.search = none
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ──────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~100,110,120,220
          导航仓库:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            children:
              仓库底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~180,190,200,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,255
              仓库高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~180,190,200,255
                  shape: ~round_rect
                  radius: 2
              仓库文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0仓库"
                  fontSize: 36
          导航银行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'bank')
            children:
              银行底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
              银行文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f银行"
                  fontSize: 36
                  through: true
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'manage')
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f管理"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 232
              width: 264
              height: 2
              normal: ~100,110,120,220
          检索标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 250
              texts: "~&f检索"
              fontSize: 36
          搜索框:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 296
              width: 272
              height: 48
            children:
              搜索框底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~36,42,50,225
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
              输入框:
                type: TextBox
                attribute:
                  x: 10
                  y: 8
                  width: 252
                  height: 36
                  length: 32
                  emptyText: ~&7搜索物品
                  fontSize: 42
                action:
                  textChange: |-
                    var.search = self.getContent()
                  enter: |-
                    Packet.send(var.packetId, 'search', var.search)
          搜索按钮组:
            type: HStack
            attribute:
              point: ~top_left
              x: 14
              y: 352
              width: 272
              height: 48
              spaceBetween: 10
            children:
              搜索:
                type: Canvas
                attribute:
                  width: 131
                  height: 48
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'search', var.search)
                children:
                  搜索底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~44,50,58,245
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
                  搜索字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f搜索"
                      fontSize: 36
                      through: true
              重置:
                type: Canvas
                attribute:
                  width: 131
                  height: 48
                action:
                  clickLeft: |-
                    var.search = none
                    Packet.send(var.packetId, 'search', none)
                children:
                  重置底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~44,50,58,245
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
                  重置字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f重置"
                      fontSize: 36
                      through: true
          分类标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 416
              texts: "~&f分类"
              fontSize: 36
          分类滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -12
              y: 460
              width: 10
              height: "var.viewH - 658"
              normal: ~40,44,52,225
              shape: ~round_rect
              radius: 5
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          分类滑块:
            type: Texture
            val: 分类滑块
            attribute:
              point: ~top_right
              x: -12
              y: 460
              width: 10
              height: 50
              normal: ~180,190,200,255
              maxDragY: "var.viewH - 708"
              shape: ~round_rect
              radius: 5
          分类滚动:
            type: Scroll
            val: 分类滚动
            attribute:
              point: ~top_left
              x: 14
              y: 460
              width: 258
              height: "var.viewH - 658"
              moveY: "self.parent['分类滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
