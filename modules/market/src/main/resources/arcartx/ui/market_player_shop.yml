                    attribute:
                      entryKey: 0.round()
                      entry: var.sellers[self.entryKey]
                      visible: self.entry != none
                      width: 254
                      height: 48
                    action:
                      clickLeft: |-
                        var.sellerUuid = self.entry['uuid']
                        Packet.send(var.packetId, 'pshop_list', '0', '', self.entry['uuid'])
                    children:
                      卖家项底:
                        type: Texture
                        attribute:
                          point: ~top_left
                          x: 3
                          y: 0
                          width: 248
                          height: 48
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['uuid'] == var.sellerUuid ? '110,144,116,210' : '35,76,63,210'"
