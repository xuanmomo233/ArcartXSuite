      # ── 内容区（天赋树画布）──────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~191,209,191,248
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~53,89,96,240

          页标题: {type: Text, attribute: {x: 32, y: 24, texts: '~&0技艺网络', fontSize: 64}}
          分配概览: {type: Text, attribute: {point: ~top_right, x: -32, y: 40, texts: "'&8Lv.' + var.playerLevel.round() + '  /  可用 ' + var.unspentTalentPoints.round() + ' 点'", fontSize: 36}}
          网络图例: {type: Text, attribute: {x: 32, y: 98, texts: '~&8从中心向外成长 · 亮边已激活 / 灰边未激活 · 悬停查看前置与加成', fontSize: 36}}
          # 滚动区：六系与联动节点常驻显示（拖拽滚动 + 滚轮缩放）
          滚动区:
            type: Scroll
            val: 天赋视口
            attribute:
              point: ~top_left
              x: 24
              y: 152
              width: "var.contentW - 48"
              height: "var.viewH - 376"
              moveX: "self.parent['横向滑块'].getDragXRatio()"
              moveY: "self.parent['竖向滑块'].getDragYRatio()"
            action:
              wheel: |-
                // 滚轮缩放：wheelValue > 0 放大，< 0 缩小
                oldZoom = var.zoomScale
                delta = self.wheelValue > 0 ? 0.1 : -0.1
                newZoom = oldZoom + delta
                if(newZoom < 0.5) {
                  newZoom = 0.5
                }
                if(newZoom > 2.0) {
                  newZoom = 2.0
                }
                if(newZoom != oldZoom){
                  // 保持滚动位置：通过滑块 ratio 换算
                  viewW = var.contentW - 48
                  viewH = var.viewH - 376
                  oldRangeX = var.canvasW * oldZoom - viewW
                  newRangeX = var.canvasW * newZoom - viewW
                  oldRangeY = var.canvasH * oldZoom - viewH
                  newRangeY = var.canvasH * newZoom - viewH
                  oldSX = val.横向滑块.getDragXRatio()
                  oldSY = val.竖向滑块.getDragYRatio()
                  newSX = 0
                  newSY = 0
                  if(newRangeX > 0){
                    newSX = ((math.max(0, oldRangeX) * oldSX + viewW / 2) * newZoom / oldZoom - viewW / 2) / newRangeX
                    if(newSX < 0) {
                      newSX = 0
                    }
                    if(newSX > 1) {
                      newSX = 1
                    }
                  } else {
                    newSX = 0
                  }
                  if(newRangeY > 0){
                    newSY = ((math.max(0, oldRangeY) * oldSY + viewH / 2) * newZoom / oldZoom - viewH / 2) / newRangeY
                    if(newSY < 0) {
                      newSY = 0
                    }
                    if(newSY > 1) {
                      newSY = 1
                    }
                  } else {
                    newSY = 0
                  }
                  var.zoomScale = newZoom
                  var.isDragging = false
                  // 重建后设置滑块位置
                  val.横向滑块.setDragXRatio(newSX)
                  val.竖向滑块.setDragYRatio(newSY)
                }
            children:
              树画布:
                val: 树画布
                type: Canvas
                attribute:
                  width: "var.canvasW * var.zoomScale"
                  height: "var.canvasH * var.zoomScale"
                children:
                  # 树标题模板
                  树标题模板:
                    type: Canvas
                    val: 树标题模板
                    attribute:
                      width: "(200 * var.zoomScale).round()"
                      height: "(40 * var.zoomScale).round()"
                      treeId: 'steady'
                      visible: false
                    children:
                      树标题文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "var.treeNames[self.parent.treeId] != none ? var.treeNames[self.parent.treeId] : '&7未知'"
                          fontSize: 36
                          through: true
                  # 天赋节点模板（正方形 Slot + 连线 + Tooltip）
                  # tick 中 copy 后设置 entryId/treeId/isLink
                  天赋节点模板:
                    type: Canvas
                    val: 天赋节点模板
                    attribute:
                      point: ~top_left
                      entryId: ''
                      worldX: 0
                      worldY: 0
                      x: self.worldX * var.zoomScale
                      y: self.worldY * var.zoomScale
                      treeId: 'steady'
                      isLink: false
                      entry: "var.allNodeById[self.entryId]"
                      visible: "self.entry != none"
                      width: "var.nodeSize * var.zoomScale"
                      height: "var.nodeSize * var.zoomScale"
                      brightColor: ~139,192,169,255
                      dimColor: ~66,77,88,255
                      lineColor: "self.entry != none && self.entry['unlocked'] == true ? self.brightColor : self.dimColor"
                      # 节点等级状态：0=未点亮, 1~maxLevel-1=部分升级, maxLevel=满级
                      nodeLevel: "self.entry != none && self.entry['level'] != none ? type.toNumber(self.entry['level']).round() : 0"
                      nodeMaxLevel: "self.entry != none && self.entry['maxLevel'] != none ? type.toNumber(self.entry['maxLevel']).round() : 1"
                      isMaxed: "self.nodeLevel >= self.nodeMaxLevel"
                    children:
                      # 节点图标（Slot 显示物品 icon）
                      节点图标:
                        type: Slot
                        attribute:
                          point: ~middle_center
                          width: "62 * var.zoomScale"
                          height: "62 * var.zoomScale"
                          slotType: ~Icon
                          itemScale: 0.75
                          normal: ~23,49,64,245
                          shape: ~round_rect
                          radius: "(10 * var.zoomScale).round()"
                        effect:
                          stroke:
                            width: "3 * var.zoomScale"
                            color: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? self.parent.brightColor : self.parent.dimColor"
                        action:
                          clickLeft: |-
                            var.pressedNode = self.parent.entryId
                      # 等级标签（右下角显示 当前等级/最大等级）
                      等级标签:
                        type: Canvas
                        attribute:
                          point: ~bottom_right
                          x: "(-2 * var.zoomScale).round()"
                          y: "(-2 * var.zoomScale).round()"
                          width: 80
                          height: 42
                          through: true
                          visible: "var.zoomScale >= 1.5 && self.parent.entry != none && self.parent.entry['unlocked'] == true && self.parent.nodeMaxLevel > 1"
                        children:
                          等级标签底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.parent.isMaxed ? '40,80,40,220' : '20,30,45,220'"
                              shape: ~round_rect
                              radius: "(4 * var.zoomScale).round()"
                          等级文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "self.parent.parent.nodeLevel + '/' + self.parent.parent.nodeMaxLevel"
                              fontSize: 36
                              through: true
                  # 联动连线段模板（作为树画布直接子控件，避免节点 Canvas 裁剪）
                  # tick 中 copy 后设置世界坐标 x/y/width/height/normal/visible
                  联动连线段:
                    type: Texture
                    val: 联动连线段
                    attribute:
                      point: ~top_left
                      worldX: 0
                      worldY: 0
                      worldLength: 1
                      childId: ~
                      brightColor: ~139,192,169,255
                      dimColor: ~160,160,170,200
                      x: self.worldX * var.zoomScale
                      y: self.worldY * var.zoomScale
                      width: self.worldLength * var.zoomScale
                      height: var.lineW * var.zoomScale
                      normal: "var.allNodeById[self.childId] != none && var.allNodeById[self.childId]['unlocked'] == true ? self.brightColor : self.dimColor"
                      visible: false
                      through: true
          # 操作提示（拖拽滚动 + 滚轮缩放）
          操作提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 16
              y: -32
              texts: "var.actionBusy ? '&8正在保存天赋...' : '&8拖拽移动 · 滚轮缩放 · R 回到中心 · 点击节点分配'"
              fontSize: 36
          # 隐藏滑块：驱动 Scroll 的 moveX/moveY（不可见但保留拖拽功能）
          竖向滑块:
            type: Texture
            val: 竖向滑块
            attribute:
              point: ~top_right
              x: -2
              y: 152
              width: 10
              height: 80
              normal: ~53,89,96,200
              maxDragY: "math.max(0, var.viewH - 456)"
          横向滑块:
            type: Texture
            val: 横向滑块
            attribute:
              point: ~bottom_left
              x: 24
              y: -12
              width: 80
              height: 10
              normal: ~53,89,96,200
              maxDragX: "math.max(0, var.contentW - 128)"
