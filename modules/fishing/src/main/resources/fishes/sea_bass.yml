# 鱼类定义：海鲈鱼
# 海鲈鱼是一种常见鱼类，全年可捕获，出现在海洋和河流中，白天活跃，难度最低
# 鱼类文件位于 fishes/ 目录，每个文件定义一种鱼

id: "sea_bass"                 # 鱼类唯一标识符
display-name: "海鲈鱼"          # 显示名称
rarity: common                 # 稀有度等级（common=常见）
min-size: 10                   # 最小尺寸（厘米）
max-size: 50                   # 最大尺寸（厘米）
base-price: 80                 # 基础售价（游戏货币）
base-xp: 15                    # 基础经验值（捕获时获得）
seasons: [spring, summer, fall, winter] # 可捕获季节（全年四季均可）
weathers: [clear, rain]        # 可捕获天气（晴天、雨天）
water-types: [ocean, river]    # 可捕获水域类型（海洋、河流）
time-ranges:                   # 可捕获时间段
  - start: "06:00"             # 开始时间（06:00，清晨）
    end: "20:00"               # 结束时间（20:00，夜间前，白天时段）
item:                          # 捕获后掉落的物品定义
  source: "minecraft"          # 物品来源（minecraft=原版物品）
  item-id: "cod"               # 原版物品ID（鳕鱼）
  amount: 1                    # 物品数量
difficulty: 30                 # 钓鱼难度（0-100，最低难度，适合新手）
behaviors:                     # 小游戏中鱼的行为模式及权重
  - type: smooth               # 平滑型：鱼缓慢平稳移动
    weight: 0.6                # 权重0.6（主要行为）
  - type: dart                 # 突进型：鱼快速跳跃移动
    weight: 0.4                # 权重0.4（次要行为）
