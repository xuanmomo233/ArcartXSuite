# AXS Extra Backpack
# 科幻风三栏背包界面：左侧装备面板 + 中央角色展示（相机偏转第三人称）
# + 右侧背包面板（搜索/原版网格/扩容网格/快捷栏）。
# 交互方式：纯拖动 —— 原版区为原生槽位（Backpack/Container），扩容区为 ArcartX
# 真实扩展槽位（~Extra，id=axs_eb_<分类>_<序号>），放取/半组/单放/交换全部由
# ArcartX 原生处理；服务端负责按分类匹配规则校验放入合法性。

ui:
  isHud: false
  defaultOpen: false
  match:
    - 物品栏界面
  hide:
    # 原版 HUD（背包打开期间全部遮蔽）
    - hotbar
    - crosshair
    - player_state
    - experience_bar
    - item_name
    - jump_bar
    - mount_health
    - potion_icons
    - scoreboard
    - chat_panel
    - player_list
    - subtitles
    # 自定义 HUD/UI（不存在的 id 会被忽略，覆盖本服已部署项）
    - HUD
    - online
    - 聊天栏
    - 聊天栏-全局
    - 聊天栏-过滤
    - 聊天输入框
    - 聊天输入框-按钮版
    - 纯色块HUD
    - 纯色块HUD二改
    - 纯色块计分板
    - 纯色块TAB配置
    - 鸽蛋TAB配置
    - 状态栏hud
    - 菜单状态栏HUD
    - 简约状态栏hud
    - 定制HUD
    - 定制的hud
    - 击杀命中特效
    - Wardrobe:main
    - Appearance:main
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 服务端回包 ID，用于客户端 Packet.send 回传
    #   - action_token: 操作令牌，防止重复提交
    #   - activeCategory: 当前激活的分类页 ID
    #   - categories: 分类页数据 map (key=分类索引, value=分类详情)
    #   - categoryCount: 分类页总数
    #   - slotCount: 当前分类页槽位数量（扩容槽位物品由 ~Extra 槽位自行渲染）
    #   - used: 已使用槽位数
    #   - capacityText: 容量显示文本 (如 "9/27")
    #   - maxCapacity: 最大容量
    #   - currencyText: 顶栏货币余额文本 (如 "点券 12,345   金币 678")
    #   - canBuySlots: 是否可以购买更多槽位
    #   - remainingSlots: 剩余可购买槽位数
    #   - buySlotsText: 购买槽位提示文本
    #   - passwordPanel: 密码面板状态 (visible/mode)
    #   - destroyPanel: 销毁确认面板状态 (visible)
    update: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.activeCategory = packet['activeCategory']
      var.categories = packet['categories']
      var.categoryCount = packet['categoryCount']
      var.slotCount = packet['slotCount']
      var.used = packet['used']
      var.capacityText = packet['capacityText']
      var.maxCapacity = packet['maxCapacity']
      var.currencyText = packet['currencyText']
      var.canBuySlots = packet['canBuySlots']
      var.remainingSlots = packet['remainingSlots']
      var.buySlotsText = packet['buySlotsText']
      var.passwordPanel = packet['passwordPanel']
      var.destroyPanel = packet['destroyPanel']
      // 分类页签动态重建（模板 项 为索引 0）
      分类数 = var.categoryCount.round()
      现有分类数 = val.分类标签行.childrenCount() - 1
      if(现有分类数 != 分类数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.分类标签行.childrenCount() > 1){
          val.分类标签行.get(1).remove()
        }
        if(分类数 > 1){
          for(序号 in range(1, 分类数 - 1)){
            if(val.分类标签行['项'] != none) {
              项 = val.分类标签行['项'].copy('分类项_' + var.刷新轮次 + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      // 扩容槽位重建统一推迟到 tick（update/滚轮翻页/resize 共用同一入口）
      var.待重建 = true
      // 重建后需重新套用搜索过滤
      var.待过滤 = true
      // update 包到达，重置防抖标志
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    tick: |-
      // 相机偏转保持：玩家转向后重设状态相机（与 menu_esc 相同模式）
      if(server.player_yaw != var.yaw){
        var.yaw = server.player_yaw
        Camera.setState(-0.78, -0.45, 1.9, 205, 0.0, 600)
        Camera.setThirdPerson(true)
      }
      // 主武器 Icon 槽随主手物品变化刷新
      mh = Player.getMainHandItem()
      mk = mh == none ? '' : mh.getName() + '#' + mh.getCount()
      if(mk != var.主手缓存){
        var.主手缓存 = mk
        val.主武器槽.setItemIcon(mh == none ? '' : mh.toJson())
      }
      // 搜索过滤：对原版/扩容/快捷三网格逐槽位比对物品名
      if(var.待过滤 || (var.searchText != none && var.searchText != '')){
        var.待过滤 = false
        q = var.searchText == none ? '' : var.searchText
        for(i in range(0, val.原版背包网格.childrenCount() - 1)){
          sl = val.原版背包网格.get(i)
          st = sl.getSlotItemStack()
          nm = st == none ? '' : st.getName()
          sl.alpha = q == '' || nm.contains(q) ? 1 : 0.3
        }
        for(i in range(0, val.快捷栏网格.childrenCount() - 1)){
          sl = val.快捷栏网格.get(i)
          st = sl.getSlotItemStack()
          nm = st == none ? '' : st.getName()
          sl.alpha = q == '' || nm.contains(q) ? 1 : 0.3
        }
        for(i in range(1, val.扩容网格.childrenCount() - 1)){
          sl = val.扩容网格.get(i)
          st = sl.getSlotItemStack()
          nm = st == none ? '' : st.getName()
          sl.alpha = q == '' || nm.contains(q) ? 1 : 0.3
        }
      }
      // 扩容槽位分页重建统一入口：update 包、滚轮翻页、resize 都置 var.待重建 后在此执行
      if(var.待重建){
        var.待重建 = false
        if(var.每页槽位数 == none){
          var.每页槽位数 = 54
        }
        if(var.页码增量 != 0){
          var.页码 = var.页码 + var.页码增量
          var.页码增量 = 0
        }
        if(var.activeCategory != var.已建分类){
          var.页码 = 0
        }
        槽位数 = var.slotCount == none ? 0 : var.slotCount.round()
        var.总页数 = 1
        while(槽位数 > var.总页数 * var.每页槽位数){
          var.总页数 = var.总页数 + 1
        }
        if(var.页码 > var.总页数 - 1){
          var.页码 = var.总页数 - 1
        }
        if(var.页码 < 0){
          var.页码 = 0
        }
        起始序号 = var.页码 * var.每页槽位数
        本页槽位数 = 槽位数 - 起始序号
        if(本页槽位数 > var.每页槽位数){
          本页槽位数 = var.每页槽位数
        }
        现有槽位数 = val.扩容网格.childrenCount() - 1
        if(现有槽位数 != 本页槽位数 || var.已建分类 != var.activeCategory || var.已建页码 != var.页码){
          var.刷新轮次 = var.刷新轮次 + 1
          while(val.扩容网格.childrenCount() > 1){
            val.扩容网格.get(1).remove()
          }
          if(var.activeCategory != none && var.activeCategory != '' && 本页槽位数 > 0){
            for(序号 in range(0, 本页槽位数 - 1)){
              if(val.扩容网格['扩容槽位'] != none) {
                slot = val.扩容网格['扩容槽位'].copy('扩容槽位_' + var.刷新轮次 + '_' + 序号.round())
                slot.id = 'axs_eb_' + var.activeCategory + '_' + (起始序号 + 序号).round()
                slot.visible = true
              }
            }
          }
          var.已建分类 = var.activeCategory
          var.已建页码 = var.页码
          var.待过滤 = true
        }
      }
    load: |-
      var.刷新轮次 = 0
      var.packetId = 'AXS_BACKPACK'
      var.buyAmount = 1
      var.capacityText = '0/0'
      var.maxCapacity = 0
      var.currencyText = ''
      var.slotCount = 0
      var.activeCategory = ''
      var.已建分类 = ''
      var.passwordCurrent = ''
      var.passwordNew = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.passwordPanel = {'visible': false, 'mode': ''}
      var.destroyPanel = {'visible': false}
      var.设置面板开 = false
      var.searchText = ''
      var.待过滤 = false
      var.yaw = -9999
      var.主手缓存 = none
      // Adaptive 以 1920x1080 等比缩放，换算设计坐标系下的可用视口
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.页码 = 0
      var.页码增量 = 0
      var.总页数 = 1
      var.已建页码 = -1
      var.待重建 = false
      // 每页行数按可视高度自适应：扩容网格顶边 474，快捷栏顶边约在面板高-140
      面板高 = var.viewH - 200
      行数 = 1
      while(474 + (行数 + 1) * 80 - 10 <= 面板高 - 140){
        行数 = 行数 + 1
      }
      var.每页槽位数 = 行数 * 9
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      面板高 = var.viewH - 200
      行数 = 1
      while(474 + (行数 + 1) * 80 - 10 <= 面板高 - 140){
        行数 = 行数 + 1
      }
      var.每页槽位数 = 行数 * 9
      var.待重建 = true
    open: |-
      Packet.send(var.packetId, 'refresh')
      Camera.setState(-0.78, -0.45, 1.9, 205, 0.0, 600)
      Camera.setThirdPerson(true)
    close: |-
      async {
        Camera.setThirdPerson(false)
        Camera.clearState()
      }
    keyPress: |-
      if(self.currentKeyPress() == "ESCAPE" || self.currentKeyPress() == "E"){
        Camera.setThirdPerson(false)
        Camera.clearState()
        Screen.close()
      }

