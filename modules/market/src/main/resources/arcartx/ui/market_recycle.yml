              texts: ~&0可回收物品
              fontSize: 48
              through: true
          空物品提示:
            type: Text
            attribute:
              point: ~middle_center
              x: 0
              y: -40
              fontSize: 64
              visible: var.recyclables == none || var.recyclables.keys().length == 0
              texts: ~&8背包中没有可回收物品
              through: true
          物品滑轨:
