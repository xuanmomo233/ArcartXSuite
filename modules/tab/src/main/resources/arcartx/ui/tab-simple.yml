# Suite 在线名单 HUD（简略版）。
ui:
  isHud: true
  hide:
    - player_list
  defaultOpen: true
  escClose: false
  packetHandler:
    tab-players: |-
      if (var.名单显示 && packet['custom'] != none) {
        if (packet['custom'] == true) {
          var.自定义名单 = true
          var.在线名单 = packet['rows'] != none ? packet['rows'] : []
          var.在线人数 = var.在线名单.filter(-> { return args[0]['header'] != true }).size()
          var.名单已收到 = true
        } elif (packet['custom'] == false) {
          var.自定义名单 = false
          var.本服名单许可 = packet['allowed']
          var.读取原版名单()
          var.名单已收到 = true
        }
      }
  action:
    load: |-
      var.名单显示 = false
      var.名单已收到 = false
      var.自定义名单 = false
      var.本服名单许可 = none
      var.在线名单 = []
      var.在线人数 = 0
      var.读取原版名单 = -> {
        原版名单 = Player.getTabPlayers()
        if (var.本服名单许可 != none) {
          原版名单 = 原版名单.filter(-> { return var.本服名单许可.contains(args[0]['uuid']) })
        }
        var.在线名单 = 原版名单
        var.在线人数 = 原版名单.size()
      }
    keyPress: |-
      if (self.currentKeyPress() == "TAB" && !var.名单显示 && !Screen.isOpen()) {
        var.名单显示 = true
        Packet.send('AXS_TabPlayersRequest', 'open')
      }
    keyRelease: |-
      if (self.currentKeyReleased() == "TAB") {
        var.名单显示 = false
        var.名单已收到 = false
        var.在线名单 = []
        var.在线人数 = 0
      }

tasks:
  request-player-list:
    type: loop
    time: 1600
    cycle: 1600
    run: |-
      if (var.名单显示 && !Screen.isOpen()) {
        Packet.send('AXS_TabPlayersRequest', 'refresh')
      }
  refresh-player-list:
    type: loop
    time: 250
    cycle: 250
    run: |-
      if (var.名单显示 && var.名单已收到 && !var.自定义名单 && !Screen.isOpen()) {
        var.读取原版名单()
      }

controls:
  自适应布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      名单面板:
        type: Texture
        attribute:
          point: ~top_center
          y: 40
          width: 40 + 250 * Math.max(1, Math.ceil(var.在线名单.size() / 16))
          height: 73 + 37 * Math.min(16, var.在线名单.size())
          normal: ~Frosted:30;0,0,0,255
          shape: ~round_rect
          radius: 20
          visible: var.名单显示 && var.名单已收到 && !Screen.isOpen()
        effect:
          stroke:
            width: 3
            color: ~0,0,0,255
        children:
          标题:
            type: Text
            attribute:
              x: 22
              y: 15
              fontSize: 32
              texts: "'§a在线玩家：' + var.在线人数.round(0)"
          玩家名单:
            type: RepeatGrid
            attribute:
              x: 22
              y: 54
              items: var.在线名单
              key: ~uuid
              flow: ~column
              row: 16
              maxSize: 80
              spaceBetweenX: 4
              spaceBetweenY: 3
            children:
              玩家行:
                type: Canvas
                attribute:
                  width: 246
                  height: 34
                children:
                  行底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      shape: ~round_rect
                      radius: 10
                      normal: "(var.自定义名单 && self.parent().item['header'] == true) ? '64,64,64,255' : '95,95,95,255'"
                  分组标题:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 8
                      fontSize: 24
                      visible: "var.自定义名单 && self.parent().item['header'] == true"
                      texts: "'§a' + self.parent().item['displayName']"
                  名称:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 8
                      fontSize: 24
                      visible: "!var.自定义名单 || self.parent().item['header'] != true"
                      texts: "(self.parent().item['spectator'] ? '§7' : '§f') + self.parent().item['displayName']"
