# AXS 资源说明
# 用途: Abyss 进本确认框 —— 副本信息确认 + 进入/取消
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/dungeonId/dungeonName/difficulty/desc0..2
    #         minPlayers/maxPlayers/staminaCost/moneyCost/cooldown/timeLimit
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonId = packet['dungeonId']
      var.dungeonName = packet['dungeonName']
      var.difficulty = packet['difficulty']
      var.desc0 = packet['desc0']
      var.desc1 = packet['desc1']
      var.desc2 = packet['desc2']
      var.minPlayers = packet['minPlayers']
      var.maxPlayers = packet['maxPlayers']
      var.staminaCost = packet['staminaCost']
      var.moneyCost = packet['moneyCost']
      var.cooldown = packet['cooldown']
      var.timeLimit = packet['timeLimit']
    # Generation-bound close notification prevents stale close events cancelling a newly opened screen.

  action:
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'confirm', var.actionToken, var.viewNonce)
      }
    load: |-
      var.viewNonce = ''
      var.packetId = 'abyss'
      var.actionToken = ''
      var.dungeonId = ''
      var.dungeonName = ''
      var.difficulty = ''
      var.desc0 = ''
      var.desc1 = ''
      var.desc2 = ''
      var.minPlayers = 0
      var.maxPlayers = 0
      var.staminaCost = 0
      var.moneyCost = 0
      var.cooldown = 0
      var.timeLimit = 0
      var.accent = '186,140,232,255'
      var.accentDim = '96,80,140,190'
    open: |-
      Packet.send('abyss', 'view_ready', 'confirm')
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
controls:
  全屏遮罩:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:20;12,14,18,190
      through: true
  自适应全局布局:
