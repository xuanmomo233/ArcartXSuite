# -------- 累计登录 --------
# 赛季累计登录 30 天
# limits.max-per-day: 1 确保每天只计 1 次，无论玩家当天进服多少次
# loginview 模块存在时走 EventBus（登录成功），不存在时走 PlayerJoinEvent
season-login-30:
  display-name: "坚持不懈"
  description: "本赛季累计登录30天"
  difficulty: normal
  event-topic: "axs.loginview.login_success"
  bukkit-event:
    event-class: "org.bukkit.event.player.PlayerJoinEvent"
  required-count: 30
  base-xp-reward: 3000
  conditions: []
  increment-strategy:
    type: fixed
    value: 1
  limits:
    max-per-day: 1

