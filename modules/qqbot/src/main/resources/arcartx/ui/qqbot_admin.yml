# QQBot UI：服务端验证会话、权限和全部写操作；row0..row9 为明确复制的固定模板。
ui:
  isHud: false
  defaultOpen: false
  through: false
  background: true
  escClose: true
  closeDied: true
  screenScale: true
  show: true
  level: 15
  action:
    load: |-
      var.busy = true
      var.tab = 'dashboard'
      var.bindings = {}
      var.bindPage = 0
      var.bindPages = 1
      var.bindTotal = 0
      var.totalBindings = 0
      var.onlinePlayers = 0
      var.maxPlayers = 0
      var.groupCount = 0
      var.confirmCommand = false
  packetHandler:
    init: |-
      var.busy = packet['busy']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.botConnected = packet['botConnected']
      var.totalBindings = packet['totalBindings']
      var.onlinePlayers = packet['onlinePlayers']
      var.maxPlayers = packet['maxPlayers']
      var.groupCount = packet['groupCount']
      var.bindings = packet['bindings']
      var.bindPage = packet['page']
      var.bindPages = packet['pages']
      var.bindTotal = packet['total']
      var.query = packet['query']
      var.canExecute = packet['canExecute']
      var.result = packet['message']
      var.resultType = packet['type']
      var.unbindName = none
      while(val.bindingList.childrenCount() > 1){ val.bindingList.get(1).remove() }
      for(i in range(1, 9)){
        row = val.bindingList['绑定行'].copy('绑定行' + i.round())
        row.entryKey = 'row' + i.round()
      }
    update: |-
      var.busy = packet['busy']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.botConnected = packet['botConnected']
      var.totalBindings = packet['totalBindings']
      var.onlinePlayers = packet['onlinePlayers']
      var.maxPlayers = packet['maxPlayers']
      var.groupCount = packet['groupCount']
      var.bindings = packet['bindings']
      var.bindPage = packet['page']
      var.bindPages = packet['pages']
      var.bindTotal = packet['total']
      var.query = packet['query']
      var.canExecute = packet['canExecute']
      var.result = packet['message']
      var.resultType = packet['type']
      var.unbindName = none
    bindings: |-
      var.busy = packet['busy']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.botConnected = packet['botConnected']
      var.totalBindings = packet['totalBindings']
      var.onlinePlayers = packet['onlinePlayers']
      var.maxPlayers = packet['maxPlayers']
      var.groupCount = packet['groupCount']
      var.bindings = packet['bindings']
      var.bindPage = packet['page']
      var.bindPages = packet['pages']
      var.bindTotal = packet['total']
      var.query = packet['query']
      var.canExecute = packet['canExecute']
      var.result = packet['message']
      var.resultType = packet['type']
      var.unbindName = none
    result: |-
      var.busy = packet['busy']
      var.result = packet['message']
      var.resultType = packet['type']
controls:
  全局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1000
          height: 720
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~22,29,40,248
              shape: ~round_rect
              radius: 18
          标题:
            type: Text
            attribute:
              x: 30
              y: 24
              texts: "\"QQBot 管理\""
              fontSize: 54
              limit: 35
              visible: "true"
              through: true
          关闭:
            type: Canvas
            attribute:
              x: 910
              y: 22
              width: 60
              height: 48
              visible: "true"
            action:
              clickLeft: |-
                self.close()
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~60,130,180,245
                  hover: ~80,155,205,255
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&f×'"
                  fontSize: 36
                  through: true
          概览:
            type: Canvas
            attribute:
              x: 30
              y: 90
              width: 160
              height: 48
              visible: "true"
            action:
              clickLeft: |-
                var.tab = 'dashboard'
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~60,130,180,245
                  hover: ~80,155,205,255
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&f运行概览'"
                  fontSize: 36
                  through: true
          绑定:
            type: Canvas
            attribute:
              x: 206
              y: 90
              width: 160
              height: 48
              visible: "true"
            action:
              clickLeft: |-
                var.tab = 'bindings'
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~60,130,180,245
                  hover: ~80,155,205,255
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&f绑定管理'"
                  fontSize: 36
                  through: true
          命令:
            type: Canvas
            attribute:
              x: 382
              y: 90
              width: 160
              height: 48
              visible: "var.canExecute"
            action:
              clickLeft: |-
                var.tab = 'console'
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~60,130,180,245
                  hover: ~80,155,205,255
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&f控制台'"
                  fontSize: 36
                  through: true
          刷新:
            type: Canvas
            attribute:
              x: 790
              y: 90
              width: 180
              height: 48
              visible: "!var.busy"
            action:
              clickLeft: |-
                if(!var.busy && var.actionToken != none){
                  var.busy = true
                  Packet.send(var.packetId, 'refresh', var.actionToken)
                }
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~60,130,180,245
                  hover: ~80,155,205,255
                  shape: ~round_rect
                  radius: 10
              字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&f刷新'"
                  fontSize: 36
                  through: true
          概览页:
            type: Canvas
            attribute:
              x: 30
              y: 150
              width: 940
              height: 480
              visible: "var.tab == 'dashboard'"
            children:
              连接:
                type: Text
                attribute:
                  x: 0
                  y: 10
                  texts: "var.botConnected ? '&a● QQ 实现端已连接' : '&c● QQ 实现端未连接'"
                  fontSize: 48
                  limit: 60
                  visible: "true"
                  through: true
              人数:
                type: Text
                attribute:
                  x: 0
                  y: 90
                  texts: "'&7在线玩家：&f' + var.onlinePlayers.round() + ' / ' + var.maxPlayers.round()"
                  fontSize: 36
                  limit: 60
                  visible: "true"
                  through: true
              绑定数:
                type: Text
                attribute:
                  x: 0
                  y: 150
                  texts: "'&7全部绑定：&f' + var.totalBindings.round()"
                  fontSize: 36
                  limit: 60
                  visible: "true"
                  through: true
              群数:
                type: Text
                attribute:
                  x: 0
                  y: 210
                  texts: "'&7配置群数：&f' + var.groupCount.round()"
                  fontSize: 36
                  limit: 60
                  visible: "true"
                  through: true
              故障教学:
                type: Text
                attribute:
                  x: 0
                  y: 300
                  texts: "'&7连接问题：/axs qqbot status，然后检查实现端登录状态和访问令牌。'"
                  fontSize: 32
                  limit: 55
                  visible: "true"
                  through: true
              复核教学:
                type: Text
                attribute:
                  x: 0
                  y: 354
                  texts: "'&7兑换复核：/axs qqbot redemptions list；先查投递结果，再人工决议。'"
                  fontSize: 32
                  limit: 55
                  visible: "true"
                  through: true
          绑定页:
            type: Canvas
            attribute:
              x: 30
              y: 150
              width: 940
              height: 480
              visible: "var.tab == 'bindings'"
            children:
              搜索输入:
                type: Canvas
                attribute:
                  x: 0
                  y: 0
                  width: 700
                  height: 50
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~35,44,57,245
                      shape: ~round_rect
                      radius: 8
                  框:
                    type: TextBox
                    attribute:
                      x: 12
                      y: 6
                      width: 676
                      height: 38
                      length: 32
                      fontSize: 36
                      emptyText: "~玩家名或QQ号（最多1000条匹配）"
                    action:
                      textChange: |-
                        var.searchInput = self.getContent()
              搜索:
                type: Canvas
                attribute:
                  x: 720
                  y: 0
                  width: 220
                  height: 48
                  visible: "!var.busy"
                action:
                  clickLeft: |-
                    if(!var.busy && var.actionToken != none){
                      var.busy = true
                      Packet.send(var.packetId, 'search_binding', var.actionToken, var.searchInput)
                    }
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~60,130,180,245
                      hover: ~80,155,205,255
                      shape: ~round_rect
                      radius: 10
                  字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f搜索'"
                      fontSize: 36
                      through: true
              列表区:
                type: Canvas
                attribute:
                  y: 66
                  width: 940
                  height: 302
                children:
                  滑块:
                    type: Texture
                    attribute:
                      point: ~top_right
                      width: 10
                      height: 64
                      maxDragY: 238
                      normal: ~100,140,170,230
                      shape: ~round_rect
                      radius: 5
                  内容:
                    type: Scroll
                    attribute:
                      width: 920
                      height: 302
                      moveY: self.parent['滑块'].getDragYRatio()
                    children:
                      绑定列表:
                        val: bindingList
                        type: VStack
                        attribute:
                          width: 910
                          spaceBetween: 6
                        children:
                          绑定行:
                            type: Texture
                            attribute:
                              entryKey: ~row0
                              entry: var.bindings[self.entryKey]
                              visible: self.entry != none
                              width: 900
                              height: 64
                              normal: ~32,42,55,245
                              shape: ~round_rect
                              radius: 8
                            children:
                              玩家:
                                type: Text
                                attribute:
                                  x: 12
                                  y: 10
                                  texts: "self.parent.entry != none ? '&f' + self.parent.entry['name'] : ''"
                                  fontSize: 36
                                  limit: 16
                                  visible: "true"
                                  through: true
                              QQ:
                                type: Text
                                attribute:
                                  x: 270
                                  y: 10
                                  texts: "self.parent.entry != none ? '&7QQ &f' + self.parent.entry['qq'] : ''"
                                  fontSize: 32
                                  limit: 20
                                  visible: "true"
                                  through: true
                              时间:
                                type: Text
                                attribute:
                                  x: 520
                                  y: 14
                                  texts: "self.parent.entry != none ? '&8' + self.parent.entry['time'] : ''"
                                  fontSize: 28
                                  limit: 18
                                  visible: "true"
                                  through: true
                              解绑:
                                type: Canvas
                                attribute:
                                  x: 750
                                  y: 8
                                  width: 130
                                  height: 48
                                  visible: "!var.busy"
                                action:
                                  clickLeft: |-
                                    if(!var.busy){
                                      var.unbindName = self.parent.entry['name']
                                      var.unbindProfile = self.parent.entry['profile']
                                    }
                                children:
                                  底:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: ~150,70,60,245
                                      hover: ~80,155,205,255
                                      shape: ~round_rect
                                      radius: 10
                                  字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      texts: "'&f解绑'"
                                      fontSize: 36
                                      through: true
              空记录:
                type: Text
                attribute:
                  x: 30
                  y: 160
                  texts: "'&7没有匹配的绑定记录。'"
                  fontSize: 36
                  limit: 60
                  visible: "var.bindTotal == 0"
                  through: true
              上一页:
                type: Canvas
                attribute:
                  x: 0
                  y: 390
                  width: 160
                  height: 48
                  visible: "var.bindPage > 0 && !var.busy"
                action:
                  clickLeft: |-
                    if(!var.busy && var.actionToken != none){
                      var.busy = true
                      Packet.send(var.packetId, 'fetch_bindings', var.actionToken, (var.bindPage - 1).round())
                    }
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~60,130,180,245
                      hover: ~80,155,205,255
                      shape: ~round_rect
                      radius: 10
                  字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f上一页'"
                      fontSize: 36
                      through: true
              页码:
                type: Text
                attribute:
                  x: 190
                  y: 398
                  texts: "'&7第 ' + (var.bindPage + 1).round() + ' / ' + var.bindPages.round() + ' 页，共 ' + var.bindTotal.round() + ' 条'"
                  fontSize: 32
                  limit: 60
                  visible: "true"
                  through: true
              下一页:
                type: Canvas
                attribute:
                  x: 720
                  y: 390
                  width: 220
                  height: 48
                  visible: "var.bindPage + 1 < var.bindPages && !var.busy"
                action:
                  clickLeft: |-
                    if(!var.busy && var.actionToken != none){
                      var.busy = true
                      Packet.send(var.packetId, 'fetch_bindings', var.actionToken, (var.bindPage + 1).round())
                    }
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~60,130,180,245
                      hover: ~80,155,205,255
                      shape: ~round_rect
                      radius: 10
                  字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f下一页'"
                      fontSize: 36
                      through: true
              解绑确认:
                type: Canvas
                attribute:
                  y: 80
                  width: 940
                  height: 250
                  visible: var.unbindName != none
                children:
                  遮罩:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~34,42,54,255
                      shape: ~round_rect
                      radius: 12
                  确认文字:
                    type: Text
                    attribute:
                      x: 24
                      y: 24
                      texts: "'&e确认解除 ' + var.unbindName + ' 的 QQ 绑定？'"
                      fontSize: 36
                      limit: 45
                      visible: "true"
                      through: true
                  确认后果:
                    type: Text
                    attribute:
                      x: 24
                      y: 80
                      texts: "'&7该玩家的服务器准入要求将由认证服务重新评估。'"
                      fontSize: 32
                      limit: 50
                      visible: "true"
                      through: true
                  确认:
                    type: Canvas
                    attribute:
                      x: 24
                      y: 150
                      width: 200
                      height: 48
                      visible: "!var.busy"
                    action:
                      clickLeft: |-
                        if(!var.busy && var.actionToken != none){
                          var.busy = true
                        Packet.send(var.packetId, 'admin_unbind', var.actionToken, var.unbindProfile)
                        }
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~150,70,60,245
                          hover: ~80,155,205,255
                          shape: ~round_rect
                          radius: 10
                      字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "'&f确认解绑'"
                          fontSize: 36
                          through: true
                  取消:
                    type: Canvas
                    attribute:
                      x: 246
                      y: 150
                      width: 180
                      height: 48
                      visible: "!var.busy"
                    action:
                      clickLeft: |-
                        var.unbindName = none
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~65,75,90,245
                          hover: ~80,155,205,255
                          shape: ~round_rect
                          radius: 10
                      字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "'&f取消'"
                          fontSize: 36
                          through: true
          命令页:
            type: Canvas
            attribute:
              x: 30
              y: 150
              width: 940
              height: 480
              visible: "var.tab == 'console' && var.canExecute"
            children:
              命令说明:
                type: Text
                attribute:
                  x: 0
                  y: 0
                  texts: "'&f服务器控制台命令'"
                  fontSize: 48
                  limit: 60
                  visible: "true"
                  through: true
              命令权限:
                type: Text
                attribute:
                  x: 0
                  y: 70
                  texts: "'&7此功能需要独立的控制台执行权限。操作会记录执行人和命令。'"
                  fontSize: 32
                  limit: 55
                  visible: "true"
                  through: true
              结果说明:
                type: Text
                attribute:
                  x: 0
                  y: 116
                  texts: "'&7返回值代表命令处理器是否接受；插件业务结果请查看服务器日志。'"
                  fontSize: 32
                  limit: 55
                  visible: "true"
                  through: true
              命令输入:
                type: Canvas
                attribute:
                  x: 0
                  y: 202
                  width: 940
                  height: 50
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~35,44,57,245
                      shape: ~round_rect
                      radius: 8
                  框:
                    type: TextBox
                    attribute:
                      x: 12
                      y: 6
                      width: 916
                      height: 38
                      length: 256
                      fontSize: 36
                      emptyText: "~输入单行服务器命令，无需斜杠"
                    action:
                      textChange: |-
                        var.commandInput = self.getContent()
                        var.confirmCommand = false
              准备:
                type: Canvas
                attribute:
                  x: 0
                  y: 280
                  width: 200
                  height: 48
                  visible: "!var.busy && var.commandInput != none && var.commandInput != '' && !var.confirmCommand"
                action:
                  clickLeft: |-
                    var.confirmCommand = true
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~60,130,180,245
                      hover: ~80,155,205,255
                      shape: ~round_rect
                      radius: 10
                  字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f准备执行'"
                      fontSize: 36
                      through: true
              确认执行:
                type: Canvas
                attribute:
                  x: 0
                  y: 280
                  width: 240
                  height: 48
                  visible: "var.confirmCommand && !var.busy"
                action:
                  clickLeft: |-
                    if(!var.busy && var.actionToken != none){
                      var.busy = true
                      Packet.send(var.packetId, 'exec_command', var.actionToken, var.commandInput)
                      var.confirmCommand = false
                    }
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~150,90,40,245
                      hover: ~80,155,205,255
                      shape: ~round_rect
                      radius: 10
                  字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f确认执行'"
                      fontSize: 36
                      through: true
              取消:
                type: Canvas
                attribute:
                  x: 260
                  y: 280
                  width: 180
                  height: 48
                  visible: "var.confirmCommand && !var.busy"
                action:
                  clickLeft: |-
                    var.confirmCommand = false
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~65,75,90,245
                      hover: ~80,155,205,255
                      shape: ~round_rect
                      radius: 10
                  字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f取消'"
                      fontSize: 36
                      through: true
          操作结果:
            type: Text
            attribute:
              x: 30
              y: 650
              texts: "var.resultType == 'error' ? '&c' + var.result : (var.resultType == 'success' ? '&a' + var.result : '&7' + var.result)"
              fontSize: 36
              limit: 52
              visible: "var.result != none && var.result != ''"
              through: true
          等待提示:
            type: Text
            attribute:
              x: 30
              y: 686
              texts: "var.busy ? '&7正在处理，请等待服务端返回…' : '&8QQBot · Esc 关闭'"
              fontSize: 28
              limit: 60
              visible: "true"
              through: true
