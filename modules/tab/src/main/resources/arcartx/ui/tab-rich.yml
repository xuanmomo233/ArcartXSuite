# tab-rich / tabs/demo.yml / packet-handler: tab
# Portrait directory: eight dense rows per column, at most three columns on screen.
# All entries remain available through the horizontal lane; no 120-player visual cap.
# Navy translucent surfaces only: no full-screen texture, blur, or opaque world overlay.
ui:
  isHud: true
  hide:
  - player_list
  escClose: false
  defaultOpen: true
  action:
    load: |-
      var.RichTAB刷新轮次 = 0
      var.RichTAB在线人数 = 0
      var.RichTAB单列数量 = 1
      var.RichTAB第一列人数 = 0
      var.RichTAB显示 = false
      var.RichTAB名称位移 = 0
    keyPress: |-
      if(self.currentKeyPress() == "TAB"){
        Packet.send("TAB","update")
        var.RichTAB单列数量 = math.ceil(var.RichTAB在线人数 / val.RichTAB遍历.row)
        var.RichTAB第一列人数 = math.min(var.RichTAB在线人数, 8)
        var.RichTAB显示 = true
        var.RichTAB名称位移 = 0
        val.RichTAB横向滑块.setDragXRatio(0)
      }
      // One-column steps, usable while holding TAB without opening a mouse screen.
      if(var.RichTAB显示 && self.currentKeyPress() == "RIGHT"){
        val.RichTAB横向滑块.setDragXRatio(math.min(1, val.RichTAB横向滑块.getDragXRatio() + 1 / math.max(1, var.RichTAB单列数量 - 3)))
      }
      if(var.RichTAB显示 && self.currentKeyPress() == "LEFT"){
        val.RichTAB横向滑块.setDragXRatio(math.max(0, val.RichTAB横向滑块.getDragXRatio() - 1 / math.max(1, var.RichTAB单列数量 - 3)))
      }
      if(var.RichTAB显示 && self.currentKeyPress() == "DOWN"){
        var.RichTAB名称位移 = math.min(1, var.RichTAB名称位移 + 0.25)
      }
      if(var.RichTAB显示 && self.currentKeyPress() == "UP"){
        var.RichTAB名称位移 = math.max(0, var.RichTAB名称位移 - 0.25)
      }
    keyRelease: |-
      if(self.currentKeyReleased() == "TAB"){
        var.RichTAB显示 = false
      }
  packetHandler:
    # Preserve map accesses, generation-qualified copies, and PlayerSkin assignment timing.
    tab: |-
      i = 0
      var.RichTAB刷新轮次 = var.RichTAB刷新轮次 + 1
      while(val.RichTAB遍历2.childrenCount() > 1){
        val.RichTAB遍历2.get(1).remove()
      }
      while(i < packet.size()){
        if(val.player_row != none) {
          ROW = val.player_row.copy('rich_player_' + var.RichTAB刷新轮次 + '_' + i.round())
          ROW['头部'].normal = 'PlayerSkin:' + packet.get(i).uuid
          ROW['名称文字'].texts = packet.get(i).name
          ROW['ping_text'].texts = packet.get(i).ping
          ROW.visible = true
        }
        i++
      }
      var.RichTAB在线人数 = packet.size()
      var.RichTAB单列数量 = math.ceil(var.RichTAB在线人数 / val.RichTAB遍历.row)
      var.RichTAB第一列人数 = math.min(var.RichTAB在线人数, 8)
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      RichTAB背景:
        type: Canvas
        attribute:
          point: ~top_center
          y: 24
          width: "24 + 448 * math.min(3, math.max(1, var.RichTAB单列数量))"
          height: "200 + 48 * math.max(1, var.RichTAB第一列人数)"
          visible: var.RichTAB显示
          through: true
        children:
          目录底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,24,44,164
              shape: ~round_rect
              radius: 8
              through: true
          目录规则线:
            type: Texture
            attribute:
              width: "self.parent.width"
              height: 3
              normal: ~35,159,214,230
              through: true
          标题:
            type: Text
            attribute:
              x: 24
              y: 16
              fontSize: 54
              texts: ~&f在线名册
              through: true
          在线人数:
            type: Text
            attribute:
              point: ~top_right
              x: -24
              y: 16
              texts: "'&b' + var.RichTAB在线人数.round() + ' &7在线'"
              fontSize: 54
              through: true
          # Legacy aliases retained. The old placeholder grid now supplies real column headings.
          # row is an explicitly declared custom capacity used by the original UI actions.
          RichTAB遍历:
            type: HStack
            val: RichTAB遍历
            attribute:
              x: 24
              y: 80
              height: 36
              spaceBetween: 24
              row: 8
            action:
              create: |-
                for(i in range(1, 2)){
                  header = self['ROW'].copy('ROW' + i.round())
                  header.ID = i.round()
                }
            children:
              ROW:
                type: Canvas
                val: ROW
                attribute:
                  width: 424
                  height: 36
                  ID: 0.round()
                  visible: "self.ID < math.min(3, math.max(1, var.RichTAB单列数量))"
                  through: true
                children:
                  玩家标题:
                    type: Text
                    attribute:
                      x: 56
                      texts: ~&7玩家
                      fontSize: 36
                      through: true
                  信号标题:
                    type: Text
                    attribute:
                      point: ~top_right
                      x: -12
                      texts: ~&7PING
                      fontSize: 36
                      through: true
          名册滚动区:
            type: Scroll
            attribute:
              x: 24
              y: 124
              width: "448 * math.min(3, math.max(1, var.RichTAB单列数量)) - 24"
              height: "48 * math.max(1, var.RichTAB第一列人数)"
              moveX: val.RichTAB横向滑块.getDragXRatio()
            action:
              wheel: |-
                val.RichTAB横向滑块.setDragXRatio(math.max(0, math.min(1, self.moveX - self.wheelValue / math.max(1, var.RichTAB单列数量 - 3))))
            children:
              名册画布:
                type: Canvas
                attribute:
                  width: "448 * math.max(1, var.RichTAB单列数量) - 24"
                  height: "48 * math.max(1, var.RichTAB第一列人数)"
                  through: true
                children:
                  RichTAB遍历2:
                    type: VGrid
                    val: RichTAB遍历2
                    attribute:
                      spaceBetweenY: 4
                      spaceBetweenX: 24
                      row: 8
                    children:
                      player_row:
                        type: Canvas
                        val: player_row
                        attribute:
                          width: 424
                          height: 44
                          visible: false
                          through: true
                        children:
                          行底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~21,37,57,164
                              through: true
                          行标尺:
                            type: Texture
                            attribute:
                              width: 2
                              height: 44
                              normal: ~35,159,214,190
                              through: true
                          头部:
                            type: Texture
                            attribute:
                              point: ~middle_left
                              x: 10
                              width: 32
                              height: 32
                              normal: ~120,120,120,255
                              through: true
                          # The original packet write still addresses this direct child.
                          名称文字:
                            type: Scroll
                            attribute:
                              x: 56
                              y: 4
                              width: 244
                              height: 36
                              texts: ~none
                              scrollAnim: none
                              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : var.RichTAB名称位移"
                            action:
                              enter: "self.scrollAnim = Lerp(0, 1, 3000)"
                              leave: "self.scrollAnim = none"
                            children:
                              名称布局:
                                type: HStack
                                attribute:
                                  height: 36
                                children:
                                  玩家名:
                                    type: Text
                                    attribute:
                                      texts: self.parent.parent.texts
                                      fontSize: 36
                                      through: true
                          信号分界:
                            type: Texture
                            attribute:
                              x: 316
                              y: 8
                              width: 1
                              height: 28
                              normal: ~137,167,187,140
                              through: true
                          ping_text:
                            type: Text
                            attribute:
                              point: ~middle_right
                              x: -12
                              fontSize: 36
                              texts: ~none
                              through: true
          空名册:
            type: Text
            attribute:
              x: 80
              y: 128
              texts: "var.RichTAB刷新轮次 == 0 ? '&7正在同步名册' : '&7暂无在线条目'"
              fontSize: 36
              visible: var.RichTAB在线人数 == 0
              through: true
          横向滑轨:
            type: Texture
            attribute:
              x: 24
              y: "136 + 48 * math.max(1, var.RichTAB第一列人数)"
              width: "self.parent.width - 48"
              height: 6
              normal: ~92,121,145,170
              visible: var.RichTAB单列数量 > 3
              through: true
          横向滑块:
            type: Texture
            val: RichTAB横向滑块
            attribute:
              x: 24
              y: "136 + 48 * math.max(1, var.RichTAB第一列人数)"
              width: 120
              height: 6
              maxDragX: "self.parent.width - 168"
              normal: ~35,159,214,230
              hover: ~188,210,224,230
              visible: var.RichTAB单列数量 > 3
          浏览提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 24
              y: -16
              texts: "var.RichTAB单列数量 > 3 ? '&bLEFT / RIGHT &7分栏浏览' : '&7UP / DOWN 浏览长名'"
              fontSize: 36
              through: true
          收起提示:
            type: Text
            attribute:
              point: ~bottom_right
              x: -24
              y: -16
              texts: "var.RichTAB单列数量 > 3 ? '&7UP / DOWN 浏览长名' : '&7松开 TAB 收起'"
              fontSize: 36
              visible: var.RichTAB单列数量 > 1
              through: true
