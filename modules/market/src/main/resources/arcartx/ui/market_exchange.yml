ui:
  isHud: false
  defaultOpen: false
  background: true
  escClose: true
  closeDied: true
  screenScale: true
  through: false
  jei: false
  itemSize: 16
  hide:
  - hotbar
  - crosshair
  - player_state
  - experience_bar
  - chat_panel
  action:
    load: |-
      var.whLayoutEnabled = false
      var.rows = {}
      var.keys = []
      var.pageRows = []
      var.assetRows = []
      for(i in range(0, 7)){ var.assetRows.add(i.round()) }
      var.selection = ''
      var.search = ''
      var.page = 0
      var.pageText = '1 / 1'
      var.hasNext = false
      var.dirtyRows = false
      var.offerIconsDirty = false
      var.detailDirty = false
      var.busy = false
      var.token = ''
      var.balances = ''
      var.shopName = 'NPC 兑换所'
      var.warehouse = false
      var.resolved = false
      var.catalogRevision = ''
      var.detailsReady = false
      var.confirmLabel = '&7选择兑换条目'
      var.canEdit = false
      var.noticeActive = false
      var.noticeText = ''
      var.noticeDetail = ''
      var.noticeFade = Fade(80, 1000, 220)
      var.noticePeaked = false
      var.noticeLines = []
      var.noticeCount = 1
    open: |-
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeText = ''
      var.noticeDetail = ''
      Packet.send('AXS:market_exchange', 'refresh')
    close: Packet.send('AXS:market_exchange', 'close')
    tick: |-
      if(var.dirtyRows){
        var.dirtyRows = false
        keys = []
        for(key in var.rows.keys()){
          row = var.rows[key]
          if(var.search == '' || row['name'].contains(var.search) || row['cost'].contains(var.search) || row['reward'].contains(var.search)){ keys.add(key) }
        }
        var.keys = keys
        pages = ((keys.size() + 11) / 12).toInt()
        if(pages < 1){ pages = 1 }
        if(var.page >= pages){ var.page = pages - 1 }
        if(var.page < 0){ var.page = 0 }
        var.pageText = (var.page + 1).toInt().round() + ' / ' + pages.round()
        var.hasNext = var.page + 1 < pages
        pageRows = []
        for(i in range(0, 11)){
          index = (var.page * 12 + i).round()
          if(index < keys.size()){ pageRows.add(keys.get(index)) }
        }
        var.pageRows = pageRows
        var.offerIconsDirty = true
      }
      if(var.offerIconsDirty && val.offerGrid != none && val.offerGrid.childrenCount() == var.pageRows.size()){
        ready = true
        if(var.pageRows.size() > 0){
          for(i in range(0, var.pageRows.size() - 1)){
            row = var.rows[var.pageRows.get(i.round())]
            slot = val.offerGrid.get(i.round())['图标']
            if(slot == none){ ready = false }
            elif(row != none){ slot.setItemIcon(row['icon']) }
          }
        }
        var.offerIconsDirty = !ready
      }
      if(var.detailDirty && val.costGrid != none && val.rewardGrid != none
          && val.costGrid.childrenCount() == 8 && val.rewardGrid.childrenCount() == 8){
        ready = true
        row = var.rows[var.selection]
        for(i in range(0, 7)){
          idx = i.round()
          cost = row == none ? none : row['costRows'][idx]
          reward = row == none ? none : row['rewardRows'][idx]
          costSlot = val.costGrid.get(idx)['图标']
          rewardSlot = val.rewardGrid.get(idx)['图标']
          if(costSlot == none || rewardSlot == none){
            ready = false
          }else{
            if(cost != none){ costSlot.setItemIcon(cost['icon']) }
            if(reward != none){ rewardSlot.setItemIcon(reward['icon']) }
          }
        }
        var.detailDirty = !ready
      }
      if(var.noticeActive){
        var.noticeOpacity = var.noticeFade.get()
        if(var.noticeOpacity > 0){ var.noticePeaked = true }
        if(var.noticePeaked && var.noticeOpacity <= 0){
          var.noticeActive = false
          var.noticePeaked = false
          var.noticeText = ''
          var.noticeDetail = ''
        }
      }
  packetHandler:
    npc_catalog: |-
      var.rows = packet['rows']
      var.shopName = packet['name']
      var.token = packet['token']
      var.balances = packet['balances']
      var.warehouse = packet['warehouse']
      var.canEdit = packet['admin']
      var.resolved = true
      var.catalogRevision = packet['revision']
      var.detailsReady = false
      var.busy = false
      var.dirtyRows = true
      var.detailDirty = true
      if(var.rows[var.selection] == none){ var.selection = '' }
      if(packet['lastResult'] != ''){
      if(!var.noticeActive){
        var.noticeText = packet['lastResult']
        var.noticeDetail = ''
        parts = var.noticeText.split('；凭证 ')
        if(parts.size() > 1){var.noticeText = parts.get(0.round())
      var.noticeDetail = '凭证 ' + parts.get(1.round())}
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
      }
      if(var.rows[var.selection] != none){Packet.send('AXS:market_exchange', 'detail', var.rows[var.selection]['id'])}
      var.confirmLabel = var.rows[var.selection] == none ? '&7选择兑换条目' : '&7读取兑换详情'
    npc_detail: |-
      if(packet['revision'] == var.catalogRevision && var.rows[var.selection] != none && var.rows[var.selection]['id'] == packet['id']){
        var.rows[var.selection]['costRows'] = packet['costRows']
        var.rows[var.selection]['rewardRows'] = packet['rewardRows']
        var.detailsReady = packet['available']
        var.confirmLabel = packet['available'] ? '&f确认兑换一次' : '&7兑换资产暂不可用'
        var.detailDirty = true
      }
    npc_result: |-
      var.busy = packet['busy']
      var.token = packet['token']
      if(packet['busy'] != true){
        noticeMessage = packet['message']
        if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
          var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
          noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
          var.noticeLines = noticeWrapped.split('\n')
          var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
          var.noticeFade.reset()
          var.noticePeaked = false
          var.noticeActive = true
        }
      }
    ui_notice: |-
      noticeMessage = packet['message']
      if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
        var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
        noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = noticeWrapped.split('\n')
        var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
