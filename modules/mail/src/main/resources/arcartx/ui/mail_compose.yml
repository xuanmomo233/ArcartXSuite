# AXS Mail 写信（翠绿信使重写版）
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航 + 内容区
# 布局: 左导航(收件箱/日志/写信/兑换码/管理) + 内容区(左:附件+背包槽位 右:表单输入 底:发送/返回)
# 配色: 翠绿信使 主色80,180,120 底30,32,38,110 抬升36,38,48,245 描边60,64,82,220
# 逻辑: packetHandler/action/val引用/entryKey/copy 与原版一致，仅重构布局结构与配色

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  level: 8
  itemSize: 16
  screenScale: true
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.sessionId = none
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.baseFee = '0'
      var.vaultTaxRate = '0'
      var.allowVault = true
      var.quoteSuccess = true
      var.quoteMessage = none
      var.itemFee = '0'
      var.totalFee = '0'
      var.maxAttachments = 0
      var.attachmentCount = 0
      var.subjectMax = 48
      var.bodyMax = 400
      var.composeRecipient = none
      var.composeSubject = none
      var.composeBody = none
      var.composeVault = '0'
      var.passwordPanelVisible = false
      var.passwordText = ''
      var.currencies = none
      var.feeCurrency = ''
      var.totalFeeCurrency = ''
      var.isAdmin = false
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.attachmentJsons = none
      var.backpackJsons = none
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - session_id: 写信会话 ID
    #   - action_token: 操作令牌（防重放）
    #   - base_fee: 基础邮费金额
    #   - vault_tax_rate: 金币附件税率
    #   - allow_vault: 是否允许附带金币附件
    #   - quote_success: 费用报价是否成功
    #   - quote_message: 报价提示信息
    #   - item_fee: 物品附件手续费
    #   - total_fee: 邮件总费用
    #   - max_attachments: 最大物品附件槽数量
    #   - attachment_count: 当前已放入的附件数量
    #   - subject_max: 标题文字上限
    #   - body_max: 正文文字上限
    #   - password_panel: 二级密码面板信息（含 visible 子字段）
    #   - currencies: 可用货币列表（Map，每项含 available 和 display_name）
    #   - fee_currency: 当前邮费使用的货币 ID
    #   - total_fee_currency: 总费用使用的货币 ID
    #   - is_admin: 当前玩家是否为管理员
    init: |-
      var.sessionId = packet['session_id']
      var.actionToken = packet['action_token']
      var.baseFee = packet['base_fee']
      var.vaultTaxRate = packet['vault_tax_rate']
      var.allowVault = packet['allow_vault']
      var.quoteSuccess = packet['quote_success']
      var.quoteMessage = packet['quote_message']
      var.itemFee = packet['item_fee']
      var.totalFee = packet['total_fee']
      var.maxAttachments = packet['max_attachments']
      var.attachmentCount = packet['attachment_count']
      var.subjectMax = packet['subject_max']
      var.bodyMax = packet['body_max']
      var.composeRecipient = none
      var.composeSubject = none
      var.composeBody = none
      var.composeVault = '0'
      var.passwordPanelVisible = packet['password_panel'] != none && packet['password_panel']['visible']
      var.passwordText = ''
      var.currencies = packet['currencies']
      var.feeCurrency = packet['fee_currency']
      var.totalFeeCurrency = packet['total_fee_currency']
      var.isAdmin = packet['is_admin']
      var.attachmentJsons = packet['attachment_jsons']
      var.backpackJsons = packet['backpack_jsons']
      if(var.currencies != none){
        while(val.currency_list.childrenCount() > 1){
          val.currency_list.get(1).remove()
        }
        for(key in var.currencies.keys()){
          entry = var.currencies[key]
          if(entry != none && entry['available'] == true){
            btn = val.currency_list['货币按钮'].copy('货币按钮' + key)
            btn.currencyId = key
            btn.currencyName = entry['display_name'] != none && entry['display_name'] != '' ? entry['display_name'] : key
          }
        }
      }
      var.actionBusy = false
    # packetHandler: update
    # 包字段:
    #   - base_fee / vault_tax_rate / allow_vault / quote_success / quote_message
    #   - item_fee / total_fee / max_attachments / attachment_count
    #   - password_panel / total_fee_currency / is_admin
    update: |-
      var.baseFee = packet['base_fee']
      var.vaultTaxRate = packet['vault_tax_rate']
      var.allowVault = packet['allow_vault']
      var.quoteSuccess = packet['quote_success']
      var.quoteMessage = packet['quote_message']
      var.itemFee = packet['item_fee']
      var.totalFee = packet['total_fee']
      var.maxAttachments = packet['max_attachments']
      var.attachmentCount = packet['attachment_count']
      var.passwordPanelVisible = packet['password_panel'] != none && packet['password_panel']['visible']
      var.totalFeeCurrency = packet['total_fee_currency']
      var.isAdmin = packet['is_admin']
      var.attachmentJsons = packet['attachment_jsons']
      var.backpackJsons = packet['backpack_jsons']
      var.actionBusy = false

# ─── 控件树 ────────────────────────────────────────────────────────
# 布局: 顶栏(标题色块+标题+关闭) + 左导航(5项) + 内容区(左:槽位 右:表单 底:按钮)
# 配色: 翠绿信使 深底浅字 — 抬升面36,38,48 描边60,64,82 强调80,180,120
# fontSize: 48(顶栏标题) / 36(区域标题/按钮/信息) / 32(小标签) — 全部标准档位
controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;30,32,38,110
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~60,64,82,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~80,180,120,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f写信"
              fontSize: 48
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ──────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          导航收件箱:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'open')
            children:
              收件箱底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              收件箱文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f收件箱"
                  fontSize: 36
                  through: true
          导航日志:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'logs')
            children:
              日志底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              日志文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f日志"
                  fontSize: 36
                  through: true
          # 当前页：写信
          导航写信:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            children:
              写信底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~80,180,120,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              写信高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~80,180,120,255
                  shape: ~round_rect
                  radius: 2
              写信文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0写信"
                  fontSize: 36
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
              visible: "var.isAdmin == true"
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'admin')
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f管理"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 298
              width: 264
              height: 2
              normal: ~60,64,82,220
          提示标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 316
              texts: "~&f写信提示"
              fontSize: 36
          提示文字:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 362
              texts:
                - "~&f左键背包物品放入1个"
                - "~&f右键背包物品放入整组"
                - "~&f左键附件退回背包"
                - "~&f关闭界面物品自动退回"
                - "~&f填写收件人与标题后发送"
              fontSize: 32

      # ── 内容区 ──────────────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          # 内容区大白毛玻璃底
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # 左列：附件 + 背包槽位
          附件面板:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 24
              width: 480
              height: 200
            children:
              附件底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              附件标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 16
                  y: 12
                  texts: "'&f物品附件 &b' + var.attachmentCount.round() + '&f/' + var.maxAttachments.round()"
                  fontSize: 36
              附件提示:
                type: Text
                attribute:
                  point: ~top_left
                  x: 16
                  y: 48
                  texts: "~&f左键放入1个 右键放整组"
                  fontSize: 32
              槽位网格:
                type: HGrid
                attribute:
                  point: ~top_left
                  x: 16
                  y: 88
                  spaceBetweenX: 6
                  spaceBetweenY: 6
                  column: 6
                action:
                  create: |-
                    for(i in range(1,5)){
                      slot = self['槽位0'].copy('slot' + i)
                      slot.id = i
                    }
                children:
                  槽位0:
                    type: Slot
                    attribute:
                      width: 54
                      height: 54
                      normal: "~Frosted:0;36,38,48,245"
                      hover: "~Frosted:0;60,64,82,245"
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.72
                      slotType: ~Icon
                      id: 0
                      visible: "self.id < var.maxAttachments"
                      seticon: "self.setItemIcon(var.attachmentJsons != none && var.attachmentJsons[self.id] != none && var.attachmentJsons[self.id] != '' ? var.attachmentJsons[self.id] : var.air)"
                    action:
                      clickLeft: |-
                        Packet.send('AXS_MAIL', 'compose-remove-attachment', self.id)
                    effect:
                      stroke:
                        width: 2
                        color: ~255,255,255,230

          背包面板:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 240
              width: 480
              height: "var.viewH - 144 - 216 - 72"
            children:
              背包底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              背包标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 16
                  y: 12
                  texts: "~&f我的背包"
                  fontSize: 36
              背包网格:
                type: HGrid
                attribute:
                  point: ~top_left
                  x: 16
                  y: 56
                  spaceBetweenX: 6
                  spaceBetweenY: 6
                  column: 6
                action:
                  create: |-
                    for(i in range(1,35)){
                      slot = self['槽位0'].copy('slot' + i)
                      slot.id = i
                    }
                children:
                  槽位0:
                    type: Slot
                    attribute:
                      width: 54
                      height: 54
                      normal: "~Frosted:0;36,38,48,245"
                      hover: "~Frosted:0;60,64,82,245"
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.72
                      slotType: ~Icon
                      id: 0
                      seticon: "self.setItemIcon(var.backpackJsons != none && var.backpackJsons[self.id] != none && var.backpackJsons[self.id] != '' ? var.backpackJsons[self.id] : var.air)"
                    action:
                      clickLeft: |-
                        Packet.send('AXS_MAIL', 'compose-add-attachment', self.id, '1')
                      clickRight: |-
                        Packet.send('AXS_MAIL', 'compose-add-attachment', self.id, 'all')
                    effect:
                      stroke:
                        width: 2
                        color: ~255,255,255,230

          # 右列：表单输入区
          表单区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 528
              y: 24
              width: "var.contentW - 504"
              height: "var.viewH - 144 - 72"
            children:
              表单底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              收件人标签:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 16
                  texts: "~&f收件人"
                  fontSize: 36
              收件人输入框:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 20
                  y: 52
                  width: 320
                  height: 40
                children:
                  收件人输入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  收件人输入框文本:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 4
                      width: 300
                      height: 32
                      length: 32
                      emptyText: "~&f输入玩家名"
                      fontSize: 36
                    action:
                      textChange: |-
                        var.composeRecipient = self.getContent()
              标题标签:
                type: Text
                attribute:
                  point: ~top_left
                  x: 360
                  y: 16
                  texts: "~&f标题"
                  fontSize: 36
              标题输入框:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 360
                  y: 52
                  width: "self.parent.width - 380"
                  height: 40
                children:
                  标题输入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  标题输入框文本:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 4
                      width: "self.parent.width - 20"
                      height: 32
                      length: 48
                      emptyText: "~&f输入邮件标题"
                      fontSize: 36
                    action:
                      textChange: |-
                        var.composeSubject = self.getContent()
              正文标签:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 108
                  texts: "~&f正文"
                  fontSize: 36
              正文输入框:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 20
                  y: 144
                  width: "self.parent.width - 40"
                  height: 240
                children:
                  正文输入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  正文输入框文本:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 6
                      width: "self.parent.width - 20"
                      height: 228
                      length: 400
                      allowNewLine: true
                      emptyText: "~&f支持多行正文"
                      fontSize: 36
                    action:
                      textChange: |-
                        var.composeBody = self.getContent()
              字数统计:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 396
                  texts: "'&f标题上限 &b' + var.subjectMax.round() + '  &f正文上限 &b' + var.bodyMax.round()"
                  fontSize: 32
              邮费货币标签:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 436
                  texts: "~&f邮费货币"
                  fontSize: 36
              货币选择栏:
                val: currency_list
                type: HStack
                attribute:
                  point: ~top_left
                  x: 160
                  y: 436
                  spaceBetween: 8
                children:
                  货币按钮:
                    type: Canvas
                    attribute:
                      width: 120
                      height: 40
                      currencyId: ''
                      currencyName: ''
                      visible: "self.currencyId != '' && self.currencyId != var.totalFeeCurrency"
                    action:
                      clickLeft: |-
                        Packet.send('AXS_MAIL', 'change-fee-currency', self.currencyId)
                    children:
                      货币背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~36,38,48,245
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
                      货币文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "self.parent.currencyName != none ? self.parent.currencyName : ''"
                          fontSize: 32
                          through: true
              当前货币显示:
                type: Text
                attribute:
                  point: ~top_left
                  x: 160
                  y: 436
                  texts: "(var.totalFeeCurrency != none && var.totalFeeCurrency != '' ? var.totalFeeCurrency : '金币')"
                  fontSize: 36
                  visible: "val.currency_list.childrenCount() <= 1"
              金币输入框:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 20
                  y: 484
                  width: 360
                  height: 40
                  visible: "var.allowVault == true"
                children:
                  金币输入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  金币输入框文本:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 4
                      width: 340
                      height: 32
                      length: 24
                      emptyText: "~&f填写金币附件数量"
                      fontSize: 36
                    action:
                      textChange: |-
                        var.composeVault = self.getContent()
              费用汇总:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 536
                  texts: "'&f总费用 &b' + var.totalFee + ' ' + (var.totalFeeCurrency != none && var.totalFeeCurrency != '' ? var.totalFeeCurrency : '金币') + '  &f手续费 &b' + var.itemFee + (var.quoteMessage == none ? '' : '  &f提示 &b' + var.quoteMessage)"
                  fontSize: 32
              # 二级密码面板（条件显示）
              二级密码面板:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 20
                  y: 580
                  width: "self.parent.width - 40"
                  height: 80
                  visible: "var.passwordPanelVisible == true"
                children:
                  密码底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: ~235,180,90,220
                  密码提示:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 14
                      y: 10
                      texts: "~&e请输入二级密码解锁后重试"
                      fontSize: 32
                  密码输入框:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 14
                      y: 40
                      width: 300
                      height: 32
                    children:
                      密码输入底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~28,30,40,245
                          shape: ~round_rect
                          radius: 8
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,230
                      密码输入框文本:
                        type: TextBox
                        attribute:
                          x: 8
                          y: 2
                          width: 284
                          height: 28
                          length: 64
                          emptyText: "~&f输入二级密码"
                          fontSize: 32
                        action:
                          textChange: |-
                            var.passwordText = self.getContent()
                  密码确认按钮:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 328
                      y: 40
                      width: 100
                      height: 32
                    action:
                      clickLeft: |-
                        Packet.send('AXS_MAIL', 'password-unlock', var.passwordText)
                        var.passwordText = ''
                    children:
                      确认底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~80,180,120,230
                          shape: ~round_rect
                          radius: 8
                        effect:
                          stroke:
                            width: 3
                            color: ~255,255,255,230
                      确认文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&0解锁"
                          fontSize: 32
                          through: true

          # 底部按钮栏
          底部按钮栏:
            type: HStack
            attribute:
              point: ~bottom_left
              x: 24
              y: -36
              spaceBetween: 16
            children:
              发送按钮:
                type: Canvas
                attribute:
                  width: 180
                  height: 48
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send('AXS_MAIL', 'compose-send', var.sessionId, var.composeRecipient, var.composeSubject, var.composeBody, var.composeVault, var.actionToken)
                children:
                  发送底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~80,180,120,230
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
                  发送文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&0发送邮件"
                      fontSize: 36
                      through: true
              返回按钮:
                type: Canvas
                attribute:
                  width: 180
                  height: 48
                action:
                  clickLeft: |-
                    Packet.send('AXS_MAIL', 'open')
                children:
                  返回底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
                  返回文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f返回邮箱"
                      fontSize: 36
                      through: true
