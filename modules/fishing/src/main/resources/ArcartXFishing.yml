# AXS 钓鱼模块主配置文件
# 配置钓鱼小游戏核心参数、水域定义、鱼类池、宝藏池、UI注册和命令
config-version: 2              # 配置文件版本号

# ─── 调试 ────────────────────────────────────────────
# 开启后输出钓鱼事件、小游戏状态、发包详情等详细日志，生产环境建议关闭。
debug: false

# ─── 数据存储 ────────────────────────────────────────
# mode: sqlite 或 mysql。
storage:
  mode: sqlite
  # SQLite 数据库文件名（相对模块数据目录）。
  sqlite-file-name: fishing.db
  # 连接池大小，SQLite 建议保持 1。
  pool-size: 1
  # 以下仅在 mode: mysql 时生效。
  mysql-host: localhost
  mysql-port: 3306
  mysql-database: axs_fishing
  mysql-username: root
  mysql-password: ""

# ─── 钓鱼小游戏核心参数 ────────────────────────────────────────
fishing:
  # 是否接管原版钓鱼事件，启用后玩家甩竿会进入 AXS 钓鱼小游戏。
  replace-vanilla: true

  # ─── 小游戏节奏 ────────────────────────────────────────────────
  # 小游戏 tick 刷新间隔（ticks），20 ticks = 1 秒。值越小动画越平滑，CPU 占用越高。
  minigame-tick-interval: 1
  # 单次小游戏最长持续时间（ticks），超时视为失败。钓竿的 catch-duration-bonus 会叠加到此值上。
  catch-duration-ticks: 600
  # 钓鱼冷却时间（ticks）：小游戏结束后多少 ticks 内无法再次触发钓鱼。20 ticks = 1 秒，默认 100 = 5 秒。
  fishing-cooldown-ticks: 100

  # ─── 绿条物理（玩家控制的绿条，UI 中按住鼠标向下移动，松开向上浮） ───
  # 绿条物理包含：持续力（重力/点击力）+ 速度阻尼 + 边界法向力 + 反弹
  # 法向力：绿条已在边界时，边界抵消朝向边界的持续推力，防止绿条被钉在底部/顶部。
  # 反弹：碰撞后速度反转并衰减，且有最小反弹速度保证弹起可见。
  #
  # 未按住鼠标时绿条受到的力（正数 → UI 中绿条向上浮），绝对值越大上浮越快。
  bar-gravity: 0.3
  # 按住鼠标时绿条受到的力（负数 → UI 中绿条向下移动），绝对值越大下移越快。
  bar-click-force: -0.3
  # 力缩放系数：bar-gravity 和 bar-click-force 都要乘以此系数后施加到绿条速度上，越大绿条响应越灵敏。
  bar-force-multiplier: 0.03
  # 绿条速度阻尼（0-1）：每 tick 绿条速度乘以此值。越接近 1 惯性越大（滑行越远），越接近 0 越容易停但越迟钝。
  bar-damping: 0.85
  # 绿条碰到轨道顶部/底部时的反弹阻尼（0-1）：碰撞后速度 = 原速度 × 此值。越接近 1 反弹越持久，越接近 0 越像撞墙停下。
  # 注意：即使此值很小，绿条也会有最小反弹速度（0.02）保证弹起可见，不会卡在边界。
  bar-bounce-damping: 0.7

  # ─── 绿条高度（绿条越大越容易覆盖鱼，钓鱼越简单） ────────────────
  # 绿条基础高度（像素），轨道总高 644 像素。玩家等级和钓竿会增加绿条高度。
  base-green-bar-height: 96
  # 玩家每提升 1 级钓鱼等级，绿条增加的高度（像素）。等级越高绿条越大越容易钓。
  height-per-level: 4
  # 难度对绿条高度的缩减比例（0-1）：难度 100 时绿条高度 ×（1 - 此值）。0 = 不缩减，1 = 完全消失。
  difficulty-bar-shrink: 0.3

  # ─── 鱼物理（鱼自动移动，玩家需用绿条追踪鱼） ────────────────
  # 鱼撞到轨道顶部/底部时的反弹力度（0-1）：碰撞后速度 = 原速度 × 此值。越接近 1 反弹越远，越接近 0 越像撞墙停下。
  fish-edge-bounce: 0.5

  # ─── 钓鱼进度（进度满 100% = 钓成功，进度归 0 或超时 = 失败） ────
  # 鱼在绿条内时进度每 tick 上升量（实际再乘 progress-rate-multiplier 和等级/天赋加成）。
  progress-gain-rate: 1.0
  # 鱼在绿条外时进度每 tick 下降量（实际再乘 progress-rate-multiplier 和天赋减免）。
  progress-drain-rate: 0.5
  # 进度涨跌缩放系数：进度实际变化 = gain/drain-rate × 此系数 × 等级修正 × 天赋加成。越大进度变化越快。
  progress-rate-multiplier: 0.008

  # ─── 奖励 ────────────────────────────────────────────────
  # 钓起宝藏（treasures/ 目录定义）的基础概率（0.0 ~ 1.0），最终概率 = 此值 + 饵料加成 + 钓竿加成。
  treasure-chance: 0.15
  # 完美捕获（全程鱼未离开过绿条）时的货币奖励倍率。注意：经验完美加成固定 1.5x，不受此配置影响。
  perfect-bonus-multiplier: 1.5

  # ─── 等级修正（玩家钓鱼等级越高，小游戏越轻松） ────────────────
  # 钓鱼等级上限，用于将玩家等级归一化到 [0,1] 参与等级修正计算。与 season.max-level 独立。
  max-level: 100
  # 等级修正系数：满级时鱼速度最多减慢此比例、逃离概率最多降低此比例、进度增长最多加快此比例。
  # 例如 0.5 = 满级时鱼速度 ×0.5、逃离概率 ×0.5、进度增速 ×1.5。
  level-modifier-scale: 0.5

  # ─── 驱赶机制（鱼在绿条内时偶尔迅速逃离，增加操作难度） ────────
  # 逃离触发条件：鱼在绿条内 + 到达检查时间 + 随机骰 < 逃离概率。
  # 逃离概率 = flee-base-chance +（鱼难度/100）× flee-chance-per-difficulty，再 ×（1 - 等级修正）×（1 - 天赋减免）。
  # 难度越高逃离越频繁；玩家等级越高逃离概率越低。
  flee-base-chance: 0.25
  flee-chance-per-difficulty: 0.25
  # 逃离速度 = flee-base-speed +（鱼难度/100）× flee-speed-per-difficulty，再 ×（1 - 天赋减免）。
  # 难度越高逃离越快。
  flee-base-speed: 0.04
  flee-speed-per-difficulty: 0.03
  # 逃离持续 ticks 范围 [min, max)，触发后随机取一个持续时间。
  flee-min-duration: 15
  flee-max-duration: 35
  # 逃离检查间隔 ticks 范围 [min, max)：非逃离状态下，每隔这段随机时间检查一次是否触发逃离。
  flee-check-min-interval: 20
  flee-check-max-interval: 50
  # 逃离结束后冷却 ticks 范围 [min, max)：冷却期间不会再次触发逃离检查。
  flee-cooldown-min: 30
  flee-cooldown-max: 70

# ─── 赛季配置 ────────────────────────────────────────
# 定义当前钓鱼赛季的基本参数与经验成长曲线。
# 赛季结束时重置等级/经验/天赋点/奖励领取记录，永久数据（图鉴）保留。
season:
  season-id: "fishing-s1"
  display-name: "第一赛季"
  max-level: 100
  # 经验成长曲线：转折点断点列表，每项指定一个起始等级（level）与一个 ARIA 表达式（formula）。
  # 表达式以变量 level 为入参，计算结果即为"升到该等级所需经验值"（必须 ≥ 1）。
  # 系统按 level 升序选取最大的且不超过目标等级的断点公式求值。
  # 首个断点的 level 必须为 1；断点 level 必须严格递增。
  #
  # 当前曲线：线性 × S曲线增长因子模型
  #   xpForNextLevel = baseXp × level × (1 + a × smoothstep(0, maxLevel, level)^k)
  #   smoothstep(0, 100, level) = (level/100)^2 × (3 - 2 × (level/100))
  #   参数: baseXp=50, a=2, k=1.5
  #
  # 特征：前期近似线性（快速升级给正反馈），中后期 S曲线因子平滑加速（挑战感递增），
  #       全程无拐点突变。满级(100)累计约 187,500 xp。
  # 节奏（每次钓鱼约 5-15 xp，平均 10 xp/次，每小时约 60 次 = 600 xp/h）：
  #   Lv25 约 5 小时、Lv50 约 25 小时、Lv75 约 80 小时、Lv100 约 180 小时。
  # 天赋点（每3级1点）：满级共 33 点，可点亮 25 个树节点 + 8 个联动节点中的部分。
  xp-curve:
    - level: 1
      formula: "50 * level * (1 + 2.0 * math.pow(math.pow(level / 100, 2) * (3 - 2 * level / 100), 1.5))"
  start-date: "2026-01-01"
  end-date: "2030-12-31"
  # 赛季结算奖励发放方式：ONLINE_DIRECT / MAIL / HYBRID
  settlement:
    dispatch-mode: "ONLINE_DIRECT"

# ─── 水域定义 ────────────────────────────────────────
# 指定地点: 玩家在指定坐标/区域内钓鱼
# 默认水域: 未匹配任何指定地点时使用
waters:
  # 指定地点水域列表
  specified:
    - name: "dragon_lake"     # 水域唯一标识名
      display-name: "&b龙泉湖"  # 水域显示名称（支持颜色代码）
      type: circle            # 水域形状类型（circle=圆形区域）
      world: "world"          # 所在世界名称
      center: [100, 64, 200]  # 圆形水域中心坐标 [x, y, z]
      radius: 50              # 圆形水域半径（方块）
      fish-pool: "lake"       # 引用的鱼类池ID（对应 fish-pools 定义）
      treasure-pool: "common" # 引用的宝藏池ID（对应 treasure-pools 定义）
      difficulty-modifier: 1.2 # 难度修正系数（1.2=难度提升20%）
      bait-multipliers:       # 饵料在该水域的额外倍率
        worm: 1.5             # 蚯蚓在此水域倍率1.5
        corn: 2.0             # 玉米粒在此水域倍率2.0
      require-permission: ""  # 进入此水域钓鱼所需权限（空=无限制）

    - name: "jade_river"     # 水域唯一标识名
      display-name: "&a翡翠河"  # 水域显示名称（支持颜色代码）
      type: rectangle         # 水域形状类型（rectangle=矩形区域）
      world: "world"          # 所在世界名称
      min: [500, 60, 300]     # 矩形水域最小坐标 [x, y, z]
      max: [700, 80, 400]     # 矩形水域最大坐标 [x, y, z]
      fish-pool: "river"      # 引用的鱼类池ID
      treasure-pool: "common" # 引用的宝藏池ID
      difficulty-modifier: 0.9 # 难度修正系数（0.9=难度降低10%）
      bait-multipliers:       # 饵料在该水域的额外倍率
        worm: 1.0             # 蚯蚓在此水域倍率1.0
        bread: 1.3            # 面包屑在此水域倍率1.3
      require-permission: ""  # 进入此水域钓鱼所需权限（空=无限制）

  # 默认水域（兜底）
  default:
    name: "default"           # 默认水域标识名
    display-name: "&7普通水域"  # 默认水域显示名称
    fish-pool: "default"      # 引用的鱼类池ID
    treasure-pool: "default"  # 引用的宝藏池ID
    difficulty-modifier: 1.0  # 难度修正系数（1.0=标准难度）
    bait-multipliers:         # 饵料在该水域的额外倍率
      worm: 1.0               # 蚯蚓倍率1.0
      bread: 1.0              # 面包屑倍率1.0
      corn: 1.0               # 玉米粒倍率1.0

# ─── 鱼类池 ────────────────────────────────────────
# 引用 fishes/ 目录下的鱼种 ID
fish-pools:
  default:                    # 默认鱼类池（普通水域使用）
    - "sea_bass"              # 海鲈鱼
    - "salmon"                # 鲑鱼
  lake:                       # 湖泊鱼类池
    - "sea_bass"              # 海鲈鱼
    - "catfish"               # 鲶鱼
    - "legendary_carp"        # 传说鲤鱼
  river:                      # 河流鱼类池
    - "salmon"                # 鲑鱼
    - "catfish"               # 鲶鱼
  ocean:                      # 海洋鱼类池
    - "tuna"                  # 金枪鱼
    - "pufferfish"            # 河豚
    - "sea_bass"              # 海鲈鱼

# ─── 宝藏池 ────────────────────────────────────────
# 引用 treasures/ 目录下的宝藏 ID
treasure-pools:
  default:                    # 默认宝藏池（普通水域使用）
    - "old_boot"              # 旧靴子
    - "lost_ring"             # 失落戒指
  common:                     # 普通宝藏池
    - "old_boot"              # 旧靴子
    - "lost_ring"             # 失落戒指
    - "ancient_coin"          # 古币
  rare:                       # 稀有宝藏池
    - "ancient_coin"          # 古币
    - "lost_ring"             # 失落戒指

# ─── 饵料定义 ────────────────────────────────────────
# 饵料不通过本文件配置，请在 baits/ 目录下为每个饵料创建独立 YAML 文件。
# 每个饵料文件支持的字段见 baits/worm.yml 示例：
#   id、display-name、item、default、fish-attract-modifiers、
#   treasure-chance-boost、max-durability-bonus。

# ─── UI 注册 ────────────────────────────────────────
# 这些 UI 文件位于 arcartx/ui/ 目录，由模块在启动时注册到 ArcartX。
ui:
  # 是否在插件启用时自动注册本模块的 UI。
  register-on-enable: true
  # 是否强制覆盖用户已修改的 UI 文件。
  overwrite-ui-files: false
  # 钓鱼小游戏 UI 的 ID。
  minigame-id: "fishing_minigame"
  # 鱼类图鉴 UI 的 ID。
  collection-id: "fishing_collection"
  # 天赋树 UI 的 ID。
  talents-id: "fishing_talents"
  # 赛季等级奖励 UI 的 ID。
  rewards-id: "fishing_rewards"
  # 任务列表 UI 的 ID。
  tasks-id: "fishing_tasks"

# ─── 命令配置 ────────────────────────────────────────
commands:
  # 是否注册 /fishing 命令。
  enabled: true
  # 使用钓鱼命令所需的基础权限节点。
  base-permission: "axs.fishing.use"
