# AXS 资源说明
# 用途: Abyss 副本内 HUD —— 副本名/波次/存活/剩余时间条/任务追踪
# 由服务端在进本时打开、出本关闭；每秒 update 包刷新。
ui:
  isHud: true
  defaultOpen: false
  through: true
  show: true
  packetHandler:
    # packetHandler: update
    # 包字段: dungeonName/status/groupTotal/groupDone/activeGroup/aliveMobs
    #         alivePlayers/totalPlayers/timeText/timeRatio/questRows{idx:{name,status}}
    update: |-
      var.dungeonName = packet['dungeonName']
      var.status = packet['status']
      var.groupTotal = packet['groupTotal']
      var.groupDone = packet['groupDone']
      var.activeGroup = packet['activeGroup']
      var.aliveMobs = packet['aliveMobs']
      var.alivePlayers = packet['alivePlayers']
      var.totalPlayers = packet['totalPlayers']
      var.timeText = packet['timeText']
      var.timeRatio = packet['timeRatio']
      var.questRows = packet['questRows']
      var.quest0 = var.questRows != none ? var.questRows[0.round()] : none
      var.quest1 = var.questRows != none ? var.questRows[1.round()] : none
      var.quest2 = var.questRows != none ? var.questRows[2.round()] : none
  action:
    load: |-
      var.dungeonName = ''
      var.status = ''
      var.groupTotal = 0
      var.groupDone = 0
      var.activeGroup = ''
      var.aliveMobs = 0
      var.alivePlayers = 0
      var.totalPlayers = 0
      var.timeText = ''
      var.timeRatio = 1.0
      var.questRows = {}
      var.quest0 = none
      var.quest1 = none
      var.quest2 = none
      var.accent = '186,140,232,255'
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      副本面板:
        type: Canvas
        attribute:
          point: ~top_right
          x: -24
          y: 96
          width: 320
          height: 224
          through: true
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~20,14,36,170
              shape: ~round_rect
              radius: 12
              through: true
            effect:
              stroke:
                width: 2
                color: ~96,80,140,160
          副本标线:
            type: Texture
            attribute:
              x: 16
              y: 18
              width: 18
              height: 3
              normal: var.accent
              through: true
          副本名:
            type: Text
            attribute:
              x: 42
              y: 8
              texts: "'&f' + var.dungeonName"
              fontSize: 36
              limit: 12
              through: true
          状态行:
            type: Text
            attribute:
              x: 16
              y: 56
              fontSize: 36
              through: true
              texts:
                - "'&8进度  &f' + var.groupDone.round() + '/' + var.groupTotal.round() + (var.activeGroup != '' && var.activeGroup != none ? '   &e' + var.activeGroup : '')"
                - "'&8怪物  &c' + var.aliveMobs.round() + '   &8队员  &a' + var.alivePlayers.round() + '/' + var.totalPlayers.round()"
          时间:
            type: Text
            attribute:
              x: 16
              y: 152
              texts: "'&8剩余时间  &f' + var.timeText"
              fontSize: 36
              through: true
          时间条背景:
            type: Texture
            attribute:
              point: ~bottom_left
              x: 16
              y: -18
              width: 288
              height: 8
              normal: ~40,32,62,220
              shape: ~round_rect
              radius: 4
              through: true
            effect:
              stroke:
                width: 1
                color: ~96,80,140,140
          时间条:
            type: Texture
            attribute:
              point: ~bottom_left
              x: 16
              y: -18
              width: "288 * var.timeRatio"
              height: 8
              normal: "var.timeRatio > 0.3 ? '186,140,232,240' : '235,100,100,240'"
              shape: ~round_rect
              radius: 4
              through: true
      任务面板:
        type: Canvas
        attribute:
          point: ~top_right
          x: -24
          y: 336
          width: 320
          height: 160
          visible: var.quest0 != none
          through: true
        children:
          任务背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~20,14,36,150
              shape: ~round_rect
              radius: 12
              through: true
            effect:
              stroke:
                width: 2
                color: ~96,80,140,120
          任务标线:
            type: Texture
            attribute:
              x: 16
              y: 16
              width: 18
              height: 3
              normal: var.accent
              through: true
          任务标题:
            type: Text
            attribute:
              x: 42
              y: 6
              texts: ~&f任务
              fontSize: 36
              through: true
          任务0:
            type: Text
            attribute:
              x: 16
              y: 48
              texts: "var.quest0 != none ? '&7- ' + var.quest0['name'] + (var.quest0['status'] == 'COMPLETED' ? ' &a✓' : ' &e…') : ''"
              fontSize: 36
              through: true
          任务1:
            type: Text
            attribute:
              x: 16
              y: 86
              texts: "var.quest1 != none ? '&7- ' + var.quest1['name'] + (var.quest1['status'] == 'COMPLETED' ? ' &a✓' : ' &e…') : ''"
              fontSize: 36
              through: true
          任务2:
            type: Text
            attribute:
              x: 16
              y: 124
              texts: "var.quest2 != none ? '&7- ' + var.quest2['name'] + (var.quest2['status'] == 'COMPLETED' ? ' &a✓' : ' &e…') : ''"
              fontSize: 36
              through: true
