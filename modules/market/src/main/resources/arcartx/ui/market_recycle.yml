                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              拍卖行文字:
                type: Text
                attribute:
                  point: ~middle_left
