# AXS 资源说明
# 用途: Prop 模块默认道具示例，演示冷却、使用限制与效果列表写法。
# 前置依赖: ArcartX；Prop 模块启用后生效。
# 启用开关: config.yml -> modules.prop.enabled + modules.prop.password
# 关联文件: ArcartXProp.yml、prop/key.yml、prop/language.yml
# 重载命令: /axs reload prop
# 最小使用路径: coolDownGroup + effects

# 冷却组；同一组内的多个道具会共享冷却时间。
coolDownGroup: "默认冷却组"

# 冷却时间，单位秒。
coolDownTime: 10

# 使用后是否消耗物品。
remove: true

# 是否允许手持右键使用。
hand: true

# 是否允许通过客户端按键触发。
key: true

# 使用权限；留空表示不额外校验权限。
permission: ""

# 使用条件列表；全部满足时才允许使用（AND 逻辑）。
# 格式: <PlaceholderAPI变量> <运算符> <期望值>
# 支持运算符: ==  !=  >=  <=  >  <  contains  regex
# 需要安装 PlaceholderAPI 以解析变量；留空或不填则不检查条件。
#
# ── 数值比较 ──
# conditions:
#   - "%player_level% >= 10"              # 玩家等级 ≥ 10
#   - "%vault_eco_balance% >= 100"        # Vault 余额 ≥ 100
#   - "%player_health% > 5"              # 当前生命值 > 5
#   - "%player_food_level% > 0"          # 饱食度 > 0
#   - "%player_max_health% <= 40"        # 最大生命值 ≤ 40
#   - "%player_exp% != 0"               # 经验值不为 0
#
# ── 字符串精确匹配（支持中文） ──
# conditions:
#   - "%player_world% == world"          # 当前世界为 world
#   - "%player_biome% == 森林"            # 生物群系名称为中文时
#   - "%luckperms_primary_group% == 战士"  # 主权限组为"战士"
#   - "%craneattribute_job% != 无职业"     # 职业不为"无职业"
#
# ── 包含判断（contains，不区分大小写） ──
# conditions:
#   - "%player_world% contains world"    # 世界名包含 "world"
#   - "%luckperms_groups% contains VIP"  # 权限组列表包含 VIP
#   - "%player_biome% contains 沙漠"      # 生物群系名包含"沙漠"
#
# ── 正则匹配（regex，不区分大小写） ──
# conditions:
#   - "%player_name% regex ^[A-Z].*"     # 玩家名以大写字母开头
#   - "%luckperms_primary_group% regex (战士|法师|弓手)"  # 职业为三者之一
conditions: []

# 自动触发配置（可选，整节可省略）。
# 开启后服务端按间隔轮询该道具所在的 ArcartX 快捷槽；
# auto.conditions 全部满足时自动使用（独立于 hand/key 开关）。
# 自动使用仍要经过冷却、权限与上方 conditions 使用条件校验，失败一律静默跳过。
# auto:
#   # 是否启用自动触发。
#   enabled: false
#   # 检查间隔（tick，20 = 1 秒）；0 或缺省表示使用全局 auto-trigger.interval。
#   interval: 0
#   # 自动使用成功时是否给玩家发送提示（language.yml 的 AUTO_USED）。
#   notify: true
#   # 触发条件列表；格式与上方 conditions 一致，全部满足才尝试使用。
#   conditions:
#     - "%player_health% < 10"

# 每种药水和每组属性单独配置 duration，单位为秒。
effects:
  potions:
    - id: minecraft:speed
      level: 2
      duration: 10
      particles: false

  # 可选即时效果
  # health:
  #   points: 4
  #   max-health-percent: 10
  # food: 2
  # experience: 5
  # messages:
  #   - "&a{player} 已获得补给"
  # commands:
  #   - "say {player} 使用了补给"

  # 可选模组属性示例。要求本体模组属性桥接可用，且装有相应模组。
  # mod 和 symphony 支持 add、multiply-base、multiply-total。
  # 倍率填写比例，例 0.2 表示 20%。不同组可作用于同一属性。
  # attributes:
  #   mod:
  #     gun-damage:
  #       duration: 15
  #       modifiers:
  #         - id: gunsmithlib:bullet_damage
  #           amount: 5
  #           operation: add
  #           # amount 也可直接填写 Aria 表达式，例如：
  #           # amount: "math.min(20, 5 + global.stats.symphony('physical_damage') * 0.2)"
  #     fast-reload:
  #       duration: 8
  #       modifiers:
  #         - id: gunsmithlib:reload_speed
  #           amount: 0.2
  #           operation: multiply-total
