# EntityTracker / reward audit ledger
# /axs entitytracker rewards history | /axs entitytracker reload
# History packets do not include aggregate success/failed/pending statistics: show only real totals.
# Original filters, retry token position and pagination calls are unchanged.
# Refresh, pagination and retry request all statuses in the existing server contract.
ui:
  background: true
  escClose: true
  closeDied: true
  show: true
  through: false
  screenScale: true
  action:
    load: |-
      var.historyFilter = 'all'
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.ledgerW = var.viewW - 160
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.ledgerW = var.viewW - 160
  packetHandler:
    history-list: |-
      var.records = packet['records']
      var.currentPage = packet['page']
      var.totalPages = packet['totalPages']
      var.totalCount = packet['totalCount']
      var.actionToken = packet['action_token']
      if(val.记录滑块 != none){ val.记录滑块.setDragYRatio(0) }
    result: |-
      var.resultMsg = packet['message']
controls:
  全屏底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:18;12,18,24,245
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      根面板:
        type: Canvas
        attribute:
          x: "48 - var.offX"
          y: 32
          width: "var.viewW - 96"
          height: "var.viewH - 64"
        children:
          面板底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~22,30,38,250
              shape: ~round_rect
              radius: 8
          模块标记:
            type: Text
            attribute:
              x: 32
              y: 22
              texts: ~&bENTITY TRACKER &7/ DISTRIBUTION AUDIT
              fontSize: 36
              through: true
          标题文字:
            type: Text
            attribute:
              x: 32
              y: 54
              texts: ~&f奖励发放历史
              fontSize: 64
              through: true
          页面说明:
            type: Text
            attribute:
              x: 32
              y: 104
              texts: ~&7按状态核对发放记录；先查看失败原因，再重试。
              fontSize: 36
              through: true
          返回按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -212
              y: 32
              width: 240
              height: 56
            action:
              click: |-
                Packet.send('AXS_ENTITY_TRACKER_REWARD', 'open-manage')
            children:
              返回背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~37,66,77,255
                  hover: ~44,102,114,255
                  through: true
                  shape: ~round_rect
                  radius: 4
              返回文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&b< 返回奖励管理
                  fontSize: 36
                  through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -32
              y: 32
              width: 164
              height: 56
            action:
              clickLeft: Screen.close()
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~37,48,60,255
                  hover: ~115,45,55,255
                  through: true
                  shape: ~round_rect
                  radius: 4
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f关闭 / ESC
                  fontSize: 36
                  through: true
          全部筛选按钮:
            type: Canvas
            attribute:
              x: 32
              y: 158
              width: 160
              height: 64
            action:
              click: |-
                var.historyFilter = 'all'
                Packet.send('AXS_ENTITY_TRACKER_REWARD', 'history-list', none, none, 1)
            children:
              全部筛选背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.historyFilter == 'all' ? '38,88,99,255' : '32,43,54,255'"
                  hover: ~44,102,114,255
                  through: true
                  shape: ~round_rect
                  radius: 4
              全部筛选信号:
                type: Texture
                attribute:
                  point: ~bottom_left
                  width: 160
                  height: 3
                  normal: ~69,211,224,255
                  visible: "var.historyFilter == 'all'"
                  through: true
              全部筛选文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f全部记录
                  fontSize: 48
                  through: true
          成功筛选按钮:
            type: Canvas
            attribute:
              x: 204
              y: 158
              width: 160
              height: 64
            action:
              click: |-
                var.historyFilter = 'success'
                Packet.send('AXS_ENTITY_TRACKER_REWARD', 'history-list', 'success', none, 1)
            children:
              成功筛选背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.historyFilter == 'success' ? '38,88,99,255' : '32,43,54,255'"
                  hover: ~44,102,114,255
                  through: true
                  shape: ~round_rect
                  radius: 4
              成功筛选信号:
                type: Texture
                attribute:
                  point: ~bottom_left
                  width: 160
                  height: 3
                  normal: ~69,211,224,255
                  visible: "var.historyFilter == 'success'"
                  through: true
              成功筛选文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f成功
                  fontSize: 48
                  through: true
          失败筛选按钮:
            type: Canvas
            attribute:
              x: 376
              y: 158
              width: 160
              height: 64
            action:
              click: |-
                var.historyFilter = 'failed'
                Packet.send('AXS_ENTITY_TRACKER_REWARD', 'history-list', 'failed', none, 1)
            children:
              失败筛选背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.historyFilter == 'failed' ? '108,42,54,255' : '32,43,54,255'"
                  hover: ~139,49,63,255
                  through: true
                  shape: ~round_rect
                  radius: 4
              失败筛选信号:
                type: Texture
                attribute:
                  point: ~bottom_left
                  width: 160
                  height: 3
                  normal: ~239,79,89,255
                  visible: "var.historyFilter == 'failed'"
                  through: true
              失败筛选文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&c失败 / 重试
                  fontSize: 36
                  through: true
          待发筛选按钮:
            type: Canvas
            attribute:
              x: 548
              y: 158
              width: 160
              height: 64
            action:
              click: |-
                var.historyFilter = 'pending'
                Packet.send('AXS_ENTITY_TRACKER_REWARD', 'history-list', 'pending', none, 1)
            children:
              待发筛选背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.historyFilter == 'pending' ? '38,88,99,255' : '32,43,54,255'"
                  hover: ~44,102,114,255
                  through: true
                  shape: ~round_rect
                  radius: 4
              待发筛选信号:
                type: Texture
                attribute:
                  point: ~bottom_left
                  width: 160
                  height: 3
                  normal: ~69,211,224,255
                  visible: "var.historyFilter == 'pending'"
                  through: true
              待发筛选文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f待发
                  fontSize: 48
                  through: true
          刷新按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -32
              y: 158
              width: 260
              height: 64
              enable: var.currentPage != none
            action:
              click: |-
                var.historyFilter = 'all'
                Packet.send('AXS_ENTITY_TRACKER_REWARD', 'history-list', none, none, var.currentPage)
            children:
              刷新背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~32,43,54,255
                  hover: ~44,102,114,255
                  through: true
                  shape: ~round_rect
                  radius: 4
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&b刷新全部记录
                  fontSize: 48
                  through: true
          清单标题:
            type: Text
            attribute:
              x: 32
              y: 250
              texts: ~&f发放记录 / 审计清单
              fontSize: 48
              through: true
          总计统计:
            type: Text
            attribute:
              point: ~top_right
              x: -32
              y: 254
              texts: "var.records == none ? '&7等待读取记录' : '&7匹配记录 &b' + var.totalCount + ' &7条'"
              fontSize: 36
              through: true
          列表表头:
            type: Canvas
            attribute:
              x: 32
              y: 300
              width: var.ledgerW
              height: 48
            children:
              表头底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~34,47,59,255
                  through: true
              周期列:
                type: Text
                attribute:
                  x: 20
                  y: 12
                  texts: ~&7周期 / 首领
                  fontSize: 36
                  through: true
              玩家列:
                type: Text
                attribute:
                  x: 360
                  y: 12
                  texts: ~&7玩家
                  fontSize: 36
                  through: true
              排名列:
                type: Text
                attribute:
                  x: 620
                  y: 12
                  texts: ~&7排名
                  fontSize: 36
                  through: true
              类型列:
                type: Text
                attribute:
                  x: 760
                  y: 12
                  texts: ~&7类型
                  fontSize: 36
                  through: true
              奖励列:
                type: Text
                attribute:
                  x: 940
                  y: 12
                  texts: ~&7奖励 / 悬停阅读
                  fontSize: 36
                  through: true
              状态列:
                type: Text
                attribute:
                  point: ~top_right
                  x: -220
                  y: 12
                  texts: ~&7状态
                  fontSize: 36
                  through: true
              操作列:
                type: Text
                attribute:
                  point: ~top_right
                  x: -68
                  y: 12
                  texts: ~&7操作
                  fontSize: 36
                  through: true
          记录滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -32
              y: 360
              width: 10
              height: "var.viewH - 520"
              normal: ~44,57,66,255
          记录滑块:
            type: Texture
            val: 记录滑块
            attribute:
              point: ~top_right
              x: -32
              y: 360
              width: 10
              height: 88
              normal: ~69,211,224,255
              hover: ~142,239,245,255
              maxDragY: "var.viewH - 608"
          列表滚动区:
            type: Scroll
            attribute:
              x: 32
              y: 360
              width: "var.ledgerW - 28"
              height: "var.viewH - 520"
              moveY: "self.parent['记录滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['记录滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['记录滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              清单布局:
                type: VStack
                attribute:
                  width: "var.ledgerW - 28"
                children:
                  列表内容:
                    type: VGrid
                    attribute:
                      width: "var.ledgerW - 28"
                      eachHeight: 156
                      dataList: var.records
                    children:
                      行背景:
                        type: Canvas
                        attribute:
                          width: "var.ledgerW - 28"
                          height: 152
                        children:
                          行底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: "each.status == 'failed' ? '49,31,40,255' : '27,37,47,255'"
                              through: true
                          状态信号:
                            type: Texture
                            attribute:
                              width: 3
                              height: 152
                              normal: "each.status == 'failed' ? '239,79,89,255' : '69,211,224,255'"
                              through: true
                          行分隔:
                            type: Texture
                            attribute:
                              point: ~bottom_left
                              width: "self.parent.width"
                              height: 1
                              normal: ~52,69,81,255
                              through: true
                          周期单元格:
                            type: Text
                            attribute:
                              x: 20
                              y: 20
                              texts: ~&f{each.periodDisplay}
                              limit: 320
                              fontSize: 36
                              through: true
                          首领单元格:
                            type: Text
                            attribute:
                              x: 20
                              y: 62
                              texts: ~&7首领 / &f{each.bossId}
                              limit: 320
                              fontSize: 36
                              through: true
                          玩家窗口:
                            type: Scroll
                            attribute:
                              x: 360
                              y: 16
                              width: 240
                              height: 50
                              scrollAnim: none
                              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                            action:
                              enter: self.scrollAnim = Lerp(0, 1, 4000)
                              leave: self.scrollAnim = none
                            children:
                              玩家布局:
                                type: HStack
                                attribute:
                                  height: 50
                                children:
                                  玩家单元格:
                                    type: Text
                                    attribute:
                                      texts: ~&f{each.playerName}
                                      fontSize: 48
                                      through: true
                          记录编号:
                            type: Text
                            attribute:
                              x: 360
                              y: 62
                              texts: ~&7记录 / {each.id}
                              fontSize: 36
                              through: true
                          排名单元格:
                            type: Text
                            attribute:
                              x: 620
                              y: 18
                              texts: ~&b#{each.rank}
                              fontSize: 48
                              through: true
                          类型单元格:
                            type: Text
                            attribute:
                              x: 760
                              y: 20
                              texts: ~&7{each.rankingTypeDisplay}
                              fontSize: 36
                              limit: 160
                              through: true
                          奖励窗口:
                            type: Scroll
                            attribute:
                              x: 940
                              y: 18
                              width: "var.ledgerW - 1298"
                              height: 54
                              scrollAnim: none
                              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                            action:
                              enter: self.scrollAnim = Lerp(0, 1, 5000)
                              leave: self.scrollAnim = none
                            children:
                              奖励布局:
                                type: HStack
                                attribute:
                                  height: 54
                                children:
                                  奖励单元格:
                                    type: Text
                                    attribute:
                                      texts: ~&f{each.rewardSummary}
                                      fontSize: 36
                                      through: true
                          状态单元格:
                            type: Text
                            attribute:
                              point: ~top_right
                              x: -192
                              y: 34
                              texts: ~{each.statusIcon}
                              fontSize: 36
                              through: true
                          明细窗口:
                            type: Scroll
                            attribute:
                              x: 20
                              y: 106
                              width: "var.ledgerW - 268"
                              height: 32
                              scrollAnim: none
                              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                            action:
                              enter: self.scrollAnim = Lerp(0, 1, 7000)
                              leave: self.scrollAnim = none
                            children:
                              明细布局:
                                type: HStack
                                attribute:
                                  height: 32
                                children:
                                  发放明细:
                                    type: Text
                                    attribute:
                                      texts: "each.status == 'failed' ? '&c失败原因 / &f' + each.failureReason : '&7发放时间 / &f' + each.issuedTime"
                                      fontSize: 36
                                      through: true
                          重试次数:
                            type: Text
                            attribute:
                              point: ~top_right
                              x: -12
                              y: 106
                              texts: ~&7重试 {each.retryCount} 次
                              fontSize: 36
                              through: true
                          重试按钮:
                            type: Canvas
                            attribute:
                              point: ~top_right
                              x: -12
                              y: 20
                              width: 148
                              height: 56
                              visible: each.status == 'failed'
                              enable: "var.actionToken != none && var.actionToken != ''"
                            action:
                              click: |-
                                var.historyFilter = 'all'
                                Packet.send('AXS_ENTITY_TRACKER_REWARD', 'retry', var.actionToken, each.id)
                            children:
                              重试背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~145,47,59,255
                                  hover: ~198,61,75,255
                                  through: true
                                  shape: ~round_rect
                                  radius: 4
                              重试文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: ~&f重试发放
                                  fontSize: 36
                                  through: true
          清单空态:
            type: Canvas
            attribute:
              x: 32
              y: 392
              width: var.ledgerW
              height: 160
              visible: "var.records == none || var.totalCount == '0' || var.totalCount == 0"
            children:
              空态标题:
                type: Text
                attribute:
                  point: ~top_center
                  y: 28
                  texts: "var.records == none ? '&b选择状态以读取发放记录' : '&f当前条件下没有发放记录'"
                  fontSize: 48
                  through: true
              空态说明:
                type: Text
                attribute:
                  point: ~top_center
                  y: 82
                  texts: ~&7可切换全部记录；失败记录才提供重试操作。
                  fontSize: 36
                  through: true
          结果栏:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 32
              y: -88
              width: var.ledgerW
              height: 56
            children:
              结果底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~17,25,33,255
                  through: true
              结果提示:
                type: Text
                attribute:
                  x: 20
                  y: 16
                  texts: "var.resultMsg != none ? var.resultMsg : '&7操作回执 / 翻页、刷新和重试后显示全部状态'"
                  limit: "var.ledgerW - 40"
                  fontSize: 36
                  through: true
          浏览说明:
            type: Text
            attribute:
              point: ~bottom_left
              x: 32
              y: -38
              texts: ~&7每页最多 20 条 / 滚轮或拖动滑块
              fontSize: 36
              through: true
          分页控件:
            type: Canvas
            attribute:
              point: ~bottom_right
              x: -32
              y: -20
              width: 600
              height: 56
            children:
              页码:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "var.records == none ? '&7等待记录' : '&f' + var.currentPage + ' &7/ &f' + var.totalPages"
                  fontSize: 48
                  through: true
              上一页按钮:
                type: Canvas
                attribute:
                  width: 164
                  height: 56
                  enable: "var.currentPage != none && var.currentPage > 1"
                action:
                  click: |-
                    if (var.currentPage > 1) {
                      var.historyFilter = 'all'
                      Packet.send('AXS_ENTITY_TRACKER_REWARD', 'history-list', none, none, var.currentPage - 1)
                    }
                children:
                  上一页背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: "self.parent.enable ? '37,66,77,255' : '31,39,48,255'"
                      hover: ~44,102,114,255
                      through: true
                      shape: ~round_rect
                      radius: 4
                  上一页文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f< 上一页
                      fontSize: 36
                      through: true
              下一页按钮:
                type: Canvas
                attribute:
                  point: ~top_right
                  width: 164
                  height: 56
                  enable: "var.currentPage != none && var.currentPage < var.totalPages"
                action:
                  click: |-
                    if (var.currentPage < var.totalPages) {
                      var.historyFilter = 'all'
                      Packet.send('AXS_ENTITY_TRACKER_REWARD', 'history-list', none, none, var.currentPage + 1)
                    }
                children:
                  下一页背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: "self.parent.enable ? '37,66,77,255' : '31,39,48,255'"
                      hover: ~44,102,114,255
                      through: true
                      shape: ~round_rect
                      radius: 4
                  下一页文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f下一页 >
                      fontSize: 36
                      through: true
