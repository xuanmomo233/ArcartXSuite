# =============================================================================
# 示例系统商店配置
# =============================================================================
# 每个 .yml 文件定义一个独立的商店，文件名（不含扩展名）即为商店 ID。
# 文件放置路径: <模块数据目录>/shops/ 目录下
# 首次启动时，若 shops 目录为空，会自动导出此示例文件。
#
# 商店 ID 用法:
#   - 命令: /market shop <商店ID> 打开指定商店
#   - UI 中通过商店列表选择
#   - PAPI 占位符: %axsmarket_shop_<id>_stock% 等
#
# 物品来源 (item.source) 支持:
#   minecraft  - 原版 Minecraft 物品，item.id 为 Bukkit Material 名
#   mythic     - MythicMobs 自定义物品，item.id 为 MythicMobs 内部名称
#   neige      - NeigeItems 自定义物品，item.id 为 NeigeItems 物品 ID
#   overture   - Overture 自定义物品，item.id 为 Overture 物品 ID
#   mmoitems   - MMOItems 自定义物品，item.id 格式为 "TYPE;ID"
#
# 货币类型 (currency):
#   具体可用值取决于 CurrencyBridgeManager 注册的桥接器。
#   常见值: "money"(Vault经济)、"points"(PlayerPoints) 等。
#
# ─── 图标配置（商店 icon / 商品 icon）─────────────────────────────────────────
# 与 Menu 模块的 icon 用法完全一致：icon 需写成配置节，字段如下。
# 商品省略 icon 时，直接用 item 生成的物品当图标。
# icon:
#   material: NETHER_STAR         — 材质（Minecraft 物品 ID，大写）
#   name: "&b图标名称"             — 图标悬浮名称（支持 & 颜色码）
#   custom-model-data: 0          — 自定义模型数据（用于资源包自定义贴图，配合ItemsAdder或CraftEngine使用）
#   amount: 1                     — 物品数量（显示为堆叠数）
#   lore:                         — 物品描述（列表）
#     - "&7第一行描述"
#     - "&7第二行描述"
#   glow: true                    — 附魔光效
#   skull-texture: "base64..."    — 自定义头颅材质（material 为 PLAYER_HEAD 时）
#   color: "#FF5555"              — 皮革盔甲颜色（material 为 LEATHER_* 时）
#   --- 物品库图标（source + id 直接调用物品库的物品）---
#   source: "neigeitems"          — 物品来源 (neigeitems/mythicmobs/overture/mmoitems)
#   id: "herb_bundle"             — 物品库中的物品 ID
#   mmo-type: "SWORD"             — MMOItems 类型（source 为 mmoitems 时，代替 id）
#   mmo-id: "STEEL_SWORD"         — MMOItems ID（source 为 mmoitems 时，代替 id）
#   --- 直接发送 json/NBT 给 slot 控件（完全自定义物品）---
#   json: '{"id":"minecraft:diamond_sword","Count":1b}' — 直接提供物品 NBT JSON（会忽略上面的 material 等字段）
#   --- ArcartX 自定义贴图（在 material 物品上写入 NBT，无需资源包 CustomModelData）---
#   原理：ArcartX 读取物品的 icon / url NBT 来渲染自定义贴图（详见ArcartX wiki：自定义物品贴图）
#   texture: "item"               — 写入 icon NBT，渲染 resource/item_icon/ 下的贴图（手持 / AX-UI）；子目录用 "xxx/xxx"
#   或（写法三选一）
#   texture-url: "menu/icon.png"  — 写入 url NBT，仅用于原版 GUI(箱子菜单)图标，支持文件路径 / 网络链接 / GIF
#   或（写法三选一）
#   nbt:                          — 写法一：键值映射，逐个写入字符串 NBT（键: 值）
#     icon: "item"                — 等同于上述texture: "item"
#     url: "https://example.com/icon.gif"  — 等同于上述texture-url
#     CustomTag: "value"          — 任意自定义字符串标签
#   或（nbt 两种写法二选一）
#   nbt: "{CustomTag:'value',Unbreakable:1b}" — 写法二：整段 SNBT 字符串，可写入数字/字节/数组等任意类型标签
#   注意：icon.nbt 只改变 UI 中图标的外观；玩家买到手的物品由 item.nbt 决定（见示例 2）。
# =============================================================================

# ── 商店基础信息 ──
# 商店在 UI 中显示的名称（支持 & 颜色码）
display-name: "&6综合商店"
# 商店图标材质（Bukkit Material 枚举名，用于菜单列表显示）
# 也可写成完整图标定义，例如：
# icon:
#   material: "DIAMOND"
#   name: "&6综合商店"
#   glow: true
#   nbt: "{CustomTag:'shop_main'}"
icon:
  material: "DIAMOND"
# 查看此商店所需的权限（空字符串表示无限制）
permission: ""
# 分类标签（用于 UI 筛选功能，可定义多个）
tags: ["综合", "基础"]

# ── 商品列表 ──
# 每个键为商品唯一标识（内部使用，不会在 UI 中显示）
items:
  # ═══════════════════════════════════════════════════════════════════════════
  # 示例 1: 原版 Minecraft 物品（无限库存）
  # ═══════════════════════════════════════════════════════════════════════════
  diamond_sword:
    ###########################################################################
    # 商品实际发放的物品定义
    item:
      # 物品来源
      source: "minecraft"
      # 物品 ID: Bukkit Material 枚举名
      id: "DIAMOND_SWORD"
    ###########################################################################
    # 注意！！！
    # 上方的item配置节为真实发放的物品
    # 而下方icon为你想展示在商店的图标
    # 例如你不想展示商品真实物品信息，或者想推销商品，可修改lore打广告
    # 省略下方icon时直接用 item 生成的物品作为图标
    # 完整可用字段见文件顶部「图标配置」
    icon:
      material: "DIAMOND_SWORD"
      name: "&b锋利的钻石剑"
      lore:
        - "&7示例商品图标"
      # 自定义 NBT 写法一：键值映射（icon / url 即 ArcartX 贴图键）
      # nbt:
      #   icon: "item"
      #   CustomTag: "shop_diamond_sword"
      # 自定义 NBT 写法二：整段 SNBT 字符串
      # nbt: "{Enchantments:[{id:'minecraft:sharpness',lvl:5s}]}"
    ###########################################################################
    # 在商店 UI 中显示的名称，顶替的是item的物品来源名称（覆盖物品本身的名称）
    # 上方icon的name为鼠标移动到商品，其tooltip显示物品的名称，而这里的display为商店UI货架展示的名称
    display-name: "&b钻石剑"
    # 玩家从商店购买此物品的价格（设为 0 或省略表示不可购买）
    buy-price: 500
    # 玩家出售此物品给商店的价格（设为 0 或省略表示不可出售）
    sell-price: 100
    # 货币类型（覆盖商店默认货币）
    currency: "money"
    # 库存模式:
    #   unlimited  - 无限库存，可无限购买
    #   global     - 全服共享库存，所有玩家共用同一库存量
    #   per-player - 每个玩家独立库存，互不影响
    stock-mode: "unlimited"
    # 库存数量（unlimited 模式下此值无效）
    # 当库存为 0 时，商品在 UI 中显示为"已售罄"且不可购买
    stock-amount: 0
    # 每个玩家的购买上限（0 = 无限制）
    # 用于控制玩家在一定周期内最多可购买的数量
    limit-per-player: 0
    # 限购重置周期:
    #   daily   - 每日重置（服务器时间 00:00）
    #   weekly  - 每周重置（周一 00:00）
    #   monthly - 每月重置（1日 00:00）
    #   never   - 从不重置（终身限购）
    limit-reset: "never"
    # 折扣配置（权限节点 → 折扣比例）
    # 拥有对应权限的玩家购买时享受折扣
    # 例: 原价 100，折扣 0.9 → 实际支付 90
    # 若同时拥有多个折扣权限，取最低折扣值
    discount:
      "axsmarket.vip": 0.9    # VIP 享受 9 折
      "axsmarket.mvp": 0.8    # MVP 享受 8 折
    # 上架条件（满足所有条件才显示在商店中，由 AXS 统一条件系统评估）
    # 每行一条表达式，支持写法：
    #   "%player_level% >= 30"                        - PAPI 占位符比较（需 PlaceholderAPI）
    #   "aria: player.hasPermission('xxx')"           - Aria 脚本（可判断权限等）
    #   "js: player.getLevel() >= 10"                 - JS 脚本
    #   "{variable} == value"                         - 上下文变量
    # 也可使用 Map 列表或嵌套节（type: aria/js 或 placeholder+operator+value）
    conditions: []              # 空 = 无限制

  # ═══════════════════════════════════════════════════════════════════════════
  # 示例 2: 原版 Minecraft 物品（带 NBT，每人每日限量）
  # ═══════════════════════════════════════════════════════════════════════════
  healing_potion:
    item:
      source: "minecraft"
      id: "POTION"
      # 原版物品 NBT 数据（SNBT 格式），用于指定药水类型、附魔等
      # 此示例生成"强效治疗药水"（Instant Health II）
      # 这里的 nbt 决定玩家买到的物品，与 icon.nbt 无关
      nbt: "{Potion:'minecraft:strong_healing'}"
    display-name: "&d强效治疗药水"
    buy-price: 50
    sell-price: 10
    currency: "money"
    stock-mode: "per-player"
    stock-amount: 64          # 每个玩家最多库存 64 个
    limit-per-player: 128     # 每人每日最多购买 128 个
    limit-reset: "daily"
    discount: {}              # 空对象表示无折扣
    conditions: []            # 无上架条件

  # ═══════════════════════════════════════════════════════════════════════════
  # 示例 3: MythicMobs 自定义物品（全服限量，周限购）
  # ═══════════════════════════════════════════════════════════════════════════
  # 前提: 需在 plugins/MythicMobs/Items/ 目录下配置 ExampleMythicSword.yml
  mythic_weapon_example:
    item:
      source: "mythic"
      id: "ExampleMythicSword"
    display-name: "&6传说之剑"
    buy-price: 10000
    sell-price: 0               # 0 = 不可出售给商店
    currency: "points"          # 使用 PlayerPoints 点数货币
    stock-mode: "global"
    stock-amount: 5             # 全服共享 5 把
    limit-per-player: 1         # 每人每周限购 1 把
    limit-reset: "weekly"
    discount: {}
    conditions:
      # 需要权限节点 + 原版等级 >= 30
      - "aria: player.hasPermission('axsmarket.shop.legendary')"
      - "%player_level% >= 30"

  # ═══════════════════════════════════════════════════════════════════════════
  # 示例 4: NeigeItems 自定义物品（全服限量，日限购）
  # ═══════════════════════════════════════════════════════════════════════════
  # 前提: 需在 plugins/NeigeItems/Items/ 目录下配置 NeigeFishRod.yml
  neige_fishing_rod:
    item:
      source: "neige"
      id: "NeigeFishRod"
    display-name: "&e神奇钓鱼竿"
    buy-price: 3000
    sell-price: 600
    currency: "money"
    stock-mode: "global"
    stock-amount: 8             # 全服共享 8 根
    limit-per-player: 2         # 每人每日限购 2 根
    limit-reset: "daily"
    discount: {}
    conditions:
      - "%player_level% >= 10"  # 原版等级 >= 10

  # ═══════════════════════════════════════════════════════════════════════════
  # 示例 5: Overture 自定义物品（全服限量，终身限购，VIP折扣）
  # ═══════════════════════════════════════════════════════════════════════════
  # 前提: 需在 plugins/Overture/items/ 目录下配置 OvertureTreasure.yml
  overture_treasure_box:
    item:
      source: "overture"
      id: "OvertureTreasure"
    display-name: "&d神秘宝藏"
    buy-price: 5000
    sell-price: 0
    currency: "money"
    stock-mode: "global"
    stock-amount: 3             # 全服共享 3 个
    limit-per-player: 1         # 每人终身限购 1 个
    limit-reset: "never"
    discount:
      "axsmarket.vip": 0.85   # VIP 享受 8.5 折
    conditions:
      - "aria: player.hasPermission('axsmarket.shop.vip')"

  # ═══════════════════════════════════════════════════════════════════════════
  # 示例 6: MMOItems 自定义物品（每人限量，周限购）
  # ═══════════════════════════════════════════════════════════════════════════
  # 前提: 需在 plugins/MMOItems/item/armor/ 目录下配置 STEEL_HELMET.yml
  # item.id 格式: "TYPE;ID"，TYPE 为 MMOItems 物品类型（如 ARMOR, SWORD 等）
  mmoitems_steel_helmet:
    item:
      source: "mmoitems"
      id: "ARMOR;STEEL_HELMET"
    display-name: "&7钢盔"
    buy-price: 1200
    sell-price: 240
    currency: "points"
    stock-mode: "per-player"
    stock-amount: 1             # 每个玩家库存 1 个
    limit-per-player: 1         # 每人每周限购 1 个
    limit-reset: "weekly"
    discount: {}
    conditions:
      - "%player_level% >= 20"  # 原版等级 >= 20

  # ═══════════════════════════════════════════════════════════════════════════
  # 示例 7: 指令商品（不发放物品，只执行奖励指令）
  # ═══════════════════════════════════════════════════════════════════════════
  command_reward_example:
    # 指令商品不生成物品，只在扣款成功后执行奖励指令
    type: "command"  # 指令商品：不生成物品，仅执行 reward-commands
    # 指令商品没有实际物品，图标必须由 icon 提供
    # 完整可用字段见文件顶部「图标配置」
    icon:
      material: "NETHER_STAR"
      name: "&d指令奖励"
      lore:
        - "&7购买后由控制台执行奖励指令"
      # 其余可选字段示例：
      # amount: 1
      # custom-model-data: 10001
      # glow: true
      # skull-texture: "base64..."
      # color: "#FF5555"
      # --- ArcartX 自定义贴图（与 Menu 完全相同的两种写法）---
      # texture: "item"                 — 写入 icon NBT，渲染 resource/item_icon/ 下的贴图
      # texture-url: "menu/reward.png"  — 写入 url NBT，用于原版 GUI(箱子菜单)图标
      # 等价写法：直接用 nbt 子键写 icon / url
      # nbt:
      #   icon: "item"                            — 等同于 texture: "item"
      #   url: "https://example.com/reward.gif"   — 等同于 texture-url
      #   CustomTag: "command_reward"             — 任意自定义字符串标签
      # 或写成整段 SNBT（与上面的 nbt 键值映射二选一）
      # nbt: "{icon:'item',CustomTag:'command_reward',Unbreakable:1b}"
    display-name: "&d指令奖励"
    buy-price: 100
    sell-price: 0
    currency: "money"
    reward-commands:  # 由控制台执行；支持 {player}/{uuid}/{amount}
      - "give {player} diamond {amount}"
      - "say 恭喜 {player} 获得指令奖励"
    stock-mode: "unlimited"
    stock-amount: 0
    limit-per-player: 0
    limit-reset: "never"
    discount: {}
