    dimension: ""
    texture: ""
    image-width: 4096
    image-height: 4096
    pixel-offset-x: 0
    pixel-offset-z: 0
    default-zoom: 1.2
    hud-zoom: 0.18
    hud-size: 180
    regions: []
  DANTIAO:
    enabled: true
    display-name: "明辉殿"
    dimension: ""
