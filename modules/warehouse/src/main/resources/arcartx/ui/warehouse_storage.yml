# AXS Warehouse Storage - 重构版
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航 + 内容区
# 布局: 左导航(仓库/银行/管理) + 内容区(检索侧栏 + 仓库主区 + 背包区)
# 配色: 暖橙铜(木箱感) 主色200,130,70 底36,30,24,235 抬升48,40,32,245 描边90,72,52,220
# 逻辑: packetHandler/action/val引用/entryKey/copy 与原版一致，仅重构布局结构与配色

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 包标识符（'AXS_WAREHOUSE'）
    #   - action_token: 操作令牌（防重放）
    #   - ownerType: 仓库所有者类型（personal / shared）
    #   - ownerId: 所有者 ID
    #   - warehouseId: 仓库 ID
    #   - warehouseName: 仓库名称
    #   - categoryId: 当前分类 ID
    #   - search: 搜索关键词
    #   - categories: 分类列表
    #   - categoryTexts: 分类显示文本
    #   - personalWarehouses: 个人仓库列表
    #   - personalWarehouseTexts: 个人仓库显示文本
    #   - sharedWarehouses: 共享仓库列表
    #   - sharedWarehouseStorageTexts: 共享仓库存储显示文本
    #   - slots: 仓库槽位数据
    #   - selectedSlot: 当前选中的槽位索引
    #   - selectedItem: 当前选中的物品
    #   - backpack: 玩家背包数据
    #   - unlocked: 二级密码是否已解锁
    #   - hasPassword: 是否已设置二级密码
    #   - readOnly: 是否只读模式
    #   - sharedEditMode: 共享仓库是否处于编辑模式
    #   - sharedCanEdit: 当前玩家是否有编辑权限
    #   - lockOwner: 编辑锁持有者
    #   - page: 当前页码
    #   - pageTotal: 总页数
    #   - pageText: 页码显示文本
    #   - capacityText: 容量显示文本
    #   - used: 已使用容量
    #   - capacity: 总容量
    #   - level: 仓库等级
    #   - canUpgrade: 是否可升级
    #   - nextUpgradeText: 下一级升级信息文本
    #   - nextLevel: 下一级等级
    #   - nextCapacity: 下一级容量
    #   - usedSlots: 已使用的槽位集合
    #   - matchedSlots: 搜索匹配的槽位集合
    #   - slotCount: 槽位总数
    #   - pageSize: 每页槽位数量
    #   - maxPersonalCount: 个人仓库最大数量（用于动态创建控件）
    #   - maxSharedCount: 共享仓库最大数量
    #   - maxCategoryCount: 分类最大数量
    update: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.categoryId = packet['categoryId']
      var.search = packet['search']
      var.sortId = packet['sortId']
      var.sortText = packet['sortText']
      var.categories = packet['categories']
      var.categoryTexts = packet['categoryTexts']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseStorageTexts = packet['sharedWarehouseStorageTexts']
      var.slots = packet['slots']
      var.selectedSlot = packet['selectedSlot']
      var.selectedItem = packet['selectedItem']
      var.backpack = packet['backpack']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.sharedEditMode = packet['sharedEditMode']
      var.sharedCanEdit = packet['sharedCanEdit']
      var.lockOwner = packet['lockOwner']
      var.page = packet['page']
      var.pageTotal = packet['pageTotal']
      var.pageText = packet['pageText']
      var.capacityText = packet['capacityText']
      var.used = packet['used']
      var.capacity = packet['capacity']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.nextLevel = packet['nextLevel']
      var.nextCapacity = packet['nextCapacity']
      var.usedSlots = packet['usedSlots']
      var.matchedSlots = packet['matchedSlots']
      var.slotCount = packet['slotCount']
      var.pageSize = packet['pageSize']
      var.maxPersonalCount = packet['maxPersonalCount']
      var.maxSharedCount = packet['maxSharedCount']
      var.maxCategoryCount = packet['maxCategoryCount']
      // 模板保留在索引 0，只有复制出来的控件才是数据行。
      个人仓库数 = var.maxPersonalCount.round()
      现有个人仓库数 = val.个人仓库列表.childrenCount() - 1
      if(现有个人仓库数 != 个人仓库数 - 1){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.个人仓库列表.childrenCount() > 1){
          val.个人仓库列表.get(1).remove()
        }
        if(个人仓库数 > 1){
          for(序号 in range(1, 个人仓库数 - 1)){
            项 = val.个人仓库列表['项'].copy('个人仓库项_' + var.刷新轮次.round() + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      共享仓库数 = var.maxSharedCount.round()
      现有共享仓库数 = val.共享仓库列表.childrenCount() - 1
      if(现有共享仓库数 != 共享仓库数 - 1){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.共享仓库列表.childrenCount() > 1){
          val.共享仓库列表.get(1).remove()
        }
        if(共享仓库数 > 1){
          for(序号 in range(1, 共享仓库数 - 1)){
            项 = val.共享仓库列表['项'].copy('共享仓库项_' + var.刷新轮次.round() + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      分类数 = var.maxCategoryCount.round()
      现有分类数 = val.分类列表.childrenCount() - 1
      if(现有分类数 != 分类数 - 1){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.分类列表.childrenCount() > 1){
          val.分类列表.get(1).remove()
        }
        if(分类数 > 1){
          for(序号 in range(1, 分类数 - 1)){
            项 = val.分类列表['项'].copy('分类项_' + var.刷新轮次.round() + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      var.renderBackpackAmounts()
      var.itemJsons = {}
      if(var.slots != none){
        for(key in var.slots.keys()){
          json = packet['slotItemJson' + key]
          if(json != none){
            var.itemJsons[key] = json
          } else {
            var.itemJsons[key] = var.air
          }
        }
      }
      仓库槽位数 = var.pageSize.round()
      现有仓库槽位数 = val.仓库网格.childrenCount() - 1
      if(现有仓库槽位数 != 仓库槽位数 - 1){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.仓库网格.childrenCount() > 1){
          val.仓库网格.get(1).remove()
        }
        if(仓库槽位数 > 1){
          for(序号 in range(1, 仓库槽位数 - 1)){
            slot = val.仓库网格['物品图标'].copy('仓库物品图标_' + var.刷新轮次.round() + '_' + 序号.round())
            slot.entryKey = 序号.round()
          }
        }
      }
      for(i in range(0, 仓库槽位数 - 1)){
        icon = val.仓库网格.get(i.round())
        if(icon != none){
          icon.seticon()
        }
      }
      // update 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.packetId = 'AXS_WAREHOUSE'
      var.ownerType = 'personal'
      var.ownerId = none
      var.warehouseId = none
      var.warehouseName = 'AXPM 仓库'
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.categoryId = 'all'
      var.search = none
      var.sortId = 'time'
      var.sortText = '时间'
      var.categories = {}
      var.categoryTexts = {}
      var.personalWarehouses = {}
      var.personalWarehouseTexts = {}
      var.sharedWarehouses = {}
      var.sharedWarehouseStorageTexts = {}
      var.slots = {}
      var.itemJsons = {}
      var.air = '{"id": "minecraft:air","Count":1b}'
      var.selectedSlot = -1
      var.selectedItem = none
      var.backpack = {}
      var.unlocked = false
      var.hasPassword = false
      var.readOnly = false
      var.sharedEditMode = false
      var.sharedCanEdit = false
      var.lockOwner = none
      var.page = 1
      var.pageTotal = 1
      var.pageText = '1/1'
      var.capacityText = '0/0'
      var.used = 0
      var.capacity = 0
      var.level = 1
      var.canUpgrade = false
      var.nextUpgradeText = none
      var.slotCount = 0
      var.pageSize = 0
      var.amount = 1.round()
      var.passwordText = none
      var.categoryScrollRatio = 0
      var.switchScrollRatio = 0
      var.selectedBackpackSlot = -1
      var.lastBackpackClickSlot = none
      var.lastBackpackClickTime = 0
      var.lastSlotClickSlot = none
      var.lastSlotClickTime = 0
      var.emptyItemJson = '{"id": "minecraft:air","Count":1b}'
      var.maxPersonalCount = 0
      var.maxSharedCount = 0
      var.maxCategoryCount = 0
      var.刷新轮次 = 0.round()
      var.renderBackpackAmounts = -> {
        if(val.背包网格 != none){
          for(raw in range(9,44)){
            control = raw == 9 ? val.背包网格['背包槽'] : val.背包网格['背包槽' + (raw - 9).round]
            entry = var.backpack[raw.round()]
            if(control != none){
              amountText = none
              if(entry != none && !entry['empty']){
                amountText = '&f' + entry['amount'].round()
              }
              amountControl = control['数量']
              if(amountControl != none){
                amountControl.texts = amountText
              }
            }
          }
        }
      }
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.filterW = 280
      var.mainW = var.contentW - var.filterW - 24
      var.backpackW = 460
      var.gridW = var.mainW - var.backpackW
    open: |-
      Packet.send(var.packetId, 'refresh')
    # 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.filterW = 280
      var.mainW = var.contentW - var.filterW - 24
      var.backpackW = 460
      var.gridW = var.mainW - var.backpackW

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）；置于顶层以覆盖整块屏幕
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;30,24,18,110
  # 自适配布局：宽高 = 设计分辨率(1920x1080)，顶部锚点使顶栏紧贴屏幕顶部
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏（沿窗口整宽铺满）───────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~90,72,52,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~200,130,70,255
              shape: ~round_rect
              radius: 3
          仓库名:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "'&f' + var.warehouseName"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 320
              width: 1
              height: 30
              normal: ~90,72,52,220
          仓库副标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 340
              width: 700
              texts: "'&eLv.' + var.level.round() + '  ' + var.capacityText + ' 格  ' + (var.readOnly ? '&c只读 ' + var.lockOwner : (var.unlocked ? '&a已解锁' : '&c未解锁'))"
              fontSize: 28
          # 右侧：共享仓库操作 + 关闭
          顶栏操作组:
            type: HStack
            attribute:
              point: ~middle_right
              x: -112
              height: 48
              spaceBetween: 10
            children:
              只读:
                type: Canvas
                attribute:
                  visible: var.ownerType == 'shared'
                  width: 96
                  height: 48
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'shared_mode', 'readonly')
                children:
                  只读底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.sharedEditMode ? '120,80,50,225' : '48,40,32,245'"
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '230,160,100,255' : (var.sharedEditMode ? '200,130,70,235' : '90,72,52,220')"
                  只读字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 96
                      texts: "~&f只读"
                      fontSize: 30
                      through: true
              存取:
                type: Canvas
                attribute:
                  visible: var.ownerType == 'shared'
                  width: 96
                  height: 48
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'shared_mode', 'edit')
                children:
                  存取底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.sharedEditMode && !var.readOnly ? '120,80,50,225' : (var.sharedCanEdit ? '48,40,32,245' : '150,58,58,225')"
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
                  存取字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 96
                      texts: "~&f存取"
                      fontSize: 30
                      through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~48,40,32,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 40
                  texts: "~&f✕"
                  fontSize: 32
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~90,72,52,220
          # 当前页：仓库
          导航仓库:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            children:
              仓库底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~200,130,70,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~200,130,70,230
              仓库高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~200,130,70,255
                  shape: ~round_rect
                  radius: 2
              仓库文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0仓库"
                  fontSize: 36
          导航银行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'bank')
            children:
              银行底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~48,40,32,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
              银行文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f银行"
                  fontSize: 36
                  through: true
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'manage')
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~48,40,32,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f管理"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 232
              width: 264
              height: 2
              normal: ~90,72,52,220
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: "~&fESC 关闭界面"
              fontSize: 28

      # ── 内容区（检索侧栏 + 仓库主区 + 背包区）─────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~90,72,52,220

          # ── 检索侧栏（搜索 + 分类 + 仓库切换）──────────────
          检索侧栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 20
              width: "var.filterW - 40"
              height: "var.viewH - 184"
            children:
              检索标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 0
                  y: 0
                  width: 240
                  texts: "~&f检索"
                  fontSize: 34
              搜索框:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 0
                  y: 44
                  width: 240
                  height: 48
                children:
                  搜索框底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~40,34,28,225
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
                  输入框:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 10
                      width: 220
                      height: 38
                      length: 32
                      emptyText: ~搜索物品
                      fontSize: 32
                    action:
                      textChange: |-
                        var.search = self.getContent()
                      enter: |-
                        Packet.send(var.packetId, 'search', var.search)
              搜索按钮组:
                type: HStack
                attribute:
                  point: ~top_left
                  x: 0
                  y: 100
                  width: 240
                  height: 48
                  spaceBetween: 10
                children:
                  搜索:
                    type: Canvas
                    attribute:
                      width: 115
                      height: 48
                    action:
