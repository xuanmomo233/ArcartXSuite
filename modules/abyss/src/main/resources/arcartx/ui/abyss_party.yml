          空队提示:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 100
              texts: ~&7当前没有队伍，邀请玩家自动创建
              fontSize: 36
              visible: "!var.hasParty"
          右栏:
            type: Canvas
            attribute:
              point: ~top_right
              x: -28
              y: 84
              width: 280
              height: 440
            children:
              邀请标题:
                type: Text
                attribute:
                  point: ~top_left
                  texts: ~&e邀请玩家
                  fontSize: 36
              邀请输入:
                type: Canvas
                attribute:
                  point: ~top_left
                  y: 44
                  width: 280
                  height: 44
                children:
                  输入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,42,50,225
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
                  输入框:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 6
                      width: 260
                      height: 32
                      length: 16
                      emptyText: ~&7玩家名
                      fontSize: 36
                    action:
                      textChange: |-
                        var.inviteName = self.getContent()
              邀请按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  y: 96
                  width: 120
                  height: 40
                action:
                  clickLeft: |-
                    if(var.inviteName != none && var.inviteName != ''){
                      Packet.send(var.packetId, 'party_invite', var.inviteName, var.actionToken)
                      Packet.send(var.packetId, 'open_party_ui', var.actionToken)
                    }
                children:
                  邀请底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~60,140,80,240
                      hover: ~80,170,100,250
                      shape: ~round_rect
                      radius: 10
                      through: true
                  邀请字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f邀请
                      fontSize: 36
                      through: true
              邀请列表:
