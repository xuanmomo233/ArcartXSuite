                    action:
                      clickLeft: |-
                        // 收集货币附件行数据为 JSON（含 icon 字段）
                        curList = []
                        for(i in range(0, val.货币附件滚动区.childrenCount() - 1)){
                          row = val.货币附件滚动区.get(i.round())
                          if(row != none){
                            cur = row['货币输入'].getContent()
                            amt = row['金额输入'].getContent()
                            desc = row['描述输入'].getContent()
                            if(cur != none && cur != '' && amt != none && amt != ''){
                              entry = {'currency': cur, 'amount': amt, 'description': desc}
                              // 收集 icon 字段
                              iconMat = row['图标材质输入'].getContent()
                              if(iconMat != none && iconMat != ''){
                                entry['iconMaterial'] = iconMat
                                iconCmd = row['图标CMD输入'].getContent()
                                entry['iconCustomModelData'] = iconCmd != none && iconCmd != '' ? iconCmd : '0'
                                entry['iconTexture'] = row['图标纹理输入'].getContent()
                                entry['iconTextureUrl'] = row['图标URL输入'].getContent()
                                entry['iconName'] = row['图标名称输入'].getContent()
                                entry['iconLore'] = row['图标描述输入'].getContent()
                              }
                              curList.add(entry)
                            }
                          }
                        }
                        // Fallback: 如果 UI 行为空（用户未访问货币副面板），使用 var.editCurrencyList
                        if(curList.size() == 0 && var.editCurrencyList != none && var.editCurrencyList.size() > 0){
                          for(i in range(0, var.editCurrencyList.size() - 1)){
                            src = var.editCurrencyList[i.round()]
                            if(src != none){
                              entry = {'currency': src['currency'], 'amount': src['amount'], 'description': src['description']}
                              if(src['iconMaterial'] != none && src['iconMaterial'] != ''){
                                entry['iconMaterial'] = src['iconMaterial']
                                entry['iconCustomModelData'] = src['iconCustomModelData'] != none ? src['iconCustomModelData'] : '0'
                                entry['iconTexture'] = src['iconTexture']
                                entry['iconTextureUrl'] = src['iconTextureUrl']
                                entry['iconName'] = src['iconName']
                                entry['iconLore'] = src['iconLore']
                              }
                              curList.add(entry)
                            }
                          }
                        }
                        // 收集 CDK 行数据为 JSON（含 expiresAt/expireMode）
                        cdkList = []
                        for(i in range(0, val.CDK滚动区.childrenCount() - 1)){
                          row = val.CDK滚动区.get(i.round())
                          if(row != none){
                            code = row['CDK码输入'].getContent()
                            if(code != none && code != ''){
                              mode = row.expireMode != none ? row.expireMode : 'relative'
                              expInput = row['过期输入'].getContent()
                              cdkEntry = {'code': code, 'enabled': row.cdkEnabled != false, 'maxClaims': row['最大领取输入'].getContent(), 'expireMode': mode}
                              if(mode == 'absolute'){
                                cdkEntry['expiresAt'] = expInput
                                cdkEntry['expiresAfter'] = ''
                              } else {
                                cdkEntry['expiresAfter'] = expInput
                                cdkEntry['expiresAt'] = ''
                              }
                              cdkList.add(cdkEntry)
                            }
                          }
                        }
                        // Fallback: 如果 UI 行为空（用户未访问 CDK 副面板），使用 var.editCdkList
                        if(cdkList.size() == 0 && var.editCdkList != none && var.editCdkList.size() > 0){
                          for(i in range(0, var.editCdkList.size() - 1)){
                            src = var.editCdkList[i.round()]
                            if(src != none){
                              mode = src['expireMode'] != none ? src['expireMode'] : 'relative'
                              cdkEntry = {'code': src['code'], 'enabled': src['enabled'], 'maxClaims': src['maxClaims'], 'expireMode': mode}
                              if(mode == 'absolute'){
                                cdkEntry['expiresAt'] = src['expiresAt']
                                cdkEntry['expiresAfter'] = ''
                              } else {
                                cdkEntry['expiresAfter'] = src['expiresAfter']
                                cdkEntry['expiresAt'] = ''
                              }
                              cdkList.add(cdkEntry)
                            }
                          }
                        }
