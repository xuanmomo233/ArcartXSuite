                  fontSize: 32
                  through: true
                  limit: 12
          标题分隔线:
            type: Texture
            attribute:
              x: 32
              y: 150
              width: 856
              height: 1
              normal: ~255,255,255,28
              through: true
          简介标题:
            type: Text
            attribute:
              x: 32
              y: 182
              texts: ~&f副本说明
              fontSize: 32
              through: true
          简介底:
            type: Texture
            attribute:
              x: 32
              y: 230
              width: 500
              height: 196
              normal: ~34,39,46,255
              shape: ~round_rect
              radius: 10
              through: true
          描述:
            type: Canvas
            attribute:
              x: 54
              y: 250
              width: 456
              height: 152
              through: true
            children:
              文字:
                type: Canvas
                attribute:
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  through: true
                children:
                  行0:
                    type: Text
                    attribute:
                      fontSize: 32
                      point: ~top_left
                      x: 0
                      y: 0.0
                      width: self.parent.width
                      height: 20.0
                      limitControl: self.parent
                      texts: '''&f'' + var.desc0'
                      through: true
                  行1:
                    type: Text
                    attribute:
                      fontSize: 32
                      point: ~top_left
                      x: 0
                      y: 24.0
                      width: self.parent.width
                      height: 20.0
                      limitControl: self.parent
                      texts: '''&7'' + var.desc1'
                      through: true
                  行2:
                    type: Text
                    attribute:
                      fontSize: 32
                      point: ~top_left
                      x: 0
                      y: 48.0
                      width: self.parent.width
                      height: 20.0
                      limitControl: self.parent
                      texts: '''&7'' + var.desc2'
                      through: true
          条件标题:
            type: Text
            attribute:
              x: 566
              y: 182
              texts: ~&f进入条件
              fontSize: 32
              through: true
          条件底:
            type: Texture
            attribute:
              x: 566
              y: 230
              width: 322
              height: 196
              normal: ~34,39,46,255
              shape: ~round_rect
              radius: 10
              through: true
          队伍条件:
            type: Text
            attribute:
              x: 588
              y: 250
              texts: "'&7人数 &f' + var.minPlayers.round() + ' - ' + var.maxPlayers.round() + ' 人'"
              fontSize: 32
              through: true
          体力条件:
            type: Text
            attribute:
              x: 588
              y: 294
              texts: "'&7体力 &f' + var.staminaCost.round()"
              fontSize: 32
              through: true
          门票条件:
            type: Text
            attribute:
              x: 588
              y: 338
              texts: "'&7门票 &f' + var.moneyCost.round()"
              fontSize: 32
              through: true
          时间条件:
            type: Text
            attribute:
              x: 588
              y: 382
              texts: "'&7时限/冷却 &f' + var.timeLimit.round() + 's / ' + var.cooldown.round() + 's'"
              fontSize: 32
              through: true
          风险提示:
            type: Text
            attribute:
              x: 34
              y: 446
              texts: ~&e确认后将立即进入副本并扣除对应资源。
              fontSize: 32
              through: true
          进入按钮:
            type: Canvas
            attribute:
              x: 612
              y: 494
              width: 276
              height: 58
              enable: "var.actionToken != none && var.actionToken != ''"
            action:
              clickLeft: |-
                if(var.actionToken != none && var.actionToken != ''){
                  Packet.send(var.packetId, 'enter', var.dungeonId, var.actionToken)
                }
            children:
              进入底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.actionToken != none && var.actionToken != '' ? '76,132,205,255' : '55,61,69,220'"
                  hover: "var.actionToken != none && var.actionToken != '' ? '94,157,235,255' : '55,61,69,220'"
                  shape: ~round_rect
                  radius: 9
                  through: true
              进入字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "var.actionToken != none && var.actionToken != '' ? '&f确认进入' : '&7等待数据'"
                  fontSize: 32
                  through: true
          取消按钮:
            type: Canvas
            attribute:
              x: 424
              y: 494
              width: 164
              height: 58
            action:
              clickLeft: "Screen.close()"
            children:
              取消底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~43,49,58,255
                  hover: ~54,61,71,255
                  shape: ~round_rect
                  radius: 9
                  through: true
                effect:
                  stroke:
                    width: 1
                    color: ~255,255,255,34
              取消字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f取消
                  fontSize: 32
                  through: true
