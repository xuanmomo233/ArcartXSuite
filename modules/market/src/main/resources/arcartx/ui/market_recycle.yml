                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              系统商店文字:
                type: Text
                attribute:
                  point: ~middle_left
