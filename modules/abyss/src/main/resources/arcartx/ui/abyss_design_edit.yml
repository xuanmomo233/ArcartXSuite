# AXS 资源说明
# 用途: Abyss 设计模式对象编辑面板（范式版·数据驱动）——标量字段 + 脚本/列表行
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
#
# 通讯协议:
#   服务端 → init/update: packetId/action_token/objKey/objId/kindLabel/kindIcon/
#     summary/dirty/fieldRows{idx:{name,editor,label,value,valueZh,options}}/fieldCount/
#     groupRows{idx:{field,label,lines{idx},lineCount}}/groupCount
#   客户端 → Packet.send('abyss', ...):
#     design_set <objKey> <field> <value> <token>   design_cycle <objKey> <field> <token>
#     design_remark <objKey> <field> <token>        design_rename <objKey> <newId> <token>
#     design_line_add/set/del <objKey> <field> [idx] [text] <token>
#     design_back <token>                           返回主面板
#
# 实现要点: copy 后立即访问子控件不可靠，下一帧挂载后再预填真实值。
# 行/组重建走引用字典 + 轮次名；
# 编辑态 var.editField 按字段名匹配组卡。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.objKey = packet['objKey']
      var.objId = packet['objId']
      var.kindLabel = packet['kindLabel']
      self.actions['resize']()
      var.icon = packet['kindIcon']
      var.summary = packet['summary']
      var.dirty = packet['dirty']
      var.fieldRows = packet['fieldRows']
      var.fieldCount = packet['fieldCount']
      var.groupRows = packet['groupRows']
      var.groupCount = packet['groupCount']
      var.editField = ''
      var.editI = -1
      var.rebuildPhase = 1
    update: |-
      var.objId = packet['objId']
      var.summary = packet['summary']
      var.dirty = packet['dirty']
      var.fieldRows = packet['fieldRows']
      var.fieldCount = packet['fieldCount']
      var.groupRows = packet['groupRows']
      var.groupCount = packet['groupCount']
      var.editField = ''
      var.editI = -1
      var.rebuildPhase = 1
  action:
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'design_edit', var.actionToken, var.viewNonce)
      }
    load: |-
      var.actionToken = ''
      var.rebuildPhase = 0
      var.fieldRows = {}
      var.groupRows = {}
      var.fieldCount = 0
      var.groupCount = 0
      var.objKey = ''
      var.objId = ''
      var.kindLabel = ''
      var.icon = ''
      var.summary = ''
      var.dirty = false
      var.已建_字段容器 = -1
      var.已建_组容器 = -1
      var.viewNonce = ''
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.colW = var.kindLabel == '配置文件' ? var.viewW - 96 : (var.viewW - 160) / 2
      var.rightBase = var.kindLabel == '配置文件' ? 48 : 108 + var.colW
      var.packetId = 'abyss'
      var.editI = -1
      var.editField = ''
      var.字段引用 = {}
      var.组引用 = {}
      var.行引用 = {}
      var.轮次 = 0
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.colW = var.kindLabel == '配置文件' ? var.viewW - 96 : (var.viewW - 160) / 2
      var.rightBase = var.kindLabel == '配置文件' ? 48 : 108 + var.colW
    open: |-
      Packet.send('abyss', 'view_ready', 'design_edit')
      Sound.self('minecraft:block.note_block.pling', 0.8, 8)
    # Three frames: remove generated descendants, mount groups, then expand each group's own line template.
    # Never clone a parent while its template still contains generated child rows.
    tick: |-
      if(var.rebuildPhase == 1){
        self.actions['clearGenerated']()
        var.rebuildPhase = 2
      }elif(var.rebuildPhase == 2){
        self.actions['copyGroups']()
        var.rebuildPhase = 3
      }elif(var.rebuildPhase == 3){
        self.actions['fillFields']()
        self.actions['copyLines']()
        var.rebuildPhase = 0
      }
    fillFields: |-
      val.rename_input.setContent(var.objId)
      if(var.fieldCount > 0){
        for(fi in range(0, var.fieldCount - 1)){
          field = var.fieldRows['' + fi.round()]
          if(field['editor'] == 'TEXT' || field['editor'] == 'NUMBER'){
            row = fi == 0 ? val.字段容器.get(0) : var.字段引用[fi.round()]
            row['输入壳']['输入框'].setContent(field['value'])
          }
        }
      }
    clearGenerated: |-
      for(groupKey in var.行引用.keys()){
        for(lineKey in var.行引用[groupKey].keys()){
          var.行引用[groupKey][lineKey].remove()
        }
      }
      for(key in var.组引用.keys()){ var.组引用[key].remove() }
      for(key in var.字段引用.keys()){ var.字段引用[key].remove() }
      var.行引用 = {}
      var.组引用 = {}
      var.字段引用 = {}
      var.轮次 = (var.轮次 + 1).round()
    copyGroups: |-
      模板 = val.字段容器.get(0)
      模板.entryKey = 0.round()
      if(var.fieldCount > 1){
        for(i in range(1, var.fieldCount - 1)){
          行 = 模板.copy('字段行_' + var.轮次 + '_' + i.round())
          行.entryKey = i.round()
          var.字段引用[i.round()] = 行
        }
      }
      组模板 = val.组容器.get(0)
      组模板.entryKey = 0.round()
      if(var.groupCount > 1){
        for(i in range(1, var.groupCount - 1)){
          组 = 组模板.copy('组卡_' + var.轮次 + '_' + i.round())
          组.entryKey = i.round()
          var.组引用[i.round()] = 组
        }
      }
    copyLines: |-
      if(var.groupCount > 0){
        for(gi in range(0, var.groupCount - 1)){
          gObj = var.groupRows['' + gi.round()]
          gCtl = gi == 0 ? val.组容器.get(0) : var.组引用[gi.round()]
          if(gCtl != none){
            行容器 = gCtl['行容器']
            行模板 = 行容器.get(0)
            行模板.entryKey = 0.round()
            var.行引用['' + gi.round()] = {}
            if(gObj['lineCount'] > 1){
              for(li in range(1, gObj['lineCount'] - 1)){
                行 = 行模板.copy('行_' + var.轮次 + '_' + gi.round() + '_' + li.round())
                行.entryKey = li.round()
                var.行引用['' + gi.round()][li.round()] = 行
              }
            }
          }
        }
      }
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;8,9,10,238
      through: true
  自适应全局布局:
