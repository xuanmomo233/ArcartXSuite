# 文件用途: 完整版在线玩家列表 TAB HUD（带玩家头像 + PING 图标）。
# 对应 Tab 定义: tabs/demo.yml（ui-id: "tab-rich"，packet-handler: "tab"）。
# 消费 map 形态 pack（字典列表），每个元素含 uuid / name / ping / health 字段。
# 布局: 顶部居中毛玻璃背景 + 多列 VGrid 玩家行（头像 + 名称 + PING）。
# 特性: 按住 TAB 显示，松开隐藏；玩家头像通过 PlayerSkin 纹理渲染。
ui:
  isHud: true  # 是否为 HUD（无界面容器，直接渲染到屏幕）
  hide:
  - player_list  # 隐藏原版 player_list 控件
  escClose: false  # 按 ESC 不关闭（HUD 常驻）
  defaultOpen: true  # 模块加载时默认打开此 HUD
  action:
    load: |-
      var.RichTAB刷新轮次 = 0
      var.RichTAB在线人数 = 0
      var.RichTAB显示 = false
    # UI 加载时初始化变量
    # 按下 TAB 键: 请求服务端刷新并计算列数
    keyPress: |-
      if(self.currentKeyPress() == "TAB"){
        Packet.send("TAB","update")
        var.RichTAB单列数量 = math.ceil(var.RichTAB在线人数 / val.RichTAB遍历.row)
        var.RichTAB第一列人数 = math.min(var.RichTAB在线人数, 15)
        var.RichTAB显示 = true
      }
    # 松开 TAB 键: 隐藏列表
    keyRelease: |-
      if(self.currentKeyReleased() == "TAB"){
        var.RichTAB显示 = false
      }
  packetHandler:
    # 完整版示例：消费 map 形态 pack（uuid / name / ping / health 等字段）。
    # 服务端配置参考 ArcartXTab.yml 中的 tabs.demo，pack 写法为：
    #   pack:
    #     uuid: "{player_uuid}"
    #     name: "%axstab_pvp_color%%axstab_vanish_color%%player_name%"
    #     ping: "%axstab_ping_icon%"
    #     health: "%player_health%"
    tab: |-
      i = 0
      var.RichTAB刷新轮次 = var.RichTAB刷新轮次 + 1
      while(val.RichTAB遍历2.childrenCount() > 1){
        val.RichTAB遍历2.get(1).remove()
      }
      //与 tab.yml 同样使用伪判断绕过 ax 控件复制 BUG
      while(i < packet.size()){
        if(val.player_row != none) {
          ROW = val.player_row.copy('rich_player_' + var.RichTAB刷新轮次 + '_' + i.round())
          ROW['头部'].normal = 'PlayerSkin:' + packet.get(i).uuid
          ROW['名称文字'].texts = packet.get(i).name
          ROW['ping_text'].texts = packet.get(i).ping
          ROW.visible = true
        }
        i++
      }
      var.RichTAB在线人数 = packet.size()
      var.RichTAB单列数量 = math.ceil(var.RichTAB在线人数 / val.RichTAB遍历.row)
      var.RichTAB第一列人数 = math.min(var.RichTAB在线人数, 15)
# ============ 控件定义 ============
controls:
  自适应全局布局:  # 顶层自适应布局，锚定屏幕顶部居中
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      RichTAB背景:  # 毛玻璃半透明背景面板，宽度随列数动态变化
        type: Texture
        attribute:
          point: ~top_center
          width: 50 + 322 * var.RichTAB单列数量  # 宽度 = 基础宽度 + 每列宽度 * 列数
          height: 70 + 32 * var.RichTAB第一列人数  # 高度随第一列人数动态调整
          y: 40
          normal: ~Frosted:30;0,0,0,255  # 毛玻璃材质，30 模糊度，黑色不透明
          visible: var.RichTAB显示  # 仅按住 TAB 时显示
          shape: ~round_rect
          radius: 20
        effect:
          stroke:  # 描边
            width: 3
            color: ~0,0,0,255
        children:
          标题:  # 标题文字"在线玩家（完整版）："
            type: Text
            attribute:
              y: 23
              x: 26
              fontSize: 33
              texts: "'&a在线玩家（完整版）：'"
              lineSpace: 8
          RichTAB遍历:  # 玩家行占位网格（VGrid），创建时预复制 118 个 ROW 模板
            type: VGrid
            val: RichTAB遍历
            attribute:
              spaceBetweenY: 2
              spaceBetweenX: 2
              row: 15  # 每列最多 15 行
              y: 60
              x: 26
            action:
              # 创建时预生成 118 个占位行（对应最大在线人数），按 ID 控制可见性
              create: |-
                for(i in range(1, 119)){
                  ROW = self['ROW'].copy('ROW' + i.round())
                  ROW.ID = i.round()
                }
            children:
              ROW:  # 单个玩家行占位模板（灰色圆角背景），按 ID 和在线人数控制可见
                type: Texture
                val: ROW
                attribute:
                  width: 320
                  height: 30
                  shape: ~round_rect
                  radius: 8
                  ID: 0.round()
                  normal: ~95,95,95,200
                  visible: var.RichTAB显示 && self.ID < var.RichTAB在线人数  # 仅显示在线人数范围内的行
          RichTAB遍历2:  # 玩家内容渲染网格，packetHandler 动态复制 player_row 填充头像/名称/PING
            type: VGrid
            val: RichTAB遍历2
            attribute:
              spaceBetweenY: 2
              spaceBetweenX: 2
              row: 15
              y: 60
              x: 26
            children:
              player_row:  # 玩家行内容模板（Canvas），packetHandler 复制后填充头像/名称/PING
                type: Canvas
                val: player_row
                attribute:
                  width: 320
                  height: 30
                  x: 4
                  y: 4
                  visible: false  # 默认隐藏，packetHandler 中设为 true
                children:
                  头部:  # 玩家头像（Texture），normal 设为 PlayerSkin:<uuid>
                    type: Texture
                    attribute:
                      width: 28
                      height: 28
                      x: 0
                      y: 0
                      shape: ~round_rect
                      radius: 4
                      normal: "~120,120,120,255"
                  名称文字:  # 玩家名称（含 PVP/vanish 颜色前缀）
                    type: Text
                    attribute:
                      x: 36
                      y: 0
                      fontSize: 28
                      texts: "~none"
                      lineSpace: 4
                  ping_text:  # PING 延迟图标（由 %axstab_ping_icon% 渲染）
                    type: Text
                    attribute:
                      x: 250
                      y: 0
                      fontSize: 28
                      texts: "~none"
                      lineSpace: 4
