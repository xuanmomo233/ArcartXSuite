# 文件用途: 原神祈愿风格抽奖界面（AXS:lottery_gacha）的客户端 UI 配置。
# 本文件只负责渲染与交互回传，抽奖概率、保底、消耗与积分兑换全部由服务端处理。
# 界面结构: 单一 Adaptive 根 -> 主面板（卡池导航 + UP 展示 + 资源栏 + 保底进度 + 操作栏）
#           + 单抽/十连结果层 + 历史/详情/兑换三个弹层（全部与结果层同级，不再嵌套在结果层里面）。
# 抽奖流程为「包驱动」: 点击只发请求并进入等待态，result / batch_result 到达后才展示结果；
# 若服务端只回 update（消耗不足等失败情形），等待态会被自动解除。
ui:
  match:
    - "AXS:lottery_gacha"  # 匹配的界面 ID
  isHud: false  # 非 HUD，为弹出式菜单界面
  through: false  # 不穿透点击
  escClose: true  # 按 ESC 可关闭界面
  background: false  # 不渲染原版背景
  closeDied: false  # 玩家死亡时不关闭界面
  show: true  # 界面可见
  screenScale: true  # 启用屏幕等比缩放
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包 ID，回传操作时使用
    #   - poolName / poolType / poolDescription: 当前卡池名称、类型与描述
    #   - poolList: 卡池名称列表（key 为 "0"、"1"… 的纯数字字符串）
    #   - currentPoolIndex: 当前卡池索引
    #   - poolCount: 当前 packetId 对应的卡池总数
    #   - guaranteedUp / fatePoints / fateTarget: 玩家 UP 保证状态与命运点状态
    #   - fatePointCap: 命运点上限
    #   - softPityStart / softPityIncrement: 软保底起点与递增值
    #   - upRate / base5Rate / base4Rate: UP、基础 5 星与基础 4 星概率
    #   - action_token: 操作令牌，每次 update 换发，回传时必须带上
    #   - upItemName / upItemStar / upItemDesc / upItemIcon: UP 物品展示信息（无描述时 upItemDesc 为空）
    #   - pity4 / pity5: 玩家当前 4 星、5 星累计未出次数
    #   - pity4Limit / pity5Limit: 保底上限次数，0 表示未知
    #   - guaranteeDesc: 服务端格式化好的保底说明文案
    #   - costRows / costTenRows: 单抽与十连的消耗条目（含 type/id/amount/displayName/icon/owned）
    #   - tenAvailable: 当前卡池是否配置了十连消耗，false 时隐藏十连按钮
    #   - resourceRows: 当前卡池涉及的资源余额
    # 说明: owned 为 -1 表示余额未知（外部货币桥不可用），界面显示 "—" 且不判定为不足。
    init: |-
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.packetId = packet['packetId']
      var.poolName = packet['poolName']
      var.poolType = packet['poolType']
      var.poolDescription = packet['poolDescription']
      var.poolList = packet['poolList'] != none ? packet['poolList'] : {}
      var.currentPoolIndex = packet['currentPoolIndex'] != none ? packet['currentPoolIndex'] : 0
      var.poolCount = packet['poolCount']
      var.actionToken = packet['action_token']
      var.upItemName = packet['upItemName']
      var.upItemStar = packet['upItemStar'] != none ? packet['upItemStar'] : 0
      var.upItemDesc = packet['upItemDesc']
      var.guaranteedUp = packet['guaranteedUp']
      var.guaranteedUpText = packet['guaranteedUpText']
      var.guaranteedNotUpText = packet['guaranteedNotUpText']
      var.guaranteedUnknownText = packet['guaranteedUnknownText']
      var.guaranteedStatusText = packet['guaranteedStatusText']
      var.upItemIcon = packet['upItemIcon']
      var.pity4 = packet['pity4'] != none ? packet['pity4'] : 0
      var.pity5 = packet['pity5'] != none ? packet['pity5'] : 0
      var.pity4Limit = packet['pity4Limit'] != none ? packet['pity4Limit'] : 0
      var.pity5Limit = packet['pity5Limit'] != none ? packet['pity5Limit'] : 0
      var.guaranteeDesc = packet['guaranteeDesc']
      var.costRows = packet['costRows'] != none ? packet['costRows'] : {}
      var.costTenRows = packet['costTenRows'] != none ? packet['costTenRows'] : {}
      var.tenAvailable = packet['tenAvailable'] == true
      var.resourceRows = packet['resourceRows'] != none ? packet['resourceRows'] : {}
      // UP 物品图标
      val.UP物品槽.seticon()
      // 卡池导航按钮
      for(i in range(0, 12)){
        key = i.round()
        e = val.卡池导航列表['卡池按钮' + key]
        if(e != none){
          e.entryKey = key
        }
      }
      // 消耗区与资源栏图标
      for(i in range(0, 4)){
        key = i.round()
        e = val.单抽消耗区['消耗条目' + key]
        if(e != none){
          e['图标'].seticon()
        }
        t = val.十连消耗区['消耗条目' + key]
        if(t != none){
          t['图标'].seticon()
        }
        r = val.资源栏['资源条目' + key]
        if(r != none){
          r['图标'].seticon()
        }
      }
    # packetHandler: update
    # 包字段与 init 相同，用于切换卡池、抽奖结束后刷新数据。
    # 额外职责: 若处于等待态但本次没有结果包（抽奖失败），解除等待态回到主面板。
    update: |-
      var.packetId = packet['packetId']
      var.poolName = packet['poolName']
      var.poolType = packet['poolType']
      var.poolDescription = packet['poolDescription']
      var.poolList = packet['poolList'] != none ? packet['poolList'] : {}
      var.currentPoolIndex = packet['currentPoolIndex'] != none ? packet['currentPoolIndex'] : 0
      var.poolCount = packet['poolCount']
      var.actionToken = packet['action_token']
      var.upItemName = packet['upItemName']
      var.upItemStar = packet['upItemStar'] != none ? packet['upItemStar'] : 0
      var.upItemDesc = packet['upItemDesc']
      var.guaranteedUp = packet['guaranteedUp']
      var.guaranteedUpText = packet['guaranteedUpText']
      var.guaranteedNotUpText = packet['guaranteedNotUpText']
      var.guaranteedUnknownText = packet['guaranteedUnknownText']
      var.guaranteedStatusText = packet['guaranteedStatusText']
      var.upItemIcon = packet['upItemIcon']
      var.pity4 = packet['pity4'] != none ? packet['pity4'] : 0
      var.pity5 = packet['pity5'] != none ? packet['pity5'] : 0
      var.pity4Limit = packet['pity4Limit'] != none ? packet['pity4Limit'] : 0
      var.pity5Limit = packet['pity5Limit'] != none ? packet['pity5Limit'] : 0
      var.guaranteeDesc = packet['guaranteeDesc']
      var.costRows = packet['costRows'] != none ? packet['costRows'] : {}
      var.costTenRows = packet['costTenRows'] != none ? packet['costTenRows'] : {}
      var.tenAvailable = packet['tenAvailable'] == true
      var.resourceRows = packet['resourceRows'] != none ? packet['resourceRows'] : {}
      val.UP物品槽.seticon()
      for(i in range(0, 4)){
        key = i.round()
        e = val.单抽消耗区['消耗条目' + key]
        if(e != none){
          e['图标'].seticon()
        }
        t = val.十连消耗区['消耗条目' + key]
        if(t != none){
          t['图标'].seticon()
        }
        r = val.资源栏['资源条目' + key]
        if(r != none){
          r['图标'].seticon()
        }
      }
      // 抽奖失败时服务端只回 update: 解除等待态
      if(var.pulling != none && var.pulling == true && var.resultPending != none && var.resultPending != true){
        var.pulling = false
        val.等待层.visible = false
        val.主面板.visible = true
      }
    # packetHandler: result（单抽结果）
    # 包字段:
    #   - resultCount: 结果数量
    #   - resultItemJsons / resultItemNames / resultItemStars / resultItemUps: 结果映射（key 为 "1" 起的数字字符串）
    #   - resultCountRequested: 请求抽取数量
    #   - guaranteed: 本次是否触发大保底
    #   - fatePointTriggered: 本次是否触发命运点
    #   - pity4 / pity5: 抽后的保底计数
    #   - highestStar: 本次最高星级
    result: |-
      var.resultCount = packet['resultCount'] != none ? packet['resultCount'] : 0
      var.resultItemJsons = packet['resultItemJsons'] != none ? packet['resultItemJsons'] : {}
      var.resultItemNames = packet['resultItemNames'] != none ? packet['resultItemNames'] : {}
      var.resultItemStars = packet['resultItemStars'] != none ? packet['resultItemStars'] : {}
      var.resultItemUps = packet['resultItemUps'] != none ? packet['resultItemUps'] : {}
      var.guaranteed = packet['guaranteed'] == true
      var.fatePointTriggered = packet['fatePointTriggered'] == true
      var.pity4 = packet['pity4'] != none ? packet['pity4'] : var.pity4
      var.pity5 = packet['pity5'] != none ? packet['pity5'] : var.pity5
      var.highestStar = packet['highestStar'] != none ? packet['highestStar'] : 0
      var.resultPending = true
      val.单抽结果卡片['物品槽'].seticon()
      async {
        Thread.sleep(var.revealMs)
        val.等待层.visible = false
        val.单抽结果层.visible = true
        var.pulling = false
        var.resultPending = false
      }
    # packetHandler: batch_result（十连结果，字段与 result 相同）
    batch_result: |-
      var.resultCount = packet['resultCount'] != none ? packet['resultCount'] : 0
      var.resultItemJsons = packet['resultItemJsons'] != none ? packet['resultItemJsons'] : {}
      var.resultItemNames = packet['resultItemNames'] != none ? packet['resultItemNames'] : {}
      var.resultItemStars = packet['resultItemStars'] != none ? packet['resultItemStars'] : {}
      var.resultItemUps = packet['resultItemUps'] != none ? packet['resultItemUps'] : {}
      var.guaranteed = packet['guaranteed'] == true
      var.fatePointTriggered = packet['fatePointTriggered'] == true
      var.pity4 = packet['pity4'] != none ? packet['pity4'] : var.pity4
      var.pity5 = packet['pity5'] != none ? packet['pity5'] : var.pity5
      var.highestStar = packet['highestStar'] != none ? packet['highestStar'] : 0
      var.resultPending = true
      for(i in range(1, 11)){
        key = i.round()
        e = val.十连网格['十连卡片' + key]
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      async {
        Thread.sleep(var.revealMs)
        val.等待层.visible = false
        val.十连结果层.visible = true
        var.pulling = false
        var.resultPending = false
      }
    # packetHandler: history（祈愿记录）
    # 包字段:
    #   - historyPoolName: 卡池名称
    #   - historyCount: 记录条数
    #   - historyRows: 记录行（含 pullTime/pullCount/itemsJson/pityAtPull/guaranteed/timeText/summary）
    # 说明: 界面只使用服务端格式化好的 timeText 与 summary，不在客户端解析时间戳。
    history: |-
      var.historyPoolName = packet['historyPoolName']
      var.historyCount = packet['historyCount'] != none ? packet['historyCount'] : 0
      var.historyRows = packet['historyRows'] != none ? packet['historyRows'] : {}
      val.历史面板.visible = true
    # packetHandler: details（卡池详情）
    # 包字段:
    #   - detailPoolName / detailCount / detailRows: 卡池名称、条目数与条目行（name/rarity/weight）
    #   - detailPity5 / detailPity4: 5 星、4 星保底次数
    #   - detailBase5Rate / detailBase4Rate / detailUpRate: 基础概率与 UP 概率
    details: |-
      var.detailPoolName = packet['detailPoolName']
      var.detailCount = packet['detailCount'] != none ? packet['detailCount'] : 0
      var.detailRows = packet['detailRows'] != none ? packet['detailRows'] : {}
      var.detailPity5 = packet['detailPity5']
      var.detailPity4 = packet['detailPity4']
      var.detailBase5Rate = packet['detailBase5Rate']
      var.detailBase4Rate = packet['detailBase4Rate']
      var.detailUpRate = packet['detailUpRate']
      val.详情面板.visible = true
    # packetHandler: exchange（积分兑换商店）
    # 包字段:
    #   - pointBalanceRows: 玩家各类积分余额（含 id/displayName/icon/amount）
    #   - exchangeCount: 商品数量
    #   - exchangeRows: 商品行（含 id/name/icon/costRows/limit/used/remaining/canExchange）
    exchange: |-
      var.pointBalanceRows = packet['pointBalanceRows'] != none ? packet['pointBalanceRows'] : {}
      var.exchangeCount = packet['exchangeCount'] != none ? packet['exchangeCount'] : 0
      var.exchangeRows = packet['exchangeRows'] != none ? packet['exchangeRows'] : {}
      for(i in range(0, 4)){
        key = i.round()
        p = val.积分余额栏['积分条目' + key]
        if(p != none){
          p['图标'].seticon()
        }
      }
      for(i in range(0, 20)){
        key = i.round()
        e = val.兑换列表['兑换行' + key]
        if(e != none){
          e['商品图标'].seticon()
        }
      }
      val.兑换面板.visible = true
  action:
    # load 事件: 初始化星级配色、稀有度配色与界面状态变量
    load: |-
      var.starColors = {}
      var.starColors[3] = '118,140,168,255'  # 3 星 - 蓝灰
      var.starColors[4] = '168,120,220,255'  # 4 星 - 紫
      var.starColors[5] = '232,180,90,255'   # 5 星 - 金
      var.starColors[none] = '128,128,128,255'
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.revealMs = 1600       # 等待层到结果层的过场时长（毫秒）
      var.pulling = false       # 是否正在祈愿（防连点）
      var.resultPending = false # 本次祈愿是否已收到结果包
      var.pointBalanceRows = {}
      var.exchangeRows = {}
      var.exchangeCount = 0
    # open 事件: 每次打开界面复位所有层
    open: |-
      var.pulling = false
      var.resultPending = false
      val.主面板.visible = true
      val.等待层.visible = false
      val.单抽结果层.visible = false
      val.十连结果层.visible = false
      val.历史面板.visible = false
      val.详情面板.visible = false
      val.兑换面板.visible = false
  defaultOpen: true  # 界面打开时自动触发 open 事件

# ─── 控件树（书写顺序即叠层顺序，弹层写在最后）────────────────────
controls:
  自适应根:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      # 背景遮罩: 全屏半透明黑底
      背景遮罩:
        type: Texture
        attribute:
          point: ~stretch_all
          normal: ~0,0,0,190

      # 主面板: 顶栏资源 + 卡池导航 + 主视觉 + 保底进度 + 操作栏
      主面板:
        type: Canvas
        val: 主面板
        attribute:
          point: ~middle_center
          width: 1760
          height: 940
        children:
          # ── 面板底: 浅色雾面底 + 双层浅金描边 ─────────────────
          面板外光:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~226,196,132,40
              shape: ~round_rect
              radius: 26
              through: true
            effect:
              neon:
                color: ~255,238,196,90
                size: 14
                intensity: 0.5
                animated: false
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~26,30,44,244
              shape: ~round_rect
              radius: 22
            effect:
              gradient:
                color1: ~38,46,72,255
                color2: ~30,40,64,255
                type: 0
                angleDeg: 90
              stroke:
                width: 3
                color: ~226,196,132,255
              shadow:
                xOffset: 0
                yOffset: 8
                blur: 22
                color: ~40,40,70,120
          面板内金线:
            type: Texture
            attribute:
              point: ~middle_center
              width: 1744
              height: 924
              normal: ~0,0,0,0
              shape: ~round_rect
              radius: 18
              through: true
            effect:
              stroke:
                width: 1
                color: ~255,246,214,220
          面板顶部霞光:
            type: Texture
            attribute:
              point: ~horizontal_stretch_top
              height: 260
              normal: ~255,255,255,14
              shape: ~round_rect
              radius: 22
              through: true
            effect:
              gradient:
                color1: ~255,255,255,45
                color2: ~255,255,255,0
                type: 0
                angleDeg: 90

          # ── 顶栏 ──────────────────────────────────────────
          顶栏:
            type: Canvas
            attribute:
              point: ~horizontal_stretch_top
              height: 92
            children:
              顶栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~255,255,255,18
                  shape: ~round_rect
                  radius: 20
                  through: true
                effect:
                  gradient:
                    color1: ~255,255,255,30
                    color2: ~255,255,255,8
                    type: 0
                    angleDeg: 90
              顶栏金线:
                type: Texture
                attribute:
                  point: ~horizontal_stretch_bottom
                  height: 2
                  normal: ~226,196,132,150
                  through: true
              顶栏金线高光:
                type: Texture
                attribute:
                  point: ~bottom_center
                  width: 560
                  height: 4
                  normal: ~255,238,196,235
                  shape: ~round_rect
                  radius: 2
                  through: true
                effect:
                  neon:
                    color: ~255,226,158,140
                    size: 8
                    intensity: 0.6
                    animated: false
              标题星外框:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 26
                  width: 44
                  height: 44
                  normal: ~46,54,84,240
                  shape: ~round_rect
                  radius: 14
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: ~226,196,132,235
              标题星中框:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 34
                  width: 28
                  height: 28
                  normal: ~226,196,132,255
                  shape: ~round_rect
                  radius: 9
                  through: true
              标题星芯:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 42
                  width: 12
                  height: 12
                  normal: ~226,196,132,220
                  shape: ~round_rect
                  radius: 4
                  through: true
                effect:
                  neon:
                    color: ~255,238,196,190
                    size: 10
                    intensity: 0.8
                    animated: false
              标题文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 86
                  texts:
                    - ~&f祈愿
                  fontSize: 38
                  through: true
              标题竖线:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 162
                  width: 2
                  height: 34
                  normal: ~180,220,255,60
                  through: true
              副标题文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 178
                  texts: "var.poolName != none && var.poolName != '' ? '&7' + var.poolName : ''"
                  fontSize: 28
                  limit: 20
                  through: true
              资源栏:
                type: HStack
                val: 资源栏
                attribute:
                  point: ~middle_right
                  x: -92
                  spaceBetween: 14
                  height: 60
                action:
                  create: |-
                    for(i in range(0, 4)){
                      key = i.round()
                      e = self['资源条目'].copy('资源条目' + key)
                      e.entryKey = key
                      e['图标'].entryKey = key
                      e['名称'].entryKey = key
                      e['余额'].entryKey = key
                    }
                children:
                  资源条目:
                    type: Canvas
                    attribute:
                      entryKey: 4.round()
                      width: 196
                      height: 60
                      visible: "var.resourceRows == none ? self.entryKey < 2 : var.resourceRows[self.entryKey] != none"
                    children:
                      胶囊外框:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~44,52,80,220
                          shape: ~round_rect
                          radius: 30
                          through: true
                      胶囊底:
                        type: Texture
                        attribute:
                          point: ~middle_center
                          width: 188
                          height: 52
                          normal: ~44,48,78,235
                          shape: ~round_rect
                          radius: 26
                          through: true
                        effect:
                          gradient:
                            color1: ~62,68,106,240
                            color2: ~32,36,60,240
                            type: 0
                            angleDeg: 90
                          stroke:
                            width: 1
                            color: ~226,196,132,180
                      图标底:
                        type: Texture
                        attribute:
                          point: ~middle_left
                          x: 8
                          width: 46
                          height: 46
                          normal: ~22,24,42,220
                          shape: ~circle
                          through: true
                        effect:
                          stroke:
                            width: 1
                            color: ~255,238,196,120
                      图标:
                        type: Slot
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 12
                          slotType: ~Icon
                          width: 38
                          height: 38
                          normal: ~0,0,0,0
                          through: true
                          seticon: "self.setItemIcon(var.resourceRows != none && var.resourceRows[self.entryKey] != none && var.resourceRows[self.entryKey]['icon'] != none && var.resourceRows[self.entryKey]['icon'] != '' ? var.resourceRows[self.entryKey]['icon'] : var.air)"
                      名称:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 62
                          y: -13
                          texts: "var.resourceRows != none && var.resourceRows[self.entryKey] != none ? '&7' + (var.resourceRows[self.entryKey]['displayName'] != none ? var.resourceRows[self.entryKey]['displayName'] : '') : '&7———'"
                          fontSize: 26
                          limit: 8
                          through: true
                      余额:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 62
                          y: 13
                          texts: "var.resourceRows == none || var.resourceRows[self.entryKey] == none || var.resourceRows[self.entryKey]['owned'] == none ? '&7—' : (var.resourceRows[self.entryKey]['owned'] < 0 ? '&7—' : '&f' + var.resourceRows[self.entryKey]['owned'].round())"
                          fontSize: 32
                          through: true

