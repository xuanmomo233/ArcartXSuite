# AXS 资源说明
# 用途: OnlineRewards 模块默认菜单，battlepass 玻璃风格三段式布局。
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航（签到/进度/奖励）+ 内容区
# 视觉规范:
#   全屏玻璃 Frosted:24;30,32,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片 62,66,74,240  描边 255,255,255,230
#   主色（天青蓝）90,150,250  已签到 124,196,142  过期 210,120,120  进行中 232,180,90
# 前置依赖: ArcartX；OnlineRewards 模块启用后会自动注册或导出。
# 关联文件: ArcartXOnlineRewards.yml
# 重载命令: /axs onlinereward reload
ui:
  isHud: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 通信标识，用于 Packet.send 回包
    #   - dailyTimeText: 今日在线时长文本
    #   - weeklyTimeText: 本周在线时长文本
    #   - monthlyTimeText: 本月在线时长文本
    #   - totalTimeText: 总在线时长文本
    #   - offlineSavingsText: 离线储蓄时长文本
    #   - progress: 当前进度（0.0~1.0）
    #   - progressPercent: 进度百分比数值
    #   - progressPercentText: 进度百分比文本
    #   - progressTitle: 当前阶段标题
    #   - completed: 是否全部完成
    #   - rewardStage: 当前奖励阶段
    #   - rewardCount: 奖励阶段总数
    #   - rewardStageText: 奖励阶段文本
    #   - signedToday: 今日是否已签到
    #   - signInStatusText: 签到状态文本
    #   - signInStreak: 连续签到天数
    #   - signInTotal: 累计签到天数
    #   - makeupCardCount: 补签卡数量
    #   - calendarMonthText: 日历月份文本
    #   - calendarCount: 日历天数
    #   - calendarMonthOffset: 日历月份偏移
    #   - selectedDateText: 选中日期文本
    #   - selectedCanMakeup: 选中日期是否可补签
    #   - selectedAction: 选中日期操作类型
    #   - selectedActionText: 选中日期操作文本
    #   - selectedActionEnabled: 选中日期操作是否可用
    #   - rewardRows: 阶段奖励行数据
    #   - periodicRewardRows: 周期奖励行数据
    #   - signInRewardRows: 签到奖励行数据
    #   - calendarRows: 日历行数据
    #   - selectedRewardRows: 选中日期奖励行数据
    #   - serverSignInGoalEnabled: 是否启用全服签到目标
    #   - serverSignInGoalCurrent: 当前全服签到人数
    #   - serverSignInGoalNext: 下一个目标所需人数
    #   - maxRewardCount: 阶段奖励行模板最大复制数
    #   - maxPeriodicCount: 周期奖励行模板最大复制数
    #   - maxSigninRewardCount: 签到奖励行模板最大复制数
    #   - maxSelectedRewardCount: 选中奖励行模板最大复制数
    #   - action_token: 操作令牌，用于回包验证
    init: |-
      var.calendarSignedCount = 0
      var.periodicIconJsons = {}
      var.rewardIconJsons = {}
      var.signinIconJsons = {}
      var.packetId = packet['packetId']
      var.dailyTimeText = packet['dailyTimeText']
      var.weeklyTimeText = packet['weeklyTimeText']
      var.monthlyTimeText = packet['monthlyTimeText']
      var.totalTimeText = packet['totalTimeText']
      var.offlineSavingsText = packet['offlineSavingsText']
      var.progress = packet['progress']
      var.progressPercent = packet['progressPercent']
      var.progressPercentText = packet['progressPercentText']
      var.progressTitle = packet['progressTitle']
      var.completed = packet['completed']
      var.rewardStage = packet['rewardStage']
      var.rewardCount = packet['rewardCount']
      var.rewardStageText = packet['rewardStageText']
      var.signedToday = packet['signedToday']
      var.signInStatusText = packet['signInStatusText']
      var.signInStreak = packet['signInStreak']
      var.signInTotal = packet['signInTotal']
      var.makeupCardCount = packet['makeupCardCount']
      var.calendarMonthText = packet['calendarMonthText']
      var.calendarCount = packet['calendarCount']
      var.calendarMonthOffset = packet['calendarMonthOffset']
      var.selectedDateText = packet['selectedDateText']
      var.selectedCanMakeup = packet['selectedCanMakeup']
      var.selectedAction = packet['selectedAction']
      var.selectedActionText = packet['selectedActionText']
      var.selectedActionEnabled = packet['selectedActionEnabled']
      var.rewardRows = packet['rewardRows']
      var.periodicRewardRows = packet['periodicRewardRows']
      var.signInRewardRows = packet['signInRewardRows']
      var.calendarRows = packet['calendarRows']
      var.selectedRewardRows = packet['selectedRewardRows']
      var.serverSignInGoalEnabled = packet['serverSignInGoalEnabled']
      var.serverSignInGoalCurrent = packet['serverSignInGoalCurrent']
      var.serverSignInGoalNext = packet['serverSignInGoalNext']
      var.maxRewardCount = packet['maxRewardCount']
      var.maxPeriodicCount = packet['maxPeriodicCount']
      var.maxSigninRewardCount = packet['maxSigninRewardCount']
      var.maxSelectedRewardCount = packet['maxSelectedRewardCount']
      var.actionToken = packet['action_token']
      // 解析阶段奖励图标
      if(var.maxRewardCount > 0){
        for(i in range(0, var.maxRewardCount)){
          key = i.round()
          json = packet['rewardIconJson' + key]
          if(json != none && json != ''){
            var.rewardIconJsons[key] = json
          }
        }
      }
      // 解析周期奖励图标
      if(var.maxPeriodicCount > 0){
        for(i in range(0, var.maxPeriodicCount)){
          key = i.round()
          json = packet['periodicIconJson' + key]
          if(json != none && json != ''){
            var.periodicIconJsons[key] = json
          }
        }
      }
      // 解析签到奖励图标
      if(var.maxSigninRewardCount > 0){
        for(i in range(0, var.maxSigninRewardCount)){
          key = i.round()
          json = packet['signinIconJson' + key]
          if(json != none && json != ''){
            var.signinIconJsons[key] = json
          }
        }
      }
      if(var.calendarRows != none){
        for(k in var.calendarRows.keys()){
          row = var.calendarRows[k]
          if(row != none && row['status'] == 'signed'){
            var.calendarSignedCount = var.calendarSignedCount + 1
          }
        }
      }
      var.calendarRate = var.calendarCount > 0 ? (var.calendarSignedCount / var.calendarCount * 100).round(0) : 0
      // 日历网格固定创建 31 个格子（最大天数），通过 visible 自动隐藏超出当月天数的格子
      while(val.日历网格.childrenCount() > 1){
        val.日历网格.get(1).remove()
      }
      for(i in range(1, 31)){
        key = i.round()()
        if(val.日历网格['日历模板'] != none) {
          e = val.日历网格['日历模板'].copy('日历项_' + key)
          e.entryKey = key
        }
      }
      while(val.阶段堆叠.childrenCount() > 1){
        val.阶段堆叠.get(1).remove()
      }
      for(i in range(1, var.maxRewardCount - 1)){
        key = i.round()()
        if(val.阶段堆叠['阶段奖励项'] != none) {
          e = val.阶段堆叠['阶段奖励项'].copy('阶段奖励项_' + key)
          e.entryKey = key
        }
      }
      // 触发阶段奖励图标 seticon
      if(val.阶段堆叠['阶段奖励项'] != none && val.阶段堆叠['阶段奖励项']['图标'] != none){
        val.阶段堆叠['阶段奖励项']['图标'].seticon()
      }
      for(i in range(1, var.maxRewardCount - 1)){
        key = i.round()()
        e = val.阶段堆叠['阶段奖励项_' + key]
        if(e != none && e['图标'] != none){
          e['图标'].seticon()
        }
      }
      while(val.周期堆叠.childrenCount() > 1){
        val.周期堆叠.get(1).remove()
      }
      for(i in range(1, var.maxPeriodicCount - 1)){
        key = i.round()()
        if(val.周期堆叠['周期奖励项'] != none) {
          e = val.周期堆叠['周期奖励项'].copy('周期奖励项_' + key)
          e.entryKey = key
        }
      }
      // 触发周期奖励图标 seticon
      if(val.周期堆叠['周期奖励项'] != none && val.周期堆叠['周期奖励项']['图标'] != none){
        val.周期堆叠['周期奖励项']['图标'].seticon()
      }
      for(i in range(1, var.maxPeriodicCount - 1)){
        key = i.round()()
        e = val.周期堆叠['周期奖励项_' + key]
        if(e != none && e['图标'] != none){
          e['图标'].seticon()
        }
      }
      while(val.签到堆叠.childrenCount() > 1){
        val.签到堆叠.get(1).remove()
      }
      for(i in range(1, var.maxSigninRewardCount - 1)){
        key = i.round()()
        if(val.签到堆叠['签到奖励项'] != none) {
          e = val.签到堆叠['签到奖励项'].copy('签到奖励项_' + key)
          e.entryKey = key
        }
      }
      // 触发签到奖励图标 seticon
      if(val.签到堆叠['签到奖励项'] != none && val.签到堆叠['签到奖励项']['图标'] != none){
        val.签到堆叠['签到奖励项']['图标'].seticon()
      }
      for(i in range(1, var.maxSigninRewardCount - 1)){
        key = i.round()()
        e = val.签到堆叠['签到奖励项_' + key]
        if(e != none && e['图标'] != none){
          e['图标'].seticon()
        }
      }
      while(val.选中奖励堆叠.childrenCount() > 1){
        val.选中奖励堆叠.get(1).remove()
      }
      for(i in range(1, var.maxSelectedRewardCount - 1)){
        key = i.round()()
        if(val.选中奖励堆叠['选中奖励项'] != none) {
          e = val.选中奖励堆叠['选中奖励项'].copy('选中奖励项_' + key)
          e.entryKey = key
        }
      }
      var.actionBusy = false
    # packetHandler: update
    # 包字段: 同 init（实时刷新菜单数据）
    # 优化: 只更新数据变量，仅在数量变化时才 remove+copy，避免每次刷新全量重建导致闪烁
    update: |-
      var.packetId = packet['packetId']
      var.dailyTimeText = packet['dailyTimeText']
      var.weeklyTimeText = packet['weeklyTimeText']
      var.monthlyTimeText = packet['monthlyTimeText']
      var.totalTimeText = packet['totalTimeText']
      var.offlineSavingsText = packet['offlineSavingsText']
      var.progress = packet['progress']
      var.progressPercent = packet['progressPercent']
      var.progressPercentText = packet['progressPercentText']
      var.progressTitle = packet['progressTitle']
      var.completed = packet['completed']
      var.rewardStage = packet['rewardStage']
      var.rewardCount = packet['rewardCount']
      var.rewardStageText = packet['rewardStageText']
      var.signedToday = packet['signedToday']
      var.signInStatusText = packet['signInStatusText']
      var.signInStreak = packet['signInStreak']
      var.signInTotal = packet['signInTotal']
      var.makeupCardCount = packet['makeupCardCount']
      var.calendarMonthText = packet['calendarMonthText']
      var.calendarMonthOffset = packet['calendarMonthOffset']
      var.selectedDateText = packet['selectedDateText']
      var.selectedCanMakeup = packet['selectedCanMakeup']
      var.selectedAction = packet['selectedAction']
      var.selectedActionText = packet['selectedActionText']
      var.selectedActionEnabled = packet['selectedActionEnabled']
      var.rewardRows = packet['rewardRows']
      var.periodicRewardRows = packet['periodicRewardRows']
      var.signInRewardRows = packet['signInRewardRows']
      var.calendarRows = packet['calendarRows']
      var.selectedRewardRows = packet['selectedRewardRows']
      var.serverSignInGoalEnabled = packet['serverSignInGoalEnabled']
      var.serverSignInGoalCurrent = packet['serverSignInGoalCurrent']
      var.serverSignInGoalNext = packet['serverSignInGoalNext']
      var.actionToken = packet['action_token']
      // 保存旧数量，用于判断是否需要重建列表（日历网格固定 31 个，无需重建）
      oldMaxRewardCount = var.maxRewardCount
      oldMaxPeriodicCount = var.maxPeriodicCount
      oldMaxSigninRewardCount = var.maxSigninRewardCount
      oldMaxSelectedRewardCount = var.maxSelectedRewardCount
      // 更新数量
      var.calendarCount = packet['calendarCount']
      var.maxRewardCount = packet['maxRewardCount']
      var.maxPeriodicCount = packet['maxPeriodicCount']
      var.maxSigninRewardCount = packet['maxSigninRewardCount']
      var.maxSelectedRewardCount = packet['maxSelectedRewardCount']
      // 解析阶段奖励图标
      var.rewardIconJsons = {}
      if(var.maxRewardCount > 0){
        for(i in range(0, var.maxRewardCount)){
          key = i.round()
          json = packet['rewardIconJson' + key]
          if(json != none && json != ''){
            var.rewardIconJsons[key] = json
          }
        }
      }
      // 解析周期奖励图标
      var.periodicIconJsons = {}
      if(var.maxPeriodicCount > 0){
        for(i in range(0, var.maxPeriodicCount)){
          key = i.round()
          json = packet['periodicIconJson' + key]
          if(json != none && json != ''){
            var.periodicIconJsons[key] = json
          }
        }
      }
      // 解析签到奖励图标
      var.signinIconJsons = {}
      if(var.maxSigninRewardCount > 0){
        for(i in range(0, var.maxSigninRewardCount)){
          key = i.round()
          json = packet['signinIconJson' + key]
          if(json != none && json != ''){
            var.signinIconJsons[key] = json
          }
        }
      }
      // 统计已签到天数
      var.calendarSignedCount = 0
      if(var.calendarRows != none){
        for(k in var.calendarRows.keys()){
          row = var.calendarRows[k]
          if(row != none && row['status'] == 'signed'){
            var.calendarSignedCount = var.calendarSignedCount + 1
          }
        }
      }
      var.calendarRate = var.calendarCount > 0 ? (var.calendarSignedCount / var.calendarCount * 100).round(0) : 0
      // ── 阶段奖励堆叠：仅在数量变化时重建 ──
      if(var.maxRewardCount != oldMaxRewardCount){
        while(val.阶段堆叠.childrenCount() > 1){
          val.阶段堆叠.get(1).remove()
        }
        for(i in range(1, var.maxRewardCount - 1)){
          key = i.round()()
        if(val.阶段堆叠['阶段奖励项'] != none) {
          e = val.阶段堆叠['阶段奖励项'].copy('阶段奖励项_' + key)
          e.entryKey = key
        }
        }
      }
      // 重新触发阶段奖励图标 seticon（数据变了但 seticon 不会自动刷新）
      if(val.阶段堆叠['阶段奖励项'] != none && val.阶段堆叠['阶段奖励项']['图标'] != none){
        val.阶段堆叠['阶段奖励项']['图标'].seticon()
      }
      for(i in range(1, var.maxRewardCount - 1)){
        key = i.round()()
        e = val.阶段堆叠['阶段奖励项_' + key]
        if(e != none && e['图标'] != none){
          e['图标'].seticon()
        }
      }
      // ── 周期奖励堆叠：仅在数量变化时重建 ──
      if(var.maxPeriodicCount != oldMaxPeriodicCount){
        while(val.周期堆叠.childrenCount() > 1){
          val.周期堆叠.get(1).remove()
        }
        for(i in range(1, var.maxPeriodicCount - 1)){
          key = i.round()()
        if(val.周期堆叠['周期奖励项'] != none) {
          e = val.周期堆叠['周期奖励项'].copy('周期奖励项_' + key)
          e.entryKey = key
        }
        }
      }
      // 重新触发周期奖励图标 seticon
      if(val.周期堆叠['周期奖励项'] != none && val.周期堆叠['周期奖励项']['图标'] != none){
        val.周期堆叠['周期奖励项']['图标'].seticon()
      }
      for(i in range(1, var.maxPeriodicCount - 1)){
        key = i.round()()
        e = val.周期堆叠['周期奖励项_' + key]
        if(e != none && e['图标'] != none){
          e['图标'].seticon()
        }
      }
      // ── 签到奖励堆叠：仅在数量变化时重建 ──
      if(var.maxSigninRewardCount != oldMaxSigninRewardCount){
        while(val.签到堆叠.childrenCount() > 1){
          val.签到堆叠.get(1).remove()
        }
        for(i in range(1, var.maxSigninRewardCount - 1)){
          key = i.round()()
        if(val.签到堆叠['签到奖励项'] != none) {
          e = val.签到堆叠['签到奖励项'].copy('签到奖励项_' + key)
          e.entryKey = key
        }
        }
      }
      // 重新触发签到奖励图标 seticon
      if(val.签到堆叠['签到奖励项'] != none && val.签到堆叠['签到奖励项']['图标'] != none){
        val.签到堆叠['签到奖励项']['图标'].seticon()
      }
      for(i in range(1, var.maxSigninRewardCount - 1)){
        key = i.round()()
        e = val.签到堆叠['签到奖励项_' + key]
        if(e != none && e['图标'] != none){
          e['图标'].seticon()
        }
      }
      // ── 选中奖励堆叠：仅在数量变化时重建 ──
      if(var.maxSelectedRewardCount != oldMaxSelectedRewardCount){
        while(val.选中奖励堆叠.childrenCount() > 1){
          val.选中奖励堆叠.get(1).remove()
        }
        for(i in range(1, var.maxSelectedRewardCount - 1)){
          key = i.round()()
        if(val.选中奖励堆叠['选中奖励项'] != none) {
          e = val.选中奖励堆叠['选中奖励项'].copy('选中奖励项_' + key)
          e.entryKey = key
        }
        }
      }
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.calendarCount = 31
      var.makeupCardCount = 0
      var.serverSignInGoalCurrent = 0
      var.serverSignInGoalNext = 0
      var.signInStreak = 0
      var.signInTotal = 0
      var.currentPage = 'signin'
      var.currentRewardTab = 'stage'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.actionBusy = false
      var.actionBusySeconds = 0
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放，窗口长宽比不是 16:9 时会多出可用空间
      // viewH / viewW = 换算到设计坐标系后的可用高宽，16:9 时正好 1080 / 1920
      // offX     = Adaptive 水平居中后，设计坐标 x=0 距窗口左边的偏量（超宽屏 > 0）
      // contentW = 内容区宽度（左 372 右 48 边距），cardW = 内容区内并排两张卡的单张宽度
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.cardW = (var.contentW - 96) / 2
    open: |-
      var.calendarRate = 0
      var.dailyTimeText = '0分钟'
      var.monthlyTimeText = '0分钟'
      var.offlineSavingsText = '0分钟'
      var.packetId = 'AXS_ONLINE_REWARDS'
      var.progressPercentText = '0'
      var.progressTitle = '等待同步'
      var.rewardStageText = '0/0'
      var.selectedActionText = '等待同步'
      var.totalTimeText = '0分钟'
      var.weeklyTimeText = '0分钟'
      Packet.send(var.packetId, 'refresh')
    # 窗口尺寸变化后重算可用高宽，依赖这些变量的控件尺寸会跟着刷新
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.cardW = (var.contentW - 96) / 2

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）；置于顶层以覆盖整块屏幕
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;30,32,38,110
  # 自适配布局：宽高 = 本 UI 的设计分辨率（1920x1080），窗口分辨率变化时按比例缩放子控件
  # 顶部锚点：使 1080 设计高度的顶边与窗口上边对齐，顶栏可紧贴屏幕顶部；
  # 非 16:9 窗口多出来的纵向空间全落在下方，由 var.viewH 分配给左导航/内容区贴住底边；
  # 横向多出的空间（超宽屏）由 var.offX / var.viewW / var.contentW 分配，顶栏与内容区同步铺满
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
