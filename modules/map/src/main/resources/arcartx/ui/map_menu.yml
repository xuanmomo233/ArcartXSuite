                  clickLeft: |-
                    if (var.detailCanTeleport) {
                      // 跨世界传送同导航一样先弹确认（L16 统一确认）；
                      // 远程锚点（复合 id）同样走该确认，服务端按 id 前缀路由到跨服握手
                      var.isCrossWorld = var.playerWorldId != '' && var.selectedWorldId != var.playerWorldId
                      if (var.isCrossWorld || var.detailRemote == true) {
                      var.crossWorldPromptType = 'teleport'
                      var.crossWorldRemote = var.detailRemote == true
                      var.crossWorldPromptVisible = true
                      } else {
