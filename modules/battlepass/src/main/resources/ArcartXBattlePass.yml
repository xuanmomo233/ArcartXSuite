# ArcartXBattlePass 主配置文件
# 定义战令系统的存储、赛季、任务、奖励、UI 及跨服同步等核心参数

config-version: 5  # 配置版本号，变更时触发迁移

# 存储配置：支持 sqlite 与 mysql 两种模式
storage:
  mode: "sqlite"  # 存储模式：sqlite 或 mysql
  sqlite:
    file: "battlepass.db"  # SQLite 数据库文件名
  pool-size: 1  # 数据库连接池大小
  # ── MySQL 自建模式（不推荐） ──
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 推荐使用「共享模式」：保持 mode 为 sqlite，到本体 config.yml
  # （plugins/ArcartX-Suite/config.yml）的 storage 节统一配置 MySQL，
  # 所有模块将共享同一个连接池，用 table-prefix 隔离表，资源占用更低。
  # 以下配置仅在 storage.mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"  # MySQL 主机地址
  #   port: 3306  # MySQL 端口
  #   database: "arcartxsuite"  # MySQL 数据库名
  #   username: "root"  # MySQL 用户名
  #   password: ""  # MySQL 密码
  #   table-prefix: "axs_battlepass_"  # MySQL 表名前缀

# 赛季配置：定义当前赛季的基本参数
season:
  season-id: "season-1"  # 赛季唯一标识
  display-name: "第一赛季"  # 赛季显示名称
  max-level: 100  # 赛季最大等级
  # 经验成长曲线：转折点断点列表，每项指定一个起始等级（level）与一个 ARIA 表达式（formula）。
  # 表达式以变量 global.level 为入参（绑定值注入到 ARIA global. 命名空间，需用 global. 前缀访问），
  # 计算结果即为"升到该等级所需经验值"（必须 ≥ 1）。
  # 系统按 level 升序选取最大的且不超过目标等级的断点公式求值。
  # 首个断点的 level 必须为 1；断点 level 必须严格递增。
  # 当前曲线：线性×S曲线因子模型
  #   xp = 5.0 * level * (1 + 5.0 * smoothstep(0,100,level)^1.5)
  #   smoothstep(0,100,level) = (level/100)^2 * (3 - 2*(level/100))
  # 特征：前期近似线性（快速升级给正反馈），中后期 S曲线因子平滑加速（挑战感递增），
  #       全程无拐点突变。满级(100)累计约 101,520 xp。
  # 节奏（FREE 日产约 564 xp）：Lv25 约 3 天、Lv50 约 19 天、Lv75 约 72 天、Lv100 约 180 天。
  # DELUXE(1.5x) 满级约 120 天。
  xp-curve:
    - level: 1
      formula: "5.0 * global.level * (1 + 5.0 * math.pow(math.pow(global.level / 100, 2) * (3 - 2 * global.level / 100), 1.5))"
  start-date: "2026-06-01"  # 赛季开始日期
  end-date: "2026-12-01"  # 赛季结束日期（6 个月赛季）

# ---------------------------------------------------------------------------
# 任务配置
# ---------------------------------------------------------------------------
# 任务模板已拆分为外部文件，位于 <模块数据目录>/<tasks-directory>/ 下：
#   - daily.yml  : 每日任务池
#   - weekly.yml : 每周任务池
#   - season.yml : 赛季任务池
#
# 每日/每周任务从池中按 weight 加权随机抽取，抽取数量由 daily-count / weekly-count 控制
# ---------------------------------------------------------------------------
tasks:
  daily-count: 3                  # 每天分配给玩家的每日任务数量
  weekly-count: 2                 # 每周分配给玩家的每周任务数量
  tasks-directory: "tasks"        # 任务文件所在目录（相对模块数据目录）

# ---------------------------------------------------------------------------
# 等级奖励配置
# ---------------------------------------------------------------------------
# 奖励配置已拆分为外部文件，位于 <模块数据目录>/<rewards-file> 下。
# 默认文件名为 rewards.yml，首次启动时自动导出。
# 每个等级的奖励支持 item / command / currency 三种类型，并支持 icon 图标配置。
# 详细配置格式见 rewards.yml 文件内注释。
# ---------------------------------------------------------------------------
rewards-file: "rewards.yml"

# ---------------------------------------------------------------------------
# 赛季结算奖励配置
# ---------------------------------------------------------------------------
# 赛季结算奖励已拆分为外部文件，位于 <模块数据目录>/<season-rewards-file> 下。
# 默认文件名为 season-rewards.yml，首次启动时自动导出。
# 结算奖励按等级阈值（min-level）配置，玩家达到该等级即可在赛季结算时获得对应档位的奖励。
# 奖励类型支持 item / command / currency / mail（mail 通过 Mail 模块发送，不可用时降级）。
# 详细配置格式见 season-rewards.yml 文件内注释。
# ---------------------------------------------------------------------------
season-rewards-file: "season-rewards.yml"

# ---------------------------------------------------------------------------
# 奖励发放方式
# ---------------------------------------------------------------------------
# direct（默认）：在线玩家直接发放（物品放入背包、货币直接增加、命令直接执行），
#                 离线玩家上线后补发。
# mail：统一邮箱发放。item 类型奖励通过 Mail 模块发送邮件（不管在线离线），
#       currency / command 类型仍直接发放（在线即发，离线补发）。
#       需要 Mail 模块，未安装时自动降级为 direct 模式。
# ---------------------------------------------------------------------------
reward-delivery-mode: "direct"

# UI 配置：控制界面注册与绑定
ui:
  register-ui-on-enable: true  # 模块启动时是否自动注册 UI
  overwrite-ui-files: false  # 是否强制覆盖用户已修改的 UI 文件
  main-ui-id: "battlepass_main"  # 主界面 UI 标识
  tasks-ui-id: "battlepass_tasks"  # 任务列表界面 UI 标识
  rewards-ui-id: "battlepass_rewards"  # 奖励界面 UI 标识
  settlement-ui-id: "battlepass_settlement"  # 赛季结算奖励界面 UI 标识

# 跨服同步配置
cross-server:
  enabled: false  # 是否启用跨服数据同步
  sync-fields:  # 需要同步的字段列表
    - "progress"  # 战令等级与经验进度
    - "task-progress"  # 任务完成进度
    - "claimed-rewards"  # 已领取的奖励记录
