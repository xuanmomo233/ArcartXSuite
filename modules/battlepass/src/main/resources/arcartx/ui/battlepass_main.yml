                type: Texture
                attribute:
                  point: ~horizontal_stretch_bottom
                  height: 2
                  normal: ~90,170,255,120
                  through: true
              顶栏高光:
                type: Texture
                attribute:
                  point: ~bottom_center
                  width: 360
                  height: 3
                  normal: ~120,200,255,220
                  shape: ~round_rect
                  radius: 2
                  through: true
                effect:
                  neon:
                    color: ~90,170,255,140
                    size: 8
                    intensity: 0.5
                    animated: false
              # 标题图标
