# AXS Mail 日志（翠绿信使重写版）
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航 + 内容区
# 布局: 左导航(收件箱/日志/写信/兑换码/管理 + 底部摘要) + 内容区(日志列表 + 分页)
# 配色: 翠绿信使 主色80,180,120 底30,32,38,110 抬升36,38,48,245 描边60,64,82,220
# 逻辑: packetHandler/action/val引用/entryKey/copy 与原版一致，仅重构布局结构与配色

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  show: true
  through: false
  screenScale: true
  level: 8
  itemSize: 16
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  action:
    load: |-
      var.logs = {}
      var.page = 1
      var.maxPage = 1
      var.totalCount = 0
      var.maxLogCount = 0
      var.isAdmin = false
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send('AXS_MAIL', 'refresh')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - logs: 日志列表（Map，键为索引，每项含 type_text/created_at/content 等子字段）
    #   - page: 当前页码
    #   - max_page: 最大页码数
    #   - total_count: 日志总条数
    #   - maxLogCount: 日志列表最大显示条数（用于动态生成列表项）
    #   - is_admin: 当前玩家是否为管理员
    init: |-
      var.logs = packet['logs']
      var.page = packet['page']
      var.maxPage = packet['max_page']
      var.totalCount = packet['total_count']
      var.maxLogCount = packet['maxLogCount']
      var.isAdmin = packet['is_admin']
      while(val.logs_list.childrenCount() > 1){
        val.logs_list.get(1).remove()
      }
      for(i in range(1, var.maxLogCount - 1)){
        key = i.round()
        e = val.logs_list['日志项目'].copy('日志项目' + key)
        e.entryKey = key
      }
    # packetHandler: update（字段与 init 相同）
    update: |-
      var.logs = packet['logs']
      var.page = packet['page']
      var.maxPage = packet['max_page']
      var.totalCount = packet['total_count']
      var.maxLogCount = packet['maxLogCount']
      var.isAdmin = packet['is_admin']
      while(val.logs_list.childrenCount() > 1){
        val.logs_list.get(1).remove()
      }
      for(i in range(1, var.maxLogCount - 1)){
        key = i.round()
        e = val.logs_list['日志项目'].copy('日志项目' + key)
        e.entryKey = key
      }

# ─── 控件树 ────────────────────────────────────────────────────────
# 布局: 顶栏(标题色块+标题+关闭) + 左导航(5项+摘要) + 内容区(日志列表+分页)
# 配色: 翠绿信使 深底浅字 — 抬升面36,38,48 描边60,64,82 强调80,180,120
# fontSize: 48(顶栏标题) / 36(区域标题/按钮/信息) / 32(小标签) — 全部标准档位
controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;30,32,38,110
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~60,64,82,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~80,180,120,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f邮件日志"
              fontSize: 48
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ──────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          导航收件箱:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'open')
            children:
              收件箱底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              收件箱文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f收件箱"
                  fontSize: 36
                  through: true
          # 当前页：日志
          导航日志:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            children:
              日志底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~80,180,120,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              日志高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~80,180,120,255
                  shape: ~round_rect
                  radius: 2
              日志文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0日志"
                  fontSize: 36
          导航写信:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'compose')
            children:
              写信底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              写信文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f写信"
                  fontSize: 36
                  through: true
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 282
              width: 272
              height: 58
              visible: "var.isAdmin == true"
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'admin')
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f管理"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 364
              width: 264
              height: 2
              normal: ~60,64,82,220
          摘要标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 382
              texts: "~&f日志概览"
              fontSize: 36
          摘要总数:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 428
              texts: "'&f总日志 &b' + var.totalCount.round()"
              fontSize: 32
          摘要页码:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 468
              texts: "'&f当前页 &b' + var.page.round() + '&f/&b' + var.maxPage.round()"
              fontSize: 32

      # ── 内容区 ──────────────────────────────────────────
      # 范式: 大白毛玻璃底(255,255,255,100) + 暗色面板分区(36,38,48,210)
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          # 内容区大白毛玻璃底
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # 日志列表区（暗色面板）
          日志列表区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 24
              width: "var.contentW - 48"
              height: "var.viewH - 144 - 48 - 72"
            children:
              列表底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              日志滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -12
                  y: 12
                  width: 10
                  height: "self.parent.height - 24"
                  normal: ~40,44,52,225
                  shape: ~round_rect
                  radius: 5
                effect:
                  stroke:
                    width: 2
                    color: ~120,220,160,230
              日志滑块:
                type: Texture
                val: 日志滑块
                attribute:
                  point: ~top_right
                  x: -12
                  y: 12
                  width: 10
                  height: 50
                  normal: ~80,180,120,230
                  maxDragY: "self.parent.height - 74"
                  shape: ~round_rect
                  radius: 5
              日志滚动栏:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 14
                  y: 12
                  width: "self.parent.width - 40"
                  height: "self.parent.height - 24"
                  moveY: "self.parent.parent['日志滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent.parent['日志滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent.parent['日志滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  log_stack:
                    val: logs_list
                    type: VStack
                    attribute:
                      width: "self.parent.width - 24"
                      spaceBetween: 8
                    children:
                      日志项目:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.logs[self.entryKey]
                          width: "self.parent.width"
                          height: 80
                          visible: "self.entry != none"
                        children:
                          项目底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~36,38,48,245
                              shape: ~round_rect
                              radius: 10
                            effect:
                              stroke:
                                width: 3
                                color: ~255,255,255,230
                          类型标签:
                            type: Canvas
                            attribute:
                              point: ~top_left
                              x: 14
                              y: 14
                              width: 80
                              height: 32
                            children:
                              类型标签底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~80,180,120,210
                                  shape: ~round_rect
                                  radius: 8
                              类型标签文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "self.parent.parent.entry['type_text']"
                                  fontSize: 32
                                  through: true
                          时间文字:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 108
                              y: 18
                              texts: "'&f' + self.parent.entry['created_at']"
                              fontSize: 32
                          内容文字:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 14
                              y: 50
                              texts: "'&f' + self.parent.entry['content']"
                              fontSize: 32

          # 分页按钮栏
          分页栏:
            type: HStack
            attribute:
              point: ~bottom_left
              x: 0
              y: -12
              spaceBetween: 12
            children:
              上一页按钮:
                type: Canvas
                attribute:
                  width: 120
                  height: 48
                action:
                  clickLeft: |-
                    Packet.send('AXS_MAIL', 'logs-prev')
                children:
                  上一页底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
                  上一页文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f上一页"
                      fontSize: 36
                      through: true
              页码显示:
                type: Text
                attribute:
                  point: ~middle_left
                  texts: "'&f第 &b' + var.page.round() + ' &f页 / 共 &b' + var.maxPage.round() + ' &f页'"
                  fontSize: 36
              下一页按钮:
                type: Canvas
                attribute:
                  width: 120
                  height: 48
                action:
                  clickLeft: |-
                    Packet.send('AXS_MAIL', 'logs-next')
                children:
                  下一页底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
                  下一页文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f下一页"
                      fontSize: 36
                      through: true
