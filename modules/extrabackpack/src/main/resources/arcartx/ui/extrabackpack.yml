                  spaceBetweenY: 10
                action:
                  create: |-
                    for(i in range(1, 8)){
                      slot = self['槽位'].copy('槽位' + i.round())
                      slot.id = (36 + i).round()
                    }
                children:
                  槽位:
                    type: Slot
                    attribute:
                      width: 70
                      height: 70
                      slotType: ~Backpack
                      id: 36
                      normal: ~29,33,43,255
                      hover: ~Frosted:0;255,255,255,255
                      shape: ~round_rect
                      radius: 12
                      itemScale: 0.76
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255

      销毁确认框:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 560
          height: 260
          visible: var.destroyPanel != none && var.destroyPanel['visible']
        children:
          销毁确认框背景:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~30,30,30,250
              shape: ~round_rect
              radius: 18
          销毁确认框文字:
            type: Text
            attribute:
              point: ~middle_center
              y: -60
              texts: ~&f确认销毁光标上的物品？需要二级密码
              fontSize: 28
              through: true
          确认按钮:
            type: Canvas
            attribute:
              x: 90
              y: 160
              width: 160
              height: 50
              enable: "!var.actionBusy && var.actionToken != none && var.actionToken != ''"
            action:
              clickLeft: |-
                var.actionBusy = true
                Packet.send(var.packetId, 'destroy_confirm', var.actionToken)
            children:
              确认背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,100,100,220
                  hover: ~Frosted:0;255,255,255,240
                  shape: ~round_rect
                  radius: 12
              确认文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f确认
                  fontSize: 28
                  through: true
          取消按钮:
            type: Canvas
            attribute:
              x: 310
              y: 160
              width: 160
              height: 50
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'destroy_cancel')
            children:
              取消背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,255,255,150
                  hover: ~Frosted:0;255,255,255,240
                  shape: ~round_rect
                  radius: 12
              取消文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&0取消
                  fontSize: 28
                  through: true

      二级密码面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 600
          height: 300
          visible: var.passwordPanel != none && var.passwordPanel['visible']
        children:
          二级密码面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~30,30,30,250
              shape: ~round_rect
              radius: 18
          二级密码面板文字:
            type: Text
            attribute:
              point: ~middle_center
              y: -110
              texts: "var.passwordPanel != none && var.passwordPanel['mode'] == 'set' ? '~&f设置二级密码' : (var.passwordPanel != none && var.passwordPanel['mode'] == 'clear' ? '~&f清除二级密码' : '~&f解锁二级密码')"
              fontSize: 28
              through: true
          当前密码:
            type: TextBox
            attribute:
              x: 40
              y: 72
              width: 520
              height: 42
              length: 64
              emptyText: ~当前密码（设置新密码时已有密码必填）
              fontSize: 22
              background: ~90,90,90,230
              shape: ~round_rect
              radius: 12
            action:
              textChange: |-
                var.passwordCurrent = self.getContent()
          新密码:
            type: TextBox
            attribute:
              x: 40
              y: 122
              width: 520
              height: 42
              length: 64
              visible: var.passwordPanel != none && var.passwordPanel['mode'] == 'set'
              emptyText: ~新密码
              fontSize: 22
              background: ~90,90,90,230
              shape: ~round_rect
              radius: 12
            action:
              textChange: |-
                var.passwordNew = self.getContent()
          提交:
            type: Canvas
            attribute:
              x: 80
              y: 205
              width: 180
              height: 48
              enable: "!var.actionBusy || var.passwordPanel['mode'] == 'unlock'"
            action:
              clickLeft: |-
                if(var.passwordPanel['mode'] == 'set'){
                  var.actionBusy = true
                  Packet.send(var.packetId, 'password_set', var.passwordCurrent, var.passwordNew, var.actionToken)
                }else{
                  if(var.passwordPanel['mode'] == 'clear'){
                    var.actionBusy = true
                    Packet.send(var.packetId, 'password_clear', var.passwordCurrent, var.actionToken)
                  }else{
                    Packet.send(var.packetId, 'password_unlock', var.passwordCurrent)
                  }
                }
            children:
              提交背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~120,190,255,220
                  hover: ~Frosted:0;255,255,255,240
                  shape: ~round_rect
                  radius: 12
              提交文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "var.passwordPanel != none && var.passwordPanel['mode'] == 'set' ? '~&0设置' : (var.passwordPanel != none && var.passwordPanel['mode'] == 'clear' ? '~&0清除' : '~&0解锁')"
                  fontSize: 25
                  through: true
          取消:
            type: Canvas
            attribute:
              x: 340
              y: 205
              width: 180
              height: 48
            action:
              clickLeft: |-
                var.passwordPanel['visible'] = false
                Packet.send(var.packetId, 'password_panel_close')
            children:
              取消背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,255,255,150
                  hover: ~Frosted:0;255,255,255,240
                  shape: ~round_rect
                  radius: 12
              取消文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&0取消
                  fontSize: 25
                  through: true
          清除密码:
            type: Canvas
            attribute:
              x: 210
              y: 255
              width: 180
              height: 34
              visible: var.passwordPanel != none && var.passwordPanel['mode'] != 'set'
              enable: "!var.actionBusy && var.actionToken != none && var.actionToken != ''"
            action:
              clickLeft: |-
                var.actionBusy = true
                Packet.send(var.packetId, 'password_clear', var.passwordCurrent, var.actionToken)
            children:
              清除密码背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,170,170,180
                  hover: ~Frosted:0;255,255,255,240
                  shape: ~round_rect
                  radius: 10
              清除密码文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&0清除密码
                  fontSize: 20
                  through: true
tasks: {}
