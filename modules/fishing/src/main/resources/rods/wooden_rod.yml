# 鱼竿定义：木制钓竿
# 基础钓竿 — 示例配置，新手默认钓竿
# 鱼竿文件位于 rods/ 目录，每个文件定义一种鱼竿
#
# 鱼竿物品由外部物品库（NeigeItems/MythicMobs 等）生成，本配置仅用于识别物品和设置效果。
# 识别方式：优先用 match 块（ItemMatcher）匹配玩家手持物品，未配置 match 时回退到 PDC 标签。
# match: 块用于识别玩家手持的鱼竿物品（ItemMatcher 标准格式，与 market/menu 一致）。

id: "wooden_rod"               # 鱼竿唯一标识符
# match: 物品匹配规则（用于识别玩家手持的鱼竿物品）
#   neige-item-ids: NeigeItems 物品 ID 列表（匹配其中任一即视为该鱼竿）
#   mythic-item-ids: MythicMobs 物品 ID 列表
#   overture-item-ids: Overture 物品 ID 列表
#   material-ids: 原版材质名列表（如 [fishing_rod]）
#   name-contains: 显示名需包含的子串列表
#   lore-contains: Lore 需包含的子串列表
#   nbt-keys: NBT/PDC 键白名单
#   nbt-values: NBT 键值对精确匹配
#   name-regex / lore-regex: 正则匹配
# 所有列表为"或"关系，命中任一即匹配；空列表不参与匹配。
# 未配置 match 或 match 为空时，回退到 PDC 标签 axs_fishing_rod_id 识别。
match:
  # 示例：用 NeigeItems 物品 ID 匹配（推荐方式）
  neige-item-ids: [wooden_fishing_rod]
  # 或用原版材质匹配（所有原版鱼竿都视为木制钓竿，仅示例，生产环境不推荐）
  # material-ids: [fishing_rod]
# 宝藏概率加成（加到基础概率上）
treasure-chance-bonus: 0.05    # 宝藏概率额外+5%
# 绿条高度加成（像素）
green-bar-height-bonus: 8      # 小游戏绿色目标条高度+8像素（更容易捕获）
# 小游戏持续时间加成（ticks）
catch-duration-bonus: 60       # 小游戏持续时间+60 ticks（3秒，更充裕的操作时间）
# 经验倍率
exp-multiplier: 1.1            # 捕获经验×1.1倍
# 等级限制（玩家赛季等级）
min-player-level: 0            # 最低等级，0=无下限要求
max-player-level: 0            # 最高等级，0=无上限要求
