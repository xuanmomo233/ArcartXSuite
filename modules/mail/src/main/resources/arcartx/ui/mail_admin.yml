                                  x: 8
                                  y: 12
                                  width: 160
                                  height: 32
                                  fontSize: 49
                                  emptyText: "~&7CDK码"
                              CDK启用按钮:
                                type: Canvas
                                attribute:
                                  x: 176
                                  y: 8
                                  width: 56
                                  height: 40
                                action:
                                  clickLeft: |-
                                    self.parent.cdkEnabled = !(self.parent.cdkEnabled != false)
                                children:
                                  CDK启用底:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: "self.parent.parent.cdkEnabled != false ? '80,180,120,230' : '235,100,100,230'"
                                      shape: ~round_rect
                                      radius: 8
                                  CDK启用文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      texts: "self.parent.parent.cdkEnabled != false ? '&0开' : '&f关'"
                                      fontSize: 32
                                      through: true
                              启用次数分割线:
                                type: Texture
                                attribute:
                                  x: 236
                                  y: 12
                                  width: 2
                                  height: 32
                                  normal: ~255,255,255,230
                              最大领取输入:
                                type: TextBox
                                attribute:
                                  x: 240
                                  y: 12
                                  width: 80
                                  height: 32
                                  fontSize: 49
                                  emptyText: "~&7最大领取"
                              次数过期分割线:
                                type: Texture
                                attribute:
                                  x: 324
                                  y: 12
                                  width: 2
                                  height: 32
                                  normal: ~255,255,255,230
                              过期模式按钮:
                                type: Canvas
                                attribute:
                                  x: 328
                                  y: 8
                                  width: 72
                                  height: 40
                                action:
                                  clickLeft: |-
                                    self.parent.expireMode = self.parent.expireMode == 'absolute' ? 'relative' : 'absolute'
                                    self.parent['过期输入'].setContent('')
                                children:
