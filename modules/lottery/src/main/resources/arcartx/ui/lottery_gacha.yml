      # 详情面板: 卡池详情弹窗，展示保底抽数、各星级概率、UP 概率和物品权重列表
      详情面板:
        type: Adaptive
        val: 详情面板
        attribute:
          width: 1920
          height: 1080
          point: ~stretch_all
          visible: false
        children:
          详情遮罩:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~0,0,0,220
          详情主面板:
            type: Canvas
            attribute:
              width: 900
              height: 700
              point: ~middle_center
            children:
              详情标题:
                type: Text
                attribute:
                  point: ~top_center
