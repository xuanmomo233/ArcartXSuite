# AXS 资源说明
# 用途: Conversation 模块电影序列 letterbox 黑边 HUD，播放时在屏幕上下显示黑边。
# 前置依赖: ArcartX；Conversation 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.conversation.enabled
# 关联文件: ArcartXConversation.yml
# 重载命令: /axs conversation reload
# 服务端 sync 字段:
#   visible (boolean)
# 客户端回包: 无
ui:
  isHud: true
  defaultOpen: false
  through: true
  show: true
  screenScale: true
  level: 50
  # 电影序列播放时隐藏所有其他 HUD，营造沉浸感
  # HUD = 隐藏所有 ArcartX HUD 类型 UI
  # 以下为原版 HUD 名称，保留 title_text（序列中 title 动作需要）
  hide:
    - HUD
    - vignette
    - spyglass
    - helmet
    - frostbite
    - portal
    - hotbar
    - crosshair
    - boss_event_progress
    - player_health
    - armor_level
    - food_level
    - air_level
    - mount_health
    - jump_bar
    - experience_bar
    - item_name
    - sleep_fade
    - potion_icons
    - debug_text
    - fps_graph
    - record_overlay
    - scoreboard
    - chat_panel
    - player_list
    - recipe_toast
    - system_toast
    - advancement_toast
    - tutorial_toast
  packetHandler:
    # packetHandler: sync
    # 包字段:
    #   - visible: 是否显示黑边（true=播放电影序列，false=隐藏）
    sync: |-
      var.letterboxVisible = packet['visible']
    # packetHandler: close
    # 包字段: 无（隐藏黑边）
    close: |-
      var.letterboxVisible = false
  action:
    load: |-
      var.letterboxVisible = false
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      上黑边:
        type: Texture
        attribute:
          point: ~top_center
          x: 0
          y: 0
          width: 1920
          height: 180
          normal: ~0,0,0,255
          visible: var.letterboxVisible == true
      下黑边:
        type: Texture
        attribute:
          point: ~bottom_center
          x: 0
          y: 0
          width: 1920
          height: 180
          normal: ~0,0,0,255
          visible: var.letterboxVisible == true
