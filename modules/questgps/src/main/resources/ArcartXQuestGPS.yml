# 配置文件版本号（用于迁移脚本识别版本，勿手动修改）
config-version: 2
# AXS QuestGPS
# 作用: 将 Chemdah 任务展示为 ArcartX 菜单，支持任务分类、接取/放弃、目标追踪、奖励预览、粒子导航和 AXMap 临时目标联动。
# 依赖: ArcartX、Chemdah；AXMap 可选联动。
# 重载: /axs questgps reload
# PAPI 输出: 无独立 PlaceholderAPI 输出。
# 可解析的 PAPI: 无；任务名称、目标、状态和奖励由 Chemdah 任务系统提供，本模块整理后发包给 UI。
# 关联资源: ui/questgps_menu.yml

#开发者调试按钮
debug:
  enabled: false

#UI 界面配置（UI ID、发包标识、注册与覆盖开关）
ui:
  # 任务菜单 UI ID。支持字符串（单 UI）或列表（多 UI 同时发包）：
  # menu-ui-id: "AXS:questgps_menu"
  # 多 UI 示例（同一个 payload 同时发给多个 UI）：
  # menu-ui-id:
  #   - "AXS:questgps_menu"
  #   - "AXS:questgps_menu_alt"
  menu-ui-id: "AXS:questgps_menu"
  # 导航引导 HUD UI ID。同样支持列表格式：
  # guide-ui-id:
  #   - "AXS:questgps_guide"
  #   - "AXS:questgps_guide_alt"
  guide-ui-id: "AXS:questgps_guide"
  packet-id: "AXS_QUESTGPS"
  register-ui-on-enable: true
  overwrite-ui-files: false

# UI 展示数据来源（全局二选一，无链式回退）
# chemdah：名称、描述、目标文案、目标说明读 Chemdah；奖励预览恒读 QuestGPS 配置 quests[].rewards
# overlay：上述字段均读 overlay（display-name-override、description、tasks 等）
# 单任务可在 quests/*.yml 的 presentation.source 覆盖
presentation:
  source: chemdah          # chemdah | overlay 全局二选一，无链式回退

# 分类数据来源（全局二选一，无链式回退）
# 未匹配任何已注册分类的任务会进入 category.fallback，而不会从菜单消失
category:
  # chemdah：仅读 Chemdah meta.type → categories 注册表
  # overlay：仅读 quests/*.yml 的 category 字段
  source: chemdah          # chemdah | overlay 全局二选一，无链式回退
  fallback:
    # 未匹配任何已注册分类的任务是否归入兜底分类；false 恢复旧的静默丢弃行为
    enabled: true
    id: "uncategorized"
    display-name: "未分类"
    sort-order: 1000

# 任务列表发现: overlay（白名单，仅 quests/*.yml 登记的任务进菜单）| auto（扫描全部 Chemdah 模板）
discovery:
  mode: auto            # overlay | auto 全局二选一，无链式回退

# 任务分类 Tab（仅此处注册的分类会显示；删除本段可关闭分类 Tab）
# Chemdah meta.type 与 overlay category 均须与下列 ID 之一一致；否则进入 fallback（若启用）或不进菜单
categories:
  mainline:
    display-name: "主线"
    sort-order: 0
  side:
    display-name: "支线"
    sort-order: 100
  encounter:
    display-name: "奇遇"
    sort-order: 200
  # 自定义分类示例（配合 quests/custom_example.yml）：
  # daily:
  #   display-name: "日常"
  #   sort-order: 300


#导航配置：ArcartX 路标（waypoint）+ Suite 提供的两种路径导航——模型导航（model-marker）与贴图导航（texture-marker），三者互补可独立开关
navigation:
  enabled: true
  quest-id-prefix: "AXS-questgps-"
  remove-on-finish: true
  # 导航坐标来源: chemdah（仅 Chemdah tracker）| overlay（仅 YAML）| hybrid（默认，Chemdah 优先）
  mode: hybrid
  # 多目标并行追踪：玩家可同时追踪多个任务/子目标（追踪态/到达判定并行）；
  # 屏幕路标与路径标记链只跟随"最新激活且同世界"的目标（避免多路标误导玩家）。
  # 目标刷新间隔（tick）：驱动动态坐标解析（Chemdah/NPC）、diff 推送与到达判定
  refresh-ticks: 10
  # 目标在其他世界时的提示节流间隔（秒），0 = 不提示
  world-hint-interval: 30
  # 到达触发半径（格），0 = 不启用到达判定；
  # 到达不取消导航，须离开 finish-range + finish-rearm-buffer 才会再次触发
  finish-range: 0
  # 到达命令（控制台执行，支持 %player% 占位符）；
  # 任务/子目标可在 quests/*.yml 的导航点里用 finish-range/finish-commands 覆盖
  finish-commands: []
  # 到达判定的滞回缓冲（格）：触发后须离开 finish-range + 本值 才重新武装，防边界抖动重复触发
  finish-rearm-buffer: 3.0

  # ArcartX 路标 — 目标点光柱 + 标题（ArcartX waypoint 系统渲染）。
  # 依赖: ArcartX 客户端。
  waypoint:
    # 是否推送路标；false 时导航仅保留追踪态/到达判定/路径标记，不发路标包。
    enabled: true
    # 路标样式 ID，在 ArcartX waypoint 目录下定义。
    style-id: "default"
    # 路标标题模板（单行；支持 %label% 目标名 / %quest% 任务名 / %objective% 子目标名 /
    #   %distance% 距离 / %world% / %x% / %y% / %z%），留空时直接显示目标名。
    title-template: ""

  # 模型导航提示 — 使用 Adyeshach 私有实体 + ArcartX 模型渲染客户端导航标记。
  # 仅在追踪状态变更时发包，客户端独立渲染，零服务端 tick 开销。
  # 依赖: Adyeshach + ArcartX 客户端。
  model-marker:
    enabled: true
    # ArcartX 模型 ID（在 ArcartX model 配置中定义）。
    model-id: "waypoint"
    # 模型缩放比例。
    scale: 1.0
    # 模型默认状态名称。
    default-state: "idle"
    # 循环播放的动画名称（客户端执行）。
    animation: "rotate"
    # 模型相对导航目标的 Y 轴偏移（方块数）。
    y-offset: 0.0
    # ---- 路径寻路参数 ----
    # 路径标记间距（方块数，沿路径每隔多少格放一个标记）。
    path-interval: 3.0
    # 路径标记最大数量（超出后截断远端标记）。
    path-max-markers: 20
    # 路径更新间隔（tick，20 = 1秒，玩家移动后重新计算路径）。
    path-update-ticks: 10
    # 路径最大渲染距离（方块数，超出此距离不显示路径标记）。
    path-max-distance: 64
    # 距离滞回缓冲（格）：标记因超距隐藏后，须回到 path-max-distance - 本值 以内才重新显示。
    path-reshow-buffer: 8
    # A* 寻路最大迭代次数（防止服务端卡顿，越大路径越精确但越耗时）。
    path-max-iterations: 2000

  # 贴图导航提示 — 沿寻路结果向玩家单人下发 ArcartX 世界贴图（WorldTexture）路径提示。
  # 与 model-marker 模型导航互补，可同开也可独立开关；无需 Adyeshach 实体，仅发包，天然玩家私有。
  # 依赖: ArcartX 客户端（资源包中须存在 texture 对应贴图）。
  texture-marker:
    # 是否启用贴图路径提示
    enabled: false
    # 贴图资源 ID（ArcartX 自定义文字贴图格式：§k!%<id><type>，或资源包中注册的贴图名）
    texture: "nav_arrow"
    # 贴图渲染宽度 / 高度
    width: 100
    height: 100
    # 是否始终面向玩家（billboard）；false = 按 pitch/yaw 定向（贴地箭头）
    facing: false
    # 是否泛光（夜间可见性更好）
    glowing: true
    # 贴图相对路径点的 Y 轴偏移（方块数）
    y-offset: 0.1
    # 俯仰角（度）；贴地渲染用 90，facing=true 时一般忽略
    pitch: 90
    # yaw 是否朝向下一个路径点（贴地箭头指示前进方向）
    orient-to-path: true
    # 贴图存活时长（-1 = 永续，直到导航取消/路径重算时显式移除）
    life-time: -1
    # 循环缩放脉冲动画；按路径点序号错开 delay 形成沿路径传播的波浪效果
    pulse:
      enabled: true
      # 脉冲起始 / 目标缩放倍率
      from: 0.8
      to: 1.2
      # 脉冲单段时长（客户端动画单位）
      duration: 20
      # 逐级延迟（每个路径点相对前一点的动画延迟；0 = 同步缩放）
      stagger: 2
    # ---- 路径寻路参数（与 model-marker 同语义，互不影响） ----
    # 路径贴图间距（方块数）
    path-interval: 3.0
    # 路径贴图最大数量（超出后截断远端贴图）
    path-max-markers: 20
    # 路径更新间隔（tick）
    path-update-ticks: 10
    # 路径最大渲染距离（方块数）
    path-max-distance: 64
    # 距离滞回缓冲（格）：贴图因超距隐藏后，须回到 path-max-distance - 本值 以内才重新显示
    path-reshow-buffer: 8
    # A* 寻路最大迭代次数
    path-max-iterations: 2000

# 提供 MySQL数据库 给 Chemdah免费版 （此为补充付费版独有功能，与任务菜单 UI 无关）
# · 大多数服：Chemdah config.yml 用 database.use=LOCAL → 保持 enabled: false
# · 要用 MySQL：Chemdah 设 database.use=SQL，此处 enabled: true
#   QuestGPS 会优先使用内置 DatabaseMySQL（基于 Chemdah 免费版 Relational），
database:
  enabled: false                      # true = 由 QuestGPS 为 Chemdah 注册 MySQL 存储
  load-in-join-event: true            # 玩家进服时加载 Chemdah 档案
  release-in-quit-event: true         # 玩家退服时释放档案
  disable-auto-save: false            # false = 允许 Chemdah 定时自动保存
  disable-auto-create-table: false    # false = 首次使用时自动建表

# 主线门禁：未完成指定主线前，限制部分玩法（类似新手引导锁）
# required-mainline-quest-ids 为空 = 整段门禁关闭，下列拦截均不生效
gate:
  # 玩家须完成的 Chemdah 任务 ID（全部完成才「过关」）
  # 示例: ["example_mainline_quest"]
  required-mainline-quest-ids: []
  # 未过关时，任务菜单里这些分类 Tab 锁定（不能查看/接取）
  # ID 须与上方 categories 段一致
  blocked-categories:
    - side
    - encounter
  # 未过关时，玩家输入以这些前缀开头的命令会被拦截（不含 /）
  blocked-command-prefixes:
    - "warp"
    - "rtp"
    - "shop"
  # 未过关时，其他模块入口被锁定（模块打开 UI 前调用 QuestGpsNavigable.moduleEntryLocked）
  # 填写各模块约定的入口 ID 字符串，示例：
  #   - "market"           # 商店/拍卖行入口
  #   - "regions_warp"     # 区域传送面板
  blocked-module-entries: []
  # 未过关时，EventPacket 规则不触发（与 data/eventpacket/rules/*.yml 根键一致）
  # 示例：
  #   - "first_join_offer_mainline"      # rules/examples.yml
  #   - "kill_zombie_trigger_encounter"  # 击杀僵尸累计触发奇遇
  blocked-event-rule-ids: []
  # 被拦截时发给玩家的提示
  deny-message: "&c你需要先完成必要主线任务。"
  deny-chat-card: ""                  # 可选，ArcartX 聊天卡片 ID
  deny-subtitle: ""                   # 可选，ArcartX-Suite 模块 announcer 字幕组 ID

# 任务定义目录，路径相对模块数据目录。
# 目录下每个 *.yml 文件可包含多个任务，根键即为任务 ID。
# 同一个文件中可放多个任务定义，不需要每个任务单独一个文件。
quests-directory: "quests"
