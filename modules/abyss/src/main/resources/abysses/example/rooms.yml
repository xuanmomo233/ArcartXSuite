      - region: ["55,61,9", "55,64,14"]
    groups:
      w1a:  # 首波包A
        spawn-timing: MANUAL
        monsters:
          - mob-id: vanilla:zombie
            location: "43,61,7"
            amount: 2
          - mob-id: vanilla:zombie
            location: "38,61,11"
            amount: 2
          - mob-id: vanilla:skeleton
            location: "48,61,11"
            amount: 1
      w1b:  # 首波包B
