# AXPM Warehouse Storage - 重制版布局
# 使用三分区 Canvas + HStack 自动排列 + Grid 范式重写
# 逻辑脚本(packetHandler/action/val引用/entryKey)与原版完全一致，仅重构布局结构

ui:
  isHud: false
  defaultOpen: false
  hide: []
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 包标识符（'AXS_WAREHOUSE'）
    #   - action_token: 操作令牌（防重放）
    #   - ownerType: 仓库所有者类型（personal / shared）
    #   - ownerId: 所有者 ID
    #   - warehouseId: 仓库 ID
    #   - warehouseName: 仓库名称
    #   - categoryId: 当前分类 ID
    #   - search: 搜索关键词
    #   - categories: 分类列表
    #   - categoryTexts: 分类显示文本
    #   - personalWarehouses: 个人仓库列表
    #   - personalWarehouseTexts: 个人仓库显示文本
    #   - sharedWarehouses: 共享仓库列表
    #   - sharedWarehouseStorageTexts: 共享仓库存储显示文本
    #   - slots: 仓库槽位数据
    #   - selectedSlot: 当前选中的槽位索引
    #   - selectedItem: 当前选中的物品
    #   - backpack: 玩家背包数据
    #   - unlocked: 二级密码是否已解锁
    #   - hasPassword: 是否已设置二级密码
    #   - readOnly: 是否只读模式
    #   - sharedEditMode: 共享仓库是否处于编辑模式
    #   - sharedCanEdit: 当前玩家是否有编辑权限
    #   - lockOwner: 编辑锁持有者
    #   - page: 当前页码
    #   - pageTotal: 总页数
    #   - pageText: 页码显示文本
    #   - capacityText: 容量显示文本
    #   - used: 已使用容量
    #   - capacity: 总容量
    #   - level: 仓库等级
    #   - canUpgrade: 是否可升级
    #   - nextUpgradeText: 下一级升级信息文本
    #   - nextLevel: 下一级等级
    #   - nextCapacity: 下一级容量
    #   - usedSlots: 已使用的槽位集合
    #   - matchedSlots: 搜索匹配的槽位集合
    #   - slotCount: 槽位总数
    #   - pageSize: 每页槽位数量
    #   - maxPersonalCount: 个人仓库最大数量（用于动态创建控件）
    #   - maxSharedCount: 共享仓库最大数量
    #   - maxCategoryCount: 分类最大数量
    update: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.categoryId = packet['categoryId']
      var.search = packet['search']
      var.sortId = packet['sortId']
      var.sortText = packet['sortText']
      var.categories = packet['categories']
      var.categoryTexts = packet['categoryTexts']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseStorageTexts = packet['sharedWarehouseStorageTexts']
      var.slots = packet['slots']
      var.selectedSlot = packet['selectedSlot']
      var.selectedItem = packet['selectedItem']
      var.backpack = packet['backpack']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.sharedEditMode = packet['sharedEditMode']
      var.sharedCanEdit = packet['sharedCanEdit']
      var.lockOwner = packet['lockOwner']
      var.page = packet['page']
      var.pageTotal = packet['pageTotal']
      var.pageText = packet['pageText']
      var.capacityText = packet['capacityText']
      var.used = packet['used']
      var.capacity = packet['capacity']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.nextLevel = packet['nextLevel']
      var.nextCapacity = packet['nextCapacity']
      var.usedSlots = packet['usedSlots']
      var.matchedSlots = packet['matchedSlots']
      var.slotCount = packet['slotCount']
      var.pageSize = packet['pageSize']
      var.maxPersonalCount = packet['maxPersonalCount']
      var.maxSharedCount = packet['maxSharedCount']
      var.maxCategoryCount = packet['maxCategoryCount']
      // 模板保留在索引 0，只有复制出来的控件才是数据行。
      个人仓库数 = var.maxPersonalCount.round()
      现有个人仓库数 = val.个人仓库列表.childrenCount() - 1
      if(现有个人仓库数 != 个人仓库数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.个人仓库列表.childrenCount() > 1){
          val.个人仓库列表.get(1).remove()
        }
        if(个人仓库数 > 1){
          for(序号 in range(1, 个人仓库数 - 1)){
            项 = val.个人仓库列表['项'].copy('个人仓库项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      共享仓库数 = var.maxSharedCount.round()
      现有共享仓库数 = val.共享仓库列表.childrenCount() - 1
      if(现有共享仓库数 != 共享仓库数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.共享仓库列表.childrenCount() > 1){
          val.共享仓库列表.get(1).remove()
        }
        if(共享仓库数 > 1){
          for(序号 in range(1, 共享仓库数 - 1)){
            项 = val.共享仓库列表['项'].copy('共享仓库项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      分类数 = var.maxCategoryCount.round()
      现有分类数 = val.分类列表.childrenCount() - 1
      if(现有分类数 != 分类数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.分类列表.childrenCount() > 1){
          val.分类列表.get(1).remove()
        }
        if(分类数 > 1){
          for(序号 in range(1, 分类数 - 1)){
            项 = val.分类列表['项'].copy('分类项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      var.renderBackpackAmounts()
      var.itemJsons = {}
      if(var.slots != none){
        for(key in var.slots.keys()){
          json = packet['slotItemJson' + key]
          if(json != none){
            var.itemJsons[key] = json
          } else {
            var.itemJsons[key] = var.air
          }
        }
      }
      仓库槽位数 = var.pageSize.round()
      现有仓库槽位数 = val.仓库网格.childrenCount() - 1
      if(现有仓库槽位数 != 仓库槽位数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.仓库网格.childrenCount() > 1){
          val.仓库网格.get(1).remove()
        }
        if(仓库槽位数 > 1){
          for(序号 in range(1, 仓库槽位数 - 1)){
            slot = val.仓库网格['物品图标'].copy('仓库物品图标_' + var.刷新轮次 + '_' + 序号.round())
            slot.entryKey = 序号.round()
          }
        }
      }
      for(i in range(0, 仓库槽位数 - 1)){
        icon = val.仓库网格.get(i.round())
        if(icon != none){
          icon.seticon()
        }
      }
  action:
    load: |-
      var.packetId = 'AXS_WAREHOUSE'
      var.ownerType = 'personal'
      var.ownerId = none
      var.warehouseId = none
      var.warehouseName = 'AXPM 仓库'
      var.categoryId = 'all'
      var.search = none
      var.sortId = 'time'
      var.sortText = '时间'
      var.categories = {}
      var.categoryTexts = {}
      var.personalWarehouses = {}
      var.personalWarehouseTexts = {}
      var.sharedWarehouses = {}
      var.sharedWarehouseStorageTexts = {}
      var.slots = {}
      var.itemJsons = {}
      var.air = '{"id": "minecraft:air","Count":1b}'
      var.selectedSlot = -1
      var.selectedItem = none
      var.backpack = {}
      var.unlocked = false
      var.hasPassword = false
      var.readOnly = false
      var.sharedEditMode = false
      var.sharedCanEdit = false
      var.lockOwner = none
      var.page = 1
      var.pageTotal = 1
      var.pageText = '1/1'
      var.capacityText = '0/0'
      var.used = 0
      var.capacity = 0
      var.level = 1
      var.canUpgrade = false
      var.nextUpgradeText = none
      var.slotCount = 0
      var.pageSize = 0
      var.amount = 1
      var.passwordText = none
      var.categoryScrollRatio = 0
      var.switchScrollRatio = 0
      var.selectedBackpackSlot = -1
      var.lastBackpackClickSlot = none
      var.lastBackpackClickTime = 0
      var.lastSlotClickSlot = none
      var.lastSlotClickTime = 0
      var.emptyItemJson = '{"id": "minecraft:air","Count":1b}'
      var.maxPersonalCount = 0
      var.maxSharedCount = 0
      var.maxCategoryCount = 0
      var.刷新轮次 = 0
      var.renderBackpackAmounts = -> {
        if(val.背包网格 != none){
          for(raw in range(9,44)){
            control = raw == 9 ? val.背包网格['背包槽'] : val.背包网格['背包槽' + (raw - 9)]
            entry = var.backpack[raw.round()]
            if(control != none){
              amountText = none
              if(entry != none && !entry['empty']){
                amountText = '&f' + entry['amount']
              }
              amountControl = control['数量']
              if(amountControl != none){
                amountControl.texts = amountText
              }
            }
          }
        }
      }
    open: |-
      Packet.send(var.packetId, 'refresh')

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1660
          height: 1030
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~95,95,95,220
              shape: ~round_rect
              radius: 28
            effect:
              stroke:
                width: 3
                color: ~255,255,255,255
              shadow:
                xOffset: 2
                yOffset: 2
                blur: 5
                color: ~255,255,255,75
              ripple:
                duration: 1200
                color: ~255,255,255,110
                width: 0.05

          标题区:
            type: VStack
            attribute:
              point: ~top_left
              x: 42
              y: 30
              spaceBetween: 0
            children:
              标题:
                type: Text
                attribute:
                  texts: "'&f' + var.warehouseName"
                  fontSize: 64
              状态:
                type: Text
                attribute:
                  width: 720
                  texts: "var.readOnly ? '&c只读模式 ' + var.lockOwner : (var.unlocked ? '&a二级密码已解锁' : '&c二级密码未解锁')"
                  fontSize: 38

          顶部按钮栏:
            type: HStack
            attribute:
              point: ~top_right
              x: -42
              y: 42
              spaceBetween: 12
              height: 50
            children:
              共享只读:
                type: Canvas
                attribute:
                  visible: var.ownerType == 'shared'
                  width: 80
                  height: 50
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'shared_mode', 'readonly')
                children:
                  共享只读背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.sharedEditMode ? '255,255,255,150' : '120,190,255,230'"
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  共享只读文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 80
                      texts: "~&0只读"
                      fontSize: 34
                      through: true
              共享存取:
                type: Canvas
                attribute:
                  visible: var.ownerType == 'shared'
                  width: 80
                  height: 50
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'shared_mode', 'edit')
                children:
                  共享存取背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.sharedEditMode && !var.readOnly ? '120,190,255,230' : (var.sharedCanEdit ? '255,255,255,150' : '255,180,180,170')"
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  共享存取文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 80
                      texts: "~&0存取"
                      fontSize: 34
                      through: true
              展示按钮:
                type: Canvas
                attribute:
                  width: 80
                  height: 50
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'showcase')
                children:
                  展示背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~255,255,255,150
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  展示文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 80
                      texts: "~&0展示"
                      fontSize: 34
                      through: true
              银行按钮:
                type: Canvas
                attribute:
                  visible: var.ownerType != 'shared'
                  width: 80
                  height: 50
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'bank')
                children:
                  银行背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~255,255,255,150
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  银行文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 80
                      texts: "~&0银行"
                      fontSize: 34
                      through: true
              管理按钮:
                type: Canvas
                attribute:
                  width: 80
                  height: 50
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'manage')
                children:
                  管理背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~255,255,255,150
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  管理文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 80
                      texts: "~&0管理"
                      fontSize: 34
                      through: true
              刷新按钮:
                type: Canvas
                attribute:
                  width: 80
                  height: 50
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'refresh')
                children:
                  刷新背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~255,255,255,150
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  刷新文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 80
                      texts: "~&0刷新"
                      fontSize: 34
                      through: true
              排序按钮:
                type: Canvas
                attribute:
                  width: 80
                  height: 50
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'sort')
                children:
                  排序背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~255,255,255,150
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  排序文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 80
                      texts: "'&0' + var.sortText"
                      fontSize: 34
                      through: true

          仓库切换卡片:
            type: Canvas
            attribute:
              point: ~top_left
              x: 292
              y: 112
              width: 1326
              height: 72
            children:
              卡片背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~255,255,255,120
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 2
                    color: ~0,0,0,255
              切换横向滑块:
                type: Texture
                val: 切换横向滑块
                attribute:
                  x: 18
                  y: 66
                  width: 50
                  height: 6
                  normal: ~120,120,120,200
                  maxDragX: 1240
              切换滚动:
                type: Scroll
                val: 切换滚动
                attribute:
                  x: 18
                  y: 12
                  width: 1290
                  height: 48
                  moveX: "self.parent['切换横向滑块'].getDragXRatio()"
                action:
                  wheel: |-
                    if(self.moveX >= 0 && self.wheelValue > 0){
                      self.parent['切换横向滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveX <= 1 && self.wheelValue < 0){
                      self.parent['切换横向滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                    }
                children:
                  切换行:
                    type: HStack
                    attribute:
                      height: 48
                      spaceBetween: 10
                    children:
                      个人仓库列表:
                        type: HStack
                        val: 个人仓库列表
                        attribute:
                          height: 48
                          spaceBetween: 10
                        children:
                          项:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: var.personalWarehouses[self.entryKey]
                              visible: self.entry != none
                              width: 170
                              height: 48
                            action:
                              clickLeft: |-
                                Packet.send(var.packetId, 'warehouse', self.entry['id'])
                            children:
                              项背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: "var.ownerType == 'personal' && self.parent.entry != none && self.parent.entry['id'] == var.warehouseId ? '120,190,255,230' : '255,255,255,145'"
                                  hover: ~Frosted:0;255,255,255,240
                                  shape: ~round_rect
                                  radius: 14
                                effect:
                                  stroke:
                                    width: 2
                                    color: ~0,0,0,255
                              项文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 170
                                  texts: "var.personalWarehouseTexts[self.parent.entryKey]"
                                  fontSize: 34
                                  through: true
                      共享仓库列表:
                        type: HStack
                        val: 共享仓库列表
                        attribute:
                          height: 48
                          spaceBetween: 10
                        children:
                          项:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: var.sharedWarehouses[self.entryKey]
                              visible: self.entry != none
                              width: 190
                              height: 48
                            action:
                              clickLeft: |-
                                Packet.send(var.packetId, 'shared', self.entry['id'])
                            children:
                              项背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: "var.ownerType == 'shared' && self.parent.entry != none && self.parent.entry['id'] == var.ownerId ? '120,190,255,230' : '255,255,255,145'"
                                  hover: ~Frosted:0;255,255,255,240
                                  shape: ~round_rect
                                  radius: 14
                                effect:
                                  stroke:
                                    width: 2
                                    color: ~0,0,0,255
                              项文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 190
                                  texts: "var.sharedWarehouseStorageTexts[self.parent.entryKey]"
                                  fontSize: 32
                                  through: true

          分类卡片:
            type: Canvas
            attribute:
              point: ~top_left
              x: 42
              y: 210
              width: 220
              height: 610
            children:
              卡片背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~255,255,255,120
                  shape: ~round_rect
                  radius: 24
                effect:
                  stroke:
                    width: 2
                    color: ~0,0,0,255
              搜索区:
                type: VStack
                attribute:
                  point: ~top_center
                  y: 32
                  spaceBetween: 8
                  width: 176
                children:
                  搜索框:
                    type: Canvas
                    attribute:
                      width: 176
                      height: 42
                    children:
                      背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~90,90,90,220
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 2
                            color: ~0,0,0,255
                      输入框:
                        type: TextBox
                        attribute:
                          x: 8
                          y: 10
                          width: 176
                          height: 36
                          length: 32
                          emptyText: ~搜索
                          fontSize: 36
                        action:
                          textChange: |-
                            var.search = self.getContent()
                          enter: |-
                            Packet.send(var.packetId, 'search', var.search)
                  搜索按钮组:
                    type: HStack
                    attribute:
                      spaceBetween: 8
                      height: 42
                    children:
                      搜索:
                        type: Canvas
                        attribute:
                          width: 84
                          height: 42
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'search', var.search)
                        children:
                          搜索背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~255,255,255,150
                              hover: ~Frosted:0;255,255,255,240
                              shape: ~round_rect
                              radius: 12
                            effect:
                              stroke:
                                width: 2
                                color: ~0,0,0,255
                          搜索文字:
