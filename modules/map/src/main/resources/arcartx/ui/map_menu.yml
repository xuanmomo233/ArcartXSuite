          # ─── 跨世界导航确认弹窗（模态遮罩，挡住下层一切点击）───
          跨世界确认层:
            type: Canvas
            attribute:
              point: ~stretch_all
              width: "var.viewW"
              height: "var.viewH"
              visible: "var.crossWorldPromptVisible"
              mapCapture: true
            children:
              确认遮罩:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~0,0,0,160
              确认对话框:
                type: Canvas
                attribute:
                  point: ~middle_center
                  width: 760
                  height: 330
                children:
                  对话框底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~238,228,201,250
                      shape: ~round_rect
                      radius: 16
                    effect:
                      stroke:
                        width: 4
                        color: ~142,128,97,255
                  对话框标题:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 32
                      texts: "var.crossWorldPromptType == 'navigate' ? '&0跨世界导航' : '&0目的地传送确认'"
                      fontSize: 36
                      through: true
                  对话框内容:
                    type: Scroll
                    attribute:
                      point: ~top_left
                      x: 40
                      y: 82
                      width: 680
                      height: 44
                      scrollAnim: none
                      moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                      tip: ~&8悬停查看完整目的地
                    action:
                      enter: "self.scrollAnim = Lerp(0, 1, 4000)"
                      leave: "self.scrollAnim = none"
                    children:
                      目的地布局:
                        type: HStack
                        attribute:
                          height: 44
                        children:
                          目的地文字:
                            type: Text
                            attribute:
                              texts: "var.crossWorldPromptType == 'teleport_world' ? '&8目的地 / &0' + var.crossWorldTargetName : '&8目的地 / &0' + var.selectedWorldName"
                              fontSize: 48
                              through: true
                  # 远程传送提示：费用在目标服落地时扣除
                  对话框远程提示:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 180
                      texts: ~&8费用将在进入目标服务器后扣除
                      fontSize: 36
                      visible: "var.crossWorldRemote == true"
                      through: true
                  对话框费用:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 140
                      texts: "'&6传送费用: &0' + var.detailCrossWorldCostText"
                      fontSize: 48
                      visible: "var.crossWorldPromptType != 'teleport_world' && var.detailCrossWorldCostText != none && var.detailCrossWorldCostText != ''"
                      through: true
                  确认按钮:
                    type: Canvas
                    attribute:
                      tip: ~&0确认
                      point: ~bottom_left
                      x: 40
                      y: -24
                      width: 180
                      height: 52
                      enable: "var.actionToken != none"
                    action:
                      clickLeft: |-
                        var.crossWorldPromptVisible = false
                        // navigate=传送+追踪；teleport=锚点传送；teleport_world=世界出生点传送
                        if (var.crossWorldPromptType == 'teleport_world') {
                          var.actionBusy = true
                          Packet.send(var.packetId, 'teleport_to_world', var.crossWorldTargetWorld, var.actionToken)
                        } elif (var.crossWorldPromptType == 'teleport') {
                          var.actionBusy = true
                          Packet.send(var.packetId, 'teleport_anchor', var.detailSelectedId, var.actionToken)
                        } else {
                          Packet.send(var.packetId, 'cross_world_navigate', var.detailSelectedType + ':' + var.detailSelectedId, var.actionToken)
                        }
                    children:
                      确认底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~132,182,193,255
                          hover: ~157,201,208,255
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: "self.isHovered() ? 2 : 1"
                            color: ~142,128,97,255
                      确认文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "var.crossWorldPromptType == 'navigate' ? '&0传送并导航' : '&0确认传送'"
                          fontSize: 36
                          through: true
                  取消按钮:
                    type: Canvas
                    attribute:
                      tip: ~&0取消
                      point: ~bottom_right
                      x: -40
                      y: -24
                      width: 180
                      height: 52
                    action:
                      clickLeft: |-
                        var.crossWorldPromptVisible = false
                    children:
                      取消底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~225,214,187,255
                          hover: ~243,232,204,255
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: "self.isHovered() ? 2 : 1"
                            color: ~142,128,97,255
                      取消文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: ~&0取消
                          fontSize: 36
                          through: true
