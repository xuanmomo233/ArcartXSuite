              point: ~top_right
              x: -12
              y: 288
              width: 10
              height: 250
              normal: ~53,40,33,245
              shape: ~round_rect
              radius: 5
            effect:
              stroke:
                width: 2
                color: ~224,194,152,230
          仓库滑块:
