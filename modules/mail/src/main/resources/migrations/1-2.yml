from-version: 1
to-version: 2
description: "storage.mode 重命名为 storage.shared，值从 sqlite/mysql 映射为 true/false；vault-attachment 字段删除；item-attachments 物品格式从 material 改为 source+id"
operations:
  - type: set-if-missing
    path: storage.shared
    value: true
  - type: rename
    from: storage.mode
    to: storage.shared
  - type: value-map
    path: storage.shared
    mapping:
      "mysql": false
      "sqlite": true
  - type: remove
    path: preset.vault-attachment
