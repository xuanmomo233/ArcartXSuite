# AXS 钓鱼图鉴界面
# 打开方式: /fishing
# 数据交互: packetHandler init/update
# 本界面展示玩家已捕获鱼类的图鉴信息，包括等级、经验、捕获总数、图鉴完成度等

ui:
  isHud: false  # 非HUD模式，打开时显示鼠标光标
  background: true  # 渲染半透明背景遮罩
  escClose: true  # 按ESC键可关闭界面
  closeDied: true  # 玩家死亡时自动关闭界面
  through: false  # 不允许点击穿透到下层
  screenScale: true  # 启用屏幕等比缩放
  show: true  # 界面默认可见
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包标识符，用于回传输入操作
    #   - playerLevel: 玩家当前钓鱼等级
    #   - totalXp: 玩家累计钓鱼经验值
    #   - totalCaught: 玩家累计捕获鱼的总数
    #   - collectionCount: 已收集图鉴条目数（已发现的鱼种数）
    #   - totalFishTypes: 鱼种总数（图鉴总条目数）
    #   - collectionPercent: 图鉴完成百分比
    #   - fishList: 鱼类列表数据，每项含 name/rarity/caught/maxSize 字段
    #   - maxFishCount: 鱼类列表最大条目数（用于动态生成列表项）
    init: |-
      var.packetId = packet['packetId']
      var.playerLevel = packet['playerLevel']
      var.totalXp = packet['totalXp']
      var.totalCaught = packet['totalCaught']
      var.collectionCount = packet['collectionCount']
      var.totalFishTypes = packet['totalFishTypes']
      var.collectionPercent = packet['collectionPercent']
      var.fishList = packet['fishList']
      var.maxFishCount = packet['maxFishCount']
      while(val.鱼类列表.childrenCount() > 1){
        val.鱼类列表.get(1).remove()
      }
      for(i in range(1, var.maxFishCount - 1)){
        key = i.round()
        e = val.鱼类列表['鱼条目'].copy('鱼条目' + key)
        e.entryKey = key
      }
    # packetHandler: update
    # 包字段:
    #   - packetId: 数据包标识符
    #   - playerLevel: 玩家当前钓鱼等级
    #   - totalXp: 玩家累计钓鱼经验值
    #   - totalCaught: 玩家累计捕获鱼的总数
    #   - collectionCount: 已收集图鉴条目数
    #   - totalFishTypes: 鱼种总数
    #   - collectionPercent: 图鉴完成百分比
    #   - fishList: 鱼类列表数据（同 init）
    #   - maxFishCount: 鱼类列表最大条目数
    update: |-
      var.packetId = packet['packetId']
      var.playerLevel = packet['playerLevel']
      var.totalXp = packet['totalXp']
      var.totalCaught = packet['totalCaught']
      var.collectionCount = packet['collectionCount']
      var.totalFishTypes = packet['totalFishTypes']
      var.collectionPercent = packet['collectionPercent']
      var.fishList = packet['fishList']
      var.maxFishCount = packet['maxFishCount']
      while(val.鱼类列表.childrenCount() > 1){
        val.鱼类列表.get(1).remove()
      }
      for(i in range(1, var.maxFishCount - 1)){
        key = i.round()
        e = val.鱼类列表['鱼条目'].copy('鱼条目' + key)
        e.entryKey = key
      }
  action:
    # open: 界面打开时的默认初始化变量（等待服务端数据包覆盖）
    open: |-
      var.packetId = 'AXS_FISHING'
      var.playerLevel = 1
      var.totalXp = 0
      var.totalCaught = 0
      var.collectionCount = 0
      var.totalFishTypes = 0
      var.collectionPercent = 0
      var.fishList = {}
      var.maxFishCount = 0

controls:
  # 自适应全局布局：以1920x1080设计分辨率等比缩放整个界面
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 800
          height: 600
        children:
          # 背景：半透明深色圆角面板
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~35,35,45,235
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~80,180,255,180
              shadow:
                xOffset: 2
                yOffset: 2
                blur: 6
                color: ~0,0,0,120

          # 标题：界面顶部"钓鱼图鉴"文字
          标题:
            type: Text
            attribute:
              x: 36
              y: 28
              texts: "~&e钓鱼图鉴"
              fontSize: 56

          # 关闭按钮：右上角红色X按钮，点击关闭界面
          关闭按钮:
            type: Texture
            attribute:
              x: 710
              y: 24
              width: 56
              height: 56
              normal: ~180,60,60,200
              hover: ~Frosted:0;220,80,80,230
              shape: ~round_rect
              radius: 14
            action:
              clickLeft: |-
                Screen.close()
            effect:
              stroke:
                width: 2
                color: ~255,120,120,120
            children:
              文字:
                type: Text
                attribute:
                  x: 28
                  y: 14
                  through: true
                  center: true
                  fontSize: 36
                  texts: "~&fX"

          # 统计信息：展示玩家等级、经验、捕获数、图鉴进度
          统计信息:
            type: Canvas
            attribute:
              x: 36
              y: 100
              width: 728
              height: 80
            children:
              等级文本:
                type: Text
                attribute:
                  x: 0
                  y: 0
                  texts: "'&fLv.' + var.playerLevel"
                  fontSize: 36
              经验文本:
                type: Text
                attribute:
                  x: 0
                  y: 38
                  texts: "'&7总经验: &f' + var.totalXp"
                  fontSize: 28
              捕获统计:
                type: Text
                attribute:
                  x: 200
                  y: 0
                  texts: "'&7捕获: &f' + var.totalCaught + ' 条'"
                  fontSize: 28
              图鉴进度:
                type: Text
                attribute:
                  x: 200
                  y: 38
                  texts: "'&7图鉴: &f' + var.collectionCount + '/' + var.totalFishTypes + ' (' + var.collectionPercent + '%)'"
                  fontSize: 28

          # 图鉴滑块：右侧滚动条滑块，可拖动滚动鱼类列表
          图鉴滑块:
            type: Texture
            val: 图鉴滑块
            attribute:
              x: 758
              y: 200
              width: 6
              height: 50
              normal: ~120,120,120,200
              maxDragY: 320
          # 滚动区：可滚动的鱼类列表容器，滚轮控制滚动
          滚动区:
            type: Scroll
            attribute:
              x: 36
              y: 200
              width: 728
              height: 370
              moveY: "self.parent['图鉴滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['图鉴滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['图鉴滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              鱼类列表:
                val: 鱼类列表
                type: VStack
                attribute:
                  width: 728
                  spaceBetween: 6
                children:
                  # 鱼条目：单条鱼类信息模板，根据 fishList 数据动态复制
                  鱼条目:
                    type: Texture
                    attribute:
                      entryKey: 0.round()
                      entry: var.fishList[self.entryKey]
                      visible: self.entry != none
                      width: 728
                      height: 50
                      normal: "self.entry != none && self.entry['caught'] ? '60,80,60,200' : '60,60,70,200'"
                      shape: ~round_rect
                      radius: 8
                    effect:
                      stroke:
                        width: 1
                        color: ~80,180,255,60
                    children:
                      鱼名:
                        type: Text
                        attribute:
                          x: 12
                          y: 8
                          texts: "self.parent.entry != none ? ('&f' + self.parent.entry['name'] + (self.parent.entry['caught'] ? ' &a✓' : ' &7?')) : none"
                          fontSize: 28
                          through: true
                      稀有度:
                        type: Text
                        attribute:
                          x: 12
                          y: 28
                          texts: "self.parent.entry != none ? ('&7' + self.parent.entry['rarity']) : none"
                          fontSize: 22
                          through: true
                      最大尺寸:
                        type: Text
                        attribute:
                          x: 500
                          y: 14
                          texts: "self.parent.entry != none && self.parent.entry['caught'] ? ('&7最大: &f' + self.parent.entry['maxSize']) : '&7未捕获'"
                          fontSize: 24
                          through: true
