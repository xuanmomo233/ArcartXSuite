              fontSize: 24
              through: true
          # 世界列表浮层：槽位上方弹出，图标+世界名竖排
          世界列表浮层:
            type: Canvas
            attribute:
              point: ~top_left
              x: 28
              y: "var.viewH - 96 - 26 - 12 - 320"
              width: 240
              height: 320
