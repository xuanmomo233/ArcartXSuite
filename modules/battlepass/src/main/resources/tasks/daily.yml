# =============================================================================
# 每日任务池
# 分配给玩家的每日任务从这里按 weight 加权随机抽取 daily-count 个
# 每天 0 点自动重置并重新分配
# =============================================================================
# 事件源说明：
#   event-topic: ArcartX EventBus 主题（仅用于业务语义事件，需对应模块已加载）
#   bukkit-event: 原版 Bukkit 事件（用于有直接对应 Bukkit 事件的场景）
#   EventBus 会提前订阅，发布者注册后由 EventBus 计数，之前使用配置的 Bukkit 降级事件。
#
#   选择原则：
#   - 如果事件有直接对应的 Bukkit 事件（如击杀→EntityDeathEvent、拾取→EntityPickupItemEvent），
#     只配置 bukkit-event 即可，无需 event-topic 中转。
#   - 如果事件是业务语义（如登录成功、钓鱼成功、Boss 击杀、拍卖成交等），没有单个 Bukkit 事件
#     能直接表达，则配置 event-topic，由对应模块发布。
#   - 如果需要扩展没有的事件，请自行寻找你所使用服务器的事件填入 event-class，
#     如果没有开发能力可以交给 AI。
#
# payload key 参考：
#   EntityDeathEvent / TaczGunKillEvent: entityType, entityName
#   EntityDamageByEntityEvent / TaczGunDamageEvent: attacker, targetType, targetName, damage
#   EntityPickupItemEvent: material, amount
#   PlayerFishEvent: fishType, state
#   PlayerJoinEvent: world
#   BlockBreakEvent / BlockPlaceEvent: material, world（BlockBreakEvent 也可用于收获农作物，用 condition 匹配 material）
#   CraftItemEvent: material, amount
#   PlayerItemConsumeEvent: material
#   PlayerDeathEvent: deathCause
#   PlayerShearEntityEvent: entityType, entityName
#   EntityTameEvent: entityType, entityName
#   EntityBreedEvent: entityType, motherType, fatherType
#   PlayerBucketFillEvent: bucket, material
#   EnchantItemEvent: material, cost
#   PlayerBedEnterEvent: world
#   ProjectileHitEvent: projectileType, hitEntity, hitBlock
#   PlayerLevelChangeEvent: oldLevel, newLevel
#   PlayerAdvancementDoneEvent: advancement, world
#   PlayerItemBreakEvent: material, world
#   PlayerHarvestBlockEvent: material, world
#   MythicMobDeathEvent: entityType, entityName, mythicMobId, world
#   questgps.quest_completed: quest_id, quest_name
# =============================================================================

# -------- 每日登录 --------
