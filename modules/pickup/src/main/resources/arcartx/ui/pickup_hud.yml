# AXS pickup_hud; version=6; maxVisible=4; ttlMs=3000
# 战利品野外工具组 / 拾取回执：四条短签，沿用名称颜色，三秒后自动收起。
ui:
  isHud: true
  defaultOpen: false
  through: false
  background: false
  closeDied: false
  show: true
  level: 10
  packetHandler:
    pick: |-
      var.now = Time.currentTime()
      var.entry4Visible = var.entry3Visible
      var.entry4CreatedAt = var.entry3CreatedAt
      var.entry4Amount = var.entry3Amount
      var.entry4ItemJson = var.entry3ItemJson
      var.entry4IconDirty = true
      var.entry3Visible = var.entry2Visible
      var.entry3CreatedAt = var.entry2CreatedAt
      var.entry3Amount = var.entry2Amount
      var.entry3ItemJson = var.entry2ItemJson
      var.entry3IconDirty = true
      var.entry2Visible = var.entry1Visible
      var.entry2CreatedAt = var.entry1CreatedAt
      var.entry2Amount = var.entry1Amount
      var.entry2ItemJson = var.entry1ItemJson
      var.entry2IconDirty = true
      var.entry1Visible = true
      var.entry1CreatedAt = var.now
      var.entry1Amount = packet['amount']
      var.entry1ItemJson = packet['itemJson']
      var.entry1IconDirty = true
  action:
    load: |-
      var.entry1Amount = 0
      var.entry1CreatedAt = 0
      var.entry2Amount = 0
      var.entry2CreatedAt = 0
      var.entry3Amount = 0
      var.entry3CreatedAt = 0
      var.entry4Amount = 0
      var.entry4CreatedAt = 0
      var.now = 0
      var.entryTtlMs = 3000
      var.entry1Visible = false
      var.entry1IconDirty = false
      var.entry2IconDirty = false
      var.entry3IconDirty = false
      var.entry4IconDirty = false
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    tick: |-
      var.now = Time.currentTime()
      if(var.entry1Visible && (var.now - var.entry1CreatedAt) >= var.entryTtlMs){
        var.entry1Visible = false
      }
      if(var.entry2Visible && (var.now - var.entry2CreatedAt) >= var.entryTtlMs){
        var.entry2Visible = false
      }
      if(var.entry3Visible && (var.now - var.entry3CreatedAt) >= var.entryTtlMs){
        var.entry3Visible = false
      }
      if(var.entry4Visible && (var.now - var.entry4CreatedAt) >= var.entryTtlMs){
        var.entry4Visible = false
      }
      if(var.entry1IconDirty){
        if(var.entry1ItemJson != none){
          val.pickup_slot_1.setItemIcon(var.entry1ItemJson)
        }
        var.entry1IconDirty = false
      }
      if(var.entry2IconDirty){
        if(var.entry2ItemJson != none){
          val.pickup_slot_2.setItemIcon(var.entry2ItemJson)
        }
        var.entry2IconDirty = false
      }
      if(var.entry3IconDirty){
        if(var.entry3ItemJson != none){
          val.pickup_slot_3.setItemIcon(var.entry3ItemJson)
        }
        var.entry3IconDirty = false
      }
      if(var.entry4IconDirty){
        if(var.entry4ItemJson != none){
          val.pickup_slot_4.setItemIcon(var.entry4ItemJson)
        }
        var.entry4IconDirty = false
      }
controls:
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080, through: true}
    children:
      回执区域:
        type: Canvas
        attribute:
          point: ~top_left
          x: "var.viewW - var.offX - 476"
          y: "var.viewH - 448"
          width: 428
          height: 312
          visible: 'var.entry1Visible || var.entry2Visible || var.entry3Visible || var.entry4Visible'
          through: true
        children:
          回执标题:
            type: Canvas
            attribute: {point: ~top_left, width: 428, height: 44, through: true}
            children:
              标题皮革:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~38,43,34,224', shape: ~round_rect, radius: 4, through: true}
              标题:
                type: Text
                attribute: {point: ~middle_left, x: 14, texts: '~&e已拾取', fontSize: 36, through: true}
              时效:
                type: Text
                attribute: {point: ~middle_right, x: -14, texts: '~&7最新在上', fontSize: 36, through: true}
          拾取纵向布局:
            type: VStack
            attribute: {point: ~top_left, y: 52, width: 428, spaceBetween: 6, through: true}
            children:
              拾取条目1:
                type: Canvas
                attribute:
                  width: 428
                  height: 60
                  visible: var.entry1Visible
                  lifeRatio: '(var.now - var.entry1CreatedAt) / var.entryTtlMs'
                  through: true
                children:
                  背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~43,52,39,238', shape: ~round_rect, radius: 4, through: true}
                    effect:
                      stroke: {width: 1, color: '~148,164,113,255'}
                  入袋色签:
                    type: Texture
                    attribute: {point: ~middle_left, width: 4, height: 36, normal: '~149,184,112,255', through: true}
                  图标:
                    val: pickup_slot_1
                    type: Slot
                    attribute: {point: ~middle_left, x: 14, width: 38, height: 38, slotType: ~Icon, normal: '~0,0,0,0', hover: '~0,0,0,0', itemScale: 0.85, visible: 'var.entry1ItemJson != none', through: true}
                  名称窗口:
                    type: Scroll
                    attribute: {point: ~middle_left, x: 64, width: 246, height: 36, moveX: 'self.parent.lifeRatio > 0.2 ? (self.parent.lifeRatio - 0.2) / 0.8 : 0', through: true}
                    children:
                      名称布局:
                        type: HStack
                        attribute: {height: 36, through: true}
                        children:
                          文字:
                            type: Text
                            attribute: {texts: "'&f' + val.pickup_slot_1.getSlotItemStack().getName()", fontSize: 36, through: true}
                  数量:
                    type: Text
                    attribute: {point: ~middle_right, x: -14, texts: "'&a+' + var.entry1Amount.round()", fontSize: 36, through: true}
                  收起轨:
                    type: Texture
                    attribute: {point: ~bottom_left, x: 14, y: -3, width: 400, height: 2, normal: '~77,85,59,255', through: true}
                  收起进度:
                    type: Texture
                    attribute: {point: ~bottom_left, x: 14, y: -3, width: '(self.parent.lifeRatio < 1 ? 1 - self.parent.lifeRatio : 0) * 400', height: 2, normal: '~186,173,117,255', through: true}
              拾取条目2:
                type: Canvas
                attribute:
                  width: 428
                  height: 60
                  visible: var.entry2Visible
                  lifeRatio: '(var.now - var.entry2CreatedAt) / var.entryTtlMs'
                  through: true
                children:
