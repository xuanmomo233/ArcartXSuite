# AXS Mail — 私人邮局与信件阅读
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  show: true
  through: false
  screenScale: true
  level: 8
  itemSize: 16
  hide:
  - hotbar
  - experience_bar
  - crosshair
  - item_name
  - jump_bar
  - mount_health
  - player_state
  - player_health
  - armor_level
  - food_level
  - air_level
  action:
    load: |-
      var.mailUi = self
      var.messages = {}
      var.selectedAttachments = {}
      var.attachmentItemJsons = {}
      var.mailRefs = {}
      var.attachmentRefs = {}
      var.maxMailCount = 0
      var.attachmentCount = 0
      var.filteredCount = 0
      var.totalCount = 0
      var.unreadCount = 0
      var.claimableCount = 0
      var.filterMode = 'all'
      var.selectedId = none
      var.selectedBody = []
      var.selectedClaimable = false
      var.isAdmin = false
      var.cdkCode = ''
      var.confirmMode = ''
      var.deleteTarget = none
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.mailRound = 0
      var.attachmentRound = 0
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      self.actions['resize']()
    open: Packet.send('AXS_MAIL', 'refresh')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    applyPacket: |-
      oldId = var.selectedId
      oldFilter = var.filterMode
      oldMailCount = var.maxMailCount
      oldAttachmentCount = var.attachmentCount
      var.filterMode = packet['filter_mode']
      var.totalCount = packet['total_count']
      var.unreadCount = packet['unread_count']
      var.claimableCount = packet['claimable_count']
      var.selectedSubject = packet['selected_subject']
      var.selectedSenderName = packet['selected_sender_name']
      var.selectedSourceText = packet['selected_source_text']
      var.selectedStatusText = packet['selected_status_text']
      var.selectedCreatedAt = packet['selected_created_at']
      var.selectedExpiresAt = packet['selected_expires_at']
      var.selectedAttachmentSummary = packet['selected_attachment_summary']
      var.selectedClaimable = packet['selected_claimable']
      var.isAdmin = packet['is_admin']
      var.messages = packet['messages'] != none ? packet['messages'] : {}
      var.selectedAttachments = packet['selected_attachments'] != none ? packet['selected_attachments'] : {}
      var.selectedBody = packet['selected_body'] != none ? packet['selected_body'] : []
      var.selectedId = packet['selected_id'] != none && packet['selected_id'] != '' ? packet['selected_id'] : none
      var.maxMailCount = var.messages.size()
      var.attachmentCount = var.selectedAttachments.size()
      var.filteredCount = var.maxMailCount
      var.confirmMode = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      if(var.maxMailCount != oldMailCount){
        for(key in var.mailRefs.keys()){
          var.mailRefs[key].remove()
        }
        var.mailRefs = {}
        var.mailRound = var.mailRound + 1
        if(var.maxMailCount > 1){
          template = val.mail_list.get(0)
          for(i in range(1, var.maxMailCount - 1)){
            row = template.copy('邮件项目_' + var.mailRound.round() + '_' + i.round())
            row.entryKey = i.round()
            var.mailRefs[i.round()] = row
          }
        }
      }
      if(var.attachmentCount != oldAttachmentCount){
        for(key in var.attachmentRefs.keys()){
          var.attachmentRefs[key].remove()
        }
        var.attachmentRefs = {}
        var.attachmentRound = var.attachmentRound + 1
        if(var.attachmentCount > 0){
          template = val.附件列表.get(0)
          for(i in range(0, var.attachmentCount - 1)){
            row = template.copy('附件项_' + var.attachmentRound.round() + '_' + i.round())
            var.attachmentRefs[i.round()] = row
          }
        }
      }
      var.attachmentItemJsons = {}
      var.attachmentIndex = 0
      for(key in var.selectedAttachments.keys()){
        entry = var.selectedAttachments[key]
        var.attachmentItemJsons[key] = entry['itemJson'] != none && entry['itemJson'] != '' ? entry['itemJson'] : var.emptyItemJson
        row = var.attachmentRefs[var.attachmentIndex.round()]
        row.entryKey = key
        row['附件图标'].seticon()
        var.attachmentIndex = var.attachmentIndex + 1
      }
      if(oldId != var.selectedId){
        val.详情滑块.setDragYRatio(0)
      }
      if(oldFilter != var.filterMode){
        val.邮件滑块.setDragYRatio(0)
      }
  packetHandler:
    init: self.actions['applyPacket']()
    update: self.actions['applyPacket']()
