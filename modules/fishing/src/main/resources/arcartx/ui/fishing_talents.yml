# AXS 钓鱼天赋网络界面（五系常驻布局）
# 打开方式: /fishing talents 或主界面导航跳转
# 数据交互: packetHandler init/update (AXS_FISHING_TALENTS)
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航 + 内容区
#       内容区 = 天赋点信息栏 + 滚动树画布（5棵树横向排列+联动天赋底部一排）
#       每棵树 = 网格布局+xy位移调控，Texture纯色块连线，正方形Slot显示icon
# 视觉规范:
#   全屏玻璃 Frosted:24;12,22,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片底 26,34,46,210  卡片描边 80,200,220,240
#   主色（青蓝）50,170,200  已点亮 124,196,142  悬停高亮 80,200,220
#   连线已点亮 124,196,142,240  连线可点亮 50,170,200,120  连线锁定 80,200,220,100
#
# Java 端 pushTalentsData 发送字段:
#   packetId, seasonId, level, talentPoints, unspentTalentPoints,
#   unlockedTalents (Map<nodeId, level:int>),
#   trees (Map<treeId, {id, displayName, description, icon, iconJson,
#     nodeCount, nodes: Map<idx, {id, name, description, tier, branch, treeId,
#       unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>}>),
#   links (Map<idx, {id, name, description, tier, branch, treeId,
#     unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>),
#   linkCount
#
# 客户端回包:
#   Packet.send(packetId, 'level_up_talent', nodeId)  — 升级指定节点
#   Packet.send(packetId, 'reset_talents')             — 重置天赋树

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8

  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = {} }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.links = packet['links']
      if(var.links == none){ var.links = {} }
      var.linkCount = packet['linkCount']
      if(var.linkCount == none){ var.linkCount = 0 }
      var.needRebuild = true
    update: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = {} }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.links = packet['links']
      if(var.links == none){ var.links = {} }
      var.linkCount = packet['linkCount']
      if(var.linkCount == none){ var.linkCount = 0 }
      var.needRebuild = true
  action:
    # load: 初始化变量 + 视口换算 + 树布局参数
    load: |-
      var.packetId = 'AXS_FISHING_TALENTS'
      var.seasonId = ''
      var.playerLevel = 1
      var.talentPoints = 0
      var.unspentTalentPoints = 0
      var.unlockedTalents = {}
      var.trees = {}
      var.links = {}
      var.linkCount = 0
      var.needRebuild = false
      var.iconDelay = 0
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      // 树布局参数（参考萨满天赋树：紧凑、连线明显）
      var.nodeSize = 96
      var.tierGap = 170
      var.colGap = 120
      var.treeW = 700
      var.treeGap = 0
      var.lineW = 8
      var.rootY = 80
      var.canvasW = 3580
      var.canvasH = 1420
      // 联动节点布局：所有联动天赋排在所有树下方一排
      var.linkY = var.rootY + 4 * var.tierGap + 350 + var.nodeSize + 80
      var.linkStartX = 200
      var.linkSpacing = (var.canvasW - 400) / 7
      var.bus1Rel = -50
      var.bus2Rel = -25
      var.sourceBottomY = var.rootY + 2 * var.tierGap + var.nodeSize
      // 拖拽滚动状态
      var.isDragging = false
      var.dragStartMX = 0
      var.dragStartMY = 0
      var.dragStartSX = 0
      var.dragStartSY = 0
      var.dragMoved = false
      // 缩放状态：整体地图式缩放（尺寸和位置都按 zoomScale 缩放）
      var.zoomScale = 1.0
      var.treeNames = {}
      var.treeNames['steady'] = '&a稳健'
      var.treeNames['swift'] = '&b迅捷'
      var.treeNames['pressure'] = '&c威压'
      var.treeNames['focus'] = '&d专注'
      var.treeNames['lucky'] = '&e幸运'
      var.treeDescs = {}
      var.treeDescs['steady'] = '绿条稳定性与高度'
      var.treeDescs['swift'] = '降低鱼速与活跃度'
      var.treeDescs['pressure'] = '压制鱼逃离行为'
      var.treeDescs['focus'] = '进度获取与维持'
      var.treeDescs['lucky'] = '经验售价与稀有鱼'
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.s = s
    open: |-
      Packet.send(var.packetId, 'refresh_talents')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.s = s
      var.needRebuild = true
    keyPress: |-
      // R 键重置缩放和滚动位置
      if(self.currentKeyPress == 'R' || self.currentKeyPress == 'r'){
        var.zoomScale = 1.0
        val.树横滑块.setDragXRatio(0)
        val.树滑块.setDragYRatio(0)
        var.needRebuild = true
      }
    releaseLeft: |-
      // 兜底：确保拖拽状态在鼠标移出滚动区后释放时也能重置
      var.isDragging = false
    # tick: 数据变化时重建完整天赋网络
    tick: |-
      // 拖拽中：位移超过阈值才滚动（避免点击天赋节点时误触发拖拽）
      if(var.isDragging){
        dx = (Mouse.x() - var.dragStartMX) / var.s
        dy = (Mouse.y() - var.dragStartMY) / var.s
        if(!var.dragMoved){
          if(dx * dx + dy * dy > 25){
            var.dragMoved = true
          }
        }
        if(var.dragMoved){
          scrollRangeX = var.canvasW * var.zoomScale - (var.contentW - 48)
          scrollRangeY = var.canvasH * var.zoomScale - (var.viewH - 236)
          if(scrollRangeX > 0){
            newSX = var.dragStartSX - dx / scrollRangeX
            if(newSX < 0){ newSX = 0 }
            if(newSX > 1){ newSX = 1 }
            val.树横滑块.setDragXRatio(newSX)
          }
          if(scrollRangeY > 0){
            newSY = var.dragStartSY - dy / scrollRangeY
            if(newSY < 0){ newSY = 0 }
            if(newSY > 1){ newSY = 1 }
            val.树滑块.setDragYRatio(newSY)
          }
        }
      }
      if(var.needRebuild){
        var.needRebuild = false
        var.iconDelay = 2
        // z=缩放系数（位置和尺寸都按此缩放）
        z = var.zoomScale
        while(val.树画布.childrenCount() > 3){
          val.树画布.get(3).remove()
        }
        var.treeIds = ['steady', 'swift', 'pressure', 'focus', 'lucky']
        for(ti in range(0, 4)){
          treeIndex = ti.round()
          treeKey = var.treeIds[treeIndex]
          treeData = var.trees[treeKey]
          if(treeData != none){
            treeX = 40 + treeIndex * var.treeW
            titleCtrl = val.树标题模板.copy('树标题_' + treeIndex)
            // 标题x = 中心 - 宽度/2
            titleCtrl.x = ((treeX + var.treeW / 2 - 100) * z).round()
            titleCtrl.y = 0
            titleCtrl.treeId = treeKey
            titleCtrl.visible = true
            nodes = treeData['nodes']
            nodeCount = treeData['nodeCount']
            if(nodeCount == none){ nodeCount = 0 }
            for(i in range(0, nodeCount - 1)){
              key = i.round()
              entry = nodes[key]
              if(entry != none){
                node = val.天赋节点模板.copy('节点_' + treeIndex + '_' + key)
                node.entryKey = key
                node.treeId = treeKey
                node.isLink = false
                tier = type.toNumber(entry['tier']).round()
                branch = entry['branch']
                colOff = 0
                if(tier == 2 || tier == 3){
                  colOff = branch == 'a' ? -var.colGap : var.colGap
                }
                if(tier == 4 || tier == 5){
                  if(branch == 'a'){ colOff = -1.5 * var.colGap }
                  if(branch == 'b'){ colOff = -0.5 * var.colGap }
                  if(branch == 'c'){ colOff = 0.5 * var.colGap }
                  if(branch == 'd'){ colOff = 1.5 * var.colGap }
                }
                nodeY = var.rootY + (tier - 1) * var.tierGap
                if(tier >= 4){ nodeY = nodeY + 350 }
                node.x = ((treeX + var.treeW / 2 + colOff - var.nodeSize / 2) * z).round()
                node.y = (nodeY * z).round()
                node.width = (var.nodeSize * z).round()
                node.height = (var.nodeSize * z).round()
                if(tier > 1){
                  parentOff = 0
                  if(tier == 3){ parentOff = colOff }
                  if(tier == 4){
                    parentOff = branch == 'a' || branch == 'b' ? -var.colGap : var.colGap
                  }
                  if(tier == 5){ parentOff = colOff }
                  parentY = tier == 4 ? var.rootY + 2 * var.tierGap : nodeY - var.tierGap
                  gap = nodeY - parentY
                  delta = parentOff - colOff
                  if(delta == 0){
                    lineV = node['连线竖直']
                    lineV.x = ((var.nodeSize / 2 - var.lineW / 2) * z).round()
                    lineV.y = ((-gap + var.nodeSize) * z).round()
                    lineV.width = (var.lineW * z).round()
                    lineV.height = ((gap - var.nodeSize) * z).round()
                    lineV.visible = true
                  } else {
                    lineLV = node['连线L竖']
                    lineLH = node['连线L横']
                    lineLP = node['连线L父竖']
                    topRel = -gap + var.nodeSize
                    routeRel = (topRel / 2).round()
                    lineLV.x = ((var.nodeSize / 2 - var.lineW / 2) * z).round()
                    lineLV.y = (routeRel * z).round()
                    lineLV.width = (var.lineW * z).round()
                    lineLV.height = ((-routeRel) * z).round()
                    lineLV.visible = true
                    lineLH.y = ((routeRel - var.lineW / 2) * z).round()
                    lineLH.height = (var.lineW * z).round()
                    if(delta < 0){
                      lineLH.x = ((var.nodeSize / 2 + delta) * z).round()
                      lineLH.width = ((-delta) * z).round()
                    } else {
                      lineLH.x = ((var.nodeSize / 2) * z).round()
                      lineLH.width = (delta * z).round()
                    }
                    lineLH.visible = true
                    lineLP.x = ((var.nodeSize / 2 + delta - var.lineW / 2) * z).round()
                    lineLP.y = (topRel * z).round()
                    lineLP.width = (var.lineW * z).round()
                    lineLP.height = ((routeRel - topRel) * z).round()
                    lineLP.visible = true
                  }
                }
              }
            }
          }
        }
        for(i in range(0, var.linkCount - 1)){
          key = i.round()
          entry = var.links[key]
          if(entry != none){
            node = val.天赋节点模板.copy('联动_' + key)
            node.entryKey = key
            node.treeId = 'link'
            node.isLink = true
            prereq1 = entry['prerequisites'][0]
            prereq2 = entry['prerequisites'][1]
            parts1 = prereq1.split('-')
            parts2 = prereq2.split('-')
            tree1 = parts1[0]
            tree2 = parts2[0]
            node.linkTree1 = tree1
            node.linkTree2 = tree2
            treeIndex1 = tree1 == 'steady' ? 0 : (tree1 == 'swift' ? 1 : (tree1 == 'pressure' ? 2 : (tree1 == 'focus' ? 3 : 4)))
            treeIndex2 = tree2 == 'steady' ? 0 : (tree2 == 'swift' ? 1 : (tree2 == 'pressure' ? 2 : (tree2 == 'focus' ? 3 : 4)))
            branch1 = parts1[1].substring(2)
            branch2 = parts2[1].substring(2)
            sourceX1 = 40 + treeIndex1 * var.treeW + var.treeW / 2 + (branch1 == 'a' ? -var.colGap : var.colGap)
            sourceX2 = 40 + treeIndex2 * var.treeW + var.treeW / 2 + (branch2 == 'a' ? -var.colGap : var.colGap)
            // 所有联动节点均匀排列在所有树下方一排
            linkCenter = var.linkStartX + key * var.linkSpacing
            nodeBaseX = linkCenter - var.nodeSize / 2
            node.x = (nodeBaseX * z).round()
            node.y = (var.linkY * z).round()
            node.width = (var.nodeSize * z).round()
            node.height = (var.nodeSize * z).round()
            // 连线：源节点底部 → 垂直下降穿过 T4/T5 间隙 → bus 汇线 → 水平 → 垂直接入联动节点
            sourceRel1 = ((sourceX1 - nodeBaseX) * z).round()
            sourceRel2 = ((sourceX2 - nodeBaseX) * z).round()
            targetRel1 = ((var.nodeSize / 2 - 10) * z).round()
            targetRel2 = ((var.nodeSize / 2 + 10) * z).round()
            sourceBottomRel = ((var.sourceBottomY - var.linkY) * z).round()
            bus1RelZ = (var.bus1Rel * z).round()
            bus2RelZ = (var.bus2Rel * z).round()
            p1v = node['联动1竖']
            p1h = node['联动1横']
            p1in = node['联动入竖']
            p2v = node['联动2竖']
            p2h = node['联动2横']
            p2in = node['联动2入竖']
            // 路径1：源1 → bus1 → 联动节点左侧
            p1v.x = (sourceRel1 - var.lineW * z / 2).round()
            p1v.y = sourceBottomRel
            p1v.width = (var.lineW * z).round()
            p1v.height = (bus1RelZ - sourceBottomRel).round()
            p1v.visible = true
            p1h.x = (sourceRel1 < targetRel1 ? sourceRel1 : targetRel1).round()
            p1h.y = (bus1RelZ - var.lineW * z / 2).round()
            p1h.width = (sourceRel1 < targetRel1 ? targetRel1 - sourceRel1 : sourceRel1 - targetRel1).round()
            p1h.height = (var.lineW * z).round()
            p1h.visible = true
            p1in.x = (targetRel1 - var.lineW * z / 2).round()
            p1in.y = bus1RelZ
            p1in.width = (var.lineW * z).round()
            p1in.height = (-bus1RelZ).round()
            p1in.visible = true
            // 路径2：源2 → bus2 → 联动节点右侧
            p2v.x = (sourceRel2 - var.lineW * z / 2).round()
            p2v.y = sourceBottomRel
            p2v.width = (var.lineW * z).round()
            p2v.height = (bus2RelZ - sourceBottomRel).round()
            p2v.visible = true
            p2h.x = (sourceRel2 < targetRel2 ? sourceRel2 : targetRel2).round()
            p2h.y = (bus2RelZ - var.lineW * z / 2).round()
            p2h.width = (sourceRel2 < targetRel2 ? targetRel2 - sourceRel2 : sourceRel2 - targetRel2).round()
            p2h.height = (var.lineW * z).round()
            p2h.visible = true
            p2in.x = (targetRel2 - var.lineW * z / 2).round()
            p2in.y = bus2RelZ
            p2in.width = (var.lineW * z).round()
            p2in.height = (-bus2RelZ).round()
            p2in.visible = true
          }
        }
      }
      if(var.iconDelay > 0){
        var.iconDelay = var.iconDelay - 1
        if(var.iconDelay == 0){
          for(ci in range(3, val.树画布.childrenCount() - 1)){
            ctrl = val.树画布.get(ci.round())
            if(ctrl != none && ctrl.entry != none && ctrl['节点图标'] != none){
              ctrl['节点图标'].setItemIcon(ctrl.entry['iconJson'])
            }
          }
        }
      }

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;12,22,38,110
  # 自适配布局：宽高 = 设计分辨率 1920x1080
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~80,200,220,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~50,170,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f钓鱼"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 168
              width: 1
              height: 30
              normal: ~80,200,220,230
          页名:
            type: Text
            attribute:
              point: ~middle_left
              x: 188
              texts: "~&f天赋树"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 40
                  texts: "~&f✕"
                  fontSize: 32
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~80,200,220,240
          导航总览:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_main')
            children:
              总览底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              总览文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f总览"
                  fontSize: 36
                  through: true
          导航图鉴:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_collection')
            children:
              图鉴底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              图鉴文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f图鉴"
                  fontSize: 36
                  through: true
          导航奖励:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_rewards')
            children:
              奖励底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              奖励文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f奖励"
                  fontSize: 36
                  through: true
          导航天赋:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
            children:
              天赋底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~50,170,200,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~50,170,200,230
              天赋高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~50,170,200,255
                  shape: ~round_rect
                  radius: 2
              天赋文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0天赋"
                  fontSize: 36
          导航任务:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 282
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_tasks')
            children:
              任务底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              任务文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f任务"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 364
              width: 264
              height: 2
              normal: ~80,200,220,220
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -84
              texts: "~&fESC 关闭界面"
              fontSize: 28
          重置天赋按钮:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 14
              y: -18
              width: 272
              height: 52
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'reset_talents')
            children:
              重置底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              重置文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 272
                  texts: "~&f↻ 重置天赋树"
                  fontSize: 30
                  through: true

      # ── 内容区（天赋树画布）──────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~80,200,220,240

          # 天赋点信息栏
          信息栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 16
              width: "var.contentW - 48"
              height: 48
            children:
              信息背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 2
                    color: ~80,200,220,230
              信息文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 20
                  width: 800
                  texts: "'&f天赋树 &7| &a可用: &f' + var.unspentTalentPoints.round() + ' &7/ &f' + var.talentPoints.round() + '  &7| &f等级: &e' + var.playerLevel.round() + '  &7| &b缩放: &f' + (var.zoomScale * 100).round() + '% &7[&fR重置&7]'"
                  fontSize: 26
              重置按钮:
                type: Canvas
                attribute:
                  point: ~middle_right
                  x: -12
                  width: 120
                  height: 34
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'reset_talents')
                children:
                  重置按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~80,30,30,200
                      hover: ~180,50,50,230
                      shape: ~round_rect
                      radius: 8
                    effect:
                      stroke:
                        width: 2
                        color: ~200,80,80,160
                  重置按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 120
                      texts: "~&f↻ 重置"
                      fontSize: 30
                      through: true

          # 滚动区：五系与联动节点常驻显示（拖拽滚动 + 滚轮缩放）
          滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 76
              width: "var.contentW - 48"
              height: "var.viewH - 236"
              moveX: "self.parent['树横滑块'].getDragXRatio()"
              moveY: "self.parent['树滑块'].getDragYRatio()"
            action:
              clickLeft: |-
                var.isDragging = true
                var.dragStartMX = Mouse.x()
                var.dragStartMY = Mouse.y()
                var.dragStartSX = val.树横滑块.getDragXRatio()
                var.dragStartSY = val.树滑块.getDragYRatio()
                var.dragMoved = false
              releaseLeft: |-
                var.isDragging = false
              wheel: |-
                // 滚轮缩放：wheelValue > 0 放大，< 0 缩小
                oldZoom = var.zoomScale
                delta = self.wheelValue > 0 ? 0.1 : -0.1
                newZoom = oldZoom + delta
                if(newZoom < 0.5){ newZoom = 0.5 }
                if(newZoom > 2.0){ newZoom = 2.0 }
                if(newZoom != oldZoom){
                  // 保持滚动位置：通过滑块 ratio 换算
                  viewW = var.contentW - 48
                  viewH = var.viewH - 236
                  oldRangeX = var.canvasW * oldZoom - viewW
                  newRangeX = var.canvasW * newZoom - viewW
                  oldRangeY = var.canvasH * oldZoom - viewH
                  newRangeY = var.canvasH * newZoom - viewH
                  oldSX = val.树横滑块.getDragXRatio()
                  oldSY = val.树滑块.getDragYRatio()
                  if(newRangeX > 0){
                    newSX = oldRangeX > 0 ? oldSX * oldRangeX / newRangeX : 0
                    if(newSX < 0){ newSX = 0 }
                    if(newSX > 1){ newSX = 1 }
                  } else {
                    newSX = 0
                  }
                  if(newRangeY > 0){
                    newSY = oldRangeY > 0 ? oldSY * oldRangeY / newRangeY : 0
                    if(newSY < 0){ newSY = 0 }
                    if(newSY > 1){ newSY = 1 }
                  } else {
                    newSY = 0
                  }
                  var.zoomScale = newZoom
                  var.needRebuild = true
                  // 重建后设置滑块位置
                  val.树横滑块.setDragXRatio(newSX)
                  val.树滑块.setDragYRatio(newSY)
                }
            children:
              树画布:
                val: 树画布
                type: Canvas
                attribute:
                  width: "var.canvasW * var.zoomScale"
                  height: "var.canvasH * var.zoomScale"
                children:
                  # 树标题模板
                  树标题模板:
                    type: Canvas
                    val: 树标题模板
                    attribute:
                      width: "(200 * var.zoomScale).round()"
                      height: "(40 * var.zoomScale).round()"
                      treeId: 'steady'
                      visible: false
                    children:
                      树标题文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: "(200 * var.zoomScale).round()"
                          texts: "var.treeNames[self.parent.treeId] != none ? var.treeNames[self.parent.treeId] : '&7未知'"
                          fontSize: "(34 * var.zoomScale).round()"
                          through: true
                  # 联动标题模板
                  联动标题模板:
                    type: Canvas
                    val: 联动标题模板
                    attribute:
                      width: 260
                      height: 28
                      visible: false
                    children:
                      联动标题文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 0
                          width: 260
                          texts: "~&6◆ 跨树联动天赋"
                          fontSize: 30
                          through: true
                  # 天赋节点模板（正方形 Slot + 连线 + Tooltip）
                  # tick 中 copy 后设置 entryKey/treeId/treeX/isLink
                  天赋节点模板:
                    type: Canvas
                    val: 天赋节点模板
                    attribute:
                      point: ~top_left
                      entryKey: 0.round()
                      treeId: 'steady'
                      isLink: false
                      entry: "self.isLink == true ? var.links[self.entryKey] : (var.trees[self.treeId] != none ? var.trees[self.treeId]['nodes'][self.entryKey] : none)"
                      visible: "self.entry != none"
                      width: "var.nodeSize * var.zoomScale"
                      height: "var.nodeSize * var.zoomScale"
                      brightColor: "self.treeId == 'steady' ? '72,238,112,255' : (self.treeId == 'swift' ? '48,208,248,255' : (self.treeId == 'pressure' ? '248,70,70,255' : (self.treeId == 'focus' ? '212,86,248,255' : (self.treeId == 'lucky' ? '252,198,42,255' : '255,128,42,255'))))"
                      dimColor: "self.treeId == 'steady' ? '48,156,82,255' : (self.treeId == 'swift' ? '34,138,170,255' : (self.treeId == 'pressure' ? '172,48,48,255' : (self.treeId == 'focus' ? '144,54,180,255' : (self.treeId == 'lucky' ? '180,138,30,255' : '190,76,30,255'))))"
                      lineColor: "self.entry != none && self.entry['unlocked'] == true ? self.brightColor : self.dimColor"
                      linkTree1: 'steady'
                      linkTree2: 'steady'
                      linkBright1: "self.linkTree1 == 'steady' ? '82,255,128,255' : (self.linkTree1 == 'swift' ? '60,220,255,255' : (self.linkTree1 == 'pressure' ? '255,78,78,255' : (self.linkTree1 == 'focus' ? '218,95,255,255' : '255,210,55,255')))"
                      linkBright2: "self.linkTree2 == 'steady' ? '82,255,128,255' : (self.linkTree2 == 'swift' ? '60,220,255,255' : (self.linkTree2 == 'pressure' ? '255,78,78,255' : (self.linkTree2 == 'focus' ? '218,95,255,255' : '255,210,55,255')))"
                      linkDim1: "self.linkTree1 == 'steady' ? '48,165,82,255' : (self.linkTree1 == 'swift' ? '38,145,178,255' : (self.linkTree1 == 'pressure' ? '178,48,48,255' : (self.linkTree1 == 'focus' ? '142,58,178,255' : '184,142,34,255')))"
                      linkDim2: "self.linkTree2 == 'steady' ? '48,165,82,255' : (self.linkTree2 == 'swift' ? '38,145,178,255' : (self.linkTree2 == 'pressure' ? '178,48,48,255' : (self.linkTree2 == 'focus' ? '142,58,178,255' : '184,142,34,255')))"
                      linkColor1: "self.entry != none && self.entry['prerequisiteStates'] != none && self.entry['prerequisiteStates'][0] == true ? self.linkBright1 : self.linkDim1"
                      linkColor2: "self.entry != none && self.entry['prerequisiteStates'] != none && self.entry['prerequisiteStates'][1] == true ? self.linkBright2 : self.linkDim2"
                      # 节点等级状态：0=未点亮, 1~maxLevel-1=部分升级, maxLevel=满级
                      nodeLevel: "self.entry != none && self.entry['level'] != none ? type.toNumber(self.entry['level']).round() : 0"
                      nodeMaxLevel: "self.entry != none && self.entry['maxLevel'] != none ? type.toNumber(self.entry['maxLevel']).round() : 1"
                      isMaxed: "self.nodeLevel >= self.nodeMaxLevel"
                    action:
                      clickLeft: |-
                        if(self.entry != none){
                          if(self.entry['canLevelUp'] == true){
                            Packet.send(var.packetId, 'level_up_talent', self.entry['id'])
                          }
                        }
                    children:
                      # 连线：竖直段（从本节点向上指向父节点）
                      # T3/T5 同列节点用竖直线；T2/T4 分叉节点用 L 形
                      连线竖直:
                        type: Texture
                        attribute:
                          x: 22
                          y: -42
                          width: 3
                          height: 42
                          normal: "self.parent.lineColor"
                          visible: false
                          through: true
                      # L形连线：竖直段（上半）
                      连线L竖:
                        type: Texture
                        attribute:
                          x: 22
                          y: -42
                          width: 3
                          height: 21
                          normal: "self.parent.lineColor"
                          visible: false
                          through: true
                      # L形连线：水平段（下半，向左或向右）
                      连线L横:
                        type: Texture
                        attribute:
                          x: 0
                          y: -24
                          width: 80
                          height: 3
                          normal: "self.parent.lineColor"
                          visible: false
                          through: true
                      连线L父竖:
                        type: Texture
                        attribute:
                          x: 0
                          y: -24
                          width: 3
                          height: 24
                          normal: "self.parent.lineColor"
                          visible: false
                          through: true
                      # 联动节点双前置路径：两条来源线分别标记两个前置天赋
                      联动1竖:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor1"
                          visible: false
                          through: true
                      联动1横:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor1"
                          visible: false
                          through: true
                      联动2竖:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor2"
                          visible: false
                          through: true
                      联动2横:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor2"
                          visible: false
                          through: true
                      联动入竖:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor1"
                          visible: false
                          through: true
                      联动2入竖:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor2"
                          visible: false
                          through: true
                      # 节点图标（Slot 显示物品 icon）
                      节点图标:
                        type: Slot
                        attribute:
                          point: ~middle_center
                          width: "88 * var.zoomScale"
                          height: "88 * var.zoomScale"
                          slotType: ~Icon
                          itemScale: 0.75
                          normal: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? '24,30,38,255' : '16,20,28,255'"
                          shape: ~round_rect
                          radius: "(12 * var.zoomScale).round()"
                          seticon: "self.setItemIcon(self.parent.entry != none ? self.parent.entry['iconJson'] : var.emptyItemJson)"
                        effect:
                          stroke:
                            width: "(self.parent.entry != none && self.parent.entry['unlocked'] == true ? 6 : 4) * var.zoomScale"
                            color: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? self.parent.brightColor : self.parent.dimColor"
                          neon:
                            color: "self.parent.brightColor"
                            size: "(6 * var.zoomScale).round()"
                            intensity: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? 1 : 0"
                            animated: false
                        action:
                          clickLeft: |-
                            if(self.parent.entry != none){
                              if(self.parent.entry['canLevelUp'] == true){
                                Packet.send(var.packetId, 'level_up_talent', self.parent.entry['id'])
                              }
                            }
                      # 等级标签（右下角显示 当前等级/最大等级）
                      等级标签:
                        type: Canvas
                        attribute:
                          point: ~bottom_right
                          x: "(-2 * var.zoomScale).round()"
                          y: "(-2 * var.zoomScale).round()"
                          width: "(36 * var.zoomScale).round()"
                          height: "(20 * var.zoomScale).round()"
                          visible: "self.parent.entry != none && self.parent.entry['unlocked'] == true && self.parent.nodeMaxLevel > 1"
                        children:
                          等级标签底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.parent.isMaxed ? '40,80,40,220' : '20,30,45,220'"
                              shape: ~round_rect
                              radius: "(4 * var.zoomScale).round()"
                          等级文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: "(36 * var.zoomScale).round()"
                              texts: "self.parent.parent.nodeLevel + '/' + self.parent.parent.nodeMaxLevel"
                              fontSize: "(18 * var.zoomScale).round()"
                              through: true
          # 操作提示（拖拽滚动 + 滚轮缩放）
          操作提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 24
              y: -8
              texts: "'&7拖拽滚动 &f| &7滚轮缩放 &f| &7R重置'"
              fontSize: 20
              shadow: true
          # 隐藏滑块：驱动 Scroll 的 moveX/moveY（不显示，仅用于程序化控制滚动位置）
          树滑块:
            type: Texture
            val: 树滑块
            attribute:
              visible: false
              width: 12
              height: 120
              normal: ~50,170,200,220
              maxDragY: "var.canvasH * var.zoomScale - (var.viewH - 236)"
          树横滑块:
            type: Texture
            val: 树横滑块
            attribute:
              visible: false
              width: 160
              height: 12
              normal: ~50,170,200,220
              maxDragX: "var.canvasW * var.zoomScale - (var.contentW - 48)"
