                  point: ~bottom_left
                  x: 60
                  y: -24
                  width: 170
                  height: 48
                  enable: "!var.actionBusy && !var.formLoading && var.actionToken != ''"
                action:
                  clickLeft: |-
                    if(var.confirmTarget == 'discard'){
                      var.dirty = false
                      var.pendingNavigation()
                    } else if(var.confirmTarget == 'stock'){
                      Packet.send(var.packetId, 'shop_edit_stock', var.editShopId, var.editItemKey, var.stockAction, var.stockAmountArg, var.stockTarget, var.actionToken, var.shopRevision)
                    } else if(var.confirmTarget == 'save-stock'){
                      Packet.send(var.packetId, 'shop_edit_item_save', var.pendingSaveShop, var.pendingSaveNew, var.pendingSaveJson, var.actionToken)
                    } else if(var.confirmTarget == 'shop'){
                      Packet.send(var.packetId, 'shop_edit_shop_delete', var.editShopId, var.actionToken, var.shopRevision)
                    } else if(var.confirmTarget == 'item'){
                      Packet.send(var.packetId, 'shop_edit_item_delete', var.editShopId, var.confirmKey, var.actionToken, var.shopRevision)
                    }
                    var.showConfirm = false
                    if(var.confirmTarget != 'discard'){ var.actionBusy = true }
                children:
