                  height: var.viewH - 432
                  moveY: val.信笺滑块.getDragYRatio()
                action:
                  wheel: |-
                    ratio = self.moveY - self.wheelValue * 0.1
                    ratio = ratio < 0 ? 0 : ratio
                    ratio = ratio > 1 ? 1 : ratio
                    val.信笺滑块.setDragYRatio(ratio)
