                      point: ~top_left
                      x: 20
                      y: 16
                      texts: "~&f保底进度"
                      fontSize: 36
                      through: true
                  # ── 5星保底进度条 ────────────────────────────────
                  星5标签:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 20
                      y: 72
                      texts: "~&65星保底"
                      fontSize: 36
                      through: true
                  星5进度条底:
                    type: Texture
                    attribute:
                      point: ~top_left
