# AXS 资源说明
# 用途: Conversation 电影序列 HUD — 克制的墨黑画幅，中央世界完全透出。
# 画幅约占上下各 10.5%，使用实际视口贴边，超宽屏不留侧缝。
# 前置依赖: ArcartX；Conversation 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.conversation.enabled
# 关联文件: ArcartXConversation.yml
# 重载命令: /axs conversation reload
# 服务端 sync 字段:
#   visible (boolean)
# 客户端回包: 无
ui:
  isHud: true
  defaultOpen: false
  through: true
  show: true
  screenScale: true
  level: 50
  # 电影序列播放时隐藏其他 HUD，营造沉浸感
  # 原版 HUD 填名称，ArcartX 自定义 HUD 填 UI ID（需带 AXS: 前缀）
  # 保留 title_text 供序列中 title 动作使用
  # 请根据本服务器实际安装的模块，在下方自行添加/删除需要隐藏的 ArcartX HUD ID
  hide:
    # ── 原版 HUD（固定，无需修改）──
    - vignette
    - spyglass
    - helmet
    - frostbite
    - portal
    - hotbar
    - crosshair
    - boss_event_progress
    - player_health
    - armor_level
    - food_level
    - air_level
    - mount_health
    - jump_bar
    - experience_bar
    - item_name
    - sleep_fade
    - potion_icons
    - debug_text
    - fps_graph
    - record_overlay
    - scoreboard
    - chat_panel
    - player_list
    - recipe_toast
    - system_toast
    - advancement_toast
    - tutorial_toast
    # ── ArcartX 自定义 HUD（请根据本服实际情况添加，需带 AXS: 前缀）──
    # - AXS:announcer_hud
    # - AXS:pickup_hud
    # - AXS:boss_tracker
  packetHandler:
    # packetHandler: sync
    # 包字段:
    #   - visible: 是否显示黑边（true=播放电影序列，false=隐藏）
    sync: |-
      var.letterboxVisible = packet['visible']
  action:
    load: |-
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.matteH = var.viewH * 0.105
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
      through: true
    children:
      上黑边:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          y: 0
          width: "var.viewW"
          height: "var.matteH"
          visible: var.letterboxVisible == true
          through: true
        children:
          上幕底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~7,7,6,255
              through: true
          上幕内沿:
            type: Texture
            attribute:
              point: ~bottom_center
              width: "var.viewW"
              height: 1
              normal: ~45,40,30,255
              through: true
          上幕画幅标:
            type: Texture
            attribute:
              point: ~bottom_left
              x: 64
              y: -16
              width: 64
              height: 2
              normal: ~132,112,78,228
              through: true
      下黑边:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          y: "var.viewH - var.matteH"
          width: "var.viewW"
          height: "var.matteH"
          visible: var.letterboxVisible == true
          through: true
        children:
          下幕底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~7,7,6,255
              through: true
          下幕内沿:
            type: Texture
            attribute:
              point: ~top_center
              width: "var.viewW"
              height: 1
              normal: ~45,40,30,255
              through: true
          下幕画幅标:
            type: Texture
            attribute:
              point: ~top_right
              x: -64
              y: 16
              width: 64
              height: 2
              normal: ~132,112,78,228
              through: true
