# 文件用途: 常规武器箱卡池数据定义。
# 定义 CS 开箱风格武器箱的消耗、稀有度权重和武器皮肤物品池。
# 类型为 CASE（CS 开箱），使用钥匙开启，包含7个稀有度等级。

id: "default_weapon_case"  # 卡池唯一标识
type: CASE  # 卡池类型：CASE（CS 开箱）
enabled: true  # 是否启用
display-name: "常规武器箱"  # 显示名称
description: |-  # 卡池描述文本
  常规武器箱
  使用武器箱钥匙开启，可获得各种稀有度的武器皮肤。
  包含从消费级到隐秘级的多款皮肤，更有罕见特殊级掉落！
# UP 物品图标
up-item-icon:
  material: CHEST
  name: "常规武器箱"
# 未配置 up-item-icon 时自动使用 UP 5星奖品（CASE 池为最高稀有度奖品）的物品作为图标；up-item-icon 配置可以省略。
# 奖品未配置 icon 时使用该奖品 item 生成的物品作为图标。
# 图标配置分为物品库物品与自定义物品，两种写法二选一。
# up-item-icon:
  #############################################################
  # --- 物品库物品：source + id（与下方 material 写法二选一） ---
  # -------------------------------
  # source: "mythicmobs"                         # 物品库来源
  # id: "ITEM_ID"                     # 物品库物品 ID
  ############################################################
  # --- MMOItems 物品：source + mmo-type + mmo-id ---
  # -------------------------------
  # source: "mmoitems"
  # mmo-type: "ARMOR"                         # MMOItems 类型
  # mmo-id: "LOTTO_STAR_HELMET"               # MMOItems 物品 ID
  ############################################################
  # --- 自定义物品：material 及其它字段 ---
  # material: CHEST                      # Minecraft 材质
  # amount: 1                                  # 图标数量
  # name: "常规武器箱"                               # 图标名称
  # lore:                                      # 图标 Lore
  #   - "&7自定义图标说明"                      # Lore 文本
  # custom-model-data: 0                       # 自定义模型数据
  # glow: true                                 # 是否显示附魔光效
  # skull-texture: "base64..."                 # 玩家头颅纹理
  # color: "#FF5555"                           # 可染色材质的颜色
  #
  # --- nbt写法二选一 ---
  # nbt:                                       # 图标 NBT 键值映射写法，与下方整段 SNBT 写法二选一
  #   CustomTag: "value"                       # 图标 NBT 键值
  # 或者
  # nbt: "{CustomTag:'value',Unbreakable:1b}"  # 图标 NBT 整段 SNBT 写法，与上方键值映射二选一
  #
  # ---ArcartX 读取物品的 icon / url NBT 来渲染自定义贴图（详见ArcartX wiki：自定义物品贴图）---
  # texture: "item"                            # 写入 icon NBT，渲染 resource/item_icon/ 下的贴图（手持 / AX-UI）；子目录用 "xxx/xxx"
  # texture-url: "menu/icon.png"               # 写入 url NBT，仅用于原版 GUI(箱子菜单)图标，支持文件路径 / 网络链接 / GIF
  ############################################################
  # --- 直接发送 json/NBT 给 slot 控件（完全自定义物品） ---
  # json: '{"id":"minecraft:diamond","Count":1b}'  # 完整物品 JSON；配置后不再叠加其它字段或 texture/texture-url/nbt
  ####################################################################################################################

# 箱子物品定义：玩家手持此物品右键即可打开开箱 UI，开箱时消耗对应数量。
# matcher 用于识别玩家手持的箱子物品（字段同 cost.matcher）。
# amount 为单次开箱消耗的箱子数量（十连按倍数扣除）。
case-item:
  matcher:
    material-ids:
      - CHEST
    nbt-values:
      lottery: "case_box"
  amount: 1
  display-name: "常规武器箱"
  icon:
    material: CHEST
    name: "常规武器箱"

# 是否需要钥匙开启：true=有锁（消耗箱子+钥匙），false=无锁（仅消耗箱子）
requires-key: true

# 钥匙消耗配置（仅在 requires-key: true 时生效）：
# single=单抽消耗条目列表，ten=十连消耗条目列表（十连不做倍数换算，未配置则不提供十连）。
cost:
  single:
    - type: ITEM              # 资源类型：ITEM（物品，需 matcher 匹配背包物品，禁止填 id）
      amount: 1               # 扣除数量（正整数）
      display-name: "CaseKey" # UI 显示名称
      icon:                   # 消耗图标（写法同 up-item-icon，此处用自定义物品）
        material: TRIPWIRE_HOOK
        name: "CaseKey"
      # 物品匹配器：识别背包中哪些物品算作本消耗条目。所有字段可选，留空表示不校验该维度；
      # 多个维度之间为 AND（同时满足才匹配）。完整字段（未用到的可省略）：
      #   material-ids       — 原版材质 ID 列表（如 TRIPWIRE_HOOK）
      #   mythic-item-ids    — MythicMobs 物品内部 ID 列表
      #   neige-item-ids     — NeigeItems 物品内部 ID 列表
      #   overture-item-ids  — Overture 物品内部 ID 列表
      #   name-contains      — 显示名称包含的文本列表（自动去除颜色码后匹配）
      #   lore-contains      — Lore 包含的文本列表（自动去除颜色码后匹配）
      #   nbt-keys           — 必须存在的 NBT 键列表（只校验键存在，不校验值）
      #   nbt-values         — NBT 键=值 映射（键和值都会标准化为小写）
      #   name-regex         — 显示名称正则列表（大小写不敏感，无效正则记录警告并跳过）
      #   lore-regex         — Lore 正则列表（大小写不敏感，无效正则记录警告并跳过）
      matcher:                # 物品匹配器（仅 ITEM 类型需要）
        material-ids:         # 匹配材质为 TRIPWIRE_HOOK 的物品
          - TRIPWIRE_HOOK
        nbt-values:           # NBT 键值校验
          lottery: "case_key"
  ten:
    - type: ITEM              # 资源类型：ITEM（同 single）
      amount: 10              # 扣除数量（十连为 10）
      display-name: "CaseKey" # UI 显示名称
      icon:                   # 消耗图标（同 single）
        material: TRIPWIRE_HOOK
        name: "CaseKey"
      matcher:                # 物品匹配器（字段同 single.matcher）
        material-ids:
          - TRIPWIRE_HOOK
        nbt-values:
          lottery: "case_key"

points:
  dust:
    display-name: "尘辉"
    icon:
      material: QUARTZ
      name: "尘辉"
    per-pull: 1
    rarity:
      COMMON: 1
      RARE: 2
      EPIC: 4

case:  # 开箱机制参数
  rarity-settings:  # 稀有度权重配置（base-weight 越大越常见）
    COMMON:  # 普通（灰色）
      color: "&f"  # 显示颜色代码
      base-weight: 15625  # 基础权重
    UNCOMMON:  # 不凡（浅蓝灰）
      color: "&b"
      base-weight: 3125
    RARE:  # 稀有（蓝色）
      color: "&9"
      base-weight: 625
