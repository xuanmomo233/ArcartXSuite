config-version: 4
# AXS Pickup
# 作用: 拾取提示 HUD（通知模式）或掉落物交互拾取面板（扫描模式）。
# 依赖: ArcartX。
# 重载: /axs pickup reload
# PAPI 输出: 无独立 PlaceholderAPI 输出。
# 可解析的 PAPI: 无；提示内容来自拾取事件和 ItemStack 序列化。
# 关联资源: ui/pickup/pickup_hud.yml, arcartx/ui/loot_panel.yml

settings:
  # 是否输出调试日志
  debug: false

  # 工作模式:
  #   notification - 通知模式（拾取时弹出 HUD 提示，不拦截拾取）
  #   scanner      - 扫描模式（禁用自动拾取，面板展示附近掉落物，按键交互拾取）
  mode: notification

# ========== UI 配置（统一管理所有 UI ID 与注册行为）==========
ui:
  # 通知模式目标 HUD 的 UI ID
  notification-ui-id: "AXS:pickup_hud"
  # 扫描模式目标 HUD 的 UI ID
  scanner-ui-id: "AXS:loot_panel"
  # 可选详细面板的 UI ID（只在按详情键时打开，普通收取不打开菜单）
  interact-ui-id: "AXS:loot_interact"
  # 插件启动/重载时是否自动注册 UI
  register-ui-on-enable: true
  # 是否强制覆盖 ui 文件（notification 的 pickup_hud.yml 按配置动态生成；scanner 的 loot_panel.yml / loot_interact.yml 按资源导出）
  overwrite-ui-files: false

# ========== 通知模式配置（mode: notification）==========
notification:
  # 同时最多显示多少条最近拾取提示
  max-visible: 4
  # 每条提示在 HUD 上存活多久（毫秒）
  entry-ttl-ms: 3000

# ========== 扫描模式配置（mode: scanner）==========
scanner:
  # 扫描附近掉落物的半径（格）
  scan-radius: 5.0
  # 扫描间隔（ticks，5 = 250ms）
  scan-interval-ticks: 5
  # HUD 每页显示的行数（1~16）；不限制实际清单长度，切换选择会自动翻页
  display-rows: 5
  # 一次扫描最多纳入的可拾取实体；达到上限时界面会提示，收取后再扫描
  max-candidates: 512
  # 是否禁用自动拾取（玩家靠近掉落物时不会自动吸入背包）
  disable-auto-pickup: true
  # 拾取后是否尝试存入仓库（需要 warehouse 模块启用并配置自动入库）
  warehouse-auto-deposit: false
  # 实体生成后至少存活多少 tick 才显示；同时要求原版拾取冷却结束且归属允许
  pickup-delay-ticks: 40
  # 完整物品信息一致时合并显示；单击会逐个尝试拾取该组实体，未能拾取的留在地面
  merge-same-items: true
  # 拾取按键绑定：声明扫描模式订阅的客户端按键 ID。
  # 默认使用 AXS_PICKUP_PICK；name 直接收取当前类，其余键切换、批量收取或打开详情。
  # 五个 ID 必须不同，且在宿主 config.yml 的 keybinds 节注册。
  keybind:
    name: AXS_PICKUP_PICK
    previous: AXS_PICKUP_PREVIOUS
    next: AXS_PICKUP_NEXT
    collect-all: AXS_PICKUP_ALL
    details: AXS_PICKUP_DETAILS
  # 当前类收取和全部收取都按固定快照分批执行，不持续吸取新增掉落物
  batch:
    enabled: true             # 是否允许“收取全部”；不影响单类收取
    mode: all                 # all：全部通过过滤的物品；matching：只收取下方匹配规则命中的物品
    matcher:                  # matching 模式留空时不收取任何物品；规则写法同通用物品匹配器
      material-ids: []         # 例如 [IRON_INGOT, GOLD_INGOT]，不要填中文物品名
    entities-per-tick: 8       # 全模块每 tick 最多处理的实体数，多个玩家轮流执行
    time-budget-ms: 4          # 每 tick 的软时间预算；单次仓库调用无法中途打断
    chat-summary: false        # 默认只在 HUD 汇总；开启后聊天栏也发送一次汇总

# ========== 过滤系统（仅 scanner 模式生效）==========
filter:
  # 过滤模式:
  #   blacklist - 黑名单内的物品不显示
  #   whitelist - 只显示白名单内的物品
  mode: blacklist
  # 材质黑名单（mode=blacklist 时，匹配到的掉落物不在面板中显示）
  material-blacklist:
    material-ids:
      - DIRT
      - COBBLESTONE
      - GRAVEL
      - SAND
      - NETHERRACK
      - COBBLED_DEEPSLATE
  # 材质白名单（mode=whitelist 时，只有匹配到的掉落物才显示）
  material-whitelist:
    material-ids: []
  # 名称黑名单（匹配到的不显示，支持正则）
  name-blacklist:
    name-regex: []
  # Lore 黑名单（物品 Lore 中任意一行匹配到则不显示）
  lore-blacklist:
    lore-regex: []
  # Lore 白名单（配置后，物品 Lore 中必须至少有一行匹配才显示；留空则不启用）
  lore-whitelist:
    lore-regex: []
  # NBT 键黑名单（物品 NBT 中包含指定键则不显示，支持嵌套路径如 "custom.trash"）
  nbt-blacklist:
    nbt-keys: []
  # NBT 键白名单（配置后，物品 NBT 中必须包含至少一个指定键才显示；留空则不启用）
  nbt-whitelist:
    nbt-keys: []
  # 最小堆叠数量（低于此数量的掉落物不显示）
  min-amount: 1
