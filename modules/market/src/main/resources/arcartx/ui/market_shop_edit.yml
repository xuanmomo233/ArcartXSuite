# AXS Market — 系统商店编辑界面（管理员）
# 打开方式: /axs market edit [商店ID] 或商店界面顶栏「编辑商店」按钮
# 权限: arcartxsuite.market.admin（服务端强校验，UI 仅作入口）
# 布局: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏 + 左侧商店列表 + 内容区(列表态/商店编辑/商品编辑) + 背包选物弹窗 + 确认弹窗
# 配色: 与 market_shop 一致 主色70,150,250 底42,50,66,210 描边255,255,255,230
#
# 服务端包（packetHandler）:
#   edit_list:  shops/shopTexts/shopIconJson{k}/maxShopCount/defaultCurrency/action_token
#   edit_shop:  found/shopId/displayName/permission/tags/iconPreview/items{idx:{key,name,type,price,currencyName,stock,limit}}/editItemJson{idx}/maxItemCount/action_token
#   edit_item:  found/shopId/key/type/displayName/buyPrice/sellPrice/currency/stockMode/stockAmount/limitPerPlayer/limitReset/conditions/commands/discounts/source/itemId/nbt/iconPreview/itemPreview/defaultCurrency/action_token
#   edit_pick:  target(shop_icon|item_icon|item_def)/itemJson/name(+source/id/nbt)
#   edit_result: success/message/op/action_token
#
# 客户端包（Packet.send）:
#   shop_edit_list / shop_edit_shop <shopId> / shop_edit_item <shopId> <key>
#   shop_edit_pick <rawSlot 9-44> <target>
#   shop_edit_shop_save <shopId> <isNew 0/1> <json> <token>
#   shop_edit_shop_delete <shopId> <token>
#   shop_edit_item_save <shopId> <isNew 0/1> <json> <token>
#   shop_edit_item_delete <shopId> <key> <token>

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: false
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    stock_summary: |-
      var.fStockSummary = packet['summary']
      var.actionToken = packet['action_token']
      var.actionBusy = false
    edit_preview: |-
      var.fItemPreviewJson = packet['itemJson']
      val.物品预览.seticon()
      var.actionBusy = false
      var.resultMsg = '物品预览已更新（未发放、未保存）'
    action_result: |-
      var.actionToken = packet['action_token']
      var.actionBusy = false
      var.actionBusySeconds = 0
    edit_list: |-
      var.editShops = packet['shops']
      var.shopTexts = packet['shopTexts']
      var.maxShopCount = packet['maxShopCount']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.defaultCurrency = packet['defaultCurrency']
      var.shopIconJsons = {}
      for(key in var.editShops.keys()){
        json = packet['shopIconJson' + key]
        if(json != none && json != ''){
          var.shopIconJsons[key] = json
        } else {
          var.shopIconJsons[key] = var.air
        }
      }
      while(val.商店行区.childrenCount() > 1){
        val.商店行区.get(1).remove()
      }
      if(var.maxShopCount > 1){
        for(i in range(1, var.maxShopCount - 1)){
          key = i.round()
          if(val.商店行区['商店行'] != none) {
            e = val.商店行区['商店行'].copy('商店行' + key)
            e.entryKey = key
          }
        }
      }
      if(var.maxShopCount > 0){
        for(i in range(0, var.maxShopCount - 1)){
          key = i.round()
          e = val.商店行区.get(key)
          if(e != none && e['商店行图标'] != none){
            e['商店行图标'].seticon()
          }
        }
      }
      var.actionBusy = false
    edit_shop: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      if(packet['found'] == true){
        var.formLoading = true
        var.shopRevision = packet['revision']
        sameShop = var.editShopId == packet['shopId']
        var.dirty = false
        var.editShopNew = false
        var.editShopId = packet['shopId']
        var.fShopName = packet['displayName']
        var.fShopPerm = packet['permission']
        var.fShopTags = packet['tags']
        var.fShopIconJson = packet['iconPreview']
        var.fShopIconMode = 'keep'
        var.editItems = packet['items']
        var.maxEditItemCount = packet['maxItemCount']
        var.editItemJsons = {}
        for(key in var.editItems.keys()){
          json = packet['editItemJson' + key]
          if(json != none && json != ''){
            var.editItemJsons[key] = json
          } else {
            var.editItemJsons[key] = var.air
          }
        }
        // 正在编辑该商店的某个商品时不强制跳回商店视图（保存商品后的列表刷新）
        if(var.view != 'item' || !sameShop){
          var.view = 'shop'
        }
        // setContent/seticon 必须推迟到下一帧，等待视图切换后控件可见
        scheduler.delay(50, -> {
          var.hydrating = true
          val.商店ID输入.setContent(var.editShopId)
          val.商店名输入.setContent(var.fShopName)
          val.商店权限输入.setContent(var.fShopPerm)
          val.商店标签输入.setContent(var.fShopTags)
          if(var.fShopIconJson == none || var.fShopIconJson == ''){
            var.fShopIconJson = var.air
          }
          val.商店图标预览.seticon()
          while(val.商品行区.childrenCount() > 1){
            val.商品行区.get(1).remove()
          }
          if(var.maxEditItemCount > 1){
            for(i in range(1, var.maxEditItemCount - 1)){
              key = i.round()
              if(val.商品行区['商品行'] != none) {
                e = val.商品行区['商品行'].copy('商品行' + key)
                e.entryKey = key
              }
            }
          }
          if(var.maxEditItemCount > 0){
            for(i in range(0, var.maxEditItemCount - 1)){
              key = i.round()
              e = val.商品行区.get(key)
              if(e != none && e['商品行图标'] != none){
                e['商品行图标'].seticon()
              }
            }
          }
          var.hydrating = false
          var.formLoading = false
        })
      } else {
        if(var.view == 'shop' || var.view == 'item'){
          var.view = 'list'
        }
      }
      var.actionBusy = false
    edit_item: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      if(packet['found'] == true){
        var.dirty = false
        var.formLoading = true
        var.shopRevision = packet['revision']
        var.editShopId = packet['shopId']
        var.itemNew = false
        var.editItemKey = packet['key']
        var.fItemType = packet['type']
        var.fItemName = packet['displayName']
        var.fBuyPrice = packet['buyPrice']
        var.fSellPrice = packet['sellPrice']
        var.fCurrency = packet['currency']
        var.fStockMode = packet['stockMode']
        var.fStockAmount = packet['stockAmount']
        var.fRestockInterval = packet['restockInterval']
        var.fStockSummary = packet['stockSummary']
        var.applyStock = false
        var.fLimit = packet['limitPerPlayer']
        var.fLimitReset = packet['limitReset']
        var.fConditions = packet['conditions']
        var.fCommands = packet['commands']
        var.fDiscounts = packet['discounts']
        var.fItemSource = packet['source']
        var.fItemId = packet['itemId']
        var.fItemNbt = packet['nbt']
        var.fItemIconJson = packet['iconPreview']
        var.fItemIconMode = 'keep'
        var.fItemPreviewJson = packet['itemPreview']
        var.view = 'item'
        scheduler.delay(50, -> {
          var.hydrating = true
          val.表单滑块.setDragYRatio(0)
          val.商品ID输入.setContent(var.editItemKey)
          val.商品名输入.setContent(var.fItemName)
          val.来源输入.setContent(var.fItemSource)
          val.物品ID输入.setContent(var.fItemId)
          val.NBT输入.setContent(var.fItemNbt)
          val.买入价输入.setContent(var.fBuyPrice)
          val.卖出价输入.setContent(var.fSellPrice)
          val.货币输入.setContent(var.fCurrency)
          val.库存量输入.setContent(var.fStockAmount)
          val.补货间隔输入.setContent(var.fRestockInterval)
          val.限购输入.setContent(var.fLimit)
          val.条件输入.setContent(var.fConditions)
          val.指令输入.setContent(var.fCommands)
          val.折扣输入.setContent(var.fDiscounts)
          if(var.fItemIconJson == none || var.fItemIconJson == ''){
            var.fItemIconJson = var.air
          }
          if(var.fItemPreviewJson == none || var.fItemPreviewJson == ''){
            var.fItemPreviewJson = var.air
          }
          val.商品图标预览.seticon()
          val.物品预览.seticon()
          var.hydrating = false
          var.formLoading = false
        })
      } else {
        if(var.view == 'item'){
          var.view = 'shop'
        }
      }
      var.actionBusy = false
    edit_pick: |-
      target = packet['target']
      json = packet['itemJson']
      if(target == 'shop_icon'){
        var.fShopIconJson = json
        var.fShopIconMode = 'json'
        scheduler.delay(50, -> {
          val.商店图标预览.seticon()
        })
      }
      if(target == 'item_icon'){
        var.fItemIconJson = json
        var.fItemIconMode = 'json'
        scheduler.delay(50, -> {
          val.商品图标预览.seticon()
        })
      }
      if(target == 'item_def'){
        var.fItemSource = packet['source']
        var.fItemId = packet['id']
        var.fItemNbt = packet['nbt']
        var.fItemPreviewJson = json
        scheduler.delay(50, -> {
          val.来源输入.setContent(var.fItemSource)
          val.物品ID输入.setContent(var.fItemId)
          val.NBT输入.setContent(var.fItemNbt)
          val.物品预览.seticon()
        })
      }
      var.dirty = true
      var.showPicker = false
      var.actionBusy = false
    edit_result: |-
      if(packet['success'] == true && packet['op'] != 'stock'){ var.dirty = false }
      var.resultMsg = packet['message']
      var.resultOk = packet['success']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.packetId = 'AXS_MARKET'
      var.dirty = false
      var.hydrating = false
      var.formLoading = false
      var.shopRevision = ''
      var.navigate = -> {
        if(!var.actionBusy && !var.formLoading){
          if(var.dirty){
            var.confirmTarget = 'discard'
            var.confirmText = '尚有未保存的修改，是否放弃并继续？'
            var.showConfirm = true
          } else {
            var.pendingNavigation()
          }
        }
      }
      var.view = 'list'
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.showPicker = false
      var.showConfirm = false
      var.pickTarget = ''
      var.confirmTarget = ''
      var.confirmKey = ''
      var.confirmText = ''
      var.resultMsg = ''
      var.resultOk = false
      var.defaultCurrency = ''
      var.editShops = {}
      var.shopTexts = {}
      var.shopIconJsons = {}
      var.maxShopCount = 0
      var.editShopNew = false
      var.editShopId = ''
      var.fShopName = ''
      var.fShopPerm = ''
      var.fShopTags = ''
      var.fShopIconJson = var.air
      var.fShopIconMode = 'keep'
      var.editItems = {}
      var.editItemJsons = {}
      var.maxEditItemCount = 0
      var.itemNew = false
      var.editItemKey = ''
      var.fItemType = 'item'
      var.fItemName = ''
      var.fItemSource = 'minecraft'
      var.fItemId = ''
      var.fItemNbt = ''
      var.fItemPreviewJson = var.air
      var.fItemIconJson = var.air
      var.fItemIconMode = 'keep'
      var.fBuyPrice = '0'
      var.fSellPrice = '0'
      var.fCurrency = ''
      var.fStockMode = 'unlimited'
      var.fStockAmount = '0'
      var.fRestockInterval = '0'
      var.fStockSummary = ''
      var.applyStock = false
      var.stockTarget = ''
      var.stockManageAmount = '1'
      var.fLimit = '0'
      var.fLimitReset = 'never'
      var.fConditions = ''
      var.fCommands = ''
      var.fDiscounts = ''
      var.stockModeNames = {'unlimited': '无限', 'global': '全服', 'per-player': '每人'}
      var.limitResetNames = {'never': '不重置', 'daily': '每日', 'weekly': '每周', 'monthly': '每月'}
      var.typeNames = {'item': '物品', 'command': '指令'}
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
    open: |-
      Packet.send(var.packetId, 'shop_edit_list')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72

controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;20,28,42,110

  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~62,66,74,210
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~150,110,40,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f商店编辑"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 232
              width: 1
              height: 30
              normal: ~62,66,74,210
          副标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 252
              texts: "var.resultMsg != none && var.resultMsg != '' ? var.resultMsg : '&7系统商店管理（返回按钮保留未保存提醒）'"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                var.pendingNavigation = -> {
                  Packet.send(var.packetId, 'shop_ui_open', var.editShopNew == true ? '' : var.editShopId)
                }
                var.navigate()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧：商店列表 ────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          新建商店按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                var.pendingNavigation = -> {
                  var.formLoading = true
                  var.hydrating = true
                  var.shopRevision = ''
                  var.resultMsg = ''
                  var.editShopNew = true
                  var.editShopId = ''
                  var.fShopName = ''
                  var.fShopPerm = ''
                  var.fShopTags = ''
                  var.fShopIconJson = var.air
                  var.fShopIconMode = 'none'
                  var.editItems = {}
                  var.maxEditItemCount = 0
                  var.view = 'shop'
                  scheduler.delay(50, -> {
                    val.商店ID输入.setContent('')
                    val.商店名输入.setContent('')
                    val.商店权限输入.setContent('')
                    val.商店标签输入.setContent('')
                    val.商店图标预览.seticon()
                    while(val.商品行区.childrenCount() > 1){
                      val.商品行区.get(1).remove()
                    }
                    var.hydrating = false
                    var.formLoading = false
                    var.dirty = false
                  })
                }
                var.navigate()
            children:
              新建商店底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~80,180,120,230
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,255,190,255' : '255,255,255,230'"
              新建商店文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&0＋ 新建商店"
                  fontSize: 36
                  through: true
          商店列表标题:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 96
              texts: "~&f商店列表"
              fontSize: 36
              through: true
          商店滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -10
              y: 148
              width: 8
              height: "var.viewH - 316"
              normal: ~42,50,66,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          商店滑块:
            type: Texture
            val: 商店滑块
            attribute:
              point: ~top_right
              x: -10
              y: 148
              width: 8
              height: 60
              normal: ~140,200,255,255
              maxDragY: "var.viewH - 376"
              shape: ~round_rect
              radius: 4
          商店滚动:
            type: Scroll
            attribute:
              point: ~top_left
              x: 20
              y: 148
              width: 260
              height: "var.viewH - 316"
              moveY: "self.parent['商店滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['商店滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['商店滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              商店行区:
                val: 商店行区
                type: VStack
                attribute:
                  width: 254
                  spaceBetween: 8
                children:
                  商店行:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.editShops[self.entryKey]
                      visible: self.entry != none
                      width: 254
                      height: 56
                    action:
                      clickLeft: |-
                        var.navigateShopId = self.entry['id']
                        var.pendingNavigation = -> {
                          var.view = 'shop'
                          var.actionBusy = true
                          Packet.send(var.packetId, 'shop_edit_shop', var.navigateShopId)
                        }
                        var.navigate()
                    children:
                      商店行底:
                        type: Texture
                        attribute:
                          point: ~top_left
                          x: 3
                          y: 0
                          width: 248
                          height: 56
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['id'] == var.editShopId && var.editShopNew != true ? '70,150,250,210' : '62,66,74,210'"
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 3
                            color: "self.parent.entry != none && self.parent.entry['id'] == var.editShopId && var.editShopNew != true ? '255,255,255,255' : (self.isHovered() ? '140,200,255,255' : '255,255,255,230')"
                      商店行图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 0.72
                          x: 8
                          y: 8
                          width: 40
                          height: 40
                          normal: ~36,42,54,220
                          shape: ~round_rect
                          radius: 8
                          seticon: "self.setItemIcon(var.shopIconJsons[self.parent.entryKey] != none && var.shopIconJsons[self.parent.entryKey] != '' ? var.shopIconJsons[self.parent.entryKey] : var.air)"
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,230
                      商店行文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 56
                          texts: "self.parent.entry != none ? '&f' + var.shopTexts[self.parent.entryKey] : ''"
                          fontSize: 32
                          through: true
                      商店行数量:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -12
                          texts: "self.parent.entry != none ? '&7' + self.parent.entry['itemCount'].round() : ''"
                          fontSize: 28
                          through: true

      # ── 内容区 ────────────────────────────────────────
      内容区:
        type: Canvas
        attribute:
