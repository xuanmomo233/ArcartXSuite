ui:
  isHud: false
  match:
  - 烟熏炉界面
  defaultOpen: true
  background: true
  escClose: true
  closeDied: true
  screenScale: true
  through: var.whLayoutEnabled && var.whAvailable && !var.carrying && !var.recipeOpen && val.warehouseGrid != none && val.warehouseGrid.isHovered()
    && var.whMenu == '' && !var.whPinHovered
  jei: false
  itemSize: 16
  hide:
  - hotbar
  - crosshair
  - player_state
  - experience_bar
  - chat_panel
  action:
    load: |-
      // 服务器在 UI 注册前写入仓库布局能力。
      var.whLayoutEnabled = false
      var.carrying = false
      var.whAvailable = false
      var.whResolved = false
      var.whRows = {}
      var.whDirty = false
      var.whToken = ''
      var.whSearch = ''
      var.whCategory = '全部'
      var.whSort = '默认'
      var.whPage = '—'
      var.whHasPrevious = false
      var.whHasNext = false
      var.whCount = '—'
      var.recipeOpen = !var.whLayoutEnabled
      var.recipeResolved = false
      var.recipeHasNext = false
      var.recipes = {}
      var.recipeKeys = {}
      var.recipeDirty = false
      var.recipePage = 0
      var.recipeSearch = ''
      var.recipeName = '选择配方'
      var.recipeSelection = ''
      var.recipePageText = '1 / 1'
      var.onlyCraftable = false
      var.cook = 0
      var.burn = 0
      var.whMenu = ''
      var.whMenuPage = 0
      var.whMenuCount = 0
      var.whCategories = {}
      var.whCategoryCount = 0
      var.whSortOptions = {}
      var.whSortCount = 0
      var.whSearchTicks = 0
      var.whPageStep = 0
      var.recipePageStep = 0
      var.previewDirty = false
      var.whPinHovered = false
      var.fillBusy = false
      var.fillMessage = ''
      var.noticeActive = false
      var.noticeText = ''
      var.noticeDetail = ''
      var.noticeFade = Fade(80, 1000, 220)
      var.noticePeaked = false
      var.noticeLines = []
      var.noticeCount = 1
    open: |-
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeText = ''
      var.noticeDetail = ''
      if(var.whLayoutEnabled){
        Packet.send('AXS:vanilla_smoker', 'warehouse_panel', 'open')
      }else{
        Packet.send('AXS:vanilla_smoker', 'show_recipe_book')
      }
      val.workshopHeaderIcon.setItemIcon('{"id":"minecraft:smoker","Count":1b}')
    close: Packet.send('AXS:vanilla_smoker', 'warehouse_panel', 'close', var.whToken)
    tick: |-
      carried = self.getCarriedItemStack()
      var.carrying = carried != none && carried.getCount() > 0
      if(var.whDirty && var.whCells != none){
        var.whDirty = false
        for(i in range(0, 23)){
          idx = i.round()
          cell = var.whCells[idx]
          row = var.whRows[idx]
          if(cell != none){
            cell['Hit'].id = row == none ? 'axs_wh_entry_empty' : row['clickId']
            cell['Icon'].setItemIcon(row == none ? '' : row['icon'])
          }
        }
      }
      if(var.recipeDirty && var.recipeIcons != none){
        var.recipeDirty = false
        keys = []
        for(key in var.recipes.keys()){
          row = var.recipes[key]
          if((!var.onlyCraftable || row['canCraft'] == 1) && (var.recipeSearch == '' || row['resultName'].contains(var.recipeSearch) || row['resultZhName'].contains(var.recipeSearch))){
            keys.add(key)
          }
        }
        pages = 1
        while(keys.size() > pages * 24){ pages = pages + 1 }
        if(var.recipePage < 0){ var.recipePage = 0 }
        if(var.recipePage >= pages){ var.recipePage = pages - 1 }
        var.recipeHasNext = var.recipePage + 1 < pages
        var.recipePageText = (var.recipePage + 1).round() + ' / ' + pages.round()
        var.recipeKeys = {}
        for(i in range(0, 23)){
          idx = i.round()
          offset = (var.recipePage * 24 + idx).round()
          icon = var.recipeIcons[idx]
          if(offset < keys.size()){
            key = keys[offset]
            var.recipeKeys[idx] = key
            icon.setItemIcon(var.recipes[key]['resultJson'])
          }else{
            icon.setItemIcon('')
          }
        }
      }
      if(var.whSearchTicks > 0){
        var.whSearchTicks = var.whSearchTicks - 1
        if(var.whSearchTicks == 0){ Packet.send('AXS:vanilla_smoker', 'warehouse_panel', 'search', var.whSearch) }
      }
      if(var.whPageStep != 0){
        direction = var.whPageStep < 0 ? 'prev' : 'next'
        permitted = var.whPageStep < 0 ? var.whHasPrevious : var.whHasNext
        var.whPageStep = 0
        if(var.whAvailable && permitted){ Packet.send('AXS:vanilla_smoker', 'warehouse_panel', 'page', direction) }
      }
      if(var.recipePageStep != 0){
        if((var.recipePageStep < 0 && var.recipePage > 0) || (var.recipePageStep > 0 && var.recipeHasNext)){
          var.recipePage = var.recipePage + var.recipePageStep
          var.recipeDirty = true
        }
        var.recipePageStep = 0
      }
      if(var.previewDirty && var.previewIcons != none){
        var.previewDirty = false
        selectedRecipe = var.recipes[var.recipeSelection]
        for(i in range(0, 0)){
          preview = var.previewIcons[i.round()]
          if(preview != none){
            preview.setItemIcon(selectedRecipe == none ? '' : selectedRecipe['previewGrid'].get(i.round()))
          }
        }
        if(val.recipePreviewResult != none){
          val.recipePreviewResult.setItemIcon(selectedRecipe == none ? '' : selectedRecipe['resultJson'])
        }
      }
      var.whPinHovered = false
      if(var.whCells != none){
        for(i in range(0, 23)){
          pinCell = var.whCells[i.round()]
          if(pinCell != none && pinCell['置顶按钮'].isHovered()){ var.whPinHovered = true }
        }
      }

      if(var.noticeActive){
        var.noticeOpacity = var.noticeFade.get()
        if(var.noticeOpacity > 0){ var.noticePeaked = true }
        if(var.noticePeaked && var.noticeOpacity <= 0){
          var.noticeActive = false
          var.noticePeaked = false
          var.noticeText = ''
          var.noticeDetail = ''
        }
      }
  packetHandler:
    warehouse_panel: |-
      var.whAvailable = packet['available']
      var.whResolved = true
      var.whHasPrevious = var.whAvailable && packet['hasPreviousPage']
      var.whHasNext = var.whAvailable && packet['hasNextPage']
      if(var.whAvailable){
        var.whToken = packet['token']
        var.whRows = packet['rows']
        var.whPage = packet['page']
        var.whSort = packet['sort']
        var.whCategory = packet['category']
        var.whCount = packet['count']
      }else{
        var.whRows = {}
      }
      var.whDirty = true
      var.whCategories = var.whAvailable ? packet['categories'] : {}
      var.whCategoryCount = var.whAvailable ? packet['categoryCount'] : 0
      var.whSortOptions = var.whAvailable ? packet['sorts'] : {}
      var.whSortCount = var.whAvailable ? packet['sortCount'] : 0
    recipe_book_toggle: |-
      if(packet['recipes'] != none){
        var.recipeResolved = true
        var.recipes = packet['recipes']
        var.recipeDirty = true
      }
      if(var.recipeSelection != '' && var.recipes[var.recipeSelection] == none){
        var.recipeSelection = ''
        var.recipeName = '选择配方'
      }
      var.previewDirty = true
    furnace_state: |-
      var.cook = packet['cookTimeTotal'] > 0 ? packet['cookTime'] / packet['cookTimeTotal'] : 0
      var.burn = packet['burnTimeTotal'] > 0 ? packet['burnTime'] / packet['burnTimeTotal'] : 0
      var.cook = var.cook < 0 ? 0 : (var.cook > 1 ? 1 : var.cook)
      var.burn = var.burn < 0 ? 0 : (var.burn > 1 ? 1 : var.burn)
    placement_state: |-
      var.fillBusy = packet['busy']
      var.fillMessage = packet['message']
      if(!packet['busy']){
        noticeMessage = packet['message']
        if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
          var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
          noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
          var.noticeLines = noticeWrapped.split('\n')
          var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
          var.noticeFade.reset()
          var.noticePeaked = false
          var.noticeActive = true
        }
      }
    ui_notice: |-
      noticeMessage = packet['message']
      if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
        var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
        noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = noticeWrapped.split('\n')
        var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
