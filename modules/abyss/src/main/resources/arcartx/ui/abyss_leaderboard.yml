              texts: "var.b2 != none ? '&8#' + var.b2['rank'].round() + '    &f' + var.b2['name'] + '    &e' + var.b2['time'] + '    &7' + var.b2['completions'].round() + '次' : ''"
              fontSize: 36
          行3:
