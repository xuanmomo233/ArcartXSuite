                          point: ~stretch_all
                          through: true
                          normal: "var.autoPickup ? '104,84,46,225' : '62,66,74,210'"
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '245,205,130,255' : (var.autoPickup ? '232,180,90,235' : '255,255,255,230')"
                      自动入库字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 206
                          texts: "var.autoPickup ? '&f自动入库 开' : '&7自动入库 关'"
                          fontSize: 30
                          through: true
                  怪物战利品:
                    type: Canvas
                    attribute:
                      width: 206
                      height: 48
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'toggle_auto_mythic', var.actionToken)
                    children:
                      怪物战利品底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "var.autoPickupMythic ? '104,84,46,225' : '62,66,74,210'"
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '245,205,130,255' : (var.autoPickupMythic ? '232,180,90,235' : '255,255,255,230')"
                      怪物战利品字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 206
                          texts: "var.autoPickupMythic ? '&f怪物战利品 开' : '&7怪物战利品 关'"
                          fontSize: 28
                          through: true
                  入库通知:
                    type: Canvas
                    attribute:
                      width: 206
                      height: 48
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'toggle_auto_notify', var.actionToken)
                    children:
                      入库通知底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "var.autoPickupNotify ? '104,84,46,225' : '62,66,74,210'"
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '245,205,130,255' : (var.autoPickupNotify ? '232,180,90,235' : '255,255,255,230')"
                      入库通知字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 206
                          texts: "var.autoPickupNotify ? '&f入库通知 开' : '&7入库通知 关'"
                          fontSize: 30
                          through: true
              分隔一:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 24
                  y: 168
                  width: 652
                  height: 3
                  normal: ~255,255,255,230
              名称标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 182
                  width: 640
                  texts: "~&f名称与展示"
                  fontSize: 30
                  through: true
              名称提示:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 218
                  width: 640
                  texts: "var.ownerType != none ? ('&7当前名称 ' + var.warehouseName) : '&7请先在左侧选择一个仓库'"
                  fontSize: 24
                  through: true
              新名称:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 250
                  width: 400
                  height: 48
                children:
                  新名称底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~40,44,52,225
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
                  输入框:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 10
                      width: 380
                      height: 38
                      length: 24
                      emptyText: ~新名称
                      fontSize: 34
                    action:
                      textChange: |-
                        var.renameName = self.getContent()
              改名按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 436
                  y: 250
                  width: 110
                  height: 48
