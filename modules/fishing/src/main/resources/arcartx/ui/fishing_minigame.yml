# AXS 钓鱼小游戏界面（Menu 承载，HUD 观感）
# 无背景无面板——玩家透过 UI 看到环境，核心组件悬浮在屏幕中右部
# 布局: 鱼名胶囊(顶部小药丸) + 轨道区(中右 96x560) + 进度条(轨道右侧竖条) + 操作提示(底部裸文字) + 结果覆盖层
# 视觉规范:
#   组件底 12,28,42,190  描边 80,200,220  文字/图标无底板
#   主色（青蓝）50,170,200  绿条 80,220,160  成功 124,196,142  失败 230,100,90

ui:
  isHud: false
  background: false
  escClose: false
  closeDied: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.fishInside = false
      var.packetId = packet['packetId']
      var.fishId = packet['fishId']
      var.fishName = packet['fishName']
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.caughtSize = packet['caughtSize']
      var.rarity = packet['rarity']
      var.fishIconJson = packet['fishIconJson']
      var.rarityTag = var.rarity == 'legendary' ? '&6' : (var.rarity == 'rare' ? '&9' : (var.rarity == 'uncommon' ? '&a' : '&f'))
      var.rarityLabel = var.rarity == 'legendary' ? '传说' : (var.rarity == 'rare' ? '稀有' : (var.rarity == 'uncommon' ? '罕见' : '普通'))
      var.rarityColor = var.rarity == 'legendary' ? '255,200,50' : (var.rarity == 'rare' ? '80,140,240' : (var.rarity == 'uncommon' ? '100,220,120' : '200,200,200'))
      if(var.fishIconJson == none || var.fishIconJson == ''){
        var.fishIconJson = var.emptyItemJson
      }
      val.鱼图标.seticon()
      val.结果图标.seticon()
    update: |-
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.fishInside = packet['fishInside']
  action:
    load: |-
      var.caughtSize = 0
      var.fishIconJson = ''
      var.fishName = ''
      var.fishY = 0.5
      var.rarityLabel = '普通'
      var.barHeight = 0.24
      var.barY = 0.5
      var.packetId = 'AXS_FISHING'
      var.progress = 0.5
      var.rarityTag = '&f'
      var.timeLeft = 600
      var.emptyItemJson = '{"id":"minecraft:cod","Count":1b}'
    open: |-
      Packet.send(var.packetId, 'open_minigame')
    keyPress: |-
      if(self.currentKeyPress() == ' ' || self.currentKeyPress() == 'SPACE'){
        Packet.send(var.packetId, 'input', true)
      }
      if((self.currentKeyPress() == 'q' || self.currentKeyPress() == 'Q') && var.state == 'playing'){
        Packet.send(var.packetId, 'give_up')
      }
    keyRelease: |-
      if(self.currentKeyReleased() == ' ' || self.currentKeyReleased() == 'SPACE'){
        Packet.send(var.packetId, 'input', false)
      }
    click: |-
      Packet.send(var.packetId, 'input', true)
    release: |-
      Packet.send(var.packetId, 'input', false)

controls:
  # 自适应全局布局：以1920x1080设计分辨率等比缩放，居中定位
  # 无全屏玻璃底、无主卡片底——玩家可透过 UI 看到周围环境
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      # ── 鱼名胶囊（顶部小药丸：鱼名·稀有度 | 倒计时）──────────
      鱼名胶囊:
        type: Canvas
        attribute:
          point: ~top_center
          y: 176
          width: 400
          height: 48
          visible: "var.state == 'playing'"
        children:
          胶囊底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:12;12,28,42,150
              shape: ~round_rect
              radius: 22
            effect:
              stroke:
                width: 1
                color: ~80,200,220,180
          鱼名文字:
            type: Text
            attribute:
              point: ~middle_left
              x: 24
              texts: "var.rarityTag + '◆ ' + var.fishName + ' · ' + var.rarityLabel"
              fontSize: 28
              through: true
          时间文字:
            type: Text
            attribute:
              point: ~middle_right
              x: -24
              texts: "(var.timeLeft < 100 ? '&c' : '&f') + (var.timeLeft / 20).round() + 's'"
              fontSize: 24
              through: true

      # ── 轨道区（屏幕中右竖直轨道，HUD 化窄条）──────────
      轨道区:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 140
          y: -20
          width: 96
          height: 560
          visible: "var.state == 'playing'"
        children:
          轨道底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:14;12,28,42,190
              shape: ~round_rect
              radius: 20
            effect:
              stroke:
                width: 2
                color: ~80,200,220,200
          水深渐变:
            type: Texture
            attribute:
              point: ~top_left
              x: 6
              y: 6
              width: 84
              height: 548
              normal: ~12,28,42,255
              shape: ~round_rect
              radius: 16
            effect:
              gradient:
                color1: ~18,45,70,200
                color2: ~8,22,38,200
                type: 0
                angleDeg: 90
          # 绿条（玩家控制的捕获区域，鱼入内时增亮）
          绿条:
            type: Texture
            attribute:
              point: ~top_left
              x: 10
              y: "(1 - var.barY - var.barHeight / 2) * 548 + 6"
              width: 76
              height: "var.barHeight * 548"
              normal: "var.fishInside ? '100,240,180,235' : '80,220,160,190'"
              shape: ~round_rect
              radius: 12
            effect:
              stroke:
                width: 2
                color: ~140,255,200,160
          # 鱼图标（Slot 控件渲染 MC 物品图标）
          鱼图标:
            type: Slot
            val: 鱼图标
            attribute:
              slotType: ~Icon
              itemScale: 1.0
              point: ~top_left
              x: 24
              y: "math.max(6, math.min(506, (1 - var.fishY) * 548 + 6 - 24))"
              width: 48
              height: 48
              normal: ~0,0,0,0
              through: true
              seticon: "self.setItemIcon(var.fishIconJson)"

      # ── 进度条（轨道右侧竖条，HUD 化细条）──────────
      进度条:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 248
          y: -20
          width: 24
          height: 560
          visible: "var.state == 'playing'"
        children:
          进度底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,28,42,180
              shape: ~round_rect
              radius: 12
            effect:
              stroke:
                width: 1
                color: ~80,200,220,200
          进度填充:
            type: Texture
            attribute:
              point: ~top_left
              x: 4
              y: "(1 - var.progress) * 552 + 4"
              width: 16
              height: "var.progress * 552"
              normal: "var.progress >= 1.0 ? '124,196,142,255' : (var.fishInside ? '50,170,200,245' : '230,100,90,245')"
              shape: ~round_rect
              radius: 8
          进度数字:
            type: Text
            attribute:
              point: ~top_center
              y: 568
              texts: "'&f' + (var.progress * 100).round() + '%'"
              fontSize: 20
              through: true

      # ── 操作提示（底部裸文字，无底板）──────────
      操作提示:
        type: Text
        attribute:
          point: ~bottom_center
          y: -110
          texts: "~&7按住 &f空格 &7或 &f左键 &7让绿条追踪鱼 · &fQ &7放弃"
          fontSize: 22
          through: true
          visible: "var.state == 'playing'"

      # ── 结果覆盖层（成功/失败时显示，居中悬浮）──────────
      结果覆盖层:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 560
          height: 280
          visible: "var.state == 'success' || var.state == 'failed'"
        children:
          结果背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: "var.state == 'success' ? '18,50,35,240' : '55,20,20,240'"
              shape: ~round_rect
              radius: 20
            effect:
              stroke:
                width: 3
                color: "var.state == 'success' ? '124,196,142,245' : '230,100,90,200'"
          结果文字:
            type: Text
            attribute:
              point: ~top_center
              y: 44
              texts: "var.state == 'success' ? '&a✓ 捕获成功！' : '&c✕ 鱼逃走了...'"
              fontSize: 48
              through: true
          结果图标:
            type: Slot
            val: 结果图标
            attribute:
              slotType: ~Icon
              itemScale: 1.2
              point: ~top_center
              y: 104
              width: 56
              height: 56
              normal: ~0,0,0,0
              through: true
              visible: "var.state == 'success'"
              seticon: "self.setItemIcon(var.fishIconJson)"
          结果详情:
            type: Text
            attribute:
              point: ~top_center
              y: 176
              texts: "var.state == 'success' ? (var.rarityTag + var.fishName + ' &7尺寸: &f' + var.caughtSize + ' cm') : '&7再试一次吧'"
              fontSize: 30
              through: true
          结果稀有度:
            type: Text
            attribute:
              point: ~top_center
              y: 224
              texts: "var.state == 'success' ? (var.rarityTag + '◆ ' + var.rarityLabel) : ''"
              fontSize: 26
              through: true
