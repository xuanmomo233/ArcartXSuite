# QuestGPS · Expedition navigator
# Limestone atlas / cobalt waypoints / orange route thread.
# Hierarchy: expedition status tabs → region index → mission brief → objectives & supplies.
# Adaptive 1920×1080; all viewport derivatives are repeated in load/resize.
# Packet contracts, server-owned selection, action token order and reward JSON timing retained.
# Saved row references rebind equal-count key changes; overflow text is clipped and readable on hover.
# Description supports vertical wheel + horizontal drag without truncating server-authored lines.

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    init: |-
      var.catIndex = 0
      var.qIndex = 0
      var.rIndex = 0
      var.tIndex = 0
      var.rewardItemJsons = {}
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.categories = packet['categories']
      var.pages = packet['pages']
      var.quests = packet['quests']
      var.tasks = packet['tasks']
      var.rewards = packet['rewards']
      var.categoryId = packet['categoryId']
      var.pageId = packet['pageId']
      var.categoryName = packet['categoryName']
      var.pageName = packet['pageName']
      var.availableCount = packet['availableCount']
      var.activeCount = packet['activeCount']
      var.completedCount = packet['completedCount']
      var.questCount = packet['questCount']
      var.navigationReady = packet['navigationReady']
      var.selectedQuestId = packet['selectedQuestId']
      var.selectedQuestName = packet['selectedQuestName']
      var.selectedQuestState = packet['selectedQuestState']
      var.selectedQuestPath = packet['selectedQuestPath']
      var.selectedQuestDescriptionText = packet['selectedQuestDescriptionText']
      var.trackSummary = packet['trackSummary']
      var.canAccept = packet['canAccept']
      var.canAbandon = packet['canAbandon']
      var.canTrackQuest = packet['canTrackQuest']
      var.questTracked = packet['questTracked']
      var.detailCrossWorld = packet['detailCrossWorld']
      var.detailTeleportAvailable = packet['detailTeleportAvailable']
      var.detailTargetWorld = packet['detailTargetWorld']
      var.taskCount = packet['taskCount']
      var.rewardCount = packet['rewardCount']
      // Saved copy references avoid resolving freshly-created children by index.
      var.rowGeneration = (var.rowGeneration + 1).round()
      var.catKeys = var.categories.keys()
      for(key in var.catRows.keys()){
        var.catRows[key].remove()
      }
      var.catRows = {}
      template = val.cat_list.get(0)
      for(key in var.catKeys){
        item = template.copy('分类项' + var.rowGeneration + '_' + var.catIndex.round())
        item.entryKey = key
        var.catRows[var.catIndex.round()] = item
        var.catIndex = var.catIndex + 1
      }
      var.qKeys = var.quests.keys()
      for(key in var.questRows.keys()){
        var.questRows[key].remove()
      }
      var.questRows = {}
      template = val.quest_list.get(0)
      for(key in var.qKeys){
        item = template.copy('任务项' + var.rowGeneration + '_' + var.qIndex.round())
        item.entryKey = key
        var.questRows[var.qIndex.round()] = item
        var.qIndex = var.qIndex + 1
      }
      var.tKeys = var.tasks.keys()
      for(key in var.taskRows.keys()){
        var.taskRows[key].remove()
      }
      var.taskRows = {}
      template = val.task_list.get(0)
      for(key in var.tKeys){
        item = template.copy('目标项' + var.rowGeneration + '_' + var.tIndex.round())
        item.entryKey = key
        var.taskRows[var.tIndex.round()] = item
        var.tIndex = var.tIndex + 1
      }
      var.rKeys = var.rewards.keys()
      for(key in var.rKeys){
        rewardEntry = var.rewards[key]
        if(rewardEntry != none && rewardEntry['itemJson'] != none && rewardEntry['itemJson'] != ''){
          var.rewardItemJsons[key] = rewardEntry['itemJson']
        }
      }
      for(key in var.rewardRows.keys()){
        var.rewardRows[key].remove()
      }
      var.rewardRows = {}
      template = val.reward_list.get(0)
      for(key in var.rKeys){
        item = template.copy('奖励项' + var.rowGeneration + '_' + var.rIndex.round())
        item.entryKey = key
        var.rewardRows[var.rIndex.round()] = item
        var.rIndex = var.rIndex + 1
      }
      // JSON dictionaries are populated before seticon, including air fallback in the Slot.
      for(key in var.rewardRows.keys()){
        item = var.rewardRows[key]
        if(item != none && item['奖励图标'] != none){
          item['奖励图标'].seticon()
        }
      }
      val.分类滑块.setDragYRatio(0)
      val.任务滑块.setDragYRatio(0)
      val.目标滑块.setDragYRatio(0)
      val.奖励滑块.setDragYRatio(0)
      val.描述滑块.setDragYRatio(0)
      val.描述横滑块.setDragXRatio(0)
    update: |-
      var.actionToken = packet['action_token']
      oldPageId = var.pageId
      oldCategoryId = var.categoryId
      oldSelectedQuestId = var.selectedQuestId
      var.rowGeneration = (var.rowGeneration + 1).round()
      oldCatCount = var.categories != none ? var.categories.keys().size() : 0
      oldQuestCount = var.quests != none ? var.quests.keys().size() : 0
      oldTaskCount = var.tasks != none ? var.tasks.keys().size() : 0
      oldRewardCount = var.rewards != none ? var.rewards.keys().size() : 0
      var.packetId = packet['packetId']
      var.categories = packet['categories']
      var.pages = packet['pages']
      var.quests = packet['quests']
      var.tasks = packet['tasks']
      var.rewards = packet['rewards']
      var.categoryId = packet['categoryId']
      var.pageId = packet['pageId']
      var.categoryName = packet['categoryName']
      var.pageName = packet['pageName']
      var.availableCount = packet['availableCount']
      var.activeCount = packet['activeCount']
      var.completedCount = packet['completedCount']
      var.questCount = packet['questCount']
      var.navigationReady = packet['navigationReady']
      var.selectedQuestId = packet['selectedQuestId']
      var.selectedQuestName = packet['selectedQuestName']
      var.selectedQuestState = packet['selectedQuestState']
      var.selectedQuestPath = packet['selectedQuestPath']
      var.selectedQuestDescriptionText = packet['selectedQuestDescriptionText']
      var.trackSummary = packet['trackSummary']
      var.canAccept = packet['canAccept']
      var.canAbandon = packet['canAbandon']
      var.canTrackQuest = packet['canTrackQuest']
      var.questTracked = packet['questTracked']
      var.detailCrossWorld = packet['detailCrossWorld']
      var.detailTeleportAvailable = packet['detailTeleportAvailable']
      var.detailTargetWorld = packet['detailTargetWorld']
      var.taskCount = packet['taskCount']
      var.rewardCount = packet['rewardCount']
      var.catKeys = var.categories.keys()
      if(var.catKeys.size() != oldCatCount){
        for(key in var.catRows.keys()){
          var.catRows[key].remove()
        }
        var.catRows = {}
        var.catIndex = 0
        template = val.cat_list.get(0)
        for(key in var.catKeys){
          item = template.copy('分类项' + var.rowGeneration + '_' + var.catIndex.round())
          item.entryKey = key
          var.catRows[var.catIndex.round()] = item
          var.catIndex = var.catIndex + 1
        }
      }
      // Same count does not imply same keys (page/category/mission may have changed).
      var.catIndex = 0
      for(key in var.catKeys){
        item = var.catRows[var.catIndex.round()]
        item.entryKey = key
        var.catIndex = var.catIndex + 1
      }
      var.qKeys = var.quests.keys()
      if(var.qKeys.size() != oldQuestCount){
        for(key in var.questRows.keys()){
          var.questRows[key].remove()
        }
        var.questRows = {}
        var.qIndex = 0
        template = val.quest_list.get(0)
        for(key in var.qKeys){
          item = template.copy('任务项' + var.rowGeneration + '_' + var.qIndex.round())
          item.entryKey = key
          var.questRows[var.qIndex.round()] = item
          var.qIndex = var.qIndex + 1
        }
      }
      var.qIndex = 0
      for(key in var.qKeys){
        item = var.questRows[var.qIndex.round()]
        item.entryKey = key
        var.qIndex = var.qIndex + 1
      }
      var.tKeys = var.tasks.keys()
      if(var.tKeys.size() != oldTaskCount){
        for(key in var.taskRows.keys()){
          var.taskRows[key].remove()
        }
        var.taskRows = {}
        var.tIndex = 0
        template = val.task_list.get(0)
        for(key in var.tKeys){
          item = template.copy('目标项' + var.rowGeneration + '_' + var.tIndex.round())
          item.entryKey = key
          var.taskRows[var.tIndex.round()] = item
          var.tIndex = var.tIndex + 1
        }
      }
      var.tIndex = 0
      for(key in var.tKeys){
        item = var.taskRows[var.tIndex.round()]
        item.entryKey = key
        var.tIndex = var.tIndex + 1
      }
      var.rKeys = var.rewards.keys()
      var.rewardItemJsons = {}
      for(key in var.rKeys){
        rewardEntry = var.rewards[key]
        if(rewardEntry != none && rewardEntry['itemJson'] != none && rewardEntry['itemJson'] != ''){
          var.rewardItemJsons[key] = rewardEntry['itemJson']
        }
      }
      if(var.rKeys.size() != oldRewardCount){
        for(key in var.rewardRows.keys()){
          var.rewardRows[key].remove()
        }
        var.rewardRows = {}
        var.rIndex = 0
        template = val.reward_list.get(0)
        for(key in var.rKeys){
          item = template.copy('奖励项' + var.rowGeneration + '_' + var.rIndex.round())
          item.entryKey = key
          var.rewardRows[var.rIndex.round()] = item
          var.rIndex = var.rIndex + 1
        }
      }
      var.rIndex = 0
      for(key in var.rKeys){
        item = var.rewardRows[var.rIndex.round()]
        item.entryKey = key
        var.rIndex = var.rIndex + 1
      }
      for(key in var.rewardRows.keys()){
        item = var.rewardRows[key]
        if(item != none && item['奖励图标'] != none){
          item['奖励图标'].seticon()
        }
      }
      if(var.pageId != oldPageId || var.categoryId != oldCategoryId){
        val.任务滑块.setDragYRatio(0)
      }
      if(var.selectedQuestId != oldSelectedQuestId){
        val.目标滑块.setDragYRatio(0)
        val.奖励滑块.setDragYRatio(0)
        val.描述滑块.setDragYRatio(0)
        val.描述横滑块.setDragXRatio(0)
      }
  action:
    load: |-
      var.activeCount = 0
      var.availableCount = 0
      var.completedCount = 0
      var.pageName = '可接取'
      var.questCount = 0
      var.rewardCount = 0
      var.taskCount = 0
      var.trackSummary = '当前未设置导航'
      var.packetId = 'AXS_QUESTGPS'
      var.emptyItemJson = '{"id": "minecraft:air","Count":1b}'
      var.catRows = {}
      var.questRows = {}
      var.taskRows = {}
      var.rewardRows = {}
      var.rowGeneration = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 376
      var.detailW = var.contentW - 540
      var.detailScrollW = (var.detailW - 32) / 2
      var.taskScrollH = var.viewH - 850
    open: |-
      Packet.send(var.packetId, 'refresh')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 376
      var.detailW = var.contentW - 540
      var.detailScrollW = (var.detailW - 32) / 2
      var.taskScrollH = var.viewH - 850

controls:
  全屏玻璃底:
    type: Texture
    attribute: {point: '~stretch_all', normal: '~Frosted:18;226,220,204,240'}
  自适应全局布局:
    type: Adaptive
    attribute: {point: '~top_center', width: 1920, height: 1080}
    children:
      # Masthead and mission-status tabs: the atlas is not a shop-style sidebar.
      顶栏:
        type: Canvas
        attribute: {point: '~top_left', x: '-var.offX', width: 'var.viewW', height: 220}
        children:
          顶栏底:
            type: Texture
            attribute: {point: '~top_left', width: 'var.viewW', height: 120, normal: '~25,46,79,255', through: true}
          标题色块:
            type: Texture
            attribute: {point: '~top_left', x: 40, y: 32, width: 8, height: 56, normal: '~225,111,46,255', through: true}
          标题:
            type: Text
            attribute: {point: '~top_left', x: 68, y: 20, texts: '~&f远征导航', fontSize: 64, through: true}
          副标题:
            type: Text
            attribute: {point: '~top_left', x: 72, y: 82, texts: '~&7QUESTGPS / EXPEDITION ATLAS', fontSize: 36, through: true}
          导航状态:
            type: Text
            attribute: {point: '~top_right', x: -224, y: 26, texts: "var.navigationReady ? '&f导航系统 / 已就绪' : '&7导航系统 / 未就绪'", fontSize: 36, through: true}
          追踪摘要:
            type: Text
            attribute: {point: '~top_right', x: -224, y: 72, texts: "'&f' + var.trackSummary", fontSize: 36, limit: 32, through: true}
          关闭按钮:
            type: Canvas
            attribute: {point: '~top_right', x: -40, y: 30, width: 144, height: 60}
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute: {point: '~stretch_all', through: true, normal: '~42,67,104,255', shape: '~round_rect', radius: 6}
                effect:
                  stroke: {width: 1, color: "self.parent.isHovered() ? '237,143,72,255' : '129,148,168,255'"}
              关闭文字:
                type: Text
                attribute: {point: '~middle_center', texts: '~&f关闭 / ESC', fontSize: 36, through: true}
          导航可接取:
            type: Canvas
            attribute: {point: '~top_left', x: 40, y: 144, width: 272, height: 64}
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'switch_page', 'available')
            children:
              可接取底:
                type: Texture
                attribute: {point: '~stretch_all', through: true, normal: "var.pageId == 'available' ? '42,83,154,255' : '241,235,220,255'", shape: '~round_rect', radius: 6}
                effect:
                  ripple:
                  stroke: {width: 2, color: "self.parent.isHovered() ? '225,111,46,255' : '137,155,171,255'"}
              可接取高亮条:
                type: Texture
                attribute: {point: '~bottom_left', height: 4, width: 272, normal: '~225,111,46,255', visible: "var.pageId == 'available'", through: true}
              可接取文字:
                type: Text
                attribute: {point: '~middle_left', x: 20, texts: "var.pageId == 'available' ? '&f01 / 可接取' : '&001 / 可接取'", fontSize: 36, through: true}
              可接取数量:
                type: Text
                attribute: {point: '~middle_right', x: -20, texts: "(var.pageId == 'available' ? '&f' : '&8') + var.availableCount.round()", fontSize: 48, through: true}
          导航进行中:
            type: Canvas
            attribute: {point: '~top_left', x: 328, y: 144, width: 272, height: 64}
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'switch_page', 'active')
            children:
              进行中底:
                type: Texture
                attribute: {point: '~stretch_all', through: true, normal: "var.pageId == 'active' ? '42,83,154,255' : '241,235,220,255'", shape: '~round_rect', radius: 6}
                effect:
                  ripple:
                  stroke: {width: 2, color: "self.parent.isHovered() ? '225,111,46,255' : '137,155,171,255'"}
              进行中高亮条:
                type: Texture
                attribute: {point: '~bottom_left', height: 4, width: 272, normal: '~225,111,46,255', visible: "var.pageId == 'active'", through: true}
              进行中文字:
                type: Text
                attribute: {point: '~middle_left', x: 20, texts: "var.pageId == 'active' ? '&f02 / 进行中' : '&002 / 进行中'", fontSize: 36, through: true}
              进行中数量:
                type: Text
                attribute: {point: '~middle_right', x: -20, texts: "(var.pageId == 'active' ? '&f' : '&8') + var.activeCount.round()", fontSize: 48, through: true}
          导航已完成:
            type: Canvas
            attribute: {point: '~top_left', x: 616, y: 144, width: 272, height: 64}
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'switch_page', 'completed')
            children:
              已完成底:
                type: Texture
                attribute: {point: '~stretch_all', through: true, normal: "var.pageId == 'completed' ? '42,83,154,255' : '241,235,220,255'", shape: '~round_rect', radius: 6}
                effect:
                  ripple:
                  stroke: {width: 2, color: "self.parent.isHovered() ? '225,111,46,255' : '137,155,171,255'"}
              已完成高亮条:
                type: Texture
                attribute: {point: '~bottom_left', height: 4, width: 272, normal: '~225,111,46,255', visible: "var.pageId == 'completed'", through: true}
              已完成文字:
                type: Text
                attribute: {point: '~middle_left', x: 20, texts: "var.pageId == 'completed' ? '&f03 / 已完成' : '&003 / 已完成'", fontSize: 36, through: true}
              已完成数量:
                type: Text
                attribute: {point: '~middle_right', x: -20, texts: "(var.pageId == 'completed' ? '&f' : '&8') + var.completedCount.round()", fontSize: 48, through: true}
          流程提示:
            type: Text
            attribute: {point: '~top_right', x: -40, y: 162, texts: '~&8选择区域 / 查看任务 / 设置航点', fontSize: 36, through: true}

      # Region rail: independent filter scroll, fixed navigation legend below it.
      左侧导航:
        type: Canvas
        attribute: {point: '~top_left', x: '40 - var.offX', y: 244, width: 272, height: 'var.viewH - 276'}
        children:
          导航底:
            type: Texture
            attribute: {point: '~stretch_all', normal: '~211,206,190,255', shape: '~round_rect', radius: 6, through: true}
          分类标题:
            type: Text
            attribute: {point: '~top_left', x: 20, y: 20, texts: '~&0区域索引', fontSize: 48, through: true}
          分类说明:
            type: Text
            attribute: {point: '~top_left', x: 20, y: 66, texts: '~&8分类筛选 · 滚轮浏览', fontSize: 36, through: true}
          分类滚动:
            type: Scroll
            attribute: {point: '~top_left', x: 16, y: 116, width: 218, height: 'var.viewH - 548', moveY: "self.parent['分类滑块'].getDragYRatio()"}
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              分类列表:
                val: cat_list
                type: VStack
                attribute: {width: 218, spaceBetween: 10}
                children:
                  分类模板:
                    type: Canvas
                    attribute: {entryKey: none, entry: 'var.categories[self.entryKey]', visible: 'self.entryKey != none && self.entry != none', width: 218, height: 66, textAnim: none}
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'switch_category', self.entry['id'])
                      enter: |-
                        self.textAnim = Lerp(0, 1, 3000)
                      leave: |-
                        self.textAnim = none
                    children:
                      分类背景:
                        type: Texture
                        attribute: {point: '~top_left', x: 3, y: 3, width: 212, height: 60, through: true, normal: "self.parent.entry['selected'] ? '42,83,154,255' : '237,231,213,255'", shape: '~round_rect', radius: 4}
                        effect:
                          stroke: {width: 2, color: "self.parent.isHovered() ? '225,111,46,255' : '151,163,167,255'"}
                      分类文字:
                        type: Scroll
                        attribute: {point: '~top_left', x: 18, y: 15, width: 174, height: 36, moveX: 'self.parent.textAnim != none ? self.parent.textAnim.get() : 0', through: true}
                        children:
                          分类文字布局:
                            type: HStack
                            attribute: {height: 36, through: true}
                            children:
                              分类名称:
                                type: Text
                                attribute: {texts: "(self.parent.parent.parent.entry['selected'] ? '&f' : '&0') + self.parent.parent.parent.entry['name']", fontSize: 36, through: true}
                      选中航点:
                        type: Texture
                        attribute: {point: '~middle_right', x: -12, width: 6, height: 24, normal: '~225,111,46,255', visible: "self.parent.entry['selected']", through: true}
          分类滑块轨道:
            type: Texture
            attribute: {point: '~top_left', x: 246, y: 116, width: 10, height: 'var.viewH - 548', normal: '~183,184,172,255', shape: '~round_rect', radius: 4, through: true}
            effect:
              stroke: {width: 1, color: '~117,143,166,255'}
          分类滑块:
            type: Texture
            val: 分类滑块
            attribute: {point: '~top_left', x: 246, y: 116, width: 10, height: 56, maxDragY: 'var.viewH - 604', normal: '~42,83,154,255', shape: '~round_rect', radius: 4}
          航线图例:
            type: Canvas
            attribute: {point: '~bottom_left', x: 20, y: -20, width: 232, height: 116}
            children:
              图例线:
                type: Texture
                attribute: {point: '~top_left', width: 232, height: 1, normal: '~161,166,155,255', through: true}
              航点图例:
                type: Texture
                attribute: {point: '~top_left', x: 0, y: 28, width: 12, height: 12, normal: '~42,83,154,255', shape: '~circle', through: true}
              航点文字:
                type: Text
                attribute: {point: '~top_left', x: 28, y: 18, texts: '~&0钴蓝 / 当前选择', fontSize: 36, through: true}
              路线图例:
                type: Texture
                attribute: {point: '~top_left', x: 0, y: 76, width: 12, height: 4, normal: '~225,111,46,255', through: true}
              路线文字:
                type: Text
                attribute: {point: '~top_left', x: 28, y: 62, texts: '~&0橙线 / 追踪航线', fontSize: 36, through: true}

      # Main atlas sheet: readable index cards, a route brief and parallel objective/supply columns.
      内容区:
        type: Canvas
        attribute: {point: '~top_left', x: '336 - var.offX', y: 244, width: 'var.contentW', height: 'var.viewH - 276'}
        children:
          内容底:
            type: Texture
            attribute: {point: '~stretch_all', normal: '~244,239,225,255', shape: '~round_rect', radius: 6, through: true}
          页标题:
            type: Text
            attribute: {point: '~top_left', x: 24, y: 20, texts: '~&0任务航线', fontSize: 54, through: true}
