# 文件用途: 竞技场 / 枪战 PVP 风格 TAB HUD（红蓝双队左右分栏布局）。
# 对应 Tab 定义: tabs/arena.yml（ui-id: "tab-arena"，packet-handler: "tab"）。
# 消费 map 形态 pack（字典列表），每个元素含 team / uuid / name / status / health 字段。
# 布局: 顶部居中面板，左侧红队列表 + 右侧蓝队列表，中间分隔线。
# 特性: 常驻显示 + 按住 TAB 切换"详细模式"（额外显示血量），玩家头像 + 战斗状态图标。
ui:
  isHud: true  # 是否为 HUD（无界面容器，直接渲染到屏幕）
  hide:
  - player_list  # 隐藏原版 player_list 控件
  escClose: false  # 按 ESC 不关闭（HUD 常驻）
  defaultOpen: true  # 模块加载时默认打开此 HUD
  action:
    load: |-
      var.ArenaTAB刷新轮次 = 0
      var.ArenaTAB详细 = false
    # UI 加载时初始化变量
    # 按下 TAB 键: 请求服务端刷新并开启详细模式（显示血量）
    keyPress: |-
      if(self.currentKeyPress() == "TAB"){
        Packet.send("TAB","update")
        var.ArenaTAB详细 = true
      }
    # 松开 TAB 键: 关闭详细模式
    keyRelease: |-
      if(self.currentKeyReleased() == "TAB"){
        var.ArenaTAB详细 = false
      }
  packetHandler:
    # 竞技场 / 枪战 PVP 风格示例：消费 map 形态 pack（team / uuid / name / status / health）。
    # 服务端配置参考 ArcartXTab.yml 中的 tabs.arena，pack 字段：
    #   team:   "%player_scoreboardteam%"   分队来源（可替换为 BedWars / MatrixDuels 等 PAPI）
    #   uuid:   "{player_uuid}"             头像 PlayerSkin
    #   name:   "%axstab_pvp_color%%axstab_vanish_color%%player_name%"
    #   status: "%axstab_pvp%"              战斗中=1，UI 按值切图标
    #   health: "%player_health%/%player_max_health%"
    tab: |-
      i = 0
      var.ArenaTAB刷新轮次 = var.ArenaTAB刷新轮次 + 1
      while(val.RedList.childrenCount() > 1){
        val.RedList.get(1).remove()
      }
      while(val.BlueList.childrenCount() > 1){
        val.BlueList.get(1).remove()
      }
      //与 tab.yml 同款伪判断绕过 ax 控件复制 BUG（width 校验作为 sentinel）
      while(i < packet.size()){
        if(val.red_player_row.width == 320){
          if(packet.get(i).team == "red"){
            if(val.red_player_row != none){ ROW = val.red_player_row.copy('red_' + var.ArenaTAB刷新轮次 + '_' + i.round()) }
            ROW['头部'].normal = 'PlayerSkin:' + packet.get(i).uuid
            ROW['名称文字'].texts = packet.get(i).name
            //status 字段服务端发的是 "1" / "0"；UI 端转图标
            if(packet.get(i).status == "1"){
              ROW['状态文字'].texts = "&c⚔"
            } else {
              ROW['状态文字'].texts = "&7•"
            }
            ROW['血量文字'].texts = "&c❤ " + packet.get(i).health
            ROW.visible = true
          }elif(packet.get(i).team == "blue"){
            if(val.blue_player_row != none){ ROW = val.blue_player_row.copy('blue_' + var.ArenaTAB刷新轮次 + '_' + i.round()) }
            ROW['头部'].normal = 'PlayerSkin:' + packet.get(i).uuid
            ROW['名称文字'].texts = packet.get(i).name
            if(packet.get(i).status == "1"){
              ROW['状态文字'].texts = "&9⚔"
            } else {
              ROW['状态文字'].texts = "&7•"
            }
            ROW['血量文字'].texts = "&c❤ " + packet.get(i).health
            ROW.visible = true
          }
          //其他 team（含空 / spectator）跳过不渲染
        }
        i++
      }
      var.ArenaTAB红队人数 = val.RedList.childrenCount() - 1
      var.ArenaTAB蓝队人数 = val.BlueList.childrenCount() - 1
# ============ 控件定义 ============
controls:
  自适应全局布局:  # 顶层自适应布局，锚定屏幕顶部居中
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      ArenaTAB背景:  # 竞技场 TAB 毛玻璃背景面板，高度随队伍人数动态调整
        type: Canvas
        attribute:
          point: ~top_center
          width: 720
          height: 80 + 32 * math.max(var.ArenaTAB红队人数, var.ArenaTAB蓝队人数)  # 高度随最大队伍人数增长
          y: 30
        children:
          ArenaTAB背景背景:  # 毛玻璃背景纹理，stretch_all 填充父控件
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~Frosted:30;0,0,0,200  # 毛玻璃材质，30 模糊度，半透明黑
              shape: ~round_rect
              radius: 18
            effect:
              stroke:  # 描边
                width: 3
                color: ~0,0,0,255
          ArenaTAB标题文字:  # 红蓝对阵标题"RED vs BLUE"
            type: Text
            attribute:
              point: ~top_center
              width: 720
              texts: ~&cRED  &fvs  &9BLUE
              fontSize: 32
              through: true
          # ============ 红队（左侧）============
          RedGrid:  # 红队玩家列表（VGrid），packetHandler 动态复制 red_player_row 填充
            type: VGrid
            val: RedList
            attribute:
              spaceBetweenY: 2
              row: 16  # 每列最多 16 行
              y: 60
              x: 20
            children:
              red_player_row:  # 红队玩家行模板（Canvas），packetHandler 复制后填充头像/名称/状态/血量
                type: Canvas
                val: red_player_row
                attribute:
                  width: 320
                  height: 30
                  visible: false  # 默认隐藏，packetHandler 中设为 true
                children:
                  头部:  # 玩家头像（Texture），normal 设为 PlayerSkin:<uuid>
                    type: Texture
                    attribute:
                      width: 28
                      height: 28
                      x: 0
                      y: 0
                      shape: ~round_rect
                      radius: 4
                      normal: "~120,120,120,255"
                  名称文字:  # 玩家名称（含 PVP/vanish 颜色前缀）
                    type: Text
                    attribute:
                      x: 36
                      y: 0
                      fontSize: 26
                      texts: "~none"
                      lineSpace: 4
                  状态文字:  # 战斗状态图标（⚔ 战斗中 / · 正常）
                    type: Text
                    attribute:
                      x: 220
                      y: 0
                      fontSize: 26
                      texts: "~&7•"
                      lineSpace: 4
                  血量文字:  # 血量显示，仅详细模式（按住 TAB）可见
                    type: Text
                    attribute:
                      x: 250
                      y: 0
                      fontSize: 26
                      texts: "~none"
                      lineSpace: 4
                      visible: var.ArenaTAB详细
          # ============ 蓝队（右侧）============
          BlueGrid:  # 蓝队玩家列表（VGrid），packetHandler 动态复制 blue_player_row 填充
            type: VGrid
            val: BlueList
            attribute:
              spaceBetweenY: 2
              row: 16
              y: 60
              x: 380
            children:
              blue_player_row:  # 蓝队玩家行模板（Canvas），packetHandler 复制后填充头像/名称/状态/血量
                type: Canvas
                val: blue_player_row
                attribute:
                  width: 320
                  height: 30
                  visible: false  # 默认隐藏，packetHandler 中设为 true
                children:
                  头部:  # 玩家头像（Texture），normal 设为 PlayerSkin:<uuid>
                    type: Texture
                    attribute:
                      width: 28
                      height: 28
                      x: 0
                      y: 0
                      shape: ~round_rect
                      radius: 4
                      normal: "~120,120,120,255"
                  名称文字:  # 玩家名称（含 PVP/vanish 颜色前缀）
                    type: Text
                    attribute:
                      x: 36
                      y: 0
                      fontSize: 26
                      texts: "~none"
                      lineSpace: 4
                  状态文字:  # 战斗状态图标（⚔ 战斗中 / · 正常）
                    type: Text
                    attribute:
                      x: 220
                      y: 0
                      fontSize: 26
                      texts: "~&7•"
                      lineSpace: 4
                  血量文字:  # 血量显示，仅详细模式（按住 TAB）可见
                    type: Text
                    attribute:
                      x: 250
                      y: 0
                      fontSize: 26
                      texts: "~none"
                      lineSpace: 4
                      visible: var.ArenaTAB详细

