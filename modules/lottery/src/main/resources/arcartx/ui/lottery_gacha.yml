                  fontSize: 48
                  texts: "~卡池详情"
              详情信息:
                type: Text
                attribute:
                  point: ~top_center
                  y: 80
                  fontSize: 28
                  texts: "var.detailPoolName + '  |  5星保底:' + var.detailPity5 + '  |  4星保底:' + var.detailPity4 + '  |  5星概率:' + var.detailBase5Rate + '%  |  4星概率:' + var.detailBase4Rate + '%  |  UP概率:' + var.detailUpRate + '%'"
              UP物品图标:
                type: Slot
                attribute:
                  width: 40
                  height: 40
                  point: ~top_left
                  x: 30
                  y: 120
                  slotType: ~Icon
                  itemScale: 0.8
                  visible: "var.upItemIcon != '' and var.upItemIcon != none"
                  through: true
                action:
                  tick: |-
                    if(var.upItemIcon != '' and var.upItemIcon != none){
                      self.setItemIcon(var.upItemIcon)
                    }
              卡池描述:
                type: Text
                attribute:
                  point: ~top_left
                  x: 80
                  y: 125
                  width: 790
                  fontSize: 22
                  lineSpace: 26
                  visible: "var.poolDescription != '' and var.poolDescription != none"
                  texts: "var.poolDescription != none ? var.poolDescription : ''"
