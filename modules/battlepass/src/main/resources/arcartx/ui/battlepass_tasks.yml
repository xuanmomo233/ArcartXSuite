# AXS BattlePass 任务列表界面
# 打开方式: 主界面点击任务按钮 或 /bp tasks 命令
# 数据交互: packetHandler init/update
# 重制: 扩大面板至 1100x780，参考 lottery/market/warehouse 风格，三分类卡片 + 进度条 + 难度标签

ui:
  isHud: false
  background: true
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 界面初始化时接收服务端任务数据包，写入 UI 变量并动态生成三类任务列表子元素
    # 包字段:
    #   - packetId: 包标识符，用于后续 Packet.send 回传
    #   - dailyTasks: 每日任务数据映射（key 为序号，含 name/description/difficultyDisplay/progress/required/progressPercent/xpReward/completed 等字段）
    #   - weeklyTasks: 每周任务数据映射（字段结构同 dailyTasks）
    #   - seasonTasks: 赛季任务数据映射（字段结构同 dailyTasks）
    #   - dailyTaskCount: 当前已分配的每日任务数量
    #   - weeklyTaskCount: 当前已分配的每周任务数量
    #   - seasonTaskCount: 当前已分配的赛季任务数量
    #   - maxDailyCount: 每日任务最大可分配数量（用于动态生成列表项）
    #   - maxWeeklyCount: 每周任务最大可分配数量
    #   - maxSeasonCount: 赛季任务最大可分配数量
    init: |-
      var.packetId = packet['packetId']
      var.dailyTasks = packet['dailyTasks']
      var.weeklyTasks = packet['weeklyTasks']
      var.seasonTasks = packet['seasonTasks']
      var.dailyTaskCount = packet['dailyTaskCount']
      var.weeklyTaskCount = packet['weeklyTaskCount']
      var.seasonTaskCount = packet['seasonTaskCount']
      var.totalTaskCount = packet['totalTaskCount']
      var.dailyCompletedCount = packet['dailyCompletedCount']
      var.weeklyCompletedCount = packet['weeklyCompletedCount']
      var.seasonCompletedCount = packet['seasonCompletedCount']
      var.maxDailyCount = packet['maxDailyCount']
      var.maxWeeklyCount = packet['maxWeeklyCount']
      var.maxSeasonCount = packet['maxSeasonCount']
      while(val.每日任务列表.childrenCount() > 1){
        val.每日任务列表.get(1).remove()
      }
      // range(a,b) 左闭右闭，生成 a~b 含两端；模板在索引0，故复制 1~count-1 共 count-1 项
      for(i in range(1, var.maxDailyCount - 1)){
        key = i.round()
        e = val.每日任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
      while(val.每周任务列表.childrenCount() > 1){
        val.每周任务列表.get(1).remove()
      }
      for(i in range(1, var.maxWeeklyCount - 1)){
        key = i.round()
        e = val.每周任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
      while(val.赛季任务列表.childrenCount() > 1){
        val.赛季任务列表.get(1).remove()
      }
      for(i in range(1, var.maxSeasonCount - 1)){
        key = i.round()
        e = val.赛季任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
    # packetHandler: update
    # 数据更新时接收服务端任务数据包，刷新 UI 变量并重建任务列表子元素（字段与 init 相同）
    update: |-
      var.packetId = packet['packetId']
      var.dailyTasks = packet['dailyTasks']
      var.weeklyTasks = packet['weeklyTasks']
      var.seasonTasks = packet['seasonTasks']
      var.dailyTaskCount = packet['dailyTaskCount']
      var.weeklyTaskCount = packet['weeklyTaskCount']
      var.seasonTaskCount = packet['seasonTaskCount']
      var.totalTaskCount = packet['totalTaskCount']
      var.dailyCompletedCount = packet['dailyCompletedCount']
      var.weeklyCompletedCount = packet['weeklyCompletedCount']
      var.seasonCompletedCount = packet['seasonCompletedCount']
      var.maxDailyCount = packet['maxDailyCount']
      var.maxWeeklyCount = packet['maxWeeklyCount']
      var.maxSeasonCount = packet['maxSeasonCount']
      while(val.每日任务列表.childrenCount() > 1){
        val.每日任务列表.get(1).remove()
      }
      for(i in range(1, var.maxDailyCount - 1)){
        key = i.round()
        e = val.每日任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
      while(val.每周任务列表.childrenCount() > 1){
        val.每周任务列表.get(1).remove()
      }
      for(i in range(1, var.maxWeeklyCount - 1)){
        key = i.round()
        e = val.每周任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
      while(val.赛季任务列表.childrenCount() > 1){
        val.赛季任务列表.get(1).remove()
      }
      for(i in range(1, var.maxSeasonCount - 1)){
        key = i.round()
        e = val.赛季任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
    progress: |-
      var.packetId = packet['packetId']
      var.dailyTasks = packet['dailyTasks']
      var.weeklyTasks = packet['weeklyTasks']
      var.seasonTasks = packet['seasonTasks']
      var.dailyTaskCount = packet['dailyTaskCount']
      var.weeklyTaskCount = packet['weeklyTaskCount']
      var.seasonTaskCount = packet['seasonTaskCount']
      var.totalTaskCount = packet['totalTaskCount']
      var.dailyCompletedCount = packet['dailyCompletedCount']
      var.weeklyCompletedCount = packet['weeklyCompletedCount']
      var.seasonCompletedCount = packet['seasonCompletedCount']
  action:
    load: |-
      var.packetId = 'AXS_BATTLEPASS'
      var.dailyTasks = {}
      var.weeklyTasks = {}
      var.seasonTasks = {}
      var.dailyTaskCount = 0
      var.weeklyTaskCount = 0
      var.seasonTaskCount = 0
      var.totalTaskCount = 0
      var.dailyCompletedCount = 0
      var.weeklyCompletedCount = 0
      var.seasonCompletedCount = 0
      var.maxDailyCount = 0
      var.maxWeeklyCount = 0
      var.maxSeasonCount = 0
    # open action 不发任何包：数据由服务端 openTasks() 延迟2tick推送（修复 Java bug 后）
    open: |-
      {}

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1100
          height: 860
        children:
          # ── 面板背景层 ─────────────────────────────────────
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~28,30,42,244
              shape: ~round_rect
              radius: 24
            effect:
              gradient:
                color1: ~38,42,58,255
                color2: ~28,30,42,255
                type: 0
                angleDeg: 90
              stroke:
                width: 2
                color: ~90,170,255,150
          内描边:
            type: Texture
            attribute:
              point: ~middle_center
              width: 1084
              height: 764
              normal: ~0,0,0,0
              shape: ~round_rect
              radius: 20
              through: true
            effect:
              stroke:
                width: 1
                color: ~90,170,255,60
          顶部高光:
            type: Texture
            attribute:
              point: ~horizontal_stretch_top
              height: 160
              normal: ~255,255,255,0
              shape: ~round_rect
              radius: 24
              through: true
            effect:
              gradient:
                color1: ~90,170,255,30
                color2: ~90,170,255,0
                type: 0
                angleDeg: 90

          # ── 顶栏 ───────────────────────────────────────────
          顶栏:
            type: Canvas
            attribute:
              point: ~horizontal_stretch_top
              height: 80
            children:
              顶栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,255,255,14
                  shape: ~round_rect
                  radius: 22
              顶栏分隔线:
                type: Texture
                attribute:
                  point: ~horizontal_stretch_bottom
                  height: 2
                  normal: ~90,170,255,120
                  through: true
              顶栏高光:
                type: Texture
                attribute:
                  point: ~bottom_center
                  width: 360
                  height: 3
                  normal: ~120,200,255,220
                  shape: ~round_rect
                  radius: 2
                  through: true
                effect:
                  neon:
                    color: ~90,170,255,140
                    size: 8
                    intensity: 0.5
                    animated: false
              # 标题图标
              标题图标框:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 24
                  width: 44
                  height: 44
                  normal: ~50,56,76,240
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,180
              标题图标内:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 32
                  width: 28
                  height: 28
                  normal: ~90,170,255,220
                  shape: ~round_rect
                  radius: 8
                effect:
                  neon:
                    color: ~120,200,255,160
                    size: 8
                    intensity: 0.6
                    animated: false
              标题:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 80
                  texts: "~&e任务列表"
                  fontSize: 36
              标题竖线:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 260
                  width: 2
                  height: 30
                  normal: ~90,170,255,80
              任务统计:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 276
                  texts: "'&7每日 &f' + var.dailyTaskCount + ' &7| 每周 &f' + var.weeklyTaskCount + ' &7| 赛季 &f' + var.seasonTaskCount"
                  fontSize: 26
              # 关闭按钮：Canvas + Texture(背景) + Text(文字)
              关闭按钮:
                type: Canvas
                attribute:
                  point: ~top_right
                  x: -20
                  y: 18
                  width: 44
                  height: 44
                action:
                  clickLeft: |-
                    Screen.close()
                children:
                  关闭背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~60,40,40,220
                      hover: ~Frosted:0;200,70,70,240
                      shape: ~circle
                    effect:
                      stroke:
                        width: 2
                        color: ~255,100,100,140
                  关闭文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 44
                      texts: "~&f✕"
                      fontSize: 28

          # ── 滚动区 ─────────────────────────────────────────
          任务滑块:
            type: Texture
            val: 任务滑块
            attribute:
              point: ~top_right
              x: -18
              y: 96
              width: 6
              height: 50
              normal: ~90,170,255,220
              maxDragY: 650
              shape: ~round_rect
              radius: 3
            effect:
              neon:
                color: ~90,170,255,100
                size: 4
                intensity: 0.4
                animated: false
          滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 96
              width: 1052
              height: 660
              moveY: "self.parent['任务滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['任务滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['任务滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              任务总容器:
                val: 任务总容器
                type: VStack
                attribute:
                  width: 1052
                  spaceBetween: 20
                children:
                  # ══════════════════════════════════════════════
                  # 每日任务区
                  # ══════════════════════════════════════════════
                  每日任务区:
                    type: Canvas
                    attribute:
                      width: 1052
                      height: "var.dailyTaskCount > 0 ? (var.dailyTaskCount * 90 + 56) : 0"
                      visible: var.dailyTaskCount > 0
                    children:
                      每日区底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~42,46,62,200
                          shape: ~round_rect
                          radius: 18
                        effect:
                          stroke:
                            width: 1
                            color: ~90,170,255,60
                      每日区顶饰:
                        type: Texture
                        attribute:
                          point: ~top_center
                          y: 8
                          width: 80
                          height: 3
                          normal: ~90,200,255,220
                          shape: ~round_rect
                          radius: 2
                        effect:
                          neon:
                            color: ~90,200,255,120
                            size: 6
                            intensity: 0.4
                            animated: false
                      每日标题:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 20
                          y: 18
                          texts: "~&b&l每日任务"
                          fontSize: 32
                      每日计数:
                        type: Text
                        attribute:
                          point: ~top_right
                          x: -20
                          y: 22
                          texts: "'&7已完成 &f' + var.dailyCompletedCount + '&7/&f' + var.dailyTaskCount"
                          fontSize: 26
                      每日任务列表:
                        val: 每日任务列表
                        type: VStack
                        attribute:
                          point: ~top_left
                          x: 16
                          y: 56
                          width: 1020
                          spaceBetween: 8
                        children:
                          # 任务项：Canvas 容器，背景为子 Texture（stretch_all + through）
                          # 其他子控件（Text/Texture）可正确使用 point 锚点
                          任务项:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: var.dailyTasks[self.entryKey]
                              visible: self.entry != none
                              width: 1020
                              height: 82
                            children:
                              任务项背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '40,70,55,220' : '50,55,72,220'"
                                  shape: ~round_rect
                                  radius: 14
                                effect:
                                  stroke:
                                    width: 1
                                    color: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '100,200,130,140' : '90,170,255,60'"
                              # 难度标签：Canvas + Texture(背景) + Text(文字)
                              难度标签:
                                type: Canvas
                                attribute:
                                  point: ~top_left
                                  x: 12
                                  y: 12
                                  width: 64
                                  height: 28
                                children:
                                  难度背景:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: "self.parent.entry != none && self.parent.entry['difficulty'] == 'HARD' ? '160,60,60,220' : (self.parent.entry != none && self.parent.entry['difficulty'] == 'NORMAL' ? '180,140,50,220' : '60,140,80,220')"
                                      shape: ~round_rect
                                      radius: 14
                                  难度文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      width: 64
                                      texts: "self.parent.entry != none ? self.parent.entry['difficultyDisplay'] : none"
                                      fontSize: 20
                              # 任务名
                              任务名:
                                type: Text
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 10
                                  width: 700
                                  texts: "self.parent.entry != none ? '&f' + self.parent.entry['name'] : none"
                                  fontSize: 28
                                  limit: 24
                              # XP 奖励
                              任务奖励:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -16
                                  y: 12
                                  texts: "self.parent.entry != none ? '&e+' + self.parent.entry['xpReward'] + ' XP' : none"
                                  fontSize: 24
                              # 任务描述
                              任务描述:
                                type: Text
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 40
                                  width: 800
                                  texts: "self.parent.entry != none ? '&8' + self.parent.entry['description'] : none"
                                  fontSize: 22
                                  limit: 36
                              # 进度条背景
                              进度条背景:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 64
                                  width: 700
                                  height: 10
                                  normal: ~20,22,32,200
                                  shape: ~round_rect
                                  radius: 5
                                effect:
                                  stroke:
                                    width: 1
                                    color: ~90,170,255,40
                              # 进度条填充
                              进度条填充:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 64
                                  width: "self.parent.entry != none && type.toNumber(self.parent.entry['progressRatio']) > 0 ? type.toNumber(self.parent.entry['progressRatio']) * 700 : 0"
                                  height: 10
                                  normal: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '100,200,130,255' : '90,170,255,255'"
                                  shape: ~round_rect
                                  radius: 5
                                effect:
                                  gradient:
                                    color1: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '120,200,130,255' : '120,200,255,255'"
                                    color2: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '70,160,100,255' : '70,140,220,255'"
                                    type: 0
                                    angleDeg: 0
                              # 进度文字
                              任务进度:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -16
                                  y: 56
                                  texts: "self.parent.entry != none ? '&7' + self.parent.entry['progress'] + '/' + self.parent.entry['required'] + ' &8(' + self.parent.entry['progressPercent'] + ')' : none"
                                  fontSize: 22
                              # 完成标记
                              完成标记:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -130
                                  y: 56
                                  texts: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '&a✔ 已完成' : '&7进行中'"
                                  fontSize: 22

                  # ══════════════════════════════════════════════
                  # 每周任务区
                  # ══════════════════════════════════════════════
                  每周任务区:
                    type: Canvas
                    attribute:
                      width: 1052
                      height: "var.weeklyTaskCount > 0 ? (var.weeklyTaskCount * 90 + 56) : 0"
                      visible: var.weeklyTaskCount > 0
                    children:
                      每周区底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~42,46,62,200
                          shape: ~round_rect
                          radius: 18
                        effect:
                          stroke:
                            width: 1
                            color: ~255,180,100,60
                      每周区顶饰:
                        type: Texture
                        attribute:
                          point: ~top_center
                          y: 8
                          width: 80
                          height: 3
                          normal: ~255,200,120,220
                          shape: ~round_rect
                          radius: 2
                        effect:
                          neon:
                            color: ~255,180,100,120
                            size: 6
                            intensity: 0.4
                            animated: false
                      每周标题:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 20
                          y: 18
                          texts: "~&6&l每周任务"
                          fontSize: 32
                      每周计数:
                        type: Text
                        attribute:
                          point: ~top_right
                          x: -20
                          y: 22
                          texts: "'&7已完成 &f' + var.weeklyCompletedCount + '&7/&f' + var.weeklyTaskCount"
                          fontSize: 26
                      每周任务列表:
                        val: 每周任务列表
                        type: VStack
                        attribute:
                          point: ~top_left
                          x: 16
                          y: 56
                          width: 1020
                          spaceBetween: 8
                        children:
                          任务项:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: var.weeklyTasks[self.entryKey]
                              visible: self.entry != none
                              width: 1020
                              height: 82
                            children:
                              任务项背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '40,70,55,220' : '50,55,72,220'"
                                  shape: ~round_rect
                                  radius: 14
                                effect:
                                  stroke:
                                    width: 1
                                    color: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '100,200,130,140' : '255,180,100,60'"
                              难度标签:
                                type: Canvas
                                attribute:
                                  point: ~top_left
                                  x: 12
                                  y: 12
                                  width: 64
                                  height: 28
                                children:
                                  难度背景:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: "self.parent.entry != none && self.parent.entry['difficulty'] == 'HARD' ? '160,60,60,220' : (self.parent.entry != none && self.parent.entry['difficulty'] == 'NORMAL' ? '180,140,50,220' : '60,140,80,220')"
                                      shape: ~round_rect
                                      radius: 14
                                  难度文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      width: 64
                                      texts: "self.parent.entry != none ? self.parent.entry['difficultyDisplay'] : none"
                                      fontSize: 20
                              任务名:
                                type: Text
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 10
                                  width: 700
                                  texts: "self.parent.entry != none ? '&f' + self.parent.entry['name'] : none"
                                  fontSize: 28
                                  limit: 24
                              任务奖励:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -16
                                  y: 12
                                  texts: "self.parent.entry != none ? '&e+' + self.parent.entry['xpReward'] + ' XP' : none"
                                  fontSize: 24
                              任务描述:
                                type: Text
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 40
                                  width: 800
                                  texts: "self.parent.entry != none ? '&8' + self.parent.entry['description'] : none"
                                  fontSize: 22
                                  limit: 36
                              进度条背景:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 64
                                  width: 700
                                  height: 10
                                  normal: ~20,22,32,200
                                  shape: ~round_rect
                                  radius: 5
                                effect:
                                  stroke:
                                    width: 1
                                    color: ~255,180,100,40
                              进度条填充:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 64
                                  width: "self.parent.entry != none && type.toNumber(self.parent.entry['progressRatio']) > 0 ? type.toNumber(self.parent.entry['progressRatio']) * 700 : 0"
                                  height: 10
                                  normal: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '100,200,130,255' : '255,180,100,255'"
                                  shape: ~round_rect
                                  radius: 5
                                effect:
                                  gradient:
                                    color1: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '120,200,130,255' : '255,210,120,255'"
                                    color2: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '70,160,100,255' : '200,140,60,255'"
                                    type: 0
                                    angleDeg: 0
                              任务进度:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -16
                                  y: 56
                                  texts: "self.parent.entry != none ? '&7' + self.parent.entry['progress'] + '/' + self.parent.entry['required'] + ' &8(' + self.parent.entry['progressPercent'] + ')' : none"
                                  fontSize: 22
                              完成标记:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -130
                                  y: 56
                                  texts: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '&a✔ 已完成' : '&7进行中'"
                                  fontSize: 22

                  # ══════════════════════════════════════════════
                  # 赛季任务区
                  # ══════════════════════════════════════════════
                  赛季任务区:
                    type: Canvas
                    attribute:
                      width: 1052
                      height: "var.seasonTaskCount > 0 ? (var.seasonTaskCount * 90 + 56) : 0"
                      visible: var.seasonTaskCount > 0
                    children:
                      赛季区底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~42,46,62,200
                          shape: ~round_rect
                          radius: 18
                        effect:
                          stroke:
                            width: 1
                            color: ~200,140,255,60
                      赛季区顶饰:
                        type: Texture
                        attribute:
                          point: ~top_center
                          y: 8
                          width: 80
                          height: 3
                          normal: ~220,160,255,220
                          shape: ~round_rect
                          radius: 2
                        effect:
                          neon:
                            color: ~200,140,255,120
                            size: 6
                            intensity: 0.4
                            animated: false
                      赛季标题:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 20
                          y: 18
                          texts: "~&d&l赛季任务"
                          fontSize: 32
                      赛季计数:
                        type: Text
                        attribute:
                          point: ~top_right
                          x: -20
                          y: 22
                          texts: "'&7已完成 &f' + var.seasonCompletedCount + '&7/&f' + var.seasonTaskCount"
                          fontSize: 26
                      赛季任务列表:
                        val: 赛季任务列表
                        type: VStack
                        attribute:
                          point: ~top_left
                          x: 16
                          y: 56
                          width: 1020
                          spaceBetween: 8
                        children:
                          任务项:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: var.seasonTasks[self.entryKey]
                              visible: self.entry != none
                              width: 1020
                              height: 82
                            children:
                              任务项背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '40,70,55,220' : '50,55,72,220'"
                                  shape: ~round_rect
                                  radius: 14
                                effect:
                                  stroke:
                                    width: 1
                                    color: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '100,200,130,140' : '200,140,255,60'"
                              难度标签:
                                type: Canvas
                                attribute:
                                  point: ~top_left
                                  x: 12
                                  y: 12
                                  width: 64
                                  height: 28
                                children:
                                  难度背景:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: "self.parent.entry != none && self.parent.entry['difficulty'] == 'HARD' ? '160,60,60,220' : (self.parent.entry != none && self.parent.entry['difficulty'] == 'NORMAL' ? '180,140,50,220' : '60,140,80,220')"
                                      shape: ~round_rect
                                      radius: 14
                                  难度文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      width: 64
                                      texts: "self.parent.entry != none ? self.parent.entry['difficultyDisplay'] : none"
                                      fontSize: 20
                              任务名:
                                type: Text
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 10
                                  width: 700
                                  texts: "self.parent.entry != none ? '&f' + self.parent.entry['name'] : none"
                                  fontSize: 28
                                  limit: 24
                              任务奖励:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -16
                                  y: 12
                                  texts: "self.parent.entry != none ? '&e+' + self.parent.entry['xpReward'] + ' XP' : none"
                                  fontSize: 24
                              任务描述:
                                type: Text
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 40
                                  width: 800
                                  texts: "self.parent.entry != none ? '&8' + self.parent.entry['description'] : none"
                                  fontSize: 22
                                  limit: 36
                              进度条背景:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 64
                                  width: 700
                                  height: 10
                                  normal: ~20,22,32,200
                                  shape: ~round_rect
                                  radius: 5
                                effect:
                                  stroke:
                                    width: 1
                                    color: ~200,140,255,40
                              进度条填充:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 88
                                  y: 64
                                  width: "self.parent.entry != none && type.toNumber(self.parent.entry['progressRatio']) > 0 ? type.toNumber(self.parent.entry['progressRatio']) * 700 : 0"
                                  height: 10
                                  normal: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '100,200,130,255' : '200,140,255,255'"
                                  shape: ~round_rect
                                  radius: 5
                                effect:
                                  gradient:
                                    color1: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '120,200,130,255' : '220,160,255,255'"
                                    color2: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '70,160,100,255' : '160,100,200,255'"
                                    type: 0
                                    angleDeg: 0
                              任务进度:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -16
                                  y: 56
                                  texts: "self.parent.entry != none ? '&7' + self.parent.entry['progress'] + '/' + self.parent.entry['required'] + ' &8(' + self.parent.entry['progressPercent'] + ')' : none"
                                  fontSize: 22
                              完成标记:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -130
                                  y: 56
                                  texts: "self.parent.entry != none && self.parent.entry['completed'] == 'true' ? '&a✔ 已完成' : '&7进行中'"
                                  fontSize: 22

                  # 空状态提示
                  空状态:
                    type: Canvas
                    attribute:
                      width: 1052
                      height: 120
                      visible: var.totalTaskCount == 0
                    children:
                      空状态底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~42,46,62,180
                          shape: ~round_rect
                          radius: 18
                        effect:
                          stroke:
                            width: 1
                            color: ~90,170,255,60
                      空状态文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 1052
                          texts: "~&7暂无任务，请稍后再来"
                          fontSize: 32

          # ── 底部操作栏 ───────────────────────────────────────
          底部操作栏:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 24
              y: -24
              width: 1052
              height: 56
            children:
              操作栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~24,26,38,200
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 1
                    color: ~90,170,255,60
              # 刷新按钮
              刷新按钮:
                type: Canvas
                attribute:
                  point: ~middle_center
                  x: 0
                  width: 180
                  height: 40
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'refresh_tasks')
                children:
                  背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~50,55,72,220
                      hover: ~70,80,105,240
                      shape: ~round_rect
                      radius: 20
                  文本:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 180
                      texts: "~&f&l刷新"
                      fontSize: 22
                      through: true
              # 返回战令按钮（左侧）
              返回战令按钮:
                type: Canvas
                attribute:
                  point: ~middle_left
                  x: 16
                  width: 180
                  height: 40
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'open_main')
                children:
                  返回战令背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~50,55,72,220
                      hover: ~70,80,105,240
                      shape: ~round_rect
                      radius: 20
                    effect:
                      ripple:
                      stroke:
                        width: 1
                        color: ~120,140,180,180
                  返回战令文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 180
                      texts: "~&f&l◀ 返回战令"
                      fontSize: 22
                      through: true
              # 查看奖励按钮（右侧，强调色）
              查看奖励按钮:
                type: Canvas
                attribute:
                  point: ~middle_right
                  x: -16
                  width: 180
                  height: 40
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'open_rewards')
                children:
                  查看奖励背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~90,160,100,240
                      hover: ~110,200,130,255
                      shape: ~round_rect
                      radius: 20
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: ~140,235,170,220
                  查看奖励文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 180
                      texts: "~&f&l查看奖励 ▶"
                      fontSize: 22
                      through: true
