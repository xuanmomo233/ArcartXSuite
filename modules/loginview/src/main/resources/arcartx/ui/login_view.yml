# AXS LoginView — focused gateway / quiet slate and golden signal.
# Packet contracts and authentication behavior are intentionally unchanged.
ui:
  isHud: false
  hide:
    - HUD
    - online
    - 聊天栏
    - 纯色块HUD
    - 纯色块HUD二改
  itemSize: 16
  through: false
  escClose: false
  background: true
  closeDied: true
  show: true
  jei: false
  level: 20
  screenScale: true
  action:
    load: |-
      var.maxPlayers = 0
      var.online = 0
      var.packetId = 'AXS_loginview'
      var.agreed = false
      var.showRules = false
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
  packetHandler:
    result: |-
      var.result = packet['message']
      var.resultAlpha = TwoLerp(1, 1, 0, 2000, 1000)
      var.lastSuccess = packet['success']
      if (var.lastSuccess && var.type == 'change') {
        var.type = 'login'
        var.title = '登录服务器'
        var.oldPassword = none
        var.newPassword = none
        var.changeConfirmPassword = none
      }
    init: |-
      var.resultAlpha = 0
      var.packetId = packet['packetId']
      var.type = packet['type']
      var.title = packet['title']
      var.mode = packet['mode']
      var.registered = packet['registered']
      var.playerName = packet['playerName']
      var.serverName = packet['serverName']
      var.online = packet['online']
      var.maxPlayers = packet['maxPlayers']
      var.address = packet['address']
      var.time = packet['time']
      var.premiumBypass = packet['premiumBypass']
      var.qqBound = packet['qqBound']
      var.bindPrompt = packet['bindPrompt']
      var.result = packet['message']
      var.password = none
      var.confirmPassword = none
      var.oldPassword = none
      var.newPassword = none
      var.changeConfirmPassword = none
      var.bindCode = none
      var.agreed = false
      var.showRules = false
      var.requireTerms = packet['requireTerms']
    close: "var.result = packet['message']"
  defaultOpen: false
controls:
  全屏底色:
    type: Texture
    attribute: {point: ~stretch_all, normal: '~15,22,29,245'}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶部标识:
        type: Canvas
        attribute: {x: "56 - var.offX", y: 32, width: "var.viewW - 112", height: 48}
        children:
          信号:
            type: Texture
            attribute: {x: 0, y: 12, width: 8, height: 24, normal: '~224,184,100,255', through: true}
          品牌:
            type: Text
            attribute: {x: 24, y: 4, texts: ~&fArcartX &7/ &eACCOUNT GATEWAY, fontSize: 36, through: true}
          页码:
            type: Text
            attribute: {point: ~middle_right, texts: ~&701 &f/ 身份通行, fontSize: 36, through: true}
      面板:
        type: Canvas
        attribute: {x: 260, y: "(var.viewH - 840) / 2", width: 1400, height: 840}
        children:
          背景:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~25,34,44,255', shape: ~round_rect, radius: 18}
            effect:
              stroke: {width: 2, color: '~66,80,93,255'}
          账号概览:
            type: Canvas
            attribute: {x: 0, y: 0, width: 420, height: 840}
            children:
              账号底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~20,29,38,255', shape: ~round_rect, radius: 18}
              导向条:
                type: Texture
                attribute: {x: 38, y: 44, width: 48, height: 6, normal: '~224,184,100,255', through: true}
              区域标识:
                type: Text
                attribute: {x: 38, y: 76, texts: ~&e01 / 账号概览, fontSize: 36, through: true}
              欢迎:
                type: Text
                attribute: {x: 38, y: 130, texts: ~&f欢迎来到, fontSize: 54, through: true}
              服务器名:
                type: Text
                attribute: {x: 38, y: 182, texts: "'&f' + var.serverName", fontSize: 48, limit: 18, through: true}
              玩家标签:
                type: Text
                attribute: {x: 38, y: 280, texts: ~&7当前账号, fontSize: 36, through: true}
              玩家名:
                type: Text
                attribute: {x: 38, y: 318, texts: "'&f' + var.playerName", fontSize: 36, through: true}
              账号状态:
                type: Text
                attribute: {x: 38, y: 372, texts: "var.registered ? '&7已有账号 · 欢迎回来' : '&e新账号 · 完成注册后进入'", fontSize: 36, visible: "var.type != none", through: true}
              分隔线:
                type: Texture
                attribute: {x: 38, y: 432, width: 344, height: 2, normal: '~64,79,92,255', through: true}
              在线标签:
                type: Text
                attribute: {x: 38, y: 462, texts: ~&7当前在线, fontSize: 36, through: true}
              在线人数:
                type: Text
                attribute: {x: 38, y: 500, texts: "'&e' + var.online.round() + ' &7/ ' + var.maxPlayers.round()", fontSize: 54, through: true}
              地址标签:
                type: Text
                attribute: {x: 38, y: 574, texts: ~&7当前连接 IP, fontSize: 36, through: true}
              地址:
                type: Text
                attribute: {x: 38, y: 612, texts: "'&f' + var.address", fontSize: 36, limit: 26, through: true}
              安全提醒:
                type: Text
                attribute: {x: 38, y: 678, texts: ~&7请勿向他人提供账号密码。, fontSize: 36, through: true}
              退出服务器:
                type: Canvas
                attribute: {x: 38, y: 750, width: 344, height: 52}
                action:
                  clickLeft: Game.quit()
                children:
                  退出服务器背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~35,44,54,255', hover: '~71,44,43,255', through: true, shape: ~round_rect, radius: 8}
                    effect:
                      stroke: {width: 1, color: '~91,102,112,255'}
                  退出服务器文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: ~&7退出服务器, fontSize: 36, through: true}
          通行表单:
            type: Canvas
            attribute: {x: 452, y: 0, width: 916, height: 840}
            children:
              通行标识:
                type: Text
                attribute: {x: 32, y: 36, texts: ~&e02 / 通行验证, fontSize: 36, through: true}
              标题:
                type: Text
                attribute: {x: 32, y: 82, texts: "'&f' + var.title", fontSize: 64, through: true}
              读取状态:
                type: Text
                attribute: {x: 32, y: 144, texts: ~&7正在读取账号状态，请稍候。, fontSize: 36, visible: "var.type == none", through: true}
              登录说明:
                type: Text
                attribute: {x: 32, y: 144, texts: ~&7输入账号密码，验证后进入服务器。, fontSize: 36, visible: "var.type == 'login'", through: true}
              注册说明:
                type: Text
                attribute: {x: 32, y: 144, texts: ~&7设置密码并再次确认，创建你的通行凭证。, fontSize: 36, visible: "var.type == 'register'", through: true}
              改密说明:
                type: Text
                attribute: {x: 32, y: 144, texts: ~&7验证旧密码后更新；请勿与其他账号共用密码。, fontSize: 36, visible: "var.type == 'change'", through: true}
              登录字段标签:
                type: Text
                attribute: {x: 32, y: 202, texts: ~&f账号密码, fontSize: 36, visible: "var.type == 'login'", through: true}
              登录密码容器:
                type: Canvas
                attribute: {x: 32, y: 244, width: 852, height: 64, visible: "var.type == 'login'"}
                children:
                  输入底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                    effect:
                      stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
                  登录密码:
                    type: TextBox
                    attribute: {x: 16, y: 12, width: 820, height: 40, length: 64, emptyText: ~输入密码, fontSize: 36, passwordChar: ~※}
                    action:
                      textChange: var.password = self.getContent()
              注册字段标签:
                type: Text
                attribute: {x: 32, y: 196, texts: ~&f设置密码, fontSize: 36, visible: "var.type == 'register'", through: true}
              注册密码容器:
                type: Canvas
                attribute: {x: 32, y: 232, width: 852, height: 64, visible: "var.type == 'register'"}
                children:
                  输入底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                    effect:
                      stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
                  注册密码:
                    type: TextBox
                    attribute: {x: 16, y: 12, width: 820, height: 40, length: 64, emptyText: ~设置密码, fontSize: 36, passwordChar: ~※}
                    action:
                      textChange: var.password = self.getContent()
              注册确认标签:
                type: Text
                attribute: {x: 32, y: 316, texts: ~&f再次确认, fontSize: 36, visible: "var.type == 'register'", through: true}
              注册确认容器:
                type: Canvas
                attribute: {x: 32, y: 352, width: 852, height: 64, visible: "var.type == 'register'"}
                children:
                  输入底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                    effect:
                      stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
                  注册确认:
                    type: TextBox
                    attribute: {x: 16, y: 12, width: 820, height: 40, length: 64, emptyText: ~再次输入密码, fontSize: 36, passwordChar: ~※}
                    action:
                      textChange: var.confirmPassword = self.getContent()
              登录须知:
                type: Canvas
                attribute: {x: 32, y: 438, width: 852, height: 46, visible: "(var.type == 'login' || var.type == 'register' || var.type == 'bypass') && var.requireTerms"}
                action:
                  click: var.showRules = true
                children:
                  条款底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~32,43,52,255', hover: '~48,59,67,255', through: true, shape: ~round_rect, radius: 6}
                  方框:
                    type: Texture
                    attribute: {x: 16, y: 14, width: 18, height: 18, normal: "var.agreed ? '224,184,100,255' : '32,43,52,255'", through: true}
                    effect:
                      stroke: {width: 1, color: '~224,184,100,255'}
                  须知文字:
                    type: Text
                    attribute: {point: ~middle_left, x: 48, texts: "var.agreed ? '&e已同意 &f服务器游玩须知 · 点击重读' : '&f阅读并同意服务器游玩须知 &e>'", fontSize: 36, through: true}
              登录按钮:
                type: Canvas
                attribute: {x: 32, y: 510, width: 852, height: 64, visible: "var.type == 'login'"}
                action:
                  clickLeft: "Packet.send(var.packetId, 'login', var.password, var.agreed)"
                children:
                  登录按钮背景:
                    type: Texture
                    attribute: {point: ~stretch_all, through: true, normal: '~224,184,100,255', hover: '~245,207,134,255', shape: ~round_rect, radius: 8}
                  登录按钮文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: ~&0验证并登录  >, fontSize: 48, through: true}
              切换修改密码:
                type: Canvas
                attribute: {x: 32, y: 594, width: 852, height: 52, visible: "var.type == 'login'"}
                action:
                  clickLeft: |-
                    var.type = 'change'
                    var.title = '修改密码'
                    var.result = none
                    var.password = none
                    var.oldPassword = none
                    var.newPassword = none
                    var.changeConfirmPassword = none
                children:
                  切换修改密码背景:
                    type: Texture
                    attribute: {point: ~stretch_all, through: true, normal: '~36,47,59,255', hover: '~50,64,77,255', shape: ~round_rect, radius: 8}
                    effect:
                      stroke: {width: 1, color: '~91,107,122,255'}
                  切换修改密码文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: ~&f修改账号密码, fontSize: 36, through: true}
              免登录状态:
                type: Canvas
                attribute: {x: 32, y: 218, width: 852, height: 174, visible: "var.type == 'bypass'"}
                children:
                  状态底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~29,48,45,255', shape: ~round_rect, radius: 10}
                  状态信号:
                    type: Texture
                    attribute: {x: 24, y: 28, width: 6, height: 112, normal: '~134,187,152,255', through: true}
                  免登录提示:
                    type: Text
                    attribute: {x: 54, y: 30, texts: ~&a身份已验证, fontSize: 54, through: true}
                  免登说明:
                    type: Text
                    attribute: {x: 54, y: 92, texts: ~&f无需输入密码，可直接进入服务器。, fontSize: 36, through: true}
                  绑定状态:
                    type: Text
                    attribute: {x: 54, y: 132, texts: "var.qqBound ? '&7绑定要求已满足' : '&7请按服务器提示完成验证'", fontSize: 36, through: true}
              进入服务器:
                type: Canvas
                attribute: {x: 32, y: 510, width: 852, height: 64, visible: "var.type == 'bypass'"}
                action:
                  clickLeft: "Packet.send(var.packetId, 'bypass_enter', var.agreed)"
                children:
                  进入服务器背景:
                    type: Texture
                    attribute: {point: ~stretch_all, through: true, normal: '~224,184,100,255', hover: '~245,207,134,255', shape: ~round_rect, radius: 8}
                  进入服务器文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: ~&0进入服务器  >, fontSize: 48, through: true}
              绑定说明:
                type: Text
                attribute: {x: 32, y: 144, texts: ~&e身份已验证 · 完成 QQ 绑定后继续。, fontSize: 36, visible: "var.type == 'bypass_unbound'", through: true}
              绑定提示区:
                type: Canvas
                attribute: {x: 32, y: 198, width: 852, height: 158, visible: "var.type == 'bypass_unbound'"}
                children:
                  提示底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~37,43,45,255', shape: ~round_rect, radius: 8}
                  提示滑轨:
                    type: Texture
                    attribute: {x: 828, y: 12, width: 8, height: 134, normal: '~60,72,82,255', through: true}
                  提示滑块:
                    type: Texture
                    attribute: {x: 828, y: 12, width: 8, height: 44, maxDragY: 90, normal: '~224,184,100,255'}
                  绑定提示滚动栏:
                    type: Scroll
                    attribute: {x: 20, y: 12, width: 792, height: 134, moveY: "self.parent['提示滑块'].getDragYRatio()"}
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['提示滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['提示滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      提示内容:
                        type: VStack
                        attribute: {width: 792}
                        children:
                          绑定提示:
                            type: Text
                            attribute: {texts: var.bindPrompt, fontSize: 36, limit: 38, through: true}
              绑定码容器:
                type: Canvas
                attribute: {x: 32, y: 390, width: 852, height: 64, visible: "var.type == 'bypass_unbound'"}
                children:
                  输入底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                    effect:
                      stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
                  绑定码输入框:
                    type: TextBox
                    attribute: {x: 16, y: 12, width: 820, height: 40, length: 6, emptyText: ~输入 6 位绑定验证码, fontSize: 36}
                    action:
                      textChange: var.bindCode = self.getContent()
              确认绑定:
                type: Canvas
                attribute: {x: 32, y: 510, width: 852, height: 64, visible: "var.type == 'bypass_unbound'"}
                action:
                  clickLeft: "Packet.send(var.packetId, 'bind_code', var.bindCode)"
                children:
                  确认绑定背景:
                    type: Texture
                    attribute: {point: ~stretch_all, through: true, normal: '~224,184,100,255', hover: '~245,207,134,255', shape: ~round_rect, radius: 8}
                  确认绑定文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: ~&0确认绑定  >, fontSize: 48, through: true}
              注册按钮:
                type: Canvas
                attribute: {x: 32, y: 510, width: 852, height: 64, visible: "var.type == 'register'"}
                action:
                  clickLeft: "Packet.send(var.packetId, 'register', var.password, var.confirmPassword, var.agreed)"
                children:
                  注册按钮背景:
                    type: Texture
                    attribute: {point: ~stretch_all, through: true, normal: '~224,184,100,255', hover: '~245,207,134,255', shape: ~round_rect, radius: 8}
                  注册按钮文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: ~&0注册并登录  >, fontSize: 48, through: true}
              旧密码容器:
                type: Canvas
                attribute: {x: 32, y: 214, width: 852, height: 64, visible: "var.type == 'change'"}
                children:
                  输入底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                    effect:
                      stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
                  修改旧密码:
                    type: TextBox
                    attribute: {x: 16, y: 12, width: 820, height: 40, length: 64, emptyText: ~旧密码, fontSize: 36, passwordChar: ~※}
                    action:
                      textChange: var.oldPassword = self.getContent()
              新密码容器:
                type: Canvas
                attribute: {x: 32, y: 310, width: 852, height: 64, visible: "var.type == 'change'"}
                children:
                  输入底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                    effect:
                      stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
                  修改新密码:
                    type: TextBox
                    attribute: {x: 16, y: 12, width: 820, height: 40, length: 64, emptyText: ~新密码, fontSize: 36, passwordChar: ~※}
                    action:
                      textChange: var.newPassword = self.getContent()
              改密确认容器:
                type: Canvas
                attribute: {x: 32, y: 406, width: 852, height: 64, visible: "var.type == 'change'"}
                children:
                  输入底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                    effect:
                      stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
                  修改确认:
                    type: TextBox
                    attribute: {x: 16, y: 12, width: 820, height: 40, length: 64, emptyText: ~再次输入新密码, fontSize: 36, passwordChar: ~※}
                    action:
                      textChange: var.changeConfirmPassword = self.getContent()
              修改按钮:
                type: Canvas
                attribute: {x: 32, y: 510, width: 852, height: 64, visible: "var.type == 'change'"}
                action:
                  clickLeft: "Packet.send(var.packetId, 'change_password', var.oldPassword, var.newPassword, var.changeConfirmPassword)"
                children:
                  修改按钮背景:
                    type: Texture
                    attribute: {point: ~stretch_all, through: true, normal: '~224,184,100,255', hover: '~245,207,134,255', shape: ~round_rect, radius: 8}
                  修改按钮文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: ~&0保存新密码, fontSize: 48, through: true}
              返回登录:
                type: Canvas
                attribute: {x: 32, y: 594, width: 852, height: 52, visible: "var.type == 'change'"}
                action:
                  clickLeft: |-
                    var.type = 'login'
                    var.title = '登录服务器'
                    var.result = none
                    var.oldPassword = none
                    var.newPassword = none
                    var.changeConfirmPassword = none
                children:
                  返回登录背景:
                    type: Texture
                    attribute: {point: ~stretch_all, through: true, normal: '~36,47,59,255', hover: '~50,64,77,255', shape: ~round_rect, radius: 8}
                    effect:
                      stroke: {width: 1, color: '~91,107,122,255'}
                  返回登录文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: ~&f< 返回登录, fontSize: 36, through: true}
              反馈区:
                type: Canvas
                attribute: {x: 32, y: 686, width: 852, height: 114}
                children:
                  反馈底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~21,30,39,255', shape: ~round_rect, radius: 8}
                  反馈标签:
                    type: Text
                    attribute: {x: 18, y: 12, texts: ~&7服务器反馈, fontSize: 36, through: true}
                  反馈滑轨:
                    type: Texture
                    attribute: {x: 826, y: 52, width: 6, height: 50, normal: '~60,72,82,255', visible: "var.result != none && var.result != ''", through: true}
                  反馈滑块:
                    type: Texture
                    attribute: {x: 826, y: 52, width: 6, height: 20, maxDragY: 30, normal: '~224,184,100,255', visible: "var.result != none && var.result != ''"}
                  反馈滚动栏:
                    type: Scroll
                    attribute: {x: 18, y: 52, width: 790, height: 50, moveY: "self.parent['反馈滑块'].getDragYRatio()", visible: "var.result != none && var.result != ''"}
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['反馈滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['反馈滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      反馈内容:
                        type: VStack
                        attribute: {width: 790}
                        children:
                          结果:
                            type: Text
                            attribute: {texts: var.result, fontSize: 36, limit: 38, through: true}
                  无反馈:
                    type: Text
                    attribute: {x: 18, y: 52, texts: ~&7完成上方验证后继续。, fontSize: 36, visible: "var.result == none || var.result == ''", through: true}
                  反馈信号:
                    type: Texture
                    attribute: {x: 0, y: 0, width: 4, height: 114, normal: "var.lastSuccess ? '134,187,152,255' : '220,140,112,255'", alpha: var.resultAlpha, visible: "var.resultAlpha > 0", through: true}
      服务器时间:
        type: Text
        attribute: {x: 260, y: "(var.viewH + 840) / 2 + 20", texts: "'&7时间: ' + (Placeholder.parse('%server_time_yyyy年MM月dd日hh:mm:ss%') != none ? Placeholder.parse('%server_time_yyyy年MM月dd日hh:mm:ss%') : var.time)", fontSize: 36, through: true}
      # Modal is a sibling of the gateway, covering the entire derived viewport.
      服规覆盖层:
        type: Canvas
        attribute: {x: "-var.offX", y: 0, width: "var.viewW", height: "var.viewH", visible: var.showRules}
