  action:
    load: |-
      var.showHudSettings = false
      var.editPanelVisible = false
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      var.scale = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / var.scale
      var.viewH = Screen.getHeight() / var.scale
      var.offX = (var.viewW - 1920) / 2
      // axsmap 是客户端 mod(ArcartX-Suite-Map) 注册的 Aria 全局函数命名空间，
      // getMapRenderer() 返回 JavaObjectMirror 包装的 MapRenderer 实例（Java 互操作）
      try {
        var.mapRenderer = axsmap.getMapRenderer()
      } catch(e) {
      }
      // 世界ID→MC维度映射下发给 mod（服务端 packet 的 worldRows[].dimension），
      // mod 用它把"选中世界"匹配到对应维度的地形缓存桶
      var.syncWorldDims = -> {
        if(var.mapRenderer == none) {
          return
        }
        if(var.worldRows != none) {
          for(key in var.worldRows.keys()) {
            row = var.worldRows[key]
            if(row != none) {
              dim = row['dimension']
              // 世界卸载时服务端发空维度——跳过而不是擦映射（擦了会整图黑屏）
              if(dim != none && '' + dim != '' && '' + dim != 'null') {
                var.mapRenderer.setWorldDimension('' + row['id'], '' + dim)
              }
              // 世界中心（preload.center ?? 出生点链）→ 浏览非当前世界的视野锚点
              var.centerX = row['centerX']
              var.centerZ = row['centerZ']
              if(var.centerX != none && var.centerZ != none) {
                var.mapRenderer.setWorldCenter('' + row['id'], var.centerX, var.centerZ)
              }
              // 预加载信息（版本号 + 覆盖块坐标串）→ mod 按需 axsmap:request
              // 显式 if 防护：三元对 missing-key 的 none 判定不可靠，
              // 直接把 none 传给 Java 会 primitiveConversion NPE
              var.preloadVer = row['preloadVersion']
              var.preloadChunks = row['preloadChunks']
              if(var.preloadVer != none && var.preloadChunks != none && var.preloadChunks != '') {
                var.mapRenderer.setWorldPreload('' + row['id'], var.preloadVer, '' + var.preloadChunks)
              }
            }
          }
        }
        // 点亮区域：litEnabled=false → 传 none（全亮不遮罩）；true → 传已解锁区域并集
        var.mapRenderer.setLitRegions('' + var.selectedWorldId,
          var.litEnabled == true ? var.litRegions : none)
      }
      var.call_syncWorldDims = -> {
        if(var.syncWorldDims != none) {
          var.syncWorldDims()
        }
      }
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      var.scale = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / var.scale
      var.viewH = Screen.getHeight() / var.scale
      var.offX = (var.viewW - 1920) / 2
    tick: |-
      if(var.mapRenderer != none) {
        // 大地图全屏渲染：渲染区 = 整个窗口
        sw = Screen.getWidth()
        sh = Screen.getHeight()
        var.mapRenderer.setRegion(0, 0, sw, sh, var.scale)
        // UI 悬停捕获：悬停在可交互控件（actions 非空）或带 mapCapture 标记的
        // 覆盖面板（顶栏/详情面板/浮层等）上 → 本次点击归 UI，地图不响应。
        // 几何由控件自身 isHovered 判定——布局改动/新增按钮自动跟随，
        // 注意 getVisibleChildren 只返回直接子级（不递归）——扫的是主面板的
        // 直接子控件；嵌套按钮由带标记的父容器覆盖（父级 hover 含子控件范围）。
        var.uiCapture = false
        capChildren = self['自适应全局布局']['主面板'].getVisibleChildren()
        for(cap in capChildren) {
          if(cap != none && cap.isHovered()
              && (cap.mapCapture == true || (cap.actions != none && cap.actions.keys().length > 0))) {
            var.uiCapture = true
          }
        }
        var.mapRenderer.setUiCapturing(var.uiCapture)
        var.mapRenderer.setWorldId(var.selectedWorldId)
        // 地图标记点击命中（"type:id"）→ 发包选中目标，服务端回详情面板数据
        hit = var.mapRenderer.getHitMarker()
        if(hit != none && hit != '') {
          var.mapRenderer.clearHitMarker()
          if(hit == 'none:') {
            // 点在可交互区外：取消选中，也清掉落点光标
            var.mapRenderer.clearCursor()
            Packet.send(var.packetId, 'deselect')
          } else {
            if(hit.startsWith('none:')) {
              // 点在空白处：记录落点坐标并在大地图上画十字准星预览
              parts = hit.split(':')
              if(parts.length >= 3) {
                var.pinCreateX = parts[1]
                var.pinCreateZ = parts[2]
                var.mapRenderer.setCursor(Cast.toDouble(parts[1]), Cast.toDouble(parts[2]))
              }
              Packet.send(var.packetId, 'deselect')
            } else {
              // 点中标记：清掉落点光标与待创建坐标（改由详情面板+选中框标识）
              var.mapRenderer.clearCursor()
              var.pinCreateX = none
              var.pinCreateZ = none
              parts = hit.split(':')
              if(parts.length >= 2) {
                if(parts[0] == 'anchor') {
                  Packet.send(var.packetId, 'select_anchor', parts[1])
                }
                if(parts[0] == 'waypoint') {
                  Packet.send(var.packetId, 'select_waypoint', parts[1])
                }
                if(parts[0] == 'external') {
                  Packet.send(var.packetId, 'select_external', parts[1])
                }
                if(parts[0] == 'pin') {
                  Packet.send(var.packetId, 'select_pin', parts[1])
                }
              }
            }
          }
        }
        // 落点光标与 pinCreateX/Z 同生共死：创建按钮按下（pinCreateX 清空）/
        // 点中标记（上面已清）后光标自动消失；不用 detailSelectedType 判断是因为
        // deselect 包异步返回，同 tick 检查会把刚画上的光标立刻清掉
        if(var.pinCreateX == none) {
          var.mapRenderer.clearCursor()
        }
      }
    open: |-
      var.worldListOpen = false
      var.browsePanelOpen = false
      var.browseCategory = 'anchor'
      var.detailCanTrackAnchor = false
      var.detailCanTrackExternal = false
      var.detailCanTrackWaypoint = false
      var.detailSelectedType = 'none'
      var.packetId = 'AXS_MAP'
      var.selectedWorldName = '未选择'
      var.trackingText = '当前未导航'
      var.worldRows = {}
      var.crossWorldPromptVisible = false
      var.crossWorldPromptType = 'navigate'
      var.actionBusy = false
      // 打开菜单默认回到玩家当前位置：清掉上次残留的拖拽/缩放
      if(var.mapRenderer != none) {
        var.mapRenderer.resetView()
      }
    close: |-
      // closeMenu 立即停大地图渲染（仅 MENU 模式生效，HUD 不受影响）；
      // 若 close 没执行，mod 端 region 新鲜度 300ms 过期兜底
      if(var.mapRenderer != none) {
        var.mapRenderer.closeMenu()
      }
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
      // 距离门槛实时刷新：选中未解锁+带 unlock.radius 门槛的锚点时
      // 每秒重拉快照 → detailUnlockRangeText / detailUnlockInRange 实时更新
      if(var.detailSelectedType == 'anchor' && var.detailUnlocked != true
        && var.detailUnlockRadius > 0) {
        Packet.send(var.packetId, 'refresh')
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          y: 0
          width: "var.viewW"
          height: "var.viewH"
        children:
          # ─── 顶栏 ───
          顶栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 0
              y: 0
              width: "var.viewW"
              height: 96
              mapCapture: true
            children:
              顶栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "~Frosted:30;100,100,100,255"
                effect:
                  stroke:
                    width: 4
                    color: ~255,255,255,255
              标题色块:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 36
                  width: 6
                  height: 44
                  normal: ~232,180,90,255
                  shape: ~round_rect
                  radius: 3
              地图菜单标题:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 60
                  texts: "'&f地图总览 &8/ &f' + var.selectedWorldName"
                  fontSize: 36
              追踪文字:
                type: Text
                attribute:
                  point: ~middle_center
                  x: -260
                  texts: "'&b' + var.trackingText"
                  fontSize: 36
              # ─── 设置入口（展开居中模态副面板：小地图外观 + 实体显示） ───
              设置按钮:
                type: Canvas
                attribute:
                  tip: ~&f地图设置
                  point: ~top_right
                  x: -340
                  y: 26
                  width: 108
                  height: 44
                  enable: "var.mapRenderer != none"
                action:
                  clickLeft: |-
                    var.showHudSettings = !var.showHudSettings
                children:
                  设置按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.showHudSettings ? '74,144,226,255' : '52,56,64,255'"
                      hover: "var.showHudSettings ? '94,164,246,255' : '72,76,84,255'"
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: "self.isHovered() ? '4' : '3'"
                        color: ~255,255,255,255
                  设置按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f设置
                      fontSize: 36
                      through: true
              关闭按钮:
                type: Canvas
                attribute:
                  tip: ~&f关闭地图
                  point: ~top_right
                  x: -68
                  y: 26
                  width: 44
                  height: 44
                action:
                  clickLeft: |-
                    Screen.close()
                children:
                  关闭按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~220,80,80,255
                      hover: ~240,100,100,255
                      shape: ~round_rect
                      radius: 12
                  关闭按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f✕
                      fontSize: 36
                      through: true
          # ─── 地图已全屏渲染（mod 在 UI 下层绘制），此处只留加载提示 ───
          地图加载提示:
            type: Text
            attribute:
              point: ~middle_center
              texts: ~&f地图加载中...
              fontSize: 36
              through: true
              visible: "var.mapRenderer == none"
          # ─── 锚点详情面板（只有解锁/传送/导航）───
          锚点详情面板:
            type: Canvas
            attribute:
              point: ~top_left
              x: "var.viewW - 448"
              y: "(var.viewH - 400) / 2"
              width: 420
              height: 400
              visible: "var.detailSelectedType == 'anchor'"
              mapCapture: true
            children:
              锚点面板底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "~Frosted:30;100,100,100,255"
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 4
                    color: ~255,255,255,255
              锚点类型图标:
                type: Text
                attribute:
                  point: ~top_center
                  y: 28
                  texts: "var.detailRemote == true ? '&b☁' : '&6◎'"
                  fontSize: 100
                  through: true
              锚点详情标题:
                type: Text
                attribute:
                  point: ~top_center
                  y: 76
                  texts: "var.detailTitle"
                  fontSize: 38
              # 远程锚点徽标：来源服务器名
              锚点远程徽标:
                type: Text
                attribute:
                  point: ~top_center
                  y: 108
                  texts: "'&b☁ 跨服 &7· &f' + var.detailServerName"
                  fontSize: 32
                  visible: "var.detailRemote == true"
                  through: true
              锚点位置信息:
                type: Text
                attribute:
                  point: ~top_center
                  y: "var.detailRemote == true ? 140 : 112"
                  texts: "'&f' + var.detailLocation"
                  fontSize: 36
                  visible: "var.detailLocation != none && var.detailLocation != ''"
                  through: true
              锚点详情描述:
                type: Text
                attribute:
                  point: ~top_center
                  y: "var.detailRemote == true ? 172 : 142"
                  texts: "var.detailDescription"
                  fontSize: 48
              锚点解锁费用:
                type: Text
                attribute:
                  point: ~top_center
                  x: -105
                  y: 200
                  texts: "'&f解锁: &f' + var.detailUnlockCostText"
                  fontSize: 48
                  visible: "var.detailRemote != true"
              锚点传送费用:
                type: Text
                attribute:
                  point: ~top_center
                  x: 105
                  y: 200
                  texts: "'&f传送: &f' + var.detailTeleportCostText"
                  fontSize: 48
              锚点解锁距离:
                type: Text
                attribute:
                  point: ~top_center
                  y: 250
                  texts: "'&f' + var.detailUnlockRangeText"
                  fontSize: 48
                  visible: "var.detailUnlockRangeText != none && var.detailUnlockRangeText != ''"
              锚点解锁按钮:
                type: Canvas
                attribute:
                  tip: ~&f解锁锚点
                  point: ~top_left
                  x: 24
                  y: 300
                  width: 110
                  height: 44
                  enable: "!var.actionBusy && var.actionToken != none && var.detailUnlockInRange"
                  # 远程锚点不可在本服解锁（解锁/费用均由目标服权威）
                  visible: "var.detailRemote != true"
                action:
                  clickLeft: |-
                    if (var.detailCanUnlock && var.detailUnlockInRange) {
                      var.actionBusy = true
                      Packet.send(var.packetId, 'unlock_anchor', var.detailSelectedId, var.actionToken)
                    }
                children:
                  锚点解锁按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.detailCanUnlock && var.detailUnlockInRange ? '82,196,26,255' : '60,60,66,255'"
                      hover: "var.detailCanUnlock && var.detailUnlockInRange ? '102,216,46,255' : '60,60,66,255'"
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: "self.isHovered() ? '4' : '3'"
                        color: ~255,255,255,255
                  锚点解锁按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f解锁
                      fontSize: 36
                      through: true
              锚点传送按钮:
                type: Canvas
                attribute:
                  tip: ~&f传送到锚点
                  point: ~top_left
                  x: 146
                  y: 300
                  width: 110
                  height: 44
                  enable: "!var.actionBusy && var.actionToken != none"
                action:
                  clickLeft: |-
                    if (var.detailCanTeleport) {
                      // 跨世界传送同导航一样先弹确认（L16 统一确认）；
                      // 远程锚点（复合 id）同样走该确认，服务端按 id 前缀路由到跨服握手
                      var.isCrossWorld = var.playerWorldId != '' && var.selectedWorldId != var.playerWorldId
                      if (var.isCrossWorld || var.detailRemote == true) {
                      var.crossWorldPromptType = 'teleport'
                      var.crossWorldRemote = var.detailRemote == true
                      var.crossWorldPromptVisible = true
                      } else {
                        var.actionBusy = true
                        Packet.send(var.packetId, 'teleport_anchor', var.detailSelectedId, var.actionToken)
                      }
                    }
                children:
                  锚点传送按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.detailCanTeleport ? '74,144,226,255' : '60,60,66,255'"
                      hover: "var.detailCanTeleport ? '94,164,246,255' : '60,60,66,255'"
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: "self.isHovered() ? '4' : '3'"
                        color: ~255,255,255,255
                  锚点传送按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f传送
                      fontSize: 36
                      through: true
              锚点导航按钮:
                type: Canvas
                attribute:
                  tip: ~&f导航到锚点
                  point: ~top_left
                  x: 268
                  y: 300
                  width: 110
                  height: 44
                  # 远程锚点不支持本服导航（追踪信标无法跨服渲染）
                  visible: "var.detailRemote != true"
                action:
                  clickLeft: |-
                    if (var.detailNavigated) {
                      Packet.send(var.packetId, 'untrack', 'anchor', var.detailSelectedId)
                    } else {
                      var.isCrossWorld = var.playerWorldId != '' && var.selectedWorldId != var.playerWorldId
                      if (var.isCrossWorld) {
                      var.crossWorldPromptType = 'navigate'
                      var.crossWorldRemote = false
                      var.crossWorldPromptVisible = true
                      } else {
                        if (var.detailCanTrackAnchor) {
                          Packet.send(var.packetId, 'track_anchor', var.detailSelectedId)
                        }
                      }
                    }
                children:
                  锚点导航按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.detailNavigated ? '200,84,84,255' : (var.detailCanTrackAnchor ? '236,180,24,255' : '60,60,66,255')"
                      hover: "var.detailNavigated ? '220,104,104,255' : (var.detailCanTrackAnchor ? '246,200,44,255' : '60,60,66,255')"
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: "self.isHovered() ? '4' : '3'"
                        color: ~255,255,255,255
