# -------- 种植收获（左键破坏农作物）--------
# 覆盖左键破坏收获的农作物：小麦、胡萝卜、马铃薯、甜菜根等
# 用 condition 的 in 操作符匹配多种农作物 material
daily-farm-break:
  display-name: "农夫"
  description: "收获20个农作物"
  difficulty: easy
  bukkit-event:
    event-class: "org.bukkit.event.block.BlockBreakEvent"
  required-count: 20
  base-xp-reward: 100
  conditions:
    # in 操作符：payload 的 material 值在 values 列表中才计入
    - type: event_payload
      key: material
      operator: in
      values:
        - WHEAT          # 小麦
        - CARROTS        # 胡萝卜
        - POTATOES       # 马铃薯
        - BEETROOTS      # 甜菜根
        - MELON          # 西瓜
        - PUMPKIN        # 南瓜
        - SUGAR_CANE     # 甘蔗
        - CACTUS         # 仙人掌
        - COCOA          # 可可豆
        - NETHER_WART    # 下界疣
        - BAMBOO         # 竹子
        - KELP           # 海带
  increment-strategy:
    type: fixed
    value: 1
  weight: 3

