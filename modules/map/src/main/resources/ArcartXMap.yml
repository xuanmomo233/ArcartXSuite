# 配置版本号（不要手动修改，由模块自动管理）
config-version: 6
# AXS Map
# 作用: 提供全屏地图 GUI、小地图 HUD、世界配置、锚点、路径点、自定义图标和 AXMap 临时导航目标。
# 依赖: ArcartX；Vault、PlayerPoints、MythicMobs、NeigeItems 按功能选用。
# 重载: /axs map reload
# PAPI 输出: 无独立 PlaceholderAPI 输出。
# 可解析的 PAPI: 无；地图数据来自配置、玩家位置、世界坐标、锚点和运行时临时路径点。
# 关联资源: ui/map_menu.yml、ui/map_hud.yml

debug: false

ui:
  # menu-ui-id 全屏地图 UI；hud-ui-id 小地图 HUD。
  menu-ui-id: "AXS:map_menu"
  hud-ui-id: "AXS:map_hud"
  # packet-id 为客户端 Packet.send / 服务端 packetHandler 的通信标识。
  packet-id: "AXS_MAP"
  # 是否在启用/重载时自动注册 UI；overwrite-ui-files 为 true 时覆盖已导出的 UI 文件。
  register-ui-on-enable: true
  overwrite-ui-files: false

# 按键已由宿主 config.yml keybinds 节统一注册（AXS_MAP_MENU 打开地图 / AXS_MAP_HUD 切换小地图，
# 归属 module: map，本模块禁用时按键不会注册到客户端）。
# 本模块不再自行注册按键；默认键位请在宿主 config.yml 的 keybinds.map-menu / map-hud 修改。

# ─── 进服行为 ──────────────────────────────────────────
join:
  # 玩家进服后是否自动显示小地图 HUD
  show-hud-on-join: true
  # 进服后延迟多少 tick 再显示 HUD（等待客户端加载）
  show-hud-delay-ticks: 20

storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "<moduleId>.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: <N>
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_<moduleId>_"

#导航配置：ArcartX 路标（waypoint）+ Suite 提供的两种路径导航——模型导航（model-marker）与贴图导航（texture-marker），三者互补可独立开关
navigation:
  # 是否启用导航追踪功能
  enabled: true
  # 锚点导航在客户端的 ID 前缀
  anchor-id-prefix: "AXS-map-anchor-"
  # 路径点导航在客户端的 ID 前缀
  waypoint-id-prefix: "AXS-map-track-"

  # 多目标并行追踪：玩家可同时导航多个锚点/路径点（追踪态并行）；
  # 屏幕路标与路径标记链只跟随"最新激活且同世界"的目标（避免多路标误导玩家）。
  # 目标刷新间隔（tick）：驱动 diff 推送与到达判定
  refresh-ticks: 20
  # 目标在其他世界时的提示节流间隔（秒），0 = 不提示
  world-hint-interval: 30
  # 到达触发半径（格），0 = 不启用；到达不取消导航，须离开 finish-range + finish-rearm-buffer 再触发
  finish-range: 0
  # 到达命令（控制台执行，支持 %player% 占位符）
  finish-commands: []
  # 到达判定的滞回缓冲（格）：触发后须离开 finish-range + 本值 才重新武装
  finish-rearm-buffer: 3.0

  # ArcartX 路标 — 目标点光柱 + 标题（ArcartX waypoint 系统渲染）。
  waypoint:
    # 是否推送路标；false 时导航仅保留追踪态/到达判定/路径标记，不发路标包
    enabled: true
    # 路标样式 ID，在 ArcartX waypoint 目录下定义
    style-id: "default"
    # 路标标题模板（单行；支持 %label%/%type%/%distance%/%world%/%x%/%y%/%z%），留空显示目标名
    title-template: ""

  # 模型导航提示 — 使用 Adyeshach 私有实体 + ArcartX 模型渲染客户端导航标记。
  # 仅在追踪状态变更时发包，客户端独立渲染，零服务端 tick 开销。
  # 依赖: Adyeshach + ArcartX 客户端。
  model-marker:
    # 是否启用标记模型
    enabled: true
    # ArcartX 模型 ID（在 ArcartX model 配置中定义）。
    model-id: "waypoint"
    # 缩放比例
    scale: 1.0
    # 默认状态
    default-state: "idle"
    # 动画类型
    animation: "rotate"
    # Y 轴偏移（方块）
    y-offset: 2.0
    # 路径标记间距（方块）
    path-interval: 3.0
    # 路径最大标记数
    path-max-markers: 20
    # 路径更新间隔（tick）
    path-update-ticks: 10
    # 路径最大距离（方块）
    path-max-distance: 64.0
    # 距离滞回缓冲（方块）：标记因超距隐藏后，须回到 path-max-distance - 本值 以内才重新显示
    path-reshow-buffer: 8
    # 路径计算最大迭代次数
    path-max-iterations: 2000

  # 贴图导航提示 — 沿寻路结果向玩家单人下发 ArcartX 世界贴图（WorldTexture）路径提示。
  # 与 model-marker 模型导航互补，可同开也可独立开关；无需 Adyeshach 实体，仅发包，天然玩家私有。
  # 依赖: ArcartX 客户端（资源包中须存在 texture 对应贴图）。
  texture-marker:
    # 是否启用贴图路径提示
    enabled: false
    # 贴图资源 ID（ArcartX 自定义文字贴图格式：§k!%<id><type>，或资源包中注册的贴图名）
    texture: "nav_arrow"
    # 贴图渲染宽度 / 高度
    width: 100
    height: 100
    # 是否始终面向玩家（billboard）；false = 按 pitch/yaw 定向（贴地箭头）
    facing: false
    # 是否泛光（夜间可见性更好）
    glowing: true
    # 贴图相对路径点的 Y 轴偏移（方块数）
    y-offset: 0.1
    # 俯仰角（度）；贴地渲染用 90，facing=true 时一般忽略
    pitch: 90
    # yaw 是否朝向下一个路径点（贴地箭头指示前进方向）
    orient-to-path: true
    # 贴图存活时长（-1 = 永续，直到导航取消/路径重算时显式移除）
    life-time: -1
    # 循环缩放脉冲动画；按路径点序号错开 delay 形成沿路径传播的波浪效果
    pulse:
      enabled: true
      # 脉冲起始 / 目标缩放倍率
      from: 0.8
      to: 1.2
      # 脉冲单段时长（客户端动画单位）
      duration: 20
      # 逐级延迟（每个路径点相对前一点的动画延迟；0 = 同步缩放）
      stagger: 2
    # ---- 路径寻路参数（与 model-marker 同语义，互不影响） ----
    # 路径贴图间距（方块数）
    path-interval: 3.0
    # 路径贴图最大数量（超出后截断远端贴图）
    path-max-markers: 20
    # 路径更新间隔（tick）
    path-update-ticks: 10
    # 路径最大渲染距离（方块数）
    path-max-distance: 64.0
    # 距离滞回缓冲（方块）：贴图因超距隐藏后，须回到 path-max-distance - 本值 以内才重新显示
    path-reshow-buffer: 8
    # 路径计算最大迭代次数
    path-max-iterations: 2000

# ─── 世界配置 ──────────────────────────────────────────
# 每个世界单独一个文件，放在 worlds/ 目录下，文件名即世界 ID（如 worlds/bskyblock_world.yml）。
# 文件内含 enabled / display-name / anchors 节。地图完全由客户端 mod 实时渲染，无需纹理参数。
# display-name 留空时运行时从 Multiverse-Core colourless alias 自动补。
# dimension 完全自动按 Bukkit world.getKey() 解析，无需配置。
# 示例文件见 worlds/world.yml。
worlds-directory: "worlds"

# ─── 路径点配置 ────────────────────────────────────────
waypoints:
  # 是否允许玩家创建自定义路径点
  enabled: true
  # 默认路径点样式 ID
  default-style-id: "default"
  # 路径点在客户端的 ID 前缀
  id-prefix: "AXS-map-wp-"
  # 自动命名前缀（玩家未命名时使用）
  auto-name-prefix: "标记点"
  # 默认路径点最大数量
  default-max-count: 50
  # 按权限设置不同的路径点上限
  limits:
    - permission: "ArcartXSuite.map.vip"
      max-count: 100

# ─── 分享配置 ──────────────────────────────────────────
share:
  # 分享路径点和标记点功能总开关：false 时详情面板的分享按钮隐藏，share/claim 一律拒绝
  enabled: true
  # 聊天卡片模板 ID（对应 plugins/ArcartX/chat_card/<id>.yml）
  # 留空 = 不用聊天卡片，降级为纯文本广播（点击文本自动执行 /map claim <分享码>）
  card-id: "axs_map_share"
  # 分享链接有效期（分钟）。分享码存内存，重启/重载后失效；过期后点击领取会提示失败
  expire-minutes: 30

# ─── 跨服地图 ──────────────────────────────────────────
# 前置：宿主 plugins/ArcartX-Suite/config.yml 的 cross-server 节须启用并配好
# node-id 与 Redis/Proxy 后端，各子服的 node-id 必须互不相同。
# 开启后：本机把 worlds/<world>.yml 中 cross-server.share=true 的世界广播给其他
# 子服；地图列表中可浏览远程世界（复合 id "节点/世界"），客户端选中远程世界后
# 地形经本机中继获取（缓存按 axsremote.<节点>.<维度> 隔离，不覆盖本地地形）。
cross-server:
  # 跨服地图总开关：false 时本机不广播目录、不接收远程目录、跨服传送不可用
  enabled: false
  # 本机在其他服地图上的显示名（留空 = 宿主 cross-server.node-id）
  display-name: ""
  # 本机在 BungeeCord/Velocity 代理上的服务器名（跨服传送 Connect 目标；
  # 留空 = node-id）。须与代理 config 中的服务器名完全一致
  proxy-name: ""
  # 世界目录广播间隔（秒），≥15。每次心跳携带全部共享世界与锚点摘要
  announce-interval-seconds: 120
  # 远程节点目录过期时间（秒），≥60。超时未收到心跳即摘除其全部远程世界
  node-ttl-seconds: 400
  # 远程地形中继：true = 本机既可为其他服生成地形，也允许本机玩家浏览远程世界。
  # 远程地形仅在目标世界预加载覆盖范围内中继，无法越权拉取任意地形
  terrain-relay: true
  # 跨服传送握手超时（秒），≥3。超时未获目标服应答视为失败
  request-timeout-seconds: 10
  # 玩家跨服落地后延迟多少 tick 再执行传送（等待进服稳定），0 = 立即
  arrival-delay-ticks: 20
  # 远程共享世界总数上限（全部节点合计），防止恶意/异常节点无限广播世界撑内存
  max-remote-worlds: 256
  # 远程锚点总数上限（全部节点合计），单世界另有 60 条上限
  max-remote-anchors-total: 4096
  # 跨服传送握手策略（本机作为"目标服"接收 tpreq 时）
  teleport:
    # true = 只接受通过宿主 HMAC 验签（cross-server.signature.enabled）的传送握手；
    # 未签名消息直接丢弃。跨服签名未开启的部署请保持 false（否则握手全部失效）
    require-signed-request: false
  # 本机作为"目标服"时接受其他服玩家落地的策略
  arrivals:
    # 是否接受跨服落地传送（false = 只共享浏览，不接受传送）
    enabled: true
    # 锚点落地是否要求玩家在本机已有解锁记录；
    # false = 广播出去的锚点视为公共传送点，未解锁也可落地
    require-anchor-unlock: false
    # 落地锚点是否按本机锚点 teleport 节扣费（货币桥只能操作在线玩家，
    # 故费用统一在落地后收取，源服不预扣）
    charge-teleport-cost: true
  # 通道后端覆盖（可选）：不配置时继承宿主全局 cross-server 后端设置
  # redis:
  #   enabled: true
  # proxy:
  #   enabled: true
