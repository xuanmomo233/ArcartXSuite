# =============================================================================
# 赛季任务池
# 赛季任务不会重置，所有玩家共享同一批赛季目标
# =============================================================================
# 事件源说明详见 daily.yml 头部注释
# =============================================================================

# -------- 千人斩 --------
season-kill-1000:
  display-name: "千人斩"
  description: "本赛季累计击杀1000个生物"
  difficulty: hard
  event-topic: "axs.combateffect.kill_entity"
  bukkit-event:
    event-class: "org.bukkit.event.entity.EntityDeathEvent"
  required-count: 1000
  base-xp-reward: 2000
  conditions: []
  increment-strategy:
    type: fixed
    value: 1

# -------- 交易大师 --------
# market.listing_created 由 market 模块发布，market 模块通常已加载，无需降级
season-market-50:
  display-name: "交易大师"
  description: "本赛季在市场累计交易50次"
  difficulty: normal
  event-topic: "market.listing_created"
  required-count: 50
  base-xp-reward: 1500
  conditions: []
  increment-strategy:
    type: fixed
    value: 1

# -------- 万伤 --------
season-damage-10000:
  display-name: "万伤战神"
  description: "本赛季累计造成10000点伤害"
  difficulty: hard
  event-topic: "axs.combateffect.damage_dealt"
  bukkit-event:
    event-class: "org.bukkit.event.entity.EntityDamageByEntityEvent"
  required-count: 10000
  base-xp-reward: 2500
  conditions: []
  increment-strategy:
    type: payload_value
    payload-key: damage
    max-per-event: 1000
    scale: 1.0

# -------- 拾取大师 --------
season-pickup-500:
  display-name: "拾取大师"
  description: "本赛季累计拾取500个物品"
  difficulty: normal
  event-topic: "axs.pickup.item_pickup"
  bukkit-event:
    event-class: "org.bukkit.event.player.PlayerPickupItemEvent"
  required-count: 500
  base-xp-reward: 1200
  conditions: []
  increment-strategy:
    type: fixed
    value: 1
