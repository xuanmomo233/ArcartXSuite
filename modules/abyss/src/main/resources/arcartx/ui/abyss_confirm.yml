    attribute:
      visible: "var.actionToken != ''"
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      确认面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 920
          height: 580
        children:
          面板底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~26,30,36,250
              shape: ~round_rect
              radius: 14
              through: true
            effect:
              stroke:
                width: 1
                color: ~255,255,255,38
          顶部强调线:
            type: Texture
            attribute:
              x: 28
              y: 0
              width: 96
              height: 4
              normal: ~94,157,235,255
              through: true
              shape: ~round_rect
              radius: 2
          类型标签:
            type: Text
            attribute:
              x: 32
              y: 28
              texts: ~&7进入副本
              fontSize: 32
              through: true
          标题:
            type: Text
            attribute:
              x: 32
              y: 72
              texts: "'&f' + var.dungeonName"
              fontSize: 56
              limit: 18
              through: true
          难度:
            type: Canvas
            attribute:
              x: 680
              y: 34
              width: 204
              height: 48
            children:
              难度底:
