# rooms.yml — 元气试炼之地 · 迷宫房（region 模式，origin=0,0,0 绝对坐标）
#
# 迷宫语义：房间经走廊物理互连，玩家自由遍历/回退；doors 列该房全部走廊洞口，
# combat/boss 进房即锁全部洞口；exit 仅在 boss 房（推进金垫）配置。
# 波次：w1a/w1b MANUAL 由 on-lock 掷签选包（未选包 kill_group 跳过分母），
#        w2 TRIGGERED 等首波包全清（trigger-after 全前置语义）后休整刷怪。

rooms:
  # ═══════════ &a第 1 层 · 苔痕前哨 ═══════════

  # 入口营地
  f1_start:
    type: safe
    region: ["0,60,0", "39,75,39"]
    spawn: "5,61,19,270,0"
    doors:
      - region: ["39,61,17", "39,64,22"]
      - region: ["17,61,39", "22,64,39"]
    on-enter:
