# AXS Market — 交易所
ui:
  isHud: false
  defaultOpen: false
  hide:
  - hotbar
  - experience_bar
  - crosshair
  - item_name
  - jump_bar
  - mount_health
  - player_state
  - player_health
  - armor_level
  - food_level
  - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    update: |-
      var.itemJsons = {}
      oldMaxCategoryCount = var.maxCategoryCount
      oldMaxListingCount = var.maxListingCount
      var.packetId = packet['packetId']
      var.page = packet['page']
      var.totalPages = packet['totalPages']
      var.pageText = packet['pageText']
      var.currentCategory = packet['currentCategory']
      var.categories = packet['categories'] != none ? packet['categories'] : {}
      var.categoryTexts = packet['categoryTexts']
      var.listings = packet['listings'] != none ? packet['listings'] : {}
      var.listingTexts = packet['listingTexts']
      var.maxCategoryCount = packet['maxCategoryCount']
      var.maxListingCount = packet['maxListingCount']
      var.actionToken = packet['action_token']
      for(key in var.listings.keys()){
        json = packet['itemJson' + key]
        if(json != none && json != ''){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      if(var.maxCategoryCount != oldMaxCategoryCount){
        for(key in var.categoryRefs.keys()){
          var.categoryRefs[key].remove()
        }
        var.categoryRefs = {}
        var.categoryRound = var.categoryRound + 1
        if(var.maxCategoryCount > 1){
          for(i in range(1, var.maxCategoryCount - 1)){
            row = val.分类列表.get(0).copy('分类项_' + var.categoryRound.round() + '_' + i.round())
            row.entryKey = i.round()
            var.categoryRefs[i.round()] = row
          }
        }
      }
      if(var.maxListingCount != oldMaxListingCount){
        for(key in var.listingRefs.keys()){
          var.listingRefs[key].remove()
        }
        var.listingRefs = {}
        var.itemRound = var.itemRound + 1
        if(var.maxListingCount > 1){
          for(i in range(1, var.maxListingCount - 1)){
            row = val.物品列表.get(0).copy('拍卖卡片_' + var.itemRound.round() + '_' + i.round())
            row.entryKey = i.round()
            var.listingRefs[i.round()] = row
          }
        }
      }
      if(var.maxListingCount > 0){
        val.物品列表.get(0)['物品图标'].seticon()
        for(key in var.listingRefs.keys()){
          var.listingRefs[key]['物品图标'].seticon()
        }
      }
      var.actionBusy = false
      var.actionBusySeconds = 0
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.categoryTexts = {}
      var.currentCategory = 'all'
      var.packetId = 'AXS_MARKET'
      var.page = 0
      var.pageText = '1/1'
      var.totalPages = 1
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.listings = {}
      var.maxListingCount = 0
      var.itemJsons = {}
      var.listingRefs = {}
      var.itemRound = 0
      var.categories = {}
      var.maxCategoryCount = 0
      var.categoryRefs = {}
      var.categoryRound = 0
      var.search = none
      self.actions['resize']()
    open: Packet.send(var.packetId, 'auction_list', '0', 'all', none)
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 380
      var.scrollW = var.contentW - 64
      var.cardW = (var.scrollW - 16) / 2
