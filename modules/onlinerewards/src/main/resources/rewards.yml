# OnlineRewards 在线阶段奖励
# 从 ArcartXOnlineRewards.yml 的 rewards: 段独立为外部文件。
#
# 会按配置顺序推进；minutes 为达到该阶段所需的今日累计在线分钟。
# commands 支持 {player} 变量。
# mail.presets 填写 Mail 模块 mail/presets/*.yml 中的 preset.id，达成阶段后会发送给玩家。
#
# 字段说明:
#   minutes      - 达到该阶段所需的今日累计在线分钟数
#   name         - 阶段名称
#   rewardText   - 奖励描述文本（显示在 UI 中）
#   icon         - UI 展示图标定义（可选，不配置时使用默认图标）
#   mail.presets - 邮件预设 ID 列表（对应 Mail 模块的 preset.id）
#   commands     - 达成阶段后执行的命令列表（支持 {player} 变量）
#   item-rewards - 物品奖励列表（通过 ItemSourceRegistry 生成，统一发放）
#
# icon 配置（完整字段见 battlepass/fishing 模块）:
#   material:          原版材质名（如 DIAMOND）
#   source + id:       外部物品库图标（mythic/neige/overture/mmoitems）
#   name:              图标悬浮名称（支持 & 颜色码）
#   amount:            图标显示数量（默认1，大于1时图标右下角显示数字）
#   lore:              图标描述（列表）
#   custom-model-data: 自定义模型数据
#   glow:              是否附魔发光
#   texture:           ArcartX 自定义贴图（写入 icon NBT）
#   texture-url:       贴图 URL（写入 url NBT）
#   nbt:               自定义 NBT（键值对或 SNBT 字符串）
#
# item-rewards 字段说明:
#   source: 物品来源（minecraft/mythic/neige/overture/mmoitems）
#   id:     物品 ID（mmoitems 格式为 "类型ID;物品ID"）
#   amount: 数量
#   nbt:    可选，自定义 NBT（SNBT 字符串，仅 minecraft 源有效）

rewards:
  - minutes: 1
    name: "第一阶段"
    rewardText: "这里是第一阶段的奖励描述"
    icon:
      material: DIAMOND
      name: "&b第一阶段奖励"
      amount: 1
    mail:
      presets: []
    commands:
      - "say 你好 {player} 这是第一阶段"
    # item-rewards:
    #   - source: "minecraft"
    #     id: "DIAMOND"
    #     amount: 1

  - minutes: 5
    name: "第二阶段"
    rewardText: "这里是第二阶段的奖励描述"
    icon:
      material: GOLD_INGOT
      name: "&6第二阶段奖励"
      amount: 1
    mail:
      presets: []
    commands:
      - "say 你好 {player} 这是第二阶段"

  - minutes: 10
    name: "第三阶段"
    rewardText: "这里是第三阶段的奖励描述"
    icon:
      material: EMERALD
      name: "&a第三阶段奖励"
      amount: 1
    mail:
      presets: []
    commands:
      - "say 你好 {player} 这是第三阶段"
