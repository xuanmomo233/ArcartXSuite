# AXS 资源说明
# 用途: Essentials 管理员后台面板，支持玩家管理/封禁/传送点/世界控制。
# 前置依赖: ArcartX；Essentials 模块启用后自动注册。
# 打开方式: /axs essentials admin
# 数据交互: packetHandler 接收 init 推送；客户端通过 Packet.send('AXS_ESS_ADMIN', ...) 发送管理指令。
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航（玩家/封禁/传送点/世界）+ 内容区
# 视觉规范:
#   全屏玻璃 Frosted:24;30,32,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片 62,66,74,210  描边 255,255,255,230
#   强调色（琥珀橙）220,120,60  成功 124,196,142  危险 235,100,100

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - page: 当前页面 (players/bans/mutes/warps/world)
    #   - packetId: 服务端回包 ID，用于客户端 Packet.send 回传
    #   - players: 在线玩家数据列表
    #   - playerCount: 在线玩家数量
    #   - warps: 传送点数据列表
    #   - bans: 封禁列表数据
    #   - banCount: 封禁数量
    #   - chatAvailable: Chat 模块是否可用 (true/false)
    #   - mutes: 禁言列表数据
    #   - muteCount: 禁言数量
    #   - worldName: 当前世界名称
    #   - worldTime: 当前世界时间
    #   - worldWeather: 当前世界天气
    init: |-
      var.page = packet['page']
      var.packetId = packet['packetId']
      var.players = packet['players']
      var.playerCount = packet['playerCount']
      var.warps = packet['warps']
      var.bans = packet['bans']
      var.banCount = packet['banCount']
      var.chatAvailable = packet['chatAvailable']
      var.mutes = packet['mutes']
      var.muteCount = packet['muteCount']
      var.worldName = packet['worldName']
      var.worldTime = packet['worldTime']
      var.worldWeather = packet['worldWeather']
  action:
    load: |-
      var.packetId = 'AXS_ESS_ADMIN'
      var.page = 'players'
      var.players = []
      var.playerCount = '0'
      var.warps = []
      var.bans = []
      var.banCount = '0'
      var.chatAvailable = 'false'
      var.mutes = []
      var.muteCount = '0'
      var.worldName = ''
      var.worldTime = '0'
      var.worldWeather = 'clear'
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send(var.packetId, 'refresh', 'players')
    # 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;30,32,38,110

  # 自适配布局：宽高 = 设计分辨率 1920x1080，窗口分辨率变化时按比例缩放子控件
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~62,66,74,210
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~220,120,60,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f管理面板"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 268
              width: 1
              height: 30
              normal: ~62,66,74,210
          在线数量:
            type: Text
            attribute:
              point: ~middle_left
              x: 288
              texts: "'&a在线 &f' + var.playerCount"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,120,60,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # 当前页：玩家
          导航玩家:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'players')
            children:
              玩家底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'players' ? '220,120,60,210' : '62,66,74,210'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "var.page == 'players' ? '220,120,60,230' : (self.isHovered() ? '245,205,130,255' : '255,255,255,230')"
              玩家高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~220,120,60,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'players'"
              玩家文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'players' ? '&0玩家' : '&f玩家'"
                  fontSize: 36
                  through: true
          # 当前页：封禁
          导航封禁:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'bans')
            children:
              封禁底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'bans' ? '220,120,60,210' : '62,66,74,210'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "var.page == 'bans' ? '220,120,60,230' : (self.isHovered() ? '245,205,130,255' : '255,255,255,230')"
              封禁高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~220,120,60,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'bans'"
              封禁文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'bans' ? '&0封禁' : '&f封禁'"
                  fontSize: 36
                  through: true
          # 当前页：禁言（Chat 模块未加载时隐藏）
          导航禁言:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
              visible: "var.chatAvailable == 'true'"
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'mutes')
            children:
              禁言底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'mutes' ? '220,120,60,210' : '62,66,74,210'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "var.page == 'mutes' ? '220,120,60,230' : (self.isHovered() ? '245,205,130,255' : '255,255,255,230')"
              禁言高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~220,120,60,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'mutes'"
              禁言文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'mutes' ? '&0禁言' : '&f禁言'"
                  fontSize: 36
                  through: true
          # 当前页：传送点
          导航传送点:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: "var.chatAvailable == 'true' ? 216 : 150"
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'warps')
            children:
              传送点底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'warps' ? '220,120,60,210' : '62,66,74,210'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "var.page == 'warps' ? '220,120,60,230' : (self.isHovered() ? '245,205,130,255' : '255,255,255,230')"
              传送点高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~220,120,60,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'warps'"
              传送点文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'warps' ? '&0传送点' : '&f传送点'"
                  fontSize: 36
                  through: true
          # 当前页：世界
          导航世界:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: "var.chatAvailable == 'true' ? 282 : 216"
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'world')
            children:
              世界底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'world' ? '220,120,60,210' : '62,66,74,210'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "var.page == 'world' ? '220,120,60,230' : (self.isHovered() ? '245,205,130,255' : '255,255,255,230')"
              世界高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~220,120,60,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'world'"
              世界文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'world' ? '&0世界' : '&f世界'"
                  fontSize: 36
                  through: true
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: "~&7ESC 关闭界面"
              fontSize: 36

      # ── 内容区 ─────────────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230

          # ─── 玩家列表视图 ───
          玩家布局:
            type: Canvas
            attribute:
              point: ~top_left
              x: 32
              y: 26
              width: "var.contentW - 64"
              height: "var.viewH - 196"
              visible: |-
                var.page == 'players'
            children:
              玩家页标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 0
                  y: 0
                  texts: "~&f在线玩家"
                  fontSize: 48
              玩家滑块:
                type: Texture
                val: 玩家滑块
                attribute:
                  point: ~top_right
                  x: -6
                  y: 60
                  width: 6
                  height: 50
                  normal: ~120,120,120,200
                  maxDragY: "var.viewH - 316"
              玩家滚动栏:
                type: Scroll
                attribute:
                  point: ~middle_left
                  x: 0
                  y: 60
                  width: "var.contentW - 82"
                  height: "var.viewH - 256"
                  moveY: "self.parent['玩家滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['玩家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['玩家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  players_list:
                    val: player_data
                    type: VStack
                    attribute:
                      x: 0
                      y: 0
                      width: "var.contentW - 82"
                      spaceBetween: 8
                    children:
                      玩家行:
                        type: Canvas
                        attribute:
                          entry: var.players[self.key]
                          visible: self.entry != none
                          width: "var.contentW - 90"
                          height: 64
                        children:
                          玩家行底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~62,66,74,210
                              shape: ~round_rect
                              radius: 10
                            effect:
                              stroke:
                                width: 2
                                color: ~255,255,255,180
                          玩家信息滚动:
                            type: Scroll
                            attribute:
                              point: ~middle_left
                              x: 20
                              width: 420
                              height: 36
                              scrollAnim: none
                              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                            action:
                              enter: |-
                                self.scrollAnim = Lerp(0, 1, 2000)
                              leave: |-
                                self.scrollAnim = none
                            children:
                              信息横排:
                                type: HStack
                                attribute:
                                  height: 36
                                children:
                                  玩家信息:
                                    type: Text
                                    attribute:
                                      x: 0
                                      y: 0
                                      texts: "'&f' + self.parent.parent.parent.entry['name'] + '  &c❤ ' + self.parent.parent.parent.entry['health'] + '  ' + (self.parent.parent.parent.entry['isFlying'] == 'true' ? (self.parent.parent.parent.entry['isGod'] == 'true' ? '&b飞行 &a无敌' : '&b飞行') : (self.parent.parent.parent.entry['isGod'] == 'true' ? '&a无敌' : '&7普通'))"
                                      fontSize: 36
                          玩家世界滚动:
                            type: Scroll
                            attribute:
                              point: ~middle_left
                              x: 440
                              width: 200
                              height: 36
                              scrollAnim: none
                              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                            action:
                              enter: |-
                                self.scrollAnim = Lerp(0, 1, 2000)
                              leave: |-
                                self.scrollAnim = none
                            children:
                              世界横排:
                                type: HStack
                                attribute:
                                  height: 36
                                children:
                                  玩家世界:
                                    type: Text
                                    attribute:
                                      x: 0
                                      y: 0
                                      texts: "'&7' + self.parent.parent.parent.entry['world']"
                                      fontSize: 36
                          # 操作按钮组（靠右排列）
                          操作按钮组:
                            type: Canvas
                            attribute:
                              point: ~middle_right
                              x: -16
                              width: "var.chatAvailable == 'true' ? 700 : 612"
                              height: 40
                            children:
                              按钮横排:
                                type: HStack
                                attribute:
                                  point: ~middle_right
                                  height: 40
                                  spaceBetween: 8
                                children:
                                  治疗按钮:
                                    type: Canvas
                                    attribute:
                                      width: 80
                                      height: 40
                                    action:
                                      clickLeft: |-
                                        Packet.send(var.packetId, 'heal', self.parent.parent.parent.entry['name'])
                                    children:
                                      治疗底:
                                        type: Texture
                                        attribute:
                                          point: ~stretch_all
                                          through: true
                                          normal: ~50,140,80,210
                                          hover: ~70,170,100,230
                                          shape: ~round_rect
                                          radius: 8
                                        effect:
                                          ripple:
                                          stroke:
                                            width: 2
                                            color: "self.isHovered() ? '124,196,142,255' : '255,255,255,180'"
                                      治疗文字:
                                        type: Text
                                        attribute:
                                          point: ~middle_center
                                          texts: "~&f治疗"
                                          fontSize: 36
                                          through: true
                                  喂食按钮:
                                    type: Canvas
                                    attribute:
                                      width: 80
                                      height: 40
                                    action:
                                      clickLeft: |-
                                        Packet.send(var.packetId, 'feed', self.parent.parent.parent.entry['name'])
                                    children:
                                      喂食底:
                                        type: Texture
                                        attribute:
                                          point: ~stretch_all
                                          through: true
                                          normal: ~160,130,40,210
                                          hover: ~190,160,60,230
                                          shape: ~round_rect
                                          radius: 8
                                        effect:
                                          ripple:
                                          stroke:
                                            width: 2
                                            color: "self.isHovered() ? '245,205,130,255' : '255,255,255,180'"
                                      喂食文字:
                                        type: Text
                                        attribute:
                                          point: ~middle_center
                                          texts: "~&f喂食"
                                          fontSize: 36
                                          through: true
                                  飞行按钮:
                                    type: Canvas
                                    attribute:
                                      width: 80
                                      height: 40
                                    action:
                                      clickLeft: |-
                                        Packet.send(var.packetId, 'fly', self.parent.parent.parent.entry['name'])
                                    children:
                                      飞行底:
                                        type: Texture
                                        attribute:
                                          point: ~stretch_all
                                          through: true
                                          normal: "self.parent.parent.parent.parent.entry['isFlying'] == 'true' ? '60,160,220,230' : '60,100,160,210'"
                                          hover: "self.parent.parent.parent.parent.entry['isFlying'] == 'true' ? '90,180,240,255' : '80,130,190,230'"
                                          shape: ~round_rect
                                          radius: 8
                                        effect:
                                          ripple:
                                          stroke:
                                            width: 2
                                            color: "self.isHovered() ? '120,200,255,255' : '255,255,255,180'"
                                      飞行文字:
                                        type: Text
                                        attribute:
                                          point: ~middle_center
                                          texts: "~&f飞行"
                                          fontSize: 36
                                          through: true
                                  无敌按钮:
                                    type: Canvas
                                    attribute:
                                      width: 80
                                      height: 40
                                    action:
                                      clickLeft: |-
                                        Packet.send(var.packetId, 'god', self.parent.parent.parent.entry['name'])
                                    children:
                                      无敌底:
                                        type: Texture
                                        attribute:
                                          point: ~stretch_all
                                          through: true
                                          normal: "self.parent.parent.parent.parent.entry['isGod'] == 'true' ? '80,160,80,230' : '70,100,70,210'"
                                          hover: "self.parent.parent.parent.parent.entry['isGod'] == 'true' ? '110,200,110,255' : '100,140,100,230'"
                                          shape: ~round_rect
                                          radius: 8
                                        effect:
                                          ripple:
                                          stroke:
                                            width: 2
                                            color: "self.isHovered() ? '124,196,142,255' : '255,255,255,180'"
                                      无敌文字:
                                        type: Text
                                        attribute:
                                          point: ~middle_center
                                          texts: "~&f无敌"
                                          fontSize: 36
                                          through: true
                                  传至按钮:
                                    type: Canvas
                                    attribute:
                                      width: 80
                                      height: 40
                                    action:
                                      clickLeft: |-
                                        Packet.send(var.packetId, 'teleport_to', self.parent.parent.parent.entry['name'])
                                    children:
                                      传至底:
                                        type: Texture
                                        attribute:
                                          point: ~stretch_all
                                          through: true
                                          normal: ~60,140,200,210
                                          hover: ~80,170,230,230
                                          shape: ~round_rect
                                          radius: 8
                                        effect:
                                          ripple:
                                          stroke:
                                            width: 2
                                            color: "self.isHovered() ? '120,200,255,255' : '255,255,255,180'"
                                      传至文字:
                                        type: Text
                                        attribute:
                                          point: ~middle_center
                                          texts: "~&f传至"
                                          fontSize: 36
                                          through: true
                                  召来按钮:
                                    type: Canvas
                                    attribute:
                                      width: 80
                                      height: 40
