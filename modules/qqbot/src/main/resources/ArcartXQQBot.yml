# 配置版本号（不要手动修改，由模块自动管理）
config-version: 6
# AXS QQBot QQ群服互联
# 作用: 通过 OneBot 11 协议连接 QQ 机器人，实现 QQ 群与服务器消息双向同步、
#       群指令查询玩家数据、QQ-游戏账号绑定、白名单管理。
# 重载: /axs reload qqbot
# 玩家入口: /qqbot bind <验证码> 绑定账号。
# PAPI: %axsqqbot_bound_qq%、%axsqqbot_bound_name% 等。

settings:
  # 是否输出调试日志
  debug: false
  # 服务器标识（多服时区分来源）
  server-id: "survival"

# ─── OneBot 11 WebSocket 连接 ──────────────────────────
onebot:
  # OneBot 正向 WebSocket 地址（如 SnowLuma/NapCat/Lagrange）
  ws-url: "ws://127.0.0.1:3001"
  # 复制实现端对应账号 Universal WS 的 access token；SnowLuma 默认自动生成，不可漏填。
  access-token: ""
  # 断线重连间隔（秒）
  reconnect-interval-seconds: 10
  # WebSocket ping/pong 存活检测超时（秒，10～300），与 OneBot 业务心跳事件分开。
  heartbeat-interval-seconds: 30
  # 默认只连接外部实现端，不执行进程/容器管理。详细安装和 token 步骤见 Wiki。
  # 托管必须明确选择 native/docker；仅管理自身安装标记/容器标签验证通过的对象。
  snowluma:
    # external / native / docker。external 下 install/start/stop/password 不操作外部服务。
    mode: "external"
    # 托管安装和归属标记目录（服务端根目录下独立子目录）；不要删除 .axs-qqbot-owner。
    dir: "snowluma"
    # 模块启动时自动启动 SnowLuma（前提：已通过 install 安装）
    auto-start: false
    # WebUI 初始密码（可选，仅 SnowLuma 首次初始化时生效）
    # 留空: 首次启动自动生成随机临时密码，见控制台输出或 /axs qqbot snowluma password
    # 设置: 首次启动即以该值为 admin 密码，且不会强制改密；已初始化过则此配置不生效
    webui-password: ""
    # 自动同意 SnowLuma 的 EULA 与隐私协议（设为 true 后首次打开 WebUI 不再显示协议确认页）
    accept-agreements: false
    # Docker 模式专用配置
    docker:
      # 容器名称
      container-name: "snowluma"
      # Docker 镜像
      image: "motricseven7/snowluma:latest"
      # 默认只发布到宿主回环；VPS 从自己的电脑用 SSH 转发 5099/6081。
      # 显式改为 0.0.0.0 或其他 IP 字面量时必须设置 vnc-password，并配置访问范围和鉴权。
      # 不接受主机名或命令文本；修改发布地址/端口后执行 snowluma install 重建托管容器。
      bind-address: "127.0.0.1"
      webui-port: 5099
      ws-port: 3001
      http-port: 3000
      # noVNC 网页远程桌面端口（Docker 模式下登录 QQ 需在浏览器操作内嵌 QQ 客户端）
      novnc-port: 6081
      # VNC/noVNC 密码，留空由镜像随机生成，使用 snowluma logs 查看。
      vnc-password: ""
      # 是否自动拉取并运行容器（模块启动时若容器不存在则自动 install）
      auto-install: false

# ─── 监听的 QQ 群 ──────────────────────────────────────
groups: []
# 配置你自己的测试群后再启用消息接入，例如：
# groups:
#   - group-id: 123456789
    # 消息同步模式: both / game-to-qq / qq-to-game / none
#     sync-mode: "both"
    # 游戏消息转发到 QQ 群的格式
#     game-to-qq: "[MC] {player}: {message}"
    # QQ 群消息转发到游戏内的格式
#     qq-to-game: "&7[QQ] &f{nick}: &7{message}"
    # 是否允许群成员执行指令
#     commands-enabled: true
    # 玩家进服通知
#     join-message: "[MC] {player} 加入了服务器"
    # 玩家退服通知
#     quit-message: "[MC] {player} 离开了服务器"

# ─── 消息发送约束 ──────────────────────────────────────
delivery:
  max-message-length: 300
  player-cooldown-seconds: 3
  group-messages-per-minute: 30
  require-binding: false
  # 无 Chat 模块时，明确打开才使用未被取消的原版聊天事件转发。
  vanilla-chat-fallback: false

# ─── QQ-游戏账号绑定 ───────────────────────────────────
binding:
  enabled: true
  # 绑定事实由宿主认证管理：Realm 内账号/QQ 一对一，验证码 300 秒。
  # QQBot 只提供群申请和游戏确认入口；准入要求在宿主认证/LoginView 配置。
  # 群内绑定指令前缀（如 "#绑定 玩家名"）
  bind-prefix: "#绑定"
  # 群内解绑指令前缀
  unbind-prefix: "#解绑"
  # 群内查绑指令前缀
  query-prefix: "#查绑"

# ─── 白名单管理 ────────────────────────────────────────
whitelist:
  enabled: true
  # Minecraft 白名单独立管理，不随认证绑定/解绑自动执行。
  # 白名单命令模板
  add-command: "whitelist add {name}"
  remove-command: "whitelist remove {name}"
  # 群内白名单管理仅允许 admin.qq-list 中的可信 QQ；QQ群管/群主不自动获权。
  add-prefix: "#白名单添加"
  remove-prefix: "#白名单移除"
  list-prefix: "#白名单列表"

# ─── 可信 QQ 与远程控制 ──────────────────────────────────
# 白名单、踢/封、邮件、公告、黑名单及自定义 server-command 仅允许此名单。
# 普通QQ群管/群主不会自动获得游戏服务器管理权限。
admin:
  # 可信 QQ 的游戏管理总开关；必须 true 且命中 qq-list，具体管理功能才可用。
  enabled: false
  # #cmd 远程控制台独立开关；只有两个开关均 true 且命中名单时开放。
  remote-console-enabled: false
  # 明确受信任的管理 QQ 号；默认空名单。不要把普通群成员或所有QQ群管批量加入。
  qq-list: []
  # 管理员指令前缀（如 "#cmd say hello" 会在控制台执行 "say hello"）
  command-prefix: "#cmd"
  # 允许执行的命令白名单（命令名，不含参数；留空表示允许全部命令）
  # 配置后，管理员只能执行白名单内的命令，防止 RCE 风险
  allowed-commands:
    - say
    - list
    - whitelist
    - kick
    - ban
    - pardon
    - op
    - deop
    - save-all
    - stop
    - reload

# ─── 自定义群指令 ──────────────────────────────────────
# 指令前缀（群消息以此开头才会被识别为指令）
command-prefix: "#"
# 帮助指令前缀
help-prefix: "#帮助"
custom-commands:
  查在线:
    # 权限: 0=普通群员, 1=admin.qq-list 中可信 QQ。
    # server-command 类型始终强制可信名单，permission: 0 也不能放宽。
    permission: 0
    # 类型: builtin / server-command / papi-query
    type: "builtin"
    builtin-id: "online-list"
  查服务器:
    permission: 0
    type: "builtin"
    builtin-id: "server-status"
  查玩家:
    permission: 0
    type: "papi-query"
    # 需要绑定才能查自己，或指定玩家名
    usage: "#查玩家 [玩家名]"
    placeholders:
      - "%player_level%"
      - "%vault_eco_balance%"
      - "%player_health%"
      - "%player_food_level%"
    format: "玩家: {name}\n等级: {0}\n金币: {1}\n生命: {2}\n饥饿: {3}"
  积分榜:
    permission: 0
    type: "builtin"
    builtin-id: "points-leaderboard"

# ─── 签到打卡 + 积分系统 ───────────────────────────────
# 群成员每日签到获得积分，连续签到有额外加成。
# 积分可在兑换商店通过邮件领取游戏奖励。
signin:
  enabled: true
  # 每日签到基础积分
  base-points: 10
  # 每多连续签到 1 天额外增加的积分
  streak-bonus: 2
  # 连续签到加成上限（防止无限叠加）
  max-streak-bonus: 50
  # 签到指令
  sign-prefix: "#签到"
  # 签到别名（任意一个都可触发签到）
  aliases:
    - "#打卡"
  # 兑换商店指令
  shop-prefix: "#商店"
  # 兑换指令前缀（如 "#兑换 diamond"）
  redeem-prefix: "#兑换"
  # 积分查询指令
  points-query-prefix: "#积分"
  # 积分转账指令
  transfer-prefix: "#转账"
  # 发红包指令
  red-packet-prefix: "#红包"
  # 抢红包指令
  grab-red-packet-prefix: "#抢红包"
  # 活跃度排行指令
  activity-prefix: "#活跃排行"

# ─── 积分兑换奖品 ──────────────────────────────────────
# 兑换后通过邮件系统（Mail 模块）将奖品发放给绑定玩家。
# mail.presets 须对应 Mail 模块中配置的邮件预设。
prizes: []
# 创建并验证 Mail 预设后，按 Wiki 示例添加奖品。

# ─── 服务器监控告警 ─────────────────────────────────────
# 检测到 TPS 过低或内存占用过高时自动推送告警到群。
monitor:
  enabled: false
  # TPS 低于此值触发告警
  tps-threshold: 15.0
  # 内存占用百分比超过此值触发告警
  memory-threshold-percent: 90
  # 检测间隔（秒）
  check-interval-seconds: 60
  # 同类告警冷却（秒），避免刷屏
  cooldown-seconds: 300
  # 接收告警的群号列表（留空=推送到所有已配置群）
  alarm-groups: []
  # TPS 告警格式
  tps-alarm-format: "⚠ 服务器告警\nTPS 过低: {tps}（阈值 {threshold}）"
  # 内存告警格式
  memory-alarm-format: "⚠ 服务器告警\n内存占用过高: {used}MB/{max}MB ({percent}%)"

# ─── 定时消息 ──────────────────────────────────────────
# mode: interval（固定间隔）/ daily（每日定时 HH:mm）
# 占位符: {online} 在线人数, {max} 最大人数, {tps} 当前TPS
scheduled-messages: []

# ─── 击杀播报 ──────────────────────────────────────────
# 游戏内击杀事件推送到 QQ 群。
broadcast:
  kill:
    enabled: false
    format: "🗡 {killer} 击杀了 {victim}"
    # 仅播报 Boss 击杀（victim 名称匹配 boss-keywords）
    boss-only: true
    # 仅播报玩家击杀玩家（PvP），优先级高于 boss-only
    player-kill-only: false
    # Boss 名称关键词（包含即视为 Boss）
    boss-keywords:
      - "Boss"
      - "首领"
      - "魔王"
  death:
    enabled: false
    format: "☠ {player} 死亡了"

# ─── 大额交易播报 ────────────────────────────────────────
# 订阅 market 模块的 EventBus 事件，当拍卖成交价 >= 阈值时推送到 QQ 群。
market-broadcast:
  # 是否启用大额交易播报
  enabled: false
  # 大额交易阈值，成交价 >= 此值才播报
  threshold: 1000.0

# ─── 入群欢迎 ──────────────────────────────────────────
# 新成员加群时自动 @ 并发送欢迎消息。
welcome:
  enabled: false
  message: "欢迎新成员加入！\n发送 #绑定 <游戏名> 关联你的游戏账号\n发送 #帮助 查看可用指令"

# ─── 关键词自动回复（FAQ） ─────────────────────────────
auto-reply:
  enabled: false
  # 同一群两次自动回复的最小间隔（秒），防刷屏
  cooldown-seconds: 30
  rules:
    - keywords: ["怎么进服", "服务器地址", "ip"]
      response: "服务器地址: play.example.com\n首次进入请先在群内 #绑定 <游戏名>"
      # true=消息须完全等于关键词，false=包含即触发
      exact-match: false
    - keywords: ["怎么绑定", "如何绑定"]
      response: "在群里发送: #绑定 <你的游戏名>\n然后按提示在游戏内输入验证码即可"
      exact-match: false

# ─── 群公告广播 ────────────────────────────────────────
# 可信名单 QQ 在群内发布公告，同步到游戏内（聊天栏 + 标题）。
announce:
  enabled: false
  prefix: "#公告"
  # 游戏内聊天栏格式
  game-format: "&e&l[群公告] &f{content}"
  # 发布成功后给群的回执
  qq-receipt: "✓ 公告已发布到游戏内"
  # 是否同时弹出标题
  title-enabled: true
  title-text: "&e群公告"
  subtitle-format: "&f{content}"

# ─── 群管理 moderation ─────────────────────────────────
# 可信名单 QQ 可在群内踢出/封禁游戏玩家；群角色本身不赋权。
# 可选 QQ 禁言同步功能需另外明确开启。
moderation:
  enabled: false
  kick-prefix: "#踢"
  ban-prefix: "#封禁"
  kick-command: "kick {name} {reason}"
  ban-command: "ban {name} {reason}"
  # QQ 群禁言 → 游戏内封禁绑定玩家
  sync-ban:
    enabled: false
    # {duration} 为禁言时长（分钟，如 "10m"），{name} 玩家名，{reason} 原因
    command: "tempban {name} {duration} {reason}"
    # 是否按 QQ 禁言时长设置游戏封禁时长
    use-duration: true
    reason: "QQ群禁言同步"
  # 关键词自动撤回 + 禁言（广告拦截）
  auto-moderation:
    enabled: false
    keywords:
      - "http://"
      - "https://"
      - "www."
      - "点击"
      - "加群"
    # 禁言时长（秒）
    ban-duration-seconds: 600
    # 同一群两次自动 moderation 最小间隔（秒）
    cooldown-seconds: 300

# ─── 群内 @ → 游戏内提示 ───────────────────────────────
# 当群消息中 @ 了某 QQ 号，若该 QQ 绑定的玩家在线，游戏内收到 Title 提示。
at-to-game:
  enabled: true

# ─── 黑名单 ────────────────────────────────────────────
# 列入黑名单的 QQ 号将被禁止使用机器人的所有功能：
# 指令处理、消息同步、入群欢迎、签到积分、自动回复等。
# 支持通过群指令动态添加/移除（仅 admin.qq-list 可信 QQ）。
blacklist:
  enabled: false
  qq-list: []
  add-prefix: "#黑名单添加"
  remove-prefix: "#黑名单移除"
  list-prefix: "#黑名单列表"

# ─── 存储（QQ-游戏绑定数据） ──────────────────────────
storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  # —— shared: false 时使用下方独立连接参数 ——
  # 存储模式：sqlite 或 mysql。
  mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  sqlite:
    file: "qqbot.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  pool-size: 1
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "arcartxsuite"
    username: "root"
    password: ""
    table-prefix: "axs_qqbot_"

# ─── UI 界面配置 ───────────────────────────────────────
# 新版文件导出到模块目录 ui/qqbot_v2/（qqbot_bind.yml 等），旧 ui/ 自定义文件保留。
ui:
  # 绑定中心 UI ID
  bind-ui-id: "AXS:qqbot_bind"
  # 消息通知 HUD UI ID
  notify-ui-id: "AXS:qqbot_notify"
  # 管理后台 UI ID
  admin-ui-id: "AXS:qqbot_admin"
  # 是否启用消息通知 HUD（屏幕右上角弹出新消息）
  notify-enabled: true
  # 模块启动时是否自动注册 UI
  register-ui-on-enable: true
  # 是否强制覆盖已存在的 UI 文件
  overwrite-ui-files: false

# ─── 消息文本 ─────────────────────────────────────────
# 以下为各场景的消息模板，{xxx} 为占位符变量。
messages:
  # 消息前缀
  prefix: "&8[&bQQBot&8] &7"
  # 验证码发送提示（群内）
  bind-code-sent: "验证码已生成: {code}\n请在 {expire} 秒内到游戏中输入:\n/qqbot bind {code}"
  # 绑定成功提示（群内）
  bind-success: "绑定成功！\nQQ: {qq} ↔ 游戏: {name}"
  # 绑定成功提示（游戏内）
  bind-success-game: "&a绑定成功！QQ: &e{qq} &a↔ 游戏: &e{name}"
  # QQ 已绑定其他玩家时的提示
  already-bound: "该QQ已绑定玩家 {name}，如需换绑请先解绑"
  # 解绑成功提示（群内）
  unbind-success: "已解除绑定: {name}"
  # 解绑成功提示（游戏内）
  unbind-success-game: "&c已解除与 QQ &e{qq} &c的绑定"
  # 未绑定提示
  not-bound: "该账号尚未绑定"
  # 验证码过期提示
  code-expired: "验证码已过期，请重新获取"
  # 验证码无效提示（游戏内）
  code-invalid: "&c验证码无效或已过期"
  # 白名单添加成功
  whitelist-added: "已为 {name} 添加白名单"
  # 白名单移除成功
  whitelist-removed: "已移除 {name} 的白名单"
  # 机器人连接成功提示
  bot-connected: "&aQQ 机器人已连接"
  # 机器人断开提示
  bot-disconnected: "&cQQ 机器人连接断开"
  # 无权限提示
  no-permission: "你没有权限执行此指令"
  # 玩家不存在提示
  player-not-found: "找不到玩家: {name}"
  # 命令执行成功提示
  command-executed: "命令已执行: {command}"
  # 管理员命令执行成功
  admin-command-executed: "[管理] 命令已执行: {command}"
  # 管理员命令执行失败
  admin-command-failed: "[管理] 命令执行失败: {command}"
  # ─── 签到积分 ───
  # 签到成功提示
  signin-success: "签到成功！获得 {points} 积分\n连续签到 {streak} 天，当前积分 {balance}"
  # 重复签到提示
  signin-already: "你今天已经签到过了\n连续签到 {streak} 天，当前积分 {balance}"
  # 积分查询结果
  points-query: "你的积分: {balance}\n累计获得 {earned}，已消费 {spent}"
  # 兑换商店头部
  shop-header: "═══ 积分兑换商店 ═══\n（发送 #兑换 <编号> 兑换奖品）"
  # 兑换商店单项格式
  shop-item: "[{id}] {name} - {cost}积分\n  {desc}"
  # 兑换商店尾部
  shop-footer: "═══════════════\n你的积分: {balance}"
  # 兑换成功提示
  redeem-success: "兑换成功！\n奖品 [{name}] 将通过邮件发放给 {player}\n已扣除 {cost} 积分，剩余 {balance}"
  # 积分不足提示
  redeem-no-points: "积分不足！兑换 [{name}] 需要 {cost} 积分，你只有 {balance}"
