                        color: 'self.isHovered() ? ''220,230,240,255'' : ''100,110,120,220'''
                  转让字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: 'var.memberName != none ? ''&f将所有权转让给 '' + var.memberName : ''&e请先选中一个成员'''
                      fontSize: 36
                      through: true
      居中操作提示:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 0
          y: 0
          width: 560
          height: var.noticeCount * 28 + 36
          visible: var.noticeActive
          alpha: 'var.noticeFade == none ? 0 : var.noticeFade.get()'
