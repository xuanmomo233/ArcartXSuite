# 文件用途: 角色活动祈愿卡池数据定义。
# 定义角色活动祈愿的消耗、保底机制、概率参数和各星级物品池（UP/常驻）。
# 类型为 GACHA（原神祈愿），5星保底90抽，UP角色概率50%。

id: "character_event_1"  # 卡池唯一标识
type: GACHA  # 卡池类型：GACHA（原神祈愿）
enabled: true  # 是否启用
display-name: "角色活动祈愿"  # 显示名称
description: |-  # 卡池描述文本
  角色活动祈愿
  在本祈愿中，5星角色「星辰」的获取概率将大幅提升！
  5星保底90抽，4星保底10抽，UP角色概率50%。
up-item-icon: '{"id":"minecraft:nether_star","Count":1b}'  # UP 物品图标（JSON 格式）
# up-item-icon、points.*.icon 与奖品的 icon 都支持完整图标定义（与 Menu 模块一致）：
#   material / amount / name / lore / custom-model-data / glow
#   skull-texture / color / source + id / mmo-type + mmo-id
#   json / texture / texture-url / nbt
# nbt 支持两种写法：
#   nbt:
#     CustomTag: "value"                       # 写法一：键值映射，逐个写入字符串标签
#   nbt: "{CustomTag:'value',Unbreakable:1b}"  # 写法二：整段 SNBT 字符串

cost:
  single:
    - type: CURRENCY
      id: "gem"
      amount: 160
      display-name: "原石"
    - type: ITEM
      id: "minecraft:amethyst_shard"
      amount: 1
      display-name: "纠缠之缘"
  ten:
    - type: CURRENCY
      id: "gem"
      amount: 1600
      display-name: "原石"
    - type: ITEM
      id: "minecraft:amethyst_shard"
      amount: 10
      display-name: "纠缠之缘"

# 积分产出规则：gacha 的 rarity key 使用星级（3/4/5），case 使用奖池中定义的 rarity 名称
points:
  stardust:
    display-name: "星尘"
    icon: "minecraft:amethyst_shard"
    per-pull: 1
    rarity:
      "4": 2
      "5": 10

gacha:  # 祈愿机制参数
  pool-type: CHARACTER  # 卡池类型：CHARACTER（角色池）
  pity-5star: 90  # 5星硬保底抽数
  pity-4star: 10  # 4星硬保底抽数
  soft-pity-start: 73  # 软保底起始抽数（之后概率递增）
  soft-pity-increment: 0.06  # 软保底每次递增量
  base-5star-rate: 0.006  # 5星基础概率（0.6%）
  base-4star-rate: 0.051  # 4星基础概率（5.1%）
  up-rate: 0.5  # UP 物品在对应星级中的概率（50%）
  shared-pity-group: "character_events"  # 共享保底分组（同组卡池共享保底计数）

  up-5star-items:  # UP 5星物品池（概率提升）
    star_character:
      id: "character_star"  # 物品唯一标识
      name: "星辰"  # 物品显示名称
      plugin-type: MythicMobs  # 物品来源插件类型：MythicMobs
      plugin-id: "StarCharacter"  # 物品来源插件内部 ID
      delivery: DIRECT  # 发放方式：DIRECT（直接发放）
      weight: 1  # 权重（同池内相对概率）
      # 奖品在 UI 中的图标，省略时由 plugin-type/plugin-id 生成的物品充当
      # icon:
      #   material: "NETHER_STAR"
      #   name: "&b星辰"
      #   lore:
      #     - "&7限定 5 星角色"
      #   glow: true
      #   nbt: "{CustomTag:'character_star'}"

  standard-5star-items:  # 常驻 5星物品池（未命中 UP 时的 fallback）
    moon_character:
      id: "character_moon"
      name: "月影"
      plugin-type: MythicMobs
      plugin-id: "MoonCharacter"
      delivery: DIRECT
      weight: 1

  up-4star-items:  # UP 4星物品池（概率提升）
    star_sword:
      id: "weapon_sword"
      name: "星光剑"
      plugin-type: NeigeItems  # 物品来源插件类型：NeigeItems
      plugin-id: "StarSword"
      delivery: DIRECT
      weight: 1

  standard-4star-items:  # 常驻 4星物品池（未命中 UP 时的 fallback）
    wind_bow:
      id: "weapon_bow"
      name: "风之弓"
      plugin-type: NeigeItems
      plugin-id: "WindBow"
      delivery: DIRECT
      weight: 1

  star3-items:  # 3星物品池（保底之外的基础掉落）
    material_common:
      id: "material_common"
      name: "普通材料"
      plugin-type: PLAIN  # 物品来源类型：PLAIN（原版物品，非插件）
      plugin-id: "minecraft:stone"
      delivery: DIRECT
      weight: 1
