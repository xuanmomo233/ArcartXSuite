# 示例地牢：元气试炼之地（元气骑士式三层地牢）
# world.template: void 生成虚空世界；全部建筑由 scripts.yml 的 world-init
# 段用 fillblocks 程序化搭建——无需任何 schematic/模板文件即可直接进本。
#
# 玩法结构（floors 模式）：
#   第 1 层 苔痕前哨：起始房(向导 NPC + Chemdah 会话/委托) → 战斗房(两波+休整)
#                    → 祭坛房(金币换三选一祝福) → Boss房(冲撞兽+增援) → 层间三选一天赋
#   第 2 层 熔岩矿道：三连战(波间休整) → 商店(金币购物) → 拉杆解谜(封门)
#                    → Boss房(唤魔者+卫道士) → 层间三选一天赋
#   第 3 层 深渊王座：走廊决战(陷阱地带+两波) → 宝箱房 → 终层Boss(凋零+两阶段增援)
#   全程：击杀掉金币(全队共享)、guide_point 导航、questgps 委托追踪、通关宝箱

name: "&6元气试炼之地"
mode: floors              # 多层房间地牢（floors.yml + rooms.yml）
icon: "END_STONE"
difficulty: "普通"
description:
  - "&7元气骑士式三层地牢：战斗→休整→祭坛/商店→Boss"
  - "&7击杀攒金币，祭坛与商店兑换补给，每层Boss后三选一天赋"
  - "&7适配 Adyeshach NPC + Chemdah 会话/委托（缺省自动降级）"

world:
  template: "void"          # void=虚空世界 / <maps目录名> / 本目录world/文件夹
  spawn: "2,61,11,270,0"     # 第 1 层起始房内（world-init 会先建好房间再传送）
  # 副本游戏规则覆盖（键=Bukkit GameRule 名，值=布尔或整数；默认已内置一套副本规则）
  # gamerules:
  #   keepInventory: true
  #   mobGriefing: false
  #   randomTickSpeed: 0
  # 禁止环境驱动刷怪（虚空世界本就不刷；模板世界建议开启）
  # disable-natural-spawn: true

time-limit: 1200            # 20 分钟（三层内容量）
timeout-action: "FAIL"      # FAIL=超时判负 / KICK=踢出
max-instances: 0            # 0=不限

requirements:
  min-players: 1
  max-players: 4
  party-required: false
  min-level: 0
  max-level: 0
  cooldown: 300             # 通关冷却 5 分钟
  money-cost: 0
  currency-id: "money"
  stamina-cost: 10
  required-items: []
  required-permissions: []
  conditions: []
  disabled-commands: [spawn, tpa, home]
  disabled-items: [CHORUS_FRUIT]

# questgps 主线门禁（可选）：在 QuestGPS 配置 gate.blocked-module-entries 声明
# "abyss.example" 后，未完成前置主线的玩家进本会被拒（questgps 未启用恒放行）。

# 跨模块联动（全部可选；对应模块未启用时自动跳过）
links:
  # 通关全服播报（announce 模块；{party} {dungeon} {time}）
  announce-clear: "&6{party} 通关 {dungeon}&6，用时 &f{time}&6！"
  # qq-notify-clear: false
