                      fontSize: 30
                      through: true
              展示按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 558
                  y: 250
                  width: 118
                  height: 48
                action:
                  clickLeft: |-
                    if(var.ownerType == 'shared'){
                      Packet.send(var.packetId, 'shared_showcase_toggle', var.ownerId, var.actionToken)
                    }else{
                      Packet.send(var.packetId, 'personal_showcase_toggle', var.warehouseId, var.actionToken)
                    }
                children:
                  展示底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.showcaseEnabled ? '104,84,46,225' : '62,66,74,210'"
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '245,205,130,255' : (var.showcaseEnabled ? '232,180,90,235' : '255,255,255,230')"
                  展示字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 118
                      texts: "var.showcaseEnabled ? '&f展示 开' : '&7展示 关'"
                      fontSize: 28
                      through: true
              分隔二:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 24
                  y: 318
                  width: 652
                  height: 3
