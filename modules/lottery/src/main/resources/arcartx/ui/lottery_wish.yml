      # ════════════════════════════════════════════════════════════
      单抽结果层:
        type: Canvas
        val: 单抽结果层
        attribute:
          point: ~stretch_all
          visible: false
        children:
          单抽结果底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,14,24,228
          单抽保底提示:
            type: Text
            attribute:
              point: ~top_center
