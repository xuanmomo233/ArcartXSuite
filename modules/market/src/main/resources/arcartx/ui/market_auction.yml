# AXS Market — 拍卖行主界面
# 打开方式: /market 或 /market auction
# 数据交互: packetHandler init/update；客户端 Packet.send(var.packetId, action, ...)

ui:
  isHud: false
  defaultOpen: false
  hide:
    - HUD
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: init
    # 首次收到服务端数据包时执行，初始化界面所有变量和动态控件
    # 包字段:
    #   - packetId: 数据包通信 ID（用于客户端 Packet.send 回传）
    #   - page: 当前页码（从 0 开始）
    #   - totalPages: 总页数
    #   - pageText: 页码显示文本（如 "1/5"）
    #   - currentCategory: 当前选中的分类 ID（如 "all"、"weapon"）
    #   - categories: 分类字典（key=序号, value=分类对象含 id/displayName 等）
    #   - categoryTexts: 分类显示文本字典（key=序号, value=带颜色码的分类名）
    #   - listings: 拍卖列表字典（key=序号, value=拍卖条目含 id/name/seller/price/bid 等）
    #   - listingTexts: 拍卖条目显示文本字典（key=序号, value=格式化文本）
    #   - itemJson{key}: 各拍卖物品的 NBT JSON 字符串（如 itemJson0、itemJson1...）
    #   - maxCategoryCount: 分类最大数量（用于动态复制分类项控件）
    #   - maxListingCount: 拍卖条目最大数量（用于动态复制拍卖卡片控件）
    #   - action_token: 操作令牌（防重放攻击，购买/出价/取消时回传）
    init: |-
      var.packetId = packet['packetId']
      var.page = packet['page']
      var.totalPages = packet['totalPages']
      var.pageText = packet['pageText']
      var.currentCategory = packet['currentCategory']
      var.categories = packet['categories']
      var.categoryTexts = packet['categoryTexts']
      var.listings = packet['listings']
      var.listingTexts = packet['listingTexts']
      var.itemJsons = {}
      var.maxCategoryCount = packet['maxCategoryCount']
      var.maxListingCount = packet['maxListingCount']
      var.actionToken = packet['action_token']
      for(key in var.listings.keys()){
        json = packet['itemJson' + key]
        if(json != none){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      while(val.分类列表.childrenCount() > 1){
        val.分类列表.get(1).remove()
      }
      for(i in range(1, var.maxCategoryCount - 1)){
        key = i.round()
        e = val.分类列表['分类项'].copy('分类项' + key)
        e.entryKey = key
      }
      while(val.物品列表.childrenCount() > 1){
        val.物品列表.get(1).remove()
      }
      for(i in range(1, var.maxListingCount - 1)){
        key = i.round()
        e = val.物品列表['拍卖卡片'].copy('拍卖卡片' + key)
        e.entryKey = key
      }
      for(i in range(0, var.maxListingCount - 1)){
        key = i.round()
        e = val.物品列表.get(i.round())
        if(e != none && e['物品图标'] != none){
          e['物品图标'].entryKey = key
          e['物品图标'].seticon()
        }
      }
      var.actionBusy = false
    # packetHandler: update
    # 服务端推送更新时执行，字段与 init 完全相同，用于刷新界面数据
    # 包字段: 同 init（packetId/page/totalPages/pageText/currentCategory/categories/
    #   categoryTexts/listings/listingTexts/itemJson{key}/maxCategoryCount/
    #   maxListingCount/action_token）
    update: |-
      // 保存旧数量，用于判断是否需要重建列表
      oldMaxCategoryCount = var.maxCategoryCount
      oldMaxListingCount = var.maxListingCount
      var.packetId = packet['packetId']
      var.page = packet['page']
      var.totalPages = packet['totalPages']
      var.pageText = packet['pageText']
      var.currentCategory = packet['currentCategory']
      var.categories = packet['categories']
      var.categoryTexts = packet['categoryTexts']
      var.listings = packet['listings']
      var.listingTexts = packet['listingTexts']
      var.itemJsons = {}
      var.maxCategoryCount = packet['maxCategoryCount']
      var.maxListingCount = packet['maxListingCount']
      var.actionToken = packet['action_token']
      for(key in var.listings.keys()){
        json = packet['itemJson' + key]
        if(json != none){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      // ── 分类列表：仅在数量变化时重建 ──
      if(var.maxCategoryCount != oldMaxCategoryCount){
        while(val.分类列表.childrenCount() > 1){
          val.分类列表.get(1).remove()
        }
        for(i in range(1, var.maxCategoryCount - 1)){
          key = i.round()
          e = val.分类列表['分类项'].copy('分类项' + key)
          e.entryKey = key
        }
      }
      // ── 物品列表：仅在数量变化时重建 ──
      if(var.maxListingCount != oldMaxListingCount){
        while(val.物品列表.childrenCount() > 1){
          val.物品列表.get(1).remove()
        }
        for(i in range(1, var.maxListingCount - 1)){
          key = i.round()
          e = val.物品列表['拍卖卡片'].copy('拍卖卡片' + key)
          e.entryKey = key
        }
      }
      // 重新触发物品图标 seticon（数据变了但 seticon 不会自动刷新）
      for(i in range(0, var.maxListingCount - 1)){
        key = i.round()
        e = val.物品列表.get(i.round())
        if(e != none && e['物品图标'] != none){
          e['物品图标'].entryKey = key
          e['物品图标'].seticon()
        }
      }
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    # action: open
    # UI 打开时执行，初始化所有变量为默认空值，然后向服务端请求第一页拍卖列表
    # 发送数据包: Packet.send(packetId, 'auction_list', 页码, 分类, 搜索词)
    open: |-
      var.packetId = 'AXS_MARKET'
      var.page = 0
      var.totalPages = 1
      var.pageText = '1/1'
      var.currentCategory = 'all'
      var.categories = {}
      var.categoryTexts = {}
      var.listings = {}
      var.listingTexts = {}
      var.itemJsons = {}
      var.search = none
      var.categoryScrollRatio = 0
      var.listingScrollRatio = 0
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.maxCategoryCount = 0
      var.maxListingCount = 0
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      Packet.send(var.packetId, 'auction_list', '0', none, none)

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1500
          height: 900
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~28,30,42,244
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~90,170,255,150
              shadow:
                xOffset: 0
                yOffset: 4
                blur: 12
                color: ~0,0,0,140

          标题:
            type: Text
            attribute:
              x: 42
              y: 24
              texts: "~&6全球拍卖行"
              fontSize: 100

          # ── 顶部按钮栏 ──────────────────────────────
          全部按钮:
            type: Canvas
            attribute:
              x: 400
              y: 28
              width: 110
              height: 48
            action:
              clickLeft: |-
                var.currentCategory = 'all'
                Packet.send(var.packetId, 'auction_list', '0', 'all', var.search)
            children:
              全部背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.currentCategory == 'all' ? '70,150,250,230' : '56,58,70,220'"
                  hover: ~Frosted:0;255,255,255,80
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,70
              全部文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 110
                  texts: "~&f全部"
                  fontSize: 42
                  through: true

          我的上架按钮:
            type: Canvas
            attribute:
              x: 522
              y: 28
              width: 130
              height: 48
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'auction_list', '0', 'my', none)
            children:
              我的上架背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~56,58,70,220
                  hover: ~Frosted:0;255,255,255,80
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,70
              我的上架文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 130
                  texts: "~&f我的上架"
                  fontSize: 42
                  through: true

          刷新按钮:
            type: Canvas
            attribute:
              x: 664
              y: 28
              width: 90
              height: 48
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'auction_list', var.page, var.currentCategory, var.search)
            children:
              刷新背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~56,58,70,220
                  hover: ~Frosted:0;255,255,255,80
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,70
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 90
                  texts: "~&f刷新"
                  fontSize: 42
                  through: true

          我要上架按钮:
            type: Canvas
            attribute:
              x: 766
              y: 28
              width: 130
              height: 48
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'sell_ui_open')
            children:
              我要上架背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~70,150,250,230
                  hover: ~Frosted:0;255,255,255,80
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 2
                    color: ~140,200,255,140
              我要上架文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 130
                  texts: "~&f我要上架"
                  fontSize: 32
                  through: true

          # ── 搜索框 ──────────────────────────────────
          搜索区:
            type: Texture
            attribute:
              x: 1062
              y: 28
              width: 340
              height: 48
              normal: ~40,42,54,220
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 2
                color: ~90,170,255,60
            children:
              搜索框:
                type: TextBox
                attribute:
                  x: 12
                  y: 8
                  width: 216
                  height: 32
                  length: 32
                  emptyText: ~搜索物品...
                  fontSize: 28
                  background: ~56,58,70,220
                  shape: ~round_rect
                  radius: 10
                action:
                  textChange: |-
                    var.search = self.getContent()
                  enter: |-
                    Packet.send(var.packetId, 'auction_list', '0', var.currentCategory, var.search)
                effect:
                  stroke:
                    width: 1
                    color: ~90,170,255,50
              搜索按钮:
                type: Canvas
                attribute:
                  x: 240
                  y: 6
                  width: 88
                  height: 36
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'auction_list', '0', var.currentCategory, var.search)
                children:
                  搜索背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~70,150,250,220
                      hover: ~Frosted:0;255,255,255,220
                      shape: ~round_rect
                      radius: 10
                  搜索文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 88
                      texts: "~&f搜索"
                      fontSize: 28
                      through: true

          # ── 关闭按钮 ────────────────────────────────
          关闭按钮:
            type: Canvas
            attribute:
              x: 1422
              y: 28
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~180,70,70,210
                  hover: ~Frosted:0;220,90,90,230
                  shape: ~round_rect
                  radius: 12
                  through: true
                effect:
                  stroke:
                    width: 1
                    color: ~255,130,130,120
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 48
                  texts: ~&f✕
                  fontSize: 48
                  through: true

          # ── 左侧分类栏 ──────────────────────────────
          分类卡片:
            type: Texture
            attribute:
              x: 32
              y: 110
              width: 230
              height: 716
              normal: ~42,45,58,220
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: ~90,170,255,50
            children:
              分类标题:
                type: Text
                attribute:
                  x: 20
                  y: 16
                  texts: "~&e分类筛选"
                  fontSize: 36
              分类纵向滑块:
                type: Texture
                val: 分类纵向滑块
                attribute:
                  x: 210
                  y: 60
                  width: 6
                  height: 50
                  normal: ~120,120,120,200
                  maxDragY: 590
              分类滚动:
                type: Scroll
                val: 分类滚动
                attribute:
                  x: 14
                  y: 60
                  width: 196
                  height: 640
                  moveY: "self.parent['分类纵向滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['分类纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['分类纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  分类列表:
                    val: 分类列表
                    type: VStack
                    attribute:
                      width: 190
                      spaceBetween: 8
                    children:
                      分类项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.categories[self.entryKey]
                          visible: self.entry != none
                          width: 190
                          height: 48
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'auction_list', '0', self.entry['id'], var.search)
                        children:
                          分类背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: "self.parent.entry != none && self.parent.entry['id'] == var.currentCategory ? '70,150,250,230' : '56,58,70,200'"
                              hover: ~Frosted:0;255,255,255,200
                              shape: ~round_rect
                              radius: 12
                              through: true
                            effect:
                              stroke:
                                width: 1
                                color: ~90,170,255,50
                          分类文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 190
                              texts: "var.categoryTexts[self.parent.entryKey]"
                              fontSize: 28
                              through: true
                          强调条:
                            type: Texture
                            attribute:
                              x: 0
                              y: 10
                              width: 4
                              height: 28
                              visible: "self.parent.entry != none && self.parent.entry['id'] == var.currentCategory"
                              normal: ~140,200,255,240
                              shape: ~round_rect
                              radius: 2
                              through: true

          # ── 物品网格区 ──────────────────────────────
          物品卡片:
            type: Texture
            attribute:
              x: 278
              y: 110
              width: 1190
              height: 716
              normal: ~42,45,58,220
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: ~90,170,255,50
            children:
              空物品提示:
                type: Text
                attribute:
                  x: 595
                  y: 330
                  center: true
                  fontSize: 100
                  visible: "var.listings == none || var.listings.keys().length == 0"
                  texts: "~&8暂无拍卖物品"
                  through: true
              物品纵向滑块:
                type: Texture
                val: 物品纵向滑块
                attribute:
                  x: 1172
                  y: 12
                  width: 6
                  height: 50
                  normal: ~120,120,120,200
                  maxDragY: 642
              物品滚动:
                type: Scroll
                val: 物品滚动
                attribute:
                  x: 12
                  y: 12
                  width: 1150
                  height: 692
                  moveY: "self.parent['物品纵向滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['物品纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['物品纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  物品列表:
                    val: 物品列表
                    type: HGrid
                    attribute:
                      width: 1150
                      column: 3
                      spaceBetweenX: 14
                      spaceBetweenY: 14
                    children:
                      拍卖卡片:
                        type: Texture
                        attribute:
                          entryKey: 0.round()
                          entry: var.listings[self.entryKey]
                          visible: self.entry != none
                          width: 374
                          height: 300
                          normal: ~50,53,66,220
                          hover: ~Frosted:0;90,150,230,220
                          shape: ~round_rect
                          radius: 16
                          visibleButtonCount: "self.entry != none ? ((self.entry['canBid'] ? 1 : 0) + (self.entry['canBuyNow'] ? 1 : 0) + (self.entry['canCancel'] ? 1 : 0)) : 0"
                          buttonStartX: "(374 - self.visibleButtonCount * 106 - (self.visibleButtonCount - 1) * 14) / 2"
                        effect:
                          stroke:
                            width: 1
                            color: ~90,170,255,40
                        children:
                          物品图标:
                            type: Slot
                            attribute:
                              entryKey: 0.round()
                              slotType: ~Icon
                              itemScale: 1.2
                              x: 139
                              y: 20
                              width: 96
                              height: 96
                              normal: ~40,42,54,220
                              shape: ~round_rect
                              radius: 12
                              through: true
                              seticon: "self.setItemIcon(var.itemJsons[self.entryKey])"
                          收藏按钮:
                            type: Canvas
                            attribute:
                              x: 330
                              y: 14
                              width: 30
                              height: 30
                            action:
                              clickLeft: |-
                                Packet.send(var.packetId, 'auction_favorite', self.parent.entry['id'].round(), var.currentCategory, var.search)
                            children:
                              收藏背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~40,42,54,220
                                  hover: ~Frosted:0;100,140,220,230
                                  shape: ~round_rect
                                  radius: 8
                                  through: true
                              收藏文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 30
                                  texts: "self.parent.parent.entry['isFavorite'] ? '&e★' : '&7☆'"
                                  fontSize: 22
                                  through: true
                          名称:
                            type: Text
                            attribute:
                              x: 187
                              y: 126
                              center: true
                              texts: "'&f' + self.parent.entry['name']"
                              fontSize: 30
                              through: true
                          卖家:
                            type: Text
                            attribute:
                              x: 187
                              y: 158
                              center: true
                              texts: "'&7卖家: &b' + self.parent.entry['seller']"
                              fontSize: 20
                              through: true
                          价格:
                            type: Text
                            attribute:
                              x: 187
                              y: 186
                              center: true
                              visible: "self.parent.entry != none && self.parent.entry['canBuyNow']"
                              texts: "'&e一口价: &f' + self.parent.entry['price'].round()"
                              fontSize: 26
                              through: true
                          竞价:
                            type: Text
                            attribute:
                              x: 187
                              y: 216
                              center: true
                              visible: "self.parent.entry != none && self.parent.entry['canBid']"
                              texts: "'&7当前出价: &f' + self.parent.entry['bid']"
                              fontSize: 20
                              through: true
                          剩余时间:
                            type: Text
                            attribute:
                              x: 110
                              y: 242
                              center: true
                              texts: "'&a' + self.parent.entry['timeLeft']"
                              fontSize: 20
                              through: true
                          货币:
                            type: Text
                            attribute:
                              x: 264
                              y: 242
                              center: true
                              texts: "'&7' + self.parent.entry['currencyName']"
                              fontSize: 20
                              through: true
                          出价按钮:
                            type: Canvas
                            attribute:
                              x: "self.parent.buttonStartX"
                              y: 258
                              width: 106
                              height: 34
                              visible: "self.parent.entry != none && self.parent.entry['canBid']"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'auction_bid', self.parent.entry['id'].round(), self.parent.entry['minBid'], var.actionToken)
                            children:
                              出价背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~220,150,50,200
                                  hover: ~Frosted:0;255,180,60,230
                                  shape: ~round_rect
                                  radius: 10
                                  through: true
                              出价文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 106
                                  texts: ~&f最低出价
                                  fontSize: 22
                                  through: true
                          购买按钮:
                            type: Canvas
                            attribute:
                              x: "self.parent.buttonStartX + (self.parent.entry['canBid'] ? 120 : 0)"
                              y: 258
                              width: 106
                              height: 34
                              visible: "self.parent.entry != none && self.parent.entry['canBuyNow']"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'auction_buy', self.parent.entry['id'].round(), var.actionToken)
                            children:
                              购买背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~60,180,100,200
                                  hover: ~Frosted:0;80,220,120,230
                                  shape: ~round_rect
                                  radius: 10
                                  through: true
                              购买文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 106
                                  texts: ~&f购买
                                  fontSize: 22
                                  through: true
                          取消按钮:
                            type: Canvas
                            attribute:
                              x: "self.parent.buttonStartX + (self.parent.entry['canBid'] ? 120 : 0) + (self.parent.entry['canBuyNow'] ? 120 : 0)"
                              y: 258
                              width: 106
                              height: 34
                              visible: "self.parent.entry != none && self.parent.entry['canCancel']"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'auction_cancel', self.parent.entry['id'].round(), var.actionToken, var.page, var.currentCategory, var.search)
                            children:
                              取消背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~180,80,80,200
                                  hover: ~Frosted:0;220,100,100,230
                                  shape: ~round_rect
                                  radius: 10
                                  through: true
                              取消文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 106
                                  texts: ~&f取消
                                  fontSize: 22
                                  through: true

          # ── 底部分页栏 ──────────────────────────────
          上一页:
            type: Texture
            attribute:
              x: 278
              y: 838
              width: 120
              height: 48
              normal: ~56,58,70,220
              hover: ~Frosted:0;255,255,255,80
              shape: ~round_rect
              radius: 12
            action:
              clickLeft: |-
                if(var.page > 0){
                  Packet.send(var.packetId, 'auction_list', (var.page - 1), var.currentCategory, var.search)
                }
            effect:
              stroke:
                width: 2
                color: ~90,170,255,70
            children:
              文字:
                type: Text
                attribute:
                  x: 60
                  y: 12
                  through: true
                  center: true
                  fontSize: 42
                  texts: "~&f< 上一页"

          页码:
            type: Text
            attribute:
              x: 873
              y: 850
              center: true
              texts: "~&7第 &f{(var.page + 1).round()} &7/ &f{var.totalPages.round()} &7页"
              fontSize: 49

          下一页:
            type: Texture
            attribute:
              x: 1348
              y: 838
              width: 120
              height: 48
              normal: ~56,58,70,220
              hover: ~Frosted:0;255,255,255,80
              shape: ~round_rect
              radius: 12
            action:
              clickLeft: |-
                if(var.page < var.totalPages - 1){
                  Packet.send(var.packetId, 'auction_list', (var.page + 1), var.currentCategory, var.search)
                }
            effect:
              stroke:
                width: 2
                color: ~90,170,255,70
            children:
              文字:
                type: Text
                attribute:
                  x: 60
                  y: 12
                  through: true
                  center: true
                  fontSize: 42
                  texts: "~&f下一页 >"
