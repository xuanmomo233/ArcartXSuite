            attribute:
              x: 40
              y: 184
              width: 1080
              height: 72
              visible: "var.runCount > 0"
            action:
              clickLeft: |-
                if(var.runMode == 'rescue' && var.runCount > 0 && var.runRows['0']['target'] != ''){
                  Packet.send(var.packetId, 'run_rescue', var.runRows['0']['target'], var.actionToken)
