# 鱼类定义：海鲈鱼
# 海鲈鱼是一种常见鱼类，全年可捕获，出现在海洋和河流中，白天活跃，难度最低
# 鱼类文件位于 fishes/ 目录，每个文件定义一种鱼

id: "sea_bass"                 # 鱼类唯一标识符
display-name: "海鲈鱼"          # 显示名称
rarity: common                 # 稀有度等级（common=常见）
min-size: 10                   # 最小尺寸（厘米）
max-size: 50                   # 最大尺寸（厘米）
base-price: 80                 # 基础售价（游戏货币）
base-xp: 15                    # 基础经验值（捕获时获得）
seasons: [spring, summer, fall, winter] # 可捕获季节（全年四季均可）
weathers: [clear, rain]        # 可捕获天气（晴天、雨天）
time-ranges:                   # 可捕获时间段
  - start: "06:00"             # 开始时间（06:00，清晨）
    end: "20:00"               # 结束时间（20:00，夜间前，白天时段）
item:                          # 捕获后掉落的物品定义
  material: "cod"
  amount: 1                    # 物品数量
difficulty: 90                 # 钓鱼难度（0-100，最低难度，适合新手）
behaviors:                     # 小游戏中鱼的行为模式及权重
  - type: smooth               # 平滑型：鱼缓慢平稳移动
    weight: 0.6                # 权重0.6（主要行为）
  - type: dart                 # 突进型：鱼快速跳跃移动
    weight: 0.4                # 权重0.4（次要行为）

# ─── 小游戏机制（可选，覆盖全局曲线的 base-rate） ──────────
# 海鲈鱼是最简单的鱼，进度衰减最慢，几乎不会逃离
# 仅覆盖 base-rate，formula 沿用全局曲线公式（全局默认 gain=0.01, drain=0.02）
progress-drain:
  base-rate: 0.008             # 鱼在绿条外时进度下降很慢（全局默认0.02）
progress-gain:
  base-rate: 0.012             # 鱼在绿条内时进度上升较快（全局默认0.01）
flee-params:
  base-chance: 0.10            # 逃离概率很低（全局默认0.25）
  base-speed: 0.02             # 逃离速度很慢（全局默认0.04）

# ─── 奖励（可选） ──────────────────────────────────────
# 首次捕获额外奖励，鼓励新手探索
drops:
  first_catch_bonus:
    item:
      material: "bread"
      amount: 3
    weight: 1.0
    condition: "first_catch"   # 首次捕获时额外给面包

# ─── 出现条件（可选） ──────────────────────────────────
# 海鲈鱼10级后可遇
min-player-level: 10

# ─── 数据/展示（可选） ─────────────────────────────────
description: "全年可捕获的常见鱼类，在海洋和河流中均有分布，难度最低，新手友好。"
icon: "cod"
record-weight: 0.3             # 图鉴排序最靠后（最常见）
