                        - ~&8调整即时保存 / 快捷键可在客户端重新绑定
                        - ~&8V 雷达 / N 洞穴深度 / [ 形状 / +- 尺寸 / , . 缩放
                      fontSize: 36
                      through: true
          # ─── 路径点/标记点编辑面板（模态遮罩，居中弹窗）───
          编辑面板层:
            type: Canvas
            attribute:
              point: ~stretch_all
              width: "var.viewW"
              height: "var.viewH"
              visible: "var.editPanelVisible"
              mapCapture: true
            children:
              编辑遮罩:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~0,0,0,160
              编辑对话框:
                type: Canvas
                attribute:
                  point: ~middle_center
                  width: 600
                  height: 400
                children:
                  编辑对话框底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~238,228,201,250
                      shape: ~round_rect
                      radius: 16
                    effect:
                      stroke:
                        width: 4
                        color: ~142,128,97,255
                  编辑标题:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 22
                      texts: "var.detailSelectedType == 'pin' ? '&0编辑标记点' : '&0编辑路径点'"
                      fontSize: 48
                      through: true
                  编辑名称标签:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 36
                      y: 92
                      texts: ~&0名称
                      fontSize: 36
                      through: true
                  编辑名称输入框:
                    type: TextBox
                    val: 编辑名称输入框
                    attribute:
                      point: ~top_left
                      x: 132
                      y: 88
                      width: 300
                      height: 26
                      length: 64
                      fontSize: 48
                      emptyText: "~输入名称"
                      background: ~57,81,85,235
                      canLoseFocus: true
                  编辑描述标签:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 36
                      y: 142
                      texts: ~&0描述
                      fontSize: 36
                      through: true
                  编辑描述输入框:
                    type: TextBox
                    val: 编辑描述输入框
                    attribute:
                      point: ~top_left
                      x: 132
                      y: 148
                      width: 300
                      height: 88
                      length: 256
                      allowNewLine: true
                      fontSize: 48
                      emptyText: "~输入描述（可选）"
                      background: ~57,81,85,235
                      canLoseFocus: true
                  编辑保存按钮:
                    type: Canvas
                    attribute:
                      tip: ~&0保存修改
                      point: ~bottom_left
                      x: 60
                      y: -30
                      width: 170
                      height: 52
                      enable: "!var.actionBusy && var.actionToken != none"
                    action:
                      clickLeft: |-
                        var.actionBusy = true
                        var.editName = val.编辑名称输入框.getContent()
                        var.editDesc = val.编辑描述输入框.getContent()
                        var.editPanelVisible = false
                        if (var.detailSelectedType == 'pin') {
                          Packet.send(var.packetId, 'update_pin', var.detailSelectedId, var.editName, var.editDesc, var.actionToken)
                        } else {
                          Packet.send(var.packetId, 'update_waypoint', var.detailSelectedId, var.editName, var.editDesc, var.actionToken)
                        }
                    children:
                      编辑保存底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
