      # ════════════════════════════════════════════════════════════
      # 详情面板: details 包的概率、保底与卡池条目（模态弹层）
      # ════════════════════════════════════════════════════════════
      详情面板:
        type: Canvas
        val: 详情面板
        attribute:
          point: ~stretch_all
          visible: false
        children:
          详情遮罩:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,14,24,200
          详情弹窗:
            type: Canvas
            attribute:
              point: ~middle_center
              width: 960
              height: 720
            children:
              面板背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,30,44,244
                  shape: ~round_rect
                  radius: 12
                effect:
                  gradient:
                    color1: ~38,46,72,255
                    color2: ~30,40,64,255
                    type: 0
                    angleDeg: 90
                  stroke:
                    width: 2
                    color: ~226,196,132,220
              面板标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 20
                  texts: "'&f概率详情 · ' + var.detailPoolName"
                  fontSize: 54
                  through: true
              概率说明:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 68
                  texts: "'&75 星基础概率 &6' + ((var.detailBase5Rate != none ? var.detailBase5Rate : 0) * 100).round(1) + '% &7· 4 星基础概率 &5' + ((var.detailBase4Rate != none ? var.detailBase4Rate : 0) * 100).round(1) + '%'"
                  fontSize: 36
                  through: true
              保底说明:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 102
                  texts: "'&75 星保底 ' + (var.detailPity5 != none ? var.detailPity5.round() : 0) + ' 抽 · 4 星保底 ' + (var.detailPity4 != none ? var.detailPity4.round() : 0) + ' 抽 · UP 概率 ' + ((var.detailUpRate != none ? var.detailUpRate : 0) * 100).round(1) + '%'"
                  fontSize: 36
                  through: true
              详情滑块:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -16
                  y: 150
                  width: 10
                  height: 60
                  normal: ~255,226,158,255
                  maxDragY: 470 - 60
                  dragY: 0
                  shape: ~round_rect
                  radius: 4
              详情视口:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 24
                  y: 150
                  width: 880
                  height: 470
                  moveY: self.parent['详情滑块'].getDragYRatio()
                  through: false
                action:
                  wheel: |-
                    if(self.moveY >= 0){
                      if(self.wheelValue > 0){
                        self.parent['详情滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                      }
                    }
                    if(self.moveY <= 1){
                      if(self.wheelValue < 0){
                        self.parent['详情滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                      }
                    }
                children:
                  详情列表:
                    type: VGrid
                    val: 详情列表
                    attribute:
                      row: 60
                      spaceBetweenY: 12
                    children:
                      详情行:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          width: 860
                          height: 58
                          visible: "var.detailRows[self.entryKey] != none"
                        children:
                          行背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~22,28,44,240
                              shape: ~round_rect
                              radius: 6
                          名称:
                            type: Text
                            attribute:
                              entryKey: 0.round()
                              point: ~middle_left
                              x: 16
                              texts: "var.detailRows[self.entryKey] != none ? '&f' + var.detailRows[self.entryKey]['name'] : ''"
                              fontSize: 36
                              through: true
                          稀有度:
                            type: Text
                            attribute:
                              entryKey: 0.round()
                              point: ~middle_left
                              x: 500
                              texts: "var.detailRows[self.entryKey] != none ? '&7' + var.detailRows[self.entryKey]['rarity'] : ''"
                              fontSize: 36
                              through: true
                          权重:
                            type: Text
                            attribute:
                              entryKey: 0.round()
                              point: ~middle_left
                              x: 740
                              texts: "var.detailRows[self.entryKey] != none ? '&7' + var.detailRows[self.entryKey]['weight'].round() : ''"
                              fontSize: 36
                              through: true
              详情空态:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&8暂无可展示的卡池条目"
                  fontSize: 36
                  through: true
                  visible: "var.detailCount != none && var.detailCount == 0"
              详情关闭:
                type: Canvas
                attribute:
                  point: ~bottom_center
                  y: -20
                  width: 200
                  height: 56
                action:
                  click: "val.详情面板.visible = false"
                children:
                  详情关闭背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~40,48,74,240
                      hover: ~62,78,120,245
                      shape: ~round_rect
                      radius: 26
                    effect:
                      stroke:
                        width: 2
                        color: ~226,196,132,235
                  详情关闭文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f关闭"
                      fontSize: 36
                      through: true

      # ════════════════════════════════════════════════════════════
      # 兑换面板: exchange 包的积分余额与商品列表（模态弹层）
      # ════════════════════════════════════════════════════════════
      兑换面板:
        type: Canvas
        val: 兑换面板
        attribute:
          point: ~stretch_all
          visible: false
        children:
          兑换遮罩:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,14,24,200
          兑换弹窗:
            type: Canvas
            attribute:
              point: ~middle_center
              width: 1120
              height: 760
            children:
              面板背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,30,44,244
                  shape: ~round_rect
                  radius: 12
                effect:
                  gradient:
                    color1: ~38,46,72,255
                    color2: ~30,40,64,255
                    type: 0
                    angleDeg: 90
                  stroke:
                    width: 2
                    color: ~226,196,132,220
              面板标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 20
                  texts: "~&f积分兑换"
                  fontSize: 54
                  through: true
              # ── 积分余额栏: 玩家各类积分余额（动态创建3个条目）──
              积分余额栏:
                type: HStack
                val: 积分余额栏
                attribute:
                  point: ~top_left
                  x: 24
                  y: 76
                  height: 72
                  spaceBetween: 28
                action:
                  create: |-
                    for(i in range(1, 3)){
                      key = i.round()
                      e = self['积分条目'].copy('积分条目' + key)
                      e.entryKey = key
                      e['图标'].entryKey = key
                      e['名称'].entryKey = key
                      e['余额'].entryKey = key
                    }
                children:
                  积分条目:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      width: 210
                      height: 72
                      visible: "var.pointBalanceRows[self.entryKey] != none"
                    children:
                      条目背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~22,28,44,240
                          shape: ~round_rect
                          radius: 6
                      图标:
                        type: Slot
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 8
                          slotType: ~Icon
                          width: 48
                          height: 48
                          normal: ~0,0,0,0
                          through: true
                          seticon: "self.setItemIcon(var.pointIconJsons[self.entryKey])"
                      名称:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 64
                          y: -16
                          texts: "var.pointBalanceRows[self.entryKey] != none ? '&7' + var.pointBalanceRows[self.entryKey]['displayName'] : ''"
                          fontSize: 36
                          through: true
                      余额:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 64
                          y: 16
                          texts: "'&6' + var.pointBalanceRows[self.entryKey]['amount'].round()"
                          fontSize: 36
                          through: true
              兑换滑块:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -16
                  y: 168
                  width: 10
                  height: 60
                  normal: ~255,226,158,255
                  maxDragY: 500 - 60
                  dragY: 0
                  shape: ~round_rect
                  radius: 4
              兑换视口:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 24
                  y: 168
                  width: 1040
                  height: 500
                  moveY: self.parent['兑换滑块'].getDragYRatio()
                  through: false
                action:
                  wheel: |-
                    if(self.moveY >= 0){
                      if(self.wheelValue > 0){
                        self.parent['兑换滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                      }
                    }
                    if(self.moveY <= 1){
                      if(self.wheelValue < 0){
                        self.parent['兑换滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                      }
                    }
                children:
                  兑换列表:
                    type: VGrid
                    val: 兑换列表
                    attribute:
                      row: 20
                      spaceBetweenY: 12
                    children:
                      兑换行:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          width: 1020
                          height: 96
                          visible: "var.exchangeRows[self.entryKey] != none"
                        children:
                          行背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~22,28,44,240
                              shape: ~round_rect
                              radius: 8
                          商品图标:
                            type: Slot
                            attribute:
                              entryKey: 0.round()
                              point: ~middle_left
                              x: 16
                              slotType: ~Icon
                              width: 64
                              height: 74
                              normal: ~0,0,0,0
                              through: true
                              seticon: "self.setItemIcon(var.exchangeIconJsons[self.entryKey])"
                          商品名称:
                            type: Text
                            attribute:
                              entryKey: 0.round()
                              point: ~middle_left
                              x: 96
                              y: -18
                              texts: "var.exchangeRows[self.entryKey] != none ? '&f' + var.exchangeRows[self.entryKey]['name'] : ''"
                              fontSize: 36
                              through: true
                          消耗文本:
                            type: Text
                            attribute:
                              entryKey: 0.round()
                              point: ~middle_left
                              x: 96
                              y: 18
                              texts: "var.exchangeRows[self.entryKey] != none ? '&7消耗 &6' + var.exchangeRows[self.entryKey]['costRows'][0]['displayName'] + ' x' + var.exchangeRows[self.entryKey]['costRows'][0]['amount'].round() + (var.exchangeRows[self.entryKey]['costRows'][1] != none ? ' &7+ &6' + var.exchangeRows[self.entryKey]['costRows'][1]['displayName'] + ' x' + var.exchangeRows[self.entryKey]['costRows'][1]['amount'].round() : '') : ''"
                              fontSize: 36
                              through: true
                          限购文本:
                            type: Text
                            attribute:
                              entryKey: 0.round()
                              point: ~middle_right
                              x: -200
                              texts: "var.exchangeRows[self.entryKey] != none ? (var.exchangeRows[self.entryKey]['limit'] == 0 ? '&7不限购' : '&7剩余 ' + var.exchangeRows[self.entryKey]['remaining'].round() + '/' + var.exchangeRows[self.entryKey]['limit'].round()) : ''"
                              fontSize: 36
                              through: true
                          兑换按钮:
                            type: Texture
                            attribute:
                              entryKey: 0.round()
                              point: ~middle_right
                              x: -16
                              width: 160
                              height: 66
                              normal: "{var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] == true ? '226,196,132,255' : '28,34,54,230'}"
                              hover: "{var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] == true ? '255,246,214,255' : '28,34,54,230'}"
                              shape: ~round_rect
                              radius: 28
                              texts: "var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] == true ? '&f兑换' : '&7已达上限'"
                              center: true
                              fontSize: 36
                              enable: "!var.actionBusy && var.actionToken != ''"
                            effect:
                              stroke:
                                width: 2
                                color: ~110,148,204,150
                            action:
                              click: |-
                                if(var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] != none && var.exchangeRows[self.entryKey]['canExchange'] == true){
                                  var.actionBusy = true
                                  Packet.send(var.packetId, 'exchange_buy', var.exchangeRows[self.entryKey]['id'], var.actionToken)
                                }
              兑换空态:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&8暂无可兑换内容"
                  fontSize: 36
                  through: true
                  visible: "var.exchangeCount != none && var.exchangeCount == 0"
              兑换关闭:
                type: Canvas
                attribute:
                  point: ~bottom_center
                  y: -20
                  width: 200
                  height: 56
                action:
                  click: "val.兑换面板.visible = false"
                children:
                  兑换关闭背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~40,48,74,240
                      hover: ~62,78,120,245
                      shape: ~round_rect
                      radius: 26
                    effect:
                      stroke:
                        width: 2
                        color: ~226,196,132,235
                  兑换关闭文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f关闭"
                      fontSize: 36
                      through: true

