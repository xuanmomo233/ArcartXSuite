# AXS 资源说明
# 用途: Abyss 队伍面板 —— 成员/邀请/聊天/管理
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  background: true
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/hasParty/isLeader/partyName/lootMode/expShare
    #         memberRows{idx:{name,online,leader}}/memberCount/inviteRows{idx:{from}}/maxMembers
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.hasParty = packet['hasParty']
      var.isLeader = packet['isLeader']
      var.partyName = packet['partyName']
      var.lootMode = packet['lootMode']
      var.expShare = packet['expShare']
      var.memberRows = packet['memberRows']
      var.memberCount = packet['memberCount']
      var.inviteRows = packet['inviteRows']
      var.maxMembers = packet['maxMembers']
      var.inviteName = ''
      var.chatMsg = ''
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 760
          height: 560
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:24;24,28,38,190
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: ~110,148,204,140
          标题:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 18
              texts: "var.hasParty ? '&d&l' + var.partyName : '&d&l队伍'"
              fontSize: 48
          队伍信息:
            type: Text
            attribute:
              point: ~top_right
              x: -28
              y: 24
              texts: "var.hasParty ? '&7' + var.memberCount.round() + '/' + var.maxMembers.round() + '  掉落:' + var.lootMode : ''"
              fontSize: 36
          成员列表:
            type: VStack
            attribute:
              point: ~top_left
              x: 28
              y: 84
              width: 400
              spaceBetween: 8
              visible: var.hasParty
            children:
              成员行0:
                type: Canvas
                attribute:
                  entryKey: 0.round()
                  entry: var.memberRows[self.entryKey]
                  width: 400
                  height: 48
                  visible: self.entry != none
                children:
                  行背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: "self.parent.entry['leader'] ? '70,60,110,230' : '44,50,66,220'"
                      shape: ~round_rect
                      radius: 8
                      through: true
                  成员名:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 14
                      texts: "self.parent.entry['leader'] ? '&e♛ &f' + self.parent.entry['name'] : '&f' + self.parent.entry['name']"
                      fontSize: 36
                      through: true
                  在线状态:
                    type: Text
                    attribute:
                      point: ~middle_right
                      x: -96
                      texts: "self.parent.entry['online'] ? '&a●' : '&8●'"
                      fontSize: 36
                      through: true
                  踢出按钮:
                    type: Text
                    attribute:
                      point: ~middle_right
                      x: -14
                      texts: ~&c✕
                      fontSize: 36
                      visible: var.isLeader && !self.parent.entry['leader']
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'party_kick', self.parent.entry['name'], var.actionToken)
                        Packet.send(var.packetId, 'open_party_ui', var.actionToken)
