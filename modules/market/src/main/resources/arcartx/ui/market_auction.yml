              texts: "~&f分类筛选"
              fontSize: 36
              through: true
          分类滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -10
              y: 488
              width: 8
              height: "var.viewH - 652"
              normal: ~42,50,66,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          分类滑块:
            type: Texture
            val: 分类滑块
            attribute:
              point: ~top_right
              x: -10
              y: 488
              width: 8
              height: 60
              normal: ~140,200,255,255
              maxDragY: "var.viewH - 712"
              shape: ~round_rect
              radius: 4
          分类滚动:
            type: Scroll
            val: 分类滚动
            attribute:
              point: ~top_left
              x: 20
              y: 488
              width: 260
              height: "var.viewH - 652"
              moveY: "self.parent['分类滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              分类列表:
                val: 分类列表
                type: VStack
                attribute:
                  width: 254
                  spaceBetween: 8
                children:
                  分类项:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.categories[self.entryKey]
                      visible: self.entry != none
                      width: 254
                      height: 48
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'auction_list', '0', self.entry['id'], var.search)
                    children:
                      分类项底:
                        type: Texture
                        attribute:
                          point: ~top_left
                          x: 3
                          y: 0
                          width: 248
                          height: 48
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['id'] == var.currentCategory ? '70,150,250,210' : '62,66,74,210'"
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 3
                            color: "self.parent.entry != none && self.parent.entry['id'] == var.currentCategory ? '255,255,255,255' : (self.isHovered() ? '140,200,255,255' : '255,255,255,230')"
                      分类项高亮条:
                        type: Texture
                        attribute:
                          point: ~middle_left
                          x: 8
                          width: 4
                          height: 24
                          normal: ~140,200,255,255
                          shape: ~round_rect
                          radius: 2
                          visible: "self.parent.entry != none && self.parent.entry['id'] == var.currentCategory"
                          through: true
                      分类项文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 28
                          texts: "self.parent.entry != none && self.parent.entry['id'] == var.currentCategory ? '&0' + var.categoryTexts[self.parent.entryKey] : '&f' + var.categoryTexts[self.parent.entryKey]"
                          fontSize: 32
