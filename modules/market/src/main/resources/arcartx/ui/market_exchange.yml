                          normal: ~0,0,0,0
                          through: true
                          itemScale: 0.8
                      名称:
                        type: Text
                        attribute:
                          x: 50
                          y: 8
                          texts: 'self.parent.entry == none ? '''' : ''&f'' + self.parent.entry[''name'']'
                          fontSize: 28
                          through: true
                          limit: 13
                      数量:
                        type: Text
                        attribute:
                          x: -10
                          y: 27
                          texts: 'self.parent.entry == none ? '''' : ''&e×'' + self.parent.entry[''quantity'']'
                          fontSize: 28
                          through: true
                          point: ~top_right
              来源:
                type: Text
                attribute:
                  x: 24
                  y: 670
                  texts: 'var.whLayoutEnabled ? ''&7背包优先，可用仓库补足 · 奖励进入背包'' : ''&7使用背包材料 · 奖励进入背包'''
                  fontSize: 28
                  through: true
              兑换:
                type: Canvas
                attribute:
                  x: 24
                  y: 724
                  width: 542
                  height: 48
                  enable: var.rows[var.selection] != none && var.detailsReady && !var.busy && var.token != ''
                  alpha: '(var.rows[var.selection] != none && var.detailsReady && !var.busy && var.token != '''') ? 1 : 0.45'
                children:
                  底色:
                    type: Texture
                    attribute:
                      x: 0
                      y: 0
                      width: 542
                      height: 48
                      normal: 'self.isHovered() ? ''62,79,91,255'' : ''45,59,69,255'''
                      through: true
                      shape: ~round_rect
                      radius: 6
                    effect:
                      stroke:
                        width: 3
                        color: ~83,99,111,255
                  文字:
                    type: Text
                    attribute:
                      x: 0
                      y: 0
                      texts: 'var.busy ? ''&e正在结算…'' : var.confirmLabel'
                      fontSize: 32
                      through: true
                      point: ~middle_center
                action:
                  clickLeft: |-
                    if(var.rows[var.selection] != none){
                      var.busy = true
                      Packet.send('AXS:market_exchange', 'buy', var.rows[var.selection]['id'], var.token)
                    }
