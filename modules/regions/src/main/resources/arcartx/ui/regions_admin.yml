# AXS 资源说明
# 用途: Regions 管理员区域管理面板，支持区域列表/区域编辑/成员管理。
# 前置依赖: ArcartX；Regions 模块启用后自动注册。
# 打开方式: /axs regions admin
# 数据交互: packetHandler 接收 init 推送；客户端通过 Packet.send('AXS_REGIONS_ADMIN', ...) 发送管理指令。

ui:
  background: true
  escClose: true
  closeDied: true
  show: true
  through: false
  screenScale: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - page: 当前页面 (regions/edit)
    #   - packetId: 服务端回包 ID，用于客户端 Packet.send 回传
    #   - regions: 所有区域数据列表
    #   - regionCount: 区域总数
    #   - selId: 当前选中区域 ID
    #   - selWorld: 选中区域所在世界
    #   - selPriority: 选中区域优先级
    #   - selParent: 选中区域父区域
    #   - selMin: 选中区域最小坐标
    #   - selMax: 选中区域最大坐标
    #   - selVolume: 选中区域体积 (方块数)
    #   - selFlags: 选中区域标志列表
    #   - selMembers: 选中区域成员列表
    #   - worlds: 世界规则页的世界列表
    #   - worldCount: 世界数量
    init: |-
      var.page = packet['page']
      var.packetId = packet['packetId']
      var.regions = packet['regions']
      var.regionCount = packet['regionCount']
      var.selId = packet['selId']
      var.selWorld = packet['selWorld']
      var.selPriority = packet['selPriority']
      var.selParent = packet['selParent']
      var.selMin = packet['selMin']
      var.selMax = packet['selMax']
      var.selVolume = packet['selVolume']
      var.selFlags = packet['selFlags']
      var.selMembers = packet['selMembers']
      var.worlds = packet['worlds']
      var.worldCount = packet['worldCount']
      // 将 Map 转为 List，供 VStack 行按 entryKey 整数索引访问
      var.regionList = []
      if(var.regions != null){
        for(key in var.regions.keys()){
          var.regionList.add(var.regions[key])
        }
      }
      var.memberList = []
      if(var.selMembers != null){
        for(key in var.selMembers.keys()){
          var.memberList.add(var.selMembers[key])
        }
      }
      var.flagList = []
      if(var.selFlags != null){
        for(key in var.selFlags.keys()){
          var.flagList.add(var.selFlags[key])
        }
      }
      var.worldList = []
      if(var.worlds != null){
        for(key in var.worlds.keys()){
          var.worldList.add(var.worlds[key])
        }
      }
      var.newRegionName = ''
      var.renameValue = ''

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
