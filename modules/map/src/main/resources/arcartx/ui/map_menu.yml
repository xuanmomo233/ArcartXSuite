                  point: ~stretch_all
                  through: true
                  normal: ~0,0,0,160
              确认对话框:
                type: Canvas
                attribute:
                  point: ~middle_center
                  width: 480
                  height: 220
                children:
                  对话框底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~Frosted:30;100,100,100,255
                      shape: ~round_rect
                      radius: 16
                    effect:
                      stroke:
                        width: 4
                        color: ~255,255,255,255
                  对话框标题:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 24
                      texts: "var.crossWorldRemote == true ? '&b☁ &f跨服传送' : (var.crossWorldPromptType == 'navigate' ? '&f跨世界导航' : '&f跨世界传送')"
                      fontSize: 36
                      through: true
                  对话框内容:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 72
                      texts: "var.crossWorldPromptType == 'teleport_world' ? (var.crossWorldRemote == true ? '&f是否跨服传送到 &f' + var.crossWorldTargetName + '&f？' : '&f是否传送到世界 &f' + var.crossWorldTargetName + '&f？') : (var.crossWorldRemote == true ? '&f目标位于远程服务器 &f' + var.detailServerName + '&f，是否跨服传送？' : '&f目标位于 &f' + var.selectedWorldName + '&f，是否传送到该世界？')"
                      fontSize: 48
                      through: true
                  # 远程传送提示：费用在目标服落地时扣除
                  对话框远程提示:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 142
                      texts: ~&7费用将在进入目标服务器后扣除
                      fontSize: 32
                      visible: "var.crossWorldRemote == true"
                      through: true
                  对话框费用:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 112
                      texts: "'&e传送费用: &f' + var.detailCrossWorldCostText"
                      fontSize: 48
                      visible: "var.crossWorldPromptType != 'teleport_world' && var.detailCrossWorldCostText != none && var.detailCrossWorldCostText != ''"
                      through: true
                  确认按钮:
                    type: Canvas
                    attribute:
                      tip: ~&f确认
                      point: ~bottom_left
                      x: 40
                      y: -24
                      width: 180
                      height: 52
                      enable: "var.actionToken != none"
                    action:
                      clickLeft: |-
                        var.crossWorldPromptVisible = false
                        // navigate=传送+追踪；teleport=锚点传送；teleport_world=世界出生点传送
                        if (var.crossWorldPromptType == 'teleport_world') {
                          var.actionBusy = true
                          Packet.send(var.packetId, 'teleport_to_world', var.crossWorldTargetWorld, var.actionToken)
                        } elif (var.crossWorldPromptType == 'teleport') {
                          var.actionBusy = true
                          Packet.send(var.packetId, 'teleport_anchor', var.detailSelectedId, var.actionToken)
                        } else {
                          Packet.send(var.packetId, 'cross_world_navigate', var.detailSelectedType + ':' + var.detailSelectedId, var.actionToken)
                        }
