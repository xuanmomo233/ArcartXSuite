# AXS 资源说明
# 用途: Map 模块默认小地图 HUD。
# 前置依赖: ArcartX + Arcart-Suite-Map 客户端 mod；Map 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.map.enabled + modules.map.password
# 关联文件: ArcartXMap.yml、ui/map_menu.yml
# 重载命令: /axs map reload
#
# 小地图渲染由 Arcart-Suite-Map 客户端 mod 完全接管：
#   - UI 的 tick 触发器每帧通过 axsmap.getMapRenderer().setHudAnchor() 传小地图右上角锚点
#   - mod 根据锚点和内部 hudSize 状态计算实际渲染区域，绘制圆形/方形小地图
#   - 圆形遮罩在 mod 的 CPU 端生成视图纹理时应用，含 1px 抗锯齿与圆形描边
#   - 世界名与 xyz 坐标由本 UI 的 Text 控件渲染（世界名走 Placeholder.parse PAPI，坐标用 Player.getPosX/Y/Z 本地实时取）
#   - 按 [ 切换圆形/方形，按 +/- 调整大小，按 ,/. 调整缩放

ui:
  isHud: true
  background: false
  closeDied: true
  through: true
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 通信标识，用于 Packet.send 回包
    #   - visible: 小地图是否可见
    #   - worldId: 当前世界 ID
    #   - dimension: MC 维度 key，供 mod 匹配本地维度
    #   - playerYaw: 玩家朝向角度
    #   - trackingText: 导航追踪提示文本
    #   - litEnabled: 是否启用点亮机制
    #   - litRegions: 已点亮多边形区域并集
    init: |-
      var.packetId = packet['packetId']
      var.visible = packet['visible']
      var.worldId = packet['worldId']
      var.worldName = packet['worldName']
      var.dimension = packet['dimension']
      var.litEnabled = packet['litEnabled']
      var.litRegions = packet['litRegions']
      var.playerYaw = packet['playerYaw']
      var.trackingText = packet['trackingText']
      var.markerRows = packet['markerRows']
      // 会话号：服务端每次开启小地图自增，mod 只认最新会话副本的锚点
      if(packet['hudSession'] != none) {
        var.hudSession = packet['hudSession']
      }
      // axsmap 是客户端 mod(Arcart-Suite-Map) 注册的 Aria 全局函数命名空间，
      // getMapRenderer() 返回 JavaObjectMirror 包装的 MapRenderer 实例（Java 互操作）。
      // 懒加载：首次拿到后缓存在 var.mapRenderer，后续包直接复用
      if(var.mapRenderer == none) {
        try {
          var.mapRenderer = axsmap.getMapRenderer()
        } catch(e) {
        }
      }
      if(var.mapRenderer != none) {
        // 转发服务端稳定标识：mod 以此做地形缓存一级隔离键（换 IP/域名/端口不丢缓存）
        if(packet['serverId'] != none && packet['serverId'] != '') {
          var.mapRenderer.setServerId('' + packet['serverId'])
        }
        // 告诉 mod 渲染哪个世界的地形（HUD 固定 = 玩家当前世界，服务端已按当前世界构建）
        // 注意：只报显示世界（活跃锁存+预加载），不写大地图选中世界——
        // 大地图浏览非当前世界时，HUD 每包都发玩家世界会把菜单选中值顶掉（振荡）
        var.mapRenderer.setHudWorldId(var.worldId)
        // 注册 worldId → MC 维度 key 映射（如 bskyblock_world → minecraft:overworld）
        if(var.dimension != none && '' + var.dimension != '' && '' + var.dimension != 'null') {
          var.mapRenderer.setWorldDimension('' + var.worldId, '' + var.dimension)
        }
        // 下发已点亮区域多边形（战争迷雾：未探索区遮罩）；litEnabled=false 时传 none 全亮
        var.mapRenderer.setLitRegions('' + var.worldId, var.litEnabled == true ? var.litRegions : none)
        // 当前世界预加载信息：HUD 也要能请求地形（玩家可能从未打开过菜单）
        if(packet['preloadVersion'] != none && packet['preloadChunks'] != none) {
          var.mapRenderer.setWorldPreload('' + var.worldId, packet['preloadVersion'], '' + packet['preloadChunks'])
        }
        // HUD 标记（玩家当前世界的锚点/路径点/外部目标/pin，与菜单选中世界无关）
        var.mapRenderer.clearHudMarkers()
        if(var.markerRows != none) {
          for(key in var.markerRows.keys()) {
            row = var.markerRows[key]
            if(row != none) {
              var.mapRenderer.addHudMarker(row['id'], row['type'], row['label'], row['x'], row['z'], row['selected'], row['tracked'], row['unlocked'])
            }
          }
        }
      }
    # packetHandler: update
    # 包字段: 同 init（实时刷新小地图数据）
    update: |-
      var.packetId = packet['packetId']
      var.visible = packet['visible']
      var.worldId = packet['worldId']
      var.worldName = packet['worldName']
      var.dimension = packet['dimension']
      var.litEnabled = packet['litEnabled']
      var.litRegions = packet['litRegions']
      var.playerYaw = packet['playerYaw']
      var.trackingText = packet['trackingText']
      var.markerRows = packet['markerRows']
      if(packet['hudSession'] != none) {
        var.hudSession = packet['hudSession']
      }
      // 同 init：懒加载 MapRenderer + 同步世界/维度/点亮数据给 mod
      if(var.mapRenderer == none) {
        try {
          var.mapRenderer = axsmap.getMapRenderer()
        } catch(e) {
        }
      }
      if(var.mapRenderer != none) {
        // 转发服务端稳定标识（同 init）
        if(packet['serverId'] != none && packet['serverId'] != '') {
          var.mapRenderer.setServerId('' + packet['serverId'])
        }
        // 只报显示世界（活跃锁存+预加载），不写大地图选中世界（防振荡）
        var.mapRenderer.setHudWorldId(var.worldId)
        if(var.dimension != none && '' + var.dimension != '' && '' + var.dimension != 'null') {
          var.mapRenderer.setWorldDimension('' + var.worldId, '' + var.dimension)
        }
        var.mapRenderer.setLitRegions('' + var.worldId, var.litEnabled == true ? var.litRegions : none)
        if(packet['preloadVersion'] != none && packet['preloadChunks'] != none) {
          var.mapRenderer.setWorldPreload('' + var.worldId, packet['preloadVersion'], '' + packet['preloadChunks'])
        }
        var.mapRenderer.clearHudMarkers()
        if(var.markerRows != none) {
          for(key in var.markerRows.keys()) {
            row = var.markerRows[key]
            if(row != none) {
              var.mapRenderer.addHudMarker(row['id'], row['type'], row['label'], row['x'], row['z'], row['selected'], row['tracked'], row['unlocked'])
            }
          }
        }
      }
  action:
    load: |-
      var.visible = false
      var.hudSizeDesign = 200
      var.packetId = 'AXS_MAP'
      var.trackingText = '当前未导航'
      var.hudShape = 'CIRCLE'
      var.hudPosition = 'TOP_RIGHT'
      var.viewW = 1920
      var.viewH = 1080
      var.hudSession = -1
      // api4 = 客户端 mod 是否带会话化 API（4参 setHudAnchor / deactivateHud /
      // closeHud(session)）；未定义即 none = 未探测，首次拿到 mapRenderer 后探测固定
      // 上报就绪：服务端换发新会话号并重推 visible——UI 热重载/重进后自愈
      try {
        Packet.send(var.packetId, 'hud_ready')
      } catch(e) {
      }
    open: |-
      // open 也补一次就绪上报（defaultOpen 常驻 HUD 重载后会重新 open）
      if(var.packetId != none && var.packetId != '') {
        try {
          Packet.send(var.packetId, 'hud_ready')
        } catch(e) {
        }
      }
    # tick：每帧计算小地图右上角锚点坐标，传给客户端 mod
    # mod 内部根据 hudSize 状态计算实际渲染区域（向左下延伸 hudSize×hudSize）
    # setHudAnchor(anchorX, anchorY, s, session):
    #   anchorX = 屏幕宽度 - 28*s（右上角 X，自适应缩放）
    #   anchorY = 24*s（右上角 Y）
    #   s = 自适应缩放因子（sx/sy 取小值）
    #   session = 服务端下发的会话号（旧版 mod 无此参，走 api4 探测回退 3 参）
    tick: |-
      // tick 也懒加载一次：init/update 包可能比 UI 更早到达（mapRenderer 还没被赋值）
      if(var.mapRenderer == none) {
        try {
          var.mapRenderer = axsmap.getMapRenderer()
        } catch(e) {
        }
      }
      // 探测 mod 是否支持会话化 API：deactivateHud(-1) 是无害探针
      if(var.mapRenderer != none && var.api4 == none) {
        try {
          var.mapRenderer.deactivateHud(-1)
          var.api4 = true
        } catch(e) {
          var.api4 = false
        }
      }
      if(var.mapRenderer != none && var.visible) {
        sx = Screen.getWidth() / 1920
        sy = Screen.getHeight() / 1080
        s = sx < sy ? sx : sy
        var.viewW = Screen.getWidth() / s
        var.viewH = Screen.getHeight() / s
        var.hudPosition = 'TOP_RIGHT'
        try {
          var.hudPosition = '' + var.mapRenderer.getHudPosition()
        } catch(e) {
        }
        hudSize = var.mapRenderer.getHudSize()
        isLeft = var.hudPosition == 'TOP_LEFT' || var.hudPosition == 'BOTTOM_LEFT'
        isBottom = var.hudPosition == 'BOTTOM_LEFT' || var.hudPosition == 'BOTTOM_RIGHT'
        anchorX = isLeft ? 28 * s + hudSize : Screen.getWidth() - 28 * s
        anchorY = isBottom ? Screen.getHeight() - 70 * s - hudSize : 24 * s
        if(var.api4) {
          var.mapRenderer.setHudAnchor(anchorX, anchorY, s, var.hudSession)
        } else {
          var.mapRenderer.setHudAnchor(anchorX, anchorY, s)
        }
        // 同步 mod 内的小地图尺寸/形状给装饰控件使用（设计坐标 = 屏幕像素 / s）
        var.hudSizeDesign = var.mapRenderer.getHudSize() / s
        var.hudShape = '' + var.mapRenderer.getHudShape()
      } elif(var.mapRenderer != none && !var.visible) {
        // 只在 HUD 模式下停渲染——大地图打开期间 mode=MENU，
        // 此时停用会把 mode 清成 NONE，与 menu tick 的 setRegion
        // 互相覆盖导致大地图逐帧闪烁。
        // 会话版 deactivateHud(session)：仅本副本持有当前会话才生效并注销会话，
        // 旧会话副本（僵尸 UI）调用无效；旧版 mod 回退 deactivate() 防抖。
        if('' + var.mapRenderer.getMode() == 'HUD') {
          if(var.api4) {
            var.mapRenderer.deactivateHud(var.hudSession)
          } else {
            var.mapRenderer.deactivate()
          }
        }
      }
    # close：UI 关闭时停渲染。会话版 closeHud(session)：持旧会话副本的 close
    # 不会误杀新会话的渲染。若 close 没执行，mod 端 150ms 看门狗兜底。
    close: |-
      if(var.mapRenderer != none) {
        try {
          if(var.api4 == true) {
            var.mapRenderer.closeHud(var.hudSession)
          } else {
            var.mapRenderer.closeHud()
          }
        } catch(e) {
        }
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      # 小地图装饰边框：由 UI 负责渲染装饰，mod 只画地形。
      地图边框范围布局:
        type: Canvas
        attribute:
          point: ~top_left
          # 注意: 边框越厚的地图，x、y、width、height也需要做相应调整
          strokewidth: 4
          x: "var.hudPosition == 'TOP_LEFT' || var.hudPosition == 'BOTTOM_LEFT' ? 28 - self.strokewidth : var.viewW - 28 - var.hudSizeDesign - self.strokewidth"
          y: "var.hudPosition == 'BOTTOM_LEFT' || var.hudPosition == 'BOTTOM_RIGHT' ? var.viewH - 70 - var.hudSizeDesign - self.strokewidth : 22 - self.strokewidth"
          width: var.hudSizeDesign + 2 * self.strokewidth
          height: var.hudSizeDesign + 2 * self.strokewidth
          through: true
        children:
          小地图圆形边框:
            type: Texture
            attribute:
              point: ~stretch_all
              # 注意:此处normal需要使用100px的纯透明贴图，搭配effect.stroke的描边效果才能显示地图边框
              # normal支持任何贴图来装饰地图，使用贴图时请删除下方的effect.stroke的描边效果
              normal: ~map/alpha.png
              shape: ~circle
              # mapRenderer != none 守卫：没装 Arcart-Suite-Map mod 的玩家（服务端照常发包）
              # 不会画出悬空边框
              visible: var.visible && var.hudShape == 'CIRCLE' && var.mapRenderer != none
              through: true
            effect:
              stroke:
                width: self.parent.strokewidth
                # 可以通过调整颜色来调整地图边框描边
                color: ~255,255,255,255
          小地图方形边框:
            type: Texture
            attribute:
              point: ~stretch_all
              # 此处为 方形小地图 显示的边框
              normal: ~map/alpha.png
              visible: var.visible && var.hudShape != 'CIRCLE' && var.mapRenderer != none
              through: true
            effect:
              stroke:
                width: self.parent.strokewidth
                # 可以通过调整颜色来调整地图边框描边
                color: ~255,255,255,255
          小地图世界名:
            type: Text
            attribute:
              x: self.parent.width / 2
              y: self.parent.height + 10
              # 世界名由服务端按玩家当前世界下发（配置 display-name 或 MV 去色 alias），
              # 不再走 %multiverse-core_alias% PAPI——没装 MV 也能显示配置名
              texts: "var.worldName == none ? '' : '' + var.worldName"
              fontSize: 36
              visible: var.visible && var.mapRenderer != none
              through: true
              center: true
          小地图坐标:
            type: Text
            attribute:
              x: self.parent.width / 2
              y: self.parent.height + 30
              # 此处为 ArcartX 提供的客户端aria函数工具
              texts: "'&eX&f: ' + Player.getPosX().round(2) + ' &eY&f: ' + Player.getPosY().round(2) + ' &eZ&f: ' + Player.getPosZ().round(2)"
              fontSize: 36
              visible: var.visible && var.mapRenderer != none
              through: true
              center: true

