# monsters.yml — 全局怪组定义
# floors 模式副本的怪组通常直接写在 rooms.yml 各房间的 groups 段内
# （本示例即是如此）。此文件保留给 classic 单世界副本或脚本 spawn_group
# 动态调用的全局组；字段格式与房间内 groups 完全一致。

# 示例：脚本增援组（"spawn_group flank_pack" 可在任何脚本段调用）
flank_pack:
  spawn-timing: MANUAL            # 只被 spawn_group 动作拉起
  monsters:
    - mob-id: vanilla:zombie
      location: "anchor:f1_combat_a.center"  # 锚点引用（gen 模式）
      amount: 3
  on-end:
    - "message @all &7增援已被肃清"
