# AXS 资源说明
# 用途: Abyss 地牢浏览器 —— 左侧地牢卡片列表 + 右侧详情面板 + 进入/队伍/刷新
# 布局: 全屏磨砂底 + 渐变底幕 + 页眉 + 左列滚动列表 + 右列详情
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
# 重载命令: /axs abyss reload
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 回包通道
    #   - action_token: 操作令牌
    #   - title: 界面标题
    #   - dungeonRows: 地牢卡片数据(整数字符串key)
    #   - dungeonCount: 地牢总数
    #   - hasParty / partyText: 队伍状态
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.title = packet['title']
      var.dungeonRows = packet['dungeonRows']
      var.dungeonCount = packet['dungeonCount']
      var.hasParty = packet['hasParty']
      var.partyText = packet['partyText']
      var.selEntry = none
      var.selectedId = ''
      // 重建卡片列表（模板在索引0，按轮次命名防冲突）
      目标数 = var.dungeonCount.round()
      if(val.dungeon_rows.childrenCount() - 1 != 目标数 - 1){
        for(key in var.卡片引用.keys()){
          var.卡片引用[key].remove()
        }
        var.卡片引用 = {}
        var.卡片轮次 = (var.卡片轮次 + 1).round()
        模板 = val.dungeon_rows.get(0)
        模板.entryKey = 0.round()
        if(目标数 > 1){
          for(i in range(1, 目标数 - 1)){
            c = 模板.copy('地牢卡片_' + var.卡片轮次 + '_' + i.round())
            c.entryKey = i.round()
            var.卡片引用[i.round()] = c
          }
        }
      }
      // 数据就绪后触发每张卡片图标 seticon（属性不随 var 自动重算）
      if(目标数 > 0){
        val.dungeon_rows.get(0)['图标'].seticon()
        for(i in range(1, 目标数 - 1)){
          var.卡片引用[i.round()]['图标'].seticon()
        }
      }
      // 默认选中第一张卡片
      if(目标数 > 0){
        var.selEntry = var.dungeonRows[0.round()]
        var.selKey = 0.round()
        var.selectedId = var.selEntry['id']
      }
      val.list_slider.setDragYRatio(0)
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.title = '深渊回廊'
      var.dungeonRows = {}
      var.dungeonCount = 0
      var.hasParty = false
      var.partyText = '未组队'
      var.selEntry = none
      var.selKey = -1
      var.selectedId = ''
      var.卡片轮次 = 0
      var.卡片引用 = {}
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.accent = '186,140,232,255'
      var.accentDim = '96,80,140,190'
      var.accentHover = '220,180,255,235'
      var.cardBg = '38,30,58,255'
      var.cardBgActive = '68,52,96,255'
      var.cardBgHover = '52,40,76,255'
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.leftW = var.viewW * 0.6
      var.rightW = var.viewW - var.leftW
    open: |-
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      全屏画布:
        type: Canvas
        attribute:
          x: "-var.offX"
          width: "var.viewW"
          height: "var.viewH"
        children:
          场景磨砂:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;20,16,38,245
          暮色底幕:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~16,12,30,255
            effect:
              gradient:
                color1: ~30,22,52,255
                color2: ~12,9,24,255
                type: 0
                angleDeg: 65
          # ── 页眉 ──
          页眉标线:
            type: Texture
            attribute:
              x: 76
              y: 56
              width: 28
              height: 3
              normal: var.accent
              through: true
          品牌标记:
            type: Text
            attribute:
              x: 120
              y: 46
              texts: ~&fA B Y S S  /  深渊回廊
              fontSize: 36
              alpha: 0.78
              through: true
          标题:
            type: Text
            attribute:
              x: 72
              y: 104
              texts: var.title
              fontSize: 88
              limit: 20
              through: true
          引导语:
            type: Text
            attribute:
              x: 76
              y: 176
              texts: ~&7选择一处深渊裂隙，踏入其中。
              fontSize: 36
              through: true
          队伍状态底色:
            type: Texture
            attribute:
              point: ~top_right
              x: -150
              y: 62
              width: 240
              height: 48
              normal: ~38,30,58,255
              shape: ~round_rect
              radius: 8
              through: true
            effect:
              stroke:
                width: 2
                color: var.accentDim
          队伍状态:
            type: Text
            attribute:
              point: ~top_right
              x: -166
              y: 72
              texts: "'&7' + var.partyText"
              fontSize: 36
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -76
              y: 52
              width: 48
              height: 48
            action:
              clickLeft: "Screen.close()"
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~150,58,58,235
                  hover: ~190,75,75,245
                  shape: ~circle
                  through: true
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f✕
                  fontSize: 36
                  through: true
          分隔线:
            type: Texture
            attribute:
              x: 76
              y: 232
              width: "var.leftW - 152"
              height: 1
              normal: ~96,80,140,160
              through: true
          # ── 左列：地牢卡片滚动列表 ──
          左侧区域:
            type: Canvas
            attribute:
              width: "var.leftW"
              height: "var.viewH"
            children:
              空提示:
                type: Canvas
                attribute:
                  x: 76
                  y: 380
                  width: "var.leftW - 152"
                  height: 160
                  visible: var.dungeonCount <= 0
                children:
                  空标题:
                    type: Text
                    attribute:
                      point: ~top_center
                      texts: ~&f暂无开放的地牢
                      fontSize: 54
                      through: true
                  空说明:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 56
                      texts: ~&7请稍后再来，或联系管理员配置地牢模板。
                      fontSize: 36
                      through: true
              卡片滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -52
                  y: 252
                  width: 10
                  height: "var.viewH - 380"
                  normal: ~40,32,62,220
                  shape: ~round_rect
                  radius: 5
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: var.accentDim
              卡片滑块:
                type: Texture
                val: list_slider
                attribute:
                  point: ~top_right
                  x: -52
                  y: 252
                  width: 10
                  height: 120
                  normal: var.accent
                  maxDragY: "var.viewH - 380 - 120"
                  shape: ~round_rect
                  radius: 5
              卡片滚动区:
                type: Scroll
                attribute:
                  x: 76
                  y: 252
                  width: "var.leftW - 152"
                  height: "var.viewH - 380"
                  moveY: val.list_slider.getDragYRatio()
                action:
                  wheel: |-
                    ratio = self.moveY - self.wheelValue * 0.12
                    if(ratio < 0){ ratio = 0 }
                    if(ratio > 1){ ratio = 1 }
                    val.list_slider.setDragYRatio(ratio)
                children:
                  卡片列表:
                    type: VStack
                    val: dungeon_rows
                    attribute:
                      width: "var.leftW - 168"
                      spaceBetween: 12
                    children:
                      地牢卡片:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.dungeonRows[self.entryKey]
                          active: "self.entry != none && var.selectedId == self.entry['id']"
                          visible: self.entry != none
                          width: "var.leftW - 168"
                          height: 116
                        action:
                          clickLeft: |-
                            if(self.entry != none){
                              var.selEntry = self.entry
                              var.selKey = self.entryKey
                              var.selectedId = self.entry['id']
                              Sound.self('minecraft:ui.button.click', 1.4, 10)
                            }
                        children:
                          卡片底色:
                            type: Texture
                            attribute:
                              x: 2
                              y: 2
                              width: "self.parent.width - 4"
                              height: "self.parent.height - 4"
                              normal: "self.parent.active ? var.cardBgActive : var.cardBg"
                              hover: var.cardBgHover
                              shape: ~round_rect
                              radius: 12
                              through: true
                            effect:
                              stroke:
                                width: "self.parent.active ? 4 : 3"
                                color: "self.parent.active ? var.accent : (self.parent.isHovered() ? var.accentHover : var.accentDim)"
                          选中侧线:
                            type: Texture
                            attribute:
                              x: 3
                              y: 26
                              width: "self.parent.active ? 5 : (self.parent.isHovered() ? 4 : 3)"
                              height: 64
                              alpha: "self.parent.active ? 1 : (self.parent.isHovered() ? 0.72 : 0.42)"
                              normal: var.accent
                              shape: ~round_rect
                              radius: 2
                              through: true
                          图标底座:
                            type: Texture
                            attribute:
                              x: 24
                              y: 24
                              width: 68
                              height: 68
                              normal: var.accent
                              alpha: "(self.parent.active || self.parent.isHovered()) ? 1 : 0.74"
                              shape: ~round_rect
                              radius: 14
                              through: true
                          图标:
                            type: Slot
                            attribute:
                              slotType: ~Icon
                              x: 32
                              y: 32
                              width: 52
                              height: 52
                              itemScale: 0.82
                              normal: ~0,0,0,0
                              through: true
                              seticon: "self.setItemIcon(self.parent.entry['iconJson'] != none ? self.parent.entry['iconJson'] : var.air)"
                          名称:
                            type: Text
                            attribute:
                              x: 112
                              y: 22
                              texts: "'&f' + self.parent.entry['name']"
                              fontSize: 48
                              limit: 14
                              through: true
                          难度人数:
                            type: Text
                            attribute:
                              x: 112
                              y: 68
                              texts: "'&7' + self.parent.entry['difficulty'] + '   &8' + self.parent.entry['minPlayers'].round() + '-' + self.parent.entry['maxPlayers'].round() + '人' + (self.parent.entry['partyRequired'] ? '   &c需组队' : '')"
                              fontSize: 36
                              through: true
                          冷却标记:
                            type: Text
                            attribute:
                              point: ~middle_right
                              x: -24
                              texts: "self.parent.entry['cooldownLeft'] > 0 ? '&c冷却 ' + self.parent.entry['cooldownLeft'].round() + 's' : (self.parent.entry['running'] > 0 ? '&a运行中' : '')"
                              fontSize: 36
                              through: true
          # ── 右列：详情面板 ──
          详情底:
            type: Texture
            attribute:
              x: "var.leftW + 24"
              y: 96
              width: "var.rightW - 120"
              height: "var.viewH - 192"
              normal: ~24,19,40,235
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 2
                color: var.accentDim
          详情标题标线:
            type: Texture
            attribute:
              x: "var.leftW + 76"
              y: 152
              width: 22
              height: 3
              normal: var.accent
              visible: var.selEntry != none
              through: true
          详情标题:
            type: Text
            attribute:
              x: "var.leftW + 76"
              y: 166
              texts: "var.selEntry != none ? '&f' + var.selEntry['name'] : '&7未选择地牢'"
              fontSize: 64
              limit: 12
              through: true
          详情难度:
            type: Text
            attribute:
              x: "var.leftW + 78"
              y: 250
              texts: "var.selEntry != none ? '&7难度  &f' + var.selEntry['difficulty'] : ''"
              fontSize: 36
              through: true
          详情条件行:
            type: Text
            attribute:
              x: "var.leftW + 78"
              y: 306
              fontSize: 36
              through: true
              texts:
                - "var.selEntry != none ? '&8人数  &f' + var.selEntry['minPlayers'].round() + '-' + var.selEntry['maxPlayers'].round() + '人   &8体力  &b' + var.selEntry['staminaCost'].round() : ''"
                - "var.selEntry != none ? '&8门票  &e' + var.selEntry['moneyCost'].round() + '   &8冷却  &f' + var.selEntry['cooldown'].round() + 's   &8运行中  &f' + var.selEntry['running'].round() : ''"
                - "var.selEntry != none && var.selEntry['partyRequired'] ? '&c该地牢需要组队进入' : ''"
                - "var.selEntry != none && var.selEntry['cooldownLeft'] > 0 ? '&c冷却剩余: ' + var.selEntry['cooldownLeft'].round() + 's' : ''"
          详情描述标线:
            type: Texture
            attribute:
              x: "var.leftW + 78"
              y: 470
              width: "var.rightW - 196"
              height: 1
              normal: ~96,80,140,120
              visible: var.selEntry != none
              through: true
          详情描述:
            type: Text
            attribute:
              x: "var.leftW + 78"
              y: 492
              fontSize: 36
              through: true
              texts:
                - "var.selEntry != none ? '&7' + var.selEntry['desc0'] : ''"
                - "var.selEntry != none ? '&7' + var.selEntry['desc1'] : ''"
                - "var.selEntry != none ? '&7' + var.selEntry['desc2'] : ''"
          操作区:
            type: HStack
            attribute:
              x: "var.leftW + 78"
              y: "var.viewH - 156"
              height: 54
              spaceBetween: 16
            children:
              进入按钮:
                type: Canvas
                attribute:
                  width: 180
                  height: 54
                  visible: var.selEntry != none
                action:
                  clickLeft: |-
                    if(var.selectedId != '' && var.selectedId != none){
                      Packet.send(var.packetId, 'enter', var.selectedId, var.actionToken)
                      Screen.close()
                    }
                children:
                  进入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~170,120,220,230
                      hover: ~200,150,240,245
                      shape: ~round_rect
                      radius: 10
                      through: true
                  进入字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&0进 入
                      fontSize: 36
                      through: true
              队伍按钮:
                type: Canvas
                attribute:
                  width: 140
                  height: 54
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'open_party_ui', var.actionToken)
                children:
                  队伍底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~80,160,240,230
                      hover: ~110,185,255,245
                      shape: ~round_rect
                      radius: 10
                      through: true
                  队伍字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&0队 伍
                      fontSize: 36
                      through: true
              刷新按钮:
                type: Canvas
                attribute:
                  width: 140
                  height: 54
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'refresh_browser', var.actionToken)
                children:
                  刷新底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~62,66,74,230
                      hover: ~82,90,105,245
                      shape: ~round_rect
                      radius: 10
                      through: true
                    effect:
                      stroke:
                        width: 2
                        color: var.accentDim
                  刷新字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f刷 新
                      fontSize: 36
                      through: true
          底部提示:
            type: Text
            attribute:
              x: 76
              y: "var.viewH - 60"
              texts: ~&8单击左侧卡片查看详情，点击「进入」开始挑战
              fontSize: 36
              alpha: 0.6
              through: true
