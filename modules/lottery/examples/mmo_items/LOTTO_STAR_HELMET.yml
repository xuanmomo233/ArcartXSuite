# MMOItems 物品配置示例
# 文件需复制到 plugins/MMOItems/item/ 目录下（按类型分文件夹）
# 对应 lottery/exchange/shop.yml 的 star_helmet.item.id: ARMOR;LOTTO_STAR_HELMET
# 故 Type = ARMOR, ID = LOTTO_STAR_HELMET
# 通常放置路径: plugins/MMOItems/item/armor/LOTTO_STAR_HELMET.yml

LOTTO_STAR_HELMET:
  # 基础属性
  base:
    # 基础材质
    material: IRON_HELMET
  # 显示名称
  name: '&b星辰头盔'
  # Lore
  lore:
    - '&7积分兑换商店中的星辰主题头盔。'
    - ''
    - '&e✦ &7稀有度: &b限定'
    - '&e✦ &7类别: &f护甲'
    - '&e✦ &7来源: &f祈愿积分兑换'
  # 附魔
  enchants:
    PROTECTION_ENVIRONMENTAL: 3
    DURABILITY: 3
  # 类型特定选项
  item-type: ARMOR
  # 最大耐久
  max-durability: 180
  # 是否绑定
  bound: false
  # 自定义模型数据（可选，需配合资源包）
  # custom-model-data: 20001
