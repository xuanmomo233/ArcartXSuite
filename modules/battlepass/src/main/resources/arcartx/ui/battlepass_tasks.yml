# Season expedition journal · 03 / daily, weekly and season itinerary
# Spacious task slips: name, hover-readable objective, XP, numerical progress and route rail.
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.dailyTasks = packet['dailyTasks']
      var.weeklyTasks = packet['weeklyTasks']
      var.seasonTasks = packet['seasonTasks']
      var.dailyTaskCount = packet['dailyTaskCount']
      var.weeklyTaskCount = packet['weeklyTaskCount']
      var.seasonTaskCount = packet['seasonTaskCount']
      var.totalTaskCount = packet['totalTaskCount']
      var.dailyCompletedCount = packet['dailyCompletedCount']
      var.weeklyCompletedCount = packet['weeklyCompletedCount']
      var.seasonCompletedCount = packet['seasonCompletedCount']
      var.maxDailyCount = packet['maxDailyCount']
      var.maxWeeklyCount = packet['maxWeeklyCount']
      var.maxSeasonCount = packet['maxSeasonCount']
      if(val.每日任务列表.childrenCount() != type.toNumber(var.maxDailyCount)){
        for(key in var.dailyRefs.keys()){ var.dailyRefs[key].remove() }
        var.dailyRefs = {}
        var.dailyGeneration = (var.dailyGeneration + 1).round()
        template = val.每日任务列表.get(0)
        for(i in range(1, var.maxDailyCount - 1)){
          key = i.round()
          e = template.copy('任务项_' + var.dailyGeneration + '_' + key)
          e.entryKey = key
          var.dailyRefs[key] = e
        }
      }
      if(val.每周任务列表.childrenCount() != type.toNumber(var.maxWeeklyCount)){
        for(key in var.weeklyRefs.keys()){ var.weeklyRefs[key].remove() }
        var.weeklyRefs = {}
        var.weeklyGeneration = (var.weeklyGeneration + 1).round()
        template = val.每周任务列表.get(0)
        for(i in range(1, var.maxWeeklyCount - 1)){
          key = i.round()
          e = template.copy('任务项_' + var.weeklyGeneration + '_' + key)
          e.entryKey = key
          var.weeklyRefs[key] = e
        }
      }
      if(val.赛季任务列表.childrenCount() != type.toNumber(var.maxSeasonCount)){
        for(key in var.seasonRefs.keys()){ var.seasonRefs[key].remove() }
        var.seasonRefs = {}
        var.seasonGeneration = (var.seasonGeneration + 1).round()
        template = val.赛季任务列表.get(0)
        for(i in range(1, var.maxSeasonCount - 1)){
          key = i.round()
          e = template.copy('任务项_' + var.seasonGeneration + '_' + key)
          e.entryKey = key
          var.seasonRefs[key] = e
        }
      }
  action:
    load: |-
      var.dailyCompletedCount = 0
      var.seasonCompletedCount = 0
      var.weeklyCompletedCount = 0
      var.dailyTaskCount = 0
      var.packetId = 'AXS_BATTLEPASS'
      var.seasonTaskCount = 0
      var.weeklyTaskCount = 0
      var.totalTaskCount = 0
      var.dailyRefs = {}
      var.weeklyRefs = {}
      var.seasonRefs = {}
      var.dailyGeneration = 0
      var.weeklyGeneration = 0
      var.seasonGeneration = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.taskFilter = 'all'
    # Server pushes init after opening; do not issue another open request.
    open: |-
      {}
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
controls:
  全屏玻璃底:
    type: Texture
    attribute: {point: ~stretch_all, normal: '~Frosted:16;24,29,51,235'}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶栏:
        type: Canvas
        attribute: {point: ~top_left, x: '-var.offX', width: var.viewW, height: 96}
        children:
          顶栏底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~29,35,62,255'}
          标题:
            type: Text
            attribute: {point: ~middle_left, x: 48, texts: '~&f战令 / 远征手记', fontSize: 48, through: true}
          页名:
            type: Text
            attribute: {point: ~middle_left, x: 540, texts: '~&e第三章 / 任务路线', fontSize: 36, through: true}
          任务统计:
            type: Text
            attribute: {point: ~middle_right, x: -250, texts: "'&f每日 ' + var.dailyTaskCount + ' / 每周 ' + var.weeklyTaskCount + ' / 赛季 ' + var.seasonTaskCount", fontSize: 36, through: true}
          关闭按钮:
            type: Canvas
            attribute: {point: ~middle_right, x: -48, width: 160, height: 52}
            action:
              clickLeft: Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~44,53,88,255', hover: '~62,73,111,255', shape: ~round_rect, radius: 6, through: true}
              关闭文字:
                type: Text
                attribute: {point: ~middle_center, texts: '~&f合上 / ESC', fontSize: 36, through: true}
      左侧导航:
        type: Canvas
        attribute: {point: ~top_left, x: '48 - var.offX', y: 120, width: 300, height: 'var.viewH - 144'}
        children:
          导航底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~187,140,66,255', shape: ~round_rect, radius: 8}
          目录标题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 26, texts: '~&0远征目录', fontSize: 48, through: true}
          目录副题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 84, texts: '~&0SEASON JOURNAL', fontSize: 36, through: true}
          导航总览:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 154, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_main')
            children:
              总览底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              总览文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0第一章 / 总览', fontSize: 36, through: true}
          导航奖励:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 238, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_rewards')
            children:
              奖励底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              奖励文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0第二章 / 奖励', fontSize: 36, through: true}
          导航任务:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 322, width: 268, height: 72}
            children:
              任务底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,40,70,255', shape: ~round_rect, radius: 6, through: true}
              任务文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&f03 / 任务路线', fontSize: 36, through: true}
          导航结算:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 406, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_settlement')
            children:
              结算底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              结算文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0终章 / 结算', fontSize: 36, through: true}
          完成度标题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 512, texts: '~&0选择路线 / 完成度', fontSize: 36, through: true}
          全部按钮:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 558, width: 268, height: 48}
            action:
              clickLeft: |-
                var.taskFilter = 'all'
                val.任务滑块.setDragYRatio(0)
            children:
              全部底:
                type: Texture
                attribute: {point: ~stretch_all, normal: "var.taskFilter == 'all' ? '32,40,70,255' : '207,166,97,255'", hover: '~155,111,48,255', shape: ~round_rect, radius: 4, through: true}
              全部文字:
                type: Text
                attribute: {point: ~middle_left, x: 16, texts: "var.taskFilter == 'all' ? '&f全部路线' : '&0全部路线'", fontSize: 36, through: true}
          每日完成度:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 622, width: 268, height: 56}
            action:
              clickLeft: |-
                var.taskFilter = 'daily'
                val.任务滑块.setDragYRatio(0)
            children:
              每日完成底:
                type: Texture
                attribute: {point: ~stretch_all, normal: "var.taskFilter == 'daily' ? '32,40,70,255' : '207,166,97,255'", hover: '~155,111,48,255', shape: ~round_rect, radius: 4, through: true}
              每日完成名:
                type: Text
                attribute: {point: ~middle_left, x: 16, texts: "var.taskFilter == 'daily' ? '&f每日' : '&0每日'", fontSize: 36, through: true}
              每日完成数:
                type: Text
                attribute: {point: ~middle_right, x: -16, texts: "'&f' + var.dailyCompletedCount + '/' + var.dailyTaskCount", fontSize: 36, through: true}
          每周完成度:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 694, width: 268, height: 56}
            action:
              clickLeft: |-
                var.taskFilter = 'weekly'
                val.任务滑块.setDragYRatio(0)
            children:
              每周完成底:
                type: Texture
                attribute: {point: ~stretch_all, normal: "var.taskFilter == 'weekly' ? '32,40,70,255' : '207,166,97,255'", hover: '~155,111,48,255', shape: ~round_rect, radius: 4, through: true}
              每周完成名:
                type: Text
                attribute: {point: ~middle_left, x: 16, texts: "var.taskFilter == 'weekly' ? '&f每周' : '&0每周'", fontSize: 36, through: true}
              每周完成数:
                type: Text
                attribute: {point: ~middle_right, x: -16, texts: "'&f' + var.weeklyCompletedCount + '/' + var.weeklyTaskCount", fontSize: 36, through: true}
          赛季完成度:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 766, width: 268, height: 56}
            action:
              clickLeft: |-
                var.taskFilter = 'season'
                val.任务滑块.setDragYRatio(0)
            children:
              赛季完成底:
                type: Texture
                attribute: {point: ~stretch_all, normal: "var.taskFilter == 'season' ? '32,40,70,255' : '207,166,97,255'", hover: '~155,111,48,255', shape: ~round_rect, radius: 4, through: true}
              赛季完成名:
                type: Text
                attribute: {point: ~middle_left, x: 16, texts: "var.taskFilter == 'season' ? '&f赛季' : '&0赛季'", fontSize: 36, through: true}
              赛季完成数:
                type: Text
                attribute: {point: ~middle_right, x: -16, texts: "'&f' + var.seasonCompletedCount + '/' + var.seasonTaskCount", fontSize: 36, through: true}
          刷新按钮:
            type: Canvas
            attribute: {point: ~bottom_left, x: 16, y: -24, width: 268, height: 52}
            action:
              clickLeft: Packet.send(var.packetId, 'refresh_tasks')
            children:
              刷新背景:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,40,70,255', hover: '~55,65,102,255', shape: ~round_rect, radius: 4, through: true}
              刷新文字:
                type: Text
                attribute: {point: ~middle_center, texts: '~&f刷新任务记录', fontSize: 36, through: true}
      内容区:
        type: Canvas
        attribute: {point: ~top_left, x: '372 - var.offX', y: 120, width: var.contentW, height: 'var.viewH - 144'}
        children:
          内容底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~239,232,215,255', shape: ~round_rect, radius: 8}
          页标题:
            type: Text
            attribute: {point: ~top_left, x: 32, y: 28, texts: '~&0任务路线 / 一步一步向前', fontSize: 64, through: true}
          页标题说明:
            type: Text
            attribute: {point: ~top_left, x: 34, y: 100, texts: '~&8完成目标自动获得战令经验；每日与每周路线定期刷新。', fontSize: 36, through: true}
          进度汇总:
            type: Canvas
            attribute: {point: ~top_left, x: 28, y: 158, width: 'var.contentW - 56', height: 76}
            children:
              汇总底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,40,70,255', shape: ~round_rect, radius: 6}
              汇总文字:
                type: Text
                attribute: {point: ~middle_left, x: 24, texts: "'&f已完成 / ' + (type.toNumber(var.dailyCompletedCount) + type.toNumber(var.weeklyCompletedCount) + type.toNumber(var.seasonCompletedCount)).round() + ' / ' + var.totalTaskCount + '    &e每个完成的路标都带来 XP'", fontSize: 36, through: true}
          任务滑轨:
            type: Texture
            attribute: {point: ~top_right, x: -20, y: 268, width: 14, height: 'var.viewH - 478', normal: '~207,197,174,255', shape: ~round_rect, radius: 6}
          任务滑块:
            val: 任务滑块
            type: Texture
            attribute: {point: ~top_right, x: -20, y: 268, width: 14, height: 120, maxDragY: 'var.viewH - 598', normal: '~187,140,66,255', hover: '~205,163,84,255', shape: ~round_rect, radius: 6}
          滚动区:
            type: Scroll
            attribute: {point: ~top_left, x: 28, y: 268, width: 'var.contentW - 80', height: 'var.viewH - 478', moveY: "self.parent['任务滑块'].getDragYRatio()"}
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['任务滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['任务滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              任务总容器:
                val: 任务总容器
                type: VStack
                attribute: {width: 'var.contentW - 80', spaceBetween: 24}
                children:
                  每日任务区:
                    type: Canvas
                    attribute: {width: 'var.contentW - 80', height: 'var.dailyTaskCount > 0 ? var.dailyTaskCount * 164 + 84 : 0', visible: "(var.taskFilter == 'all' || var.taskFilter == 'daily') && var.dailyTaskCount > 0"}
                    children:
                      每日标题:
                        type: Text
                        attribute: {point: ~top_left, x: 14, y: 8, texts: '~&6一日行程 / 每日任务', fontSize: 48, through: true}
                      每日计数:
                        type: Text
                        attribute: {point: ~top_right, x: -18, y: 14, texts: "'&8已完成 ' + var.dailyCompletedCount + '/' + var.dailyTaskCount", fontSize: 36, through: true}
                      每日任务列表:
                        val: 每日任务列表
                        type: VStack
                        attribute: {point: ~top_left, x: 8, y: 72, width: 'var.contentW - 96', spaceBetween: 16}
                        children:
                          任务项:
                            type: Canvas
                            attribute: {entryKey: 0.round(), entry: 'var.dailyTasks[self.entryKey]', visible: self.entry != none, width: 'var.contentW - 96', height: 148}
                            action:
                              enter: self['任务描述滚动'].scrollAnim = Lerp(0, 1, 3500)
                              leave: self['任务描述滚动'].scrollAnim = none
                            children:
                              任务项背景:
                                type: Texture
                                attribute: {point: ~stretch_all, normal: "self.parent.entry['completed'] == 'true' ? '220,230,208,255' : '228,219,198,255'", shape: ~round_rect, radius: 6, through: true}
                              路线连线:
                                type: Texture
                                attribute: {point: ~top_left, x: 29, y: 0, width: 3, height: 148, normal: '~187,140,66,255', through: true}
                              状态标记:
                                type: Canvas
                                attribute: {point: ~top_left, x: 14, y: 18, width: 34, height: 34, entry: self.parent.entry, through: true}
                                children:
                                  状态底:
                                    type: Texture
                                    attribute: {point: ~stretch_all, normal: "self.parent.entry['completed'] == 'true' ? '103,136,97,255' : '187,140,66,255'", shape: ~circle, through: true}
                                  状态勾:
                                    type: Text
                                    attribute: {point: ~middle_center, texts: "self.parent.entry['completed'] == 'true' ? '&f✓' : '&0·'", fontSize: 36, through: true}
                              任务名:
                                type: Text
                                attribute: {point: ~top_left, x: 68, y: 14, texts: "'&0' + self.parent.entry['name']", fontSize: 48, limit: 26, through: true}
                              任务奖励:
                                type: Text
                                attribute: {point: ~top_right, x: -22, y: 18, texts: "'&6+' + self.parent.entry['xpReward'] + ' XP'", fontSize: 36, through: true}
                              任务描述滚动:
                                type: Scroll
                                attribute: {point: ~top_left, x: 68, y: 66, width: 'var.contentW - 204', height: 40, through: true, scrollAnim: none, moveX: 'self.scrollAnim != none ? self.scrollAnim.get() : 0'}
                                children:
                                  描述行:
                                    type: HStack
                                    attribute: {height: 40, through: true}
                                    children:
                                      任务描述:
                                        type: Text
                                        attribute: {texts: "'&8' + self.parent.parent.parent.entry['description']", fontSize: 36, through: true}
                              任务进度:
                                type: Text
                                attribute: {point: ~bottom_right, x: -22, y: -12, texts: "'&8' + self.parent.entry['progress'] + '/' + self.parent.entry['required'] + '  ' + self.parent.entry['progressPercent']", fontSize: 36, through: true}
                              进度条背景:
                                type: Texture
                                attribute: {point: ~bottom_left, x: 68, y: -18, width: 'var.contentW - 500', height: 8, normal: '~198,185,157,255', shape: ~round_rect, radius: 4, through: true}
                              进度条填充:
                                type: Texture
                                attribute: {point: ~bottom_left, x: 68, y: -18, width: "(type.toNumber(self.parent.entry['progressRatio']) > 1 ? 1 : type.toNumber(self.parent.entry['progressRatio'])) * (var.contentW - 500)", height: 8, normal: "self.parent.entry['completed'] == 'true' ? '103,136,97,255' : '187,140,66,255'", shape: ~round_rect, radius: 4, through: true}
                  每周任务区:
                    type: Canvas
                    attribute: {width: 'var.contentW - 80', height: 'var.weeklyTaskCount > 0 ? var.weeklyTaskCount * 164 + 84 : 0', visible: "(var.taskFilter == 'all' || var.taskFilter == 'weekly') && var.weeklyTaskCount > 0"}
                    children:
                      每周标题:
                        type: Text
                        attribute: {point: ~top_left, x: 14, y: 8, texts: '~&1七日征程 / 每周任务', fontSize: 48, through: true}
                      每周计数:
                        type: Text
                        attribute: {point: ~top_right, x: -18, y: 14, texts: "'&8已完成 ' + var.weeklyCompletedCount + '/' + var.weeklyTaskCount", fontSize: 36, through: true}
                      每周任务列表:
                        val: 每周任务列表
                        type: VStack
                        attribute: {point: ~top_left, x: 8, y: 72, width: 'var.contentW - 96', spaceBetween: 16}
                        children:
                          任务项:
                            type: Canvas
                            attribute: {entryKey: 0.round(), entry: 'var.weeklyTasks[self.entryKey]', visible: self.entry != none, width: 'var.contentW - 96', height: 148}
                            action:
                              enter: self['任务描述滚动'].scrollAnim = Lerp(0, 1, 3500)
                              leave: self['任务描述滚动'].scrollAnim = none
                            children:
                              任务项背景:
                                type: Texture
                                attribute: {point: ~stretch_all, normal: "self.parent.entry['completed'] == 'true' ? '220,230,208,255' : '228,219,198,255'", shape: ~round_rect, radius: 6, through: true}
                              路线连线:
                                type: Texture
                                attribute: {point: ~top_left, x: 29, y: 0, width: 3, height: 148, normal: '~77,101,141,255', through: true}
                              状态标记:
                                type: Canvas
                                attribute: {point: ~top_left, x: 14, y: 18, width: 34, height: 34, entry: self.parent.entry, through: true}
                                children:
                                  状态底:
                                    type: Texture
                                    attribute: {point: ~stretch_all, normal: "self.parent.entry['completed'] == 'true' ? '103,136,97,255' : '77,101,141,255'", shape: ~circle, through: true}
                                  状态勾:
                                    type: Text
                                    attribute: {point: ~middle_center, texts: "self.parent.entry['completed'] == 'true' ? '&f✓' : '&f·'", fontSize: 36, through: true}
                              任务名:
                                type: Text
                                attribute: {point: ~top_left, x: 68, y: 14, texts: "'&0' + self.parent.entry['name']", fontSize: 48, limit: 26, through: true}
                              任务奖励:
                                type: Text
                                attribute: {point: ~top_right, x: -22, y: 18, texts: "'&6+' + self.parent.entry['xpReward'] + ' XP'", fontSize: 36, through: true}
                              任务描述滚动:
                                type: Scroll
                                attribute: {point: ~top_left, x: 68, y: 66, width: 'var.contentW - 204', height: 40, through: true, scrollAnim: none, moveX: 'self.scrollAnim != none ? self.scrollAnim.get() : 0'}
                                children:
                                  描述行:
                                    type: HStack
                                    attribute: {height: 40, through: true}
                                    children:
                                      任务描述:
                                        type: Text
                                        attribute: {texts: "'&8' + self.parent.parent.parent.entry['description']", fontSize: 36, through: true}
                              任务进度:
                                type: Text
                                attribute: {point: ~bottom_right, x: -22, y: -12, texts: "'&8' + self.parent.entry['progress'] + '/' + self.parent.entry['required'] + '  ' + self.parent.entry['progressPercent']", fontSize: 36, through: true}
                              进度条背景:
                                type: Texture
                                attribute: {point: ~bottom_left, x: 68, y: -18, width: 'var.contentW - 500', height: 8, normal: '~198,185,157,255', shape: ~round_rect, radius: 4, through: true}
                              进度条填充:
                                type: Texture
                                attribute: {point: ~bottom_left, x: 68, y: -18, width: "(type.toNumber(self.parent.entry['progressRatio']) > 1 ? 1 : type.toNumber(self.parent.entry['progressRatio'])) * (var.contentW - 500)", height: 8, normal: "self.parent.entry['completed'] == 'true' ? '103,136,97,255' : '77,101,141,255'", shape: ~round_rect, radius: 4, through: true}
                  赛季任务区:
                    type: Canvas
                    attribute: {width: 'var.contentW - 80', height: 'var.seasonTaskCount > 0 ? var.seasonTaskCount * 164 + 84 : 0', visible: "(var.taskFilter == 'all' || var.taskFilter == 'season') && var.seasonTaskCount > 0"}
                    children:
                      赛季标题:
                        type: Text
                        attribute: {point: ~top_left, x: 14, y: 8, texts: '~&5长途远征 / 赛季任务', fontSize: 48, through: true}
                      赛季计数:
                        type: Text
                        attribute: {point: ~top_right, x: -18, y: 14, texts: "'&8已完成 ' + var.seasonCompletedCount + '/' + var.seasonTaskCount", fontSize: 36, through: true}
                      赛季任务列表:
                        val: 赛季任务列表
                        type: VStack
                        attribute: {point: ~top_left, x: 8, y: 72, width: 'var.contentW - 96', spaceBetween: 16}
                        children:
                          任务项:
                            type: Canvas
                            attribute: {entryKey: 0.round(), entry: 'var.seasonTasks[self.entryKey]', visible: self.entry != none, width: 'var.contentW - 96', height: 148}
                            action:
                              enter: self['任务描述滚动'].scrollAnim = Lerp(0, 1, 3500)
                              leave: self['任务描述滚动'].scrollAnim = none
                            children:
                              任务项背景:
                                type: Texture
                                attribute: {point: ~stretch_all, normal: "self.parent.entry['completed'] == 'true' ? '220,230,208,255' : '228,219,198,255'", shape: ~round_rect, radius: 6, through: true}
                              路线连线:
                                type: Texture
                                attribute: {point: ~top_left, x: 29, y: 0, width: 3, height: 148, normal: '~121,95,144,255', through: true}
                              状态标记:
                                type: Canvas
                                attribute: {point: ~top_left, x: 14, y: 18, width: 34, height: 34, entry: self.parent.entry, through: true}
                                children:
                                  状态底:
                                    type: Texture
                                    attribute: {point: ~stretch_all, normal: "self.parent.entry['completed'] == 'true' ? '103,136,97,255' : '121,95,144,255'", shape: ~circle, through: true}
                                  状态勾:
                                    type: Text
                                    attribute: {point: ~middle_center, texts: "self.parent.entry['completed'] == 'true' ? '&f✓' : '&f·'", fontSize: 36, through: true}
                              任务名:
                                type: Text
                                attribute: {point: ~top_left, x: 68, y: 14, texts: "'&0' + self.parent.entry['name']", fontSize: 48, limit: 26, through: true}
                              任务奖励:
                                type: Text
                                attribute: {point: ~top_right, x: -22, y: 18, texts: "'&6+' + self.parent.entry['xpReward'] + ' XP'", fontSize: 36, through: true}
                              任务描述滚动:
                                type: Scroll
                                attribute: {point: ~top_left, x: 68, y: 66, width: 'var.contentW - 204', height: 40, through: true, scrollAnim: none, moveX: 'self.scrollAnim != none ? self.scrollAnim.get() : 0'}
                                children:
                                  描述行:
                                    type: HStack
                                    attribute: {height: 40, through: true}
                                    children:
                                      任务描述:
                                        type: Text
                                        attribute: {texts: "'&8' + self.parent.parent.parent.entry['description']", fontSize: 36, through: true}
                              任务进度:
                                type: Text
                                attribute: {point: ~bottom_right, x: -22, y: -12, texts: "'&8' + self.parent.entry['progress'] + '/' + self.parent.entry['required'] + '  ' + self.parent.entry['progressPercent']", fontSize: 36, through: true}
                              进度条背景:
                                type: Texture
                                attribute: {point: ~bottom_left, x: 68, y: -18, width: 'var.contentW - 500', height: 8, normal: '~198,185,157,255', shape: ~round_rect, radius: 4, through: true}
                              进度条填充:
                                type: Texture
                                attribute: {point: ~bottom_left, x: 68, y: -18, width: "(type.toNumber(self.parent.entry['progressRatio']) > 1 ? 1 : type.toNumber(self.parent.entry['progressRatio'])) * (var.contentW - 500)", height: 8, normal: "self.parent.entry['completed'] == 'true' ? '103,136,97,255' : '121,95,144,255'", shape: ~round_rect, radius: 4, through: true}
          空状态:
            type: Text
            attribute: {point: ~middle_center, y: 64, texts: ['~&0这段路线暂无任务', '~&8选择其他路线，或刷新任务记录。'], fontSize: 36, through: true, visible: "(var.taskFilter == 'all' && var.totalTaskCount == 0) || (var.taskFilter == 'daily' && var.dailyTaskCount == 0) || (var.taskFilter == 'weekly' && var.weeklyTaskCount == 0) || (var.taskFilter == 'season' && var.seasonTaskCount == 0)"}
          滚动提示:
            type: Text
            attribute: {point: ~bottom_left, x: 34, y: -22, texts: '~&8浏览 / 滚轮或拖动金色滑块；悬停任务可阅读完整目标。', fontSize: 36, through: true}
