# AXPM Warehouse Storage - 重制版布局
# 使用三分区 Canvas + HStack 自动排列 + Grid 范式重写
# 逻辑脚本(packetHandler/action/val引用/entryKey)与原版完全一致，仅重构布局结构

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 包标识符（'AXS_WAREHOUSE'）
    #   - action_token: 操作令牌（防重放）
    #   - ownerType: 仓库所有者类型（personal / shared）
    #   - ownerId: 所有者 ID
    #   - warehouseId: 仓库 ID
    #   - warehouseName: 仓库名称
    #   - categoryId: 当前分类 ID
    #   - search: 搜索关键词
    #   - categories: 分类列表
    #   - categoryTexts: 分类显示文本
    #   - personalWarehouses: 个人仓库列表
    #   - personalWarehouseTexts: 个人仓库显示文本
    #   - sharedWarehouses: 共享仓库列表
    #   - sharedWarehouseStorageTexts: 共享仓库存储显示文本
    #   - slots: 仓库槽位数据
    #   - selectedSlot: 当前选中的槽位索引
    #   - selectedItem: 当前选中的物品
    #   - backpack: 玩家背包数据
    #   - unlocked: 二级密码是否已解锁
    #   - hasPassword: 是否已设置二级密码
    #   - readOnly: 是否只读模式
    #   - sharedEditMode: 共享仓库是否处于编辑模式
    #   - sharedCanEdit: 当前玩家是否有编辑权限
    #   - lockOwner: 编辑锁持有者
    #   - page: 当前页码
    #   - pageTotal: 总页数
    #   - pageText: 页码显示文本
    #   - capacityText: 容量显示文本
    #   - used: 已使用容量
    #   - capacity: 总容量
    #   - level: 仓库等级
    #   - canUpgrade: 是否可升级
    #   - nextUpgradeText: 下一级升级信息文本
    #   - nextLevel: 下一级等级
    #   - nextCapacity: 下一级容量
    #   - usedSlots: 已使用的槽位集合
    #   - matchedSlots: 搜索匹配的槽位集合
    #   - slotCount: 槽位总数
    #   - pageSize: 每页槽位数量
    #   - maxPersonalCount: 个人仓库最大数量（用于动态创建控件）
    #   - maxSharedCount: 共享仓库最大数量
    #   - maxCategoryCount: 分类最大数量
    update: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.categoryId = packet['categoryId']
      var.search = packet['search']
      var.sortId = packet['sortId']
      var.sortText = packet['sortText']
      var.categories = packet['categories']
      var.categoryTexts = packet['categoryTexts']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseStorageTexts = packet['sharedWarehouseStorageTexts']
      var.slots = packet['slots']
      var.selectedSlot = packet['selectedSlot']
      var.selectedItem = packet['selectedItem']
      var.backpack = packet['backpack']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.sharedEditMode = packet['sharedEditMode']
      var.sharedCanEdit = packet['sharedCanEdit']
      var.lockOwner = packet['lockOwner']
      var.page = packet['page']
      var.pageTotal = packet['pageTotal']
      var.pageText = packet['pageText']
      var.capacityText = packet['capacityText']
      var.used = packet['used']
      var.capacity = packet['capacity']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.nextLevel = packet['nextLevel']
      var.nextCapacity = packet['nextCapacity']
      var.usedSlots = packet['usedSlots']
      var.matchedSlots = packet['matchedSlots']
      var.slotCount = packet['slotCount']
      var.pageSize = packet['pageSize']
      var.maxPersonalCount = packet['maxPersonalCount']
      var.maxSharedCount = packet['maxSharedCount']
      var.maxCategoryCount = packet['maxCategoryCount']
      // 模板保留在索引 0，只有复制出来的控件才是数据行。
      个人仓库数 = var.maxPersonalCount.round()
      现有个人仓库数 = val.个人仓库列表.childrenCount() - 1
      if(现有个人仓库数 != 个人仓库数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.个人仓库列表.childrenCount() > 1){
          val.个人仓库列表.get(1).remove()
        }
        if(个人仓库数 > 1){
          for(序号 in range(1, 个人仓库数 - 1)){
            项 = val.个人仓库列表['项'].copy('个人仓库项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      共享仓库数 = var.maxSharedCount.round()
      现有共享仓库数 = val.共享仓库列表.childrenCount() - 1
      if(现有共享仓库数 != 共享仓库数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.共享仓库列表.childrenCount() > 1){
          val.共享仓库列表.get(1).remove()
        }
        if(共享仓库数 > 1){
          for(序号 in range(1, 共享仓库数 - 1)){
            项 = val.共享仓库列表['项'].copy('共享仓库项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      分类数 = var.maxCategoryCount.round()
      现有分类数 = val.分类列表.childrenCount() - 1
      if(现有分类数 != 分类数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.分类列表.childrenCount() > 1){
          val.分类列表.get(1).remove()
        }
        if(分类数 > 1){
          for(序号 in range(1, 分类数 - 1)){
            项 = val.分类列表['项'].copy('分类项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      var.renderBackpackAmounts()
      var.itemJsons = {}
      if(var.slots != none){
        for(key in var.slots.keys()){
          json = packet['slotItemJson' + key]
          if(json != none){
            var.itemJsons[key] = json
          } else {
            var.itemJsons[key] = var.air
          }
        }
      }
      仓库槽位数 = var.pageSize.round()
      现有仓库槽位数 = val.仓库网格.childrenCount() - 1
      if(现有仓库槽位数 != 仓库槽位数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.仓库网格.childrenCount() > 1){
          val.仓库网格.get(1).remove()
        }
        if(仓库槽位数 > 1){
          for(序号 in range(1, 仓库槽位数 - 1)){
            slot = val.仓库网格['物品图标'].copy('仓库物品图标_' + var.刷新轮次 + '_' + 序号.round())
            slot.entryKey = 序号.round()
          }
        }
      }
      for(i in range(0, 仓库槽位数 - 1)){
        icon = val.仓库网格.get(i.round())
        if(icon != none){
          icon.seticon()
        }
      }
  action:
    load: |-
      var.packetId = 'AXS_WAREHOUSE'
      var.ownerType = 'personal'
      var.ownerId = none
      var.warehouseId = none
      var.warehouseName = 'AXPM 仓库'
      var.categoryId = 'all'
      var.search = none
      var.sortId = 'time'
      var.sortText = '时间'
      var.categories = {}
      var.categoryTexts = {}
      var.personalWarehouses = {}
      var.personalWarehouseTexts = {}
      var.sharedWarehouses = {}
      var.sharedWarehouseStorageTexts = {}
      var.slots = {}
      var.itemJsons = {}
      var.air = '{"id": "minecraft:air","Count":1b}'
      var.selectedSlot = -1
      var.selectedItem = none
      var.backpack = {}
      var.unlocked = false
      var.hasPassword = false
      var.readOnly = false
      var.sharedEditMode = false
      var.sharedCanEdit = false
      var.lockOwner = none
      var.page = 1
      var.pageTotal = 1
      var.pageText = '1/1'
      var.capacityText = '0/0'
      var.used = 0
      var.capacity = 0
      var.level = 1
      var.canUpgrade = false
      var.nextUpgradeText = none
      var.slotCount = 0
      var.pageSize = 0
      var.amount = 1
      var.passwordText = none
      var.categoryScrollRatio = 0
      var.switchScrollRatio = 0
      var.selectedBackpackSlot = -1
      var.lastBackpackClickSlot = none
      var.lastBackpackClickTime = 0
      var.lastSlotClickSlot = none
      var.lastSlotClickTime = 0
      var.emptyItemJson = '{"id": "minecraft:air","Count":1b}'
      var.maxPersonalCount = 0
      var.maxSharedCount = 0
      var.maxCategoryCount = 0
      var.刷新轮次 = 0
      var.renderBackpackAmounts = -> {
        if(val.背包网格 != none){
          for(raw in range(9,44)){
            control = raw == 9 ? val.背包网格['背包槽'] : val.背包网格['背包槽' + (raw - 9)]
            entry = var.backpack[raw.round()]
            if(control != none){
              amountText = none
              if(entry != none && !entry['empty']){
                amountText = '&f' + entry['amount']
              }
              amountControl = control['数量']
              if(amountControl != none){
                amountControl.texts = amountText
              }
            }
          }
        }
      }
    open: |-
      Packet.send(var.packetId, 'refresh')

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~stretch_all
        children:
          玻璃底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
            effect:
              ripple:

          顶栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 16
              width: 1872
              height: 96
            children:
              顶栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~48,52,60,215
                  shape: ~round_rect
                  radius: 18
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              仓库名:
                type: Text
                attribute:
                  point: ~top_left
                  x: 28
                  y: 8
                  width: 700
                  texts: "'&f' + var.warehouseName"
                  fontSize: 46
                  through: true
              仓库副标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 28
                  y: 56
                  width: 900
                  texts: "'&7Lv.' + var.level.round() + '  ' + var.capacityText + ' 格  ' + (var.readOnly ? '&c只读 ' + var.lockOwner : (var.unlocked ? '&a已解锁' : '&c未解锁'))"
                  fontSize: 28
                  through: true
              导航组:
                type: HStack
                attribute:
                  point: ~middle_right
                  x: -24
                  spaceBetween: 10
                  height: 56
                children:
                  只读:
                    type: Canvas
                    attribute:
                      visible: var.ownerType == 'shared'
                      width: 96
                      height: 56
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'shared_mode', 'readonly')
                    children:
                      只读底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "var.sharedEditMode ? '62,66,74,210' : '104,84,46,225'"
                          shape: ~round_rect
                          radius: 14
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '245,205,130,255' : (var.sharedEditMode ? '255,255,255,230' : '232,180,90,235')"
                      只读字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 96
                          texts: "~&f只读"
                          fontSize: 32
                          through: true
                  存取:
                    type: Canvas
                    attribute:
                      visible: var.ownerType == 'shared'
                      width: 96
                      height: 56
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'shared_mode', 'edit')
                    children:
                      存取底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "var.sharedEditMode && !var.readOnly ? '104,84,46,225' : (var.sharedCanEdit ? '62,66,74,210' : '150,58,58,225')"
                          shape: ~round_rect
                          radius: 14
                        effect:
                          stroke:
                            width: 3
