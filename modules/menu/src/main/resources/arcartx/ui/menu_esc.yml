# AXS Menu ESC UI — 替换暂停界面，仿原神派蒙菜单布局
# 布局结构（设计分辨率 1920x1080，面板固定 820 宽，贴屏幕左缘滑入，右侧留给第三人称角色展示）：
#   ┌ 玩家信息卡（圆形头像 / 昵称 / 等级+经验条 / 生命 / UID）
#   ├ 分区标题行（菜单标题，多页时显示页码翻页器）
#   ├ 左侧竖条圆形图标栏 = 页脚按钮（游戏选项 / 退出游戏 / 自定义）
#   └ 4 列方形图标磁贴网格 = 菜单按钮（图标或标签首字作字形，标签居中显示在磁贴下方）
# 数据流: 服务端 sendPacket(init/update) -> packetHandler -> var.* -> 模板复制渲染
# 客户端回包: Packet.send('AXS_MENU', 'click'/'footer', token, id) / page / esc_open
ui:
  isHud: false
  match:
    - 暂停界面
  hide:
    - HUD
    - online
    - 聊天栏
  itemSize: 16
  # 如果想打开图标物品的tooltip，需要设置为true
  through: false
  escClose: false
  background: false
  closeDied: false
  show: true
  jei: false
  level: 0
  screenScale: true
  defaultOpen: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 包标识符（'AXS_MENU'）
    #   - action_token: 写操作令牌（click / footer 回包必带）
    #   - menuId: 菜单唯一标识
    #   - title: 菜单标题文本
    #   - pageId: 当前页面 ID
    #   - pageTitle: 当前页面标题
    #   - pageIndex: 当前页索引（从 0 开始）
    #   - pageCount: 总页数
    #   - hasPrev / hasNext: 是否有上一页 / 下一页
    #   - buttonRows: 按钮数据行（字典，key 为索引；含 id/text/enabled/hasIcon/itemJson）
    #   - buttonCount: 按钮总数
    #   - footerRows: 页脚按钮数据行（额外含 clientAction）
    #   - footerCount: 页脚按钮总数
    #   - maxButtonCount: 按钮最大数量
    #   - maxFooterCount: 页脚按钮最大数量
    init: |-
      var.incoming = packet
      var.resetMenu = true
      self.actions['applyPacket']()
    # packetHandler: update
    # 包字段: 与 init 相同（全量刷新菜单数据）
    update: |-
      var.incoming = packet
      var.resetMenu = false
      self.actions['applyPacket']()
  action:
    load: |-
      var.menuUi = self
      var.packetId = 'AXS_MENU'
      var.closing = false
      var.buttonCount = 0
      var.footerCount = 0
      var.gridRows = 0
      var.pageCount = 1
      var.pageIndex = 0
      var.glyphs = {}
      var.footerGlyphs = {}
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.anim = Smooth(1, 0, 320)
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
    open: |-
      var.closing = false
      var.anim = Smooth(1, 0, 320)
      self.actions['applyCamera']()
      Packet.send(var.packetId, 'esc_open')
    tick: |-
      if(!var.closing && server.player_yaw != var.yaw){
        self.actions['applyCamera']()
      }
    applyCamera: |-
      var.yaw = server.player_yaw
      Camera.setState(1.2, -0.5, 2.5, 150, 0.0, 600)
      Camera.setThirdPerson(true)
    closeMenu: |-
      if(!var.closing){
        var.closing = true
        var.anim = Smooth(0, 1, 300)
        Camera.clearState()
        async {
          Thread.sleep(320)
          Camera.setThirdPerson(false)
          Screen.close()
        }
      }
    keyPress: |-
      if(self.currentKeyPress() == 'ESCAPE'){
        self.actions['closeMenu']()
      }
    close: |-
      async {
        Camera.setThirdPerson(false)
        Camera.clearState()
      }
    applyPacket: |-
      changedPage = var.resetMenu || var.menuId != var.incoming['menuId'] || var.pageId != var.incoming['pageId']
      var.packetId = var.incoming['packetId']
      var.actionToken = var.incoming['action_token']
      var.menuId = var.incoming['menuId']
      var.title = var.incoming['title']
      var.pageId = var.incoming['pageId']
      var.pageTitle = var.incoming['pageTitle']
      var.pageIndex = var.incoming['pageIndex']
      var.pageCount = var.incoming['pageCount']
      var.hasPrev = var.incoming['hasPrev']
      var.hasNext = var.incoming['hasNext']
      var.buttonRows = var.incoming['buttonRows']
      var.buttonCount = var.incoming['buttonCount']
      var.footerRows = var.incoming['footerRows']
      var.footerCount = var.incoming['footerCount']
      var.maxButtonCount = var.incoming['maxButtonCount']
      var.maxFooterCount = var.incoming['maxFooterCount']
      var.gridRows = math.ceil(var.buttonCount / 4)
      if(changedPage){
        val.grid_slider.setDragYRatio(0)
      }
      while(val.button_rows.childrenCount() > var.buttonCount && val.button_rows.childrenCount() > 1){
        val.button_rows.get((val.button_rows.childrenCount() - 1).round()).remove()
      }
      while(val.footer_rows.childrenCount() > var.footerCount && val.footer_rows.childrenCount() > 1){
        val.footer_rows.get((val.footer_rows.childrenCount() - 1).round()).remove()
      }
      if(var.buttonCount > val.button_rows.childrenCount()){
        for(i in range(val.button_rows.childrenCount(), var.buttonCount - 1)){
          mb = val.button_rows['菜单按钮'].copy('菜单按钮' + i.round())
          mb.entryKey = i.round()
        }
      }
      if(var.footerCount > val.footer_rows.childrenCount()){
        for(i in range(val.footer_rows.childrenCount(), var.footerCount - 1)){
          fb = val.footer_rows['页脚按钮'].copy('页脚按钮' + i.round())
          fb.entryKey = i.round()
        }
      }
      var.glyphs = {}
      var.footerGlyphs = {}
      if(var.buttonCount > 0){
        for(i in range(0, var.buttonCount - 1)){
          key = i.round()
          entry = var.buttonRows[key]
          mb = val.button_rows.get(key)
          if(entry['hasIcon']){
            mb['图标'].seticon()
          } else {
            mb['图标'].setItemIcon(var.air)
          }
          label = entry['text']
          while(label.length() >= 2 && (label.charAt(0) == '&' || label.charAt(0) == '§')){
            label = label.substring(2)
          }
          if(label.length() > 0){
            var.glyphs[key] = label.charAt(0)
          } else {
            var.glyphs[key] = '✦'
          }
        }
      }
      if(var.footerCount > 0){
        for(i in range(0, var.footerCount - 1)){
          key = i.round()
          entry = var.footerRows[key]
          fb = val.footer_rows.get(key)
          if(entry['hasIcon']){
            fb['图标'].seticon()
          } else {
            fb['图标'].setItemIcon(var.air)
          }
          label = entry['text']
          while(label.length() >= 2 && (label.charAt(0) == '&' || label.charAt(0) == '§')){
            label = label.substring(2)
          }
          if(label.length() > 0){
            var.footerGlyphs[key] = label.charAt(0)
          } else {
            var.footerGlyphs[key] = '✦'
          }
        }
      }
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      全屏画布:
        type: Canvas
        attribute:
          x: "-var.offX"
          width: "var.viewW"
          height: "var.viewH"
        children:
          菜单面板:
            type: Canvas
            attribute:
              x: "-820 * var.anim.get()"
              width: 820
              height: "var.viewH"
              alpha: "1 - var.anim.get()"
            children:
              面板磨砂底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~Frosted:28;16,20,28,205
              面板右缘:
                type: Texture
                attribute:
                  point: ~vertical_stretch_right
                  width: 1
                  normal: ~255,255,255,28
                  through: true
              玩家信息卡:
                type: Canvas
                attribute:
                  x: 40
                  y: 40
                  width: 740
                  height: 228
                children:
                  卡片底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,40,52,140
                      shape: ~round_rect
                      radius: 18
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: ~255,255,255,45
                  头像光环:
                    type: Texture
                    attribute:
                      x: 22
                      y: 22
                      width: 176
                      height: 176
                      normal: ~235,225,200,45
                      shape: ~circle
                      through: true
                  头像环:
                    type: Texture
                    attribute:
                      x: 30
                      y: 30
                      width: 160
                      height: 160
                      normal: ~30,34,44,255
                      shape: ~circle
                      through: true
                    effect:
                      stroke:
                        width: 3
                        color: ~240,232,210,220
                  头像:
                    type: Texture
                    attribute:
                      x: 38
                      y: 38
                      width: 144
                      height: 144
                      normal: "'PlayerSkin:' + Player.getUUID()"
                      shape: ~circle
                      through: true
                  昵称:
                    type: Text
                    attribute:
                      x: 222
                      y: 30
                      texts: "'&f' + Player.getName()"
                      fontSize: 64
                      limit: 16
                      through: true
                  昵称底线:
                    type: Texture
                    attribute:
                      x: 222
                      y: 76
                      width: 488
                      height: 1
                      normal: ~255,255,255,40
                      through: true
                  等级标签:
                    type: Text
                    attribute:
                      x: 222
                      y: 90
                      texts: ~&7等级
                      fontSize: 36
                      through: true
                  经验数值:
                    type: Text
                    attribute:
                      point: ~top_right
                      x: -116
                      y: 92
                      expValue: "server.player_exp * server.player_exp_to_level"
                      texts: "'&8' + self.expValue.round() + ' &7/ ' + server.player_exp_to_level"
                      fontSize: 36
                      through: true
                  经验条底:
                    type: Texture
                    attribute:
                      x: 316
                      y: 122
                      width: 310
                      height: 12
                      normal: ~255,255,255,35
                      shape: ~round_rect
                      radius: 6
                      through: true
                  经验条:
                    type: Progress
                    attribute:
                      x: 316
                      y: 122
                      width: 310
                      height: 12
                      texture: ~245,222,160,255
                      progress: "math.min(1, server.player_exp)"
                      time: 200
                      shape: ~round_rect
                      radius: 6
                      through: true
                  等级值:
                    type: Text
                    attribute:
                      point: ~top_right
                      x: -30
                      y: 84
                      texts: "'&f' + Player.getLevel().round()"
                      fontSize: 54
                      through: true
                  等级分隔线:
                    type: Texture
                    attribute:
                      x: 222
                      y: 142
                      width: 488
                      height: 1
                      normal: ~255,255,255,30
                      through: true
                  生命标签:
                    type: Text
                    attribute:
                      x: 222
                      y: 154
                      texts: ~&7生命
                      fontSize: 36
                      through: true
                  生命值:
                    type: Text
                    attribute:
                      point: ~top_right
                      x: -30
                      y: 150
                      texts: "'&f' + Player.getHealth().round() + ' &7/ ' + Player.getMaxHealth().round()"
                      fontSize: 48
                      through: true
                  生命分隔线:
                    type: Texture
                    attribute:
                      x: 222
                      y: 188
                      width: 488
                      height: 1
                      normal: ~255,255,255,30
                      through: true
                  UID标签:
                    type: Text
                    attribute:
                      x: 222
                      y: 200
                      texts: ~&7UID
                      fontSize: 36
                      through: true
                  UID值:
                    type: Text
                    attribute:
                      point: ~top_right
                      x: -30
                      y: 200
                      texts: "'&f' + Player.getUUID().substring(0, 8)"
                      fontSize: 36
                      through: true
              分区标题:
                type: Text
                attribute:
                  x: 40
                  y: 284
                  texts: "var.pageCount > 1 ? (var.title + ' &8/ ' + var.pageTitle) : var.title"
                  fontSize: 36
                  limit: 30
                  through: true
              分页器:
                type: Canvas
                attribute:
                  point: ~top_right
                  x: -40
                  y: 278
                  width: 190
                  height: 36
                  visible: var.pageCount > 1
                children:
                  上一页按钮:
                    type: Canvas
                    attribute:
                      width: 36
                      height: 36
                      enable: var.hasPrev
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'page', 'prev')
                    children:
                      上页底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~255,255,255,22
                          hover: ~255,255,255,70
                          shape: ~circle
                          through: true
                      上页文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: ~&f‹
                          fontSize: 48
                          alpha: "var.hasPrev ? 1 : 0.3"
                          through: true
                  页码:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f' + (var.pageIndex + 1).round() + ' &7/ ' + var.pageCount.round()"
                      fontSize: 36
                      through: true
                  下一页按钮:
                    type: Canvas
                    attribute:
                      point: ~top_right
                      width: 36
                      height: 36
                      enable: var.hasNext
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'page', 'next')
                    children:
                      下页底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~255,255,255,22
                          hover: ~255,255,255,70
                          shape: ~circle
                          through: true
                      下页文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: ~&f›
                          fontSize: 48
                          alpha: "var.hasNext ? 1 : 0.3"
                          through: true
              侧栏:
                type: Canvas
                attribute:
                  x: 40
                  y: 330
                  width: 96
                  height: "var.viewH - 370"
                children:
                  侧栏底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~18,22,30,190
                      shape: ~round_rect
                      radius: 24
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: ~255,255,255,35
                  页脚列表:
                    type: VStack
                    val: footer_rows
                    attribute:
                      x: 0
                      y: 14
                      width: 96
                      spaceBetween: 6
                      maxSize: "var.footerCount + 1"
                    children:
                      页脚按钮:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.footerRows[self.entryKey]
                          visible: self.entry != none
                          width: 96
                          height: 104
                        action:
                          clickLeft: |-
                            if(self.entry != none && self.entry['enabled']){
                              if(self.entry['clientAction'] == 'options'){
                                Game.options()
                              } elif(self.entry['clientAction'] == 'quit'){
                                Game.quit()
                              } elif(var.actionToken != none){
                                Packet.send(var.packetId, 'footer', var.actionToken, self.entry['id'])
                              }
                            }
                        children:
                          圆底:
                            type: Texture
                            attribute:
                              x: 18
                              y: 6
                              width: 60
                              height: 60
                              normal: "self.parent.entry['enabled'] ? '255,255,255,30' : '255,255,255,12'"
                              hover: "self.parent.entry['enabled'] ? '255,255,255,80' : '255,255,255,12'"
                              shape: ~circle
                              through: true
                            effect:
                              stroke:
                                width: 2
                                color: "self.isHovered() ? '240,230,205,230' : '255,255,255,70'"
                              ripple:
                                duration: 600
                                color: ~255,255,255,80
                                width: 0.08
                          图标:
                            type: Slot
                            attribute:
                              slotType: ~Icon
                              x: 28
                              y: 16
                              width: 40
                              height: 40
                              itemScale: 0.62
                              normal: ~0,0,0,0
                              visible: self.parent.entry['hasIcon']
                              alpha: "self.parent.entry['enabled'] ? 1 : 0.45"
                              through: true
                              seticon: "self.setItemIcon(self.parent.entry['itemJson'])"
                          字形:
                            type: Text
                            attribute:
                              x: 48
                              y: 24
                              center: true
                              texts: "'&f' + var.footerGlyphs[self.parent.entryKey]"
                              visible: "!self.parent.entry['hasIcon']"
                              fontSize: 48
                              alpha: "self.parent.entry['enabled'] ? 1 : 0.45"
                              through: true
                          标签:
                            type: Text
                            attribute:
                              x: 48
                              y: 74
                              center: true
                              texts: self.parent.entry['text']
                              fontSize: 36
                              limit: 4
                              alpha: "self.parent.entry['enabled'] ? 1 : 0.45"
                              through: true
              网格滚动区:
                type: Scroll
                attribute:
                  x: 160
                  y: 330
                  width: 620
                  height: "var.viewH - 370"
                  moveY: val.grid_slider.getDragYRatio()
                action:
                  wheel: |-
                    ratio = self.moveY - self.wheelValue * 0.12
                    if(ratio < 0){ ratio = 0 }
                    if(ratio > 1){ ratio = 1 }
                    val.grid_slider.setDragYRatio(ratio)
                children:
                  按钮网格:
                    type: HGrid
                    val: button_rows
                    attribute:
                      x: 10
                      y: 4
                      column: 4
                      spaceBetweenX: 40
                      spaceBetweenY: 24
                    children:
                      菜单按钮:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.buttonRows[self.entryKey]
                          visible: self.entry != none
                          width: 120
                          height: 164
                        action:
                          clickLeft: |-
                            if(self.entry != none && self.entry['enabled'] && var.actionToken != none){
                              Packet.send(var.packetId, 'click', var.actionToken, self.entry['id'])
                            }
                        children:
                          图标底:
                            type: Texture
                            attribute:
                              x: 0
                              y: 0
                              width: 120
                              height: 120
                              normal: "self.parent.entry['enabled'] ? '46,50,60,190' : '30,32,38,120'"
                              hover: "self.parent.entry['enabled'] ? '74,80,94,230' : '30,32,38,120'"
                              shape: ~round_rect
                              radius: 16
                              through: true
                            effect:
                              stroke:
                                width: 2
                                color: "self.isHovered() ? '240,230,205,230' : '255,255,255,45'"
                              ripple:
                                duration: 600
                                color: ~255,255,255,70
                                width: 0.08
                          图标:
                            type: Slot
                            attribute:
                              slotType: ~Icon
                              x: 22
                              y: 22
                              width: 76
                              height: 76
                              itemScale: 1.18
                              normal: ~0,0,0,0
                              visible: self.parent.entry['hasIcon']
                              alpha: "self.parent.entry['enabled'] ? 1 : 0.45"
                              through: true
                              seticon: "self.setItemIcon(self.parent.entry['itemJson'])"
                          字形:
                            type: Text
                            attribute:
                              x: 60
                              y: 42
                              center: true
                              texts: "'&f' + var.glyphs[self.parent.entryKey]"
                              visible: "!self.parent.entry['hasIcon']"
                              fontSize: 72
                              alpha: "self.parent.entry['enabled'] ? 1 : 0.45"
                              through: true
                          标签:
                            type: Text
                            attribute:
                              x: 60
                              y: 132
                              center: true
                              texts: self.parent.entry['text']
                              fontSize: 36
                              limit: 6
                              alpha: "self.parent.entry['enabled'] ? 1 : 0.5"
                              through: true
              网格滑轨:
                type: Texture
                attribute:
                  x: 794
                  y: 330
                  width: 3
                  height: "var.viewH - 370"
                  normal: ~255,255,255,20
                  visible: "var.gridRows * 188 - 20 > var.viewH - 370"
                  through: true
              网格滑块:
                type: Texture
                val: grid_slider
                attribute:
                  x: 791
                  y: 330
                  width: 9
                  height: 72
                  maxDragY: "var.viewH - 442"
                  normal: ~200,190,165,190
                  hover: ~245,225,170,255
                  shape: ~round_rect
                  radius: 4
                  visible: "var.gridRows * 188 - 20 > var.viewH - 370"
              空提示:
                type: Text
                attribute:
                  x: 470
                  y: 450
                  center: true
                  texts: ~&7这里暂时没有可用功能
                  fontSize: 48
                  visible: var.buttonCount <= 0
                  through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -40
              y: 40
              width: 64
              height: 64
              alpha: "1 - var.anim.get()"
            action:
              clickLeft: |-
                var.menuUi.actions['closeMenu']()
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~18,22,30,180
                  hover: ~64,70,84,235
                  shape: ~circle
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,120
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f✕
                  fontSize: 48
                  through: true
