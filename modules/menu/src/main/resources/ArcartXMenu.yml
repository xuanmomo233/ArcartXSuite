config-version: 2
# AXS Menu — 通用 ArcartX 菜单系统（类 TrMenu 配置驱动）
# 作用: 通过 menus/ 目录下的 YAML 定义多页菜单、按钮动作、打开条件与命令绑定。
# 依赖: ArcartX；PlaceholderAPI 可选（条件表达式）。
# 重载: /axs menu reload
# 玩家命令: /menu open <菜单ID> | /menu list
# 关联资源: ui/menu_panel.yml, ui/menu_esc.yml

debug:
  enabled: false  # 是否输出调试日志

ui:
  panel-ui-id: "AXS:menu_panel"  # 面板布局 UI 的 ID
  esc-ui-id: "AXS:menu_esc"  # ESC 布局 UI 的 ID
  packet-id: "AXS_MENU"  # 客户端通信包标识符
  register-ui-on-enable: true  # 启动时是否自动注册 UI
  overwrite-ui-files: false  # 是否强制覆盖用户已修改的 UI 文件

client:
  # ESC 暂停界面绑定的默认菜单 ID（layout: esc 的菜单定义）
  esc-menu-id: "esc_main"

settings:
  menus-directory: "menus"  # 菜单定义文件目录（相对模块数据目录）
  default-layout: "panel"  # 默认布局模式（panel / esc / full）
  columns: 2  # 默认每行按钮列数
  buttons-per-page: 12  # 每页最大按钮数量
  click-cooldown-ms: 300  # 按钮点击冷却时间（毫秒）
  close-on-action: true  # 点击按钮执行动作后是否自动关闭菜单
  # 打开菜单失败时是否向玩家发送提示
  notify-open-failed: true
  # 全局物品绑定（跨菜单）
  item-binds:
    - menu: example  # 绑定的目标菜单 ID
      material: NETHER_STAR  # 触发物品的材质
      name-contains: "服务器菜单"  # 物品名称包含的关键词
      action: RIGHT_CLICK  # 触发动作（RIGHT_CLICK / LEFT_CLICK 等）

