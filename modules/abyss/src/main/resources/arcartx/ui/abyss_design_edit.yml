# AXS 资源说明
# 用途: Abyss 远征制图台对象工作页——左侧参数校准，右侧脚本序列
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
#
# 通讯协议:
#   服务端 → init/update: packetId/action_token/objKey/objId/kindLabel/kindIcon/
#     summary/dirty/fieldRows{idx:{name,editor,label,value,valueZh,options}}/fieldCount/
#     groupRows{idx:{field,label,lines{idx},lineCount}}/groupCount
#   客户端 → Packet.send('abyss', ...):
#     design_set <objKey> <field> <value> <token>   design_cycle <objKey> <field> <token>
#     design_remark <objKey> <field> <token>        design_rename <objKey> <newId> <token>
#     design_line_add/set/del <objKey> <field> [idx] [text] <token>
#     design_back <token>                           返回主面板
#
# 实现要点（§15.5）: copy 后立即访问子控件不可靠 → 输入框不 setContent 预填，
# emptyText 表达式绑 entry 显示当前值；行/组重建走引用字典 + 轮次名；
# 编辑态 var.editField 按字段名匹配组卡。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.objKey = packet['objKey']
      var.objId = packet['objId']
      var.kindLabel = packet['kindLabel']
      var.icon = packet['kindIcon']
      var.summary = packet['summary']
      var.dirty = packet['dirty']
      var.fieldRows = packet['fieldRows']
      var.fieldCount = packet['fieldCount']
      var.groupRows = packet['groupRows']
      var.groupCount = packet['groupCount']
      var.editField = ''
      var.editI = -1
      // ── 字段行重建（数量变化才重建，引用字典删旧）──
      字段目标数 = var.fieldCount.round()
      if(val.字段容器.childrenCount() - 1 != 字段目标数 - 1){
        for(key in var.字段引用.keys()){
          var.字段引用[key].remove()
        }
        var.字段引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.字段容器.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 字段目标数 - 1)){
          e = 模板.copy('字段行_' + var.轮次 + '_' + i.round())
          e.entryKey = i.round()
          var.字段引用[i.round()] = e
        }
      }
      // ── 组卡重建 ──
      组目标数 = var.groupCount.round()
      if(val.组容器.childrenCount() - 1 != 组目标数 - 1){
        for(key in var.组引用.keys()){
          var.组引用[key].remove()
        }
        var.组引用 = {}
        var.行引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.组容器.get(0)
        模板.entryKey = 0.round()
        for(gi in range(1, 组目标数 - 1)){
          e = 模板.copy('组卡_' + var.轮次 + '_' + gi.round())
          e.entryKey = gi.round()
          var.组引用[gi.round()] = e
        }
      }
      // ── 各组行重建（模板组走 get(0)，副本走引用字典）──
      for(gi in range(0, 组目标数 - 1)){
        gObj = var.groupRows[gi.round()]
        gCtl = gi == 0 ? val.组容器.get(0) : var.组引用[gi.round()]
        行目标数 = gObj['lineCount'].round()
        if(gCtl != none){
          if(var.行引用[gi.round()] == none){
            var.行引用[gi.round()] = {}
          }
          for(key in var.行引用[gi.round()].keys()){
            var.行引用[gi.round()][key].remove()
          }
          var.行引用[gi.round()] = {}
          行容器 = gCtl.get(2)
          行模板 = 行容器.get(0)
          行模板.entryKey = 0.round()
          for(li in range(1, 行目标数 - 1)){
            le = 行模板.copy('行_' + var.轮次 + '_' + gi.round() + '_' + li.round())
            le.entryKey = li.round()
            var.行引用[gi.round()][li.round()] = le
          }
        }
      }
    update: |-
      var.objId = packet['objId']
      var.summary = packet['summary']
      var.dirty = packet['dirty']
      var.fieldRows = packet['fieldRows']
      var.fieldCount = packet['fieldCount']
      var.groupRows = packet['groupRows']
      var.groupCount = packet['groupCount']
      var.editField = ''
      var.editI = -1
      // ── 字段行重建（数量变化才重建，引用字典删旧）──
      字段目标数 = var.fieldCount.round()
      if(val.字段容器.childrenCount() - 1 != 字段目标数 - 1){
        for(key in var.字段引用.keys()){
          var.字段引用[key].remove()
        }
        var.字段引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.字段容器.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 字段目标数 - 1)){
          e = 模板.copy('字段行_' + var.轮次 + '_' + i.round())
          e.entryKey = i.round()
          var.字段引用[i.round()] = e
        }
      }
      // ── 组卡重建 ──
      组目标数 = var.groupCount.round()
      if(val.组容器.childrenCount() - 1 != 组目标数 - 1){
        for(key in var.组引用.keys()){
          var.组引用[key].remove()
        }
        var.组引用 = {}
        var.行引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.组容器.get(0)
        模板.entryKey = 0.round()
        for(gi in range(1, 组目标数 - 1)){
          e = 模板.copy('组卡_' + var.轮次 + '_' + gi.round())
          e.entryKey = gi.round()
          var.组引用[gi.round()] = e
        }
      }
      // ── 各组行重建（模板组走 get(0)，副本走引用字典）──
      for(gi in range(0, 组目标数 - 1)){
        gObj = var.groupRows[gi.round()]
        gCtl = gi == 0 ? val.组容器.get(0) : var.组引用[gi.round()]
        行目标数 = gObj['lineCount'].round()
        if(gCtl != none){
          if(var.行引用[gi.round()] == none){
            var.行引用[gi.round()] = {}
          }
          for(key in var.行引用[gi.round()].keys()){
            var.行引用[gi.round()][key].remove()
          }
          var.行引用[gi.round()] = {}
          行容器 = gCtl.get(2)
          行模板 = 行容器.get(0)
          行模板.entryKey = 0.round()
          for(li in range(1, 行目标数 - 1)){
            le = 行模板.copy('行_' + var.轮次 + '_' + gi.round() + '_' + li.round())
            le.entryKey = li.round()
            var.行引用[gi.round()][li.round()] = le
          }
        }
      }
  action:
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.colW = (var.viewW - 160) / 2
      var.packetId = 'abyss'
      var.editI = -1
      var.editField = ''
      var.字段引用 = {}
      var.组引用 = {}
      var.行引用 = {}
      var.轮次 = 0
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.colW = (var.viewW - 160) / 2
    open: |-
      Sound.self('minecraft:block.note_block.pling', 0.8, 8)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;8,9,10,238
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ═══ 顶栏 ═══
      顶栏底:
        type: Texture
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 108
          normal: ~15,17,18,250
          through: true
      返回钮:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 27
          width: 150
          height: 52
        action:
          clickLeft: "Packet.send(var.packetId, 'design_back', var.actionToken)"
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~48,54,52,245
              shape: ~round_rect
              radius: 9
              through: true
            effect:
              stroke:
                width: 1
                color: "self.parent.isHovered() ? '255,255,255,200' : '255,255,255,60'"
          字:
            type: Text
            attribute:
              point: ~middle_center
              texts: ~&f‹  路线图
              fontSize: 36
              through: true
      标题:
        type: Text
        attribute:
          point: ~top_left
          x: "224 - var.offX"
          y: 14
          texts: "'&6对象校准  &8/  ' + var.icon + ' &f' + var.objId"
          fontSize: 54
          limit: 30
          through: true
      摘要:
        type: Text
        attribute:
          point: ~top_left
          x: "226 - var.offX"
          y: 72
          texts: "'&7' + var.kindLabel + '  &8/  &7' + var.summary"
          fontSize: 36
          limit: 70
          through: true
      未保存标:
        type: Text
        attribute:
          point: ~top_right
          x: "-60 + var.offX"
          y: 30
          texts: ~&c● 未归档
          fontSize: 36
          visible: var.dirty
          through: true
      # ═══ 左栏：参数校准台 ═══
      左栏底:
        type: Texture
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 130
          width: "var.colW"
          height: "var.viewH - 154"
          normal: ~17,19,20,246
          shape: ~round_rect
          radius: 14
          through: true
        effect:
          stroke:
            width: 1
            color: ~108,91,73,170
      左栏题:
        type: Text
        attribute:
          point: ~top_left
          x: "72 - var.offX"
          y: 150
          texts: ~&6I  /  参数与标定
          fontSize: 48
          through: true
      左栏说明:
        type: Text
        attribute:
          point: ~top_left
          x: "74 - var.offX"
          y: 204
          texts: ~&7编辑基础数值 · 坐标 / 区域需在世界中重新标记
          fontSize: 36
          through: true
      改名壳:
        type: Canvas
        attribute:
          point: ~top_left
          x: "72 - var.offX"
          y: 252
          width: "var.colW - 40"
          height: 54
        children:
          改名标:
            type: Text
            attribute:
              point: ~middle_left
              texts: ~&6ID
              fontSize: 36
              through: true
          框:
            type: Canvas
            attribute:
              point: ~middle_left
              x: 64
              width: "var.colW - 104"
              height: 48
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~11,13,14,250
                  shape: ~round_rect
                  radius: 7
                  through: true
              输入框:
                type: TextBox
                attribute:
                  x: 12
                  y: 7
                  width: "var.colW - 128"
                  height: 34
                  length: 48
                  fontSize: 36
                  emptyText: ~&7输入新标识并回车应用
                action:
                  enter: "Packet.send(var.packetId, 'design_rename', var.objKey, self.getContent(), var.actionToken); self.setContent('')"
      左滑轨:
        type: Texture
        attribute:
          point: ~top_left
          x: "24 - var.offX + var.colW"
          y: 322
          width: 8
          height: "var.viewH - 368"
          normal: ~44,46,42,245
          through: true
      左滑块:
        type: Texture
        val: 左滑块
        attribute:
          point: ~top_left
          x: "24 - var.offX + var.colW"
          y: 322
          width: 8
          height: 96
          normal: ~194,139,65,255
          maxDragY: "var.viewH - 464"
          shape: ~round_rect
          radius: 4
      左滚动:
        type: Scroll
        attribute:
          point: ~top_left
          x: "72 - var.offX"
          y: 316
          width: "var.colW - 56"
          height: "var.viewH - 362"
          moveY: "self.parent['左滑块'].getDragYRatio()"
        action:
          wheel: |-
            if(self.moveY >= 0 && self.wheelValue > 0){
              self.parent['左滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
            if(self.moveY <= 1 && self.wheelValue < 0){
              self.parent['左滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
        children:
          字段容器:
            type: VStack
            val: 字段容器
            attribute:
              width: "var.colW - 56"
              spaceBetween: 12
            children:
              字段行:
                type: Canvas
                attribute:
                  width: "var.colW - 56"
                  height: 72
                  entryKey: 0.round()
                  entry: "var.fieldRows[self.entryKey]"
                  visible: "self.entry != none"
                children:
                  行底:
                    type: Texture
                    attribute:
                      x: 2
                      y: 2
                      width: "self.parent.width - 4"
                      height: "self.parent.height - 4"
                      normal: ~28,31,30,240
                      shape: ~round_rect
                      radius: 8
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: "self.parent.isHovered() ? '208,149,73,220' : '94,91,77,125'"
                  标签:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 22
                      texts: "'&f' + self.parent.entry['label']"
                      fontSize: 36
                      limit: 11
                      through: true
                  # ── TEXT/NUMBER：输入框，emptyText 显示当前值 ──
                  输入壳:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -18
                      width: "var.colW - 320"
                      height: 48
                      visible: "self.parent.entry['editor'] == 'TEXT' || self.parent.entry['editor'] == 'NUMBER'"
                    children:
                      框底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~11,13,14,250
                          shape: ~round_rect
                          radius: 7
                          through: true
                      输入框:
                        type: TextBox
                        attribute:
                          x: 12
                          y: 8
                          width: "var.colW - 344"
                          height: 34
                          length: 96
                          fontSize: 36
                          emptyText: "'&f' + self.parent.parent.entry['valueZh'] + ' &8(回车修改)'"
                        action:
                          enter: "Packet.send(var.packetId, 'design_set', var.objKey, self.parent.parent.entry['name'], self.getContent(), var.actionToken); self.setContent('')"
                  # ── TOGGLE：开关钮 ──
                  开关钮:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -18
                      width: 130
                      height: 48
                      visible: "self.parent.entry['editor'] == 'TOGGLE'"
                    action:
                      clickLeft: "Packet.send(var.packetId, 'design_set', var.objKey, self.parent.entry['name'], self.parent.entry['value'] == 'true' ? 'false' : 'true', var.actionToken)"
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: "self.parent.parent.entry['value'] == 'true' ? '104,84,45,245' : '54,57,53,245'"
                          shape: ~round_rect
                          radius: 8
                          through: true
                        effect:
                          stroke:
                            width: 1
                            color: "self.parent.isHovered() ? '255,255,255,200' : '255,255,255,50'"
                      字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "self.parent.parent.entry['valueZh']"
                          fontSize: 36
                          through: true
                  # ── CYCLE：循环钮 ──
                  循环钮:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -18
                      width: "var.colW - 320"
                      height: 48
                      visible: "self.parent.entry['editor'] == 'CYCLE'"
                    action:
                      clickLeft: "Packet.send(var.packetId, 'design_cycle', var.objKey, self.parent.entry['name'], var.actionToken)"
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~11,13,14,250
                          shape: ~round_rect
                          radius: 7
                          through: true
                        effect:
                          stroke:
                            width: 1
                            color: "self.parent.isHovered() ? '245,205,130,200' : '255,255,255,45'"
                      字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 12
                          texts: "'&e' + self.parent.parent.entry['valueZh'] + '  &8▸'"
                          fontSize: 36
                          limit: 24
                          through: true
                  # ── COORD/REGION：值 + 重标 ──
                  坐标钮:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -18
                      width: "var.colW - 320"
                      height: 48
                      visible: "self.parent.entry['editor'] == 'COORD' || self.parent.entry['editor'] == 'REGION'"
                    action:
                      clickLeft: "Packet.send(var.packetId, 'design_remark', var.objKey, self.parent.entry['name'], var.actionToken)"
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~11,13,14,250
                          shape: ~round_rect
                          radius: 7
                          through: true
                        effect:
                          stroke:
                            width: 1
                            color: "self.parent.isHovered() ? '245,205,130,200' : '255,255,255,45'"
                      值:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 12
                          texts: "'&6' + self.parent.parent.entry['value'] + '  &7[重新标记]'"
                          fontSize: 36
                          limit: 22
                          through: true
      # ═══ 右栏：事件脚本序列 ═══
      右栏底:
        type: Texture
        attribute:
          point: ~top_left
          x: "108 - var.offX + var.colW"
          y: 130
          width: "var.colW"
          height: "var.viewH - 154"
          normal: ~17,19,20,246
          shape: ~round_rect
          radius: 14
          through: true
        effect:
          stroke:
            width: 1
            color: ~108,91,73,170
      右栏题:
        type: Text
        attribute:
          point: ~top_left
          x: "132 - var.offX + var.colW"
          y: 150
          texts: ~&6II  /  事件序列
          fontSize: 48
          through: true
      右栏说明:
        type: Text
        attribute:
          point: ~top_left
          x: "134 - var.offX + var.colW"
          y: 204
          texts: ~&7按顺序编排脚本行 · 点击「改」载入原行
          fontSize: 36
          through: true
      右滑轨:
        type: Texture
        attribute:
          point: ~top_right
          x: "-68 + var.offX"
          y: 258
          width: 8
          height: "var.viewH - 304"
          normal: ~44,46,42,245
          through: true
      右滑块:
        type: Texture
        val: 右滑块
        attribute:
          point: ~top_right
          x: "-68 + var.offX"
          y: 258
          width: 8
          height: 96
          normal: ~194,139,65,255
          maxDragY: "var.viewH - 400"
          shape: ~round_rect
          radius: 4
      右滚动:
        type: Scroll
        attribute:
          point: ~top_left
          x: "132 - var.offX + var.colW"
          y: 252
          width: "var.colW - 56"
          height: "var.viewH - 298"
          moveY: "self.parent['右滑块'].getDragYRatio()"
        action:
          wheel: |-
            if(self.moveY >= 0 && self.wheelValue > 0){
              self.parent['右滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
            if(self.moveY <= 1 && self.wheelValue < 0){
              self.parent['右滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
        children:
          组容器:
            type: VStack
            val: 组容器
            attribute:
              width: "var.colW - 56"
              spaceBetween: 18
            children:
              组卡:
                type: Canvas
                attribute:
                  width: "var.colW - 56"
                  height: "self.entry['lineCount'] * 62 + 172"
                  entryKey: 0.round()
                  entry: "var.groupRows[self.entryKey]"
                  visible: "self.entry != none"
                children:
                  卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~28,31,30,240
                      shape: ~round_rect
                      radius: 10
                      through: true
                  组题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 22
                      y: 18
                      texts: "'&6' + self.parent.entry['label'] + '  &7/  ' + self.parent.entry['lineCount'] + ' 行'"
                      fontSize: 48
                      through: true
                  行容器:
                    type: VStack
                    attribute:
                      point: ~top_left
                      x: 18
                      y: 86
                      width: "var.colW - 96"
                      spaceBetween: 8
                    children:
                      行:
                        type: Canvas
                        attribute:
                          width: "var.colW - 96"
                          height: 54
                          entryKey: 0.round()
                          entry: "self.parent.parent.entry['lines'][self.entryKey]"
                          visible: "self.entry != none"
                        children:
                          行底:
                            type: Texture
                            attribute:
                              x: 1
                              y: 1
                              width: "self.parent.width - 2"
                              height: "self.parent.height - 2"
                              normal: ~11,13,14,245
                              shape: ~round_rect
                              radius: 6
                              through: true
                            effect:
                              stroke:
                                width: 1
                                color: "self.parent.isHovered() ? '245,205,130,180' : '255,255,255,30'"
                          行号:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 12
                              texts: "'&6' + (self.parent.entryKey + 1).round()"
                              fontSize: 36
                              through: true
                          文:
                            type: Text
                            attribute:
