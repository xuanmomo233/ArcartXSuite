# AXS 钓鱼天赋树界面
# 打开方式: /fishing talents 或主界面导航跳转
# 数据交互: packetHandler init/update (AXS_FISHING_TALENTS)
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航（总览/图鉴/奖励/天赋/任务）+ 内容区
#       内容区 = 天赋树标签栏（稳健/迅捷/威压/专注/幸运）+ 天赋节点滚动列表
# 视觉规范:
#   全屏玻璃 Frosted:24;12,22,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片底 26,34,46,210  卡片描边 50,160,190,180
#   主色（青蓝）50,170,200  已点亮 124,196,142  悬停高亮 80,200,220
#
# Java 端 pushTalentsData 发送字段:
#   packetId, seasonId, level, talentPoints, unspentTalentPoints,
#   unlockedTalents (List<String>),
#   trees (Map<treeId, {id, displayName, description, nodeCount,
#     nodes: Map<idx, {id, name, description, tier, unlocked, canUnlock, effects}>}>)
#
# 客户端回包:
#   Packet.send(packetId, 'unlock_talent', nodeId)  — 点亮指定节点
#   Packet.send(packetId, 'reset_talents')          — 重置天赋树

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = [] }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.currentTree = 'steady'
      var.needRebuild = true
    update: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = [] }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.needRebuild = true
  action:
    # load: 初始化变量 + 视口换算（Adaptive 以 1920x1080 等比缩放）
    load: |-
      var.packetId = 'AXS_FISHING_TALENTS'
      var.seasonId = ''
      var.playerLevel = 1
      var.talentPoints = 0
      var.unspentTalentPoints = 0
      var.unlockedTalents = []
      var.trees = {}
      var.currentTree = 'steady'
      var.needRebuild = false
      // 天赋树名称映射（避免 texts 属性使用嵌套三元——客户端 ARIA 对嵌套三元解析异常会显示 "true"）
      var.treeNames = {}
      var.treeNames['steady'] = '&b稳健天赋树 &7绿条稳定性与高度'
      var.treeNames['swift'] = '&b迅捷天赋树 &7降低鱼速与活跃度'
      var.treeNames['pressure'] = '&b威压天赋树 &7压制鱼逃离行为'
      var.treeNames['focus'] = '&b专注天赋树 &7进度获取与维持'
      var.treeNames['lucky'] = '&b幸运天赋树 &7经验售价与稀有鱼'
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    # open: 界面打开后主动请求服务端推送数据
    open: |-
      Packet.send(var.packetId, 'refresh_talents')
    # resize: 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    # tick: 每帧检查是否需要重建节点列表（树切换或数据更新时触发）
    tick: |-
      if(var.needRebuild){
        var.needRebuild = false
        while(val.天赋节点列表.childrenCount() > 1){
          val.天赋节点列表.get(1).remove()
        }
        treeData = var.trees[var.currentTree]
        if(treeData != none){
          nodes = treeData['nodes']
          nodeCount = treeData['nodeCount']
          if(nodeCount == none){ nodeCount = 0 }
          for(i in range(1, nodeCount - 1)){
            key = i.round()
            e = val.天赋节点列表['天赋节点项'].copy('天赋节点项' + key)
            e.entryKey = key
          }
        }
      }

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;12,22,38,110
  # 自适配布局：宽高 = 设计分辨率 1920x1080
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~50,160,190,120
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~50,170,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f钓鱼"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 168
              width: 1
              height: 30
              normal: ~50,160,190,120
          页名:
            type: Text
            attribute:
              point: ~middle_left
              x: 188
              texts: "~&f天赋"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 40
                  texts: "~&f✕"
                  fontSize: 32
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~50,160,190,180
          导航总览:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_main')
            children:
              总览底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              总览文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f总览"
                  fontSize: 36
                  through: true
          导航图鉴:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_collection')
            children:
              图鉴底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              图鉴文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f图鉴"
                  fontSize: 36
                  through: true
          导航奖励:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_rewards')
            children:
              奖励底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              奖励文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f奖励"
                  fontSize: 36
                  through: true
          # 当前页：天赋
          导航天赋:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
            children:
              天赋底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~50,170,200,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~50,170,200,230
              天赋高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~50,170,200,255
                  shape: ~round_rect
                  radius: 2
              天赋文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0天赋"
                  fontSize: 36
          导航任务:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 282
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_tasks')
            children:
              任务底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              任务文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f任务"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 364
              width: 264
              height: 2
              normal: ~50,160,190,80
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -84
              texts: "~&fESC 关闭界面"
              fontSize: 28
          # 重置天赋按钮（导航底部）
          重置天赋按钮:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 14
              y: -18
              width: 272
              height: 52
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'reset_talents')
            children:
              重置底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              重置文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 272
                  texts: "~&f↻ 重置天赋树"
                  fontSize: 30
                  through: true

      # ── 内容区（天赋）──────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~50,160,190,180

          # 天赋树标签栏：稳健/迅捷/威压/专注/幸运
          标签栏:
            type: HStack
            attribute:
              point: ~top_left
              x: 24
              y: 20
              spaceBetween: 12
            children:
              标签_稳健:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTree == 'steady' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTree == 'steady' ? '&f稳健' : '&7稳健'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTree = 'steady'
                    var.needRebuild = true
              标签_迅捷:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTree == 'swift' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTree == 'swift' ? '&f迅捷' : '&7迅捷'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTree = 'swift'
                    var.needRebuild = true
              标签_威压:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTree == 'pressure' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTree == 'pressure' ? '&f威压' : '&7威压'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTree = 'pressure'
                    var.needRebuild = true
              标签_专注:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTree == 'focus' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTree == 'focus' ? '&f专注' : '&7专注'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTree = 'focus'
                    var.needRebuild = true
              标签_幸运:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTree == 'lucky' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTree == 'lucky' ? '&f幸运' : '&7幸运'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTree = 'lucky'
                    var.needRebuild = true

          # 信息栏：当前天赋树名称 + 可用天赋点
          信息栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 86
              width: "var.contentW - 48"
              height: 60
            children:
              信息背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 2
                    color: ~50,160,190,120
              树名称:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 24
                  width: 600
                  texts: "var.treeNames[var.currentTree] != none ? var.treeNames[var.currentTree] : '&7未知天赋树'"
                  fontSize: 30
              天赋点显示:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -24
                  width: 400
                  texts: "'&a可用天赋点: &f' + var.unspentTalentPoints.round() + ' / ' + var.talentPoints.round()"
                  fontSize: 28

          # 滚动区：天赋节点列表
          滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 158
              width: "var.contentW - 48"
              height: "var.viewH - 326"
            children:
              天赋节点列表:
                val: 天赋节点列表
                type: VStack
                attribute:
                  width: "var.contentW - 48"
                  spaceBetween: 12
                children:
                  # 天赋节点项模板（索引0，自身充当第 0 个节点）
                  # visible 用 entry 条件表达式：数据到达后模板与 copy 副本都会显示
                  # （不能写死 visible: false，否则 copy 继承不可见导致整页空白）
                  # tick 中通过 copy 动态生成，entryKey 绑定 nodes 字典的 key
                  天赋节点项:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: "var.trees[var.currentTree] != none ? var.trees[var.currentTree]['nodes'][self.entryKey] : none"
                      visible: "self.entry != none"
                      width: "var.contentW - 48"
                      height: 110
                    action:
                      clickLeft: |-
                        if(self.entry != none){
                          if(self.entry['canUnlock'] == true && self.entry['unlocked'] != true){
                            Packet.send(var.packetId, 'unlock_talent', self.entry['id'])
                          }
                        }
                    children:
                      节点底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.parent.entry != none ? (self.parent.entry['unlocked'] == true ? '124,196,142,210' : self.parent.entry['canUnlock'] == true ? '50,170,200,210' : '26,34,46,210') : '26,34,46,210'"
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.parent.entry != none ? (self.parent.entry['unlocked'] == true ? '124,196,142,230' : self.parent.entry['canUnlock'] == true ? '50,170,200,230' : '50,160,190,120') : '50,160,190,120'"
                      层级标记:
                        type: Texture
                        attribute:
                          point: ~middle_left
                          x: 16
                          width: 6
                          height: 80
                          normal: "self.parent.entry != none ? (self.parent.entry['unlocked'] == true ? '124,196,142,255' : self.parent.entry['canUnlock'] == true ? '50,170,200,255' : '50,160,190,160') : '50,160,190,160'"
                          shape: ~round_rect
                          radius: 3
                          through: true
                      节点名:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 36
                          y: 12
                          width: "var.contentW - 96"
                          height: 30
                          texts: "self.parent.entry != none ? '&f' + self.parent.entry['name'] : none"
                          fontSize: 28
                          limit: 24
                          through: true
                      节点描述:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 36
                          y: 44
                          width: "var.contentW - 96"
                          height: 26
                          texts: "self.parent.entry != none ? '&7' + self.parent.entry['description'] : none"
                          fontSize: 22
                          limit: 32
                          through: true
                      节点状态:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 36
                          y: 76
                          width: "var.contentW - 96"
                          height: 24
                          texts: "self.parent.entry != none ? (self.parent.entry['unlocked'] == true ? '&a✔ 已点亮' : self.parent.entry['canUnlock'] == true ? '&e点击点亮' : '&c不可点亮') : none"
                          fontSize: 20
                          through: true
                      层数标签:
                        type: Texture
                        attribute:
                          point: ~top_right
                          x: -16
                          y: 12
                          width: 60
                          height: 28
                          normal: "self.parent.entry != none ? (self.parent.entry['unlocked'] == true ? '124,196,142,200' : self.parent.entry['canUnlock'] == true ? '50,170,200,200' : '50,160,190,140') : '50,160,190,140'"
                          shape: ~round_rect
                          radius: 8
                          through: true
                        children:
                          层数文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 60
                              texts: "self.parent.parent.entry != none ? '&fT' + self.parent.parent.entry['tier'].round() : none"
                              fontSize: 20
                              through: true
