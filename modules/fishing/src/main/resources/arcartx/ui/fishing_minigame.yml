# AXS 钓鱼小游戏界面（Menu 承载，HUD 观感）
# 无背景无面板——玩家透过 UI 看到环境，核心组件悬浮在屏幕中右部
# 布局: 鱼名胶囊(顶部小药丸) + 轨道区(中右 96x560) + 进度条(轨道右侧竖条) + 操作提示(底部裸文字) + 结果覆盖层
# 视觉规范:
#   组件底 12,28,42,190  描边 80,200,220  文字/图标无底板
#   主色（青蓝）50,170,200  绿条 80,220,160  成功 124,196,142  失败 230,100,90

ui:
  isHud: false
  background: false
  escClose: false
  closeDied: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      if(var.fightId != packet['fightId']){
        var.lastTell = -1
        var.barInputSequence = 0
        var.barPressing = false
        var.barAnchorAt = 0
        var.barDrawY = packet['barY']
        var.barDrawVelocity = 0
      }
      var.fightId = packet['fightId']
      var.tensionEnabled = packet['tensionEnabled']
      var.obstacleName = packet['obstacleName']
      var.obstacleMin = packet['obstacleMin']
      var.obstacleMax = packet['obstacleMax']
      var.currentName = packet['currentName']
      var.currentMin = packet['currentMin']
      var.currentMax = packet['currentMax']
      var.currentDirection = packet['currentDirection']
      var.staminaEnabled = packet['staminaEnabled']
      var.personalityName = packet['personalityName']
      var.repeatHook = packet['repeatHook']
      var.fightState = packet
      var.barMotion = packet['barMotion']
      var.barSnapshotPending = true
      var.fishInside = false
      var.packetId = packet['packetId']
      var.fishId = packet['fishId']
      var.fishName = packet['fishName']
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.caughtSize = packet['caughtSize']
      var.rarity = packet['rarity']
      var.fishIconJson = packet['fishIconJson']
      var.rarityTag = var.rarity == 'legendary' ? '&6' : (var.rarity == 'rare' ? '&9' : (var.rarity == 'uncommon' ? '&a' : '&f'))
      var.rarityLabel = var.rarity == 'legendary' ? '传说' : (var.rarity == 'rare' ? '稀有' : (var.rarity == 'uncommon' ? '罕见' : '普通'))
      var.rarityColor = var.rarity == 'legendary' ? '255,200,50' : (var.rarity == 'rare' ? '80,140,240' : (var.rarity == 'uncommon' ? '100,220,120' : '200,200,200'))
      if(var.fishIconJson == none || var.fishIconJson == ''){
        var.fishIconJson = var.emptyItemJson
      }
      val.鱼图标.seticon()
      val.结果图标.seticon()
    update: |-
      if(var.fightId != packet['fightId']){ return }
      if(packet['hookPhase'] == 'READY' && var.fightState['hookPhase'] != 'READY'){
        Sound.self('minecraft:block.note_block.pling', 0.7, 12)
      }
      var.fightState = packet
      var.barSnapshotPending = true
      if(packet['phase'] == 'TELL' && var.lastTell != packet['moveId']){
        var.lastTell = packet['moveId']
        Sound.self('minecraft:block.note_block.pling', 0.65, 8)
      }
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.fishInside = packet['fishInside']
  action:
    load: |-
      var.fightId = ''
      var.lastTell = -1
      var.tensionEnabled = false
      var.obstacleName = ''
      var.obstacleMin = 0
      var.obstacleMax = 0
      var.currentName = ''
      var.currentMin = 0
      var.currentMax = 0
      var.currentDirection = 0
      var.staminaEnabled = false
      var.personalityName = ''
      var.repeatHook = false
      var.hookKeyHeld = false
      var.fightState = { 'phase': 'FREE', 'direction': 0, 'tension': 0, 'slackCooldown': 0, 'treasureY': 0.5, 'treasureProgress': 0, 'currentDrift': 0, 'stamina': 100, 'exhaustionSteps': 0, 'hookPhase': 'DONE', 'hookResult': 'NONE', 'hookStep': 0, 'hookErrorSteps': 0, 'hookRound': '0', 'hookRoundsCompleted': 0, 'hookAccuracyPercent': 0 }
      var.caughtSize = 0
      var.fishIconJson = ''
      var.fishName = ''
      var.fishY = 0.5
      var.rarityLabel = '普通'
      var.barHeight = 0.24
      var.barY = 0.5
      var.barDrawY = 0.5
      var.barDrawVelocity = 0
      var.barMotion = none
      var.barAnchorAt = 0
      var.barAnchorY = 0.5
      var.barAnchorVelocity = 0
      var.barCorrection = 0
      var.barSnapshotPending = false
      var.barInputSequence = 0
      var.barPressing = false
      var.spaceHeld = false
      var.mouseHeld = false
      var.packetId = 'AXS_FISHING'
      var.progress = 0.5
      var.rarityTag = '&f'
      var.timeLeft = 600
      var.emptyItemJson = '{"id":"minecraft:cod","Count":1b}'
    open: |-
      Packet.send(var.packetId, 'open_minigame')
    tick: |-
      if(var.state != 'playing' || var.repeatHook || var.fightId == ''){ return }
      held = var.spaceHeld || var.mouseHeld
      inputChanged = held != var.barPressing
      if(inputChanged){
        var.barPressing = held
        var.barInputSequence = var.barInputSequence + 1
        Packet.send(var.packetId, 'input', var.fightId, var.barInputSequence, held)
      }
      motion = var.barMotion
      if(motion == none || var.fightState['hookPhase'] != 'DONE'){
        var.barDrawY = var.barY
        var.barAnchorAt = 0
        return
      }

      now = Time.currentTime()
      // 未确认的输入继续在本地预测，确认后从服务端位置和速度重新起算。
      if(inputChanged && var.barAnchorAt != 0){
        var.barAnchorY = var.barDrawY
        var.barAnchorVelocity = var.barDrawVelocity
        var.barAnchorAt = now
        var.barCorrection = 0
      } elif(var.barAnchorAt == 0 || (var.barSnapshotPending && var.fightState['barInputSequence'] == var.barInputSequence)){
        correction = var.barDrawY - var.barY
        var.barCorrection = var.barAnchorAt != 0 && math.abs(correction) <= 0.12 ? correction : 0
        var.barAnchorY = var.barY
        var.barAnchorVelocity = var.fightState['barVelocity']
        var.barAnchorAt = now
      }
      var.barSnapshotPending = false

      elapsedSteps = math.max(0, (now - var.barAnchorAt) / motion['stepMillis'])
      steps = math.min(5, elapsedSteps)
      half = var.barHeight / 2
      y = var.barAnchorY
      velocity = var.barAnchorVelocity
      force = held ? motion['heldForce'] : motion['releasedForce']
      // 与 FishingFight 使用相同的逐步积分，最后不足一步的部分按时间比例绘制。
      while(steps > 0){
        multiplier = motion['forceMultiplier']
        if(velocity * force < 0){
          velocity = velocity * motion['reverseRetention']
          multiplier = multiplier * motion['turnResponse']
        }
        velocity = (velocity + force * multiplier) * motion['damping']
        nextY = y + velocity
        if(nextY - half <= 0){
          nextY = half
          velocity = math.abs(velocity) * motion['bounceDamping']
          if(force < 0){ velocity = math.max(velocity, 0) }
        }
        if(nextY + half >= 1){
          nextY = 1 - half
          velocity = (0 - math.abs(velocity)) * motion['bounceDamping']
          if(force > 0){ velocity = math.min(velocity, 0) }
        }
        y = y + (nextY - y) * math.min(1, steps)
        steps = steps - 1
      }
      correction = var.barCorrection * (1 - math.min(1, elapsedSteps / 2))
      var.barDrawY = math.max(half, math.min(1 - half, y + correction))
      var.barDrawVelocity = velocity
    keyPress: |-
      if(self.currentKeyPress() == ' ' || self.currentKeyPress() == 'SPACE'){
        var.spaceHeld = true
      }
      if((self.currentKeyPress() == 'q' || self.currentKeyPress() == 'Q') && var.state == 'playing'){
        Packet.send(var.packetId, 'give_up')
      }
      if((self.currentKeyPress() == 'r' || self.currentKeyPress() == 'R') && var.state == 'playing' && var.tensionEnabled && var.fightId != ''){
        Packet.send(var.packetId, 'slacken', var.fightId)
      }
      if((self.currentKeyPress() == 'f' || self.currentKeyPress() == 'F') && !var.hookKeyHeld){
        var.hookKeyHeld = true
        if(var.state == 'playing' && var.fightId != '' && var.fightState['hookResult'] == 'PENDING'){
          Packet.send(var.packetId, 'set_hook', var.fightId, var.fightState['hookRound'])
        }
      }
    keyRelease: |-
      if(self.currentKeyReleased() == ' ' || self.currentKeyReleased() == 'SPACE'){
        var.spaceHeld = false
      }
      if(self.currentKeyReleased() == 'f' || self.currentKeyReleased() == 'F'){
        var.hookKeyHeld = false
      }
    clickLeft: |-
      var.mouseHeld = true
    releaseLeft: |-
      var.mouseHeld = false

controls:
  # 自适应全局布局：以1920x1080设计分辨率等比缩放，居中定位
  # 无全屏玻璃底、无主卡片底——玩家可透过 UI 看到周围环境
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      # ── 鱼名胶囊（顶部小药丸：鱼名·稀有度 | 倒计时）──────────
      鱼名胶囊:
        type: Canvas
        attribute:
          point: ~top_center
          y: 176
          width: 460
          height: 48
          visible: "var.state == 'playing'"
        children:
          胶囊底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:12;12,28,42,150
              shape: ~round_rect
              radius: 22
            effect:
              stroke:
                width: 1
                color: ~80,200,220,180
          鱼名文字:
            type: Text
            attribute:
              point: ~middle_left
              x: 24
              texts: "var.rarityTag + '◆ ' + var.fishName + ' · ' + var.rarityLabel + ' &7· ' + var.caughtSize + ' cm'"
              fontSize: 28
              through: true
          时间文字:
            type: Text
            attribute:
              point: ~middle_right
              x: -24
              texts: "var.repeatHook ? ('&b第 ' + var.fightState['hookRound'] + ' 轮') : ((var.timeLeft < 100 ? '&c' : '&f') + (var.timeLeft / 20).round() + 's')"
              fontSize: 24
              through: true

      # ── 轨道区（屏幕中右竖直轨道，HUD 化窄条）──────────
      轨道区:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 140
          y: -20
          width: 96
          height: 560
          visible: "var.state == 'playing' && !var.repeatHook"
        children:
          轨道底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:14;12,28,42,190
              shape: ~round_rect
              radius: 20
            effect:
              stroke:
                width: 2
                color: ~80,200,220,200
          水深渐变:
            type: Texture
            attribute:
              point: ~top_left
              x: 6
              y: 6
              width: 84
              height: 548
              normal: ~12,28,42,255
              shape: ~round_rect
              radius: 16
            effect:
              gradient:
                color1: ~18,45,70,200
                color2: ~8,22,38,200
                type: 0
                angleDeg: 90
          障碍危险带:
            type: Texture
            attribute:
              point: ~top_left
              x: 6
              y: "6 + (1 - var.obstacleMax) * 548"
              width: 84
              height: "(var.obstacleMax - var.obstacleMin) * 548"
              visible: "var.obstacleMax > var.obstacleMin"
              normal: "var.fightState['obstacleScraping'] == true ? '220,70,54,200' : (var.fightState['obstacleWarning'] == true ? '255,168,59,185' : '200,121,41,100')"
              shape: ~round_rect
              radius: 6
              through: true
          # 绿条（玩家控制的捕获区域，鱼入内时增亮）
          绿条:
            type: Texture
            attribute:
              point: ~top_left
              x: 10
              y: "(1 - var.barDrawY - var.barHeight / 2) * 548 + 6"
              width: 76
              height: "var.barHeight * 548"
              normal: "var.fishInside ? '100,240,180,235' : '80,220,160,190'"
              shape: ~round_rect
              radius: 12
            effect:
              stroke:
                width: 2
                color: ~140,255,200,160
          水流层:
            type: Texture
            attribute:
              point: ~top_left
              x: 87
              y: "6 + (1 - var.currentMax) * 548"
              width: 4
              height: "(var.currentMax - var.currentMin) * 548"
              visible: "var.currentMax > var.currentMin"
              normal: "var.fightState['currentDrift'] != 0 ? '120,237,255,255' : '62,174,228,155'"
              through: true
          # 鱼图标（Slot 控件渲染 MC 物品图标）
          鱼图标:
            type: Slot
            val: 鱼图标
            attribute:
              slotType: ~Icon
              itemScale: 1.0
              point: ~top_left
              x: 24
              y: "math.max(6, math.min(506, (1 - var.fishY) * 548 + 6 - 24))"
              width: 48
              height: 48
              normal: ~0,0,0,0
              through: true
              seticon: "self.setItemIcon(var.fishIconJson)"

          途中宝藏:
            type: Text
            attribute:
              point: ~top_left
              x: 53
              y: "(1 - var.fightState['treasureY']) * 548 - 6"
              width: 41
              height: 24
              fontSize: 18
              visible: "var.fightState['treasureVisible'] == true"
              texts: "'&6◆ ' + (var.fightState['treasureProgress'] * 100).round() + '%'"
              through: true

      性格提示:
        type: Text
        attribute:
          point: ~middle_center
          x: "var.repeatHook ? 0 : -96"
          y: -128
          width: 225
          height: 28
          fontSize: 20
          visible: "var.state == 'playing' && var.personalityName != ''"
          texts: "'&7性格 · &f' + var.personalityName"
          through: true

      提竿练习统计:
        type: Text
        attribute:
          point: ~middle_center
          y: -94
          width: 278
          height: 28
          fontSize: 20
          visible: "var.state == 'playing' && var.repeatHook"
          texts: "'&7已练 &f' + var.fightState['hookRoundsCompleted'].round() + ' &7轮 · 准点率 &f' + (var.fightState['hookRoundsCompleted'] > 0 ? (var.fightState['hookAccuracyPercent'].round() + '%') : '—')"
          through: true

      提竿窗口:
        type: Canvas
        attribute:
          point: ~middle_center
          x: "var.repeatHook ? 0 : -96"
          y: -22
          width: 278
          height: 104
          visible: "var.state == 'playing' && var.fightState['hookPhase'] != 'DONE'"
          through: true
        children:
          提竿背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,28,42,230
              shape: ~round_rect
              radius: 14
              through: true
          水线:
            type: Texture
            attribute:
              point: ~top_left
              x: 16
              y: 48
              width: 40
              height: 3
              normal: ~64,160,220,190
              visible: "var.fightState['hookPhase'] != 'FEEDBACK'"
              through: true
          浮漂:
            type: Texture
            attribute:
              point: ~top_left
              x: 29
              y: "var.fightState['hookPhase'] == 'TAP' ? (var.fightState['hookStep'] % 6 < 3 ? 24 : 29) : 53"
              width: 14
              height: 14
              normal: "var.fightState['hookPhase'] == 'READY' ? '100,240,180,255' : '238,119,88,255'"
              visible: "var.fightState['hookPhase'] != 'FEEDBACK'"
              shape: ~round_rect
              radius: 7
              through: true
          提竿文字:
            type: Text
            attribute:
              point: ~middle_center
              x: 26
              y: -6
              fontSize: 22
              visible: "var.fightState['hookPhase'] != 'FEEDBACK'"
              texts: "var.fightState['hookPhase'] == 'TAP' ? '&e浮漂轻点 · 等沉漂' : (var.fightState['hookPhase'] == 'READY' ? '&a沉漂！[F] 提竿' : '&7最佳时机已过')"
              through: true
          下一轮提示:
            type: Text
            attribute:
              point: ~middle_center
              y: 22
              fontSize: 18
              visible: "var.fightState['hookPhase'] == 'FEEDBACK'"
              texts: "~&7下一轮即将开始"
              through: true

      提竿结果:
        type: Text
        attribute:
          point: ~middle_center
          x: "var.repeatHook ? 0 : -96"
          y: "var.repeatHook ? -35 : 102"
          width: 225
          height: 28
          fontSize: 20
          visible: "var.state == 'playing' && (var.fightState['hookPhase'] == 'DONE' || var.fightState['hookPhase'] == 'FEEDBACK') && var.fightState['hookResult'] != 'NONE'"
          texts: "var.fightState['hookResult'] == 'GOOD' ? '&a准点提竿' : (var.fightState['hookResult'] == 'EARLY' ? ('&e早了 ' + (0 - var.fightState['hookErrorSteps']).round() + ' 步') : (var.fightState['hookResult'] == 'LATE' ? ('&e晚了 ' + var.fightState['hookErrorSteps'].round() + ' 步') : '&7错过提竿'))"
          through: true

      体力提示:
        type: Text
        attribute:
          point: ~middle_center
          x: -96
          y: -92
          width: 225
          height: 28
          fontSize: 20
          visible: "var.state == 'playing' && !var.repeatHook && var.staminaEnabled"
          texts: "var.fightState['exhaustionSteps'] > 0 ? '&a鱼已力竭 · 抓紧收线' : ('&f鱼体力 ' + var.fightState['stamina'].round() + '%')"
          through: true

      对抗提示:
        type: Text
        attribute:
          point: ~middle_center
          x: -96
          y: -55
          width: 225
          height: 28
          fontSize: 21
          visible: "var.state == 'playing' && (var.fightState['phase'] == 'TELL' || (var.fightState['phase'] == 'RECOVERY' && var.fightState['exhaustionSteps'] == 0) || var.fightState['treasureClaimed'] == true)"
          texts: "var.fightState['phase'] == 'TELL' ? ((var.fightState['direction'] > 0 ? '&e↑ ' : '&e↓ ') + (var.fightState['personalityRush'] == true ? '警觉反冲' : (var.fightState['direction'] > 0 ? '准备上冲' : '准备下潜'))) : (var.fightState['treasureClaimed'] == true ? '&6宝藏已捞到，收竿带走' : '&a鱼已回稳')"
          through: true

      张力提示:
        type: Text
        attribute:
          point: ~middle_center
          x: -96
          y: -15
          width: 225
          height: 28
          fontSize: 20
          visible: "var.state == 'playing' && var.fightState['hookPhase'] == 'DONE' && var.tensionEnabled"
          texts: "(var.fightState['tension'] >= 80 ? '&c' : '&f') + '张力 ' + var.fightState['tension'].round() + '%  ' + (var.fightState['slackened'] == true ? '&b松线中' : (var.fightState['slackCooldown'] > 0 ? '&7松线冷却' : '&e[R] 松线'))"
          through: true

      张力条:
        type: Canvas
        attribute:
          point: ~middle_center
          x: -96
          y: 10
          width: 190
          height: 8
          visible: "var.state == 'playing' && var.fightState['hookPhase'] == 'DONE' && var.tensionEnabled"
          through: true
        children:
          张力条底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~21,31,43,230
              through: true
          张力条值:
            type: Texture
            attribute:
              point: ~top_left
              width: "190 * var.fightState['tension'] / 100"
              height: 8
              normal: "var.fightState['tension'] >= 80 ? '238,86,75,255' : '247,186,83,255'"
              through: true

      障碍提示:
        type: Text
        attribute:
          point: ~middle_center
          x: -96
          y: 36
          width: 225
          height: 28
          fontSize: 20
          visible: "var.state == 'playing' && var.fightState['hookPhase'] == 'DONE' && var.obstacleMax > var.obstacleMin"
          texts: "var.fightState['obstacleScraping'] == true ? ('&c' + var.obstacleName + ' · 正在擦线') : (var.fightState['obstacleWarning'] == true ? ('&e' + var.obstacleName + ' · 注意擦线') : ('&7' + var.obstacleName))"
          through: true

      水流提示:
        type: Text
        attribute:
          point: ~middle_center
          x: -96
          y: 68
          width: 225
          height: 28
          fontSize: 20
          visible: "var.state == 'playing' && !var.repeatHook && var.currentMax > var.currentMin"
          texts: "(var.fightState['currentDrift'] != 0 ? '&b' : '&7') + (var.currentDirection < 0 ? '↓ ' : '↑ ') + var.currentName"
          through: true

      # ── 进度条（轨道右侧竖条，HUD 化细条）──────────
      进度条:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 248
          y: -20
          width: 24
          height: 560
          visible: "var.state == 'playing' && !var.repeatHook"
        children:
          进度底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,28,42,180
              shape: ~round_rect
              radius: 12
            effect:
              stroke:
                width: 1
                color: ~80,200,220,200
          进度填充:
            type: Texture
            attribute:
              point: ~top_left
              x: 4
              y: "(1 - var.progress) * 552 + 4"
              width: 16
              height: "var.progress * 552"
              normal: "var.progress >= 1.0 ? '124,196,142,255' : (var.fishInside ? '50,170,200,245' : '230,100,90,245')"
              shape: ~round_rect
              radius: 8
          进度数字:
            type: Text
            attribute:
              point: ~top_center
              y: 568
              texts: "'&f' + (var.progress * 100).round() + '%'"
              fontSize: 20
              through: true

      # ── 操作提示（底部裸文字，无底板）──────────
      操作提示:
        type: Text
        attribute:
          point: ~bottom_center
          y: -110
          texts: "var.repeatHook ? '&7沉漂时按 &fF &7提竿 · &fQ &7退出练习' : '&7按住 &f空格 &7或 &f左键 &7让绿条追踪鱼 · &fQ &7放弃'"
          fontSize: 22
          through: true
          visible: "var.state == 'playing'"

      # ── 结果覆盖层（成功/失败时显示，居中悬浮）──────────
      结果覆盖层:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 560
          height: 280
          visible: "var.state == 'success' || var.state == 'failed'"
        children:
          结果背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: "var.state == 'success' ? '18,50,35,240' : '55,20,20,240'"
              shape: ~round_rect
              radius: 20
            effect:
              stroke:
                width: 3
                color: "var.state == 'success' ? '124,196,142,245' : '230,100,90,200'"
          结果文字:
            type: Text
            attribute:
              point: ~top_center
              y: 44
              texts: "var.state == 'success' ? '&a✓ 捕获成功！' : (var.fightState['lineSnapped'] == true ? '&c✕ 鱼线断了' : '&c✕ 鱼逃走了...')"
              fontSize: 48
              through: true
          结果图标:
            type: Slot
            val: 结果图标
            attribute:
              slotType: ~Icon
              itemScale: 1.2
              point: ~top_center
              y: 104
              width: 56
              height: 56
              normal: ~0,0,0,0
              through: true
              visible: "var.state == 'success'"
              seticon: "self.setItemIcon(var.fishIconJson)"
          结果详情:
            type: Text
            attribute:
              point: ~top_center
              y: 176
              texts: "var.state == 'success' ? (var.rarityTag + var.fishName + ' &7尺寸: &f' + var.caughtSize + ' cm') : '&7再试一次吧'"
              fontSize: 30
              through: true
          结果稀有度:
            type: Text
            attribute:
              point: ~top_center
              y: 224
              texts: "var.state == 'success' ? (var.rarityTag + '◆ ' + var.rarityLabel) : ''"
              fontSize: 26
              through: true
