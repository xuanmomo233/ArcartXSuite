    attribute:
      point: ~stretch_all
      width: 1920 / 3
      height: 1080 / 3
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 223
          height: 235
          visible: true
        children:
          面板底:
            type: Texture
            attribute:
              point: ~middle_center
              x: 0
              y: 0
              width: 223
              height: 235
              normal: ~Frosted:25;95,95,95,235
              shape: ~round_rect
              radius: 12
              visible: true
            effect:
              stroke:
                width: 2
                color: ~255,255,255,180
              shadow:
                xOffset: 2
                yOffset: 2
                blur: 5
                color: ~0,0,0,120
          标题文字:
            type: Text
            attribute:
              point: ~middle_center
              y: -105
              texts:
                - ~&f熔炉
              fontSize: 18
              through: true
          标题下划线:
            type: Texture
            attribute:
              point: ~middle_center
              y: -93
              width: 180
              height: 2
              normal: ~255,255,255,200
              shape: ~round_rect
              radius: 1
              through: true
          配方书按钮:
            type: Slot
            val: 配方书按钮
            attribute:
              x: -78
              y: -48
              width: 19
              height: 19
              slotType: ~Icon
              point: ~middle_center
              visible: true
              normal: "var.recipeBookOpen ? '120,190,255,230' : '255,255,255,150'"
              hover: ~Frosted:0;255,255,255,240
