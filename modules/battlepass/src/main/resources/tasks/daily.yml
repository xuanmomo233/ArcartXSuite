# =============================================================================
# 每日任务池
# 分配给玩家的每日任务从这里按 weight 加权随机抽取 daily-count 个
# 每天 0 点自动重置并重新分配
# =============================================================================
# 事件源说明：
#   event-topic: ArcartX EventBus 主题（优先使用，需对应模块已加载）
#   bukkit-event: 原版 Bukkit 事件降级配置（当发布模块不存在时自动启用）
#   两个源不会同时生效，引擎启动时检测模块存在性自动选择。
#
# payload key 参考：
#   combateffect / EntityDeathEvent: entityType, entityName
#   combateffect / EntityDamageByEntityEvent: attacker, targetType, targetName, damage
#   TaczGunKillEvent: entityType, entityName（与 EntityDeathEvent 一致，兼容 TACZ 枪械击杀）
#   TaczGunDamageEvent: attacker, targetType, targetName, damage（与 EntityDamageByEntityEvent 一致，兼容 TACZ 枪械伤害）
#   pickup / PlayerPickupItemEvent: material, amount
#   fishing / PlayerFishEvent: fishType, state
#   loginview / PlayerJoinEvent: (无 payload 字段)
# =============================================================================

# -------- 每日登录 --------
daily-login:
  display-name: "每日登录"
  description: "每天登录游戏即可获得奖励"
  difficulty: easy
  event-topic: "axs.loginview.login_success"
  bukkit-event:
    event-class: "org.bukkit.event.player.PlayerJoinEvent"
  required-count: 1
  base-xp-reward: 100
  conditions: []
  increment-strategy:
    type: fixed
    value: 1
  weight: 5

# -------- 击杀任意生物 --------
daily-kill-any:
  display-name: "日常狩猎"
  description: "击杀10个任意生物"
  difficulty: easy
  event-topic: "axs.combateffect.kill_entity"
  bukkit-event:
    event-classes:
      - "org.bukkit.event.entity.EntityDeathEvent"
      - "xuanmo.arcartxsuite.api.event.TaczGunKillEvent"
  required-count: 10
  base-xp-reward: 120
  conditions: []
  increment-strategy:
    type: fixed
    value: 1
  weight: 4

# -------- 击杀僵尸 --------
daily-kill-zombie:
  display-name: "击杀僵尸"
  description: "在主世界击杀20个僵尸"
  difficulty: normal
  event-topic: "axs.combateffect.kill_entity"
  bukkit-event:
    event-classes:
      - "org.bukkit.event.entity.EntityDeathEvent"
      - "xuanmo.arcartxsuite.api.event.TaczGunKillEvent"
  required-count: 20
  base-xp-reward: 150
  conditions:
    - type: event_payload
      key: entityType
      operator: equals
      value: ZOMBIE
  increment-strategy:
    type: fixed
    value: 1
  weight: 3

# -------- 累计造成伤害 --------
daily-damage-dealt:
  display-name: "战斗训练"
  description: "对生物累计造成500点伤害"
  difficulty: normal
  event-topic: "axs.combateffect.damage_dealt"
  bukkit-event:
    event-classes:
      - "org.bukkit.event.entity.EntityDamageByEntityEvent"
      - "xuanmo.arcartxsuite.api.event.TaczGunDamageEvent"
  required-count: 500
  base-xp-reward: 180
  conditions: []
  increment-strategy:
    type: payload_value
    payload-key: damage
    max-per-event: 200
    scale: 1.0
  weight: 2

