                          y: 28
                          width: 31
                          height: 4
                          normal: ~67,84,102,255
                          through: true
                      返回上折:
                        type: Texture
                        attribute:
                          x: 14
                          y: 22
                          width: 19
                          height: 4
                          rotate: -45
                          normal: ~67,84,102,255
                          through: true
                      返回下折:
                        type: Texture
                        attribute:
                          x: 14
                          y: 34
                          width: 19
                          height: 4
                          rotate: 45
                          normal: ~67,84,102,255
                          through: true
                  导航饰线:
                    type: Texture
                    attribute:
                      x: 41
                      y: 118
                      width: 2
                      height: 158
                      normal: ~117,130,137,255
                      through: true
                  导航饰点:
                    type: Texture
                    attribute:
                      x: 36
                      y: 283
                      width: 12
                      height: 12
                      rotate: 45
                      normal: ~207,190,155,255
                      through: true
                  页脚滚动区:
                    type: Scroll
                    attribute:
                      x: 6
                      y: 328
                      width: 72
                      height: "var.viewH - 428"
                      moveY: val.footer_slider.getDragYRatio()
                    action:
                      wheel: |-
                        ratio = self.moveY - self.wheelValue * 0.12
                        ratio = math.max(0, math.min(1, ratio))
                        val.footer_slider.setDragYRatio(ratio)
                    children:
                      页脚列表:
                        type: VStack
                        val: footer_rows
                        attribute:
                          width: 72
                          spaceBetween: 16
                          maxSize: "var.footerCount + 1"
                        children:
                          页脚按钮:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: var.footerRows[self.entryKey]
                              visible: self.entry != none
                              width: 72
                              height: 72
                              pressAnim: none
                              middleScale: "1 - self.pressAnim.get() * 0.04"
                              surface: "(self.isHovered() && self.entry['enabled']) ? '91,105,116,255' : '62,77,92,255'"
                            action:
                              create: |-
                                self.pressAnim = Smooth(0, 0, 160)
                              enter: |-
                                var.preview = self.entry
                                var.previewTitle = var.footerLabels[self.entryKey]
                                var.previewKey = 'footer:' + self.entry['id']
                                var.menuUi.actions['preview']()
                              leave: |-
                                if(var.previewKey == 'footer:' + self.entry['id']){
                                  var.preview = none
                                }
                              clickLeft: |-
                                if(!var.closing && self.entry != none && self.entry['enabled'] && !var.actionBusy){
                                  self.pressAnim = Smooth(1, 0, 180)
                                  Sound.self('minecraft:ui.button.click', 1.1, 18)
                                  if(self.entry['clientAction'] == 'options'){
                                    Game.options()
                                  } elif(self.entry['clientAction'] == 'quit'){
                                    Game.quit()
                                  } elif(var.actionToken != none){
                                    var.actionBusy = true
                                    var.actionBusySeconds = 0
                                    Packet.send(var.packetId, 'footer', var.actionToken, self.entry['id'])
                                  }
                                }
                            children:
                              工具底:
                                type: Texture
                                attribute:
                                  x: 5
                                  y: 5
                                  width: 62
                                  height: 62
                                  normal: self.parent.surface
                                  shape: ~circle
                                  through: true
                                effect:
                                  stroke:
                                    width: "self.parent.isHovered() ? 2 : 0"
                                    color: ~239,222,183,255
                              图标:
                                type: Slot
                                attribute:
                                  slotType: ~Icon
                                  x: 14
                                  y: 14
                                  width: 44
                                  height: 44
                                  itemScale: 0.68
                                  normal: ~0,0,0,0
                                  through: true
                                  seticon: "self.setItemIcon(var.footerIconJsons[self.parent.entryKey])"
                              禁用遮色:
                                type: Texture
                                attribute:
                                  x: 5
                                  y: 5
                                  width: 62
                                  height: 62
                                  normal: ~62,77,92,170
                                  visible: "!self.parent.entry['enabled']"
                                  shape: ~circle
                                  through: true
                  页脚滑块:
