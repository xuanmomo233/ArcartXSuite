# AXS 资源说明
# 用途: Essentials 管理员后台面板，支持玩家管理/封禁/传送点/世界控制。
# 前置依赖: ArcartX；Essentials 模块启用后自动注册。
# 打开方式: /axs essentials admin
# 数据交互: packetHandler 接收 init 推送；客户端通过 Packet.send('AXS_ESS_ADMIN', ...) 发送管理指令。
# 布局: 1920x1080 自适应控制室 = 状态顶栏 + 索引导航 + 双层操作记录 + 世界控制
# 视觉规范: 深海蓝工作台 / 粉笔白文字 / 蓝色操作 / 赭色警告 / 红色危险。
# List 数据使用模板与引用字典复制；滚动区、轨道与滑块共享视口几何。

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - page: 当前页面 (players/bans/mutes/warps/world)
    #   - packetId: 服务端回包 ID，用于客户端 Packet.send 回传
    #   - players: 在线玩家数据列表
    #   - playerCount: 在线玩家数量
    #   - warps: 传送点数据列表
    #   - bans: 封禁列表数据
    #   - banCount: 封禁数量
    #   - chatAvailable: Chat 模块是否可用 (true/false)
    #   - mutes: 禁言列表数据
    #   - muteCount: 禁言数量
    #   - worldName: 当前世界名称
    #   - worldTime: 当前世界时间
    #   - worldWeather: 当前世界天气
    init: |-
      var.page = packet['page']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.players = packet['players']
      var.playerCount = packet['playerCount']
      var.warps = packet['warps']
      var.bans = packet['bans']
      var.banCount = packet['banCount']
      var.chatAvailable = packet['chatAvailable']
      var.mutes = packet['mutes']
      var.muteCount = packet['muteCount']
      var.worldName = packet['worldName']
      var.worldTime = packet['worldTime']
      var.worldWeather = packet['worldWeather']
      // Java 下发 List：索引绑定，不使用只支持 Map 的 Observer。
      var.rowGeneration = (var.rowGeneration + 1).round()
      if(val.player_data.childrenCount() != math.max(1, var.players.size())){
        for(key in var.playerRows.keys()){ var.playerRows[key].remove() }
        var.playerRows = {}
        row = val.player_data.get(0)
        for(i in range(1, var.players.size() - 1)){
          copy = row.copy('player_' + var.rowGeneration + '_' + i.round())
          copy.entryKey = i.round()
          var.playerRows[i.round()] = copy
        }
      }
      if(val.ban_data.childrenCount() != math.max(1, var.bans.size())){
        for(key in var.banRows.keys()){ var.banRows[key].remove() }
        var.banRows = {}
        row = val.ban_data.get(0)
        for(i in range(1, var.bans.size() - 1)){
          copy = row.copy('ban_' + var.rowGeneration + '_' + i.round())
          copy.entryKey = i.round()
          var.banRows[i.round()] = copy
        }
      }
      if(val.mute_data.childrenCount() != math.max(1, var.mutes.size())){
        for(key in var.muteRows.keys()){ var.muteRows[key].remove() }
        var.muteRows = {}
        row = val.mute_data.get(0)
        for(i in range(1, var.mutes.size() - 1)){
          copy = row.copy('mute_' + var.rowGeneration + '_' + i.round())
          copy.entryKey = i.round()
          var.muteRows[i.round()] = copy
        }
      }
      if(val.warp_data.childrenCount() != math.max(1, var.warps.size())){
        for(key in var.warpRows.keys()){ var.warpRows[key].remove() }
        var.warpRows = {}
        row = val.warp_data.get(0)
        for(i in range(1, var.warps.size() - 1)){
          copy = row.copy('warp_' + var.rowGeneration + '_' + i.round())
          copy.entryKey = i.round()
          var.warpRows[i.round()] = copy
        }
      }
  action:
    load: |-
      var.players = {}
      var.bans = {}
      var.mutes = {}
      var.warps = {}
      var.actionToken = ''
      var.playerRows = {}
      var.banRows = {}
      var.muteRows = {}
      var.warpRows = {}
      var.rowGeneration = 0
      var.banCount = '0'
      var.muteCount = '0'
      var.playerCount = '0'
      var.worldName = ''
      var.worldTime = '0'
      var.worldWeather = 'clear'
      var.packetId = 'AXS_ESS_ADMIN'
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 336
    open: |-
      Packet.send(var.packetId, 'refresh', 'players')
    # 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 336

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:12;8,25,37,240

  # 自适配布局：宽高 = 设计分辨率 1920x1080，窗口分辨率变化时按比例缩放子控件
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 88
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~16,39,55,255
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~27,57,75,255
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~32,120,157,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&fESS / 控制室"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 352
              width: 1
              height: 30
              normal: ~27,57,75,255
          在线数量:
            type: Text
            attribute:
              point: ~middle_left
              x: 376
              texts: "'&7在线 &f' + var.playerCount + '    &7封禁 &f' + var.banCount + '    &7世界 &f' + var.worldName"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -32
              width: 104
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~27,57,75,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '32,120,157,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f关闭"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "32 - var.offX"
          y: 112
          width: 248
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~16,39,55,255
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          索引标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 24
              texts: "~&b管理索引"
              fontSize: 36
              through: true
          操作须知:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 444
              texts:
                - "~&f操作说明"
                - "~&7蓝色 / 常规操作"
                - "~&7红色 / 删除封禁"
                - "~&7请先核对玩家名"
                - "~&7滚轮或拖动滑块"
              fontSize: 36
              through: true
          # 当前页：玩家
          导航玩家:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 72
              width: 220
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'players')
            children:
              玩家底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'players' ? '32,120,157,210' : '27,57,75,255'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.parent.isHovered() ? '116,199,220,255' : '91,135,156,255'"
              玩家高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~32,120,157,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'players'"
              玩家文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'players' ? '&f玩家' : '&f玩家'"
                  fontSize: 36
                  through: true
          # 当前页：封禁
          导航封禁:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 138
              width: 220
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'bans')
            children:
              封禁底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'bans' ? '32,120,157,210' : '27,57,75,255'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.parent.isHovered() ? '116,199,220,255' : '91,135,156,255'"
              封禁高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~32,120,157,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'bans'"
              封禁文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'bans' ? '&f封禁' : '&f封禁'"
                  fontSize: 36
                  through: true
          # 当前页：禁言（Chat 模块未加载时隐藏）
          导航禁言:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 204
              width: 220
              height: 58
              visible: "var.chatAvailable == 'true'"
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'mutes')
            children:
              禁言底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'mutes' ? '32,120,157,210' : '27,57,75,255'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.parent.isHovered() ? '116,199,220,255' : '91,135,156,255'"
              禁言高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~32,120,157,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'mutes'"
              禁言文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'mutes' ? '&f禁言' : '&f禁言'"
                  fontSize: 36
                  through: true
          # 当前页：传送点
          导航传送点:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: "var.chatAvailable == 'true' ? 270 : 204"
              width: 220
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'warps')
            children:
              传送点底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'warps' ? '32,120,157,210' : '27,57,75,255'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.parent.isHovered() ? '116,199,220,255' : '91,135,156,255'"
              传送点高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~32,120,157,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'warps'"
              传送点文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'warps' ? '&f传送点' : '&f传送点'"
                  fontSize: 36
                  through: true
          # 当前页：世界
          导航世界:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: "var.chatAvailable == 'true' ? 336 : 270"
              width: 220
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'navigate', 'world')
            children:
              世界底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.page == 'world' ? '32,120,157,210' : '27,57,75,255'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.parent.isHovered() ? '116,199,220,255' : '91,135,156,255'"
              世界高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~32,120,157,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.page == 'world'"
              世界文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.page == 'world' ? '&f世界' : '&f世界'"
                  fontSize: 36
                  through: true
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: "~&7ESC 关闭界面"
              fontSize: 36

      # ── 内容区 ─────────────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "304 - var.offX"
          y: 112
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~16,39,55,255
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~104,153,175,255
          滚动说明:
            type: Text
            attribute:
              point: ~bottom_right
              x: -32
              y: -16
              visible: "var.page != 'world'"
              texts: "~&7滚轮浏览 / 右侧滑块定位"
              fontSize: 36
              through: true

          # ─── 玩家列表视图 ───
          玩家布局:
            type: Canvas
            attribute:
              point: ~top_left
              x: 32
              y: 26
              width: "var.contentW - 64"
              height: "var.viewH - 196"
              visible: |-
                var.page == 'players'
            children:
              玩家页标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 0
                  y: 0
                  texts: "~&f在线玩家"
                  fontSize: 48
              玩家页说明:
                type: Text
                attribute:
                  point: ~top_left
                  y: 56
                  texts: "~&7上行核对状态，下行执行操作；悬停信息可查看完整内容。"
                  fontSize: 36
                  through: true
              玩家空状态:
                type: Text
                attribute:
                  point: ~top_left
                  y: 160
                  visible: "var.playerCount == '0'"
                  texts: "~&7当前没有在线玩家。"
                  fontSize: 36
                  through: true
              玩家滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  y: 112
                  width: 12
                  height: "var.viewH - 348"
                  normal: ~40,44,52,225
                  shape: ~round_rect
                  radius: 6
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,230
              玩家滑块:
                type: Texture
                val: 玩家滑块
                attribute:
                  point: ~top_right
                  y: 112
                  width: 12
                  height: 60
                  normal: ~120,160,220,255
                  maxDragY: "var.viewH - 408"
                  shape: ~round_rect
                  radius: 6
              玩家滚动栏:
                type: Scroll
                attribute:
                  point: ~top_left
                  y: 112
                  width: "var.contentW - 82"
                  height: "var.viewH - 348"
                  moveY: "self.parent['玩家滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['玩家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['玩家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  players_list:
                    val: player_data
                    type: VStack
                    attribute:
                      x: 0
                      y: 0
                      width: "var.contentW - 82"
                      spaceBetween: 8
                    children:
                      玩家行:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: "self.entryKey < var.players.size() ? var.players.get(self.entryKey) : none"
                          visible: self.entry != none
                          width: "var.contentW - 90"
                          height: 128
                        children:
                          玩家行底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~27,57,75,255
                              shape: ~round_rect
                              radius: 10
                            effect:
                              stroke:
                                width: 2
                                color: ~255,255,255,180
                          玩家信息滚动:
                            type: Scroll
                            attribute:
                              point: ~top_left
                              x: 20
                              y: 8
                              width: "var.contentW - 144"
                              height: 48
                              scrollAnim: none
                              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                            action:
                              enter: |-
                                self.scrollAnim = Lerp(0, 1, 2000)
                              leave: |-
                                self.scrollAnim = none
                            children:
                              信息横排:
                                type: HStack
                                attribute:
                                  y: 0
                                  height: 48
                                children:
                                  玩家信息:
                                    type: Text
                                    attribute:
                                      y: 8
                                      texts: "'&f' + self.parent.parent.parent.entry['name'] + '    &7生命 &f' + self.parent.parent.parent.entry['health'] + '    ' + (self.parent.parent.parent.entry['isFlying'] == 'true' ? '&b飞行开' : '&7飞行关') + '    ' + (self.parent.parent.parent.entry['isGod'] == 'true' ? '&a无敌开' : '&7无敌关') + '    &7世界 &f' + self.parent.parent.parent.entry['world']"
                                      fontSize: 36
                                      through: true
                          # 操作按钮组（靠右排列）
                          操作按钮组:
                            type: Canvas
                            attribute:
                              point: ~bottom_right
                              x: -16
                              y: -12
                              width: "var.chatAvailable == 'true' ? 784 : 696"
                              height: 48
                            children:
                              按钮横排:
                                type: HStack
                                attribute:
                                  point: ~middle_right
                                  height: 48
                                  spaceBetween: 8
                                children:
                                  治疗按钮:
                                    type: Canvas
                                    attribute:
                                      width: 80
                                      height: 48
                                    action:
                                      clickLeft: |-
                                        Packet.send(var.packetId, 'heal', var.actionToken, self.parent.parent.parent.entry['name'])
                                    children:
                                      治疗底:
                                        type: Texture
                                        attribute:
                                          point: ~stretch_all
                                          through: true
                                          normal: ~29,111,147,255
                                          hover: ~36,128,160,255
                                          shape: ~round_rect
                                          radius: 8
                                        effect:
                                          ripple:
                                          stroke:
                                            width: 2
                                            color: "self.isHovered() ? '124,196,142,255' : '255,255,255,180'"
                                      治疗文字:
                                        type: Text
                                        attribute:
                                          point: ~middle_center
                                          texts: "~&f治疗"
                                          fontSize: 36
                                          through: true
                                  喂食按钮:
                                    type: Canvas
                                    attribute:
                                      width: 80
                                      height: 48
                                    action:
                                      clickLeft: |-
                                        Packet.send(var.packetId, 'feed', var.actionToken, self.parent.parent.parent.entry['name'])
                                    children:
                                      喂食底:
                                        type: Texture
                                        attribute:
                                          point: ~stretch_all
                                          through: true
                                          normal: ~160,130,40,210
                                          hover: ~190,160,60,230
                                          shape: ~round_rect
                                          radius: 8
                                        effect:
                                          ripple:
                                          stroke:
                                            width: 2
                                            color: "self.isHovered() ? '116,199,220,255' : '255,255,255,180'"
                                      喂食文字:
                                        type: Text
                                        attribute:
                                          point: ~middle_center
                                          texts: "~&f喂食"
                                          fontSize: 36
                                          through: true
