        children:
          框底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~44,52,72,245
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~120,160,235,240
          提示文字:
            type: Text
            attribute:
              point: ~middle_center
              y: -48
              texts: "~&f资源不足"
