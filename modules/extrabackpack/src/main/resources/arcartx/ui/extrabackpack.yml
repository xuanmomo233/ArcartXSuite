# AXS Extra Backpack — 旅行装备册
# 天然帆布内页 / 胡桃皮革封边 / 分类收纳与装载提示。
# 原版槽位与 ~Extra 真实扩展槽位仍由 ArcartX 原生处理拖动、半组、单放与交换。
# 分类页只过滤共用仓位，不把分类 slotCount 当作总容量。
ui:
  isHud: false
  defaultOpen: false
  match:
    - 物品栏界面
  hide:
    - hotbar
    - crosshair
    - player_state
    - experience_bar
    - item_name
    - jump_bar
    - mount_health
    - potion_icons
    - scoreboard
    - chat_panel
    - player_list
    - subtitles
    - HUD
    - online
    - 聊天栏
    - 聊天栏-全局
    - 聊天栏-过滤
    - 聊天输入框
    - 聊天输入框-按钮版
    - 纯色块HUD
    - 纯色块HUD二改
    - 纯色块计分板
    - 纯色块TAB配置
    - 鸽蛋TAB配置
    - 状态栏hud
    - 菜单状态栏HUD
    - 简约状态栏hud
    - 定制HUD
    - 定制的hud
    - 击杀命中特效
    - Wardrobe:main
    - Appearance:main
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    update: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.activeCategory = packet['activeCategory']
      var.categories = packet['categories']
      var.categoryCount = packet['categoryCount']
      var.slotCount = packet['slotCount']
      var.used = packet['used']
      var.capacityText = packet['capacityText']
      var.maxCapacity = packet['maxCapacity']
      var.canBuySlots = packet['canBuySlots']
      var.remainingSlots = packet['remainingSlots']
      var.buySlotsText = packet['buySlotsText']
      var.passwordPanel = packet['passwordPanel']
      var.destroyPanel = packet['destroyPanel']
      // 分类共有的已解锁仓位用于装载条，分类过滤不改变装载分母
      var.装载容量 = var.categories[0.round()]['capacity']
      var.装载率 = 0
      if(var.装载容量 > 0){
        var.装载率 = var.used / var.装载容量
        if(var.装载率 > 1){ var.装载率 = 1 }
      }
      // 密码模式文案在脚本中选择，避免渲染属性的嵌套三元
      var.密码标题 = '解锁行囊'
      var.密码动作 = '解锁'
      var.密码说明 = '输入二级密码后继续整理物品'
      if(var.passwordPanel['mode'] == 'set'){
        var.密码标题 = '设置二级密码'
        var.密码动作 = '保存密码'
        var.密码说明 = '已有密码时，先输入当前密码'
      }else{
        if(var.passwordPanel['mode'] == 'clear'){
          var.密码标题 = '清除二级密码'
          var.密码动作 = '确认清除'
          var.密码说明 = '清除后，行囊不再受二级密码保护'
        }
      }
      分类数 = var.categoryCount.round()
      现有分类数 = val.分类标签行.childrenCount() - 1
      if(现有分类数 != 分类数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.分类标签行.childrenCount() > 1){
          val.分类标签行.get(1).remove()
        }
        if(分类数 > 1){
          for(序号 in range(1, 分类数 - 1)){
            if(val.分类标签行['项'] != none) {
              项 = val.分类标签行['项'].copy('分类项_' + var.刷新轮次 + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      // 槽位仍在 tick 统一重建，保留原生 Extra 槽位同步时序
      var.待重建 = true
      var.待过滤 = true
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    tick: |-
      if(server.player_yaw != var.yaw){
        var.yaw = server.player_yaw
        Camera.setState(-0.7, -0.5, 2.1, 210, 0.0, 600)
        Camera.setThirdPerson(true)
        var.相机计数 = 0
      }
      var.相机计数 = var.相机计数 + 1
      if(var.相机计数 >= 10){
        var.相机计数 = 0
        Camera.setState(-0.7, -0.5, 2.1, 210, 0.0, 0)
        Camera.setThirdPerson(true)
      }
      mh = Player.getMainHandItem()
      mk = mh == none ? '' : mh.getName() + '#' + mh.getCount()
      if(mk != var.主手缓存){
        var.主手缓存 = mk
        主手图标 = mh == none ? '' : mh.toJson()
        val.主武器槽.setItemIcon(主手图标)
      }
      if(var.待过滤 || (var.searchText != none && var.searchText != '')){
        var.待过滤 = false
        q = var.searchText == none ? '' : var.searchText
        for(i in range(0, val.原版背包网格.childrenCount() - 1)){
          sl = val.原版背包网格.get(i)
          st = sl.getSlotItemStack()
          nm = st == none ? '' : st.getName()
          sl.alpha = (q == '' || nm.contains(q)) ? 1 : 0.3
        }
        for(i in range(0, val.快捷栏网格.childrenCount() - 1)){
          sl = val.快捷栏网格.get(i)
          st = sl.getSlotItemStack()
          nm = st == none ? '' : st.getName()
          sl.alpha = (q == '' || nm.contains(q)) ? 1 : 0.3
        }
        for(i in range(1, val.扩容网格.childrenCount() - 1)){
          sl = val.扩容网格.get(i)
          st = sl.getSlotItemStack()
          nm = st == none ? '' : st.getName()
          sl.alpha = (q == '' || nm.contains(q)) ? 1 : 0.3
        }
      }
      if(var.待重建){
        var.待重建 = false
        if(var.每页槽位数 == none){
          var.每页槽位数 = 54
        }
        if(var.页码增量 != 0){
          var.页码 = var.页码 + var.页码增量
          var.页码增量 = 0
        }
        if(var.activeCategory != var.已建分类){
          var.页码 = 0
        }
        槽位数 = var.slotCount == none ? 0 : var.slotCount.round()
        var.总页数 = 1
        while(槽位数 > var.总页数 * var.每页槽位数){
          var.总页数 = var.总页数 + 1
        }
        if(var.页码 > var.总页数 - 1){
          var.页码 = var.总页数 - 1
        }
        if(var.页码 < 0){
          var.页码 = 0
        }
        起始序号 = var.页码 * var.每页槽位数
        本页槽位数 = 槽位数 - 起始序号
        if(本页槽位数 > var.每页槽位数){
          本页槽位数 = var.每页槽位数
        }
        现有槽位数 = val.扩容网格.childrenCount() - 1
        if(现有槽位数 != 本页槽位数 || var.已建分类 != var.activeCategory || var.已建页码 != var.页码){
          var.刷新轮次 = var.刷新轮次 + 1
          while(val.扩容网格.childrenCount() > 1){
            val.扩容网格.get(1).remove()
          }
          if(var.activeCategory != none && var.activeCategory != '' && 本页槽位数 > 0){
            for(序号 in range(0, 本页槽位数 - 1)){
              if(val.扩容网格['扩容槽位'] != none) {
                slot = val.扩容网格['扩容槽位'].copy('扩容槽位_' + var.刷新轮次 + '_' + 序号.round())
                slot.id = 'axs_eb_' + var.activeCategory + '_' + (起始序号 + 序号).round()
                slot.visible = true
              }
            }
          }
          var.已建分类 = var.activeCategory
          var.已建页码 = var.页码
          var.待过滤 = true
        }
      }
    load: |-
      var.刷新轮次 = 0
      var.packetId = 'AXS_BACKPACK'
      var.buyAmount = 1
      var.capacityText = '0/0'
      var.maxCapacity = 0
      var.currencyText = ''
      var.slotCount = 0
      var.activeCategory = ''
      var.已建分类 = ''
      var.passwordCurrent = ''
      var.passwordNew = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.passwordPanel = {'visible': false, 'mode': ''}
      var.destroyPanel = {'visible': false}
      var.设置面板开 = false
      var.searchText = ''
      var.待过滤 = false
      var.yaw = -9999
      var.主手缓存 = none
      var.入场 = none
      var.相机计数 = 0
      var.图标已设 = false
      var.装载率 = 0
      var.装载容量 = 0
      var.密码标题 = '解锁行囊'
      var.密码动作 = '解锁'
      var.密码说明 = '输入二级密码后继续整理物品'
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.页码 = 0
      var.页码增量 = 0
      var.总页数 = 1
      var.已建页码 = -1
      var.待重建 = false
      // 扩容仓从 510 开始；72 槽 + 8 间距；预留翻页与快捷栏
      面板高 = var.viewH - 152
      行数 = 1
      while(510 + (行数 + 1) * 80 - 8 <= 面板高 - 186){
        行数 = 行数 + 1
      }
      var.每页槽位数 = 行数 * 9
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      面板高 = var.viewH - 152
      行数 = 1
      while(510 + (行数 + 1) * 80 - 8 <= 面板高 - 186){
        行数 = 行数 + 1
      }
      var.每页槽位数 = 行数 * 9
      var.待重建 = true
    open: |-
      Packet.send(var.packetId, 'refresh')
      var.入场 = Lerp(0, 1, 450)
      Camera.setState(-0.7, -0.5, 2.1, 210, 0.0, 600)
      Camera.setThirdPerson(true)
      val.金币图标.setItemIcon('{"id":"minecraft:gold_ingot","Count":1b}')
      val.点券图标.setItemIcon('{"id":"minecraft:emerald","Count":1b}')
    close: |-
      async {
        Camera.setThirdPerson(false)
        Camera.clearState()
      }
    keyPress: |-
      if(self.currentKeyPress() == "ESCAPE" || self.currentKeyPress() == "E"){
        Camera.setThirdPerson(false)
        Camera.clearState()
        Screen.close()
      }

controls:
  世界底色:
