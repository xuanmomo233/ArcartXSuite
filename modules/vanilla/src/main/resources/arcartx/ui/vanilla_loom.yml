ui:
  isHud: false
  match:
  - 织布机界面
  defaultOpen: true
  background: true
  escClose: true
  closeDied: true
  screenScale: true
  through: var.whLayoutEnabled && var.whAvailable && !var.carrying && !var.recipeOpen && val.warehouseGrid != none && val.warehouseGrid.isHovered()
    && var.whMenu == '' && !var.whPinHovered
  jei: false
  itemSize: 16
  hide:
  - hotbar
  - crosshair
  - player_state
  - experience_bar
  - chat_panel
  action:
    load: |-
      // 服务器在 UI 注册前写入仓库布局能力。
      var.whLayoutEnabled = false
      var.carrying = false
      var.whAvailable = false
      var.whResolved = false
      var.whRows = {}
      var.whDirty = false
      var.whToken = ''
      var.whSearch = ''
      var.whCategory = '全部'
      var.whSort = '默认'
      var.whPage = '—'
      var.whHasPrevious = false
      var.whHasNext = false
      var.whCount = '—'
      var.recipeOpen = false
      var.recipeResolved = false
      var.recipeHasNext = false
      var.recipes = {}
      var.recipeKeys = {}
      var.recipeDirty = false
      var.recipePage = 0
      var.recipeSearch = ''
      var.recipeName = '选择配方'
      var.recipeSelection = ''
      var.recipePageText = '1 / 1'
      var.onlyCraftable = false
      var.cook = 0
      var.burn = 0
      var.whMenu = ''
      var.whMenuPage = 0
      var.whMenuCount = 0
      var.whCategories = {}
      var.whCategoryCount = 0
      var.whSortOptions = {}
      var.whSortCount = 0
      var.whSearchTicks = 0
      var.whPageStep = 0
      var.recipePageStep = 0
      var.previewDirty = false
      var.whPinHovered = false
      var.fillBusy = false
      var.fillMessage = ''
      var.noticeActive = false
      var.noticeText = ''
      var.noticeDetail = ''
      var.noticeFade = Fade(80, 1000, 220)
      var.noticePeaked = false
      var.hasItem = false
      var.hasResult = false
      var.artisanStatus = '放入物品开始操作'
      var.artisanToken = ''
      var.mapInfo = ''
      var.canExtend = false
      var.canCopy = false
      var.canLock = false
      var.patternRows = {}
      var.patternToken = ''
      var.patternPage = 0
      var.patternPages = 1
      var.patternCount = 0
      var.selectedPattern = -1
      var.patternDirty = false
      var.bannerLayers = 0
      var.noticeLines = []
      var.noticeCount = 1
    open: |-
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeText = ''
      var.noticeDetail = ''
      if(var.whLayoutEnabled){Packet.send('AXS:vanilla_loom', 'warehouse_panel', 'open')}
      Packet.send('AXS:vanilla_loom', 'artisan_open')
      val.workshopHeaderIcon.setItemIcon('{"id":"minecraft:loom","Count":1b}')
    close: Packet.send('AXS:vanilla_loom', 'warehouse_panel', 'close', var.whToken)
    tick: |-
      carried = self.getCarriedItemStack()
      var.carrying = carried != none && carried.getCount() > 0
      if(var.whDirty && var.whCells != none){
        var.whDirty = false
        for(i in range(0, 23)){
          idx = i.round()
          cell = var.whCells[idx]
          row = var.whRows[idx]
          if(cell != none){
            cell['Hit'].id = row == none ? 'axs_wh_entry_empty' : row['clickId']
            cell['Icon'].setItemIcon(row == none ? '' : row['icon'])
          }
        }
      }
      if(var.whSearchTicks > 0){
        var.whSearchTicks = var.whSearchTicks - 1
        if(var.whSearchTicks == 0){ Packet.send('AXS:vanilla_loom', 'warehouse_panel', 'search', var.whSearch) }
      }
      if(var.whPageStep != 0){
        direction = var.whPageStep < 0 ? 'prev' : 'next'
        permitted = var.whPageStep < 0 ? var.whHasPrevious : var.whHasNext
        var.whPageStep = 0
        if(var.whAvailable && permitted){ Packet.send('AXS:vanilla_loom', 'warehouse_panel', 'page', direction) }
      }
      var.whPinHovered = false
      if(var.whCells != none){
        for(i in range(0, 23)){
          pinCell = var.whCells[i.round()]
          if(pinCell != none && pinCell['置顶按钮'].isHovered()){ var.whPinHovered = true }
        }
      }

      if(var.noticeActive){
        var.noticeOpacity = var.noticeFade.get()
        if(var.noticeOpacity > 0){ var.noticePeaked = true }
        if(var.noticePeaked && var.noticeOpacity <= 0){
          var.noticeActive = false
          var.noticePeaked = false
          var.noticeText = ''
          var.noticeDetail = ''
        }
      }

      if(var.patternDirty && var.patternCells != none){
      var.patternDirty = false
      for(i in range(0, 7)){
      cell = var.patternCells[i.round()]
      row = var.patternRows[(var.patternPage * 8 + i).round()]
      if(cell != none){cell['预览'].setItemIcon(row == none ? '' : row['icon'])}
      }
      }
  packetHandler:
    warehouse_panel: |-
      var.whAvailable = packet['available']
      var.whResolved = true
      var.whHasPrevious = var.whAvailable && packet['hasPreviousPage']
      var.whHasNext = var.whAvailable && packet['hasNextPage']
      if(var.whAvailable){
        var.whToken = packet['token']
        var.whRows = packet['rows']
        var.whPage = packet['page']
        var.whSort = packet['sort']
        var.whCategory = packet['category']
        var.whCount = packet['count']
      }else{
        var.whRows = {}
      }
      var.whDirty = true
      var.whCategories = var.whAvailable ? packet['categories'] : {}
      var.whCategoryCount = var.whAvailable ? packet['categoryCount'] : 0
      var.whSortOptions = var.whAvailable ? packet['sorts'] : {}
      var.whSortCount = var.whAvailable ? packet['sortCount'] : 0
    placement_state: |-
      var.fillBusy = packet['busy']
      var.fillMessage = packet['message']
      if(!packet['busy']){
        noticeMessage = packet['message']
        if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
          var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
          noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
          var.noticeLines = noticeWrapped.split('\n')
          var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
          var.noticeFade.reset()
          var.noticePeaked = false
          var.noticeActive = true
        }
      }
    ui_notice: |-
      noticeMessage = packet['message']
      if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
        var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
        noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = noticeWrapped.split('\n')
        var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
    artisan_state: |-
      var.hasItem = packet['hasItem']
      var.hasResult = packet['hasResult']
      var.artisanToken = packet['token']
      var.artisanStatus = packet['status']
      if(var.patternToken != packet['patternToken']){var.patternPage = 0}
      var.patternToken = packet['patternToken']
      var.patternRows = packet['patterns']
      var.patternCount = packet['patternCount']
      var.bannerLayers = packet['layers']
      var.patternPages = math.max(1, math.ceil(var.patternCount / 8))
      var.selectedPattern = packet['selected']
      var.patternDirty = true
