          # ─── 跨世界导航确认弹窗（模态遮罩，挡住下层一切点击）───
          跨世界确认层:
            type: Canvas
            attribute:
              point: ~stretch_all
              visible: "var.crossWorldPromptVisible"
            children:
              确认遮罩:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~0,0,0,160
              确认对话框:
                type: Canvas
                attribute:
                  point: ~middle_center
                  width: 480
                  height: 220
                children:
                  对话框底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~30,32,40,240
                      shape: ~round_rect
                      radius: 16
                    effect:
                      stroke:
                        width: 2
                        color: ~255,255,255,50
                  对话框标题:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 24
                      texts: "var.crossWorldPromptType == 'navigate' ? '&f跨世界导航' : '&f跨世界传送'"
                      fontSize: 32
                      through: true
                  对话框内容:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 72
                      texts: "var.crossWorldPromptType == 'teleport_world' ? ('&7是否传送到世界 &f' + var.crossWorldTargetName + '&7？') : ('&7目标位于 &f' + var.selectedWorldName + '&7，是否传送到该世界？')"
                      fontSize: 26
                      through: true
                  对话框费用:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 112
                      texts: "'&e传送费用: &f' + var.detailCrossWorldCostText"
                      fontSize: 26
                      visible: "var.crossWorldPromptType != 'teleport_world' && var.detailCrossWorldCostText != none && var.detailCrossWorldCostText != ''"
                      through: true
                  确认按钮:
                    type: Canvas
                    attribute:
                      point: ~bottom_left
                      x: 40
                      y: -24
                      width: 180
                      height: 52
                      enable: "var.actionToken != none"
                    action:
                      clickLeft: |-
                        var.crossWorldPromptVisible = false
                        // navigate=传送+追踪；teleport=锚点传送；teleport_world=世界出生点传送
                        if (var.crossWorldPromptType == 'teleport_world') {
                          var.actionBusy = true
                          Packet.send(var.packetId, 'teleport_to_world', var.crossWorldTargetWorld, var.actionToken)
                        } elif (var.crossWorldPromptType == 'teleport') {
                          var.actionBusy = true
                          Packet.send(var.packetId, 'teleport_anchor', var.detailSelectedId, var.actionToken)
                        } else {
                          Packet.send(var.packetId, 'cross_world_navigate', var.detailSelectedType + ':' + var.detailSelectedId, var.actionToken)
                        }
                    children:
                      确认底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~74,144,226,255
                          hover: ~94,164,246,255
                          shape: ~round_rect
                          radius: 12
                      确认文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "var.crossWorldPromptType == 'navigate' ? '&f传送并导航' : '&f传送'"
                          fontSize: 28
                          through: true
                  取消按钮:
                    type: Canvas
                    attribute:
                      point: ~bottom_right
                      x: -40
                      y: -24
                      width: 180
                      height: 52
                    action:
                      clickLeft: |-
                        var.crossWorldPromptVisible = false
                    children:
                      取消底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~52,56,64,255
                          hover: ~72,76,84,255
                          shape: ~round_rect
                          radius: 12
                      取消文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: ~&f取消
                          fontSize: 28
                          through: true
