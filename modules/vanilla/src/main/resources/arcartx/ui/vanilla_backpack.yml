  through: var.whAvailable && !var.carrying && !var.设置面板开 && !var.passwordPanel['visible'] && !var.destroyPanel['visible'] && val.扩容网格 != none
    && val.扩容网格.isHovered() && !var.whPinHovered
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    update: |-
      var.actionToken = packet['action_token']
      var.canSortBackpack = packet['canSortBackpack'] == true
      var.goldBalance = packet['goldBalance']
      var.pointsBalance = packet['pointsBalance']
      var.capacityText = packet['capacityText']
      var.maxCapacity = packet['maxCapacity']
      var.canBuySlots = packet['canBuySlots']
      var.buySlotsText = packet['buySlotsText'] == none ? '' : packet['buySlotsText']
      var.remainingSlots = packet['remainingSlots']
      var.initialCapacity = packet['initialCapacity']
      var.slotPriceKnown = packet['slotPriceAmount'] != none
      var.slotPriceAmount = type.toNumber(packet['slotPriceAmount'])
      var.slotPriceCurrency = packet['slotPriceCurrency']
      var.slotCurrencyName = var.slotPriceCurrency == 'gold' || var.slotPriceCurrency == 'money' ? '金币' : (var.slotPriceCurrency == 'points' ? '点券' : var.slotPriceCurrency)
      var.passwordPanel = packet['passwordPanel']
      var.destroyPanel = packet['destroyPanel']
      var.actionBusy = false
    balances: |-
      if(packet['goldBalance'] != none){
        var.goldBalance = packet['goldBalance']
      }
      if(packet['pointsBalance'] != none){
        var.pointsBalance = packet['pointsBalance']
      }
    warehouse_panel: |-
      var.whAvailable = packet['available']
      if(var.whAvailable){
        var.whToken = packet['token']
        var.whRows = packet['rows']
        var.whPage = packet['page']
        var.whHasPrevious = packet['hasPreviousPage']
        var.whHasNext = packet['hasNextPage']
        var.whSort = packet['sort']
        var.capacityText = packet['count']
        var.categories = packet['categories']
        var.categoryCount = packet['categoryCount']
      }else{
        var.whRows = {}
        var.categories = {}
        var.categoryCount = 0
        var.whHasPrevious = false
        var.whHasNext = false
      }
      if(var.categoryOffset >= var.categoryCount){
        var.categoryOffset = 0
      }
      if(var.categoryOffset == 0){
        var.categoryDirection = 1
      }else{
        if(var.categoryOffset + 6 >= var.categoryCount){
          var.categoryDirection = -1
        }
      }
      var.whDirty = true
      var.whResolved = true
    ui_notice: |-
      noticeMessage = packet['message']
      if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
        var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
        noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = noticeWrapped.split('\n')
        var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
        noticeLongest = 0
        for(i in range(0, var.noticeCount - 1)){
          noticeLongest = math.max(noticeLongest, var.noticeLines.get(i.round()).length())
        }
        var.noticeWidth = math.max(320, math.min(560, noticeLongest * 18 + 88))
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    tick: |-
      // 相机偏转保持：玩家转向后重设状态相机（与 menu_esc 相同模式）
      if(server.player_yaw != var.yaw && (var.backpackEnter == none || var.backpackEnter.get() >= 1)){
        var.yaw = server.player_yaw
        Camera.setState(-0.7, -0.5, 2.1, 210, 0.0, 600)
      }
      // 主武器 Icon 槽随主手物品变化刷新
      mh = Player.getMainHandItem()
      mk = mh == none ? '' : mh.getName() + '#' + mh.getCount()
      if(val.主武器槽 != none && mk != var.主手缓存){
        var.主手缓存 = mk
        val.主武器槽.setItemIcon(mh == none ? '' : mh.toJson())
      }
      carried = self.getCarriedItemStack()
      var.carrying = carried != none && carried.getCount() > 0
      if(var.searchTicks > 0){
        var.searchTicks = var.searchTicks - 1
        if(var.searchTicks == 0){
          Packet.send(var.packetId, 'warehouse_panel', 'search', var.searchText)
        }
      }
      if(var.warehousePageStep != 0){
        direction = var.warehousePageStep < 0 ? 'prev' : 'next'
        var.warehousePageStep = 0
        Packet.send(var.packetId, 'warehouse_panel', 'page', direction)
      }
      if(var.whDirty && var.whCells != none){
        var.whDirty = false
        for(i in range(0, 35)){
          index = i.round()
          cell = var.whCells[index]
          row = var.whRows[index]
          if(cell != none){
            cell['Hit'].id = row == none ? 'axs_wh_entry_empty' : row['clickId']
            cell['Icon'].setItemIcon(row == none ? '' : row['icon'])
          }
        }
      }
      var.whPinHovered = false
      if(var.whCells != none){
        for(i in range(0, 35)){
          pinCell = var.whCells[i.round()]
          if(pinCell != none && pinCell['置顶按钮'].isHovered()){ var.whPinHovered = true }
        }
      }

      if(var.noticeActive){
        var.noticeOpacity = var.noticeFade.get()
        if(var.noticeOpacity > 0){ var.noticePeaked = true }
        if(var.noticePeaked && var.noticeOpacity <= 0){
          var.noticeActive = false
          var.noticePeaked = false
          var.noticeText = ''
        }
      }
    load: |-
      var.packetId = 'AXS_VANILLA_BACKPACK'
      var.buyAmount = 1
      var.remainingSlots = 0
      var.initialCapacity = 0
      var.slotPriceKnown = false
      var.slotPriceAmount = 0
      var.slotPriceCurrency = ''
      var.slotCurrencyName = ''
      var.buySlotsText = ''
      var.canBuySlots = false
      var.capacityText = '—'
      var.maxCapacity = 0
      var.passwordCurrent = ''
      var.passwordNew = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.passwordPanel = {'visible': false, 'mode': ''}
      var.destroyPanel = {'visible': false}
      var.设置面板开 = false
      var.searchText = ''
      // 服务端在注册 UI 前写入此标记；布局不依赖物品数据包。
      var.whLayoutEnabled = false
      // Vanilla 注册 UI 时写入时长，0 关闭入场转场。
      var.backpackTransitionMs = 0
      var.backpackEnter = none
      var.whResolved = false
      var.whAvailable = false
      var.whToken = ''
      var.whRows = {}
      var.whPage = '—'
      var.whHasPrevious = false
      var.whHasNext = false
      var.goldBalance = '—'
      var.pointsBalance = '—'
      var.whSort = '默认排序'
      var.whDirty = false
      var.warehousePageStep = 0
      var.categories = {}
      var.categoryCount = 0
      var.categoryOffset = 0
      var.categoryDirection = 1
      var.searchTicks = 0
      var.carrying = false
      var.yaw = -9999
      var.主手缓存 = none
      // Adaptive 以 1920x1080 等比缩放，换算设计坐标系下的可用视口
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.whPinHovered = false
      var.noticeActive = false
      var.noticeText = ''
      var.noticeFade = Fade(70, 650, 180)
      var.noticePeaked = false
      var.noticeLines = []
      var.noticeCount = 1
      var.noticeWidth = 320
      var.actionToken = ''
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
    open: |-
      var.backpackEnter = none
      if (var.backpackTransitionMs > 0) {
        var.backpackEnter = Q2(0, 1, 1, var.backpackTransitionMs)
        var.backpackEnter.reset()
        var.yaw = server.player_yaw
      }
      var.actionToken = ''
      var.canSortBackpack = false
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeText = ''
      var.noticeLines = []
      var.noticeCount = 1
      var.noticeWidth = 320
      if(var.whLayoutEnabled){
        Packet.send(var.packetId, 'warehouse_panel', 'open')
      }
      Packet.send(var.packetId, 'refresh')
      Camera.setState(-0.7, -0.5, 2.1, 210, 0.0, var.backpackTransitionMs > 0 ? var.backpackTransitionMs : 600)
      Camera.setThirdPerson(true)
      // 顶栏货币图标（原版物品 NBT，按服务器喜好更换）
      val.金币图标.setItemIcon('{"id":"minecraft:gold_ingot","Count":1b}')
      val.点券图标.setItemIcon('{"id":"minecraft:emerald","Count":1b}')
      val.portableWorkbenchIcon.setItemIcon('{"id":"minecraft:crafting_table","Count":1b}')
    close: |-
      Packet.send(var.packetId, 'warehouse_panel', 'close', var.whToken)
      async {
        Camera.setThirdPerson(false)
        Camera.clearState()
      }
