name: ArcartX-Suite
version: '${version}'
main: xuanmo.arcartxsuite.ArcartXSuitePlugin
api-version: '1.20'
load: POSTWORLD
depend:
  - ArcartX
softdepend:
  - Chemdah
  - Adyeshach
  - MythicMobs
  - MythicBukkit
  - MythicLib
  - MMOItems
  - PlaceholderAPI
  - AttributePlus
  - CraneAttribute
  - Vault
  - PlayerPoints
  - Rondo
  - NeigeItems
  - AuthMe
  - Symphony
  - Overture
commands:
  ess:
    description: Essentials 玩家命令（/axs essentials 缩写）
    usage: /ess <action> [args...]
    aliases: [axsess]
    permission: axs.essentials.menu
  # ─── Essentials 简写别名（预置，可在 ArcartXEssentials.yml command-aliases 中增删）───
  fly:
    description: 飞行开关
    usage: /<command> [player]
    permission: axs.essentials.fly
  god:
    description: 无敌开关
    usage: /<command> [player]
    permission: axs.essentials.god
  gm:
    description: 游戏模式切换
    usage: /<command> <0|1|2|3|s|c|a|sp|survival|creative|adventure|spectator> [player]
    permission: axs.essentials.gamemode
  heal:
    description: 治疗
    usage: /<command> [player]
    permission: axs.essentials.heal
  feed:
    description: 喂食
    usage: /<command> [player]
    permission: axs.essentials.feed
  tp:
    description: 传送到玩家
    usage: /<command> <player> [target]
    permission: axs.essentials.teleport
  top:
    description: 传送到顶部
    usage: /<command>
    permission: axs.essentials.teleport
  back:
    description: 返回上次位置
    usage: /<command>
    permission: axs.essentials.back
  home:
    description: 传送到家
    usage: /<command> [name]
    permission: axs.essentials.home
  sethome:
    description: 设置家
    usage: /<command> [name]
    permission: axs.essentials.sethome
  delhome:
    description: 删除家
    usage: /<command> [name]
    permission: axs.essentials.delhome
  warp:
    description: 传送到传送点
    usage: /<command> <name>
    permission: axs.essentials.warp
  setwarp:
    description: 设置传送点
    usage: /<command> <name>
    permission: axs.essentials.setwarp
  delwarp:
    description: 删除传送点
    usage: /<command> <name>
    permission: axs.essentials.delwarp
  spawn:
    description: 传送到出生点
    usage: /<command>
    permission: axs.essentials.spawn
  setspawn:
    description: 设置出生点
    usage: /<command>
    permission: axs.essentials.setspawn
  tpa:
    description: 发送传送请求
    usage: /<command> <player>
    permission: axs.essentials.tpa
  tpahere:
    description: 发送传送到此请求
    usage: /<command> <player>
    permission: axs.essentials.tpa
  tpaccept:
    description: 接受传送请求
    usage: /<command>
    permission: axs.essentials.tpa
  tpdeny:
    description: 拒绝传送请求
    usage: /<command>
    permission: axs.essentials.tpa
  tppos:
    description: 传送到坐标
    usage: /<command> <x> <y> <z>
    permission: axs.essentials.teleport
  vanish:
    description: 隐身开关
    usage: /<command>
    permission: axs.essentials.vanish
  hat:
    description: 戴帽子
    usage: /<command>
    permission: axs.essentials.hat
  repair:
    description: 修复手持物品
    usage: /<command>
    permission: axs.essentials.repair
  enderchest:
    description: 打开末影箱
    usage: /<command> [player]
    permission: axs.essentials.enderchest
  workbench:
    description: 打开工作台
    usage: /<command>
    permission: axs.essentials.workbench
  anvil:
    description: 打开铁砧
    usage: /<command>
    permission: axs.essentials.anvil
  trash:
    description: 打开垃圾桶
    usage: /<command>
    permission: axs.essentials.trash
  nick:
    description: 设置昵称
    usage: /<command> <nick|off>
    permission: axs.essentials.nick
  seen:
    description: 查看玩家信息
    usage: /<command> <player>
    permission: axs.essentials.seen
  inv:
    description: 查看玩家背包
    usage: /<command> <player>
    permission: axs.essentials.inv
  sit:
    description: 坐下
    usage: /<command>
    permission: axs.essentials.sit
  lay:
    description: 躺下
    usage: /<command>
    permission: axs.essentials.lay
  sort:
    description: 整理背包
    usage: /<command>
    permission: axs.essentials.sort
  speed:
    description: 设置速度
    usage: /<command> <fly|walk> <1-10>
    permission: axs.essentials.speed
  time:
    description: 设置时间
    usage: /<command> <day|night|noon|midnight|set <ticks>>
    permission: axs.essentials.time
  weather:
    description: 设置天气
    usage: /<command> <clear|rain|thunder>
    permission: axs.essentials.weather
  ban:
    description: 封禁玩家
    usage: /<command> <player> [reason]
    permission: axs.essentials.ban
  tempban:
    description: 临时封禁
    usage: /<command> <player> <duration> [reason]
    permission: axs.essentials.ban
  unban:
    description: 解封
    usage: /<command> <player>
    permission: axs.essentials.unban
  mute:
    description: 禁言
    usage: /<command> <player> [reason]
    permission: axs.essentials.mute
  tempmute:
    description: 临时禁言
    usage: /<command> <player> <duration> [reason]
    permission: axs.essentials.mute
  unmute:
    description: 解除禁言
    usage: /<command> <player>
    permission: axs.essentials.unmute
  kick:
    description: 踢出玩家
    usage: /<command> <player> [reason]
    permission: axs.essentials.kick
  warn:
    description: 警告玩家
    usage: /<command> <player> [reason]
    permission: axs.essentials.warn
  sudo:
    description: 以玩家身份执行命令
    usage: /<command> <player> <command>
    permission: axs.essentials.sudo
  rg:
    description: Regions 玩家命令（/axs regions 缩写）
    usage: /rg <action> [args...]
    aliases: [axsrg]
    permission: axs.regions.select
  afk:
    description: 玩家挂机命令
    usage: /<command> [toggle|status|start <区域>|end|list|top]
    aliases: [axsafk]
    permission: arcartxsuite.afkreward.use
  afkreward:
    description: 玩家挂机奖励命令
    usage: /<command> [toggle|status|start <区域>|end|list|top]
    aliases: [axsafkreward]
    permission: arcartxsuite.afkreward.use
  arcartxsuite:
    description: ArcartXSuite 管理命令
    usage: /axs help [module] | /axs <module> help | /axs status|reload
    aliases: [axs]
    permission: arcartxsuite.admin
  title:
    description: 玩家称号命令
    usage: /<command> open|equip <titleId>|unequip <groupId|all>|hide <titleId>|unhide <titleId>
    aliases: [axstitle]
    permission: arcartxsuite.title.use
  warehouse:
    description: 玩家仓库命令
    usage: /<command> [open]
    aliases: [wh, axswarehouse]
    permission: arcartxsuite.warehouse.use
  mail:
    description: 玩家邮箱命令
    usage: /<command> open|compose|claimall|deleteall|cdk <code>
    aliases: [axsmail]
    permission: arcartxsuite.mail.use
  chat:
    description: 玩家聊天命令
    usage: /<command> channel|toggle|ignore|unignore|socialspy|redpacket <normal|lucky> <金额> <个数> [祝福]|grab <id>
    aliases: [axschat]
    permission: arcartxsuite.chat.use
  msg:
    description: 玩家私聊命令
    usage: /<command> <player> <message>
    aliases: [axsmsg]
    permission: arcartxsuite.chat.msg
  reply:
    description: 玩家回复私聊命令
    usage: /<command> <message>
    aliases: [r, axsreply]
    permission: arcartxsuite.chat.msg
  onlinerewards:
    description: 玩家在线奖励与签到命令
    usage: /<command> open|status|signin|top <daily|weekly|monthly|total> [page]
    aliases: [axsonlinerewards]
    permission: arcartxsuite.onlinerewards.use
  signin:
    description: 签到命令（onlinerewards 别名）
    usage: /<command> open|status|signin|top <daily|weekly|monthly|total> [page]
    aliases: [axssignin]
    permission: arcartxsuite.onlinerewards.use
  questgps:
    description: 玩家任务导航命令
    usage: /<command> open|cleartrack|hud [on|off|toggle]
    aliases: [axsquestgps]
    permission: arcartxsuite.questgps.use
  tab:
    description: Tab 列表玩家命令（管理命令见 /axs tab）
    usage: /<command> view [name]|page <id> <next|prev|N>|refresh
    aliases: [axstab]
    permission: arcartxsuite.tab.use
  map:
    description: 玩家地图命令
    usage: /<command> open [world]|hud [on|off|toggle]|cleartrack
    aliases: [axsmap]
    permission: arcartxsuite.map.use
  market:
    description: 全球市场命令（拍卖行/系统商店/回收）
    usage: /<command> [shop|auction|sell|recycle|history|my|search|cancel]
    aliases: [mk, ah, axsmarket]
    permission: arcartxsuite.market.use
  pickup:
    description: 玩家拾取功能开关
    usage: /<command> [on|off|status]
    aliases: [axspickup]
    permission: arcartxsuite.pickup.use
  qqbot:
    description: QQ机器人绑定命令
    usage: /<command> bind <验证码>|unbind|info
    aliases: [axsqqbot]
    permission: arcartxsuite.qqbot.use
  menu:
    description: 玩家菜单命令
    usage: /<command> open <菜单ID>|list
    aliases: [axsmenu]
    permission: arcartxsuite.menu.use
  fishing:
    description: 玩家钓鱼命令
    usage: /<command> [sell|sell all]
    aliases: [axsfishing]
    permission: arcartxsuite.fishing.use
  lottery:
    description: 玩家抽奖命令
    usage: /<command> <open|info|history> <奖池ID> | claim | help
    aliases: [axslottery]
    permission: arcartxsuite.lottery.use
  bp:
    description: 玩家战令命令
    usage: /<command> [open|tasks|help]
    aliases: [battlepass, axsbp]
    permission: arcartxsuite.battlepass.use
permissions:
  arcartxsuite.admin:
    default: op
  arcartxsuite.title.use:
    default: true
  arcartxsuite.warehouse.use:
    default: true
  arcartxsuite.mail.use:
    default: true
  arcartxsuite.mail.send:
    default: true
  arcartxsuite.mail.admin:
    default: op
  arcartxsuite.chat.use:
    default: true
  arcartxsuite.chat.msg:
    default: true
  arcartxsuite.chat.ignore:
    default: true
  arcartxsuite.chat.socialspy:
    default: op
  arcartxsuite.chat.mute:
    default: op
  arcartxsuite.chat.redpacket.send:
    default: true
  arcartxsuite.chat.redpacket.claim:
    default: true
  arcartxsuite.chat.redpacket.admin:
    default: op
  arcartxsuite.onlinerewards.use:
    default: true
  arcartxsuite.onlinerewards.time.1_5:
    default: false
  arcartxsuite.onlinerewards.time.2:
    default: false
  arcartxsuite.onlinerewards.signin.bonus:
    default: false
  arcartxsuite.questgps.use:
    default: true
  arcartxsuite.map.use:
    default: true
  arcartxsuite.tab.use:
    default: true
  axs.tab.debug:
    default: op
  arcartxsuite.map.admin:
    default: op
  arcartxsuite.market.use:
    default: true
  arcartxsuite.market.admin:
    default: op
  arcartxsuite.pickup.use:
    default: true
  # ─── Essentials ───
  axs.essentials.fly:
    default: op
  axs.essentials.god:
    default: op
  axs.essentials.heal:
    default: op
  axs.essentials.feed:
    default: op
  axs.essentials.gamemode:
    default: op
  axs.essentials.speed:
    default: op
  axs.essentials.vanish:
    default: op
  axs.essentials.vanish.see:
    default: op
  axs.essentials.afk:
    default: true
  axs.essentials.afk.exempt:
    default: op
  axs.essentials.back:
    default: true
  axs.essentials.repair:
    default: op
  axs.essentials.hat:
    default: true
  axs.essentials.enderchest:
    default: op
  axs.essentials.workbench:
    default: true
  axs.essentials.anvil:
    default: true
  axs.essentials.trash:
    default: true
  axs.essentials.nick:
    default: op
  axs.essentials.seen:
    default: op
  axs.essentials.home:
    default: true
  axs.essentials.warp:
    default: true
  axs.essentials.spawn:
    default: true
  axs.essentials.tpa:
    default: true
  axs.essentials.tp:
    default: op
  axs.essentials.top:
    default: true
  axs.essentials.tppos:
    default: op
  axs.essentials.time:
    default: op
  axs.essentials.weather:
    default: op
  axs.essentials.ban:
    default: op
  axs.essentials.unban:
    default: op
  axs.essentials.mute:
    default: op
  axs.essentials.unmute:
    default: op
  axs.essentials.kick:
    default: op
  axs.essentials.warn:
    default: op
  axs.essentials.sudo:
    default: op
  axs.essentials.inv:
    default: op
  axs.essentials.sit:
    default: true
  axs.essentials.lay:
    default: true
  axs.essentials.treecap:
    default: false
  axs.essentials.replant:
    default: false
  axs.essentials.sort:
    default: true
  axs.essentials.autotool:
    default: true
  axs.essentials.admin:
    default: op
  axs.essentials.menu:
    default: true
  # ─── Regions ───
  axs.regions.select:
    default: true
  axs.regions.admin:
    default: op
  axs.regions.bypass:
    default: op
  axs.regions.bypass.limit:
    default: op
  # ─── Menu ───
  arcartxsuite.menu.use:
    default: true
  axs.menu.reload:
    default: op
  axs.menu.open.other:
    default: op
  # ─── QQBot ───
  arcartxsuite.qqbot.use:
    default: true
  arcartxsuite.qqbot.admin:
    default: op
  # ─── Fishing ───
  arcartxsuite.fishing.use:
    default: true
  # ─── Lottery ───
  arcartxsuite.lottery.use:
    default: true
  # ─── BattlePass ───
  arcartxsuite.battlepass.use:
    default: true
