ui:
  isHud: false
  defaultOpen: false
  show: true
  background: false
  through: false
  escClose: true
  closeDied: true
  screenScale: true
  level: 7
  hide:
    - "hotbar"
    - "experience_bar"
    - "crosshair"
    - "item_name"
    - "jump_bar"
    - "mount_health"
    - "player_state"
    - "player_health"
    - "armor_level"
    - "food_level"
    - "air_level"
  packetHandler:
    credentials: "var.token = packet['token']"
    list: |-
      var.scope = packet['scope']
      var.listRows = packet['rows']
      var.listPage = packet['page']
      var.listPages = packet['pages']
    detail: |-
      if(var.selected != packet['id']){
        var.pane = ''
        var.deleteArmed = false
        var.messageTarget = ''
      }
      var.selected = packet['id']
      var.isWorld = packet['world']
      var.title = packet['title']
      var.subtitle = packet['subtitle']
      var.priority = packet['priority']
      var.parent = packet['parent']
    rules: |-
      var.pane = 'rules'
      var.category = packet['category']
      var.messageTarget = ''
      var.ruleRows = packet['rows']
      var.rulePage = packet['page']
      var.rulePages = packet['pages']
    members: |-
      var.pane = 'members'
      var.memberRows = packet['rows']
      var.memberPage = packet['page']
      var.memberPages = packet['pages']
    materials: |-
      var.pane = 'materials'
      var.materialRows = packet['rows']
      var.materialPage = packet['page']
      var.materialPages = packet['pages']
    settings: |-
      var.pane = 'settings'
      var.deleteArmed = false
    notice: |-
      var.notice = packet['text']
      if(var.notice == '已保存'){ var.creating = false }
  action:
    load: |-
      var.packetId = 'AXS_REGIONS_ADMIN'
      var.token = ''
      var.scope = 'regions'
      var.selected = ''
      var.isWorld = false
      var.title = ''
      var.subtitle = ''
      var.priority = ''
      var.parent = ''
      var.pane = ''
      var.category = 'block'
      var.notice = ''
      var.deleteArmed = false
      var.creating = false
      var.messageTarget = ''
      var.messageTitle = ''
      var.listRows = []
      var.listPage = 0
      var.listPages = 1
      var.ruleRows = []
      var.rulePage = 0
      var.rulePages = 1
      var.memberRows = []
      var.memberPage = 0
      var.memberPages = 1
      var.materialRows = []
      var.materialPage = 0
      var.materialPages = 1
