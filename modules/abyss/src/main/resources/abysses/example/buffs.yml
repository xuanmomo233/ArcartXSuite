# ═══ 增益选择池（元气骑士式三选一天赋/祝福）═══
# buff_offer <池id> 触发：层间 Boss 清完、祭坛供奉后发起。
# candidates=3 → 面板三选一；timeout-auto: random → 超时随机兜底。
pools:
  # 祭坛祝福（f1_altar 供奉 15 金币）
  altar_pool:
    name: "祭坛祝福"
    pick: 1
    candidates: 3
    presentation: panel
    timeout: 30
    timeout-auto: random
    options:
      - id: holy_light
        name: "&e圣光庇佑"
        icon: TOTEM_OF_UNDYING
        rarity: epic
        weight: 8
        desc:
          - "伤害减免，屹立不倒"
        effects:
          - "apply_attribute @trigger damage_resistance 20 percent"
          - "message @trigger &d✦ &e圣光庇佑 &7已生效"
          - "sound @trigger BLOCK_BEACON_ACTIVATE 1 1.2"
      - id: vampire_edge
        name: "&c嗜血锋刃"
        icon: NETHERITE_SWORD
        rarity: epic
        weight: 8
        desc:
          - "攻击伤害 +20%"
        effects:
          - "apply_attribute @trigger attack_damage 20 percent"
          - "message @trigger &d✦ &c嗜血锋刃 &7已生效"
      - id: guardian_skin
        name: "&b守护之肤"
        icon: DIAMOND_CHESTPLATE
        rarity: rare
        weight: 12
        desc:
          - "护甲与韧性提升"
        effects:
          - "apply_potion @trigger RESISTANCE 0 9999"
          - "message @trigger &d✦ &b守护之肤 &7已生效"
      - id: altar_gold
        name: "&6献金回馈"
        icon: GOLD_INGOT
        rarity: common
        weight: 15
        desc:
          - "返还 10 金币"
        effects:
          - "addvar coins 10"
          - "message @trigger &d✦ 祭坛吐回 &e10 &7金币"

  # 第 1 层 Boss 后·三选一天赋
  f1_blessing:
    name: "首层天赋"
    pick: 1
    candidates: 3
    presentation: panel
    timeout: 25
    timeout-auto: random
    options:
      - id: sharp_edge
        name: "&c利刃"
        icon: IRON_SWORD
        rarity: rare
        weight: 10
        desc:
          - "攻击伤害 +15%"
        effects:
          - "apply_attribute @trigger attack_damage 15 percent"
          - "message @trigger &d✦ &c利刃 &7已生效"
          - "sound @trigger BLOCK_ENCHANTMENT_TABLE_USE 1 1.2"
      - id: swift_feet
        name: "&b疾风"
        icon: FEATHER
        rarity: common
        weight: 15
        desc:
          - "移动速度提升"
        effects:
          - "apply_potion @trigger SPEED 1 9999"
          - "message @trigger &d✦ &b疾风 &7已生效"
      - id: thick_blood
        name: "&a厚血"
        icon: APPLE
        rarity: common
        weight: 15
        desc:
          - "生命上限提升并治疗"
        effects:
          - "apply_attribute @trigger max_health 6 flat"
          - "heal @trigger 8"
          - "message @trigger &d✦ &a厚血 &7已生效"
      - id: ember_mark
        name: "&6余烬烙印"
        icon: BLAZE_POWDER
        rarity: epic
        weight: 5
        desc:
          - "获得余烬标记与抗火"
          - "（写入实例变量供脚本做分支）"
        effects:
          - "setvar buff_ember_mark 1"
          - "apply_potion @trigger FIRE_RESISTANCE 0 9999"
          - "message @trigger &d✦ &6余烬烙印 &7已烙下"

  # 第 2 层 Boss 后·三选一天赋（更激进的取舍）
  f2_blessing:
    name: "二层天赋"
    pick: 1
    candidates: 3
    presentation: panel
    timeout: 25
    timeout-auto: random
    options:
      - id: berserk
        name: "&4狂战"
        icon: NETHERITE_AXE
        rarity: epic
        weight: 8
        desc:
          - "攻速与力量大幅提升"
          - "代价：防御力下降"
        effects:
          - "apply_potion @trigger STRENGTH 1 9999"
          - "apply_attribute @trigger armor -4 flat"
          - "message @trigger &d✦ &4狂战 &7已生效——以攻为守！"
      - id: iron_faith
        name: "&7铁壁"
        icon: SHIELD
        rarity: rare
        weight: 10
        desc:
          - "护甲 +6，获得抗性"
        effects:
          - "apply_attribute @trigger armor 6 flat"
          - "apply_potion @trigger RESISTANCE 0 9999"
          - "message @trigger &d✦ &7铁壁 &7已生效"
      - id: swift_reload
        name: "&b迅捷"
        icon: SUGAR
        rarity: rare
        weight: 10
        desc:
          - "速度 II，身法如风"
        effects:
          - "apply_potion @trigger SPEED 2 9999"
          - "apply_potion @trigger JUMP_BOOST 1 9999"
          - "message @trigger &d✦ &b迅捷 &7已生效"
      - id: gold_lust
        name: "&6掘金"
        icon: GOLD_NUGGET
        rarity: common
        weight: 12
        desc:
          - "立即获得 20 金币"
        effects:
          - "addvar coins 20"
          - "message @trigger &d✦ 囊中 +20 金币"
