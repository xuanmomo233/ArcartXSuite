          height: 720
        children:
          # ── 面板背景层 ─────────────────────────────────────
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~28,30,42,244
              shape: ~round_rect
              radius: 24
            effect:
              gradient:
                color1: ~38,42,58,255
                color2: ~28,30,42,255
                type: 0
                angleDeg: 90
              stroke:
                width: 2
                color: ~90,170,255,150
              shadow:
                xOffset: 0
                yOffset: 6
                blur: 20
                color: ~0,0,0,160
          内描边:
            type: Texture
            attribute:
              point: ~middle_center
              width: 1184
              height: 704
              normal: ~0,0,0,0
              shape: ~round_rect
              radius: 20
              through: true
            effect:
              stroke:
                width: 1
                color: ~90,170,255,60
          顶部高光:
            type: Texture
            attribute:
              point: ~horizontal_stretch_top
              height: 180
              normal: ~255,255,255,0
              shape: ~round_rect
              radius: 24
              through: true
            effect:
              gradient:
                color1: ~90,170,255,30
                color2: ~90,170,255,0
