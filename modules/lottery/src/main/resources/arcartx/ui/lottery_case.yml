# 文件用途: CS 开箱风格抽奖界面（AXS:lottery_case）的客户端 UI 配置。
# 本文件只负责渲染与交互回传，抽奖逻辑、消耗校验、奖励发放全部在服务端。
# 界面结构: Adaptive 全视口绒幕 -> 左侧机械奖励柜 + 右侧预览抽屉 -> 价格/开箱确认台 + 转轴/结果/历史/详情弹层。
# 开箱流程为「包驱动」: 点击只发请求并进入等待态，result / batch_result 到达后才揭晓。
# 视觉目标: 梅紫绒幕与古金机械奖励柜；左侧箱体、右侧预览抽屉、底部价格与开箱动作分区。

# 若服务端只回 update（消耗不足等失败情形），等待态会被自动解除，界面不会卡死。
ui:
  isHud: false

  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段与 init 完全相同，用于切换奖池、抽奖结束后刷新界面数据。
    # 额外职责: 若处于等待态但本次没有结果包（抽奖失败），解除等待态并回到主面板。
    update: |-
      var.costTenIconJsons = {}
      var.动画卡片列表 = {}
      var.奖励卡片列表 = {}
      var.packetId = packet['packetId']
      var.poolName = packet['poolName']
      var.poolDescription = packet['poolDescription']
      var.actionToken = packet['action_token']
      var.costRows = packet['costRows'] != none ? packet['costRows'] : {}
      var.costTenRows = packet['costTenRows'] != none ? packet['costTenRows'] : {}
      var.tenAvailable = packet['tenAvailable'] == true
      // itemJson 分离模式（§7）：从 packet 顶层字段构建图标字典
      if(var.costRows != none){
        for(key in var.costRows.keys()){
          json = packet['costIconJson' + key]
          var.costIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      if(var.costTenRows != none){
        for(key in var.costTenRows.keys()){
          json = packet['costTenIconJson' + key]
          var.costTenIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      // 资源充足检查（owned < 0 表示余额未知，不判定为不足）
      var.canPull = true
      if(var.costRows != none){
        for(key in var.costRows.keys()){
          row = var.costRows[key]
          if(row != none && row['owned'] != none && row['owned'] >= 0 && row['amount'] != none && row['owned'] < row['amount']){
            var.canPull = false
          }
        }
      }
      var.canPullTen = true
      if(var.costTenRows != none){
        for(key in var.costTenRows.keys()){
          row = var.costTenRows[key]
          if(row != none && row['owned'] != none && row['owned'] >= 0 && row['amount'] != none && row['owned'] < row['amount']){
            var.canPullTen = false
          }
        }
      }
      var.items = packet['items'] != none ? packet['items'] : {}
      var.itemCount = packet['itemCount'] != none ? packet['itemCount'] : 0
      // Java 端直接发送 itemJsons 字典，UI 端无需循环构建
      var.itemJsons = packet['itemJsons'] != none ? packet['itemJsons'] : {}
      var.rarityNames = packet['rarityNames'] != none ? packet['rarityNames'] : (var.rarityNames != none ? var.rarityNames : {})
      // 奖池预览网格: 按实际奖品数量重建，模板占第 1 条数据
      // 注意: get(index)/['name'] 对 packetHandler 中动态创建的子控件不可靠，
      // 改用 get(0) 获取 YAML 模板，复制时保存引用到 var.奖励卡片列表，seticon 阶段直接用引用。
      目标数 = var.itemCount.round()
      现有数 = val.奖励网格.childrenCount() - 1
      if(现有数 != 目标数 - 1){
        // 用保存的引用移除旧复制卡片
        if(var.奖励卡片列表 != none){
          for(key in var.奖励卡片列表.keys()){
            if(key != 1){
              old = var.奖励卡片列表[key]
              if(old != none){
                old.remove()
              }
            }
          }
        }
        var.奖励卡片轮次 = (var.奖励卡片轮次 + 1).round()
        if(val.奖励网格 != none) {
          模板 = val.奖励网格.get(0)
          var.奖励卡片列表[1.round()] = 模板
          if(模板 != none){
            模板.entryKey = 1.round()
            模板['卡片底'].entryKey = 1.round()
            模板['稀有度条'].entryKey = 1.round()
            模板['物品槽'].entryKey = 1.round()
            模板['物品名'].entryKey = 1.round()
          }
          if(目标数 > 1){
            for(i in range(1, 目标数 - 1)){
              if(模板 != none){
                e = 模板.copy('奖励卡片_' + var.奖励卡片轮次 + '_' + i.round())
                e.entryKey = (i + 1).round()
                e['卡片底'].entryKey = (i + 1).round()
                e['稀有度条'].entryKey = (i + 1).round()
                e['物品槽'].entryKey = (i + 1).round()
                e['物品名'].entryKey = (i + 1).round()
                var.奖励卡片列表[(i + 1).round()] = e
              }
            }
          }
        }
      }
      for(i in range(1, 目标数)){
        key = i.round()
        e = var.奖励卡片列表[key]
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      动画带数量 = 50
      现有动画数 = val.动画卡片带.childrenCount() - 2
      if(现有动画数 != 动画带数量 - 1 || var.动画带基数 != 目标数){
        // 用保存的引用移除旧复制卡片
        if(var.动画卡片列表 != none){
          for(key in var.动画卡片列表.keys()){
            old = var.动画卡片列表[key]
            if(old != none){
              old.remove()
            }
          }
        }
        var.动画带轮次 = (var.动画带轮次 + 1).round()
        // 初始化动画带物品数据为奖池预览数据的副本，让动画卡片创建时就有颜色和图标
        for(key in var.items.keys()){
          var.animItems[key] = var.items[key]
        }
        for(key in var.itemJsons.keys()){
          var.animItemJsons[key] = var.itemJsons[key]
        }
        if(val.动画卡片带 != none) {
          动画模板 = val.动画卡片带.get(1)
          var.动画卡片列表[0.round()] = 动画模板
          if(动画模板 != none){
            随机key = (math.floor(math.random() * 目标数) + 1).round()
            动画模板.entryKey = 随机key
            动画模板['卡片底'].entryKey = 随机key
            动画模板['稀有度条'].entryKey = 随机key
            动画模板['物品槽'].entryKey = 随机key
            动画模板['物品名'].entryKey = 随机key
          }
          for(i in range(1, 动画带数量 - 1)){
            iInt = i.round()
            随机key = (math.floor(math.random() * 目标数) + 1).round()
            if(动画模板 != none){
              e = 动画模板.copy('动画卡片_' + var.动画带轮次 + '_' + i.round())
              e.entryKey = 随机key
              e['卡片底'].entryKey = 随机key
              e['稀有度条'].entryKey = 随机key
              e['物品槽'].entryKey = 随机key
              e['物品名'].entryKey = 随机key
              var.动画卡片列表[i.round()] = e
            }
          }
        }
        var.动画带基数 = 目标数
      }
      for(key in var.动画卡片列表.keys()){
        e = var.动画卡片列表[key]
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      for(i in range(0, 3)){
        key = i.round()
        if(val.消耗区 != none) {
          e = val.消耗区.get(key)
          if(e != none){
            e['图标'].seticon()
          }
        }
      }
      // 抽奖失败时服务端只回 update: 解除等待态，避免界面永久停在开箱动画
      if(var.rolling != none && var.rolling == true && var.resultPending != none && var.resultPending != true){
        var.rolling = false
        val.开箱动画层.visible = false
        val.主面板.visible = true
      }
      var.actionBusy = false
    # packetHandler: result（单抽结果，服务端仅在确实抽到物品时下发）
    # 包字段:
    #   - resultCount: 结果数量
    #   - resultItemJson1: 中奖物品 itemJson（分离模式，N=1）
    #   - resultItemName: 中奖物品名称
    #   - resultRarity: 中奖物品稀有度
    #   - resultPoolIndex: 中奖物品在奖池中的 1 基索引
    result: |-
      var.spinTarget = 0.8358
      var.出货开始 = 0
      var.resultCount = packet['resultCount'] != none ? packet['resultCount'] : 0
      // itemJson 分离模式（§7）：从 packet 顶层字段构建 var.resultItemJsons
      var.resultItemJsons = {}
      json = packet['resultItemJson1']
      var.resultItemJsons[1.round()] = json != none && json != '' ? json : var.air
      var.resultItemName = packet['resultItemName']
      var.resultRarity = packet['resultRarity']
      var.resultPending = true
      var.揭晓类型 = 'single'
      val.单抽结果卡片['物品浮动容器']['物品槽'].seticon()
      // 用 Java 端发送的 50 个伪随机物品存入 var.animItems/var.animItemJsons，不覆盖奖池预览的 var.items/var.itemJsons
      animCount = packet['animCount'] != none ? packet['animCount'] : 50
      animNames = packet['animItemNames'] != none ? packet['animItemNames'] : {}
      animRarities = packet['animItemRarities'] != none ? packet['animItemRarities'] : {}
      var.animItems = {}
      var.animItemJsons = {}
      for(k in range(1, animCount)){
        key = k.round()
        animJson = packet['animItemJson' + key]
        var.animItemJsons[key] = animJson != none && animJson != '' ? animJson : var.air
        entry = {}
        entry['name'] = animNames[key] != none ? animNames[key] : ''
        entry['rarity'] = animRarities[key] != none ? animRarities[key] : ''
        var.animItems[key] = entry
      }
      // 把动画卡片 entryKey 改成 1-50，对应 Java 发来的 50 个物品
      for(key in var.动画卡片列表.keys()){
        e = var.动画卡片列表[key]
        if(e != none){
          entryKey = (key + 1).round()
          e.entryKey = entryKey
          e['卡片底'].entryKey = entryKey
          e['稀有度条'].entryKey = entryKey
          e['物品槽'].entryKey = entryKey
          e['物品名'].entryKey = entryKey
          e['物品槽'].seticon()
        }
      }
      // 结果已到达: 固定 spinTarget 让中线精确对准 card 38（中奖位置）
      var.滚动起点 = var.滚动位置
      var.减速 = Q4(0, 1, 1, var.spinMs)
      var.滚动曲线 = var.减速
      Sound.self(var.resultRarity == 'LEGENDARY' || var.resultRarity == 'MYTHIC' ? 'minecraft:entity.player.levelup' : (var.resultRarity == 'RARE' || var.resultRarity == 'EPIC' ? 'minecraft:block.note_block.chime' : 'minecraft:entity.item.pickup'), var.resultRarity == 'LEGENDARY' || var.resultRarity == 'MYTHIC' ? 1.15 : (var.resultRarity == 'RARE' || var.resultRarity == 'EPIC' ? 1.05 : 0.95), 20)
    # packetHandler: batch_result（十连结果）
    # 包字段:
    #   - batchCount: 实际结果数量
    #   - batchRequested: 请求数量
    #   - batchItemJsonN: 各物品 itemJson（分离模式，N 为序号）
    #   - batchItemNames / batchItemRarities: 结果映射（key 为 "1" 起的数字字符串）
    batch_result: |-
      var.batchCount = packet['batchCount'] != none ? packet['batchCount'] : 0
      var.batchRequested = packet['batchRequested'] != none ? packet['batchRequested'] : 0
      var.batchItemNames = packet['batchItemNames'] != none ? packet['batchItemNames'] : {}
      var.batchItemRarities = packet['batchItemRarities'] != none ? packet['batchItemRarities'] : {}
      // itemJson 分离模式（§7）：从 packet 顶层字段构建 var.batchItemJsons
      var.batchItemJsons = {}
      for(key in var.batchItemNames.keys()){
        json = packet['batchItemJson' + key]
        if(json != none && json != ''){
          var.batchItemJsons[key] = json
        } else {
          var.batchItemJsons[key] = var.air
        }
      }
      var.resultPending = true
      var.揭晓类型 = 'batch'
      目标数 = var.batchCount.round()
      现有数 = val.十连网格.childrenCount() - 1
      if(现有数 != 目标数 - 1){
        // 用保存的引用移除旧复制卡片
        if(var.十连卡片列表 != none){
          for(key in var.十连卡片列表.keys()){
            if(key != 1){
              old = var.十连卡片列表[key]
              if(old != none){
                old.remove()
              }
            }
          }
        }
        var.十连卡片列表 = {}
        var.十连卡片轮次 = (var.十连卡片轮次 + 1).round()
        if(val.十连网格 != none) {
          十连模板 = val.十连网格.get(0)
          var.十连卡片列表[1.round()] = 十连模板
          if(十连模板 != none){
            十连模板.entryKey = 1.round()
            十连模板['卡片底'].entryKey = 1.round()
            十连模板['稀有度条'].entryKey = 1.round()
            十连模板['物品槽'].entryKey = 1.round()
            十连模板['物品名'].entryKey = 1.round()
            十连模板['稀有度名'].entryKey = 1.round()
          }
          if(目标数 > 1){
            for(i in range(1, 目标数 - 1)){
              if(十连模板 != none){
                e = 十连模板.copy('十连卡片_' + var.十连卡片轮次 + '_' + i.round())
                e.entryKey = (i + 1).round()
                e['卡片底'].entryKey = (i + 1).round()
                e['稀有度条'].entryKey = (i + 1).round()
                e['物品槽'].entryKey = (i + 1).round()
                e['物品名'].entryKey = (i + 1).round()
                e['稀有度名'].entryKey = (i + 1).round()
                var.十连卡片列表[(i + 1).round()] = e
              }
            }
          }
        }
      }
      for(i in range(1, 目标数)){
        key = i.round()
        e = var.十连卡片列表[key]
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      // 用 Java 端发送的 50 个伪随机物品覆盖动画带
      animCount = packet['animCount'] != none ? packet['animCount'] : 50
      animNames = packet['animItemNames'] != none ? packet['animItemNames'] : {}
      animRarities = packet['animItemRarities'] != none ? packet['animItemRarities'] : {}
      var.animItems = {}
      var.animItemJsons = {}
      for(k in range(1, animCount)){
        key = k.round()
        animJson = packet['animItemJson' + key]
        var.animItemJsons[key] = animJson != none && animJson != '' ? animJson : var.air
        entry = {}
        entry['name'] = animNames[key] != none ? animNames[key] : ''
        entry['rarity'] = animRarities[key] != none ? animRarities[key] : ''
        var.animItems[key] = entry
      }
      for(key in var.动画卡片列表.keys()){
        e = var.动画卡片列表[key]
        if(e != none){
          entryKey = (key + 1).round()
          e.entryKey = entryKey
          e['卡片底'].entryKey = entryKey
          e['稀有度条'].entryKey = entryKey
          e['物品槽'].entryKey = entryKey
          e['物品名'].entryKey = entryKey
          e['物品槽'].seticon()
        }
      }
      var.滚动起点 = var.滚动位置
      var.减速 = Q4(0, 1, 1, var.spinMs)
      var.滚动曲线 = var.减速
      Sound.self('minecraft:entity.player.levelup', 1.1, 20)
    # packetHandler: history（开箱历史）
    # 包字段:
    #   - historyPoolName: 奖池名称
    #   - historyCount: 记录条数
    #   - historyRows: 记录行（每行含 openTime/itemId/rarity/timeText/summary，界面只用 timeText 与 summary）
    history: |-
      var.historyPoolName = packet['historyPoolName']
      var.historyCount = packet['historyCount'] != none ? packet['historyCount'] : 0
      var.historyRows = packet['historyRows'] != none ? packet['historyRows'] : {}
      // 根据实际历史条目数动态创建行
      for(i in range(0, var.historyCount)){
        key = i.round()
        if(i > 0){
          existing = val.历史列表['历史行' + key]
          if(existing == none){
            if(val.历史列表['历史行'] != none) {
              e = val.历史列表['历史行'].copy('历史行' + key)
              e['时间'].entryKey = key
              e['物品名'].entryKey = key
              e['稀有度名'].entryKey = key
              e['行背景'].entryKey = key
              e['稀有度条'].entryKey = key
            }
          }
        }
        if(val.历史列表 != none) {
          row = val.历史列表.get(key)
          if(row != none){
            row.entryKey = key
          }
        }
      }
      val.历史面板.visible = true
    # packetHandler: details（奖池详情）
    # 包字段:
    #   - detailPoolName: 奖池名称
    #   - detailCount: 条目数
    #   - detailRows: 条目行（每行含 name/rarity/weight）
    details: |-
      var.detailPoolName = packet['detailPoolName']
      var.detailCount = packet['detailCount'] != none ? packet['detailCount'] : 0
      var.detailRows = packet['detailRows'] != none ? packet['detailRows'] : {}
      // 根据实际详情条目数动态创建行
      for(i in range(0, var.detailCount)){
        key = i.round()
        if(i > 0){
          existing = val.详情列表['详情行' + key]
          if(existing == none){
            if(val.详情列表['详情行'] != none) {
              e = val.详情列表['详情行'].copy('详情行' + key)
              e['名称'].entryKey = key
              e['稀有度'].entryKey = key
              e['概率'].entryKey = key
              e['行背景'].entryKey = key
              e['稀有度条'].entryKey = key
            }
          }
        }
        if(val.详情列表 != none) {
          row = val.详情列表.get(key)
          if(row != none){
            row.entryKey = key
          }
        }
      }
      val.详情面板.visible = true
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    # load 事件: 初始化稀有度颜色表与界面状态变量
    load: |-
      var.动画带轮次 = 0
      var.十连卡片轮次 = 0
      var.奖励卡片轮次 = 0
      var.actionToken = ''
      var.rarityNames = {}
      var.滚动位置 = 0
      var.滚动起点 = 0
      var.rarityColors = {}
      var.rarityColors['COMMON']    = '176,176,176,255'  // 消费级 - 灰色
      var.rarityColors['UNCOMMON']  = '94,152,217,255'   // 工业级 - 蓝灰色
      var.rarityColors['RARE']      = '75,105,215,255'   // 军规级 - 蓝色
      var.rarityColors['EPIC']      = '136,71,255,255'   // 受限 - 紫色
      var.rarityColors['LEGENDARY'] = '211,47,47,255'   // 保密 - 红色
      var.rarityColors['MYTHIC']    = '235,75,75,255'    // 隐秘 - 深红色
      var.rarityColors['SPECIAL']   = '255,215,0,255'    // 罕见特殊物品 - 金色
      var.rarityColors[none] = '128,128,128,255'         // 默认 - 中灰色
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.spinMs = 2600      // 开箱动画时长（毫秒），结果包到达后再等这么久揭晓
      var.spinTarget = 0.85  // 滚动条停止位置比例
      var.rolling = false        // 是否正在开箱（防连点）
      var.resultPending = false  // 本次开箱是否已收到结果包
      var.命中已触发 = false
      var.actionBusy = false
      var.actionBusySeconds = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
    # open 事件: 每次打开界面复位所有层
    open: |-
      var.命中已触发 = false
      val.主面板.visible = true
      val.开箱动画层.visible = false
      val.单抽结果层.visible = false
      val.十连结果层.visible = false
      val.历史面板.visible = false
      val.详情面板.visible = false
      val.资源不足提示.visible = false
    # tick 事件: 预热、有限减速、命中冲击和结果层表现动画
    tick: |-
      if(var.rolling != none && var.rolling == true && val.开箱滚动条 != none){
        if(var.滚动曲线 != none && var.resultPending == true){
          进度 = var.滚动曲线.get()
          var.滚动位置 = var.滚动起点 + (var.spinTarget - var.滚动起点) * 进度
          if(进度 >= 1 && var.命中已触发 != true){
            var.滚动位置 = var.spinTarget
            var.命中已触发 = true
            var.命中抖 = Shake(0, 10, 450, 45, 6, true)
            var.白闪 = Fade(60, 40, 260)
            self.delayAction(450, '揭晓结果')
          }
        }else{
          加速系数 = var.加速 != none ? var.加速.get() : 1
          if(var.滚动位置 < var.spinTarget){
            var.滚动位置 = var.滚动位置 + (0.0003 * 加速系数)
          }
        }
      }
      if(var.命中抖 != none && val.开箱动画层 != none){
        val.开箱动画层.x = var.命中抖.get()
      }
      if(var.出货开始 != none && var.出货开始 > 0 && val.单抽结果层 != none){
        if(var.出货淡入 != none && Time.currentTime() - var.出货开始 < 260){
          val.单抽结果层.alpha = var.出货淡入.get()
        }else{
          val.单抽结果层.alpha = 1
        }
      }
      if(var.出货开始 != none && var.出货开始 > 0 && val.单抽结果卡片 != none){
        if(Time.currentTime() - var.出货开始 < 900){
          val.单抽结果卡片['物品浮动容器'].y = var.出货Y != none ? var.出货Y.get() : 0
          val.单抽结果卡片['物品浮动容器']['物品槽'].itemScale = var.出货缩放 != none ? var.出货缩放.get() : 1
        }else{
          val.单抽结果卡片['物品浮动容器'].y = var.待机浮动 != none ? var.待机浮动.get() : 0
          val.单抽结果卡片['物品浮动容器']['物品槽'].itemScale = var.待机呼吸 != none ? var.待机呼吸.get() : 1
        }
      }

    揭晓结果: |-
      val.开箱动画层.visible = false
      val.开箱动画层.x = 0
      var.命中抖 = none
      var.白闪 = none
      var.中线闪 = none
      var.rolling = false
      var.resultPending = false
      if(var.揭晓类型 == 'single'){
        var.出货开始 = Time.currentTime()
        var.出货Y = Back(90, 0, 1.70158, 1, 700)
        var.出货缩放 = Spring(0.75, 1, 170.0, 26.0, 900)
        var.出货淡入 = Lerp(0, 1, 260)
        var.待机呼吸 = Breathe(0.985, 1.02, 900, 900, 300, true)
        var.待机浮动 = Wave(0, 6, 2400, 0, false, 1)
        val.单抽结果层.alpha = 0
        val.单抽结果层.visible = true
        val.主面板.visible = false
      }elif(var.揭晓类型 == 'batch'){
        var.十连开始 = Time.currentTime()
        val.十连结果层.visible = true
        val.主面板.visible = false
      }

