                      存取字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 96
                          texts: "~&f存取"
                          fontSize: 32
                          through: true
                  排序:
                    type: Canvas
                    attribute:
                      width: 190
                      height: 56
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'sort')
                    children:
                      排序底:
                        type: Texture
                        attribute:
