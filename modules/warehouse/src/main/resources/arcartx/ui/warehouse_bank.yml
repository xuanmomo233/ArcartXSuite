# AXS Warehouse Bank - 重构版
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航(含余额列表) + 内容区(存取区+产品列表+详情面板)
# 配色: 银灰金库 深底浅字 — 抬升面44,50,58 选中160,170,180 描边100,110,120 输入/网格底36,42,50
# fontSize: 48(顶栏标题) / 36(区域标题/按钮/信息/输入/提示) — 全部标准档位

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 包标识符（'AXS_WAREHOUSE'）
    #   - action_token: 操作令牌（防重放）
    #   - warehouseName: 仓库名称
    #   - balances: 各货币余额数据
    #   - balanceTexts: 余额显示文本
    #   - products: 理财产品列表
    #   - productTexts: 产品显示文本（仅名称）
    #   - fixedDeposits: 定期存款列表
    #   - fixedDepositTexts: 定期存款显示文本
    #   - unlocked: 二级密码是否已解锁
    #   - hasPassword: 是否已设置二级密码
    #   - maxBalanceCount: 余额条目最大数量
    #   - maxProductCount: 产品条目最大数量
    #   - maxFixedCount: 定期存款条目最大数量
    #   - selectedCurrency: 当前选中的货币 ID
    update: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.warehouseName = packet['warehouseName']
      var.balances = packet['balances']
      var.balanceTexts = packet['balanceTexts']
      var.products = packet['products']
      var.productTexts = packet['productTexts']
      var.fixedDeposits = packet['fixedDeposits']
      var.fixedDepositTexts = packet['fixedDepositTexts']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.maxBalanceCount = packet['maxBalanceCount']
      var.maxProductCount = packet['maxProductCount']
      var.maxFixedCount = packet['maxFixedCount']
      var.selectedCurrency = packet['selectedCurrency']
      余额数 = var.maxBalanceCount
      现有余额数 = val.余额列表.childrenCount() - 1
      if(现有余额数 != 余额数 - 1){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.余额列表.childrenCount() > 1){
          val.余额列表.get(1).remove()
        }
        if(余额数 > 1){
          for(序号 in range(1, 余额数)){
            项 = val.余额列表['项'].copy('余额项_' + var.刷新轮次.round() + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      产品数 = var.maxProductCount
      现有产品数 = val.产品列表.childrenCount() - 1
      if(现有产品数 != 产品数 - 1){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.产品列表.childrenCount() > 1){
          val.产品列表.get(1).remove()
        }
        if(产品数 > 1){
          for(序号 in range(1, 产品数)){
            项 = val.产品列表['项'].copy('产品项_' + var.刷新轮次.round() + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      定期数 = var.maxFixedCount
      现有定期数 = val.定期列表.childrenCount() - 1
      if(现有定期数 != 定期数 - 1){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.定期列表.childrenCount() > 1){
          val.定期列表.get(1).remove()
        }
        if(定期数 > 1){
          for(序号 in range(1, 定期数)){
            项 = val.定期列表['项'].copy('定期项_' + var.刷新轮次.round() + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      // update 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false
      // 根据 selectedProduct 查找对应的产品 entry
      var.selectedProductEntry = none
      if(var.selectedProduct != none && var.products != null){
        for(key in var.products.keys()){
          entry = var.products[key]
          if(entry != null && entry['id'] == var.selectedProduct){
            var.selectedProductEntry = entry
            break
          }
        }
      }
      // 根据 selectedDeposit 查找对应的定期 entry
      var.selectedDepositEntry = none
      if(var.selectedDeposit != none && var.fixedDeposits != null){
        for(key in var.fixedDeposits.keys()){
          entry = var.fixedDeposits[key]
          if(entry != null && entry['id'] == var.selectedDeposit){
            var.selectedDepositEntry = entry
            break
          }
        }
      }
      // 计算预期收益
      calcExpectedPayout()
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.packetId = 'AXS_WAREHOUSE'
      var.warehouseName = 'AXS 仓库'
      var.balances = {}
      var.balanceTexts = {}
      var.products = {}
      var.productTexts = {}
      var.fixedDeposits = {}
      var.fixedDepositTexts = {}
      var.unlocked = false
      var.hasPassword = false
      var.passwordText = none
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.selectedCurrency = 'money'
      var.selectedProduct = none
      var.selectedProductEntry = none
      var.selectedDeposit = none
      var.selectedDepositEntry = none
      var.bankAmount = none
      var.expectedPayout = '—'
      var.maxBalanceCount = 0
      var.maxProductCount = 0
      var.maxFixedCount = 0
      var.刷新轮次 = 0.round()
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      // 三列宽度：存取区 360 + 间隔 12 + 产品列表 280 + 间隔 12 + 详情面板 = contentW - 40
      var.col1W = 360
      var.col2W = 280
      var.col3W = var.contentW - 40 - var.col1W - var.col2W - 24
      // 预期收益计算函数：根据输入金额匹配利率阶梯，计算到期本息
      calcExpectedPayout = func(){
        var.expectedPayout = '—'
        if(var.selectedProductEntry == none || var.bankAmount == none || var.bankAmount == ''){
          return
        }
        amount = parseFloat(var.bankAmount)
        if(amount <= 0){
          return
        }
        tiers = var.selectedProductEntry['tiers']
        if(tiers == null || tiers.length == 0){
          return
        }
        matchedRate = 0
        for(i in range(0, tiers.length)){
          tier = tiers[i]
          tierMin = parseFloat(tier['min'])
          tierMax = parseFloat(tier['max'])
          if(amount >= tierMin && (tierMax <= 0 || amount <= tierMax)){
            matchedRate = parseFloat(tier['rate'])
            break
          }
        }
        if(matchedRate > 0){
          payout = amount + amount * matchedRate
          var.expectedPayout = payout.round().toString()
        }
      }
    open: |-
      Packet.send(var.packetId, 'refresh')
    # 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.col1W = 360
      var.col2W = 280
      var.col3W = var.contentW - 40 - var.col1W - var.col2W - 24

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;20,24,28,110
  # 自适配布局：宽高 = 设计分辨率(1920x1080)，顶部锚点使顶栏紧贴屏幕顶部
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏（沿窗口整宽铺满）───────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~100,110,120,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~180,190,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "var.warehouseName + ' &f银行'"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 360
              width: 1
              height: 30
              normal: ~100,110,120,220
          状态:
            type: Text
            attribute:
              point: ~middle_left
              x: 380
              texts: "!var.hasPassword ? '&e首次使用请设置二级密码' : (var.unlocked ? '&a二级密码已解锁' : '&c提现与领取需先解锁二级密码')"
              fontSize: 36
          刷新:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -112
              width: 64
              height: 48
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'refresh')
            children:
              刷新底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
              刷新字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f刷新"
                  fontSize: 36
                  through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航（导航3项 + 账户余额列表）──────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~100,110,120,220
          导航仓库:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'storage')
            children:
              仓库底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
              仓库文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f仓库"
                  fontSize: 36
                  through: true
          导航银行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            children:
              银行底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~180,190,200,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,255
              银行高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~180,190,200,255
                  shape: ~round_rect
                  radius: 2
              银行文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0银行"
                  fontSize: 36
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'manage')
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f管理"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 232
              width: 264
              height: 2
              normal: ~100,110,120,220
          账户标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 250
              texts: "~&f账户余额"
              fontSize: 36
          账户说明:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 286
              texts: "~&e点击选择货币"
              fontSize: 36
          余额滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -12
              y: 330
              width: 10
              height: "var.viewH - 524"
              normal: ~40,44,52,225
              shape: ~round_rect
              radius: 5
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          余额滑块:
            type: Texture
            val: 余额滑块
            attribute:
              point: ~top_right
              x: -12
              y: 330
              width: 10
              height: 50
              normal: ~180,190,200,255
              maxDragY: "var.viewH - 574"
              shape: ~round_rect
              radius: 5
          余额滚动:
            type: Scroll
            val: 余额滚动
            attribute:
              point: ~top_left
              x: 14
              y: 330
              width: 258
              height: "var.viewH - 524"
              moveY: "self.parent['余额滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['余额滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['余额滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              余额列表:
                val: 余额列表
                type: VStack
                attribute:
                  width: 258
                  spaceBetween: 8
                children:
                  项:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.balances[self.entryKey]
                      visible: self.entry != none
                      width: 258
                      height: 48
                    action:
                      clickLeft: |-
                        var.selectedProduct = none
                        var.selectedProductEntry = none
                        Packet.send(var.packetId, 'select_currency', self.entry['id'])
                    children:
                      项背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['id'] == var.selectedCurrency ? '64,72,82,225' : '44,50,58,245'"
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '220,230,240,255' : (self.parent.entry != none && self.parent.entry['id'] == var.selectedCurrency ? '255,255,255,255' : '100,110,120,220')"
                      项文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "'&f' + var.balanceTexts[self.parent.entryKey]"
                          fontSize: 36
                          through: true
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: "~&fESC 关闭界面"
              fontSize: 36

      # ── 内容区（存取区 + 产品列表 + 详情面板）───────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~100,110,120,220

          # ── 存取区（左列：金额输入+存入+提现+密码+我的定期）──
          存取区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 20
              width: "var.col1W"
              height: "var.viewH - 184"
            children:
              存取区底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~36,42,50,225
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 3
                    color: ~100,110,120,220
              存取标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 20
                  texts: "~&f存取"
                  fontSize: 36
              # 金额输入 + 存入按钮（同一行）
              金额输入:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 20
                  y: 64
                  width: "var.col1W - 132"
                  height: 48
                children:
                  金额底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,42,50,225
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
                  输入框:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 6
                      width: "var.col1W - 152"
                      height: 36
                      length: 18
                      emptyText: ~&7金额
                      fontSize: 36
                    action:
                      textChange: |-
                        var.bankAmount = self.getContent()
                        calcExpectedPayout()
              存入:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.col1W - 104"
                  y: 64
                  width: 84
                  height: 48
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send(var.packetId, 'bank_deposit', var.selectedCurrency, var.bankAmount, var.actionToken)
                children:
                  存入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~44,50,58,245
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
                  存入字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f存入"
                      fontSize: 36
                      through: true
              # 提现按钮（整行）
              提现:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 20
                  y: 124
                  width: "var.col1W - 40"
                  height: 48
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send(var.packetId, 'bank_withdraw', var.selectedCurrency, var.bankAmount, var.actionToken)
                children:
                  提现底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~44,50,58,245
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
                  提现字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f提现到背包"
                      fontSize: 36
                      through: true
              存取分隔:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 20
                  y: 188
                  width: "var.col1W - 40"
                  height: 2
                  normal: ~100,110,120,220
              # 二级密码区
              密码标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 204
                  texts: "!var.hasPassword ? '&e首次使用请设置二级密码' : '&f二级密码'"
                  fontSize: 36
              密码输入:
                type: Canvas
                attribute:
                  point: ~top_left
