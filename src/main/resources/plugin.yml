name: ArcartX-Suite
version: '${version}'
main: xuanmo.arcartxsuite.ArcartXSuitePlugin
api-version: '1.20'
load: POSTWORLD
depend:
  - ArcartX
softdepend:
  - Chemdah
  - Adyeshach
  - MythicMobs
  - MythicBukkit
  - MythicLib
  - MMOItems
  - PlaceholderAPI
  - AttributePlus
  - CraneAttribute
  - Vault
  - PlayerPoints
  - Rondo
  - NeigeItems
  - Symphony
  - Overture
# 模块命令不在此声明：plugin.yml 声明的命令在插件加载时即注册进 CommandMap，
# 模块未启用/被禁用时会持续占用命令名，与其他同功能插件冲突。
# 模块命令元数据见 module-commands.yml，由模块启用时经 CommandMap 动态注册。
commands:
  arcartxsuite:
    description: ArcartXSuite 管理命令
    usage: /axs help [module] | /axs <module> help | /axs status|reload
    aliases: [axs]
    permission: arcartxsuite.admin
permissions:
  arcartxsuite.admin:
    default: op
  arcartxsuite.title.use:
    default: true
  arcartxsuite.warehouse.use:
    default: true
  arcartxsuite.mail.use:
    default: true
  arcartxsuite.mail.send:
    default: true
  arcartxsuite.mail.admin:
    default: op
  arcartxsuite.chat.use:
    default: true
  arcartxsuite.chat.msg:
    default: true
  arcartxsuite.chat.ignore:
    default: true
  arcartxsuite.chat.socialspy:
    default: op
  arcartxsuite.chat.mute:
    default: op
  arcartxsuite.chat.redpacket.send:
    default: true
  arcartxsuite.chat.redpacket.claim:
    default: true
  arcartxsuite.chat.redpacket.admin:
    default: op
  arcartxsuite.onlinerewards.use:
    default: true
  arcartxsuite.onlinerewards.time.1_5:
    default: false
  arcartxsuite.onlinerewards.time.2:
    default: false
  arcartxsuite.onlinerewards.signin.bonus:
    default: false
  arcartxsuite.questgps.use:
    default: true
  arcartxsuite.map.use:
    default: true
  arcartxsuite.tab.use:
    default: true
  axs.tab.debug:
    default: op
  arcartxsuite.map.admin:
    default: op
  arcartxsuite.market.use:
    default: true
  arcartxsuite.market.admin:
    default: op
  arcartxsuite.pickup.use:
    default: true
  # ─── Essentials ───
  axs.essentials.fly:
    default: op
  axs.essentials.god:
    default: op
  axs.essentials.heal:
    default: op
  axs.essentials.feed:
    default: op
  axs.essentials.gamemode:
    default: op
  axs.essentials.speed:
    default: op
  axs.essentials.vanish:
    default: op
  axs.essentials.vanish.see:
    default: op
  axs.essentials.afk:
    default: true
  axs.essentials.afk.exempt:
    default: op
  axs.essentials.back:
    default: true
  axs.essentials.repair:
    default: op
  axs.essentials.hat:
    default: true
  axs.essentials.enderchest:
    default: op
  axs.essentials.workbench:
    default: true
  axs.essentials.anvil:
    default: true
  axs.essentials.trash:
    default: true
  axs.essentials.nick:
    default: op
  axs.essentials.seen:
    default: op
  axs.essentials.home:
    default: true
  axs.essentials.warp:
    default: true
  axs.essentials.spawn:
    default: true
  axs.essentials.tpa:
    default: true
  axs.essentials.tp:
    default: op
  axs.essentials.top:
    default: true
  axs.essentials.tppos:
    default: op
  axs.essentials.time:
    default: op
  axs.essentials.weather:
    default: op
  axs.essentials.ban:
    default: op
  axs.essentials.unban:
    default: op
  axs.essentials.mute:
    default: op
  axs.essentials.unmute:
    default: op
  axs.essentials.kick:
    default: op
  axs.essentials.warn:
    default: op
  axs.essentials.sudo:
    default: op
  axs.essentials.inv:
    default: op
  axs.essentials.sit:
    default: true
  axs.essentials.lay:
    default: true
  axs.essentials.treecap:
    default: false
  axs.essentials.replant:
    default: false
  axs.essentials.sort:
    default: true
  axs.essentials.autotool:
    default: true
  axs.essentials.admin:
    default: op
  axs.essentials.menu:
    default: true
  # ─── Regions ───
  axs.regions.select:
    default: true
  axs.regions.admin:
    default: op
  axs.regions.bypass:
    default: op
  axs.regions.bypass.limit:
    default: op
  # ─── Menu ───
  arcartxsuite.menu.use:
    default: true
  axs.menu.reload:
    default: op
  axs.menu.open.other:
    default: op
  # ─── QQBot ───
  arcartxsuite.qqbot.use:
    default: true
  arcartxsuite.qqbot.admin:
    default: op
  # ─── Fishing ───
  arcartxsuite.fishing.use:
