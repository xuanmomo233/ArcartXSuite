# Warehouse / workshop console: ironwood settings cards and a separate access register.
# Choose a vault first; configure automation, identity and capacity; administer shared access.
# Destructive actions stay visually isolated; member-row parent chains remain unchanged.

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 包标识符（'AXS_WAREHOUSE'）
    #   - action_token: 操作令牌（防重放）
    #   - ownerType: 仓库所有者类型（personal / shared）
    #   - ownerId: 所有者 ID
    #   - warehouseId: 仓库 ID
    #   - warehouseName: 仓库名称
    #   - personalWarehouses: 个人仓库列表
    #   - personalWarehouseTexts: 个人仓库显示文本
    #   - manageWarehouses: 可管理的仓库列表
    #   - manageWarehouseTexts: 可管理仓库显示文本
    #   - manageWarehouseTypes: 可管理仓库类型
    #   - manageWarehouseTargets: 可管理仓库目标
    #   - manageWarehouseSelected: 当前选中的管理仓库索引
    #   - sharedWarehouses: 共享仓库列表
    #   - sharedWarehouseManageTexts: 共享仓库管理显示文本
    #   - sharedCreateCostText: 创建共享仓库费用文本
    #   - sharedRoleOwnerName: 共享仓库所有者角色名
    #   - sharedRoleMemberName: 共享仓库成员角色名
    #   - sharedRoleViewerName: 共享仓库观众角色名
    #   - sharedMembers: 共享仓库成员列表
    #   - sharedMemberTexts: 成员显示文本
    #   - sharedMemberNames: 成员名称列表
    #   - sharedMemberRoles: 成员角色列表
    #   - unlocked: 二级密码是否已解锁
    #   - hasPassword: 是否已设置二级密码
    #   - readOnly: 是否只读模式
    #   - lockOwner: 编辑锁持有者
    #   - capacityText: 容量显示文本
    #   - level: 仓库等级（仅共享仓库有意义；个人仓库逐格解锁恒为 1）
    #   - canUpgrade: 是否可扩容（个人=还能再买一格，共享=可升下一级）
    #   - slotPriceText: 个人仓库单格价格文本
    #   - nextUpgradeText: 扩容提示文本（个人=槽位价格提示，共享=下一级信息）
    #   - autoPickup: 是否启用自动拾取
    #   - autoPickupMythic: 是否自动拾取 MythicMobs 掉落
    #   - autoPickupNotify: 是否通知自动拾取
    #   - serverAutoPickup: 服务器是否开启自动拾取入库（false 时隐藏整个拾取开关组）
    #   - serverMythicLoot: 服务器是否开启 MythicMobs 掉落物入库（false 时隐藏怪物战利品开关）
    #   - showcaseEnabled: 是否启用展示柜
    #   - maxManageCount: 可管理仓库最大数量（用于动态创建控件）
    #   - maxMemberCount: 成员最大数量
    update: |-
      // 保存旧数量，用于判断是否需要重建列表（首次 update 时旧数量为 0，数量从 0 变为 N 时触发重建）
      oldMaxManageCount = var.maxManageCount != none ? var.maxManageCount : 0
      oldMaxMemberCount = var.maxMemberCount != none ? var.maxMemberCount : 0
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.manageWarehouses = packet['manageWarehouses']
      var.manageWarehouseTexts = packet['manageWarehouseTexts']
      var.manageWarehouseTypes = packet['manageWarehouseTypes']
      var.manageWarehouseTargets = packet['manageWarehouseTargets']
      var.manageWarehouseSelected = packet['manageWarehouseSelected']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseManageTexts = packet['sharedWarehouseManageTexts']
      var.sharedCreateCostText = packet['sharedCreateCostText']
      var.sharedRoleOwnerName = packet['sharedRoleOwnerName']
      var.sharedRoleMemberName = packet['sharedRoleMemberName']
      var.sharedRoleViewerName = packet['sharedRoleViewerName']
      var.sharedMembers = packet['sharedMembers']
      var.sharedMemberTexts = packet['sharedMemberTexts']
      var.sharedMemberNames = packet['sharedMemberNames']
      var.sharedMemberRoles = packet['sharedMemberRoles']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.lockOwner = packet['lockOwner']
      var.capacityText = packet['capacityText']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.slotPriceText = packet['slotPriceText']
      var.slotPriceAmount = packet['slotPriceAmount']
      var.slotCurrencyName = packet['slotCurrencyName']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.autoPickup = packet['autoPickup']
      var.autoPickupMythic = packet['autoPickupMythic']
      var.autoPickupNotify = packet['autoPickupNotify']
      var.serverAutoPickup = packet['serverAutoPickup']
      var.serverMythicLoot = packet['serverMythicLoot']
      var.showcaseEnabled = packet['showcaseEnabled']
      var.maxManageCount = packet['maxManageCount']
      var.maxMemberCount = packet['maxMemberCount']
      // ── 共享列表：仅在数量变化时重建 ──
      if(var.maxManageCount != oldMaxManageCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.共享列表.childrenCount() > 1){
          val.共享列表.get(1).remove()
        }
        if(var.maxManageCount > 1){
          for(序号 in range(1, var.maxManageCount - 1)){
            if(val.共享列表.get(0) != none) {
              项 = val.共享列表.get(0).copy('共享项_' + var.刷新轮次.round() + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      // ── 成员列表：仅在数量变化时重建 ──
      if(var.maxMemberCount != oldMaxMemberCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.成员列表.childrenCount() > 1){
          val.成员列表.get(1).remove()
        }
        if(var.maxMemberCount > 1){
          for(序号 in range(1, var.maxMemberCount - 1)){
            if(val.成员列表.get(0) != none) {
              项 = val.成员列表.get(0).copy('成员项_' + var.刷新轮次.round() + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      // update 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false
      var.pickupBusy = false
      var.mythicBusy = false
      var.notifyBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
      if(var.pickupBusy){
        var.pickupBusySeconds = var.pickupBusySeconds + 1
        if(var.pickupBusySeconds >= 3){
          var.pickupBusy = false
          var.pickupBusySeconds = 0
        }
      }else{
        var.pickupBusySeconds = 0
      }
      if(var.mythicBusy){
        var.mythicBusySeconds = var.mythicBusySeconds + 1
        if(var.mythicBusySeconds >= 3){
          var.mythicBusy = false
          var.mythicBusySeconds = 0
        }
      }else{
        var.mythicBusySeconds = 0
      }
      if(var.notifyBusy){
        var.notifyBusySeconds = var.notifyBusySeconds + 1
        if(var.notifyBusySeconds >= 3){
          var.notifyBusy = false
          var.notifyBusySeconds = 0
        }
      }else{
        var.notifyBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.autoPickup = true
      var.autoPickupMythic = true
      var.autoPickupNotify = true
      var.capacityText = '0/0'
      var.hasPassword = false
      var.level = 1
      var.slotPriceText = ''
      var.slotPriceAmount = 0
      var.slotCurrencyName = ''
      var.buyAmount = '1'
      var.manageWarehouseSelected = {}
      var.packetId = 'AXS_WAREHOUSE'
      var.readOnly = false
      var.sharedCreateCostText = '创建共享仓库免费'
      var.sharedMemberNames = {}
      var.sharedMemberRoles = {}
      var.sharedRoleMemberName = '成员'
      var.sharedRoleViewerName = '观众'
      var.showcaseEnabled = true
      var.unlocked = false
      var.warehouseName = 'AXS 仓库'
      var.memberRole = 'member'
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.pickupBusy = false
      var.pickupBusySeconds = 0
      var.mythicBusy = false
      var.mythicBusySeconds = 0
      var.notifyBusy = false
      var.notifyBusySeconds = 0
      var.deleteConfirm = false
      var.刷新轮次 = 0.round()
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.halfW = (var.contentW - 24) / 2
    open: |-
      Packet.send(var.packetId, 'refresh')
    # 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.halfW = (var.contentW - 24) / 2

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:18;17,14,12,195
  # 自适配布局：宽高 = 设计分辨率(1920x1080)，顶部锚点使顶栏紧贴屏幕顶部
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏（沿窗口整宽铺满）───────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~38,31,27,250
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~112,83,64,235
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~190,122,79,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f库房管控  &6/  设置授权"
              fontSize: 54
              through: true
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 402
              width: 1
              height: 30
              normal: ~112,83,64,235
          当前仓库:
            type: Text
            attribute:
              point: ~middle_left
              x: 430
              texts: "'&7当前库房  /  &f' + var.warehouseName + (var.ownerType == 'shared' ? '  &6共享' : '  &6个人') + (var.readOnly ? '  &c只读' : '') + (!var.hasPassword ? '  &e未设置密码' : (var.unlocked ? '  &a已解锁' : '  &e未解锁'))"
              fontSize: 36
              limit: "var.viewW - 590"
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                var.deletePassword = none
                var.renameName = none
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~56,43,36,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '241,208,157,255' : '112,83,64,235'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航（导航3项 + 仓库列表）──────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~38,31,27,250
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~112,83,64,235
          导航仓库:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'storage')
            children:
              仓库底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~56,43,36,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '241,208,157,255' : '112,83,64,235'"
              仓库文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f  01  储物台"
                  fontSize: 36
                  through: true
          导航银行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'bank')
            children:
              银行底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~56,43,36,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '241,208,157,255' : '112,83,64,235'"
              银行文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f  02  资金账本"
                  fontSize: 36
                  through: true
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~190,122,79,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~226,179,124,255
              管理高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~190,122,79,255
                  shape: ~round_rect
                  radius: 2
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f  03  库房管控"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 232
              width: 264
              height: 2
              normal: ~112,83,64,235
          仓库列表标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 250
              texts: "~&f库房索引  &6/  SELECT"
              fontSize: 36
          新建名:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 296
              width: 160
              height: 48
            children:
              新建名底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~27,23,21,245
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '241,208,157,255' : '112,83,64,235'"
              输入框:
                type: TextBox
                attribute:
                  x: 10
                  y: 6
                  width: 140
                  height: 36
                  length: 24
                  emptyText: ~&7共享名
                  fontSize: 36
                action:
                  textChange: |-
                    var.sharedName = self.getContent()
          创建:
            type: Canvas
            attribute:
              point: ~top_left
              x: 182
              y: 296
              width: 100
              height: 48
              enable: "!var.actionBusy && var.actionToken != ''"
            action:
              clickLeft: |-
                var.actionBusy = true
                Packet.send(var.packetId, 'shared_create', var.sharedName, var.actionToken)
            children:
              创建底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~165,102,68,245
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '241,208,157,255' : '190,120,78,255'"
              创建字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f新建"
                  fontSize: 36
                  through: true
          创建费用:
            type: Text
            attribute:
              point: ~top_left
              x: 14
              y: 352
              texts: "'&e' + var.sharedCreateCostText"
              fontSize: 36
          仓库滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -12
              y: 396
              width: 10
              height: "var.viewH - 590"
              normal: ~53,40,33,245
              shape: ~round_rect
              radius: 5
            effect:
              stroke:
                width: 2
                color: ~224,194,152,230
          仓库滑块:
            type: Texture
            val: 仓库滑块
            attribute:
              point: ~top_right
              x: -12
              y: 396
              width: 10
              height: 50
              normal: ~190,122,79,255
              maxDragY: "var.viewH - 640"
              shape: ~round_rect
              radius: 5
          仓库滚动:
            type: Scroll
            val: 仓库滚动
            attribute:
              point: ~top_left
              x: 14
              y: 396
              width: 258
              height: "var.viewH - 590"
              moveY: "self.parent['仓库滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              共享列表:
                val: 共享列表
                type: VStack
                attribute:
                  width: 258
                  spaceBetween: 8
                children:
                  项:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.manageWarehouses[self.entryKey]
                      visible: self.entry != none
                      width: 258
                      height: 48
                    action:
                      clickLeft: |-
                        var.deleteConfirm = false
                        if(var.manageWarehouseTypes[self.entryKey] == 'shared'){
                          Packet.send(var.packetId, 'shared', var.manageWarehouseTargets[self.entryKey])
                        }else{
                          Packet.send(var.packetId, 'warehouse', var.manageWarehouseTargets[self.entryKey])
                        }
                    children:
                      项背景:
                        type: Texture
                        attribute:
                          point: ~middle_center
                          width: "self.parent.width - 6"
                          height: "self.parent.height"
                          through: true
                          normal: "var.manageWarehouseSelected[self.parent.entryKey] ? '105,66,47,250' : '56,43,36,255'"
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '241,208,157,255' : (var.manageWarehouseSelected[self.parent.entryKey] ? '226,179,124,255' : '112,83,64,235')"
                      项文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "'&f' + self.parent.entry['name']"
                          fontSize: 36
                          limit: 226
                          through: true
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: "~&7先选库房  /  ESC 关闭"
              fontSize: 36

      # ── 内容区（设置区 + 成员区）──────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~38,31,27,250
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~112,83,64,235

          # ── 设置区（左半）──────────────────────────────────
          设置区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 20
              width: "var.halfW - 20"
              height: "var.viewH - 184"
            children:
              设置区底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~27,23,21,245
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 3
                    color: ~112,83,64,235
              拾取分区底:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 12
                  y: 56
                  width: "var.halfW - 44"
