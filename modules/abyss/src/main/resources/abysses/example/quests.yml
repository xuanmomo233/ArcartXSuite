# 副本任务 → questgps/Chemdah 适配层
# 任务语义（目标/进度/完成）全部在 Chemdah 侧定义（external/chemdah/quest/sk_slayer.yml），
# 这里只登记映射 + 副本内钩子。Chemdah 任务为玩家级持久档案，重复刷本需任务可重复接取。

slayer:
  chemdah-id: "sk_slayer"            # Chemdah 任务模板 id（QuestGPS 呈现层同名）
  name: "讨伐深渊魔物"
  description: "深入地牢，击杀 15 只魔物并击败深渊领主"
  # quest_track 只对「有导航点」的任务有效——questgps overlay 里本任务
  # navigation.enabled=false（副本内坐标是动态世界，导航由 abyss guide_point 承担），
  # 故关闭自动追踪；进度展示走 Chemdah addon.track.scoreboard。
  auto-track: false
  # on-accept 不再发"已接取"消息——questgps 通知 + Chemdah agent tell 已各播一遍，
  # 这里再加一条就是三层刷屏。钩子保留位：要加副本内动作（指路/音效）写在下面。
  on-accept:
    - "sound @trigger ENTITY_EXPERIENCE_ORB_PICKUP 1 1.2"
  on-complete:                       # Chemdah 完成 → EventBus 路由到此发奖
    - "grant_reward @trigger quest_pack"
    - "message @trigger &6委托达成！奖励已发放"
  manual-claim: false                # true=完成不自动发奖，回 NPC submit_quest 领取
