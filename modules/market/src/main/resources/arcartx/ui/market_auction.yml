            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 440
              texts: "~&f分类筛选"
              fontSize: 36
              through: true
          分类滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -10
              y: 488
              width: 8
              height: "var.viewH - 652"
              normal: ~42,50,66,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          分类滑块:
            type: Texture
            val: 分类滑块
            attribute:
              point: ~top_right
              x: -10
              y: 488
              width: 8
              height: 60
              normal: ~140,200,255,255
              maxDragY: "var.viewH - 712"
              shape: ~round_rect
              radius: 4
          分类滚动:
            type: Scroll
            val: 分类滚动
            attribute:
              point: ~top_left
              x: 20
              y: 488
              width: 260
              height: "var.viewH - 652"
              moveY: "self.parent['分类滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              分类列表:
                val: 分类列表
                type: VStack
                attribute:
                  width: 254
                  spaceBetween: 8
                children:
                  分类项:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.categories[self.entryKey]
                      visible: self.entry != none
                      width: 254
                      height: 48
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'auction_list', '0', self.entry['id'], var.search)
                    children:
                      分类项底:
