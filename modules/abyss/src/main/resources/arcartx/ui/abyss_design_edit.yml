                      x: 240
                      texts: "'&f' + self.parent.entry['value']"
                      fontSize: 26
                      limit: 34
                      visible: "self.parent.entry['editor'] != 'TEXT' && self.parent.entry['editor'] != 'NUMBER'"
                      through: true
                  操作钮:
                    type: Canvas
                    attribute:
