config-version: 2

# ========== 云端授权（AXS Cloud Platform）==========
# 连接 AXS 云端平台，按服主账号下发已购买/免费模块。
# 云端功能默认开启，只要填写了 qq 和 apiKey，服务器启动时就会自动连接。
# 工作流程：
#   1. 服主先在云端仪表盘用 QQ 号 + 密码注册账号（https://cloud.021209.xyz）。
#   2. 登录后进入「设置」→「验证密匙」，复制您的验证密匙（apiKey）。
#   3. 在此处填写 QQ 号与验证密匙。
#   4. 启动服务器后，插件会用 QQ+apiKey 向云端换取一个【服务器码】(server-code)，
#      该码与本服务器绑定，并自动回填到下方 server-code 字段。
#   5. 服主在云端仪表盘的「装备模块」页面为该服务器码勾选要启用的模块，
#      下次服务器启动 / 重载时会自动下载并加载这些模块。
# 安全说明：
#   - 每次连接云端（包括刷新令牌）都会验证 apiKey，请勿清空。
#   - apiKey 仅用于服务器与云端通信，无法登录管理后台，与登录密码完全分离。
#   - server-code 由云端生成，请勿手动修改；删除后会触发重新绑定。
cloud:
  # 受保护模块的文件来源。local 从 modules/ 读取对应 AXB，并在线验权取钥。
  module-source: cloud
  # 服主 QQ 号（须与云端注册账号一致）。
  qq: ""
  # 验证密匙（从管理后台「设置 → 验证密匙」页面复制）。
  # 【安全警告】此密匙以明文形式存储在 config.yml 中。
  #   建议：1) 设置 plugins/ArcartXSuite/ 目录权限为 700（仅服务器进程可读）。
  #        2) 不要在公共仓库或聊天群中分享此配置文件。
  #        3) 如怀疑泄露，请登录管理后台重新生成密匙。
  apiKey: ""
  # 服务器码：留空表示尚未绑定，绑定成功后由云端自动回填，请勿手动修改。
  server-code: ""
  # 调试日志：开启后会输出签名、密钥 hash 等敏感诊断信息，生产环境请保持 false。
  debug: false
  # 用于校验云平台/更新服务返回的已签名 JSON 响应；服务端通过响应签名头提交签名。
  # 每项为 Base64 编码的 Ed25519 SubjectPublicKeyInfo 公钥，支持配置多个公钥，便于密钥轮换或多环境部署。
  # 当前响应校验由 NativeBridge 的构建时公钥和安全库执行；空列表 [] 不提供额外公钥，是否启用校验仍由安全库是否可用及其内置公钥决定。
  response-signature-public-keys: []
  # 强制要求 native 验签可用：false（默认）= 安全库未加载时云端响应按明文信任（fail-open，
  #   适用于明文开发构建）；true = 安全库不可用时所有云端请求按暂时故障拒绝（fail-closed，
  #   生产环境建议开启，防止验签失效被静默降级）。
  require-native-verify: false


# ========== 安全设置 ==========
# 模块签名验证公钥列表（Ed25519，Base64 编码）。
# 本地模块需同时放置同名 .jar.sig，使用 scripts/sign-module-jar.py 对整个 JAR 签名。
# 已启用验签的旧本地模块需要补签，module.yml 中的旧签名只用于云端描述符校验。
# 是否必填：否。留空表示关闭签名验证，不影响任何功能。
# 何时需要填写：如果你使用的是第三方/私人定制模块，且对方提供了 Ed25519 公钥，
#   填入后即可强制校验模块签名，签名无效或缺失的模块将被拒绝加载。
# 支持多个公钥：不同模块作者可使用不同私钥签名，对应公钥逐一填入列表即可。
# 默认值：[]（关闭）
module-signature-public-keys: []

# 版本检查签名公钥（Ed25519，Base64 编码）。
# 作用：服务器启动时会向云端查询 AXS 最新版本。配置公钥后，
#   会校验云端返回的版本信息是否带有有效签名，防止中间人伪造更新提示诱骗下载恶意文件。
# 是否必填：否。留空表示不校验版本响应签名，版本检查功能完全正常。
# 何时需要填写：如果你担心网络环境不安全（如公共 WiFi、代理不可信），
#   可向 AXS 官方索取公钥填入，校验失败时将自动忽略可疑的更新提示。
# 默认值：""（关闭）
version-check-public-key: ""


# AXS 资源说明
# 用途: AXS 主配置，负责模块启用开关。
# 前置依赖: ArcartX。
# 启用开关: modules.<module>.enabled。
# 关联文件: config.yml、ArcartX*.yml。
# 重载命令: /axs reload all 或 /axs <module> reload。

# ========== 全局货币定义 ==========
# 所有模块只使用此处定义的全局货币池，模块配置中的 currency/currencies 字段只引用货币 ID。
# provider 支持: vault / playerpoints / xconomy / rondo / command / placeholder-command / custom。
# command、placeholder-command、custom 当前共用 CommandCurrencyBridge。
# 标准字段：enabled、provider、display-name、scale、rounding、balance-placeholder、withdraw-command、deposit-command。
# 货币命令使用 {player}、{uuid}、{amount}。balance-placeholder 使用实际的 PlaceholderAPI 占位符。
# scale 是标准小数位字段；为兼容旧配置，parser 仍会在缺少 scale 时读取 precision。
currencies:
  money:
    enabled: true
    provider: "vault"
    display-name: "金币"
    scale: 2
    # 舍入策略：DOWN（默认），也可使用 HALF_UP 等标准 RoundingMode 名称。
    rounding: "DOWN"
    balance-placeholder: ""
    withdraw-command: ""
    deposit-command: ""
  points:
    enabled: true
    provider: "playerpoints"
    display-name: "点券"
    scale: 0
    rounding: "DOWN"
    balance-placeholder: ""
    withdraw-command: ""
    deposit-command: ""

# ========== 统一数据源（本体管控，1.4.0+）==========
# 所有模块默认共用此处的数据库连接配置，无需在各模块的 ArcartX*.yml 中重复填写 storage 节。
# 连接池由本体统一创建和关闭，彻底消除模块遗漏 initialize()/shutdown() 导致的「数据源不可用」和连接池泄漏问题。
#
# 两种模式：
#   sqlite（默认）：各模块仍使用各自的 <moduleId>.db 文件（如 lottery.db、battlepass.db），
#                   数据不合并，旧 .db 文件零迁移。本体按模块名分配独立连接。
#   mysql：所有模块共享同一个 HikariCP 连接池，连同一个数据库，各模块用 table-prefix 隔离表。
#          MySQL 连接数从 N×poolSize 降为 1 个池。
#
# 模块级覆盖（向后兼容）：
#   如果模块在自己的 ArcartX<Module>.yml 中填写了 storage.mode 等字段，
#   模块会优先使用自己的配置自建连接池（走旧路径），不影响旧 MySQL 数据库。
#   不填则自动使用此处的全局配置。
#
# 旧用户迁移指南：
#   - MySQL 用户：如果各模块原来连的是同一个库，直接把连接信息填到这里即可，模块配置里的 storage 节可删除。
#   - SQLite 用户：无需任何操作，各模块 .db 文件路径不变。
#   - 详见 Wiki: https://github.com/xuanmomo233/ArcartXSuite/wiki/存储架构
storage:
  # 存储模式：sqlite（单服，默认）/ mysql（跨服群组共享同一数据库）。
  mode: "sqlite"
  # MySQL 连接配置（mode=mysql 时生效，sqlite 模式下忽略）。
  mysql:
    host: "127.0.0.1"
    port: 3306
    database: "arcartxsuite"
    username: "root"
    password: ""
    # JDBC 连接参数（mode=mysql 时生效）。
    # use-ssl: 内网自签证书环境可设为 false。
    use-ssl: true
    # allow-public-key-retrieval: MySQL 8+ 缓存 RSA 公钥，内网可设为 true 避免握手失败。
    allow-public-key-retrieval: false
    # server-timezone: JDBC 驱动时区，需与 MySQL 服务器一致。
    server-timezone: "UTC"
    # character-encoding / use-unicode: 字符集控制。
    character-encoding: "UTF-8"
    use-unicode: true
    # 自定义 JDBC 参数（直接拼接到 URL 末尾，优先级最高，可覆盖上述项）。
    # 示例: "&socketTimeout=30000&autoReconnect=true"
    jdbc-params: ""
  # MySQL 连接池大小（sqlite 固定为 1，此项无效）。
  pool-size: 8

# ========== 统一二级密码（本体管控）==========
# 由本体统一提供的全服二级密码服务，Warehouse 与 Vanilla 随身背包共用同一个密码。
# 存储：默认独立 SQLite（plugins/ArcartX-Suite/secondary-password.db）；跨服群组可切换 MySQL 共享同一份密码。
# 密码以 PBKDF2 加盐哈希存储，不存明文。
# 设置 / 解锁 / 清除：推荐在模块 UI 中输入；也可用后备命令 /axs password set|unlock|clear。
# 未设置密码时视为无需验证；数据库异常时相关操作会被安全拒绝（fail-closed）。
security:
  secondary-password:
    # 验证成功后的解锁有效期（秒），超时后需重新输入密码。默认 1800（30 分钟）。
    # 注意：解锁会话保存在各子服内存中，跨服共享的只是密码本身，切换子服后需重新解锁。
    unlock-timeout-seconds: 1800
    # 密码长度策略：新建/修改二级密码时校验，所有模块共用同一限制。
    min-length: 4
    max-length: 32
    storage:
      # 存储模式：sqlite（单服，默认）/ mysql（跨服群组共享密码，各子服填同一个库）。
      mode: "sqlite"
      mysql:
        host: "127.0.0.1"
        port: 3306
        database: "arcartxsuite"
        username: "root"
        password: ""
      # MySQL 连接池大小（sqlite 固定为 1，此项无效）。
      pool-size: 4

# ========== 跨服传输（全模块共用）==========
# 各模块在 ArcartX*.yml 的 cross-server.enabled 开启后接入此配置。
# Redis 与 BungeeCord/Velocity Forward 可同时启用（双发 + 入站去重）。
cross-server:
  node-id: "default"
  # 入站消息允许的最大年龄，同时用于去重窗口。节点时钟允许最多 5 秒超前。
  dedupe-ttl-ms: 60000
  # 完整跨服信封的字符上限，包含 payload 和签名。
  max-payload-chars: 524288
  redis:
    enabled: false
    host: "127.0.0.1"
    port: 6379
    # ACL 服务账号。留空时沿用默认 Redis 用户的认证方式。
    username: ""
    password: ""
    database: 0
    channel: "AXS:CROSS"
    connect-timeout-ms: 5000
    # Redis 6.2+。同一频道的节点 ID 必须唯一，留存设置须一致。
    # 空间不足时暂停写入，直到仍在租约内的节点提交收件箱游标。
    stream-max-bytes: 268435456
    stream-reader-lease-ms: 120000
    # 发件箱落盘后才确认本地受理，仍按 dedupe-ttl-ms 限制签名帧有效期。
    outbox-max-bytes: 268435456
    # 0 时 Redis 写入成功即出箱。大于 0 时，等待指定数量的副本确认复制。
    outbox-replica-acks: 0
  proxy:
    enabled: false
    messenger-channel: "AXS_CROSS"
    forward-target: "ALL"
  signature:
    # enabled 负责出站签名，verify 负责入站验签。任一开启时必须填写 secret。
    enabled: false
    secret: ""
    verify: true

# ========== 全局属性插件桥接 ==========
# 控制 AXS 是否初始化各属性插件桥接。
# 即使服务器安装了对应插件，若此处设为 false，AXS 也不会连接该插件，
# 所有模块（title、prop、combateffect、entitytracker 等）均无法使用其属性功能。
# 这样可在安装多个属性插件时避免属性混乱，并保证各模块使用统一的属性来源。
attribute-bridges:
  attributeplus: true
  craneattribute: true
  mythiclib: true
  symphony: true

# ========== 持续药水效果（光环）==========
# 本体统一维护的「按来源登记、周期刷新」药水效果服务。
# 模块（如 title 称号的 display-effects）登记来源与效果表后，
# 本体每隔 refresh-interval-ticks 为在线玩家重复施加短时长效果，
# 来源移除/卸下后剩余效果在数秒内自然消失。
potion-aura:
  # 是否启用该服务；false 时所有模块的登记调用为空操作。
  enabled: true
  # 效果刷新周期（ticks，20 ticks = 1 秒）。最小 20，越短越平滑。
  refresh-interval-ticks: 60
  # 每次刷新施加的效果时长（ticks），必须大于刷新周期（引擎会自动兜底），
  # 同时也是卸下后效果残留的最长时间。
  effect-duration-ticks: 200
  # 施加的效果是否显示粒子；false 为无粒子的静默 buff。
  particles: false
  # 施加的效果是否在物品栏显示图标。
  icon: true

# ========== Mod 实体属性（通用 Mod 属性加成）==========
# 仅混合核心（Mohist / Arclight 等 Forge+Bukkit 环境）可用。
# 本体统一维护的「按来源登记」属性修饰器服务，模块（如 title 称号的
# permanent-display-bonuses）登记后可给玩家挂载任意 Mod 注册的实体属性，
# 例如 gunsmithlib:bullet_damage（枪械伤害）、apothic_attributes:crit_damage 等。
mod-attributes:
  # 是否启用该服务；false 时所有登记调用为空操作。
  enabled: true

# ========== 全局内容审核（敏感词过滤）==========
# 统一管理本地词库、云端词库、标点穿透防护、白名单等过滤规则，
# 供 chat / market / mail 等模块统一调用。
# 启用后，玩家在聊天、留言、邮件等场景输入的文本会先经过此过滤器。
#   - cancel-on-match: true  命中敏感词时直接取消操作（消息不发送 / 留言不提交）
#   - cancel-on-match: false 将原文中命中的区间替换为 replacement 后继续
# 标点穿透防护：匹配前先剥离 ignored-punctuations 中的标点，
#   防止玩家用 f.u.c.k 等方式绕过过滤。
moderation:
  # 是否启用全局敏感词过滤。
  enabled: true
  # 命中后是否直接取消操作；false 表示替换后继续。
  cancel-on-match: false
  # 替换字符或文本。
  replacement: "*"
  # 本地屏蔽词列表（不区分大小写，全角 ASCII 与半角等效）。
  blocked-words:
    - "NMSL"
    - "fuck"
    - "shit"
  # 本地屏蔽正则列表（不区分大小写）。
  blocked-patterns: []
  # 匹配时忽略的标点符号（匹配前先剥离这些字符，防止插入标点绕过）。
  ignored-punctuations:
    - "!"
    - "."
    - ","
    - "#"
    - "$"
    - "%"
    - "&"
    - "*"
    - "("
    - ")"
    - "|"
    - "?"
    - "/"
    - "@"
    - "\""
    - "\\"
    - ";"
    - "["
    - "]"
    - "{"
    - "}"
    - "+"
    - "~"
    - "-"
    - "_"
    - "="
    - "^"
    - "<"
    - ">"
    - " "
    - "　"
    - "！"
    - "。"
    - "，"
    - "￥"
    - "（"
    - "）"
    - "？"
    - "、"
    - "“"
    - "‘"
    - "；"
    - "【"
    - "】"
    - "——"
    - "……"
    - "《"
    - "》"
    - "`"
  # 额外忽略 Unicode 空白和标点，作用于 Suite 词库与白名单的匹配。
  # 正则匹配仍只剥离 ignored-punctuations 中指定的字符或序列。
  ignore-separators: false
  # 只有完全位于白名单词组内的命中才放行。
  whitelist:
    - "has been"

  # 可选接入 Redact 插件的本地审核服务，并复用其已同步的词库和精确结果缓存。
  # 命中后使用 Suite 的拦截或替换规则。Redact 不可用时继续使用 Suite 规则。
  redact:
    enabled: false

  # ── 云端词库 ───────────────────────────────────────
  cloud:
    # 远程词库开关；开启后会定期拉取 urls 内容并并入过滤规则。
    enabled: true
    # 远程词库地址列表（支持多个 URL）。
    # 支持三种格式：
    #   1. 纯文本：每行一个词，# 开头为注释
    #   2. JSON 对象：自动识别 words / data / list 数组字段，如 {"words": ["fuck", "sb"]}
    #   3. JSON 数组：如 ["fuck", "sb"]
    urls:
      # - "https://raw.githubusercontent.com/Yurinann/Filter-Thesaurus-Cloud/main/database.json"
      # 服务器在国内连不上 raw.githubusercontent.com（DNS 污染）时，可改用镜像加速，例如：
      - "https://ghproxy.net/https://raw.githubusercontent.com/Yurinann/Filter-Thesaurus-Cloud/main/database.json"
      # 或 jsDelivr CDN（国内一般可直连，有缓存，上游更新可能延迟数小时生效）：
      # - "https://cdn.jsdelivr.net/gh/Yurinann/Filter-Thesaurus-Cloud@main/database.json"
      # 有时导致误判，自行开启
      # - "https://raw.githubusercontent.com/konsheng/Sensitive-lexicon/main/ThirdPartyCompatibleFormats/TrChat/SensitiveLexicon.json"
    # 云端词库中要忽略的词（不区分大小写）。
    ignored:
      - "nt"
    # 远程词库刷新间隔，单位分钟。
    refresh-minutes: 60

# ========== 全局按键绑定 ==========
# 由宿主统一注册到 ArcartX 客户端，各模块共享。
# name: ArcartX 注册名（玩家可在按键设置中看到）
# default-key: 默认键位（GLFW 键名，如 F、G、H、KP_8 等）
# category: 按键分类名（显示在按键设置界面）
# module: 归属模块 id（可选，单值或列表）。标注后仅当至少一个归属模块
#   真实启用（onEnable 成功）时才注册到客户端；归属模块禁用或加载失败
#   则该键不会出现在玩家按键设置中。未标注 module 的条目在启动时无条件
#   注册——用于无订阅者的纯声明键（如 combateffect 包定义
#   trigger: keybind 匹配的自定义键）。
keybinds:
  # 全局交互键，多模块按优先级订阅（数字越小越优先）：
  #   - Pickup（仅在模块明确配置订阅此键时，优先级 10）：直接收取当前类
  #   - Conversation 对话（优先级 50）：按下确认/推进对话
  # Pickup 默认使用独立的 AXS_PICKUP_PICK，不订阅此键。
  # 共享键：pickup 与 conversation 任一启用即注册，都禁用才不注册。
  interact:
    name: AXS_INTERACT
    default-key: G
    category: ArcartXSuite
    module: [pickup, conversation]
  # 导航上一项键，Conversation 模块（优先级 10）订阅，
  # 用于对话选项列表中向上移动选中项。
  navigate-prev:
    name: AXS_NAVIGATE_PREV
    default-key: UP
    category: ArcartXSuite
    module: conversation
  # 导航下一项键，Conversation 模块（优先级 10）订阅，
  # 用于对话选项列表中向下移动选中项。
  navigate-next:
    name: AXS_NAVIGATE_NEXT
    default-key: DOWN
    category: ArcartXSuite
    module: conversation
  # Pickup：直接收取清单当前类，不打开菜单。
  # 与模块 scanner.keybind.name 对应；其他四个清单按键同理。
  pickup-pick:
    name: AXS_PICKUP_PICK
    default-key: F
    category: ArcartXSuite
    module: pickup
  pickup-previous:
    name: AXS_PICKUP_PREVIOUS
    default-key: LEFT
    category: ArcartXSuite
    module: pickup
  pickup-next:
    name: AXS_PICKUP_NEXT
    default-key: RIGHT
    category: ArcartXSuite
    module: pickup
  pickup-all:
    name: AXS_PICKUP_ALL
    default-key: J
    category: ArcartXSuite
    module: pickup
  pickup-details:
    name: AXS_PICKUP_DETAILS
    default-key: K
    category: ArcartXSuite
    module: pickup
  # Map 模块打开全屏地图键。
  # Map 模块订阅此键；按下时打开 map_menu UI。
  map-menu:
    name: AXS_MAP_MENU
    default-key: M
    category: ArcartXSuite
    module: map
  # Map 模块切换小地图 HUD 键。
  # Map 模块订阅此键；按下时切换 map_hud 显示/隐藏。
  map-hud:
    name: AXS_MAP_HUD
    default-key: H
    category: ArcartXSuite
    module: map

# ========== Tacz 模组伤害兼容 ==========
# Timeless and Classics Guns（永恒枪械工坊）模组伤害事件兼容。
# 启用后，AXS 能正确识别 Tacz 枪械造成的伤害来源，使 combateffect（伤害飘字 / 击杀特效）、
# entitytracker（Boss 追踪）等模块的受伤/死亡事件统计正常工作。
# 若服务器未安装 Tacz 模组，保持开启也无副作用。
tacz-compat:
  enabled: true
  # 是否在控制台输出 Tacz 伤害调试信息（仅排错时使用）。
  debug: false

# ========== 聊天签名绕过（Paper 1.21+ 混合登录兼容）==========
# Paper 1.21+ 引入了安全聊天验证（secure-chat validation），
# LittleSkin / 离线玩家的聊天消息没有 Mojang 签名，会被 Paper 拒绝并提示
# "Chat message validation failure"。
# 启用后，AXS 会在玩家加入时自动移除 Paper 对该玩家的签名验证路径，
# 让混合登录玩家与离线玩家正常发送聊天消息。
# 若服务器仅使用微软正版账号（无 LittleSkin / 离线），可关闭此选项。
chat-sign-bypass:
  enabled: true
  # 已存在的签名聊天会话始终保留；未知平台布局不修改验证状态。

# ========== 多方认证（authlib-injector 管理）==========
# 仅在单端服务器有效。群组服请使用 ArcartXSuite-Proxy 插件。
# 本配置控制 /axs auth setup 命令生成启动脚本时的行为，
# 以及 authlib-injector 版本检测。
auth:
  # 是否启用 authlib-injector 相关功能（混合登录 / 外置登录）。默认禁用。
  # 需要 LittleSkin / 微软正版混合登录时设为 true。
  enabled: false
  # 启动时自动检测 authlib-injector 版本并提示更新
  auto-check-version: false
  # Yggdrasil 认证源（用于 /axs auth setup 生成启动脚本）
  # 【混合登录】若 URL 包含 ?mixed，AXS 会：
  #   1. 生成的 start-mixed-auth 脚本会【先独立启动】本地 Yggdrasil 混合代理（见下方 mixed-proxy-port），
  #      再启动服务器，authlib-injector 指向该本地代理。
  #      这样才能解决 authlib-injector premain 时序问题（代理必须先于服务器存在）。
  #   2. 代理行为：hasJoined 先查 Mojang，未命中再尝试受信 LittleSkin，
  #      让 LittleSkin 玩家与微软正版玩家都能进服。
  # 注意：?mixed 并非 authlib-injector/LittleSkin 的有效参数，仅是 AXS 的“启用混合代理”开关。
  # 若只需外置登录，改为纯 LittleSkin："https://littleskin.cn/api/yggdrasil"
  yggdrasil-source: "https://littleskin.cn/api/yggdrasil?mixed"
  # 本地混合代理监听端口（固定）。start-mixed-auth 脚本与服务器都使用此端口，
  # authlib-injector 在服务器启动时会连接 http://127.0.0.1:<此端口>。必须是未被占用的端口（1-65535）。
  mixed-proxy-port: 25599
  # 混合代理主机地址。
  # 【单端服务器】127.0.0.1（默认，混合代理与服务器在同一 JVM 进程组）
  # 【单机群组服】127.0.0.1（代理端插件与后端子服在同一台机器）
  # 【跨机群组服】代理端机器的 IP（如 10.0.0.5），需与 proxy-config.yml 的 mixed-proxy-bind-host 一致
  mixed-proxy-host: "127.0.0.1"
  # 混合代理 内部健康接口鉴权 token（跨机群组服必配）。
  # 必须与代理端 proxy-config.yml 的 mixed-proxy-token 完全一致。
  # 单机模式（127.0.0.1）留空即可。
  mixed-proxy-token: ""

# ========== 客户端数据包防护（防连点 / 防刷）==========
# 针对 ArcartX UI 各模块的客户端回包进行速率限制，防止玩家通过连点器 / 宏脚本刷取资源。
# 以「滑动窗口 + 令牌桶」方式计数：在 window-ms 毫秒内，同一动作最多允许 max-hits 次，
# 超出后根据 mode 进行拦截或惩罚。
#   mode 可选值:
#     silent  — 静默丢弃超出的数据包，玩家无感知（推荐常规操作）。
#     notify  — 丢弃并发送提示消息（notify-message），受 notify-cooldown-ms 冷却限制。
#     punish  — 丢弃并自动执行 punish-command（如 kick / ban 等控制台指令）。
# 各模块可独立覆盖 defaults；actions 下可按动作名进一步细化（如 title 的 equip/unequip 等）。
client-packet-guard:
  enabled: true
  # 丢包日志：开启后被 guard 拦截的包会在控制台输出一行诊断
  # （玩家/路由/packetId/原因），排查"个别玩家按钮无响应"时打开。
  debug: false
  # 清理过期计数器的周期（ticks，20 ticks = 1 秒）。
  # 减小此值可降低内存占用，但会增加清理开销；增大则节省 CPU，但计数器会滞留更久。
  cleanup-interval-ticks: 200
  defaults:
    # 默认时间窗口（毫秒）。
    window-ms: 1000
    # 默认窗口内允许的最大操作次数。
    max-hits: 20
    # 默认拦截模式：silent / notify / punish。
    mode: "silent"
    # 当 mode 为 notify 时发送给玩家的提示消息（支持 & 颜色码）。
    notify-message: "&c操作过快，请稍后再试。"
    # 提示消息的冷却时间（毫秒），防止消息刷屏。
    notify-cooldown-ms: 3000
    # 惩罚命令的冷却时间（毫秒），防止连续超限反复执行控制台命令（kick/ban 刷屏）。
    punish-cooldown-ms: 5000
    # 当 mode 为 punish 时执行的控制台命令。
    # 可用占位符: {player}（玩家名）, {uuid}（玩家 UUID）, {action}（动作名）, {module}（模块名）。
    punish-command: ""
  modules:
    title:
      window-ms: 1000
      max-hits: 4
      mode: "silent"
      actions:
        equip:
          window-ms: 800
          max-hits: 2
          mode: "silent"
        unequip:
          window-ms: 800
          max-hits: 2
          mode: "silent"
        unequip_group:
          window-ms: 800
          max-hits: 2
          mode: "silent"
        unequip_all:
          window-ms: 800
          max-hits: 2
          mode: "silent"
        hide:
          window-ms: 800
          max-hits: 2
          mode: "silent"
        unhide:
          window-ms: 800
          max-hits: 2
          mode: "silent"
    mail:
      window-ms: 1000
      max-hits: 4
      mode: "silent"
      actions:
        compose-send:
          window-ms: 5000
          max-hits: 1
          mode: "silent"
        claimall:
          window-ms: 5000
          max-hits: 1
          mode: "silent"
        deleteall:
          window-ms: 5000
          max-hits: 1
          mode: "silent"
        cdk:
          window-ms: 3000
          max-hits: 1
          mode: "silent"
    questgps:
      window-ms: 500
      max-hits: 4
      mode: "silent"
      actions:
        accept_quest:
          window-ms: 2000
          max-hits: 1
          mode: "notify"
        abandon_quest:
          window-ms: 2000
          max-hits: 1
          mode: "notify"
    map:
      window-ms: 500
      max-hits: 4
      mode: "silent"
