# EventPacket 规则文件: examples
# 目录下每个 *.yml 文件可包含多个规则定义，根键即为规则 ID。
# 同名规则以最后加载的文件为准；目录文件按文件名排序加载。
# trigger 可选值:
# - admitted 玩家加入服务器。
# - first-admitted 玩家首次加入服务器。
# - quit 玩家退出服务器。
# - placeholder-increase / papi-increase 指定 PAPI 数值增加时触发。
# - placeholder-decrease / papi-decrease 指定 PAPI 数值减少时触发。
# - placeholder-threshold 指定 PAPI 数值达到阈值时触发。
# - mob-kill-count 玩家击杀指定怪物累计到条件时触发。
# - command-signal 管理命令手动发送信号时触发。
# - quest-accept Chemdah 任务接受后触发（signal 可指定任务ID过滤）。
# - quest-complete Chemdah 任务完成后触发（signal 可指定任务ID过滤）。
# - quest-fail Chemdah 任务失败后触发（signal 可指定任务ID过滤）。
# - objective-complete Chemdah 目标完成后触发（signal 可指定 quest_id 或 objective_name 过滤）。
# - objective-continue Chemdah 目标继续时触发（signal 可指定 quest_id 或 objective_name 过滤）。
# - objective-restart Chemdah 目标重启时触发（signal 可指定 quest_id 或 objective_name 过滤）。
# - chemdah-level-change Chemdah 等级变化时触发（signal 可指定等级选项ID过滤）。
# - script-js JavaScript 脚本表达式返回 true 时触发（script 字段写 JS 代码）。
# - script-aria Aria 脚本表达式返回 true 时触发（script 字段写 Aria 代码）。
#
# 默认每个玩家只触发一次；repeatable: true 可重复触发，cooldown 支持 10s / 5m / 2h / 1d。
# conditions 与 prop 模块相同，格式为 "%placeholder% operator value"，支持 == != >= <= > < contains regex。
# 动作按顺序执行，单个动作失败不会中断后续动作。
# 动作变量（{变量名} 形式，渲染时未匹配的占位符原样保留）:
#
# ── 玩家主体（触发者；player_* 与 subject_* 等价，推荐用 player_*）──
#   {player_name}          玩家名（如 "Steve"）
#   {player_display_name}  显示名（含前缀后缀，可能为空）
#   {player_uuid}          玩家 UUID
#   {player_world}         所在世界名
#   {player_x}/{player_y}/{player_z}  玩家所在方块坐标（整数）
#   {player_health}        当前生命值
#   {player_max_health}    最大生命值
#   {player_level}         等级（经验等级）
#   {player_ping}          网络延迟（毫秒）
#
# ── 接收者（仅 ui-packet 动作且 recipients 含 all/world 时才有意义）──
#   {receiver_name}        接收者玩家名
#   {receiver_display_name}接收者显示名
#   {receiver_uuid}        接收者 UUID
#   {receiver_role}        接收者角色（self/all/world 等，对应 recipients 配置值）
#
# ── 触发上下文 ──
#   {trigger} / {trigger_type}  触发类型（admitted/first-admitted/quit/papi-increase/...）
#   {world}                玩家所在世界（同 {player_world}）
#   {placeholder}          PAPI 占位符（仅 papi-increase/decrease/threshold 触发）
#   {old_value}            占位符旧值（字符串形式）
#   {new_value}            占位符新值（字符串形式）
#   {old_number}           旧数值（BigDecimal 去尾零字符串，非数值触发时为空）
#   {new_number}           新数值
#   {delta_number}         数值变化量（new_number - old_number，任一为空则为空）
#   {change_direction}     变化方向：increase / decrease（仅 papi-increase/decrease 触发，其余为空）
#   {signal} / {command_signal}  信号名（command-signal / quest-* / objective-* / chemdah-level-change 触发）
#
# ── 账号信息（由宿主统一账号识别服务解析，未注入时为空）──
#   {auth_provider}         账号类型：microsoft / littleskin / offline
#   {auth_provider_display} 账号类型显示名
#   {auth_verified}      是否正版（true/false）
#
# ── 时间 ──
#   {timestamp_unix}       Unix 时间戳（秒）
#   {timestamp_local}      本地时间字符串（yyyy-MM-dd HH:mm:ss）
#
# ── 动态变量（按触发类型由监听器注入，未对应触发时为空）──
#   客户端包 client-packet:           {preset_id}、{arg1}、{arg2}...（按客户端 data 顺序）
#   Chemdah 任务 quest-accept/complete/fail:  {quest_id}
#   Chemdah 目标 objective-*:          {quest_id}、{task_id}、{objective_type}、{objective_name}
#   Chemdah 等级 chemdah-level-change: {level_option}、{old_level}、{new_level}、{old_experience}、{new_experience}、{level_delta}
#
# ── signal 过滤说明 ──
#   quest-* 触发：rule.signal 留空匹配所有任务；填任务ID仅匹配该任务。
#   objective-* 触发：rule.signal 可填 quest_id 或 objective_name 过滤。
#   chemdah-level-change 触发：rule.signal 填等级选项ID过滤。

# 首次加入服务器时播放字幕、发送聊天卡片并推送主线任务
first_join_offer_mainline:
  enabled: false                 # 是否启用该规则
  trigger: first-admitted            # 触发类型: 玩家首次加入服务器
  repeatable: false              # 是否可重复触发
  actions:                       # 动作链，按顺序执行
    - type: subtitle.play        # 播放字幕组
      group-id: "quest_intro"    # 字幕组 ID
    - type: chat.card            # 发送聊天卡片
      card-id: "quest_offer"     # 卡片模板 ID
      data:                      # 卡片自定义数据
        quest: "main/example_quest"  # 任务路径
        title: "初入岛屿"        # 卡片标题
    - type: questgps.offer       # 推送任务到 QuestGPS
      quest-id: "main/example_quest"  # 任务 ID
      open-menu: true            # 是否自动打开任务菜单
    - type: mail.send            # 发送邮件
      preset-id: "new_player"  # 邮件预设 ID (支持变量)

# 击杀 10 个僵尸后触发遭遇任务
kill_zombie_trigger_encounter:
  enabled: false
  trigger: mob-kill-count        # 触发类型: 击杀怪物计数
  count: 10                      # 击杀数量阈值
  repeatable: false
  worlds:                        # 限定生效世界列表
    - "world"
  entity-types:                  # 统计的实体类型 (EntityType 枚举名)
    - "ZOMBIE"
  mythic-mob-ids: []             # MythicMobs 怪物 ID 列表 (为空则不匹配 MM)
  actions:
    - type: questgps.offer
      quest-id: "encounter/example_rare"
      open-menu: true
    - type: subtitle.play
      group-id: "encounter_trigger"

# 玩家等级达到 10 级时推送支线任务
power_threshold_offer_side:
  enabled: false
  trigger: placeholder-threshold # 触发类型: PAPI 占位符达到阈值
  placeholder: "%player_level%"  # 监听的 PAPI 占位符
  threshold: 10                  # 阈值
  require-non-empty: true        # 占位符值为空时是否不触发
  repeatable: false
  actions:
    - type: questgps.offer
      quest-id: "side/example_side"
      open-menu: false
    - type: chat.card
      card-id: "quest_unlock"
      data:
        quest: "side/example_side"
        level: "{new_number}"    # 使用新数值变量

# 命令信号触发: 接受主线任务
command_signal_accept_mainline:
  enabled: false
  trigger: command-signal        # 触发类型: 命令信号
  signal: "accept_mainline"      # 信号名称，需与管理命令发送的信号一致
  repeatable: true               # 可重复触发
  cooldown: "5s"                 # 冷却时间
  actions:
    - type: questgps.accept      # 接受指定任务
      quest-id: "{quest-id}"     # 任务 ID (上下文变量)
    - type: command.dispatch     # 派发命令
      executor: console          # 执行者: console/player
      command: "say {player} accepted {quest-id}"

# 任务完成后发放称号并推送 UI 通知
# 在对应 Chemdah 任务的 addon.axs-view.hooks.completed 中添加 questgps_quest_completed。
quest_completed_title_reward:
  enabled: false
  trigger: command-signal
  signal: "questgps_quest_completed"
  repeatable: false
  actions:
    - type: title.give           # 发放称号
      title-id: "newcomer"       # 称号 ID
      duration: "permanent"      # 持续时间: permanent(永久) / 如 7d(7天)
    - type: ui-packet            # 向客户端发送 UI 数据包
      ui-id: "示例UI"            # 目标 UI ID
      packet-handler: "questCompleted"  # 目标 packetHandler 名称
      recipients:                # 接收者列表
        - self                   # self=仅触发者, all=全服, world=同世界
      pack:                      # 包数据 (键值对，客户端 packet['key'] 读取)
        player: "{player_name}"
        quest: "{quest_id}"
        time: "{timestamp_local}"

# ── 模块联动示例 ──────────────────────────────────────────────

# Boss 结算庆祝: 播放字幕、发送奖励邮件、发放称号
boss_settlement_celebration:
  enabled: false
  trigger: command-signal
  signal: "boss_settlement"
  repeatable: true
  cooldown: "3s"
  actions:
    - type: subtitle.play
      group-id: "boss_victory"
    - type: mail.send            # 发送邮件
      preset-id: "boss_reward_{boss_id}"  # 邮件预设 ID (支持变量)
    - type: title.give
      title-id: "boss_slayer"
      duration: "7d"             # 持续 7 天

# 签到连续里程碑: 播放庆祝字幕并发送签到奖励邮件
signin_streak_milestone:
  enabled: false
  trigger: command-signal
  signal: "signin_success"
  repeatable: true
  cooldown: "1d"                 # 每天最多触发一次
  actions:
    - type: subtitle.play
      group-id: "signin_celebrate"
    - type: mail.send
      preset-id: "signin_bonus"

# 微软正版玩家首次注册后: 播放欢迎字幕、推送教程任务、发送欢迎邮件
welcome_after_register:
  enabled: false
  trigger: first-admitted
  conditions:                    # 触发条件列表，全部满足才执行动作
    - "%axsauth_provider% == microsoft"  # 仅微软正版账号
  repeatable: false
  actions:
    - type: subtitle.play
      group-id: "welcome_cinematic"
    - type: questgps.offer
      quest-id: "main/tutorial"
      open-menu: true
    - type: mail.send
      preset-id: "welcome_gift"

# LittleSkin 玩家首次注册后: 播放欢迎字幕并发送聊天卡片
welcome_littleskin_after_register:
  enabled: false
  trigger: first-admitted
  conditions:
    - "%axsauth_provider% == littleskin"  # 仅 LittleSkin 账号
  repeatable: false
  actions:
    - type: subtitle.play
      group-id: "welcome_cinematic"
    - type: chat.card
      card-id: "quest_offer"
      data:
        title: "LittleSkin 登录奖励"
        source: "{auth_provider_display}"

# CDK 兑换成功: 播放战斗特效和字幕
cdk_redeemed_effect:
  enabled: false
  trigger: command-signal
  signal: "cdk_redeemed"
  repeatable: true
  cooldown: "5s"
  actions:
    - type: combateffect.play    # 播放战斗特效
      pack: "{player_name};CDK;{preset_name}"  # 特效包数据
    - type: subtitle.play
      group-id: "cdk_success"

# ── Chemdah 任务事件示例 ────────────────────────────────────────

# 玩家接受任务时播放字幕
chemdah_quest_accepted:
  enabled: false
  trigger: quest-accept
  # signal 留空则匹配所有任务；填入任务ID可限定特定任务
  # signal: "main/tutorial"
  repeatable: true
  cooldown: "3s"
  actions:
    - type: subtitle.play
      group-id: "quest_accepted"
    - type: ui-packet
      ui-id: "任务通知UI"
      packet-handler: "questAccepted"
      recipients:
        - self
      pack:
        player: "{player_name}"
        quest_id: "{quest_id}"

# 玩家完成特定任务时发放称号和邮件奖励
chemdah_quest_completed_reward:
  enabled: false
  trigger: quest-complete
  signal: "main/tutorial"
  repeatable: false
  actions:
    - type: title.give
      title-id: "quest_master"
      duration: "permanent"
    - type: mail.send
      preset-id: "quest_complete_reward"
    - type: subtitle.play
      group-id: "quest_completed"

# 任务失败时提示
chemdah_quest_failed_notify:
  enabled: false
  trigger: quest-fail
  repeatable: true
  cooldown: "5s"
  actions:
    - type: subtitle.play
      group-id: "quest_failed"

# 目标完成时发送 UI 通知
# 变量:
#   {quest_id}       - 任务ID（如 "main/tutorial"）
#   {task_id}        - 任务下的阶段ID
#   {objective_type} - 目标类型（Java 类简名，如 "Kill"、"Reach"）
#   {objective_name} - 目标名称（如 "player kill"）
# signal 可填 quest_id（如 "main/tutorial"）或 objective_name（如 "player kill"）过滤
chemdah_objective_completed:
  enabled: false
  trigger: objective-complete
  repeatable: true
  cooldown: "1s"
  actions:
    - type: ui-packet
      ui-id: "任务进度UI"
      packet-handler: "objectiveComplete"
      recipients:
        - self
      pack:
        quest_id: "{quest_id}"
        task_id: "{task_id}"
        objective_type: "{objective_type}"
        objective_name: "{objective_name}"

# 仅当 "player kill" 类型的目标完成时触发
# signal 填 objective_name 即可按目标类型过滤
chemdah_kill_objective_done:
  enabled: false
  trigger: objective-complete
  signal: "player kill"
  repeatable: true
  cooldown: "3s"
  actions:
    - type: subtitle.play
      group-id: "kill_objective_done"

# 目标继续时触发（进度推进但尚未完成）
chemdah_objective_continue:
  enabled: false
  trigger: objective-continue
  repeatable: true
  cooldown: "1s"
  actions:
    - type: ui-packet
      ui-id: "任务进度UI"
      packet-handler: "objectiveContinue"
      recipients:
        - self
      pack:
        quest_id: "{quest_id}"
        objective_name: "{objective_name}"

# 目标重启时触发（进度重置）
chemdah_objective_restart:
  enabled: false
  trigger: objective-restart
  repeatable: true
  cooldown: "5s"
  actions:
    - type: subtitle.play
      group-id: "objective_restart"

# Chemdah 等级提升时庆祝
# 变量:
#   {level_option}   - 等级选项ID（如 "adventure"，对应 signal 过滤）
#   {old_level}      - 变化前等级
#   {new_level}      - 变化后等级
#   {old_experience} - 变化前经验值
#   {new_experience} - 变化后经验值
#   {level_delta}    - 等级变化量（new_level - old_level，降级时为负）
# conditions 支持 EventPacket 上下文变量（{..} 语法），可在条件中比较上下文变量与字面量或其他变量。
chemdah_level_up_celebrate:
  enabled: false
  trigger: chemdah-level-change
  # signal 可指定等级选项ID，如 "adventure" 仅匹配冒险等级
  # signal: "adventure"
  repeatable: true
  cooldown: "5s"
  conditions:
    - "{new_level} > {old_level}"
  actions:
    - type: subtitle.play
      group-id: "level_up"
    - type: command.dispatch
      executor: console
      command: "say {player} 的 {level_option} 等级提升到了 {new_level} 级！"

# ── 脚本触发器示例 ──────────────────────────────────────────

# JavaScript 脚本触发器：玩家血量低于 25% 时触发急救 UI
js_low_health_alert:
  enabled: false
  trigger: script-js
  repeatable: true
  cooldown: "30s"
  script: |
    player.getHealth() / player.getMaxHealth() < 0.25
  actions:
    - type: subtitle.play
      group-id: "low_health_warning"

# Aria 脚本触发器：玩家 Y 坐标高于 200 时触发高空成就
# ARIA 表达式中 player 门面注入到 global. 命名空间，需用 global.player 访问
aria_high_altitude:
  enabled: false
  trigger: script-aria
  repeatable: true
  cooldown: "1m"
  script: |
    playerY = global.player.getLocation().getY()
    playerY > 200
  actions:
    - type: subtitle.play
      group-id: "high_altitude"
    - type: command.dispatch
      executor: console
      command: "say {player} 飞到了 Y={script_result} 的高空！"
