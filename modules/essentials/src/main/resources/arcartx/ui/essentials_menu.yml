                      自动工具文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 24
                          texts: "'&f自动工具: ' + (var.autotoolEnabled == 'true' ? '&a开启' : '&c关闭')"
                          fontSize: 36
                          through: true
                  # 背包整理
