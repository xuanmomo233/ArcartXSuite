# AXS Market — 管理员交易管理（只读）
ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    admin_denied: |-
      Screen.close()
    audit_result: |-
      if(packet['channel'] == 'detail'){
        if(packet['request'] == var.detailRequest && packet['id'] == var.selectedId && !var.loading && !var.ignoreDetail){
          var.resultMsg = packet['message']
          var.detailLoading = false
          var.detailReady = false
        }
      } elif(packet['request'] == var.listRequest){
        var.resultMsg = packet['message']
        var.loading = false
        var.hydrating = false
        var.formRenderPending = false
      }
    audit_data: |-
      if(var.ignoreList || packet['request'] != var.listRequest){
        return
      }
      var.resultMsg = ''
      var.listReady = true
      var.listAge = 0
      var.packetId = packet['packetId']
      var.rows = packet['rows']
      var.selectionPresent = false
      for(key in var.rows.keys()){
        if(var.rows[key]['id'] == var.selectedId){
          var.selectionPresent = true
        }
      }
      if(!var.selectionPresent){
        var.selectedId = ''
        var.detailReady = false
        var.detailLoading = false
      }
      elif(var.selectedId != ''){
        var.detailReady = false
        var.detailLoading = false
      }
      var.count = packet['count']
      var.page = packet['page']
      var.pages = packet['pages']
      var.pageText = packet['pageText']
      var.total = packet['total']
      var.party = packet['player']
      var.appliedParty = var.party
      var.item = packet['item']
      var.appliedItem = var.item
      var.from = packet['from']
      var.appliedFrom = var.from
      var.until = packet['until']
      var.appliedUntil = var.until
      var.type = packet['type']
      var.appliedType = var.type
      var.state = packet['state']
      var.appliedState = var.state
      var.scope = packet['scope'] == 'all' ? 'operations' : packet['scope']
      var.appliedScope = var.scope
      var.filterDirty = false
      var.group = packet['group']
      var.readAt = packet['readAt']
      var.zone = packet['zone']
      var.hydrating = true
      var.formRenderPending = true
      scheduler.delay(50, -> {
        var.hydrateAuditForm()
      })
      var.rowsRenderPending = true
      scheduler.delay(50, -> {
        var.renderAuditRows()
      })
    audit_detail_data: |-
      if(packet['request'] == var.detailRequest && packet['id'] == var.selectedId && !var.loading && !var.ignoreDetail){
        var.detailLoading = false
        var.detailReady = true
        var.detailTitle = packet['title']
        var.detailGroup = packet['group']
        var.detailKind = packet['kind']
        var.detailState = packet['state']
        var.detailSource = packet['source']
        var.detailPlayer = packet['player']
        var.detailPlayerId = packet['playerId']
        var.detailOther = packet['other']
        var.detailOtherId = packet['otherId']
        var.detailAmount = packet['amount']
        var.detailMaterial = packet['material']
        var.detailTime = packet['time']
        var.detailIcon = (packet['icon'] != none && packet['icon'] != '') ? packet['icon'] : var.air
        var.detailQuantity = packet['quantity']
        var.notes = packet['noteLines']
        var.noteCount = var.notes.keys().length
        scheduler.delay(50, -> {
          if(val.详情物品 != none){
            val.详情物品.seticon()
          }
        })
        var.notesRenderPending = true
        scheduler.delay(50, -> {
          var.renderAuditNotes()
        })
      }
  action:
    load: |-
      var.packetId = 'AXS_MARKET'
      var.busy = false
      var.requestSerial = 0
      var.listRequest = ''
      var.detailRequest = ''
      var.loading = true
      var.listReady = false
      var.filterDirty = false
      var.ignoreList = false
      var.ignoreDetail = false
      var.listAge = 0
      var.detailAge = 0
      var.auditCopies = {}
      var.noteCopies = {}
      var.auditGeneration = 0
      var.noteGeneration = 0
      var.rowsRenderPending = false
      var.formRenderPending = false
      var.notesRenderPending = false
      var.hydrating = false
      var.detailLoading = false
      var.detailReady = false
      var.scope = 'history'
      var.type = 'ALL'
      var.state = 'ALL'
      var.party = ''
      var.item = ''
      var.from = ''
      var.until = ''
      var.group = ''
      var.rows = {}
      var.count = 0
      var.renderedCount = -1
      var.page = 0
      var.pages = 1
      var.pageText = '1/1'
      var.total = '0'
      var.zone = ''
      var.readAt = ''
      var.resultMsg = ''
      var.selectedId = ''
      var.detailTitle = ''
      var.detailGroup = ''
      var.detailKind = ''
      var.detailState = ''
      var.detailSource = ''
      var.detailPlayer = ''
      var.detailPlayerId = ''
      var.detailOther = ''
      var.detailOtherId = ''
      var.detailAmount = ''
      var.detailMaterial = ''
      var.detailTime = ''
      var.detailQuantity = 0
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.typeLabels = {'ALL':'全部','AUCTION':'拍卖','PSHOP':'玩家店铺','SHOP':'系统商店','RECYCLE':'回收','EXCHANGE':'NPC 兑换','OTHER':'其他'}
      var.stateLabels = {'ALL':'全部','PENDING':'待发放','ISSUES':'失败与待核对','PREPARED':'已准备','READY':'待执行','RUNNING':'处理中','REVIEW':'需核对','DONE':'处理结束','FAILED':'明确失败','CANCELLED':'已取消','EXPIRED':'已到期'}
      var.notes = {}
      var.noteCount = 0
      var.renderedNotes = -1
      var.detailIcon = '{"id":"minecraft:air","Count":1b}'
      var.appliedParty = ''
      var.appliedItem = ''
      var.appliedFrom = ''
      var.appliedUntil = ''
      var.appliedType = 'ALL'
      var.appliedState = 'ALL'
      var.appliedScope = 'history'
      var.scopeLabels = {'history':'业务历史','operations':'处理流水'}
      var.hydrateAuditForm = -> {
        if(var.formRenderPending && val.玩家输入 != none && val.物品输入 != none && val.开始时间输入 != none && val.结束时间输入 != none){
          val.玩家输入.setContent(var.party)
          val.物品输入.setContent(var.item)
          val.开始时间输入.setContent(var.from)
          val.结束时间输入.setContent(var.until)
          var.hydrating = false
          var.loading = false
          var.formRenderPending = false
          if(var.selectedId != ''){
            var.detailReady = false
            var.beginDetail()
            var.ignoreDetail = false
            var.detailAge = 0
            Packet.send(var.packetId, 'audit_detail', var.selectedId, var.detailRequest)
          }
        }
      }
      var.updateDirty = -> {
        var.filterDirty = var.party != var.appliedParty || var.item != var.appliedItem || var.from != var.appliedFrom || var.until != var.appliedUntil || var.type != var.appliedType || var.state != var.appliedState || var.scope != var.appliedScope
      }
      var.beginDetail = -> {
        var.requestSerial = var.requestSerial + 1
        var.detailRequest = 'detail' + var.requestSerial.round()
        var.detailLoading = true
        var.detailReady = false
        var.ignoreDetail = false
        var.detailAge = 0
      }
      var.beginList = -> {
        var.requestSerial = var.requestSerial + 1
        var.listRequest = 'list' + var.requestSerial.round()
        var.detailRequest = ''
        var.formRenderPending = false
        var.loading = true
        var.listAge = 0
        var.ignoreList = false
        var.ignoreDetail = true
        var.detailReady = false
        var.detailLoading = false
        var.resultMsg = ''
      }
      var.renderAuditRows = -> {
        if(val.流水行区 != none){
          if(var.流水行区GridRows == none || var.流水行区GridRows.size() != (var.count)){
            网格数据 = []
            if((var.count) > 0){
              for(网格序号 in range(0, (var.count) - 1)){
                网格数据.add(网格序号.round())
              }
            }
            var.流水行区GridRows = 网格数据
          }
          var.renderedCount = var.count
          val.流水滑块.setDragYRatio(0)
          var.rowsRenderPending = false
        }
      }
      var.renderAuditNotes = -> {
        if(val.详情说明行区 != none){
          if(var.详情说明行区GridRows == none || var.详情说明行区GridRows.size() != (var.noteCount)){
            网格数据 = []
            if((var.noteCount) > 0){
              for(网格序号 in range(0, (var.noteCount) - 1)){
                网格数据.add(网格序号.round())
              }
            }
            var.详情说明行区GridRows = 网格数据
          }
          var.renderedNotes = var.noteCount
          val.说明滑块.setDragYRatio(0)
          var.notesRenderPending = false
        }
      }
      var.applyFilter = -> {
        if(var.loading || var.hydrating){
          return
        }
        form = {}
        form['player'] = var.party
        form['item'] = var.item
        form['from'] = var.from
        form['until'] = var.until
        form['type'] = var.type
        form['state'] = var.state
        form['scope'] = var.scope
        var.beginList()
        Packet.send(var.packetId, 'audit_filter', json.stringify(form), var.listRequest)
      }
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.pageW = var.viewW - 96
      var.pageH = var.viewH - 72
      var.listW = var.pageW * 0.58
      var.detailW = var.pageW - var.listW - 72
    open: |-
      var.beginList()
      Packet.send(var.packetId, 'audit_open', var.listRequest)
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.pageW = var.viewW - 96
      var.pageH = var.viewH - 72
      var.listW = var.pageW * 0.58
      var.detailW = var.pageW - var.listW - 72
    seconds: |-
      if(var.formRenderPending){
        var.hydrateAuditForm()
      }
      if(var.rowsRenderPending){
        var.renderAuditRows()
      }
      if(var.notesRenderPending){
        var.renderAuditNotes()
      }
      if(var.loading){
        var.listAge = var.listAge + 1
        if(var.listAge >= 15){
          var.ignoreList = true
          var.formRenderPending = false
          var.loading = false
          var.hydrating = false
          var.resultMsg = '查询超时，请刷新或重新查询'
          Packet.send(var.packetId, 'audit_cancel', 'list', var.listRequest)
        }
      }
      if(var.detailLoading){
        var.detailAge = var.detailAge + 1
        if(var.detailAge >= 15){
          var.ignoreDetail = true
          var.detailLoading = false
          var.detailReady = false
          var.resultMsg = '详情读取超时，请重新读取'
          Packet.send(var.packetId, 'audit_cancel', 'detail', var.detailRequest)
        }
      }

