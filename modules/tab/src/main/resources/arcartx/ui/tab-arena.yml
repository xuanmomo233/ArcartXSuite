              maxDragY: "math.max(1, 52 * math.min(8, math.max(1, math.max(var.ArenaTAB红队人数, var.ArenaTAB蓝队人数))) - 52)"
              normal: ~188,210,224,230
              hover: ~35,159,214,230
              visible: var.ArenaTAB详细 && var.ArenaTAB红队人数 > 8
          蓝队滑轨:
            type: Texture
            attribute:
              x: 1190
              y: 148
              width: 6
              height: "52 * math.min(8, math.max(1, math.max(var.ArenaTAB红队人数, var.ArenaTAB蓝队人数)))"
              normal: ~92,121,145,170
              visible: var.ArenaTAB详细 && var.ArenaTAB蓝队人数 > 8
              through: true
          蓝队滑块:
            type: Texture
            val: ArenaBlueThumb
            attribute:
              x: 1190
              y: 148
              width: 6
              height: 52
              maxDragY: "math.max(1, 52 * math.min(8, math.max(1, math.max(var.ArenaTAB红队人数, var.ArenaTAB蓝队人数))) - 52)"
              normal: ~35,159,214,230
              hover: ~188,210,224,230
              visible: var.ArenaTAB详细 && var.ArenaTAB蓝队人数 > 8
          红队空状态:
            type: Text
            attribute:
              x: 72
              y: 156
              texts: ~&7红队暂无队员
              fontSize: 36
              visible: var.ArenaTAB详细 && var.ArenaTAB红队人数 == 0
              through: true
          蓝队空状态:
            type: Text
            attribute:
              x: 672
              y: 156
              texts: ~&7蓝队暂无队员
              fontSize: 36
