          - mob-id: vanilla:spider
            location: "75,61,12"
            amount: 2
          - mob-id: vanilla:spider
            location: "66,61,19"
            amount: 2
          - mob-id: vanilla:creeper
            location: "83,61,19"
            amount: 1
