              width: 420
              height: 480
            children:
              卡片底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,30,44,244
                  shape: ~round_rect
                  radius: 12
                effect:
                  gradient:
                    color1: ~38,46,72,255
                    color2: ~30,40,64,255
                    type: 0
                    angleDeg: 90
                  stroke:
                    width: 3
                    color: "{var.starColors[var.resultItemStars[1.round()]] != none ? var.starColors[var.resultItemStars[1.round()]] : '128,128,128,255'}"
              星级条:
                type: Texture
                attribute:
                  point: ~horizontal_stretch_top
                  height: 8
                  normal: "{var.starColors[var.resultItemStars[1.round()]] != none ? var.starColors[var.resultItemStars[1.round()]] : '128,128,128,255'}"
                  shape: ~round_rect
                  radius: 4
                  through: true
              物品槽:
                type: Slot
                attribute:
                  point: ~top_center
                  y: 60
                  slotType: ~Icon
                  width: 220
                  height: 220
                  normal: ~0,0,0,0
                  itemScale: 1.2
                  through: true
                  seticon: "self.setItemIcon(var.resultItemJsons[1.round()])"
              物品名:
                type: Text
                attribute:
                  point: ~bottom_center
                  y: -110
                  texts: "var.resultItemNames[1.round()] != none ? '&f' + var.resultItemNames[1.round()] : ''"
                  fontSize: 54
                  through: true
              星级文本:
                type: Text
                attribute:
                  point: ~bottom_center
                  y: -62
                  texts: "var.resultItemStars[1.round()] != none ? '&6' + var.resultItemStars[1.round()].round() + ' 星' : ''"
                  fontSize: 36
                  through: true
              UP标记:
                type: Text
                attribute:
                  point: ~bottom_center
                  y: -24
                  texts: "~&6UP 物品"
                  fontSize: 36
                  through: true
                  visible: "var.resultItemUps[1.round()] == true"
          继续按钮:
            type: Canvas
            attribute:
              point: ~middle_center
              x: -120
              y: 320
              width: 200
              height: 64
            action:
              click: |-
                val.单抽结果层.visible = false
                val.主面板.visible = true
            children:
              继续背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~40,48,74,240
                  hover: ~62,78,120,245
                  shape: ~round_rect
                  radius: 26
                effect:
                  stroke:
                    width: 2
                    color: ~226,196,132,235
              继续文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f继续"
                  fontSize: 36
                  through: true
          再抽一次:
            type: Canvas
            attribute:
              point: ~middle_center
              x: 120
              y: 320
              width: 200
              height: 64
              enable: "!var.actionBusy && var.actionToken != ''"
            action:
              click: |-
                if(var.pulling != true){
                  if(var.canPull){
                    var.pulling = true
                    var.resultPending = false
                    val.单抽结果层.visible = false
                    val.等待层.visible = true
                    var.actionBusy = true
                    Packet.send(var.packetId, 'pull', '1', var.actionToken)
                  } else {
                    val.资源不足提示.visible = true
                  }
                }
            children:
              再抽一次背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
