                          entry: var.recipes[self.entryKey]
                          visible: self.entry != none
                          width: 62
                          height: 62
                          slotType: ~Icon
                          normal: "var.recipeCanCraft[self.entryKey] == 1 ? '87,115,119,255' : '161,124,104,235'"
                          hover: ~190,131,85,255
                          shape: ~round_rect
                          radius: 8
                          seticon: self.setItemIcon(var.recipeJsons[self.entryKey])
                          itemScale: 0.81
                        action:
                          clickLeft: |-
                            if(var.shiftHeld){
                              recipe = var.recipes[self.entryKey]
                              if(recipe != none){
                                for(key in var.allRecipes.keys()){
                                  r = var.allRecipes[key]
                                  if(r['resultItemId'] == recipe['resultItemId']){
                                    Packet.send('AXS:vanilla_crafting', 'place_ingredients', key)
                                    break
                                  }
                                }
                              }
                            } else {
                              var.selectedRecipe = self.entryKey
                              recipe = var.recipes[self.entryKey]
                              if(recipe != none){
                                var.previewGrid = recipe['previewGrid']
                                for(i in range(0, 8)){
                                  slot = val.预览网格.get(i.round())
                                  if(slot != none){
                                    slot.seticon()
                                  }
                                }
                                result = val.合成品预览
                                if(result != none){
                                  result.setItemIcon(recipe['resultJson'])
                                }
                              }
                            }
                        effect:
                          stroke:
                            width: "var.recipeBookOpen && var.selectedRecipe == self.entryKey ? 4 : 2"
                            color: "var.recipeBookOpen && var.selectedRecipe == self.entryKey ? '244,201,136,255' : '84,91,93,255'"
