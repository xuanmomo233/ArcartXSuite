                          hover: "var.replantEnabled == 'true' ? '70,150,90,230' : '80,90,110,230'"
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 2
                            color: "var.replantEnabled == 'true' ? '124,196,142,255' : (self.isHovered() ? '120,200,255,255' : '255,255,255,180')"
                      补种文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 24
