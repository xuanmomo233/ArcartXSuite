            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~62,66,74,210
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~70,150,250,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f全球市场"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 232
              width: 1
              height: 30
              normal: ~62,66,74,210
          副标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 252
              texts: "~&7回收商店"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
