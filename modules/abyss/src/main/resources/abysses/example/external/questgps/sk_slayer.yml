# QuestGPS 呈现层：sk_slayer（abyss example 副本委托）
# 部署：复制到 plugins/ArcartXSuite/data/questgps/quests/sk_slayer.yml
# 根键 = Chemdah 任务模板 id。

sk_slayer:
  enabled: true
  sort-order: 50
  allow-abandon: true                   # 副本委托允许放弃重接
  category: side                        # discovery=overlay 时必填；chemdah 模式读 meta.type
  navigation:
    enabled: false                      # 副本内导航由 abyss guide_point 承担
  hooks:
    accepted:
      - "questgps_quest_accepted"
    completed:
      - "questgps_quest_completed"      # EventPacket 信号；abyss 侧另有 EventBus 路由
