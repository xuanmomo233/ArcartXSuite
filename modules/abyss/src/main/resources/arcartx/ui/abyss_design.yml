# AXS 资源说明
# 用途: Abyss 远征制图台——左侧层级路线与右侧节点对象台账
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
#
# 通讯协议:
#   服务端 → init/update: packetId/action_token/dungeonName/dungeonId/dirty(int)/selNode/
#     nodeRows{idx:{key,label,depth,count}}/nodeCount/
#     objRows{idx:{key,icon,kindLabel,kindColor,id,summary,dirty(bool)}}/objCount
#   客户端 → Packet.send('abyss', ...):
#     design_node <nodeKey> <token>        design_pick_open <nodeKey> <token>
#     design_edit <objKey> <token>         design_tp <objKey> <token>
#     design_del <objKey> <token>          design_save <config|world> <token>
#     design_exit <token>
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonName = packet['dungeonName']
      var.dungeonId = packet['dungeonId']
      var.dirty = packet['dirty']
      var.selNode = packet['selNode']
      var.nodeRows = packet['nodeRows']
      var.nodeCount = packet['nodeCount']
      var.objRows = packet['objRows']
      var.objCount = packet['objCount']
      // ── 节点项重建 ──
      节点目标数 = var.nodeCount.round()
      if(val.节点容器.childrenCount() - 1 != 节点目标数 - 1){
        for(key in var.节点引用.keys()){
          var.节点引用[key].remove()
        }
        var.节点引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.节点容器.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 节点目标数 - 1)){
          e = 模板.copy('节点项_' + var.轮次 + '_' + i.round())
          e.entryKey = i.round()
          var.节点引用[i.round()] = e
        }
      }
      // ── 对象行重建 ──
      对象目标数 = var.objCount.round()
      if(val.对象容器.childrenCount() - 1 != 对象目标数 - 1){
        for(key in var.对象引用.keys()){
          var.对象引用[key].remove()
        }
        var.对象引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.对象容器.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 对象目标数 - 1)){
          e = 模板.copy('对象行_' + var.轮次 + '_' + i.round())
          e.entryKey = i.round()
          var.对象引用[i.round()] = e
        }
      }
    update: |-
      var.dirty = packet['dirty']
      var.selNode = packet['selNode']
      var.nodeRows = packet['nodeRows']
      var.nodeCount = packet['nodeCount']
      var.objRows = packet['objRows']
      var.objCount = packet['objCount']
      // ── 节点项重建 ──
      节点目标数 = var.nodeCount.round()
      if(val.节点容器.childrenCount() - 1 != 节点目标数 - 1){
        for(key in var.节点引用.keys()){
          var.节点引用[key].remove()
        }
        var.节点引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.节点容器.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 节点目标数 - 1)){
          e = 模板.copy('节点项_' + var.轮次 + '_' + i.round())
          e.entryKey = i.round()
          var.节点引用[i.round()] = e
        }
      }
      // ── 对象行重建 ──
      对象目标数 = var.objCount.round()
      if(val.对象容器.childrenCount() - 1 != 对象目标数 - 1){
        for(key in var.对象引用.keys()){
          var.对象引用[key].remove()
        }
        var.对象引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.对象容器.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 对象目标数 - 1)){
          e = 模板.copy('对象行_' + var.轮次 + '_' + i.round())
          e.entryKey = i.round()
          var.对象引用[i.round()] = e
        }
      }
  action:
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 426
      var.packetId = 'abyss'
      var.dirty = 0
      var.selNode = ''
      var.nodeRows = {}
      var.nodeCount = 0
      var.objRows = {}
      var.objCount = 0
      var.节点引用 = {}
      var.对象引用 = {}
      var.轮次 = 0
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 426
    open: |-
      Sound.self('minecraft:block.note_block.pling', 0.8, 8)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;8,9,10,238
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ═══ 顶栏 ═══
      顶栏底:
        type: Texture
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 100
          normal: ~15,17,18,250
          through: true
      标题色块:
        type: Texture
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 23
          width: 6
          height: 58
          normal: ~178,69,46,255
          shape: ~round_rect
          radius: 4
          through: true
      标题:
        type: Text
        attribute:
          point: ~top_left
          x: "72 - var.offX"
          y: 14
          texts: "'&6远征制图  &8/  &f' + var.dungeonName"
          fontSize: 54
          through: true
      副标题:
        type: Text
        attribute:
          point: ~top_left
          x: "74 - var.offX"
          y: 70
          texts: "'&7档案 ' + var.dungeonId + '   &8/   Esc 仅关闭制图台 · 未归档改动仅存于内存'"
          fontSize: 36
          through: true
      未保存角标:
        type: Canvas
        attribute:
          point: ~top_right
          x: "-246 + var.offX"
          y: 27
          width: 198
          height: 48
          visible: "var.dirty > 0"
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~99,35,30,245
              shape: ~round_rect
              radius: 10
              through: true
          字:
            type: Text
            attribute:
              point: ~middle_center
              texts: "'&c待归档  /  ' + var.dirty + ' 处'"
              fontSize: 36
              through: true
      已归档状态:
        type: Text
        attribute:
          point: ~top_right
          x: "-48 + var.offX"
          y: 35
          texts: ~&7档案状态  /  &6全部已保存
          fontSize: 36
          visible: "var.dirty == 0"
          through: true
      # ═══ 左栏：分层路线图 ═══
      左栏底:
        type: Texture
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 122
          width: 310
          height: "var.viewH - 146"
          normal: ~17,19,20,246
          shape: ~round_rect
          radius: 14
          through: true
        effect:
          stroke:
            width: 1
            color: ~108,91,73,170
      左栏标题:
        type: Text
        attribute:
          point: ~top_left
          x: "72 - var.offX"
          y: 142
          texts: ~&6I  /  层级路线
          fontSize: 48
          through: true
      节点栏说明:
        type: Text
        attribute:
          point: ~top_left
          x: "74 - var.offX"
          y: 194
          texts: "'&7选择区域 · ' + var.nodeCount + ' 个路线节点'"
          fontSize: 36
          through: true
      节点滑轨:
        type: Texture
        attribute:
          point: ~top_left
          x: "336 - var.offX"
          y: 250
          width: 6
          height: "var.viewH - 358"
          normal: ~42,45,44,235
          shape: ~round_rect
          radius: 4
          through: true
      节点滑块:
        type: Texture
        val: 节点滑块
        attribute:
          point: ~top_left
          x: "336 - var.offX"
          y: 250
          width: 6
          height: 90
          normal: ~194,139,65,255
          maxDragY: "var.viewH - 448"
          shape: ~round_rect
          radius: 4
      节点滚动:
        type: Scroll
        attribute:
          point: ~top_left
          x: "66 - var.offX"
          y: 246
          width: 258
          height: "var.viewH - 354"
          moveY: "self.parent['节点滑块'].getDragYRatio()"
        action:
          wheel: |-
            if(self.moveY >= 0 && self.wheelValue > 0){
              self.parent['节点滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
            if(self.moveY <= 1 && self.wheelValue < 0){
              self.parent['节点滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
        children:
          节点容器:
            type: VStack
            val: 节点容器
            attribute:
              width: 258
              spaceBetween: 10
            children:
              节点项:
                type: Canvas
                attribute:
                  width: 258
                  height: 68
                  entryKey: 0.round()
                  entry: "var.nodeRows[self.entryKey]"
                  visible: "self.entry != none"
                action:
                  clickLeft: "Packet.send(var.packetId, 'design_node', self.entry['key'], var.actionToken)"
                children:
                  底:
                    type: Texture
                    attribute:
                      x: 2
                      y: 2
                      width: "self.parent.width - 4"
                      height: "self.parent.height - 4"
                      normal: "var.selNode == self.parent.entry['key'] ? '73,48,32,245' : '27,29,29,235'"
                      shape: ~round_rect
                      radius: 8
                      through: true
                    effect:
                      stroke:
                        width: "var.selNode == self.parent.entry['key'] ? 2 : 1"
                        color: "var.selNode == self.parent.entry['key'] ? '209,149,74,250' : '90,91,81,145'"
                  缩进条:
                    type: Texture
                    attribute:
                      point: ~middle_left
                      x: 8
                      width: 4
                      height: 44
                      normal: ~172,67,45,255
                      shape: ~round_rect
                      radius: 2
                      visible: "self.parent.entry['depth'] == 0"
                      through: true
                  支路线:
                    type: Texture
                    attribute:
                      point: ~middle_left
                      x: 20
                      width: 2
                      height: 48
                      normal: ~100,91,72,200
                      visible: "self.parent.entry['depth'] > 0"
                      through: true
                  名:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: "self.parent.entry['depth'] == 0 ? 22 : 36"
                      y: -12
                      texts: "self.parent.entry['depth'] == 0 ? '&6' + self.parent.entry['label'] : '&7└ ' + self.parent.entry['label']"
                      fontSize: 36
                      limit: 12
                      through: true
                  数:
                    type: Text
                    attribute:
                      point: ~middle_right
                      x: -14
                      y: 15
                      texts: "'&7' + self.parent.entry['count'] + ' 件对象'"
                      fontSize: 36
                      through: true
      路线操作注:
        type: Text
        attribute:
          point: ~top_left
          x: "74 - var.offX"
          y: "var.viewH - 82"
          texts:
            - ~&7Esc 仅关闭当前制图台
            - ~&7杖左键空气可重新打开
          fontSize: 36
          through: true
      # ═══ 右侧节点对象台账 ═══
      内容底:
        type: Texture
        attribute:
          point: ~top_left
          x: "378 - var.offX"
          y: 122
          width: "var.contentW"
          height: "var.viewH - 146"
          normal: ~17,19,20,246
          shape: ~round_rect
          radius: 14
          through: true
        effect:
          stroke:
            width: 1
            color: ~108,91,73,170
      内容标题:
        type: Text
        attribute:
          point: ~top_left
          x: "406 - var.offX"
          y: 142
          texts: "'&6II  /  节点台账  &8—  &f' + var.objCount + ' 件对象'"
          fontSize: 48
          through: true
      内容说明:
        type: Text
        attribute:
          point: ~top_left
          x: "408 - var.offX"
          y: 196
          texts: ~&7逐件核对位置、参数与触发条件；未保存对象显示锈红底色
          fontSize: 36
          through: true
      台账分割:
        type: Texture
        attribute:
          point: ~top_left
          x: "406 - var.offX"
          y: 240
          width: "var.contentW - 56"
          height: 2
