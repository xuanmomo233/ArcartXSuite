                  clickLeft: |-
                    if(var.selectedSlot != none && var.selectedPrice != none && var.selectedPrice != ''){
                      msg = var.selectedMessage == none ? '' : var.selectedMessage
                      var.actionBusy = true
                      Packet.send(var.packetId, 'pshop_create', var.selectedSlot, var.selectedPrice, msg, var.selectedDuration.round(), var.selectedCurrency, var.selectedMode, var.actionToken)
