# AXS 钓鱼天赋树配置
# 每棵树 5 级（T1→T2二选一→T3→T4二选一→T5），8 个跨树联动天赋。
# 每 3 级获得 1 点天赋点，100 级 = 33 点。
# 满天赋加成约 4-5%，给称号和后续玩法留足空间。
#
# 节点 ID 命名规则：{tree}-{tier}{branch}，如 steady-t1, steady-t2a
# 联动节点 ID 命名规则：link-{编号}，如 link-1
#
# 每个节点可选配置 icon 字段自定义槽位图标物品 ID，
# 留空或不写则回退到 effectType 默认映射。
#
# 效果类型（effect-type）：
#   bar_height       — 绿条高度加成（像素）
#   bar_damping      — 绿条阻尼加成（百分比，0-1）
#   bar_bounce       — 绿条反弹减少（百分比，0-1）
#   bar_force        — 绿条力系数加成（百分比，0-1）
#   fish_speed       — 鱼速度降低（百分比，0-1）
#   fish_dwell       — 鱼停留时间减少（百分比，0-1）
#   fish_dart        — 鱼突进概率降低（百分比，0-1）
#   fish_noise       — 鱼噪声降低（百分比，0-1）
#   fish_edge        — 鱼边缘反弹降低（百分比，0-1）
#   flee_chance      — 逃离概率降低（百分比，0-1）
#   flee_speed       — 逃离速度降低（百分比，0-1）
#   flee_cooldown    — 逃离冷却增加（百分比，0-1）
#   flee_duration    — 逃离持续时间减少（百分比，0-1）
#   progress_rate    — 进度增速（百分比，0-1）
#   progress_drain   — 进度下降减少（百分比，0-1）
#   perfect_window   — 完美窗口增大（百分比，0-1）
#   start_progress   — 起始进度增加（百分比，0-1）
#   xp_multiplier    — 钓鱼经验加成（百分比，0-1）
#   price_multiplier — 鱼售价加成（百分比，0-1）
#   legendary_chance — 传说鱼概率加成（百分比，0-1）
#   treasure_chance  — 宝藏概率加成（百分比，0-1）
#   rare_chance      — 稀有鱼概率加成（百分比，0-1）
#   xp_in_bar        — 绿条内经验加成（百分比，0-1）
#   perfect_xp       — 完美捕获经验加成（百分比，0-1）

