              结果稀有度条:
                type: Texture
                attribute:
                  point: ~top_center
                  y: 202
                  width: 600
                  height: 10
                  normal: "{var.rarityColors != none && var.resultRarity != none && var.rarityColors[var.resultRarity] != none ? var.rarityColors[var.resultRarity] : '128,128,128,255'}"
                  shape: ~round_rect
                  radius: 5
              物品浮动容器:
                type: Canvas
                attribute:
                  point: ~middle_center
                  y: "var.出货开始 != none && var.出货开始 > 0 && Time.currentTime() - var.出货开始 < 900 ? (var.出货Y != none ? var.出货Y.get() : 0) : (var.待机浮动 != none ? var.待机浮动.get() : 0)"
                  width: 320
                  height: 320
                children:
                  物品槽:
                    type: Slot
                    attribute:
                      point: ~middle_center
                      slotType: ~Icon
                      width: 280
                      height: 280
                      normal: ~0,0,0,0
                      itemScale: "var.出货开始 != none && var.出货开始 > 0 && Time.currentTime() - var.出货开始 < 900 ? (var.出货缩放 != none ? var.出货缩放.get() : 1) : (var.待机呼吸 != none ? var.待机呼吸.get() : 1)"
                      seticon: "self.setItemIcon(var.resultItemJson != none && var.resultItemJson != '' ? var.resultItemJson : var.air)"
          继续按钮:
            type: Texture
            attribute:
              point: ~middle_center
              x: -120
              y: 260
              width: 200
              height: 64
              normal: ~22,31,45,255
              hover: ~40,56,78,255
              shape: ~round_rect
              radius: 6
              texts: ~&b继续
              fontSize: 38
              center: true
            action:
              click: |-
                val.单抽结果层.visible = false
                var.出货开始 = 0
                var.箱子抖动 = none
                var.箱子缩放 = none
                val.主面板.visible = true
          再开一次:
            type: Texture
            attribute:
              point: ~middle_center
              x: 120
              y: 260
              width: 200
              height: 64
              normal: ~75,105,215,255
              hover: ~107,144,255,255
              shape: ~round_rect
              radius: 6
              texts: ~&f再开一次
              fontSize: 38
              center: true
            action:
              click: |-
                if(var.rolling != none && var.rolling != true){
                  var.rolling = true
                  var.resultPending = false
                  var.箱子抖动 = Shake(0, 6, 400, 40, 8, true)
                  var.箱子缩放 = TwoLerp(1, 0.94, 1, 400, 250)
                  var.加速 = Expo(0.15, 1.0, 0, 700)
                  var.滚动起点 = 0.0005
                  var.滚动曲线 = none
                  var.中线闪 = Blink(0.45, 1, 400)
                  var.命中已触发 = false
                  var.spinV = 1
                  var.spinTarget = 1
                  val.开箱滚动条.moveX = 0.0005
                  val.单抽结果层.visible = false
                  val.开箱动画层.visible = true
                  Packet.send(var.packetId, 'open_case', var.actionToken)
                }
      # 十连结果层: 展示 batch_result 包的 10 个结果，5 列两行
      十连结果层:
        type: Canvas
        val: 十连结果层
        attribute:
          point: ~stretch_all
          visible: false
        children:
          十连背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,14,24,236
          十连标题:
            type: Text
            attribute:
              through: true
              point: ~top_center
              y: 90
              texts: "'&6本次开出 ' + (var.batchCount != none ? var.batchCount.round() : 0) + ' 件物品'"
              fontSize: 52
          十连网格:
            type: HGrid
            val: 十连网格
            attribute:
              point: ~middle_center
              y: -20
              column: 5
              spaceBetweenX: 26
              spaceBetweenY: 28
            children:
              十连卡片:
                type: Canvas
                attribute:
                  entryKey: 1.round()
                  width: 240
                  height: 280
                  y: "var.十连开始 != none && var.十连开始 > 0 ? 60 * (1 - math.max(0, math.min(1, (Time.currentTime() - var.十连开始 - self.entryKey * 70) / 500))) : 60"
                  alpha: "var.十连开始 != none && var.十连开始 > 0 ? math.max(0, math.min(1, (Time.currentTime() - var.十连开始 - self.entryKey * 70) / 500)) : 0"
                  visible: "var.batchItemJsons != none && var.batchItemJsons[self.entryKey] != none && var.batchItemJsons[self.entryKey] != ''"
                children:
                  卡片底:
                    type: Texture
                    attribute:
                      entryKey: 1.round()
                      point: ~stretch_all
                      normal: ~40,40,40,255
                      shape: ~round_rect
                      radius: 8
                    effect:
                      gradient:
                        color1: "var.rarityColors != none && var.batchItemRarities != none && var.rarityColors[var.batchItemRarities[self.entryKey]] != none ? var.rarityColors[var.batchItemRarities[self.entryKey]] : '128,128,128,255'"
                        color2: ~190,190,190,150
                        type: 0
                        angleDeg: 0
                      stroke:
                        width: 2
                        color: "var.rarityColors != none && var.batchItemRarities != none && var.rarityColors[var.batchItemRarities[self.entryKey]] != none ? var.rarityColors[var.batchItemRarities[self.entryKey]] : '128,128,128,255'"
                  稀有度条:
                    type: Texture
                    attribute:
                      entryKey: 1.round()
                      point: ~horizontal_stretch_top
                      height: 6
                      normal: "{var.rarityColors != none && var.batchItemRarities != none && var.rarityColors[var.batchItemRarities[self.entryKey]] != none ? var.rarityColors[var.batchItemRarities[self.entryKey]] : '128,128,128,255'}"
                      shape: ~round_rect
                      radius: 4
                  物品槽:
                    type: Slot
                    attribute:
                      entryKey: 1.round()
                      point: ~top_center
                      y: 36
                      slotType: ~Icon
                      width: 140
                      height: 140
                      normal: ~0,0,0,0
                      seticon: "self.setItemIcon(var.batchItemJsons != none && var.batchItemJsons[self.entryKey] != none && var.batchItemJsons[self.entryKey] != '' ? var.batchItemJsons[self.entryKey] : var.air)"
                  物品名:
                    type: Text
                    attribute:
                      through: true
                      entryKey: 1.round()
                      point: ~bottom_center
                      y: -44
                      texts: "var.batchItemNames != none && var.batchItemNames[self.entryKey] != none ? '&f' + (var.batchItemNames[self.entryKey] != none ? var.batchItemNames[self.entryKey] : '') : ''"
                      fontSize: 32
                  稀有度名:
                    type: Text
                    attribute:
                      through: true
                      entryKey: 1.round()
                      point: ~bottom_center
                      y: -16
                      texts: "var.batchItemRarities != none && var.batchItemRarities[self.entryKey] != none && var.rarityNames != none && var.rarityNames[var.batchItemRarities[self.entryKey]] != none ? '&7' + var.rarityNames[var.batchItemRarities[self.entryKey]] : (var.rarityNames != none && var.rarityNames['UNKNOWN'] != none ? '&7' + var.rarityNames['UNKNOWN'] : '')"
                      fontSize: 30
          十连继续按钮:
            type: Texture
            attribute:
              point: ~bottom_center
              x: -120
              y: -70
              width: 200
              height: 64
              normal: ~22,31,45,255
              hover: ~40,56,78,255
              shape: ~round_rect
              radius: 6
              texts: ~&b继续
              fontSize: 38
              center: true
            action:
              click: |-
                val.十连结果层.visible = false
                var.箱子抖动 = none
                var.箱子缩放 = none
                val.主面板.visible = true
          十连再开一次:
            type: Texture
            attribute:
              point: ~bottom_center
              x: 120
              y: -70
              width: 200
              height: 64
              normal: ~75,105,215,255
              hover: ~107,144,255,255
              shape: ~round_rect
              radius: 6
              visible: "var.tenAvailable != false"
              texts: ~&f再来十连
              fontSize: 38
              center: true
            action:
              click: |-
                if(var.rolling != none && var.rolling != true){
                  var.rolling = true
                  var.resultPending = false
                  var.箱子抖动 = Shake(0, 6, 400, 40, 8, true)
                  var.箱子缩放 = TwoLerp(1, 0.94, 1, 400, 250)
                  var.加速 = Expo(0.15, 1.0, 0, 700)
                  var.滚动起点 = 0.0005
                  var.滚动曲线 = none
                  var.中线闪 = Blink(0.45, 1, 400)
                  var.命中已触发 = false
                  var.spinV = 1
                  var.spinTarget = 1
                  val.开箱滚动条.moveX = 0.0005
                  val.十连结果层.visible = false
                  val.开箱动画层.visible = true
                  Packet.send(var.packetId, 'open_case_batch', 10, var.actionToken)
                }
      # 历史面板: history 包的开箱记录，使用服务端格式化好的 timeText 与 summary
      历史面板:
        type: Canvas
        val: 历史面板
        attribute:
          point: ~middle_center
          width: 900
          height: 700
          visible: false
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,19,29,250
              shape: ~round_rect
              radius: 12
            effect:
              stroke:
                width: 2
                color: ~226,196,132,220
          面板标题:
            type: Text
            attribute:
              through: true
              point: ~top_left
              x: 24
              y: 20
              texts: "'&f开箱记录 · ' + (var.historyPoolName != none ? var.historyPoolName : '')"
              fontSize: 52
          记录条数:
            type: Text
            attribute:
              through: true
              point: ~top_left
              x: 24
              y: 64
              texts: "'&7共 ' + (var.historyCount != none ? var.historyCount.round() : 0) + ' 条记录'"
              fontSize: 30
          历史滑块:
            type: Texture
            attribute:
              point: ~top_right
              x: -16
              y: 110
              width: 10
              height: 60
              normal: ~226,196,132,255
              maxDragY: 500 - 60
              dragY: 0
              shape: ~round_rect
              radius: 4
          历史视口:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 110
              width: 820
              height: 500
              moveY: self.parent['历史滑块'].getDragYRatio()
              through: false
            action:
              wheel: |-
                if(self.moveY >= 0){
                  if(self.wheelValue > 0){
                    self.parent['历史滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                  }
                }
                if(self.moveY <= 1){
                  if(self.wheelValue < 0){
                    self.parent['历史滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                  }
                }
            children:
              历史列表:
                type: VGrid
                attribute:
                  column: 1
                  spaceBetweenY: 12
                action:
                  create: |-
                    for(i in range(0, 20)){
                      key = i.round()
                      e = self['历史行'].copy('历史行' + key)
                      e.entryKey = key
                      e['时间'].entryKey = key
                      e['摘要'].entryKey = key
                    }
                children:
                  历史行:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      width: 800
                      height: 66
                      visible: "var.historyRows != none && var.historyRows[self.entryKey] != none"
                    children:
                      行背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~22,31,45,255
                          shape: ~round_rect
                          radius: 6
                      时间:
                        type: Text
                        attribute:
                          through: true
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 16
                          texts: "var.historyRows != none && var.historyRows[self.entryKey] != none ? '&7' + (var.historyRows[self.entryKey]['timeText'] != none ? var.historyRows[self.entryKey]['timeText'] : '') : ''"
                          fontSize: 30
                      摘要:
                        type: Text
                        attribute:
                          through: true
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 220
                          texts: "var.historyRows != none && var.historyRows[self.entryKey] != none ? '&f' + (var.historyRows[self.entryKey]['summary'] != none ? var.historyRows[self.entryKey]['summary'] : '') : ''"
                          fontSize: 34
          历史空态:
            type: Text
            attribute:
              through: true
              point: ~middle_center
              texts:
                - ~&7暂无开箱记录
              fontSize: 34
              visible: "var.historyCount != none && var.historyCount == 0"
          历史关闭:
            type: Texture
            attribute:
              point: ~bottom_center
              y: -20
              width: 200
              height: 56
              normal: ~22,31,45,255
              hover: ~40,56,78,255
              shape: ~round_rect
              radius: 6
              texts: ~&b关闭
              fontSize: 34
              center: true
            action:
              click: "val.历史面板.visible = false"
