#
# ArcartXSuite CombatEffect - 击杀命中特效 HUD
# 本 UI 作为 HUD 常驻显示，通过 packetHandler 接收服务端包触发动画。
# packetHandler:
#   attack  — 命中特效，显示 1 秒
#   kill    — 击杀特效 + 击杀计数，5 秒无新击杀自动清零
#
ui:
  isHud: true
  defaultOpen: true
  hide:
    - crosshair
  action:
    # 将实际视口换算回设计坐标；HUD 始终围绕真实屏幕中心，不拉伸准星。
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    # 暖银色轻微呼吸，不再以彩虹色干扰瞄准。
    tick: |-
      var.t = Time.currentTime() / 1000.0
      var.r = Cast.toInt(222 + 12 * math.sin(var.t * 3)).round()
      var.g = Cast.toInt(208 + 10 * math.sin(var.t * 3)).round()
      var.b = Cast.toInt(189 + 8 * math.sin(var.t * 3)).round()
      var.crosshairColor = var.r + ',' + var.g + ',' + var.b + ',235'

  packetHandler:
    # packetHandler: attack
    # 包字段:
    #   - 无（attack-effect 包内容为空字符串，不携带额外数据）
    # 说明: 命中特效处理器，显示命中贴图 1 秒后自动隐藏
    attack: |-
      val.attack_fx.visible = true
      async {
        Thread.sleep(1000)
        val.attack_fx.visible = false
      }
    # packetHandler: kill
    # 包字段:
    #   - killer: 击杀者名称（来自 death-buffer-killer 包，环境死亡时为空字符串）
    #   - victim: 死亡玩家名称（来自 death-buffer-killer 包）
    # 说明: 击杀特效处理器，显示击杀贴图 1.5 秒并累加击杀计数；
    #       5 秒内无新击杀则自动清零计数
    kill: |-
      var.击杀数++
      var.上次击杀时间 = Time.currentTime()
      val.kill_fx.visible = true
      async {
        Thread.sleep(1500)
        val.kill_fx.visible = false
      }
      async {
        while (true) {
          Thread.sleep(1000)
          if (Time.currentTime() - var.上次击杀时间 > 5000) {
            var.击杀数 = 0
            break
          }
        }
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      width: 1920
      height: 1080
      point: ~top_center
      through: true
    children:
      战斗视口:
        type: Canvas
        attribute:
          point: ~top_left
          width: 1920
          height: "var.viewH"
          through: true
        children:
          自定义准心:
            type: Canvas
            attribute:
              point: ~middle_center
              width: 20
              height: 20
              through: true
            children:
              准心横衬:
                type: Texture
                attribute:
                  point: ~middle_center
                  width: 20
                  height: 4
                  normal: ~22,23,25,220
                  through: true
              准心竖衬:
                type: Texture
                attribute:
                  point: ~middle_center
                  width: 4
                  height: 20
                  normal: ~22,23,25,220
                  through: true
              准心横线:
                type: Texture
                val: crosshair_h
                attribute:
                  point: ~middle_center
                  width: 18
                  height: 2
                  normal: var.crosshairColor
                  through: true
              准心竖线:
                type: Texture
                val: crosshair_v
                attribute:
                  point: ~middle_center
                  width: 2
                  height: 18
                  normal: var.crosshairColor
                  through: true

          命中特效贴图:
            type: Texture
            val: attack_fx
            attribute:
              point: ~middle_center
              y: 32
              normal: ~combat_effect/hit.png
              middleScale: 1
              width: 32
              height: 32
              visible: false
              through: true

          # 击杀贴图只占 48px；击杀数是准星下方独立的短时铁色轨道。
          击杀特效展示区:
            type: Canvas
            attribute:
              point: ~middle_center
              y: 104
              width: 330
              height: 78
              through: true
            children:
              击杀特效贴图:
                type: Texture
                val: kill_fx
                attribute:
                  point: ~middle_left
                  x: 6
                  normal: ~combat_effect/kill.png
                  middleScale: 1
                  width: 48
                  height: 48
                  visible: false
                  through: true
              击杀轨道:
                type: Canvas
                attribute:
                  point: ~top_right
                  width: 256
                  height: 78
                  visible: "var.击杀数 != none && var.击杀数 > 0"
                  through: true
                children:
                  铁色底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~24,25,28,228
                      shape: ~round_rect
                      radius: 4
                      through: true
                  余烬标记:
                    type: Texture
                    attribute:
                      point: ~top_left
                      width: 3
                      height: 78
                      normal: ~204,99,57,255
                      through: true
                  击杀计数文本:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      y: -4
                      texts: "'&f' + var.击杀数.round()"
                      fontSize: 64
                      through: true
                  击杀标签:
                    type: Text
                    attribute:
                      point: ~middle_right
                      x: -20
                      y: -4
                      texts: ~&7击杀
                      fontSize: 36
                      through: true
                  连杀余时底:
                    type: Texture
                    attribute:
                      point: ~top_left
                      x: 20
                      y: 68
                      width: 216
                      height: 3
                      normal: ~74,70,65,235
                      through: true
                  连杀余时:
                    type: Texture
                    attribute:
                      point: ~top_left
                      x: 20
                      y: 68
                      width: "216 * math.max(0, math.min(1, 1 - (Time.currentTime() - var.上次击杀时间) / 5000))"
                      height: 3
                      normal: ~213,195,167,255
                      through: true
