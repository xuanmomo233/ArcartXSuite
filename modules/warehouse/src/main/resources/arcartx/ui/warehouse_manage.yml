ui:
  isHud: false
  defaultOpen: false
  hide:
  - hotbar
  - experience_bar
  - crosshair
  - item_name
  - jump_bar
  - mount_health
  - player_state
  - player_health
  - armor_level
  - food_level
  - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    shared_activity: |-
      if(var.activityOpen && packet['warehouse'] == var.ownerId){
        var.activityRows = packet['rows']
        var.activityPage = packet['page']
        var.activityNext = packet['hasNext']
      }
    update: |-
      if(var.ownerId != packet['ownerId'] || !packet['sharedActivityAllowed']){
        var.activityOpen = false
      }
      var.activityAllowed = packet['sharedActivityAllowed']
      // 保存旧数量，用于判断是否需要重建列表（首次 update 时旧数量为 0，数量从 0 变为 N 时触发重建）
      oldMaxManageCount = var.maxManageCount != none ? var.maxManageCount : 0
      oldMaxMemberCount = var.maxMemberCount != none ? var.maxMemberCount : 0
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.manageWarehouses = packet['manageWarehouses']
      var.manageWarehouseTexts = packet['manageWarehouseTexts']
      var.manageWarehouseTypes = packet['manageWarehouseTypes']
      var.manageWarehouseTargets = packet['manageWarehouseTargets']
      var.manageWarehouseSelected = packet['manageWarehouseSelected']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseManageTexts = packet['sharedWarehouseManageTexts']
      var.sharedCreateCostText = packet['sharedCreateCostText']
      var.sharedRoleOwnerName = packet['sharedRoleOwnerName']
      var.sharedRoleMemberName = packet['sharedRoleMemberName']
      var.sharedRoleViewerName = packet['sharedRoleViewerName']
      var.sharedMembers = packet['sharedMembers']
      var.sharedMemberTexts = packet['sharedMemberTexts']
      var.sharedMemberNames = packet['sharedMemberNames']
      var.sharedMemberRoles = packet['sharedMemberRoles']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.lockOwner = packet['lockOwner']
      var.capacityText = packet['capacityText']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.slotPriceText = packet['slotPriceText']
      var.slotPriceAmount = packet['slotPriceAmount']
      var.slotCurrencyName = packet['slotCurrencyName']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.autoPickup = packet['autoPickup']
      var.autoPickupMythic = packet['autoPickupMythic']
      var.autoPickupNotify = packet['autoPickupNotify']
      var.serverAutoPickup = packet['serverAutoPickup']
      var.pickupScannerActive = packet['pickupScannerActive']
      var.serverMythicLoot = packet['serverMythicLoot']
      var.showcaseEnabled = packet['showcaseEnabled']
      var.maxManageCount = packet['maxManageCount']
      var.maxMemberCount = packet['maxMemberCount']
      // ── 共享列表：仅在数量变化时重建 ──
      if(var.maxManageCount != oldMaxManageCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        var.共享列表网格数据 = []
        if((var.maxManageCount - 1) >= 0){
          for(网格序号 in range(0, var.maxManageCount - 1)){
            var.共享列表网格数据.add(网格序号.round())
          }
        }
      }
      // ── 成员列表：仅在数量变化时重建 ──
      if(var.maxMemberCount != oldMaxMemberCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        var.成员列表网格数据 = []
        if((var.maxMemberCount - 1) >= 0){
          for(网格序号 in range(0, var.maxMemberCount - 1)){
            var.成员列表网格数据.add(网格序号.round())
          }
        }
      }
      // update 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false
      var.pickupBusy = false
      var.mythicBusy = false
      var.notifyBusy = false
    ui_notice: |-
      noticeMessage = packet['message']
      if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
        var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
        noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = noticeWrapped.split('\n')
        var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
      if(var.pickupBusy){
        var.pickupBusySeconds = var.pickupBusySeconds + 1
        if(var.pickupBusySeconds >= 3){
          var.pickupBusy = false
          var.pickupBusySeconds = 0
        }
      }else{
        var.pickupBusySeconds = 0
      }
      if(var.mythicBusy){
        var.mythicBusySeconds = var.mythicBusySeconds + 1
        if(var.mythicBusySeconds >= 3){
          var.mythicBusy = false
          var.mythicBusySeconds = 0
        }
      }else{
        var.mythicBusySeconds = 0
      }
      if(var.notifyBusy){
        var.notifyBusySeconds = var.notifyBusySeconds + 1
        if(var.notifyBusySeconds >= 3){
          var.notifyBusy = false
          var.notifyBusySeconds = 0
        }
      }else{
        var.notifyBusySeconds = 0
      }
    load: |-
      var.activityOpen = false
      var.activityAllowed = false
      var.activityRows = {}
      var.activityPage = 0
      var.activityNext = false
      var.activityMember = ''
      var.activityItem = ''
      var.activityDays = ''
      var.activityFilterMember = ''
      var.activityFilterItem = ''
      var.activityFilterDays = ''
      var.actionToken = ''
      var.autoPickup = true
      var.autoPickupMythic = true
      var.autoPickupNotify = true
      var.capacityText = '0/0'
      var.hasPassword = false
      var.level = 1
      var.slotPriceText = ''
      var.slotPriceAmount = 0
      var.slotCurrencyName = ''
      var.buyAmount = '1'
      var.manageWarehouseSelected = {}
      var.packetId = 'AXS_WAREHOUSE'
      var.readOnly = false
      var.sharedCreateCostText = '创建共享仓库免费'
      var.sharedMemberNames = {}
      var.sharedMemberRoles = {}
      var.sharedRoleMemberName = '成员'
      var.sharedRoleViewerName = '观众'
      var.showcaseEnabled = true
      var.unlocked = false
      var.warehouseName = 'AXS 仓库'
      var.memberRole = 'member'
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.pickupBusy = false
      var.pickupBusySeconds = 0
      var.mythicBusy = false
      var.mythicBusySeconds = 0
      var.notifyBusy = false
      var.notifyBusySeconds = 0
      var.deleteConfirm = false
      var.刷新轮次 = 0.round()
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.halfW = (var.contentW - 24) / 2
      var.noticeActive = false
      var.noticeText = ''
      var.noticeDetail = ''
      var.noticeFade = Fade(80, 1000, 220)
      var.noticePeaked = false
      var.noticeLines = []
      var.noticeCount = 1
    open: |-
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeText = ''
      var.noticeDetail = ''
      Packet.send(var.packetId, 'refresh')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.halfW = (var.contentW - 24) / 2
    tick: |2-


      if(var.noticeActive){
        var.noticeOpacity = var.noticeFade.get()
        if(var.noticeOpacity > 0){ var.noticePeaked = true }
        if(var.noticePeaked && var.noticeOpacity <= 0){
          var.noticeActive = false
          var.noticePeaked = false
          var.noticeText = ''
          var.noticeDetail = ''
        }
      }
controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;20,24,28,110
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: -var.offX
          width: var.viewW
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~100,110,120,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~180,190,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: ~&f仓库管理
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 268
              width: 1
              height: 30
              normal: ~100,110,120,220
          当前仓库:
            type: Text
            attribute:
              point: ~middle_left
              x: 288
              texts: '''&f'' + var.warehouseName + (var.ownerType == ''shared'' ? ''  &b共享仓库'' : ''  &a个人仓库'') + (var.readOnly ? ''  &c只读'' :
                '''') + (!var.hasPassword ? ''  &e未设置密码'' : (var.unlocked ? ''  &a已解锁'' : ''  &e未解锁''))'
              fontSize: 36
          共享记录入口:
            type: Canvas
            attribute:
              x: -112
              y: 0
              width: 168
              height: 48
              point: ~middle_right
              visible: var.activityAllowed
            children:
              底色:
                type: Texture
                attribute:
                  x: 0
                  y: 0
                  width: 168
                  height: 48
                  normal: 'self.isHovered() ? ''58,68,80,255'' : ''44,50,58,245'''
                  shape: ~round_rect
                  radius: 6
                  through: true
                effect:
                  stroke:
                    width: 3
                    color: ~100,110,120,220
              文字:
                type: Text
                attribute:
                  x: 0
                  y: 0
                  texts: ~&f取放记录
                  fontSize: 28
                  through: true
                  point: ~middle_center
            action:
              clickLeft: |-
                var.activityOpen = true
                var.activityRows = {}
                var.activityPage = 0
                var.activityNext = false
                Packet.send(var.packetId, 'shared_activity', var.activityFilterMember, var.activityFilterItem, var.activityFilterDays, '0')
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                var.deletePassword = none
                var.renameName = none
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''100,110,120,220'''
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f✕
                  fontSize: 36
                  through: true
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: 48 - var.offX
          y: 120
          width: 300
          height: var.viewH - 144
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~100,110,120,220
          导航仓库:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: Packet.send(var.packetId, 'storage')
            children:
              仓库底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple: null
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''100,110,120,220'''
              仓库文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: ~&f仓库
                  fontSize: 36
                  through: true
          导航银行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: Packet.send(var.packetId, 'bank')
            children:
              银行底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple: null
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''100,110,120,220'''
              银行文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: ~&f银行
                  fontSize: 36
                  through: true
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~180,190,200,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,255
              管理高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~180,190,200,255
                  shape: ~round_rect
                  radius: 2
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: ~&0管理
                  fontSize: 36
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 232
              width: 264
              height: 2
              normal: ~100,110,120,220
          仓库列表标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 250
              texts: ~&f仓库列表
              fontSize: 36
          新建名:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 296
              width: 160
              height: 48
            children:
              新建名底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~36,42,50,225
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''100,110,120,220'''
              输入框:
                type: TextBox
                attribute:
                  x: 10
                  y: 6
                  width: 140
                  height: 36
                  length: 24
                  emptyText: ~&7共享名
                  fontSize: 36
                action:
                  textChange: var.sharedName = self.getContent()
          创建:
            type: Canvas
            attribute:
              point: ~top_left
              x: 182
              y: 296
              width: 100
              height: 48
              enable: '!var.actionBusy && var.actionToken != '''''
            action:
              clickLeft: |-
                var.actionBusy = true
                Packet.send(var.packetId, 'shared_create', var.sharedName, var.actionToken)
            children:
              创建底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~160,170,180,235
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''160,170,180,255'''
              创建字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&0新建
                  fontSize: 36
                  through: true
          创建费用:
            type: Text
            attribute:
              point: ~top_left
              x: 14
              y: 352
              texts: '''&e'' + var.sharedCreateCostText'
              fontSize: 36
          仓库滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -12
              y: 396
              width: 10
              height: var.viewH - 590
              normal: ~40,44,52,225
              shape: ~round_rect
              radius: 5
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          仓库滑块:
            type: Texture
            val: 仓库滑块
            attribute:
              point: ~top_right
              x: -12
              y: 396
              width: 10
              height: 50
              normal: ~180,190,200,255
              maxDragY: var.viewH - 640
              shape: ~round_rect
              radius: 5
          仓库滚动:
            type: Scroll
            val: 仓库滚动
            attribute:
              point: ~top_left
              x: 14
              y: 396
              width: 258
              height: var.viewH - 590
              moveY: self.parent['仓库滑块'].getDragYRatio()
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['仓库滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              共享列表:
                val: 共享列表
                type: RepeatGrid
                attribute:
                  items: "var.共享列表网格数据"
                  flow: ~row
                  column: 1
                  spaceBetweenY: 8
                  maxSize: "var.共享列表网格数据 == none ? 0 : var.共享列表网格数据.size()"
                  width: 258
                children:
                  项:
                    type: Canvas
                    attribute:
                      entryKey: self.item
                      entry: var.manageWarehouses[self.entryKey]
                      visible: self.entry != none
                      width: 258
                      height: 48
                    action:
                      clickLeft: |-
                        var.deleteConfirm = false
                        if(var.manageWarehouseTypes[self.entryKey] == 'shared'){
                          Packet.send(var.packetId, 'shared', var.manageWarehouseTargets[self.entryKey])
                        }else{
                          Packet.send(var.packetId, 'warehouse', var.manageWarehouseTargets[self.entryKey])
                        }
                    children:
                      项背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: 'var.manageWarehouseSelected[self.parent.entryKey] ? ''64,72,82,225'' : ''44,50,58,245'''
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: 'self.isHovered() ? ''220,230,240,255'' : (var.manageWarehouseSelected[self.parent.entryKey] ? ''255,255,255,255''
                              : ''100,110,120,220'')'
                      项文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: '''&f'' + self.parent.entry[''name'']'
                          fontSize: 36
                          through: true
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: ~&fESC 关闭界面
              fontSize: 36
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: 372 - var.offX
          y: 120
          width: var.contentW
          height: var.viewH - 144
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~100,110,120,220
          设置区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 20
              width: var.halfW - 20
              height: var.viewH - 184
            children:
              设置区底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~36,42,50,225
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 3
                    color: ~100,110,120,220
              设置标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 20
                  texts: ~&f仓库设置
                  fontSize: 36
              拾取标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 64
                  texts: 'var.pickupScannerActive ? ''&f自动入库 · 扫描拾取模式'' : ''&f自动入库 · 自动拾取模式'''
                  fontSize: 28
              拾取关闭提示:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 108
                  visible: '!var.serverAutoPickup'
                  texts: ~&7服务器未开启自动拾取入库功能
                  fontSize: 36
              拾取组:
                type: HStack
                attribute:
                  point: ~top_left
                  x: 20
                  y: 108
                  width: var.halfW - 60
                  height: 48
                  spaceBetween: 8
                  visible: var.serverAutoPickup
                children:
                  自动入库:
                    type: Canvas
                    attribute:
                      width: 'var.serverMythicLoot ? (var.halfW - 76) / 3 : (var.halfW - 68) / 2'
                      height: 48
                      enable: '!var.pickupBusy && var.actionToken != '''''
                    action:
                      clickLeft: |-
                        var.pickupBusy = true
                        Packet.send(var.packetId, 'toggle_auto_pickup', var.actionToken)
                    children:
                      自动入库底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: 'var.autoPickup ? ''64,72,82,225'' : ''44,50,58,245'''
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: 'self.isHovered() ? ''220,230,240,255'' : (var.autoPickup ? ''255,255,255,255'' : ''100,110,120,220'')'
