# ─── 10 级：mail 类型（邮件发放）+ command 类型 ───
"10":
  level: 10
  free:
    # mail 类型：使用 Mail 模块预设邮件 ID
    # 需要在 Mail 模块中预先配置好 preset ID "battlepass_level_10_free"
    type: mail
    icon:
      material: EMERALD
      name: "&a绿宝石 x2（邮件预设）"
      amount: 2
    mail:
      presets:
        - "battlepass_level_10_free"
  premium:
    # mail 类型：直接配置邮件主题/正文/附件
    type: mail
    icon:
      material: ENCHANTED_GOLDEN_APPLE
      name: "&6附金苹果 x1（邮件附件）"
      amount: 1
    mail-subject: "战令 10 级奖励（高级档）"
    mail-body: "恭喜达到战令 10 级！请查收附金苹果作为高级档奖励。"
    item:
      source: minecraft
      id: ENCHANTED_GOLDEN_APPLE
      amount: 1
  deluxe:
    # command 类型：发放物品 + 设置权限
    type: command
    icon:
      material: NETHERITE_INGOT
      name: "&5下界合金锭 x2 + 专属称号"
      amount: 2
      glow: true
      lore:
        - "&7典藏档 10 级奖励"
        - "&7含稀有物品 + 专属称号权限"
    commands:
      - "give {player} netherite_ingot 2"
      - "lp user {player} permission set axs.title.battlepass10"

