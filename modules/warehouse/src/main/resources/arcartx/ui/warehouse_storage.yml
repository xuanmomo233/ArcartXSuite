                      Packet.send(var.packetId, 'deposit_slot', self.entryKey, 0)
                      var.lastBackpackClickSlot = none
                    }else{
                      var.selectedBackpackSlot = self.entryKey
                      var.lastBackpackClickSlot = self.entryKey
                      var.lastBackpackClickTime = now
                    }
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : (self.entryKey == var.selectedBackpackSlot ? '160,170,180,255' : '100,110,120,220')"

