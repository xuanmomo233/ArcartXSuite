# AXS Abyss 通关排行：独立列、动态行、空状态和滚动，不使用空格对齐。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonName = packet['dungeonName']
      var.rows = packet['boardRows']
      var.count = packet['boardCount']
      var.emptyMessage = packet['emptyMessage'] != none ? packet['emptyMessage'] : '暂无通关排行记录'
      self.actions['rebuild']()
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.viewNonce = ''
      var.dungeonName = ''
      var.rows = {}
      var.count = 0
      var.emptyMessage = '正在读取排行榜…'
      var.builtCount = -1
      var.rowRefs = {}
      var.revision = 0
    open: |-
      Packet.send('abyss', 'view_ready', 'leaderboard')
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'leaderboard', var.actionToken, var.viewNonce)
      }
    rebuild: |-
      if(var.leaderRows == none || var.leaderRows.size() != (var.count)){
        网格数据 = []
        if((var.count) > 0){
          for(网格序号 in range(0, (var.count) - 1)){
            网格数据.add(网格序号.round())
          }
        }
        var.leaderRows = 网格数据
      }
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;16,12,30,220
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      visible: "var.actionToken != ''"
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1040
          height: 780
        children:
          面板底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~24,19,40,245
              shape: ~round_rect
              radius: 16
              through: true
          标题:
