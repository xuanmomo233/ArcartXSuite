# ============================================================
#  QQBot 模块消息文件
# ------------------------------------------------------------
#  支持 & 颜色码（如 &c 红色）和 {0} {1} 占位符。
#  修改后执行 /axs reload qqbot 即可生效。
# ============================================================

prefix: "&3◆ &6ArcartXSuite &7| &r"

# ── 通用 ──────────────────────────────────────────────
common:
  service-down: "&cQQBot 模块未启动。"
  unknown: "&e未知命令，使用 /{0} qqbot help"
  only-player: "&c该命令仅限玩家使用。"
  no-permission: "&c你没有权限执行这个命令。"

# ── help ──────────────────────────────────────────────
help:
  title: "&6QQBot 管理"
  status: "&7{0} status&f - 查看运行状态"
  send: "&7{0} send <all|群号> <消息>&f - 向指定群或所有群发消息"
  lookup: "&7{0} lookup <玩家|QQ>&f - 查询绑定"
  snowluma: "&7{0} snowluma ...&f - SnowLuma 进程管理"
  blacklist: "&7{0} blacklist <add|remove|list> [QQ]&f - 黑名单管理"

# ── status ────────────────────────────────────────────
status:
  title: "&bQQBot 状态:"
  connection: "&7  连接状态: {0}"
  connected: "&a已连接"
  disconnected: "&c未连接"
  groups: "&7  监听群数: &f{0}"
  storage: "&7  存储模式: &f{0}"
  binding: "&7  绑定功能: {0}"
  whitelist: "&7  白名单: {0}"
  snowluma: "&7  SnowLuma: &f{0} &7（管理: /axs qqbot snowluma）"
  snowluma-not-installed: "&c未安装"
  enabled: "&a启用"
  disabled: "&c禁用"

# ── admin ─────────────────────────────────────────────
admin:
  send:
    usage: "&c用法: /axs qqbot send <all|群号> <消息>"
    success-all: "&a消息已发送到所有群。"
    success-group: "&a消息已发送到群 &e{0}&a。"
    invalid-group: "&c无效的群号: &7{0}"
  lookup:
    usage: "&c用法: /axs qqbot lookup <玩家名|QQ号>"
    by-qq-success: "&aQQ &e{0}&a 绑定玩家: &b{1}"
    by-qq-none: "&cQQ &7{0}&c 未绑定。"
    by-player-success: "&a玩家 &b{0}&a 绑定QQ: &e{1}"
    by-player-none: "&c玩家 &7{0}&c 未绑定。"
  snowluma:
    checking: "&e正在检查 SnowLuma 版本..."
    title: "&bSnowLuma 管理:"
    start: "&e  /axs qqbot snowluma start&7 - 启动 SnowLuma"
    stop: "&e  /axs qqbot snowluma stop&7 - 停止 SnowLuma"
    status: "&e  /axs qqbot snowluma status&7 - 查看状态（含 WebUI 信息）"
    install: "&e  /axs qqbot snowluma install&7 - 下载安装/部署（自带 Node 运行时，含进度显示）"
    logs: "&e  /axs qqbot snowluma logs&7 - 查看最近日志（Docker 模式）"
    password: "&e  /axs qqbot snowluma password [reset]&7 - 查看 WebUI 登录密码（reset 重置生成新临时密码）"
    check-update: "&e  /axs qqbot snowluma check-update&7 - 检查是否有新版本"
    install-start: "&e开始安装 SnowLuma（从 GitHub 下载），进度将实时推送..."
    unknown: "&c未知子命令: {0}"

# ── player ────────────────────────────────────────────
player:
  at-title: "&b[QQ群] &f{0} @了你"
  at-message: "&7[QQ群] &f{0} &7@了你，快去看看吧"
  help:
    title: "&6QQBot 命令"
    bind: "&7{0} bind <验证码>&f - 绑定QQ"
    unbind: "&7{0} unbind&f - 解绑QQ"
    info: "&7{0} info&f - 查看绑定信息"
    ui: "&7{0} ui&f - 打开绑定中心面板"
    admin: "&7{0} admin&f - 打开管理后台"
    at: "&7{0} at <QQ号> <消息>&f - @QQ群员"
  bind:
    usage: "&c用法: /{0} bind <验证码>"
  info:
    bind: "&a已绑定 QQ: &e{0}"
    none: "&7你尚未绑定QQ"
  ui:
    not-ready: "&cUI 服务未就绪。"
  at:
    usage: "&c用法: /{0} at <QQ号> <消息>"
    invalid-qq: "&c无效的QQ号: &7{0}"
    cooldown: "&c操作过于频繁，请 &e{0} &c秒后再试。"
    sent: "&a消息已通过QQ群发送给 &e{0}&a。"
  admin:
    no-permission: "&c你没有管理员权限。"