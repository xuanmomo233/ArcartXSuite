    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: -var.offX
          width: var.viewW
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~100,110,120,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~180,190,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: ~&f仓库管理
