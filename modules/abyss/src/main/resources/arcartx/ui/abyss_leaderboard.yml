# AXS 资源说明
# 用途: Abyss 地牢排行榜 —— 最佳通关时间榜（前 10）
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/dungeonName/boardRows{idx:{rank,name,time,completions}}
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonName = packet['dungeonName']
      var.boardRows = packet['boardRows']
      var.b0 = var.boardRows != none ? var.boardRows[0.round()] : none
      var.b1 = var.boardRows != none ? var.boardRows[1.round()] : none
      var.b2 = var.boardRows != none ? var.boardRows[2.round()] : none
      var.b3 = var.boardRows != none ? var.boardRows[3.round()] : none
      var.b4 = var.boardRows != none ? var.boardRows[4.round()] : none
      var.b5 = var.boardRows != none ? var.boardRows[5.round()] : none
      var.b6 = var.boardRows != none ? var.boardRows[6.round()] : none
      var.b7 = var.boardRows != none ? var.boardRows[7.round()] : none
      var.b8 = var.boardRows != none ? var.boardRows[8.round()] : none
      var.b9 = var.boardRows != none ? var.boardRows[9.round()] : none
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.dungeonName = ''
      var.boardRows = {}
      var.b0 = none
      var.b1 = none
      var.b2 = none
      var.b3 = none
      var.b4 = none
      var.b5 = none
      var.b6 = none
      var.b7 = none
      var.b8 = none
      var.b9 = none
      var.accent = '226,196,132,255'
      var.accentDim = '150,128,90,180'
    open: |-
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;16,12,30,210
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      排行面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 620
          height: 640
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;24,19,40,240
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 2
                color: var.accentDim
          标题标线:
            type: Texture
            attribute:
              point: ~top_center
              y: 26
              width: 26
              height: 3
              normal: var.accent
              through: true
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 42
              texts: "'&f排行榜  &7-  &f' + var.dungeonName"
              fontSize: 54
              through: true
          表头底:
