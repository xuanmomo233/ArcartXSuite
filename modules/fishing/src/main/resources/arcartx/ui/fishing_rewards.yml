# Lakeside field guide / 03 · A milestone ledger, not a shop.
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      var.claimableCount = 0
      var.iconJsons = {}
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.actionBusy = false
      var.level = packet['level']
      var.claimedRewards = packet['claimedRewards']
      var.rewards = packet['rewards']
      var.rewardCount = packet['rewardCount']
      var.claimedCount = 0
      if(var.rewards != none){
        for(key in var.rewards.keys()){
          json = packet['iconJson' + key]
          var.iconJsons[key] = (json != none && json != '') ? json : var.emptyItemJson
          entry = var.rewards[key]
          if(entry != none && entry['claimable'] == true){
            var.claimableCount = var.claimableCount + 1
          }
          if(entry != none && entry['claimed'] == true){
            var.claimedCount = var.claimedCount + 1
          }
        }
      }
      for(key in var.rewardRefs.keys()){
        var.rewardRefs[key].remove()
      }
      var.rewardRefs = {}
      var.rewardGeneration = (var.rewardGeneration + 1).round()
      for(i in range(1, var.rewardCount - 1)){
        key = i.round()
        e = val.奖励列表.get(0).copy('奖励条目_' + var.rewardGeneration + '_' + key)
        e.entryKey = key
        var.rewardRefs[key] = e
      }
      var.iconDelay = 2
  action:
    load: |-
      var.level = 1
      var.actionBusy = false
      var.busySeconds = 0
      var.packetId = 'AXS_FISHING_REWARDS'
      var.rewardCount = 0
      var.claimableCount = 0
      var.claimedCount = 0
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.rewardRefs = {}
      var.rewardGeneration = 0
      var.iconDelay = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send(var.packetId, 'refresh_rewards')
    seconds: |-
      if(var.actionBusy){
        var.busySeconds = var.busySeconds + 1
        if(var.busySeconds >= 3){
          var.actionBusy = false
          Packet.send(var.packetId, 'refresh_rewards')
        }
      }
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    tick: |-
      if(var.iconDelay > 0){
        var.iconDelay = var.iconDelay - 1
        if(var.iconDelay == 0){
          val.奖励列表.get(0)['图标'].seticon()
          for(key in var.rewardRefs.keys()){
            var.rewardRefs[key]['图标'].seticon()
          }
        }
      }
controls:
  全屏玻璃底: {type: Texture, attribute: {point: ~stretch_all, normal: '~Frosted:18;20,43,52,170'}}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶栏:
        type: Canvas
        attribute: {x: '-var.offX', width: 'var.viewW', height: 96}
        children:
          顶栏底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,250'}}
          标题: {type: Text, attribute: {point: ~middle_left, x: 48, texts: '~&f湖畔手册', fontSize: 54}}
          页名: {type: Text, attribute: {point: ~middle_left, x: 340, texts: '~&7钓鱼 / &f成长奖励', fontSize: 36}}
          关闭按钮:
            type: Canvas
            attribute: {point: ~middle_right, x: -40, width: 112, height: 52}
            action: {clickLeft: 'Screen.close()'}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~48,75,83,255', hover: '~73,107,106,255', shape: ~round_rect, radius: 12, through: true}}
              字: {type: Text, attribute: {point: ~middle_center, texts: '~&f关闭', fontSize: 36, through: true}}
      左侧导航:
        type: Canvas
        attribute: {x: '48 - var.offX', y: 120, width: 300, height: 'var.viewH - 144'}
        children:
          导航底: {type: Texture, attribute: {point: ~stretch_all, normal: '~231,222,196,250', shape: ~round_rect, radius: 18}}
          索引标题: {type: Text, attribute: {x: 24, y: 24, texts: '~&8FIELD GUIDE / 目录', fontSize: 36}}
          导航总览:
            type: Canvas
            attribute: {x: 16, y: 88, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_main')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f01  垂钓日志', fontSize: 36, through: true}}
          导航图鉴:
            type: Canvas
            attribute: {x: 16, y: 162, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_collection')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f02  鱼种图鉴', fontSize: 36, through: true}}
          导航奖励:
            type: Canvas
            attribute: {x: 16, y: 236, width: 268, height: 62}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~157,190,169,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&003  成长奖励', fontSize: 36, through: true}}
          导航天赋:
            type: Canvas
            attribute: {x: 16, y: 310, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_talents')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f04  技艺网络', fontSize: 36, through: true}}
          导航任务:
            type: Canvas
            attribute: {x: 16, y: 384, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_tasks')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f05  湖畔委托', fontSize: 36, through: true}}
          导航饵料:
            type: Canvas
            attribute: {x: 16, y: 458, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_baits')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f06  行前饵料', fontSize: 36, through: true}}
          状态图例: {type: Text, attribute: {x: 24, y: 580, texts: ['~&8成长解锁里程碑', '~&8浅绿：可领取', '~&8已领：记录完成', '~&8未达：继续积累经验'], fontSize: 36}}
      内容区:
        type: Canvas
        attribute: {x: '372 - var.offX', y: 120, width: 'var.contentW', height: 'var.viewH - 144'}
        children:
          内容底: {type: Texture, attribute: {point: ~stretch_all, normal: '~191,209,191,248', shape: ~round_rect, radius: 18}}
          页标题: {type: Text, attribute: {x: 32, y: 24, texts: '~&0成长奖励', fontSize: 64}}
          当前等级: {type: Text, attribute: {point: ~top_right, x: -32, y: 40, texts: "'&8垂钓等级 Lv.' + var.level.round()", fontSize: 36}}
          统计底: {type: Texture, attribute: {x: 32, y: 116, width: 'var.contentW - 64', height: 92, normal: '~23,49,64,255', shape: ~round_rect, radius: 12}}
          领取统计: {type: Text, attribute: {x: 56, y: 144, texts: "'&f可领取 ' + var.claimableCount.round() + '   &7已领取 ' + var.claimedCount.round() + ' / ' + var.rewardCount.round()", fontSize: 36}}
          保存状态: {type: Text, attribute: {point: ~top_right, x: -56, y: 144, texts: "var.actionBusy ? '&e正在领取，请稍候...' : '&7按等级排列 / 滚轮翻阅'", fontSize: 36}}
          空状态: {type: Text, attribute: {point: ~middle_center, texts: '~&8本赛季暂无奖励记录', fontSize: 48, visible: 'var.rewardCount == 0'}}
          奖励滑轨: {type: Texture, attribute: {point: ~top_right, x: -16, y: 236, width: 12, height: 'var.viewH - 404', normal: '~140,166,151,255', shape: ~round_rect, radius: 6}}
          奖励滑块:
            type: Texture
            val: 奖励滑块
            attribute: {point: ~top_right, x: -16, y: 236, width: 12, height: 120, maxDragY: 'var.viewH - 524', normal: '~23,49,64,255', shape: ~round_rect, radius: 6}
          滚动区:
            type: Scroll
            attribute: {x: 28, y: 236, width: 'var.contentW - 76', height: 'var.viewH - 404', moveY: "self.parent['奖励滑块'].getDragYRatio()"}
            action:
              wheel: |-
                self.parent['奖励滑块'].setDragYRatio(math.max(0, math.min(1, self.moveY - self.wheelValue * 0.1)))
            children:
              奖励列表:
                type: VStack
                val: 奖励列表
                attribute: {width: 'var.contentW - 76', spaceBetween: 16}
                children:
                  奖励条目:
                    type: Canvas
                    attribute: {entryKey: 0.round(), entry: 'var.rewards[self.entryKey]', visible: 'self.entry != none', width: 'var.contentW - 76', height: 140}
                    children:
                      条目底: {type: Texture, attribute: {point: ~stretch_all, normal: "self.parent.entry['claimable'] == true ? '157,190,169,255' : '231,222,196,255'", shape: ~round_rect, radius: 14, through: true}}
                      等级徽章:
                        type: Canvas
                        attribute: {x: 12, y: 12, width: 112, height: 116}
                        children:
                          底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,255', shape: ~round_rect, radius: 12, through: true}}
                          字: {type: Text, attribute: {point: ~middle_center, texts: "'&fLv.' + self.parent.parent.entry['level'].round()", fontSize: 36, through: true}}
                      图标:
                        type: Slot
                        attribute: {x: 144, y: 24, width: 92, height: 92, normal: '~99,141,142,255', shape: ~round_rect, radius: 12, slotType: ~Icon, itemScale: 0.85, overwriteText: '~', seticon: 'self.setItemIcon(var.iconJsons[self.parent.entryKey])'}
                      名称: {type: Text, attribute: {x: 264, y: 28, texts: "'&0' + self.parent.entry['iconName']", fontSize: 48, limit: 18, through: true}}
                      类型: {type: Text, attribute: {x: 264, y: 88, texts: "'&8' + self.parent.entry['type'] + ' · x' + self.parent.entry['iconAmount'].round()", fontSize: 36, through: true}}
                      领取按钮:
                        type: Canvas
                        attribute: {point: ~middle_right, x: -24, width: 200, height: 64, visible: "self.parent.entry['claimable'] == true", enable: '!var.actionBusy && var.actionToken != none'}
                        action:
                          clickLeft: |-
                            if(!var.actionBusy && var.actionToken != none){
                              var.actionBusy = true
                              var.busySeconds = 0
                              Packet.send(var.packetId, 'claim_reward', var.actionToken, self.parent.entry['id'])
                            }
                        children:
                          领取背景: {type: Texture, attribute: {point: ~stretch_all, normal: "var.actionBusy ? '80,103,102,255' : '23,49,64,255'", hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
                          领取文字: {type: Text, attribute: {point: ~middle_center, texts: "var.actionBusy ? '&7处理中' : '&f领取奖励'", fontSize: 36, through: true}}
                      已领取标识: {type: Text, attribute: {point: ~middle_right, x: -32, texts: '~&2已领取', fontSize: 36, visible: "self.parent.entry['claimed'] == true", through: true}}
                      未达标标识: {type: Text, attribute: {point: ~middle_right, x: -32, texts: "'&8需要 Lv.' + self.parent.entry['level'].round()", fontSize: 36, visible: "self.parent.entry['claimable'] != true && self.parent.entry['claimed'] != true", through: true}}
