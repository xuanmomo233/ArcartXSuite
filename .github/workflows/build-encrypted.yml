name: Encrypted CI Pipeline

# 方案 ②（类字节码加密 + ProtectedClassLoader 注入）的专用构建管线。
#
# 触发（目标②）：
#   - push 到 main 时自动运行（Build Plaintext Dev Artifacts 已不再 push 触发，push 只跑本工作流）；
#   - 也保留 workflow_dispatch 手动全量构建。
#
# 按改动检测（目标②）：
#   - detect-changes 作业按 diff 判定「本体(core) / 模块(modules)」是否变更；
#   - 宿主或模块变更时，构建同一批次的宿主和全部正式模块；
#   - 手动生产发布或无法 diff 时构建全量；
#   - 客户正式导出仅打包指定模块，不写入云端当前版本。
#
# 宿主与 Native 作业从对应发行渠道的同一份种子独立派生密钥。
# 签名私钥仅在需要它的步骤中由 Secrets 生成，跨作业只传 Ed25519 公钥和编译产物。
# 模块逐类加密与 .axb 容器共用独立的模块密钥，由构建作业直接提交给云端。

on:
  workflow_dispatch:
    inputs:
      skip_upload:
        description: '只构建验证（加密/签名/native 编译全链路），不上传云端'
        required: false
        type: boolean
        default: false
      export_only:
        description: '用正式密钥为指定账号构建客户包，仅导出 GitHub Artifacts'
        type: boolean
        default: false
      publish_suite:
        description: '单次正式发布当前 main 的 Suite 宿主和模块，保持自动发布暂停设置'
        type: boolean
        default: false
      skip_announcement:
        description: '发布完成后只核对主备云，不再发送该版本的群公告'
        type: boolean
        default: false
      export_account:
        description: '收件人的云端 QQ 账号'
        type: string
      export_recipient:
        description: '写入水印的内部客户编号，例如 customer-001（英文字母、数字、-、_）'
        type: string
      export_delivery_id:
        description: '写入水印的交付编号，留空时按工作流运行号生成'
        type: string
      export_modules:
        description: '逗号分隔的正式模块 ID，留空时打包全部正式模块（排除 Debug）'
        type: string
      native_self_check:
        description: '开启 Native 运行时自校验并验证原件和篡改副本'
        required: false
        type: boolean
        default: false
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.export_only && format('encrypted-export-{0}', github.run_id)
        || (github.ref == 'refs/heads/main' && !inputs.export_only && !inputs.skip_upload
            && (vars.AXS_SKIP_CLOUD_UPLOAD != 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_suite))
            && format('encrypted-publication-{0}', github.ref))
        || format('encrypted-validation-{0}', github.ref) }}
  cancel-in-progress: false
env:
  PYTHONUTF8: '1'
  # Export-only builds use the production signing inputs even while cloud publishing is paused.
  AXS_EXPORT_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.export_only && 'true' || 'false' }}
  AXS_EDITION: ${{ github.event_name == 'workflow_dispatch' && inputs.export_only && 'customer' || 'free' }}
  AXS_MANUAL_SUITE_PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_suite && github.ref == 'refs/heads/main' && !inputs.skip_upload && !inputs.export_only && 'true' || 'false' }}
  AXS_CI_VALIDATION: ${{ !inputs.export_only && (github.ref != 'refs/heads/main' || inputs.skip_upload || (vars.AXS_SKIP_CLOUD_UPLOAD == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.publish_suite))) && 'true' || 'false' }}
  AXS_CLOUD_UPLOAD: ${{ github.ref == 'refs/heads/main' && !inputs.export_only && !inputs.skip_upload && (vars.AXS_SKIP_CLOUD_UPLOAD != 'true' || (github.event_name == 'workflow_dispatch' && inputs.publish_suite)) && 'true' || 'false' }}
  # 首次验证使用 skip_upload。双平台通过后可设置仓库变量启用常规发布。
  AXS_PRODUCTION: ${{ (inputs.native_self_check || vars.AXS_NATIVE_SELF_CHECK == 'true') && 'ON' || 'OFF' }}

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      core_changed: ${{ steps.changes.outputs.core_changed }}
      module_changed: ${{ steps.changes.outputs.module_changed }}
      proxy_changed: ${{ steps.changes.outputs.proxy_changed }}
      auth_changed: ${{ steps.changes.outputs.auth_changed }}
      changed_modules: ${{ steps.changes.outputs.changed_modules }}
      assemble_release: ${{ steps.delivery.outputs.needed }}
      export_delivery_id: ${{ steps.changes.outputs.export_delivery_id }}
      any_changed: ${{ steps.changes.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Detect changed scopes
        id: changes
        env:
          GH_TOKEN: ${{ github.token }}
          EXPORT_ACCOUNT: ${{ inputs.export_account }}
          EXPORT_RECIPIENT: ${{ inputs.export_recipient }}
          EXPORT_DELIVERY_ID: ${{ inputs.export_delivery_id }}
          EXPORT_MODULES: ${{ inputs.export_modules }}
          VALIDATION_ONLY: ${{ inputs.skip_upload }}
          PUBLISH_SUITE_REQUESTED: ${{ inputs.publish_suite }}
        run: |
          set -euo pipefail
          if [[ "${PUBLISH_SUITE_REQUESTED:-false}" == true && "${AXS_MANUAL_SUITE_PUBLISH:-false}" != true ]]; then
            echo "::error::Suite 单次发布要求选择 main，且不能同时选择 skip_upload 或 export_only"
            exit 1
          fi
          # 全部模块清单（用于手动 / 无法 diff 时的全量构建）
          # 排除 debug 模块（非生产模块，无 encryptModuleAxb 任务）
          ALL_MODULES=$(ls -d modules/*/ 2>/dev/null | sed 's#modules/##; s#/##' | sort -u | grep -v '^debug$' | jq -R -s -c 'split("\n") | map(select(. != ""))')

          if [[ "${AXS_EXPORT_ONLY:-false}" == true ]]; then
            if [[ "${VALIDATION_ONLY:-false}" == true ]]; then
              echo "::error::正式导出不能同时选择 skip_upload"
              exit 1
            fi
            if [[ "$GITHUB_REF" != refs/heads/main ]]; then
              if [[ "$GITHUB_REF" != refs/tags/suite-export-* ]] || ! git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main; then
                echo "::error::正式导出请选择 main 或指向已合入 main 的 suite-export-* 标签"
                exit 1
              fi
            fi
            if [[ ! "${EXPORT_DELIVERY_ID:-}" =~ [^[:space:]] ]]; then
              if [[ ! "${GITHUB_RUN_ID:-}" =~ ^[0-9]+$ ]]; then
                echo "::error::缺少有效的工作流运行号，无法生成交付编号"
                exit 1
              fi
              EXPORT_DELIVERY_ID="delivery-${GITHUB_RUN_ID}"
            fi
            if ! [[ "${EXPORT_ACCOUNT:-}" =~ ^[0-9]{5,20}$ ]]; then
              echo "::error::收件人的云端 QQ 账号须为 5 至 20 位数字"
              exit 1
            fi
            if ! [[ "${EXPORT_RECIPIENT:-}" =~ ^[A-Za-z0-9_-]{1,80}$ ]]; then
              echo "::error::内部客户编号须为 1 至 80 位英文字母、数字、连字符或下划线"
              exit 1
            fi
            if ! [[ "$EXPORT_DELIVERY_ID" =~ ^[A-Za-z0-9_-]{1,100}$ ]]; then
              echo "::error::交付编号须为 1 至 100 位英文字母、数字、连字符或下划线，也可留空自动生成"
              exit 1
            fi
            if ! ALL_MODULES=$(jq -ecn --arg selected "${EXPORT_MODULES:-}" --argjson allowed "$ALL_MODULES" '
              ($selected | gsub("^\\s+|\\s+$"; "")) as $selection
              | (if $selection == "" then $allowed
                 else ($selection | split(",") | map(gsub("^\\s+|\\s+$"; ""))) end) as $ids
              | select(($ids|length) >= 1 and ($ids|length) <= 64 and ($ids|unique|length) == ($ids|length)
                and all($ids[]; . as $id | $allowed | index($id) != null))
              | $ids'); then
              echo "::error::客户包需要 1 至 64 个互不重复的正式模块 ID"
              exit 1
            fi
            echo "export_delivery_id=$EXPORT_DELIVERY_ID" >> "$GITHUB_OUTPUT"
          fi

          last_published() {
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=$1&per_page=100" \
              | jq -r '[.artifacts[] | select(.expired == false and .workflow_run.head_branch == "main")]
                    | max_by(.created_at) | .workflow_run.head_sha // empty'
          }
          BASE=""
          PROXY_BASE=""
          if [ "$GITHUB_EVENT_NAME" = "push" ]; then
            BASE=$(last_published suite-published) || exit 1
            PROXY_BASE=$(last_published suite-proxy-published) || exit 1
          fi

          # 首次提交 / 手动触发 / 无法解析 BASE 时全量构建（本体 + 全部模块）
          if [ -z "$BASE" ] || ! git merge-base --is-ancestor "$BASE" HEAD 2>/dev/null; then
            echo "无法 diff（手动/首提），全量构建本体 + 全部模块"
            echo "core_changed=true" >> $GITHUB_OUTPUT
            echo "module_changed=true" >> $GITHUB_OUTPUT
            if [[ "${AXS_MANUAL_SUITE_PUBLISH:-false}" == true ]]; then
              echo "proxy_changed=false" >> $GITHUB_OUTPUT
            else
              echo "proxy_changed=true" >> $GITHUB_OUTPUT
            fi
            echo "auth_changed=true" >> $GITHUB_OUTPUT
            echo "changed_modules=$ALL_MODULES" >> $GITHUB_OUTPUT
            echo "any_changed=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          CHANGED_FILES=$(mktemp "$RUNNER_TEMP/axs-changed.XXXXXXXX")
          trap 'rm -f "$CHANGED_FILES"' EXIT
          TEST_PATHS=(
            ':(exclude,glob)**/src/test/java/**'
            ':(exclude,glob)**/src/test/kotlin/**'
            ':(exclude,glob)**/src/test/resources/**'
            ':(exclude,glob)**/src/customerTest/**'
            ':(exclude,glob)**/src/freeTest/**'
            ':(exclude,glob)scripts/tests/**'
          )
          git diff --name-only "$BASE" HEAD -- . "${TEST_PATHS[@]}" > "$CHANGED_FILES"
          echo "=== Changed files ==="
          cat "$CHANGED_FILES"

          # 仅调整工作流时不产生新的产品版本，生产链路可手动选择 skip_upload 验证。
          CORE_CHANGED=false
          if grep -Eq '^(src/(main|customer|free)/|axs-core/|axs-api/|axs-placeholder/|auth-(engine|minecraft|protocol)/|buildSrc/|proguard/|native/|scripts/|gradle/|keys/|gradle\.properties|settings\.gradle\.kts|build\.gradle\.kts)' "$CHANGED_FILES"; then
            CORE_CHANGED=true
          fi

          PROXY_CHANGED=false
          if [ -z "$PROXY_BASE" ] || ! git merge-base --is-ancestor "$PROXY_BASE" HEAD 2>/dev/null; then
            PROXY_CHANGED=true
          elif ! git diff --quiet "$PROXY_BASE" HEAD -- proxy/ auth-protocol/ gradle.properties \
              axs-api/src/main/java/xuanmo/arcartxsuite/api/crossserver/ProxyTabVisibility.java "${TEST_PATHS[@]}"; then
            PROXY_CHANGED=true
          fi
          echo "proxy_changed=$PROXY_CHANGED" >> $GITHUB_OUTPUT

          AUTH_CHANGED=false
          if [ "$PROXY_CHANGED" = "true" ] || grep -Eq '^(auth-(center|engine|minecraft|protocol)/|src/(main|customer|free)/java/xuanmo/arcartxsuite/auth/|modules/loginview/)' "$CHANGED_FILES"; then
            AUTH_CHANGED=true
          fi
          echo "auth_changed=$AUTH_CHANGED" >> $GITHUB_OUTPUT

          # 宿主与正式模块使用同一发行批次。删除模块也要重建完整清单。
          CHANGED_MODULES="[]"
          if [ "$CORE_CHANGED" = "true" ] || awk -F/ '$1 == "modules" && $2 != "debug" && NF > 2 { found=1 } END { exit !found }' "$CHANGED_FILES"; then
            CORE_CHANGED=true
            CHANGED_MODULES="$ALL_MODULES"
          fi
          echo "core_changed=$CORE_CHANGED" >> $GITHUB_OUTPUT
          echo "changed_modules=$CHANGED_MODULES" >> $GITHUB_OUTPUT
          if [ "$CHANGED_MODULES" != "[]" ]; then
            echo "module_changed=true" >> $GITHUB_OUTPUT
          else
            echo "module_changed=false" >> $GITHUB_OUTPUT
          fi

          if [ "$CORE_CHANGED" = "true" ] || [ "$CHANGED_MODULES" != "[]" ] || [ "$PROXY_CHANGED" = "true" ]; then
            echo "any_changed=true" >> $GITHUB_OUTPUT
          else
            echo "any_changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Check customer export signing inputs
        if: env.AXS_EXPORT_ONLY == 'true'
        env:
          AXS_CUSTOMER_EXPORT_SEED_PARTS_B64: ${{ secrets.AXS_CUSTOMER_EXPORT_SEED_PARTS_B64 }}
          AXB_SIGN_SEED_B64: ${{ secrets.AXB_SIGN_SEED_B64 }}
          AXB_RESP_SIGN_SEED_B64: ${{ secrets.AXB_RESP_SIGN_SEED_B64 }}
          AXS_WATERMARK_PRIVATE_PEM: ${{ secrets.AXS_WATERMARK_PRIVATE_PEM }}
          AXS_VARIANT_REGISTRATION_KEY_B64: ${{ secrets.AXS_VARIANT_REGISTRATION_KEY_B64 }}
        run: |
          set -euo pipefail
          missing=()
          for name in AXS_CUSTOMER_EXPORT_SEED_PARTS_B64 AXB_SIGN_SEED_B64 AXB_RESP_SIGN_SEED_B64 AXS_WATERMARK_PRIVATE_PEM AXS_VARIANT_REGISTRATION_KEY_B64; do
            if [[ -z "${!name}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} )); then
            printf '::error::客户正式导出缺少 GitHub Secrets %s\n' "${missing[*]}"
            exit 1
          fi

      - name: Verify both Suite publication endpoints
        if: env.AXS_CLOUD_UPLOAD == 'true' && steps.changes.outputs.core_changed == 'true'
        env:
          CLOUD_CI_TOKEN: ${{ secrets.CLOUD_CI_TOKEN }}
          FLARE_BASE_URL: ${{ vars.FLARE_BASE_URL }}
        run: python3 scripts/publish-suite.py check

      - name: Select release assembly
        id: delivery
        run: |
          if [[ "$AXS_CLOUD_UPLOAD" == true || "$AXS_EXPORT_ONLY" == true ]]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

  native-public-keys:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.core_changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography
        run: pip install cryptography

      - name: Derive Native verification public keys
        env:
          AXB_SIGN_SEED_B64: ${{ env.AXS_CI_VALIDATION != 'true' && secrets.AXB_SIGN_SEED_B64 || '' }}
          AXB_RESP_SIGN_SEED_B64: ${{ env.AXS_CI_VALIDATION != 'true' && secrets.AXB_RESP_SIGN_SEED_B64 || '' }}
        run: python scripts/run-with-build-seeds.py scripts/generate-keys.py --public-only --output native-public-keys

      - uses: actions/upload-artifact@v5
        with:
          name: native-public-keys
          path: |
            native-public-keys/ed25519_public_raw.bin
            native-public-keys/response_ed25519_public_raw.bin
          retention-days: 1
          if-no-files-found: error

  build-linux:
    runs-on: ubuntu-latest
    needs: [detect-changes, native-public-keys]
    if: needs.detect-changes.outputs.core_changed == 'true'
    # 在 Ubuntu 20.04 容器内编译，glibc 基线降到 2.31，
    # 避免 ubuntu-latest（glibc 2.39）产物在低版本 glibc 服务器上 UnsatisfiedLinkError
    container:
      image: ubuntu:20.04
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Install toolchain (glibc 2.31 baseline)
        run: |
          # focal 已 EOL，archive 源可能已迁 old-releases，失败时自动切换兜底
          apt-get update || (sed -i 's|archive.ubuntu.com|old-releases.ubuntu.com|g; s|security.ubuntu.com|old-releases.ubuntu.com|g' /etc/apt/sources.list && apt-get update)
          apt-get install -y --no-install-recommends ca-certificates git tar curl g++ make libssl-dev zlib1g-dev default-jdk python3
          # focal apt 的 cmake 仅 3.16 < 3.20，使用 Kitware 官方二进制包
          # （setup-python 安装的版本依赖新 glibc，在此容器内无法运行，故不用）
          curl -fsSL https://github.com/Kitware/CMake/releases/download/v3.30.5/cmake-3.30.5-linux-x86_64.tar.gz | tar -xz -C /opt
          ln -sf /opt/cmake-3.30.5-linux-x86_64/bin/cmake /usr/local/bin/cmake

      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          name: native-public-keys
          path: native-public-keys

      - name: Embed native verification keys and seed parts
        env:
          AXS_SEED_PARTS_B64: ${{ env.AXS_CI_VALIDATION != 'true' && secrets[inputs.export_only && 'AXS_CUSTOMER_EXPORT_SEED_PARTS_B64' || 'AXS_SEED_PARTS_B64'] || '' }}
        run: python3 scripts/run-with-build-seeds.py scripts/embed-keys.py --keys-dir native-public-keys --require-fixed-seed --embed-only

      - name: Build native library
        run: |
          cd native
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAXS_PRODUCTION="${AXS_PRODUCTION}" -DAXS_REQUIRE_HOST_SEAL=ON
          cmake --build build --config Release

      - name: Verify runtime baseline
        run: |
          SO=src/main/resources/native/libaxs-native.so
          echo "=== 动态依赖 ==="
          ldd "$SO" || true
          MAX_GLIBC=$(objdump -T "$SO" | grep -oE 'GLIBC_[0-9]+\.[0-9]+' | sort -Vu | tail -1)
          echo "最高 GLIBC 符号版本: $MAX_GLIBC"
          if ldd "$SO" 2>/dev/null | grep -E 'libcrypto|libssl|libstdc\+\+|libgcc'; then
            echo "ERROR: .so 仍存在 OpenSSL/C++ 运行时动态依赖（应已静态链接）"
            exit 1
          fi

      - name: Inject native self-hash
        run: python3 scripts/inject-self-hash.py src/main/resources/native/libaxs-native.so

      - name: Verify Linux host-seal enforcement and native self-check
        run: |
          set -eu
          work=$(mktemp -d)
          javac -encoding UTF-8 -d "$work" native/selfcheck/SelfCheckHarness.java native/selfcheck/xuanmo/arcartxsuite/security/NativeBridge.java
          java -cp "$work" SelfCheckHarness src/main/resources/native/libaxs-native.so expect_pass
          if [ "$AXS_PRODUCTION" = "ON" ]; then
            python3 scripts/make-tampered-copy.py src/main/resources/native/libaxs-native.so "$work/tampered.so"
            java -cp "$work" SelfCheckHarness "$work/tampered.so" expect_tamper
          fi

      - name: Move artifact to root
        run: cp src/main/resources/native/libaxs-native.so libaxs-native.so

      - uses: actions/upload-artifact@v5
        with:
          name: native-linux-enc
          path: libaxs-native.so
          if-no-files-found: error

  build-windows:
    runs-on: windows-2022
    needs: [detect-changes, native-public-keys]
    if: needs.detect-changes.outputs.core_changed == 'true'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/download-artifact@v5
        with:
          name: native-public-keys
          path: native-public-keys

      - name: Embed native verification keys and seed parts
        shell: pwsh
        env:
          AXS_SEED_PARTS_B64: ${{ env.AXS_CI_VALIDATION != 'true' && secrets[inputs.export_only && 'AXS_CUSTOMER_EXPORT_SEED_PARTS_B64' || 'AXS_SEED_PARTS_B64'] || '' }}
        run: python scripts/run-with-build-seeds.py scripts/embed-keys.py --keys-dir native-public-keys --require-fixed-seed --embed-only

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zlib
            mingw-w64-x86_64-make
            make
            file

      - name: Build native library
        shell: msys2 {0}
        run: |
          cd native
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DAXS_PRODUCTION="${AXS_PRODUCTION}" -DAXS_REQUIRE_HOST_SEAL=ON -G "MinGW Makefiles" -DCMAKE_C_COMPILER=x86_64-w64-mingw32-gcc -DCMAKE_CXX_COMPILER=x86_64-w64-mingw32-g++
          cmake --build build --verbose
      - name: Inject native self-hash
        shell: pwsh
        run: |
          # 用 pwsh（而非 msys2）执行：setup-python 的 python 在默认 shell 的 PATH 上，
          # 而 MSYS2 MINGW64 环境未安装/未暴露该 python，会报 command not found。
          $dll = Get-ChildItem -Path src/main/resources/native -File |
                 Where-Object { $_.Name -in @('axs-native.dll','libaxs-native.dll') } |
                 Select-Object -First 1
          if (-not $dll) {
            Write-Error "No axs-native DLL found in src/main/resources/native!"
            Get-ChildItem -Path src/main/resources/native -File | ForEach-Object { $_.FullName }
            exit 1
          }
          python scripts/inject-self-hash.py $dll.FullName

      - name: Locate and normalize DLL name
        shell: msys2 {0}
        run: |
          DLL_PATH=$(find src/main/resources/native -maxdepth 1 -type f \( -name "axs-native.dll" -o -name "libaxs-native.dll" \) | head -1)
          if [ -z "$DLL_PATH" ]; then
            echo "ERROR: No axs-native DLL found"
            find src/main/resources/native -type f || true
            exit 1
          fi
          if [ "$(basename "$DLL_PATH")" != "axs-native.dll" ]; then
            cp "$DLL_PATH" src/main/resources/native/axs-native.dll
          fi
          file src/main/resources/native/axs-native.dll

      - name: Inspect Windows DLL imports
        if: env.AXS_PRODUCTION == 'ON'
        shell: msys2 {0}
        run: objdump -p src/main/resources/native/axs-native.dll | grep 'DLL Name:'

      - name: Verify Windows host-seal enforcement and native self-check
        shell: pwsh
        run: |
          $OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::OutputEncoding = [System.Text.UTF8Encoding]::new($false)
          [Console]::InputEncoding = [System.Text.UTF8Encoding]::new($false)
          $PSDefaultParameterValues['*:Encoding'] = 'utf8NoBOM'
          # JDK 17 的 Windows DLL 加载受系统代码页限制。与 axs.native.tmpdir 的 ASCII 部署路径一致。
          $work = Join-Path $env:RUNNER_TEMP 'axs-native-selfcheck'
          New-Item -ItemType Directory -Path $work -Force | Out-Null
          $original = Join-Path $work 'axs-native.dll'
          Copy-Item -LiteralPath 'src/main/resources/native/axs-native.dll' -Destination $original
          $tampered = Join-Path $work 'tampered.dll'
          javac -encoding UTF-8 -d $work native/selfcheck/SelfCheckHarness.java native/selfcheck/xuanmo/arcartxsuite/security/NativeBridge.java
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          java -cp $work SelfCheckHarness $original expect_pass
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          if ($env:AXS_PRODUCTION -eq 'ON') {
            python scripts/make-tampered-copy.py $original $tampered
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            java -cp $work SelfCheckHarness $tampered expect_tamper
            exit $LASTEXITCODE
          }

      - name: Verify no MinGW runtime dependency
        shell: msys2 {0}
        run: |
          MINGW_DEPS=$(ldd src/main/resources/native/axs-native.dll 2>/dev/null | grep -E "libgcc|libstdc\+\+|libwinpthread" || true)
          if [ -n "$MINGW_DEPS" ]; then
            echo "ERROR: DLL depends on MinGW runtime (must be static):"
            echo "$MINGW_DEPS"
            exit 1
          fi
          echo "OK: statically linked"

      - name: Move artifact to root
        shell: cmd
        run: copy src\main\resources\native\axs-native.dll axs-native.dll

      - uses: actions/upload-artifact@v5
        with:
          name: native-windows-enc
          path: axs-native.dll
          if-no-files-found: error

  build-encrypted:
    runs-on: ubuntu-latest
    needs: [detect-changes, native-public-keys, build-linux, build-windows]
    if: needs.detect-changes.outputs.core_changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        runtime_target: [windows-x86_64, linux-x86_64]
    env:
      AXS_RUNTIME_TARGET: ${{ matrix.runtime_target }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography
        run: pip install cryptography

      - uses: actions/download-artifact@v5
        with:
          name: native-public-keys
          path: native-public-keys

      - name: Prepare local signing keys and verify Native public keys
        env:
          AXB_SIGN_SEED_B64: ${{ env.AXS_CI_VALIDATION != 'true' && secrets.AXB_SIGN_SEED_B64 || '' }}
          AXB_RESP_SIGN_SEED_B64: ${{ env.AXS_CI_VALIDATION != 'true' && secrets.AXB_RESP_SIGN_SEED_B64 || '' }}
          AXS_SEED_PARTS_B64: ${{ env.AXS_CI_VALIDATION != 'true' && secrets[inputs.export_only && 'AXS_CUSTOMER_EXPORT_SEED_PARTS_B64' || 'AXS_SEED_PARTS_B64'] || '' }}
        run: |
          set -euo pipefail
          umask 077
          keys_root="$RUNNER_TEMP/axs-signing"
          python scripts/run-with-build-seeds.py scripts/generate-keys.py --require-fixed-seeds --class-count 0 --output "$keys_root"
          export KEYS_DIR="$keys_root/$(cat "$keys_root/current_version.txt")"
          python scripts/run-with-build-seeds.py scripts/embed-keys.py --keys-dir "$KEYS_DIR" --require-fixed-seed --derive-only
          python - <<'PY'
          import os
          from pathlib import Path
          from cryptography.hazmat.primitives import serialization

          for key in ("ed25519_public", "response_ed25519_public"):
              pem = Path(os.environ["KEYS_DIR"]) / f"{key}.pem"
              raw = Path("native-public-keys") / f"{key}_raw.bin"
              public = serialization.load_pem_public_key(pem.read_bytes())
              if public.public_bytes(serialization.Encoding.Raw, serialization.PublicFormat.Raw) != raw.read_bytes():
                  raise SystemExit(f"FAIL: signing key disagrees with Native input: {key}")
          PY
          echo "KEYS_DIR=$KEYS_DIR" >> "$GITHUB_ENV"
          echo "AXS_RUNTIME_SIGNING_KEY_FILE=$KEYS_DIR/ed25519_private.pem" >> "$GITHUB_ENV"

      - name: Download Linux native (real-seed)
        uses: actions/download-artifact@v5
        with:
          name: native-linux-enc
          path: src/main/resources/native/

      - name: Download Windows native (real-seed)
        uses: actions/download-artifact@v5
        with:
          name: native-windows-enc
          path: src/main/resources/native/

      - name: List native artifacts
        run: ls -la src/main/resources/native/

      - name: Encrypt native libraries (V2 at-rest)
        run: |
          set -euo pipefail
          umask 077
          native_key=$(mktemp "$RUNNER_TEMP/axs-native-key.XXXXXXXX")
          trap 'rm -f "$native_key"' EXIT
          python scripts/encrypt-native.py gen-key \
            --patch-java src/main/java/xuanmo/arcartxsuite/security/NativeBridge.java \
            --output-key "$native_key"
          # 将明文 .dll/.so 用 AES-256-GCM 加密为 .enc，删除明文；密钥由上面 NativeBridge 内片段重组
          python scripts/encrypt-native.py encrypt \
            --key "$native_key" \
            --native-dir src/main/resources/native/
          ls -la src/main/resources/native/

      - uses: gradle/actions/setup-gradle@v6

      - name: Build obfuscated JAR
        run: |
          # 只构建 :axs-core 任务链（shadowJar→thinCoreJar→proguard→strEnc→integrity→publishCoreJar），
          # 不再跑根 build——后者会连带构建全部 30 个模块+proxy，而本作业产物只需要本体 jar。
          # fresh runner 无历史产物，clean 为纯开销，省略；--parallel 并行编译 axs-api 等依赖。
          CORE_LIB_DIR="axs-core/build/runtime/$AXS_RUNTIME_TARGET/libs"
          CORE_ARTIFACT_NAME="axs-jar-encrypted-$AXS_RUNTIME_TARGET"
          echo "CORE_LIB_DIR=$CORE_LIB_DIR" >> "$GITHUB_ENV"
          echo "CORE_ARTIFACT_NAME=$CORE_ARTIFACT_NAME" >> "$GITHUB_ENV"
          bash ./gradlew :axs-core:build --no-build-cache --parallel -Paxs.edition="$AXS_EDITION" -Paxs.runtimeTarget="$AXS_RUNTIME_TARGET" -x test

      - name: Ensure real-seed native libs intact in obfuscated JAR
        run: |
          set -euo pipefail
          JAR_PATH=$(find "$PWD/$CORE_LIB_DIR" -maxdepth 1 -name "ArcartX-Suite-[0-9]*.jar" -not -name "*plain*" -not -name "*unobf*" -not -name "*step*" | sort | tail -1)
          if [ -z "$JAR_PATH" ]; then echo "ERROR: final obfuscated JAR not found"; ls -la "$CORE_LIB_DIR" || true; exit 1; fi
          echo "Obfuscated JAR: $JAR_PATH"
          echo "JAR_PATH=$JAR_PATH" >> "$GITHUB_ENV"
          cd src/main/resources
          case "$AXS_RUNTIME_TARGET" in
            universal) native_files=(native/axs-native.enc native/libaxs-native.enc) ;;
            windows-x86_64) native_files=(native/axs-native.enc) ;;
            linux-x86_64) native_files=(native/libaxs-native.enc) ;;
            *) echo "ERROR: unsupported runtime target"; exit 1 ;;
          esac
          jar uf "$JAR_PATH" "${native_files[@]}"
          cd - > /dev/null

      - name: Encrypt core classes
        run: |
          set -euo pipefail
          OUT="${JAR_PATH%.jar}-encrypted.jar"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          BASE_VERSION=$(sed -n 's/^version=//p' gradle.properties | head -n 1 | tr -d '\r')
          # Successful matrix jobs can be reused by a later attempt of this run.
          SUITE_RELEASE="${BASE_VERSION}-suite.${GITHUB_RUN_ID}.1-ci.${GITHUB_SHA:0:7}"
          if [[ "$AXS_EXPORT_ONLY" == true ]]; then
            SUITE_RELEASE=$(python scripts/export-customer-release.py release --commit "$GITHUB_SHA")
          fi
          python scripts/encrypt-jar.py \
            --input "$JAR_PATH" \
            --output "$OUT" \
            --native-dir src/main/resources/native \
            --keys-dir "$KEYS_DIR" \
            --protection-level high \
            --no-native \
            --build-commit "$GITHUB_SHA" \
            --build-release "$SUITE_RELEASE" \
            --fake-classes-count 20
          ls -la "$OUT"

      - name: Verify release protection
        run: |
          python scripts/verify-protection.py --input "$OUT" --keys-dir "$KEYS_DIR" --strict --verbose

      - name: Verify signed runtime catalog and public artifacts
        run: |
          python scripts/verify-runtime.py --input "$OUT" \
            --libraries "axs-core/build/runtime/$AXS_RUNTIME_TARGET/runtime-libraries" \
            --public-key "$KEYS_DIR/ed25519_public.pem"

      - name: Verify host edition
        run: |
          set -euo pipefail
          shopt -s nullglob
          raw=("$CORE_LIB_DIR"/ArcartX-Suite-*-unobf*.jar)
          test "${#raw[@]}" -eq 1
          python scripts/verify-suite-edition.py --edition "$AXS_EDITION" host --raw "${raw[0]}" --protected "$OUT"

      - name: Upload encrypted JAR
        uses: actions/upload-artifact@v5
        with:
          name: ${{ env.CORE_ARTIFACT_NAME }}
          path: ${{ env.CORE_LIB_DIR }}/*-encrypted.jar
          overwrite: true
          if-no-files-found: error

      - name: Upload ProGuard mapping (core)
        if: env.AXS_EXPORT_ONLY != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: axs-core-proguard-mapping-${{ matrix.runtime_target }}
          path: ${{ env.CORE_LIB_DIR }}/*-proguard-mapping.txt
          overwrite: true
          if-no-files-found: warn
          retention-days: 1

      - name: Upload runtime library artifacts
        uses: actions/upload-artifact@v5
        with:
          name: axs-runtime-libraries-${{ matrix.runtime_target }}
          path: axs-core/build/runtime/${{ matrix.runtime_target }}/runtime-libraries/*.jar
          overwrite: true
          if-no-files-found: error

  build-proxy:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.proxy_changed == 'true'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v6

      - name: Build proxy JARs
        run: bash ./gradlew :proxy:bungee:shadowJar :proxy:velocity:shadowJar --no-build-cache --parallel

      - name: Export proxy JARs
        if: env.AXS_EXPORT_ONLY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: axs-customer-proxy-attempt-${{ github.run_attempt }}
          path: |
            proxy/bungee/build/libs/ArcartXSuite-Proxy-Bungee-*.jar
            proxy/velocity/build/libs/ArcartXSuite-Proxy-Velocity-*.jar
          if-no-files-found: error

      - name: Upload proxy JARs to cloud
        if: env.AXS_CLOUD_UPLOAD == 'true'
        env:
          CLOUD_CI_TOKEN: ${{ secrets.CLOUD_CI_TOKEN }}
          CLOUD_BASE_URL: https://cloud.021209.xyz
          FLARE_BASE_URL: ${{ vars.FLARE_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_CI_TOKEN:-}" ]; then
            echo "SKIP: CLOUD_CI_TOKEN 未配置，跳过 proxy jar 上传"
            exit 0
          fi
          BASEVER=$(grep -E '^version=' gradle.properties | head -n1 | cut -d= -f2 | tr -d '[:space:]')
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          VERSION="${BASEVER}-ci.${SHORT_SHA}"
          upload_one() {
            FLAVOR="$1"
            GLOB="$2"
            JAR=$(ls -1 $GLOB 2>/dev/null | sort | tail -1 || true)
            if [ -z "$JAR" ] || [ ! -f "$JAR" ]; then
              echo "ERROR: 未找到 $FLAVOR proxy jar"; exit 1
            fi
            echo "Uploading proxy/$FLAVOR version=$VERSION"
            FLARE_BASE_URL="${FLARE_BASE_URL:-https://flare.021209.xyz}"
            PRIMARY_OK=0
            FLARE_OK=0
            # ── 主云 ──
            RESP=$(mktemp)
            set +e
            curl -fS --http1.1 --connect-timeout 10 --retry 3 --retry-delay 3 --retry-all-errors --retry-max-time 90 --max-time 120 \
              -o "$RESP" \
              -X POST \
              -F "jar=@$JAR" \
              -F "version=$VERSION" \
              -F "releaseNotes=CI build ${{ github.sha }}" \
              -F "setCurrent=true" \
              -H "X-CI-Token: $CLOUD_CI_TOKEN" \
              "$CLOUD_BASE_URL/v1/ci/proxy-jar/$FLAVOR/versions"
            CURL_EXIT=$?
            set -e
            if [ $CURL_EXIT -eq 0 ]; then
              PRIMARY_OK=1
              cat "$RESP"
              echo "OK: proxy/$FLAVOR 已上传主云"
            else
              echo "WARN: 主云 proxy/$FLAVOR 上传失败 (curl exit=$CURL_EXIT)"
              cat "$RESP" || true
            fi
            rm -f "$RESP"
            if [ "$PRIMARY_OK" -eq 1 ]; then
              echo "主云已接收 proxy/$FLAVOR，FlareCloud 由主云复制任务同步"
              return 0
            fi
            # 主云上传失败时才尝试直接写入处于接管状态的 FlareCloud。
            RESP_FLARE=$(mktemp)
            set +e
            curl -fS --http1.1 --retry 5 --retry-delay 5 --retry-all-errors --retry-max-time 300 --max-time 300 \
              -o "$RESP_FLARE" \
              -X POST \
              -F "jar=@$JAR" \
              -F "version=$VERSION" \
              -F "releaseNotes=CI build ${{ github.sha }}" \
              -F "setCurrent=true" \
              -H "X-CI-Token: $CLOUD_CI_TOKEN" \
              "${FLARE_BASE_URL}/v1/ci/proxy-jar/$FLAVOR/versions"
            FLARE_EXIT=$?
            set -e
            if [ $FLARE_EXIT -eq 0 ]; then
              FLARE_OK=1
              echo "OK: proxy/$FLAVOR 已镜像到 FlareCloud"
            else
              echo "WARN: FlareCloud proxy/$FLAVOR 镜像失败 (exit=$FLARE_EXIT)"
              cat "$RESP_FLARE" || true
            fi
            rm -f "$RESP_FLARE"
            if [ $PRIMARY_OK -eq 0 ] && [ $FLARE_OK -eq 0 ]; then
              echo "ERROR: proxy/$FLAVOR 主云与 FlareCloud 均上传失败"
              exit 1
            fi
            echo "DONE: proxy/$FLAVOR (primary=$PRIMARY_OK flare=$FLARE_OK)"
          }
          upload_one bungee "proxy/bungee/build/libs/ArcartXSuite-Proxy-Bungee-*.jar"
          upload_one velocity "proxy/velocity/build/libs/ArcartXSuite-Proxy-Velocity-*.jar"
          printf '%s\n' "$GITHUB_SHA" > proxy-published.txt

      - name: Record proxy publication
        if: env.AXS_CLOUD_UPLOAD == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: suite-proxy-published
          path: proxy-published.txt
          overwrite: true
          if-no-files-found: error

  build-modules:
    runs-on: ubuntu-latest
    needs: detect-changes
    if: needs.detect-changes.outputs.module_changed == 'true'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: temurin
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install cryptography
        run: pip install cryptography
      - uses: gradle/actions/setup-gradle@v6

      - name: Prepare watermark key
        if: env.AXS_EXPORT_ONLY == 'true'
        env:
          WATERMARK_PRIVATE_PEM: ${{ secrets.AXS_WATERMARK_PRIVATE_PEM }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$WATERMARK_PRIVATE_PEM"
          printf '%s\n' "$WATERMARK_PRIVATE_PEM" > "$RUNNER_TEMP/axs-watermark.pem"

      - name: Encrypt changed modules per-class (-Paxs.protectModules)
        env:
          RELEASE_MODULES: ${{ needs.detect-changes.outputs.changed_modules }}
          EXPORT_RECIPIENT: ${{ inputs.export_recipient }}
          EXPORT_DELIVERY_ID: ${{ needs.detect-changes.outputs.export_delivery_id }}
          # This build's core is ProGuard input only. The published host has its own signed catalog.
          AXS_PRODUCTION: 'OFF'
        run: |
          set -euo pipefail
          TASKS=()
          for module in $(jq -r '.[]' <<< "$RELEASE_MODULES"); do
            TASKS+=(":modules:$module:encryptModuleAxb")
          done
          if (( ${#TASKS[@]} == 0 )); then
            echo "没有需要构建的模块"; exit 1
          fi
          printf 'Gradle task: %s\n' "${TASKS[@]}"
          # -Paxs.protectModules 使用各模块独立的 moduleKey 加密类和 .axb 容器。
          watermark=()
          if [[ "$AXS_EXPORT_ONLY" == true ]]; then
            release=$(python scripts/export-customer-release.py release --commit "$GITHUB_SHA")
            watermark=("-Paxs.watermark.recipient=$EXPORT_RECIPIENT" "-Paxs.watermark.license=$EXPORT_DELIVERY_ID"
              "-Paxs.watermark.release=$release" "-Paxs.watermark.privateKey=$RUNNER_TEMP/axs-watermark.pem")
          fi
          bash ./gradlew "${TASKS[@]}" "${watermark[@]}" -Paxs.edition="$AXS_EDITION" -Paxs.protectModules -PskipNativeCheck=true --no-build-cache --parallel
          echo "=== 生成的 .axb ==="
          ls -la build/ArcartX-Suite/module-axb/ || echo "DIR NOT FOUND"

      - name: Verify protected Abyss journal schema
        if: contains(fromJSON(needs.detect-changes.outputs.changed_modules), 'abyss')
        run: python3 modules/abyss/src/test/protection/verify_journal_mapping.py

      - name: Verify protected Exploration classes
        if: contains(fromJSON(needs.detect-changes.outputs.changed_modules), 'exploration')
        run: python3 modules/exploration/src/test/protection/verify_protected_classes.py

      - name: Verify module editions
        env:
          RELEASE_MODULES: ${{ needs.detect-changes.outputs.changed_modules }}
        run: python3 scripts/verify-suite-edition.py --edition "$AXS_EDITION" modules --selection "$RELEASE_MODULES"

      - name: Seal module inputs
        if: needs.detect-changes.outputs.assemble_release == 'true'
        env:
          RELEASE_MODULES: ${{ needs.detect-changes.outputs.changed_modules }}
          AXS_MODULE_STAGE_SECRET: ${{ secrets[inputs.export_only && 'AXS_VARIANT_REGISTRATION_KEY_B64' || 'CLOUD_CI_TOKEN'] }}
        run: python scripts/suite-module-stage.py seal

      - name: Save sealed module inputs
        if: needs.detect-changes.outputs.assemble_release == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: suite-module-stage
          path: suite-module-stage/
          compression-level: 0
          overwrite: true
          if-no-files-found: error

      - name: Upload ProGuard mappings (modules)
        if: env.AXS_EXPORT_ONLY != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: axs-modules-proguard-mapping
          path: build/ArcartX-Suite/modules-obf/*-proguard-mapping.txt
          overwrite: true
          if-no-files-found: warn
          retention-days: 1

  publish-suite:
    runs-on: ubuntu-latest
    needs: [detect-changes, build-encrypted, build-modules]
    if: needs.detect-changes.outputs.assemble_release == 'true'
    steps:
      - uses: actions/checkout@v5

      - name: Restore Suite release inputs
        id: staged-release
        if: env.AXS_CLOUD_UPLOAD == 'true' && github.run_attempt != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for artifact in suite-activation suite-staging; do
            count=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?name=$artifact" --jq '.total_count')
            if [ "$count" = "0" ]; then continue; fi
            if [ "$count" != "1" ]; then
              echo "Expected exactly one $artifact artifact"
              exit 1
            fi
            gh run download "$GITHUB_RUN_ID" --name "$artifact" --dir suite-release
            if [ "$artifact" = "suite-activation" ]; then
              test -s suite-release/activation.json
              echo "restored=true" >> "$GITHUB_OUTPUT"
            else
              test -s suite-release/staging.enc
              echo "prepared=true" >> "$GITHUB_OUTPUT"
            fi
            break
          done

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install cryptography
        if: steps.staged-release.outputs.restored != 'true'
        run: pip install cryptography

      - uses: actions/download-artifact@v5
        if: steps.staged-release.outputs.restored != 'true' && steps.staged-release.outputs.prepared != 'true'
        with:
          name: suite-module-stage
          path: suite-module-stage

      - name: Restore verified module inputs
        if: steps.staged-release.outputs.restored != 'true' && steps.staged-release.outputs.prepared != 'true'
        env:
          RELEASE_MODULES: ${{ needs.detect-changes.outputs.changed_modules }}
          AXS_MODULE_STAGE_SECRET: ${{ secrets[inputs.export_only && 'AXS_VARIANT_REGISTRATION_KEY_B64' || 'CLOUD_CI_TOKEN'] }}
        run: python scripts/suite-module-stage.py open

      - uses: actions/download-artifact@v5
        if: (env.AXS_CLOUD_UPLOAD == 'true' || env.AXS_EXPORT_ONLY == 'true') && steps.staged-release.outputs.restored != 'true' && steps.staged-release.outputs.prepared != 'true'
        with:
          pattern: axs-jar-encrypted-*
          path: suite-release/hosts

      - uses: actions/download-artifact@v5
        if: (env.AXS_CLOUD_UPLOAD == 'true' || env.AXS_EXPORT_ONLY == 'true') && steps.staged-release.outputs.restored != 'true' && steps.staged-release.outputs.prepared != 'true'
        with:
          pattern: axs-runtime-libraries-*
          path: suite-release/libraries
          merge-multiple: ${{ env.AXS_EXPORT_ONLY != 'true' }}

      - name: Assemble signed customer export
        if: env.AXS_EXPORT_ONLY == 'true'
        env:
          AXS_EXPORT_ACCOUNT: ${{ inputs.export_account }}
          AXS_EXPORT_RECIPIENT: ${{ inputs.export_recipient }}
          AXS_EXPORT_DELIVERY_ID: ${{ needs.detect-changes.outputs.export_delivery_id }}
          AXB_SIGN_SEED_B64: ${{ secrets.AXB_SIGN_SEED_B64 }}
          AXS_VARIANT_REGISTRATION_KEY_B64: ${{ secrets.AXS_VARIANT_REGISTRATION_KEY_B64 }}
          WATERMARK_PRIVATE_PEM: ${{ secrets.AXS_WATERMARK_PRIVATE_PEM }}
          EXPORT_MODULES: ${{ needs.detect-changes.outputs.changed_modules }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$WATERMARK_PRIVATE_PEM"
          watermark_key=$(mktemp "$RUNNER_TEMP/axs-watermark.XXXXXX")
          trap 'rm -f -- "$watermark_key"' EXIT
          printf '%s\n' "$WATERMARK_PRIVATE_PEM" > "$watermark_key"
          unset WATERMARK_PRIVATE_PEM
          python scripts/export-customer-release.py export --commit "$GITHUB_SHA" --modules "$EXPORT_MODULES" \
            --watermark-key "$watermark_key" --output customer-export

      - name: Export customer installers
        if: env.AXS_EXPORT_ONLY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: axs-customer-installers-attempt-${{ github.run_attempt }}
          path: customer-export/ArcartX-Suite-*.zip
          compression-level: 0
          if-no-files-found: error

      - name: Export encrypted registration metadata
        if: env.AXS_EXPORT_ONLY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: axs-customer-registration-attempt-${{ github.run_attempt }}
          path: customer-export/register-module-variants.json
          if-no-files-found: error

      - name: Prepare immutable Suite release inputs
        if: env.AXS_CLOUD_UPLOAD == 'true' && steps.staged-release.outputs.restored != 'true' && steps.staged-release.outputs.prepared != 'true'
        env:
          CLOUD_CI_TOKEN: ${{ secrets.CLOUD_CI_TOKEN }}
          FLARE_BASE_URL: ${{ vars.FLARE_BASE_URL }}
          CHANGED_MODULES: ${{ needs.detect-changes.outputs.changed_modules }}
        run: python scripts/publish-suite.py prepare

      - name: Save Suite staging inputs
        if: env.AXS_CLOUD_UPLOAD == 'true' && steps.staged-release.outputs.restored != 'true' && steps.staged-release.outputs.prepared != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: suite-staging
          path: |
            suite-release/hosts/
            suite-release/libraries/
            suite-release/modules/
            suite-release/staging.enc
          compression-level: 0
          if-no-files-found: error

      - name: Stage the Suite release
        if: env.AXS_CLOUD_UPLOAD == 'true' && steps.staged-release.outputs.restored != 'true'
        env:
          CLOUD_CI_TOKEN: ${{ secrets.CLOUD_CI_TOKEN }}
          FLARE_BASE_URL: ${{ vars.FLARE_BASE_URL }}
          CHANGED_MODULES: ${{ needs.detect-changes.outputs.changed_modules }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_CI_TOKEN:-}" ]; then
            echo "ERROR: CLOUD_CI_TOKEN 未配置"
            exit 1
          fi
          python scripts/publish-suite.py stage

      - name: Save Suite activation manifest
        if: env.AXS_CLOUD_UPLOAD == 'true' && steps.staged-release.outputs.restored != 'true'
        uses: actions/upload-artifact@v5
        with:
          name: suite-activation
          path: suite-release/activation.json
          if-no-files-found: error

      - name: Activate the staged Suite release
        if: env.AXS_CLOUD_UPLOAD == 'true'
        env:
          CLOUD_CI_TOKEN: ${{ secrets.CLOUD_CI_TOKEN }}
          FLARE_BASE_URL: ${{ vars.FLARE_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUD_CI_TOKEN:-}" ]; then
            echo "ERROR: CLOUD_CI_TOKEN 未配置"
            exit 1
          fi
          python scripts/publish-suite.py activate

      - name: Record Suite publication
        if: env.AXS_CLOUD_UPLOAD == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: suite-published
          path: suite-release/activation.json
          overwrite: true
          if-no-files-found: error

      - name: Queue the Suite release announcement
        if: env.AXS_CLOUD_UPLOAD == 'true' && !inputs.skip_announcement
        env:
          CLOUD_CI_TOKEN: ${{ secrets.CLOUD_CI_TOKEN }}
          FLARE_BASE_URL: ${{ vars.FLARE_BASE_URL }}
        run: python scripts/publish-suite.py announce

      - name: Verify the active Suite release without an announcement
        if: env.AXS_CLOUD_UPLOAD == 'true' && inputs.skip_announcement
        env:
          CLOUD_CI_TOKEN: ${{ secrets.CLOUD_CI_TOKEN }}
          FLARE_BASE_URL: ${{ vars.FLARE_BASE_URL }}
        run: python scripts/publish-suite.py verify

  customer-delivery:
    name: Package customer delivery
    runs-on: ubuntu-latest
    needs: [publish-suite, build-proxy]
    if: >-
      ${{ github.event_name == 'workflow_dispatch' && inputs.export_only
          && needs.publish-suite.result == 'success' && needs.build-proxy.result == 'success' }}
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Prepare the administrator delivery
        id: delivery
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/customer-delivery-artifacts.py prepare --output customer-delivery

      - name: Upload customer delivery
        if: steps.delivery.outputs.needs_upload == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: ${{ steps.delivery.outputs.artifact_name }}
          path: customer-delivery/
          compression-level: 0
          if-no-files-found: error

      - name: Remove intermediate artifacts after upload
        env:
          GH_TOKEN: ${{ github.token }}
          CUSTOMER_DELIVERY: ${{ steps.delivery.outputs.artifact_name }}
        run: python scripts/customer-delivery-artifacts.py cleanup --delivery "$CUSTOMER_DELIVERY"
