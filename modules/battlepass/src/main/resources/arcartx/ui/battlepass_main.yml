# AXS BattlePass 主界面
# 打开方式: /bp open 或 Packet 触发
# 数据交互: packetHandler init/update/rewards
# 重制: 扩大面板至 1200x720，参考 lottery/market/warehouse 风格，分层面板 + 进度条 + 奖励列表

ui:
  isHud: false
  background: true
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 界面初始化时接收服务端数据包，将包字段写入 UI 变量
    # 包字段:
    #   - packetId: 包标识符，用于后续 Packet.send 回传
    #   - seasonName: 当前赛季名称
    #   - currentLevel: 玩家当前战令等级
    #   - maxLevel: 赛季最大等级
    #   - currentXp: 当前等级已获得经验值
    #   - xpPerLevel: 每级所需经验值
    #   - xpNeeded: 升级还需经验值
    #   - premiumUnlocked: 是否已解锁高级版（premium）
    #   - deluxeUnlocked: 是否已解锁豪华版（deluxe）
    #   - tier: 当前档位标识（FREE / PREMIUM / DELUXE）
    #   - tierDisplay: 档位显示文本（含颜色代码）
    #   - progressRatio: 当前等级进度比例（0~1）
    init: |-
      var.packetId = packet['packetId']
      var.seasonName = packet['seasonName']
      var.currentLevel = packet['currentLevel']
      var.maxLevel = packet['maxLevel']
      var.currentXp = packet['currentXp']
      var.xpPerLevel = packet['xpPerLevel']
      var.xpNeeded = packet['xpNeeded']
      var.premiumUnlocked = packet['premiumUnlocked']
      var.deluxeUnlocked = packet['deluxeUnlocked']
      var.tier = packet['tier']
      var.tierDisplay = packet['tierDisplay']
      var.progressRatio = packet['progressRatio']
    # packetHandler: update
    # 数据更新时接收服务端数据包，刷新 UI 变量（字段与 init 相同）
    update: |-
      var.packetId = packet['packetId']
      var.seasonName = packet['seasonName']
      var.currentLevel = packet['currentLevel']
      var.maxLevel = packet['maxLevel']
      var.currentXp = packet['currentXp']
      var.xpPerLevel = packet['xpPerLevel']
      var.xpNeeded = packet['xpNeeded']
      var.premiumUnlocked = packet['premiumUnlocked']
      var.deluxeUnlocked = packet['deluxeUnlocked']
      var.tier = packet['tier']
      var.tierDisplay = packet['tierDisplay']
      var.progressRatio = packet['progressRatio']
    # packetHandler: rewards
    # 接收奖励列表数据包，动态生成奖励列表子元素
    # 包字段:
    #   - packetId: 包标识符
    #   - rewards: 奖励数据映射（key 为序号，含 level/tier/tierDisplay/claimed/claimable/locked/levelReached 等字段）
    #   - rewardCount: 奖励条目总数
    #   - currentLevel: 玩家当前战令等级
    #   - action_token: 操作令牌，用于领取奖励时防伪造验证
    rewards: |-
      var.packetId = packet['packetId']
      var.rewards = packet['rewards']
      var.rewardCount = packet['rewardCount']
      var.currentLevel = packet['currentLevel']
      var.actionToken = packet['action_token']
      var.showRewards = true
      while(val.奖励列表.childrenCount() > 1){
        val.奖励列表.get(1).remove()
      }
      // range(a,b) 左闭右闭，生成 a~b 含两端；模板在索引0，故复制 1~count-1 共 count-1 项
      for(i in range(1, var.rewardCount - 1)){
        key = i.round()
        e = val.奖励列表['奖励项'].copy('奖励项' + key)
        e.entryKey = key
      }
  action:
    load: |-
      var.packetId = 'AXS_BATTLEPASS'
      var.seasonName = '等待同步'
      var.currentLevel = 0
      var.maxLevel = 0
      var.currentXp = 0
      var.xpPerLevel = 1000
      var.xpNeeded = 1000
      var.premiumUnlocked = false
      var.deluxeUnlocked = false
      var.tier = 'FREE'
      var.tierDisplay = '&7免费'
      var.progressRatio = 0
      var.rewards = {}
      var.rewardCount = 0
      var.showRewards = false
      var.actionToken = ''
    open: |-
      Packet.send(var.packetId, 'refresh')

# ─── 控件树 ────────────────────────────────────────────────────────
