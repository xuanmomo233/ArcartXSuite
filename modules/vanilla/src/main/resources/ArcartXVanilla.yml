# ArcartXSuite Vanilla - 原版界面替换模块配置
# 替换工作台、熔炼类、切石机、锻造台、酿造台、交易、铁砧与附魔台界面。
# 重载: /axs reload vanilla

# 配置版本号（请勿手动修改）
config-version: 3

# UI 配置（统一管理所有界面的 id 与覆盖策略）
ui:
  # 工作台 UI id（与 vanilla_crafting.yml 文件名对应）
  crafting-ui-id: "AXS:vanilla_crafting"
  # 熔炉 UI id（与 vanilla_furnace.yml 文件名对应）
  furnace-ui-id: "AXS:vanilla_furnace"
  blast-furnace-ui-id: "AXS:vanilla_blast_furnace"
  smoker-ui-id: "AXS:vanilla_smoker"
  stonecutter-ui-id: "AXS:vanilla_stonecutter"
  smithing-ui-id: "AXS:vanilla_smithing"
  brewing-ui-id: "AXS:vanilla_brewing"
  merchant-ui-id: "AXS:vanilla_merchant"
  anvil-ui-id: "AXS:vanilla_anvil"
  enchanting-ui-id: "AXS:vanilla_enchanting"
  grindstone-ui-id: "AXS:vanilla_grindstone"
  loom-ui-id: "AXS:vanilla_loom"
  cartography-ui-id: "AXS:vanilla_cartography"
  beacon-ui-id: "AXS:vanilla_beacon"
  hopper-ui-id: "AXS:vanilla_hopper"
  dispenser-ui-id: "AXS:vanilla_dispenser"
  container-ui-id: "AXS:vanilla_container"
  shulker-box-ui-id: "AXS:vanilla_shulker_box"
  # 是否覆盖已修改的 UI 文件
  overwrite-ui-files: false

# 工作台界面替换
crafting:
  # 是否启用工作台 UI 替换
  enabled: true
# 熔炉界面替换
furnace:
  # 是否启用熔炉 UI 替换
  enabled: true
  # 熔炉状态推送间隔（tick），每秒 20 tick，默认 2 tick（每秒 10 次）
  push-interval-ticks: 2
blast-furnace:
  enabled: true
  push-interval-ticks: 2
smoker:
  enabled: true
  push-interval-ticks: 2
stonecutter:
  enabled: true
smithing:
  enabled: true
brewing:
  enabled: true
  push-interval-ticks: 2
merchant:
  enabled: true
anvil:
  enabled: true
  push-interval-ticks: 2
enchanting:
  enabled: true
  push-interval-ticks: 2
grindstone:
  enabled: true
  push-interval-ticks: 2
loom:
  enabled: true
  push-interval-ticks: 2
cartography:
  enabled: true
  push-interval-ticks: 2
beacon:
  enabled: true
  push-interval-ticks: 2
hopper:
  enabled: true
  push-interval-ticks: 2
# 发射器与投掷器在客户端共用同一种界面，由服务端识别实际容器。
dispenser:
  enabled: true
  push-interval-ticks: 2
# 普通容器界面共用模板，按实际 1～6 行布局；包含箱子、木桶与末影箱。
container:
  enabled: true
  push-interval-ticks: 2
shulker-box:
  enabled: true
  push-interval-ticks: 2

# 随身背包独立启用，仓库物品、容量与分类由 Warehouse 管理。
backpack:
  enabled: false
  ui:
    register-ui-on-enable: true
    overwrite-ui-files: false
  # ArcartX 的额外槽位不支持 MMOItems 的属性识别，需要外部辅助。
  # 设置参与 MMOItems 装备属性结算的 AX 饰品槽 ID，留空关闭。需要 MMOItems 和 MythicLib。
  # 示例：[accessory_1, accessory_2, accessory_3]。填写额外槽位的实际 ID，区分大小写。
  mmoitems-attribute-slots: []
  presentation:
    # 开启背包转场及已配置的角色动作。
    enabled: false
    transition-ms: 220 # 面板与镜头转场时长（毫秒），0 关闭转场。
    blend-ms: 100 # 角色动作之间的混合时长（毫秒），0 直接切换。
    # 动作名来自玩家当前的 ArcartX 动作包，保留原有大小写。
    open: # 开包时播放一次。
      animation: '' # 留空跳过入场动作。
      duration-ms: 450 # 入场动作播放时长（毫秒），到时进入待机阶段。
    idle: # 两次动作之间的循环待机。
      animation: '' # 留空沿用普通待机，填写时资源需设置为循环。
    random:
      min-interval-ms: 6000 # 进入待机后，到下一次随机动作的最短等待（毫秒）。
      max-interval-ms: 12000 # 最长等待（毫秒），小于最短等待时按最短等待处理。
      # 动作池留空时跳过随机播放。每个子项的键名由服主自定。
      # animation 是动作名，留空忽略该项。duration-ms 是播放时长（毫秒）。
      # weight 是相对抽取权重，默认 1，设为 0 忽略该项。
      actions: {}
# 随身背包与箱柜的整理方式：type（按类型）、name（按材质名称）、amount（按堆叠数量）。
inventory-sort:
  mode: type

# 自定义原版配方，定义保存于 data/vanilla/recipes.yml。
recipes:
  enabled: true
