# AXS Warehouse Manage
# 纯色块风格仓库管理界面：共享仓库删除和成员管理。

ui:
  isHud: false
  defaultOpen: false
  hide: []
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 包标识符（'AXS_WAREHOUSE'）
    #   - action_token: 操作令牌（防重放）
    #   - ownerType: 仓库所有者类型（personal / shared）
    #   - ownerId: 所有者 ID
    #   - warehouseId: 仓库 ID
    #   - warehouseName: 仓库名称
    #   - personalWarehouses: 个人仓库列表
    #   - personalWarehouseTexts: 个人仓库显示文本
    #   - manageWarehouses: 可管理的仓库列表
    #   - manageWarehouseTexts: 可管理仓库显示文本
    #   - manageWarehouseTypes: 可管理仓库类型
    #   - manageWarehouseTargets: 可管理仓库目标
    #   - manageWarehouseSelected: 当前选中的管理仓库索引
    #   - sharedWarehouses: 共享仓库列表
    #   - sharedWarehouseManageTexts: 共享仓库管理显示文本
    #   - sharedCreateCostText: 创建共享仓库费用文本
    #   - sharedRoleOwnerName: 共享仓库所有者角色名
    #   - sharedRoleMemberName: 共享仓库成员角色名
    #   - sharedRoleViewerName: 共享仓库观众角色名
    #   - sharedMembers: 共享仓库成员列表
    #   - sharedMemberTexts: 成员显示文本
    #   - sharedMemberNames: 成员名称列表
    #   - sharedMemberRoles: 成员角色列表
    #   - unlocked: 二级密码是否已解锁
    #   - hasPassword: 是否已设置二级密码
    #   - readOnly: 是否只读模式
    #   - lockOwner: 编辑锁持有者
    #   - capacityText: 容量显示文本
    #   - level: 仓库等级
    #   - canUpgrade: 是否可升级
    #   - nextUpgradeText: 下一级升级信息文本
    #   - autoPickup: 是否启用自动拾取
    #   - autoPickupMythic: 是否自动拾取 MythicMobs 掉落
    #   - autoPickupNotify: 是否通知自动拾取
    #   - showcaseEnabled: 是否启用展示柜
    #   - maxManageCount: 可管理仓库最大数量（用于动态创建控件）
    #   - maxMemberCount: 成员最大数量
    update: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.manageWarehouses = packet['manageWarehouses']
      var.manageWarehouseTexts = packet['manageWarehouseTexts']
      var.manageWarehouseTypes = packet['manageWarehouseTypes']
      var.manageWarehouseTargets = packet['manageWarehouseTargets']
      var.manageWarehouseSelected = packet['manageWarehouseSelected']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseManageTexts = packet['sharedWarehouseManageTexts']
      var.sharedCreateCostText = packet['sharedCreateCostText']
      var.sharedRoleOwnerName = packet['sharedRoleOwnerName']
      var.sharedRoleMemberName = packet['sharedRoleMemberName']
      var.sharedRoleViewerName = packet['sharedRoleViewerName']
      var.sharedMembers = packet['sharedMembers']
      var.sharedMemberTexts = packet['sharedMemberTexts']
      var.sharedMemberNames = packet['sharedMemberNames']
      var.sharedMemberRoles = packet['sharedMemberRoles']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.lockOwner = packet['lockOwner']
      var.capacityText = packet['capacityText']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.autoPickup = packet['autoPickup']
      var.autoPickupMythic = packet['autoPickupMythic']
      var.autoPickupNotify = packet['autoPickupNotify']
      var.showcaseEnabled = packet['showcaseEnabled']
      var.maxManageCount = packet['maxManageCount']
      var.maxMemberCount = packet['maxMemberCount']
      共享数 = var.maxManageCount.round()
      现有共享数 = val.共享列表.childrenCount() - 1
      if(现有共享数 != 共享数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.共享列表.childrenCount() > 1){
          val.共享列表.get(1).remove()
        }
        if(共享数 > 1){
          for(序号 in range(1, 共享数 - 1)){
            项 = val.共享列表['项'].copy('共享项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      成员数 = var.maxMemberCount.round()
      现有成员数 = val.成员列表.childrenCount() - 1
      if(现有成员数 != 成员数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.成员列表.childrenCount() > 1){
          val.成员列表.get(1).remove()
        }
        if(成员数 > 1){
          for(序号 in range(1, 成员数 - 1)){
            项 = val.成员列表['项'].copy('成员项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
  action:
    load: |-
      var.packetId = 'AXS_WAREHOUSE'
      var.ownerType = 'personal'
      var.ownerId = none
      var.warehouseId = none
      var.warehouseName = 'AXS 仓库'
      var.personalWarehouses = {}
      var.personalWarehouseTexts = {}
      var.manageWarehouses = {}
      var.manageWarehouseTexts = {}
      var.manageWarehouseTypes = {}
      var.manageWarehouseTargets = {}
      var.manageWarehouseSelected = {}
      var.sharedWarehouses = {}
      var.sharedWarehouseManageTexts = {}
      var.sharedCreateCostText = '创建共享仓库免费'
      var.sharedRoleOwnerName = '所有者'
      var.sharedRoleMemberName = '成员'
      var.sharedRoleViewerName = '观众'
      var.sharedMembers = {}
      var.sharedMemberTexts = {}
      var.sharedMemberNames = {}
      var.sharedMemberRoles = {}
      var.unlocked = false
      var.hasPassword = false
      var.readOnly = false
      var.lockOwner = none
      var.capacityText = '0/0'
      var.level = 1
      var.canUpgrade = false
      var.nextUpgradeText = none
      var.sharedName = none
      var.renameName = none
      var.memberName = none
      var.memberRole = 'member'
      var.passwordText = none
      var.actionToken = ''
      var.deleteConfirm = false
      var.deletePassword = none
      var.sharedListScrollRatio = 0
      var.showcaseEnabled = true
      var.autoPickup = true
      var.autoPickupMythic = true
      var.autoPickupNotify = true
      var.maxManageCount = 0
      var.maxMemberCount = 0
      var.刷新轮次 = 0
    open: |-
      Packet.send(var.packetId, 'refresh')

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1660
          height: 1030
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: "~95,95,95,220"
              shape: ~round_rect
              radius: 28
            effect:
              stroke:
                width: 3
                color: ~255,255,255,255
              shadow:
                xOffset: 2
                yOffset: 2
                blur: 5
                color: ~255,255,255,75
              ripple:
                duration: 1200
                color: ~255,255,255,110
                width: 0.05
          标题:
            type: Text
            attribute:
              x: 42
              y: 30
              texts: "~&f仓库管理"
              fontSize: 100
          当前仓库:
            type: Text
            attribute:
              x: 42
              y: 120
              width: 720
              texts: "'&f仓库名称: ' + var.warehouseName + '  &f仓库类型:' + (var.ownerType == 'shared' ? '  &b共享' : '  &a个人')"
              fontSize: 49
          返回仓库:
            type: Canvas
            attribute:
              x: 1335
              y: 42
              width: 68
              height: 42
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'storage')
            children:
              返回仓库背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,255,255,150
                  hover: ~Frosted:0;255,255,255,240
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 2
                    color: ~0,0,0,255
              返回仓库文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 68
                  texts: "~&0仓库"
                  fontSize: 42
                  through: true
          银行:
            type: Canvas
            attribute:
              x: 1435
              y: 42
              width: 68
              height: 42
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'bank')
            children:
              银行背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,255,255,150
                  hover: ~Frosted:0;255,255,255,240
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 2
                    color: ~0,0,0,255
              银行文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 68
                  texts: "~&0银行"
                  fontSize: 42
                  through: true

          自动拾取卡片:
            type: Canvas
            attribute:
              x: 500
              y: 112
              width: 700
              height: 72
            children:
              自动拾取卡片背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~120,120,120,200
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 2
                    color: ~0,0,0,255
              拾取标题:
                type: Text
                attribute:
                  x: 24
                  y: 20
                  texts: "~&f自动拾取"
                  fontSize: 60
              自动入库:
                type: Canvas
                attribute:
                  x: 200
                  y: 14
                  width: 140
                  height: 42
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'toggle_auto_pickup', var.actionToken)
                children:
                  自动入库背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.autoPickup ? '100,185,120,255' : '160,160,165,255'"
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  自动入库文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 140
                      texts: "var.autoPickup ? '&0自动入库 开' : '&0自动入库 关'"
                      fontSize: 30
                      through: true
              怪物战利品:
                type: Canvas
                attribute:
                  x: 360
                  y: 14
                  width: 170
                  height: 42
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'toggle_auto_mythic', var.actionToken)
                children:
                  怪物战利品背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.autoPickupMythic ? '100,185,120,255' : '160,160,165,255'"
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  怪物战利品文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 170
                      texts: "var.autoPickupMythic ? '&0怪物战利品 开' : '&0怪物战利品 关'"
                      fontSize: 30
                      through: true
              入库通知:
                type: Canvas
                attribute:
                  x: 550
                  y: 14
                  width: 130
                  height: 42
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'toggle_auto_notify', var.actionToken)
                children:
                  入库通知背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.autoPickupNotify ? '100,185,120,255' : '160,160,165,255'"
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  入库通知文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 130
                      texts: "var.autoPickupNotify ? '&0入库通知 开' : '&0入库通知 关'"
                      fontSize: 30
                      through: true

          仓库列表卡片:
            type: Texture
            attribute:
              x: 42
              y: 210
              width: 420
              height: 770
              normal: ~120,120,120,200
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
            children:
              共享标题:
                type: Text
                attribute:
                  x: 24
                  y: 22
                  texts: "~&f仓库列表"
                  fontSize: 44
              新建名:
                type: Canvas
                attribute:
                  x: 33
                  y: 82
                  width: 190
                  height: 42
                children:
                  背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~90,90,90,220
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  输入框:
                    type: TextBox
                    attribute:
                      x: 8
                      y: 10
                      width: 190
                      height: 36
                      length: 24
                      emptyText: ~共享名
                      fontSize: 36
                    action:
                      textChange: |-
                        var.sharedName = self.getContent()
              创建:
                type: Canvas
                attribute:
                  x: 250
                  y: 82
                  width: 110
                  height: 42
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'shared_create', var.sharedName, var.actionToken)
                children:
                  创建背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~255,255,255,150
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  创建文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 110
                      texts: "~&0创建"
                      fontSize: 34
                      through: true
              创建费用:
                type: Text
                attribute:
                  x: 24
                  y: 130
                  width: 370
                  texts: "'&7' + var.sharedCreateCostText"
                  fontSize: 28
                  through: true
              共享滑块:
                type: Texture
                val: 共享滑块
                attribute:
                  x: 388
                  y: 160
                  width: 6
                  height: 50
                  normal: ~120,120,120,200
                  maxDragY: 520
              共享滚动:
                type: Scroll
                val: 共享滚动
                attribute:
                  x: 24
                  y: 160
                  width: 370
                  height: 570
                  moveY: "self.parent['共享滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['共享滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['共享滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  共享列表:
                    val: 共享列表
                    type: VStack
                    attribute:
                      width: 370
                      spaceBetween: 10
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.manageWarehouses[self.entryKey]
                          visible: self.entry != none
                          width: 370
                          height: 54
                        action:
                          clickLeft: |-
                            var.deleteConfirm = false
                            var.renameName = none
                            if(var.manageWarehouseTypes[self.entryKey] == 'shared'){
                              Packet.send(var.packetId, 'shared', var.manageWarehouseTargets[self.entryKey])
                            }else{
                              Packet.send(var.packetId, 'warehouse', var.manageWarehouseTargets[self.entryKey])
                            }
                        children:
                          项背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "var.manageWarehouseSelected[self.parent.entryKey] ? '110,170,230,255' : '255,255,255,150'"
                              hover: ~Frosted:0;255,255,255,240
                              shape: ~round_rect
                              radius: 14
                            effect:
                              stroke:
                                width: 2
                                color: ~0,0,0,255
                          项文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 370
                              texts: "var.manageWarehouseTexts[self.parent.entryKey]"
                              fontSize: 32
                              through: true

          删除卡片:
            type: Texture
            attribute:
              x: 500
              y: 210
              width: 500
              height: 190
              normal: ~120,120,120,200
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
            children:
              删除标题:
                type: Text
                attribute:
                  x: 24
                  y: 22
                  texts: "~&f删除共享仓库"
                  fontSize: 44
              删除提示:
                type: Text
                attribute:
                  x: 24
                  y: 78
                  width: 450
                  texts: "var.ownerType == 'shared' ? (var.deleteConfirm ? '&c输入二级密码后确认删除' : '&f点击删除后需要二级密码确认') : '&7请选择一个共享仓库'"
                  fontSize: 34
              删除密码:
                type: Canvas
                attribute:
                  x: 34
                  y: 136
                  width: 270
                  height: 42
                  visible: var.deleteConfirm
                children:
                  背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~90,90,90,220
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  输入框:
                    type: TextBox
                    attribute:
                      x: 8
                      y: 10
                      width: 270
                      height: 36
                      length: 32
                      emptyText: ~二级密码
                      fontSize: 36
                    action:
                      textChange: |-
                        var.deletePassword = self.getContent()
              删除按钮:
                type: Canvas
                attribute:
                  x: 320
                  y: 136
                  width: 140
                  height: 42
                  visible: var.ownerType == 'shared'
                action:
                  clickLeft: |-
                    if(var.deleteConfirm){
                    Packet.send(var.packetId, 'shared_delete', var.ownerId, var.deletePassword, var.actionToken)
                    }else{
                      var.deleteConfirm = true
                      var.deletePassword = none
                    }
                children:
                  删除按钮背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~255,120,120,210
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  删除按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 140
                      texts: "var.deleteConfirm ? '&0确认' : '&0删除'"
                      fontSize: 34
                      through: true

          改名卡片:
            type: Texture
            attribute:
              x: 500
              y: 435
              width: 500
              height: 180
              normal: ~120,120,120,200
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
            children:
              改名标题:
                type: Text
                attribute:
                  x: 24
                  y: 16
                  texts: "~&f修改仓库名称与是否展示"
                  fontSize: 40
              改名提示:
                type: Text
                attribute:
                  x: 24
                  y: 56
                  width: 450
                  texts: "var.ownerType != none ? ('&f当前: ' + var.warehouseName) : '&7请选择一个仓库'"
                  fontSize: 32
              展示按钮:
                type: Canvas
                attribute:
                  x: 330
                  y: 84
                  width: 111
                  height: 42
                  visible: var.ownerType != none
                action:
                  clickLeft: |-
                    if(var.ownerType == 'shared'){
                    Packet.send(var.packetId, 'shared_showcase_toggle', var.ownerId, var.actionToken)
                    }else{
                    Packet.send(var.packetId, 'personal_showcase_toggle', var.warehouseId, var.actionToken)
                    }
                children:
                  展示按钮背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.showcaseEnabled ? '110,170,230,255' : '190,190,195,255'"
                      hover: ~Frosted:0;255,255,255,240
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  展示按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 111
                      texts: "var.showcaseEnabled ? '&0展示:开' : '&0展示:关'"
                      fontSize: 30
                      through: true
              新名称:
                type: Canvas
                attribute:
                  x: 34
                  y: 126
                  width: 270
                  height: 42
                children:
                  背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~90,90,90,220
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  输入框:
                    type: TextBox
                    attribute:
                      x: 8
                      y: 10
                      width: 270
                      height: 36
                      length: 24
                      emptyText: ~新名称
                      fontSize: 36
                    action:
                      textChange: |-
                        var.renameName = self.getContent()
              改名按钮:
                type: Canvas
                attribute:
                  x: 330
                  y: 126
                  width: 111
                  height: 42
                  visible: var.ownerType != none
                action:
                  clickLeft: |-
                    if(var.ownerType == 'shared'){
                    Packet.send(var.packetId, 'shared_rename', var.ownerId, var.renameName, var.actionToken)
                    }else{
