                            action:
                              clickLeft: "Packet.send(var.packetId, 'design_line_move', var.objKey, self.parent.parent.parent.entry['field'], (self.parent.entryKey + self.parent.parent.parent.entry['lineOffset']).round(), (-1).round(), var.actionToken)"
                            children:
                              字:
                                type: Text
