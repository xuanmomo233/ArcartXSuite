# 掉落物拾取面板 HUD（扫描模式）
# 显示玩家附近掉落物列表，支持滚轮切换选中项、点击拾取。
# 由服务端通过 packetHandler 更新槽位数据，客户端回包通知服务端执行拾取。
ui:
  isHud: true  # HUD 模式，覆盖在游戏画面上
  defaultOpen: false  # 不随启动自动打开
  through: false  # 鼠标不穿透（需要捕获点击）
  show: true  # 可见
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - count: 当前掉落物总数
    #   - selectedIndex: 当前选中项索引
    #   - item0Visible~item7Visible: 各槽位是否可见
    #   - item0Amount~item7Amount: 各槽位物品堆叠数量
    #   - item0ItemJson~item7ItemJson: 各槽位物品的 JSON 序列化数据
    update: |-
      var.count = packet['count']
      var.selectedIndex = packet['selectedIndex']
      if(var.count == 0){
        var.menuOpen = false
      }
      var.item0Visible = packet['item0Visible']
      var.item0Amount = packet['item0Amount']
      var.item0ItemJson = packet['item0ItemJson']
      var.item1Visible = packet['item1Visible']
      var.item1Amount = packet['item1Amount']
      var.item1ItemJson = packet['item1ItemJson']
      var.item2Visible = packet['item2Visible']
      var.item2Amount = packet['item2Amount']
      var.item2ItemJson = packet['item2ItemJson']
      var.item3Visible = packet['item3Visible']
      var.item3Amount = packet['item3Amount']
      var.item3ItemJson = packet['item3ItemJson']
      var.item4Visible = packet['item4Visible']
      var.item4Amount = packet['item4Amount']
      var.item4ItemJson = packet['item4ItemJson']
      var.item5Visible = packet['item5Visible']
      var.item5Amount = packet['item5Amount']
      var.item5ItemJson = packet['item5ItemJson']
      var.item6Visible = packet['item6Visible']
      var.item6Amount = packet['item6Amount']
      var.item6ItemJson = packet['item6ItemJson']
      var.item7Visible = packet['item7Visible']
      var.item7Amount = packet['item7Amount']
      var.item7ItemJson = packet['item7ItemJson']
      var.dirty = true
    # packetHandler: select
    # 包字段:
    #   - selectedIndex: 新的选中项索引
    select: |-
      var.selectedIndex = packet['selectedIndex']
    # packetHandler: open_interact
    # 包字段: 无（仅通知客户端打开交互菜单）
    open_interact: |-
      var.menuOpen = true
      var.actionToken = packet['action_token']
      Screen.open('AXS:loot_interact')
    # packetHandler: menu_closed
    # 包字段: 无（仅通知客户端交互菜单已关闭）
    menu_closed: |-
      var.menuOpen = false
  action:
    load: |-
      var.count = 0
      var.item0Amount = 0
      var.item1Amount = 0
      var.item2Amount = 0
      var.item3Amount = 0
      var.item4Amount = 0
      var.item5Amount = 0
      var.item6Amount = 0
      var.item7Amount = 0
      var.selectedIndex = 0
      var.dirty = false
    tick: |-
      if(var.dirty){
        if(var.item0ItemJson != none){
          val.loot_slot_0.setItemIcon(var.item0ItemJson)
        }
        if(var.item1ItemJson != none){
          val.loot_slot_1.setItemIcon(var.item1ItemJson)
        }
        if(var.item2ItemJson != none){
          val.loot_slot_2.setItemIcon(var.item2ItemJson)
        }
        if(var.item3ItemJson != none){
          val.loot_slot_3.setItemIcon(var.item3ItemJson)
        }
        if(var.item4ItemJson != none){
          val.loot_slot_4.setItemIcon(var.item4ItemJson)
        }
        if(var.item5ItemJson != none){
          val.loot_slot_5.setItemIcon(var.item5ItemJson)
        }
        if(var.item6ItemJson != none){
          val.loot_slot_6.setItemIcon(var.item6ItemJson)
        }
        if(var.item7ItemJson != none){
          val.loot_slot_7.setItemIcon(var.item7ItemJson)
        }
        var.dirty = false
      }

    wheel: |-
      if(var.count > 0 && !var.menuOpen){
        if(self.wheelValue > 0){
          var.selectedIndex = var.selectedIndex - 1
          if(var.selectedIndex < 0){
            var.selectedIndex = var.count - 1
          }
          Packet.send('pickup', 'scroll_up')
        }
        if(self.wheelValue < 0){
          var.selectedIndex = var.selectedIndex + 1
          if(var.selectedIndex >= var.count){
            var.selectedIndex = 0
          }
          Packet.send('pickup', 'scroll_down')
        }
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    action:
      click: |-
        if(var.count > 0 && !var.menuOpen){
          Packet.send('pickup', 'pick', var.actionToken)
        }
    children:
      拾取面板:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 160
          y: 0
          width: 280
          height: 420
          visible: var.count > 0
          through: true
        children:
          按键提示:
            type: Text
            attribute:
              point: ~top_left
              x: 14
              y: 10
              fontSize: 22
              #这里是提示文本，随便怎么写
              texts: "~"
              through: true
          拾取列表:
            type: VStack
            attribute:
              point: ~top_left
              x: 10
              y: 38
              width: 260
              spaceBetween: 4
              through: true
            children:
              物品条目0:
                type: Canvas
                attribute:
                  width: 260
                  height: 42
                  visible: var.item0Visible
                  through: true
                children:
