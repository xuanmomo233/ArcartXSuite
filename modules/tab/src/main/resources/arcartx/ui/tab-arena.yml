# tab-arena / tabs/arena.yml / packet-handler: tab
# Shared TAB language: navy glass, cerulean rules, silver scoreboard typography.
# Idle: a small live team-count ribbon. Hold TAB: bounded, independently scrollable rosters.
# Counts are roster sizes, not match scores. Other teams/spectators remain excluded.
ui:
  isHud: true
  hide:
  - player_list
  escClose: false
  defaultOpen: true
  action:
    load: |-
      var.ArenaTAB刷新轮次 = 0
      var.ArenaTAB详细 = false
      var.ArenaTAB红队人数 = 0
      var.ArenaTAB蓝队人数 = 0
      var.ArenaTAB名称位移 = 0
    keyPress: |-
      if(self.currentKeyPress() == "TAB"){
        Packet.send("TAB","update")
        var.ArenaTAB详细 = true
        var.ArenaTAB名称位移 = 0
        val.ArenaRedThumb.setDragYRatio(0)
        val.ArenaBlueThumb.setDragYRatio(0)
      }
      // HUDs have no captured cursor: arrow keys browse both team columns as well.
      if(var.ArenaTAB详细 && self.currentKeyPress() == "DOWN"){
        val.ArenaRedThumb.setDragYRatio(math.min(1, val.ArenaRedThumb.getDragYRatio() + 0.2))
        val.ArenaBlueThumb.setDragYRatio(math.min(1, val.ArenaBlueThumb.getDragYRatio() + 0.2))
      }
      if(var.ArenaTAB详细 && self.currentKeyPress() == "UP"){
        val.ArenaRedThumb.setDragYRatio(math.max(0, val.ArenaRedThumb.getDragYRatio() - 0.2))
        val.ArenaBlueThumb.setDragYRatio(math.max(0, val.ArenaBlueThumb.getDragYRatio() - 0.2))
      }
      if(var.ArenaTAB详细 && self.currentKeyPress() == "RIGHT"){
        var.ArenaTAB名称位移 = math.min(1, var.ArenaTAB名称位移 + 0.25)
      }
      if(var.ArenaTAB详细 && self.currentKeyPress() == "LEFT"){
        var.ArenaTAB名称位移 = math.max(0, var.ArenaTAB名称位移 - 0.25)
      }
    keyRelease: |-
      if(self.currentKeyReleased() == "TAB"){
        var.ArenaTAB详细 = false
      }
  packetHandler:
    # Original map payload and synchronous PlayerSkin/text assignment order retained.
    tab: |-
      i = 0
      var.ArenaTAB刷新轮次 = var.ArenaTAB刷新轮次 + 1
      while(val.RedList.childrenCount() > 1){
        val.RedList.get(1).remove()
      }
      while(val.BlueList.childrenCount() > 1){
        val.BlueList.get(1).remove()
      }
      // Preserve the original copy/delete sentinel and generation-qualified names.
      while(i < packet.size()){
        if(val.red_player_row != none){
          if(packet.get(i).team == "red"){
            ROW = val.red_player_row.copy('red_' + var.ArenaTAB刷新轮次 + '_' + i.round())
            ROW['头部'].normal = 'PlayerSkin:' + packet.get(i).uuid
            ROW['名称文字'].texts = packet.get(i).name
            if(packet.get(i).status == "1"){
              ROW['状态文字'].texts = "&c⚔"
            } else {
              ROW['状态文字'].texts = "&7•"
            }
            ROW['血量文字'].texts = "&f" + packet.get(i).health
            ROW.visible = true
          }elif(packet.get(i).team == "blue"){
            ROW = val.blue_player_row.copy('blue_' + var.ArenaTAB刷新轮次 + '_' + i.round())
            ROW['头部'].normal = 'PlayerSkin:' + packet.get(i).uuid
            ROW['名称文字'].texts = packet.get(i).name
            if(packet.get(i).status == "1"){
              ROW['状态文字'].texts = "&9⚔"
            } else {
              ROW['状态文字'].texts = "&7•"
            }
            ROW['血量文字'].texts = "&f" + packet.get(i).health
            ROW.visible = true
          }
        }
        i++
      }
      var.ArenaTAB红队人数 = val.RedList.childrenCount() - 1
      var.ArenaTAB蓝队人数 = val.BlueList.childrenCount() - 1
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      ArenaTAB背景:
        type: Canvas
        attribute:
          point: ~top_center
          y: 24
          width: "var.ArenaTAB详细 ? 1208 : 736"
          height: "var.ArenaTAB详细 ? 208 + 52 * math.min(8, math.max(1, math.max(var.ArenaTAB红队人数, var.ArenaTAB蓝队人数))) : 96"
          through: true
        children:
          ArenaTAB背景背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,24,44,164
              shape: ~round_rect
              radius: 8
              through: true
          顶部规则线:
            type: Texture
            attribute:
              point: ~top_left
              width: "self.parent.width"
              height: 3
              normal: ~35,159,214,230
              through: true
          ArenaTAB标题文字:
            type: Text
            attribute:
              point: ~top_center
              y: 14
              texts: ~&fARENA
              fontSize: 36
              through: true
          详细提示:
            type: Text
            attribute:
              point: ~top_center
              y: 54
              texts: "var.ArenaTAB详细 ? '&7队伍名册' : '&7按住 TAB 查看名册'"
              fontSize: 36
              through: true
          红队人数:
            type: Text
            attribute:
              point: ~top_left
              x: 24
              y: 18
              texts: "'&cRED  &f' + var.ArenaTAB红队人数.round()"
              fontSize: 54
              through: true
          蓝队人数:
            type: Text
            attribute:
              point: ~top_right
              x: -24
              y: 18
              texts: "'&f' + var.ArenaTAB蓝队人数.round() + '  &bBLUE'"
              fontSize: 54
              through: true
          红队列标题:
            type: Canvas
            attribute:
              x: 24
              y: 104
              width: 560
              height: 44
              visible: var.ArenaTAB详细
              through: true
            children:
              队员:
                type: Text
                attribute:
                  x: 48
                  texts: ~&7队员
                  fontSize: 36
                  through: true
              状态:
                type: Text
                attribute:
                  x: 302
                  texts: ~&7战斗
                  fontSize: 36
                  through: true
              血量:
                type: Text
                attribute:
                  point: ~top_right
                  x: -8
                  texts: ~&7生命 / 上限
                  fontSize: 36
                  through: true
          蓝队列标题:
            type: Canvas
            attribute:
              x: 624
              y: 104
              width: 560
              height: 44
              visible: var.ArenaTAB详细
              through: true
            children:
              队员:
                type: Text
                attribute:
                  x: 48
                  texts: ~&7队员
                  fontSize: 36
                  through: true
              状态:
                type: Text
                attribute:
                  x: 302
                  texts: ~&7战斗
                  fontSize: 36
                  through: true
              血量:
                type: Text
                attribute:
                  point: ~top_right
                  x: -8
                  texts: ~&7生命 / 上限
                  fontSize: 36
                  through: true
          中线:
            type: Texture
            attribute:
              x: 603
              y: 104
              width: 2
              height: "self.parent.height - 164"
              normal: ~137,167,187,120
              visible: var.ArenaTAB详细
              through: true
          红队滚动区:
            type: Scroll
            attribute:
              x: 24
              y: 148
              width: 560
              height: "52 * math.min(8, math.max(1, math.max(var.ArenaTAB红队人数, var.ArenaTAB蓝队人数)))"
              moveY: val.ArenaRedThumb.getDragYRatio()
              visible: var.ArenaTAB详细
            action:
              wheel: |-
                val.ArenaRedThumb.setDragYRatio(math.max(0, math.min(1, self.moveY - self.wheelValue * 0.1)))
            children:
              RedGrid:
                type: VStack
                val: RedList
                attribute:
                  width: 560
                  spaceBetween: 4
                children:
                  red_player_row:
                    type: Canvas
                    val: red_player_row
                    attribute:
                      width: 560
                      height: 48
                      visible: false
                      through: true
                    children:
                      行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~21,37,57,164
                          through: true
                      头部:
                        type: Texture
                        attribute:
                          point: ~middle_left
                          x: 8
                          width: 32
                          height: 32
                          normal: ~120,120,120,255
                          through: true
                      # Keep the packet's direct ROW['名称文字'].texts write intact.
                      # The custom texts binding feeds a clipped, hover-readable name lane.
                      名称文字:
                        type: Scroll
                        attribute:
                          x: 48
                          y: 6
                          width: 246
                          height: 36
                          texts: ~none
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : var.ArenaTAB名称位移"
                        action:
                          enter: "self.scrollAnim = Lerp(0, 1, 3000)"
                          leave: "self.scrollAnim = none"
                        children:
                          名称布局:
                            type: HStack
                            attribute:
                              height: 36
                            children:
                              名称:
                                type: Text
                                attribute:
                                  texts: self.parent.parent.texts
                                  fontSize: 36
                                  through: true
                      状态文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 320
                          fontSize: 36
                          texts: ~&7•
                          through: true
                      血量文字:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -8
                          fontSize: 36
                          texts: ~none
                          visible: var.ArenaTAB详细
                          through: true
          蓝队滚动区:
            type: Scroll
            attribute:
              x: 624
              y: 148
              width: 560
              height: "52 * math.min(8, math.max(1, math.max(var.ArenaTAB红队人数, var.ArenaTAB蓝队人数)))"
              moveY: val.ArenaBlueThumb.getDragYRatio()
              visible: var.ArenaTAB详细
            action:
              wheel: |-
                val.ArenaBlueThumb.setDragYRatio(math.max(0, math.min(1, self.moveY - self.wheelValue * 0.1)))
            children:
              BlueGrid:
                type: VStack
                val: BlueList
                attribute:
                  width: 560
                  spaceBetween: 4
                children:
                  blue_player_row:
                    type: Canvas
                    val: blue_player_row
                    attribute:
                      width: 560
                      height: 48
                      visible: false
                      through: true
                    children:
                      行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~21,37,57,164
                          through: true
                      头部:
                        type: Texture
                        attribute:
                          point: ~middle_left
                          x: 8
                          width: 32
                          height: 32
                          normal: ~120,120,120,255
                          through: true
                      名称文字:
                        type: Scroll
                        attribute:
                          x: 48
                          y: 6
                          width: 246
                          height: 36
                          texts: ~none
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : var.ArenaTAB名称位移"
                        action:
                          enter: "self.scrollAnim = Lerp(0, 1, 3000)"
                          leave: "self.scrollAnim = none"
                        children:
                          名称布局:
                            type: HStack
                            attribute:
                              height: 36
                            children:
                              名称:
                                type: Text
                                attribute:
                                  texts: self.parent.parent.texts
                                  fontSize: 36
                                  through: true
                      状态文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 320
                          fontSize: 36
                          texts: ~&7•
                          through: true
                      血量文字:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -8
                          fontSize: 36
                          texts: ~none
                          visible: var.ArenaTAB详细
                          through: true
          红队滑轨:
            type: Texture
            attribute:
              x: 590
              y: 148
              width: 6
              height: "52 * math.min(8, math.max(1, math.max(var.ArenaTAB红队人数, var.ArenaTAB蓝队人数)))"
              normal: ~92,121,145,170
              visible: var.ArenaTAB详细 && var.ArenaTAB红队人数 > 8
              through: true
          红队滑块:
            type: Texture
            val: ArenaRedThumb
            attribute:
              x: 590
              y: 148
              width: 6
