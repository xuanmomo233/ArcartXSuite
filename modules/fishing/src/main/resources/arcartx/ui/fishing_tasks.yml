# Lakeside field guide / 05 · A fieldwork checklist with separated description and progress.
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.daily = packet['daily']
      var.weekly = packet['weekly']
      var.season = packet['season']
      var.dailyCount = var.daily != none ? var.daily.size() : 0
      var.weeklyCount = var.weekly != none ? var.weekly.size() : 0
      var.seasonCount = var.season != none ? var.season.size() : 0
      var.taskGeneration = (var.taskGeneration + 1).round()
      for(key in var.dailyRefs.keys()){
        var.dailyRefs[key].remove()
      }
      var.dailyRefs = {}
      for(i in range(1, var.dailyCount - 1)){
        key = i.round()
        e = val.每日任务列表.get(0).copy('每日_' + var.taskGeneration + '_' + key)
        e.entryKey = key
        var.dailyRefs[key] = e
      }
      for(key in var.weeklyRefs.keys()){
        var.weeklyRefs[key].remove()
      }
      var.weeklyRefs = {}
      for(i in range(1, var.weeklyCount - 1)){
        key = i.round()
        e = val.每周任务列表.get(0).copy('每周_' + var.taskGeneration + '_' + key)
        e.entryKey = key
        var.weeklyRefs[key] = e
      }
      for(key in var.seasonRefs.keys()){
        var.seasonRefs[key].remove()
      }
      var.seasonRefs = {}
      for(i in range(1, var.seasonCount - 1)){
        key = i.round()
        e = val.赛季任务列表.get(0).copy('赛季_' + var.taskGeneration + '_' + key)
        e.entryKey = key
        var.seasonRefs[key] = e
      }
  action:
    load: |-
      var.dailyCount = 0
      var.packetId = 'AXS_FISHING_TASKS'
      var.seasonCount = 0
      var.weeklyCount = 0
      var.currentCategory = 'daily'
      var.dailyRefs = {}
      var.weeklyRefs = {}
      var.seasonRefs = {}
      var.taskGeneration = 0
      var.categoryNames = {'daily':'&0每日委托', 'weekly':'&0每周委托', 'season':'&0赛季委托'}
      var.categoryDescs = {'daily':'&8每日刷新，完成获取钓鱼经验', 'weekly':'&8每周刷新，奖励更丰厚', 'season':'&8赛季长期目标，记录持续成长'}
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send(var.packetId, 'refresh_tasks')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
controls:
  全屏玻璃底: {type: Texture, attribute: {point: ~stretch_all, normal: '~Frosted:18;20,43,52,170'}}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶栏:
        type: Canvas
        attribute: {x: '-var.offX', width: 'var.viewW', height: 96}
        children:
          顶栏底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,250'}}
          标题: {type: Text, attribute: {point: ~middle_left, x: 48, texts: '~&f湖畔手册', fontSize: 54}}
          页名: {type: Text, attribute: {point: ~middle_left, x: 340, texts: '~&7钓鱼 / &f湖畔委托', fontSize: 36}}
          关闭按钮:
            type: Canvas
            attribute: {point: ~middle_right, x: -40, width: 112, height: 52}
            action: {clickLeft: 'Screen.close()'}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~48,75,83,255', hover: '~73,107,106,255', shape: ~round_rect, radius: 12, through: true}}
              字: {type: Text, attribute: {point: ~middle_center, texts: '~&f关闭', fontSize: 36, through: true}}
      左侧导航:
        type: Canvas
        attribute: {x: '48 - var.offX', y: 120, width: 300, height: 'var.viewH - 144'}
        children:
          导航底: {type: Texture, attribute: {point: ~stretch_all, normal: '~231,222,196,250', shape: ~round_rect, radius: 18}}
          索引标题: {type: Text, attribute: {x: 24, y: 24, texts: '~&8FIELD GUIDE / 目录', fontSize: 36}}
          导航总览:
            type: Canvas
            attribute: {x: 16, y: 88, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_main')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f01  垂钓日志', fontSize: 36, through: true}}
          导航图鉴:
            type: Canvas
            attribute: {x: 16, y: 162, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_collection')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f02  鱼种图鉴', fontSize: 36, through: true}}
          导航奖励:
            type: Canvas
            attribute: {x: 16, y: 236, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_rewards')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f03  成长奖励', fontSize: 36, through: true}}
          导航天赋:
            type: Canvas
            attribute: {x: 16, y: 310, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_talents')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f04  技艺网络', fontSize: 36, through: true}}
          导航任务:
            type: Canvas
            attribute: {x: 16, y: 384, width: 268, height: 62}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~157,190,169,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&005  湖畔委托', fontSize: 36, through: true}}
          导航饵料:
            type: Canvas
            attribute: {x: 16, y: 458, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_baits')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f06  行前饵料', fontSize: 36, through: true}}
          委托说明: {type: Text, attribute: {x: 24, y: 580, texts: ['~&8选择每日、每周', '~&8或赛季目标', '~&8捕获时自动累积进度', '~&8完成后获得钓鱼经验'], fontSize: 36}}
          刷新按钮:
            type: Canvas
            attribute: {point: ~bottom_left, x: 16, y: -20, width: 268, height: 56}
            action: {clickLeft: "Packet.send(var.packetId, 'refresh_tasks')"}
            children:
              底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,255', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              字: {type: Text, attribute: {point: ~middle_center, texts: '~&f刷新委托', fontSize: 36, through: true}}
      内容区:
        type: Canvas
        attribute: {x: '372 - var.offX', y: 120, width: 'var.contentW', height: 'var.viewH - 144'}
        children:
          内容底: {type: Texture, attribute: {point: ~stretch_all, normal: '~191,209,191,248', shape: ~round_rect, radius: 18}}
          页标题: {type: Text, attribute: {x: 32, y: 24, texts: 'var.categoryNames[var.currentCategory]', fontSize: 64}}
          页标题说明: {type: Text, attribute: {point: ~top_right, x: -32, y: 40, texts: 'var.categoryDescs[var.currentCategory]', fontSize: 36}}
          分类栏:
            type: HStack
            attribute: {x: 32, y: 116, height: 100, spaceBetween: 16}
            children:
              导航每日:
                type: Canvas
                attribute: {width: '(var.contentW - 96) / 3', height: 100}
                action:
                  clickLeft: |-
                    var.currentCategory = 'daily'
                    val.任务滑块.setDragYRatio(0)
                children:
                  底: {type: Texture, attribute: {point: ~stretch_all, normal: "var.currentCategory == 'daily' ? '23,49,64,255' : '231,222,196,255'", shape: ~round_rect, radius: 12, through: true}}
                  字: {type: Text, attribute: {point: ~middle_center, texts: "(var.currentCategory == 'daily' ? '&f每日 / ' : '&0每日 / ') + var.dailyCount.round() + ' 项'", fontSize: 36, through: true}}
              导航每周:
                type: Canvas
                attribute: {width: '(var.contentW - 96) / 3', height: 100}
                action:
                  clickLeft: |-
                    var.currentCategory = 'weekly'
                    val.任务滑块.setDragYRatio(0)
                children:
                  底: {type: Texture, attribute: {point: ~stretch_all, normal: "var.currentCategory == 'weekly' ? '23,49,64,255' : '231,222,196,255'", shape: ~round_rect, radius: 12, through: true}}
                  字: {type: Text, attribute: {point: ~middle_center, texts: "(var.currentCategory == 'weekly' ? '&f每周 / ' : '&0每周 / ') + var.weeklyCount.round() + ' 项'", fontSize: 36, through: true}}
              导航赛季:
                type: Canvas
                attribute: {width: '(var.contentW - 96) / 3', height: 100}
                action:
                  clickLeft: |-
                    var.currentCategory = 'season'
                    val.任务滑块.setDragYRatio(0)
                children:
                  底: {type: Texture, attribute: {point: ~stretch_all, normal: "var.currentCategory == 'season' ? '23,49,64,255' : '231,222,196,255'", shape: ~round_rect, radius: 12, through: true}}
                  字: {type: Text, attribute: {point: ~middle_center, texts: "(var.currentCategory == 'season' ? '&f赛季 / ' : '&0赛季 / ') + var.seasonCount.round() + ' 项'", fontSize: 36, through: true}}
          空状态: {type: Text, attribute: {point: ~middle_center, texts: '~&8此分类暂无委托', fontSize: 48, visible: "(var.currentCategory == 'daily' && var.dailyCount == 0) || (var.currentCategory == 'weekly' && var.weeklyCount == 0) || (var.currentCategory == 'season' && var.seasonCount == 0)"}}
          任务滑轨: {type: Texture, attribute: {point: ~top_right, x: -16, y: 244, width: 12, height: 'var.viewH - 412', normal: '~140,166,151,255', shape: ~round_rect, radius: 6}}
          任务滑块:
            type: Texture
            val: 任务滑块
            attribute: {point: ~top_right, x: -16, y: 244, width: 12, height: 120, maxDragY: 'var.viewH - 532', normal: '~23,49,64,255', shape: ~round_rect, radius: 6}
          滚动区:
            type: Scroll
            attribute: {x: 28, y: 244, width: 'var.contentW - 76', height: 'var.viewH - 412', moveY: 'val.任务滑块.getDragYRatio()'}
            action:
              wheel: |-
                val.任务滑块.setDragYRatio(math.max(0, math.min(1, self.moveY - self.wheelValue * 0.1)))
            children:
              任务总容器:
                type: VStack
                val: 任务总容器
                attribute: {width: 'var.contentW - 76', spaceBetween: 0}
                children:
                  每日任务列表:
                    type: VStack
                    val: 每日任务列表
                    attribute: {width: 'var.contentW - 76', visible: "var.currentCategory == 'daily'", spaceBetween: 16}
                    children:
                      任务项:
                        type: Canvas
                        attribute: {entryKey: 0.round(), entry: 'var.daily[self.entryKey]', visible: 'self.entry != none', width: 'var.contentW - 76', height: 184}
                        children:
                          底: {type: Texture, attribute: {point: ~stretch_all, normal: "self.parent.entry['completed'] == true ? '157,190,169,255' : '231,222,196,255'", shape: ~round_rect, radius: 14, through: true}}
                          状态: {type: Text, attribute: {x: 24, y: 24, texts: "self.parent.entry['completed'] == true ? '&2完成' : '&8进行中'", fontSize: 36, through: true}}
                          任务名: {type: Text, attribute: {x: 172, y: 20, texts: "'&0' + self.parent.entry['name']", fontSize: 48, limit: 17, through: true}}
                          任务描述: {type: Text, attribute: {x: 24, y: 84, texts: "'&8' + self.parent.entry['description']", fontSize: 36, limit: 36, through: true}}
                          奖励: {type: Text, attribute: {point: ~top_right, x: -24, y: 30, texts: "'&8+' + self.parent.entry['xpReward'].round() + ' 经验'", fontSize: 36, through: true}}
                          进度: {type: Text, attribute: {point: ~bottom_right, x: -24, y: -22, texts: "'&8' + self.parent.entry['progress'].round() + '/' + self.parent.entry['target'].round() + ' · ' + self.parent.entry['percent'].round() + '%'", fontSize: 36, through: true}}
                          进度底: {type: Texture, attribute: {x: 24, y: 148, width: 'var.contentW - 460', height: 10, normal: '~179,186,163,255', shape: ~round_rect, radius: 5, through: true}}
                          进度填充: {type: Texture, attribute: {x: 24, y: 148, width: "math.max(0, math.min(100, self.parent.entry['percent'])) / 100 * (var.contentW - 460)", height: 10, normal: '~53,89,96,255', shape: ~round_rect, radius: 5, through: true}}
                  每周任务列表:
                    type: VStack
                    val: 每周任务列表
                    attribute: {width: 'var.contentW - 76', visible: "var.currentCategory == 'weekly'", spaceBetween: 16}
                    children:
                      任务项:
                        type: Canvas
                        attribute: {entryKey: 0.round(), entry: 'var.weekly[self.entryKey]', visible: 'self.entry != none', width: 'var.contentW - 76', height: 184}
                        children:
                          底: {type: Texture, attribute: {point: ~stretch_all, normal: "self.parent.entry['completed'] == true ? '157,190,169,255' : '231,222,196,255'", shape: ~round_rect, radius: 14, through: true}}
                          状态: {type: Text, attribute: {x: 24, y: 24, texts: "self.parent.entry['completed'] == true ? '&2完成' : '&8进行中'", fontSize: 36, through: true}}
                          任务名: {type: Text, attribute: {x: 172, y: 20, texts: "'&0' + self.parent.entry['name']", fontSize: 48, limit: 17, through: true}}
                          任务描述: {type: Text, attribute: {x: 24, y: 84, texts: "'&8' + self.parent.entry['description']", fontSize: 36, limit: 36, through: true}}
                          奖励: {type: Text, attribute: {point: ~top_right, x: -24, y: 30, texts: "'&8+' + self.parent.entry['xpReward'].round() + ' 经验'", fontSize: 36, through: true}}
                          进度: {type: Text, attribute: {point: ~bottom_right, x: -24, y: -22, texts: "'&8' + self.parent.entry['progress'].round() + '/' + self.parent.entry['target'].round() + ' · ' + self.parent.entry['percent'].round() + '%'", fontSize: 36, through: true}}
                          进度底: {type: Texture, attribute: {x: 24, y: 148, width: 'var.contentW - 460', height: 10, normal: '~179,186,163,255', shape: ~round_rect, radius: 5, through: true}}
                          进度填充: {type: Texture, attribute: {x: 24, y: 148, width: "math.max(0, math.min(100, self.parent.entry['percent'])) / 100 * (var.contentW - 460)", height: 10, normal: '~53,89,96,255', shape: ~round_rect, radius: 5, through: true}}
                  赛季任务列表:
                    type: VStack
                    val: 赛季任务列表
                    attribute: {width: 'var.contentW - 76', visible: "var.currentCategory == 'season'", spaceBetween: 16}
                    children:
                      任务项:
                        type: Canvas
                        attribute: {entryKey: 0.round(), entry: 'var.season[self.entryKey]', visible: 'self.entry != none', width: 'var.contentW - 76', height: 184}
                        children:
                          底: {type: Texture, attribute: {point: ~stretch_all, normal: "self.parent.entry['completed'] == true ? '157,190,169,255' : '231,222,196,255'", shape: ~round_rect, radius: 14, through: true}}
                          状态: {type: Text, attribute: {x: 24, y: 24, texts: "self.parent.entry['completed'] == true ? '&2完成' : '&8进行中'", fontSize: 36, through: true}}
                          任务名: {type: Text, attribute: {x: 172, y: 20, texts: "'&0' + self.parent.entry['name']", fontSize: 48, limit: 17, through: true}}
                          任务描述: {type: Text, attribute: {x: 24, y: 84, texts: "'&8' + self.parent.entry['description']", fontSize: 36, limit: 36, through: true}}
                          奖励: {type: Text, attribute: {point: ~top_right, x: -24, y: 30, texts: "'&8+' + self.parent.entry['xpReward'].round() + ' 经验'", fontSize: 36, through: true}}
                          进度: {type: Text, attribute: {point: ~bottom_right, x: -24, y: -22, texts: "'&8' + self.parent.entry['progress'].round() + '/' + self.parent.entry['target'].round() + ' · ' + self.parent.entry['percent'].round() + '%'", fontSize: 36, through: true}}
                          进度底: {type: Texture, attribute: {x: 24, y: 148, width: 'var.contentW - 460', height: 10, normal: '~179,186,163,255', shape: ~round_rect, radius: 5, through: true}}
                          进度填充: {type: Texture, attribute: {x: 24, y: 148, width: "math.max(0, math.min(100, self.parent.entry['percent'])) / 100 * (var.contentW - 460)", height: 10, normal: '~53,89,96,255', shape: ~round_rect, radius: 5, through: true}}
