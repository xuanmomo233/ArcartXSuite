              y: 115
              width: 220
              height: 28
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: ~&f最佳时间
                  fontSize: 36
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          表头通关次数:
            type: Canvas
            attribute:
              x: 764
              y: 115
              width: 200
              height: 28
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: ~&f通关次数
                  fontSize: 36
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          滑块:
            type: Texture
            val: slider
            attribute:
              x: 1000
              y: 166
              width: 8
              height: 72
              maxDragY: 432
              normal: ~186,140,232,235
              shape: ~round_rect
              radius: 4
          行滚动区:
            type: Scroll
            attribute:
              x: 28
              y: 164
              width: 964
              height: 504
              moveY: "val.slider.getDragYRatio()"
            action:
              wheel: |-
                val.slider.setDragYRatio(Math.max(0, Math.min(1, self.moveY - self.wheelValue * 0.1)))
            children:
              行列表:
                type: RepeatGrid
                val: rows
                attribute:
                  items: "var.leaderRows"
                  flow: ~row
                  column: 1
                  spaceBetweenY: 6
                  maxSize: 2147483647
                  width: 964
                children:
                  行:
                    type: Canvas
                    attribute:
                      width: 964
                      height: 52
                      entryKey: self.item
                      entry: "var.rows[self.entryKey]"
                      visible: "self.entry != none"
                    children:
                      行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~38,30,58,210
                          shape: ~round_rect
                          radius: 6
                          through: true
                      列名次:
                        type: Canvas
                        attribute:
                          x: 16
                          y: 12
                          width: 80
                          height: 28
                          through: true
                        children:
