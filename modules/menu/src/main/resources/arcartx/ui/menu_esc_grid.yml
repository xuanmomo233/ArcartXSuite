# AXS Menu ESC UI（指令台网格版）— 继续游戏优先，左右快捷入口保留角色展示
# 布局结构（设计分辨率 1920x1080，全屏自适应，场景保持可见，角色居中展示）：
#   ┌ 左上继续游戏 / 标题徽章        右上角双货币条 ┐
#   ├ 紧凑身份徽章（玩家名 + 等阶阅历），减少装饰占高 ┤
#   │                                            │
#   │   [格][格]     第三人称角色      [格][格]    │  ← 左右各 2 列磁贴，中央留空
#   │   [格][格]        (展示位)       [格][格]    │
#   ├ 左下工具横向滚动        底部说明条        右下工具横向滚动 ┘
#
# 数据流: 服务端 sendPacket(init/update) -> packetHandler -> var.* -> 模板复制渲染
# 客户端回包: Packet.send('AXS_MENU', 'click'/'footer', token, id) / page / esc_open / close
#
# 启用方式：菜单 yml 顶部配置 `ui-id: menu_esc_grid`（不带命名空间），
# 模块启动时会自动注册本文件并把所有 init/update 包投递到它。
# 注意：两套 ESC UI 使用相同暂停匹配目标；同时注册时仅启用一个 match。
# 本文件默认注释 match，保留 menu_esc.yml 接管暂停。
ui:
  isHud: false
  match:
    #- 暂停界面
  hide:
    - HUD
    - online
    - 聊天栏
    - 纯色块HUD
    - hotbar
    - crosshair
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
    - experience_bar
    - item_name
    - scoreboard
    - chat_panel
  itemSize: 16
  # 如果想打开图标物品的tooltip，需要设置为true
  through: false
  escClose: false
  background: false
  closeDied: false
  show: true
  jei: false
  level: 0
  screenScale: true
  defaultOpen: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 包标识符（'AXS_MENU'）
    #   - action_token: 写操作令牌（click / footer 回包必带）
    #   - menuId / title / pageId / pageTitle / pageIndex / pageCount
    #   - hasPrev / hasNext: 是否有上一页 / 下一页
    #   - buttonRows: 按钮数据行（字典，key 为索引；含 id/text/enabled/hasIcon/itemJson/summary/detailRows）
    #   - buttonCount: 按钮总数
    #   - footerRows: 页脚按钮数据行（额外含 clientAction）
    #   - footerCount: 页脚按钮总数
    init: |-
      var.incoming = packet
      var.resetMenu = true
      self.actions['applyPacket']()
    update: |-
      var.incoming = packet
      var.resetMenu = false
      self.actions['applyPacket']()
  action:
    load: |-
      var.menuUi = self
      var.packetId = 'AXS_MENU'
      var.closing = false
      var.buttonCount = 0
      var.footerCount = 0
      var.gridRows = 0
      var.pageCount = 1
      var.pageIndex = 0
      var.左数 = 0
      var.右数 = 0
      var.左页脚数 = 0
      var.右页脚数 = 0
      var.footerLeftRatio = 0
      var.footerRightRatio = 0
      var.labels = {}
      var.footerLabels = {}
      var.左引用 = {}
      var.右引用 = {}
      var.左页脚引用 = {}
      var.右页脚引用 = {}
      var.按钮轮次 = 0
      var.页脚轮次 = 0
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.goldIcon = '{"id":"minecraft:gold_ingot","Count":1b}'
      var.pointIcon = '{"id":"minecraft:emerald","Count":1b}'
      var.actionBusySeconds = 0
      var.anim = Smooth(1, 0, 320)
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      // 可调设计尺寸；网格 / 标签 / 滑块统一由同一组尺寸派生
      var.tileH = 156
      var.tileGap = 16
      var.footerH = 124
      var.footerGap = 18
      var.footerW = (var.viewW - 704) / 2
      var.characterGap = 400
      var.tileW = math.min(180, (var.viewW - var.characterGap - var.tileGap * 2 - 176) / 4)
      var.deckW = var.tileW * 4 + var.tileGap * 2 + var.characterGap
    open: |-
      var.closing = false
      var.actionBusy = false
      var.preview = none
      var.anim = Smooth(1, 0, 320)
      self.actions['applyCamera']()
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
      Packet.send(var.packetId, 'esc_open')
    tick: |-
      if(!var.closing && server.player_yaw != var.yaw){
        self.actions['applyCamera']()
      }
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    applyCamera: |-
      var.yaw = server.player_yaw
      Camera.setState(0.0, -0.4, 3.0, 175, 0.0, 600)
      Camera.setThirdPerson(true)
    closeMenu: |-
      if(!var.closing){
        var.closing = true
        var.preview = none
        var.anim = Smooth(0, 1, 240)
        Camera.clearState()
        async {
          Thread.sleep(260)
          Camera.setThirdPerson(false)
          Screen.close()
        }
      }
    keyPress: |-
      if(self.currentKeyPress() == 'ESCAPE'){
        self.actions['closeMenu']()
      }
    close: |-
      var.closing = true
      var.preview = none
      Camera.setThirdPerson(false)
      Camera.clearState()
    preview: |-
      var.previewBody = var.preview['summary']
      if(var.previewBody == none || var.previewBody == ''){
        var.previewBody = '点击进入，继续你的冒险'
        if(var.preview['detailCount'] > 0){
          var.previewBody = var.preview['detailRows'][0.round()]['text']
        }
      }
      if(!var.preview['enabled']){
        var.previewBody = '当前未满足使用条件'
        if(var.preview['detailCount'] > 0){
          var.previewBody = var.preview['detailRows'][(var.preview['detailCount'] - 1).round()]['text']
        }
      }
      while(var.previewBody.length() >= 2 && (var.previewBody.charAt(0) == '&' || var.previewBody.charAt(0) == '§')){
        var.previewBody = var.previewBody.substring(2)
      }
      var.previewColor = var.preview['enabled'] ? '&f' : '&c'
    applyPacket: |-
      changedPage = var.resetMenu || var.menuId != var.incoming['menuId'] || var.pageId != var.incoming['pageId']
      var.packetId = var.incoming['packetId']
      var.actionToken = var.incoming['action_token']
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.preview = none
      var.menuId = var.incoming['menuId']
      var.title = var.incoming['title']
      var.pageId = var.incoming['pageId']
      var.pageTitle = var.incoming['pageTitle']
      var.pageIndex = var.incoming['pageIndex']
      var.pageCount = var.incoming['pageCount']
      var.hasPrev = var.incoming['hasPrev']
      var.hasNext = var.incoming['hasNext']
      var.buttonRows = var.incoming['buttonRows']
      var.buttonCount = var.incoming['buttonCount']
      var.footerRows = var.incoming['footerRows']
      var.footerCount = var.incoming['footerCount']
      var.gridRows = math.ceil(var.buttonCount / 4)
      var.displayTitle = var.pageCount > 1 ? var.pageTitle : var.title
      while(var.displayTitle.length() >= 2 && (var.displayTitle.charAt(0) == '&' || var.displayTitle.charAt(0) == '§')){
        var.displayTitle = var.displayTitle.substring(2)
      }
      if(changedPage){
        val.grid_slider.setDragYRatio(0)
        var.footerLeftRatio = 0
        var.footerRightRatio = 0
      }
      // ── 统计左右两侧数量（偶列进左块，奇列进右块）──
      目标数 = var.buttonCount.round()
      var.左数 = 0
      var.右数 = 0
      for(i in range(0, 目标数 - 1)){
        if((i % 4) < 2){
          var.左数 = var.左数 + 1
        }else{
          var.右数 = var.右数 + 1
        }
      }
      var.左页脚数 = 0
      var.右页脚数 = 0
      for(i in range(0, var.footerCount.round() - 1)){
        if((i % 2) == 0){
          var.左页脚数 = var.左页脚数 + 1
        }else{
          var.右页脚数 = var.右页脚数 + 1
        }
      }
      // ── 数量变化才重建：副本引用集中管理，跨轮次重名靠轮次号区分 ──
      if(val.grid_left.childrenCount() != var.左数 || val.grid_right.childrenCount() != var.右数){
        for(key in var.左引用.keys()){
          var.左引用[key].remove()
        }
        for(key in var.右引用.keys()){
          var.右引用[key].remove()
        }
        var.左引用 = {}
        var.右引用 = {}
        var.按钮轮次 = (var.按钮轮次 + 1).round()
        左模板 = val.grid_left.get(0)
        右模板 = val.grid_right.get(0)
        左序号 = 0
        右序号 = 0
        for(i in range(0, 目标数 - 1)){
          ii = i.round()
          if((i % 4) < 2){
            if(左序号 == 0){
              cell = 左模板
            }else{
              cell = 左模板.copy('左钮_' + var.按钮轮次 + '_' + 左序号.round())
              var.左引用[左序号.round()] = cell
            }
            cell.entryKey = ii
            左序号 = 左序号 + 1
          }else{
            if(右序号 == 0){
              cell = 右模板
            }else{
              cell = 右模板.copy('右钮_' + var.按钮轮次 + '_' + 右序号.round())
              var.右引用[右序号.round()] = cell
            }
            cell.entryKey = ii
            右序号 = 右序号 + 1
          }
        }
        if(左序号 == 0){
          左模板.entryKey = 'x'
        }
        if(右序号 == 0){
          右模板.entryKey = 'x'
        }
      }
      if(val.footer_left.childrenCount() != var.左页脚数 || val.footer_right.childrenCount() != var.右页脚数){
        for(key in var.左页脚引用.keys()){
          var.左页脚引用[key].remove()
        }
        for(key in var.右页脚引用.keys()){
          var.右页脚引用[key].remove()
        }
        var.左页脚引用 = {}
        var.右页脚引用 = {}
        var.页脚轮次 = (var.页脚轮次 + 1).round()
        左模板 = val.footer_left.get(0)
        右模板 = val.footer_right.get(0)
        左序号 = 0
        右序号 = 0
        for(i in range(0, var.footerCount.round() - 1)){
          ii = i.round()
          if((i % 2) == 0){
            if(左序号 == 0){
              cell = 左模板
            }else{
              cell = 左模板.copy('左脚_' + var.页脚轮次 + '_' + 左序号.round())
              var.左页脚引用[左序号.round()] = cell
            }
            cell.entryKey = ii
            左序号 = 左序号 + 1
          }else{
            if(右序号 == 0){
              cell = 右模板
            }else{
              cell = 右模板.copy('右脚_' + var.页脚轮次 + '_' + 右序号.round())
              var.右页脚引用[右序号.round()] = cell
            }
            cell.entryKey = ii
            右序号 = 右序号 + 1
          }
        }
        if(左序号 == 0){
          左模板.entryKey = 'x'
        }
        if(右序号 == 0){
          右模板.entryKey = 'x'
        }
      }
      // ── 标签与图标字典（剥离 &/§ 颜色码）──
      var.labels = {}
      var.footerLabels = {}
      var.iconJsons = {}
      var.footerIconJsons = {}
      for(key in var.buttonRows.keys()){
        entry = var.buttonRows[key]
        var.iconJsons[key] = entry['hasIcon'] ? entry['itemJson'] : var.air
        label = entry['text']
        while(label.length() >= 2 && (label.charAt(0) == '&' || label.charAt(0) == '§')){
          label = label.substring(2)
        }
        var.labels[key] = label
      }
      for(key in var.footerRows.keys()){
        entry = var.footerRows[key]
        var.footerIconJsons[key] = entry['hasIcon'] ? entry['itemJson'] : var.air
        label = entry['text']
        while(label.length() >= 2 && (label.charAt(0) == '&' || label.charAt(0) == '§')){
          label = label.substring(2)
        }
        var.footerLabels[key] = label
      }
      // ── seticon 统一走保存的引用，不回查容器 ──
      if(var.左数 > 0){
        cell = val.grid_left.get(0)
        cell['图标'].seticon()
        for(key in var.左引用.keys()){
          var.左引用[key]['图标'].seticon()
        }
      }
      if(var.右数 > 0){
        cell = val.grid_right.get(0)
        cell['图标'].seticon()
        for(key in var.右引用.keys()){
          var.右引用[key]['图标'].seticon()
        }
      }
      if(var.左页脚数 > 0){
        cell = val.footer_left.get(0)
        cell['图标'].seticon()
        for(key in var.左页脚引用.keys()){
          var.左页脚引用[key]['图标'].seticon()
        }
      }
      if(var.右页脚数 > 0){
        cell = val.footer_right.get(0)
        cell['图标'].seticon()
        for(key in var.右页脚引用.keys()){
          var.右页脚引用[key]['图标'].seticon()
        }
      }
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      全屏画布:
        type: Canvas
        attribute:
          x: "-var.offX"
          width: "var.viewW"
          height: "var.viewH"
        children:
          场景压暗:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,16,26,88
              alpha: "1 - var.anim.get()"
              through: true
          顶部暗角:
            type: Texture
            attribute:
              x: 0
              y: 0
              width: "var.viewW"
              height: 330
              normal: ~10,16,26,130
              through: true
            effect:
              gradient:
                color1: ~10,16,26,140
                color2: ~10,16,26,0
                type: 0
                angleDeg: 90
          底部暗角:
            type: Texture
            attribute:
              x: 0
              y: "var.viewH - 220"
              width: "var.viewW"
              height: 220
              normal: ~10,16,26,120
              through: true
            effect:
              gradient:
                color1: ~10,16,26,0
                color2: ~10,16,26,130
                type: 0
                angleDeg: 90
          继续游戏:
            type: Canvas
            attribute:
              point: ~top_left
              x: "44 - var.anim.get() * 160"
              y: 28
              width: 292
              height: 80
              enable: "!var.closing"
            action:
              clickLeft: |-
                var.menuUi.actions['closeMenu']()
            children:
              继续底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~239,231,210,255
                  hover: ~250,245,230,255
                  shape: ~round_rect
                  radius: 10
                  through: true
              继续字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&0ESC  继续游戏
                  fontSize: 48
                  through: true
          工具说明:
            type: Text
            attribute:
              x: 44
              y: "var.viewH - var.footerH - 64"
              texts: "var.左页脚数 * (math.min(144, var.tileW) + var.footerGap) - var.footerGap > var.footerW ? '&7实用工具 · 滚轮查看更多' : '&7设置与实用工具'"
              fontSize: 36
              through: true
          退出说明:
            type: Text
            attribute:
              point: ~top_right
              x: -44
              y: "var.viewH - var.footerH - 64"
              texts: "var.右页脚数 * (math.min(144, var.tileW) + var.footerGap) - var.footerGap > var.footerW ? '&7会话工具 / 退出 · 滚轮查看更多' : '&7会话工具 / 退出'"
              fontSize: 36
              through: true
          # ── 左上角：菜单标题徽章 ──
          标题徽章:
            type: Canvas
            attribute:
              x: "44 - var.anim.get() * 160"
              y: 124
              width: 292
              height: 52
            children:
              徽章底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~44,56,70,235
                  shape: ~round_rect
                  radius: 8
                  through: true
                effect:
                  stroke:
                    width: 1
                    color: ~196,182,150,255
              徽章饰菱:
                type: Texture
                attribute:
                  x: 16
                  y: 19
                  width: 14
                  height: 14
                  rotate: 45
                  normal: ~96,173,190,255
                  through: true
              徽章字:
                type: Text
                attribute:
                  x: 44
                  y: 8
                  texts: "'&f' + var.displayTitle"
                  fontSize: 36
                  limit: 10
                  through: true
          # ── 右上角：双货币条 ──
          货币栏:
            type: Canvas
            attribute:
              point: ~top_right
              x: "-44 + var.anim.get() * 160"
              y: 30
              width: 470
              height: 52
            children:
              货币一:
                type: Canvas
                attribute:
                  x: 0
                  y: 0
                  width: 224
                  height: 52
                children:
                  货币一底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~44,56,70,235
                      shape: ~round_rect
                      radius: 8
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: ~196,182,150,255
                  金币图标:
                    type: Slot
                    attribute:
                      slotType: ~Icon
                      x: 10
                      y: 10
                      width: 32
                      height: 32
                      itemScale: 0.5
                      normal: ~0,0,0,0
                      through: true
                      seticon: "self.setItemIcon(var.goldIcon)"
                    action:
                      create: |-
                        self.seticon()
                  金币数:
                    type: Text
                    attribute:
                      x: 50
                      y: 9
                      texts: "(server.vault_eco_balance != none && server.vault_eco_balance != '') ? '&f' + server.vault_eco_balance : '&f0'"
                      fontSize: 36
                      limit: 10
                      through: true
              货币二:
                type: Canvas
                attribute:
                  x: 240
                  y: 0
                  width: 224
                  height: 52
                children:
                  货币二底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~44,56,70,235
                      shape: ~round_rect
                      radius: 8
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: ~196,182,150,255
                  点券图标:
                    type: Slot
                    attribute:
                      slotType: ~Icon
                      x: 10
                      y: 10
                      width: 32
                      height: 32
                      itemScale: 0.5
                      normal: ~0,0,0,0
                      through: true
                      seticon: "self.setItemIcon(var.pointIcon)"
                    action:
                      create: |-
                        self.seticon()
                  点券数:
                    type: Text
                    attribute:
                      x: 50
                      y: 9
                      texts: "(server.playerpoints_points != none && server.playerpoints_points != '') ? '&f' + server.playerpoints_points : '&f0'"
                      fontSize: 36
                      limit: 10
                      through: true
          # ── 顶部居中：徽章 + 玩家名 + 等阶阅历 ──
          徽章区:
            type: Canvas
            attribute:
              point: ~top_center
              y: "34 - var.anim.get() * 26"
              width: 640
              height: 186
              through: true
            children:
              竖芒:
                type: Texture
                attribute:
                  x: 318
                  y: 0
                  width: 4
                  height: 76
                  normal: ~240,232,210,255
                  through: true
              横芒:
                type: Texture
                attribute:
                  x: 274
                  y: 36
                  width: 92
                  height: 4
                  normal: ~240,232,210,255
                  through: true
              外菱:
                type: Texture
                attribute:
                  x: 294
                  y: 12
                  width: 52
                  height: 52
                  rotate: 45
                  normal: ~52,66,82,200
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: ~238,230,206,255
              内菱:
                type: Texture
                attribute:
                  x: 308
                  y: 26
                  width: 24
                  height: 24
                  rotate: 45
                  normal: ~230,216,184,255
                  through: true
              上饰菱:
                type: Texture
                attribute:
                  x: 314
                  y: 0
                  width: 12
                  height: 12
                  rotate: 45
                  normal: ~96,173,190,255
                  through: true
              下饰菱:
                type: Texture
                attribute:
                  x: 314
                  y: 64
                  width: 12
                  height: 12
                  rotate: 45
                  normal: ~96,173,190,255
                  through: true
              左饰菱:
                type: Texture
                attribute:
                  x: 264
                  y: 32
                  width: 12
                  height: 12
                  rotate: 45
                  normal: ~96,173,190,255
                  through: true
              右饰菱:
                type: Texture
                attribute:
                  x: 364
                  y: 32
                  width: 12
                  height: 12
                  rotate: 45
                  normal: ~96,173,190,255
                  through: true
              玩家名:
                type: Text
                attribute:
                  point: ~top_center
                  y: 100
                  texts: "'&f' + Player.getName()"
                  fontSize: 64
                  limit: 16
                  through: true
              等阶阅历:
                type: Text
                attribute:
                  point: ~top_center
                  y: 154
