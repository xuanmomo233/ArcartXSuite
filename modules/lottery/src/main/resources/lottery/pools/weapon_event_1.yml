# 文件用途: 武器活动祈愿卡池数据定义。
# 定义武器活动祈愿的消耗、保底机制、概率参数和各星级物品池（UP/常驻）。
# 类型为 GACHA（原神祈愿），5星保底80抽，UP武器概率75%，命定值上限2点。

id: "weapon_event_1"  # 卡池唯一标识
type: GACHA  # 卡池类型：GACHA（原神祈愿）
enabled: true  # 是否启用
display-name: "武器活动祈愿"  # 显示名称
description: |-  # 卡池描述文本
  武器活动祈愿
  在本祈愿中，5星武器「传说之刃」的获取概率将大幅提升！
  5星保底80抽，4星保底10抽，UP武器概率75%，命定值上限2点。
# UP 物品图标
up-item-icon:
  source: "neigeitems"
  id: "LottoLegendBlade"
# 未配置 up-item-icon 时自动使用 UP 5星奖品（CASE 池为最高稀有度奖品）的物品作为图标；up-item-icon 配置可以省略。
# 奖品未配置 icon 时使用该奖品 item 生成的物品作为图标。
# 图标配置分为物品库物品与自定义物品，两种写法二选一。
# up-item-icon:
  #############################################################
  # --- 物品库物品：source + id（与下方 material 写法二选一） ---
  # -------------------------------
  # source: "neigeitems"                         # 物品库来源
  # id: "LottoLegendBlade"                     # 物品库物品 ID
  ############################################################
  # --- MMOItems 物品：source + mmo-type + mmo-id ---
  # -------------------------------
  # source: "mmoitems"
  # mmo-type: "ARMOR"                         # MMOItems 类型
  # mmo-id: "LOTTO_STAR_HELMET"               # MMOItems 物品 ID
  ############################################################
  # --- 自定义物品：material 及其它字段 ---
  # material: DIAMOND_SWORD                      # Minecraft 材质
  # amount: 1                                  # 图标数量
  # name: "传说之刃"                               # 图标名称
  # lore:                                      # 图标 Lore
  #   - "&7自定义图标说明"                      # Lore 文本
  # custom-model-data: 0                       # 自定义模型数据
  # glow: true                                 # 是否显示附魔光效
  # skull-texture: "base64..."                 # 玩家头颅纹理
  # color: "#FF5555"                           # 可染色材质的颜色
  #
  # --- nbt写法二选一 ---
  # nbt:                                       # 图标 NBT 键值映射写法，与下方整段 SNBT 写法二选一
  #   CustomTag: "value"                       # 图标 NBT 键值
  # 或者
  # nbt: "{CustomTag:'value',Unbreakable:1b}"  # 图标 NBT 整段 SNBT 写法，与上方键值映射二选一
  #
  # ---ArcartX 读取物品的 icon / url NBT 来渲染自定义贴图（详见ArcartX wiki：自定义物品贴图）---
  # texture: "item"                            # 写入 icon NBT，渲染 resource/item_icon/ 下的贴图（手持 / AX-UI）；子目录用 "xxx/xxx"
  # texture-url: "menu/icon.png"               # 写入 url NBT，仅用于原版 GUI(箱子菜单)图标，支持文件路径 / 网络链接 / GIF
  ############################################################
  # --- 直接发送 json/NBT 给 slot 控件（完全自定义物品） ---
  # json: '{"id":"minecraft:diamond","Count":1b}'  # 完整物品 JSON；配置后不再叠加其它字段或 texture/texture-url/nbt
  ####################################################################################################################

cost:
  single:
    - type: CURRENCY
      id: "gem"
      amount: 160
      display-name: "原石"
      icon:
        material: DIAMOND
        name: "原石"
    - type: POINT
      id: "stardust"
      amount: 1
      display-name: "星尘"
      icon:
        material: AMETHYST_SHARD
        name: "星尘"
  ten:
    - type: CURRENCY
      id: "gem"
      amount: 1600
      display-name: "原石"
      icon:
        material: DIAMOND
        name: "原石"
    - type: POINT
      id: "stardust"
      amount: 10
      display-name: "星尘"
      icon:
        material: AMETHYST_SHARD
        name: "星尘"

# 积分产出规则：gacha 的 rarity key 使用星级（3/4/5），case 使用奖池中定义的 rarity 名称
points:
  stardust:
    display-name: "星尘"
    icon:
      material: AMETHYST_SHARD
      name: "星尘"
    per-pull: 1
    rarity:
      "4": 2
      "5": 10

gacha:  # 祈愿机制参数
  pool-type: WEAPON  # 卡池类型：WEAPON（武器池）
  pity-5star: 80  # 5星硬保底抽数（武器池比角色池少10抽）
  pity-4star: 10  # 4星硬保底抽数
  soft-pity-start: 63  # 软保底起始抽数（之后概率递增）
  soft-pity-increment: 0.07  # 软保底每次递增量
  base-5star-rate: 0.007  # 5星基础概率（0.7%）
  base-4star-rate: 0.06  # 4星基础概率（6%）
  up-rate: 0.75  # UP 物品在对应星级中的概率（75%，武器池比角色池高）
  fate-point-cap: 2  # 命定值上限（武器池专属机制：未命中UP累计命定值，满后必出UP）
  shared-pity-group: "weapon_events"  # 共享保底分组（同组卡池共享保底计数）

  up-5star-items:  # UP 5星物品池（概率提升）
    legend_blade:
      name: "传说之刃"  # 物品显示名称
      item:
        source: neigeitems
        id: "LottoLegendBlade"
      # 未配置 icon 时使用 item 生成的物品作为图标。
      delivery: DIRECT  # 发放方式：DIRECT（直接发放）
      weight: 1  # 权重（同池内相对概率）

  standard-5star-items:  # 常驻 5星物品池（未命中 UP 时的 fallback）
    epic_spear:
      name: "史诗长枪"
      item:
        source: mythicmobs
        id: "EpicSpear"
      delivery: DIRECT
      weight: 1

  up-4star-items:  # UP 4星物品池（概率提升）
    rare_dagger:
      name: "稀有匕首"
      item:
        source: neigeitems
        id: "RareDagger"
      delivery: DIRECT
      weight: 1

  standard-4star-items:  # 常驻 4星物品池（未命中 UP 时的 fallback）
    fine_staff:
      name: "精良法杖"
      item:
        source: neigeitems
        id: "FineStaff"
      delivery: DIRECT
      weight: 1

  star3-items:  # 3星物品池（保底之外的基础掉落）
    material_iron:
      name: "铁锭"
      item:
        source: minecraft
        id: "minecraft:iron_ingot"
      delivery: DIRECT
      weight: 1
