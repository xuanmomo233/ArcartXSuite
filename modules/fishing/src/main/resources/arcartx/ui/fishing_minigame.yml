# AXS 钓鱼小游戏界面（Menu 模式，星露谷风格）
# 左侧竖直轨道（鱼物品图标 + 绿条）+ 右侧信息面板 + 结果覆盖层
# 鱼图标使用 Slot 控件渲染 MC 物品图标（服务端发送 fishIconJson）

ui:
  isHud: false
  background: true
  escClose: false
  closeDied: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.fishId = packet['fishId']
      var.fishName = packet['fishName']
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.caughtSize = packet['caughtSize']
      var.rarity = packet['rarity']
      var.fishIconJson = packet['fishIconJson']
      var.fishInside = false
      var.rarityTag = var.rarity == 'legendary' ? '&6' : (var.rarity == 'rare' ? '&9' : (var.rarity == 'uncommon' ? '&a' : '&f'))
      var.rarityLabel = var.rarity == 'legendary' ? '传说' : (var.rarity == 'rare' ? '稀有' : (var.rarity == 'uncommon' ? '罕见' : '普通'))
      var.rarityColor = var.rarity == 'legendary' ? '255,200,50' : (var.rarity == 'rare' ? '80,140,240' : (var.rarity == 'uncommon' ? '100,220,120' : '200,200,200'))
      if(var.fishIconJson == none || var.fishIconJson == ''){
        var.fishIconJson = var.emptyItemJson
      }
      val.鱼图标.seticon()
    update: |-
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.fishInside = packet['fishInside']
  action:
    load: |-
      var.packetId = 'AXS_FISHING'
      var.fishId = none
      var.fishName = ''
      var.fishY = 0.5
      var.barY = 0.5
      var.barHeight = 0.24
      var.progress = 0.5
      var.state = 'playing'
      var.timeLeft = 600
      var.caughtSize = 0
      var.rarity = 'common'
      var.fishIconJson = ''
      var.fishInside = false
      var.rarityTag = '&f'
      var.rarityLabel = '普通'
      var.rarityColor = '200,200,200'
      var.emptyItemJson = '{"id":"minecraft:cod","Count":1b}'
    open: |-
      Packet.send(var.packetId, 'open_minigame')
    keyPress: |-
      if(self.currentKeyPress() == ' ' || self.currentKeyPress() == 'SPACE'){
        Packet.send(var.packetId, 'input', true)
      }
    keyRelease: |-
      if(self.currentKeyReleased() == ' ' || self.currentKeyReleased() == 'SPACE'){
        Packet.send(var.packetId, 'input', false)
      }
    click: |-
      Packet.send(var.packetId, 'input', true)
    release: |-
      Packet.send(var.packetId, 'input', false)

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      主卡片:
        type: Canvas
        val: "主卡片"
        attribute:
          point: ~middle_center
          width: 760
          height: 640
        children:
          卡片背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~14,30,48,235
              shape: ~round_rect
              radius: 20
            effect:
              stroke:
                width: 2
                color: ~60,170,200,100
              shadow:
                xOffset: 0
                yOffset: 6
                blur: 20
                color: ~0,0,0,180

          标题栏:
            type: Canvas
            attribute:
              x: 0
              y: 0
              width: 760
              height: 60
            children:
              标题背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~20,42,62,220
                  shape: ~round_rect
                  radius: 20
              标题文字:
                type: Text
                attribute:
                  x: 0
                  y: 14
                  width: 760
                  texts: "~&b&l钓鱼中"
                  fontSize: 32
                  center: true
                  through: true

          轨道区:
            type: Canvas
            val: "轨道区"
            attribute:
              x: 40
              y: 80
              width: 180
              height: 520
            children:
              轨道背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~8,20,35,220
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 2
                    color: ~50,160,190,120

              水深渐变:
                type: Texture
                attribute:
                  x: 6
                  y: 6
                  width: 168
                  height: 508
                  normal: ~12,28,42,255
                  shape: ~round_rect
                  radius: 12
                effect:
                  gradient:
                    color1: ~18,45,70,200
                    color2: ~8,22,38,200
                    type: 0
                    angleDeg: 90

              绿条:
                type: Texture
                attribute:
                  x: 12
                  y: "(1 - var.barY - var.barHeight / 2) * 508 + 6"
                  width: 156
                  height: "var.barHeight * 508"
                  normal: ~80,220,160,210
                  shape: ~round_rect
                  radius: 10
                  visible: "var.state == 'playing'"
                effect:
                  stroke:
                    width: 2
                    color: ~140,255,200,180
                  shadow:
                    xOffset: 0
                    yOffset: 0
                    blur: 8
                    color: ~100,255,180,100

              鱼图标:
                type: Slot
                val: 鱼图标
                attribute:
                  slotType: ~Icon
                  itemScale: 1.5
                  x: 66
                  y: "(1 - var.fishY) * 508 - 24 + 6"
                  width: 48
                  height: 48
                  normal: ~0,0,0,0
                  through: true
                  visible: "var.state == 'playing'"
                  seticon: "self.setItemIcon(var.fishIconJson != none && var.fishIconJson != '' ? var.fishIconJson : var.emptyItemJson)"

          信息面板:
            type: Canvas
            attribute:
              x: 250
              y: 80
              width: 470
              height: 520
            children:
              信息背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~12,28,42,200
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 1
                    color: ~50,160,190,60

              鱼名称区:
                type: Canvas
                attribute:
                  x: 20
                  y: 20
                  width: 430
                  height: 90
                children:
                  鱼名称背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: "var.rarityColor + ',40'"
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 1
                        color: "var.rarityColor + ',80'"
                  鱼名称:
                    type: Text
                    attribute:
                      x: 20
                      y: 22
                      width: 390
                      texts: "var.rarityTag + var.fishName"
                      fontSize: 40
                      through: true

              稀有度区:
                type: Canvas
                attribute:
                  x: 20
                  y: 130
                  width: 430
                  height: 56
                children:
                  稀有度背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: "var.rarityColor + ',30'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 1
                        color: "var.rarityColor + ',60'"
                  稀有度文字:
                    type: Text
                    attribute:
                      x: 20
                      y: 14
                      width: 390
                      texts: "var.rarityTag + '◆ ' + var.rarityLabel + '  &7尺寸: &f' + var.caughtSize + ' cm'"
                      fontSize: 26
                      through: true

              时间区:
                type: Canvas
                attribute:
                  x: 20
                  y: 206
                  width: 430
                  height: 56
                children:
                  时间背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~20,38,55,180
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 1
                        color: ~50,160,190,50
                  时间文字:
                    type: Text
                    attribute:
                      x: 20
                      y: 14
                      width: 390
                      texts: "'&7剩余时间: &f' + (var.timeLeft / 20).round() + ' 秒'"
                      fontSize: 26
                      through: true

              进度区:
                type: Canvas
                attribute:
                  x: 20
                  y: 282
                  width: 430
                  height: 90
                children:
                  进度标签:
                    type: Text
                    attribute:
                      x: 0
                      y: 0
                      width: 430
                      texts: "'&7进度: &f' + (var.progress * 100).round() + '%'"
                      fontSize: 24
                      through: true
                  进度条背景:
                    type: Texture
                    attribute:
                      x: 0
                      y: 36
                      width: 430
                      height: 40
                      normal: ~15,25,38,230
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 1
                        color: ~50,160,190,60
                  进度条填充:
                    type: Texture
                    attribute:
                      x: 3
                      y: 39
                      width: "var.progress * 424"
                      height: 34
                      normal: "var.progress >= 1.0 ? '100,220,140,255' : (var.fishInside ? '60,190,220,245' : '220,100,90,245')"
                      shape: ~round_rect
                      radius: 10

              操作提示区:
                type: Canvas
                attribute:
                  x: 20
                  y: 392
                  width: 430
                  height: 108
                children:
                  提示背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~18,32,48,180
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 1
                        color: ~50,160,190,40
                  提示标题:
                    type: Text
                    attribute:
                      x: 20
                      y: 14
                      width: 390
                      texts: "~&e操作说明"
                      fontSize: 24
                      through: true
                  提示内容:
                    type: Text
                    attribute:
                      x: 20
                      y: 48
                      width: 390
                      texts: "~&7按住 &f空格 &7或 &f鼠标 &7控制绿条"
                      fontSize: 22
                      through: true
                  提示内容2:
                    type: Text
                    attribute:
                      x: 20
                      y: 76
                      width: 390
                      texts: "~&7让绿条追踪鱼的位置以填满进度"
                      fontSize: 22
                      through: true

          结果覆盖层:
            type: Canvas
            attribute:
              point: ~middle_center
              width: 520
              height: 300
              visible: "var.state == 'success' || var.state == 'failed'"
            children:
              结果背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.state == 'success' ? '18,50,35,240' : '55,20,20,240'"
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 3
                    color: "var.state == 'success' ? '100,230,150,200' : '230,100,90,200'"
                  shadow:
                    xOffset: 0
                    yOffset: 6
                    blur: 20
                    color: ~0,0,0,180
              结果文字:
                type: Text
                attribute:
                  x: 0
                  y: 60
                  width: 520
                  texts: "var.state == 'success' ? '&a&l✓ 捕获成功！' : '&c&l✕ 鱼逃走了...'"
                  fontSize: 52
                  center: true
                  through: true
              结果详情:
                type: Text
                attribute:
                  x: 0
                  y: 140
                  width: 520
                  texts: "var.state == 'success' ? (var.rarityTag + var.fishName + ' &7尺寸: &f' + var.caughtSize + ' cm') : '&7再试一次吧'"
                  fontSize: 30
                  center: true
                  through: true
              结果稀有度:
                type: Text
                attribute:
                  x: 0
                  y: 190
                  width: 520
                  texts: "var.state == 'success' ? (var.rarityTag + '◆ ' + var.rarityLabel) : ''"
                  fontSize: 26
                  center: true
                  through: true
