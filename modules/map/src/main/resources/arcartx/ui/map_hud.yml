# AXS 资源说明
# 用途: Map 模块默认小地图 HUD。
# 前置依赖: ArcartX + Arcart-Suite-Map 客户端 mod；Map 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.map.enabled + modules.map.password
# 关联文件: ArcartXMap.yml、ui/map_menu.yml
# 重载命令: /axs map reload
#
# 小地图渲染由 Arcart-Suite-Map 客户端 mod 完全接管：
#   - UI 的 tick 每帧通过 axsmap.getMapRenderer().setHudAnchor() 传小地图右上角锚点
#   - mod 根据锚点和内部 hudSize 状态计算实际渲染区域，绘制圆形/方形小地图
#   - 坐标和世界名文字位置由 UI 根据 mapRenderer.getHudSize() 动态计算

ui:
  isHud: true
  background: false
  closeDied: true
  through: true
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.visible = packet['visible']
      var.worldId = packet['worldId']
      var.texture = packet['texture']
      var.imageWidth = packet['imageWidth']
      var.imageHeight = packet['imageHeight']
      var.hudZoom = packet['hudZoom']
      var.hudSize = packet['hudSize']
      var.clippedPlayerX = packet['clippedPlayerX']
      var.clippedPlayerZ = packet['clippedPlayerZ']
      var.playerYaw = packet['playerYaw']
      var.trackingText = packet['trackingText']
    update: |-
      var.packetId = packet['packetId']
      var.visible = packet['visible']
      var.worldId = packet['worldId']
      var.texture = packet['texture']
      var.imageWidth = packet['imageWidth']
      var.imageHeight = packet['imageHeight']
      var.hudZoom = packet['hudZoom']
      var.hudSize = packet['hudSize']
      var.clippedPlayerX = packet['clippedPlayerX']
      var.clippedPlayerZ = packet['clippedPlayerZ']
      var.playerYaw = packet['playerYaw']
      var.trackingText = packet['trackingText']
  action:
    load: |-
      var.packetId = 'AXS_MAP'
      var.visible = false
      var.worldId = none
      var.texture = none
      var.imageWidth = 0
      var.imageHeight = 0
      var.hudZoom = 0.18
      var.hudSize = 180
      var.clippedPlayerX = 0
      var.clippedPlayerZ = 0
      var.playerYaw = 0
      var.trackingText = '当前未导航'
      var.mapMod = none
      var.mapRenderer = none
      var.hudSizeDesign = 200
    tick: |-
      if(var.mapRenderer == none) {
        try {
          var.mapRenderer = axsmap.getMapRenderer()
        } catch(e) {
        }
      }
      if(var.mapRenderer != none && var.visible) {
        sx = Screen.getWidth() / 1920
        sy = Screen.getHeight() / 1080
        s = sx < sy ? sx : sy
        // 小地图右上角锚点：设计坐标系 (1920-28, 24)
        anchorX = Screen.getWidth() - 28 * s
        anchorY = 24 * s
        var.mapRenderer.setHudAnchor(anchorX, anchorY, s)
        // 读取 mod 实际 hudSize，换算回设计坐标系用于文字定位
        try {
          var.hudSizeDesign = var.mapRenderer.getHudSize() / s
        } catch(e2) {
          var.hudSizeDesign = 200
        }
      } elif(var.mapRenderer != none && !var.visible) {
        var.mapRenderer.deactivate()
      }
    close: |-
      if(var.mapRenderer != none) {
        var.mapRenderer.deactivate()
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_right
      width: 1920
      height: 1080
    children:
      小地图文字区:
        type: Canvas
        attribute:
          point: ~top_right
          x: -28
          y: "24 + var.hudSizeDesign + 8"
          width: "var.hudSizeDesign"
          height: 80
          visible: var.visible
        children:
          世界名称:
            type: Text
            attribute:
              point: ~top_center
              texts: "'&f' + var.worldId"
              fontSize: 32
              through: true
          坐标:
            type: Text
            attribute:
              point: ~top_center
              y: 36
              texts: "'&fX: ' + var.clippedPlayerX + '  Z: ' + var.clippedPlayerZ"
              fontSize: 32
              through: true
