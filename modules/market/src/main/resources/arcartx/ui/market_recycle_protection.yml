                        attribute:
                          slotType: ~Icon
                          x: 14
                          y: 14
                          width: 78
                          height: 78
                          itemScale: 0.72
                          seticon: "self.setItemIcon(var.icons[self.parent.entryKey])"
                      保护物品名:
                        type: Scroll
                        attribute:
                          x: "112"
                          y: "18"
                          width: "var.pageW - 430"
                          height: 40
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
