# 文件用途: 武器活动祈愿卡池数据定义。
# 定义武器活动祈愿的消耗、保底机制、概率参数和各星级物品池（UP/常驻）。
# 类型为 GACHA（原神祈愿），5星保底80抽，UP武器概率75%，命定值上限2点。

id: "weapon_event_1"  # 卡池唯一标识
type: GACHA  # 卡池类型：GACHA（原神祈愿）
enabled: true  # 是否启用
display-name: "武器活动祈愿"  # 显示名称
description: |-  # 卡池描述文本
  武器活动祈愿
  在本祈愿中，5星武器「传说之刃」的获取概率将大幅提升！
  5星保底80抽，4星保底10抽，UP武器概率75%，命定值上限2点。
up-item-icon: '{"id":"minecraft:diamond_sword","Count":1b}'  # UP 物品图标（JSON 格式）
# up-item-icon、points.*.icon 与奖品的 icon 都支持完整图标定义（与 Menu 模块一致）：
#   material / amount / name / lore / custom-model-data / glow
#   skull-texture / color / source + id / mmo-type + mmo-id
#   json / texture / texture-url / nbt
# nbt 支持两种写法：
#   nbt:
#     CustomTag: "value"                       # 写法一：键值映射，逐个写入字符串标签
#   nbt: "{CustomTag:'value',Unbreakable:1b}"  # 写法二：整段 SNBT 字符串

cost:
  single:
    - type: CURRENCY
      id: "gem"
      amount: 160
      display-name: "原石"
    - type: POINT
      id: "stardust"
      amount: 1
      display-name: "星尘"
  ten:
    - type: CURRENCY
      id: "gem"
      amount: 1600
      display-name: "原石"
    - type: POINT
      id: "stardust"
      amount: 10
      display-name: "星尘"

# 积分产出规则：gacha 的 rarity key 使用星级（3/4/5），case 使用奖池中定义的 rarity 名称
points:
  stardust:
    display-name: "星尘"
    icon: "minecraft:amethyst_shard"
    per-pull: 1
    rarity:
      "4": 2
      "5": 10

gacha:  # 祈愿机制参数
  pool-type: WEAPON  # 卡池类型：WEAPON（武器池）
  pity-5star: 80  # 5星硬保底抽数（武器池比角色池少10抽）
  pity-4star: 10  # 4星硬保底抽数
  soft-pity-start: 63  # 软保底起始抽数（之后概率递增）
  soft-pity-increment: 0.07  # 软保底每次递增量
  base-5star-rate: 0.007  # 5星基础概率（0.7%）
  base-4star-rate: 0.06  # 4星基础概率（6%）
  up-rate: 0.75  # UP 物品在对应星级中的概率（75%，武器池比角色池高）
  fate-point-cap: 2  # 命定值上限（武器池专属机制：未命中UP累计命定值，满后必出UP）
  shared-pity-group: "weapon_events"  # 共享保底分组（同组卡池共享保底计数）

  up-5star-items:  # UP 5星物品池（概率提升）
    legend_blade:
      id: "weapon_legend"  # 物品唯一标识
      name: "传说之刃"  # 物品显示名称
      plugin-type: MythicMobs  # 物品来源插件类型：MythicMobs
      plugin-id: "LegendBlade"  # 物品来源插件内部 ID
      delivery: DIRECT  # 发放方式：DIRECT（直接发放）
      weight: 1  # 权重（同池内相对概率）

  standard-5star-items:  # 常驻 5星物品池（未命中 UP 时的 fallback）
    epic_spear:
      id: "weapon_epic"
      name: "史诗长枪"
      plugin-type: MythicMobs
      plugin-id: "EpicSpear"
      delivery: DIRECT
      weight: 1

  up-4star-items:  # UP 4星物品池（概率提升）
    rare_dagger:
      id: "weapon_rare"
      name: "稀有匕首"
      plugin-type: NeigeItems  # 物品来源插件类型：NeigeItems
      plugin-id: "RareDagger"
      delivery: DIRECT
      weight: 1

  standard-4star-items:  # 常驻 4星物品池（未命中 UP 时的 fallback）
    fine_staff:
      id: "weapon_common"
      name: "精良法杖"
      plugin-type: NeigeItems
      plugin-id: "FineStaff"
      delivery: DIRECT
      weight: 1

  star3-items:  # 3星物品池（保底之外的基础掉落）
    material_iron:
      id: "material_iron"
      name: "铁锭"
      plugin-type: PLAIN  # 物品来源类型：PLAIN（原版物品，非插件）
      plugin-id: "minecraft:iron_ingot"
      delivery: DIRECT
      weight: 1
