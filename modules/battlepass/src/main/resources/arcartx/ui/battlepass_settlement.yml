# Season expedition journal · 04 / end-of-season threshold ledger
# Read-only forecast, not a claim screen. Reward names retain per-region hover scrolling.
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    init: |-
      var.iconJsons = {}
      var.packetId = packet['packetId']
      var.seasonName = packet['seasonName']
      var.currentLevel = packet['currentLevel']
      var.premiumUnlocked = packet['premiumUnlocked']
      var.deluxeUnlocked = packet['deluxeUnlocked']
      var.settlements = packet['settlements']
      var.settlementCount = packet['settlementCount']
      for(i in range(0, var.settlementCount - 1)){
        for(j in range(0, 2)){
          key = i.round() + '_' + j.round()
          json = packet['iconJson' + key]
          if(json != none && json != ''){
            var.iconJsons[key] = json
          }else{
            var.iconJsons[key] = var.emptyItemJson
          }
        }
      }
      // Retain copy references across refreshes and include the index-zero template.
      if(val.卡片列表.childrenCount() != type.toNumber(var.settlementCount)){
        for(key in var.settlementRefs.keys()){
          var.settlementRefs[key].remove()
        }
        var.settlementRefs = {}
        var.settlementGeneration = (var.settlementGeneration + 1).round()
        template = val.卡片列表.get(0)
        template.entryKey = 0.round()
        for(i in range(1, var.settlementCount - 1)){
          key = i.round()
          e = template.copy('结算卡片_' + var.settlementGeneration + '_' + key)
          e.entryKey = key
          var.settlementRefs[key] = e
        }
      }
      if(type.toNumber(var.settlementCount) > 0){
        e = val.卡片列表.get(0)
        e['免费档区']['物品图标'].seticon()
        e['高级档区']['物品图标'].seticon()
        e['典藏档区']['物品图标'].seticon()
        for(key in var.settlementRefs.keys()){
          e = var.settlementRefs[key]
          e['免费档区']['物品图标'].seticon()
          e['高级档区']['物品图标'].seticon()
          e['典藏档区']['物品图标'].seticon()
        }
      }
  action:
    load: |-
      var.seasonName = '等待同步'
      var.packetId = 'AXS_BATTLEPASS'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.premiumUnlocked = 'false'
      var.deluxeUnlocked = 'false'
      var.currentLevel = 0
      var.settlementCount = 0
      var.settlements = {}
      var.iconJsons = {}
      var.settlementRefs = {}
      var.settlementGeneration = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.slotW = (var.contentW - 152) / 3
    # Server opens this page and pushes init after two ticks; no additional request.
    open: |-
      {}
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.slotW = (var.contentW - 152) / 3
controls:
  全屏玻璃底:
    type: Texture
    attribute: {point: ~stretch_all, normal: '~Frosted:16;24,29,51,235'}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶栏:
        type: Canvas
        attribute: {point: ~top_left, x: '-var.offX', width: var.viewW, height: 96}
        children:
          顶栏底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~29,35,62,255'}
          标题:
            type: Text
            attribute: {point: ~middle_left, x: 48, texts: '~&f战令 / 远征手记', fontSize: 48, through: true}
          赛季名:
            type: Text
            attribute: {point: ~middle_left, x: 540, texts: "'&e' + var.seasonName", fontSize: 36, through: true, limit: 24}
          关闭按钮:
            type: Canvas
            attribute: {point: ~middle_right, x: -48, width: 160, height: 52}
            action:
              clickLeft: Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~44,53,88,255', hover: '~62,73,111,255', shape: ~round_rect, radius: 6, through: true}
              关闭文字:
                type: Text
                attribute: {point: ~middle_center, texts: '~&f合上 / ESC', fontSize: 36, through: true}
      左侧导航:
        type: Canvas
        attribute: {point: ~top_left, x: '48 - var.offX', y: 120, width: 300, height: 'var.viewH - 144'}
        children:
          导航底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~187,140,66,255', shape: ~round_rect, radius: 8}
          目录标题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 26, texts: '~&0远征目录', fontSize: 48, through: true}
          目录副题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 84, texts: '~&0SEASON JOURNAL', fontSize: 36, through: true}
          导航总览:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 154, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_main')
            children:
              总览底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              总览文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0第一章 / 总览', fontSize: 36, through: true}
          导航奖励:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 238, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_rewards')
            children:
              奖励底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              奖励文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0第二章 / 奖励', fontSize: 36, through: true}
          导航任务:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 322, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_tasks')
            children:
              任务底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              任务文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0第三章 / 任务', fontSize: 36, through: true}
          导航结算:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 406, width: 268, height: 72}
            children:
              结算底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,40,70,255', shape: ~round_rect, radius: 6, through: true}
              结算文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&f04 / 终章结算', fontSize: 36, through: true}
          档位区标题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 530, texts: '~&0通行资格', fontSize: 48, through: true}
          免费状态:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 592, texts: '~&0免费 / 已激活', fontSize: 36, through: true}
          高级状态:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 644, texts: "var.premiumUnlocked == 'true' ? '&0高级 / 已激活' : '&0高级 / 未解锁'", fontSize: 36, through: true}
          典藏状态:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 696, texts: "var.deluxeUnlocked == 'true' ? '&0典藏 / 已激活' : '&0典藏 / 未解锁'", fontSize: 36, through: true}
          导航提示:
            type: Text
            attribute: {point: ~bottom_left, x: 24, y: -94, texts: ['~&0滚轮 / 拖动右侧滑块', '~&0悬停奖励可查看长名称'], fontSize: 36, through: true}
          页码:
            type: Text
            attribute: {point: ~bottom_left, x: 24, y: -32, texts: '~&004 / 04 · 结算', fontSize: 36, through: true}
      内容区:
        type: Canvas
        attribute: {point: ~top_left, x: '372 - var.offX', y: 120, width: var.contentW, height: 'var.viewH - 144'}
        children:
          内容底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~239,232,215,255', shape: ~round_rect, radius: 8}
          页标题:
            type: Text
            attribute: {point: ~top_left, x: 32, y: 28, texts: '~&0终章 / 赛季结算', fontSize: 64, through: true}
          页标题说明:
            type: Text
            attribute: {point: ~top_left, x: 34, y: 100, texts: '~&8按最终等级与已解锁档位自动发放，以下为季末奖励预览。', fontSize: 36, through: true}
          当前路标:
            type: Text
            attribute: {point: ~top_left, x: 34, y: 158, texts: "'&0当前等级 / Lv.' + var.currentLevel + '    &8阈值清单 / ' + var.settlementCount + ' 项'", fontSize: 36, through: true}
          结算滑轨:
            type: Texture
            attribute: {point: ~top_right, x: -20, y: 222, width: 14, height: 'var.viewH - 492', normal: '~207,197,174,255', shape: ~round_rect, radius: 6}
          结算滑块:
            val: 结算滑块
            type: Texture
            attribute: {point: ~top_right, x: -20, y: 222, width: 14, height: 120, maxDragY: 'var.viewH - 612', normal: '~187,140,66,255', hover: '~205,163,84,255', shape: ~round_rect, radius: 6}
          滚动区:
            type: Scroll
            attribute: {point: ~top_left, x: 28, y: 222, width: 'var.contentW - 80', height: 'var.viewH - 492', moveY: "self.parent['结算滑块'].getDragYRatio()"}
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['结算滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['结算滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              卡片列表:
                val: 卡片列表
                type: VStack
                attribute: {width: 'var.contentW - 80', spaceBetween: 20}
                children:
                  结算卡片:
                    type: Canvas
                    attribute: {entryKey: 0.round(), entry: 'var.settlements[self.entryKey]', visible: self.entry != none, width: 'var.contentW - 80', height: 216}
                    children:
                      卡片底:
                        type: Texture
                        attribute: {point: ~stretch_all, normal: '~228,219,198,255', shape: ~round_rect, radius: 6, through: true}
                      阈值路线:
                        type: Texture
                        attribute: {point: ~top_left, x: 4, y: 8, width: 6, height: 200, normal: "self.parent.entry['reached'] == 'true' ? '103,136,97,255' : '187,140,66,255'", through: true}
                      等级标签:
                        type: Text
                        attribute: {point: ~top_left, x: 28, y: 18, texts: "'&0路标 / Lv.' + self.parent.entry['minLevel']", fontSize: 48, through: true}
                      达到状态:
                        type: Text
                        attribute: {point: ~top_left, x: 360, y: 26, texts: "self.parent.entry['reached'] == 'true' ? '&2已达到等级阈值' : '&8尚未达到等级阈值'", fontSize: 36, through: true}
                      免费档区:
                        type: Canvas
                        attribute: {point: ~top_left, x: 24, y: 84, width: var.slotW, height: 112, iconKey: "self.parent.entryKey + '_0'", entry: self.parent.entry}
                        action:
                          enter: self['奖励名称滚动'].scrollAnim = Lerp(0, 1, 2000)
                          leave: self['奖励名称滚动'].scrollAnim = none
                        children:
                          免费区底:
                            type: Texture
                            attribute: {point: ~stretch_all, normal: '~247,241,226,255', shape: ~round_rect, radius: 4, through: true}
                          免费档标签:
                            type: Text
                            attribute: {point: ~top_left, x: 14, y: 12, texts: '~&0免费 / FREE', fontSize: 36, through: true}
                          物品图标:
                            type: Slot
                            attribute: {point: ~top_left, x: 14, y: 50, width: 56, height: 56, through: true, slotType: ~Icon, itemScale: 0.85, seticon: "self.setItemIcon(var.iconJsons[self.parent.parent.entryKey + '_0'])"}
                          奖励名称墨底:
                            type: Texture
                            attribute: {point: ~top_left, x: 78, y: 50, width: 'var.slotW - 90', height: 56, normal: '~32,40,70,255', shape: ~round_rect, radius: 4, through: true}
                          奖励名称滚动:
                            type: Scroll
                            attribute: {point: ~top_left, x: 84, y: 56, width: 'var.slotW - 98', height: 48, through: true, scrollAnim: none, moveX: 'self.scrollAnim != none ? self.scrollAnim.get() : 0'}
                            children:
                              横向排列:
                                type: HStack
                                attribute: {through: true, height: 48}
                                children:
                                  奖励名称:
                                    type: Text
                                    attribute: {through: true, texts: "self.parent.parent.parent.entry['free']['present'] == 'true' ? self.parent.parent.parent.entry['free']['name'] : '&8此档无奖励'", fontSize: 48}
                      高级档区:
                        type: Canvas
                        attribute: {point: ~top_left, x: '36 + var.slotW', y: 84, width: var.slotW, height: 112, iconKey: "self.parent.entryKey + '_1'", entry: self.parent.entry}
                        action:
                          enter: self['奖励名称滚动'].scrollAnim = Lerp(0, 1, 2000)
                          leave: self['奖励名称滚动'].scrollAnim = none
                        children:
                          高级区底:
                            type: Texture
                            attribute: {point: ~stretch_all, normal: '~247,241,226,255', shape: ~round_rect, radius: 4, through: true}
                          高级档标签:
                            type: Text
                            attribute: {point: ~top_left, x: 14, y: 12, texts: '~&6高级 / PREMIUM', fontSize: 36, through: true}
                          物品图标:
                            type: Slot
                            attribute: {point: ~top_left, x: 14, y: 50, width: 56, height: 56, through: true, slotType: ~Icon, itemScale: 0.85, seticon: "self.setItemIcon(var.iconJsons[self.parent.parent.entryKey + '_1'])"}
                          奖励名称墨底:
                            type: Texture
                            attribute: {point: ~top_left, x: 78, y: 50, width: 'var.slotW - 90', height: 56, normal: '~32,40,70,255', shape: ~round_rect, radius: 4, through: true}
                          奖励名称滚动:
                            type: Scroll
                            attribute: {point: ~top_left, x: 84, y: 56, width: 'var.slotW - 98', height: 48, through: true, scrollAnim: none, moveX: 'self.scrollAnim != none ? self.scrollAnim.get() : 0'}
                            children:
                              横向排列:
                                type: HStack
                                attribute: {through: true, height: 48}
                                children:
                                  奖励名称:
                                    type: Text
                                    attribute: {through: true, texts: "self.parent.parent.parent.entry['premium']['present'] == 'true' ? self.parent.parent.parent.entry['premium']['name'] : '&8此档无奖励'", fontSize: 48}
                      典藏档区:
                        type: Canvas
                        attribute: {point: ~top_left, x: '48 + 2 * var.slotW', y: 84, width: var.slotW, height: 112, iconKey: "self.parent.entryKey + '_2'", entry: self.parent.entry}
                        action:
                          enter: self['奖励名称滚动'].scrollAnim = Lerp(0, 1, 2000)
                          leave: self['奖励名称滚动'].scrollAnim = none
                        children:
                          典藏区底:
                            type: Texture
                            attribute: {point: ~stretch_all, normal: '~247,241,226,255', shape: ~round_rect, radius: 4, through: true}
                          典藏档标签:
                            type: Text
                            attribute: {point: ~top_left, x: 14, y: 12, texts: '~&5典藏 / DELUXE', fontSize: 36, through: true}
                          物品图标:
                            type: Slot
                            attribute: {point: ~top_left, x: 14, y: 50, width: 56, height: 56, through: true, slotType: ~Icon, itemScale: 0.85, seticon: "self.setItemIcon(var.iconJsons[self.parent.parent.entryKey + '_2'])"}
                          奖励名称墨底:
                            type: Texture
                            attribute: {point: ~top_left, x: 78, y: 50, width: 'var.slotW - 90', height: 56, normal: '~32,40,70,255', shape: ~round_rect, radius: 4, through: true}
                          奖励名称滚动:
                            type: Scroll
                            attribute: {point: ~top_left, x: 84, y: 56, width: 'var.slotW - 98', height: 48, through: true, scrollAnim: none, moveX: 'self.scrollAnim != none ? self.scrollAnim.get() : 0'}
                            children:
                              横向排列:
                                type: HStack
                                attribute: {through: true, height: 48}
                                children:
                                  奖励名称:
                                    type: Text
                                    attribute: {through: true, texts: "self.parent.parent.parent.entry['deluxe']['present'] == 'true' ? self.parent.parent.parent.entry['deluxe']['name'] : '&8此档无奖励'", fontSize: 48}
          空状态:
            type: Text
            attribute: {point: ~middle_center, texts: ['~&0结算清单尚未展开', '~&8当前没有赛季结算奖励可展示。'], fontSize: 36, visible: var.settlementCount == 0, through: true}
          底部说明:
            type: Canvas
            attribute: {point: ~bottom_left, x: 28, y: -20, width: 'var.contentW - 56', height: 98}
            children:
              说明底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,40,70,255', shape: ~round_rect, radius: 6}
              说明文字:
                type: Text
                attribute: {point: ~top_left, x: 24, y: 18, texts: ['~&f季末自动发放 / 此页无需领取。', '~&7最终等级与已解锁档位决定收获，未领取的等级奖励也会一并发放。'], fontSize: 36, through: true}
