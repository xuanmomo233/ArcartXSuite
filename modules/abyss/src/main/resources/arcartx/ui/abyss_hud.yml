# AXS 资源说明
# 用途: Abyss 副本内 HUD —— 副本名/波次/存活/剩余时间条/引导提示
# 由服务端在进本时打开、出本关闭；每秒 update 包刷新。
# 任务展示不在此渲染——委托给 QuestGPS guide HUD（含实时进度）与 Chemdah scoreboard。
ui:
  isHud: true
  defaultOpen: false
  through: true
  show: true
  packetHandler:
    # packetHandler: update
    # 包字段: dungeonName/status/groupTotal/groupDone/activeGroup/aliveMobs
    #         alivePlayers/totalPlayers/timeText/timeRatio/guideText
    update: |-
      var.dungeonName = packet['dungeonName']
      var.status = packet['status']
      var.groupTotal = packet['groupTotal']
      var.groupDone = packet['groupDone']
      var.activeGroup = packet['activeGroup']
      var.aliveMobs = packet['aliveMobs']
      var.alivePlayers = packet['alivePlayers']
      var.totalPlayers = packet['totalPlayers']
      var.timeText = packet['timeText']
      var.timeRatio = packet['timeRatio']
      var.guideText = packet['guideText']
  action:
    load: |-
      var.dungeonName = ''
      var.status = ''
      var.groupTotal = 0
      var.groupDone = 0
      var.activeGroup = ''
      var.aliveMobs = 0
      var.alivePlayers = 0
      var.totalPlayers = 0
      var.timeText = ''
      var.timeRatio = 1.0
      var.guideText = ''
      var.accent = '186,140,232,255'
      // 视口换算：Adaptive(1920x1080) 等比缩放后，贴边面板需要 offX 补偿
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      副本面板:
        type: Canvas
        attribute:
          point: ~top_right
          x: "-24 + var.offX"
          y: 496
          width: 320
          height: 224
          through: true
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~20,14,36,170
              shape: ~round_rect
              radius: 12
              through: true
            effect:
              stroke:
                width: 2
                color: ~96,80,140,160
          副本标线:
            type: Texture
            attribute:
              x: 16
              y: 18
              width: 18
              height: 3
              normal: var.accent
              through: true
          副本名:
            type: Text
            attribute:
              x: 42
              y: 8
              texts: "'&f' + var.dungeonName"
              fontSize: 36
              limit: 12
              through: true
          状态行:
            type: Text
            attribute:
              x: 16
              y: 56
              fontSize: 36
              through: true
              texts:
                - "'&8进度  &f' + var.groupDone.round() + '/' + var.groupTotal.round() + (var.activeGroup != '' && var.activeGroup != none ? '   &e' + var.activeGroup : '')"
                - "'&8怪物  &c' + var.aliveMobs.round() + '   &8队员  &a' + var.alivePlayers.round() + '/' + var.totalPlayers.round()"
          时间:
            type: Text
            attribute:
              x: 16
              y: 152
              texts: "'&8剩余时间  &f' + var.timeText"
              fontSize: 36
              through: true
          时间条背景:
            type: Texture
            attribute:
              point: ~bottom_left
              x: 16
              y: -18
              width: 288
              height: 8
              normal: ~40,32,62,220
              shape: ~round_rect
              radius: 4
              through: true
            effect:
              stroke:
                width: 1
                color: ~96,80,140,140
          时间条:
            type: Texture
            attribute:
              point: ~bottom_left
              x: 16
              y: -18
              width: "288 * var.timeRatio"
              height: 8
              normal: "var.timeRatio > 0.3 ? '186,140,232,240' : '235,100,100,240'"
              shape: ~round_rect
              radius: 4
              through: true
      引导面板:
        type: Canvas
        attribute:
          point: ~top_center
          y: 550
          width: 520
          height: 56
          visible: "var.guideText != '' && var.guideText != none"
          through: true
        children:
          引导背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~20,14,36,150
              shape: ~round_rect
              radius: 12
              through: true
            effect:
              stroke:
                width: 2
                color: ~96,80,140,120
          引导箭头:
            type: Text
            attribute:
              x: 18
              point: ~middle_left
              texts: ~&e➤
              fontSize: 36
              through: true
          引导文字:
            type: Text
            attribute:
              x: 56
              point: ~middle_left
              texts: "'&f' + var.guideText"
              fontSize: 36
              limit: 20
              through: true
      # 任务面板已移除：副本委托的进度/状态由 QuestGPS guide HUD 与
      # Chemdah scoreboard 呈现，abyss 不再自绘任务区。
