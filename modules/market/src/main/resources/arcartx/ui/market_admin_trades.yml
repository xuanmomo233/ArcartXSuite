                  x: 930
                  y: 40
                  width: 280
                  height: 40
                  length: 19
                  fontSize: 24
                action:
                  textChange: |-
                    var.until = self.getContent()
                    if(!var.hydrating){
                      var.updateDirty()
                    }
                  enter: |-
                    var.applyFilter()
              执行查询:
                type: Canvas
