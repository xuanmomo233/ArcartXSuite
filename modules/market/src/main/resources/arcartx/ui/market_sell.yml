          说明文本1:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 484
              texts: "~&801  从背包选货"
              fontSize: 36
              through: true
          说明文本2:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 520
              texts: "~&802  模式与货币"
              fontSize: 36
              through: true
          说明文本3:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 556
              texts: "~&803  核对报价"
              fontSize: 36
              through: true
          说明文本4:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 592
              texts: "~&8确认后整组上架"
              fontSize: 36
              through: true

      # ── 内容区（三区横排）──────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~242,237,223,255
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # ── 左区：背包选择 ──────────────────────────
          背包区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 24
              width: "var.sellLeftW"
              height: "var.backpackH"
            children:
              背包区底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~24,50,40,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              背包标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 16
                  texts: "~&f01 / 选择库存"
                  fontSize: 48
                  through: true
              背包提示:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 64
                  texts: "~&7点击选择要上架的物品"
                  fontSize: 36
                  through: true
              背包网格:
                type: HGrid
                attribute:
                  point: ~top_left
                  x: "(var.sellLeftW - 712) / 2"
                  y: 108
                  width: 712
                  column: 9
                  spaceBetweenX: 8
                  spaceBetweenY: 8
                action:
                  create: |-
                    for(i in range(1, 35)){
                      slot = self['背包槽'].copy('背包槽' + i.round())
                      slot.entryKey = (9 + i).round()
                      slot['背包槽位'].id = 9 + i
                    }
                children:
                  背包槽:
                    type: Canvas
                    attribute:
                      entryKey: 9.round()
                      width: 72
                      height: 72
                    action:
                      clickLeft: |-
                        item = self['背包槽位'].getSlotItemStack()
                        if(item != none && item.getType() != 'null' && item.getCount() > 0){
                          if(var.selectedSlot == self.entryKey){
                            var.selectedSlot = none
                            var.selectedItemName = none
                            var.selectedItemAmount = 0
                            var.selectedItemLore = none
                            var.selectedItemJson = var.emptyItemJson
                          } else {
                            var.selectedSlot = self.entryKey
                            var.selectedItemName = item.getName()
                            var.selectedItemAmount = item.getCount()
                            var.selectedItemLore = item.getLore()
                            var.selectedItemJson = item.toJson()
                          }
                          preview = val.信息面板['预览槽']
                          if(preview != none){
                            preview.seticon()
                          }
                          loreList = val.介绍列表
                          if(loreList != none){
                            while(loreList.childrenCount() > 1){
                              loreList.get(1).remove()
                            }
                            if(var.selectedSlot != none && var.selectedItemLore != none){
                              loreCount = var.selectedItemLore.length
                              for(i in range(1, loreCount - 1)){
                                e = loreList['介绍行'].copy('介绍行' + i.round())
                                e.entryKey = i.round()
                              }
                            }
                          }
                        }
                    children:
                      背包槽底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.parent.entryKey == var.selectedSlot ? '110,144,116,255' : '24,50,40,230'"
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 2
                            color: "self.parent.entryKey == var.selectedSlot ? '255,255,255,255' : '255,255,255,180'"
                      背包槽位:
                        type: Slot
                        attribute:
                          id: 9
                          slotType: ~Backpack
                          itemScale: 0.72
                          point: ~stretch_all
                          through: true
                          lock: true

          # ── 中区：信息面板 ──────────────────────────
          信息面板:
            type: Canvas
            val: 信息面板
            attribute:
              point: ~top_left
              x: "var.sellLeftW + 48"
              y: 24
              width: "var.sellInfoW"
              height: "var.viewH - 192"
            children:
              信息面板底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~24,50,40,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              信息标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 16
                  texts: "~&f03 / 核对物品"
                  fontSize: 48
                  through: true
              预览槽:
                type: Slot
                attribute:
                  slotType: ~Icon
                  itemScale: 0.72
                  x: 20
                  y: 64
                  width: 120
                  height: 120
                  normal: ~45,65,48,220
                  shape: ~round_rect
                  radius: 12
                  through: true
                  seticon: "self.setItemIcon(var.selectedItemJson)"
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              物品名称:
                type: Scroll
                attribute:
                  x: 152
                  y: 72
                  width: "var.sellInfoW - 172"
                  height: 48
                  scrollAnim: none
                  moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                action:
                  enter: "self.scrollAnim = Lerp(0, 1, 2200)"
                  leave: "self.scrollAnim = none"
                children:
                  名称布局:
                    type: HStack
                    attribute:
                      height: 48
                    children:
                      名称:
                        type: Text
                        attribute:
                          texts: "var.selectedItemName != none ? '&f' + var.selectedItemName : '&7先从左侧选择物品'"
                          fontSize: 48
                          through: true
              物品数量:
                type: Text
                attribute:
                  x: 152
                  y: 120
                  visible: "var.selectedSlot != none"
                  texts: "'&7数量: &f' + var.selectedItemAmount.round()"
                  fontSize: 36
                  through: true
              物品槽位:
                type: Text
                attribute:
                  x: 152
                  y: 160
                  visible: "var.selectedSlot != none"
                  texts: "'&7槽位: &f' + var.selectedSlot"
                  fontSize: 36
                  through: true
              介绍标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 208
                  texts: "~&f物品描述"
                  fontSize: 36
                  through: true
              介绍滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -12
                  y: 256
                  width: 8
                  height: "var.viewH - 688"
                  through: true
                  normal: ~24,50,40,225
                  shape: ~round_rect
                  radius: 4
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,230
              介绍滑块:
                type: Texture
                val: 介绍滑块
                attribute:
                  point: ~top_right
                  x: -12
                  y: 256
                  width: 8
                  height: 60
                  normal: ~183,149,86,255
                  maxDragY: "var.viewH - 748"
                  shape: ~round_rect
                  radius: 4
              介绍滚动:
                type: Scroll
                val: 介绍滚动
                attribute:
                  point: ~top_left
                  x: 20
                  y: 256
                  width: "var.sellInfoW - 52"
                  height: "var.viewH - 688"
                  moveY: "self.parent['介绍滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['介绍滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['介绍滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  介绍列表:
                    val: 介绍列表
                    type: VStack
                    attribute:
                      width: "var.sellInfoW - 52"
                      spaceBetween: 4
                    children:
                      介绍行:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          visible: "var.selectedItemLore != none && var.selectedItemLore[self.entryKey] != none"
                          texts: "'&7' + var.selectedItemLore[self.entryKey]"
                          fontSize: 36
                          through: true

              核对摘要:
                type: Canvas
                attribute:
                  point: ~bottom_left
                  x: 20
                  y: -20
                  width: "var.sellInfoW - 40"
                  height: 196
                children:
                  摘要底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~35,76,63,255
                      shape: ~round_rect
                      radius: 10
                      through: true
                  摘要模式:
                    type: Text
                    attribute:
                      x: 16
                      y: 16
                      texts: "var.selectedMode == 'auction' ? '&f拍卖行 / 起拍报价' : '&f玩家商店 / 一口价'"
                      fontSize: 36
                      through: true
                  摘要价格:
                    type: Text
                    attribute:
                      x: 16
                      y: 58
                      texts: "var.selectedPrice != none && var.selectedPrice != '' ? '&e报价  ' + var.selectedPrice : '&7请在左侧输入报价'"
                      fontSize: 48
                      through: true
                  摘要期限:
                    type: Text
                    attribute:
                      x: 16
                      y: 112
                      texts: "'&7期限  &f' + (var.selectedDuration / 86400).round() + '天'"
                      fontSize: 36
                      through: true
                  摘要提示:
                    type: Text
                    attribute:
                      x: 16
                      y: 152
