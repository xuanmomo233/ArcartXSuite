                          y: 0
                          width: "var.cardW - 6"
                          height: 370
                          through: true
                          normal: ~42,50,66,210
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
                      物品图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 0.72
                          x: 15
                          y: 12
                          width: 96
                          height: 96
                          normal: ~36,42,54,220
                          shape: ~round_rect
                          radius: 12
                          seticon: "self.setItemIcon(var.itemJsons[self.parent.entryKey] != none ? var.itemJsons[self.parent.entryKey] : var.emptyItemJson)"
                        children:
                          数量:
                            type: Text
                            attribute:
                              x: 5
                              y: 66
                              texts: "self.parent.parent.entry != none && self.parent.parent.entry['itemAmount'] > 0 ? '&f' + self.parent.parent.entry['itemAmount'].round() : none"
                              fontSize: 30
                              through: true
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,230
                      收藏按钮:
                        type: Canvas
                        attribute:
                          enable: "!var.actionBusy && var.actionToken != ''"
                          x: "var.cardW - 45"
                          y: 12
                          width: 30
                          height: 30
                        action:
                          clickLeft: |-
                            var.actionBusy = true
                            Packet.send(var.packetId, 'auction_favorite', self.parent.entry['id'].round(), var.currentCategory, var.search, var.page, var.actionToken)
                        children:
                          收藏底:
                            type: Texture
                            attribute:
                              point: ~top_left
                              x: 2
                              y: 0
                              width: 26
                              height: 30
                              through: true
                              normal: ~36,42,54,220
                              shape: ~round_rect
                              radius: 8
                            effect:
                              stroke:
                                width: 2
                                color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
                          收藏文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "self.parent.parent.entry['isFavorite'] ? '&e★' : '&7☆'"
                              fontSize: 36
                              through: true
                      名称:
                        type: Text
                        attribute:
                          x: 123
                          y: 16
                          texts: "self.parent.entry != none ? ('&f' + self.parent.entry['name']) : ''"
                          fontSize: 36
                          through: true
                      卖家:
                        type: Text
                        attribute:
                          x: 123
                          y: 52
                          texts: "self.parent.entry != none ? ('&7卖家: &f' + self.parent.entry['seller']) : ''"
                          fontSize: 32
                          through: true
                      低价:
                        type: Text
                        attribute:
                          x: 123
                          y: 88
                          texts: "self.parent.entry != none ? '&e起拍价: &f' + self.parent.entry['price'] : ''"
                          fontSize: 32
                          through: true
                      当前出价:
                        type: Text
                        attribute:
                          x: 123
                          y: 124
                          texts: "self.parent.entry != none ? '&7当前出价: &f' + self.parent.entry['bid'] : ''"
                          fontSize: 32
                          through: true
                      留言:
                        type: Scroll
                        attribute:
                          x: 123
                          y: 160
                          width: "var.cardW - 138"
                          height: 36
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: |-
                            self.scrollAnim = Lerp(0, 1, 2000)
                          leave: |-
                            self.scrollAnim = none
                        children:
                          留言布局:
                            type: HStack
                            attribute:
                              height: 36
                            children:
                              留言文本:
                                type: Text
                                attribute:
                                  x: 0
                                  y: 0
                                  texts: "'&7留言: &f' + (self.parent.parent.parent.entry['message'] != none && self.parent.parent.parent.entry['message'] != '' ? self.parent.parent.parent.entry['message'] : '无')"
                                  fontSize: 32
                                  through: true
                      剩余时间:
                        type: Text
                        attribute:
                          x: 123
                          y: 196
                          visible: "self.parent.entry != none && !self.parent.entry['closed']"
                          texts: "self.parent.entry != none && self.parent.entry['remainingSeconds'] > var.elapsed ? '&7剩余: &a' + (self.parent.entry['remainingSeconds'] - var.elapsed).round() + ' 秒' : '&7已到期，等待服务端结算'"
                          fontSize: 32
                          through: true
                      领先与状态:
                        type: Text
                        attribute:
                          x: 15
                          y: 242
                          texts: "self.parent.entry != none ? '&b' + self.parent.entry['status'] + ' &7| 领先: ' + self.parent.entry['highest'] : ''"
                          fontSize: 26
                          through: true
                      下次最低出价:
                        type: Text
                        attribute:
                          x: 15
                          y: 278
                          visible: "self.parent.entry != none && self.parent.entry['canBid']"
                          texts: "self.parent.entry != none ? '&7下次最低: &e' + self.parent.entry['minBid'] + ' ' + self.parent.entry['currencyName'] : ''"
                          fontSize: 26
                          through: true
                      按钮组:
                        type: HStack
                        attribute:
                          x: 15
                          y: 318
                          width: "var.cardW - 30"
                          height: 40
                          spaceBetween: 12
                        children:
                          查看拍品:
                            type: Canvas
                            attribute:
                              width: "(var.cardW - 42) / 2"
                              height: 46
                              enable: "!var.actionBusy"
                            action:
                              clickLeft: |-
                                Packet.send(var.packetId, 'auction_room_ui_open', self.parent.parent.entry['id'].round())
                            children:
                              底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~48,59,77,235
                                  shape: ~round_rect
                                  radius: 8
                              文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "~&f查看拍品实录"
                                  fontSize: 26
                                  through: true
                          出价按钮:
                            type: Canvas
                            attribute:
                              width: "(var.cardW - 42) / 2"
                              height: 40
                              visible: "self.parent.parent.entry != none && self.parent.parent.entry['canBid'] && !self.parent.parent.entry['canCancel']"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                Packet.send(var.packetId, 'auction_room_ui_open', self.parent.parent.entry['id'].round())
                            children:
                              出价底:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 3
                                  y: 0
                                  width: "self.parent.width - 6"
                                  height: 40
                                  through: true
                                  normal: ~220,150,50,230
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  ripple:
                                  stroke:
                                    width: 3
                                    color: "self.isHovered() ? '255,180,60,255' : '255,255,255,230'"
                              出价文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "self.parent.parent.parent.entry['isHighest'] ? '&f进入竞价厅' : '&f参与竞价'"
                                  fontSize: 32
                                  through: true
                          取消按钮:
                            type: Canvas
                            attribute:
                              width: "(var.cardW - 42) / 2"
                              height: 40
                              visible: "self.parent.parent.entry != none && self.parent.parent.entry['canCancel']"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.tradeId = self.parent.parent.entry['id'].round()
                                var.tradeMode = 'cancel'
                                var.tradeConfirmText = '确认下架？已有出价时能否下架由服务端规则决定。'
                                var.executeTrade = -> {
                                  Packet.send(var.packetId, 'auction_cancel', var.tradeId, var.actionToken, var.page, var.currentCategory, var.search)
                                }
                                var.showTradeConfirm = true
                            children:
                              取消底:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 3
                                  y: 0
                                  width: "self.parent.width - 6"
                                  height: 40
                                  through: true
                                  normal: ~220,90,90,230
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  ripple:
                                  stroke:
                                    width: 3
                                    color: "self.isHovered() ? '255,120,120,255' : '255,255,255,230'"
                              取消文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "~&f取消"
                                  fontSize: 32
                                  through: true
          # ── 底部分页栏 ──────────────────────────────
          上一页:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: "var.viewH - 248"
              width: 130
              height: 48
              enable: "var.page > 0"
            action:
              clickLeft: |-
                if(var.page > 0){
                  Packet.send(var.packetId, 'auction_list', (var.page - 1), var.currentCategory, var.search)
                }
            children:
              上一页底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              上一页文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f< 上一页"
                  fontSize: 36
                  through: true
          页码:
            type: Text
            attribute:
              point: ~middle_center
              x: 0
              y: "var.viewH - 240"
              texts: "'&f' + var.pageText"
              fontSize: 36
          下一页:
            type: Canvas
            attribute:
              point: ~top_right
              x: -24
              y: "var.viewH - 248"
              width: 130
              height: 48
              enable: "var.page < var.totalPages - 1"
            action:
              clickLeft: |-
                if(var.page < var.totalPages - 1){
                  Packet.send(var.packetId, 'auction_list', (var.page + 1), var.currentCategory, var.search)
                }
            children:
              下一页底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              下一页文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f下一页 >"
                  fontSize: 36
                  through: true

  交易确认弹窗:
    type: Canvas
    attribute:
      point: ~stretch_all
      visible: "var.showTradeConfirm == true"
    children:
      遮罩:
        type: Texture
        attribute:
          point: ~stretch_all
          normal: ~0,0,0,180
      面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 800
          height: "var.tradeMode == 'bid' ? 580 : 260"
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~36,38,48,245
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 24
              texts: "var.tradeMode == 'bid' ? '&f竞价：' + var.tradeName : '&f确认下架'"
              fontSize: 36
              through: true
          内容:
            type: Text
            attribute:
              point: ~top_center
              y: 80
              texts: "var.tradeMode == 'bid' ? var.bidReason : var.tradeConfirmText"
              fontSize: 28
              through: true
          自定义出价输入:
            type: TextBox
            val: 自定义出价输入
            attribute:
              point: ~top_center
              y: 140
              width: 260
              height: 44
              length: 32
              inputPattern: "^[0-9.]*$"
              emptyText: "~&7输入你的出价"
              visible: "var.tradeMode == 'bid'"
              editable: "!var.quoteBusy && !var.actionBusy"
              fontSize: 32
            action:
              textChange: |-
                var.tradeAmount = self.getContent()
                var.bidDirty = true
              enter: |-
                var.quoteBusy = true
                Packet.send(var.packetId, 'auction_quote', var.tradeId, var.tradeAmount)
          最低出价:
            type: Canvas
            attribute:
              point: ~top_center
              x: -280
              y: 138
              width: 160
              height: 48
              visible: "var.tradeMode == 'bid'"
              enable: "!var.quoteBusy && !var.actionBusy"
            action:
              clickLeft: |-
                var.quoteBusy = true
                Packet.send(var.packetId, 'auction_quote', var.tradeId, '0')
            children:
              文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&b最低有效出价"
                  fontSize: 26
                  through: true
          更新报价:
            type: Canvas
            attribute:
              point: ~top_center
              x: 280
              y: 138
              width: 160
              height: 48
              visible: "var.tradeMode == 'bid'"
              enable: "!var.quoteBusy && !var.actionBusy"
            action:
              clickLeft: |-
                var.quoteBusy = true
                Packet.send(var.packetId, 'auction_quote', var.tradeId, var.tradeAmount)
            children:
              文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&b更新报价"
                  fontSize: 26
                  through: true
          当前竞价:
            type: Text
            attribute:
              point: ~top_center
              y: 220
              visible: "var.tradeMode == 'bid'"
              texts: "'&7当前: ' + var.bidCurrent + '；领先: ' + var.bidHighest"
              fontSize: 24
              through: true
          最低金额:
            type: Text
            attribute:
              point: ~top_center
              y: 264
              visible: "var.tradeMode == 'bid'"
              texts: "'&7最低有效出价: &e' + var.bidMinimum"
              fontSize: 24
              through: true
          本次扣款:
            type: Text
            attribute:
              point: ~top_center
              y: 308
              visible: "var.tradeMode == 'bid'"
              texts: "'&7已冻结 ' + var.bidHeld + '；本次追加扣款 &e' + var.bidDebit"
              fontSize: 24
              through: true
          截止时间:
            type: Text
            attribute:
              point: ~top_center
              y: 352
              visible: "var.tradeMode == 'bid'"
              texts: "'&7当前截止时间: ' + var.bidDeadline"
              fontSize: 24
              through: true
          延时规则:
            type: Text
            attribute:
              point: ~top_center
              y: 396
              visible: "var.tradeMode == 'bid'"
              texts: "'&6' + var.bidProtection"
              fontSize: 24
              through: true
          扣款说明:
            type: Text
            attribute:
              point: ~top_center
              y: 440
              visible: "var.tradeMode == 'bid'"
              texts: "'&7被他人超价后原押金进入退款队列；领先者再次加价仅扣差额'"
              fontSize: 24
              through: true
          确认:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 90
              y: -24
              width: 240
              height: 48
              enable: "!var.actionBusy && var.actionToken != '' && (var.tradeMode == 'cancel' || (!var.quoteBusy && !var.bidDirty && var.bidCanSubmit))"
            action:
              clickLeft: |-
                var.showTradeConfirm = false
                var.actionBusy = true
                var.executeTrade()
            children:
              文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&a确认"
                  fontSize: 32
                  through: true
          取消:
            type: Canvas
            attribute:
              point: ~bottom_right
              x: -90
              y: -24
              width: 240
              height: 48
            action:
              clickLeft: |-
                var.showTradeConfirm = false
            children:
              文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f取消"
                  fontSize: 32
                  through: true
