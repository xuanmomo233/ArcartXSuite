# EntityTracker HUD payload: compact
# ArcartXEntityTracker Boss Tracker HUD
# AXS 资源说明
# 用途: EntityTracker 模块默认 HUD 模板，负责展示 Boss 血条、目标信息与伤害排行。
# 前置依赖: ArcartX、MythicMobs / MythicBukkit；EntityTracker 模块启用后会自动导出到 plugins/ArcartXSuite/ui。
# 启用开关: config.yml -> modules.entitytracker.enabled + modules.entitytracker.password
# 关联文件: ArcartXEntityTracker.yml
# 重载命令: /axs entitytracker reload
# 最小使用路径: ui + controls
# 结构提示: packetHandler 接收 Boss 快照，RepeatGrid 根据可见条目复用血条卡片。

ui:
  isHud: true                    # 是否为 HUD（常驻叠加层，不弹光标）
  through: false                 # 是否点击穿透
  background: false              # 是否绘制全屏背景遮罩
  closeDied: true                # 玩家死亡时是否自动关闭 HUD
  show: true                     # 是否显示
  level: 2                       # HUD 渲染优先级（越大越先渲染=越底层）
  screenScale: true              # 是否启用屏幕等比缩放
  defaultOpen: false             # 是否默认打开（由服务端 packet 驱动显隐）
  hide:                          # 本 HUD 存在时隐藏的原版 HUD 列表
    - boss_event_progress        # 隐藏原版 Boss 进度条，避免与自定义血条重叠
  # rows 只包含可见卡片，按服务端排序。totalBossCount 包含超出显示条数的 Boss。
  packetHandler:
    init: &bossSnapshot |-
      var.bossRows = packet['rows']
      var.totalBossCount = packet['totalBossCount']
      var.isVisible = true
    update: *bossSnapshot
    close: |-
      var.totalBossCount = 0
      var.isVisible = false
      var.bossRows = []
  action:
    load: |-
      var.bossRows = []
      var.totalBossCount = 0
      var.isVisible = false
# controls 为主要可视控件区块，可在此调整布局、材质与文本绑定。
controls:
  自适应全局布局:                   # 设计分辨率容器，整树等比缩放
    type: adaptive
    attribute:
      point: ~stretch_all           # 拉伸铺满整个屏幕
      width: 1920                   # 设计稿宽度
      height: 1080                  # 设计稿高度
    action:
      # create 会在 HUD 控件第一次创建时执行，准备好本地变量默认值，
      # 避免 HUD 刚打开但服务端数据包还没到时出现脏数据。
      create: |-
        var.isVisible = false
    children:
      首领追踪标题文字:               # 顶部标题，显示 "首领追踪 当前/总数"
        type: text
        attribute:
          point: ~top_center        # 锚点：顶部居中
          x: 0
          y: 32
          texts: "'&f首领追踪 &8' + var.bossRows.size().round() + '/' + var.totalBossCount.round()"
          fontSize: 36
          visible: var.isVisible
      血条排列布局:                   # 纵向排列容器，存放所有 Boss 血条卡片
        type: RepeatGrid
        attribute:
          items: var.bossRows
          key: ~id
          flow: ~row
          column: 1
          maxSize: "var.bossRows == none ? 0 : var.bossRows.size()"
          point: ~top_center
          x: 0
          y: 58
          width: 480
          spaceBetweenY: 8
          visible: var.isVisible
        children:
          # 每个可见槽位使用同一份卡片模板。
          Boss血条卡片模板:
            type: canvas
            attribute:
              width: 480
              height: 58
            children:
              Boss标题文字:           # Boss 名称（左上角）
                type: text
                attribute:
                  point: ~top_left
                  x: 0
                  y: 0
                  texts: "self.parent().item['title']"
                  fontSize: 36
              数值说明文字:           # 距离/排名/伤害信息（右上角）
                type: text
                attribute:
                  point: ~top_right
                  x: 0
                  y: 4
                  texts: "'&8' + self.parent().item['distance'] + '  R' + self.parent().item['rank'] + '  ' + self.parent().item['damage']"
                  fontSize: 24
              血条底框:              # 血条背景框（深色圆角条）
                type: texture
                attribute:
                  point: ~top_left
                  x: 0
                  y: 26
                  width: 480
                  height: 22
                  normal: ~30,30,30,220  # 深灰半透明底色
                  shape: ~round_rect
                  radius: 11
                effect:
                  stroke:           # 描边特效
                    width: 2
                    color: ~0,0,0,255
              血条层a:              # 血条分层a（暗红，progress>0 时显示）
                type: texture
                attribute:
                  point: ~top_left
                  x: 0
                  y: 26
                  width: "480 * self.parent().item['progress']"
                  height: 22
                  normal: ~140,60,60,255
                  shape: ~round_rect
                  radius: 11
                  visible: "self.parent().item['progress'] > 0"
              血条层b:              # 血条分层b（中红，progress>0.2 时显示）
                type: texture
                attribute:
                  point: ~top_left
                  x: 0
                  y: 26
                  width: "480 * self.parent().item['progress']"
                  height: 22
                  normal: ~180,50,50,255
                  shape: ~round_rect
                  radius: 11
                  visible: "self.parent().item['progress'] > 0.2"
              血条层c:              # 血条分层c（亮红，progress>0.4 时显示）
                type: texture
                attribute:
                  point: ~top_left
                  x: 0
                  y: 26
                  width: "480 * self.parent().item['progress']"
                  height: 22
                  normal: ~200,40,40,255
                  shape: ~round_rect
                  radius: 11
                  visible: "self.parent().item['progress'] > 0.4"
              血条层d:              # 血条分层d（鲜红，progress>0.6 时显示）
                type: texture
                attribute:
                  point: ~top_left
                  x: 0
                  y: 26
                  width: "480 * self.parent().item['progress']"
                  height: 22
                  normal: ~220,35,35,255
                  shape: ~round_rect
                  radius: 11
                  visible: "self.parent().item['progress'] > 0.6"
              血条层e:              # 血条分层e（最亮红，progress>0.8 时显示）
                type: texture
                attribute:
                  point: ~top_left
                  x: 0
                  y: 26
                  width: "480 * self.parent().item['progress']"
                  height: 22
                  normal: ~240,30,30,255
                  shape: ~round_rect
                  radius: 11
                  visible: "self.parent().item['progress'] > 0.8"
              血条文字:              # 血量数值文字（居中显示 当前/最大）
                type: text
                attribute:
                  point: ~top_center
                  x: 0
                  y: 27
                  texts: "'&f' + self.parent().item['health'] + '/' + self.parent().item['maxHealth']"
                  fontSize: 36
