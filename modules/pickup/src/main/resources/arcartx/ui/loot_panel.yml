                  itemName: "val.loot_slot_7.getSlotItemStack().getName()"
                  nameCode: "self.itemName.length() >= 2 ? self.itemName.substring(0, 2).toLowerCase() : 'uncolored'"
                  markColor: "var.nameColors[self.nameCode] != none ? var.nameColors[self.nameCode] : '161,169,155,255'"
                action:
                  clickLeft: |-
                    Packet.send('pickup', 'pick_7', var.actionToken)
                  enter: "self.scrollAnim = Lerp(0, 1, 2600)"
                  leave: "self.scrollAnim = none"
                children:
                  背景7:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "var.selectedIndex == 7 ? '66,70,43,255' : '43,48,39,244'", shape: ~round_rect, radius: 4, through: true}
                    effect:
                      stroke: {width: 'var.selectedIndex == 7 ? 2 : 1', color: "self.parent.isHovered() ? '235,210,143,255' : '133,122,87,255'"}
                  色签7:
                    type: Texture
                    attribute: {point: ~middle_left, x: 4, width: 4, height: 36, normal: 'self.parent.markColor', through: true}
                  图标7:
                    val: loot_slot_7
                    type: Slot
                    attribute: {point: ~middle_left, x: 44, width: 38, height: 38, slotType: ~Icon, normal: '~0,0,0,0', hover: '~0,0,0,0', itemScale: 0.8, through: true}
                  名称7:
                    type: Scroll
                    attribute: {point: ~middle_left, x: 94, width: 220, height: 36, moveX: 'self.parent.scrollAnim != none ? self.parent.scrollAnim.get() : 0', through: true}
                    children:
                      名称布局:
                        type: HStack
                        attribute: {height: 36, through: true}
                        children:
                          物品名称:
                            type: Text
                            attribute: {texts: "'&f' + val.loot_slot_7.getSlotItemStack().getName()", fontSize: 36, through: true}
                  序号7:
                    type: Text
                    attribute: {point: ~middle_left, x: 12, texts: "var.selectedIndex == 7 ? '&e>' : '&708'", fontSize: 36, through: true}
                  堆叠7:
                    type: Text
                    attribute: {point: ~middle_right, x: -14, texts: "'&ex' + var.item7Amount.round()", fontSize: 36, through: true}
          页脚分隔:
            type: Texture
            attribute: {point: ~bottom_left, x: 22, y: -86, width: 416, height: 1, normal: '~154,133,85,255', through: true}
          选中位置:
            type: Text
            attribute: {point: ~bottom_left, x: 24, y: -48, texts: "'&0' + (var.selectedIndex + 1).round() + '/' + var.count.round() + ' 选中'", fontSize: 36, through: true}
          拾取提示:
            type: Text
            attribute: {point: ~bottom_right, x: -24, y: -48, texts: "var.menuOpen ? '&0点击拾取' : '&0交互键'", fontSize: 36, through: true}
          色签说明:
            type: Text
            attribute: {point: ~bottom_left, x: 24, y: -8, texts: '~&8色签 = 物品名色', fontSize: 36, through: true}
