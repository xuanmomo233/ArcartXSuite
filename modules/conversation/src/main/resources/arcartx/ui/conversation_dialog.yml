# AXS 资源说明
# 用途: Conversation 模块默认对话 Menu（参考 对话.yml 布局 + 原神对话浮层风格改造）
# 前置依赖: ArcartX、Chemdah、Adyeshach；Conversation 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.conversation.enabled + modules.conversation.password
# 关联文件: ArcartXConversation.yml、ui/conversation_selector_hud.yml
# 重载命令: /axs conversation reload
# 最小使用路径: ui + controls
# 结构提示: 轻薄底栏浮于底部，底栏背景为左右两块渐变（中间实、两边透明）。
#          NPC名称和对话正文居中显示，选项区悬浮于底栏上方右侧。
#          选项条用 gradient 特效实现左侧圆角实色→右侧平头淡出。
#          选项高亮通过 isHovered() 表达式每帧自动判断。
# 服务端 sync 字段:
#   token, packetId, speakerName, messageLines, hintText, canReply,
#   selectedReplyId, selectedReplyIndex, replyCount, replyScrollRatio, replyRows
# replyRows 单行字段:
#   id, text, replyType, selected, index
# 客户端回包:
#   confirm_reply
# 回包格式:
#   action, token, targetId

ui:
  isHud: false
  defaultOpen: false
  through: false
  escClose: true
  background: false
  closeDied: true
  show: true
  screenScale: true
  packetHandler:
    # packetHandler: sync
    # 包字段:
    #   - token: 会话令牌，用于回包验证
    #   - packetId: 通信标识，用于 Packet.send 回包
    #   - speakerName: 说话人名称（NPC 名）
    #   - messageLines: 对话正文文本行列表
    #   - hintText: 底部提示文字
    #   - canReply: 是否允许玩家回复
    #   - selectedReplyId: 当前选中的回复 ID
    #   - selectedReplyIndex: 当前选中的回复索引
    #   - replyCount: 可选回复总数
    #   - replyScrollRatio: 回复列表滚动比例
    #   - replyRows: 回复行数据字典（每行含 id, text, replyType, selected, index）
    sync: |-
      var.token = packet['token']
      var.packetId = packet['packetId']
      var.speakerName = packet['speakerName']
      var.messageLines = packet['messageLines']
      var.hintText = packet['hintText']
      var.canReply = packet['canReply']
      var.selectedReplyId = packet['selectedReplyId']
      var.selectedReplyIndex = packet['selectedReplyIndex']
      var.replyCount = packet['replyCount']
      var.replyScrollRatio = packet['replyScrollRatio']
      var.replyRows = packet['replyRows']
      if(var.canReply == false){
        async{
          Thread.sleep(1500)
          if(var.canReply == false){
            Screen.close()
          }
        }
      }

      if(var.reply_listRows == none || var.reply_listRows.size() != (var.replyCount)){
        网格数据 = []
        if((var.replyCount) > 0){
          for(网格序号 in range(0, (var.replyCount) - 1)){
            网格数据.add(网格序号.round())
          }
        }
        var.reply_listRows = 网格数据
      }

    # packetHandler: close
    # 包字段:
    #   - packetId: 通信标识（可能为 none）
    close: |-
      var.packetId = packet['packetId'] == none ? none : packet['packetId']
  action:
    load: |-
          var.maxReplyWidth = 300
          var.replyRows = {}
    keyPress: |-
      var.k = self.currentKeyPress
      if(var.k >= "1" && var.k <= "9"){
        var.rowKey = (var.k - 1).round()
        if(var.replyRows[var.rowKey] != none){
          Packet.send(var.packetId, 'confirm_reply', var.token, var.replyRows[var.rowKey]['id'])
        }
      }
    tick: |-
      if(val.reply_list != none && val.reply_list.childrenCount() > 0){
        mw = 0
        for(i in range(0, val.reply_list.childrenCount() - 1)){
          row = val.reply_list.get(i.round())
          if(row != none && row['回复文字'] != none){
            mw = Math.max(mw, row['回复文字'].width)
          }
        }
        var.maxReplyWidth = mw + 80
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      底栏容器:
        type: Canvas
        attribute:
          point: ~bottom_center
          x: 0
          y: -28
          width: 1420
          height: 280
        children:
          底栏背景:
            type: Texture
            attribute:
              point: ~stretch_all
              x: 0
              y: 0
              width: 710
              height: 280
              normal: ~Frosted:30;0,0,0,200
              shape: ~round_rect
              radius: 15
            effect:
              stroke:
                width: 5
                color: ~255,255,255,255
          名称布局:
            type: Canvas
            attribute:
              width: self['NPC名称'].width + 70
              height: 70
              x: 70
              y: -35
            children:
              名称背景:
                type: Texture
                attribute:
                  normal: ~50,50,50,255
                  point: ~stretch_all
                  shape: ~round_rect
                  radius: 25
                effect:
                  stroke:
                    width: 3
                    color: ~200,200,200,255
              NPC名称:
                type: Text
                attribute:
                  point: ~middle_center
                  texts:
                    - "'&f' + var.speakerName"
                  fontSize: 56
          消息文字:
            type: Text
            attribute:
              point: ~top_left
              x: 70
              y: 70
              texts: var.messageLines
              fontSize: 48
          提示文字:
            type: Text
            attribute:
              point: ~bottom_left
              x: 16
              y: -16
              texts:
                - "~§7悬停选中选项，单击发送；键盘 1-9 直接发送。"
              fontSize: 36

          ### 本方案为滚动栏的方案，最多显示三个选项，需要鼠标轮滑翻页查看选项
          选项区:
            type: Canvas
            attribute:
              point: ~bottom_right
              y: -300
              width: var.maxReplyWidth + 10
              height: 178
            children:
              选项滑块:
                type: Texture
                val: 选项滑块
                attribute:
                  point: ~top_right
                  width: 4
                  height: 30
                  normal: ~150,150,150,255
                  maxDragY: 148
              选项滚动区:
                type: Scroll
                attribute:
                  width: var.maxReplyWidth + 5
                  height: 178
                  moveY: "self.parent['选项滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['选项滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['选项滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  选项列表:
                    type: RepeatGrid
                    val: reply_list
                    attribute:
                      items: "var.reply_listRows"
                      flow: ~row
                      column: 1
                      spaceBetweenY: 5
                      maxSize: "var.reply_listRows == none ? 0 : var.reply_listRows.size()"
                      width: var.maxReplyWidth
                    children:
                      回复模板:
                        type: Canvas
                        attribute:
                          entryKey: self.item
                          entry: "var.replyRows[self.entryKey] != none ? var.replyRows[self.entryKey] : none"
                          replyId: "self.entry != none ? self.entry['id'] : none"
                          visible: self.entry != none
                          width: var.maxReplyWidth
                          height: 56
                        action:
                          clickLeft: |-
                            if(self.entry != none && self.replyId != none){
                              Packet.send(var.packetId, 'confirm_reply', var.token, self.replyId)
                            }
                        children:
                          选项背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~Frosted:30;0,0,0,255
                              shape: ~round_rect
                              radius: 25
                            effect:
                              stroke:
                                width: 3
                                color: "self.parent.isHovered() ? '255,255,255,255' : '80,86,108,255'"
                          回复文字:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 14
                              y: 0
                              texts: "self.parent.entry['text']"
                              fontSize: 48
                              through: true
                          回复序号:
                            type: Text
                            attribute:
                              point: ~middle_right
                              x: -14
                              y: 0
                              texts: "'&8' + (self.parent.entry['index']+1).round()"
                              fontSize: 36
                              through: true

          # ### 本方案为无滚动栏的方案，能无限往上叠加选项，使用本方案请删除上面滚动栏方案
