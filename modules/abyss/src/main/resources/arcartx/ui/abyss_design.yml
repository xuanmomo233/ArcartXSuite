# AXS 资源说明
# 用途: Abyss 设计模式主面板 —— 流程节点链 + 当前节点对象列表 + 保存/退出
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
#
# 通讯协议:
#   服务端 → init/update: packetId/action_token/dungeonName/dungeonId/dirty/selNode/
#     nodeRows{idx:{key,label,depth,count}}/nodeCount/
#     objRows{idx:{key,icon,id,summary,dirty}}/objCount
#   客户端 → Packet.send('abyss', ...):
#     design_node <nodeKey> <token>        切节点
#     design_pick_open <nodeKey> <token>   开添加对象副面板
#     design_edit <objKey> <token>         开编辑面板
#     design_tp <objKey> <token>           传送到对象
#     design_del <objKey> <token>          删除对象
#     design_save <config|world> <token>   保存
#     design_exit <token>                  退出设计模式
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonName = packet['dungeonName']
      var.dungeonId = packet['dungeonId']
      var.dirty = packet['dirty']
      var.selNode = packet['selNode']
      var.nodeRows = packet['nodeRows']
      var.nodeCount = packet['nodeCount']
      var.objRows = packet['objRows']
      var.objCount = packet['objCount']
    update: |-
      var.dirty = packet['dirty']
      var.selNode = packet['selNode']
      var.nodeRows = packet['nodeRows']
      var.nodeCount = packet['nodeCount']
      var.objRows = packet['objRows']
      var.objCount = packet['objCount']
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.dungeonName = ''
      var.dungeonId = ''
      var.dirty = 0
      var.selNode = ''
      var.nodeRows = {}
      var.nodeCount = 0
      var.objRows = {}
      var.objCount = 0
      var.accent = '186,140,232,255'
      var.panelBg = '20,16,34,238'
    open: |-
      Sound.self('minecraft:block.note_block.pling', 0.8, 8)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;10,8,20,232
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      # ═══ 顶栏 ═══
      主面板:
        type: Texture
        attribute:
          point: ~middle_center
          width: 1440
          height: 760
          normal: var.panelBg
          shape: ~round_rect
          radius: 16
        effect:
          stroke:
            width: 2
            color: ~90,74,140,255
      标题:
        type: Text
        attribute:
          point: ~top_left
          x: 270
          y: 178
          texts: "'&f⚙ 设计模式 &7· &f' + var.dungeonName"
          fontSize: 44
          through: true
      未保存角标底:
        type: Texture
        attribute:
          point: ~top_right
          x: -560
          y: 174
          width: 96
          height: 44
