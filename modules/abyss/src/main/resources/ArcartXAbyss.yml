# ArcartXSuite Abyss — 地牢副本模块
# 地牢定义目录：plugins/ArcartX-Suite/data/abyss/abysses/<地牢ID>/
# 每个地牢目录包含: config.yml / monsters.yml / obstacles.yml / interacts.yml
#                   tasks.yml / rewards.yml / scripts.yml / npcs.yml / functions.* / world/(或 schematic)

abyss:
  # 世界实例名前缀（创建的地牢世界以此开头，便于清理识别）
  world-prefix: "axs_abyss_"
  # 实例清理超时（秒）：结束/无人实例超过该时间强制回收
  instance-cleanup-timeout: 7200
  # 实例检查周期（秒）：超时/无人在线检查间隔
  instance-check-interval: 30
  # 世界加载超时（毫秒）：复制+加载世界超时
  world-load-timeout: 120000
  # 单实例实体上限（防止副本内实体爆炸）
  max-entities-per-instance: 100
  # 是否启用 NMS 快速世界加载通道（失败自动回退 Bukkit API）
  nms-fast-load: true
  # 世界复制是否异步执行（大目录复制建议开启）
  async-world-copy: true
  # 副本无人后清理延迟（秒）：最后一名玩家退出/掉线后多久回收副本
  empty-cleanup-delay-seconds: 30
  # 副本内挂机踢出（分钟）：玩家处于 Essentials AFK 状态超过该时长则被移出副本
  # 0=关闭；需要 essentials 模块提供 AFK 判定，未安装时本项不生效
  afk-kick-minutes: 0
  # 副本预热池：启动后预先建好世界，进入时秒开
  preload:
    enabled: false
    # 严格模式：预热池空时禁止进入（false=回退即时创建）
    strict: false
    # 各地牢预热数量
    dungeons: {}
    # dungeons:
    #   skeleton_throne: 2

death:
  # 致命伤害检测：拦截致死伤害并判为副本死亡（保持玩家不死）
  fatal-damage-check: true
  # 不死图腾：玩家手持图腾时是否允许图腾救活（true=图腾生效不算死亡）
  allow-totem: true
  # 全队死亡判定模式: STRICT=全员死亡立即失败 / DELAYED=延迟判定(配合复活)
  team-wipe-mode: "STRICT"
  # 延迟判定模式下的判定延迟(tick)
  team-wipe-delay-ticks: 60

escape:
  # 防逃逸模式: BLOCK=拦截传送 / TELEPORT_BACK=拉回副本 / FAIL=逃逸判负
  mode: "BLOCK"
  # 是否拦截末影珍珠/紫颂果
  block-ender-pearl: true
  block-chorus-fruit: true
  # 是否拦截传送门
  block-portal: true
  # 是否拦截旁观传送（旁观死亡玩家点击实体跟随）
  block-spectate-teleport: true

restrictions:
  # 命令控制模式: NONE=不限制 / BLACKLIST=列表内禁用 / WHITELIST=仅列表内可用
  command-mode: "BLACKLIST"
  # 副本内禁用的命令（按主命令匹配；whitelist 模式下=允许的命令）
  blocked-commands:
    - "spawn"
    - "tpa"
    - "home"
    - "back"
    - "warp"
    - "tp"
  # 副本内禁用的消耗/使用物品（Material 名）
  blocked-items:
    - "CHORUS_FRUIT"
  # 是否禁止破坏/放置方块（false=允许，交给交互点判定）
  block-break: false
  block-place: false

party:
  # 队伍最大人数
  max-members: 4
  # 邀请超时（秒）
  invite-timeout: 60
  # 是否允许自定义队伍名/颜色
  allow-custom-name: true
  # 注意：副本奖励统一走 rewards.yml + ItemRewardDispatcher
  # （背包→仓库→邮件→离线暂存→掉落链），掉落物按原版归属击杀者拾取

stamina:
  # 体力系统开关
  enabled: true
  # 最大体力值
  max: 100
  # 回复速率：每 interval-seconds 秒回复 amount 点
  regen-amount: 1
  regen-interval-seconds: 300

leaderboard:
  enabled: true
  # 榜单类型与缓存行数
  size: 20
  # 通关后是否自动展示结算
  auto-show-complete: true

statistics:
  enabled: true
  # 记录伤害/承伤/治疗
  track-damage: true
  track-damage-taken: true
  track-healing: true
  # 副本结束后自动展示统计
  auto-show: true

storage:
  # sqlite（默认，共享宿主数据源）/ mysql（模块自建连接池）
  mode: "sqlite"
  sqlite-file-name: "abyss.db"
  host: "127.0.0.1"
  port: 3306
  database: "arcartxsuite"
  username: "root"
  password: ""
  table-prefix: "axs_abyss_"
  pool-size: 8

ui:
  # 是否在启用时注册 UI（ArcartX 客户端）
  register-on-enable: true
  # 更新是否覆盖 ui/ 目录下已存在的同名文件
  overwrite-ui-files: false
  # 地牢浏览器 UI
  browser-id: "abyss_browser"
  # 进本确认 UI
  confirm-id: "abyss_confirm"
  # 组队大厅 UI（无队伍时 /party 的入口）
  lobby-id: "abyss_lobby"
  # 队伍房间 UI
  party-id: "abyss_party"
  # 宝箱奖励 UI
  chest-id: "abyss_chest"
  # 战斗统计 UI
  stats-id: "abyss_stats"
  # 排行榜 UI
  leaderboard-id: "abyss_leaderboard"
  # 副本内 HUD
  hud-id: "abyss_hud"
  # 增益三选一面板（buffs.yml panel 池）
  buff-id: "abyss_buff"
  # 设计模式主面板（流程节点 + 对象列表）
  design-id: "abyss_design"
  # 设计模式添加对象副面板
  design-pick-id: "abyss_design_pick"
  # 设计模式对象编辑面板
  design-edit-id: "abyss_design_edit"

recovery:
  # 玩家非正常离开副本（掉线/崩服）后，下次进服执行恢复动作
  enabled: true
  # 动作格式与副本脚本 DSL 一致（单目标，无需选择器）:
  #   message <消息>                 title <in> <stay> <out> <主>|<副>
  #   console <命令>                 player_command <命令>
  #   teleport [世界] <x,y,z[,yaw,pitch]>   clear_inventory
  #   aria: <表达式>  js: <脚本>
  # {player} = 玩家名占位符, {dungeon} = 副本ID占位符
  actions:
    - "message &c你上次没有正常退出副本"

# 全服共享计数阈值表（脚本动作 global_add/global_set 累加，
# 首次跨越阈值时发 axs.abyss.global_threshold 事件供 eventpacket/外部订阅；
# global_reset 归零并清触发记录）
# 示例：
# global-thresholds:
#   reboot_key_fragments: [50, 100]
global-thresholds: {}

debug: false
