              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
            action:
              enter: |-
                self.scrollAnim = Lerp(0,1,2500)
              leave: |-
                self.scrollAnim = none
            children:
              文本:
                type: Text
                attribute:
                  x: 0
                  y: 0
                  texts: "'&7不取走物品 · ' + var.resultMsg"
