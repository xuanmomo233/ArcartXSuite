# AXS 资源说明
# 用途: Abyss 副本战斗统计 —— 击杀/伤害/承伤/治疗
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  background: true
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/dungeonName/statRows{idx:{name,kills,damage,taken,heal}}
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonName = packet['dungeonName']
      var.statRows = packet['statRows']
      var.stat0 = var.statRows != none ? var.statRows['0'] : none
      var.stat1 = var.statRows != none ? var.statRows['1'] : none
      var.stat2 = var.statRows != none ? var.statRows['2'] : none
      var.stat3 = var.statRows != none ? var.statRows['3'] : none
      var.stat4 = var.statRows != none ? var.statRows['4'] : none
      var.stat5 = var.statRows != none ? var.statRows['5'] : none
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      统计面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 620
          height: 460
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:24;24,28,38,190
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: ~110,148,204,140
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 18
              texts: "'&b&l战斗统计 &7- &f' + var.dungeonName"
              fontSize: 48
          表头:
            type: Text
            attribute:
              point: ~top_left
              x: 30
              y: 84
              texts: ~&8玩家                    击杀    伤害        承伤        治疗
              fontSize: 36
          行0:
            type: Text
            attribute:
              point: ~top_left
              x: 30
              y: 126
              texts: "var.stat0 != none ? '&f' + var.stat0['name'] + '    &c' + var.stat0['kills'].round() + '    &e' + var.stat0['damage'].round() + '    &7' + var.stat0['taken'].round() + '    &a' + var.stat0['heal'].round() : ''"
              fontSize: 36
          行1:
            type: Text
            attribute:
              point: ~top_left
              x: 30
              y: 170
              texts: "var.stat1 != none ? '&f' + var.stat1['name'] + '    &c' + var.stat1['kills'].round() + '    &e' + var.stat1['damage'].round() + '    &7' + var.stat1['taken'].round() + '    &a' + var.stat1['heal'].round() : ''"
              fontSize: 36
          行2:
            type: Text
            attribute:
              point: ~top_left
              x: 30
              y: 214
              texts: "var.stat2 != none ? '&f' + var.stat2['name'] + '    &c' + var.stat2['kills'].round() + '    &e' + var.stat2['damage'].round() + '    &7' + var.stat2['taken'].round() + '    &a' + var.stat2['heal'].round() : ''"
              fontSize: 36
          行3:
            type: Text
            attribute:
              point: ~top_left
              x: 30
              y: 258
              texts: "var.stat3 != none ? '&f' + var.stat3['name'] + '    &c' + var.stat3['kills'].round() + '    &e' + var.stat3['damage'].round() + '    &7' + var.stat3['taken'].round() + '    &a' + var.stat3['heal'].round() : ''"
              fontSize: 36
          行4:
            type: Text
            attribute:
              point: ~top_left
              x: 30
              y: 302
              texts: "var.stat4 != none ? '&f' + var.stat4['name'] + '    &c' + var.stat4['kills'].round() + '    &e' + var.stat4['damage'].round() + '    &7' + var.stat4['taken'].round() + '    &a' + var.stat4['heal'].round() : ''"
              fontSize: 36
          行5:
            type: Text
            attribute:
              point: ~top_left
              x: 30
              y: 346
              texts: "var.stat5 != none ? '&f' + var.stat5['name'] + '    &c' + var.stat5['kills'].round() + '    &e' + var.stat5['damage'].round() + '    &7' + var.stat5['taken'].round() + '    &a' + var.stat5['heal'].round() : ''"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~bottom_center
              y: -20
              width: 110
              height: 42
            action:
              clickLeft: "Screen.close()"
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~90,90,100,240
                  hover: ~115,115,128,250
                  shape: ~round_rect
                  radius: 10
                  through: true
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f关闭
                  fontSize: 36
                  through: true
