                    Packet.send('AXS:market_exchange_editor', 'shop', var.pendingShop)
                    }
                    if(kind == 'switch_offer'){
                    var.requestedOfferId = var.offers[var.pendingOffer.round()]['id']
                    var.busy = true
                    Packet.send('AXS:market_exchange_editor', 'offer', var.shopId, var.requestedOfferId)
                    }
                    if(kind == 'new_shop'){
                    var.mode = 'shop'
                    var.shopNew = true
                    var.shopId = ''
                    var.shopName = ''
