                    width: 3
                    color: ~112,83,64,235
              成员滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -28
                  y: 208
                  visible: "var.ownerType == 'shared'"
                  width: 10
                  height: "var.viewH - 506"
                  normal: ~53,40,33,245
                  shape: ~round_rect
                  radius: 5
                effect:
                  stroke:
                    width: 2
                    color: ~224,194,152,230
              成员滑块:
                type: Texture
                val: 成员滑块
                attribute:
                  point: ~top_right
                  x: -28
                  y: 208
                  visible: "var.ownerType == 'shared'"
                  width: 10
                  height: 50
                  normal: ~190,122,79,255
                  maxDragY: "var.viewH - 556"
                  shape: ~round_rect
                  radius: 5
              成员滚动:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 36
                  y: 208
                  visible: "var.ownerType == 'shared'"
                  width: "var.halfW - 96"
                  height: "var.viewH - 506"
                  moveY: "self.parent['成员滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['成员滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['成员滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  成员列表:
                    type: VStack
                    val: 成员列表
                    attribute:
                      width: "var.halfW - 96"
                      spaceBetween: 8
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.sharedMembers[self.entryKey]
                          visible: self.entry != none
                          width: "var.halfW - 96"
                          height: 58
                        action:
                          clickLeft: |-
                            var.memberName = var.sharedMemberNames[self.entryKey]
                        children:
                          项背景:
                            type: Texture
                            attribute:
                              point: ~middle_center
                              width: "self.parent.width - 6"
                              height: "self.parent.height"
                              through: true
                              normal: "var.memberName == var.sharedMemberNames[self.parent.entryKey] ? '105,66,47,250' : '56,43,36,255'"
                              shape: ~round_rect
                              radius: 12
                            effect:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '241,208,157,255' : (var.memberName == var.sharedMemberNames[self.parent.entryKey] ? '226,179,124,255' : '112,83,64,235')"
                          成员名文字:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 16
                              texts: "'&f' + var.sharedMemberNames[self.parent.entryKey]"
                              fontSize: 36
                              limit: "var.halfW - 290"
                              through: true
                          身份切换:
                            type: Canvas
                            attribute:
                              point: ~middle_right
                              x: -60
                              width: 110
                              height: 40
                              enable: "!var.actionBusy"
                            action:
                              clickLeft: |-
                                currentRole = var.sharedMemberRoles[self.parent.entryKey]
                                newRole = currentRole == 'viewer' ? 'member' : 'viewer'
                                var.actionBusy = true
                                Packet.send(var.packetId, 'shared_invite', var.ownerId, var.sharedMemberNames[self.parent.entryKey], newRole, var.actionToken)
                            children:
                              身份底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~56,43,36,255
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  stroke:
                                    width: 2
                                    color: "self.isHovered() ? '241,208,157,255' : '112,83,64,235'"
                              身份文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "var.sharedMemberRoles[self.parent.parent.entryKey] == 'viewer' ? '&f' + var.sharedRoleViewerName : '&f' + var.sharedRoleMemberName"
                                  fontSize: 36
                                  through: true
                          移除:
                            type: Canvas
                            attribute:
                              point: ~middle_right
                              x: -12
                              width: 40
                              height: 40
                              enable: "!var.actionBusy"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'shared_remove', var.ownerId, var.sharedMemberNames[self.parent.entryKey], var.actionToken)
                            children:
                              移除底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~56,43,36,255
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  stroke:
                                    width: 2
                                    color: "self.isHovered() ? '235,100,100,255' : '112,83,64,235'"
                              移除文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "~&c✕"
                                  fontSize: 36
                                  through: true
              转让:
                type: Canvas
                attribute:
                  point: ~bottom_left
                  x: 20
                  y: -24
                  visible: "var.ownerType == 'shared'"
                  width: "var.halfW - 60"
                  height: 48
                  enable: "!var.actionBusy && var.actionToken != '' && var.unlocked && var.hasPassword"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send(var.packetId, 'shared_transfer', var.ownerId, var.memberName, var.actionToken)
                children:
                  转让底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~56,43,36,255
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '241,208,157,255' : '112,83,64,235'"
                  转让字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.memberName != none ? '&c转让所有权  /  &f' + var.memberName : '&7在名册中选中成员后转让所有权'"
                      fontSize: 36
                      limit: "var.halfW - 92"
                      through: true
