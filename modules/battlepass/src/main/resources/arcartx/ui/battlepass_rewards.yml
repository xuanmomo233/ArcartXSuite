# AXS BattlePass 奖励界面
# 打开方式: Packet.send(packetId, 'open_rewards') 或 /bp rewards
# 数据交互: packetHandler rewards
# 布局: 横向滚动按等级排列，每个等级竖向排列 free/premium/deluxe 三个档位奖励卡片

ui:
  isHud: false
  background: true
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    # packetHandler: rewards
    # 接收奖励列表数据包，动态生成等级列子元素
    # 包字段:
    #   - packetId: 包标识符
    #   - levels: 等级映射（key 为等级字符串，含 level/reached/freeEntryKey/premiumEntryKey/deluxeEntryKey）
    #   - rewards: 奖励映射（key 为序号，含 level/tier/tierDisplay/tierKey/claimed/claimable/locked/levelReached/type）
    #   - iconJsonN: 每个奖励的图标 itemJson（flat 字段，N 为序号）
    #   - levelCount: 等级数量
    #   - rewardCount: 奖励条目总数
    #   - currentLevel: 玩家当前战令等级
    #   - action_token: 操作令牌
    rewards: |-
      var.packetId = packet['packetId']
      var.levels = packet['levels']
      var.rewards = packet['rewards']
      var.levelCount = packet['levelCount']
      var.rewardCount = packet['rewardCount']
      var.currentLevel = packet['currentLevel']
      var.actionToken = packet['action_token']
      // 构建 iconJsons 映射（从 flat 字段 iconJsonN 收集）
      var.iconJsons = {}
      for(i in range(0, var.rewardCount - 1)){
        key = i.round()
        json = packet['iconJson' + key]
        if(json != none && json != ''){
          var.iconJsons[key] = json
        }
      }
      // 动态生成等级列（模板在索引0，复制 1~count-1 共 count-1 项）
      while(val.等级列表.childrenCount() > 1){
        val.等级列表.get(1).remove()
      }
      for(i in range(1, var.levelCount)){
        key = i.round()
        e = val.等级列表['等级列'].copy('等级列' + key)
        e.levelKey = key
      }
      // 数据就绪后触发每个奖励图标的 seticon()，否则 Slot 的 seticon 属性不会自动生效
      for(i in range(1, var.levelCount)){
        key = i.round()
        e = val.等级列表['等级列' + key]
        if(e != none){
          e['免费档卡片']['物品图标'].seticon()
          e['高级档卡片']['物品图标'].seticon()
          e['典藏档卡片']['物品图标'].seticon()
        }
      }
  action:
    load: |-
      var.packetId = 'AXS_BATTLEPASS'
      var.levels = {}
      var.rewards = {}
      var.iconJsons = {}
      var.levelCount = 0
      var.rewardCount = 0
      var.currentLevel = 0
      var.actionToken = ''
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
    open: |-
      Packet.send(var.packetId, 'open_rewards')

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      through: true
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1200
          height: 720
        children:
          # ── 面板背景层 ─────────────────────────────────────
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~20,22,32,245
              shape: ~round_rect
              radius: 24
            effect:
              gradient:
                color1: ~30,32,46,255
                color2: ~18,20,28,255
                type: 0
                angleDeg: 90
              stroke:
                width: 2
                color: ~255,170,90,120
              shadow:
                xOffset: 0
                yOffset: 8
                blur: 28
                color: ~0,0,0,180
          内描边:
            type: Texture
            attribute:
              point: ~middle_center
              width: 1180
              height: 700
              normal: ~0,0,0,0
              shape: ~round_rect
              radius: 20
              through: true
            effect:
              stroke:
                width: 1
                color: ~255,180,100,50

          # ── 顶栏 ───────────────────────────────────────────
          顶栏:
            type: Canvas
            attribute:
              point: ~horizontal_stretch_top
              height: 80
            children:
              顶栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~24,26,38,240
                  shape: ~round_rect
                  radius: 22
              顶栏分隔线:
                type: Texture
                attribute:
                  point: ~horizontal_stretch_bottom
                  height: 1
                  normal: ~255,180,100,80
                  through: true
              标题:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&6&l奖励领取"
                  fontSize: 38
                  through: true
              当前等级:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -90
                  texts: "'&7当前等级: &e&lLv.' + var.currentLevel"
                  fontSize: 28
                  through: true
              # 关闭按钮：Canvas + Texture(背景) + Text(文字)
              关闭按钮:
                type: Canvas
                attribute:
                  point: ~top_right
                  x: -20
                  y: 18
                  width: 44
                  height: 44
                action:
                  clickLeft: |-
                    Screen.close()
                children:
                  关闭背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~60,40,40,220
                      hover: ~Frosted:0;200,70,70,240
                      shape: ~circle
                    effect:
                      stroke:
                        width: 2
                        color: ~255,100,100,140
                  关闭文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 44
                      texts: "~&f✕"
                      fontSize: 28

          # ── 横向滚动区 ────────────────────────────────────────
          横向滑块:
            type: Texture
            val: 横向滑块
            attribute:
              point: ~bottom_left
              x: 32
              y: -24
              width: 50
              height: 6
              normal: ~255,180,100,220
              maxDragX: 1136
              shape: ~round_rect
              radius: 3
              through: true
            effect:
              neon:
                color: ~255,180,100,100
                size: 4
                intensity: 0.4
                animated: false
          横向滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 32
              y: 100
              width: 1136
              height: 540
              moveX: "self.parent['横向滑块'].getDragXRatio()"
            action:
              wheel: |-
                if(self.moveX >= 0 && self.wheelValue > 0){
                  self.parent['横向滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                }
                if(self.moveX <= 1 && self.wheelValue < 0){
                  self.parent['横向滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                }
            children:
              等级列表:
                val: 等级列表
                type: HStack
                attribute:
                  spaceBetween: 20
                  height: 540
                children:
                  # ── 等级列模板（索引0）──────────────────────────
                  # 每个等级列竖向排列 free/premium/deluxe 三个档位奖励卡片
                  等级列:
                    type: Canvas
                    attribute:
                      levelKey: 0.round()
                      levelData: var.levels[self.levelKey]
                      visible: self.levelData != none
                      width: 220
                      height: 580
                    children:
                      # 等级标题
                      等级标题:
                        type: Canvas
                        attribute:
                          point: ~top_left
                          width: 220
                          height: 44
                        children:
                          等级标题底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.parent.levelData != none && self.parent.parent.levelData['reached'] == 'true' ? '255,170,80,230' : '45,48,62,220'"
                              shape: ~round_rect
                              radius: 10
                            effect:
                              stroke:
                                width: 1
                                color: "self.parent.parent.levelData != none && self.parent.parent.levelData['reached'] == 'true' ? '255,190,120,180' : '80,85,105,80'"
                          等级标题文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 220
                              texts: "self.parent.parent.levelData != none ? '&f&lLv.' + self.parent.parent.levelData['level'] : none"
                              fontSize: 28
                              through: true
                      # 免费档卡片
                      免费档卡片:
                        type: Canvas
                        attribute:
                          point: ~top_left
                          y: 56
                          width: 220
                          height: 168
                          entryKey: "self.parent.levelData != none ? self.parent.levelData['freeEntryKey'] : '0'"
                          entry: var.rewards[self.entryKey]
                          visible: self.entry != none
                        children:
                          卡片底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.entry != none && self.parent.entry['claimed'] == 'true' ? '40,65,55,220' : (self.parent.entry != none && self.parent.entry['claimable'] == 'true' ? '35,50,75,230' : (self.parent.entry != none && self.parent.entry['locked'] == 'true' ? '35,38,48,220' : '30,38,55,220'))"
                              shape: ~round_rect
                              radius: 16
                            effect:
                              stroke:
                                width: 3
                                color: "self.parent.entry != none && self.parent.entry['claimable'] == 'true' ? '100,170,255,240' : (self.parent.entry != none && self.parent.entry['claimed'] == 'true' ? '100,200,130,200' : '120,150,210,200')"
                          档位标签:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 12
                              y: 10
                              texts: "self.parent.entry != none ? self.parent.entry['tierDisplay'] : none"
                              fontSize: 24
                              through: true
                          物品图标:
                            type: Slot
                            attribute:
                              point: ~middle_center
                              y: -12
                              width: 72
                              height: 72
                              normal: ~0,0,0,0
                              shape: ~round_rect
                              radius: 10
                              through: true
                              slotType: ~Icon
                              itemScale: 1.0
                              seticon: "self.setItemIcon(var.iconJsons[self.parent.entryKey] != none ? var.iconJsons[self.parent.entryKey] : var.emptyItemJson)"
                          状态文字:
                            type: Text
                            attribute:
                              point: ~bottom_left
                              x: 12
                              y: -10
                              width: 196
                              texts: "self.parent.entry != none ? (self.parent.entry['claimable'] == 'true' ? none : (self.parent.entry['claimed'] == 'true' ? '&a✔ 已领取' : (self.parent.entry['locked'] == 'true' ? '&c未解锁' : '&7等级不足'))) : none"
                              fontSize: 22
                              through: true
                          # 领取按钮：Canvas + Texture(背景) + Text(文字)
                          领取按钮:
                            type: Canvas
                            attribute:
                              point: ~bottom_right
                              x: -10
                              y: -10
                              width: 86
                              height: 36
                              visible: "self.parent.entry != none && self.parent.entry['claimable'] == 'true'"
                            action:
                              clickLeft: |-
                                Packet.send(var.packetId, 'claim', self.parent.entry['level'], var.actionToken)
                            children:
                              领取背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~80,170,110,245
                                  hover: ~110,210,140,255
                                  shape: ~round_rect
                                  radius: 18
                                effect:
                                  ripple:
                                  stroke:
                                    width: 1
                                    color: ~140,235,170,220
                              领取文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 86
                                  texts: "~&f&l领取"
                                  fontSize: 22
                      # 高级档卡片
                      高级档卡片:
                        type: Canvas
