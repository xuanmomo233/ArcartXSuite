                      stroke:
                        width: 3
                        color: "self.isHovered() ? '230,160,100,255' : '200,130,70,255'"
                  存入字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 400
                      texts: "~&8存入选中背包物品"
                      fontSize: 32
                      through: true
              密码标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 16
                  y: 616
                  width: 400
                  texts: "var.unlocked ? '&a二级密码已解锁' : (var.hasPassword ? '&c输入二级密码解锁' : '&e首次使用请设置二级密码')"
                  fontSize: 26
                  through: true
              密码输入:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 16
                  y: 648
                  width: 270
                  height: 44
                children:
                  密码输入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~40,34,28,225
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
                  输入框:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 10
                      width: 250
                      height: 34
                      length: 32
                      emptyText: ~二级密码
                      fontSize: 30
                    action:
                      textChange: |-
                        var.passwordText = self.getContent()
              解锁:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 294
                  y: 648
                  width: 110
                  height: 44
                  visible: "!var.unlocked"
                  enable: "!var.actionBusy"
                action:
                  clickLeft: |-
                    if(var.hasPassword){
                      Packet.send(var.packetId, 'password_unlock', var.passwordText)
                    }else{
                      var.actionBusy = true
                      Packet.send(var.packetId, 'password_set', var.passwordText, var.actionToken)
                    }
                children:
                  解锁底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~48,40,32,245
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
                  解锁字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 110
                      texts: "var.hasPassword ? '&f解锁' : '&f设置'"
                      fontSize: 30
                      through: true
              锁定:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 294
                  y: 648
                  width: 110
                  height: 44
                  visible: "var.unlocked"
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send(var.packetId, 'password_lock', var.actionToken)
                children:
                  锁定底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~48,40,32,245
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
                  锁定字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 110
                      texts: "~&f锁定"
                      fontSize: 30
                      through: true
