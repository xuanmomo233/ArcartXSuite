# 称号总览菜单 UI 配置（金色重写版）
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左导航 + 称号列表栏 + 详情栏 + 右侧栏
# 布局: 顶栏(标题+统计摘要+关闭) + 左导航(筛选模式/分组/品质) + 称号列表栏(滚动) + 详情栏(弹性宽,滚动) + 右侧栏(已装备/总属性/操作按钮)
# 配色: 琥珀金 主色232,180,90 底30,32,38,110 面板Frosted:30;255,255,255,100 卡片255,255,255,125 描边232,180,90,240
# 数据来源: 后端通过 AXS_TITLE_MENU 数据包推送 titles/groups/qualities/sets 等数据，由 packetHandler 接收。
# 操作交互: 点击称号项发送 select 包，装备/卸下/隐藏/设为主展示等按钮发送对应操作包。

ui:
  background: false
  escClose: true
  closeDied: true
  show: true
  through: false
  screenScale: true
  level: 8
  itemSize: 16
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.titles = {}
      var.groups = {}
      var.qualities = {}
      var.sets = {}
      var.equippedByGroup = {}
      var.filterModes = {}
      var.selectedId = none
      var.selectedCanEquip = false
      var.selectedIsEquipped = false
      var.selectedName = none
      var.selectedKind = none
      var.selectedKindText = none
      var.selectedChatPrefix = none
      var.selectedChatSuffix = none
      var.selectedTabPrefix = none
      var.selectedTabSuffix = none
      var.selectedGroupId = none
      var.selectedGroupName = none
      var.selectedQualityName = none
      var.selectedDescription = none
      var.selectedSource = none
      var.selectedOwned = false
      var.selectedHidden = false
      var.selectedRemainingText = none
      var.selectedDisplayAttributesText = none
      var.selectedCollectionAttributesText = none
      var.displayAttributesText = none
      var.collectionAttributesText = none
      var.totalAttributesText = none
      var.setBonusAttributesText = none
      var.displayTitleName = none
      var.displayTitleId = none
      var.selectedIsDisplayTitle = false
      var.ownedCount = 0
      var.hiddenCount = 0
      var.equippedCount = 0
      var.activeSetCount = 0
      var.maxTitleCount = 0
      var.maxGroupCount = 0
      var.maxQualityCount = 0
      var.maxSetCount = 0
      var.maxEquippedCount = 0
      var.刷新轮次 = 0
      var.filterMode = 'all'
      var.filterGroup = 'all'
      var.filterQuality = 'all'
      var.titleListScrollRatio = 0
      var.groupScrollRatio = 0
      var.qualityScrollRatio = 0
      var.detailScrollRatio = 0
      var.rightScrollRatio = 0
      var.actionBusy = false
      var.actionBusySeconds = 0
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放，窗口长宽比不是 16:9 时会多出可用空间
      // viewH / viewW = 换算到设计坐标系后的可用高宽，16:9 时正好 1080 / 1920
      // offX     = Adaptive 水平居中后，设计坐标 x=0 距窗口左边的偏量（超宽屏 > 0）
      // contentW = 内容区宽度（左 48 + 左导航 300 + 间距 24 + 右 48 = 420）
      // detailW  = 详情栏弹性宽度（称号列表 440 + 右侧栏 440 + 两个间距 16*2 = 912）
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.detailW = var.contentW - 912
      // 各滚动区高度（栏高 viewH-144，减去标题/按钮区/内边距）
      var.titleScrollH = var.viewH - 224
      var.detailScrollH = var.viewH - 296
      var.rightScrollH = var.viewH - 318
      // 左导航分组/品质竖向滚动区高度（导航高 viewH-144，减去顶部 176 + 底部 16 + 中间品质标题 44）
      var.groupScrollH = (var.viewH - 380) / 2
      var.qualityScrollY = 176 + var.groupScrollH + 44
      var.qualityScrollH = var.groupScrollH
      // 右侧栏按钮区 y 坐标（top_left，相对栏左上角）
      var.btnRow1Y = var.viewH - 294
      var.btnRow2Y = var.viewH - 244
      var.btnRefreshY = var.viewH - 194
    # 窗口尺寸变化后重算可用高宽，依赖这些变量的控件尺寸会跟着刷新
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.detailW = var.contentW - 912
      var.titleScrollH = var.viewH - 224
      var.detailScrollH = var.viewH - 296
      var.rightScrollH = var.viewH - 318
      var.groupScrollH = (var.viewH - 380) / 2
      var.qualityScrollY = 176 + var.groupScrollH + 44
      var.qualityScrollH = var.groupScrollH
      var.btnRow1Y = var.viewH - 294
      var.btnRow2Y = var.viewH - 244
      var.btnRefreshY = var.viewH - 194
  packetHandler:
    # packetHandler: init
    # 首次接收后端数据包时执行，初始化所有界面变量。
    # 包字段:
    #   - titles: 称号列表（字典，key 为序号，每项含 display_name/owned/hidden/equipped/selected/group_id/quality_name/remaining_text 等）
    #   - groups: 分组列表（字典，每项含 id/name）
    #   - qualities: 品质列表（字典，每项含 id/name）
    #   - sets: 套装列表（字典，每项含 active/display_name/progress/required_titles_text/bonus_text）
    #   - equipped_by_group: 按分组列出的已装备称号（字典，每项含 group_name/title_id/display_name/quality_name）
    #   - filter_modes: 可用筛选模式列表
    #   - selected_id: 当前选中的称号 ID
    #   - selected_can_equip: 当前选中称号是否可装备
    #   - selected_is_equipped: 当前选中称号是否已装备
    #   - selected_display_name: 当前选中称号的显示名称
    #   - selected_kind: 当前选中称号的类型（text 文本 / icon 贴图）
    #   - selected_chat_prefix: 当前选中称号的聊天前缀
    #   - selected_chat_suffix: 当前选中称号的聊天后缀
    #   - selected_tab_prefix: 当前选中称号的 TAB 前缀
    #   - selected_tab_suffix: 当前选中称号的 TAB 后缀
    #   - selected_group_id: 当前选中称号所属分组 ID
    #   - selected_group_name: 当前选中称号所属分组名称
    #   - selected_quality_name: 当前选中称号的品质名称
    #   - selected_description: 当前选中称号的描述文本
    #   - selected_source: 当前选中称号的获取来源
    #   - selected_owned: 当前选中称号是否已拥有
    #   - selected_hidden: 当前选中称号是否已隐藏
    #   - selected_remaining_text: 当前选中称号的剩余时间文本
    #   - selected_display_attributes_text: 当前选中称号的展示属性行列表
    #   - selected_collection_attributes_text: 当前选中称号的收集属性行列表
    #   - display_attributes_text: 当前所有已装备称号的展示属性汇总文本
    #   - collection_attributes_text: 当前所有已拥有称号的收集属性汇总文本
    #   - total_attributes_text: 展示属性与收集属性的合计汇总文本
    #   - set_bonus_attributes_text: 已激活套装的加成属性文本
    #   - display_title_name: 当前主展示称号名称
    #   - display_title_id: 当前主展示称号 ID
    #   - selected_is_display_title: 当前选中称号是否为主展示称号
    #   - owned_count: 已拥有称号数量
    #   - hidden_count: 已隐藏称号数量
    #   - equipped_count: 已装备称号数量
    #   - max_title_count: 称号最大数量（用于动态复制称号项控件）
    #   - max_group_count: 分组最大数量（用于动态复制分组项控件）
    #   - max_quality_count: 品质最大数量（用于动态复制品质项控件）
    #   - max_set_count: 套装最大数量（用于动态复制套装项控件）
    #   - max_equipped_count: 已装备分组最大数量（用于动态复制已装备项控件）
    init: |-
      var.titles = packet['titles']
      var.groups = packet['groups']
      var.qualities = packet['qualities']
      var.sets = packet['sets']
      var.equippedByGroup = packet['equipped_by_group']
      var.filterModes = packet['filter_modes']
      var.selectedId = packet['selected_id']
      var.selectedCanEquip = packet['selected_can_equip']
      var.selectedIsEquipped = packet['selected_is_equipped']
      var.selectedName = packet['selected_display_name']
      var.selectedKind = packet['selected_kind']
      var.selectedKindText = var.selectedKind == 'text' ? '文本称号' : (var.selectedKind == 'icon' ? '贴图称号' : none)
      var.selectedChatPrefix = packet['selected_chat_prefix']
      var.selectedChatSuffix = packet['selected_chat_suffix']
      var.selectedTabPrefix = packet['selected_tab_prefix']
      var.selectedTabSuffix = packet['selected_tab_suffix']
      var.selectedGroupId = packet['selected_group_id']
      var.selectedGroupName = packet['selected_group_name']
      var.selectedQualityName = packet['selected_quality_name']
      var.selectedDescription = packet['selected_description']
      var.selectedSource = packet['selected_source']
      var.selectedOwned = packet['selected_owned']
      var.selectedHidden = packet['selected_hidden']
      var.selectedRemainingText = packet['selected_remaining_text']
      var.selectedDisplayAttributesText = packet['selected_display_attributes_text']
      var.selectedCollectionAttributesText = packet['selected_collection_attributes_text']
      var.displayAttributesText = packet['display_attributes_text']
      var.collectionAttributesText = packet['collection_attributes_text']
      var.totalAttributesText = packet['total_attributes_text']
      var.setBonusAttributesText = packet['set_bonus_attributes_text']
      var.displayTitleName = packet['display_title_name']
      var.displayTitleId = packet['display_title_id']
      var.selectedIsDisplayTitle = packet['selected_is_display_title']
      var.ownedCount = packet['owned_count']
      var.hiddenCount = packet['hidden_count']
      var.equippedCount = packet['equipped_count']
      var.activeSetCount = 0
      if(var.sets != none){
        for(key in var.sets.keys()){
          if(var.sets[key]['active']){
            var.activeSetCount = var.activeSetCount + 1
          }
        }
      }
      var.maxTitleCount = packet['max_title_count']
      var.maxGroupCount = packet['max_group_count']
      var.maxQualityCount = packet['max_quality_count']
      var.maxSetCount = packet['max_set_count']
      var.maxEquippedCount = packet['max_equipped_count']
      称号数 = var.maxTitleCount.round()
      现有称号数 = val.title_list.childrenCount() - 1
      if(现有称号数 != 称号数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.title_list.childrenCount() > 1){
          val.title_list.get(1).remove()
        }
        if(称号数 > 1){
          for(序号 in range(1, 称号数 - 1)){
            项 = val.title_list['称号模板'].copy('称号项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      分组数 = var.maxGroupCount.round()
      现有分组数 = val.group_list.childrenCount() - 1
      if(现有分组数 != 分组数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.group_list.childrenCount() > 1){
          val.group_list.get(1).remove()
        }
        if(分组数 > 1){
          for(序号 in range(1, 分组数 - 1)){
            项 = val.group_list['分组模板'].copy('分组项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      品质数 = var.maxQualityCount.round()
      现有品质数 = val.quality_list.childrenCount() - 1
      if(现有品质数 != 品质数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.quality_list.childrenCount() > 1){
          val.quality_list.get(1).remove()
        }
        if(品质数 > 1){
          for(序号 in range(1, 品质数 - 1)){
            项 = val.quality_list['品质模板'].copy('品质项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      套装数 = var.maxSetCount.round()
      现有套装数 = val.set_list.childrenCount() - 1
      if(现有套装数 != 套装数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.set_list.childrenCount() > 1){
          val.set_list.get(1).remove()
        }
        if(套装数 > 1){
          for(序号 in range(1, 套装数 - 1)){
            项 = val.set_list['套装模板'].copy('套装项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      已装备数 = var.maxEquippedCount.round()
      现有已装备数 = val.equipped_list.childrenCount() - 1
      if(现有已装备数 != 已装备数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.equipped_list.childrenCount() > 1){
          val.equipped_list.get(1).remove()
        }
        if(已装备数 > 1){
          for(序号 in range(1, 已装备数 - 1)){
            项 = val.equipped_list['已装备模板'].copy('已装备项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      var.titleListScrollRatio = 0
      var.groupScrollRatio = 0
      var.qualityScrollRatio = 0
      var.detailScrollRatio = 0
      var.rightScrollRatio = 0
      // init 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false
    # packetHandler: update
    # 后端推送更新时执行，字段与 init 完全相同，用于刷新界面变量。
    # 包字段: 同 init（titles/groups/qualities/sets/equipped_by_group/filter_modes/selected_* 等全部字段）
    update: |-
      var.titles = packet['titles']
      var.groups = packet['groups']
      var.qualities = packet['qualities']
      var.sets = packet['sets']
      var.equippedByGroup = packet['equipped_by_group']
      var.filterModes = packet['filter_modes']
      var.selectedId = packet['selected_id']
      var.selectedCanEquip = packet['selected_can_equip']
      var.selectedIsEquipped = packet['selected_is_equipped']
      var.selectedName = packet['selected_display_name']
      var.selectedKind = packet['selected_kind']
      var.selectedKindText = var.selectedKind == 'text' ? '文本称号' : (var.selectedKind == 'icon' ? '贴图称号' : none)
      var.selectedChatPrefix = packet['selected_chat_prefix']
      var.selectedChatSuffix = packet['selected_chat_suffix']
      var.selectedTabPrefix = packet['selected_tab_prefix']
      var.selectedTabSuffix = packet['selected_tab_suffix']
      var.selectedGroupId = packet['selected_group_id']
      var.selectedGroupName = packet['selected_group_name']
      var.selectedQualityName = packet['selected_quality_name']
      var.selectedDescription = packet['selected_description']
      var.selectedSource = packet['selected_source']
      var.selectedOwned = packet['selected_owned']
      var.selectedHidden = packet['selected_hidden']
      var.selectedRemainingText = packet['selected_remaining_text']
      var.selectedDisplayAttributesText = packet['selected_display_attributes_text']
      var.selectedCollectionAttributesText = packet['selected_collection_attributes_text']
      var.displayAttributesText = packet['display_attributes_text']
      var.collectionAttributesText = packet['collection_attributes_text']
      var.totalAttributesText = packet['total_attributes_text']
      var.setBonusAttributesText = packet['set_bonus_attributes_text']
      var.displayTitleName = packet['display_title_name']
      var.displayTitleId = packet['display_title_id']
      var.selectedIsDisplayTitle = packet['selected_is_display_title']
      var.ownedCount = packet['owned_count']
      var.hiddenCount = packet['hidden_count']
      var.equippedCount = packet['equipped_count']
      var.activeSetCount = 0
      if(var.sets != none){
        for(key in var.sets.keys()){
          if(var.sets[key]['active']){
            var.activeSetCount = var.activeSetCount + 1
          }
        }
      }
      var.maxTitleCount = packet['max_title_count']
      var.maxGroupCount = packet['max_group_count']
      var.maxQualityCount = packet['max_quality_count']
      var.maxSetCount = packet['max_set_count']
      var.maxEquippedCount = packet['max_equipped_count']
      称号数 = var.maxTitleCount.round()
      现有称号数 = val.title_list.childrenCount() - 1
      if(现有称号数 != 称号数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.title_list.childrenCount() > 1){
          val.title_list.get(1).remove()
        }
        if(称号数 > 1){
          for(序号 in range(1, 称号数 - 1)){
            项 = val.title_list['称号模板'].copy('称号项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      分组数 = var.maxGroupCount.round()
      现有分组数 = val.group_list.childrenCount() - 1
      if(现有分组数 != 分组数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.group_list.childrenCount() > 1){
          val.group_list.get(1).remove()
        }
        if(分组数 > 1){
          for(序号 in range(1, 分组数 - 1)){
            项 = val.group_list['分组模板'].copy('分组项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      品质数 = var.maxQualityCount.round()
      现有品质数 = val.quality_list.childrenCount() - 1
      if(现有品质数 != 品质数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.quality_list.childrenCount() > 1){
          val.quality_list.get(1).remove()
        }
        if(品质数 > 1){
          for(序号 in range(1, 品质数 - 1)){
            项 = val.quality_list['品质模板'].copy('品质项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      套装数 = var.maxSetCount.round()
      现有套装数 = val.set_list.childrenCount() - 1
      if(现有套装数 != 套装数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.set_list.childrenCount() > 1){
          val.set_list.get(1).remove()
        }
        if(套装数 > 1){
          for(序号 in range(1, 套装数 - 1)){
            项 = val.set_list['套装模板'].copy('套装项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
