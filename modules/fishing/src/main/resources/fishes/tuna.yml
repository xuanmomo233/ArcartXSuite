# 鱼类定义：金枪鱼
# 金枪鱼是一种不常见的海洋鱼类，夏秋季节晴天出现，以突进和下沉行为为主，难度中等
# 鱼类文件位于 fishes/ 目录，每个文件定义一种鱼

id: "tuna"                     # 鱼类唯一标识符
display-name: "金枪鱼"          # 显示名称
rarity: uncommon               # 稀有度等级（uncommon=不常见）
min-size: 30                   # 最小尺寸（厘米）
max-size: 120                  # 最大尺寸（厘米）
base-price: 250                # 基础售价（游戏货币）
base-xp: 40                    # 基础经验值（捕获时获得）
seasons: [summer, fall]        # 可捕获季节（夏季、秋季）
weathers: [clear]              # 可捕获天气（仅晴天）
time-ranges:                   # 可捕获时间段
  - start: "10:00"             # 开始时间（10:00，上午）
    end: "18:00"               # 结束时间（18:00，傍晚前，白天时段）
item:                          # 捕获后掉落的物品定义
  source: "minecraft"          # 物品来源（minecraft=原版物品）
  id: "tropical_fish"     # 原版物品ID（热带鱼）
  amount: 1                    # 物品数量
difficulty: 50                 # 钓鱼难度（0-100，中等难度）
behaviors:                     # 小游戏中鱼的行为模式及权重
  - type: dart                 # 突进型：鱼快速跳跃移动
    weight: 0.6                # 权重0.6（主要行为）
  - type: sinker               # 下沉型：鱼向轨道底部移动
    weight: 0.4                # 权重0.4（次要行为）

# ─── 小游戏机制（可选，覆盖全局曲线的 base-rate） ──────────
# 金枪鱼是大型鱼，进度衰减较快，逃离速度较快
# 仅覆盖 base-rate，formula 沿用全局曲线公式（全局默认 drain=0.02）
progress-drain:
  base-rate: 0.024             # 鱼在绿条外时进度下降较快（全局默认0.02）
flee-params:
  base-chance: 0.28            # 逃离概率略高（全局默认0.25）
  base-speed: 0.05             # 逃离速度较快（全局默认0.04）
  speed-per-difficulty: 0.035  # 每点难度逃离速度增长（全局默认0.03）

# 多阶段行为：金枪鱼越到后期越疯狂
behavior-stages:
  stage1:
    threshold: 0.0             # 进度 0% 起：正常突进+下沉
    behaviors:
      - type: dart
        weight: 0.6
      - type: sinker
        weight: 0.4
  stage2:
    threshold: 0.7             # 进度 70% 后：混合型挣扎
    behaviors:
      - type: mixed            # 混合型：随机切换所有行为
        weight: 0.5
      - type: dart
        weight: 0.5

# ─── 奖励（可选） ──────────────────────────────────────
# 货币奖励
currency-reward:
  currency-id: "coin"
  amount: 50

# 多货币奖励
currency-rewards:
  gem_reward:
    currency-id: "gem"
    amount: 1

# 大尺寸金枪鱼额外掉落
drops:
  big_tuna_bonus:
    item:
      source: "minecraft"
      id: "iron_ingot"
      amount: 2
    weight: 1.0
    condition: "size:80"       # 尺寸≥80cm 时额外掉落铁锭
  perfect_bonus:
    item:
      source: "minecraft"
      id: "gold_ingot"
      amount: 1
    weight: 1.0
    condition: "perfect"       # 完美捕获时掉落金锭

# 命令奖励
command-rewards:
  big_catch_announce:
    command: "say {player} 钓到了一条 {size}cm 的大金枪鱼！"
    condition: "size:100"      # 尺寸≥100cm 时全服公告

# ─── 出现条件（可选） ──────────────────────────────────
min-player-level: 10
biomes: [ocean, deep_ocean, lukewarm_ocean, warm_ocean]  # 仅在海洋类生物群系
depth-range:
  min-depth: 3                 # 至少3格深
  max-depth: 60                # 最深60格

# ─── 数据/展示（可选） ─────────────────────────────────
description: "夏秋季节晴天出现在海洋中的大型鱼类，速度极快，钓到大会很有成就感。"
icon-texture: "minecraft:tropical_fish"
record-weight: 0.9
