                    attribute:
                      point: ~stretch_all
                      normal: "var.selectedIndex == 0 ? '60,140,220,160' : '40,40,50,120'"
                      shape: ~round_rect
                      radius: 8
                    action:
                      clickLeft: |-
                        Packet.send('pickup', 'pick_0', var.actionToken)
