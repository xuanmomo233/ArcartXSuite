# 怪物组：vanilla: 前缀强制原版实体；mythic: 或无前缀走 MythicMobs（未装自动回退原版）
#
# 作战方案过滤：组加 plans: [方案id] 后，只有该方案进本才注册此组
# （例：plans: [strong] 的密集怪群只在"强攻"方案出现；不配 plans=所有方案都刷）。
# 同样适用于 floors 模式 rooms.yml 里的房间怪物组。

wave_1:
  spawn-timing: AUTO_START
  monsters:
    - mob-id: "vanilla:ZOMBIE"
      location: "3,80,3"
      amount: 3
    - mob-id: "vanilla:ZOMBIE"
      location: "-3,80,-3"
      amount: 3
  complete-when-alive-below: 0
  on-start:
    - "message @all &e第一波：尸群来袭！"
  on-end:
    - "spawn_group wave_2"
    - "message @all &a第一波已清剿，第二波即将出现..."

wave_2:
  spawn-timing: TRIGGERED
  trigger-after: ["wave_1"]
  monsters:
    - mob-id: "vanilla:SKELETON"
      location: "4,80,0"
      amount: 2
    - mob-id: "vanilla:ZOMBIE"
      location: "-4,80,0"
      amount: 3
  complete-when-alive-below: 0
  on-start:
    - "message @all &c第二波：混合部队！"
  on-end:
    - "complete_dungeon"
