                          x: 10
                          y: 12
                          fontSize: 24
                          texts: "self.entry != none ? ('&f' + self.entry['name']) : ''"
                      详情稀有度:
                        type: Text
                        attribute:
                          x: 400
                          y: 12
                          fontSize: 24
                          texts: "self.entry != none ? ('&7稀有度: ' + self.entry['rarity']) : ''"
                      详情权重:
