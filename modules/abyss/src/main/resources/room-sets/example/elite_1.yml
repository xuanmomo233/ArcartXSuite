# 房间构件：elite_1（精英房）
# 与 combat 同型，但：
#   · mob-level 基础上再 +elite-level-bonus（procgen.yml 配）
#   · 必定携带一个房间词缀（modifiers，无视 include-boss 配置同样生效）
#   · 计入评级探索分
type: elite
weight: 10

mobs:
  - "4,1,6: vanilla:wither_skeleton"
  - "8,1,6: vanilla:skeleton"
  - "6,1,8: vanilla:skeleton"
mobs-wave-2:
  - "6,1,6: vanilla:wither_skeleton"
  - "4,1,4: vanilla:skeleton"
  - "8,1,4: vanilla:skeleton"

scripts:
  on-enter:
    - "message @trigger &6精英房！强敌出没——小心应战"
