# AXS 资源说明
# 用途: Abyss 副本房间 —— 成员模型舞台 / 目标副本 / 消息流 / 邀请与副本选择副面板
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/hasParty/isLeader/partyName/myUuid/maxMembers
    #         memberRows{idx:{uuid,name,online,leader,ready}}/memberCount
    #         hasDungeon/dungeon{id,name,difficulty,iconJson,desc0,minPlayers,maxPlayers,timeLimit,staminaCost}
    #         feedRows{idx:{sender,text}}/feedCount
    #         applicantRows{idx:{uuid,name}}/applicantCount
    #         listed/joinMode/allReady
    #         allDungeonRows{idx:{id,name,difficulty}}/allDungeonCount
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      self.actions['apply'](packet)
      self.actions['refresh']()
    # packetHandler: update —— 队伍数据变更全量推送（无 action_token）
    update: |-
      self.actions['apply'](packet)
      self.actions['refresh']()
    # packetHandler: online_list —— 邀请副面板的在线玩家列表
    online_list: |-
      var.onlineRows = packet['onlineRows']
      var.onlineCount = packet['onlineCount']
      self.actions['refreshOnline']()
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.hasParty = false
      var.isLeader = false
      var.partyName = ''
      var.myUuid = ''
      var.maxMembers = 4
      var.memberRows = {}
      var.memberCount = 0
      var.hasDungeon = false
      var.dungeon = {}
      var.feedRows = {}
      var.feedCount = 0
      var.applicantRows = {}
      var.applicantCount = 0
      var.listed = false
      var.joinMode = 'APPLY'
      var.allReady = false
      var.myReady = false
      var.allDungeonRows = {}
      var.allDungeonCount = 0
      var.onlineRows = {}
      var.onlineCount = 0
      var.invitePanel = false
      var.dungeonPanel = false
      var.inviteName = ''
      var.chatMsg = ''
      var.成员轮次 = 0
      var.成员引用 = {}
      var.消息轮次 = 0
      var.消息引用 = {}
      var.申请轮次 = 0
      var.申请引用 = {}
      var.在线轮次 = 0
      var.在线引用 = {}
      var.副本轮次 = 0
      var.副本引用 = {}
      var.accent = '186,140,232,255'
      var.accentDim = '96,80,140,190'
      var.accentHover = '220,180,255,235'
      var.cardBg = '38,30,58,255'
      var.cardBgHover = '52,40,76,255'
      var.green = '120,200,140,255'
      var.air = '{"id":"minecraft:air","Count":1b}'
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.leftW = var.viewW * 0.66
      var.rightX = var.leftW + 24
      var.rightW = var.viewW - var.rightX - 72
    open: |-
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
    # 统一读取房间数据（init/update 共用）
    apply: |-
      var.hasParty = packet['hasParty']
      var.isLeader = packet['isLeader']
      var.partyName = packet['partyName']
      var.myUuid = packet['myUuid']
      var.maxMembers = packet['maxMembers']
      var.memberRows = packet['memberRows']
      var.memberCount = packet['memberCount']
      var.hasDungeon = packet['hasDungeon']
      var.dungeon = packet['dungeon']
      var.feedRows = packet['feedRows']
      var.feedCount = packet['feedCount']
      var.applicantRows = packet['applicantRows']
      var.applicantCount = packet['applicantCount']
      var.listed = packet['listed']
      var.joinMode = packet['joinMode']
      var.allReady = packet['allReady']
      var.myReady = packet['myReady']
      var.allDungeonRows = packet['allDungeonRows']
      var.allDungeonCount = packet['allDungeonCount']
    # 重建成员卡片 + 消息流 + 申请列表
    refresh: |-
      目标数 = var.hasParty ? var.memberCount.round() : 0
      if(val.member_row.childrenCount() - 1 != 目标数 - 1){
        for(key in var.成员引用.keys()){
          var.成员引用[key].remove()
        }
        var.成员引用 = {}
        var.成员轮次 = (var.成员轮次 + 1).round()
        模板 = val.member_row.get(0)
        模板.entryKey = 0.round()
        if(目标数 > 1){
          for(i in range(1, 目标数 - 1)){
            r = 模板.copy('成员卡_' + var.成员轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.成员引用[i.round()] = r
          }
        }
      }
      消息数 = var.hasParty ? var.feedCount.round() : 0
      if(val.feed_rows.childrenCount() - 1 != 消息数 - 1){
        for(key in var.消息引用.keys()){
          var.消息引用[key].remove()
        }
        var.消息引用 = {}
        var.消息轮次 = (var.消息轮次 + 1).round()
        模板2 = val.feed_rows.get(0)
        模板2.entryKey = 0.round()
        if(消息数 > 1){
          for(i in range(1, 消息数 - 1)){
            r = 模板2.copy('消息行_' + var.消息轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.消息引用[i.round()] = r
          }
        }
      }
      val.feed_slider.setDragYRatio(1)
      申请数 = var.hasParty && var.isLeader ? var.applicantCount.round() : 0
      if(val.apply_rows.childrenCount() - 1 != 申请数 - 1){
        for(key in var.申请引用.keys()){
          var.申请引用[key].remove()
        }
        var.申请引用 = {}
        var.申请轮次 = (var.申请轮次 + 1).round()
        模板3 = val.apply_rows.get(0)
        模板3.entryKey = 0.round()
        if(申请数 > 1){
          for(i in range(1, 申请数 - 1)){
            r = 模板3.copy('申请行_' + var.申请轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.申请引用[i.round()] = r
          }
        }
      }
      副本数 = var.allDungeonCount.round()
      if(val.dungeon_rows.childrenCount() - 1 != 副本数 - 1){
        for(key in var.副本引用.keys()){
          var.副本引用[key].remove()
        }
        var.副本引用 = {}
        var.副本轮次 = (var.副本轮次 + 1).round()
        模板4 = val.dungeon_rows.get(0)
        模板4.entryKey = 0.round()
        if(副本数 > 1){
          for(i in range(1, 副本数 - 1)){
            r = 模板4.copy('副本行_' + var.副本轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.副本引用[i.round()] = r
          }
        }
      }
      // 目标副本图标：seticon 不随 var 自动重算，数据刷新后手动触发
      val.副本图标.seticon()
    # 在线玩家列表重建（邀请副面板）
    refreshOnline: |-
      在线数 = var.onlineCount.round()
      if(val.online_rows.childrenCount() - 1 != 在线数 - 1){
        for(key in var.在线引用.keys()){
          var.在线引用[key].remove()
        }
        var.在线引用 = {}
        var.在线轮次 = (var.在线轮次 + 1).round()
        模板 = val.online_rows.get(0)
        模板.entryKey = 0.round()
        if(在线数 > 1){
          for(i in range(1, 在线数 - 1)){
            r = 模板.copy('在线行_' + var.在线轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.在线引用[i.round()] = r
          }
        }
      }
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      全屏画布:
        type: Canvas
        attribute:
          x: "-var.offX"
          width: "var.viewW"
          height: "var.viewH"
        children:
          场景磨砂:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;20,16,38,245
          暮色底幕:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~16,12,30,255
            effect:
              gradient:
                color1: ~30,22,52,255
                color2: ~12,9,24,255
                type: 0
                angleDeg: 65
          # ── 页眉 ──
          页眉标线:
            type: Texture
            attribute:
              x: 76
              y: 56
              width: 28
              height: 3
              normal: var.accent
              through: true
          品牌标记:
            type: Text
            attribute:
              x: 120
              y: 46
              texts: ~&fA B Y S S  /  深渊回廊
              fontSize: 36
              alpha: 0.78
              through: true
          标题:
            type: Text
            attribute:
              x: 72
              y: 104
              texts: ~&f副本房间
              fontSize: 88
              through: true
          副标题:
            type: Text
            attribute:
              x: 76
              y: 176
              texts: "'&7' + var.partyName + '  ·  ' + var.memberCount.round() + '/' + var.maxMembers.round() + ' 人' + (var.allReady ? '  ·  &a全员就绪' : '')"
              fontSize: 36
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -76
              y: 52
              width: 48
              height: 48
            action:
              clickLeft: "Screen.close()"
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~150,58,58,235
                  hover: ~190,75,75,245
                  shape: ~circle
                  through: true
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f✕
                  fontSize: 36
                  through: true
          # ── 左中：成员模型舞台 ──
          舞台底:
            type: Texture
            attribute:
              x: 56
              y: 230
              width: "var.leftW - 96"
              height: "var.viewH - 400"
              normal: ~14,11,26,240
              shape: ~round_rect
              radius: 18
              through: true
            effect:
              gradient:
                color1: ~38,28,64,230
                color2: ~14,11,26,240
                type: 0
                angleDeg: 90
              stroke:
                width: 2
                color: var.accentDim
          舞台标线:
            type: Texture
            attribute:
              x: 88
              y: 262
              width: 22
              height: 3
              normal: var.accent
              through: true
          舞台标题:
            type: Text
            attribute:
              x: 88
              y: 274
              texts: ~&7房间成员
              fontSize: 36
              through: true
          成员模型行:
            type: HStack
            val: member_row
            attribute:
              point: ~middle_center
              x: 0
              y: 20
              height: 560
              spaceBetween: 40
            children:
              成员卡:
                type: Canvas
                attribute:
                  entryKey: 0.round()
                  entry: var.memberRows[self.entryKey]
                  visible: self.entry != none
                  width: 210
                  height: 560
                children:
                  卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~30,24,50,200
                      shape: ~round_rect
                      radius: 14
                      through: true
                    effect:
                      stroke:
                        width: 2
                        color: "self.parent.entry['leader'] ? var.accent : ~70,60,100,160"
                  成员模型:
                    type: Entity
                    attribute:
                      point: ~top_center
                      x: 0
                      y: 60
                      scale: 5
                      uuid: self.parent.entry['uuid']
                      hideTag: true
                      followMouse: true
                  离线遮罩:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~10,8,18,140
                      shape: ~round_rect
                      radius: 14
                      visible: "!self.parent.entry['online']"
                      through: true
                  队长冠标:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 14
                      texts: ~&e♛
                      fontSize: 48
                      visible: self.parent.entry['leader']
                      through: true
                  成员名:
                    type: Text
                    attribute:
                      point: ~bottom_center
                      y: -64
                      texts: "'&f' + self.parent.entry['name']"
                      fontSize: 36
                      limit: 10
                      through: true
                  准备状态:
                    type: Text
                    attribute:
                      point: ~bottom_center
                      y: -22
                      texts: "self.parent.entry['leader'] ? '&e队长' : (self.parent.entry['ready'] ? '&a已准备' : '&8未准备')"
                      fontSize: 36
                      through: true
                  踢出按钮:
                    type: Canvas
                    attribute:
                      point: ~top_right
                      x: -10
                      y: 10
                      width: 52
                      height: 34
                      visible: "var.isLeader && !self.parent.entry['leader']"
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'party_kick', self.parent.entry['uuid'], var.actionToken)
                    children:
                      踢底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~235,100,100,225
                          hover: ~255,130,130,245
                          shape: ~round_rect
                          radius: 8
                          through: true
                      踢字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: ~&f踢
                          fontSize: 36
                          through: true
          舞台提示:
            type: Text
            attribute:
              point: ~bottom_center
              x: 0
              y: "0 - (var.viewH - 400) / 2 + 40"
              texts: ~&8等待队友加入… 点击底部「邀请玩家」召集小队
              fontSize: 36
              visible: "var.memberCount.round() <= 1"
              through: true
          # ── 右栏 ──
          副本卡底:
            type: Texture
            attribute:
              x: "var.rightX"
              y: 230
              width: "var.rightW"
              height: 300
              normal: ~24,19,40,235
              shape: ~round_rect
              radius: 16
              through: true
            effect:
              stroke:
                width: 2
                color: var.accentDim
          副本卡标线:
            type: Texture
            attribute:
              x: "var.rightX + 26"
              y: 258
              width: 22
              height: 3
              normal: var.accent
              through: true
          副本卡标题:
            type: Text
            attribute:
              x: "var.rightX + 26"
              y: 270
              texts: ~&f目标副本
              fontSize: 36
              through: true
          副本图标:
            type: Slot
            val: 副本图标
            attribute:
              x: "var.rightX + 26"
              y: 322
              width: 72
              height: 72
              iconSize: 56
              normal: var.cardBg
              seticon: "self.setItemIcon(var.hasDungeon && var.dungeon != none && var.dungeon['iconJson'] != none && var.dungeon['iconJson'] != '' ? var.dungeon['iconJson'] : var.air)"
              seticonscale: 1.0
              visible: var.hasDungeon
            children:
              图标底座:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: var.cardBg
                  shape: ~round_rect
                  radius: 10
                  through: true
          副本名:
            type: Text
            attribute:
              x: "var.rightX + 116"
              y: 326
              texts: "var.hasDungeon ? '&f' + var.dungeon['name'] : '&8尚未选择'"
              fontSize: 48
              limit: 12
              through: true
          副本信息行:
            type: Text
            attribute:
              x: "var.rightX + 116"
              y: 384
              texts: "var.hasDungeon ? '&7难度 &e' + var.dungeon['difficulty'] + '  &7人数 &f' + var.dungeon['minPlayers'].round() + '-' + var.dungeon['maxPlayers'].round() + '  &7体力 &f' + var.dungeon['staminaCost'].round() : '&7队长点击右下角「更换副本」'"
              fontSize: 36
              visible: "var.hasDungeon || var.isLeader"
              through: true
          副本信息行2:
            type: Text
            attribute:
              x: "var.rightX + 116"
              y: 426
              texts: "var.hasDungeon ? '&7时限 &f' + var.dungeon['timeLimit'].round() + 's  &7' + var.dungeon['desc0'] : '&7等待队长选择目标副本'"
              fontSize: 36
              visible: "var.hasDungeon || !var.isLeader"
              through: true
          更换副本按钮:
            type: Canvas
            attribute:
              x: "var.rightX + 26"
              y: 464
              width: 150
              height: 46
              visible: var.isLeader
            action:
              clickLeft: |-
                var.dungeonPanel = true
                var.invitePanel = false
            children:
              更换底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: var.cardBg
                  hover: var.cardBgHover
                  shape: ~round_rect
                  radius: 10
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: var.accentDim
              更换字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f更换副本
                  fontSize: 36
                  through: true
          # ── 右下：消息流 + 队聊 ──
          消息底:
            type: Texture
            attribute:
              x: "var.rightX"
              y: 546
              width: "var.rightW"
              height: "var.viewH - 642"
              normal: ~24,19,40,235
              shape: ~round_rect
              radius: 16
              through: true
            effect:
              stroke:
                width: 2
                color: var.accentDim
          消息标线:
            type: Texture
            attribute:
              x: "var.rightX + 26"
              y: 574
              width: 22
              height: 3
              normal: var.accent
              through: true
          消息标题:
            type: Text
            attribute:
              x: "var.rightX + 26"
              y: 586
              texts: ~&f队伍频道
              fontSize: 36
              through: true
          消息滑轨:
            type: Texture
            attribute:
              x: "var.rightX + var.rightW - 20"
              y: 636
              width: 8
              height: "var.viewH - 790"
              normal: ~40,32,62,220
              shape: ~round_rect
              radius: 4
              through: true
          消息滑块:
            type: Texture
            val: feed_slider
            attribute:
              x: "var.rightX + var.rightW - 20"
              y: 636
              width: 8
              height: 80
              normal: var.accent
              maxDragY: "var.viewH - 790 - 80"
              shape: ~round_rect
              radius: 4
          消息滚动区:
            type: Scroll
            attribute:
              x: "var.rightX + 22"
              y: 636
              width: "var.rightW - 60"
              height: "var.viewH - 790"
              moveY: val.feed_slider.getDragYRatio()
            action:
              wheel: |-
                ratio = self.moveY - self.wheelValue * 0.15
                if(ratio < 0){ ratio = 0 }
                if(ratio > 1){ ratio = 1 }
                val.feed_slider.setDragYRatio(ratio)
            children:
              消息列表:
                type: VStack
                val: feed_rows
                attribute:
                  width: "var.rightW - 72"
                  spaceBetween: 6
                children:
                  消息行:
                    type: Text
                    attribute:
                      entryKey: 0.round()
                      entry: var.feedRows[self.entryKey]
                      visible: self.entry != none
                      texts: "self.entry['sender'] == '' ? '&8· ' + self.entry['text'] : '&d' + self.entry['sender'] + ' &7: &f' + self.entry['text']"
                      fontSize: 36
                      limit: 34
                      through: true
          队聊框底:
            type: Texture
            attribute:
              x: "var.rightX + 22"
              y: "var.viewH - 136"
              width: "var.rightW - 152"
              height: 46
              normal: var.cardBg
              shape: ~round_rect
              radius: 8
            effect:
              stroke:
                width: 2
                color: var.accentDim
          队聊输入:
            type: TextBox
            attribute:
              x: "var.rightX + 34"
              y: "var.viewH - 130"
              width: "var.rightW - 176"
              height: 34
              length: 48
              emptyText: ~&7说点什么…
              fontSize: 36
            action:
              textChange: |-
                var.chatMsg = self.getContent()
          队聊发送:
            type: Canvas
            attribute:
              x: "var.rightX + var.rightW - 116"
              y: "var.viewH - 136"
              width: 96
              height: 46
            action:
              clickLeft: |-
                if(var.chatMsg != none && var.chatMsg != ''){
                  Packet.send(var.packetId, 'party_chat', var.chatMsg, var.actionToken)
                  var.chatMsg = ''
                }
            children:
              发送底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~80,160,240,230
                  hover: ~110,185,255,245
                  shape: ~round_rect
                  radius: 8
                  through: true
              发送字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&0发送
                  fontSize: 36
                  through: true
          # ── 加入申请（仅队长可见，浮于消息区上方）──
          申请列表:
            type: VStack
            val: apply_rows
            attribute:
              x: "var.rightX + 22"
              y: "var.viewH - 642 - 120"
              width: "var.rightW - 44"
              spaceBetween: 8
              visible: "var.isLeader && var.applicantCount.round() > 0"
            children:
              申请行:
                type: Canvas
                attribute:
                  entryKey: 0.round()
                  entry: var.applicantRows[self.entryKey]
                  visible: self.entry != none
                  width: "var.rightW - 44"
                  height: 56
                children:
                  申请行底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~64,52,30,235
                      shape: ~round_rect
                      radius: 10
                      through: true
                    effect:
                      stroke:
                        width: 2
                        color: ~200,170,90,170
                  申请文本:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 14
                      texts: "'&e' + self.parent.entry['name'] + ' &7申请加入'"
                      fontSize: 36
                      limit: 16
                      through: true
                  拒按钮:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -10
                      width: 66
                      height: 38
                    action:
