                              point: ~middle_center
                              width: 320
                              texts: "~&f任务列表"
                              fontSize: 32
                              through: true
                      奖励按钮:
                        type: Canvas
                        attribute:
                          width: 320
                          height: 64
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'open_rewards')
                        children:
                          奖励背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~160,100,50,235
                              hover: ~Frosted:0;200,130,70,245
                              shape: ~round_rect
                              radius: 32
                            effect:
                              stroke:
                                width: 2
                                color: ~255,180,100,180
                              neon:
                                color: ~255,180,100,80
                                size: 8
                                intensity: 0.3
                                animated: false
                          奖励文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 320
                              texts: "~&f领取奖励"
                              fontSize: 32
                              through: true
