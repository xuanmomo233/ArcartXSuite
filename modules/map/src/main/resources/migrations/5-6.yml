from-version: 5
to-version: 6
description: "新增跨服地图配置节 cross-server（默认关闭；广播/地形中继/落地传送策略与通道后端覆盖）"
operations:
  - type: set-if-missing
    path: cross-server.enabled
    value: false
  - type: set-if-missing
    path: cross-server.display-name
    value: ""
  - type: set-if-missing
    path: cross-server.proxy-name
    value: ""
  - type: set-if-missing
    path: cross-server.announce-interval-seconds
    value: 120
  - type: set-if-missing
    path: cross-server.node-ttl-seconds
    value: 400
  - type: set-if-missing
    path: cross-server.terrain-relay
    value: true
  - type: set-if-missing
    path: cross-server.request-timeout-seconds
    value: 10
  - type: set-if-missing
    path: cross-server.arrival-delay-ticks
    value: 20
  - type: set-if-missing
    path: cross-server.arrivals.enabled
    value: true
  - type: set-if-missing
    path: cross-server.arrivals.require-anchor-unlock
    value: false
  - type: set-if-missing
    path: cross-server.arrivals.charge-teleport-cost
    value: true
