# Lakeside field guide / Live catch · Narrow right-side instrument, clear lake view.
# Menu input and lifecycle are unchanged; no fullscreen veil or navigation.
ui:
  isHud: false
  background: false
  escClose: false
  closeDied: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.fishInside = false
      var.packetId = packet['packetId']
      var.fishId = packet['fishId']
      var.fishName = packet['fishName']
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.caughtSize = packet['caughtSize']
      var.rarity = packet['rarity']
      var.fishIconJson = packet['fishIconJson']
      var.rarityTag = var.rarityTags[var.rarity]
      var.rarityLabel = var.rarityLabels[var.rarity]
      var.rarityColor = var.rarityColors[var.rarity]
      if(var.fishIconJson == none || var.fishIconJson == ''){
        var.fishIconJson = var.emptyItemJson
      }
      val.鱼图标.seticon()
      val.结果图标.seticon()
    update: |-
      var.fishY = packet['fishY']
      var.barY = packet['barY']
      var.barHeight = packet['barHeight']
      var.progress = packet['progress']
      var.state = packet['state']
      var.timeLeft = packet['timeLeft']
      var.fishInside = packet['fishInside']
  action:
    load: |-
      var.caughtSize = 0
      var.fishIconJson = ''
      var.fishName = ''
      var.fishY = 0.5
      var.rarityLabel = '普通'
      var.barHeight = 0.24
      var.barY = 0.5
      var.packetId = 'AXS_FISHING'
      var.progress = 0.5
      var.rarityTag = '&f'
      var.timeLeft = 600
      var.emptyItemJson = '{"id":"minecraft:fish","Count":1b}'
      var.rarityTags = {'common':'&f', 'uncommon':'&a', 'rare':'&9', 'legendary':'&6'}
      var.rarityLabels = {'common':'普通', 'uncommon':'罕见', 'rare':'稀有', 'legendary':'传说'}
      var.rarityColors = {'common':'191,209,191', 'uncommon':'157,190,169', 'rare':'99,141,182', 'legendary':'231,202,138'}
    open: |-
      Packet.send(var.packetId, 'open_minigame')
    keyPress: |-
      if(self.currentKeyPress() == ' ' || self.currentKeyPress() == 'SPACE'){
        Packet.send(var.packetId, 'input', true)
      }
      if((self.currentKeyPress() == 'q' || self.currentKeyPress() == 'Q') && var.state == 'playing'){
        Packet.send(var.packetId, 'give_up')
      }
    keyRelease: |-
      if(self.currentKeyReleased() == ' ' || self.currentKeyReleased() == 'SPACE'){
        Packet.send(var.packetId, 'input', false)
      }
    click: |-
      Packet.send(var.packetId, 'input', true)
    release: |-
      Packet.send(var.packetId, 'input', false)
controls:
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~middle_center, width: 1920, height: 1080}
    children:
      鱼名胶囊:
        type: Canvas
        attribute: {point: ~middle_center, x: 520, y: -300, width: 460, height: 76, visible: "var.state == 'playing'"}
        children:
          胶囊底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,230', shape: ~round_rect, radius: 16, through: true}}
          鱼名文字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: "'&f' + var.fishName", fontSize: 36, limit: 8, through: true}}
          时间文字: {type: Text, attribute: {point: ~middle_right, x: -20, texts: "(var.timeLeft < 100 ? '&c' : '&f') + (var.timeLeft / 20).round() + 's'", fontSize: 36, through: true}}
      轨道区:
        type: Canvas
        attribute: {point: ~middle_center, x: 520, y: -20, width: 80, height: 440, visible: "var.state == 'playing'"}
        children:
          轨道底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~23,49,64,225', shape: ~round_rect, radius: 18, through: true}
            effect: {stroke: {width: 2, color: '~191,209,191,210'}}
          水深渐变:
            type: Texture
            attribute: {x: 6, y: 6, width: 68, height: 428, normal: '~23,49,64,240', shape: ~round_rect, radius: 14, through: true}
            effect: {gradient: {color1: '~75,116,121,230', color2: '~23,49,64,230', type: 0, angleDeg: 90}}
          绿条:
            type: Texture
            attribute: {x: 10, y: '(1 - var.barY - var.barHeight / 2) * 428 + 6', width: 60, height: 'var.barHeight * 428', normal: "var.fishInside ? '191,222,184,245' : '157,190,169,210'", shape: ~round_rect, radius: 10, through: true}
            effect: {stroke: {width: 2, color: '~231,222,196,220'}}
          鱼图标:
            type: Slot
            val: 鱼图标
            attribute: {slotType: ~Icon, itemScale: 1.0, x: 16, y: 'math.max(6, math.min(386, (1 - var.fishY) * 428 + 6 - 24))', width: 48, height: 48, normal: '~0,0,0,0', through: true, seticon: 'self.setItemIcon(var.fishIconJson)'}
      进度条:
        type: Canvas
        attribute: {point: ~middle_center, x: 592, y: -20, width: 16, height: 440, visible: "var.state == 'playing'"}
        children:
          进度底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,225', shape: ~round_rect, radius: 8, through: true}}
          进度填充: {type: Texture, attribute: {x: 3, y: '(1 - math.max(0, math.min(1, var.progress))) * 434 + 3', width: 10, height: 'math.max(0, math.min(1, var.progress)) * 434', normal: "var.fishInside ? '157,190,169,255' : '211,139,112,255'", shape: ~round_rect, radius: 5, through: true}}
      进度数字: {type: Text, attribute: {point: ~middle_center, x: 592, y: 230, texts: "'&f' + (var.progress * 100).round() + '%'", fontSize: 36, through: true, visible: "var.state == 'playing'"}}
      操作提示:
        type: Text
        attribute: {point: ~middle_center, x: 520, y: 290, texts: ['~&f空格 / 左键：让绿条追踪鱼', '~&7松开下落 · Q 放弃'], fontSize: 36, through: true, visible: "var.state == 'playing'"}
      结果覆盖层:
        type: Canvas
        attribute: {point: ~middle_center, width: 640, height: 260, visible: "var.state == 'success' || var.state == 'failed'"}
        children:
          结果背景: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', shape: ~round_rect, radius: 20, through: true}}
          结果色条: {type: Texture, attribute: {x: 24, y: 24, width: 6, height: 212, normal: "var.state == 'success' ? '157,190,169,255' : '211,139,112,255'", shape: ~round_rect, radius: 3, through: true}}
          结果文字: {type: Text, attribute: {x: 56, y: 24, texts: "var.state == 'success' ? '&f捕获成功' : '&f鱼逃走了'", fontSize: 54, through: true}}
          结果图标:
            type: Slot
            val: 结果图标
            attribute: {slotType: ~Icon, itemScale: 1.2, x: 56, y: 100, width: 104, height: 104, normal: '~0,0,0,0', through: true, visible: "var.state == 'success'", seticon: 'self.setItemIcon(var.fishIconJson)'}
          结果详情: {type: Text, attribute: {x: 188, y: 112, texts: "var.state == 'success' ? '&f' + var.fishName : '&7调整节奏，再试一次'", fontSize: 36, limit: 10, through: true}}
          结果尺寸: {type: Text, attribute: {x: 188, y: 160, texts: "'&7尺寸 ' + var.caughtSize + ' cm'", fontSize: 36, through: true, visible: "var.state == 'success'"}}
          结果稀有度: {type: Text, attribute: {x: 188, y: 208, texts: 'var.rarityTag + var.rarityLabel', fontSize: 36, through: true, visible: "var.state == 'success'"}}
