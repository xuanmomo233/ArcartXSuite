                attribute:
                  point: ~top_left
                  y: 150
                  width: 280
                  spaceBetween: 6
                children:
                  邀请行0:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.inviteRows[self.entryKey]
                      width: 280
                      height: 40
                      visible: self.entry != none
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'party_accept', var.actionToken)
                        Packet.send(var.packetId, 'open_party_ui', var.actionToken)
                    children:
                      邀请行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~60,90,60,230
                          shape: ~round_rect
                          radius: 8
                          through: true
