# 饵料定义：蚯蚓
# 蚯蚓是默认饵料，玩家无其他饵料时自动使用，对鲶鱼和海鲈鱼有吸引效果
# 饵料文件位于 baits/ 目录，每个文件定义一种饵料
#
# 饵料物品由外部物品库（NeigeItems/MythicMobs 等）生成，本配置仅用于识别物品和设置效果。
# item: 块仅用于 UI 图标显示，不用于生成实际物品。
# match: 块用于识别玩家背包里的饵料物品（ItemMatcher 标准格式）。

id: "worm"                     # 饵料唯一标识符
display-name: "蚯蚓"            # 显示名称
item:
  source: minecraft
  id: string
# match: 物品匹配规则（用于识别玩家背包里的饵料物品）
#   neige-item-ids: NeigeItems 物品 ID 列表（匹配其中任一即视为该饵料）
#   mythic-item-ids: MythicMobs 物品 ID 列表
#   overture-item-ids: Overture 物品 ID 列表
#   material-ids: 原版材质名列表（如 [wheat_seeds]）
#   name-contains: 显示名需包含的子串列表
#   lore-contains: Lore 需包含的子串列表
#   nbt-keys: NBT/PDC 键白名单
#   nbt-values: NBT 键值对精确匹配
#   name-regex / lore-regex: 正则匹配
# 所有列表为"或"关系，命中任一即匹配；空列表不参与匹配。
match:
  material-ids: [string]       # 原版线即视为蚯蚓饵料（示例）
  # neige-item-ids: [worm_bait]  # 或用 NeigeItems 物品 ID 匹配
default: true                  # 是否为默认饵料（true=玩家无饵料时自动使用）
fish-attract-modifiers:        # 鱼类吸引倍率（对该鱼种的捕获概率乘数）
  catfish: 2.0                 # 鲶鱼吸引倍率2.0倍
  sea_bass: 1.5                # 海鲈鱼吸引倍率1.5倍
treasure-chance-boost: 0.02    # 宝藏概率额外加成（+2%）
fight-effects:
  - { fish: catfish, action: sinker, recovery-extra-ticks: 8 }
max-durability-bonus: 0        # 鱼竿最大耐久度加成
