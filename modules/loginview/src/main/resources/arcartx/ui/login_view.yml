                                type: Text
                                attribute: {x: 76, y: 6, texts: [~&f禁止使用作弊软件、外挂, ~&f或任何破坏游戏公平性的工具。], fontSize: 36, through: true}
                          规则二:
                            type: Canvas
                            attribute: {width: 1056, height: 90}
                            children:
                              编号:
                                type: Text
                                attribute: {x: 0, y: 4, texts: ~&e02, fontSize: 48, through: true}
                              内容:
                                type: Text
                                attribute: {x: 76, y: 6, texts: [~&f禁止恶意破坏他人建筑、, ~&f偷窃或骚扰其他玩家。], fontSize: 36, through: true}
                          规则三:
                            type: Canvas
                            attribute: {width: 1056, height: 90}
                            children:
                              编号:
                                type: Text
                                attribute: {x: 0, y: 4, texts: ~&e03, fontSize: 48, through: true}
                              内容:
                                type: Text
                                attribute: {x: 76, y: 6, texts: [~&f禁止在公共频道发布广告、色情、, ~&f暴力或政治敏感内容。], fontSize: 36, through: true}
                          规则四:
                            type: Canvas
                            attribute: {width: 1056, height: 90}
                            children:
                              编号:
                                type: Text
                                attribute: {x: 0, y: 4, texts: ~&e04, fontSize: 48, through: true}
                              内容:
                                type: Text
                                attribute: {x: 76, y: 6, texts: [~&f请尊重其他玩家和管理员，, ~&f禁止辱骂、人身攻击或恶意挑衅。], fontSize: 36, through: true}
                          规则五:
                            type: Canvas
                            attribute: {width: 1056, height: 90}
                            children:
                              编号:
                                type: Text
                                attribute: {x: 0, y: 4, texts: ~&e05, fontSize: 48, through: true}
                              内容:
                                type: Text
                                attribute: {x: 76, y: 6, texts: [~&f禁止使用红石/高频装置等, ~&f造成服务器卡顿的行为。], fontSize: 36, through: true}
                          规则六:
                            type: Canvas
                            attribute: {width: 1056, height: 90}
                            children:
                              编号:
                                type: Text
                                attribute: {x: 0, y: 4, texts: ~&e06, fontSize: 48, through: true}
                              内容:
                                type: Text
                                attribute: {x: 76, y: 6, texts: [~&f禁止利用游戏漏洞或 BUG, ~&f获取不正当利益。], fontSize: 36, through: true}
                          规则七:
                            type: Canvas
                            attribute: {width: 1056, height: 90}
                            children:
                              编号:
                                type: Text
                                attribute: {x: 0, y: 4, texts: ~&e07, fontSize: 48, through: true}
                              内容:
                                type: Text
                                attribute: {x: 76, y: 6, texts: [~&f账号安全由玩家本人负责，, ~&f请勿共享账号密码。], fontSize: 36, through: true}
              底部分隔:
                type: Texture
                attribute: {x: 42, y: 682, width: 1096, height: 2, normal: '~63,79,93,255', through: true}
