# AXS Warehouse Manage
# 纯色块风格仓库管理界面：共享仓库删除和成员管理。

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 包标识符（'AXS_WAREHOUSE'）
    #   - action_token: 操作令牌（防重放）
    #   - ownerType: 仓库所有者类型（personal / shared）
    #   - ownerId: 所有者 ID
    #   - warehouseId: 仓库 ID
    #   - warehouseName: 仓库名称
    #   - personalWarehouses: 个人仓库列表
    #   - personalWarehouseTexts: 个人仓库显示文本
    #   - manageWarehouses: 可管理的仓库列表
    #   - manageWarehouseTexts: 可管理仓库显示文本
    #   - manageWarehouseTypes: 可管理仓库类型
    #   - manageWarehouseTargets: 可管理仓库目标
    #   - manageWarehouseSelected: 当前选中的管理仓库索引
    #   - sharedWarehouses: 共享仓库列表
    #   - sharedWarehouseManageTexts: 共享仓库管理显示文本
    #   - sharedCreateCostText: 创建共享仓库费用文本
    #   - sharedRoleOwnerName: 共享仓库所有者角色名
    #   - sharedRoleMemberName: 共享仓库成员角色名
    #   - sharedRoleViewerName: 共享仓库观众角色名
    #   - sharedMembers: 共享仓库成员列表
    #   - sharedMemberTexts: 成员显示文本
    #   - sharedMemberNames: 成员名称列表
    #   - sharedMemberRoles: 成员角色列表
    #   - unlocked: 二级密码是否已解锁
    #   - hasPassword: 是否已设置二级密码
    #   - readOnly: 是否只读模式
    #   - lockOwner: 编辑锁持有者
    #   - capacityText: 容量显示文本
    #   - level: 仓库等级
    #   - canUpgrade: 是否可升级
    #   - nextUpgradeText: 下一级升级信息文本
    #   - autoPickup: 是否启用自动拾取
    #   - autoPickupMythic: 是否自动拾取 MythicMobs 掉落
    #   - autoPickupNotify: 是否通知自动拾取
    #   - showcaseEnabled: 是否启用展示柜
    #   - maxManageCount: 可管理仓库最大数量（用于动态创建控件）
    #   - maxMemberCount: 成员最大数量
    update: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.manageWarehouses = packet['manageWarehouses']
      var.manageWarehouseTexts = packet['manageWarehouseTexts']
      var.manageWarehouseTypes = packet['manageWarehouseTypes']
      var.manageWarehouseTargets = packet['manageWarehouseTargets']
      var.manageWarehouseSelected = packet['manageWarehouseSelected']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseManageTexts = packet['sharedWarehouseManageTexts']
      var.sharedCreateCostText = packet['sharedCreateCostText']
      var.sharedRoleOwnerName = packet['sharedRoleOwnerName']
      var.sharedRoleMemberName = packet['sharedRoleMemberName']
      var.sharedRoleViewerName = packet['sharedRoleViewerName']
      var.sharedMembers = packet['sharedMembers']
      var.sharedMemberTexts = packet['sharedMemberTexts']
      var.sharedMemberNames = packet['sharedMemberNames']
      var.sharedMemberRoles = packet['sharedMemberRoles']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.lockOwner = packet['lockOwner']
      var.capacityText = packet['capacityText']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.autoPickup = packet['autoPickup']
      var.autoPickupMythic = packet['autoPickupMythic']
      var.autoPickupNotify = packet['autoPickupNotify']
      var.showcaseEnabled = packet['showcaseEnabled']
      var.maxManageCount = packet['maxManageCount']
      var.maxMemberCount = packet['maxMemberCount']
      共享数 = var.maxManageCount.round()
      现有共享数 = val.共享列表.childrenCount() - 1
      if(现有共享数 != 共享数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.共享列表.childrenCount() > 1){
          val.共享列表.get(1).remove()
        }
        if(共享数 > 1){
          for(序号 in range(1, 共享数 - 1)){
            项 = val.共享列表['项'].copy('共享项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      成员数 = var.maxMemberCount.round()
      现有成员数 = val.成员列表.childrenCount() - 1
      if(现有成员数 != 成员数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.成员列表.childrenCount() > 1){
          val.成员列表.get(1).remove()
        }
        if(成员数 > 1){
          for(序号 in range(1, 成员数 - 1)){
            项 = val.成员列表['项'].copy('成员项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
  action:
    load: |-
      var.packetId = 'AXS_WAREHOUSE'
      var.ownerType = 'personal'
      var.ownerId = none
      var.warehouseId = none
      var.warehouseName = 'AXS 仓库'
      var.personalWarehouses = {}
      var.personalWarehouseTexts = {}
      var.manageWarehouses = {}
      var.manageWarehouseTexts = {}
      var.manageWarehouseTypes = {}
      var.manageWarehouseTargets = {}
      var.manageWarehouseSelected = {}
      var.sharedWarehouses = {}
      var.sharedWarehouseManageTexts = {}
      var.sharedCreateCostText = '创建共享仓库免费'
      var.sharedRoleOwnerName = '所有者'
      var.sharedRoleMemberName = '成员'
      var.sharedRoleViewerName = '观众'
      var.sharedMembers = {}
      var.sharedMemberTexts = {}
      var.sharedMemberNames = {}
      var.sharedMemberRoles = {}
      var.unlocked = false
      var.hasPassword = false
      var.readOnly = false
      var.lockOwner = none
      var.capacityText = '0/0'
      var.level = 1
      var.canUpgrade = false
      var.nextUpgradeText = none
      var.sharedName = none
      var.renameName = none
      var.memberName = none
      var.memberRole = 'member'
      var.passwordText = none
      var.actionToken = ''
      var.deleteConfirm = false
      var.deletePassword = none
      var.sharedListScrollRatio = 0
      var.showcaseEnabled = true
      var.autoPickup = true
      var.autoPickupMythic = true
      var.autoPickupNotify = true
      var.maxManageCount = 0
      var.maxMemberCount = 0
      var.刷新轮次 = 0
    open: |-
      Packet.send(var.packetId, 'refresh')

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~stretch_all
        children:
          玻璃底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100

          顶栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 18
              width: 1872
              height: 90
            children:
              顶栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~48,52,60,215
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 10
                  width: 700
                  texts: "~&f仓库管理"
                  fontSize: 44
                  through: true
              当前仓库:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 54
                  width: 1100
                  texts: "'&f' + var.warehouseName + (var.ownerType == 'shared' ? '  &b共享仓库' : '  &a个人仓库') + (var.readOnly ? '  &c只读' : '') + (var.unlocked ? '  &a已解锁' : '  &7未解锁')"
                  fontSize: 26
                  through: true
              导航组:
                type: HStack
                attribute:
                  point: ~top_left
                  x: 1636
                  y: 19
                  width: 212
                  height: 52
                  spaceBetween: 12
                children:
                  仓库:
                    type: Canvas
                    attribute:
                      width: 100
                      height: 52
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'storage')
                    children:
                      仓库底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~62,66,74,210
                          shape: ~round_rect
                          radius: 14
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
                      仓库字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 100
                          texts: "~&f仓库"
                          fontSize: 32
                          through: true
                  银行:
                    type: Canvas
                    attribute:
                      width: 100
                      height: 52
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'bank')
                    children:
                      银行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~62,66,74,210
                          shape: ~round_rect
                          radius: 14
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
                      银行字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 100
                          texts: "~&f银行"
                          fontSize: 32
                          through: true

          仓库列表区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 124
              width: 520
              height: 816
            children:
              列表底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~48,52,60,215
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              列表标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 22
                  y: 16
                  width: 460
                  texts: "~&f仓库列表"
                  fontSize: 36
                  through: true
              新建名:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 22
                  y: 60
                  width: 288
                  height: 48
                children:
                  新建名底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~40,44,52,225
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
                  输入框:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 10
                      width: 268
                      height: 38
                      length: 24
                      emptyText: ~共享名
                      fontSize: 34
                    action:
                      textChange: |-
                        var.sharedName = self.getContent()
              创建:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 322
                  y: 60
                  width: 176
                  height: 48
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'shared_create', var.sharedName, var.actionToken)
                children:
                  创建底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~232,180,90,235
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '245,205,130,255' : '232,180,90,255'"
                  创建字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 176
                      texts: "~&8新建共享"
                      fontSize: 32
                      through: true
              创建费用:
                type: Text
                attribute:
                  point: ~top_left
                  x: 22
                  y: 118
                  width: 476
                  texts: "'&7' + var.sharedCreateCostText"
                  fontSize: 24
                  through: true
              共享滑块:
                type: Texture
                val: 共享滑块
                attribute:
                  point: ~top_left
                  x: 486
                  y: 152
                  width: 12
                  height: 50
                  normal: ~245,205,130,255
                  maxDragY: 590
                  shape: ~round_rect
                  radius: 6
              共享滚动:
                type: Scroll
                val: 共享滚动
                attribute:
                  point: ~top_left
                  x: 22
                  y: 152
                  width: 452
                  height: 640
                  moveY: "self.parent['共享滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['共享滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['共享滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  共享列表:
                    val: 共享列表
                    type: VStack
                    attribute:
                      spaceBetween: 10
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.manageWarehouses[self.entryKey]
                          visible: self.entry != none
                          width: 446
                          height: 54
                        action:
                          clickLeft: |-
                            var.deleteConfirm = false
                            var.renameName = none
                            if(var.manageWarehouseTypes[self.entryKey] == 'shared'){
                              Packet.send(var.packetId, 'shared', var.manageWarehouseTargets[self.entryKey])
                            }else{
                              Packet.send(var.packetId, 'warehouse', var.manageWarehouseTargets[self.entryKey])
                            }
                        children:
                          项背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "var.manageWarehouseSelected[self.parent.entryKey] ? '104,84,46,225' : '62,66,74,210'"
                              shape: ~round_rect
                              radius: 14
                            effect:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '245,205,130,255' : (var.manageWarehouseSelected[self.parent.entryKey] ? '232,180,90,235' : '255,255,255,230')"
                          项文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 446
                              texts: "var.manageWarehouseTexts[self.parent.entryKey]"
                              fontSize: 30
                              through: true

          设置区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 568
              y: 124
              width: 700
              height: 816
            children:
              设置底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~48,52,60,215
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              设置标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 16
                  width: 640
                  texts: "~&f仓库设置"
                  fontSize: 36
                  through: true
              拾取标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 62
                  width: 640
                  texts: "~&f自动拾取"
                  fontSize: 30
                  through: true
              拾取组:
                type: HStack
                attribute:
                  point: ~top_left
                  x: 24
                  y: 100
                  width: 652
                  height: 48
                  spaceBetween: 16
                children:
                  自动入库:
                    type: Canvas
                    attribute:
                      width: 206
                      height: 48
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'toggle_auto_pickup', var.actionToken)
                    children:
                      自动入库底:
                        type: Texture
