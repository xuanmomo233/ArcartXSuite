ui:
  isHud: false
  defaultOpen: false
  background: true
  escClose: true
  screenScale: true
  through: false
  hide:
  - hotbar
  - crosshair
  - chat_panel
  action:
    load: |-
      var.token = ''
      var.slotPrefix = ''
      var.slotsDirty = false
      var.fieldsDirty = false
      var.fieldVersion = -1
      var.recipes = {}
      var.selected = ''
      var.recipeId = ''
      var.permission = ''
      var.station = '有序'
      var.matching = '精确匹配'
      var.page = '1 / 1'
      var.hasPrevious = false
      var.hasNext = false
      var.confirmDelete = false
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeLines = []
      var.noticeCount = 0
      var.noticeFade = Fade(80, 900, 220)
    open: Packet.send('AXS:vanilla_recipe_editor', 'ready')
    close: Packet.send('AXS:vanilla_recipe_editor', 'close', var.token)
    tick: |-
      if(var.fieldsDirty && val.editorId != none && val.editorPermission != none){
        var.fieldsDirty = false
        val.editorId.setContent(var.recipeId)
        val.editorPermission.setContent(var.permission)
      }
      if(var.slotsDirty && val.extra0 != none && val.extra1 != none && val.extra2 != none
          && val.extra3 != none && val.extra4 != none && val.extra5 != none
          && val.extra6 != none && val.extra7 != none && val.extra8 != none && val.extra9 != none){
        var.slotsDirty = false
        slots = [val.extra0, val.extra1, val.extra2, val.extra3, val.extra4, val.extra5, val.extra6, val.extra7, val.extra8, val.extra9]
        for(i in range(0, 9)){slots[i.round()].id = var.slotPrefix + i.round()}
      }
      if(var.noticeActive){
        opacity = var.noticeFade.get()
        if(opacity > 0){var.noticePeaked = true}
        if(var.noticePeaked && opacity <= 0){var.noticeActive = false}
      }
  packetHandler:
    recipe_editor_state: |-
      var.token = packet['token']
      if(var.slotPrefix != packet['slotPrefix']){
        var.slotPrefix = packet['slotPrefix']
        var.slotsDirty = true
      }
      var.recipes = packet['list']
      var.selected = packet['selected']
      var.station = packet['station']
      var.matching = packet['matching']
      var.page = packet['page']
      var.hasPrevious = packet['hasPrevious']
      var.hasNext = packet['hasNext']
      if(var.fieldVersion != packet['fieldVersion']){
        var.fieldVersion = packet['fieldVersion']
        var.recipeId = var.selected
        var.permission = packet['permission']
        var.fieldsDirty = true
        var.confirmDelete = false
      }
      message = packet['message']
      if(message != '' && !var.noticeActive){
        wrapped = message.replaceAll('(?i)[&§][0-9A-FK-ORX]', '').replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = wrapped.split('\n')
        var.noticeCount = math.min(12, var.noticeLines.size())
        var.noticeActive = var.noticeCount > 0
        var.noticePeaked = false
        var.noticeFade.reset()
      }
