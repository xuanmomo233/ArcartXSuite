                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f物品上架"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 14
              y: 420
              width: 272
              height: 1
              normal: ~62,66,74,210
              through: true
          # ── 回收信息面板 ──────────────────────────
          倍率标题:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 440
              texts: "~&f回收倍率"
              fontSize: 36
              through: true
          倍率值:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 480
              texts: "'&e' + var.multiplier + 'x'"
              fontSize: 48
              through: true
          收益标题:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 540
              texts: "'&f' + var.earningsTitle"
              fontSize: 36
              through: true
          收益滑块:
            type: Texture
            val: 收益滑块
            attribute:
              x: 278
              y: 580
              width: 6
              height: 44
              maxDragY: "var.viewH - 908"
              normal: ~131,177,196,245
          收益列表容器:
            type: Scroll
            attribute:
              point: ~top_left
              x: 28
              y: 580
              width: 244
              height: "var.viewH - 864"
              moveY: "val.收益滑块.getDragYRatio()"
            action:
              wheel: |-
                val.收益滑块.setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            children:
              收益列表:
                type: RepeatGrid
                val: 收益列表
                attribute:
                  items: "var.收益列表GridRows"
                  flow: ~row
                  column: 1
                  spaceBetweenY: 6
                  maxSize: "var.收益列表GridRows == none ? 0 : var.收益列表GridRows.size()"
                  width: 244
                children:
                  收益项:
                    type: Scroll
                    attribute:
                      entryKey: self.item
                      width: 244
                      height: 38
                      visible: "var.earningsTexts[self.entryKey] != none"
                      scrollAnim: none
                      moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                    action:
                      enter: |-
                        self.scrollAnim = Lerp(0,1,2500)
                      leave: |-
                        self.scrollAnim = none
                    children:
                      文字:
                        type: Text
                        attribute:
                          texts: "'&a' + var.earningsTexts[self.parent.entryKey]"
                          fontSize: 26
                          through: true
          # ── 一键回收按钮 ──────────────────────────
          回收保护入口:
            type: Canvas
            attribute:
              x: "14"
              y: "self.parent.height - 112"
              width: "272"
              height: 44
              enable: "!var.actionBusy"
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'guard_ui_open')
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~48,67,82,240
                  shape: ~round_rect
                  radius: 8
              文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&b个人回收保护"
                  fontSize: 24
                  through: true
          自动回收状态:
            type: Text
            attribute:
              x: 14
              y: "self.parent.height - 186"
              texts: "var.autoEffective ? '&a个人自动回收生效中' : '&7个人自动回收未生效'"
              fontSize: 22
              through: true
          保护提示:
            type: Text
            attribute:
              x: "14"
              y: "self.parent.height - 156"
              texts: "'&7已保留受保护物品 ' + var.protectedItems.round() + ' 件'"
              fontSize: 22
              through: true
          一键回收按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: "self.parent.height - 56"
              width: 272
              height: 48
              enable: "!var.actionBusy && var.actionToken != '' && var.eligibleCount > 0 && var.batchEnabled"
            action:
              clickLeft: |-
                if(var.batchConfirm){
                  var.confirmProtectionVersion = var.protectionVersion
                  var.confirmInventoryFingerprint = var.inventoryFingerprint
                  var.showBatchConfirm = true
                } else {
                  var.actionBusy = true
                  Packet.send(var.packetId, 'recycle_all', var.actionToken, var.inventoryFingerprint, var.protectionVersion)
                }
            children:
              一键回收底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~80,200,120,230
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,140,255' : '255,255,255,230'"
              一键回收文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f一键回收"
                  fontSize: 36
                  through: true
          刷新按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: "var.viewH - 76"
              width: 272
              height: 48
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'recycle_preview')
            children:
              刷新底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f刷新预览"
                  fontSize: 36
                  through: true

      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          内容标题:
            type: Text
            attribute:
              point: ~top_left
              x: 24
              y: 24
              texts: "~&f可回收物品"
              fontSize: 48
          空物品提示:
            type: Text
            attribute:
              point: ~middle_center
              x: 0
              y: -40
              fontSize: 64
              visible: "var.recyclables == none || var.recyclables.keys().length == 0"
              texts: "~&8背包中没有可回收物品"
              through: true
          物品滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -18
              y: 88
              width: 8
              height: "var.viewH - 256"
              normal: ~42,50,66,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          物品滑块:
            type: Texture
            val: 物品滑块
            attribute:
              point: ~top_right
              x: -18
              y: 88
              width: 8
              height: 80
              normal: ~140,200,255,255
              maxDragY: "var.viewH - 336"
              shape: ~round_rect
              radius: 4
          物品滚动:
            type: Scroll
            val: 物品滚动
            attribute:
              point: ~top_left
              x: 24
              y: 88
              width: "var.scrollW"
              height: "var.viewH - 256"
              moveY: "self.parent['物品滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              回收列表:
                val: 回收列表
                type: RepeatGrid
                attribute:
                  items: "var.回收列表Rows"
                  flow: ~row
                  maxSize: "var.回收列表Rows == none ? 0 : var.回收列表Rows.size()"
                  width: "var.scrollW"
                  column: 3
                  spaceBetweenX: 16
                  spaceBetweenY: 16
                children:
                  回收卡片:
                    type: Canvas
                    attribute:
                      entryKey: self.item
                      entry: var.recyclables[self.entryKey]
                      visible: self.entry != none
                      width: "var.cardW"
                      height: 260
                    children:
                      卡片底:
                        type: Texture
                        attribute:
                          point: ~top_left
                          x: 3
                          y: 0
                          width: "var.cardW - 6"
                          height: 260
                          through: true
                          normal: ~42,50,66,210
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
                      物品图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 0.72
                          x: 15
                          y: 12
                          width: 96
                          height: 96
                          normal: ~36,42,54,220
                          shape: ~round_rect
                          radius: 12
                          seticon: "self.setItemIcon(var.itemJsons[self.parent.entryKey])"
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,230
                      物品名称:
                        type: Scroll
                        attribute:
                          x: 123
                          y: 16
                          width: "var.cardW - 140"
                          height: 42
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: |-
                            self.scrollAnim = Lerp(0,1,2500)
                          leave: |-
                            self.scrollAnim = none
                        children:
                          文字:
                            type: Text
                            attribute:
                              x: 0
                              y: 0
                              texts: "self.parent.parent.entry != none ? ('&f' + self.parent.parent.entry['name']) : ''"
                              fontSize: 36
                              through: true
                      数量:
                        type: Text
                        attribute:
                          x: 123
                          y: 52
                          texts: "self.parent.entry != none ? ('&7数量: &f' + self.parent.entry['amount'].round()) : ''"
                          fontSize: 32
                          through: true
                      单价:
                        type: Scroll
                        attribute:
                          x: 123
                          y: 88
                          width: "var.cardW - 140"
                          height: 38
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: |-
                            self.scrollAnim = Lerp(0,1,2500)
                          leave: |-
                            self.scrollAnim = none
                        children:
                          文字:
                            type: Text
                            attribute:
                              x: 0
                              y: 0
                              texts: "self.parent.parent.entry != none ? ('&7单价: &e' + self.parent.parent.entry['unitPrice'] + ' &7' + self.parent.parent.entry['currencyName']) : ''"
                              fontSize: 32
                              through: true
                      总价:
                        type: Scroll
                        attribute:
                          x: 123
                          y: 124
                          width: "var.cardW - 140"
                          height: 38
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: |-
                            self.scrollAnim = Lerp(0,1,2500)
                          leave: |-
                            self.scrollAnim = none
                        children:
                          文字:
                            type: Text
                            attribute:
                              x: 0
                              y: 0
                              texts: "self.parent.parent.entry != none ? ('&a总价: &f' + self.parent.parent.entry['totalPrice'] + ' &7' + self.parent.parent.entry['currencyName']) : ''"
                              fontSize: 32
                              through: true
                      保护原因:
                        type: Scroll
                        attribute:
                          x: 15
                          y: 172
                          width: "var.cardW - 30"
                          height: 28
                          visible: "self.parent.entry['protected']"
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: |-
                            self.scrollAnim = Lerp(0,1,2500)
                          leave: |-
                            self.scrollAnim = none
                        children:
                          文字:
                            type: Text
                            attribute:
                              texts: "'&7' + self.parent.parent.entry['protectedReason']"
                              fontSize: 22
                              through: true
                      回收按钮:
                        type: Canvas
                        attribute:
                          x: 15
                          y: 208
                          width: "var.cardW - 30"
                          height: 40
                          enable: "!var.actionBusy && var.actionToken != '' && self.parent.entry != none && !self.parent.entry['protected']"
                        action:
                          clickLeft: |-
                            var.actionBusy = true
                            Packet.send(var.packetId, 'recycle_single', self.parent.entry['slot'].round(), var.actionToken, self.parent.entry['fingerprint'], var.protectionVersion)
                        children:
                          回收单底:
                            type: Texture
                            attribute:
                              point: ~top_left
                              x: 3
                              y: 0
                              width: "var.cardW - 36"
                              height: 40
                              through: true
                              normal: ~220,150,50,230
                              shape: ~round_rect
                              radius: 10
                            effect:
                              ripple:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '255,180,60,255' : '255,255,255,230'"
                          回收单文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "self.parent.parent.entry != none && self.parent.parent.entry['protected'] ? '&7已保护 · 不回收' : '&f回收此物品'"
                              fontSize: 32
                              through: true
  批量回收确认:
    type: Canvas
    attribute:
      point: ~stretch_all
      visible: "var.showBatchConfirm == true"
    children:
      遮罩:
        type: Texture
        attribute:
          point: ~stretch_all
          normal: ~12,19,33,178
      面板:
        type: Adaptive
        attribute:
          point: ~middle_center
          width: 640
          height: 240
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~32,43,62,250
              shape: ~round_rect
              radius: 12
            effect:
              stroke:
                width: 2
                color: ~86,145,225,200
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 28
              texts: "~&f确认回收背包中全部可回收物品？"
              fontSize: 32
              through: true
          提示:
            type: Text
            attribute:
              point: ~middle_center
              texts: "~&7仅回收当前预览范围；背包或保护变化后需重新确认。"
              fontSize: 24
              through: true
          确认:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 60
              y: -24
              width: 200
              height: 48
              enable: "!var.actionBusy && var.actionToken != '' && var.batchEnabled"
            action:
              clickLeft: |-
                var.showBatchConfirm = false
                var.actionBusy = true
                Packet.send(var.packetId, 'recycle_all', var.actionToken, var.confirmInventoryFingerprint, var.confirmProtectionVersion)
            children:
              文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&a确认回收"
                  fontSize: 32
                  through: true
          取消:
            type: Canvas
            attribute:
              point: ~bottom_right
              x: -60
              y: -24
              width: 200
              height: 48
            action:
              clickLeft: |-
                var.showBatchConfirm = false
            children:
              文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f取消"
                  fontSize: 32
                  through: true
