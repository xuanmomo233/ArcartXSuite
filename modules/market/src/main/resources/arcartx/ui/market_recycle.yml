# AXS Market — 交易所
ui:
  isHud: false
  defaultOpen: false
  hide:
  - hotbar
  - experience_bar
  - crosshair
  - item_name
  - jump_bar
  - mount_health
  - player_state
  - player_health
  - armor_level
  - food_level
  - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    update: |-
      var.itemJsons = {}
      oldMaxRecycleCount = var.maxRecycleCount
      var.packetId = packet['packetId']
      var.recyclables = packet['recyclables'] != none ? packet['recyclables'] : {}
      var.earningsTitle = packet['earningsTitle']
      var.earningsTexts = packet['earningsTexts']
      var.maxEarningsCount = packet['maxEarningsCount']
      var.multiplier = packet['multiplier']
      var.maxRecycleCount = packet['maxRecycleCount']
      var.batchConfirm = packet['batchConfirm']
      var.actionToken = packet['action_token']
      for(key in var.recyclables.keys()){
        json = packet['recycleItemJson' + key]
        if(json != none && json != ''){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      if(var.maxRecycleCount != oldMaxRecycleCount){
        for(key in var.recycleRefs.keys()){
          var.recycleRefs[key].remove()
        }
        var.recycleRefs = {}
        var.itemRound = var.itemRound + 1
        if(var.maxRecycleCount > 1){
          for(i in range(1, var.maxRecycleCount - 1)){
            row = val.回收列表.get(0).copy('回收卡片_' + var.itemRound.round() + '_' + i.round())
            row.entryKey = i.round()
            var.recycleRefs[i.round()] = row
          }
        }
      }
      if(var.maxRecycleCount > 0){
        val.回收列表.get(0)['物品图标'].seticon()
        for(key in var.recycleRefs.keys()){
          var.recycleRefs[key]['物品图标'].seticon()
        }
      }
      var.actionBusy = false
      var.actionBusySeconds = 0
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.earningsTexts = {}
      var.earningsTitle = '可回收总价值:'
      var.maxRecycleCount = 0
      var.multiplier = '1.0'
      var.packetId = 'AXS_MARKET'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.recyclables = {}
      var.maxRecycleCount = 0
      var.itemJsons = {}
      var.recycleRefs = {}
      var.itemRound = 0
      self.actions['resize']()
    open: Packet.send(var.packetId, 'recycle_preview')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 572
      var.scrollW = var.contentW - 64
      var.cardW = (var.scrollW - 16) / 2
