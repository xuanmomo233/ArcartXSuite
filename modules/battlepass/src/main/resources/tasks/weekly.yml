# =============================================================================
# 每周任务池
# 分配给玩家的每周任务从这里按 weight 加权随机抽取 weekly-count 个
# 每 7 天自动重置并重新分配，周数自动递增
# =============================================================================
# 事件源说明详见 daily.yml 头部注释
# =============================================================================

# -------- 完成悬赏任务 --------
# questgps 依赖 Chemdah 插件，若无 Chemdah 则此任务不会被触发
weekly-quest-5:
  display-name: "完成悬赏任务"
  description: "本周累计完成5个悬赏任务"
  difficulty: normal
  event-topic: "axs.questgps.quest_completed"
  required-count: 5
  base-xp-reward: 500
  conditions: []
  increment-strategy:
    type: fixed
    value: 1
  weight: 3

# -------- 百斩 --------
weekly-kill-100:
  display-name: "百斩"
  description: "本周累计击杀100个敌对生物"
  difficulty: hard
  event-topic: "axs.combateffect.kill_entity"
  bukkit-event:
    event-classes:
      - "org.bukkit.event.entity.EntityDeathEvent"
      - "xuanmo.arcartxsuite.api.event.TaczGunKillEvent"
  required-count: 100
  base-xp-reward: 600
  conditions: []
  increment-strategy:
    type: fixed
    value: 1
  weight: 2

# -------- 累计消费货币 --------
# axs.currency.spent 由宿主核心 CurrencyBridgeManager 发布，无需降级
weekly-spend-1000:
  display-name: "消费达人"
  description: "本周累计消费1000金币"
  difficulty: normal
  event-topic: "axs.currency.spent"
  required-count: 1000
  base-xp-reward: 400
  conditions:
    - type: event_payload
      key: currency_id
      operator: equals
      value: money
  increment-strategy:
    type: payload_value
    payload-key: amount
    max-per-event: 500
    scale: 1.0
  weight: 2

# -------- 累计造成伤害 --------
weekly-damage-2000:
  display-name: "战斗狂人"
  description: "本周累计造成2000点伤害"
  difficulty: normal
  event-topic: "axs.combateffect.damage_dealt"
  bukkit-event:
    event-classes:
      - "org.bukkit.event.entity.EntityDamageByEntityEvent"
      - "xuanmo.arcartxsuite.api.event.TaczGunDamageEvent"
  required-count: 2000
  base-xp-reward: 450
  conditions: []
  increment-strategy:
    type: payload_value
    payload-key: damage
    max-per-event: 500
    scale: 1.0
  weight: 2

