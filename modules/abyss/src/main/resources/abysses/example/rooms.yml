        monsters:
          - mob-id: vanilla:spider
            location: "43,61,7"
            amount: 2
          - mob-id: vanilla:spider
            location: "38,61,11"
            amount: 2
          - mob-id: vanilla:creeper
            location: "48,61,11"
            amount: 1
      w2:
        spawn-timing: TRIGGERED
        trigger-after: [w1a, w1b]
        on-prespawn:
          - "title @all 5 30 10 &e第二波 &c3 秒后来袭！"
          - "sound @all ENTITY_RAVAGER_ROAR 0.6 0.8"
        monsters:
