# QuestGPS · Expedition route HUD
# A small limestone heading and three independent route strips; no full panel veil.
# Cobalt waypoints / orange route thread / full-text overflow ticker.
# HUD configuration and fixed tracking-slot bindings are retained.

ui:
  isHud: true
  defaultOpen: false
  background: false
  closeDied: true
  through: true
  screenScale: true
  show: true
  level: 3
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.active = packet['active']
      var.trackedCount = packet['trackedCount']
      var.quests = packet['quests']
      var.questCount = packet['questCount']
      var.questKeys = var.quests.keys()
      var.taskIndex = 0
      for(key in var.questKeys){
        item = val.guide_quest_list['追踪卡' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = key
        }
        var.taskIndex = var.taskIndex + 1
      }
      while(var.taskIndex < 3){
        item = val.guide_quest_list['追踪卡' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = none
        }
        var.taskIndex = var.taskIndex + 1
      }
    update: |-
      var.packetId = packet['packetId']
      var.active = packet['active']
      var.trackedCount = packet['trackedCount']
      var.quests = packet['quests']
      var.questCount = packet['questCount']
      var.questKeys = var.quests.keys()
      var.taskIndex = 0
      for(key in var.questKeys){
        item = val.guide_quest_list['追踪卡' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = key
        }
        var.taskIndex = var.taskIndex + 1
      }
      while(var.taskIndex < 3){
        item = val.guide_quest_list['追踪卡' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = none
        }
        var.taskIndex = var.taskIndex + 1
      }
  action:
    load: |-
      var.trackedCount = 0
      var.quests = {}
      var.guideTextSeconds = 0
      var.guideTextAnim = Lerp(0, 1, 6000)
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    # Only text that exceeds its viewport moves. Short objectives remain stationary.
    seconds: |-
      if(var.active){
        var.guideTextSeconds = var.guideTextSeconds + 1
        if(var.guideTextSeconds >= 10){
          var.guideTextSeconds = 0
          var.guideTextAnim = Lerp(0, 1, 6000)
        }
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute: {point: '~top_center', width: 1920, height: 1080, through: true}
    children:
      任务面板:
        type: Canvas
        attribute:
          point: ~top_left
          x: '20 - var.offX'
          y: 220
          width: 416
          height: '44 + var.questCount * 116'
          visible: var.active
          through: true
        effect:
          offsetAnimate:
            duration: 250
            interpolator: decelerate
            x: -440
            y: 0
        children:
          # The header alone is limestone. Empty space between route strips stays clear.
          标题底:
            type: Texture
            attribute: {point: '~top_left', x: 24, width: 392, height: 44, normal: '~235,228,208,235', shape: '~round_rect', radius: 4, through: true}
          标题:
            type: Text
            attribute: {point: '~top_left', x: 36, y: 4, texts: '~&0远征指引', fontSize: 36, through: true}
          数量文字:
            type: Text
            attribute: {point: '~top_right', x: -12, y: 4, texts: "'&1' + var.trackedCount.round() + ' 个航点'", fontSize: 36, through: true}
          强调条:
            type: Texture
            attribute: {point: '~top_left', x: 8, y: 0, width: 4, height: 44, normal: '~225,111,46,255', through: true}
          任务列表:
            val: guide_quest_list
            type: VStack
            attribute: {point: '~top_left', y: 52, width: 416, spaceBetween: 8, through: true}
            children:
              # Fixed slots are named exactly as used by init/update; no copy lifecycle on this HUD.
              追踪卡0:
                type: Canvas
                attribute:
                  width: 416
                  height: 108
                  entryKey: none
                  visible: self.entryKey != none && var.quests[self.entryKey] != none
                  entry: var.quests[self.entryKey]
                  through: true
                children:
                  项背景:
                    type: Texture
                    attribute: {point: '~top_left', x: 24, width: 392, height: 108, normal: '~25,46,79,222', shape: '~round_rect', radius: 4, through: true}
                  路线线:
                    type: Texture
                    attribute: {point: '~top_left', x: 10, width: 2, height: 108, normal: '~225,111,46,230', through: true}
                  航点:
                    type: Texture
                    attribute: {point: '~top_left', x: 4, y: 12, width: 14, height: 14, normal: '~42,83,154,255', shape: '~circle', through: true}
                    effect:
                      stroke: {width: 2, color: '~235,228,208,240'}
                  任务名:
                    type: Scroll
                    attribute: {point: '~top_left', x: 40, y: 0, width: 276, height: 36, moveX: 'var.guideTextAnim.get()', through: true}
                    children:
                      名称布局:
                        type: HStack
                        attribute: {height: 36, through: true}
                        children:
                          名称文字:
                            type: Text
                            attribute: {texts: "'&f' + self.parent.parent.parent.entry['name']", fontSize: 36, through: true}
                  进度文字:
                    type: Text
                    attribute: {point: '~top_right', x: -12, y: 0, texts: "'&f' + self.parent.entry['progressText']", fontSize: 36, through: true}
                  当前目标:
                    type: Scroll
                    attribute: {point: '~top_left', x: 40, y: 36, width: 364, height: 36, moveX: 'var.guideTextAnim.get()', through: true}
                    children:
                      目标布局:
                        type: HStack
                        attribute: {height: 36, through: true}
                        children:
                          目标文字:
                            type: Text
                            attribute: {texts: "'&f目标 / ' + self.parent.parent.parent.entry['taskText']", fontSize: 36, through: true}
                  导航坐标:
                    type: Scroll
                    attribute: {point: '~top_left', x: 40, y: 72, width: 364, height: 36, moveX: 'var.guideTextAnim.get()', visible: "self.parent.entry['hasNav']", through: true}
                    children:
                      坐标布局:
                        type: HStack
                        attribute: {height: 36, through: true}
                        children:
                          坐标文字:
                            type: Text
                            attribute: {texts: "'&6位置 / ' + self.parent.parent.parent.entry['navText']", fontSize: 36, through: true}
                  无坐标:
                    type: Text
                    attribute: {point: '~top_left', x: 40, y: 72, texts: '~&7暂无坐标 / 继续任务', visible: "!self.parent.entry['hasNav']", fontSize: 36, through: true}
