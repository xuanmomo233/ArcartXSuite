# puzzles.yml — 副本内机关解谜（实例级状态）
# 序列型：按 steps 顺序触发 interact 点名

lever_gate:
  name: "尘封闸门"
  type: sequence
  # interacts.yml 拉杆点名顺序：三→一→四→二（刻在房间提示里）
  steps: [lever_3, lever_1, lever_4, lever_2]
  reset-on-miss: true                # 点错顺序 → 清空进度重来
  miss-limit: 5                      # 累计错序上限；超限 on-fail 并锁定
  on-step:
    - "sound @trigger UI_BUTTON_CLICK 1 1.6"
    - "actionbar @trigger &a机关推进 {var:puzzle.lever_gate}/4"
  on-miss:
    - "title @trigger 5 25 10  |&c顺序错误，机关复位！"
    - "sound @trigger BLOCK_NOTE_BLOCK_BASS 1 0.5"
  on-complete:
    - "message @all &a尘封闸门缓缓开启，出口已解封"
    - "fillblocks 303,61,9 303,64,14 AIR"
    - "sound @all BLOCK_PISTON_EXTEND 1 0.8"
    - "guide_clear f2_pzl_pt"
    - "guide_point f2_pzl_exit 305,62,11 2 &e闸门已开·前往守层 Boss"
  on-fail:
    - "message @all &c机关卡死了……30 秒后自行复位"
    - "delay 30 puzzle_reset lever_gate"
    - "delay 31 message @all &e机关复位，可以重新尝试"
