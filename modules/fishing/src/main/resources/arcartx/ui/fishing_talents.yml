# AXS 钓鱼天赋网络界面（五系常驻布局）
# 打开方式: /fishing talents 或主界面导航跳转
# 数据交互: packetHandler init/update (AXS_FISHING_TALENTS)
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航 + 内容区
#       内容区 = 天赋点信息栏 + 滚动树画布（5棵树横向排列+联动天赋底部一排）
#       每棵树 = 网格布局+xy位移调控，Texture纯色块连线，正方形Slot显示icon
# 视觉规范:
#   全屏玻璃 Frosted:24;12,22,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片底 26,34,46,210  卡片描边 80,200,220,240
#   主色（青蓝）50,170,200  已点亮 124,196,142  悬停高亮 80,200,220
#   连线已点亮 124,196,142,240  连线可点亮 50,170,200,120  连线锁定 80,200,220,100
#
# Java 端 pushTalentsData 发送字段:
#   packetId, seasonId, level, talentPoints, unspentTalentPoints,
#   unlockedTalents (Map<nodeId, level:int>),
#   trees (Map<treeId, {id, displayName, description, icon, iconJson,
#     nodeCount, nodes: Map<idx, {id, name, description, tier, branch, treeId,
#       unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>}>),
#   links (Map<idx, {id, name, description, tier, branch, treeId,
#     unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>),
#   linkCount
#
# 客户端回包:
#   Packet.send(packetId, 'level_up_talent', nodeId)  — 升级指定节点
#   Packet.send(packetId, 'reset_talents')             — 重置天赋树

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8

  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = {} }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.links = packet['links']
      if(var.links == none){ var.links = {} }
      var.linkCount = packet['linkCount']
      if(var.linkCount == none){ var.linkCount = 0 }
      var.needRebuild = true
    update: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = {} }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.links = packet['links']
      if(var.links == none){ var.links = {} }
      var.linkCount = packet['linkCount']
      if(var.linkCount == none){ var.linkCount = 0 }
      var.needRebuild = true
  action:
    # load: 初始化变量 + 视口换算 + 环形扇形布局参数
    load: |-
      var.packetId = 'AXS_FISHING_TALENTS'
      var.seasonId = ''
      var.playerLevel = 1
      var.talentPoints = 0
      var.unspentTalentPoints = 0
      var.unlockedTalents = {}
      var.trees = {}
      var.links = {}
      var.linkCount = 0
      var.needRebuild = false
      var.iconDelay = 0
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      // 环形扇形布局参数（6 棵树 × 60° 扇形，从外圈向内圈生长）
      var.nodeSize = 64
      var.lineW = 5
      var.canvasW = 1800
      var.canvasH = 1800
      var.centerX = var.canvasW / 2
      var.centerY = var.canvasH / 2
      // 半径分配（从外到内：T1→T2→T3→T4→T5→联动）
      var.R1 = 760
      var.R2 = 620
      var.R3 = 480
      var.R4 = 340
      var.R5 = 200
      var.Rlink = 110
      // 角度偏移（弧度）：同层兄弟节点沿圆周散开
      var.angleT2 = math.PI() / 15
      var.angleT3 = math.PI() / 18
      var.angleT4a = math.PI() / 10
      var.angleT4b = math.PI() / 30
      var.angleT5a = math.PI() / 15
      var.angleT5b = math.PI() / 45
      // 联动节点最小角度间隔（弧度）= nodeSize / Rlink + 余量
      var.minLinkAngleGap = var.nodeSize / var.Rlink + 0.15
      // 拖拽滚动状态
      var.isDragging = false
      var.dragStartMX = 0
      var.dragStartMY = 0
      var.dragStartSX = 0
      var.dragStartSY = 0
      var.dragMoved = false
      // 缩放状态
      var.zoomScale = 1.0
      var.treeIds = ['steady', 'swift', 'pressure', 'focus', 'lucky', 'endure']
      var.treeNames = {}
      var.treeNames['steady'] = '&a稳健'
      var.treeNames['swift'] = '&b迅捷'
      var.treeNames['pressure'] = '&c威压'
      var.treeNames['focus'] = '&d专注'
      var.treeNames['lucky'] = '&e幸运'
      var.treeNames['endure'] = '&6持久'
      var.treeDescs = {}
      var.treeDescs['steady'] = '绿条稳定性与高度'
      var.treeDescs['swift'] = '降低鱼速与活跃度'
      var.treeDescs['pressure'] = '压制鱼逃离行为'
      var.treeDescs['focus'] = '进度获取与维持'
      var.treeDescs['lucky'] = '经验售价与稀有鱼'
      var.treeDescs['endure'] = '绿条物理与时间'
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.s = s
    open: |-
      Packet.send(var.packetId, 'refresh_talents')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.s = s
      var.needRebuild = true
    keyPress: |-
      // R 键重置缩放和滚动位置
      if(self.currentKeyPress == 'R' || self.currentKeyPress == 'r'){
        var.zoomScale = 1.0
        val.横向滑块.setDragXRatio(0)
        val.竖向滑块.setDragYRatio(0)
        var.needRebuild = true
      }
    releaseLeft: |-
      // 兜底：确保拖拽状态在鼠标移出滚动区后释放时也能重置
      var.isDragging = false
    # tick: 数据变化时重建环形天赋网络
    tick: |-
      // 拖拽中：位移超过阈值才滚动
      if(var.isDragging){
        dx = (Mouse.x() - var.dragStartMX) / var.s
        dy = (Mouse.y() - var.dragStartMY) / var.s
        if(!var.dragMoved){
          if(dx * dx + dy * dy > 25){
            var.dragMoved = true
          }
        }
        if(var.dragMoved){
          scrollRangeX = var.canvasW * var.zoomScale - (var.contentW - 48)
          scrollRangeY = var.canvasH * var.zoomScale - (var.viewH - 236)
          if(scrollRangeX > 0){
            newSX = var.dragStartSX - dx / scrollRangeX
            if(newSX < 0){ newSX = 0 }
            if(newSX > 1){ newSX = 1 }
            val.横向滑块.setDragXRatio(newSX)
          }
          if(scrollRangeY > 0){
            newSY = var.dragStartSY - dy / scrollRangeY
            if(newSY < 0){ newSY = 0 }
            if(newSY > 1){ newSY = 1 }
            val.竖向滑块.setDragYRatio(newSY)
          }
        }
      }
      if(var.needRebuild){
        var.needRebuild = false
        var.iconDelay = 2
        z = var.zoomScale
        // 清理动态控件（保留 3 个模板：树标题、天赋节点、联动连线段）
        while(val.树画布.childrenCount() > 3){
          val.树画布.get(3).remove()
        }
        // ── 辅助函数：极坐标 → 世界坐标（节点左上角）──
        // polarToNode(angle, radius) → [x, y]
        // 在 Aria 中用内联计算代替函数
        // ── 辅助函数：创建旋转连线（树画布子控件）──
        // createLine(x1, y1, x2, y2, color, name)
        // 连线中心在两点中点，用 rotate 旋转
        // ── 第一遍：计算所有节点位置 ──
        // nodePositions[treeId + '_' + nodeId] = [worldX, worldY]
        var.nodePositions = {}
        for(ti in range(0, 5)){
          treeIndex = ti.round()
          treeKey = var.treeIds[treeIndex]
          treeData = var.trees[treeKey]
          if(treeData != none){
            // 树中心角度 = -PI/2 + ti * PI/3（从正上方开始，顺时针）
            treeAngle = -math.PI() / 2 + treeIndex * math.PI() / 3
            // 树标题：放在 T1 外侧
            titleR = var.R1 + var.nodeSize + 30
            titleX = var.centerX + titleR * math.cos(treeAngle)
            titleY = var.centerY + titleR * math.sin(treeAngle)
            titleCtrl = val.树标题模板.copy('树标题_' + treeIndex)
            titleCtrl.x = ((titleX - 100) * z).round()
            titleCtrl.y = ((titleY - 20) * z).round()
            titleCtrl.treeId = treeKey
            titleCtrl.visible = true
            // 遍历节点
            nodes = treeData['nodes']
            nodeCount = treeData['nodeCount']
            if(nodeCount == none){ nodeCount = 0 }
            for(i in range(0, nodeCount - 1)){
              key = i.round()
              entry = nodes[key]
              if(entry != none){
                tier = type.toNumber(entry['tier']).round()
                branch = entry['branch']
                // 计算节点角度偏移
                angleOff = 0
                if(tier == 2){
                  angleOff = branch == 'a' ? -var.angleT2 : var.angleT2
                }
                if(tier == 3){
                  angleOff = branch == 'a' ? -var.angleT3 : var.angleT3
                }
                if(tier == 4){
                  if(branch == 'a'){ angleOff = -var.angleT4a }
                  if(branch == 'b'){ angleOff = -var.angleT4b }
                  if(branch == 'c'){ angleOff = var.angleT4b }
                  if(branch == 'd'){ angleOff = var.angleT4a }
                }
                if(tier == 5){
                  if(branch == 'a'){ angleOff = -var.angleT5a }
                  if(branch == 'b'){ angleOff = -var.angleT5b }
                  if(branch == 'c'){ angleOff = var.angleT5b }
                  if(branch == 'd'){ angleOff = var.angleT5a }
                }
                // 半径
                R = tier == 1 ? var.R1 : (tier == 2 ? var.R2 : (tier == 3 ? var.R3 : (tier == 4 ? var.R4 : var.R5)))
                // 世界坐标
                angle = treeAngle + angleOff
                worldX = var.centerX + R * math.cos(angle)
                worldY = var.centerY + R * math.sin(angle)
                // 存储位置（未缩放）
                posKey = treeKey + '_' + entry['id']
                var.nodePositions[posKey] = [worldX, worldY]
                // 创建节点
                node = val.天赋节点模板.copy('节点_' + treeIndex + '_' + key)
                node.entryKey = key
                node.treeId = treeKey
                node.isLink = false
                node.x = ((worldX - var.nodeSize / 2) * z).round()
                node.y = ((worldY - var.nodeSize / 2) * z).round()
                node.width = (var.nodeSize * z).round()
                node.height = (var.nodeSize * z).round()
              }
            }
          }
        }
        // ── 第二遍：创建树内连线（旋转 Texture，树画布子控件）──
        for(ti in range(0, 5)){
          treeIndex = ti.round()
          treeKey = var.treeIds[treeIndex]
          treeData = var.trees[treeKey]
          if(treeData != none){
            nodes = treeData['nodes']
            nodeCount = treeData['nodeCount']
            if(nodeCount == none){ nodeCount = 0 }
            for(i in range(0, nodeCount - 1)){
              key = i.round()
              entry = nodes[key]
              if(entry != none){
                prereqs = entry['prerequisites']
                if(prereqs != none && prereqs.size() > 0){
                  parentId = prereqs[0]
                  childId = entry['id']
                  parentPos = var.nodePositions[treeKey + '_' + parentId]
                  childPos = var.nodePositions[treeKey + '_' + childId]
                  if(parentPos != none && childPos != none){
                    // 连线颜色：子节点未点亮时暗色，点亮时亮色
                    lineColor = entry['unlocked'] == true ? (treeKey == 'steady' ? '72,238,112,255' : (treeKey == 'swift' ? '48,208,248,255' : (treeKey == 'pressure' ? '248,70,70,255' : (treeKey == 'focus' ? '212,86,248,255' : (treeKey == 'lucky' ? '252,198,42,255' : '255,165,0,255'))))) : (treeKey == 'steady' ? '48,156,82,255' : (treeKey == 'swift' ? '34,138,170,255' : (treeKey == 'pressure' ? '172,48,48,255' : (treeKey == 'focus' ? '144,54,180,255' : (treeKey == 'lucky' ? '180,138,30,255' : '180,110,20,255')))))
                    // 创建旋转连线
                    x1 = parentPos[0]
                    y1 = parentPos[1]
                    x2 = childPos[0]
                    y2 = childPos[1]
                    ldx = x2 - x1
                    ldy = y2 - y1
                    len = math.sqrt(ldx * ldx + ldy * ldy)
                    angDeg = math.atan2(ldy, ldx) * 180 / math.PI()
                    midX = (x1 + x2) / 2
                    midY = (y1 + y2) / 2
                    line = val.联动连线段.copy('树线_' + treeIndex + '_' + key)
                    line.x = ((midX - len / 2) * z).round()
                    line.y = ((midY - var.lineW / 2) * z).round()
                    line.width = (len * z).round()
                    line.height = (var.lineW * z).round()
                    line.rotate = angDeg
                    line.normal = lineColor
                    line.visible = true
                  }
                }
              }
            }
          }
        }
        // ── 第三遍：计算联动节点位置 + 创建联动连线 ──
        // 联动节点位置 = 两个源 T3 锚点角度中点 × Rlink
        var.linkAngles = {}
        var.linkAngleOrder = []
        for(i in range(0, var.linkCount - 1)){
          key = i.round()
          entry = var.links[key]
          if(entry != none){
            prereq1 = entry['prerequisites'][0]
            prereq2 = entry['prerequisites'][1]
            parts1 = prereq1.split('-')
            parts2 = prereq2.split('-')
            tree1 = parts1[0]
            tree2 = parts2[0]
            branch1 = parts1[1].substring(2)
            branch2 = parts2[1].substring(2)
            // 树索引
            ti1 = tree1 == 'steady' ? 0 : (tree1 == 'swift' ? 1 : (tree1 == 'pressure' ? 2 : (tree1 == 'focus' ? 3 : (tree1 == 'lucky' ? 4 : 5))))
            ti2 = tree2 == 'steady' ? 0 : (tree2 == 'swift' ? 1 : (tree2 == 'pressure' ? 2 : (tree2 == 'focus' ? 3 : (tree2 == 'lucky' ? 4 : 5))))
            // 源 T3 角度
            treeAngle1 = -math.PI() / 2 + ti1 * math.PI() / 3
            treeAngle2 = -math.PI() / 2 + ti2 * math.PI() / 3
            angle1 = treeAngle1 + (branch1 == 'a' ? -var.angleT3 : var.angleT3)
            angle2 = treeAngle2 + (branch2 == 'a' ? -var.angleT3 : var.angleT3)
            // 中点角度
            linkAngle = (angle1 + angle2) / 2
            var.linkAngles[key] = linkAngle
            var.linkAngleOrder.add(key)
          }
        }
        // 按角度排序
        var.linkAngleOrder.sortBy(-> { return var.linkAngles[args[0]] })
        // 防重叠：确保最小角度间隔
        linkCount = var.linkAngleOrder.size()
        for(i in range(1, linkCount - 1)){
          iIdx = i.round()
          key = var.linkAngleOrder[iIdx]
          prevKey = var.linkAngleOrder[iIdx - 1]
          gap = var.linkAngles[key] - var.linkAngles[prevKey]
          if(gap < var.minLinkAngleGap){
            var.linkAngles[key] = var.linkAngles[prevKey] + var.minLinkAngleGap
          }
        }
        // 创建联动节点 + 连线
        for(i in range(0, linkCount - 1)){
          key = var.linkAngleOrder[i.round()]
          entry = var.links[key]
          if(entry != none){
            linkAngle = var.linkAngles[key]
            linkX = var.centerX + var.Rlink * math.cos(linkAngle)
            linkY = var.centerY + var.Rlink * math.sin(linkAngle)
            node = val.天赋节点模板.copy('联动_' + key)
            node.entryKey = key
            node.treeId = 'link'
            node.isLink = true
            prereq1 = entry['prerequisites'][0]
            prereq2 = entry['prerequisites'][1]
            parts1 = prereq1.split('-')
            parts2 = prereq2.split('-')
            tree1 = parts1[0]
            tree2 = parts2[0]
            node.linkTree1 = tree1
            node.linkTree2 = tree2
            node.x = ((linkX - var.nodeSize / 2) * z).round()
            node.y = ((linkY - var.nodeSize / 2) * z).round()
            node.width = (var.nodeSize * z).round()
            node.height = (var.nodeSize * z).round()
            // 连线：源 T3 → 联动节点（旋转 Texture）
            prereqStates = entry['prerequisiteStates']
            // 路径1
            sourcePos1 = var.nodePositions[tree1 + '_' + prereq1]
            if(sourcePos1 != none){
              color1 = (prereqStates != none && prereqStates[0] == true) ? (tree1 == 'steady' ? '82,255,128,255' : (tree1 == 'swift' ? '60,220,255,255' : (tree1 == 'pressure' ? '255,78,78,255' : (tree1 == 'focus' ? '218,95,255,255' : (tree1 == 'lucky' ? '255,210,55,255' : '255,180,60,255'))))) : (tree1 == 'steady' ? '48,165,82,255' : (tree1 == 'swift' ? '38,145,178,255' : (tree1 == 'pressure' ? '178,48,48,255' : (tree1 == 'focus' ? '142,58,178,255' : (tree1 == 'lucky' ? '184,142,34,255' : '180,120,30,255')))))
              sx1 = sourcePos1[0]
              sy1 = sourcePos1[1]
              ldx1 = linkX - sx1
              ldy1 = linkY - sy1
              len1 = math.sqrt(ldx1 * ldx1 + ldy1 * ldy1)
              angDeg1 = math.atan2(ldy1, ldx1) * 180 / math.PI()
              midX1 = (sx1 + linkX) / 2
              midY1 = (sy1 + linkY) / 2
              line1 = val.联动连线段.copy('联动线_' + key + '_1')
              line1.x = ((midX1 - len1 / 2) * z).round()
              line1.y = ((midY1 - var.lineW / 2) * z).round()
              line1.width = (len1 * z).round()
              line1.height = (var.lineW * z).round()
              line1.rotate = angDeg1
              line1.normal = color1
              line1.visible = true
            }
            // 路径2
            sourcePos2 = var.nodePositions[tree2 + '_' + prereq2]
            if(sourcePos2 != none){
              color2 = (prereqStates != none && prereqStates[1] == true) ? (tree2 == 'steady' ? '82,255,128,255' : (tree2 == 'swift' ? '60,220,255,255' : (tree2 == 'pressure' ? '255,78,78,255' : (tree2 == 'focus' ? '218,95,255,255' : (tree2 == 'lucky' ? '255,210,55,255' : '255,180,60,255'))))) : (tree2 == 'steady' ? '48,165,82,255' : (tree2 == 'swift' ? '38,145,178,255' : (tree2 == 'pressure' ? '178,48,48,255' : (tree2 == 'focus' ? '142,58,178,255' : (tree2 == 'lucky' ? '184,142,34,255' : '180,120,30,255')))))
              sx2 = sourcePos2[0]
              sy2 = sourcePos2[1]
              ldx2 = linkX - sx2
              ldy2 = linkY - sy2
              len2 = math.sqrt(ldx2 * ldx2 + ldy2 * ldy2)
              angDeg2 = math.atan2(ldy2, ldx2) * 180 / math.PI()
              midX2 = (sx2 + linkX) / 2
              midY2 = (sy2 + linkY) / 2
              line2 = val.联动连线段.copy('联动线_' + key + '_2')
              line2.x = ((midX2 - len2 / 2) * z).round()
              line2.y = ((midY2 - var.lineW / 2) * z).round()
              line2.width = (len2 * z).round()
              line2.height = (var.lineW * z).round()
              line2.rotate = angDeg2
              line2.normal = color2
              line2.visible = true
            }
          }
        }
      }
      if(var.iconDelay > 0){
        var.iconDelay = var.iconDelay - 1
        if(var.iconDelay == 0){
          for(ci in range(3, val.树画布.childrenCount() - 1)){
            ctrl = val.树画布.get(ci.round())
            if(ctrl != none && ctrl.entry != none && ctrl['节点图标'] != none){
              ctrl['节点图标'].setItemIcon(ctrl.entry['iconJson'])
            }
          }
        }
      }

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;12,22,38,110
  # 自适配布局：宽高 = 设计分辨率 1920x1080
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~80,200,220,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
