# AXS 钓鱼模块主配置文件
# 配置钓鱼小游戏核心参数、水域定义、鱼类池、宝藏池、UI注册和命令
config-version: 2              # 配置文件版本号

# ─── 数据存储 ────────────────────────────────────────
# mode: sqlite 或 mysql。
storage:
  mode: sqlite
  # SQLite 数据库文件名（相对模块数据目录）。
  sqlite-file-name: fishing.db
  # 连接池大小，SQLite 建议保持 1。
  pool-size: 1
  # 以下仅在 mode: mysql 时生效。
  mysql-host: localhost
  mysql-port: 3306
  mysql-database: axs_fishing
  mysql-username: root
  mysql-password: ""

# ─── 钓鱼小游戏核心参数 ────────────────────────────────────────
fishing:
  # 是否接管原版钓鱼事件，启用后玩家甩竿会进入 AXS 钓鱼小游戏。
  replace-vanilla: true
  # 小游戏刷新间隔（ticks），20 ticks = 1 秒。值越小动画越平滑，CPU 占用越高。
  minigame-tick-interval: 1
  # 进度条重力加速度（像素/tick²），影响绿色目标条下落速度。
  bar-gravity: 0.2
  # 进度条碰撞阻尼（0-1），越接近 1 反弹越持久。
  bar-bounce-damping: 0.4
  # 鼠标点击给进度条施加的瞬时速度（负数表示向上），绝对值越大越容易把条弹起。
  bar-click-force: -0.6
  # 力系数：重力/点击力乘以这个系数后施加到速度上，越大绿条响应越灵敏。
  bar-force-multiplier: 0.03
  # 阻尼系数（0-1）：每 tick 速度乘以这个值，越接近 1 速度衰减越慢（惯性越大），越小越容易停但越迟钝。
  bar-damping: 0.85
  # 单次小游戏最长持续时间（ticks），超时视为失败。
  catch-duration-ticks: 600
  # 钓鱼冷却时间（ticks）：小游戏结束后多少 ticks 内无法再次触发钓鱼。
  # 20 ticks = 1 秒，默认 100 ticks = 5 秒。
  fishing-cooldown-ticks: 100
  # 未按住鼠标时进度下降速率。
  progress-drain-rate: 0.5
  # 按住鼠标时进度上升速率。
  progress-gain-rate: 1.0
  # 进度涨跌系数：进度变化 = progress-gain/drain-rate × 此系数，越大进度变化越快。
  progress-rate-multiplier: 0.008
  # 绿色目标条基础高度（像素），随鱼难度变化。
  base-green-bar-height: 96
  # 鱼每提升 1 级难度，绿色条增加的高度（像素）。
  height-per-level: 2
  # 难度对绿条高度的缩减比例（0-1）：难度100时绿条高度缩减此比例。0=不缩减，1=完全消失。
  difficulty-bar-shrink: 0.3
  # 鱼撞到轨道边缘时的反弹力度（0-1），1=完全弹性碰撞。
  fish-edge-bounce: 0.5
  # 钓起宝藏（treasures/ 目录定义）的基础概率，范围 0.0 ~ 1.0，最终概率受水域、饵料加成影响。
  treasure-chance: 0.15
  # 完美收竿（进度条始终覆盖目标区域）时的经验倍率。
  perfect-bonus-multiplier: 1.5
  # 每提升 1 级钓鱼等级所需基础经验。
  base-xp-per-level: 100
  # 钓鱼等级上限，影响等级修正曲线计算。
  max-level: 100
  # 等级修正系数：等级对鱼速度/逃离概率/进度增速的最大修正比例。
  # 例如 0.5 表示满级时鱼速度最多降低50%、逃离概率最多降低50%、进度最多加快50%。
  level-modifier-scale: 0.5

  # ─── 驱赶机制（鱼偶尔迅速逃离绿条范围） ──────────────
  # 鱼在绿条内时，每隔一段检查时间有概率触发逃离冲刺。
  # 难度越高，逃离概率越大、速度越快。
  # 基础逃离概率（难度0时），每点难度增加 flee-chance-per-difficulty。
  flee-base-chance: 0.25
  flee-chance-per-difficulty: 0.25
  # 基础逃离速度，每点难度增加 flee-speed-per-difficulty。
  flee-base-speed: 0.04
  flee-speed-per-difficulty: 0.03
  # 逃离持续 ticks 范围 [min, max)，随机取值。
  flee-min-duration: 15
  flee-max-duration: 35
  # 逃离检查间隔 ticks 范围 [min, max)，每隔这段时间检查一次是否触发。
  flee-check-min-interval: 20
  flee-check-max-interval: 50
  # 逃离结束后冷却 ticks 范围 [min, max)，冷却期间不会再次逃离。
  flee-cooldown-min: 30
  flee-cooldown-max: 70

# ─── 水域定义 ────────────────────────────────────────
# 指定地点: 玩家在指定坐标/区域内钓鱼
# 默认水域: 未匹配任何指定地点时使用
waters:
  # 指定地点水域列表
  specified:
    - name: "dragon_lake"     # 水域唯一标识名
      display-name: "&b龙泉湖"  # 水域显示名称（支持颜色代码）
      type: circle            # 水域形状类型（circle=圆形区域）
      world: "world"          # 所在世界名称
      center: [100, 64, 200]  # 圆形水域中心坐标 [x, y, z]
      radius: 50              # 圆形水域半径（方块）
      fish-pool: "lake"       # 引用的鱼类池ID（对应 fish-pools 定义）
      treasure-pool: "common" # 引用的宝藏池ID（对应 treasure-pools 定义）
      difficulty-modifier: 1.2 # 难度修正系数（1.2=难度提升20%）
      bait-multipliers:       # 饵料在该水域的额外倍率
        worm: 1.5             # 蚯蚓在此水域倍率1.5
        corn: 2.0             # 玉米粒在此水域倍率2.0
      require-permission: ""  # 进入此水域钓鱼所需权限（空=无限制）

    - name: "jade_river"     # 水域唯一标识名
      display-name: "&a翡翠河"  # 水域显示名称（支持颜色代码）
      type: rectangle         # 水域形状类型（rectangle=矩形区域）
      world: "world"          # 所在世界名称
      min: [500, 60, 300]     # 矩形水域最小坐标 [x, y, z]
      max: [700, 80, 400]     # 矩形水域最大坐标 [x, y, z]
      fish-pool: "river"      # 引用的鱼类池ID
      treasure-pool: "common" # 引用的宝藏池ID
      difficulty-modifier: 0.9 # 难度修正系数（0.9=难度降低10%）
      bait-multipliers:       # 饵料在该水域的额外倍率
        worm: 1.0             # 蚯蚓在此水域倍率1.0
        bread: 1.3            # 面包屑在此水域倍率1.3
      require-permission: ""  # 进入此水域钓鱼所需权限（空=无限制）

  # 默认水域（兜底）
  default:
    name: "default"           # 默认水域标识名
    display-name: "&7普通水域"  # 默认水域显示名称
    fish-pool: "default"      # 引用的鱼类池ID
    treasure-pool: "default"  # 引用的宝藏池ID
    difficulty-modifier: 1.0  # 难度修正系数（1.0=标准难度）
    bait-multipliers:         # 饵料在该水域的额外倍率
      worm: 1.0               # 蚯蚓倍率1.0
      bread: 1.0              # 面包屑倍率1.0
      corn: 1.0               # 玉米粒倍率1.0

# ─── 鱼类池 ────────────────────────────────────────
# 引用 fishes/ 目录下的鱼种 ID
fish-pools:
  default:                    # 默认鱼类池（普通水域使用）
    - "sea_bass"              # 海鲈鱼（普通 difficulty 25）
    - "salmon"                # 鲑鱼（罕见 difficulty 40）
    - "pufferfish"            # 河豚（罕见 difficulty 35）
    - "tuna"                  # 金枪鱼（稀有 difficulty 55）
    - "catfish"               # 鲶鱼（稀有 difficulty 60）
    - "legendary_carp"        # 传说鲤鱼（传说 difficulty 90）
  lake:                       # 湖泊鱼类池
    - "sea_bass"              # 海鲈鱼
    - "catfish"               # 鲶鱼
    - "legendary_carp"        # 传说鲤鱼
  river:                      # 河流鱼类池
    - "salmon"                # 鲑鱼
    - "catfish"               # 鲶鱼
  ocean:                      # 海洋鱼类池
    - "tuna"                  # 金枪鱼
    - "pufferfish"            # 河豚
    - "sea_bass"              # 海鲈鱼

# ─── 宝藏池 ────────────────────────────────────────
# 引用 treasures/ 目录下的宝藏 ID
treasure-pools:
  default:                    # 默认宝藏池（普通水域使用）
    - "old_boot"              # 旧靴子
    - "lost_ring"             # 失落戒指
  common:                     # 普通宝藏池
    - "old_boot"              # 旧靴子
    - "lost_ring"             # 失落戒指
    - "ancient_coin"          # 古币
  rare:                       # 稀有宝藏池
    - "ancient_coin"          # 古币
    - "lost_ring"             # 失落戒指

# ─── 饵料定义 ────────────────────────────────────────
# 饵料不通过本文件配置，请在 baits/ 目录下为每个饵料创建独立 YAML 文件。
# 每个饵料文件支持的字段见 fishes/worm.yml 示例：
#   id、display-name、item、default、fish-attract-modifiers、
#   treasure-chance-boost、max-durability-bonus。

# ─── UI 注册 ────────────────────────────────────────
# 这些 UI 文件位于 arcartx/ui/ 目录，由模块在启动时注册到 ArcartX。
ui:
  # 是否在插件启用时自动注册本模块的 UI。
  register-on-enable: true
  # 是否强制覆盖用户已修改的 UI 文件。
  overwrite-ui-files: false
  # 钓鱼小游戏 UI 的 ID。
  minigame-id: "fishing_minigame"
  # 鱼类图鉴 UI 的 ID。
  collection-id: "fishing_collection"

# ─── 命令配置 ────────────────────────────────────────
commands:
  # 是否注册 /fishing 命令。
  enabled: true
  # 使用钓鱼命令所需的基础权限节点。
  base-permission: "axs.fishing.use"
