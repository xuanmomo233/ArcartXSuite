                action:
                  clickLeft: |-
                    now = Time.currentTime()
                    if(var.lastSlotClickSlot == self.entryKey && now - var.lastSlotClickTime < 300){
                      Packet.send(var.packetId, 'withdraw', self.entryKey, 64)
                      var.lastSlotClickSlot = none
                    }else{
                      Packet.send(var.packetId, 'select', self.entryKey)
                      var.lastSlotClickSlot = self.entryKey
                      var.lastSlotClickTime = now
                    }
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,230,240,255' : (self.entryKey == var.selectedSlot ? '160,170,180,255' : '100,110,120,220')"
