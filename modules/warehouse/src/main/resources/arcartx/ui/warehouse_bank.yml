ui:
  isHud: false
  defaultOpen: false
  hide:
  - hotbar
  - experience_bar
  - crosshair
  - item_name
  - jump_bar
  - mount_health
  - player_state
  - player_health
  - armor_level
  - food_level
  - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    update: |-
      // 保存旧数量，用于判断是否需要重建列表（首次 update 时旧数量为 0，数量从 0 变为 N 时触发重建）
      oldMaxBalanceCount = var.maxBalanceCount != none ? var.maxBalanceCount : 0
      oldMaxProductCount = var.maxProductCount != none ? var.maxProductCount : 0
      oldMaxFixedCount = var.maxFixedCount != none ? var.maxFixedCount : 0
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.warehouseName = packet['warehouseName']
      var.balances = packet['balances']
      var.balanceTexts = packet['balanceTexts']
      var.products = packet['products']
      var.productTexts = packet['productTexts']
      var.fixedDeposits = packet['fixedDeposits']
      var.fixedDepositTexts = packet['fixedDepositTexts']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.maxBalanceCount = packet['maxBalanceCount']
      var.maxProductCount = packet['maxProductCount']
      var.maxFixedCount = packet['maxFixedCount']
      var.selectedCurrency = packet['selectedCurrency']
      // ── 余额列表：仅在数量变化时重建 ──
      if(var.maxBalanceCount != oldMaxBalanceCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        var.余额列表网格数据 = []
        if((var.maxBalanceCount - 1) >= 0){
          for(网格序号 in range(0, var.maxBalanceCount - 1)){
            var.余额列表网格数据.add(网格序号.round())
          }
        }
      }
      // ── 产品列表：仅在数量变化时重建 ──
      if(var.maxProductCount != oldMaxProductCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        var.产品列表网格数据 = []
        if((var.maxProductCount - 1) >= 0){
          for(网格序号 in range(0, var.maxProductCount - 1)){
            var.产品列表网格数据.add(网格序号.round())
          }
        }
      }
      // ── 定期列表：仅在数量变化时重建 ──
      if(var.maxFixedCount != oldMaxFixedCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        var.定期列表网格数据 = []
        if((var.maxFixedCount - 1) >= 0){
          for(网格序号 in range(0, var.maxFixedCount - 1)){
            var.定期列表网格数据.add(网格序号.round())
          }
        }
      }
      // update 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false
      // 根据 selectedProduct 查找对应的产品 entry
      var.selectedProductEntry = none
      if(var.selectedProduct != none && var.products != null){
        for(key in var.products.keys()){
          entry = var.products[key]
          if(entry != null && entry['id'] == var.selectedProduct){
            var.selectedProductEntry = entry
            break
          }
        }
      }
      // 根据 selectedDeposit 查找对应的定期 entry
      var.selectedDepositEntry = none
      if(var.selectedDeposit != none && var.fixedDeposits != null){
        for(key in var.fixedDeposits.keys()){
          entry = var.fixedDeposits[key]
          if(entry != null && entry['id'] == var.selectedDeposit){
            var.selectedDepositEntry = entry
            break
          }
        }
      }
      // 计算预期收益
      calcExpectedPayout()
    ui_notice: |-
      noticeMessage = packet['message']
      if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
        var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
        noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = noticeWrapped.split('\n')
        var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.balanceTexts = {}
      var.expectedPayout = '—'
      var.fixedDepositTexts = {}
      var.hasPassword = false
      var.packetId = 'AXS_WAREHOUSE'
      var.productTexts = {}
      var.selectedCurrency = 'money'
      var.unlocked = false
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.刷新轮次 = 0.round()
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      // 三列宽度：存取区 360 + 间隔 12 + 产品列表 280 + 间隔 12 + 详情面板 = contentW - 40
      var.col1W = 360
      var.col2W = 280
      var.col3W = var.contentW - 40 - var.col1W - var.col2W - 24
      // 预期收益计算函数：根据输入金额匹配利率阶梯，计算到期本息
      calcExpectedPayout = func(){
        var.expectedPayout = '—'
        if(var.selectedProductEntry == none || var.bankAmount == none || var.bankAmount == ''){
          return
        }
        amount = parseFloat(var.bankAmount)
        if(amount <= 0){
          return
        }
        tiers = var.selectedProductEntry['tiers']
        if(tiers == null || tiers.length == 0){
          return
        }
        matchedRate = 0
        for(i in range(0, tiers.length)){
          tier = tiers[i]
          tierMin = parseFloat(tier['min'])
          tierMax = parseFloat(tier['max'])
          if(amount >= tierMin && (tierMax <= 0 || amount <= tierMax)){
            matchedRate = parseFloat(tier['rate'])
            break
          }
        }
        if(matchedRate > 0){
          payout = amount + amount * matchedRate
          var.expectedPayout = payout.round().toString()
        }
      }
      var.noticeActive = false
      var.noticeText = ''
      var.noticeDetail = ''
      var.noticeFade = Fade(80, 1000, 220)
      var.noticePeaked = false
      var.noticeLines = []
      var.noticeCount = 1
    open: |-
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeText = ''
      var.noticeDetail = ''
      Packet.send(var.packetId, 'refresh')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.col1W = 360
      var.col2W = 280
      var.col3W = var.contentW - 40 - var.col1W - var.col2W - 24
    tick: |2-


      if(var.noticeActive){
        var.noticeOpacity = var.noticeFade.get()
        if(var.noticeOpacity > 0){ var.noticePeaked = true }
        if(var.noticePeaked && var.noticeOpacity <= 0){
          var.noticeActive = false
          var.noticePeaked = false
          var.noticeText = ''
          var.noticeDetail = ''
        }
      }
