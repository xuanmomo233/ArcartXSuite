                                  point: ~middle_center
                                  texts: "~&c✕"
                                  fontSize: 36
                                  through: true
              转让:
                type: Canvas
                attribute:
                  point: ~bottom_left
                  x: 20
                  y: -24
                  width: "var.halfW - 60"
                  height: 48
                  enable: "!var.actionBusy && var.actionToken != '' && var.unlocked && var.hasPassword"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send(var.packetId, 'shared_transfer', var.ownerId, var.memberName, var.actionToken)
                children:
                  转让底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~44,50,58,245
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '220,230,240,255' : '100,110,120,220'"
                  转让字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.memberName != none ? '&f将所有权转让给 ' + var.memberName : '&e请先选中一个成员'"
                      fontSize: 36
                      through: true
