# 字幕 HUD — 打字机动画字幕显示界面
# 由服务端 Subtitle 模块推送字幕帧，客户端按打字机效果逐字显示。
# 支持背景板显示/隐藏、动画时长控制和自动关闭。
ui:
  isHud: true  # HUD 模式，覆盖在游戏画面上
  defaultOpen: false  # 不随启动自动打开
  through: false  # 鼠标不穿透
  background: false  # 无背景遮罩
  closeDied: false  # 关闭后不销毁（可复用）
  show: true  # 可见
  level: 1  # 渲染层级
  packetHandler:
    # packetHandler: play
    # 包字段:
    #   - text: 字幕文本内容
    #   - length: 打字机动画总字数（0 = 自动按文本长度计算）
    #   - time: 打字机动画时长（毫秒）
    #   - showBackground: 是否显示字幕背景板
    play: |-
      var.subtitleVisible = true
      var.subtitleText = packet['text']
      var.subtitleLength = packet['length']
      var.subtitleTime = packet['time']
      var.subtitleShowBackground = packet['showBackground']
      var.subtitleAnimation = Lerp(0, var.subtitleLength, var.subtitleTime)
    # packetHandler: close
    # 包字段: 无（仅通知客户端关闭字幕）
    close: |-
      var.subtitleVisible = false
      var.subtitleText = none
      var.subtitleLength = 0
      var.subtitleTime = 0
      var.subtitleShowBackground = false
      var.subtitleAnimation = Lerp(0, 0, 1)
  action:
    load: |-
      var.subtitleVisible = false
      var.subtitleLength = 0
      var.subtitleTime = 0
      var.subtitleShowBackground = false
      var.subtitleAnimation = Lerp(0, 0, 1)

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      字幕面板:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 0
          y: 380
          width: 1280
          height: 72
          visible: var.subtitleVisible
        children:
          字幕背景:
            type: Texture
            attribute:
              point: ~middle_center
              width: 1220
              height: 54
              normal: ~Frosted:30;95,95,95,220
              shape: ~round_rect
              radius: 16
              visible: var.subtitleShowBackground
            effect:
              stroke:
                width: 3
                color: ~0,0,0,255
          字幕文字:
            type: Text
            attribute:
              point: ~middle_center
              x: 0
              y: 0
              limit: var.subtitleAnimation
              texts: "var.subtitleText"
              fontSize: 50
              visible: var.subtitleVisible
