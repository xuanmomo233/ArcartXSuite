# AXS Market — 系统商店界面
# 打开方式: /market shop 或导航跳转
# 布局: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏 + 左侧导航(页面导航+商店列表) + 内容区(商品网格)
# 配色: 蓝色系 主色70,150,250 强调140,200,255 底42,50,66,210 描边255,255,255,230
# 数据交互: packetHandler update

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 接收服务端推送的商店数据
    # 包字段:
    #   - packetId: 数据包通信 ID
    #   - shops: 商店列表字典（key=序号, value=商店对象含 id）
    #   - shopTexts: 商店显示文本字典
    #   - shopIconJson{key}: 各商店图标的 NBT JSON
    #   - shopId: 当前选中的商店 ID
    #   - shopName: 当前商店名称
    #   - items: 商品列表字典（key=序号, value=商品对象含 key/name/price/stock/limitText）
    #   - shopItemJson{key}: 各商品的 NBT JSON
    #   - maxShopCount: 商店最大数量
    #   - maxItemCount: 商品最大数量
    #   - action_token: 操作令牌
    update: |-
      var.itemJsons = {}
      var.shopIconJsons = {}
      oldMaxShopCount = var.maxShopCount
      oldMaxItemCount = var.maxItemCount
      var.packetId = packet['packetId']
      var.shops = packet['shops']
      var.shopTexts = packet['shopTexts']
      var.shopId = packet['shopId']
      var.shopName = packet['shopName']
      var.items = packet['items']
      var.maxShopCount = packet['maxShopCount']
      var.maxItemCount = packet['maxItemCount']
      var.actionToken = packet['action_token']
      var.isAdmin = packet['isAdmin']
      for(key in var.shops.keys()){
        json = packet['shopIconJson' + key]
        if(json != none && json != ''){
          var.shopIconJsons[key] = json
        } else {
          var.shopIconJsons[key] = var.emptyItemJson
        }
      }
      for(key in var.items.keys()){
        json = packet['shopItemJson' + key]
        if(json != none && json != ''){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      if(var.maxShopCount != oldMaxShopCount){
        while(val.商店列表.childrenCount() > 1){
          val.商店列表.get(1).remove()
        }
        if(var.maxShopCount > 1){
          for(i in range(1, var.maxShopCount - 1)){
            key = i.round()
            if(val.商店列表['商店项'] != none) {
              e = val.商店列表['商店项'].copy('商店项' + key)
              e.entryKey = key
            }
          }
        }
      }
      if(var.maxItemCount != oldMaxItemCount){
        while(val.商品列表.childrenCount() > 1){
          val.商品列表.get(1).remove()
        }
        if(var.maxItemCount > 1){
          for(i in range(1, var.maxItemCount - 1)){
            key = i.round()
            if(val.商品列表['商品卡片'] != none) {
              e = val.商品列表['商品卡片'].copy('商品卡片' + key)
              e.entryKey = key
            }
          }
        }
      }
      for(i in range(0, var.maxShopCount - 1)){
        key = i.round()
        if(val.商店列表 != none){
          e = val.商店列表.get(key)
          if(e != none && e['商店图标'] != none){
            e['商店图标'].seticon()
          }
        }
      }
      for(i in range(0, var.maxItemCount - 1)){
        key = i.round()
        if(val.商品列表 != none){
          e = val.商品列表.get(key)
          if(e != none && e['商品图标'] != none){
            e['商品图标'].seticon()
          }
        }
      }
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.packetId = 'AXS_MARKET'
      var.shopId = ''
      var.shopName = ''
      var.shopTexts = {}
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.actionBusy = false
      var.actionBusySeconds = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
      var.cardW = (var.scrollW - 32) / 3
    open: |-
      Packet.send(var.packetId, 'shop_list', '')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
      var.cardW = (var.scrollW - 32) / 3

