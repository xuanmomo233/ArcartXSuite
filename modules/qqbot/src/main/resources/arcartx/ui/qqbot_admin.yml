# QQBot / 消息运营台 — 连接主视图、绑定登记册、梅紫权限终端
ui:
  isHud: false
  defaultOpen: false
  through: false
  background: true
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 15
  screenScale: true
  packetHandler:
    init: |-
      var.bindPage = 0
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.botConnected = packet['botConnected']
      var.totalBindings = packet['totalBindings']
      var.onlinePlayers = packet['onlinePlayers']
      var.maxPlayers = packet['maxPlayers']
      var.groups = packet['groups']
      var.bindings = packet['bindings']
      var.bindTotal = packet['bindTotal']
      var.cmdHistory = []
      var.tab = 'dashboard'
      for(key in var.cmdRows.keys()){
        var.cmdRows[key].remove()
      }
      var.cmdRows = {}
      for(key in var.groupRows.keys()){
        var.groupRows[key].remove()
      }
      var.groupRows = {}
      var.groupRound = (var.groupRound + 1).round()
      for(i in range(1, var.groups.size() - 1)){
        row = val.groupList.get(0).copy('群_' + var.groupRound + '_' + i.round())
        row.entryKey = i.round()
        var.groupRows[i.round()] = row
      }
    update: |-
      var.botConnected = packet['botConnected']
      var.totalBindings = packet['totalBindings']
      var.onlinePlayers = packet['onlinePlayers']
      var.maxPlayers = packet['maxPlayers']
    bindings: |-
      var.bindings = packet['bindings']
      var.bindPage = packet['page']
      var.bindTotal = packet['total']
    cmd_result: |-
      var.cmdResult = packet['result']
      var.cmdHistory.add({'cmd': packet['cmd'], 'result': packet['result'], 'time': packet['time']})
      if(var.cmdHistory.size() > 1){
        var.cmdRound = (var.cmdRound + 1).round()
        row = val.cmdList.get(0).copy('执行记录_' + var.cmdRound)
        row.entryKey = (var.cmdHistory.size() - 1).round()
        var.cmdRows[row.entryKey] = row
      }
  action:
    load: |-
      var.bindTotal = 0
      var.groups = []
      var.maxPlayers = 0
      var.onlinePlayers = 0
      var.packetId = 'AXS_qqbot_admin'
      var.totalBindings = 0
      var.cmdHistory = []
      var.tab = 'dashboard'
      var.cmdRows = {}
      var.cmdRound = 0
      var.groupRows = {}
      var.groupRound = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.bodyW = var.viewW - 128
      var.metricW = (var.bodyW - 24) * 0.62
      var.summaryW = var.bodyW - var.metricW - 24
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.bodyW = var.viewW - 128
      var.metricW = (var.bodyW - 24) * 0.62
      var.summaryW = var.bodyW - var.metricW - 24
controls:
  模态底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~12,19,25,245
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      面板:
        type: Canvas
        attribute:
          x: "32 - var.offX"
          y: 32
          width: "var.viewW - 64"
          height: "var.viewH - 64"
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~23,31,38,255
              shape: ~round_rect
              radius: 20
          标题栏强调:
            type: Texture
            attribute:
              x: 32
              y: 30
              width: 8
              height: 78
              normal: ~156,103,163,255
          模块标记:
            type: Text
            attribute:
              x: 60
              y: 24
              texts: ~&dQQBOT  /  OPERATIONS
              fontSize: 36
              through: true
          标题:
            type: Text
            attribute:
              x: 58
              y: 54
              texts: ~&f消息运营台
              fontSize: 72
              through: true
          权限标记:
            type: Text
            attribute:
              point: ~top_right
              x: -210
              y: 58
              texts: "(var.actionToken != none && var.actionToken != '') ? '&d管理员会话' : '&7会话载入中'"
              fontSize: 36
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -32
              y: 36
              width: 144
              height: 60
            action:
              clickLeft: |-
                var.cmdInput = none
                self.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~55,44,65,255
                  hover: ~95,62,103,255
                  shape: ~round_rect
                  radius: 12
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f关闭
                  fontSize: 36
                  through: true
          tab_仪表盘:
            type: Canvas
            attribute:
              x: 32
              y: 136
              width: 272
              height: 64
            action:
              clickLeft: |-
                var.tab = 'dashboard'
            children:
              tab_仪表盘背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.tab == 'dashboard' ? '28,232,205,255' : '34,44,52,255'"
                  hover: ~70,139,134,255
                  shape: ~round_rect
                  radius: 12
              tab_仪表盘文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "var.tab == 'dashboard' ? '&0运行概览' : '&f运行概览'"
                  fontSize: 48
                  through: true
          tab_绑定管理:
            type: Canvas
            attribute:
              x: 320
              y: 136
              width: 272
              height: 64
            action:
              clickLeft: |-
                var.tab = 'bindings'
                Packet.send(var.packetId, 'fetch_bindings', var.bindPage)
            children:
              tab_绑定管理背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.tab == 'bindings' ? '28,232,205,255' : '34,44,52,255'"
                  hover: ~70,139,134,255
                  shape: ~round_rect
                  radius: 12
              tab_绑定管理文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "var.tab == 'bindings' ? '&0绑定登记' : '&f绑定登记'"
                  fontSize: 48
                  through: true
          tab_控制台:
            type: Canvas
            attribute:
              x: 608
              y: 136
              width: 272
              height: 64
            action:
              clickLeft: |-
                var.tab = 'console'
            children:
              tab_控制台背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.tab == 'console' ? '111,64,119,255' : '34,44,52,255'"
                  hover: ~124,83,130,255
                  shape: ~round_rect
                  radius: 12
              tab_控制台文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f命令终端
                  fontSize: 48
                  through: true
          仪表盘容器:
            type: Canvas
            attribute:
              x: 32
              y: 226
              width: "var.bodyW"
              height: "var.viewH - 322"
              visible: var.tab == 'dashboard'
            children:
              页面标题:
                type: Text
                attribute:
                  texts: ~&f连接与社区
                  fontSize: 54
                  through: true
              页面说明:
                type: Text
                attribute:
                  y: 48
                  texts: ~&7查看机器人连接、玩家在线与监听范围；数据可手动刷新。
                  fontSize: 36
                  through: true
              状态卡片:
                type: Canvas
                attribute:
                  y: 108
                  width: "var.metricW"
                  height: 240
                children:
                  状态底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~30,65,65,255
                      shape: ~round_rect
                      radius: 16
                      through: true
                  状态标题:
                    type: Text
                    attribute:
                      x: 24
                      y: 20
                      texts: ~&bLIVE LINK  /  机器人连接
                      fontSize: 36
                      through: true
                  状态值:
                    type: Text
                    attribute:
                      x: 24
                      y: 72
                      texts: "var.botConnected ? '&b连接正常' : '&c连接断开'"
                      fontSize: 81
                      through: true
                  在线信息:
                    type: Text
                    attribute:
                      x: 24
                      y: 166
                      texts: "'&7服务器玩家  &f' + var.onlinePlayers.round() + ' / ' + var.maxPlayers.round() + '  &7在线'"
                      fontSize: 36
                      through: true
                  在线容量轨:
                    type: Texture
                    attribute:
                      x: 24
                      y: 216
                      width: "self.parent.width - 48"
                      height: 4
                      normal: ~48,88,84,255
                      through: true
                  在线容量:
                    type: Texture
                    attribute:
                      x: 24
                      y: 216
                      width: "(self.parent.width - 48) * math.min(1, var.onlinePlayers / math.max(1, var.maxPlayers))"
                      height: 4
                      normal: ~28,232,205,255
                      through: true
              绑定卡片:
                type: Canvas
                attribute:
                  x: "var.metricW + 24"
                  y: 108
                  width: "var.summaryW"
                  height: 112
                children:
                  绑定底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~232,228,218,255
                      shape: ~round_rect
                      radius: 16
                      through: true
                  绑定标题:
                    type: Text
                    attribute:
                      x: 24
                      y: 20
                      texts: ~&8账号绑定
                      fontSize: 36
                      through: true
                  绑定数:
                    type: Text
                    attribute:
                      point: ~top_right
                      x: -24
                      y: 20
                      texts: "'&0' + var.totalBindings.round()"
                      fontSize: 64
                      through: true
                  绑定说明:
                    type: Text
                    attribute:
                      x: 24
                      y: 66
                      texts: ~&8已登记的账号关联
                      fontSize: 36
                      through: true
              群卡片:
                type: Canvas
                attribute:
                  x: "var.metricW + 24"
                  y: 236
                  width: "var.summaryW"
                  height: 112
                children:
                  群底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~62,41,70,255
                      shape: ~round_rect
                      radius: 16
                      through: true
                  群标题:
                    type: Text
                    attribute:
                      x: 24
                      y: 20
                      texts: ~&f群消息通道
                      fontSize: 36
                      through: true
                  群数量:
                    type: Text
                    attribute:
                      point: ~top_right
                      x: -24
                      y: 20
                      texts: "'&f' + var.groups.size().round()"
                      fontSize: 64
                      through: true
                  群说明:
                    type: Text
                    attribute:
                      x: 24
                      y: 66
                      texts: ~&7已配置的监听群
                      fontSize: 36
                      through: true
              运行简报:
                type: Canvas
                attribute:
                  y: 372
                  width: "var.metricW"
                  height: "self.parent.height - 372"
                children:
                  简报底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~29,39,47,255
                      shape: ~round_rect
                      radius: 16
                      through: true
                  简报标题:
                    type: Text
                    attribute:
                      x: 28
                      y: 26
                      texts: ~&f操作须知
                      fontSize: 48
                      through: true
                  连接说明:
                    type: Text
                    attribute:
                      x: 28
                      y: 84
                      texts: "var.botConnected ? '&b机器人连接正常。' : '&c机器人未连接，请先检查服务连接。'"
                      fontSize: 36
                      through: true
                  功能提示:
                    type: Text
                    attribute:
                      x: 28
                      y: 136
                      texts:
                        - ~&7绑定登记  /  搜索玩家、QQ，核对关联时间。
                        - ~&7命令终端  /  使用服务器控制台权限执行。
                        - ~&d写操作立即提交，请先核对目标与命令。
                      fontSize: 36
                      through: true
                  刷新按钮:
                    type: Canvas
                    attribute:
                      point: ~bottom_left
                      x: 28
                      y: -28
                      width: 240
                      height: 64
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'refresh')
                    children:
                      刷新背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~28,232,205,255
                          hover: ~94,249,224,255
                          shape: ~round_rect
                          radius: 12
                          through: true
                      刷新文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: ~&0刷新运行数据
                          fontSize: 36
                          through: true
              监听群明细:
                type: Canvas
                attribute:
                  x: "var.metricW + 24"
                  y: 372
                  width: "var.summaryW"
                  height: "self.parent.height - 372"
                children:
                  明细底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~29,39,47,255
                      shape: ~round_rect
                      radius: 16
                      through: true
                  明细标题:
                    type: Text
                    attribute:
                      x: 24
                      y: 26
                      texts: ~&f监听群登记
                      fontSize: 48
                      through: true
                  滚动提示:
                    type: Text
                    attribute:
                      x: 24
                      y: 76
                      texts: ~&7滚轮浏览 / 拖动右侧滑块
                      fontSize: 36
                      through: true
                  群滑轨:
                    type: Texture
                    attribute:
                      point: ~top_right
                      x: -20
                      y: 126
                      width: 10
                      height: "self.parent.height - 150"
                      normal: ~55,64,72,255
                      shape: ~round_rect
                      radius: 5
                      through: true
                  群滑块:
                    type: Texture
                    attribute:
                      point: ~top_right
                      x: -20
                      y: 126
                      width: 10
                      height: 64
                      maxDragY: "self.parent.height - 214"
                      normal: ~28,232,205,255
                      hover: ~94,249,224,255
                      shape: ~round_rect
                      radius: 5
                  群滚动栏:
                    type: Scroll
                    attribute:
                      x: 24
                      y: 126
                      width: "self.parent.width - 70"
                      height: "self.parent.height - 150"
                      moveY: "self.parent['群滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        self.parent['群滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    children:
                      群列表:
                        val: groupList
                        type: VStack
                        attribute:
                          width: "self.parent.width"
                          spaceBetween: 10
                        children:
                          群条目:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: var.groups.get(self.entryKey)
                              visible: self.entry != none
                              width: "var.summaryW - 70"
                              height: 64
                            children:
                              群条目底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~41,51,59,255
                                  shape: ~round_rect
                                  radius: 8
                                  through: true
                              群编号:
                                type: Text
                                attribute:
                                  x: 16
                                  y: 16
                                  texts: "'&bQQ  &f' + self.parent.entry['id']"
                                  fontSize: 36
                                  through: true
                  群空状态:
                    type: Text
                    attribute:
                      x: 24
                      y: 144
                      texts: ~&7暂无监听群
                      fontSize: 36
                      visible: var.groups.size() == 0
                      through: true
          绑定管理容器:
            type: Canvas
            attribute:
              x: 32
              y: 226
              width: "var.bodyW"
              height: "var.viewH - 322"
              visible: var.tab == 'bindings'
            children:
              登记标题:
                type: Text
                attribute:
                  texts: ~&f绑定登记
                  fontSize: 54
                  through: true
              登记说明:
                type: Text
                attribute:
                  y: 48
                  texts: ~&7每页 10 条；解绑会立即解除玩家与 QQ 的关联。
                  fontSize: 36
                  through: true
              搜索输入区:
                type: Canvas
                attribute:
                  y: 108
                  width: "var.bodyW - 250"
                  height: 60
                children:
                  搜索输入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~34,44,52,255
                      shape: ~round_rect
                      radius: 12
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: ~80,115,119,255
                  搜索框:
                    type: TextBox
                    attribute:
                      x: 12
                      y: 8
                      width: "self.parent.width - 24"
                      height: 44
                      length: 32
                      emptyText: ~输入玩家名或 QQ 号；留空搜索可返回全部
                      fontSize: 36
                    action:
                      textChange: |-
                        var.searchInput = self.getContent()
              搜索按钮:
                type: Canvas
                attribute:
                  point: ~top_right
                  y: 108
                  width: 216
                  height: 60
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'search_binding', var.searchInput)
                children:
                  搜索背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~28,232,205,255
                      hover: ~94,249,224,255
                      shape: ~round_rect
                      radius: 12
                  搜索文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&0查询登记
                      fontSize: 36
                      through: true
              列标题:
                type: Canvas
                attribute:
                  y: 194
                  width: "var.bodyW - 30"
                  height: 52
                children:
                  列标题底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~232,228,218,255
                      shape: ~round_rect
                      radius: 8
                      through: true
                  玩家列:
                    type: Text
                    attribute:
                      x: 24
                      y: 12
                      texts: ~&8玩家
                      fontSize: 36
                      through: true
                  QQ列:
                    type: Text
                    attribute:
                      x: "var.bodyW * 0.27"
                      y: 12
                      texts: ~&8QQ 账号
                      fontSize: 36
                      through: true
                  时间列:
                    type: Text
                    attribute:
                      x: "var.bodyW * 0.54"
                      y: 12
                      texts: ~&8登记时间
                      fontSize: 36
                      through: true
                  操作列:
                    type: Text
                    attribute:
                      point: ~middle_right
                      x: -44
                      texts: ~&8操作
                      fontSize: 36
                      through: true
              绑定滚动区:
                type: Canvas
                attribute:
                  y: 258
                  width: "var.bodyW"
                  height: "self.parent.height - 352"
                children:
                  绑定滑轨:
                    type: Texture
                    attribute:
                      point: ~top_right
                      width: 12
                      height: "self.parent.height"
                      normal: ~55,64,72,255
                      shape: ~round_rect
                      radius: 6
                      through: true
                  绑定滑块:
                    type: Texture
                    attribute:
                      point: ~top_right
                      width: 12
                      height: 80
                      normal: ~28,232,205,255
                      hover: ~94,249,224,255
                      shape: ~round_rect
                      radius: 6
                      maxDragY: "self.parent.height - 80"
                  绑定滚动栏:
                    type: Scroll
                    attribute:
                      width: "self.parent.width - 30"
                      height: "self.parent.height"
                      moveY: self.parent['绑定滑块'].getDragYRatio()
                    action:
                      wheel: |-
                        self.parent['绑定滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    children:
                      绑定列表:
                        val: bindList
                        type: VStack
                        attribute:
                          width: "self.parent.width"
                          spaceBetween: 10
                        action:
                          create: |-
                            for(i in range(1, 9)){
                              row = self.get(0).copy('绑定行_' + i.round())
                              row.entryKey = i.round()
                            }
                        children:
                          绑定行:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: var.bindings.get(self.entryKey)
                              visible: self.entry != none
                              width: "var.bodyW - 30"
                              height: 88
                            children:
                              行底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~34,44,52,255
                                  shape: ~round_rect
                                  radius: 10
                                  through: true
                              玩家名:
                                type: Text
                                attribute:
                                  x: 24
                                  y: 28
                                  texts: "'&f' + self.parent.entry['name']"
                                  fontSize: 36
                                  through: true
                              QQ号:
                                type: Text
                                attribute:
                                  x: "var.bodyW * 0.27"
                                  y: 28
                                  texts: "'&b' + self.parent.entry['qq']"
                                  fontSize: 36
                                  through: true
                              绑定时间:
                                type: Text
                                attribute:
                                  x: "var.bodyW * 0.54"
                                  y: 28
                                  texts: "'&7' + self.parent.entry['time']"
                                  fontSize: 36
                                  through: true
                              解绑操作:
                                type: Canvas
                                attribute:
                                  point: ~middle_right
                                  x: -16
                                  width: 140
                                  height: 56
                                  enable: "var.actionToken != none && var.actionToken != ''"
                                action:
                                  clickLeft: |-
                                    Packet.send(var.packetId, 'admin_unbind', var.actionToken, self.parent.entry['name'])
                                children:
                                  解绑操作背景:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: ~89,47,74,255
                                      hover: ~157,68,101,255
                                      shape: ~round_rect
                                      radius: 10
                                  解绑操作文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      texts: ~&f解除绑定
                                      fontSize: 36
                                      through: true
                  登记空状态:
                    type: Text
                    attribute:
                      x: 24
                      y: 32
                      texts: ~&7没有匹配的绑定记录。尝试更换关键词。
                      fontSize: 36
                      visible: "var.bindings == none || var.bindings.size() == 0"
                      through: true
              分页提示:
                type: Text
                attribute:
                  point: ~bottom_left
                  y: -24
                  texts: "'&7滚轮浏览  /  共 ' + var.bindTotal.round() + ' 条记录'"
                  fontSize: 36
                  through: true
              上一页:
                type: Canvas
                attribute:
                  point: ~bottom_right
                  x: -440
                  y: -10
                  width: 160
                  height: 60
                  visible: var.bindPage > 0
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'fetch_bindings', var.bindPage - 1)
                children:
                  上一页背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~55,44,65,255
                      hover: ~95,62,103,255
                      shape: ~round_rect
                      radius: 10
                  上一页文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f上一页
                      fontSize: 36
                      through: true
              页码:
                type: Text
                attribute:
                  point: ~bottom_right
                  x: -216
                  y: -26
                  texts: "'&f' + (var.bindPage + 1).round() + ' / ' + math.max(1, math.ceil(var.bindTotal / 10)).round()"
                  fontSize: 36
                  through: true
              下一页:
                type: Canvas
                attribute:
                  point: ~bottom_right
                  y: -10
                  width: 160
                  height: 60
                  visible: (var.bindPage + 1) * 10 < var.bindTotal
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'fetch_bindings', var.bindPage + 1)
                children:
                  下一页背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~55,44,65,255
                      hover: ~95,62,103,255
                      shape: ~round_rect
                      radius: 10
                  下一页文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f下一页
                      fontSize: 36
                      through: true
          控制台容器:
            type: Canvas
            attribute:
              x: 32
              y: 226
              width: "var.bodyW"
              height: "var.viewH - 322"
              visible: var.tab == 'console'
            children:
              终端标题:
                type: Text
                attribute:
                  texts: ~&d权限终端
                  fontSize: 64
                  through: true
              终端说明:
                type: Text
                attribute:
                  y: 48
                  texts: ~&7以服务器控制台身份执行；历史仅保留在本次管理会话。
                  fontSize: 36
                  through: true
              执行计数:
                type: Text
                attribute:
                  point: ~top_right
                  y: 16
                  texts: "'&7本次会话  &f' + var.cmdHistory.size().round() + '  &7次执行'"
                  fontSize: 36
                  through: true
              历史滚动区:
                type: Canvas
                attribute:
                  y: 108
                  width: "var.bodyW"
                  height: "self.parent.height - 232"
                children:
                  终端底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~15,22,29,255
                      shape: ~round_rect
                      radius: 16
                      through: true
                  历史滑轨:
                    type: Texture
                    attribute:
                      point: ~top_right
                      x: -12
                      y: 16
                      width: 12
                      height: "self.parent.height - 32"
                      normal: ~55,44,65,255
                      shape: ~round_rect
                      radius: 6
                      through: true
                  历史滑块:
                    type: Texture
                    attribute:
                      point: ~top_right
                      x: -12
                      y: 16
                      width: 12
                      height: 80
                      normal: ~156,103,163,255
                      hover: ~198,136,198,255
                      shape: ~round_rect
                      radius: 6
                      maxDragY: "self.parent.height - 112"
                  历史滚动栏:
                    type: Scroll
                    attribute:
                      x: 20
                      y: 16
                      width: "self.parent.width - 64"
                      height: "self.parent.height - 32"
                      moveY: self.parent['历史滑块'].getDragYRatio()
                    action:
                      wheel: |-
                        self.parent['历史滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    children:
                      历史列表:
                        val: cmdList
                        type: VStack
                        attribute:
                          width: "self.parent.width"
                          spaceBetween: 14
                        children:
                          历史条目:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: var.cmdHistory.get(self.entryKey)
                              visible: self.entry != none
                              width: "var.bodyW - 64"
                              height: 156
                            children:
                              记录底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~30,34,44,255
                                  shape: ~round_rect
                                  radius: 10
                                  through: true
                              命令窗口:
                                type: Scroll
                                attribute:
                                  x: 18
                                  y: 14
                                  width: "self.parent.width - 300"
                                  height: 44
                                  scrollAnim: none
                                  moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                                action:
                                  enter: self.scrollAnim = Lerp(0, 1, 5000)
                                  leave: self.scrollAnim = none
                                children:
                                  命令布局:
                                    type: HStack
                                    attribute:
                                      height: 44
                                    children:
                                      命令文字:
                                        type: Text
                                        attribute:
                                          texts: "'&b> &f' + self.parent.parent.parent.entry['cmd']"
                                          fontSize: 36
                                          through: true
                              执行时间:
                                type: Text
                                attribute:
                                  point: ~top_right
                                  x: -18
                                  y: 18
                                  texts: "'&7' + self.parent.entry['time']"
                                  fontSize: 36
                                  through: true
                              结果窗口:
                                type: Scroll
                                attribute:
                                  x: 18
                                  y: 74
                                  width: "self.parent.width - 36"
                                  height: 64
                                  scrollAnim: none
                                  moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                                action:
                                  enter: self.scrollAnim = Lerp(0, 1, 7000)
                                  leave: self.scrollAnim = none
                                children:
                                  结果布局:
                                    type: HStack
                                    attribute:
                                      height: 64
                                    children:
                                      结果文字:
                                        type: Text
                                        attribute:
                                          texts: "'&7返回  &f' + self.parent.parent.parent.entry['result']"
                                          fontSize: 36
                                          through: true
                  历史空状态:
                    type: Text
                    attribute:
                      x: 32
                      y: 32
                      texts:
                        - ~&dSERVER CONSOLE
                        - ~&f暂无执行记录
                        - ~&7下方输入命令；执行后在这里核对返回。
                        - ~&7长命令与返回内容可悬停横向浏览。
                      fontSize: 36
                      visible: var.cmdHistory.size() == 0
                      through: true
              命令输入区:
                type: Canvas
                attribute:
                  point: ~bottom_left
                  y: -48
                  width: "var.bodyW - 250"
                  height: 60
                children:
                  命令输入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~34,29,43,255
                      shape: ~round_rect
                      radius: 12
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: ~156,103,163,255
                  命令输入框:
                    type: TextBox
                    attribute:
                      x: 12
                      y: 8
                      width: "self.parent.width - 24"
                      height: 44
                      length: 256
                      emptyText: ~输入服务器命令...
                      fontSize: 36
                    action:
                      textChange: |-
                        var.cmdInput = self.getContent()
              执行按钮:
                type: Canvas
                attribute:
                  point: ~bottom_right
                  y: -48
                  width: 216
                  height: 60
                  enable: "var.actionToken != none && var.actionToken != ''"
                action:
                  clickLeft: |-
                    if(var.cmdInput != none){
                      Packet.send(var.packetId, 'exec_command', var.actionToken, var.cmdInput)
                      var.cmdInput = none
                    }
                children:
                  执行背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "(var.actionToken != none && var.actionToken != '') ? '111,64,119,255' : '49,43,55,255'"
                      hover: ~156,103,163,255
                      shape: ~round_rect
                      radius: 12
                  执行文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "(var.actionToken != none && var.actionToken != '') ? '&f执行命令' : '&7等待授权'"
                      fontSize: 36
                      through: true
              终端底注:
                type: Text
                attribute:
                  point: ~bottom_left
                  y: -4
                  texts: ~&7执行会立即提交  /  滚轮浏览记录  /  悬停查看完整命令与返回
                  fontSize: 36
                  through: true
