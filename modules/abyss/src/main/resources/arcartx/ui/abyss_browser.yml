# AXS 资源说明
# 用途: Abyss 地牢浏览器 —— 副本列表 + 详情 + 进本入口
# 布局: 毛玻璃面板 = 标题栏 + 地牢卡片网格(4x2) + 详情区 + 操作按钮
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
# 重载命令: /axs abyss reload
ui:
  isHud: false
  background: true
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 回包通道
    #   - action_token: 操作令牌
    #   - title: 界面标题
    #   - dungeonRows: 地牢卡片数据(整数字符串key)
    #   - dungeonCount: 地牢总数
    #   - hasParty / partyText: 队伍状态
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.title = packet['title']
      var.dungeonRows = packet['dungeonRows']
      var.dungeonCount = packet['dungeonCount']
      var.hasParty = packet['hasParty']
      var.partyText = packet['partyText']
      var.page = 0
      var.selected = -1
      var.selectedId = ''
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1120
          height: 680
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:24;24,28,38,190
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: ~110,148,204,140
          标题:
            type: Text
            attribute:
              point: ~top_left
              x: 32
              y: 20
              texts: "'&b&l' + var.title"
              fontSize: 48
          队伍状态:
            type: Text
            attribute:
              point: ~top_center
              y: 26
              texts: "'&7' + var.partyText"
              fontSize: 36
          地牢网格:
            val: 地牢网格
            type: HGrid
            attribute:
              point: ~top_left
              x: 32
              y: 88
              width: 700
              spaceBetween: 14
              column: 4
              horizontalAlign: ~center
            action:
              create: |-
                for(i in range(1, 7)){
                  card = self.get(0).copy('卡片' + i.round())
                  card.entryKey = i.round()
                }
            children:
              卡片0:
                type: Canvas
                attribute:
                  entryKey: 0.round()
                  entry: "var.dungeonRows[(var.page * 8 + self.entryKey).round()]"
                  width: 160
                  height: 200
                  visible: "self.entry != none"
                action:
                  clickLeft: |-
                    var.selected = (var.page * 8 + self.entryKey).round()
                    var.selectedId = self.entry['id']
                children:
                  卡片背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: "(var.page * 8 + self.parent.entryKey).round() == var.selected ? '62,90,140,235' : '44,50,66,225'"
                      shape: ~round_rect
                      radius: 12
                      through: true
                    effect:
                      stroke:
                        width: "(var.page * 8 + self.parent.entryKey).round() == var.selected ? 3 : 1"
                        color: "(var.page * 8 + self.parent.entryKey).round() == var.selected ? '120,190,255,255' : '255,255,255,120'"
                  图标:
                    type: Slot
                    attribute:
                      point: ~top_center
                      y: 18
                      width: 56
                      height: 56
                      slotType: ~Icon
                      normal: ~0,0,0,0
                      hover: ~0,0,0,0
                      itemScale: 1.4
                      seticon: "self.setItemIcon(self.parent.entry['iconJson'])"
                      through: true
                  名称:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 86
                      texts: "self.parent.entry['name']"
                      fontSize: 36
                      through: true
                  难度:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 124
                      texts: "'&7难度: &f' + self.parent.entry['difficulty']"
                      fontSize: 36
                      through: true
                  人数:
                    type: Text
                    attribute:
                      point: ~bottom_center
                      y: -14
                      texts: "'&8' + self.parent.entry['minPlayers'].round() + '-' + self.parent.entry['maxPlayers'].round() + '人'"
                      fontSize: 36
                      through: true
          详情面板:
            type: Canvas
            attribute:
              point: ~top_right
              x: -32
              y: 88
              width: 340
              height: 460
            children:
              详情背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~30,34,46,235
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 1
                    color: ~255,255,255,100
              详情标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 18
                  y: 14
                  texts: "var.dungeonRows[var.selected] != none ? '&e' + var.dungeonRows[var.selected]['name'] : '&7选择左侧地牢'"
                  fontSize: 48
              详情条件行:
                type: Text
                attribute:
                  point: ~top_left
                  x: 18
                  y: 70
                  texts:
                    - "var.dungeonRows[var.selected] != none ? '&7难度: &f' + var.dungeonRows[var.selected]['difficulty'] + '   &7人数: &f' + var.dungeonRows[var.selected]['minPlayers'].round() + '-' + var.dungeonRows[var.selected]['maxPlayers'].round() : ''"
                    - "var.dungeonRows[var.selected] != none ? '&7体力: &b' + var.dungeonRows[var.selected]['staminaCost'].round() + '   &7门票: &e' + var.dungeonRows[var.selected]['moneyCost'].round() + '   &7冷却: &f' + var.dungeonRows[var.selected]['cooldown'].round() + 's' : ''"
                    - "var.dungeonRows[var.selected] != none ? '&7运行中实例: &f' + var.dungeonRows[var.selected]['running'].round() + (var.dungeonRows[var.selected]['partyRequired'] ? '   &c需要组队' : '') : ''"
                    - "var.dungeonRows[var.selected] != none && var.dungeonRows[var.selected]['cooldownLeft'] > 0 ? '&c冷却剩余: ' + var.dungeonRows[var.selected]['cooldownLeft'].round() + 's' : ''"
                  fontSize: 36
              详情描述:
                type: Text
                attribute:
                  point: ~top_left
                  x: 18
                  y: 240
                  texts:
                    - "var.dungeonRows[var.selected] != none ? '&8' + var.dungeonRows[var.selected]['desc0'] : ''"
                    - "var.dungeonRows[var.selected] != none ? '&8' + var.dungeonRows[var.selected]['desc1'] : ''"
                    - "var.dungeonRows[var.selected] != none ? '&8' + var.dungeonRows[var.selected]['desc2'] : ''"
                  fontSize: 36
          翻页上一页:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 32
              y: -80
              width: 110
              height: 44
            action:
              clickLeft: |-
                var.page = var.page - 1
                if(var.page < 0){ var.page = 0 }
            children:
              上一页底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~50,58,76,235
                  hover: ~70,82,105,245
                  shape: ~round_rect
                  radius: 10
                  through: true
              上一页字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f上一页
                  fontSize: 36
                  through: true
          翻页下一页:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 152
              y: -80
              width: 110
              height: 44
            action:
              clickLeft: |-
                if((var.page + 1) * 8 < var.dungeonCount){ var.page = var.page + 1 }
            children:
              下一页底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~50,58,76,235
                  hover: ~70,82,105,245
                  shape: ~round_rect
                  radius: 10
                  through: true
              下一页字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f下一页
                  fontSize: 36
                  through: true
          页码:
            type: Text
            attribute:
              point: ~bottom_left
              x: 280
              y: -76
              texts: "'&8第 ' + (var.page + 1).round() + ' 页'"
              fontSize: 36
          进入按钮:
            type: Canvas
            attribute:
              point: ~bottom_right
              x: -152
              y: -80
              width: 120
              height: 48
            action:
              clickLeft: |-
                if(var.selectedId != '' && var.selectedId != none){
                  Packet.send(var.packetId, 'enter', var.selectedId, var.actionToken)
                  Screen.close()
                }
            children:
              进入底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: "var.selectedId != '' && var.selectedId != none ? '60,140,80,240' : '60,62,68,235'"
                  hover: ~80,170,100,250
                  shape: ~round_rect
                  radius: 10
                  through: true
              进入字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f进入
                  fontSize: 36
                  through: true
          队伍按钮:
            type: Canvas
            attribute:
              point: ~bottom_right
              x: -32
              y: -80
              width: 110
              height: 48
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_party_ui', var.actionToken)
            children:
              队伍底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~90,70,140,240
                  hover: ~115,90,170,250
                  shape: ~round_rect
                  radius: 10
                  through: true
              队伍字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f队伍
                  fontSize: 36
                  through: true
          刷新按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -140
              y: 20
              width: 100
              height: 40
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'refresh_browser', var.actionToken)
            children:
              刷新底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~50,58,76,235
                  hover: ~70,82,105,245
                  shape: ~round_rect
                  radius: 10
                  through: true
              刷新字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f刷新
                  fontSize: 36
                  through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -32
              y: 20
              width: 40
              height: 40
            action:
              clickLeft: "Screen.close()"
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~150,58,58,235
                  hover: ~190,75,75,245
                  shape: ~circle
                  through: true
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f✕
                  fontSize: 36
                  through: true
