              through: true
          物品滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -18
              y: 88
              width: 8
              height: "var.viewH - 348"
              normal: ~42,50,66,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          物品滑块:
            type: Texture
            val: 物品滑块
            attribute:
              point: ~top_right
              x: -18
              y: 88
              width: 8
              height: 80
              normal: ~140,200,255,255
              maxDragY: "var.viewH - 428"
              shape: ~round_rect
              radius: 4
          物品滚动:
            type: Scroll
            val: 物品滚动
            attribute:
              point: ~top_left
              x: 24
              y: 88
              width: "var.scrollW"
              height: "var.viewH - 348"
              moveY: "self.parent['物品滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              物品列表:
                val: 物品列表
                type: HGrid
                attribute:
                  width: "var.scrollW"
                  column: 3
                  spaceBetweenX: 16
                  spaceBetweenY: 16
                children:
                  拍卖卡片:
                    type: Canvas
