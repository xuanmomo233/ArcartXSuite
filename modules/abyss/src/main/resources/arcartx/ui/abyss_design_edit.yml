# AXS 资源说明
# 用途: Abyss 设计模式对象编辑面板（范式版·数据驱动）——标量字段 + 脚本/列表行
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
#
# 通讯协议:
#   服务端 → init/update: packetId/action_token/objKey/objId/kindLabel/kindIcon/
#     summary/dirty/fieldRows{idx:{name,editor,label,value,valueZh,options}}/fieldCount/
#     groupRows{idx:{field,label,lines{idx},lineCount}}/groupCount
#   客户端 → Packet.send('abyss', ...):
#     design_set <objKey> <field> <value> <token>   design_cycle <objKey> <field> <token>
#     design_remark <objKey> <field> <token>        design_rename <objKey> <newId> <token>
#     design_line_add/set/del <objKey> <field> [idx] [text] <token>
#     design_back <token>                           返回主面板
#
# 实现要点（§15.5）: copy 后立即访问子控件不可靠 → 输入框不 setContent 预填，
# emptyText 表达式绑 entry 显示当前值；行/组重建走引用字典 + 轮次名；
# 编辑态 var.editField 按字段名匹配组卡。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.objKey = packet['objKey']
      var.objId = packet['objId']
      var.kindLabel = packet['kindLabel']
      var.icon = packet['kindIcon']
      var.summary = packet['summary']
      var.dirty = packet['dirty']
      var.fieldRows = packet['fieldRows']
      var.fieldCount = packet['fieldCount']
      var.groupRows = packet['groupRows']
      var.groupCount = packet['groupCount']
      var.editField = ''
      var.editI = -1
      // ── 字段行重建（数量变化才重建，引用字典删旧）──
      字段目标数 = var.fieldCount.round()
      if(val.字段容器.childrenCount() - 1 != 字段目标数 - 1){
        for(key in var.字段引用.keys()){
          var.字段引用[key].remove()
        }
        var.字段引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.字段容器.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 字段目标数 - 1)){
          e = 模板.copy('字段行_' + var.轮次 + '_' + i.round())
          e.entryKey = i.round()
          var.字段引用[i.round()] = e
        }
      }
      // ── 组卡重建 ──
      组目标数 = var.groupCount.round()
      if(val.组容器.childrenCount() - 1 != 组目标数 - 1){
        for(key in var.组引用.keys()){
          var.组引用[key].remove()
        }
        var.组引用 = {}
        var.行引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.组容器.get(0)
        模板.entryKey = 0.round()
        for(gi in range(1, 组目标数 - 1)){
          e = 模板.copy('组卡_' + var.轮次 + '_' + gi.round())
          e.entryKey = gi.round()
          var.组引用[gi.round()] = e
        }
      }
      // ── 各组行重建（模板组走 get(0)，副本走引用字典）──
      for(gi in range(0, 组目标数 - 1)){
        gObj = var.groupRows['' + gi]
        gCtl = gi == 0 ? val.组容器.get(0) : var.组引用[gi.round()]
        行目标数 = gObj['lineCount'].round()
        if(gCtl != none){
          if(var.行引用['' + gi] == none){
            var.行引用['' + gi] = {}
          }
          for(key in var.行引用['' + gi].keys()){
            var.行引用['' + gi][key].remove()
          }
          var.行引用['' + gi] = {}
          行容器 = gCtl.get(2)
          行模板 = 行容器.get(0)
          行模板.entryKey = 0.round()
          for(li in range(1, 行目标数 - 1)){
            le = 行模板.copy('行_' + var.轮次 + '_' + gi.round() + '_' + li.round())
            le.entryKey = li.round()
            var.行引用['' + gi][li.round()] = le
          }
        }
      }
    update: |-
      var.objId = packet['objId']
      var.summary = packet['summary']
      var.dirty = packet['dirty']
      var.fieldRows = packet['fieldRows']
      var.fieldCount = packet['fieldCount']
      var.groupRows = packet['groupRows']
      var.groupCount = packet['groupCount']
      var.editField = ''
      var.editI = -1
      // ── 字段行重建（数量变化才重建，引用字典删旧）──
      字段目标数 = var.fieldCount.round()
      if(val.字段容器.childrenCount() - 1 != 字段目标数 - 1){
        for(key in var.字段引用.keys()){
          var.字段引用[key].remove()
        }
        var.字段引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.字段容器.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 字段目标数 - 1)){
          e = 模板.copy('字段行_' + var.轮次 + '_' + i.round())
          e.entryKey = i.round()
          var.字段引用[i.round()] = e
        }
      }
      // ── 组卡重建 ──
      组目标数 = var.groupCount.round()
      if(val.组容器.childrenCount() - 1 != 组目标数 - 1){
        for(key in var.组引用.keys()){
          var.组引用[key].remove()
        }
        var.组引用 = {}
        var.行引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.组容器.get(0)
        模板.entryKey = 0.round()
        for(gi in range(1, 组目标数 - 1)){
          e = 模板.copy('组卡_' + var.轮次 + '_' + gi.round())
          e.entryKey = gi.round()
          var.组引用[gi.round()] = e
        }
      }
      // ── 各组行重建（模板组走 get(0)，副本走引用字典）──
      for(gi in range(0, 组目标数 - 1)){
        gObj = var.groupRows['' + gi]
        gCtl = gi == 0 ? val.组容器.get(0) : var.组引用[gi.round()]
        行目标数 = gObj['lineCount'].round()
        if(gCtl != none){
          if(var.行引用['' + gi] == none){
            var.行引用['' + gi] = {}
          }
          for(key in var.行引用['' + gi].keys()){
            var.行引用['' + gi][key].remove()
          }
          var.行引用['' + gi] = {}
          行容器 = gCtl.get(2)
          行模板 = 行容器.get(0)
          行模板.entryKey = 0.round()
          for(li in range(1, 行目标数 - 1)){
            le = 行模板.copy('行_' + var.轮次 + '_' + gi.round() + '_' + li.round())
            le.entryKey = li.round()
            var.行引用['' + gi][li.round()] = le
          }
        }
      }
  action:
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.colW = (var.viewW - 160) / 2
      var.packetId = 'abyss'
      var.editI = -1
      var.editField = ''
      var.字段引用 = {}
      var.组引用 = {}
      var.行引用 = {}
      var.轮次 = 0
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.colW = (var.viewW - 160) / 2
    open: |-
      Sound.self('minecraft:block.note_block.pling', 0.8, 8)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;10,8,20,235
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ═══ 顶栏 ═══
      顶栏底:
        type: Texture
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 84
          normal: ~Frosted:28;14,11,26,240
          through: true
      返回钮:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 20
          width: 110
          height: 44
        action:
          clickLeft: "Packet.send(var.packetId, 'design_back', var.actionToken)"
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~56,50,74,235
              shape: ~round_rect
              radius: 9
              through: true
            effect:
              stroke:
                width: 1
                color: "self.parent.isHovered() ? '255,255,255,200' : '255,255,255,60'"
          字:
            type: Text
            attribute:
              point: ~middle_center
              texts: ~&f‹ 返回
              fontSize: 26
              through: true
      标题:
        type: Text
        attribute:
          point: ~top_left
          x: "180 - var.offX"
          y: 18
          texts: "var.icon + ' &f' + var.kindLabel + ' &8· &f' + var.objId"
          fontSize: 38
          through: true
      摘要:
        type: Text
        attribute:
          point: ~top_left
          x: "182 - var.offX"
          y: 60
          texts: "'&8' + var.summary"
          fontSize: 24
          through: true
      未保存标:
        type: Text
        attribute:
          point: ~top_right
          x: "-60 - var.offX"
          y: 26
          texts: ~&e● 未保存
          fontSize: 28
          visible: var.dirty
          through: true
      # ═══ 左栏：属性字段 ═══
      左栏底:
        type: Texture
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 100
          width: "var.colW"
          height: "var.viewH - 124"
          normal: ~18,14,30,242
          shape: ~round_rect
          radius: 14
          through: true
        effect:
          stroke:
            width: 1
            color: ~255,255,255,50
      左栏题:
        type: Text
        attribute:
          point: ~top_left
          x: "72 - var.offX"
          y: 118
          texts: ~&8属性字段
          fontSize: 28
          through: true
      改名壳:
        type: Canvas
        attribute:
          point: ~top_left
          x: "72 - var.offX"
          y: 158
          width: "var.colW - 40"
          height: 44
        children:
          改名标:
            type: Text
            attribute:
              point: ~middle_left
              texts: ~&8ID
              fontSize: 24
              through: true
          框:
            type: Canvas
            attribute:
              point: ~middle_left
              x: 40
              width: "var.colW - 80"
              height: 38
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~14,11,26,240
                  shape: ~round_rect
                  radius: 7
                  through: true
              输入框:
                type: TextBox
                attribute:
                  x: 10
                  y: 4
                  width: "var.colW - 100"
                  height: 30
                  length: 48
                  fontSize: 24
                  emptyText: ~&8新 id（回车应用）
                action:
                  enter: "Packet.send(var.packetId, 'design_rename', var.objKey, self.getContent(), var.actionToken); self.setContent('')"
      左滑块:
        type: Texture
        val: 左滑块
        attribute:
          point: ~top_right
          x: "-68 - var.offX"
          y: 218
          width: 8
          height: 80
          normal: "186,140,232,255"
          maxDragY: "var.viewH - 410"
          shape: ~round_rect
          radius: 4
      左滚动:
        type: Scroll
        attribute:
          point: ~top_left
          x: "72 - var.offX"
          y: 212
          width: "var.colW - 40"
          height: "var.viewH - 330"
          moveY: "self.parent['左滑块'].getDragYRatio()"
        action:
          wheel: |-
            if(self.moveY >= 0 && self.wheelValue > 0){
              self.parent['左滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
            if(self.moveY <= 1 && self.wheelValue < 0){
              self.parent['左滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
        children:
          字段容器:
            type: VStack
            val: 字段容器
            attribute:
              width: "var.colW - 40"
              spaceBetween: 8
            children:
              字段行:
                type: Canvas
                attribute:
                  width: "var.colW - 40"
                  height: 52
                  entryKey: 0.round()
                  entry: "var.fieldRows[self.entryKey]"
                  visible: "self.entry != none"
                children:
                  行底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~26,22,44,215
                      shape: ~round_rect
                      radius: 8
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: "self.parent.isHovered() ? '245,205,130,150' : '255,255,255,35'"
                  标签:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 16
                      texts: "'&7' + self.parent.entry['label']"
                      fontSize: 25
                      limit: 9
                      through: true
                  # ── TEXT/NUMBER：输入框，emptyText 显示当前值 ──
                  输入壳:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -14
                      width: "var.colW - 300"
                      height: 38
                      visible: "self.parent.entry['editor'] == 'TEXT' || self.parent.entry['editor'] == 'NUMBER'"
                    children:
                      框底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~14,11,26,240
                          shape: ~round_rect
                          radius: 7
                          through: true
                      输入框:
                        type: TextBox
                        attribute:
                          x: 10
                          y: 4
                          width: "var.colW - 320"
                          height: 30
                          length: 96
                          fontSize: 24
                          emptyText: "'&f' + self.parent.parent.entry['valueZh'] + ' &8(回车修改)'"
                        action:
                          enter: "Packet.send(var.packetId, 'design_set', var.objKey, self.parent.parent.entry['name'], self.getContent(), var.actionToken); self.setContent('')"
                  # ── TOGGLE：开关钮 ──
                  开关钮:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -14
                      width: 110
                      height: 36
                      visible: "self.parent.entry['editor'] == 'TOGGLE'"
                    action:
                      clickLeft: "Packet.send(var.packetId, 'design_set', var.objKey, self.parent.entry['name'], self.parent.entry['value'] == 'true' ? 'false' : 'true', var.actionToken)"
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: "self.parent.entry['value'] == 'true' ? '70,160,100,235' : '70,62,90,235'"
                          shape: ~round_rect
                          radius: 8
                          through: true
                        effect:
                          stroke:
                            width: 1
                            color: "self.parent.isHovered() ? '255,255,255,200' : '255,255,255,50'"
                      字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "self.parent.parent.entry['valueZh']"
                          fontSize: 24
                          through: true
                  # ── CYCLE：循环钮 ──
                  循环钮:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -14
                      width: "var.colW - 300"
                      height: 38
                      visible: "self.parent.entry['editor'] == 'CYCLE'"
                    action:
                      clickLeft: "Packet.send(var.packetId, 'design_cycle', var.objKey, self.parent.entry['name'], var.actionToken)"
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~14,11,26,240
                          shape: ~round_rect
                          radius: 7
                          through: true
                        effect:
                          stroke:
                            width: 1
                            color: "self.parent.isHovered() ? '245,205,130,200' : '255,255,255,45'"
                      字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 12
                          texts: "'&e' + self.parent.parent.entry['valueZh'] + '  &8▸'"
                          fontSize: 24
                          limit: 30
                          through: true
                  # ── COORD/REGION：值 + 重标 ──
                  坐标钮:
                    type: Canvas
                    attribute:
                      point: ~middle_right
                      x: -14
                      width: "var.colW - 300"
                      height: 38
                      visible: "self.parent.entry['editor'] == 'COORD' || self.parent.entry['editor'] == 'REGION'"
                    action:
                      clickLeft: "Packet.send(var.packetId, 'design_remark', var.objKey, self.parent.entry['name'], var.actionToken)"
                    children:
                      底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~14,11,26,240
                          shape: ~round_rect
                          radius: 7
                          through: true
                        effect:
                          stroke:
                            width: 1
                            color: "self.parent.isHovered() ? '245,205,130,200' : '255,255,255,45'"
                      值:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 12
                          texts: "'&b' + self.parent.parent.entry['value'] + '  &8[点我重标]'"
                          fontSize: 23
                          limit: 30
                          through: true
      # ═══ 右栏：脚本·列表 ═══
      右栏底:
        type: Texture
        attribute:
          point: ~top_left
          x: "108 - var.offX + var.colW"
          y: 100
          width: "var.colW"
          height: "var.viewH - 124"
          normal: ~18,14,30,242
          shape: ~round_rect
          radius: 14
          through: true
        effect:
          stroke:
            width: 1
            color: ~255,255,255,50
      右栏题:
        type: Text
        attribute:
          point: ~top_left
          x: "132 - var.offX + var.colW"
          y: 118
          texts: ~&8脚本 · 列表
          fontSize: 28
          through: true
      右滑块:
        type: Texture
        val: 右滑块
        attribute:
          point: ~top_right
          x: "-68 - var.offX"
          y: 158
          width: 8
          height: 80
          normal: "186,140,232,255"
          maxDragY: "var.viewH - 370"
          shape: ~round_rect
          radius: 4
      右滚动:
        type: Scroll
        attribute:
          point: ~top_left
          x: "132 - var.offX + var.colW"
          y: 152
          width: "var.colW - 40"
          height: "var.viewH - 270"
          moveY: "self.parent['右滑块'].getDragYRatio()"
        action:
          wheel: |-
            if(self.moveY >= 0 && self.wheelValue > 0){
              self.parent['右滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
            if(self.moveY <= 1 && self.wheelValue < 0){
              self.parent['右滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
        children:
          组容器:
            type: VStack
            val: 组容器
            attribute:
              width: "var.colW - 40"
              spaceBetween: 12
            children:
              组卡:
                type: Canvas
                attribute:
                  width: "var.colW - 40"
                  height: "self.entry['lineCount'] * 46 + 130"
                  entryKey: 0.round()
                  entry: "var.groupRows[self.entryKey]"
                  visible: "self.entry != none"
                children:
                  卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~26,22,44,215
                      shape: ~round_rect
                      radius: 10
                      through: true
                  组题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 16
                      y: 12
                      texts: "'&d' + self.parent.entry['label'] + ' &8· ' + self.parent.entry['lineCount'] + ' 行'"
                      fontSize: 26
                      through: true
                  行容器:
                    type: VStack
                    attribute:
                      point: ~top_left
                      x: 12
                      y: 52
                      width: "var.colW - 80"
                      spaceBetween: 6
                    children:
                      行:
                        type: Canvas
                        attribute:
                          width: "var.colW - 80"
                          height: 40
                          entryKey: 0.round()
                          entry: "self.parent.parent.entry['lines'][self.entryKey]"
                          visible: "self.entry != none"
                        children:
                          行底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~14,11,26,225
                              shape: ~round_rect
                              radius: 6
                              through: true
                            effect:
                              stroke:
                                width: 1
                                color: "self.parent.isHovered() ? '245,205,130,180' : '255,255,255,30'"
                          文:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 10
                              texts: "'&f' + self.parent.entry"
                              fontSize: 22
                              limit: 42
                              through: true
                          改钮:
                            type: Canvas
                            attribute:
                              point: ~middle_right
                              x: -104
                              width: 44
                              height: 30
                            action:
                              clickLeft: "var.editField = self.parent.parent.parent.entry['field']; var.editI = self.parent.entryKey; self.parent.parent.parent['追加框']['框']['输入框'].setContent(self.parent.entry)"
                            children:
                              底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~60,72,110,235
                                  shape: ~round_rect
                                  radius: 6
                                  through: true
                              字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: ~改
                                  fontSize: 20
                                  through: true
                          删钮:
                            type: Canvas
                            attribute:
                              point: ~middle_right
                              x: -54
                              width: 44
                              height: 30
                            action:
                              clickLeft: "Packet.send(var.packetId, 'design_line_del', var.objKey, self.parent.parent.parent.entry['field'], self.parent.entryKey, var.actionToken)"
                            children:
                              底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: "200,80,88,225"
                                  shape: ~round_rect
                                  radius: 6
                                  through: true
                              字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: ~✕
                                  fontSize: 20
                                  through: true
                  追加框:
                    type: Canvas
                    attribute:
                      point: ~bottom_left
                      x: 12
                      y: -12
                      width: "var.colW - 80"
                      height: 44
                    children:
                      框:
                        type: Canvas
                        attribute:
                          point: ~middle_left
                          width: "var.colW - 190"
                          height: 38
                        children:
                          底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~14,11,26,240
                              shape: ~round_rect
                              radius: 7
                              through: true
                          输入框:
                            type: TextBox
                            attribute:
                              x: 10
                              y: 4
                              width: "var.colW - 210"
                              height: 30
                              length: 200
                              fontSize: 22
                              emptyText: ~&8追加新行·回车提交（点行「改」改为编辑该行）
                            action:
                              enter: "var.editField == self.parent.parent.parent.entry['field'] && var.editI >= 0 ? Packet.send(var.packetId, 'design_line_set', var.objKey, self.parent.parent.parent.entry['field'], var.editI, self.getContent(), var.actionToken) : Packet.send(var.packetId, 'design_line_add', var.objKey, self.parent.parent.parent.entry['field'], self.getContent(), var.actionToken); var.editI = -1; var.editField = ''; self.setContent('')"
                      加钮:
                        type: Canvas
                        attribute:
                          point: ~middle_right
                          width: 76
                          height: 38
                        action:
                          clickLeft: "var.editField == self.parent.parent.entry['field'] && var.editI >= 0 ? Packet.send(var.packetId, 'design_line_set', var.objKey, self.parent.parent.entry['field'], var.editI, self.parent['框']['输入框'].getContent(), var.actionToken) : Packet.send(var.packetId, 'design_line_add', var.objKey, self.parent.parent.entry['field'], self.parent['框']['输入框'].getContent(), var.actionToken); var.editI = -1; var.editField = ''; self.parent['框']['输入框'].setContent('')"
                        children:
                          底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: "186,140,232,240"
                              shape: ~round_rect
                              radius: 7
                              through: true
                          字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "var.editField == self.parent.parent.parent.entry['field'] && var.editI >= 0 ? '&0改' : '&0加'"
                              fontSize: 24
                              through: true
      空组提示:
        type: Text
        attribute:
          point: ~middle_center
          x: "var.colW / 2 - 960"
          y: 40
          texts: ~&8此对象无脚本/列表字段
          fontSize: 26
          visible: "var.groupCount == 0"
          through: true
