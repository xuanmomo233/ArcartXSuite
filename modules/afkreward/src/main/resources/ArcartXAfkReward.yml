# 文件用途: ArcartXSuite 挂机奖励模块主配置
# 管理区域挂机奖励的全局开关、反滥用策略、原地挂机行为保护、存储与 HUD 配置。
# 重载: /axs afkreward reload
# 奖励周期、上限、倍率与奖励定义已下放到各个 areas/area-*.yml 文件，
# 每个区域文件现在可以独立配置完整的奖励规则。
config-version: 9  # 配置版本号（用于触发 migration 迁移流程）

debug: false  # 是否开启调试模式（输出详细日志）

# 区域配置目录（相对于 data/afkreward/ 文件夹）
# 每个区域为独立的 area-<id>.yml 文件
areas-directory: "areas"

# 反滥用配置（默认关闭）
anti-abuse:
  time-limit:  # 挂机时长限制
    enable: false              # 是否启用时长限制
    session-seconds: 0         # 单次挂机最大时长（秒），0 表示不限
    daily-seconds: 0           # 每日挂机最大时长（秒），0 表示不限
    on-exceed: STOP            # 超限时行为：STOP（停止挂机）
    exempt-permission: "axs.afkreward.bypass.timelimit"  # 豁免权限节点
  bot-detection:  # 挂机机器人检测
    enable: false              # 是否启用机器人检测
    window-seconds: 300        # 检测窗口时长（秒）
    min-view-changes: 3        # 窗口内最小视角变化次数，低于此值判定为机器人
    action: NO_REWARD          # 检测到机器人时的行为：NO_REWARD（不发奖励）
    exempt-permission: "axs.afkreward.bypass.botcheck"  # 豁免权限节点
  ip-limit:  # 同 IP 挂机人数限制
    enable: false              # 是否启用 IP 限制
    exempt-permission: "axs.afkreward.bypass.iplimit"  # 豁免权限节点
  decay:  # 奖励衰减机制
    enable: false              # 是否启用奖励衰减
    start-seconds: 3600        # 衰减开始时间（秒），挂机超过此时长后开始衰减
    factor-per-hour: 0.2       # 每小时衰减因子（倍率每小时减少 0.2）
    min-multiplier: 0.3        # 最低衰减倍率（衰减不会低于此值）

# 发奖审计日志
audit:
  enable: true   # 是否启用审计日志
  file: "audit.log"  # 审计日志文件名

# 原地挂机配置
manual:
  # 挂机期间是否封锁玩家行为（移动/交互/破坏/开箱/传送/受击）
  restrict-actions: true
  # 结束挂机后是否传送回原始位置
  return-on-end: false
  # 结束挂机时是否全服广播奖励消息
  broadcast-rewards: true
  # 参与战斗后开始原地挂机前的冷却时间（秒）
  combat-cooldown-seconds: 10
  # MANUAL 模式权限及区域复查间隔（秒）
  permission-recheck-seconds: 5
  # 排行榜显示人数
  leaderboard-size: 10
  # 发奖时触发的 EventPacket 信号名（为空则不触发）
  signal-on-reward: "afk_reward"
  # 结束挂机时触发的 EventPacket 信号名
  signal-on-end: "afk_end"
  # 发奖时播放的字幕组 ID（为空则不播放）
  subtitle-on-reward: ""
  # 结束挂机时播放的字幕组 ID
  subtitle-on-end: ""
  # 结束挂机时发送的邮件预设（需 Mail 模块）
  # 预设需在 Mail 模块的 presets 目录中存在（见 Mail 模块的 mail/presets/ 资源），
  # 否则结束挂机时会打印 "预设邮件派发失败" 警告。
  # 启用方式：在 Mail 模块创建对应预设后，取消下方注释并填入预设 ID。
  end-mail:
    mail:
      presets: []
      # - "afk_end_mail"

  # MANUAL 挂机期间的独立行为保护开关，默认全部开启。
  protections:
    # 禁止移动。
    movement: true
    # 禁止传送。
    teleport: true
    # 禁止交互方块或空气。
    interact: true
    # 禁止破坏方块。
    block-break: true
    # 禁止打开容器或背包界面。
    inventory: true
    # 受到伤害时无敌。
    receive-damage: true
    # 禁止对其他实体造成伤害。
    deal-damage: true
    # 禁止被怪物锁定为目标。
    entity-target: true
    # 禁止进入载具。
    vehicle-enter: true
    # 禁止右键实体。
    interact-entity: true
    # 禁止丢弃物品。
    drop-item: true
    # 禁止副手换手。
    swap-hand: true
    # 禁止拾取掉落物。
    pickup-item: true
    # 禁止获得经验。
    experience: true
    # 禁止碰撞（setCollidable(false)。）
    collidable: true

# 性能保护
performance:
  pause-on-low-tps:  # 服务器 TPS 过低时暂停挂机奖励
    enable: false    # 是否启用低 TPS 暂停
    min-tps: 15.0    # 触发暂停的 TPS 阈值

# 存储配置
storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "afkreward.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: 3
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_afk_"

# HUD 配置
ui:
  ui-id: "AXS:afk_reward_hud"  # HUD 界面 ID（对应 ui/afk_reward_hud.yml）
  register-ui-on-enable: true       # 模块启用时是否自动注册 HUD
  overwrite-ui-files: false       # 是否在每次启用时覆盖用户已修改的 UI 文件
