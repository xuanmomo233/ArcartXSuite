# Season expedition journal · 01 / cover and current route
# Indigo ink / ochre chapter rail / cream reward paper. Design viewport: 1920x1080.
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.seasonName = packet['seasonName']
      var.currentLevel = packet['currentLevel']
      var.maxLevel = packet['maxLevel']
      var.currentXp = packet['currentXp']
      var.xpPerLevel = packet['xpPerLevel']
      var.xpNeeded = packet['xpNeeded']
      var.premiumUnlocked = packet['premiumUnlocked']
      var.deluxeUnlocked = packet['deluxeUnlocked']
      var.tier = packet['tier']
      var.tierDisplay = packet['tierDisplay']
      var.progressRatio = packet['progressRatio']
  action:
    load: |-
      var.currentLevel = 0
      var.currentXp = 0
      var.maxLevel = 0
      var.progressRatio = 0
      var.seasonName = '等待同步'
      var.xpNeeded = 1000
      var.xpPerLevel = 1000
      var.packetId = 'AXS_BATTLEPASS'
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.cardW = (var.contentW - 96) / 2
    open: |-
      Packet.send(var.packetId, 'refresh')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.cardW = (var.contentW - 96) / 2
controls:
  全屏玻璃底:
    type: Texture
    attribute: {point: ~stretch_all, normal: '~Frosted:16;24,29,51,235'}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶栏:
        type: Canvas
        attribute: {point: ~top_left, x: '-var.offX', width: var.viewW, height: 96}
        children:
          顶栏底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~29,35,62,255'}
          标题:
            type: Text
            attribute: {point: ~middle_left, x: 48, texts: '~&f战令 / 远征手记', fontSize: 48, through: true}
          赛季名:
            type: Text
            attribute: {point: ~middle_left, x: 540, texts: "'&e' + var.seasonName", fontSize: 36, through: true, limit: 24}
          关闭按钮:
            type: Canvas
            attribute: {point: ~middle_right, x: -48, width: 160, height: 52}
            action:
              clickLeft: Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~44,53,88,255', hover: '~62,73,111,255', shape: ~round_rect, radius: 6, through: true}
              关闭文字:
                type: Text
                attribute: {point: ~middle_center, texts: '~&f合上 / ESC', fontSize: 36, through: true}
      左侧导航:
        type: Canvas
        attribute: {point: ~top_left, x: '48 - var.offX', y: 120, width: 300, height: 'var.viewH - 144'}
        children:
          导航底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~187,140,66,255', shape: ~round_rect, radius: 8}
          目录标题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 26, texts: '~&0远征目录', fontSize: 48, through: true}
          目录副题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 84, texts: '~&0SEASON JOURNAL', fontSize: 36, through: true}
          导航总览:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 154, width: 268, height: 72}
            children:
              总览底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,40,70,255', shape: ~round_rect, radius: 6, through: true}
              总览文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&f01 / 行程总览', fontSize: 36, through: true}
          导航奖励:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 238, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_rewards')
            children:
              奖励底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              奖励文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0第二章 / 奖励', fontSize: 36, through: true}
          导航任务:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 322, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_tasks')
            children:
              任务底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              任务文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0第三章 / 任务', fontSize: 36, through: true}
          导航结算:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 406, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_settlement')
            children:
              结算底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              结算文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0终章 / 结算', fontSize: 36, through: true}
          装订线:
            type: Texture
            attribute: {point: ~top_left, x: 24, y: 522, width: 252, height: 2, normal: '~91,67,35,255', through: true}
          旅程提示:
            type: Text
            attribute:
              point: ~top_left
              x: 24
              y: 556
              texts: ['~&0任务累积经验', '~&0等级开启奖励', '~&0终章记录收获']
              fontSize: 36
              through: true
          页码:
            type: Text
            attribute: {point: ~bottom_left, x: 24, y: -32, texts: '~&001 / 04 · 总览', fontSize: 36, through: true}
      内容区:
        type: Canvas
        attribute: {point: ~top_left, x: '372 - var.offX', y: 120, width: var.contentW, height: 'var.viewH - 144'}
        children:
          内容底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~239,232,215,255', shape: ~round_rect, radius: 8}
          页标题:
            type: Text
            attribute: {point: ~top_left, x: 36, y: 28, texts: '~&0这一季，走到哪一站？', fontSize: 64, through: true}
          页标题说明:
            type: Text
            attribute: {point: ~top_left, x: 38, y: 102, texts: '~&8记录当前等级，规划下一段远征。', fontSize: 36, through: true}
          等级卡片:
            type: Canvas
            attribute: {point: ~top_left, x: 32, y: 164, width: 'var.contentW - 64', height: 280}
            children:
              等级卡底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,40,70,255', shape: ~round_rect, radius: 8}
              等级标签:
                type: Text
                attribute: {point: ~top_left, x: 32, y: 24, texts: '~&e当前路标 / LEVEL', fontSize: 36, through: true}
              等级数字:
                type: Text
                attribute: {point: ~top_left, x: 32, y: 74, texts: "'&fLv.' + var.currentLevel", fontSize: 100, through: true}
              等级上限:
                type: Text
                attribute: {point: ~top_left, x: 360, y: 112, texts: "'&7终点 / ' + var.maxLevel", fontSize: 48, through: true}
              经验文本:
                type: Text
                attribute: {point: ~top_left, x: 'var.contentW * 0.52', y: 32, texts: "'&f本级经验 / ' + var.currentXp + ' / ' + var.xpPerLevel", fontSize: 36, through: true}
              还需经验:
                type: Text
                attribute: {point: ~top_left, x: 'var.contentW * 0.52', y: 88, texts: "(type.toNumber(var.maxLevel) > 0 && type.toNumber(var.currentLevel) >= type.toNumber(var.maxLevel)) ? '&e已抵达本季终点' : '&e距下一站还需 ' + var.xpNeeded + ' XP'", fontSize: 48, through: true}
              进度百分比:
                type: Text
                attribute: {point: ~top_right, x: -32, y: 164, texts: "'&e' + (type.toNumber(var.progressRatio) * 100).round() + '%'", fontSize: 36, through: true}
              进度条容器:
                type: Canvas
                attribute: {point: ~top_left, x: 32, y: 220, width: 'var.contentW - 128', height: 12}
                children:
                  进度条背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~68,78,113,255', shape: ~round_rect, radius: 6, through: true}
                  进度条填充:
                    type: Texture
                    attribute: {point: ~top_left, width: '(type.toNumber(var.progressRatio) > 1 ? 1 : type.toNumber(var.progressRatio)) * (var.contentW - 128)', height: 12, normal: '~205,163,84,255', shape: ~round_rect, radius: 6, through: true}
          快捷入口:
            type: Canvas
            attribute: {point: ~top_left, x: 32, y: 480, width: var.cardW, height: 324}
            children:
              快捷标题:
                type: Text
                attribute: {point: ~top_left, x: 8, y: 0, texts: '~&001 / 继续行程', fontSize: 54, through: true}
              快捷说明:
                type: Text
                attribute: {point: ~top_left, x: 8, y: 70, texts: ['~&8每日、每周、赛季任务带来经验。', '~&8抵达等级路标后，领取旅途奖励。'], fontSize: 36, through: true}
              任务按钮:
                type: Canvas
                attribute: {point: ~top_left, x: 8, y: 180, width: 'var.cardW - 16', height: 62}
                action:
                  clickLeft: Packet.send(var.packetId, 'open_tasks')
                children:
                  任务按钮底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~32,40,70,255', hover: '~55,65,102,255', shape: ~round_rect, radius: 6, through: true}
                  任务按钮文字:
                    type: Text
                    attribute: {point: ~middle_left, x: 24, texts: '~&f下一步 / 查看任务路线 >', fontSize: 36, through: true}
              奖励按钮:
                type: Canvas
                attribute: {point: ~top_left, x: 8, y: 256, width: 'var.cardW - 16', height: 62}
                action:
                  clickLeft: Packet.send(var.packetId, 'open_rewards')
                children:
                  奖励按钮底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~213,177,109,255', hover: '~227,194,130,255', shape: ~round_rect, radius: 6, through: true}
                  奖励按钮文字:
                    type: Text
                    attribute: {point: ~middle_left, x: 24, texts: '~&0已到达 / 打开奖励路标 >', fontSize: 36, through: true}
          档位卡片:
            type: Canvas
            attribute: {point: ~top_left, x: '64 + var.cardW', y: 480, width: var.cardW, height: 324}
            children:
              档位卡标题:
                type: Text
                attribute: {point: ~top_left, x: 8, y: 0, texts: '~&002 / 通行档位', fontSize: 54, through: true}
              档位徽章:
                type: Text
                attribute: {point: ~top_right, x: -12, y: 12, texts: var.tierDisplay, fontSize: 36, through: true}
              免费权益:
                type: Text
                attribute: {point: ~top_left, x: 8, y: 82, texts: ['~&0免费 / 已激活', '~&8基础奖励，所有玩家默认享有'], fontSize: 36, through: true}
              高级权益:
                type: Text
                attribute: {point: ~top_left, x: 8, y: 164, texts: ["var.premiumUnlocked == 'true' ? '&0高级 / 已激活' : '&0高级 / 未解锁'", '~&8每个等级额外一份奖励'], fontSize: 36, through: true}
              典藏权益:
                type: Text
                attribute: {point: ~top_left, x: 8, y: 246, texts: ["var.deluxeUnlocked == 'true' ? '&0典藏 / 已激活' : '&0典藏 / 未解锁'", '~&8专属奖励与稀有道具'], fontSize: 36, through: true}
          装订页脚线:
            type: Texture
            attribute: {point: ~bottom_left, x: 40, y: -78, width: 'var.contentW - 80', height: 2, normal: '~198,185,157,255', through: true}
          玩法说明:
            type: Text
            attribute: {point: ~bottom_left, x: 40, y: -30, texts: '~&8旅途备忘 / 经验满格提升等级；已解锁档位可领奖，建议及时领取。', fontSize: 36, through: true}
