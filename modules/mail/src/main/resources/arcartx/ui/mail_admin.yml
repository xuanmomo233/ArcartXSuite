# AXS Mail 管理后台（翠绿信使重写版）
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航 + 内容区
# 布局: 左导航(收件箱/日志/写信/兑换码/管理) + 内容区(列表视图/编辑视图 切换)
# 配色: 翠绿信使 主色80,180,120 底30,32,38,110 抬升36,38,48,245 描边60,64,82,220
# 逻辑: packetHandler 接收 preset-list/preset-detail/attachment-count/result；var.view 控制列表/编辑切换

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  level: 8
  itemSize: 16
  screenScale: true
  action:
    load: |-
      var.view = 'list'
      var.resultMsg = none
      var.editItemCount = 0
      var.maxPresetCount = 0
      var.isAdmin = false
      var.adminAttachmentSlots = 18
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.attachmentJsons = none
      var.presetDetailLoaded = false
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send('AXS_MAIL', 'admin-preset-list')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
  packetHandler:
    # packetHandler: preset-list
    # 包字段:
    #   - presets: 预设列表（Map，键为索引，每项含 id/displayName/subject/enabled/attachmentCount/commandCount）
    #   - total: 预设总数
    #   - maxPresetCount: 预设列表最大显示条数
    #   - is_admin: 当前玩家是否为管理员
    preset-list: |-
      var.presets = packet['presets']
      var.total = packet['total']
      var.maxPresetCount = packet['maxPresetCount']
      var.isAdmin = packet['is_admin']
      var.adminAttachmentSlots = packet['adminAttachmentSlots']
      while(val.preset_data.childrenCount() > 1){
        val.preset_data.get(1).remove()
      }
      for(i in range(1, var.maxPresetCount - 1)){
        key = i.round()
        e = val.preset_data['预设行'].copy('预设行' + key)
        e.entryKey = key
      }
    # packetHandler: preset-detail
    # 包字段: id/enabled/displayName/subject/body/expiresAfterDays/currencyAttachments/itemAttachmentCount/claimCommands/claimConditions/found
    # 注意: setContent 和 seticon 必须推迟到下一帧执行，因为 var.view = 'edit' 的 visible
    # 属性表达式要到下一帧才重新求值，同帧调用 setContent 会被渲染引擎丢弃（控件尚未可见）。
    preset-detail: |-
      var.editId = packet['id']
      var.editEnabled = packet['enabled']
      var.editDisplayName = packet['displayName']
      var.editSubject = packet['subject']
      var.editBody = packet['body']
      var.editExpiresDays = packet['expiresAfterDays']
      var.editItemCount = packet['itemAttachmentCount'].round()
      var.editCommands = packet['claimCommands']
      var.editConditions = packet['claimConditions']
      var.editFound = packet['found']
      var.view = 'edit'
      var.resultMsg = none
      var.attachmentJsons = packet['attachment_jsons']
      // 货币附件和 CDK 结构化列表
      var.editCurrencyList = packet['currencyAttachmentsList'] != none ? packet['currencyAttachmentsList'] : []
      var.editCdkList = packet['cdkList'] != none ? packet['cdkList'] : []
      // 标记 preset-detail 已加载，attachment-count 到达时跳过覆盖（session 为空）
      var.presetDetailLoaded = true
      // 推迟到下一帧再 setContent/seticon/动态行，确保编辑视图已可见、控件已就绪
      scheduler.delay(50, -> {
        tmpId = var.editId != none ? var.editId : ''
        tmpDisplayName = var.editDisplayName != none ? var.editDisplayName : ''
        tmpSubject = var.editSubject != none ? var.editSubject : ''
        tmpBody = var.editBody != none ? var.editBody : ''
        tmpExpiresDays = var.editExpiresDays != none ? var.editExpiresDays + '' : ''
        tmpCommands = var.editCommands != none ? var.editCommands : ''
        tmpConditions = var.editConditions != none ? var.editConditions : ''
        val.编辑编号框.setContent(tmpId)
        val.编辑显示名框.setContent(tmpDisplayName)
        val.编辑主题框.setContent(tmpSubject)
        val.编辑正文框.setContent(tmpBody)
        val.编辑过期框.setContent(tmpExpiresDays)
        val.编辑命令框.setContent(tmpCommands)
        val.编辑领取条件框.setContent(tmpConditions)
        // 重建货币附件行：模板作为第 0 行，再复制 size-1 个
        while(val.货币附件滚动区.childrenCount() > 1){
          val.货币附件滚动区.get(1).remove()
        }
        if(var.editCurrencyList.size() > 0){
          row = val.货币附件滚动区['货币行模板']
          row.entryKey = 0
          row['货币输入'].setContent(var.editCurrencyList[0.round()]['currency'] != none ? var.editCurrencyList[0.round()]['currency'] : '')
          row['金额输入'].setContent(var.editCurrencyList[0.round()]['amount'] != none ? var.editCurrencyList[0.round()]['amount'] + '' : '')
          row['描述输入'].setContent(var.editCurrencyList[0.round()]['description'] != none ? var.editCurrencyList[0.round()]['description'] : '')
        }
        for(i in range(1, var.editCurrencyList.size() - 1)){
          row = val.货币附件滚动区['货币行模板'].copy('货币行' + i.round())
          row.entryKey = i.round()
          row['货币输入'].setContent(var.editCurrencyList[i.round()]['currency'] != none ? var.editCurrencyList[i.round()]['currency'] : '')
          row['金额输入'].setContent(var.editCurrencyList[i.round()]['amount'] != none ? var.editCurrencyList[i.round()]['amount'] + '' : '')
          row['描述输入'].setContent(var.editCurrencyList[i.round()]['description'] != none ? var.editCurrencyList[i.round()]['description'] : '')
        }
        // 重建 CDK 行：模板作为第 0 行，再复制 size-1 个
        while(val.CDK滚动区.childrenCount() > 1){
          val.CDK滚动区.get(1).remove()
        }
        if(var.editCdkList.size() > 0){
          row = val.CDK滚动区['CDK行模板']
          row.entryKey = 0
          row.cdkEnabled = var.editCdkList[0.round()]['enabled'] != false
          row['CDK码输入'].setContent(var.editCdkList[0.round()]['code'] != none ? var.editCdkList[0.round()]['code'] : '')
          row['最大领取输入'].setContent(var.editCdkList[0.round()]['maxClaims'] != none ? var.editCdkList[0.round()]['maxClaims'] + '' : '100')
          row['过期输入'].setContent(var.editCdkList[0.round()]['expiresAfter'] != none ? var.editCdkList[0.round()]['expiresAfter'] : '30d')
        }
        for(i in range(1, var.editCdkList.size() - 1)){
          row = val.CDK滚动区['CDK行模板'].copy('CDK行' + i.round())
          row.entryKey = i.round()
          row.cdkEnabled = var.editCdkList[i.round()]['enabled'] != false
          row['CDK码输入'].setContent(var.editCdkList[i.round()]['code'] != none ? var.editCdkList[i.round()]['code'] : '')
          row['最大领取输入'].setContent(var.editCdkList[i.round()]['maxClaims'] != none ? var.editCdkList[i.round()]['maxClaims'] + '' : '100')
          row['过期输入'].setContent(var.editCdkList[i.round()]['expiresAfter'] != none ? var.editCdkList[i.round()]['expiresAfter'] : '30d')
        }
        // 附件槽位为 Icon 类型，需要手动 seticon 刷新；背包槽位为 Backpack 类型，自动显示
        for(i in range(0, var.adminAttachmentSlots - 1)){
          slot = val.管理附件网格.get(i.round())
          if(slot != none){
            slot.seticon()
          }
        }
      })
    # packetHandler: attachment-count
    # 包字段: itemAttachmentCount/attachment_jsons/backpack_jsons
    attachment-count: |-
      // 添加/删除附件后由 attachment-count 更新；打开编辑时由 preset-detail 提供 attachment_jsons，
      // 此时 attachment-count 的 session 为空，不应覆盖。用 presetDetailLoaded 标志区分两种场景。
      if(var.presetDetailLoaded){
        var.presetDetailLoaded = false
      } else {
        var.attachmentJsons = packet['attachment_jsons']
        var.editItemCount = (var.attachmentJsons != none ? var.attachmentJsons.size() : 0).round()
      }
      // 附件槽位为 Icon 类型，需要手动 seticon 刷新；背包槽位为 Backpack 类型，自动显示
      for(i in range(0, var.adminAttachmentSlots - 1)){
        slot = val.管理附件网格.get(i.round())
        if(slot != none){
          slot.seticon()
        }
      }
    # packetHandler: result
    # 包字段: success/message/closeView
    # closeView=true: 保存/删除成功后切回列表；closeView=false: 附件增删后留在编辑视图
    result: |-
      var.resultMsg = packet['message']
      if(packet['success'] && packet['closeView'] == true){
        var.view = 'list'
      }

# ─── 控件树 ────────────────────────────────────────────────────────
# 布局: 顶栏(标题色块+标题+关闭) + 左导航(5项) + 内容区(列表/编辑切换)
# 配色: 翠绿信使 深底浅字 — 抬升面36,38,48 描边60,64,82 强调80,180,120
# fontSize: 48(顶栏标题) / 36(区域标题/按钮/信息) / 32(小标签) — 全部标准档位
controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;30,32,38,110
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~255,255,255,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~80,180,120,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f邮件管理"
              fontSize: 48
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ──────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          导航收件箱:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'open')
            children:
              收件箱底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              收件箱文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f收件箱"
                  fontSize: 36
                  through: true
          导航日志:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'logs')
            children:
              日志底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              日志文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f日志"
                  fontSize: 36
                  through: true
          导航写信:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'compose')
            children:
              写信底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              写信文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f写信"
                  fontSize: 36
                  through: true
          # 当前页：管理
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
              visible: "var.isAdmin == true"
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~80,180,120,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              管理高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~80,180,120,255
                  shape: ~round_rect
                  radius: 2
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0管理"
                  fontSize: 36
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 298
              width: 264
              height: 2
              normal: ~255,255,255,230
          操作标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 316
              texts: "~&f快捷操作"
              fontSize: 36
          刷新列表按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 362
              width: 272
              height: 48
            action:
              clickLeft: |-
                var.view = 'list'
                Packet.send('AXS_MAIL', 'admin-preset-list')
            children:
              刷新列表底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.view == 'list' ? '80,180,120,230' : '36,38,48,245'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "var.view == 'list' ? '120,220,160,255' : (self.isHovered() ? '120,220,160,255' : '255,255,255,230')"
              刷新列表文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.view == 'list' ? '&0刷新列表' : '&f刷新列表'"
                  fontSize: 36
                  through: true
          新建预设按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 422
              width: 272
              height: 48
            action:
              clickLeft: |-
                var.editId = none
                var.editEnabled = true
                var.editDisplayName = none
                var.editSubject = none
                var.editBody = none
                var.editExpiresDays = 15
                var.editItemCount = 0
                var.editCommands = none
                var.editConditions = none
                var.editFound = false
                var.editCurrencyList = []
                var.editCdkList = []
                var.view = 'edit'
                var.resultMsg = none
                // 推迟到下一帧再清空输入框，确保编辑视图已可见（与 preset-detail 同理）
                scheduler.delay(50, -> {
                  val.编辑编号框.setContent('')
                  val.编辑显示名框.setContent('')
                  val.编辑主题框.setContent('')
                  val.编辑正文框.setContent('')
                  val.编辑过期框.setContent('15')
                  val.编辑命令框.setContent('')
                  val.编辑领取条件框.setContent('')
                  // 清空货币附件和 CDK 动态行
                  while(val.货币附件滚动区.childrenCount() > 1){
                    val.货币附件滚动区.get(1).remove()
                  }
                  row = val.货币附件滚动区['货币行模板']
                  row['货币输入'].setContent('')
                  row['金额输入'].setContent('')
                  row['描述输入'].setContent('')
                  while(val.CDK滚动区.childrenCount() > 1){
                    val.CDK滚动区.get(1).remove()
                  }
                  row = val.CDK滚动区['CDK行模板']
                  row.cdkEnabled = true
                  row['CDK码输入'].setContent('')
                  row['最大领取输入'].setContent('100')
                  row['过期输入'].setContent('30d')
                })
                Packet.send('AXS_MAIL', 'admin-preset-new')
            children:
              新建预设底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.view == 'edit' ? '80,180,120,230' : '36,38,48,245'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "var.view == 'edit' ? '120,220,160,255' : (self.isHovered() ? '120,220,160,255' : '255,255,255,230')"
              新建预设文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.view == 'edit' ? '&0新建预设' : '&f新建预设'"
                  fontSize: 36
                  through: true

      # ── 内容区 ──────────────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          # 内容区大白毛玻璃底
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # ── 列表视图 ───────────────────────────────────
          列表视图:
            type: Canvas
            attribute:
              point: ~stretch_all
              visible: "var.view == 'list' || var.view == none"
            children:
              列表底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              # 表头
              表头:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 16
                  y: 12
                  width: "var.contentW - 32"
                  height: 40
                children:
                  表头底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,38,48,245
                      shape: ~round_rect
                      radius: 8
                    effect:
                      stroke:
                        width: 2
                        color: ~255,255,255,230
                  编号列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 14
                      texts: "~&fID"
                      fontSize: 36
                  名称列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 200
                      texts: "~&f显示名"
                      fontSize: 36
                  主题列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 440
                      texts: "~&f标题"
                      fontSize: 36
                  启用列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 700
                      texts: "~&f启用"
                      fontSize: 36
                  操作列:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 820
                      texts: "~&f操作"
                      fontSize: 36
              # 预设滑轨
              预设滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -12
                  y: 64
                  width: 10
                  height: "var.viewH - 144 - 80"
                  normal: ~40,44,52,225
                  shape: ~round_rect
                  radius: 5
                effect:
