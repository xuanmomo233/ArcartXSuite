          当前密码容器:
            type: Canvas
            attribute: { x: 40, y: 150, width: 640, height: 56 }
            children:
              当前密码底:
                type: Texture
                attribute: { point: '~stretch_all', normal: '~77,58,38,255', shape: '~round_rect', radius: 6, through: true }
                effect:
                  stroke: { width: 1, color: '~166,139,93,255' }
              当前密码:
                type: TextBox
                attribute:
                  x: 14
                  y: 8
                  width: 612
                  height: 38
                  length: 64
                  passwordChar: ~'*'
                  emptyText: ~&e输入当前密码
                  fontSize: 36
                action:
                  textChange: |-
                    var.passwordCurrent = self.getContent()
          新密码标签:
            type: Text
            attribute: { x: 40, y: 224, visible: "var.passwordPanel['mode'] == 'set'", texts: '~&8新密码', fontSize: 36, through: true }
          新密码容器:
            type: Canvas
            attribute: { x: 40, y: 262, width: 640, height: 56, visible: "var.passwordPanel != none && var.passwordPanel['mode'] == 'set'" }
            children:
              新密码底:
                type: Texture
                attribute: { point: '~stretch_all', normal: '~77,58,38,255', shape: '~round_rect', radius: 6, through: true }
                effect:
                  stroke: { width: 1, color: '~166,139,93,255' }
              新密码:
                type: TextBox
                attribute:
                  x: 14
                  y: 8
                  width: 612
                  height: 38
                  length: 64
                  passwordChar: ~'*'
                  emptyText: ~&e输入新密码
                  fontSize: 36
                action:
                  textChange: |-
                    var.passwordNew = self.getContent()
          安全提示:
            type: Text
            attribute:
              x: 40
              y: 244
              visible: "var.passwordPanel['mode'] != 'set'"
              texts:
                - ~&8密码仅用于行囊二级验证。
                - ~&8取消可返回装备册，不会提交密码。
              fontSize: 36
              through: true
          提交:
            type: Canvas
            attribute: { x: 40, y: 344, width: 304, height: 60, enable: "!var.actionBusy || var.passwordPanel['mode'] == 'unlock'" }
            action:
              clickLeft: |-
                if(var.passwordPanel['mode'] == 'set'){
                  var.actionBusy = true
                  Packet.send(var.packetId, 'password_set', var.passwordCurrent, var.passwordNew, var.actionToken)
                }else{
                  if(var.passwordPanel['mode'] == 'clear'){
                    var.actionBusy = true
                    Packet.send(var.packetId, 'password_clear', var.passwordCurrent, var.actionToken)
                  }else{
                    Packet.send(var.packetId, 'password_unlock', var.passwordCurrent)
                  }
                }
            children:
              提交背景:
                type: Texture
                attribute: { point: '~stretch_all', normal: "(var.actionBusy && var.passwordPanel['mode'] != 'unlock') ? '177,165,133,255' : '105,121,67,255'", hover: '~130,147,85,255', shape: '~round_rect', radius: 6, through: true }
              提交文字:
                type: Text
                attribute: { point: '~middle_center', texts: "'&f' + var.密码动作", fontSize: 36, through: true }
          取消:
            type: Canvas
            attribute: { x: 376, y: 344, width: 304, height: 60 }
            action:
              clickLeft: |-
                var.passwordPanel['visible'] = false
                Packet.send(var.packetId, 'password_panel_close')
            children:
              取消背景:
                type: Texture
                attribute: { point: '~stretch_all', normal: '~199,183,147,255', hover: '~216,202,169,255', shape: '~round_rect', radius: 6, through: true }
              取消文字:
                type: Text
                attribute: { point: '~middle_center', texts: '~&0取消', fontSize: 36, through: true }
          清除密码:
            type: Canvas
            attribute: { point: '~bottom_center', y: -20, width: 220, height: 40, visible: "var.passwordPanel != none && var.passwordPanel['mode'] != 'set'", enable: "!var.actionBusy && var.actionToken != none && var.actionToken != ''" }
            action:
              clickLeft: |-
                var.actionBusy = true
                Packet.send(var.packetId, 'password_clear', var.passwordCurrent, var.actionToken)
            children:
              清除密码背景:
                type: Texture
                attribute: { point: '~stretch_all', normal: '~143,79,50,255', hover: '~170,95,57,255', shape: '~round_rect', radius: 5, through: true }
              清除密码文字:
                type: Text
                attribute: { point: '~middle_center', texts: '~&f清除二级密码', fontSize: 36, through: true }
