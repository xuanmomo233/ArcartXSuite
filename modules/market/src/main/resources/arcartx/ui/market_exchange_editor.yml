                    var.costRows = {}
                    var.rewardRows = {}
                    var.hydrating = true
                    val.offerIdInput.setContent('')
                    val.offerNameInput.setContent('')
                    val.offerPermissionInput.setContent('')
                    var.hydrating = false
                    var.assetSide = 'cost'
                    var.assetIndex = 0
                    var.dirty = true
                    var.asset = var.assetSide == 'cost' ? var.costs[var.assetIndex.round()] : var.rewards[var.assetIndex.round()]
                    var.hydrating = true
                    val.assetIdInput.setContent(var.asset == none ? '' : var.asset['id'])
                    val.assetAmountInput.setContent(var.asset == none ? '' : var.asset['amount'])
                    var.hydrating = false
                    var.assetRowsDirty = true
                    var.assetPreviewDirty = true
                    }
                    if(kind == 'delete_shop'){var.busy = true
                    Packet.send('AXS:market_exchange_editor', 'delete_shop', var.shopId, var.revision, 'confirm', var.token)
                    }
                    if(kind == 'delete_offer'){var.busy = true
                    Packet.send('AXS:market_exchange_editor', 'delete_offer', var.shopId, var.offerId, var.revision, 'confirm', var.token)
                    }
                    if(kind == 'resolve'){
                    Packet.send('AXS:market_exchange_editor', 'resolve', var.ledgerSelection, 'confirm', var.token)
                    }
