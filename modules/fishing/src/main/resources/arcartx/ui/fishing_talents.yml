                  width: 272
                  texts: "~&f↻ 重置天赋树"
                  fontSize: 30
                  through: true

      # ── 内容区（天赋树画布）──────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~80,200,220,240

          # 天赋点信息栏
          信息栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 16
              width: "var.contentW - 48"
              height: 48
            children:
              信息背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 2
                    color: ~80,200,220,230
              信息文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 20
                  width: 600
                  texts: "'&f天赋树 &7| &a可用: &f' + var.unspentTalentPoints.round() + ' &7/ &f' + var.talentPoints.round() + '  &7| &f等级: &e' + var.playerLevel.round()"
                  fontSize: 26
              重置按钮:
                type: Canvas
                attribute:
                  point: ~middle_right
                  x: -12
                  width: 120
                  height: 34
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'reset_talents')
                children:
                  重置按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~80,30,30,200
                      hover: ~180,50,50,230
                      shape: ~round_rect
                      radius: 8
                    effect:
                      stroke:
                        width: 2
                        color: ~200,80,80,160
                  重置按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 120
                      texts: "~&f↻ 重置"
                      fontSize: 30
                      through: true

          # 滚动区：五系与联动节点常驻显示
          滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 76
              width: "var.contentW - 48"
              height: "var.viewH - 236"
              moveX: "self.parent['树横滑块'].getDragXRatio()"
              moveY: "self.parent['树滑块'].getDragYRatio()"
            children:
              树画布:
                val: 树画布
                type: Canvas
                attribute:
                  width: "var.canvasW"
                  height: 1420
                children:
                  # 树标题模板
                  树标题模板:
                    type: Canvas
                    val: 树标题模板
                    attribute:
                      width: 200
                      height: 40
                      treeId: 'steady'
                      visible: false
                    children:
                      树标题文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 200
                          texts: "var.treeNames[self.parent.treeId] != none ? var.treeNames[self.parent.treeId] : '&7未知'"
                          fontSize: 34
                          through: true
                  # 联动标题模板
                  联动标题模板:
                    type: Canvas
                    val: 联动标题模板
                    attribute:
                      width: 260
                      height: 28
                      visible: false
                    children:
                      联动标题文字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 0
                          width: 260
                          texts: "~&6◆ 跨树联动天赋"
                          fontSize: 30
                          through: true
                  # 天赋节点模板（正方形 Slot + 连线 + Tooltip）
                  # tick 中 copy 后设置 entryKey/treeId/treeX/isLink
                  天赋节点模板:
                    type: Canvas
                    val: 天赋节点模板
                    attribute:
                      point: ~top_left
                      entryKey: 0.round()
                      treeId: 'steady'
                      isLink: false
                      entry: "self.isLink == true ? var.links[self.entryKey] : (var.trees[self.treeId] != none ? var.trees[self.treeId]['nodes'][self.entryKey] : none)"
                      visible: "self.entry != none"
                      width: "var.nodeSize"
                      height: "var.nodeSize"
                      brightColor: "self.treeId == 'steady' ? '72,238,112,255' : (self.treeId == 'swift' ? '48,208,248,255' : (self.treeId == 'pressure' ? '248,70,70,255' : (self.treeId == 'focus' ? '212,86,248,255' : (self.treeId == 'lucky' ? '252,198,42,255' : '255,128,42,255'))))"
                      dimColor: "self.treeId == 'steady' ? '48,156,82,255' : (self.treeId == 'swift' ? '34,138,170,255' : (self.treeId == 'pressure' ? '172,48,48,255' : (self.treeId == 'focus' ? '144,54,180,255' : (self.treeId == 'lucky' ? '180,138,30,255' : '190,76,30,255'))))"
                      lineColor: "self.entry != none && self.entry['unlocked'] == true ? self.brightColor : self.dimColor"
                      linkTree1: 'steady'
                      linkTree2: 'steady'
                      linkBright1: "self.linkTree1 == 'steady' ? '82,255,128,255' : (self.linkTree1 == 'swift' ? '60,220,255,255' : (self.linkTree1 == 'pressure' ? '255,78,78,255' : (self.linkTree1 == 'focus' ? '218,95,255,255' : '255,210,55,255')))"
                      linkBright2: "self.linkTree2 == 'steady' ? '82,255,128,255' : (self.linkTree2 == 'swift' ? '60,220,255,255' : (self.linkTree2 == 'pressure' ? '255,78,78,255' : (self.linkTree2 == 'focus' ? '218,95,255,255' : '255,210,55,255')))"
                      linkDim1: "self.linkTree1 == 'steady' ? '48,165,82,255' : (self.linkTree1 == 'swift' ? '38,145,178,255' : (self.linkTree1 == 'pressure' ? '178,48,48,255' : (self.linkTree1 == 'focus' ? '142,58,178,255' : '184,142,34,255')))"
                      linkDim2: "self.linkTree2 == 'steady' ? '48,165,82,255' : (self.linkTree2 == 'swift' ? '38,145,178,255' : (self.linkTree2 == 'pressure' ? '178,48,48,255' : (self.linkTree2 == 'focus' ? '142,58,178,255' : '184,142,34,255')))"
                      linkColor1: "self.entry != none && self.entry['prerequisiteStates'] != none && self.entry['prerequisiteStates'][0] == true ? self.linkBright1 : self.linkDim1"
                      linkColor2: "self.entry != none && self.entry['prerequisiteStates'] != none && self.entry['prerequisiteStates'][1] == true ? self.linkBright2 : self.linkDim2"
                      # 节点等级状态：0=未点亮, 1~maxLevel-1=部分升级, maxLevel=满级
                      nodeLevel: "self.entry != none && self.entry['level'] != none ? type.toNumber(self.entry['level']).round() : 0"
                      nodeMaxLevel: "self.entry != none && self.entry['maxLevel'] != none ? type.toNumber(self.entry['maxLevel']).round() : 1"
                      isMaxed: "self.nodeLevel >= self.nodeMaxLevel"
                    action:
                      clickLeft: |-
                        if(self.entry != none){
                          if(self.entry['canLevelUp'] == true){
                            Packet.send(var.packetId, 'level_up_talent', self.entry['id'])
                          }
                        }
                    children:
                      # 连线：竖直段（从本节点向上指向父节点）
                      # T3/T5 同列节点用竖直线；T2/T4 分叉节点用 L 形
                      连线竖直:
                        type: Texture
                        attribute:
                          x: 22
                          y: -42
                          width: 3
                          height: 42
                          normal: "self.parent.lineColor"
                          visible: false
                          through: true
                      # L形连线：竖直段（上半）
                      连线L竖:
                        type: Texture
                        attribute:
                          x: 22
                          y: -42
                          width: 3
                          height: 21
                          normal: "self.parent.lineColor"
                          visible: false
                          through: true
                      # L形连线：水平段（下半，向左或向右）
                      连线L横:
                        type: Texture
                        attribute:
                          x: 0
                          y: -24
                          width: 80
                          height: 3
                          normal: "self.parent.lineColor"
                          visible: false
                          through: true
                      连线L父竖:
                        type: Texture
                        attribute:
                          x: 0
                          y: -24
                          width: 3
                          height: 24
                          normal: "self.parent.lineColor"
                          visible: false
                          through: true
                      # 联动节点双前置路径：两条来源线分别标记两个前置天赋
                      联动1竖:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor1"
                          visible: false
                          through: true
                      联动1横:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor1"
                          visible: false
                          through: true
                      联动2竖:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor2"
                          visible: false
                          through: true
                      联动2横:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor2"
                          visible: false
                          through: true
                      联动入竖:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor1"
                          visible: false
                          through: true
                      联动2入竖:
                        type: Texture
                        attribute:
                          width: 1
                          height: 1
                          normal: "self.parent.linkColor2"
                          visible: false
                          through: true
                      # 节点图标（Slot 显示物品 icon）
                      节点图标:
                        type: Slot
                        attribute:
                          point: ~middle_center
                          width: 88
                          height: 88
                          slotType: ~Icon
                          itemScale: 0.75
                          normal: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? '24,30,38,255' : '16,20,28,255'"
                          shape: ~round_rect
                          radius: 12
                          seticon: "self.setItemIcon(self.parent.entry != none ? self.parent.entry['iconJson'] : var.emptyItemJson)"
                        effect:
                          stroke:
                            width: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? 6 : 4"
                            color: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? self.parent.brightColor : self.parent.dimColor"
                          neon:
                            color: "self.parent.brightColor"
                            size: 6
                            intensity: "self.parent.entry != none && self.parent.entry['unlocked'] == true ? 1 : 0"
                            animated: false
                        action:
                          clickLeft: |-
                            if(self.parent.entry != none){
                              if(self.parent.entry['canLevelUp'] == true){
                                Packet.send(var.packetId, 'level_up_talent', self.parent.entry['id'])
                              }
                            }
                      # 等级标签（右下角显示 当前等级/最大等级）
                      等级标签:
                        type: Canvas
                        attribute:
                          point: ~bottom_right
                          x: -2
                          y: -2
                          width: 36
                          height: 20
                          visible: "self.parent.entry != none && self.parent.entry['unlocked'] == true && self.parent.nodeMaxLevel > 1"
                        children:
                          等级标签底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.parent.isMaxed ? '40,80,40,220' : '20,30,45,220'"
                              shape: ~round_rect
                              radius: 4
                          等级文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 36
                              texts: "self.parent.parent.nodeLevel + '/' + self.parent.parent.nodeMaxLevel"
                              fontSize: 18
                              through: true
          # 滚动滑轨（纵向）
          树滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -8
              y: 76
              width: 12
              height: "var.viewH - 236"
              normal: ~15,25,38,220
              shape: ~round_rect
              radius: 6
            effect:
              stroke:
                width: 2
                color: ~80,200,220,240
          # 滚动滑块（纵向）
          树滑块:
            type: Texture
            val: 树滑块
            attribute:
              point: ~top_right
              x: -8
              y: 76
              width: 12
              height: 120
              normal: ~50,170,200,220
              shape: ~round_rect
              radius: 6
              maxDragY: "var.viewH - 356"
          # 横向滑轨
          树横滑轨:
            type: Texture
            attribute:
              point: ~bottom_left
              x: 24
              y: -10
              width: "var.contentW - 48"
              height: 12
              normal: ~15,25,38,220
              shape: ~round_rect
              radius: 6
            effect:
              stroke:
                width: 2
                color: ~80,200,220,240
          # 横向滑块
          树横滑块:
            type: Texture
            val: 树横滑块
            attribute:
              visible: true
              point: ~bottom_left
              x: 24
              y: -10
              width: 160
              height: 12
              normal: ~50,170,200,220
              shape: ~round_rect
              radius: 6
              maxDragX: "var.contentW - 208"
