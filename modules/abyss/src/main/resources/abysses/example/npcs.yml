# 副本 NPC：Adyeshach 临时公共实体（npc key = Adyeshach npcId）
# Chemdah 会话用 'adyeshach <npc key>' 绑定；右键 NPC 时：
#   ① 绑定了会话 → 打开 ArcartX 对话 UI（conversation 模块）
#   ② 未绑定/模块缺席 → 聊天栏逐句播放 dialogs 兜底
# click-script 与会话并行执行。

guide:
  name: "&e向导·艾琳"
  # 不用村民类——Adyeshach 缺席降级为真实体时，村民右键弹原版交易 GUI；女巫无交易界面
  type: WITCH
  location: "anchor:f1_start.guide"  # 生成锚点：向导位（面入口）
  look-at-player: true
  dialogs:                        # 无 Chemdah 会话时的聊天栏兜底
    - "&e欢迎来到元气试炼之地！"
    - "&7三层迷宫：走廊自由探索，战斗房肃清后通往 Boss 的门才会开。"
    - "&7击杀魔物掉金币，祭坛和商队都收这个。"
    - "&a需要委托的话，我可以给你登记讨伐任务。"
  dialog-interval: 40
  click-script:
    - "quest_step slayer"          # 未接取→接 Chemdah 委托；已完成→领奖励
    - "run_script guide_guide"     # 指路：从"找向导"切到"穿过东廊"
  once: false

merchant:
  name: "&6神秘商人·老陈"
  # 不用村民/行商类——原版交互会弹出交易 GUI 盖住商店 UI；女巫无交易界面且契合"神秘商人"
  # 右键 = 直接开 abyss_shop 购物 UI（shops.yml caravan 店）；不绑 Chemdah 会话
  # （绑定会话会让对话 UI 与商店 UI 同弹——卖货 NPC 不需要先寒暄再点进商店）
  type: WITCH
  location: "anchor:f2_shop.merchant"  # 生成锚点：柜台后
  look-at-player: true
  click-script:
    - "open_shop_ui @trigger caravan"   # 开商店 UI（shops.yml）
  once: false
