# AXS Market — 回收商店界面
# 打开方式: /market recycle
# 数据交互: packetHandler init/update；客户端 Packet.send(var.packetId, action, ...)

ui:
  isHud: false
  defaultOpen: false
  hide:
    - HUD
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: init
    # 首次收到服务端数据包时执行，初始化回收界面所有变量和动态控件
    # 包字段:
    #   - packetId: 数据包通信 ID（用于客户端 Packet.send 回传）
    #   - multiplier: 回收价格倍率（如 1.2 表示 VIP 加成 20%）
    #   - recyclables: 可回收物品字典（key=序号, value=回收条目含 name/amount/unitPrice/totalPrice/slot 等）
    #   - recycleItemJson{key}: 各回收物品的 NBT JSON 字符串（如 recycleItemJson0、recycleItemJson1...）
    #   - maxRecycleCount: 最大回收条目数量（用于动态复制回收项控件）
    #   - earningsTitle: 收益区标题（单货币="可回收总价值:"，多货币="可回收收益明细:"）
    #   - earningsTexts: 分货币收益文本字典（key=序号, value=已格式化的收益字符串如"金币: 100.00"）
    #   - maxEarningsCount: 货币种类数量（用于动态复制收益项控件）
    #   - action_token: 操作令牌（防重放攻击，回收时回传）
    init: |-
      var.packetId = packet['packetId']
      var.multiplier = packet['multiplier']
      var.recyclables = packet['recyclables']
      var.itemJsons = {}
      var.maxRecycleCount = packet['maxRecycleCount']
      var.earningsTitle = packet['earningsTitle']
      var.earningsTexts = packet['earningsTexts']
      var.maxEarningsCount = packet['maxEarningsCount']
      var.actionToken = packet['action_token']
      var.batchConfirm = packet['batchConfirm']
      for(key in var.recyclables.keys()){
        json = packet['recycleItemJson' + key]
        if(json != none){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      while(val.回收列表.childrenCount() > 1){
        val.回收列表.get(1).remove()
      }
      for(i in range(1, var.maxRecycleCount - 1)){
        key = i.round()
        e = val.回收列表['回收项'].copy('回收项' + key)
        e.entryKey = key
      }
      for(i in range(0, var.maxRecycleCount - 1)){
        key = i.round()
        e = val.回收列表.get(i.round())
        if(e != none && e['物品图标'] != none){
          e['物品图标'].entryKey = key
          e['物品图标'].seticon()
        }
      }
      while(val.收益列表.childrenCount() > 1){
        val.收益列表.get(1).remove()
      }
      for(i in range(1, var.maxEarningsCount - 1)){
        key = i.round()
        e = val.收益列表['收益项'].copy('收益项' + key)
        e.entryKey = key
      }
      var.actionBusy = false
      var.confirmPending = false
    # packetHandler: update
    # 服务端推送更新时执行，字段与 init 完全相同，用于刷新回收列表数据
    # 包字段: 同 init（packetId/multiplier/recyclables/recycleItemJson{key}/maxRecycleCount/
    #   earningsTitle/earningsTexts/maxEarningsCount/action_token/batchConfirm）
    update: |-
      var.packetId = packet['packetId']
      var.multiplier = packet['multiplier']
      var.recyclables = packet['recyclables']
      var.itemJsons = {}
      var.maxRecycleCount = packet['maxRecycleCount']
      var.earningsTitle = packet['earningsTitle']
      var.earningsTexts = packet['earningsTexts']
      var.maxEarningsCount = packet['maxEarningsCount']
      var.actionToken = packet['action_token']
      var.batchConfirm = packet['batchConfirm']
      for(key in var.recyclables.keys()){
        json = packet['recycleItemJson' + key]
        if(json != none){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      while(val.回收列表.childrenCount() > 1){
        val.回收列表.get(1).remove()
      }
      for(i in range(1, var.maxRecycleCount - 1)){
        key = i.round()
        e = val.回收列表['回收项'].copy('回收项' + key)
        e.entryKey = key
      }
      for(i in range(0, var.maxRecycleCount - 1)){
        key = i.round()
        e = val.回收列表.get(i.round())
        if(e != none && e['物品图标'] != none){
          e['物品图标'].entryKey = key
          e['物品图标'].seticon()
        }
      }
      while(val.收益列表.childrenCount() > 1){
        val.收益列表.get(1).remove()
      }
      for(i in range(1, var.maxEarningsCount - 1)){
        key = i.round()
        e = val.收益列表['收益项'].copy('收益项' + key)
        e.entryKey = key
      }
      var.actionBusy = false
      var.confirmPending = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
      if(var.confirmPending){
        var.confirmPendingSeconds = var.confirmPendingSeconds + 1
        if(var.confirmPendingSeconds >= 3){
          var.confirmPending = false
          var.confirmPendingSeconds = 0
        }
      }else{
        var.confirmPendingSeconds = 0
      }
    # action: open
    # UI 打开时执行，初始化所有变量为默认空值，然后向服务端请求回收预览数据
    # 发送数据包: Packet.send(packetId, 'recycle_preview')
    open: |-
      var.packetId = 'AXS_MARKET'
      var.multiplier = '1.0'
      var.recyclables = {}
      var.itemJsons = {}
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.maxRecycleCount = 0
      var.earningsTitle = '可回收总价值:'
      var.earningsTexts = {}
      var.maxEarningsCount = 0
      var.actionToken = ''
      var.batchConfirm = false
      var.confirmPending = false
      var.confirmPendingSeconds = 0
      var.actionBusy = false
      var.actionBusySeconds = 0
      Packet.send(var.packetId, 'recycle_preview')

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1400
          height: 860
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~32,32,42,238
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~80,255,140,180
              shadow:
                xOffset: 0
                yOffset: 4
                blur: 12
                color: ~0,0,0,140

          标题:
            type: Text
            attribute:
              x: 42
              y: 24
              texts: "~&a回收商店"
              fontSize: 100
          副标题:
            type: Text
            attribute:
              x: 42
              y: 78
              texts: "~&7回收倍率: &e{var.multiplier}x"
              fontSize: 32

          关闭按钮:
            type: Texture
            attribute:
              x: 1332
              y: 28
              width: 48
              height: 48
              normal: ~180,70,70,210
              hover: ~Frosted:0;220,90,90,230
              shape: ~round_rect
              radius: 12
            action:
              clickLeft: |-
                Screen.close()
            effect:
              stroke:
                width: 1
                color: ~255,130,130,120
            children:
              文字:
                type: Text
                attribute:
                  x: 24
                  y: 9
                  through: true
                  center: true
                  fontSize: 48
                  texts: "~&f✕"

          # ── 物品列表 ──────────────────────────────────
          列表卡片:
            type: Canvas
            attribute:
              x: 32
              y: 120
              width: 1336
              height: 600
            children:
              列表卡片背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~42,45,58,220
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 2
                    color: ~80,255,140,100
              列表卡片文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 1336
                  texts: ~&8暂无可回收物品
                  fontSize: 100
                  through: true
              列表标题:
                type: Text
                attribute:
                  x: 20
                  y: 12
                  texts: "~&7可回收物品"
                  fontSize: 32
              列表纵向滑块:
                type: Texture
                val: 列表纵向滑块
                attribute:
                  x: 1320
                  y: 48
                  width: 6
                  height: 50
                  normal: ~120,120,120,200
                  maxDragY: 460
              列表滚动:
                type: Scroll
                val: 列表滚动
                attribute:
                  x: 30
                  y: 48
                  width: 1280
                  height: 510
                  moveY: "self.parent['列表纵向滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['列表纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['列表纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  回收列表:
                    val: 回收列表
                    type: VStack
                    attribute:
                      width: 1280
                      spaceBetween: 8
                    children:
                      回收项:
                        type: Texture
                        attribute:
                          entryKey: 0.round()
                          entry: var.recyclables[self.entryKey]
                          visible: self.entry != none
                          width: 1280
                          height: 64
                          normal: ~50,53,66,220
                          hover: ~Frosted:0;80,255,140,80
                          shape: ~round_rect
                          radius: 14
                        effect:
                          stroke:
                            width: 1
                            color: ~80,255,140,60
                        children:
                          物品图标:
                            type: Slot
                            attribute:
                              entryKey: 0.round()
                              slotType: ~Icon
                              itemScale: 1.0
                              x: 12
                              y: 4
                              width: 56
                              height: 56
                              normal: ~40,42,54,220
                              shape: ~round_rect
                              radius: 10
                              through: true
                              seticon: "self.setItemIcon(var.itemJsons[self.entryKey])"
                          名称:
                            type: Text
                            attribute:
                              x: 84
                              y: 8
                              width: 400
                              texts: "self.parent.entry != none ? '&f' + self.parent.entry['name'] : none"
                              fontSize: 34
                              through: true
                          数量:
                            type: Text
                            attribute:
                              x: 84
                              y: 38
                              width: 120
                              texts: "'&7x' + self.parent.entry['amount'].round()"
                              fontSize: 22
                              through: true
                          单价:
                            type: Text
                            attribute:
                              x: 540
                              y: 14
                              width: 240
                              texts: "self.parent.entry != none ? '&e单价: &f' + self.parent.entry['unitPrice'] : none"
                              fontSize: 28
                              through: true
                          总价:
                            type: Text
                            attribute:
                              x: 800
                              y: 14
                              width: 340
                              texts: "self.parent.entry != none ? '&a总计: &f' + self.parent.entry['totalPrice'] : none"
                              fontSize: 28
                              through: true
                          回收按钮:
                            type: Canvas
                            attribute:
                              x: 1150
                              y: 6
                              width: 120
                              height: 52
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'recycle_single', self.parent.entry['slot'], var.actionToken)
                            children:
                              回收背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~60,180,100,200
                                  hover: ~Frosted:0;80,220,120,80
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  stroke:
                                    width: 1
                                    color: ~80,255,140,120
                              回收文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 120
                                  texts: "~&f回收"
                                  fontSize: 28
                                  through: true

          # ── 底部操作栏 ──────────────────────────────
          收益标题:
            type: Text
            attribute:
              x: 42
              y: 750
              texts: "~&7{var.earningsTitle}"
              fontSize: 36
              through: true

          收益列表:
            val: 收益列表
            type: VStack
            attribute:
              x: 154
              y: 750
              width: 600
              spaceBetween: 4
            children:
              收益项:
                type: Text
                attribute:
                  entryKey: 0.round()
                  entry: var.earningsTexts[self.entryKey]
                  visible: self.entry != none
                  texts: "'&a▪ &f' + self.entry"
                  fontSize: 28
                  through: true

          一键回收:
            type: Canvas
            attribute:
              x: 1040
              y: 750
              width: 240
              height: 56
              enable: "!var.actionBusy && var.actionToken != ''"
            action:
              clickLeft: |-
                if(var.batchConfirm && !var.confirmPending){
                  var.confirmPending = true
                  var.confirmPendingSeconds = 0
                }else{
                  var.confirmPending = false
                  var.actionBusy = true
                  Packet.send(var.packetId, 'recycle_all', var.actionToken)
                }
            children:
              一键回收背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.confirmPending ? '200,80,80,220' : '60,200,100,220'"
                  hover: ~Frosted:0;80,240,120,80
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 2
                    color: ~80,255,140,160
              一键回收文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 240
                  texts: "var.confirmPending ? '~&f确认回收?' : '~&f一键回收全部'"
                  fontSize: 42
                  through: true

          刷新按钮:
            type: Canvas
            attribute:
              x: 1300
              y: 750
              width: 68
              height: 56
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'recycle_preview')
            children:
              刷新背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~56,58,70,220
                  hover: ~Frosted:0;255,255,255,80
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 2
                    color: ~80,255,140,120
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 68
                  texts: "~&f刷新"
                  fontSize: 42
                  through: true
