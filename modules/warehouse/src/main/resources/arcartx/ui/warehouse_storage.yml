                  lock: true
                  entryKey: 9.round()
                  width: 66
                  height: 66
                  normal: "self.entryKey == var.selectedBackpackSlot ? '160,170,180,230' : '52,58,66,235'"
                  shape: ~round_rect
                  radius: 12
                action:
                  clickLeft: |-
                    now = Time.currentTime()
