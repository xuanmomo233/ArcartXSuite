# AXS 资源说明
# 用途: Mail 模块默认写信菜单，用于编辑标题、正文、附件和发送动作。
# 前置依赖: ArcartX；Mail 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.mail.enabled + modules.mail.password
# 关联文件: ArcartXMail.yml、ui/mail_inbox.yml
# 重载命令: /axs mail reload
# 最小使用路径: ui + controls
# 结构提示: 顶层 ui 节点定义窗口行为；packetHandler 负责接收写信上下文；controls 定义输入框、附件槽和确认按钮。

ui:
  match:
    - AXS Mail Compose
  background: false
  through: true
  escClose: true
  show: true
  screenScale: true
  action:
    load: |-
      var.sessionId = none
      var.actionToken = ''
      var.baseFee = '0'
      var.vaultTaxRate = '0'
      var.allowVault = true
      var.quoteSuccess = true
      var.quoteMessage = none
      var.itemFee = '0'
      var.totalFee = '0'
      var.maxAttachments = 0
      var.attachmentCount = 0
      var.subjectMax = 48
      var.bodyMax = 400
      var.composeRecipient = none
      var.composeSubject = none
      var.composeBody = none
      var.composeVault = '0'
      var.passwordPanelVisible = false
      var.passwordText = ''
      var.currencies = none
      var.feeCurrency = ''
      var.totalFeeCurrency = ''
  # packetHandler 负责接收服务端下发的数据包并刷新本地变量。
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - session_id: 写信会话 ID，用于服务端校验本次寄信操作
    #   - action_token: 操作令牌，防止重复提交
    #   - base_fee: 基础邮费金额
    #   - vault_tax_rate: 金币附件税率
    #   - allow_vault: 是否允许附带金币附件
    #   - quote_success: 费用报价是否成功
    #   - quote_message: 报价提示信息（失败时展示原因）
    #   - item_fee: 物品附件手续费
    #   - total_fee: 邮件总费用
    #   - max_attachments: 最大物品附件槽数量
    #   - attachment_count: 当前已放入的附件数量
    #   - subject_max: 标题文字上限
    #   - body_max: 正文文字上限
    #   - password_panel: 二级密码面板信息（含 visible 子字段控制面板显隐）
    #   - currencies: 可用货币列表（Map，每项含 available 和 display_name）
    #   - fee_currency: 当前邮费使用的货币 ID
    #   - total_fee_currency: 总费用使用的货币 ID
    init: |-
      var.sessionId = packet['session_id']
      var.actionToken = packet['action_token']
      var.baseFee = packet['base_fee']
      var.vaultTaxRate = packet['vault_tax_rate']
      var.allowVault = packet['allow_vault']
      var.quoteSuccess = packet['quote_success']
      var.quoteMessage = packet['quote_message']
      var.itemFee = packet['item_fee']
      var.totalFee = packet['total_fee']
      var.maxAttachments = packet['max_attachments']
      var.attachmentCount = packet['attachment_count']
      var.subjectMax = packet['subject_max']
      var.bodyMax = packet['body_max']
      var.composeRecipient = none
      var.composeSubject = none
      var.composeBody = none
      var.composeVault = '0'
      var.passwordPanelVisible = packet['password_panel'] != none && packet['password_panel']['visible']
      var.passwordText = ''
      var.currencies = packet['currencies']
      var.feeCurrency = packet['fee_currency']
      var.totalFeeCurrency = packet['total_fee_currency']
      if(var.currencies != none){
        while(val.currency_list.childrenCount() > 1){
          val.currency_list.get(1).remove()
        }
        for(key in var.currencies.keys()){
          entry = var.currencies[key]
          if(entry != none && entry['available'] == true){
            btn = val.currency_list['货币按钮'].copy('货币按钮' + key)
            btn.currencyId = key
            btn.currencyName = entry['display_name'] != none && entry['display_name'] != '' ? entry['display_name'] : key
          }
        }
      }
    # packetHandler: update
    # 包字段:
    #   - base_fee: 基础邮费金额
    #   - vault_tax_rate: 金币附件税率
    #   - allow_vault: 是否允许附带金币附件
    #   - quote_success: 费用报价是否成功
    #   - quote_message: 报价提示信息（失败时展示原因）
    #   - item_fee: 物品附件手续费
    #   - total_fee: 邮件总费用
    #   - max_attachments: 最大物品附件槽数量
    #   - attachment_count: 当前已放入的附件数量
    #   - password_panel: 二级密码面板信息（含 visible 子字段控制面板显隐）
    #   - total_fee_currency: 总费用使用的货币 ID
    update: |-
      var.baseFee = packet['base_fee']
      var.vaultTaxRate = packet['vault_tax_rate']
      var.allowVault = packet['allow_vault']
      var.quoteSuccess = packet['quote_success']
      var.quoteMessage = packet['quote_message']
      var.itemFee = packet['item_fee']
      var.totalFee = packet['total_fee']
      var.maxAttachments = packet['max_attachments']
      var.attachmentCount = packet['attachment_count']
      var.passwordPanelVisible = packet['password_panel'] != none && packet['password_panel']['visible']
      var.totalFeeCurrency = packet['total_fee_currency']

# controls 为主要可视控件区块，可在此调整布局、材质与文本绑定。

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      根面板:
        type: Texture
        attribute:
          point: ~middle_center
          width: 1360
          height: 820
          normal: ~95,95,95,240
          shape: ~round_rect
          radius: 24
        effect:
          stroke:
            width: 3
            color: ~255,255,255,255
          shadow:
            xOffset: 2
            yOffset: 2
            blur: 5
            color: ~255,255,255,75
          ripple:
            duration: 1200
            color: ~255,255,255,110
            width: 0.05
        children:
          标题:
            type: Text
            attribute:
              x: 38
              y: 28
              fontSize: 49
              texts: "~&f写信中"
          提示:
            type: Text
            attribute:
              x: 38
              y: 78
              fontSize: 49
              lineSpace: 14
              texts: 
                - "'&7前 ' + var.maxAttachments.round() + ' 个槽位放真实物品附件。'"
                - "'&7基础邮费: &0' + var.baseFee + '   &7货币税率: &0' + var.vaultTaxRate"
          附件面板:
            type: Texture
            attribute:
              x: 38
              y: 160
              width: 390
              height: 168
              normal: ~120,120,120,255
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
            children:
              附件标题:
                type: Text
                attribute:
                  x: 18
                  y: 14
                  fontSize: 49
                  texts: "'&0物品附件 &7' + var.attachmentCount.round() + '/' + var.maxAttachments.round()"
              提示文字:
                type: Text
                attribute:
                  x: 18
                  y: 50
                  fontSize: 36
                  texts: 
                    - "~&7将寄出物品拖入下方槽位"
                    - "~&7未寄出物品关闭界面，物品会自动退回"
              槽位网格:
                type: HGrid
                attribute:
                  x: 18
                  y: 95
                  spaceBetweenX: 6
                  spaceBetweenY: 6
                  column: 6
                action:
                  create: |-
                    for(i in range(1,5)){
                      slot = self['槽位0'].copy('slot' + i)
                      slot.id = i
                    }
                children:
                  槽位0:
                    type: Slot
                    attribute:
                      width: 54
                      height: 54
                      normal: "~Frosted:0;95,95,95,255"
                      hover: "~Frosted:0;255,255,255,255"
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.72
                      slotType: ~Container
                      id: 0
                      visible: "self.id < var.maxAttachments"
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
          背包:
            type: Texture
            attribute:
              x: 38
              y: 360
              width: 390
              height: 390
              normal: ~120,120,120,255
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
            children:
              背包网格:
                type: HGrid
                attribute:
                  x: 18
                  y: 18
                  spaceBetweenX: 6
                  spaceBetweenY: 6
                  column: 6
                action:
                  create: |-
                    for(i in range(1,35)){
                      slot = self['槽位0'].copy('slot' + i)
                      slot.id = i + 27
                    }
                children:
                  槽位0:
                    type: Slot
                    attribute:
                      width: 54
                      height: 54
                      normal: "~Frosted:0;95,95,95,255"
                      hover: "~Frosted:0;255,255,255,255"
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.72
                      slotType: ~Backpack
                      id: 27
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
          收件人标签:
            type: Text
            attribute:
              x: 440
              y: 112
              fontSize: 49
              texts: "~&7收件人"
          收件人输入框:
            type: TextBox
            attribute:
              x: 440
              y: 154
              width: 300
              height: 38
              length: 32
              emptyText: ~输入玩家名
              fontSize: 49
              background: ~120,120,120,255
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
            action:
              textChange: |-
                var.composeRecipient = self.getContent()
          标题标签:
            type: Text
            attribute:
              x: 770
              y: 112
              fontSize: 49
              texts: "~&7标题"
          标题输入框:
            type: TextBox
            attribute:
              x: 770
              y: 154
              width: 552
              height: 38
              length: 48
              emptyText: ~输入邮件标题
              fontSize: 49
              background: ~120,120,120,255
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
            action:
              textChange: |-
                var.composeSubject = self.getContent()
          正文标签:
            type: Text
            attribute:
              x: 440
              y: 214
              fontSize: 49
              texts: "~&7正文"
          正文输入框:
            type: TextBox
            attribute:
              x: 440
              y: 256
              width: 882
              height: 316
              length: 400
              allowNewLine: true
              emptyText: ~支持多行正文
              fontSize: 49
              background: ~120,120,120,255
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
            action:
              textChange: |-
                var.composeBody = self.getContent()
          字数统计:
            type: Text
            attribute:
              x: 440
              y: 590
              fontSize: 49
              texts: "'&7标题文字上限: &0' + var.subjectMax.round() + '   &7正文文字上限: &0' + var.bodyMax.round()"
          邮费货币标签:
            type: Text
            attribute:
              x: 440
              y: 632
              fontSize: 49
              texts: "~&7邮费货币"
          货币选择栏:
            val: currency_list
            type: HStack
            attribute:
              x: 560
              y: 632
              spaceBetween: 8
            children:
              货币按钮:
                type: Canvas
                attribute:
                  width: 120
                  height: 32
                  currencyId: ''
                  currencyName: ''
                  visible: "self.currencyId != '' && self.currencyId != var.totalFeeCurrency"
                action:
                  clickLeft: |-
                    Packet.send('AXS_MAIL', 'change-fee-currency', self.currencyId)
                children:
                  货币背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~150,150,150,255
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  货币文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 120
                      texts: "self.parent.currencyName != none ? self.parent.currencyName : ''"
                      fontSize: 40
                      through: true
          当前货币显示:
            type: Text
            attribute:
              x: 560
              y: 632
              fontSize: 49
              texts: "(var.totalFeeCurrency != none && var.totalFeeCurrency != '' ? var.totalFeeCurrency : '金币')"
              visible: "val.currency_list.childrenCount() <= 1"
          金币输入框:
            type: TextBox
            attribute:
              x: 440
              y: 672
              width: 400
              height: 30
              length: 24
              emptyText: ~点击填写本邮件所寄送的金币数量
              fontSize: 49
              background: ~120,120,120,255
              visible: var.allowVault
            action:
              textChange: |-
                var.composeVault = self.getContent()
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
          费用汇总:
            type: Text
            attribute:
              x: 440
              y: 716
              fontSize: 49
              width: 880
              texts: "'&7邮件总费用: &0' + var.totalFee + ' ' + (var.totalFeeCurrency != none && var.totalFeeCurrency != '' ? var.totalFeeCurrency : '金币') + '   &7物品手续费: &0' + var.itemFee + ' ' + (var.totalFeeCurrency != none && var.totalFeeCurrency != '' ? var.totalFeeCurrency : '金币') + (var.quoteMessage == none ? none : '   &7提示: &0' + var.quoteMessage)"
          二级密码面板:
            type: Texture
            attribute:
              x: 850
              y: 590
              width: 472
              height: 104
              normal: ~110,110,110,255
              shape: ~round_rect
              radius: 14
              visible: var.passwordPanelVisible
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
            children:
              二级密码提示:
                type: Text
                attribute:
                  x: 16
                  y: 10
                  fontSize: 36
                  texts: "~&f请输入二级密码解锁后重试"
              二级密码输入框:
                type: TextBox
                attribute:
                  x: 16
                  y: 50
                  width: 300
                  height: 32
                  length: 64
                  emptyText: ~输入二级密码
                  fontSize: 40
                  background: ~130,130,130,255
                effect:
                  stroke:
                    width: 2
                    color: ~0,0,0,255
                action:
                  textChange: |-
                    var.passwordText = self.getContent()
              二级密码确认按钮:
                type: Canvas
                attribute:
                  x: 328
                  y: 50
                  width: 128
                  height: 32
                action:
                  clickLeft: |-
                    Packet.send('AXS_MAIL', 'password-unlock', var.passwordText)
                    var.passwordText = ''
                children:
                  二级密码确认背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~150,150,150,255
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  二级密码确认文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 128
                      texts: "~&0解锁"
                      fontSize: 40
                      through: true
          底部按钮区:
            type: HStack
            attribute:
              x: 440
              y: 748
              spaceBetween: 20
            children:
              发送按钮:
                type: Canvas
                attribute:
                  width: 180
                  height: 48
                action:
                  clickLeft: |-
                     Packet.send('AXS_MAIL', 'compose-send', var.sessionId, var.composeRecipient, var.composeSubject, var.composeBody, var.composeVault, var.actionToken)
                children:
                  发送背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~150,150,150,255
                      shape: ~round_rect
                      radius: 16
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  发送文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 180
                      texts: "~&0发送邮件"
                      fontSize: 49
                      through: true
              返回收件箱按钮:
                type: Canvas
                attribute:
                  width: 180
                  height: 48
                action:
                  clickLeft: |-
                    Chat.say('/mail')
                children:
                  返回收件箱背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~150,150,150,255
                      shape: ~round_rect
                      radius: 16
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,255
                  返回收件箱文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 180
                      texts: "~&0返回邮箱"
                      fontSize: 49
                      through: true
