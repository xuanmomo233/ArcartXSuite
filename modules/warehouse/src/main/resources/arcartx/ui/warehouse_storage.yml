                          radius: 14
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
                      展示字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 104
                          texts: "~&f展示"
                          fontSize: 32
                          through: true
                  银行:
                    type: Canvas
                    attribute:
