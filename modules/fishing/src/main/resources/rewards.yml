# AXS 钓鱼赛季等级奖励配置
# 定义每个等级达到后可领取的奖励
#
# 配置结构：
#   "<奖励唯一标识>":
#     level: <达到该等级可领取>
#     type: item / command / currency / mail
#     icon:
#       material: <图标材质>
#       name: "<显示名称>"
#       amount: <图标显示数量>
#     # type: item 时
#     item:
#       source: minecraft / mythic / neige / overture / mmoitems
#       id: <物品ID>
#       amount: <数量>
#       nbt: ""
#     # type: currency 时
#     currency:
#       currency-id: <货币ID>
#       amount: <数量>
#     # type: command 时
#     commands:
#       - "<命令1>"
#       - "<命令2>"
#
# 奖励类型说明：
#   item:     通过 ItemSourceRegistry 生成物品并直接放入玩家背包
#   command:  以控制台身份执行命令列表，支持 {player} 占位符
#   currency: 向玩家发放指定货币（需 Vault/PlayerPoints 等经济插件）
#   mail:     通过 Mail 模块发送邮件预设（mail.presets 列表）

