# floors.yml — 元气试炼之地 · 三层链（region 模式）
# 房间建筑全部由 scripts.yml world-init 搭建，无需 schematic。
# 推进：房清完 → 踩出口凹室金块地标（portal）→ 下一房；层末清完 → 下层入口。

defaults:
  lock-material: BARRIER        # 锁门填充材质（锁=填塞，清完还原）
  border-pullback: true         # 战斗房锁门期间离开区域 → 拉回房中心
  room-spacing: 200             # pool 模式用（本示例全 region）
  paste-y: 64
  advance-timeout: 90           # portal 兜底秒数（超时不踩出口自动推进，0=关）

floors:
  # ── 第 1 层 · 苔痕前哨 ─────────────────────────────────────
  - id: f1
    name: "&a第 1 层 · 苔痕前哨"
    source: region
    spawn: "2,61,11,270,0"        # 本层入口 = 起始房站位
    rooms: [f1_start, f1_combat_a, f1_altar, f1_boss]
    advance: portal
    advance-timeout: 90
    on-enter:
      - "title @all 10 40 10 &a第 1 层|&7苔痕前哨"
      - "sound @all BLOCK_PORTAL_TRAVEL 0.4 1.2"
    on-clear:
      - "title @all 10 40 10 &a第 1 层肃清|&e领取你的天赋祝福"
      - "buff_offer f1_blessing"           # 层间三选一天赋（元气核心节奏）
      - "wait 6"
      - "message @all &7前方通往 &6第 2 层 · 熔岩矿道"

  # ── 第 2 层 · 熔岩矿道 ─────────────────────────────────────
  - id: f2
    name: "&6第 2 层 · 熔岩矿道"
    source: region
    spawn: "202,61,11,270,0"
    rooms: [f2_combat_a, f2_shop, f2_puzzle, f2_boss]
    advance: portal
    advance-timeout: 90
    on-enter:
      - "title @all 10 40 10 &6第 2 层|&7熔岩矿道"
      - "sound @all BLOCK_PORTAL_TRAVEL 0.4 1.2"
    on-clear:
      - "title @all 10 40 10 &6第 2 层肃清|&e领取你的天赋祝福"
      - "buff_offer f2_blessing"
      - "wait 6"
      - "message @all &7深渊的气息扑面而来——&4第 3 层 · 深渊王座"

  # ── 第 3 层 · 深渊王座 ─────────────────────────────────────
  - id: f3
    name: "&4第 3 层 · 深渊王座"
    source: region
    spawn: "402,61,11,270,0"
    rooms: [f3_corridor, f3_treasure, f3_final]
    advance: portal
    advance-timeout: 90
    on-enter:
      - "title @all 10 40 10 &4第 3 层|&7深渊王座"
      - "sound @all ENTITY_WITHER_SPAWN 0.5 0.8"
      - "message @all &7王座就在前方。整备好补给，一击制胜。"
    # 层末 f3_final 清完 → 自动通关（complete 生命周期段）
