# 探索类称号定义文件
# 作用: 定义所有属于 exploration 分组的称号，每个根键为称号 ID。
# 依赖: group 必须已在主配置 ArcartXTitle.yml 的 groups: 中定义。
# 每个根键为称号 ID；group 必须已在主配置 groups: 中定义。

starwalker:
  # 是否启用该称号。
  enabled: true
  # 所属分组 ID，必须已在 ArcartXTitle.yml 的 groups: 中定义。
  group: "exploration"
  # 品质 ID，必须已在 ArcartXTitle.yml 的 qualities: 中定义。
  quality: "legendary"
  # 称号类型: text 纯文本 / icon 贴图称号（使用 ArcartX 客户端文字贴图渲染）。
  kind: "icon"
  # 称号显示名称。
  display-name: "&6星轨行者"
  # 装备后附加在聊天消息前的文本。§k!%<id><icon> 为 ArcartX 自定义文字贴图格式。
  chat-prefix: "§k!%000001<icon>"
  # 装备后附加在聊天消息后的文本。
  chat-suffix: ""
  # 装备后附加在玩家列表名字前的文本。
  tab-prefix: "§k!%000001<icon>"
  # 装备后附加在玩家列表名字后的文本。
  tab-suffix: ""
  # 称号描述，常用于菜单提示。
  description: "适用于 ArcartX 文本图标称号的示例条目。"
  # 称号来源说明。
  source: "限时探索活动"
  # 展示属性：仅当该称号装备时生效的属性加成。
  # key 为属性名，value 为数值；最终由 attribute-bridges 映射到对应属性插件。
  display-attributes:
    luck: 3
  # 展示属性在菜单中的显示行列表。
  display-attribute-lines:
    - "幸运值:3"
  # 收藏属性：只要拥有该称号（无需装备）即可生效的属性加成。
  collection-attributes:
    prestige: 1
  # 同分组 / 同品质内的排序权重，越小越靠前。
  sort-order: 20
  # 头顶显示：texture 模式使用 ArcartX 客户端文字贴图渲染。
  # overhead-texture 使用 ArcartX 自定义文字贴图格式：§k!%<id><type>
  overhead-mode: texture
  overhead-texture: "§k!%000001<icon>"  # 头顶贴图资源字符串
  overhead-width: 80  # 头顶贴图渲染宽度
  overhead-height: 20  # 头顶贴图渲染高度
  overhead-offset-y: 2.3  # 头顶贴图垂直偏移量
