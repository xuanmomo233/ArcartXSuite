              y: 20
              texts: "'&0概率详情 · ' + (var.detailPoolName != none ? var.detailPoolName : '')"
              fontSize: 52
          表头:
            type: Text
            attribute:
              point: ~top_left
              x: 24
              y: 72
              texts:
                - ~&8物品                                     稀有度                权重
              fontSize: 30
          详情滑块:
            type: Texture
            attribute:
              point: ~top_right
              x: -16
              y: 110
              width: 10
              height: 60
              normal: ~226,196,132,255
              maxDragY: 500 - 60
              dragY: 0
              shape: ~round_rect
              radius: 4
          详情视口:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 110
              width: 820
              height: 500
              moveY: self.parent['详情滑块'].getDragYRatio()
              through: false
            action:
              wheel: |-
                if(self.moveY >= 0){
                  if(self.wheelValue > 0){
                    self.parent['详情滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                  }
                }
                if(self.moveY <= 1){
                  if(self.wheelValue < 0){
                    self.parent['详情滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                  }
                }
            children:
              详情列表:
                type: VGrid
                attribute:
                  column: 1
                  spaceBetweenY: 12
                action:
                  create: |-
                    for(i in range(0, 45)){
                      key = i.round()
                      e = self['详情行'].copy('详情行' + key)
                      e.entryKey = key
                      e['名称'].entryKey = key
                      e['稀有度'].entryKey = key
                      e['权重'].entryKey = key
                    }
                children:
                  详情行:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      width: 800
                      height: 58
                      visible: "var.detailRows != none && var.detailRows[self.entryKey] != none"
                    children:
                      行背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~250,250,254,245
                          shape: ~round_rect
                          radius: 6
                      名称:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 16
                          texts: "var.detailRows != none && var.detailRows[self.entryKey] != none ? '&0' + (var.detailRows[self.entryKey]['name'] != none ? var.detailRows[self.entryKey]['name'] : '') : ''"
                          fontSize: 32
                      稀有度:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 460
                          texts: "var.detailRows != none && var.detailRows[self.entryKey] != none ? '&8' + (var.detailRows[self.entryKey]['rarity'] != none ? var.detailRows[self.entryKey]['rarity'] : '') : ''"
                          fontSize: 32
                      权重:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 680
                          texts: "var.detailRows != none && var.detailRows[self.entryKey] != none ? '&8' + (var.detailRows[self.entryKey]['weight'] != none ? var.detailRows[self.entryKey]['weight'] : '') : ''"
                          fontSize: 32
          详情空态:
            type: Text
            attribute:
              point: ~middle_center
              texts:
                - ~&8暂无可展示的奖池条目
              fontSize: 34
              visible: "var.detailCount != none && var.detailCount == 0"
          详情关闭:
            type: Texture
            attribute:
              point: ~bottom_center
              y: 20
              width: 200
              height: 56
              normal: ~236,232,248,245
              hover: ~245,240,252,250
              shape: ~round_rect
              radius: 6
              texts: "~&0关闭"
              center: true
              fontSize: 34
            action:
              click: "val.详情面板.visible = false"