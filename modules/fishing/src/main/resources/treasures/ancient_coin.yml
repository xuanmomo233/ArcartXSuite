# 宝藏定义：古币
# 古币是一种稀有宝藏，钓到后掉落金锭，出现概率较低
# 宝藏文件位于 treasures/ 目录，每个文件定义一种宝藏

id: "ancient_coin"             # 宝藏唯一标识符
display-name: "古币"            # 显示名称
item:                          # 宝藏对应的物品定义
  source: "minecraft"          # 物品来源（minecraft=原版物品）
  item-id: "gold_ingot"        # 原版物品ID（金锭）
  amount: 1                    # 物品数量
chance: 0.1                    # 该宝藏在宝藏池中的出现概率（10%）
