# AXS Abyss 战斗统计：独立列、动态行、空状态和滚动，不使用空格对齐。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonName = packet['dungeonName']
      var.rows = packet['statRows']
      var.count = packet['statCount']
      var.hasChest = packet['hasChest']
      var.hasRewardGame = packet['hasRewardGame'] == true
      var.settling = packet['settling'] == true
      var.canLeave = packet['canLeave'] == true
      var.settlementHint = packet['settlementHint'] != none ? packet['settlementHint'] : ''
      var.outcomeLabel = packet['outcomeLabel'] != none ? packet['outcomeLabel'] : '副本结算'
      var.summaryText = packet['summaryText'] != none ? packet['summaryText'] : ''
      self.actions['rebuild']()
    settlement_update: |-
      if(packet['settlementHint'] != none){ var.settlementHint = packet['settlementHint'] }
      if(packet['canLeave'] != none){ var.canLeave = packet['canLeave'] }
      if(packet['hasChest'] != none){ var.hasChest = packet['hasChest'] }
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.viewNonce = ''
      var.dungeonName = ''
      var.rows = {}
      var.count = 0
      var.hasChest = false
      var.hasRewardGame = false
      var.settling = false
      var.canLeave = false
      var.settlementHint = ''
      var.outcomeLabel = '副本结算'
      var.summaryText = ''
      var.builtCount = -1
      var.rowRefs = {}
      var.revision = 0
    open: |-
      Packet.send('abyss', 'view_ready', 'stats')
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'stats', var.actionToken, var.viewNonce)
      }
    rebuild: |-
      if(var.leaderRows == none || var.leaderRows.size() != (var.count)){
        网格数据 = []
        if((var.count) > 0){
          for(网格序号 in range(0, (var.count) - 1)){
            网格数据.add(网格序号.round())
          }
        }
        var.leaderRows = 网格数据
      }
