# AXS Warehouse Manage - 重构版
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航 + 内容区
# 布局: 左导航(仓库/银行/管理) + 内容区(仓库列表区 + 设置区 + 成员区)
# 配色: 暖橙铜(木箱感) 主色200,130,70 底36,30,24,235 抬升48,40,32,245 描边90,72,52,220
# 逻辑: packetHandler/action/val引用/entryKey/copy 与原版一致，仅重构布局结构与配色

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    # 包字段:
    #   - packetId: 包标识符（'AXS_WAREHOUSE'）
    #   - action_token: 操作令牌（防重放）
    #   - ownerType: 仓库所有者类型（personal / shared）
    #   - ownerId: 所有者 ID
    #   - warehouseId: 仓库 ID
    #   - warehouseName: 仓库名称
    #   - personalWarehouses: 个人仓库列表
    #   - personalWarehouseTexts: 个人仓库显示文本
    #   - manageWarehouses: 可管理的仓库列表
    #   - manageWarehouseTexts: 可管理仓库显示文本
    #   - manageWarehouseTypes: 可管理仓库类型
    #   - manageWarehouseTargets: 可管理仓库目标
    #   - manageWarehouseSelected: 当前选中的管理仓库索引
    #   - sharedWarehouses: 共享仓库列表
    #   - sharedWarehouseManageTexts: 共享仓库管理显示文本
    #   - sharedCreateCostText: 创建共享仓库费用文本
    #   - sharedRoleOwnerName: 共享仓库所有者角色名
    #   - sharedRoleMemberName: 共享仓库成员角色名
    #   - sharedRoleViewerName: 共享仓库观众角色名
    #   - sharedMembers: 共享仓库成员列表
    #   - sharedMemberTexts: 成员显示文本
    #   - sharedMemberNames: 成员名称列表
    #   - sharedMemberRoles: 成员角色列表
    #   - unlocked: 二级密码是否已解锁
    #   - hasPassword: 是否已设置二级密码
    #   - readOnly: 是否只读模式
    #   - lockOwner: 编辑锁持有者
    #   - capacityText: 容量显示文本
    #   - level: 仓库等级
    #   - canUpgrade: 是否可升级
    #   - nextUpgradeText: 下一级升级信息文本
    #   - autoPickup: 是否启用自动拾取
    #   - autoPickupMythic: 是否自动拾取 MythicMobs 掉落
    #   - autoPickupNotify: 是否通知自动拾取
    #   - showcaseEnabled: 是否启用展示柜
    #   - maxManageCount: 可管理仓库最大数量（用于动态创建控件）
    #   - maxMemberCount: 成员最大数量
    update: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.manageWarehouses = packet['manageWarehouses']
      var.manageWarehouseTexts = packet['manageWarehouseTexts']
      var.manageWarehouseTypes = packet['manageWarehouseTypes']
      var.manageWarehouseTargets = packet['manageWarehouseTargets']
      var.manageWarehouseSelected = packet['manageWarehouseSelected']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseManageTexts = packet['sharedWarehouseManageTexts']
      var.sharedCreateCostText = packet['sharedCreateCostText']
      var.sharedRoleOwnerName = packet['sharedRoleOwnerName']
      var.sharedRoleMemberName = packet['sharedRoleMemberName']
      var.sharedRoleViewerName = packet['sharedRoleViewerName']
      var.sharedMembers = packet['sharedMembers']
      var.sharedMemberTexts = packet['sharedMemberTexts']
      var.sharedMemberNames = packet['sharedMemberNames']
      var.sharedMemberRoles = packet['sharedMemberRoles']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.lockOwner = packet['lockOwner']
      var.capacityText = packet['capacityText']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.autoPickup = packet['autoPickup']
      var.autoPickupMythic = packet['autoPickupMythic']
      var.autoPickupNotify = packet['autoPickupNotify']
      var.showcaseEnabled = packet['showcaseEnabled']
      var.maxManageCount = packet['maxManageCount']
      var.maxMemberCount = packet['maxMemberCount']
      共享数 = var.maxManageCount.round()
      现有共享数 = val.共享列表.childrenCount() - 1
      if(现有共享数 != 共享数 - 1){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.共享列表.childrenCount() > 1){
          val.共享列表.get(1).remove()
        }
        if(共享数 > 1){
          for(序号 in range(1, 共享数 - 1)){
            项 = val.共享列表['项'].copy('共享项_' + var.刷新轮次.round() + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      成员数 = var.maxMemberCount.round()
      现有成员数 = val.成员列表.childrenCount() - 1
      if(现有成员数 != 成员数 - 1){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.成员列表.childrenCount() > 1){
          val.成员列表.get(1).remove()
        }
        if(成员数 > 1){
          for(序号 in range(1, 成员数 - 1)){
            项 = val.成员列表['项'].copy('成员项_' + var.刷新轮次.round() + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      // update 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false
      var.pickupBusy = false
      var.mythicBusy = false
      var.notifyBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
      if(var.pickupBusy){
        var.pickupBusySeconds = var.pickupBusySeconds + 1
        if(var.pickupBusySeconds >= 3){
          var.pickupBusy = false
          var.pickupBusySeconds = 0
        }
      }else{
        var.pickupBusySeconds = 0
      }
      if(var.mythicBusy){
        var.mythicBusySeconds = var.mythicBusySeconds + 1
        if(var.mythicBusySeconds >= 3){
          var.mythicBusy = false
          var.mythicBusySeconds = 0
        }
      }else{
        var.mythicBusySeconds = 0
      }
      if(var.notifyBusy){
        var.notifyBusySeconds = var.notifyBusySeconds + 1
        if(var.notifyBusySeconds >= 3){
          var.notifyBusy = false
          var.notifyBusySeconds = 0
        }
      }else{
        var.notifyBusySeconds = 0
      }
    load: |-
      var.packetId = 'AXS_WAREHOUSE'
      var.ownerType = 'personal'
      var.ownerId = none
      var.warehouseId = none
      var.warehouseName = 'AXS 仓库'
      var.personalWarehouses = {}
      var.personalWarehouseTexts = {}
      var.manageWarehouses = {}
      var.manageWarehouseTexts = {}
      var.manageWarehouseTypes = {}
      var.manageWarehouseTargets = {}
      var.manageWarehouseSelected = {}
      var.sharedWarehouses = {}
      var.sharedWarehouseManageTexts = {}
      var.sharedCreateCostText = '创建共享仓库免费'
      var.sharedRoleOwnerName = '所有者'
      var.sharedRoleMemberName = '成员'
      var.sharedRoleViewerName = '观众'
      var.sharedMembers = {}
      var.sharedMemberTexts = {}
      var.sharedMemberNames = {}
      var.sharedMemberRoles = {}
      var.unlocked = false
      var.hasPassword = false
      var.readOnly = false
      var.lockOwner = none
      var.capacityText = '0/0'
      var.level = 1
      var.canUpgrade = false
      var.nextUpgradeText = none
      var.sharedName = none
      var.renameName = none
      var.memberName = none
      var.memberRole = 'member'
      var.passwordText = none
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.pickupBusy = false
      var.pickupBusySeconds = 0
      var.mythicBusy = false
      var.mythicBusySeconds = 0
      var.notifyBusy = false
      var.notifyBusySeconds = 0
      var.deleteConfirm = false
      var.deletePassword = none
      var.sharedListScrollRatio = 0
      var.showcaseEnabled = true
      var.autoPickup = true
      var.autoPickupMythic = true
      var.autoPickupNotify = true
      var.maxManageCount = 0
      var.maxMemberCount = 0
      var.刷新轮次 = 0.round()
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.listW = 360
      var.memberW = 420
      var.settingW = var.contentW - var.listW - var.memberW
    open: |-
      Packet.send(var.packetId, 'refresh')
    # 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.listW = 360
      var.memberW = 420
      var.settingW = var.contentW - var.listW - var.memberW

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;30,24,18,110
  # 自适配布局：宽高 = 设计分辨率(1920x1080)，顶部锚点使顶栏紧贴屏幕顶部
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏（沿窗口整宽铺满）───────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~90,72,52,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~200,130,70,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f仓库管理"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 268
              width: 1
              height: 30
              normal: ~90,72,52,220
          当前仓库:
            type: Text
            attribute:
              point: ~middle_left
              x: 288
              width: 900
              texts: "'&f' + var.warehouseName + (var.ownerType == 'shared' ? '  &b共享仓库' : '  &a个人仓库') + (var.readOnly ? '  &c只读' : '') + (var.unlocked ? '  &a已解锁' : '  &e未解锁')"
              fontSize: 26
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~48,40,32,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 40
                  texts: "~&f✕"
                  fontSize: 32
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~90,72,52,220
          导航仓库:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'storage')
            children:
              仓库底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~48,40,32,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
              仓库文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f仓库"
                  fontSize: 36
                  through: true
          导航银行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'bank')
            children:
              银行底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~48,40,32,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
              银行文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f银行"
                  fontSize: 36
                  through: true
          # 当前页：管理
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~200,130,70,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~200,130,70,230
              管理高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~200,130,70,255
                  shape: ~round_rect
                  radius: 2
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0管理"
                  fontSize: 36
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 232
              width: 264
              height: 2
              normal: ~90,72,52,220
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: "~&fESC 关闭界面"
              fontSize: 28

      # ── 内容区（仓库列表区 + 设置区 + 成员区）───────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~90,72,52,220

          # ── 仓库列表区（共享仓库创建 + 列表）──────────────────
          仓库列表区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 20
              y: 20
              width: "var.listW - 40"
              height: "var.viewH - 184"
            children:
              列表标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 0
                  y: 0
                  width: 320
                  texts: "~&f仓库列表"
                  fontSize: 34
              新建名:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 0
                  y: 44
                  width: 200
                  height: 44
                children:
                  新建名底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~40,34,28,225
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '230,160,100,255' : '90,72,52,220'"
                  输入框:
                    type: TextBox
                    attribute:
                      x: 10
                      y: 10
                      width: 180
                      height: 34
                      length: 24
                      emptyText: ~共享名
                      fontSize: 30
                    action:
                      textChange: |-
                        var.sharedName = self.getContent()
              创建:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 210
                  y: 44
                  width: 110
                  height: 44
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send(var.packetId, 'shared_create', var.sharedName, var.actionToken)
                children:
                  创建底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~200,130,70,235
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '230,160,100,255' : '200,130,70,255'"
                  创建字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 110
                      texts: "~&8新建"
                      fontSize: 28
                      through: true
              创建费用:
                type: Text
                attribute:
                  point: ~top_left
                  x: 0
                  y: 96
                  width: 320
                  texts: "'&e' + var.sharedCreateCostText"
                  fontSize: 22
              共享滑块:
                type: Texture
                val: 共享滑块
                attribute:
                  point: ~top_right
                  x: 0
                  y: 128
                  width: 10
                  height: 50
                  normal: ~200,130,70,255
                  maxDragY: "var.viewH - 362"
                  shape: ~round_rect
                  radius: 5
              共享滚动:
                type: Scroll
                val: 共享滚动
                attribute:
                  point: ~top_left
                  x: 0
                  y: 128
                  width: 310
                  height: "var.viewH - 312"
                  moveY: "self.parent['共享滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['共享滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['共享滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  共享列表:
                    val: 共享列表
                    type: VStack
                    attribute:
                      width: 310
                      spaceBetween: 10
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.manageWarehouses[self.entryKey]
                          visible: self.entry != none
                          width: 310
                          height: 50
                        action:
                          clickLeft: |-
                            var.deleteConfirm = false
                            var.renameName = none
                            if(var.manageWarehouseTypes[self.entryKey] == 'shared'){
                              Packet.send(var.packetId, 'shared', var.manageWarehouseTargets[self.entryKey])
                            }else{
                              Packet.send(var.packetId, 'warehouse', var.manageWarehouseTargets[self.entryKey])
                            }
                        children:
                          项背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "var.manageWarehouseSelected[self.parent.entryKey] ? '120,80,50,225' : '48,40,32,245'"
                              shape: ~round_rect
                              radius: 12
                            effect:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '230,160,100,255' : (var.manageWarehouseSelected[self.parent.entryKey] ? '200,130,70,235' : '90,72,52,220')"
                          项文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 310
                              texts: "var.manageWarehouseTexts[self.parent.entryKey]"
                              fontSize: 28
                              through: true

          # ── 设置区（自动拾取 + 名称展示 + 扩充 + 密码 + 删除）────
          设置区:
            type: Canvas
            attribute:
              point: ~top_left
              x: "var.listW + 4"
              y: 20
              width: "var.settingW - 24"
              height: "var.viewH - 184"
            children:
              设置标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 0
                  y: 0
                  width: 600
                  texts: "~&f仓库设置"
                  fontSize: 34
              拾取标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 0
                  y: 44
                  width: 600
                  texts: "~&f自动拾取"
                  fontSize: 28
