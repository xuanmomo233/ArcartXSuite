# ArcartXSuite Map — 路径点/标记点分享卡片模板
# 玩家在大地图详情面板点击"分享"后，全服玩家聊天栏显示此卡片。
# 点击卡片 → Chat.say('/map claim <code>') 领取点位副本（命令路径，与纯文本兜底一致）。
# 数据字段（服务端 payload）: type(waypoint|pin) / title / sender / world / coords / code / expire
# 卡片宽度与高度由 UI 侧根据 Text 控件实际渲染尺寸自适应
root_control:
  type: card
  attribute:
    width: "Math.max(560, Math.max(val.title_label.width, val.info_label.width) + 200)"
    height: "Math.max(150, val.info_label.y + val.info_label.height + 18)"
  children:
    background:
      type: Texture
      attribute:
        width: "self.parent.width"
        height: "self.parent.height"
        normal: ~30,45,30,210
        shape: ~round_rect
        radius: 12
      effect:
        stroke:
          width: 3
          color: ~255,255,255,170
      action:
        click: |-
          Chat.say('/map claim ' + self.parent.data['code'])
    icon_slot:
      type: Slot
      attribute:
        x: 24
        y: "self.parent.height/2 - 50"
        width: 100
        height: 100
        normal: ~18,26,22,230
        hover: ~18,26,22,230
        shape: ~round_rect
        radius: 14
        slotType: ~Icon
        itemScale: 0.9
        seticon: "self.setItemIcon('{\"id\":\"minecraft:filled_map\",\"Count\":1b}')"
        through: true
      effect:
        stroke:
          width: 2
          color: ~255,255,255,140
    title_label:
      type: Text
      val: title_label
      attribute:
        fontSize: 48
        x: 150
        y: 18
        texts: "'§e§l' + (self.parent.data['type'] == 'pin' ? '标记点' : '路径点') + '分享 §7来自 §f' + self.parent.data['sender']"
        through: true
    info_label:
      type: Text
      val: info_label
      attribute:
        fontSize: 36
        x: 150
        y: 74
        through: true
        texts:
          - "'§7名称: §f' + self.parent.data['title']"
          - "'§7位置: §f' + self.parent.data['world'] + ' §7(§f' + self.parent.data['coords'] + '§7)'"
          - "'§8点击卡片领取 · §7' + self.parent.data['expire'] + ' §8分钟内有效'"
