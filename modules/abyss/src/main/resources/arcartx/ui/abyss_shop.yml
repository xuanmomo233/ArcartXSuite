# AXS 资源说明
# 用途: Abyss 副本商店 —— shops.yml 商品列表 + 金币购买
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
# 包字段: init → packetId/action_token/shopId/shopTitle/coins/goodsCount/goods{key->{id,name,price,iconJson,desc0,desc1}}
#         update → coins（购买后余额回推）
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.shopId = packet['shopId']
      var.shopTitle = packet['shopTitle']
      var.coins = packet['coins']
      var.coinsText = packet['coinsText']
      var.goodsCount = packet['goodsCount']
      var.goodsRows = packet['goods']
      var.iconJsons = {}
      for(key in var.goodsRows.keys()){ var.iconJsons[key] = var.goodsRows[key]['iconJson'] }
      var.dirty = true
    update: |-
      var.coins = packet['coins']
      var.coinsText = packet['coinsText']
    # Generation-bound close notification prevents stale close events cancelling a newly opened screen.

  action:
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'shop', var.actionToken, var.viewNonce)
      }
    load: |-
      var.iconJsons = {}
      var.iconsPending = false
      var.已建_goods_rows = -1
      var.viewNonce = ''
      var.packetId = 'abyss'
      var.actionToken = ''
      var.shopId = ''
      var.shopTitle = '商店'
      var.coins = 0
      var.coinsText = '0'
      var.goodsCount = 0
      var.goodsRows = {}
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.accent = '226,196,132,255'
      var.accentDim = '150,128,90,180'
      var.rowBg = '30,24,18,235'
      var.rowBgHover = '48,38,26,245'
      var.poor = '90,82,70,200'
      var.dirty = false
      var.商品引用 = {}
      var.商品轮次 = 0
    open: |-
      Packet.send('abyss', 'view_ready', 'shop')
      Sound.self('minecraft:entity.villager.trade', 0.9, 10)
    tick: |-
      if(var.iconsPending && var.goods_rowsGridRows != none && val.goods_rows != none && val.goods_rows.childrenCount() == var.goods_rowsGridRows.size()){
        var.iconsPending = false
        if(var.goods_rowsGridRows.size() > 0){
          for(i in range(0, var.goods_rowsGridRows.size() - 1)){
            row = val.goods_rows.get(i.round())
            if(row != none && row['商品图标'] != none){
              row['商品图标'].seticon()
            }
          }
        }
      }
      if(var.dirty){
        var.dirty = false
        // 重建商品行：模板在索引0，按轮次命名防冲突
        目标数 = var.goodsCount.round()
        if(var.goods_rowsGridRows == none || var.goods_rowsGridRows.size() != (var.goodsCount)){
          网格数据 = []
          if((var.goodsCount) > 0){
            for(网格序号 in range(0, (var.goodsCount) - 1)){
              网格数据.add(网格序号.round())
            }
          }
          var.goods_rowsGridRows = 网格数据
        }
        var.iconsPending = true
      }
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:26;8,10,11,223
  自适应全局布局:
    type: Adaptive
    attribute:
      visible: "var.actionToken != ''"
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      商店面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1120
          height: 860
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~22,25,25,253
              through: true
            effect:
              stroke:
                width: 3
                color: ~108,82,56,255
          顶部锈带:
            type: Texture
            attribute:
              width: 1120
              height: 8
              normal: ~145,62,43,255
              through: true
          眉题:
            type: Text
            attribute:
              x: 56
              y: 34
              texts: ~&6ABYSS   /   FIELD QUARTERMASTER   05
              fontSize: 32
              through: true
          标题:
            type: Text
            attribute:
              x: 54
              y: 86
              texts: "'&f' + var.shopTitle"
              fontSize: 56
              limit: 16
              through: true
          金币底:
            type: Texture
            attribute:
              x: 738
              y: 88
              width: 300
              height: 64
              normal: ~54,48,34,255
              through: true
          金币数:
            type: Text
            val: 金币数
            attribute:
              x: 765
              y: 102
              texts: "'&6' + var.coinsText + ' 金币'"
              fontSize: 42
              through: true
          栏名:
            type: Text
            attribute:
              x: 56
              y: 182
              texts: ~&6补给清单    /    点击物资行申请购买
              fontSize: 32
              through: true
          栏目提示:
            type: Text
            attribute:
              point: ~top_right
              x: -78
              y: 182
              texts: ~&7可用资金不足的物资会显示为灰色
              fontSize: 32
              through: true
          商品列表底:
            type: Texture
            attribute:
              x: 48
              y: 228
              width: 1024
              height: 514
              normal: ~13,16,17,255
              through: true
            effect:
              stroke:
                width: 2
                color: ~88,72,55,255
          列表滑轨:
            type: Texture
            attribute:
              x: 1044
              y: 246
              width: 10
              height: 474
              normal: ~45,43,38,255
              through: true
          列表滑块:
            type: Texture
            val: goods_slider
            attribute:
              x: 1044
              y: 246
              width: 10
              height: 100
              maxDragY: 374
              normal: ~208,155,82,255
          商品滚动区:
            type: Scroll
            attribute:
              x: 66
              y: 246
              width: 954
              height: 474
              moveY: val.goods_slider.getDragYRatio()
            action:
              wheel: |-
                ratio = self.moveY - self.wheelValue * 0.12
                if(ratio < 0){ ratio = 0 }
                if(ratio > 1){ ratio = 1 }
                val.goods_slider.setDragYRatio(ratio)
            children:
              商品列表:
                type: RepeatGrid
                val: goods_rows
                attribute:
                  items: "var.goods_rowsGridRows"
                  flow: ~row
                  column: 1
                  spaceBetweenY: 10
                  maxSize: 2147483647
                  width: 938
                children:
                  商品行:
                    type: Canvas
                    attribute:
                      entryKey: self.item
                      entry: var.goodsRows[self.entryKey]
                      afford: "self.entry != none && self.entry['price'] >= 0 && self.entry['price'] <= var.coins"
                      visible: self.entry != none
                      width: 938
                      height: 102
                    action:
                      clickLeft: |-
                        if(self.afford){
                          Packet.send(var.packetId, 'shop_buy', var.shopId, self.entryKey, var.actionToken)
                          Sound.self('minecraft:ui.button.click', 1.4, 10)
                        }
                    children:
                      行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: "self.parent.afford ? '34,37,36,255' : '26,28,28,255'"
                          hover: "self.parent.afford ? '62,52,38,255' : '36,32,29,255'"
                          through: true
                        effect:
                          stroke:
                            width: 2
                            color: "self.parent.afford ? '108,84,56,255' : '65,61,53,255'"
                      索引标:
                        type: Text
                        attribute:
                          x: 18
                          y: 32
                          texts: "'&6' + (self.parent.entryKey + 1).round()"
                          fontSize: 32
                          through: true
                      商品图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          x: 64
                          y: 16
                          width: 68
                          height: 68
                          itemScale: 0.84
                          normal: ~50,51,46,255
                          through: true
                          seticon: "self.setItemIcon(var.iconJsons[self.parent.entryKey])"
                      商品名:
                        type: Canvas
                        attribute:
                          x: 154
                          y: 10
                          width: 540
                          height: 42
                          through: true
                        children:
                          文字:
                            type: Text
                            attribute:
                              texts: '''&f'' + self.parent.parent.entry[''name'']'
                              fontSize: 42
                              limit: 16
                              point: ~top_left
                              width: self.parent.width
                              height: self.parent.height
                              limitControl: self.parent
                              through: true
                      商品描述:
                        type: Canvas
                        attribute:
                          x: 154
                          y: 62
                          width: 540
                          height: 32
                          through: true
                        children:
                          文字:
                            type: Text
                            attribute:
                              texts: '''&7'' + self.parent.parent.entry[''desc0''] + (self.parent.parent.entry[''desc1''] != '''' ? ''  '' + self.parent.parent.entry[''desc1''] : '''')'
                              fontSize: 32
                              limit: 22
                              point: ~top_left
                              width: self.parent.width
                              height: self.parent.height
                              limitControl: self.parent
                              through: true
                      价格:
                        type: Text
                        attribute:
                          point: ~top_right
                          x: -24
                          y: 12
                          texts: "self.parent.afford ? '&6' + self.parent.entry['priceText'] + ' 金' : '&c' + self.parent.entry['priceText'] + ' 金'"
                          fontSize: 42
                          through: true
                      购买状态:
                        type: Text
                        attribute:
                          point: ~top_right
                          x: -24
                          y: 64
                          texts: "self.parent.afford ? '&6可购买' : '&7金币不足'"
                          fontSize: 32
                          through: true
          空清单:
            type: Text
            attribute:
              point: ~middle_center
              y: 45
              texts: ~&7补给库存为空 · 继续探索以寻找物资
              fontSize: 42
              visible: var.goodsCount <= 0
              through: true
          提示:
            type: Text
            attribute:
              x: 54
              y: 785
              texts: ~&7补给来源  /  副本魔物掉落金币 · 鼠标滚轮浏览完整清单
              fontSize: 32
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -36
              y: 32
              width: 48
              height: 48
            action:
              clickLeft: "Screen.close()"
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~92,39,36,255
                  hover: ~151,59,44,255
                  through: true
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&fX
                  fontSize: 32
                  through: true
