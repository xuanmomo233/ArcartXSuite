# 命名奖励集（grant_reward <集名>）+ 宝箱奖励（open_chest_ui <名>）
rewards:
  通关补给:
    items: ["material:EMERALD:3", "material:COOKED_BEEF:4"]
    exp: 50
  # 限时挑战/连战加赏
  加赏礼包:
    items:
      - "material:DIAMOND:1"
      - "material:GOLD_INGOT:4"
    money: 50

  # S 级通关额外奖励
  深渊加赏:
    items:
      - "material:NETHERITE_SCRAP:1"
      - "material:EMERALD:8"
    money: 200

# 宝箱奖励（chests 锚点/宝箱交互点开箱）
#   · 每个玩家独立 roll 一份，互不干扰；领完该箱标记"已领取"
#   · 清房后潜行右键宝箱 → 连战加赏（重打一波+挑战奖励，procgen.yml encore 开关）
chest-rewards:
  abyss_chest:
    title: "战利品宝箱"
    rows: 3
    options:
      - item: "material:IRON_SWORD:1"
        weight: 20
      - item: "material:GOLDEN_APPLE:1"
        weight: 15
      - item: "material:DIAMOND:2"
        weight: 10
      - item: "material:EMERALD:4"
        weight: 25
      - item: "material:ARROW:16"
        weight: 30
      - item: "material:COOKED_BEEF:8"
        weight: 30
# 奖励先由宿主确认持久化，再通过统一发放链自动到账；无需重新登录。
# 背包溢出由宿主处理仓库/邮件/待发；数据库暂不可用时保留宿主恢复日志。
