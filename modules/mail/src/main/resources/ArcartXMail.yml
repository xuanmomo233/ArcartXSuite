# 配置文件版本号；迁移系统据此自动升级配置结构。
config-version: 3
# AXS Mail
# 作用: 收件箱、写信、附件、领取命令、预设邮件、CDK、跨服刷新、邮件日志和 Mail UI；可被 OnlineRewards 等模块调用预设邮件发奖。
# 依赖: ArcartX；Vault、PlayerPoints、PlaceholderAPI、Redis 按功能选用。
# 重载: /axs mail reload
# PAPI 输出:
#   %axsmail_unread_count% 当前玩家未读邮件数。
#   %axsmail_claimable_count% 当前玩家可领取邮件数。
#   %axsmail_total_count% 当前玩家收件箱总邮件数。
# 可消费的 PAPI: currencies.<id>.balance-placeholder 用于读取余额；data/mail/presets/*.yml 的 claim-conditions 会解析 PAPI 后判断领取条件。
# 内置变量: claim-commands、withdraw-command、deposit-command 等命令支持玩家相关 token，例如 <player>。
# 关联资源: data/mail/presets/*.yml、ui/mail_*.yml

settings:
  # 是否输出 Mail 模块调试日志。
  debug: false

storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "<moduleId>.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: <N>
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_<moduleId>_"

cross-server:
  # 多服邮件刷新通知；连接参数见宿主 config.yml cross-server 节
  enabled: false

ui:
  # 下面四个 UI ID 对应收件箱、写信、日志和管理页。
  inbox-ui-id: AXS:mail_inbox
  compose-ui-id: AXS:mail_compose
  logs-ui-id: AXS:mail_logs
  admin-ui-id: AXS:mail_admin
  # 模块启用时是否自动注册 UI 配置文件。
  register-ui-on-enable: true
  # 是否覆盖已有的同名 UI 文件（false 则保留自定义修改）。
  overwrite-ui-files: false

  # 玩家打开写信背包时显示的标题。
  compose-inventory-title: AXS Mail Compose

  # 新邮件到达时在聊天栏显示的 ArcartX 卡片 ID；留空则不发送通知卡片。
  notify-card-id: "axs_mail_notify"

  # 收件箱列表预览文字的最大字符数（超过则截断并追加 "..."）。
  inbox-preview-max-chars: 40

  # 全角字符占位宽度
  notify-char-width-full: 31
  # 半角字符占位宽度
  notify-char-width-half: 18
  # 文字区最大宽度（超过此值换行）
  notify-max-line-width: 750

player-send:
  # 玩家写信功能总开关。
  enabled: true

  # 是否要求 ArcartXSuite.mail.send 权限。
  require-permission: true

  # 发信冷却，单位秒。
  cooldown-seconds: 120

  # 固定手续费。
  base-fee: 0.0

  # 额外物品附件手续费。
  # 玩家写信时会邮寄附件槽中的真实 ItemStack 数据；原版、NeigeItems、MythicMobs/MythicItems、MMOItems 等物品库产物不需要单独配置。
  item-fee: 0.0

  # base-fee / item-fee 使用的货币 ID；需在 currencies 中存在。
  fee-currency: money

  # 各货币附件税率；发送附件时会按货币 ID 读取对应倍率。
  attachment-tax-rates:
    money: 0.05
    points: 0.0

  # 是否允许给自己发信。
  allow-self-send: false

  # 是否允许离线目标收信。
  allow-offline-send: true

  # 是否允许附带 Vault 金币。
  allow-vault-attachment: true

  # 玩家写信界面可放入的物品附件槽数量；实际不会超过写信容器大小。
  max-attachments: 6
  # 邮件标题最大长度。
  subject-max-length: 48
  # 邮件正文最大长度。
  body-max-length: 400

  # 玩家发送的 Vault 货币附件在收件箱 UI 中展示的默认图标。
  # 与 menu 模块的 icon 配置一致，支持 material / custom-model-data / texture / texture-url / name / lore / source / id / nbt / glow / skull-texture / color 等。
  # 留空或不配置时使用默认纸片图标。
  # 示例（原版材质）：
  vault-default-icon:
    material: GOLD_INGOT
    name: "&6金币"
  # 示例（资源包自定义贴图）：
  # vault-default-icon:
  #   material: PAPER
  #   texture: "mail/icon_vault"
  #   custom-model-data: 10001
  #   name: "&6金币"

moderation:
  # 命中时禁止发送；支持敏感词、正则、物品材质和 Lore 正则。
  blocked-words:
    - sb
    - nm
    - 傻逼
    - 你妈
    - 屎
    - 艹
    - 操你
    - 草你
  # 屏蔽正则表达式列表；邮件标题/正文命中则禁止发送。
  blocked-patterns:
    - sb
    - nm
    - 傻逼
    - 你妈
    - 屎
    - 艹
    - 操你
    - 草你
  blocked-materials:
    - BEDROCK
    - COMMAND_BLOCK
    - BARRIER
  # 屏蔽 Lore 正则表达式列表；附件物品 Lore 命中则禁止发送。
  blocked-lore-patterns: []
  # 屏蔽物品自定义名称（displayName）正则表达式列表；附件物品名称命中则禁止发送。
  # 大小写不敏感匹配。
  blocked-displayname-patterns: []
  # 屏蔽 NBT/PDC 键列表；附件物品存在任一指定键则禁止发送。
  # 仅检测 PersistentDataContainer（PDC）键，匹配键名（忽略命名空间）或完整键（namespace:key）。
  blocked-nbt-keys: []
  # 屏蔽 NBT/PDC 键值对；附件物品的指定键值匹配则禁止发送。
  # 键为 PDC 键名（忽略命名空间），值为期望的字符串/数值。
  # 支持数值比较（如 1 == 1.0）和字符串比较（忽略大小写）。
  blocked-nbt-values: {}
  # 示例:
  #   blocked-nbt-values:
  #     item_category: weapon
  #     custom_tag: soulbound

retention:
  # 自动清理周期，单位 tick。
  cleanup-interval-ticks: 1200

  # 默认邮件保留天数。
  default-expire-after-days: 15

  # 已领取 / 已删除邮件保留天数。
  claimed-retention-days: 7
  deleted-retention-days: 7

  # 是否允许在仍有未领取附件时删除邮件。
  allow-delete-with-unclaimed-attachments: false

cdk:
  # 是否要求 arcartxsuite.mail.cdk 权限才能兑换 CDK。
  # 默认 false（所有有 arcartxsuite.mail.use 权限的玩家都能兑换）；设为 true 后管理员可按需收回兑换权限。
  require-permission: false

  # CDK 兑换失败后对该玩家的冷却时间（秒）；0 表示不冷却。
  # 每次兑换失败（CDK 不存在/已领过/已过期/已领完等）都会触发冷却。
  cooldown-seconds: 10

  # 连续失败达到此次数后临时锁定该玩家的 CDK 兑换功能；0 表示不锁定。
  # 兑换成功会重置失败计数。
  max-fail-attempts: 5

  # 触发锁定后的锁定时长（分钟）。
  lockout-minutes: 5

presets:
  # 预设目录，相对于插件数据目录。
  # 预设邮件可在 preset.cdks 中声明固定 CDK；执行 /axs mail reload 后同步到数据库。
  # CDK 可通过 /axs mail cdk list [page] 查看当前 code、预设、领取次数和过期时间。
  directory: presets
  # 管理员 UI 预设编辑的最大物品附件槽位数（独立于 player-send.max-attachments）。
  # 预设加载时也使用此值作为上限，确保 admin 保存的附件不会被截断。
  admin-max-attachments: 18
