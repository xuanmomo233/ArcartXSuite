ui:
  isHud: false
  defaultOpen: false
  hide:
  - hotbar
  - experience_bar
  - crosshair
  - item_name
  - jump_bar
  - mount_health
  - player_state
  - player_health
  - armor_level
  - food_level
  - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    update: |-
      var.itemJsons = {}
      // 保存旧数量，用于判断是否需要重建列表（首次 update 时旧数量为 0，数量从 0 变为 N 时触发重建）
      oldMaxPersonalCount = var.maxPersonalCount
      oldMaxSharedCount = var.maxSharedCount
      oldMaxCategoryCount = var.maxCategoryCount
      oldPageSize = var.pageSize
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.ownerType = packet['ownerType']
      var.ownerId = packet['ownerId']
      var.warehouseId = packet['warehouseId']
      var.warehouseName = packet['warehouseName']
      var.categoryId = packet['categoryId']
      var.search = packet['search']
      var.sortId = packet['sortId']
      var.sortText = packet['sortText']
      var.categories = packet['categories']
      var.categoryTexts = packet['categoryTexts']
      var.personalWarehouses = packet['personalWarehouses']
      var.personalWarehouseTexts = packet['personalWarehouseTexts']
      var.sharedWarehouses = packet['sharedWarehouses']
      var.sharedWarehouseStorageTexts = packet['sharedWarehouseStorageTexts']
      var.slots = packet['slots']
      var.selectedSlot = packet['selectedSlot']
      var.selectedItem = packet['selectedItem']
      var.backpack = packet['backpack']
      var.unlocked = packet['unlocked']
      var.hasPassword = packet['hasPassword']
      var.readOnly = packet['readOnly']
      var.previewMode = packet['previewMode']
      var.sharedEditMode = packet['sharedEditMode']
      var.sharedCanEdit = packet['sharedCanEdit']
      var.lockOwner = packet['lockOwner']
      var.page = packet['page']
      var.pageTotal = packet['pageTotal']
      var.pageText = packet['pageText']
      var.capacityText = packet['capacityText']
      var.used = packet['used']
      var.capacity = packet['capacity']
      var.level = packet['level']
      var.canUpgrade = packet['canUpgrade']
      var.slotPriceText = packet['slotPriceText']
      var.nextUpgradeText = packet['nextUpgradeText']
      var.usedSlots = packet['usedSlots']
      var.matchedSlots = packet['matchedSlots']
      var.slotCount = packet['slotCount']
      var.pageSize = packet['pageSize']
      var.maxPersonalCount = packet['maxPersonalCount']
      var.maxSharedCount = packet['maxSharedCount']
      var.maxCategoryCount = packet['maxCategoryCount']
      // ── 个人仓库列表：仅在数量变化时重建 ──
      if(var.maxPersonalCount != oldMaxPersonalCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.个人仓库列表.childrenCount() > 1){
          val.个人仓库列表.get(1).remove()
        }
        if(var.maxPersonalCount > 1){
          for(序号 in range(1, var.maxPersonalCount - 1)){
            if(val.个人仓库列表['项'] != none) {
              项 = val.个人仓库列表['项'].copy('个人仓库项_' + var.刷新轮次.round() + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      // ── 共享仓库列表：仅在数量变化时重建 ──
      if(var.maxSharedCount != oldMaxSharedCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.共享仓库列表.childrenCount() > 1){
          val.共享仓库列表.get(1).remove()
        }
        if(var.maxSharedCount > 1){
          for(序号 in range(1, var.maxSharedCount - 1)){
            if(val.共享仓库列表['项'] != none) {
              项 = val.共享仓库列表['项'].copy('共享仓库项_' + var.刷新轮次.round() + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      // ── 分类列表：仅在数量变化时重建 ──
      if(var.maxCategoryCount != oldMaxCategoryCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.分类列表.childrenCount() > 1){
          val.分类列表.get(1).remove()
        }
        if(var.maxCategoryCount > 1){
          for(序号 in range(1, var.maxCategoryCount - 1)){
            if(val.分类列表['项'] != none) {
              项 = val.分类列表['项'].copy('分类项_' + var.刷新轮次.round() + '_' + 序号.round())
              项.entryKey = 序号.round()
            }
          }
        }
      }
      var.renderBackpackAmounts()
      if(var.slots != none){
        for(key in var.slots.keys()){
          json = packet['slotItemJson' + key]
          if(json != none){
            var.itemJsons[key] = json
          } else {
            var.itemJsons[key] = var.air
          }
        }
      }
      // ── 仓库网格（Slot 控件）：仅在数量变化时重建 ──
      if(var.pageSize != oldPageSize){
        var.warehouseIcons = {}
        var.warehouseIcons[0.round()] = val.warehouse_slot_0
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        while(val.仓库网格.childrenCount() > 1){
          val.仓库网格.get(1).remove()
        }
        if(var.pageSize > 1){
          for(序号 in range(1, var.pageSize - 1)){
            if(val.仓库网格['物品图标'] != none) {
              slot = val.仓库网格['物品图标'].copy('仓库物品图标_' + var.刷新轮次.round() + '_' + 序号.round())
              slot.entryKey = 序号.round()
              var.warehouseIcons[序号.round()] = slot
            }
          }
        }
      }
      // 对已存在的 Slot 控件重新调用 seticon（数据变了但 seticon 不会自动刷新）
      // 注意：icon 为裸变量块级作用域，seticon 必须放在赋值所在的 if 块内
      for(i in range(0, var.pageSize - 1)){
        if(val.仓库网格 != none){
          icon = var.warehouseIcons[i.round()]
          if(icon != none){
            icon.seticon()
          }
        }
      }
      // update 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false
    ui_notice: |-
      noticeMessage = packet['message']
      if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
        var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
        noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = noticeWrapped.split('\n')
        var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.warehouseIcons = {}
      var.capacityText = '0/0'
      var.slotPriceText = ''
      var.canUpgrade = false
      var.categoryTexts = {}
      var.hasPassword = false
      var.lastBackpackClickTime = 0
      var.lastSlotClickTime = 0
      var.level = 1
      var.packetId = 'AXS_WAREHOUSE'
      var.page = 1
      var.pageText = '1/1'
      var.personalWarehouseTexts = {}
      var.selectedBackpackSlot = -1
      var.selectedSlot = -1
      var.sharedEditMode = false
      var.previewMode = false
      var.sharedWarehouseStorageTexts = {}
      var.sortText = '时间'
      var.unlocked = false
      var.warehouseName = 'AXS 仓库'
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.air = '{"id": "minecraft:air","Count":1b}'
      var.amount = 1.round()
      var.emptyItemJson = '{"id": "minecraft:air","Count":1b}'
      var.刷新轮次 = 0.round()
      var.renderBackpackAmounts = -> {
        if(val.背包网格 != none){
          for(raw in range(9,44)){
            control = raw == 9 ? val.背包网格['背包槽'] : val.背包网格['背包槽' + (raw - 9).round()]
            entry = var.backpack[raw.round()]
            if(control != none){
              amountText = none
              if(entry != none && !entry['empty']){
                amountText = '&f' + entry['amount'].round()
              }
              amountControl = control['数量']
              if(amountControl != none){
                amountControl.texts = amountText
              }
            }
          }
        }
      }
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.rightW = 300
      var.gridW = var.contentW - var.rightW - 24
      var.slotSize = 66
      var.gridGap = 6
      var.whGridW = 12 * var.slotSize + 11 * var.gridGap
      var.whGridH = 6 * var.slotSize + 5 * var.gridGap
      var.bpGridW = 12 * var.slotSize + 11 * var.gridGap
      var.bpGridH = 3 * var.slotSize + 2 * var.gridGap
      var.gridBgW = var.whGridW + 32
      var.toolW = 200
      var.gridAreaW = var.gridW - var.toolW - 30
      var.gridBgX = (var.gridAreaW - var.gridBgW) / 2
      var.noticeActive = false
      var.noticeText = ''
      var.noticeDetail = ''
      var.noticeFade = Fade(80, 1000, 220)
      var.noticePeaked = false
      var.noticeLines = []
      var.noticeCount = 1
    open: |-
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeText = ''
      var.noticeDetail = ''
      Packet.send(var.packetId, 'refresh')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.rightW = 300
      var.gridW = var.contentW - var.rightW - 24
      var.slotSize = 66
      var.gridGap = 6
      var.whGridW = 12 * var.slotSize + 11 * var.gridGap
      var.whGridH = 6 * var.slotSize + 5 * var.gridGap
      var.bpGridW = 12 * var.slotSize + 11 * var.gridGap
      var.bpGridH = 3 * var.slotSize + 2 * var.gridGap
      var.gridBgW = var.whGridW + 32
      var.toolW = 200
      var.gridAreaW = var.gridW - var.toolW - 30
      var.gridBgX = (var.gridAreaW - var.gridBgW) / 2
    tick: |2-


      if(var.noticeActive){
        var.noticeOpacity = var.noticeFade.get()
        if(var.noticeOpacity > 0){ var.noticePeaked = true }
        if(var.noticePeaked && var.noticeOpacity <= 0){
          var.noticeActive = false
          var.noticePeaked = false
          var.noticeText = ''
          var.noticeDetail = ''
        }
      }
