                  星5进度文字:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 20
                      y: 144
                      texts: "var.pity5Limit != none && var.pity5Limit > 0 ? '&f' + var.pity5.round() + ' / ' + var.pity5Limit.round() : '&7———'"
                      fontSize: 36
                      through: true
                  # ── 4星保底进度条 ────────────────────────────────
                  星4标签:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 20
                      y: 192
                      texts: "~&d4星保底"
                      fontSize: 36
                      through: true
                  星4进度条底:
                    type: Texture
                    attribute:
                      point: ~top_left
                      x: 20
                      y: 232
                      width: 320
                      height: 24
                      normal: ~40,44,52,225
                      shape: ~round_rect
                      radius: 4
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: ~255,255,255,165
                  星4进度条填充:
                    type: Texture
                    attribute:
                      point: ~middle_left
                      x: 4
                      width: "var.pity4Limit != none && var.pity4Limit > 0 ? (var.pity4 * 1.0 / var.pity4Limit * 312).round() : 0"
                      height: 16
                      normal: ~168,120,220,255
                      shape: ~round_rect
                      radius: 3
                      through: true
                      visible: "var.pity4Limit != none && var.pity4Limit > 0"
                  星4进度文字:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 20
                      y: 264
                      texts: "var.pity4Limit != none && var.pity4Limit > 0 ? '&f' + var.pity4.round() + ' / ' + var.pity4Limit.round() : '&7———'"
                      fontSize: 36
                      through: true
                  # ── 保底说明 ──────────────────────────────────────
                  保底说明:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 20
