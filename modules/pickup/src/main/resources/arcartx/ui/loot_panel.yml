                      shape: ~round_rect
                      radius: 6
                      through: true
                  图标:
                    val: loot_slot_0
                    type: Slot
                    attribute:
                      point: ~middle_left
                      x: 6
                      width: 30
                      height: 30
                      slotType: ~Icon
                      normal: ~0,0,0,0
                      hover: ~0,0,0,0
                      through: true
                  名称:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 46
                      fontSize: 24
                      texts: "var.item0Name + ' &7×' + var.item0Amount.round()"
                      through: true
