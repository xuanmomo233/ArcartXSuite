# 在副本中引用 Chemdah 任务并配置副本动作。名称、说明、目标和预览写在 Chemdah 任务文件。
# 本例沿用 Chemdah 的 sk_slayer ID。现有脚本需要保留不同的副本 ID 时，才填写 chemdah-id。

sk_slayer:
  # auto-track 默认 true。设为 false 时，接取任务后由玩家或脚本手动追踪。
  # on-accept 在副本接取成功后执行，@trigger 指接取者。
  on-accept:
    - "sound @trigger ENTITY_EXPERIENCE_ORB_PICKUP 1 1.2"
  # on-complete 在完成后执行，quest_pack 对应同一副本 rewards.yml 中的奖励集。
  # manual-claim 默认 false。设为 true 时，玩家完成后通过 NPC 的 quest_step 或 submit_quest 领取。
  on-complete:
    - "grant_reward @trigger quest_pack"
    - "message @trigger &6委托达成！奖励已发放"
