# BattlePass 等级奖励配置
# 定义每个等级达到后可领取的各档位奖励
#
# 配置结构：
#   "<奖励唯一标识>":
#     level: <达到该等级可领取>
#     free:           # 免费档奖励
#       type: item    # 奖励类型：item / command / currency / mail
#       icon:         # UI 显示图标（与 menu/market 的 icon 用法一致）
#         material: DIAMOND
#         name: "&b钻石 x1"
#         amount: 1   # 图标显示数量（与 item.amount 一致）
#       item:         # 发放物品奖励（item 字段使用与 icon 相同的 IconDefinition 结构）
#         source: minecraft      # 物品来源：minecraft / mythic / neige / overture / mmoitems
#         id: DIAMOND             # 物品 ID（原版材质名或外部物品库 ID）
#         amount: 1               # 物品数量
#         name: "&b钻石"          # 物品显示名称（替代旧 nbt 中的 display.Name）
#         lore:                   # 物品描述（列表）
#           - "<描述行>"
#         custom-model-data: 0    # 自定义模型数据
#         glow: false             # 附魔光效
#         texture: ""             # ArcartX 自定义贴图
#         texture-url: ""         # 贴图 URL
#         nbt: ""                 # 整段 SNBT（用于附魔等无结构化替代的场景）
#     premium:        # 高级档奖励（结构同 free）
#       type: item
#       icon:
#         material: DIAMOND
#         name: "&6钻石 x5"
#         amount: 5
#       item:
#         source: minecraft
#         id: DIAMOND
#         amount: 5
#     deluxe:         # 典藏档奖励（结构同 free）
#       type: item
#       icon:
#         material: DIAMOND
#         name: "&5钻石 x8"
#         amount: 8
#       item:
#         source: minecraft
#         id: DIAMOND
#         amount: 8
#
# 奖励类型说明：
#   item:     通过 ItemSourceRegistry 生成物品并统一发放（放入背包→背包满转邮件→无邮件则掉落）
#             离线玩家上线后补发
#   command:  以控制台身份执行命令列表（commands 字段），支持 {player} 占位符
#   currency: 向玩家发放指定货币（需 Vault/PlayerPoints 等经济插件）
#   mail:     通过 Mail 模块发送邮件（预设 ID 或带物品附件的邮件）
#             Mail 模块不可用时降级为直接发放物品或执行命令
#             配置字段：
#               mail.presets:     邮件预设 ID 列表（使用 Mail 模块预设时配置）
#               mail-subject:    邮件主题（直接配置带附件邮件时使用）
#               mail-body:       邮件正文（直接配置带附件邮件时使用）
#               item:            邮件附件物品（直接配置带附件邮件时使用）
#
# item 字段支持与 icon 相同的全部 IconDefinition 字段（source/id/amount/name/lore/
# custom-model-data/glow/texture/texture-url/nbt/skull-texture/color/json 等），
# item.source 支持的物品来源：
#   minecraft  — 原版物品（id 为材质名，如 DIAMOND）
#   mythic     — MythicMobs 物品（id 为 MythicMobs 内部物品名）
#   neige      — NeigeItems 物品（id 为 NeigeItems 物品 ID）
#   overture   — Overture 物品（id 为 Overture 物品 ID）
#   mmoitems   — MMOItems 物品（id 为 MMOItems 物品 ID，也可用 mmo-type + mmo-id）
#
# icon 配置（完整字段见 menu/market 模块）：
#   material:          原版材质名（如 DIAMOND）
#   source + id:       外部物品库图标（mythic/neige/overture/mmoitems）
#   name:              图标悬浮名称（支持 & 颜色码）
#   amount:            图标显示数量（默认1，大于1时图标右下角显示数字）
#   lore:              图标描述（列表）
#   custom-model-data: 自定义模型数据
#   glow:              是否附魔发光
#   texture:           ArcartX 自定义贴图（写入 icon NBT）
#   texture-url:       贴图 URL（写入 url NBT）
#   nbt:               自定义 NBT（键值对或 SNBT 字符串）

