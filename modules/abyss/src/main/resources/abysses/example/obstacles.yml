# 障碍物：f3 Boss 入口走廊的灼热陷阱带（生成器随机廊段）
# zone 绑定生成器产出的命名障碍区：f3.boss_corridor_soul / _magma
# （Zone 是随机走廊的地面格集——每次副本位置不同）。auto-create 在副本
# 开始（世界生成后）自动铺设；trigger-mode ENTER = 玩家踩入触发脚本。

soul_trap:
  zone: f3.boss_corridor_soul     # Boss 走廊前半段 → 灵魂沙减速带
  zone-material: SOUL_SAND
  auto-create: true
  trigger-mode: ENTER
  trigger-cooldown: 6
  trigger-script:
    - "actionbar @trigger &c灼热之地！快离开地面"
    - "sound @trigger BLOCK_FIRE_AMBIENT 1 0.7"

magma_trap:
  zone: f3.boss_corridor_magma    # Boss 走廊后半段 → 岩浆块灼烧带
  zone-material: MAGMA_BLOCK
  auto-create: true
  trigger-mode: ENTER
  trigger-cooldown: 6
  trigger-script:
    - "actionbar @trigger &c岩浆灼烧！快通过"
    - "sound @trigger BLOCK_FIRE_AMBIENT 1 0.7"
