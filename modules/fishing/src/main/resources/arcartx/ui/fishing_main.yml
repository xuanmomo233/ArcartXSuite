# Lakeside field guide / 01 · Angler's journal
# Packet contracts, server navigation and item JSON remain authoritative.
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    init: |-
      var.recentIconJsons = {}
      var.packetId = packet['packetId']
      var.seasonName = packet['seasonName']
      var.playerLevel = packet['playerLevel']
      var.maxLevel = packet['maxLevel']
      var.currentXp = packet['currentXp']
      var.xpForNext = packet['xpForNext']
      var.progressRatio = packet['progressRatio']
      var.totalCaught = packet['totalCaught']
      var.perfectCatches = packet['perfectCatches']
      var.treasureCaught = packet['treasureCaught']
      var.collectionCount = packet['collectionCount']
      var.totalFishTypes = packet['totalFishTypes']
      var.collectionPercent = packet['collectionPercent']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.totalTalentPoints = packet['totalTalentPoints']
      var.unlockedTalentCount = packet['unlockedTalentCount']
      var.claimableRewardCount = packet['claimableRewardCount']
      var.claimedRewardCount = packet['claimedRewardCount']
      var.totalRewardCount = packet['totalRewardCount']
      var.recentCatches = packet['recentCatches']
      var.recentCount = packet['recentCount']
      if(var.recentCatches != none){
        for(key in var.recentCatches.keys()){
          json = packet['recentIconJson' + key]
          var.recentIconJsons[key] = (json != none && json != '') ? json : var.emptyItemJson
        }
      }
      for(key in var.recentRefs.keys()){
        var.recentRefs[key].remove()
      }
      var.recentRefs = {}
      var.recentGeneration = (var.recentGeneration + 1).round()
      for(i in range(1, var.recentCount - 1)){
        key = i.round()
        e = val.最近列表.get(0).copy('捕获条目_' + var.recentGeneration + '_' + key)
        e.entryKey = key
        var.recentRefs[key] = e
      }
      var.iconDelay = 2
  action:
    load: |-
      var.packetId = 'AXS_FISHING'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.recentRefs = {}
      var.recentGeneration = 0
      var.recentCount = 0
      var.seasonName = '加载中'
      var.playerLevel = 1
      var.maxLevel = 1
      var.currentXp = 0
      var.xpForNext = 0
      var.progressRatio = 0
      var.totalCaught = 0
      var.perfectCatches = 0
      var.treasureCaught = 0
      var.collectionCount = 0
      var.totalFishTypes = 0
      var.collectionPercent = 0
      var.unspentTalentPoints = 0
      var.totalTalentPoints = 0
      var.unlockedTalentCount = 0
      var.claimableRewardCount = 0
      var.claimedRewardCount = 0
      var.totalRewardCount = 0
      var.iconDelay = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.cardW = (var.contentW - 96) / 2
    open: |-
      Packet.send(var.packetId, 'refresh_main')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.cardW = (var.contentW - 96) / 2
    tick: |-
      if(var.iconDelay > 0){
        var.iconDelay = var.iconDelay - 1
        if(var.iconDelay == 0){
          val.最近列表.get(0)['鱼图标'].seticon()
          for(key in var.recentRefs.keys()){
            var.recentRefs[key]['鱼图标'].seticon()
          }
        }
      }
controls:
  全屏玻璃底:
    type: Texture
    attribute: {point: ~stretch_all, normal: '~Frosted:18;20,43,52,170'}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶栏:
        type: Canvas
        attribute: {x: '-var.offX', width: 'var.viewW', height: 96}
        children:
          顶栏底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~23,49,64,250'}
          标题:
            type: Text
            attribute: {point: ~middle_left, x: 48, texts: '~&f湖畔手册', fontSize: 54}
          赛季名:
            type: Text
            attribute: {point: ~middle_left, x: 340, texts: "'&7钓鱼 / &f' + var.seasonName", fontSize: 36}
          关闭按钮:
            type: Canvas
            attribute: {point: ~middle_right, x: -40, width: 112, height: 52}
            action: {clickLeft: 'Screen.close()'}
            children:
              关闭背景:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~48,75,83,255', hover: '~73,107,106,255', shape: ~round_rect, radius: 12, through: true}
              关闭文字:
                type: Text
                attribute: {point: ~middle_center, texts: '~&f关闭', fontSize: 36, through: true}
      左侧导航:
        type: Canvas
        attribute: {x: '48 - var.offX', y: 120, width: 300, height: 'var.viewH - 144'}
        children:
          导航底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~231,222,196,250', shape: ~round_rect, radius: 18}
          索引标题:
            type: Text
            attribute: {x: 24, y: 24, texts: '~&8FIELD GUIDE / 目录', fontSize: 36}
          导航总览:
            type: Canvas
            attribute: {x: 16, y: 88, width: 268, height: 62}
            children:
              总览底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~157,190,169,255', shape: ~round_rect, radius: 10, through: true}
              总览文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&001  垂钓日志', fontSize: 36, through: true}
          导航图鉴:
            type: Canvas
            attribute: {x: 16, y: 162, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_collection')"}
            children:
              图鉴底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}
              图鉴文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&f02  鱼种图鉴', fontSize: 36, through: true}
          导航奖励:
            type: Canvas
            attribute: {x: 16, y: 236, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_rewards')"}
            children:
              奖励底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}
              奖励文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&f03  成长奖励', fontSize: 36, through: true}
          导航天赋:
            type: Canvas
            attribute: {x: 16, y: 310, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_talents')"}
            children:
              天赋底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}
              天赋文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&f04  技艺网络', fontSize: 36, through: true}
          导航任务:
            type: Canvas
            attribute: {x: 16, y: 384, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_tasks')"}
            children:
              任务底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}
              任务文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&f05  湖畔委托', fontSize: 36, through: true}
          导航饵料:
            type: Canvas
            attribute: {x: 16, y: 458, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_baits')"}
            children:
              饵料底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}
              饵料文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&f06  行前饵料', fontSize: 36, through: true}
          手册提示:
            type: Text
            attribute:
              x: 24
              y: 580
              texts: ['~&8准备饵料', '~&8捕获鱼种', '~&8记录成长']
              fontSize: 36
      内容区:
        type: Canvas
        attribute: {x: '372 - var.offX', y: 120, width: 'var.contentW', height: 'var.viewH - 144'}
        children:
          内容底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~191,209,191,248', shape: ~round_rect, radius: 18}
          页标题:
            type: Text
            attribute: {x: 32, y: 24, texts: '~&0垂钓日志', fontSize: 64}
          页标题说明:
            type: Text
            attribute: {point: ~top_right, x: -32, y: 40, texts: '~&8每一次抛竿，都留下新的记录', fontSize: 36}
          等级卡片:
            type: Canvas
            attribute: {x: 32, y: 116, width: 'var.cardW', height: 220}
            children:
              等级卡底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~23,49,64,255', shape: ~round_rect, radius: 16}
              等级标签:
                type: Text
                attribute: {x: 24, y: 20, texts: '~&7ANGLER / 垂钓等级', fontSize: 36}
              等级数字:
                type: Text
                attribute: {x: 24, y: 62, texts: "'&fLv.' + var.playerLevel.round()", fontSize: 81}
              等级上限:
                type: Text
                attribute: {point: ~top_right, x: -24, y: 82, texts: "'&7上限 ' + var.maxLevel.round()", fontSize: 36}
              经验文本:
                type: Text
                attribute: {x: 24, y: 154, texts: "'&f经验 ' + var.currentXp.round() + ' / ' + var.xpForNext.round()", fontSize: 36}
              进度条背景:
                type: Texture
                attribute: {x: 24, y: 198, width: 'var.cardW - 48', height: 8, normal: '~56,80,88,255', shape: ~round_rect, radius: 4}
              进度条填充:
                type: Texture
                attribute: {x: 24, y: 198, width: 'math.max(0, math.min(1, type.toNumber(var.progressRatio))) * (var.cardW - 48)', height: 8, normal: '~157,190,169,255', shape: ~round_rect, radius: 4}
          图鉴卡片:
            type: Canvas
            attribute: {x: '64 + var.cardW', y: 116, width: 'var.cardW', height: 220}
            children:
              图鉴卡底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~231,222,196,255', shape: ~round_rect, radius: 16}
              图鉴卡标题:
                type: Text
                attribute: {x: 24, y: 20, texts: '~&8SPECIMENS / 鱼种收集', fontSize: 36}
              图鉴数字:
                type: Text
                attribute: {x: 24, y: 62, texts: "'&0' + var.collectionCount.round() + ' / ' + var.totalFishTypes.round()", fontSize: 72}
              图鉴百分比:
                type: Text
                attribute: {x: 24, y: 160, texts: "'&8已记录 ' + var.collectionPercent.round() + '% 鱼种'", fontSize: 36}
              图鉴入口按钮:
                type: Canvas
                attribute: {point: ~bottom_right, x: -24, y: -24, width: 200, height: 52}
                action: {clickLeft: "Packet.send(var.packetId, 'open_collection')"}
                children:
                  图鉴入口底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~23,49,64,255', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}
                  图鉴入口文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: '~&f翻阅图鉴', fontSize: 36, through: true}
          统计行:
            type: Canvas
            attribute: {x: 32, y: 356, width: 'var.contentW - 64', height: 80}
            children:
              统计底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~53,89,96,255', shape: ~round_rect, radius: 12}
              捕获:
                type: Text
                attribute: {point: ~middle_left, x: 24, texts: "'&f累计捕获 ' + var.totalCaught.round()", fontSize: 36}
              完美:
                type: Text
                attribute: {point: ~middle_left, x: '(var.contentW - 64) / 4 + 24', texts: "'&f完美 ' + var.perfectCatches.round()", fontSize: 36}
              宝藏:
                type: Text
                attribute: {point: ~middle_left, x: '(var.contentW - 64) / 2 + 24', texts: "'&f宝藏 ' + var.treasureCaught.round()", fontSize: 36}
              天赋:
                type: Text
                attribute: {point: ~middle_left, x: '(var.contentW - 64) * 0.75 + 24', texts: "'&f天赋点 ' + var.unspentTalentPoints.round() + '/' + var.totalTalentPoints.round()", fontSize: 36}
          快捷入口:
            type: Canvas
            attribute: {x: 32, y: 460, width: 400, height: 'var.viewH - 636'}
            children:
              快捷底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~231,222,196,255', shape: ~round_rect, radius: 16}
              快捷标题:
                type: Text
                attribute: {x: 24, y: 24, texts: '~&0下一步', fontSize: 48}
              奖励按钮:
                type: Canvas
                attribute: {x: 24, y: 96, width: 352, height: 72}
                action: {clickLeft: "Packet.send(var.packetId, 'open_rewards')"}
                children:
                  奖励按钮底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~157,190,169,255', hover: '~177,208,181,255', shape: ~round_rect, radius: 10, through: true}
                  奖励按钮文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: "'&0领取奖励 · ' + var.claimableRewardCount.round()", fontSize: 36, through: true}
              天赋按钮:
                type: Canvas
                attribute: {x: 24, y: 184, width: 352, height: 72}
                action: {clickLeft: "Packet.send(var.packetId, 'open_talents')"}
                children:
                  天赋按钮底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~23,49,64,255', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}
                  天赋按钮文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: "'&f分配天赋 · ' + var.unspentTalentPoints.round()", fontSize: 36, through: true}
              任务按钮:
                type: Canvas
                attribute: {x: 24, y: 272, width: 352, height: 72}
                action: {clickLeft: "Packet.send(var.packetId, 'open_tasks')"}
                children:
                  任务按钮底:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: '~23,49,64,255', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}
                  任务按钮文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: '~&f查看湖畔委托', fontSize: 36, through: true}
              手记:
                type: Text
                attribute: {x: 24, y: 370, texts: ['~&8先备饵，再抛竿。', '~&8经验解锁奖励与技艺。'], fontSize: 36}
          最近捕获区:
            type: Canvas
            attribute: {x: 456, y: 460, width: 'var.contentW - 488', height: 'var.viewH - 636'}
            children:
              最近底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~23,49,64,255', shape: ~round_rect, radius: 16}
              最近标题:
                type: Text
                attribute: {x: 24, y: 24, texts: '~&f捕获手记', fontSize: 48}
              最近说明:
                type: Text
                attribute: {point: ~top_right, x: -32, y: 34, texts: '~&7最近 10 条 / 滚轮翻阅', fontSize: 36}
              空状态:
                type: Text
                attribute: {point: ~middle_center, texts: '~&7尚无记录，去湖边抛竿吧', fontSize: 36, visible: 'var.recentCount == 0'}
              最近滑轨:
                type: Texture
                attribute: {point: ~top_right, x: -16, y: 94, width: 12, height: 'var.viewH - 754', normal: '~53,76,85,255', shape: ~round_rect, radius: 6}
              最近滑块:
                type: Texture
                val: 最近滑块
                attribute: {point: ~top_right, x: -16, y: 94, width: 12, height: 80, maxDragY: 'var.viewH - 834', normal: '~157,190,169,255', shape: ~round_rect, radius: 6}
              滚动区:
                type: Scroll
                attribute: {x: 20, y: 94, width: 'var.contentW - 548', height: 'var.viewH - 754', moveY: "self.parent['最近滑块'].getDragYRatio()"}
                action:
                  wheel: |-
                    self.parent['最近滑块'].setDragYRatio(math.max(0, math.min(1, self.moveY - self.wheelValue * 0.1)))
                children:
                  最近列表:
                    type: VStack
                    val: 最近列表
                    attribute: {width: 'var.contentW - 548', spaceBetween: 12}
                    children:
                      捕获条目:
                        type: Canvas
                        attribute: {entryKey: 0.round(), entry: 'var.recentCatches[self.entryKey]', visible: 'self.entry != none', width: 'var.contentW - 548', height: 104}
                        children:
                          条目底:
                            type: Texture
                            attribute: {point: ~stretch_all, normal: '~48,75,83,255', shape: ~round_rect, radius: 12, through: true}
                          鱼图标:
                            type: Slot
                            attribute: {x: 12, y: 12, width: 80, height: 80, normal: '~157,190,169,255', shape: ~round_rect, radius: 12, slotType: ~Icon, itemScale: 0.8, overwriteText: '~', seticon: 'self.setItemIcon(var.recentIconJsons[self.parent.entryKey])'}
                          鱼名:
                            type: Text
                            attribute: {x: 112, y: 16, texts: "'&f' + self.parent.entry['fishName']", fontSize: 36, limit: 14, through: true}
                          尺寸:
                            type: Text
                            attribute: {x: 112, y: 60, texts: "'&7' + self.parent.entry['size'].round() + ' cm' + (self.parent.entry['perfect'] == true ? ' &a完美捕获' : '')", fontSize: 36, through: true}
                          稀有度标签:
                            type: Text
                            attribute: {point: ~middle_right, x: -16, texts: "self.parent.entry['rarity']", fontSize: 36, through: true}
