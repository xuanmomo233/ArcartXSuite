                type: HGrid
                val: 附件网格
                attribute:
                  point: ~top_left
                  x: 16
                  y: 88
                  spaceBetweenX: 6
                  spaceBetweenY: 6
                  column: 6
                action:
                  create: |-
                    for(i in range(1,5)){
                      slot = self['槽位0'].copy('slot' + i)
                      slot.entryKey = i.round()
                    }
                children:
                  槽位0:
                    type: Slot
                    attribute:
                      width: 70
                      height: 70
                      normal: ~238,228,210,255
                      hover: ~224,216,190,255
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.72
                      slotType: ~Icon
                      lock: true
                      entryKey: 0.round()
                      visible: self.entryKey < var.maxAttachments
                      seticon: 'self.setItemIcon(var.attachmentJsons != none && var.attachmentJsons[self.entryKey] != none && var.attachmentJsons[self.entryKey]
                        != '''' ? var.attachmentJsons[self.entryKey] : var.air)'
