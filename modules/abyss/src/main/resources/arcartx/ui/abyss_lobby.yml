                          接受字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: ~&0接受
                              fontSize: 32
                              through: true
          无邀请提示:
            type: Text
            attribute:
              x: "var.rightX + 44"
              y: 620
              texts: ~&7暂无邀请；可自行创建队伍。
              fontSize: 32
              visible: var.inviteCount.round() == 0
              through: true
          # 我的操作区
          操作分隔线:
            type: Texture
            attribute:
              x: "var.rightX + 28"
              y: "var.viewH - 272"
              width: "var.rightW - 56"
              height: 1
              normal: ~113,89,59,180
              through: true
          免打扰开关:
            type: Canvas
            attribute:
              x: "var.rightX + 28"
              y: "var.viewH - 248"
              width: "var.rightW - 56"
              height: 52
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'lobby_toggle_invites', var.allowInvite ? '0' : '1', var.actionToken)
                var.allowInvite = !var.allowInvite
            children:
              开关底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: var.cardBg
                  hover: var.cardBgHover
                  shape: ~round_rect
                  radius: 4
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: var.accentDim
              开关文本:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 18
                  texts: "var.allowInvite ? '&f接收组队邀请  &a已开启' : '&f接收组队邀请  &7已关闭'"
                  fontSize: 32
                  through: true
              开关圆点:
                type: Texture
                attribute:
                  point: ~middle_right
                  x: -18
                  width: 14
                  height: 14
                  normal: "var.allowInvite ? var.green : '120,120,130,255'"
                  shape: ~circle
                  through: true
          创建按钮:
            type: Canvas
            attribute:
              x: "var.rightX + 28"
              y: "var.viewH - 184"
              width: "var.rightW - 56"
              height: 60
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'lobby_create', var.actionToken)
            children:
              创建底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~197,141,63,255
                  hover: ~235,175,79,255
                  through: true
              创建字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "var.hasParty ? '&0进入我的队伍房间' : '&0创建我的队伍'"
                  fontSize: 32
                  through: true
