                          point: ~stretch_all
                          through: true
                          normal: ~62,66,74,210
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
                      重置字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 143
                          texts: "~&f重置"
                          fontSize: 30
                          through: true
              分类标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 22
                  y: 182
                  width: 300
                  texts: "~&f分类"
                  fontSize: 36
                  through: true
              分类滑块:
                type: Texture
                val: 分类滑块
                attribute:
                  point: ~top_left
                  x: 318
                  y: 226
                  width: 12
                  height: 50
                  normal: ~245,205,130,255
                  maxDragY: 230
                  shape: ~round_rect
                  radius: 6
              分类滚动:
                type: Scroll
                val: 分类滚动
                attribute:
                  point: ~top_left
                  x: 22
                  y: 226
                  width: 288
                  height: 280
                  moveY: "self.parent['分类滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  分类列表:
                    type: VStack
                    val: 分类列表
                    attribute:
                      width: 284
                      spaceBetween: 8
                    children:
                      项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.categories[self.entryKey]
                          visible: self.entry != none
                          width: 284
                          height: 46
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'category', self.entry['id'])
                        children:
                          项底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.entry != none && self.parent.entry['id'] == var.categoryId ? '104,84,46,225' : '62,66,74,210'"
                              shape: ~round_rect
                              radius: 12
                            effect:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '245,205,130,255' : (self.parent.entry != none && self.parent.entry['id'] == var.categoryId ? '232,180,90,235' : '255,255,255,230')"
                          项字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 284
                              texts: "var.categoryTexts[self.parent.entryKey]"
                              fontSize: 30
                              through: true
              仓库标题:
                type: Text
