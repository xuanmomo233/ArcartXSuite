# AXS 资源说明
# 用途: Abyss 增益选择面板（范式版·数据驱动）—— buffs.yml panel 池候选卡片
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
#
# 通讯协议:
#   服务端 → init: packetId/action_token/poolId/poolName/timeout/count/
#     cards{idx:{id,name,iconJson,rarity,rarityColor,desc0..2}}
#   客户端 → Packet.send('abyss', 'buff_pick', poolId, optionId, actionToken)
#   超时由服务端兜底（timeout-auto）；客户端倒数仅展示与到时自动关闭。
#
# 实现要点（§15.5）: seticon 不读 self.parent.entry，handler 先建
# var.iconJsons 字典，seticon 只按 entryKey 取值；copy 走引用字典。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.poolId = packet['poolId']
      var.poolName = packet['poolName']
      var.timeout = packet['timeout']
      var.picksLeft = packet['picksLeft']
      var.timeoutText = packet['timeoutText']
      var.count = packet['count']
      var.cards = packet['cards']
      var.remain = var.timeout
      // iconJsons 字典（seticon 只按 entryKey 取，不读 entry——懒求值未就绪会清成 air）
      var.iconJsons = {}
      for(key in var.cards.keys()){
        var.iconJsons[key] = var.cards[key]['iconJson']
      }
      var.dirty = true
    # Generation-bound close notification prevents stale close events cancelling a newly opened screen.

  action:
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'buff', var.actionToken, var.viewNonce)
      }
    load: |-
      var.actionToken = ''
      var.iconsPending = false
      var.已建_卡片区 = -1
      var.viewNonce = ''
      var.packetId = 'abyss'
      var.poolId = ''
      var.poolName = ''
      var.timeout = 0
      var.picksLeft = 1
      var.timeoutText = ''
      var.count = 0
      var.cards = {}
      var.remain = 0
      var.iconJsons = {}
      var.卡片引用 = {}
      var.轮次 = 0
      var.accent = '186,140,232,255'
      var.dirty = false
    open: |-
      Packet.send('abyss', 'view_ready', 'buff')
      Sound.self('minecraft:block.note_block.pling', 0.8, 10)
    tick: |-
      if(var.iconsPending && !var.dirty){
        var.iconsPending = false
        卡片目标数 = var.count.round()
        // seticon 不随 var/entry 自动重算，需逐卡片手动触发
        if(卡片目标数 > 0){
          val.卡片区.get(0)['图标槽'].seticon()
          if(卡片目标数 > 1){
            for(i in range(1, 卡片目标数 - 1)){
              var.卡片引用[i.round()]['图标槽'].seticon()
            }
          }
        }
      }
      if(var.dirty){
        var.dirty = false
        // 卡片 copy（引用字典 + 轮次名 + 数量变化才重建）
        卡片目标数 = var.count.round()
        if(var.已建_卡片区 != 卡片目标数){
        var.已建_卡片区 = 卡片目标数
          for(key in var.卡片引用.keys()){
            var.卡片引用[key].remove()
          }
          var.卡片引用 = {}
          var.轮次 = (var.轮次 + 1).round()
          模板 = val.卡片区.get(0)
          模板.entryKey = 0.round()
          if(卡片目标数 > 1){
            for(i in range(1, 卡片目标数 - 1)){
              e = 模板.copy('卡片_' + var.轮次 + '_' + i.round())
              e.entryKey = i.round()
              var.卡片引用[i.round()] = e
            }
          }
        }
        var.iconsPending = true
      }
    seconds: |-
      if(var.timeout > 0 && var.remain > 0) {
        var.remain = var.remain - 1
        if(var.remain <= 0) {
          Screen.close()
        }
      }
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;14,11,26,225
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      visible: "var.actionToken != ''"
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      标题标线:
        type: Texture
        attribute:
          point: ~top_center
          y: 200
          width: 30
          height: 4
          normal: var.accent
          shape: ~round_rect
          radius: 2
          through: true
      池名:
        type: Text
        attribute:
          point: ~top_center
          y: 220
          texts: "'&f' + var.poolName"
          fontSize: 56
          limit: 16
          through: true
      副标题:
        type: Text
        attribute:
          point: ~top_center
          y: 296
          texts: "'&7还可选择 ' + var.picksLeft.round() + ' 项增益，伴随本次副本生效'"
          fontSize: 32
          through: true
      倒计时文字:
        type: Text
        attribute:
          point: ~top_center
          y: 344
          texts: "var.timeout > 0 ? '&7' + var.remain.round() + 's · ' + var.timeoutText : ''"
          fontSize: 32
          through: true
      倒计时条背景:
        type: Texture
        attribute:
          point: ~top_center
          y: 388
          width: 420
          height: 6
          normal: ~40,32,62,220
          shape: ~round_rect
          radius: 3
          visible: "var.timeout > 0"
          through: true
      倒计时条:
        type: Texture
        attribute:
          point: ~top_center
          y: 388
          width: "var.timeout > 0 ? 420 * var.remain / var.timeout : 0"
          height: 6
          normal: var.accent
          shape: ~round_rect
          radius: 3
          visible: "var.timeout > 0"
          through: true
      卡片滑块:
        type: Texture
        val: buff_slider
        attribute:
          point: ~top_center
          x: 690
          y: 420
          width: 8
          height: 80
          maxDragY: 372
          normal: ~186,140,232,235
          visible: "var.count > 4"
      卡片滚动区:
        type: Scroll
        attribute:
          point: ~top_center
          y: 420
          width: "Math.min(4, Math.max(1, var.count)) * 336 - 36"
          height: 452
          moveY: "val.buff_slider.getDragYRatio()"
        action:
          wheel: |-
            val.buff_slider.setDragYRatio(Math.max(0, Math.min(1, self.moveY - self.wheelValue * 0.1)))
        children:
          卡片区:
            type: HGrid
            val: 卡片区
            attribute:
              width: "Math.min(4, Math.max(1, var.count)) * 336 - 36"
              column: "Math.min(4, Math.max(1, var.count))"
              spaceBetweenX: 36
              spaceBetweenY: 24
            children:
              卡片:
                type: Canvas
                attribute:
                  width: 300
                  height: 420
                  entryKey: 0.round()
                  entry: "var.cards[self.entryKey]"
                  visible: "self.entry != none"
                children:
                  卡片背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~Frosted:25;26,21,44,242
                      shape: ~round_rect
                      radius: 14
                      through: true
                    effect:
                      stroke:
                        width: "self.parent.isHovered() ? 4 : 3"
                        color: "self.parent.entry['rarityColor']"
                  图标槽:
                    type: Slot
                    attribute:
                      slotType: ~Icon
                      point: ~top_center
                      y: 40
                      width: 72
                      height: 72
                      normal: ~0,0,0,1
                      visible: "self.parent.entry['iconJson'] != ''"
                      entryKey: 0.round()
                      seticon: "self.setItemIcon(var.iconJsons[self.parent.entryKey])"
                      through: true
                  增益名:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 132
                      texts: "self.parent.entry['name']"
                      fontSize: 36
                      limit: 9
                      through: true
                  稀有度文字:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 190
                      texts: "'&7◆ ' + self.parent.entry['rarity']"
                      fontSize: 32
                      through: true
                  描述0:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 240
                      texts: "'&7' + self.parent.entry['desc0']"
                      fontSize: 32
                      limit: 12
                      through: true
                  描述1:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 278
                      texts: "'&7' + self.parent.entry['desc1']"
                      fontSize: 32
                      limit: 12
                      through: true
                  描述2:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 316
                      texts: "'&7' + self.parent.entry['desc2']"
                      fontSize: 32
                      limit: 12
                      through: true
                  选择按钮:
                    type: Canvas
                    attribute:
                      point: ~bottom_center
                      y: -24
                      width: 180
                      height: 54
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'buff_pick', var.poolId, self.parent.entry['id'], var.actionToken)
                    children:
                      按钮底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~170,120,220,235
                          shape: ~round_rect
                          radius: 10
                          through: true
                        effect:
                          stroke:
                            width: 1
                            color: "self.parent.isHovered() ? '255,255,255,230' : '255,255,255,60'"
                      按钮字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: ~&0选 择
                          fontSize: 32
                          through: true
