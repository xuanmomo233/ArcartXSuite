                              normal: ~50,90,160,235
                              hover: ~Frosted:0;70,120,200,245
                              shape: ~round_rect
                              radius: 32
                            effect:
                              stroke:
                                width: 2
                                color: ~90,170,255,180
                              neon:
                                color: ~90,170,255,80
                                size: 8
                                intensity: 0.3
                                animated: false
                          任务文字:
