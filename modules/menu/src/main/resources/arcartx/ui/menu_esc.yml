# AXS Menu ESC UI — 替换暂停界面，仿原神派蒙菜单布局
# 布局结构（设计分辨率 1920x1080，面板固定 820 宽，贴屏幕左缘滑入，右侧留给第三人称角色展示）：
#   ┌ 通高窄工具栏（返回 / 页脚操作 / ESC 提示）
#   ├ 右侧资料头部（圆形头像 / 昵称 / 等级+经验条 / 生命 / UID）
#   ├ 分区标题行（菜单标题，多页时显示页码翻页器）
#   └ 4 列深色方格 = 菜单按钮（统一渲染菜单配置的 icon，标签收进方格，底部显示操作说明）
# 数据流: 服务端 sendPacket(init/update) -> packetHandler -> var.* -> 模板复制渲染
# 客户端回包: Packet.send('AXS_MENU', 'click'/'footer', token, id) / page / esc_open
ui:
  isHud: false
  match:
    - 暂停界面
  hide:
    - HUD
    - online
    - 聊天栏
    - 纯色块HUD
    - hotbar
    - crosshair
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
    - experience_bar
    - item_name
    - scoreboard
    - chat_panel
  itemSize: 16
  # 如果想打开图标物品的tooltip，需要设置为true
  through: false
  escClose: false
  background: false
  closeDied: false
  show: true
  jei: false
  level: 0
  screenScale: true
  defaultOpen: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 包标识符（'AXS_MENU'）
    #   - action_token: 写操作令牌（click / footer 回包必带）
    #   - menuId: 菜单唯一标识
    #   - title: 菜单标题文本
    #   - pageId: 当前页面 ID
    #   - pageTitle: 当前页面标题
    #   - pageIndex: 当前页索引（从 0 开始）
    #   - pageCount: 总页数
    #   - hasPrev / hasNext: 是否有上一页 / 下一页
    #   - buttonRows: 按钮数据行（字典，key 为索引；含 id/text/enabled/hasIcon/itemJson）
    #   - buttonCount: 按钮总数
    #   - footerRows: 页脚按钮数据行（额外含 clientAction）
    #   - footerCount: 页脚按钮总数
    #   - maxButtonCount: 按钮最大数量
    #   - maxFooterCount: 页脚按钮最大数量
    init: |-
      var.incoming = packet
      var.resetMenu = true
      self.actions['applyPacket']()
    # packetHandler: update
    # 包字段: 与 init 相同（全量刷新菜单数据）
    update: |-
      var.incoming = packet
      var.resetMenu = false
      self.actions['applyPacket']()
  action:
    load: |-
      var.menuUi = self
      var.packetId = 'AXS_MENU'
      var.closing = false
      var.buttonCount = 0
      var.footerCount = 0
      var.gridRows = 0
      var.pageCount = 1
      var.pageIndex = 0
      var.labels = {}
      var.footerLabels = {}
      var.按钮引用 = {}
      var.页脚引用 = {}
      var.按钮轮次 = 0
      var.页脚轮次 = 0
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.actionBusySeconds = 0
      var.anim = Smooth(1, 0, 280)
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
    open: |-
      var.closing = false
      var.actionBusy = false
      var.preview = none
      var.anim = Smooth(1, 0, 280)
      self.actions['applyCamera']()
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
      Packet.send(var.packetId, 'esc_open')
    tick: |-
      if(!var.closing && server.player_yaw != var.yaw){
        self.actions['applyCamera']()
      }
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    applyCamera: |-
      var.yaw = server.player_yaw
      Camera.setState(1.2, -0.5, 2.5, 150, 0.0, 600)
      Camera.setThirdPerson(true)
    closeMenu: |-
      if(!var.closing){
        var.closing = true
        var.preview = none
        var.anim = Smooth(0, 1, 220)
        Camera.clearState()
        async {
          Thread.sleep(240)
          Camera.setThirdPerson(false)
          Screen.close()
        }
      }
    keyPress: |-
      if(self.currentKeyPress() == 'ESCAPE'){
        self.actions['closeMenu']()
      }
    close: |-
      var.closing = true
      var.preview = none
      Camera.setThirdPerson(false)
      Camera.clearState()
    preview: |-
      var.previewBody = var.preview['summary']
      if(var.previewBody == none || var.previewBody == ''){
        var.previewBody = '点击进入，继续你的冒险'
        if(var.preview['detailCount'] > 0){
          var.previewBody = var.preview['detailRows'][0.round()]['text']
        }
      }
      if(!var.preview['enabled']){
        var.previewBody = '当前未满足使用条件'
        if(var.preview['detailCount'] > 0){
          var.previewBody = var.preview['detailRows'][(var.preview['detailCount'] - 1).round()]['text']
        }
      }
      while(var.previewBody.length() >= 2 && (var.previewBody.charAt(0) == '&' || var.previewBody.charAt(0) == '§')){
        var.previewBody = var.previewBody.substring(2)
      }
      var.previewColor = var.preview['enabled'] ? '&8' : '&4'
    applyPacket: |-
      changedPage = var.resetMenu || var.menuId != var.incoming['menuId'] || var.pageId != var.incoming['pageId']
      var.packetId = var.incoming['packetId']
      var.actionToken = var.incoming['action_token']
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.preview = none
      var.menuId = var.incoming['menuId']
      var.title = var.incoming['title']
      var.pageId = var.incoming['pageId']
      var.pageTitle = var.incoming['pageTitle']
      var.pageIndex = var.incoming['pageIndex']
      var.pageCount = var.incoming['pageCount']
      var.hasPrev = var.incoming['hasPrev']
      var.hasNext = var.incoming['hasNext']
      var.buttonRows = var.incoming['buttonRows']
      var.buttonCount = var.incoming['buttonCount']
      var.footerRows = var.incoming['footerRows']
      var.footerCount = var.incoming['footerCount']
      var.maxButtonCount = var.incoming['maxButtonCount']
      var.maxFooterCount = var.incoming['maxFooterCount']
      var.gridRows = math.ceil(var.buttonCount / 4)
      var.displayTitle = var.pageCount > 1 ? var.pageTitle : var.title
      while(var.displayTitle.length() >= 2 && (var.displayTitle.charAt(0) == '&' || var.displayTitle.charAt(0) == '§')){
        var.displayTitle = var.displayTitle.substring(2)
      }
      if(changedPage){
        val.grid_slider.setDragYRatio(0)
        val.footer_slider.setDragYRatio(0)
      }
      // 动态行模板用 get(0)，copy/remove/seticon 全部走引用字典
      目标按钮数 = var.buttonCount.round()
      if(val.button_rows.childrenCount() - 1 != 目标按钮数 - 1){
        for(key in var.按钮引用.keys()){
          var.按钮引用[key].remove()
        }
        var.按钮引用 = {}
        var.按钮轮次 = (var.按钮轮次 + 1).round()
        模板 = val.button_rows.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 目标按钮数 - 1)){
          mb = 模板.copy('菜单按钮_' + var.按钮轮次 + '_' + i.round())
          mb.entryKey = i.round()
          var.按钮引用[i.round()] = mb
        }
      }
      目标页脚数 = var.footerCount.round()
      if(val.footer_rows.childrenCount() - 1 != 目标页脚数 - 1){
        for(key in var.页脚引用.keys()){
          var.页脚引用[key].remove()
        }
        var.页脚引用 = {}
        var.页脚轮次 = (var.页脚轮次 + 1).round()
        模板 = val.footer_rows.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 目标页脚数 - 1)){
          fb = 模板.copy('页脚按钮_' + var.页脚轮次 + '_' + i.round())
          fb.entryKey = i.round()
          var.页脚引用[i.round()] = fb
        }
      }
      // 标签与图标分离字典，一次遍历完成
      var.labels = {}
      var.footerLabels = {}
      var.iconJsons = {}
      var.footerIconJsons = {}
      for(key in var.buttonRows.keys()){
        entry = var.buttonRows[key]
        var.iconJsons[key] = entry['hasIcon'] ? entry['itemJson'] : var.air
        label = entry['text']
        while(label.length() >= 2 && (label.charAt(0) == '&' || label.charAt(0) == '§')){
          label = label.substring(2)
        }
        var.labels[key] = label
      }
      for(key in var.footerRows.keys()){
        entry = var.footerRows[key]
        var.footerIconJsons[key] = entry['hasIcon'] ? entry['itemJson'] : var.air
        label = entry['text']
        while(label.length() >= 2 && (label.charAt(0) == '&' || label.charAt(0) == '§')){
          label = label.substring(2)
        }
        var.footerLabels[key] = label
      }
      if(目标按钮数 > 0){
        mb = val.button_rows.get(0)
        mb['图标'].seticon()
        for(i in range(1, 目标按钮数 - 1)){
          mb = var.按钮引用[i.round()]
          mb['图标'].seticon()
        }
      }
      if(目标页脚数 > 0){
        fb = val.footer_rows.get(0)
        fb['图标'].seticon()
        for(i in range(1, 目标页脚数 - 1)){
          fb = var.页脚引用[i.round()]
          fb['图标'].seticon()
        }
      }
