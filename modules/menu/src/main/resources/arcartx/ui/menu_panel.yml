# AXS Menu 面板 UI — 通用配置驱动菜单
# 数据流: 服务端 sendPacket(init/update) -> packetHandler -> var.* -> Observer 渲染按钮
# 客户端回包: Packet.send('AXS_MENU', 'click', token, buttonId) / page / refresh / close(token)
ui:
  isHud: false
  defaultOpen: false
  # 如果想打开图标物品的tooltip，需要设置为true
  through: false
  background: false
  closeDied: true
  escClose: true
  show: true
  screenScale: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 包标识符（'AXS_MENU'）
    #   - menuId: 菜单唯一标识
    #   - layout: 布局模式（panel / esc）
    #   - title: 菜单标题文本
    #   - pageId: 当前页面 ID
    #   - pageTitle: 当前页面标题
    #   - pageIndex: 当前页索引（从 0 开始）
    #   - pageCount: 总页数
    #   - columns: 按钮网格列数
    #   - hasPrev: 是否有上一页
    #   - hasNext: 是否有下一页
    #   - buttonRows: 按钮数据行（字典，key 为索引）
    #   - buttonCount: 按钮总数
    #   - footerRows: 页脚按钮数据行
    #   - footerCount: 页脚按钮总数
    #   - maxButtonCount: 按钮最大数量（用于动态创建控件）
    #   - maxFooterCount: 页脚按钮最大数量
    init: |-
      var.incoming = packet
      var.resetMenu = true
      self.actions['applyPacket']()
    # packetHandler: update
    # 包字段: 与 init 相同（全量刷新菜单数据）
    update: |-
      var.incoming = packet
      var.resetMenu = false
      self.actions['applyPacket']()
  action:
    load: |-
      var.menuUi = self
      var.buttonCount = 0
      var.footerCount = 0
      var.detailCount = 0
      var.pageCount = 1
      var.pageIndex = 0
      var.hasPrev = false
      var.hasNext = false
      var.title = '菜单'
      var.pageTitle = '菜单'
      var.button_rowsRows = []
      var.footer_rowsRows = []
      var.detail_rowsRows = []
      var.packetId = 'AXS_MENU'
      var.accent = '214,190,143,255'
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.actionBusySeconds = 0
      var.openAnim = Smooth(0, 1, 280)
      var.detailAnim = Smooth(0, 1, 180)
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.leftW = var.viewW * 0.64
      var.rightW = var.viewW - var.leftW
    open: |-
      var.openAnim.reset()
      var.actionBusy = false
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
    tick: |-
      if(var.pendingEntry != none && Time.currentTime() - var.pendingAt >= 110){
        self.actions['selectPreview']()
      }
      self.actions['refreshIcons']()
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    selectPreview: |-
      if(var.pendingEntry != none){
        if(var.selectedId != var.pendingEntry['id'] || var.selectedFooter != var.pendingFooter){
          var.selected = var.pendingEntry
          var.selectedId = var.selected['id']
          var.selectedFooter = var.pendingFooter
          val.detail_slider.setDragYRatio(0)
          var.detailAnim.reset()
          self.actions['refreshDetails']()
        }
        var.pendingEntry = none
      }
    applyPacket: |-
      changedPage = var.resetMenu || var.menuId != var.incoming['menuId'] || var.pageId != var.incoming['pageId']
      previousId = var.selectedId
      previousFooter = var.selectedFooter
      var.pendingEntry = none
      var.selected = none
      var.packetId = var.incoming['packetId']
      var.actionToken = var.incoming['action_token']
      var.actionBusy = false
      var.menuId = var.incoming['menuId']
      var.layout = var.incoming['layout']
      var.title = var.incoming['title']
      var.pageId = var.incoming['pageId']
      var.pageTitle = var.incoming['pageTitle']
      var.pageIndex = var.incoming['pageIndex']
      var.pageCount = var.incoming['pageCount']
      var.columns = var.incoming['columns']
      var.hasPrev = var.incoming['hasPrev']
      var.hasNext = var.incoming['hasNext']
      var.buttonRows = var.incoming['buttonRows']
      var.buttonCount = var.incoming['buttonCount']
      var.footerRows = var.incoming['footerRows']
      var.footerCount = var.incoming['footerCount']
      var.maxButtonCount = var.incoming['maxButtonCount']
      var.maxFooterCount = var.incoming['maxFooterCount']
      if(changedPage){
        var.selectedId = none
        val.button_slider.setDragYRatio(0)
        val.footer_slider.setDragXRatio(0)
      }
      // RepeatGrid 条目保存整数行索引，用于读取当前页面的数据字典。
      if(var.button_rowsRows.size() != var.buttonCount){
        网格数据 = []
        if(var.buttonCount > 0){
          for(网格序号 in range(0, var.buttonCount - 1)){
            网格数据.add(网格序号.round())
          }
        }
        var.button_rowsRows = 网格数据
      }
      if(var.footer_rowsRows.size() != var.footerCount){
        网格数据 = []
        if(var.footerCount > 0){
          for(网格序号 in range(0, var.footerCount - 1)){
            网格数据.add(网格序号.round())
          }
        }
        var.footer_rowsRows = 网格数据
      }
      // 图标分离字典与选中还原，一次遍历完成
      var.iconJsons = {}
      for(key in var.buttonRows.keys()){
        entry = var.buttonRows[key]
        var.iconJsons[key] = entry['hasIcon'] ? entry['itemJson'] : var.air
        if(!var.selectedFooter && var.selectedId == entry['id']){
          var.selected = entry
        }
      }
      var.footerIconJsons = {}
      for(key in var.footerRows.keys()){
        entry = var.footerRows[key]
        var.footerIconJsons[key] = entry['hasIcon'] ? entry['itemJson'] : var.air
        if(var.selectedFooter && var.selectedId == entry['id']){
          var.selected = entry
        }
      }
      var.button_rowsIconsDirty = true
      var.footer_rowsIconsDirty = true
      if(var.selected == none){
        var.selectedFooter = false
        var.selected = var.buttonRows[0.round()]
        if(var.selected == none && var.footerCount > 0){
          var.selectedFooter = true
          var.selected = var.footerRows[0.round()]
        }
      }
      var.selectedId = var.selected['id']
      if(changedPage || previousId != var.selectedId || previousFooter != var.selectedFooter){
        val.detail_slider.setDragYRatio(0)
        var.detailAnim.reset()
      }
      self.actions['refreshDetails']()
    refreshDetails: |-
      var.detailRows = {}
      var.detailCount = 0
      iconJson = var.air
      var.accent = '214,190,143,255'
      if(var.selected != none){
        var.detailRows = var.selected['detailRows']
        iconJson = var.selected['hasIcon'] ? var.selected['itemJson'] : var.air
        var.detailCount = var.selected['detailCount']
        var.accent = var.selected['accent']
      }
      if(var.detail_rowsRows.size() != var.detailCount){
        网格数据 = []
        if(var.detailCount > 0){
          for(网格序号 in range(0, var.detailCount - 1)){
            网格数据.add(网格序号.round())
          }
        }
        var.detail_rowsRows = 网格数据
      }
      val.detail_icon.setItemIcon(iconJson)
    refreshIcons: |-
      if(var.button_rowsIconsDirty == true && val.button_rows != none && val.button_rows.childrenCount() == var.buttonCount){
        var.button_rowsIconsDirty = false
        if(var.buttonCount > 0){
          for(网格序号 in range(0, var.buttonCount - 1)){
            网格项 = val.button_rows.get(网格序号.round())
            if(网格项 != none){
              if(网格项['图标'] != none){
                网格项['图标'].seticon()
              }
            }
          }
        }
      }
      if(var.footer_rowsIconsDirty == true && val.footer_rows != none && val.footer_rows.childrenCount() == var.footerCount){
        var.footer_rowsIconsDirty = false
        if(var.footerCount > 0){
          for(网格序号 in range(0, var.footerCount - 1)){
            网格项 = val.footer_rows.get(网格序号.round())
            if(网格项 != none){
              if(网格项['图标'] != none){
                网格项['图标'].seticon()
              }
            }
          }
        }
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      全屏画布:
        type: Canvas
        attribute:
          x: "-var.offX"
          width: "var.viewW"
          height: "var.viewH"
        children:
          场景磨砂:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;16,27,42,245
          暮色底幕:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~16,27,42,255
            effect:
              gradient:
                color1: ~20,34,52,255
                color2: ~11,21,35,255
                type: 0
                angleDeg: 65
          导航内容:
            type: Canvas
            attribute:
              width: "var.leftW"
              height: "var.viewH"
              alpha: "var.openAnim.get()"
            children:
              页眉标线:
                type: Texture
                attribute:
                  x: 76
                  y: 56
                  width: 28
                  height: 3
                  normal: ~233,200,139,255
                  through: true
              品牌标记:
                type: Text
                attribute:
                  x: 120
                  y: 46
                  texts: ~&fN A V I G A T I O N  /  游戏导航
                  fontSize: 36
                  alpha: 0.78
                  through: true
              标题:
                type: Text
                attribute:
                  x: 72
                  y: 106
                  texts: var.title
                  fontSize: 100
                  limit: 24
                  through: true
              引导语:
                type: Text
                attribute:
                  x: 76
                  y: 178
                  texts: ~&7下一段旅程，从这里开始。
                  fontSize: 36
                  through: true
              分类底色:
                type: Texture
                attribute:
                  x: 76
                  y: 226
                  width: 224
                  height: 48
                  normal: ~42,60,80,255
                  shape: ~round_rect
                  radius: 8
                  through: true
              章节标记:
                type: Texture
                attribute:
                  x: 76
                  y: 238
                  width: 4
                  height: 24
                  normal: var.accent
                  through: true
              当前分类:
                type: Text
                attribute:
                  x: 98
                  y: 236
                  texts: var.pageTitle
                  fontSize: 48
                  limit: 10
                  through: true
              功能数量:
                type: Text
                attribute:
                  point: ~top_right
                  x: -78
                  y: 240
                  texts: "'&f' + var.buttonCount.round() + '  /  功能'"
                  fontSize: 36
                  alpha: 0.78
                  through: true
              分隔线:
                type: Texture
                attribute:
                  x: 76
                  y: 286
                  width: "var.leftW - 152"
                  height: 1
                  normal: ~83,108,135,160
                  through: true
              空提示:
                type: Canvas
                attribute:
                  x: 76
                  y: 360
                  width: "var.leftW - 152"
                  height: 160
                  visible: var.buttonCount <= 0
                children:
                  空标题:
                    type: Text
                    attribute:
                      point: ~top_center
                      texts: ~&f这里暂时没有可用功能
                      fontSize: 54
                      through: true
                  空说明:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 52
                      texts: ~&7试试切换页面，或稍后再次回来。
                      fontSize: 36
                      through: true
              按钮滚动区:
                type: Scroll
                attribute:
                  x: 76
                  y: 304
                  width: "var.leftW - 152"
                  height: "var.viewH - 518"
                  moveY: val.button_slider.getDragYRatio()
                action:
                  wheel: |-
                    ratio = self.moveY - self.wheelValue * 0.12
                    if(ratio < 0){ ratio = 0 }
                    if(ratio > 1){ ratio = 1 }
                    val.button_slider.setDragYRatio(ratio)
                children:
                  按钮列表:
                    type: RepeatGrid
                    val: button_rows
                    attribute:
                      items: "var.button_rowsRows"
                      flow: ~row
                      column: 1
                      spaceBetweenY: 12
                      maxSize: 2147483647
                      width: "var.leftW - 152"
                    children:
                      菜单按钮:
                        type: Canvas
                        attribute:
                          entryKey: self.item
                          entry: var.buttonRows[self.entryKey]
                          active: "!var.selectedFooter && var.selectedId == self.entry['id']"
                          visible: self.entry != none
                          width: "var.leftW - 156"
                          height: 112
                          through: false
                        action:
                          enter: |-
                            var.pendingEntry = self.entry
                            var.pendingFooter = false
                            var.pendingAt = Time.currentTime()
                            Sound.self('minecraft:ui.button.click', 1.9, 6)
                          leave: |-
                            if(!var.pendingFooter && var.pendingEntry['id'] == self.entry['id']){
                              var.pendingEntry = none
                            }
                          clickLeft: |-
                            var.pendingEntry = self.entry
                            var.pendingFooter = false
                            var.menuUi.actions['selectPreview']()
                            if(self.entry != none && self.entry['enabled'] && var.actionToken != none && !var.actionBusy){
                              var.actionBusy = true
                              Sound.self('minecraft:ui.button.click', 1.0, 20)
                              Packet.send(var.packetId, 'click', var.actionToken, self.entry['id'])
                            }
                        children:
                          卡片底色:
                            type: Texture
                            attribute:
                              x: 2
                              y: 2
                              width: "self.parent.width - 4"
                              height: "self.parent.height - 4"
                              normal: "self.parent.active ? '52,78,101,255' : '28,44,63,255'"
                              hover: ~56,82,108,255
                              shape: ~round_rect
                              radius: 12
                              through: true
                            effect:
                              stroke:
                                width: 3
                                color: "self.parent.active ? self.parent.entry['accent'] : (self.parent.isHovered() ? '128,160,188,235' : '70,96,122,190')"
                          选中染色:
                            type: Texture
                            attribute:
                              x: 3
                              y: 3
                              width: "self.parent.width - 6"
                              height: "self.parent.height - 6"
                              normal: self.parent.entry['accent']
                              alpha: 0.16
                              visible: self.parent.active
                              shape: ~round_rect
                              radius: 11
                              through: true
                          选中侧线:
                            type: Texture
                            attribute:
                              x: 3
                              y: 24
                              width: "self.parent.active ? 5 : (self.parent.isHovered() ? 4 : 3)"
                              height: 64
                              alpha: "self.parent.active ? 1 : (self.parent.isHovered() ? 0.72 : 0.42)"
                              normal: self.parent.entry['accent']
                              shape: ~round_rect
                              radius: 2
                              through: true
                            effect:
                              neon:
                                color: self.parent.entry['accent']
                                size: 9
                                intensity: 0.55
                                animated: false
                                visible: self.parent.active
                          图标底座:
                            type: Texture
                            attribute:
                              x: 24
                              y: 22
                              width: 68
                              height: 68
                              normal: self.parent.entry['accent']
                              alpha: "(self.parent.active || self.parent.isHovered()) ? 1 : 0.74"
                              shape: ~round_rect
                              radius: 14
                              through: true
                          图标:
                            type: Slot
                            attribute:
                              slotType: ~Icon
                              x: 32
                              y: 30
                              width: 52
                              height: 52
                              itemScale: 0.82
                              normal: ~0,0,0,0
                              visible: self.parent.entry['hasIcon']
                              through: true
                              seticon: "self.setItemIcon(var.iconJsons[self.parent.entryKey] != none ? var.iconJsons[self.parent.entryKey] : var.air)"
                          无图标序号:
                            type: Text
                            attribute:
                              x: 58
                              y: 44
                              center: true
                              texts: "'&0' + (self.parent.entryKey + 1).round()"
                              visible: "!self.parent.entry['hasIcon']"
                              fontSize: 48
                              through: true
                          标签:
                            type: Text
                            attribute:
                              x: 118
                              y: 25
                              texts: self.parent.entry['text']
                              fontSize: 54
                              limit: 24
                              alpha: "self.parent.entry['enabled'] ? 1 : 0.7"
                              through: true
                          简介:
                            type: Text
                            attribute:
                              x: 118
                              y: 66
                              texts: "'&f' + self.parent.entry['summary']"
                              fontSize: 36
                              limit: 34
                              alpha: "self.parent.active ? 0.94 : (self.parent.isHovered() ? 0.88 : 0.76)"
                              through: true
                          入口底座:
                            type: Texture
                            attribute:
                              point: ~middle_right
                              x: -22
                              width: 42
                              height: 42
                              normal: "self.parent.active ? self.parent.entry['accent'] : '48,72,97,255'"
                              shape: ~round_rect
                              radius: 10
                              through: true
                            effect:
                              stroke:
                                width: 3
                                color: "self.parent.active ? '255,255,255,60' : '88,116,142,180'"
                          入口标记:
                            type: Text
                            attribute:
                              point: ~middle_right
                              x: "self.parent.isHovered() ? -31 : -37"
                              texts: "self.parent.active ? '&0›' : '&f›'"
                              visible: self.parent.entry['enabled']
                              fontSize: 54
                              alpha: "(self.parent.active || self.parent.isHovered()) ? 1 : 0.78"
                              through: true
                          禁用标记:
                            type: Text
                            attribute:
                              point: ~middle_right
                              x: -35
                              texts: ~&7—
                              visible: "!self.parent.entry['enabled']"
                              fontSize: 36
                              through: true
                          禁用遮色:
                            type: Texture
                            attribute:
                              x: 3
                              y: 3
                              width: "self.parent.width - 6"
                              height: "self.parent.height - 6"
                              normal: ~13,22,35,130
                              visible: "!self.parent.entry['enabled']"
                              shape: ~round_rect
                              radius: 11
                              through: true
              按钮滑轨:
                type: Texture
                attribute:
                  x: "var.leftW - 55"
                  y: 304
                  width: 3
                  height: "var.viewH - 518"
                  normal: ~104,131,154,60
                  visible: "var.buttonCount * 124 - 12 > var.viewH - 518"
                  through: true
              按钮滑块:
                type: Texture
                val: button_slider
                attribute:
                  x: "var.leftW - 58"
                  y: 304
                  width: 9
                  height: 64
                  maxDragY: "var.viewH - 582"
                  normal: ~104,131,154,180
                  hover: ~233,200,139,255
                  shape: ~round_rect
                  radius: 4
                  visible: "var.buttonCount * 124 - 12 > var.viewH - 518"
              底部操作底幕:
                type: Texture
                attribute:
                  y: "var.viewH - 204"
                  width: "var.leftW"
                  height: 204
                  normal: ~19,32,49,255
                  through: true
              操作区顶线:
                type: Texture
                attribute:
                  x: 76
                  y: "var.viewH - 204"
                  width: "var.leftW - 152"
                  height: 1
                  normal: ~72,97,124,180
                  through: true
              翻页栏:
                type: Canvas
                attribute:
                  x: 76
                  y: "var.viewH - 182"
                  width: "var.leftW - 152"
                  height: 54
                children:
                  上一页按钮:
                    type: Canvas
                    attribute:
                      width: 150
                      height: 54
                      enable: var.hasPrev
                    action:
                      clickLeft: |-
                        Sound.self('minecraft:item.book.page_turn', 1.1, 18)
                        Packet.send(var.packetId, 'page', 'prev')
                    children:
                      上页底色:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: "var.hasPrev ? '49,76,105,255' : '27,41,59,255'"
                          hover: "var.hasPrev ? '65,98,130,255' : '27,41,59,255'"
                          shape: ~round_rect
                          radius: 8
                          through: true
                        effect:
                          stroke:
                            width: 3
                            color: "var.hasPrev ? (self.parent.isHovered() ? '150,185,214,255' : '104,139,172,255') : '49,66,85,255'"
                      上页文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: ~&f‹  上一页
                          fontSize: 36
                          alpha: "var.hasPrev ? 1 : 0.6"
                          through: true
                  页码:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f' + (var.pageIndex + 1).round() + '  &8/  &7' + var.pageCount.round()"
                      fontSize: 36
                      through: true
                  下一页按钮:
                    type: Canvas
                    attribute:
                      point: ~top_right
                      width: 150
                      height: 54
                      enable: var.hasNext
                    action:
                      clickLeft: |-
                        Sound.self('minecraft:item.book.page_turn', 1.1, 18)
                        Packet.send(var.packetId, 'page', 'next')
                    children:
                      下页底色:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: "var.hasNext ? '49,76,105,255' : '27,41,59,255'"
                          hover: "var.hasNext ? '65,98,130,255' : '27,41,59,255'"
                          shape: ~round_rect
                          radius: 8
                          through: true
                        effect:
                          stroke:
                            width: 3
                            color: "var.hasNext ? (self.parent.isHovered() ? '150,185,214,255' : '104,139,172,255') : '49,66,85,255'"
                      下页文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: ~&f下一页  ›
                          fontSize: 36
                          alpha: "var.hasNext ? 1 : 0.6"
                          through: true
              底部分界:
                type: Texture
                attribute:
                  x: 76
                  y: "var.viewH - 108"
                  width: "var.leftW - 152"
                  height: 1
                  normal: ~72,97,124,150
                  through: true
              页脚滚动区:
                type: Scroll
                attribute:
                  x: 76
                  y: "var.viewH - 84"
                  width: "var.leftW - 370"
                  height: 52
                  moveX: val.footer_slider.getDragXRatio()
                  visible: var.footerCount > 0
                action:
                  wheel: |-
                    ratio = self.moveX - self.wheelValue * 0.15
                    if(ratio < 0){ ratio = 0 }
                    if(ratio > 1){ ratio = 1 }
                    val.footer_slider.setDragXRatio(ratio)
                children:
                  页脚栏:
                    type: RepeatGrid
                    val: footer_rows
                    attribute:
                      items: "var.footer_rowsRows"
                      flow: ~column
                      row: 1
                      spaceBetweenX: 12
                      maxSize: 2147483647
                      height: 52
                    children:
                      页脚按钮:
                        type: Canvas
                        attribute:
                          entryKey: self.item
                          entry: var.footerRows[self.entryKey]
                          visible: self.entry != none
                          width: 212
                          height: 52
                        action:
                          enter: |-
                            var.pendingEntry = self.entry
                            var.pendingFooter = true
                            var.pendingAt = Time.currentTime()
                            Sound.self('minecraft:ui.button.click', 1.9, 6)
                          leave: |-
                            if(var.pendingFooter && var.pendingEntry['id'] == self.entry['id']){
                              var.pendingEntry = none
                            }
                          clickLeft: |-
                            var.pendingEntry = self.entry
                            var.pendingFooter = true
                            var.menuUi.actions['selectPreview']()
                            if(self.entry != none && self.entry['enabled']){
                              Sound.self('minecraft:ui.button.click', 1.1, 18)
                              if(self.entry['clientAction'] == 'options'){
                                Game.options()
                              } elif(self.entry['clientAction'] == 'quit'){
                                Game.quit()
                              } elif(var.actionToken != none && !var.actionBusy){
                                var.actionBusy = true
                                Packet.send(var.packetId, 'footer', var.actionToken, self.entry['id'])
                              }
                            }
                        children:
                          页脚底色:
                            type: Texture
                            attribute:
                              x: 2
                              y: 2
                              width: 208
                              height: 48
                              normal: "var.selectedFooter && var.selectedId == self.parent.entry['id'] ? '52,79,105,255' : '31,49,70,255'"
                              hover: ~56,83,109,255
                              shape: ~round_rect
                              radius: 8
                              through: true
                            effect:
                              stroke:
                                width: 3
                                color: "var.selectedFooter && var.selectedId == self.parent.entry['id'] ? self.parent.entry['accent'] : (self.parent.isHovered() ? '128,160,188,235' : '70,96,122,190')"
                          图标:
                            type: Slot
                            attribute:
                              slotType: ~Icon
                              x: 12
                              y: 10
                              width: 32
                              height: 32
                              itemScale: 0.5
                              normal: ~0,0,0,0
                              visible: self.parent.entry['hasIcon']
                              through: true
                              seticon: "self.setItemIcon(var.footerIconJsons[self.parent.entryKey] != none ? var.footerIconJsons[self.parent.entryKey] : var.air)"
                          禁用遮色:
                            type: Texture
                            attribute:
                              x: 8
                              y: 6
                              width: 40
                              height: 40
                              normal: ~13,22,35,140
                              visible: "!self.parent.entry['enabled']"
                              shape: ~round_rect
                              radius: 8
                              through: true
                          页脚文字:
                            type: Text
                            attribute:
                              x: "self.parent.entry['hasIcon'] ? 54 : 18"
                              y: 15
                              texts: self.parent.entry['text']
                              fontSize: 36
                              limit: 10
                              alpha: "self.parent.entry['enabled'] ? 1 : 0.4"
                              through: true
              页脚滑块:
                type: Texture
