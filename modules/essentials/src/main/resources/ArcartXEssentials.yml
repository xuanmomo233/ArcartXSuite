# 配置版本号（请勿手动修改）
config-version: 3
# ============================================================
#  ArcartXSuite - Essentials 模块配置
#  免费模块：玩家管理 / 传送系统 / 世界管理 / 安全管理
# ============================================================

debug: false

# ─── 命令简写别名 ───
# false：同名时优先使用 Essentials 简写；原命令仍可用其原有的命名空间前缀。
# true：保留已有的无前缀命令，冲突的 Essentials 简写使用 /arcartx-suite:<别名>。
command-conflict-protection: false

# 停用指定 /ess 子命令，关联的顶层简写也会停用。示例：[sudo, inv, weather]
disabled-actions: []

# 注册独立的顶层命令，转发到 /essentials <action>。
# 格式: 别名: action
# 别名不能包含空格或命名空间前缀，action 必须是 /essentials 的合法子命令。
command-aliases:
  fly: fly
  god: god
  gm: gamemode
  heal: heal
  feed: feed
  tp: tp
  top: top
  back: back
  home: home
  sethome: sethome
  delhome: delhome
  warp: warp
  setwarp: setwarp
  delwarp: delwarp
  spawn: spawn
  setspawn: setspawn
  tpa: tpa
  tptoggle: tptoggle
  tpcancel: tpcancel
  tpahere: tpahere
  tpaccept: tpaccept
  tpdeny: tpdeny
  tppos: tppos
  vanish: vanish
  afk: afk
  hat: hat
  repair: repair
  enderchest: enderchest
  workbench: workbench
  anvil: anvil
  trash: trash
  nick: nick
  seen: seen
  inv: inv
  sit: sit
  lay: lay
  speed: speed
  time: time
  weather: weather
  ban: ban
  tempban: tempban
  unban: unban
  mute: mute
  tempmute: tempmute
  unmute: unmute
  kick: kick
  warn: warn
  sudo: sudo
  unstuck: unstuck

# ─── Warp 传送点 ───
# 传送点统一保存在此处。/setwarp 和 /delwarp 会直接更新本节。
# /setwarp 更新现有点时会保留分组、权限和启用状态。enabled: false 会停用该点。
warps: {}
# warps:
#   hub:
#     world: world
#     x: 100.5
#     y: 70
#     z: -20.5
#     yaw: 90
#     pitch: 0
#     group: 主城
#     permission: ''
#     enabled: true

# ─── TPA 请求 ───
tpa:
  enabled: true
  cooldown-seconds: 5
  max-incoming: 5
  max-outgoing: 5

# ─── 脱困 ───
unstuck:
  enabled: true
  cooldown-seconds: 120
  warmup-seconds: 3
  combat-seconds: 15
  search-radius: 4
  vertical-range: 4
  only-when-stuck: true
  allowed-worlds: []
  blocked-worlds: []

# ─── 玩家管理 ───
player:
  # /speed fly reset 使用的速度 (1-10)
  default-fly-speed: 1
  # /speed walk reset 使用的速度 (1-10)
  default-walk-speed: 1
  # AFK 自动检测（秒），0 = 禁用
  afk-timeout: 300
  # AFK 后自动踢出（秒），0 = 不踢出
  afk-kick-timeout: 0
  # vanish 隐身时退出消息是否隐藏
  vanish-hide-quit-message: true
  # vanish 隐身时进入消息是否隐藏
  vanish-hide-join-message: true

# ─── 传送系统 ───
teleport:
  # TPA 请求超时（秒）
  tpa-timeout: 60
  # 传送前等待（秒），0 = 立即传送
  teleport-delay: 3
  # 传送等待期间移动是否取消传送
  cancel-on-move: true
  # 最大 Home 数量（默认值，可通过权限覆盖）
  max-homes: 3
  # /back 记录最大深度
  back-stack-size: 5
  # 传送安全检查（避免传送到方块内）
  safe-teleport: true

# ─── 出生点 ───
# 安装 Multiverse-Core 时：出生点的存储、死亡重生、新玩家进服全部由
# Multiverse 接管（/setspawn 会写入对应世界 worlds.yml 的 spawn-location），
# 本节配置不生效。
# 未安装时：由 Essentials 按本节配置自行接管。
spawn:
  # 玩家死亡后是否重生于 /setspawn 设置的出生点
  respawn-at-spawn: true
  # 玩家有床/重生锚时优先原版个人出生点，false = 强制服务器出生点
  respect-personal-spawn: true
  # 新玩家首次进服是否出生在出生点
  first-join-at-spawn: true

# ─── 世界管理 ───
world:
  # 允许 /time 和 /weather 的世界列表，空列表 = 所有世界
  allowed-worlds: []

# ─── 安全管理 ───
moderation:
  # 已知玩家可在离线时被封禁
  allow-offline-bans: true
  history-page-size: 10
  # 封禁消息
  ban-message: '&c你已被服务器封禁。\n&7原因: {reason}\n&7到期: {expiry}'
  # 踢出消息
  kick-message: '&c你已被踢出服务器。\n&7原因: {reason}'
  # 禁言消息（发给被禁言的玩家）
  mute-message: '&c你已被禁言，无法发送消息。\n&7到期: {expiry}'
  # 最大警告次数，达到后自动封禁（0 = 不自动封禁）
  max-warnings-before-ban: 5
  # 警告过期时间（天），0 = 永不过期
  warning-expire-days: 30
  # 封禁时是否记录玩家 IP 地址（false = 存 null，用于隐私合规/数据最小化场景）
  record-ban-ip: true

# ─── Sit/Lay ───
interaction:
  # 有 sit 权限时，空手右键点击楼梯坐下
  sit-on-stairs: true
  # 右键点击台阶自动坐下
  sit-on-slabs: false

# ─── 存储 ───
storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "essentials.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: 4
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_ess_"

