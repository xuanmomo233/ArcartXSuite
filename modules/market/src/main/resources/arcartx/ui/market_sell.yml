# AXS Market — 物品上架界面
# 打开方式: /market sell 或导航跳转
# 布局: 上架工作台 — 01选货 / 02定价 / 03核对；背包与价格区共用左列
# 配色: 暖象牙纸面 + 森林绿柜台 + 黄铜选中态
# 数据交互: packetHandler update

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: update
    update: |-
      var.auctionCurrencies = packet['auctionCurrencies']
      var.auctionMaxCurrencyCount = packet['auctionMaxCurrencyCount']
      var.auctionDefaultCurrency = packet['auctionDefaultCurrency']
      var.auctionPriceMin = packet['auctionPriceMin']
      var.auctionPriceMax = packet['auctionPriceMax']
      var.auctionMessageMaxLength = packet['auctionMessageMaxLength']
      var.auctionEnabled = packet['auctionEnabled']
      var.pshopCurrencies = packet['pshopCurrencies']
      var.pshopMaxCurrencyCount = packet['pshopMaxCurrencyCount']
      var.pshopDefaultCurrency = packet['pshopDefaultCurrency']
      var.pshopPriceMin = packet['pshopPriceMin']
      var.pshopPriceMax = packet['pshopPriceMax']
      var.pshopMessageMaxLength = packet['pshopMessageMaxLength']
      var.pshopEnabled = packet['pshopEnabled']
      var.actionToken = packet['action_token']
      var.syncMode()
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.maxCurrencyCount = 0
      var.messageMaxLength = 50
      var.packetId = 'AXS_MARKET'
      var.priceMax = 1000000000
      var.priceMin = 1
      var.selectedItemAmount = 0
      var.selectedMode = 'auction'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.selectedDuration = 86400
      var.selectedItemJson = var.emptyItemJson
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.syncMode = -> {
        oldMaxCurrencyCount = var.maxCurrencyCount
        if(var.selectedMode == 'auction'){
          var.activeCurrencies = var.auctionCurrencies
          var.maxCurrencyCount = var.auctionMaxCurrencyCount
          var.selectedCurrency = var.auctionDefaultCurrency
          var.priceMin = var.auctionPriceMin
          var.priceMax = var.auctionPriceMax
          var.messageMaxLength = var.auctionMessageMaxLength
        } else {
          var.activeCurrencies = var.pshopCurrencies
          var.maxCurrencyCount = var.pshopMaxCurrencyCount
          var.selectedCurrency = var.pshopDefaultCurrency
          var.priceMin = var.pshopPriceMin
          var.priceMax = var.pshopPriceMax
          var.messageMaxLength = var.pshopMessageMaxLength
        }
        if(var.maxCurrencyCount != oldMaxCurrencyCount){
          while(val.货币列表.childrenCount() > 1){
            val.货币列表.get(1).remove()
          }
          if(var.maxCurrencyCount > 1){
            for(i in range(1, var.maxCurrencyCount - 1)){
              key = i.round()
              if(val.货币列表['货币项'] != none) {
                e = val.货币列表['货币项'].copy('货币项' + key)
                e.entryKey = key
              }
            }
          }
        }
      }
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.sellInfoW = 510
      var.sellLeftW = var.contentW - 72 - var.sellInfoW
      var.backpackH = 432
    open: |-
      Packet.send(var.packetId, 'sell_open')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.sellInfoW = 510
      var.sellLeftW = var.contentW - 72 - var.sellInfoW
      var.backpackH = 432

