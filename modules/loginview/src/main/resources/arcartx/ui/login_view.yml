                children:
                  滑轨:
                    type: Texture
                    attribute: {x: 1082, y: 0, width: 10, height: 444, normal: '~60,74,87,255', shape: ~round_rect, radius: 5, through: true}
                  纵向滑块:
                    type: Texture
                    attribute: {x: 1082, y: 0, width: 10, height: 96, normal: '~224,184,100,255', maxDragY: 348, shape: ~round_rect, radius: 5}
                  服规滚动栏:
                    type: Scroll
                    attribute: {x: 0, y: 0, width: 1056, height: 444, moveY: "self.parent['纵向滑块'].getDragYRatio()"}
                    action:
                      wheel: |-
                        if(self.moveY >= 0){
                          if(self.wheelValue > 0){
                            self.parent['纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                          }
                        }
                        if(self.moveY <= 1){
                          if(self.wheelValue < 0){
                            self.parent['纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                          }
                        }
                    children:
                      服规内容区:
                        type: VStack
