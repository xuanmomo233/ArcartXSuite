# ── 全球市场 · 拍卖行上架 ─────────────────────────────────────
# 背包选择、上架参数填写及确认提交。

ui:
  isHud: false
  itemSize: 16
  through: false
  escClose: true
  background: false
  closeDied: true
  show: true
  jei: false
  level: 8
  screenScale: true
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.packetId = 'AXS_MARKET'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.selectedSlot = none
      var.selectedPrice = none
      var.selectedMessage = none
      var.selectedDuration = 86400
      var.selectedCurrency = none
      var.priceMin = 1
      var.priceMax = 1000000000
      var.messageMaxLength = 50
      var.selectedItemName = none
      var.selectedItemAmount = 0
      var.selectedItemLore = none
      var.selectedItemJson = none
      var.currencies = {}
      var.maxCurrencyCount = 0
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
    open: "Packet.send(var.packetId, 'auction_sell_open')"
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.currencies = packet['currencies']
      var.maxCurrencyCount = packet['maxCurrencyCount']
      var.selectedCurrency = packet['defaultCurrency']
      var.priceMin = packet['priceMin']
      var.priceMax = packet['priceMax']
      var.messageMaxLength = packet['messageMaxLength']
      var.actionToken = packet['action_token']
      
      while(val.货币列表.childrenCount() > 1){
        val.货币列表.get(1).remove()
      }
      for(i in range(1, var.maxCurrencyCount - 1)){
        key = i.round()
        e = val.货币列表['货币项'].copy('货币项' + key)
        e.entryKey = key
      }
      var.actionBusy = false
    update: |-
      var.currencies = packet['currencies']
      var.maxCurrencyCount = packet['maxCurrencyCount']
      var.selectedCurrency = packet['defaultCurrency']
      var.priceMin = packet['priceMin']
      var.priceMax = packet['priceMax']
      var.messageMaxLength = packet['messageMaxLength']
      var.actionToken = packet['action_token']
      
      while(val.货币列表.childrenCount() > 1){
        val.货币列表.get(1).remove()
      }
      for(i in range(1, var.maxCurrencyCount - 1)){
        key = i.round()
        e = val.货币列表['货币项'].copy('货币项' + key)
        e.entryKey = key
      }
      var.actionBusy = false
  defaultOpen: false
controls:
  自适应总布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 0
          y: 0
          width: 1440
          height: 880
        children:
          主面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~28,30,42,244
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~90,170,255,150
              shadow:
                xOffset: 0
                yOffset: 4
                blur: 12
                color: ~0,0,0,140
          标题:
            type: Text
            attribute:
              x: 42
              y: 28
              texts: ~&f物品上架
              fontSize: 100
              through: true
          关闭按钮:
            type: Texture
            attribute:
              x: 1368
              y: 28
              width: 48
              height: 48
              normal: ~180,70,70,210
              hover: "~Frosted:0;220,90,90,230"
              shape: ~round_rect
              radius: 12
            action:
              clickLeft: Screen.close()
            effect:
              stroke:
                width: 1
                color: ~255,130,130,120
            children:
              文字:
                type: Text
                attribute:
                  x: 24
                  y: 9
                  through: true
                  center: true
                  fontSize: 48
                  texts: ~&f✕
          # ── 左上：背包面板 ──────────────────────────
          背包面板:
            type: Canvas
            attribute:
              x: 40
              y: 100
              width: 800
              height: 460
            children:
              背包面板背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~42,45,58,220
                  shape: ~round_rect
                  radius: 18
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,50
              背包标题:
                type: Text
                attribute:
                  x: 24
                  y: 20
                  texts: ~&f选择背包物品
                  fontSize: 48
                  through: true
              背包说明:
                type: Text
                attribute:
                  x: 24
                  y: 64
                  texts: ~&7点击物品选择，再次点击取消
                  fontSize: 36
                  through: true
              背包网格:
                type: HGrid
                val: 背包网格
                attribute:
                  x: 20
                  y: 100
                  width: 760
                  height: 350
                  column: 9
                  spaceBetweenX: 14
                  spaceBetweenY: 14
                action:
                  create: |-
                    for(i in range(1, 35)){
                      slot = self['背包槽'].copy('背包槽' + i)
                      slot.entryKey = (9 + i).round()
                      slot.id = 9 + i
                    }
                children:
                  背包槽:
                    type: Slot
                    attribute:
                      id: 9
                      entryKey: 9.round()
                      slotType: ~Backpack
                      itemScale: 0.74
                      width: 72
                      height: 72
                      through: false
                      lock: true
                      normal: "self.entryKey == var.selectedSlot ? '70,150,250,255' : '42,45,56,230'"
                      hover: "~Frosted:0;255,255,255,80"
                      shape: ~round_rect
                      radius: 12
                    action:
                      clickLeft: |-
                        item = self.getSlotItemStack()
                        if(item != none && item.getType() != 'null' && item.getCount() > 0){
                          if(var.selectedSlot == self.entryKey){
                            var.selectedSlot = none
                            var.selectedItemName = none
                            var.selectedItemAmount = 0
                            var.selectedItemLore = none
                            var.selectedItemJson = none
                          } else {
                            var.selectedSlot = self.entryKey
                            var.selectedItemName = item.getName()
                            var.selectedItemAmount = item.getCount()
                            var.selectedItemLore = item.getLore()
                            var.selectedItemJson = item.toJson()
                          }
                          preview = val.信息面板['预览槽']
                          if(preview != none){
                            preview.seticon()
                          }
                          loreList = val.信息面板['介绍滚动']['介绍列表']
                          if(loreList != none){
                            while(loreList.childrenCount() > 1){
                              loreList.get(1).remove()
                            }
                            if(var.selectedSlot != none && var.selectedItemLore != none){
                              loreCount = var.selectedItemLore.length
                              for(i in range(1, loreCount)){
                                e = loreList['介绍行'].copy('介绍行' + i.round())
                                e.entryKey = i.round()
                              }
                            }
                          }
                        }
                    effect:
                      stroke:
                        width: 2
                        color: ~0,0,0,120
          # ── 右上：信息面板（上架信息+物品描述）──────────
          信息面板:
            type: Canvas
            val: 信息面板
            attribute:
              x: 860
              y: 100
              width: 560
              height: 460
            children:
              信息面板背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~42,45,58,220
                  shape: ~round_rect
                  radius: 18
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,50
              信息标题:
                type: Text
                attribute:
                  x: 24
                  y: 20
                  texts: ~&f上架信息
                  fontSize: 36
                  through: true
              标题分隔线:
                type: Texture
                attribute:
                  x: 24
                  y: 68
                  width: 512
                  height: 2
                  normal: ~90,170,255,40
                  through: true
              预览槽:
                type: Slot
                attribute:
                  slotType: ~Icon
                  itemScale: 0.8
                  x: 24
                  y: 84
                  width: 82
                  height: 82
                  normal: ~40,42,54,220
                  shape: ~round_rect
                  radius: 12
                  through: true
                  seticon: "var.selectedSlot != none ? self.setItemIcon(var.selectedItemJson) : self.setItemIcon(var.emptyItemJson)"
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,60
              预览物品名:
                type: Text
                attribute:
                  x: 124
                  y: 92
                  width: 410
                  texts: "var.selectedSlot != none && var.selectedItemName != none ? '&f' + var.selectedItemName : '&7未选择物品'"
                  fontSize: 30
                  through: true
              预览分隔线:
                type: Texture
                attribute:
                  x: 24
                  y: 186
                  width: 512
                  height: 2
                  normal: ~90,170,255,40
                  through: true
              介绍标签:
                type: Text
                attribute:
                  x: 24
                  y: 202
                  texts: ~&f物品介绍
                  fontSize: 30
                  through: true
              介绍滚动:
                type: Scroll
                val: 介绍滚动
                attribute:
                  x: 24
                  y: 234
                  width: 512
                  height: 200
                  moveY: "self.parent['介绍滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['介绍滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['介绍滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  介绍列表:
                    type: VStack
                    val: 介绍列表
                    attribute:
                      width: 490
                      spaceBetween: 4
                    children:
                      介绍行:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          entry: "var.selectedSlot != none && var.selectedItemLore != none ? var.selectedItemLore[self.entryKey] : none"
                          visible: self.entry != none
                          texts: "'&f' + self.entry"
                          fontSize: 24
                          through: true
              介绍滑块:
                type: Texture
                val: 介绍滑块
                attribute:
                  x: 524
                  y: 234
                  width: 6
                  height: 40
                  normal: ~120,120,120,200
                  maxDragY: 160
              介绍空提示:
                type: Text
                attribute:
                  point: ~middle_center
                  x: 0
                  y: 90
                  center: false
                  fontSize: 64
                  visible: "var.selectedSlot == none || var.selectedItemLore == none || var.selectedItemLore.length == 0"
                  texts: ~&8暂无介绍
                  through: true
          # ── 底部横跨：设置面板（价格+留言+货币+时长+按钮）──
          设置面板:
            type: Canvas
            val: 设置面板
            attribute:
              x: 40
              y: 570
              width: 1380
              height: 270
            children:
              设置面板背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~42,45,58,220
                  shape: ~round_rect
                  radius: 18
                effect:
                  stroke:
                    width: 2
                    color: ~90,170,255,50
              # 左列：价格 + 留言
              价格标签:
                type: Text
                attribute:
                  x: 24
                  y: 20
                  texts: ~&f起拍价格
                  fontSize: 30
                  through: true
              价格输入框:
                type: TextBox
                attribute:
                  x: 24
                  y: 52
                  width: 400
                  height: 48
                  length: 12
                  emptyText: ~输入起拍价格...
                  fontSize: 28
                  background: ~56,58,70,220
                  shape: ~round_rect
                  radius: 10
                action:
                  textChange: var.selectedPrice = self.getContent()
                effect:
                  stroke:
                    width: 1
                    color: ~90,170,255,50
              价格状态:
                type: Text
                attribute:
                  x: 440
                  y: 62
                  width: 200
                  texts: "var.selectedPrice == none || var.selectedPrice == '' ? '&c请输入价格' : '&a价格已填写'"
                  fontSize: 28
                  through: true
              留言标签:
                type: Text
                attribute:
                  x: 24
                  y: 110
                  texts: ~&f物品留言
                  fontSize: 30
                  through: true
              留言输入框:
                type: TextBox
                attribute:
                  x: 24
                  y: 142
                  width: 560
                  height: 48
                  length: 50
                  emptyText: ~输入物品留言（可选）...
                  fontSize: 28
                  background: ~56,58,70,220
                  shape: ~round_rect
                  radius: 10
                action:
                  textChange: var.selectedMessage = self.getContent()
                effect:
                  stroke:
                    width: 1
                    color: ~90,170,255,50
              留言长度提示:
                type: Text
                attribute:
                  x: 24
                  y: 200
                  texts: "'&7最多 ' + var.messageMaxLength.round() + ' 字符'"
                  fontSize: 20
                  through: true
              留言状态:
                type: Text
                attribute:
                  x: 300
                  y: 200
                  width: 284
                  texts: "var.selectedMessage == none || var.selectedMessage == '' ? '&7可选留言' : '&a留言已填写'"
                  fontSize: 20
                  through: true
              # 中列：结算货币
              货币标签:
                type: Text
                attribute:
                  x: 640
                  y: 20
                  texts: ~&f结算货币
                  fontSize: 30
                  through: true
              货币滑块:
                type: Texture
                val: 货币滑块
                attribute:
                  x: 886
                  y: 52
                  width: 6
                  height: 40
                  normal: ~120,120,120,200
                  maxDragY: 80
              货币滚动:
                type: Scroll
                val: 货币滚动
                attribute:
                  x: 640
                  y: 52
                  width: 240
                  height: 120
                  moveY: "self.parent['货币滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['货币滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['货币滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  货币列表:
                    type: VStack
                    val: 货币列表
                    attribute:
                      width: 240
                      spaceBetween: 6
                    children:
                      货币项:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.currencies[self.entryKey]
                          visible: self.entry != none
                          width: 240
                          height: 38
                        action:
                          clickLeft: |-
                            if(self.entry != none){
                              var.selectedCurrency = self.entry['id']
                            }
                        children:
                          货币项背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.entry != none && self.parent.entry['id'] == var.selectedCurrency ? '70,150,250,230' : '56,58,70,200'"
                              hover: "~Frosted:0;255,255,255,80"
                              shape: ~round_rect
                              radius: 10
                            effect:
                              stroke:
                                width: 1
                                color: ~90,170,255,50
                          货币项文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 240
                              texts: "self.parent.entry != none ? self.parent.entry['name'] : ''"
                              fontSize: 24
                              through: true
              # 右列：上架时长 + 按钮
              时长标签:
                type: Text
                attribute:
                  x: 920
                  y: 20
                  texts: ~&f上架时长
                  fontSize: 30
                  through: true
              时长1天:
                type: Canvas
                attribute:
                  x: 920
                  y: 52
                  width: 74
                  height: 40
                action:
                  clickLeft: var.selectedDuration = 86400
                children:
                  时长1天背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.selectedDuration == 86400 ? '70,150,250,230' : '56,58,70,200'"
                      hover: "~Frosted:0;255,255,255,80"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 1
                        color: ~90,170,255,70
                  时长1天文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 74
                      texts: ~&f1天
                      fontSize: 24
                      through: true
              时长3天:
                type: Canvas
                attribute:
                  x: 1002
                  y: 52
                  width: 74
                  height: 40
                action:
                  clickLeft: var.selectedDuration = 259200
                children:
                  时长3天背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.selectedDuration == 259200 ? '70,150,250,230' : '56,58,70,200'"
                      hover: "~Frosted:0;255,255,255,80"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 1
                        color: ~90,170,255,70
                  时长3天文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 74
                      texts: ~&f3天
                      fontSize: 24
                      through: true
              时长7天:
                type: Canvas
                attribute:
                  x: 1084
                  y: 52
                  width: 74
                  height: 40
                action:
                  clickLeft: var.selectedDuration = 604800
                children:
                  时长7天背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.selectedDuration == 604800 ? '70,150,250,230' : '56,58,70,200'"
                      hover: "~Frosted:0;255,255,255,80"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 1
                        color: ~90,170,255,70
                  时长7天文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 74
                      texts: ~&f7天
                      fontSize: 24
                      through: true
              时长说明:
                type: Text
                attribute:
                  x: 920
                  y: 104
                  width: 236
                  texts: ~&7选择拍卖持续时间
                  fontSize: 20
                  through: true
              操作提示:
                type: Text
                attribute:
                  x: 24
                  y: 230
                  texts: ~&7填写价格和留言后，在右侧确认上架
                  fontSize: 20
                  through: true
              返回按钮:
                type: Canvas
                attribute:
                  x: 920
                  y: 150
                  width: 150
                  height: 56
                action:
                  clickLeft: |-
                    Screen.open("AXS:market_auction")
                children:
                  返回背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~56,58,70,220
                      hover: "~Frosted:0;255,255,255,80"
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~90,170,255,70
                  返回文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 150
                      texts: ~&f返回
                      fontSize: 42
                      through: true
              确认上架按钮:
                type: Canvas
                attribute:
                  x: 1090
                  y: 150
                  width: 266
                  height: 56
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    if(var.selectedSlot != none && var.selectedPrice != none && var.selectedPrice != ''){
                      msg = var.selectedMessage == none ? '' : var.selectedMessage
                      var.actionBusy = true
                      Packet.send(var.packetId, 'auction_list_create', var.selectedSlot, var.selectedPrice, msg, var.selectedDuration.round(), var.selectedCurrency, var.actionToken)
                    }
                children:
                  确认上架背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.selectedSlot != none && var.selectedPrice != none && var.selectedPrice != '' ? '60,180,100,200' : '75,75,85,150'"
                      hover: "var.selectedSlot != none && var.selectedPrice != none && var.selectedPrice != '' ? 'Frosted:0;80,220,120,230' : 'Frosted:0;105,105,115,180'"
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~80,255,140,120
                  确认上架文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 266
                      texts: ~&f确认上架
                      fontSize: 42
                      through: true
