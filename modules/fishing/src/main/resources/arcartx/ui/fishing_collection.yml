# AXS 钓鱼图鉴界面
# 打开方式: /fishing
# 数据交互: packetHandler init/update
# 海洋主题 + 标签页分类（全部/普通/罕见/稀有/传说）+ 4列网格卡片
# 每张卡片展示：鱼图标(Slot Icon)、鱼名(稀有度着色)、稀有度标签、捕获次数、最大尺寸

ui:
  isHud: false  # 非HUD模式，打开时显示鼠标光标
  background: true  # 渲染半透明背景遮罩
  escClose: true  # 按ESC键可关闭界面
  closeDied: true  # 玩家死亡时自动关闭界面
  through: false  # 不允许点击穿透到下层
  screenScale: true  # 启用屏幕等比缩放
  show: true  # 界面默认可见
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包标识符
    #   - playerLevel: 玩家当前钓鱼等级
    #   - totalXp: 玩家累计钓鱼经验值
    #   - totalCaught: 玩家累计捕获鱼的总数
    #   - collectionCount: 已收集图鉴条目数
    #   - totalFishTypes: 鱼种总数
    #   - collectionPercent: 图鉴完成百分比
    #   - fishList: 鱼类列表字典，每项含 id/name/rarity/caught/maxSize/count
    #   - maxFishCount: 鱼类列表最大条目数
    #   - fishIconJson{idx}: 每条鱼的物品图标 JSON（分离模式，参考 market_shop）
    init: |-
      var.packetId = packet['packetId']
      var.playerLevel = packet['playerLevel']
      var.totalXp = packet['totalXp']
      var.totalCaught = packet['totalCaught']
      var.collectionCount = packet['collectionCount']
      var.totalFishTypes = packet['totalFishTypes']
      var.collectionPercent = packet['collectionPercent']
      var.fishList = packet['fishList']
      var.maxFishCount = packet['maxFishCount']
      var.itemJsons = {}
      if(var.fishList != none){
        for(key in var.fishList.keys()){
          json = packet['fishIconJson' + key]
          if(json != none && json != ''){
            var.itemJsons[key] = json
          } else {
            var.itemJsons[key] = var.emptyItemJson
          }
        }
      }
      var.needRebuild = true
    # packetHandler: update
    # 包字段: 同 init
    update: |-
      var.packetId = packet['packetId']
      var.playerLevel = packet['playerLevel']
      var.totalXp = packet['totalXp']
      var.totalCaught = packet['totalCaught']
      var.collectionCount = packet['collectionCount']
      var.totalFishTypes = packet['totalFishTypes']
      var.collectionPercent = packet['collectionPercent']
      var.fishList = packet['fishList']
      var.maxFishCount = packet['maxFishCount']
      var.itemJsons = {}
      if(var.fishList != none){
        for(key in var.fishList.keys()){
          json = packet['fishIconJson' + key]
          if(json != none && json != ''){
            var.itemJsons[key] = json
          } else {
            var.itemJsons[key] = var.emptyItemJson
          }
        }
      }
      var.needRebuild = true
  action:
    # open: 界面打开时的默认初始化变量（等待服务端数据包覆盖）
    open: |-
      var.packetId = 'AXS_FISHING'
      var.playerLevel = 1
      var.totalXp = 0
      var.totalCaught = 0
      var.collectionCount = 0
      var.totalFishTypes = 0
      var.collectionPercent = 0
      var.fishList = {}
      var.maxFishCount = 0
      var.itemJsons = {}
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.currentTab = 'all'
      var.needRebuild = false
    # tick: 每帧检查是否需要重建网格（标签切换或数据更新时触发）
    tick: |-
      if(var.needRebuild){
        var.needRebuild = false
        while(val.鱼类网格.childrenCount() > 1){
          val.鱼类网格.get(1).remove()
        }
        if(var.maxFishCount > 0){
          for(i in range(0, var.maxFishCount - 1)){
            idx = i.round()
            entry = var.fishList[idx]
            if(entry != none && (var.currentTab == 'all' || entry['rarity'] == var.currentTab)){
              e = val.鱼类网格['鱼卡片'].copy('鱼卡片' + idx)
              e.entryKey = idx
              if(e['图标'] != none){
                e['图标'].seticon()
              }
            }
          }
        }
      }

controls:
  # 自适应全局布局：以1920x1080设计分辨率等比缩放整个界面
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1100
          height: 680
        children:
          # 背景：深海蓝圆角面板
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,28,45,245
              shape: ~round_rect
              radius: 20
            effect:
              stroke:
                width: 2
                color: ~50,160,190,100
              shadow:
                xOffset: 0
                yOffset: 4
                blur: 12
                color: ~0,0,0,140

          # 顶部装饰条：面板顶部海浪色高亮线
          顶部装饰条:
            type: Texture
            attribute:
              x: 20
              y: 0
              width: 1060
              height: 3
              normal: ~50,160,190,80
              shape: ~round_rect
              radius: 2

          # 标题：界面顶部"钓鱼图鉴"文字
          标题:
            type: Text
            attribute:
              x: 36
              y: 22
              texts: "~&b⚓ &f&l钓鱼图鉴"
              fontSize: 40

          # 标题装饰线
          标题装饰线:
            type: Texture
            attribute:
              x: 36
              y: 68
              width: 140
              height: 2
              normal: ~50,160,190,120
              shape: ~round_rect
              radius: 1

          # 关闭按钮：右上角珊瑚红X按钮，点击关闭界面
          关闭按钮:
            type: Texture
            attribute:
              x: 1020
              y: 18
              width: 52
              height: 52
              normal: ~200,70,70,210
              hover: ~Frosted:0;230,90,90,240
              shape: ~round_rect
              radius: 12
            action:
              clickLeft: |-
                Screen.close()
            effect:
              stroke:
                width: 2
                color: ~255,120,120,100
            children:
              文字:
                type: Text
                attribute:
                  x: 26
                  y: 12
                  through: true
                  center: true
                  fontSize: 30
                  texts: "~&f✕"

          # 统计信息栏：展示玩家等级、经验、捕获数、图鉴进度
          统计栏:
            type: Canvas
            attribute:
              x: 36
              y: 84
              width: 1028
              height: 60
            children:
              统计背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~22,38,54,190
                  shape: ~round_rect
                  radius: 12
              等级文本:
                type: Text
                attribute:
                  x: 20
                  y: 6
                  texts: "'&b⚓ &fLv.' + var.playerLevel"
                  fontSize: 28
              经验文本:
                type: Text
                attribute:
                  x: 20
                  y: 36
                  texts: "'&7经验: &f' + var.totalXp"
                  fontSize: 18
              捕获统计:
                type: Text
                attribute:
                  x: 280
                  y: 6
                  texts: "'&7捕获: &f' + var.totalCaught + ' 条'"
                  fontSize: 24
              图鉴进度文本:
                type: Text
                attribute:
                  x: 280
                  y: 36
                  texts: "'&7图鉴: &f' + var.collectionCount + '/' + var.totalFishTypes + ' &7(' + var.collectionPercent + '%)'"
                  fontSize: 18
              # 图鉴完成度进度条
              进度条背景:
                type: Texture
                attribute:
                  x: 580
                  y: 14
                  width: 420
                  height: 28
                  normal: ~15,25,38,220
                  shape: ~round_rect
                  radius: 10
              进度条填充:
                type: Texture
                attribute:
                  x: 583
                  y: 17
                  width: "var.collectionPercent * 4.14"
                  height: 22
                  normal: ~50,170,200,240
                  shape: ~round_rect
                  radius: 8
              进度百分比:
                type: Text
                attribute:
                  x: 790
                  y: 18
                  texts: "'&f' + var.collectionPercent + '%'"
                  fontSize: 18
                  center: true
                  through: true

          # 标签栏：全部/普通/罕见/稀有/传说
          标签栏:
            type: HStack
            attribute:
              x: 55
              y: 156
              spaceBetween: 10
            children:
              标签_全部:
                type: Canvas
                attribute:
                  width: 190
                  height: 44
                action:
                  clickLeft: |-
                    var.currentTab = 'all'
                    var.needRebuild = true
                children:
                  标签_全部背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.currentTab == 'all' ? '35,110,135,230' : '25,40,55,210'"
                      shape: ~round_rect
                      radius: 10
                  标签_全部文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 190
                      through: true
                      texts: "var.currentTab == 'all' ? '&f&l全部' : '&7全部'"
                      fontSize: 22
              标签_普通:
                type: Canvas
                attribute:
                  width: 190
                  height: 44
                action:
                  clickLeft: |-
                    var.currentTab = 'common'
                    var.needRebuild = true
                children:
                  标签_普通背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.currentTab == 'common' ? '35,110,135,230' : '25,40,55,210'"
                      shape: ~round_rect
                      radius: 10
                  标签_普通文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 190
                      through: true
                      texts: "var.currentTab == 'common' ? '&f&l普通' : '&7普通'"
                      fontSize: 22
              标签_罕见:
                type: Canvas
                attribute:
                  width: 190
                  height: 44
                action:
                  clickLeft: |-
                    var.currentTab = 'uncommon'
                    var.needRebuild = true
                children:
                  标签_罕见背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.currentTab == 'uncommon' ? '35,110,135,230' : '25,40,55,210'"
                      shape: ~round_rect
                      radius: 10
                  标签_罕见文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 190
                      through: true
                      texts: "var.currentTab == 'uncommon' ? '&a&l罕见' : '&7罕见'"
                      fontSize: 22
              标签_稀有:
                type: Canvas
                attribute:
                  width: 190
                  height: 44
                action:
                  clickLeft: |-
                    var.currentTab = 'rare'
                    var.needRebuild = true
                children:
                  标签_稀有背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.currentTab == 'rare' ? '35,110,135,230' : '25,40,55,210'"
                      shape: ~round_rect
                      radius: 10
                  标签_稀有文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 190
                      through: true
                      texts: "var.currentTab == 'rare' ? '&9&l稀有' : '&7稀有'"
                      fontSize: 22
              标签_传说:
                type: Canvas
                attribute:
                  width: 190
                  height: 44
                action:
                  clickLeft: |-
                    var.currentTab = 'legendary'
                    var.needRebuild = true
                children:
                  标签_传说背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.currentTab == 'legendary' ? '35,110,135,230' : '25,40,55,210'"
                      shape: ~round_rect
                      radius: 10
                  标签_传说文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 190
                      through: true
                      texts: "var.currentTab == 'legendary' ? '&6&l传说' : '&7传说'"
                      fontSize: 22

          # 图鉴滑块：右侧滚动条滑块
          图鉴滑块:
            type: Texture
            val: 图鉴滑块
            attribute:
              x: 1064
              y: 214
              width: 6
              height: 50
              normal: ~80,160,190,200
              maxDragY: 380

          # 滚动区：可滚动的鱼类网格容器
          滚动区:
            type: Scroll
            attribute:
              x: 36
              y: 214
              width: 1028
              height: 440
              moveY: "self.parent['图鉴滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['图鉴滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['图鉴滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              # 鱼类网格：4列网格布局
              鱼类网格:
                val: 鱼类网格
                type: HGrid
                attribute:
                  width: 1028
                  column: 4
                  spaceBetweenX: 12
                  spaceBetweenY: 12
                children:
                  # 鱼卡片模板：单条鱼类信息卡片
                  # entryKey=-1 确保模板不匹配任何鱼（visible=false），仅作为 copy 模板
                  鱼卡片:
                    type: Texture
                    attribute:
                      entryKey: -1
                      entry: var.fishList[self.entryKey]
                      visible: self.entry != none
                      width: 245
                      height: 110
                      normal: "self.entry != none && self.entry['caught'] ? '28,52,48,215' : '26,34,46,200'"
                      shape: ~round_rect
                      radius: 10
                      rarityTag: "self.entry != none ? (self.entry['rarity'] == 'legendary' ? '&6' : (self.entry['rarity'] == 'rare' ? '&9' : (self.entry['rarity'] == 'uncommon' ? '&a' : '&f'))) : '&7'"
                      rarityLabel: "self.entry != none ? (self.entry['rarity'] == 'legendary' ? '传说' : (self.entry['rarity'] == 'rare' ? '稀有' : (self.entry['rarity'] == 'uncommon' ? '罕见' : '普通'))) : ''"
                    effect:
                      stroke:
                        width: 1
                        color: "self.entry != none && self.entry['caught'] ? '80,200,180,80' : '70,80,95,60'"
                    children:
                      # 鱼物品图标
                      图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 0.85
                          x: 10
                          y: 19
                          width: 72
                          height: 72
                          normal: ~18,28,40,180
                          shape: ~round_rect
                          radius: 8
                          through: true
                          seticon: "self.setItemIcon(var.itemJsons[self.parent.entryKey])"
                      # 未捕获遮罩：暗色覆盖+问号
                      未捕获遮罩:
                        type: Texture
                        attribute:
                          x: 10
                          y: 19
                          width: 72
                          height: 72
                          normal: ~10,15,25,180
                          shape: ~round_rect
                          radius: 8
                          through: true
                          visible: "self.parent.entry != none && !self.parent.entry['caught']"
                        children:
                          问号:
                            type: Text
                            attribute:
                              x: 36
                              y: 14
                              texts: "~&7?"
                              fontSize: 40
                              center: true
                              through: true
                      # 鱼名（稀有度着色）
                      鱼名:
                        type: Text
                        attribute:
                          x: 92
                          y: 8
                          texts: "self.parent.entry != none ? (self.parent.rarityTag + self.parent.entry['name']) : none"
                          fontSize: 24
                          through: true
                      # 稀有度标签
                      稀有度:
                        type: Text
                        attribute:
                          x: 92
                          y: 36
                          texts: "self.parent.entry != none ? (self.parent.rarityTag + '◆ ' + self.parent.rarityLabel) : none"
                          fontSize: 18
                          through: true
                      # 捕获次数
                      捕获次数:
                        type: Text
                        attribute:
                          x: 92
                          y: 58
                          texts: "self.parent.entry != none && self.parent.entry['caught'] ? ('&7捕获: &f' + self.parent.entry['count'] + ' 次') : '&7未捕获'"
                          fontSize: 18
                          through: true
                      # 最大尺寸
                      最大尺寸:
                        type: Text
                        attribute:
                          x: 92
                          y: 80
                          texts: "self.parent.entry != none && self.parent.entry['caught'] ? ('&7最大: &f' + self.parent.entry['maxSize']) : none"
                          fontSize: 16
                          through: true
