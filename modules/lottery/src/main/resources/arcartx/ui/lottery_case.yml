# 文件用途: CS 开箱风格抽奖界面（AXS:lottery_case）的客户端 UI 配置。
# 本文件只负责渲染与交互回传，抽奖逻辑、消耗校验、奖励发放全部在服务端。
# 界面结构: 全屏 Frosted 毛玻璃背景 -> 顶部标题/奖池信息 -> 居中单图箱子 -> 横向奖池预览 -> 底部消耗与操作栏 + 结果/历史/详情弹层。
# 开箱流程为「包驱动」: 点击只发请求并进入等待态，result / batch_result 到达后才揭晓。
# 视觉目标: UI 元素直接浮在模糊游戏场景上，不使用暗色大面板或手绘箱体条纹。

# 若服务端只回 update（消耗不足等失败情形），等待态会被自动解除，界面不会卡死。
ui:
  match:
    - "AXS:lottery_case"  # 匹配的界面 ID
  isHud: false  # 非 HUD，为弹出式菜单界面
  through: false  # 不穿透点击
  escClose: true  # 按 ESC 可关闭界面
  background: false  # 不渲染原版背景
  closeDied: false  # 玩家死亡时不关闭界面
  show: true  # 界面可见
  screenScale: true  # 启用屏幕等比缩放
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包 ID，回传操作时使用
    #   - poolName / poolDescription: 当前奖池名称与描述
    #   - poolList: 奖池名称列表（key 为 "0"、"1"… 的纯数字字符串）
    #   - currentPoolIndex: 当前奖池索引
    #   - action_token: 操作令牌，每次 update 都会换发，回传时必须带上
    #   - costRows: 单抽消耗条目（key "0"… ，每条含 type/id/amount/displayName/icon/owned）
    #   - costTenRows: 十连消耗条目，结构同上
    #   - tenAvailable: 当前奖池是否配置了十连消耗，false 时隐藏十连按钮
    #   - resourceRows: 当前奖池涉及的资源余额（含 displayName/icon/owned）
    #   - itemJsons / itemNames / itemRarities / itemCount: 奖池预览物品（key 为 "1" 起的数字字符串）
    # 说明: owned 为 -1 表示余额未知（外部货币桥不可用），界面显示 "—" 且不判定为不足。
    init: |-
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.packetId = packet['packetId']
      var.poolName = packet['poolName']
      var.poolDescription = packet['poolDescription']
      var.poolList = packet['poolList'] != none ? packet['poolList'] : {}
      var.currentPoolIndex = packet['currentPoolIndex'] != none ? packet['currentPoolIndex'] : 0
      var.actionToken = packet['action_token']
      var.costRows = packet['costRows'] != none ? packet['costRows'] : {}
      var.costTenRows = packet['costTenRows'] != none ? packet['costTenRows'] : {}
      var.tenAvailable = packet['tenAvailable'] == true
      var.resourceRows = packet['resourceRows'] != none ? packet['resourceRows'] : {}
      var.itemJsons = packet['itemJsons'] != none ? packet['itemJsons'] : {}
      var.itemNames = packet['itemNames'] != none ? packet['itemNames'] : {}
      var.itemRarities = packet['itemRarities'] != none ? packet['itemRarities'] : {}
      var.itemCount = packet['itemCount'] != none ? packet['itemCount'] : 0
      var.rarityNames = packet['rarityNames'] != none ? packet['rarityNames'] : (var.rarityNames != none ? var.rarityNames : {})
      // 奖池预览网格: 按实际奖品数量重建，模板占第 1 条数据
      目标数 = var.itemCount.round()
      现有数 = val.奖励网格.childrenCount() - 1
      if(现有数 != 目标数 - 1){
        var.奖励卡片轮次 = var.奖励卡片轮次 + 1
        while(val.奖励网格.childrenCount() > 1){
          val.奖励网格.get(1).remove()
        }
        val.奖励网格['奖励卡片'].entryKey = 1
        val.奖励网格['奖励卡片']['卡片底'].entryKey = 1
        val.奖励网格['奖励卡片']['稀有度条'].entryKey = 1
        val.奖励网格['奖励卡片']['物品槽'].entryKey = 1
        val.奖励网格['奖励卡片']['物品名'].entryKey = 1
        if(目标数 > 1){
          for(i in range(1, 目标数)){
            e = val.奖励网格['奖励卡片'].copy('奖励卡片_' + var.奖励卡片轮次 + '_' + i.round())
            e.entryKey = (i + 1).round()
            e['卡片底'].entryKey = (i + 1).round()
            e['稀有度条'].entryKey = (i + 1).round()
            e['物品槽'].entryKey = (i + 1).round()
            e['物品名'].entryKey = (i + 1).round()
          }
        }
      }
      for(i in range(1, 目标数 + 1)){
        if(i == 1){
          e = val.奖励网格['奖励卡片']
        }elif(val.奖励网格.childrenCount() > i - 1){
          e = val.奖励网格.get(i - 1)
        }else{
          e = none
        }
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      // 开箱动画滚动条: 固定 50 张，按实际奖品数量循环填充
      动画带数量 = 50
      现有动画数 = val.动画卡片带.childrenCount() - 2
      if(现有动画数 != 动画带数量 - 1 || var.动画带基数 != 目标数){
        var.动画带轮次 = var.动画带轮次 + 1
        while(val.动画卡片带.childrenCount() > 2){
          val.动画卡片带.get(2).remove()
        }
        动画首项 = val.动画卡片带['动画卡片']
        动画首项.entryKey = 1
        动画首项['卡片底'].entryKey = 1
        动画首项['稀有度条'].entryKey = 1
        动画首项['物品槽'].entryKey = 1
        动画首项['物品名'].entryKey = 1
        for(i in range(1, 动画带数量)){
          if(目标数 > 0){
            slot = ((i - 1) % 目标数 + 1).round()
          }else{
            slot = 1
          }
          e = val.动画卡片带['动画卡片'].copy('动画卡片_' + var.动画带轮次 + '_' + i.round())
          e.entryKey = slot
          e['卡片底'].entryKey = slot
          e['稀有度条'].entryKey = slot
          e['物品槽'].entryKey = slot
          e['物品名'].entryKey = slot
        }
        var.动画带基数 = 目标数
      }
      for(i in range(1, val.动画卡片带.childrenCount())){
        e = val.动画卡片带.get(i.round())
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      // 消耗区与资源栏: 刷新图标
      for(i in range(0, 4)){
        key = i.round()
        e = val.消耗区['消耗条目' + key]
        if(e != none){
          e['图标'].seticon()
        }
        r = val.资源栏['资源条目' + key]
        if(r != none){
          r['图标'].seticon()
        }
      }
    # packetHandler: update
    # 包字段与 init 完全相同，用于切换奖池、抽奖结束后刷新界面数据。
    # 额外职责: 若处于等待态但本次没有结果包（抽奖失败），解除等待态并回到主面板。
    update: |-
      var.packetId = packet['packetId']
      var.poolName = packet['poolName']
      var.poolDescription = packet['poolDescription']
      var.poolList = packet['poolList'] != none ? packet['poolList'] : {}
      var.currentPoolIndex = packet['currentPoolIndex'] != none ? packet['currentPoolIndex'] : 0
      var.actionToken = packet['action_token']
      var.costRows = packet['costRows'] != none ? packet['costRows'] : {}
      var.costTenRows = packet['costTenRows'] != none ? packet['costTenRows'] : {}
      var.tenAvailable = packet['tenAvailable'] == true
      var.resourceRows = packet['resourceRows'] != none ? packet['resourceRows'] : {}
      var.itemJsons = packet['itemJsons'] != none ? packet['itemJsons'] : {}
      var.itemNames = packet['itemNames'] != none ? packet['itemNames'] : {}
      var.itemRarities = packet['itemRarities'] != none ? packet['itemRarities'] : {}
      var.itemCount = packet['itemCount'] != none ? packet['itemCount'] : 0
      var.rarityNames = packet['rarityNames'] != none ? packet['rarityNames'] : (var.rarityNames != none ? var.rarityNames : {})
      // 奖池预览网格: 按实际奖品数量重建，模板占第 1 条数据
      目标数 = var.itemCount.round()
      现有数 = val.奖励网格.childrenCount() - 1
      if(现有数 != 目标数 - 1){
        var.奖励卡片轮次 = var.奖励卡片轮次 + 1
        while(val.奖励网格.childrenCount() > 1){
          val.奖励网格.get(1).remove()
        }
        val.奖励网格['奖励卡片'].entryKey = 1
        val.奖励网格['奖励卡片']['卡片底'].entryKey = 1
        val.奖励网格['奖励卡片']['稀有度条'].entryKey = 1
        val.奖励网格['奖励卡片']['物品槽'].entryKey = 1
        val.奖励网格['奖励卡片']['物品名'].entryKey = 1
        if(目标数 > 1){
          for(i in range(1, 目标数)){
            e = val.奖励网格['奖励卡片'].copy('奖励卡片_' + var.奖励卡片轮次 + '_' + i.round())
            e.entryKey = (i + 1).round()
            e['卡片底'].entryKey = (i + 1).round()
            e['稀有度条'].entryKey = (i + 1).round()
            e['物品槽'].entryKey = (i + 1).round()
            e['物品名'].entryKey = (i + 1).round()
          }
        }
      }
      for(i in range(1, 目标数 + 1)){
        if(i == 1){
          e = val.奖励网格['奖励卡片']
        }elif(val.奖励网格.childrenCount() > i - 1){
          e = val.奖励网格.get(i - 1)
        }else{
          e = none
        }
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      // 开箱动画滚动条: 固定 50 张，按实际奖品数量循环填充
      动画带数量 = 50
      现有动画数 = val.动画卡片带.childrenCount() - 2
      if(现有动画数 != 动画带数量 - 1 || var.动画带基数 != 目标数){
        var.动画带轮次 = var.动画带轮次 + 1
        while(val.动画卡片带.childrenCount() > 2){
          val.动画卡片带.get(2).remove()
        }
        动画首项 = val.动画卡片带['动画卡片']
        动画首项.entryKey = 1
        动画首项['卡片底'].entryKey = 1
        动画首项['稀有度条'].entryKey = 1
        动画首项['物品槽'].entryKey = 1
        动画首项['物品名'].entryKey = 1
        for(i in range(1, 动画带数量)){
          if(目标数 > 0){
            slot = ((i - 1) % 目标数 + 1).round()
          }else{
            slot = 1
          }
          e = val.动画卡片带['动画卡片'].copy('动画卡片_' + var.动画带轮次 + '_' + i.round())
          e.entryKey = slot
          e['卡片底'].entryKey = slot
          e['稀有度条'].entryKey = slot
          e['物品槽'].entryKey = slot
          e['物品名'].entryKey = slot
        }
        var.动画带基数 = 目标数
      }
      for(i in range(1, val.动画卡片带.childrenCount())){
        e = val.动画卡片带.get(i.round())
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      for(i in range(0, 4)){
        key = i.round()
        e = val.消耗区['消耗条目' + key]
        if(e != none){
          e['图标'].seticon()
        }
        r = val.资源栏['资源条目' + key]
        if(r != none){
          r['图标'].seticon()
        }
      }
      // 抽奖失败时服务端只回 update: 解除等待态，避免界面永久停在开箱动画
      if(var.rolling != none && var.rolling == true && var.resultPending != none && var.resultPending != true){
        var.rolling = false
        var.spinV = 0
        val.开箱动画层.visible = false
        val.主面板.visible = true
      }
    # packetHandler: result（单抽结果，服务端仅在确实抽到物品时下发）
    # 包字段:
    #   - resultCount: 结果数量
    #   - resultItemJson: 中奖物品 itemJson
    #   - resultItemName: 中奖物品名称
    #   - resultRarity: 中奖物品稀有度
    result: |-
      var.resultCount = packet['resultCount'] != none ? packet['resultCount'] : 0
      var.resultItemJson = packet['resultItemJson']
      var.resultItemName = packet['resultItemName']
      var.resultRarity = packet['resultRarity']
      var.resultPending = true
      var.揭晓类型 = 'single'
      var.出货开始 = 0
      var.resultBob = none
      var.resultScale = none
      val.单抽结果卡片['物品浮动容器']['物品槽'].seticon()
      // 结果已到达: 用有限 Q4 曲线减速到服务端决定的落点
      var.spinTarget = 0.82 + math.random() * 0.04
      var.滚动起点 = val.开箱滚动条.moveX
      var.减速 = Q4(0, 1, 1, var.spinMs)
      var.滚动曲线 = var.减速
      Sound.self(var.resultRarity == 'LEGENDARY' || var.resultRarity == 'MYTHIC' ? 'minecraft:entity.player.levelup' : (var.resultRarity == 'RARE' || var.resultRarity == 'EPIC' ? 'minecraft:block.note_block.chime' : 'minecraft:entity.item.pickup'), var.resultRarity == 'LEGENDARY' || var.resultRarity == 'MYTHIC' ? 1.15 : (var.resultRarity == 'RARE' || var.resultRarity == 'EPIC' ? 1.05 : 0.95), 20)
    # packetHandler: batch_result（十连结果）
    # 包字段:
    #   - batchCount: 实际结果数量
    #   - batchRequested: 请求数量
    #   - batchItemJsons / batchItemNames / batchItemRarities: 结果映射（key 为 "1" 起的数字字符串）
    batch_result: |-
      var.batchCount = packet['batchCount'] != none ? packet['batchCount'] : 0
      var.batchRequested = packet['batchRequested'] != none ? packet['batchRequested'] : 0
      var.batchItemJsons = packet['batchItemJsons'] != none ? packet['batchItemJsons'] : {}
      var.batchItemNames = packet['batchItemNames'] != none ? packet['batchItemNames'] : {}
      var.batchItemRarities = packet['batchItemRarities'] != none ? packet['batchItemRarities'] : {}
      var.resultPending = true
      var.揭晓类型 = 'batch'
      目标数 = var.batchCount.round()
      现有数 = val.十连网格.childrenCount() - 1
      if(现有数 != 目标数 - 1){
        var.十连卡片轮次 = var.十连卡片轮次 + 1
        while(val.十连网格.childrenCount() > 1){
          val.十连网格.get(1).remove()
        }
        val.十连网格['十连卡片'].entryKey = 1
        val.十连网格['十连卡片']['卡片底'].entryKey = 1
        val.十连网格['十连卡片']['稀有度条'].entryKey = 1
        val.十连网格['十连卡片']['物品槽'].entryKey = 1
        val.十连网格['十连卡片']['物品名'].entryKey = 1
        val.十连网格['十连卡片']['稀有度名'].entryKey = 1
        if(目标数 > 1){
          for(i in range(1, 目标数)){
            e = val.十连网格['十连卡片'].copy('十连卡片_' + var.十连卡片轮次 + '_' + i.round())
            e.entryKey = (i + 1).round()
            e['卡片底'].entryKey = (i + 1).round()
            e['稀有度条'].entryKey = (i + 1).round()
            e['物品槽'].entryKey = (i + 1).round()
            e['物品名'].entryKey = (i + 1).round()
            e['稀有度名'].entryKey = (i + 1).round()
          }
        }
      }
      for(i in range(1, 目标数 + 1)){
        if(i == 1){
          e = val.十连网格['十连卡片']
        }elif(val.十连网格.childrenCount() > i - 1){
          e = val.十连网格.get(i - 1)
        }else{
          e = none
        }
        if(e != none){
          e['物品槽'].seticon()
        }
      }
            var.spinTarget = 0.82 + math.random() * 0.04
      var.滚动起点 = val.开箱滚动条.moveX
      var.减速 = Q4(0, 1, 1, var.spinMs)
      var.滚动曲线 = var.减速
    # packetHandler: history（开箱历史）
    # 包字段:
    #   - historyPoolName: 奖池名称
    #   - historyCount: 记录条数
    #   - historyRows: 记录行（每行含 openTime/itemId/rarity/timeText/summary，界面只用 timeText 与 summary）
    history: |-
      var.historyPoolName = packet['historyPoolName']
      var.historyCount = packet['historyCount'] != none ? packet['historyCount'] : 0
      var.historyRows = packet['historyRows'] != none ? packet['historyRows'] : {}
      val.历史面板.visible = true
    # packetHandler: details（奖池详情）
    # 包字段:
    #   - detailPoolName: 奖池名称
    #   - detailCount: 条目数
    #   - detailRows: 条目行（每行含 name/rarity/weight）
    details: |-
      var.detailPoolName = packet['detailPoolName']
      var.detailCount = packet['detailCount'] != none ? packet['detailCount'] : 0
      var.detailRows = packet['detailRows'] != none ? packet['detailRows'] : {}
      val.详情面板.visible = true
  action:
    # load 事件: 初始化稀有度颜色表与界面状态变量
    load: |-
      var.rarityColors = {}
      var.rarityColors['COMMON']    = '176,176,176,255'  # 消费级 - 灰色
      var.rarityColors['UNCOMMON']  = '94,152,217,255'   # 工业级 - 蓝灰色
      var.rarityColors['RARE']      = '75,105,215,255'   # 军规级 - 蓝色
      var.rarityColors['EPIC']      = '136,71,255,255'   # 受限 - 紫色
      var.rarityColors['LEGENDARY'] = '211,47,47,255'   # 保密 - 红色
      var.rarityColors['MYTHIC']    = '235,75,75,255'    # 隐秘 - 深红色
      var.rarityColors['SPECIAL']   = '255,215,0,255'    # 罕见特殊物品 - 金色
      var.rarityColors[none] = '128,128,128,255'         # 默认 - 中灰色
      var.rarityNames = {}
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.spinMs = 2600      # 开箱动画时长（毫秒），结果包到达后再等这么久揭晓
      var.spinV = 0          # 滚动条当前速度系数
      var.spinTarget = 0.85  # 滚动条停止位置比例
      var.rolling = false        # 是否正在开箱（防连点）
      var.resultPending = false  # 本次开箱是否已收到结果包
      var.resultBob = none       # 单抽结果物品上下浮动插值器
      var.resultScale = none     # 单抽结果物品缩放插值器
      var.箱子抖动 = none
      var.箱子缩放 = none
      var.加速 = none
      var.减速 = none
      var.滚动起点 = 0
      var.滚动曲线 = none
      var.中线闪 = none
      var.命中抖 = none
      var.白闪 = none
      var.命中已触发 = false
      var.滚动模式 = none
      var.出货Y = none
      var.出货缩放 = none
      var.出货淡入 = none
      var.待机呼吸 = none
      var.待机浮动 = none
      var.出货开始 = 0
      var.十连开始 = 0
      var.揭晓类型 = none
      var.奖励卡片轮次 = 0
      var.动画带轮次 = 0
      var.动画带基数 = 0
      var.十连卡片轮次 = 0
    # open 事件: 每次打开界面复位所有层
    open: |-
      var.rolling = false
      var.resultPending = false
      var.spinV = 0
      var.resultBob = none
      var.resultScale = none
      var.箱子抖动 = none
      var.箱子缩放 = none
      var.加速 = none
      var.减速 = none
      var.滚动曲线 = none
      var.中线闪 = none
      var.命中抖 = none
      var.白闪 = none
      var.命中已触发 = false
      var.出货开始 = 0
      var.十连开始 = 0
      var.揭晓类型 = none
      val.主面板.visible = true
      val.开箱动画层.visible = false
      val.单抽结果层.visible = false
      val.十连结果层.visible = false
      val.历史面板.visible = false
      val.详情面板.visible = false
    # tick 事件: 预热、有限减速、命中冲击和结果层表现动画
    tick: |-
      if(var.rolling != none && var.rolling == true && val.开箱滚动条 != none){
        if(var.滚动曲线 != none && var.resultPending == true){
          进度 = var.滚动曲线.get()
          val.开箱滚动条.moveX = var.滚动起点 + (var.spinTarget - var.滚动起点) * 进度
          if(进度 >= 1 && var.命中已触发 != true){
            val.开箱滚动条.moveX = var.spinTarget
            var.spinV = 0
            var.命中已触发 = true
            var.命中抖 = Shake(0, 10, 450, 45, 6, true)
            var.白闪 = Fade(60, 40, 260)
            self.delayAction(450, '揭晓结果')
          }
        }else{
          加速系数 = var.加速 != none ? var.加速.get() : 1
          if(val.开箱滚动条.moveX < var.spinTarget){
            val.开箱滚动条.moveX = val.开箱滚动条.moveX + (0.0003 * 加速系数)
          }
        }
      }
      if(var.命中抖 != none && val.开箱动画层 != none){
        val.开箱动画层.x = var.命中抖.get()
      }
      if(var.白闪 != none && val.开箱白闪 != none){
        val.开箱白闪.alpha = var.白闪.get()
      }
      if(var.出货开始 != none && var.出货开始 > 0 && val.单抽结果层 != none){
        if(var.出货淡入 != none && Time.currentTime() - var.出货开始 < 260){
          val.单抽结果层.alpha = var.出货淡入.get()
        }else{
          val.单抽结果层.alpha = 1
        }
      }
      if(var.出货开始 != none && var.出货开始 > 0 && val.单抽结果卡片 != none){
        if(Time.currentTime() - var.出货开始 < 900){
          val.单抽结果卡片['物品浮动容器'].y = var.出货Y != none ? var.出货Y.get() : 0
          val.单抽结果卡片['物品浮动容器']['物品槽'].itemScale = var.出货缩放 != none ? var.出货缩放.get() : 1
        }else{
          val.单抽结果卡片['物品浮动容器'].y = var.待机浮动 != none ? var.待机浮动.get() : 0
          val.单抽结果卡片['物品浮动容器']['物品槽'].itemScale = var.待机呼吸 != none ? var.待机呼吸.get() : 1
        }
      }

    揭晓结果: |-
      val.开箱动画层.visible = false
      val.开箱动画层.x = 0
      var.命中抖 = none
      var.白闪 = none
      var.中线闪 = none
      var.rolling = false
      var.resultPending = false
      if(var.揭晓类型 == 'single'){
        var.出货开始 = Time.currentTime()
        var.出货Y = Back(90, 0, 1.70158, 1, 700)
        var.出货缩放 = Spring(0.75, 1, 170.0, 26.0, 900)
        var.出货淡入 = Lerp(0, 1, 260)
        var.待机呼吸 = Breathe(0.985, 1.02, 900, 900, 300, true)
        var.待机浮动 = Wave(0, 6, 2400, 0, false, 1)
        val.单抽结果层.alpha = 0
        val.单抽结果层.visible = true
        val.主面板.visible = false
      }elif(var.揭晓类型 == 'batch'){
        var.十连开始 = Time.currentTime()
        val.十连结果层.visible = true
        val.主面板.visible = false
      }
