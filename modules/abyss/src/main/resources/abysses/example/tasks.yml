# 副本内定时任务（abyss 自有调度——实例级，无外部对应系统）

# 击杀掉金币：每杀一只副本怪 +2 全队金币（祭坛/商店消耗）
coin_drop:
  type: EVENT
  event: monster_kill
  script:
    - "addvar coins 2"
    - "actionbar {killer} &e+2 金币 &7（全队 {var:coins}）"

# 阶段提示
tips:
  type: TIMED
  times: [240, 600, 960]
  timed-scripts:
    240: ["message @all &7提示：祭坛和商队收金币——别攒着不用"]
    600: ["message @all &e时间过半，注意推进节奏"]
    960: ["message @all &c最后 4 分钟！深渊开始躁动"]
