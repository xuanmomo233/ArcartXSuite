                      form['key'] = var.editItemKey
                      form['type'] = var.fItemType
                      form['displayName'] = var.fItemName
                      form['buyPrice'] = var.fBuyPrice
                      form['sellPrice'] = var.fSellPrice
                      form['currency'] = var.fCurrency
                      form['stockMode'] = var.fStockMode
                      form['stockAmount'] = var.fStockAmount
                      form['limitPerPlayer'] = var.fLimit
                      form['limitReset'] = var.fLimitReset
                      form['conditions'] = var.fConditions
                      form['commands'] = var.fCommands
                      form['discounts'] = var.fDiscounts
                      form['source'] = var.fItemSource
                      form['itemId'] = var.fItemId
                      form['nbt'] = var.fItemNbt
                      form['iconMode'] = var.fItemIconMode
                      form['iconJson'] = var.fItemIconJson == var.air ? '' : var.fItemIconJson
                      form['iconMaterial'] = ''
                      flag = var.itemNew == true ? '1' : '0'
                      Packet.send(var.packetId, 'shop_edit_item_save', var.editShopId, flag, json.stringify(form), var.actionToken)
                    }
                children:
                  保存商品底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~35,76,63,255
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  保存商品文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.actionBusy ? '&7保存中...' : '&f保存商品设置'"
                      fontSize: 36
                      through: true
              删除商品按钮:
                type: Canvas
                attribute:
                  point: ~bottom_left
                  x: 24
                  y: -16
                  width: 160
                  height: 52
                  visible: "var.itemNew != true"
                action:
                  clickLeft: |-
                    var.confirmTarget = 'item'
                    var.confirmKey = var.editItemKey
                    var.confirmText = '删除商品 ' + var.editItemKey
                    var.showConfirm = true
                children:
                  删除商品底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~150,58,58,225
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 3
                        color: ~255,255,255,230
                  删除商品文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f删除商品"
                      fontSize: 36
                      through: true
              商品结果消息:
                type: Text
                attribute:
                  point: ~bottom_left
                  x: 224
                  y: -28
                  visible: "var.resultMsg != none && var.resultMsg != ''"
                  texts: "var.resultOk == true ? '&a' + var.resultMsg : '&c' + var.resultMsg"
                  fontSize: 36
                  through: true

      # ── 背包选物弹窗 ───────────────────────────────────
      选物弹窗:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: "var.viewH"
          visible: "var.showPicker == true"
        children:
          选物遮罩:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~0,0,0,180
          选物面板:
            type: Canvas
            attribute:
              point: ~middle_center
              width: 1040
              height: 636
            children:
              选物面板底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~242,237,223,255
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              选物标题:
                type: Text
                attribute:
                  x: 32
                  y: 24
                  texts: "var.pickTarget == 'item_def' ? '&0选择交付物品' : '&0选择展示图标'"
                  fontSize: 64
                  through: true
              选物提示:
                type: Text
                attribute:
                  point: ~top_center
                  y: 96
                  texts: "~&8点击一个槽位；读取当前背包中的真实物品"
                  fontSize: 36
                  through: true
              背包网格:
                type: HGrid
                attribute:
                  point: ~top_center
                  y: 156
                  width: 856
                  column: 9
                  spaceBetweenX: 8
                  spaceBetweenY: 8
                action:
                  create: |-
                    for(i in range(1, 35)){
                      slot = self['背包槽'].copy('背包槽' + i.round())
                      slot.entryKey = (9 + i).round()
                      slot['背包槽位'].id = 9 + i
                    }
                children:
                  背包槽:
                    type: Canvas
                    attribute:
                      entryKey: 9.round()
                      width: 88
                      height: 88
                    action:
                      clickLeft: |-
                        item = self['背包槽位'].getSlotItemStack()
                        if(item != none && item.getType() != 'null' && item.getCount() > 0){
                          Packet.send(var.packetId, 'shop_edit_pick', self.entryKey, var.pickTarget)
                          var.showPicker = false
                        }
                    children:
                      背包槽底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.isHovered() ? '110,144,116,255' : '24,50,40,230'"
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 2
                            color: "self.isHovered() ? '255,255,255,255' : '255,255,255,180'"
                      背包槽位:
                        type: Slot
                        attribute:
                          id: 9
                          slotType: ~Backpack
                          itemScale: 0.72
                          point: ~stretch_all
                          through: true
                          lock: true
              选物取消按钮:
                type: Canvas
                attribute:
                  point: ~bottom_center
                  y: -20
                  width: 160
                  height: 48
                action:
                  clickLeft: |-
                    var.showPicker = false
                children:
                  选物取消底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~35,76,63,255
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: ~255,255,255,230
                  选物取消文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f取消"
                      fontSize: 36
                      through: true

      # ── 删除确认弹窗 ───────────────────────────────────
      确认弹窗:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: "var.viewH"
          visible: "var.showConfirm == true"
        children:
          确认遮罩:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~0,0,0,180
          确认面板:
            type: Canvas
            attribute:
              point: ~middle_center
              width: 820
              height: 320
            children:
              确认面板底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~242,237,223,255
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              确认标题:
                type: Text
                attribute:
                  point: ~top_center
                  y: 30
                  texts: "~&0确认删除"
                  fontSize: 54
                  through: true
              确认内容:
                type: Scroll
                attribute:
                  x: 32
                  y: 112
                  width: 756
                  height: 48
                  scrollAnim: none
                  moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                action:
                  enter: "self.scrollAnim = Lerp(0, 1, 2600)"
                  leave: "self.scrollAnim = none"
                children:
                  确认内容布局:
                    type: HStack
                    attribute:
                      height: 48
                    children:
                      确认内容文字:
                        type: Text
                        attribute:
                          texts: "'&8' + var.confirmText"
                          fontSize: 48
                          through: true
              删除警示:
                type: Text
                attribute:
                  point: ~top_center
                  y: 182
                  texts: "~&4此操作不可恢复，请核对删除目标"
                  fontSize: 36
                  through: true
              确认执行按钮:
                type: Canvas
                attribute:
                  point: ~bottom_left
                  x: 60
                  y: -24
                  width: 170
                  height: 48
                action:
                  clickLeft: |-
                    if(var.confirmTarget == 'shop'){
                      Packet.send(var.packetId, 'shop_edit_shop_delete', var.editShopId, var.actionToken)
                    } else if(var.confirmTarget == 'item'){
                      Packet.send(var.packetId, 'shop_edit_item_delete', var.editShopId, var.confirmKey, var.actionToken)
                    }
                    var.showConfirm = false
                    var.actionBusy = true
                children:
                  确认执行底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~150,58,58,230
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: ~255,255,255,230
                  确认执行文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f确认删除"
                      fontSize: 36
                      through: true
              确认取消按钮:
                type: Canvas
                attribute:
                  point: ~bottom_right
                  x: -60
                  y: -24
                  width: 170
                  height: 48
                action:
                  clickLeft: |-
                    var.showConfirm = false
                children:
                  确认取消底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~35,76,63,255
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: ~255,255,255,230
                  确认取消文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f取消"
                      fontSize: 36
                      through: true
