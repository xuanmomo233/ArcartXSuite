                                  清除按钮文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      width: 56
                                      through: true
                                      fontSize: 26
                                      texts: "~&7清除"

                  返回按钮:
                    type: Canvas
                    attribute:
                      x: 720
                      y: 0
                      width: 100
                      height: 36
                    action:
                      click: |-
                        Packet.send(var.packetId, 'navigate', 'regions')
                    children:
                      返回按钮背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.isHovered() ? '80,80,95,230' : '60,60,70,200'"
                          shape: ~round_rect
                          radius: 8
                      返回按钮文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 100
                          through: true
                          fontSize: 26
                          texts: "~&f← 返回"

              # ─── 世界规则视图 ───
              世界规则布局:
                type: Canvas
                attribute:
                  x: 20
                  y: 16
                  width: 840
                  height: 590
                  visible: "var.page == 'world_rules'"
                children:
                  世界规则标题:
                    type: Text
                    attribute:
                      x: 0
                      y: 0
                      fontSize: 36
                      texts: "~&6世界规则管理"
                  世界规则说明:
                    type: Text
                    attribute:
                      x: 0
                      y: 46
                      fontSize: 26
                      texts: "~&7点击开关切换禁飞/禁活塞状态"
                  世界规则滑块:
                    type: Texture
                    val: 世界规则滑块
                    attribute:
                      x: 834
                      y: 90
                      width: 6
                      height: 50
                      normal: ~120,120,120,200
                      maxDragY: 480
                  世界规则滚动栏:
                    type: Scroll
                    attribute:
                      x: 0
                      y: 90
                      width: 840
                      height: 490
                      moveY: "self.parent['世界规则滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['世界规则滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['世界规则滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      world_rules_list:
                        val: world_rule_data
                        type: VStack
                        attribute:
                          x: 0
                          y: 0
                          width: 840
                          spaceBetween: 6
                        action:
                          create: |-
                            for(i in range(1, 30)){
                              row = self['世界规则行'].copy('世界规则行' + i.round)
                              row.entryKey = i.round()
                            }
                        children:
                          世界规则行:
                            type: Texture
                            attribute:
                              entryKey: 0.round()
                              entry: "var.worldList != null ? var.worldList[self.entryKey] : none"
                              visible: self.entry != none
                              width: 820
                              height: 60
                              normal: ~40,40,50,180
                              shape: ~round_rect
                              radius: 6
                            children:
                              世界名称文字:
                                type: Text
                                attribute:
                                  x: 16
                                  y: 18
                                  through: true
                                  fontSize: 28
                                  texts: "~&f{self.parent.entry['name']}"
                              禁飞按钮:
                                type: Canvas
                                attribute:
                                  x: 260
                                  y: 14
                                  width: 100
                                  height: 34
                                action:
                                  click: |-
                                    Packet.send(var.packetId, 'toggle_no_fly', self.parent.entry['name'])
                                children:
                                  禁飞按钮背景:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: "self.parent.entry['noFly'] == 'true' ? '200,60,60,220' : (self.isHovered() ? '70,70,85,210' : '50,50,60,180')"
                                      shape: ~round_rect
                                      radius: 6
                                  禁飞按钮文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      width: 100
                                      through: true
                                      fontSize: 26
                                      texts: "~{self.parent.entry['noFly'] == 'true' ? '&f禁飞' : '&7飞行'}"
                              禁活塞按钮:
                                type: Canvas
                                attribute:
                                  x: 380
                                  y: 14
                                  width: 110
                                  height: 34
                                action:
                                  click: |-
                                    Packet.send(var.packetId, 'toggle_no_piston', self.parent.entry['name'])
                                children:
                                  禁活塞按钮背景:
                                    type: Texture
                                    attribute:
                                      point: ~stretch_all
                                      through: true
                                      normal: "self.parent.entry['noPiston'] == 'true' ? '200,60,60,220' : (self.isHovered() ? '70,70,85,210' : '50,50,60,180')"
                                      shape: ~round_rect
                                      radius: 6
                                  禁活塞按钮文字:
                                    type: Text
                                    attribute:
                                      point: ~middle_center
                                      width: 110
                                      through: true
                                      fontSize: 26
                                      texts: "~{self.parent.entry['noPiston'] == 'true' ? '&f禁活塞' : '&7活塞'}"
                              禁交互文字:
                                type: Text
                                attribute:
                                  x: 510
                                  y: 18
                                  through: true
                                  fontSize: 26
                                  texts: "~&7交互: &f{self.parent.entry['interactions'] != none && self.parent.entry['interactions'] != '' ? self.parent.entry['interactions'] : '&8无'}"
