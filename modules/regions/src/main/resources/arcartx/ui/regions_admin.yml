          width: 1040
          height: 680
          normal: ~25,25,30,240
          shape: ~round_rect
          radius: 14
        effect:
          stroke:
            width: 2
            color: ~220,160,60,180
          shadow:
            xOffset: 0
            yOffset: 4
            blur: 12
            color: ~0,0,0,100
        children:
          # ═══ 标题栏 ═══
          标题栏:
            type: Texture
            attribute:
              x: 0
              y: 0
              width: 1040
              height: 58
              normal: ~40,35,25,255
              shape: ~round_rect
              radius: 14
            children:
              标题文字:
                type: Text
                attribute:
                  x: 24
                  y: 8
                  fontSize: 38
                  texts: "~&6区域管理"
              区域数量:
                type: Text
                attribute:
                  x: 860
                  y: 14
                  fontSize: 28
                  texts: "~&7区域数: &f{var.regionCount}"

          # ═══ 左侧导航 ═══
          导航栏:
            type: Texture
            attribute:
              x: 0
              y: 58
              width: 160
              height: 622
              normal: ~30,30,38,255
            children:
              导航区域入口:
                type: Canvas
                attribute:
                  x: 10
                  y: 16
                  width: 140
                  height: 40
                action:
                  click: |-
                    Packet.send(var.packetId, 'navigate', 'regions')
                children:
                  导航区域背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'regions' ? '180,130,40,200' : (self.isHovered() ? '65,65,80,210' : '45,45,55,180')"
                      shape: ~round_rect
                      radius: 8
                  导航区域文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 140
                      through: true
                      fontSize: 28
                      texts: "~&f区域列表"

              导航编辑入口:
                type: Canvas
                attribute:
                  x: 10
                  y: 66
                  width: 140
                  height: 40
                action:
                  click: |-
                    Packet.send(var.packetId, 'navigate', 'edit')
                children:
                  导航编辑背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'edit' ? '180,130,40,200' : (self.isHovered() ? '65,65,80,210' : '45,45,55,180')"
                      shape: ~round_rect
                      radius: 8
                  导航编辑文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 140
                      through: true
                      fontSize: 28
                      texts: "~&f编辑"

              导航世界规则入口:
                type: Canvas
                attribute:
                  x: 10
                  y: 116
                  width: 140
                  height: 40
                action:
                  click: |-
                    Packet.send(var.packetId, 'select_world_rule')
                children:
                  导航世界规则背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'world_rules' ? '180,130,40,200' : (self.isHovered() ? '65,65,80,210' : '45,45,55,180')"
                      shape: ~round_rect
                      radius: 8
                  导航世界规则文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 140
                      through: true
                      fontSize: 28
                      texts: "~&f世界规则"

          # ═══ 内容区 ═══
          内容区:
            type: Texture
            attribute:
              x: 160
              y: 58
              width: 880
              height: 622
              normal: ~20,20,25,100
            children:
              # ─── 区域列表 ───
              区域列表布局:
                type: Canvas
                attribute:
                  x: 20
                  y: 16
                  width: 840
                  height: 590
                  visible: "var.page == 'regions'"
                children:
                  区域列表标题:
                    type: Text
                    attribute:
                      x: 0
                      y: 0
                      fontSize: 36
                      texts: "~&6所有区域"
                  新建区域输入框:
                    type: TextBox
                    attribute:
                      x: 320
                      y: 4
                      width: 280
                      height: 36
                      length: 32
                      emptyText: "~&8输入新区域名称..."
                      background: "~45,45,55,200"
                    action:
