          图标:
            type: Slot
            attribute:
              slotType: ~Icon
              itemScale: 0.8
              x: 28
              y: 96
              width: 120
              height: 120
              through: true
              normal: ~35,40,36,220
              shape: ~round_rect
              radius: 8
              seticon: 'self.setItemIcon(var.itemJsons[var.selectedKey] != none ? var.itemJsons[var.selectedKey] : var.emptyItemJson)'
              visible: var.selectedItem != none
            val: selected_icon
          选中详情:
            type: Canvas
            attribute:
              point: ~top_left
              x: 0
              y: 240
              width: 420
              height: 440
              visible: var.selectedItem != none
            children:
              名称:
                type: Text
                attribute:
                  x: 28
                  y: 0
                  texts: '''&0'' + var.selectedItem[''name'']'
                  fontSize: 54
                  through: true
                  limit: 20
              金额:
                type: Text
                attribute:
                  x: 28
                  y: 64
                  texts: '''&6'' + var.selectedItem[''price'']'
                  fontSize: 72
                  through: true
                  limit: 14
              货币:
                type: Text
                attribute:
                  x: 28
                  y: 132
                  texts: '''&8'' + var.selectedItem[''currencyName'']'
                  fontSize: 36
                  through: true
                  limit: 24
              库存:
                type: Text
                attribute:
                  x: 28
                  y: 204
                  texts: '''&8可用库存  &0'' + var.selectedItem[''stock'']'
                  fontSize: 36
                  through: true
                  limit: 24
              限购:
                type: Text
                attribute:
                  x: 28
                  y: 256
                  texts: '''&4'' + var.selectedItem[''limitText'']'
                  fontSize: 36
                  through: true
                  limit: 24
                  visible: var.selectedItem['limitText'] != ''
              单位:
                type: Text
                attribute:
                  x: 28
                  y: 324
                  texts:
                  - ~&8单次购买 1 件
                  - ~&8价格与库存以服务端结算为准
                  fontSize: 36
                  through: true
          购买:
            type: Canvas
            attribute:
              point: ~top_left
              x: 28
              y: var.viewH - 364
              width: 364
              height: 64
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: '!var.actionBusy && var.selectedItem != none && var.actionToken != none && var.actionToken != '''' && var.selectedItem[''stock'']
                    != ''0'' ? ''35,76,63,255'' : ''77,77,72,180'''
                  shape: ~round_rect
                  radius: 8
                effect:
                  stroke:
                    width: 1
                    color: 'self.parent.isHovered() ? ''183,149,86,255'' : ''118,112,96,100'''
              文字:
                type: Text
                attribute:
                  x: 0
                  y: 0
                  texts: ~&f购买 1 件
                  fontSize: 36
                  through: true
                  point: ~middle_center
            action:
              clickLeft: |-
                if(!var.actionBusy && var.selectedItem != none && var.actionToken != none && var.actionToken != '' && var.selectedItem['stock'] != '0'){
                  var.actionBusy = true
                  var.actionBusySeconds = 0
                  Packet.send(var.packetId, 'shop_buy', var.shopId, var.selectedItem['key'], '1', var.actionToken)
                }
          等待:
            type: Text
            attribute:
              x: 28
              y: var.viewH - 284
              texts: 'var.actionBusy ? ''&8正在等待交易结果…'' : ''&8请核对后再购买'''
              fontSize: 36
              through: true
              limit: 24
