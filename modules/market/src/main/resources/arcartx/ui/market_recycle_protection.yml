              保护行区:
                type: VStack
                val: 保护行区
                attribute:
                  width: "var.pageW - 48"
                  spaceBetween: 12
                children:
                  保护行:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.rules[self.entryKey]
                      visible: "self.entry != none"
                      width: "var.pageW - 48"
                      height: 108
                    children:
