                          x: 220
                          y: 30
                          spaceBetween: 8
                          height: 36
                          through: true
                        action:
                          create: |-
                            for(i in range(1, 3)){
                              key = i.round()
                              e = self['消耗条目'].copy('消耗条目' + key)
                              e.entryKey = key
                              e['图标'].entryKey = key
                              e['数量'].entryKey = key
                            }
                        children:
                          消耗条目:
                            type: Canvas
                            attribute:
                              entryKey: 4.round()
                              width: 80
                              height: 36
                              through: true
                              visible: "var.costTenRows == none || var.costTenRows[0] == none ? self.entryKey < 1 : var.costTenRows[self.entryKey] != none"
                            children:
                              图标:
                                type: Slot
                                attribute:
                                  entryKey: 0.round()
                                  point: ~middle_left
                                  slotType: ~Icon
                                  width: 32
                                  height: 32
                                  normal: ~0,0,0,0
                                  through: true
                                  seticon: "self.setItemIcon(var.costTenIconJsons[self.entryKey])"
                              数量:
                                type: Text
                                attribute:
                                  entryKey: 0.round()
                                  point: ~middle_left
                                  x: 36
                                  texts: "var.costTenRows[self.entryKey] != none ? (var.costTenRows[self.entryKey]['owned'] == none || var.costTenRows[self.entryKey]['owned'] < 0 ? '&7x' : var.costTenRows[self.entryKey]['owned'] < var.costTenRows[self.entryKey]['amount'] ? '&cx' : '&fx') + var.costTenRows[self.entryKey]['amount'].round() : (self.entryKey == 0 ? '———' : '')"
                                  fontSize: 36
                                  through: true

          # ── 右侧栏: 保底进度 + 卡池信息 ────────────────────────
          右侧栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: "372 + var.mainW + 24 - var.offX"
              y: 120
              width: "var.rightW"
              height: "var.viewH - 144"
            children:
              右侧栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~Frosted:30;255,255,255,100
                  shape: ~round_rect
                  radius: 14
              # ══ 保底进度卡 ══
              保底进度卡:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 20
                  y: 20
                  width: 360
                  height: 380
                children:
                  进度卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~62,66,74,210
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: ~255,255,255,230
                  进度卡标题:
                    type: Text
