# ═══ 商店力量药剂档位（init 时 random shop_power_lvl 1..3，购买时按档位给药） ═══
shop_power_t1:
  - "if_var shop_power_lvl == 1"
  - "apply_potion @trigger STRENGTH 180 1"
  - "message @trigger &c力量 I &7生效 3 分钟"
shop_power_t2:
  - "if_var shop_power_lvl == 2"
  - "apply_potion @trigger STRENGTH 120 2"
  - "message @trigger &c力量 II &7生效 2 分钟"
shop_power_t3:
  - "if_var shop_power_lvl == 3"
  - "apply_potion @trigger STRENGTH 60 3"
  - "message @trigger &c&l力量 III &7生效 1 分钟"

# ═══ 生命周期 ═══
init:
  - "wait 1"
  - "setvar coins 0"
  - "random shop_power_lvl 1 3"

start:
  - "message @all &6═══ 元气试炼之地 ═══"
  - "title @all 10 40 10 &6元气试炼之地|&e三层迷宫 · 每次进入皆不相同"
  - "sound @all ENTITY_ENDER_DRAGON_GROWL 1 1"
  - "bossbar @all 1200 RED SOLID &c元气试炼之地"
  - "guide_point guide anchor:f1_start.guide 2 &e先与向导·艾琳交谈"

guide_guide:
  - "guide_clear guide"
  - "guide_point f1_east anchor:f1_combat_a.center 2 &e穿过走廊·踏入第一场战斗"
  - "if_var guide_talked != 1"
  - "setvar guide_talked 1"
  - "message @all &7已记录向导指引——穿过东廊，肃清战斗房解锁 Boss 之门"

complete:
  - "message @all &a&l通关！深渊领主已陨落！"
  - "title @all 10 60 10 &a&l通关|&e奖励已发放"
  - "grant_reward @all clear_pack"
  - "open_chest_ui @all final_chest"
  - "firework @all BURST GOLD"
  - "wait 5"
  - "exit_dungeon @all"

fail:
  - "message @all &c试炼失败……地牢把你们吐了出来"
  - "wait 2"
  - "exit_dungeon @all"

player-death:
  - "message @all &c{player} 阵亡了！&7将在 8 秒后复活，撑住！"
  - "wait 8"
  - "revive_player @trigger"

all-death:
  - "fail_dungeon"

exit:
  - "message @trigger &7已离开元气试炼之地"
