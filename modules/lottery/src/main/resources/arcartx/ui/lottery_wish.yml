        val: 等待层
        attribute:
          point: ~stretch_all
          visible: false
        children:
          等待底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,14,24,228
          等待文字:
            type: Text
            attribute:
              point: ~middle_center
              texts: "~&e祈愿中..."
              fontSize: 72
              through: true

      # ════════════════════════════════════════════════════════════
