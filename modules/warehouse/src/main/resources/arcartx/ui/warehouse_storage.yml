                                  != none && self.parent.entry[''id''] == var.ownerId ? ''226,179,124,255'' : ''112,83,64,235'')'
                          项字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: '''&f'' + var.sharedWarehouseStorageTexts[self.parent.entryKey]'
                              fontSize: 36
                              limit: 226
                              through: true
      中间主区:
        type: Canvas
        attribute:
          point: ~top_left
          x: 372 - var.offX
          y: 120
          width: var.gridW
          height: var.viewH - 144
        children:
          主区底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~38,31,27,250
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~112,83,64,235
          仓库区标题:
            type: Text
            attribute:
              point: ~top_left
              x: var.gridBgX
              y: 144
              texts: '''&e库房库存 &f'' + var.capacityText'
              fontSize: 48
          仓库网格底:
            type: Texture
            attribute:
              point: ~top_left
              x: var.gridBgX
              y: 182
