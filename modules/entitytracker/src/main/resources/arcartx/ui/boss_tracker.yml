# ArcartXEntityTracker Boss Tracker HUD
# Tracking instruments: left-edge Boss stack; centered attack_target_hud stays unobstructed.
# Flat slot1_..slotN_ packet contract and all HUD flags are retained.
# Copy references are retained by generation; ordinary updates do not rebuild cards.
# Reload: /axs entitytracker reload
ui:
  isHud: true
  through: false
  background: false
  closeDied: true
  show: true
  level: 2
  screenScale: true
  defaultOpen: false
  hide:
    - boss_event_progress
  packetHandler:
    init: |-
      var.isVisible = true
      var.bossCount = packet.get('bossCount').round()
      var.totalBossCount = packet.get('totalBossCount')
      var.maxVisibleBars = packet.get('maxVisibleBars')
      现有卡片数 = val.血条容器.childrenCount() - 1
      if(现有卡片数 != var.bossCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        for(key in var.卡片引用.keys()){
          var.卡片引用[key].remove()
        }
        var.卡片引用 = {}
        if(var.bossCount > 0){
          for(序号 in range(1, var.bossCount)){
            if(val.卡片模板 != none){
              卡片 = val.卡片模板.copy('boss卡片_' + var.刷新轮次 + '_' + 序号.round())
              var.卡片引用[序号.round()] = 卡片
            }
          }
        }
      }
      if(var.bossCount > 0){
        for(序号 in range(1, var.bossCount)){
          n = 序号.round()
          卡片 = var.卡片引用[n]
          if(卡片 != none){
            进度 = packet.get('slot' + n + '_progress')
            卡片['Boss标题文字'].texts = packet.get('slot' + n + '_title')
            卡片['数值说明文字'].texts = '&7距离 &f' + packet.get('slot' + n + '_distanceText') + '  &7排名 &b' + packet.get('slot' + n + '_viewerRankText') + '  &7伤害 &f' + packet.get('slot' + n + '_viewerDamageText')
            卡片['血条文字'].texts = '&7HP &f' + packet.get('slot' + n + '_healthText') + ' &7/ &f' + packet.get('slot' + n + '_maxHealthText')
            卡片['血条层a'].width = 480 * 进度
            卡片['血条层a'].visible = 进度 > 0
            卡片['血条层b'].width = 480 * 进度
            卡片['血条层b'].visible = 进度 > 0.2
            卡片['血条层c'].width = 480 * 进度
            卡片['血条层c'].visible = 进度 > 0.4
            卡片['血条层d'].width = 480 * 进度
            卡片['血条层d'].visible = 进度 > 0.6
            卡片['血条层e'].width = 480 * 进度
            卡片['血条层e'].visible = 进度 > 0.8
            卡片.visible = true
          }
        }
      }
    update: |-
      var.isVisible = true
      var.bossCount = packet.get('bossCount').round()
      var.totalBossCount = packet.get('totalBossCount')
      var.maxVisibleBars = packet.get('maxVisibleBars')
      现有卡片数 = val.血条容器.childrenCount() - 1
      if(现有卡片数 != var.bossCount){
        var.刷新轮次 = (var.刷新轮次 + 1).round()
        for(key in var.卡片引用.keys()){
          var.卡片引用[key].remove()
        }
        var.卡片引用 = {}
        if(var.bossCount > 0){
          for(序号 in range(1, var.bossCount)){
            if(val.卡片模板 != none){
              卡片 = val.卡片模板.copy('boss卡片_' + var.刷新轮次 + '_' + 序号.round())
              var.卡片引用[序号.round()] = 卡片
            }
          }
        }
      }
      if(var.bossCount > 0){
        for(序号 in range(1, var.bossCount)){
          n = 序号.round()
          卡片 = var.卡片引用[n]
          if(卡片 != none){
            进度 = packet.get('slot' + n + '_progress')
            卡片['Boss标题文字'].texts = packet.get('slot' + n + '_title')
            卡片['数值说明文字'].texts = '&7距离 &f' + packet.get('slot' + n + '_distanceText') + '  &7排名 &b' + packet.get('slot' + n + '_viewerRankText') + '  &7伤害 &f' + packet.get('slot' + n + '_viewerDamageText')
            卡片['血条文字'].texts = '&7HP &f' + packet.get('slot' + n + '_healthText') + ' &7/ &f' + packet.get('slot' + n + '_maxHealthText')
            卡片['血条层a'].width = 480 * 进度
            卡片['血条层a'].visible = 进度 > 0
            卡片['血条层b'].width = 480 * 进度
            卡片['血条层b'].visible = 进度 > 0.2
            卡片['血条层c'].width = 480 * 进度
            卡片['血条层c'].visible = 进度 > 0.4
            卡片['血条层d'].width = 480 * 进度
            卡片['血条层d'].visible = 进度 > 0.6
            卡片['血条层e'].width = 480 * 进度
            卡片['血条层e'].visible = 进度 > 0.8
            卡片.visible = true
          }
        }
      }
    close: |-
      var.bossCount = 0
      var.totalBossCount = 0
      var.isVisible = false
      for(key in var.卡片引用.keys()){
        var.卡片引用[key].remove()
      }
      var.卡片引用 = {}
  action:
    load: |-
      var.刷新轮次 = 0
      var.卡片引用 = {}
      var.isVisible = false
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    action:
      create: |-
        var.isVisible = false
    children:
      首领追踪标题文字:
        type: Text
        attribute:
          x: "24 - var.offX"
          y: 24
          texts: "'&bBOSS / 首领追踪 &f' + var.bossCount.round() + ' &7/ ' + var.totalBossCount.round()"
          fontSize: 36
          visible: var.isVisible
          through: true
      血条排列布局:
        type: VStack
        val: 血条容器
        attribute:
          x: "24 - var.offX"
          y: 54
          width: 520
          spaceBetween: 8
          visible: var.isVisible
        children:
          Boss血条卡片模板:
            type: Canvas
            val: 卡片模板
            attribute:
              width: 520
              height: 98
              visible: false
            children:
              仪表底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~Frosted:12;19,27,34,232
                  shape: ~round_rect
                  radius: 6
                  through: true
                effect:
                  stroke:
                    width: 1
                    color: ~72,103,117,230
              信号边:
                type: Texture
                attribute:
                  x: 0
                  y: 8
                  width: 3
                  height: 82
                  normal: ~69,211,224,255
                  through: true
              Boss标题文字:
                type: Text
                attribute:
                  x: 20
                  y: 8
                  texts: "''"
                  limit: 480
                  fontSize: 36
                  through: true
              血条文字:
                type: Text
                attribute:
                  x: 20
                  y: 30
                  texts: "''"
                  fontSize: 36
                  through: true
              血条底框:
                type: Texture
                attribute:
                  x: 20
                  y: 54
                  width: 480
                  height: 8
                  normal: ~44,57,66,255
                  through: true
              血条层a:
                type: Texture
                attribute:
                  x: 20
                  y: 54
                  width: 0
                  height: 8
                  normal: ~239,79,89,255
                  visible: false
                  through: true
              血条层b:
                type: Texture
                attribute:
                  x: 20
                  y: 54
                  width: 0
                  height: 8
                  normal: ~211,69,81,255
                  visible: false
                  through: true
              血条层c:
                type: Texture
                attribute:
                  x: 20
                  y: 54
                  width: 0
                  height: 8
                  normal: ~193,64,76,255
                  visible: false
                  through: true
              血条层d:
                type: Texture
                attribute:
                  x: 20
                  y: 54
                  width: 0
                  height: 8
                  normal: ~177,60,73,255
                  visible: false
                  through: true
              血条层e:
                type: Texture
                attribute:
                  x: 20
                  y: 54
                  width: 0
                  height: 8
                  normal: ~161,57,70,255
                  visible: false
                  through: true
              数值说明文字:
                type: Text
                attribute:
                  x: 20
                  y: 70
                  texts: "''"
                  limit: 480
                  fontSize: 36
                  through: true
