# 命名奖励集（grant_reward <集名>）+ 宝箱奖励（open_chest_ui <名>）
rewards:
  # 通关大包
  clear_pack:
    items:
      - "material:DIAMOND:3"
      - "material:GOLDEN_APPLE:2"
      - "material:EMERALD:8"
    money: 150
    currency: "money"
    exp: 100
    commands: []

  # 委托奖励（Chemdah 委托完成时发放）
  quest_pack:
    items:
      - "material:EMERALD:5"
      - "material:IRON_INGOT:8"
    money: 80

  # 随机小包示例
  random_pack:
    type: random
    picks: 1
    pool:
      - reward: clear_pack
        weight: 80
      - reward: quest_pack
        weight: 20

  铁锭补给:
    items: ["material:IRON_INGOT:6"]
  钻石珍藏:
    items: ["material:DIAMOND:2"]
  金苹果:
    items: ["material:GOLDEN_APPLE:1"]
  下界合金碎片:
    items: ["material:NETHERITE_SCRAP:1"]

  # 保留一层原宝箱的四档奖品与权重
  example_wheel_pool:
    type: random
    pool:
      - reward: 铁锭补给
        weight: 50
      - reward: 钻石珍藏
        weight: 25
      - reward: 金苹果
        weight: 20
      - reward: 下界合金碎片
        weight: 5
  example_flip_pool:
    type: random
    pool:
      - reward: 铁锭补给
        weight: 65
      - reward: 金苹果
        weight: 25
      - reward: 钻石珍藏
        weight: 10

# 玩家可离开后用 /abyss rewards 补领，重复打开同一局的玩法不会重抽
reward-games:
  example_clear_flip:
    strategy: flip
    title: "领主秘藏 · 六翻二"
    pool: example_flip_pool
    slots: 6
    picks: 2
    allow-repeat: true
    auto-after-seconds: 0
  example_side_wheel:
    strategy: wheel
    title: "一层战利品 · 幸运转盘"
    pool: example_wheel_pool
    auto-after-seconds: 0

# 宝箱奖励（open_chest_ui <名>）
chest-rewards:
  # 保留旧奖励名供引用兼容；示例的一层宝箱现在打开转盘
  abyss_chest:
    title: "战利品宝箱"
    rows: 3
    options:
      - item: "material:IRON_INGOT:6"
        weight: 50
      - item: "material:DIAMOND:2"
        weight: 25
      - item: "material:GOLDEN_APPLE:1"
        weight: 20
      - item: "material:NETHERITE_SCRAP:1"
        weight: 5

  # f3_chest 深渊战利品之厅（终层更丰厚）
  abyss_chest_t3:
    title: "深渊战利品"
    rows: 3
    options:
      - item: "material:DIAMOND:4"
        weight: 40
      - item: "material:GOLDEN_APPLE:2"
        weight: 25
      - item: "material:NETHERITE_SCRAP:2"
        weight: 15
      - item: "material:TOTEM_OF_UNDYING:1"
        weight: 10
      - item: "material:EMERALD:8"
        weight: 30

  # 通关宝箱（complete 段统一弹）
  final_chest:
    title: "深渊秘宝"
    rows: 3
    options:
      - item: "material:DIAMOND:5"
        weight: 40
      - item: "material:NETHERITE_INGOT:1"
        weight: 15
      - item: "material:TOTEM_OF_UNDYING:1"
        weight: 10
      - item: "material:EMERALD:12"
        weight: 35
# 奖励先由宿主确认持久化，再通过统一发放链自动到账；无需重新登录。
# 背包溢出由宿主处理仓库/邮件/待发；数据库暂不可用时保留宿主恢复日志。
