# AXS Market — 系统商店编辑界面（管理员）
# 打开方式: /axs market edit [商店ID] 或商店界面顶栏「编辑商店」按钮
# 权限: arcartxsuite.market.admin（服务端强校验，UI 仅作入口）
# 布局: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏 + 左侧商店列表 + 内容区(列表态/商店编辑/商品编辑) + 背包选物弹窗 + 确认弹窗
# 配色: 暖象牙管理台 + 森林绿表单 + 黄铜选中态；商品按定价/库存/交付定义分区
#
# 服务端包（packetHandler）:
#   edit_list:  shops/shopTexts/shopIconJson{k}/maxShopCount/defaultCurrency/action_token
#   edit_shop:  found/shopId/displayName/permission/tags/iconPreview/items{idx:{key,name,type,price,currencyName,stock,limit}}/editItemJson{idx}/maxItemCount/action_token
#   edit_item:  found/shopId/key/type/displayName/buyPrice/sellPrice/currency/stockMode/stockAmount/limitPerPlayer/limitReset/conditions/commands/discounts/source/itemId/nbt/iconPreview/itemPreview/defaultCurrency/action_token
#   edit_pick:  target(shop_icon|item_icon|item_def)/itemJson/name(+source/id/nbt)
#   edit_result: success/message/op/action_token
#
# 客户端包（Packet.send）:
#   shop_edit_list / shop_edit_shop <shopId> / shop_edit_item <shopId> <key>
#   shop_edit_pick <rawSlot 9-44> <target>
#   shop_edit_shop_save <shopId> <isNew 0/1> <json> <token>
#   shop_edit_shop_delete <shopId> <token>
#   shop_edit_item_save <shopId> <isNew 0/1> <json> <token>
#   shop_edit_item_delete <shopId> <key> <token>

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    edit_list: |-
      var.editShops = packet['shops']
      var.shopTexts = packet['shopTexts']
      var.maxShopCount = packet['maxShopCount']
      var.actionToken = packet['action_token']
      var.defaultCurrency = packet['defaultCurrency']
      var.shopIconJsons = {}
      for(key in var.editShops.keys()){
        json = packet['shopIconJson' + key]
        if(json != none && json != ''){
          var.shopIconJsons[key] = json
        } else {
          var.shopIconJsons[key] = var.air
        }
      }
      for(key in var.shopRowRefs.keys()){
        var.shopRowRefs[key].remove()
      }
      var.shopRowRefs = {}
      var.shopRowRound = (var.shopRowRound + 1).round()
      template = val.商店行区.get(0)
      if(var.maxShopCount > 1){
        for(i in range(1, var.maxShopCount - 1)){
          key = i.round()
          e = template.copy('商店行_' + var.shopRowRound + '_' + key)
          e.entryKey = key
          var.shopRowRefs[key] = e
        }
      }
      if(var.maxShopCount > 0){
        template['商店行图标'].seticon()
        for(key in var.shopRowRefs.keys()){
          var.shopRowRefs[key]['商店行图标'].seticon()
        }
      }
      var.actionBusy = false
    edit_shop: |-
      var.actionToken = packet['action_token']
      if(packet['found'] == true){
        sameShop = var.editShopId == packet['shopId']
        var.editShopNew = false
        var.editShopId = packet['shopId']
        var.fShopName = packet['displayName']
        var.fShopPerm = packet['permission']
        var.fShopTags = packet['tags']
        var.fShopIconJson = packet['iconPreview']
        var.fShopIconMode = 'keep'
        var.editItems = packet['items']
        var.maxEditItemCount = packet['maxItemCount']
        var.editItemJsons = {}
        for(key in var.editItems.keys()){
          json = packet['editItemJson' + key]
          if(json != none && json != ''){
            var.editItemJsons[key] = json
          } else {
            var.editItemJsons[key] = var.air
          }
        }
        // 正在编辑该商店的某个商品时不强制跳回商店视图（保存商品后的列表刷新）
        if(var.view != 'item' || !sameShop){
          var.view = 'shop'
        }
        // setContent/seticon 必须推迟到下一帧，等待视图切换后控件可见
        scheduler.delay(50, -> {
          val.商店ID输入.setContent(var.editShopId)
          val.商店名输入.setContent(var.fShopName)
          val.商店权限输入.setContent(var.fShopPerm)
          val.商店标签输入.setContent(var.fShopTags)
          if(var.fShopIconJson == none || var.fShopIconJson == ''){
            var.fShopIconJson = var.air
          }
          val.商店图标预览.seticon()
          for(key in var.editRowRefs.keys()){
            var.editRowRefs[key].remove()
          }
          var.editRowRefs = {}
          var.editRowRound = (var.editRowRound + 1).round()
          template = val.商品行区.get(0)
          if(var.maxEditItemCount > 1){
            for(i in range(1, var.maxEditItemCount - 1)){
              key = i.round()
              e = template.copy('商品行_' + var.editRowRound + '_' + key)
              e.entryKey = key
              var.editRowRefs[key] = e
            }
          }
          if(var.maxEditItemCount > 0){
            template['商品行图标'].seticon()
            for(key in var.editRowRefs.keys()){
              var.editRowRefs[key]['商品行图标'].seticon()
            }
          }
        })
      } else {
        if(var.view == 'shop' || var.view == 'item'){
          var.view = 'list'
        }
      }
      var.actionBusy = false
    edit_item: |-
      var.actionToken = packet['action_token']
      if(packet['found'] == true){
        var.itemNew = false
        var.editItemKey = packet['key']
        var.fItemType = packet['type']
        var.fItemName = packet['displayName']
        var.fBuyPrice = packet['buyPrice']
        var.fSellPrice = packet['sellPrice']
        var.fCurrency = packet['currency']
        var.fStockMode = packet['stockMode']
        var.fStockAmount = packet['stockAmount']
        var.fLimit = packet['limitPerPlayer']
        var.fLimitReset = packet['limitReset']
        var.fConditions = packet['conditions']
        var.fCommands = packet['commands']
        var.fDiscounts = packet['discounts']
        var.fItemSource = packet['source']
        var.fItemId = packet['itemId']
        var.fItemNbt = packet['nbt']
        var.fItemIconJson = packet['iconPreview']
        var.fItemIconMode = 'keep'
        var.fItemPreviewJson = packet['itemPreview']
        var.view = 'item'
        scheduler.delay(50, -> {
          val.商品ID输入.setContent(var.editItemKey)
          val.商品名输入.setContent(var.fItemName)
          val.来源输入.setContent(var.fItemSource)
          val.物品ID输入.setContent(var.fItemId)
          val.NBT输入.setContent(var.fItemNbt)
          val.买入价输入.setContent(var.fBuyPrice)
          val.卖出价输入.setContent(var.fSellPrice)
          val.货币输入.setContent(var.fCurrency)
          val.库存量输入.setContent(var.fStockAmount)
          val.限购输入.setContent(var.fLimit)
          val.条件输入.setContent(var.fConditions)
          val.指令输入.setContent(var.fCommands)
          val.折扣输入.setContent(var.fDiscounts)
          if(var.fItemIconJson == none || var.fItemIconJson == ''){
            var.fItemIconJson = var.air
          }
          if(var.fItemPreviewJson == none || var.fItemPreviewJson == ''){
            var.fItemPreviewJson = var.air
          }
          val.商品图标预览.seticon()
          val.物品预览.seticon()
        })
      } else {
        if(var.view == 'item'){
          var.view = 'shop'
        }
      }
      var.actionBusy = false
    edit_pick: |-
      target = packet['target']
      json = packet['itemJson']
      if(target == 'shop_icon'){
        var.fShopIconJson = json
        var.fShopIconMode = 'json'
        scheduler.delay(50, -> {
          val.商店图标预览.seticon()
        })
      }
      if(target == 'item_icon'){
        var.fItemIconJson = json
        var.fItemIconMode = 'json'
        scheduler.delay(50, -> {
          val.商品图标预览.seticon()
        })
      }
      if(target == 'item_def'){
        var.fItemSource = packet['source']
        var.fItemId = packet['id']
        var.fItemNbt = packet['nbt']
        var.fItemPreviewJson = json
        scheduler.delay(50, -> {
          val.来源输入.setContent(var.fItemSource)
          val.物品ID输入.setContent(var.fItemId)
          val.NBT输入.setContent(var.fItemNbt)
          val.物品预览.seticon()
        })
      }
      var.showPicker = false
      var.actionBusy = false
    edit_result: |-
      var.resultMsg = packet['message']
      var.resultOk = packet['success']
      var.actionToken = packet['action_token']
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.packetId = 'AXS_MARKET'
      var.view = 'list'
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.showPicker = false
      var.showConfirm = false
      var.pickTarget = ''
      var.confirmTarget = ''
      var.confirmKey = ''
      var.confirmText = ''
      var.resultMsg = ''
      var.resultOk = false
      var.defaultCurrency = ''
      var.editShops = {}
      var.shopTexts = {}
      var.shopIconJsons = {}
      var.maxShopCount = 0
      var.shopRowRefs = {}
      var.shopRowRound = 0
      var.editRowRefs = {}
      var.editRowRound = 0
      var.editShopNew = false
      var.editShopId = ''
      var.fShopName = ''
      var.fShopPerm = ''
      var.fShopTags = ''
      var.fShopIconJson = var.air
      var.fShopIconMode = 'keep'
      var.editItems = {}
      var.editItemJsons = {}
      var.maxEditItemCount = 0
      var.itemNew = false
      var.editItemKey = ''
      var.fItemType = 'item'
      var.fItemName = ''
      var.fItemSource = 'minecraft'
      var.fItemId = ''
      var.fItemNbt = ''
      var.fItemPreviewJson = var.air
      var.fItemIconJson = var.air
      var.fItemIconMode = 'keep'
      var.fBuyPrice = '0'
      var.fSellPrice = '0'
      var.fCurrency = ''
      var.fStockMode = 'unlimited'
      var.fStockAmount = '0'
      var.fLimit = '0'
      var.fLimitReset = 'never'
      var.fConditions = ''
      var.fCommands = ''
      var.fDiscounts = ''
      var.stockModeNames = {'unlimited': '无限', 'global': '全服', 'per-player': '每人'}
      var.limitResetNames = {'never': '不重置', 'daily': '每日', 'weekly': '每周', 'monthly': '每月'}
      var.typeNames = {'item': '物品', 'command': '指令'}
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
    open: |-
      Packet.send(var.packetId, 'shop_edit_list')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72

controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~15,31,26,245

  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~242,237,223,255
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~35,76,63,210
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~183,149,86,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&0全球市场"
              fontSize: 64
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 286
              width: 1
              height: 30
              normal: ~35,76,63,210
          副标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 310
              texts: "~&8管理工作台 / 系统商店"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~35,76,63,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '183,149,86,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧：商店列表 ────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~242,237,223,255
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          新建商店按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                var.editShopNew = true
                var.editShopId = ''
                var.fShopName = ''
                var.fShopPerm = ''
                var.fShopTags = ''
                var.fShopIconJson = var.air
                var.fShopIconMode = 'none'
                var.editItems = {}
                var.maxEditItemCount = 0
                var.view = 'shop'
                scheduler.delay(50, -> {
                  val.商店ID输入.setContent('')
                  val.商店名输入.setContent('')
                  val.商店权限输入.setContent('')
                  val.商店标签输入.setContent('')
                  val.商店图标预览.seticon()
                  for(key in var.editRowRefs.keys()){
                    var.editRowRefs[key].remove()
                  }
                  var.editRowRefs = {}
                })
            children:
              新建商店底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~35,76,63,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '183,149,86,255' : '255,255,255,230'"
              新建商店文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f＋ 新建商店"
                  fontSize: 36
                  through: true
          商店列表标题:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 96
              texts: "~&0柜台目录"
              fontSize: 36
              through: true
          商店滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -10
              y: 148
              width: 8
              height: "var.viewH - 316"
              normal: ~24,50,40,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          商店滑块:
            type: Texture
            val: 商店滑块
            attribute:
              point: ~top_right
              x: -10
              y: 148
              width: 8
              height: 60
              normal: ~183,149,86,255
              maxDragY: "var.viewH - 376"
              shape: ~round_rect
              radius: 4
          商店滚动:
            type: Scroll
            attribute:
              point: ~top_left
              x: 20
              y: 148
              width: 260
              height: "var.viewH - 316"
              moveY: "self.parent['商店滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['商店滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['商店滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              商店行区:
                val: 商店行区
                type: VStack
                attribute:
                  width: 254
                  spaceBetween: 8
                children:
                  商店行:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.editShops[self.entryKey]
                      visible: self.entry != none
                      width: 254
                      height: 56
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'shop_edit_shop', self.entry['id'])
                    children:
                      商店行底:
                        type: Texture
                        attribute:
                          point: ~top_left
                          x: 3
                          y: 0
                          width: 248
                          height: 56
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['id'] == var.editShopId && var.editShopNew != true ? '110,144,116,210' : '35,76,63,210'"
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 3
                            color: "self.parent.entry != none && self.parent.entry['id'] == var.editShopId && var.editShopNew != true ? '255,255,255,255' : (self.isHovered() ? '183,149,86,255' : '255,255,255,230')"
                      商店行图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 0.72
                          x: 8
                          y: 8
                          width: 40
                          height: 40
                          through: true
                          normal: ~45,65,48,220
                          shape: ~round_rect
                          radius: 8
                          seticon: "self.setItemIcon(var.shopIconJsons[self.parent.entryKey] != none && var.shopIconJsons[self.parent.entryKey] != '' ? var.shopIconJsons[self.parent.entryKey] : var.air)"
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,230
                      商店行文字:
                        type: Scroll
                        attribute:
                          x: 56
                          y: 10
                          width: 156
                          height: 36
                          through: true
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: "self.scrollAnim = Lerp(0, 1, 2400)"
                          leave: "self.scrollAnim = none"
                        children:
                          柜台名称布局:
                            type: HStack
                            attribute:
                              height: 36
                              through: true
                            children:
                              柜台名称:
                                type: Text
                                attribute:
                                  texts: "self.parent.parent.parent.entry != none ? '&f' + var.shopTexts[self.parent.parent.parent.entryKey] : ''"
                                  fontSize: 36
                                  through: true
                      商店行数量:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -12
                          texts: "self.parent.entry != none ? '&7' + self.parent.entry['itemCount'].round() : ''"
                          fontSize: 36
                          through: true

      # ── 内容区 ────────────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~242,237,223,255
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          空态提示:
            type: Canvas
            attribute:
              width: "var.contentW"
              height: "var.viewH - 144"
              visible: "var.view == 'list'"
            children:
              工作台标题:
                type: Text
                attribute:
                  x: 32
                  y: 36
                  texts: "~&0系统商店管理台"
                  fontSize: 72
                  through: true
              工作台说明:
                type: Text
                attribute:
                  x: 32
                  y: 104
                  texts: "~&8从左侧选择柜台，或新建一间商店开始配置"
                  fontSize: 36
                  through: true
              流程底:
                type: Texture
                attribute:
                  x: 32
                  y: 192
                  width: "var.contentW - 64"
                  height: 336
                  normal: ~24,50,40,255
                  shape: ~round_rect
                  radius: 12
                  through: true
              柜台步骤:
                type: Text
                attribute:
                  x: 64
                  y: 224
                  texts: "~&e01 / 配置柜台"
                  fontSize: 54
                  through: true
              柜台说明:
                type: Text
                attribute:
                  x: 64
                  y: 286
                  texts:
                    - "~&7设置显示名、访问权限与标签"
                    - "~&7从背包选择展示图标"
                  fontSize: 36
                  through: true
              商品步骤:
                type: Text
                attribute:
                  x: "var.contentW / 2 + 24"
                  y: 224
                  texts: "~&e02 / 定价与库存"
                  fontSize: 54
                  through: true
              商品说明:
