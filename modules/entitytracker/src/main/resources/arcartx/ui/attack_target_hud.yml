# 文件用途: EntityTracker 模块「攻击目标 HUD」模板，展示玩家最近攻击的实体（Boss/普通怪）的血量、距离、超时倒计时等信息。
# 前置依赖: ArcartX、MythicMobs/MythicBukkit；EntityTracker 模块启用后自动导出到 plugins/ArcartXSuite/ui。
# 关联文件: ArcartXEntityTracker.yml（attack-target 节配置）、boss_tracker.yml（Boss 追踪 HUD）
# 重载命令: /axs entitytracker reload

ui:
  isHud: true                    # 是否为 HUD（常驻叠加层，不弹光标）
  defaultOpen: false             # 是否默认打开（HUD 一般由服务端 packet 驱动显隐）
  through: false                 # 是否点击穿透（HUD 不拦截鼠标）
  background: false              # 是否绘制全屏背景遮罩
  closeDied: true                # 玩家死亡时是否自动关闭 HUD
  show: true                     # 是否显示
  level: 2                       # HUD 渲染优先级（越大越先渲染=越底层）
  hide:                          # 本 HUD 存在时隐藏的原版 HUD 列表
    - boss_event_progress        # 隐藏原版 Boss 进度条，避免与自定义 HUD 重叠
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - title: 标题文本（如实体显示名）
    #   - subtitle: 副标题文本（如实体类型名）
    #   - health: 当前血量（数值）
    #   - maxHealth: 最大血量（数值）
    #   - healthText: 当前血量文本（格式化后的字符串）
    #   - maxHealthText: 最大血量文本（格式化后的字符串）
    #   - healthPercent: 血量百分比（0~1 小数）
    #   - healthPercentText: 血量百分比文本（如 "85"）
    #   - progress: 血条进度比值（0~1，用于血条宽度计算）
    #   - distance: 与玩家的距离（数值，单位：格）
    #   - distanceText: 距离文本（格式化后的字符串）
    #   - displayName: 实体显示名称
    #   - entityUuid: 实体 UUID
    #   - world: 实体所在世界名
    #   - x/y/z: 实体坐标
    #   - entityType: Bukkit EntityType 枚举名
    #   - entityTypeName: 实体类型中文名
    #   - mythicMobId: MythicMob 内部 ID（非 MythicMob 实体则为 none）
    #   - isPlayerTarget: 目标实体是否为玩家（EntityTargetSnapshot.playerTarget）
    #   - lastHitAgoMs: 距上次攻击过去的毫秒数
    #   - timeoutMs: 目标超时阈值（毫秒，超过此时间未攻击则关闭 HUD）
    init: |-
      var.isVisible = true
      var.title = packet['title']
      var.subtitle = packet['subtitle']
      var.health = packet['health']
      var.maxHealth = packet['maxHealth']
      var.healthText = packet['healthText']
      var.maxHealthText = packet['maxHealthText']
      var.healthPercent = packet['healthPercent']
      var.healthPercentText = packet['healthPercentText']
      var.progress = packet['progress']
      var.distance = packet['distance']
      var.distanceText = packet['distanceText']
      var.displayName = packet['displayName']
      var.entityUuid = packet['entityUuid']
      var.world = packet['world']
      var.x = packet['x']
      var.y = packet['y']
      var.z = packet['z']
      var.entityType = packet['entityType']
      var.entityTypeName = packet['entityTypeName']
      var.mythicMobId = packet['mythicMobId']
      var.isPlayerTarget = packet['isPlayerTarget']
      var.lastHitAgoMs = packet['lastHitAgoMs']
      var.timeoutMs = packet['timeoutMs']
      // Presentation-only timeout values; keep ternaries out of nested expressions.
      var.lockRatio = 0
      if(var.timeoutMs > 0){ var.lockRatio = 1 - var.lastHitAgoMs / var.timeoutMs }
      if(var.lockRatio < 0){ var.lockRatio = 0 }
      if(var.lockRatio > 1){ var.lockRatio = 1 }
      var.lockSeconds = (var.timeoutMs - var.lastHitAgoMs) / 1000
      if(var.lockSeconds < 0){ var.lockSeconds = 0 }
    # packetHandler: update
    # 包字段: 与 init 完全一致，详见 init 注释
    update: |-
      var.isVisible = true
      var.title = packet['title']
      var.subtitle = packet['subtitle']
      var.health = packet['health']
      var.maxHealth = packet['maxHealth']
      var.healthText = packet['healthText']
      var.maxHealthText = packet['maxHealthText']
      var.healthPercent = packet['healthPercent']
      var.healthPercentText = packet['healthPercentText']
      var.progress = packet['progress']
      var.distance = packet['distance']
      var.distanceText = packet['distanceText']
      var.displayName = packet['displayName']
      var.entityUuid = packet['entityUuid']
      var.world = packet['world']
      var.x = packet['x']
      var.y = packet['y']
      var.z = packet['z']
      var.entityType = packet['entityType']
      var.entityTypeName = packet['entityTypeName']
      var.mythicMobId = packet['mythicMobId']
      var.isPlayerTarget = packet['isPlayerTarget']
      var.lastHitAgoMs = packet['lastHitAgoMs']
      var.timeoutMs = packet['timeoutMs']
      // Presentation-only timeout values; keep ternaries out of nested expressions.
      var.lockRatio = 0
      if(var.timeoutMs > 0){ var.lockRatio = 1 - var.lastHitAgoMs / var.timeoutMs }
      if(var.lockRatio < 0){ var.lockRatio = 0 }
      if(var.lockRatio > 1){ var.lockRatio = 1 }
      var.lockSeconds = (var.timeoutMs - var.lastHitAgoMs) / 1000
      if(var.lockSeconds < 0){ var.lockSeconds = 0 }
    # packetHandler: close
    # 服务端主动关闭 HUD 时执行，将所有变量重置为默认空值
    close: |-
      var.distanceText = '-'
      var.healthPercentText = '0'
      var.healthText = '0'
      var.lastHitAgoMs = 0
      var.maxHealthText = '0'
      var.progress = 0
      var.timeoutMs = 0
      var.lockRatio = 0
      var.lockSeconds = 0
      var.isVisible = false
  action:
    # load 在 HUD 首次加载时执行，初始化所有变量为默认空值，避免数据包到达前显示脏数据
    load: |-
      var.isVisible = false

# Tracking instrument: centered target strip; Boss instrument occupies the left edge.
# No fullscreen backdrop. Decorative controls pass events; HUD configuration is unchanged.
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      目标面板:
        type: Canvas
        attribute:
          point: ~top_center
          y: 24
          width: 660
          height: 142
          visible: var.isVisible
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~Frosted:12;19,27,34,232
              shape: ~round_rect
              radius: 6
            effect:
              stroke:
                width: 1
                color: ~72,103,117,230
          信号边:
            type: Texture
            attribute:
              x: 0
              y: 8
              width: 3
              height: 116
              normal: "var.progress <= 0.2 ? '239,79,89,255' : '69,211,224,255'"
              through: true
          目标标记:
            type: Text
            attribute:
              x: 20
              y: 10
              texts: "var.isPlayerTarget ? '&bTARGET / 玩家' : '&bTARGET / 实体'"
              fontSize: 36
              through: true
          距离:
            type: Text
            attribute:
              point: ~top_right
              x: -20
              y: 10
              texts: "'&7距离 &f' + var.distanceText"
              fontSize: 36
              through: true
          标题窗口:
            type: Scroll
            attribute:
              x: 20
              y: 34
              width: 620
              height: 32
              through: true
            children:
              标题布局:
                type: HStack
                attribute:
                  height: 32
                  through: true
                children:
                  标题:
                    type: Text
                    attribute:
                      texts: var.title
                      fontSize: 48
                      through: true
          血条背景:
            type: Texture
            attribute:
              x: 20
              y: 72
              width: 620
              height: 10
              normal: ~44,57,66,255
              through: true
          血条填充:
            type: Texture
            attribute:
              x: 20
              y: 72
              width: "620 * (var.progress > 1 ? 1 : var.progress)"
              height: 10
              normal: "var.progress <= 0.2 ? '239,79,89,255' : '194,66,77,255'"
              visible: var.progress > 0
              through: true
          血量文字:
            type: Text
            attribute:
              x: 20
              y: 88
              texts: "'&7HP &f' + var.healthText + ' &7/ &f' + var.maxHealthText"
              fontSize: 36
              through: true
          血量百分比:
            type: Text
            attribute:
              point: ~top_right
              x: -20
              y: 88
              texts: "(var.progress <= 0.2 ? '&c' : '&f') + var.healthPercentText + '%'"
              fontSize: 36
              through: true
          副标题窗口:
            type: Scroll
            attribute:
              x: 20
              y: 112
              width: 360
              height: 22
              through: true
            children:
              副标题布局:
                type: HStack
                attribute:
                  height: 22
                  through: true
                children:
                  副标题:
                    type: Text
                    attribute:
                      texts: "'&7' + var.subtitle"
                      fontSize: 36
                      through: true
          超时文字:
            type: Text
            attribute:
              point: ~top_right
              x: -20
              y: 112
              texts: "'&7锁定剩余 &b' + var.lockSeconds.round(1) + 's'"
              fontSize: 36
              through: true
          超时底线:
            type: Texture
            attribute:
              point: ~bottom_left
              y: 0
              width: 660
              height: 2
              normal: ~44,57,66,255
              through: true
          超时信号:
            type: Texture
            attribute:
              point: ~bottom_left
              y: 0
              width: "660 * var.lockRatio"
              height: 2
              normal: ~69,211,224,255
              through: true