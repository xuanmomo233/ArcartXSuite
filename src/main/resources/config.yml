        unlock_anchor:
          window-ms: 3000
          max-hits: 1
          mode: "silent"
        teleport_anchor:
          window-ms: 3000
          max-hits: 1
          mode: "silent"
        create_waypoint:
          window-ms: 2000
          max-hits: 1
          mode: "silent"
        delete_waypoint:
          window-ms: 2000
          max-hits: 1
          mode: "silent"
    announcer:
      actions:
        click:
          window-ms: 3000
          max-hits: 2
          mode: "notify"
    eventpacket:
      actions:
        client-packet:
          window-ms: 3000
