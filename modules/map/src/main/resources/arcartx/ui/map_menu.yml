# AXS 资源说明
# 用途: Map 模块默认全屏地图 GUI。
# 前置依赖: ArcartX + Arcart-Suite-Map 客户端 mod；Map 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.map.enabled + modules.map.password
# 关联文件: ArcartXMap.yml、ui/map_hud.yml
# 重载命令: /axs map reload
#
# 地图渲染由 Arcart-Suite-Map 客户端 mod 负责：
#   - UI 的 tick 触发器每帧通过 Aria use() 调用 mod 的 MapRenderer.setRegion()，
#     把地图渲染区的屏幕坐标传给 mod
#   - packet init/update 时通过 use() 调用 mod 的 clearMarkers()/addMarker()，
#     把锚点/路径点/外部目标的世界坐标传给 mod
#   - mod 在 ArcartXLayerRenderEvent 事件中往指定区域渲染地图画面、玩家箭头、标点图标

ui:
  isHud: false
  background: true
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 通信标识，用于 Packet.send 回包
    #   - selectedWorldId: 当前选中的世界 ID
    #   - selectedWorldName: 当前选中的世界名称
    #   - worldRows: 世界列表行数据
    #   - anchorRows: 锚点列表行数据（含 x/y/z 世界坐标）
    #   - waypointRows: 路径点列表行数据（含 x/y/z 世界坐标）
    #   - externalTargetRows: 外部目标列表行数据（含 x/y/z 世界坐标）
    #   - waypointLimit: 路径点上限
    #   - waypointCount: 当前路径点数量
    #   - canCreateWaypoint: 是否允许创建路径点
    #   - clearTrackVisible: 是否显示清除导航按钮
    #   - trackingText: 导航追踪提示文本
    #   - detailSelectedType: 详情面板选中类型
    #   - detailSelectedId: 详情面板选中 ID
    #   - detailTitle: 详情标题
    #   - detailDescription: 详情描述
    #   - detailUnlocked: 是否已解锁
    #   - detailUnlockCostText: 解锁费用文本
    #   - detailTeleportCostText: 传送费用文本
    #   - detailExternalTarget: 是否为外部目标
    #   - detailCanUnlock: 是否可解锁
    #   - detailCanTeleport: 是否可传送
    #   - detailCanTrackAnchor: 是否可追踪锚点
    #   - detailCanTrackWaypoint: 是否可追踪路径点
    #   - detailCanTrackExternal: 是否可追踪外部目标
    #   - detailCanDeleteWaypoint: 是否可删除路径点
    #   - detailCanCreateWaypoint: 是否可创建路径点
    #   - detailClearTrackVisible: 详情面板是否显示清除导航
    #   - detailTrackingText: 详情面板导航追踪文本
    #   - maxWorldCount: 世界行模板最大复制数
    #   - maxAnchorCount: 锚点行模板最大复制数
    #   - maxWaypointCount: 路径点行模板最大复制数
    #   - maxExternalCount: 外部目标行模板最大复制数
    init: |-
      var.packetId = packet['packetId']
      var.selectedWorldId = packet['selectedWorldId']
      var.selectedWorldName = packet['selectedWorldName']
      var.worldRows = packet['worldRows']
      var.anchorRows = packet['anchorRows']
      var.waypointRows = packet['waypointRows']
      var.externalTargetRows = packet['externalTargetRows']
      var.waypointLimit = packet['waypointLimit']
      var.waypointCount = packet['waypointCount']
      var.canCreateWaypoint = packet['canCreateWaypoint']
      var.clearTrackVisible = packet['clearTrackVisible']
      var.trackingText = packet['trackingText']
      var.detailSelectedType = packet['detailSelectedType']
      var.detailSelectedId = packet['detailSelectedId']
      var.detailTitle = packet['detailTitle']
      var.detailDescription = packet['detailDescription']
      var.detailUnlocked = packet['detailUnlocked']
      var.detailUnlockCostText = packet['detailUnlockCostText']
      var.detailTeleportCostText = packet['detailTeleportCostText']
      var.detailExternalTarget = packet['detailExternalTarget']
      var.detailCanUnlock = packet['detailCanUnlock']
      var.detailCanTeleport = packet['detailCanTeleport']
      var.detailCanTrackAnchor = packet['detailCanTrackAnchor']
      var.detailCanTrackWaypoint = packet['detailCanTrackWaypoint']
      var.detailCanTrackExternal = packet['detailCanTrackExternal']
      var.detailCanDeleteWaypoint = packet['detailCanDeleteWaypoint']
      var.detailCanCreateWaypoint = packet['detailCanCreateWaypoint']
      var.detailClearTrackVisible = packet['detailClearTrackVisible']
      var.detailTrackingText = packet['detailTrackingText']
      var.maxWorldCount = packet['maxWorldCount']
      var.maxAnchorCount = packet['maxAnchorCount']
      var.maxWaypointCount = packet['maxWaypointCount']
      var.maxExternalCount = packet['maxExternalCount']
      var.actionToken = packet['action_token']
      while(val.world_entry.childrenCount() > 1){
        val.world_entry.get(1).remove()
      }
      for(i in range(1, var.maxWorldCount - 1)){
        key = i.round()
        e = val.world_entry['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.anchor_row.childrenCount() > 1){
        val.anchor_row.get(1).remove()
      }
      for(i in range(1, var.maxAnchorCount - 1)){
        key = i.round()
        e = val.anchor_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.waypoint_row.childrenCount() > 1){
        val.waypoint_row.get(1).remove()
      }
      for(i in range(1, var.maxWaypointCount - 1)){
        key = i.round()
        e = val.waypoint_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.external_row.childrenCount() > 1){
        val.external_row.get(1).remove()
      }
      for(i in range(1, var.maxExternalCount - 1)){
        key = i.round()
        e = val.external_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      var.actionBusy = false
      var.actionBusySeconds = 0
      // 同步标点数据到客户端 mod
      call_syncMarkers()
    # packetHandler: update
    # 包字段: 同 init（实时刷新地图菜单数据）
    update: |-
      var.packetId = packet['packetId']
      var.selectedWorldId = packet['selectedWorldId']
      var.selectedWorldName = packet['selectedWorldName']
      var.worldRows = packet['worldRows']
      var.anchorRows = packet['anchorRows']
      var.waypointRows = packet['waypointRows']
      var.externalTargetRows = packet['externalTargetRows']
      var.waypointLimit = packet['waypointLimit']
      var.waypointCount = packet['waypointCount']
      var.canCreateWaypoint = packet['canCreateWaypoint']
      var.clearTrackVisible = packet['clearTrackVisible']
      var.trackingText = packet['trackingText']
      var.detailSelectedType = packet['detailSelectedType']
      var.detailSelectedId = packet['detailSelectedId']
      var.detailTitle = packet['detailTitle']
      var.detailDescription = packet['detailDescription']
      var.detailUnlocked = packet['detailUnlocked']
      var.detailUnlockCostText = packet['detailUnlockCostText']
      var.detailTeleportCostText = packet['detailTeleportCostText']
      var.detailExternalTarget = packet['detailExternalTarget']
      var.detailCanUnlock = packet['detailCanUnlock']
      var.detailCanTeleport = packet['detailCanTeleport']
      var.detailCanTrackAnchor = packet['detailCanTrackAnchor']
      var.detailCanTrackWaypoint = packet['detailCanTrackWaypoint']
      var.detailCanTrackExternal = packet['detailCanTrackExternal']
      var.detailCanDeleteWaypoint = packet['detailCanDeleteWaypoint']
      var.detailCanCreateWaypoint = packet['detailCanCreateWaypoint']
      var.detailClearTrackVisible = packet['detailClearTrackVisible']
      var.detailTrackingText = packet['detailTrackingText']
      var.maxWorldCount = packet['maxWorldCount']
      var.maxAnchorCount = packet['maxAnchorCount']
      var.maxWaypointCount = packet['maxWaypointCount']
      var.maxExternalCount = packet['maxExternalCount']
      var.actionToken = packet['action_token']
      while(val.world_entry.childrenCount() > 1){
        val.world_entry.get(1).remove()
      }
      for(i in range(1, var.maxWorldCount - 1)){
        key = i.round()
        e = val.world_entry['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.anchor_row.childrenCount() > 1){
        val.anchor_row.get(1).remove()
      }
      for(i in range(1, var.maxAnchorCount - 1)){
        key = i.round()
        e = val.anchor_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.waypoint_row.childrenCount() > 1){
        val.waypoint_row.get(1).remove()
      }
      for(i in range(1, var.maxWaypointCount - 1)){
        key = i.round()
        e = val.waypoint_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.external_row.childrenCount() > 1){
        val.external_row.get(1).remove()
      }
      for(i in range(1, var.maxExternalCount - 1)){
        key = i.round()
        e = val.external_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      var.actionBusy = false
      // 同步标点数据到客户端 mod
      call_syncMarkers()
  action:
    # 视口换算：把窗口实际宽高折算回设计坐标系（按避坑指南 §16）
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      var.scale = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / var.scale
      var.viewH = Screen.getHeight() / var.scale
      var.offX = (var.viewW - 1920) / 2
      // 加载客户端 mod 的 MapRenderer 实例
      var.mapMod = none
      var.mapRenderer = none
      try {
        var.mapMod = use('xuanmo.arcartsuitemap.ArcartSuiteMapMod')
        var.mapRenderer = var.mapMod.getMapRenderer()
      } catch(e) {
        // mod 未安装，地图渲染区将保持空白
      }
      // 同步标点的函数定义
      var.syncMarkers = -> {
        if(var.mapRenderer == none) { return }
        var.mapRenderer.clearMarkers()
        // 锚点
        if(var.anchorRows != none) {
          for(key in var.anchorRows.keys()) {
            row = var.anchorRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'anchor', row['displayName'], row['x'], row['z'], row['selected'], row['tracked'], row['unlocked'])
            }
          }
        }
        // 路径点
        if(var.waypointRows != none) {
          for(key in var.waypointRows.keys()) {
            row = var.waypointRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'waypoint', row['name'], row['x'], row['z'], row['selected'], row['tracked'], true)
            }
          }
        }
        // 外部目标
        if(var.externalTargetRows != none) {
          for(key in var.externalTargetRows.keys()) {
            row = var.externalTargetRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'external', row['name'], row['x'], row['z'], row['selected'], row['tracked'], true)
            }
          }
        }
      }
      // 调用同步标点的快捷函数
      var.call_syncMarkers = -> {
        if(var.syncMarkers != none) { var.syncMarkers() }
      }
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      var.scale = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / var.scale
      var.viewH = Screen.getHeight() / var.scale
      var.offX = (var.viewW - 1920) / 2
    # tick：每帧计算地图渲染区的屏幕坐标，传给客户端 mod
    tick: |-
      if(var.mapRenderer != none) {
        // Adaptive ~top_center：水平居中，顶部对齐
        // 主面板 ~middle_center 在 Adaptive 里，宽 1520 高 900
        // 主面板左上角在设计坐标系中 = (200, 90)
        // 地图区域在主面板里: x=24, y=280, w=900, h=596
        // 地图区域左上角在设计坐标系中 = (224, 370)
        mapX = (var.offX + 224) * var.scale
        mapY = 370 * var.scale
        mapW = 900 * var.scale
        mapH = 596 * var.scale
        var.mapRenderer.setRegion(mapX, mapY, mapW, mapH, var.scale)
        // 设置当前世界 ID（mod 据此判断是否需要重新渲染纹理）
        var.mapRenderer.setWorldId(var.selectedWorldId)
        // 设置玩家位置与朝向（mod 据此定位玩家箭头和地图中心）
        // 使用 Aria use() 获取 Minecraft 客户端玩家数据
        try {
          mc = use('net.minecraft.client.MinecraftClient')
          player = mc.field_1729  // MinecraftClient.instance (INSTANCE field)
          if(player != none) {
            p = player.field_1724  // MinecraftClient.player
            if(p != none) {
              var.mapRenderer.setPlayerPose(p.getX(), p.getZ(), p.getYaw())
            }
          }
        } catch(e2) {
          // 获取玩家数据失败，mod 将使用上次的位置
        }
      }
    open: |-
      var.packetId = 'AXS_MAP'
      var.selectedWorldId = none
      var.selectedWorldName = '未选择'
      var.worldRows = {}
      var.anchorRows = {}
      var.waypointRows = {}
      var.externalTargetRows = {}
      var.waypointLimit = 0
      var.waypointCount = 0
      var.canCreateWaypoint = false
      var.clearTrackVisible = false
      var.trackingText = '当前未导航'
      var.detailSelectedType = 'none'
      var.detailSelectedId = none
      var.detailTitle = '未选中目标'
      var.detailDescription = '请选择一个锚点或路径点。'
      var.detailUnlocked = true
      var.detailUnlockCostText = none
      var.detailTeleportCostText = none
      var.detailExternalTarget = false
      var.detailCanUnlock = false
      var.detailCanTeleport = false
      var.detailCanTrackAnchor = false
      var.detailCanTrackWaypoint = false
      var.detailCanTrackExternal = false
      var.detailCanDeleteWaypoint = false
      var.detailCanCreateWaypoint = false
      var.detailClearTrackVisible = false
      var.detailTrackingText = '当前未导航'
      var.maxWorldCount = 0
      var.maxAnchorCount = 0
      var.maxWaypointCount = 0
      var.maxExternalCount = 0
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
    close: |-
      // 通知 mod 停止渲染
      if(var.mapRenderer != none) {
        var.mapRenderer.deactivate()
      }
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1520
          height: 900
        children:
          地图主背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~28,30,38,235
              shape: ~round_rect
              radius: 28
          边框:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~255,255,255,18
              shape: ~round_rect
              radius: 28
          地图菜单标题:
            type: Text
            attribute:
              point: ~top_left
              x: 36
              y: 24
              texts: "'&f地图总览 &8/ &7' + var.selectedWorldName"
              fontSize: 30
              shadow: true
          追踪文字:
            type: Text
            attribute:
              point: ~top_left
              x: 36
              y: 62
              texts: "'&b' + var.trackingText"
              fontSize: 18
              shadow: true
          # ─── 世界列表 ───
          世界列表面板:
            type: Texture
            attribute:
              point: ~top_left
              x: 24
              y: 110
              width: 360
              height: 150
              normal: ~255,255,255,25
              shape: ~round_rect
              radius: 18
          世界列表标题:
            type: Text
            attribute:
              point: ~top_left
              x: 42
              y: 128
              texts: "'&f世界列表'"
              fontSize: 22
              shadow: true
          世界滑块:
            type: Texture
            val: 世界滑块
            attribute:
              point: ~top_left
              x: 42
              y: 248
              width: 30
              height: 6
              normal: ~120,120,120,200
              maxDragX: 294
          世界滚动栏:
            type: Scroll
            attribute:
              point: ~top_left
              x: 42
              y: 162
              width: 324
              height: 82
              moveX: "self.parent['世界滑块'].getDragXRatio()"
            action:
              wheel: |-
                if(self.moveX >= 0 && self.wheelValue > 0){
                  self.parent['世界滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                }
                if(self.moveX <= 1 && self.wheelValue < 0){
                  self.parent['世界滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                }
            children:
              world_list:
                val: world_entry
                type: HStack
                attribute:
                  height: 68
                  spaceBetween: 12
                children:
                  地图项目:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.worldRows[self.entryKey]
                      visible: self.entry != none
                      width: 148
                      height: 68
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'open_world', self.entry['id'])
                    children:
                      地图项目背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['selected'] ? '74,144,226,255' : '52,56,64,255'"
                          hover: "self.parent.entry != none && self.parent.entry['selected'] ? '94,164,246,255' : '72,76,84,255'"
                          shape: ~round_rect
                          radius: 16
                      地图项目文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 148
                          texts: "self.parent.entry != none ? self.parent.entry['displayName'] : none"
                          fontSize: 20
                          shadow: true
                          through: true
          # ─── 地图渲染区（由 Arcart-Suite-Map mod 渲染） ───
          地图渲染区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 280
              width: 900
              height: 596
            # 这个 Canvas 不带背景色，mod 会直接往这个区域渲染地图画面
            # Canvas 的 through 不设为 true，以便接收鼠标交互（滚轮缩放/拖拽平移）
            children:
              地图区域边框:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,255,255,30
                  shape: ~round_rect
                  radius: 22
              地图区域背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~20,22,28,255
                  shape: ~round_rect
                  radius: 22
              地图加载提示:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 900
                  texts: "'&7地图加载中...'"
                  fontSize: 24
                  shadow: true
                  through: true
                  visible: "var.mapRenderer == none"
          # ─── 锚点列表 ───
          锚点面板:
            type: Texture
            attribute:
              point: ~top_left
              x: 948
              y: 110
              width: 548
              height: 250
              normal: ~255,255,255,25
              shape: ~round_rect
              radius: 18
          锚点标题:
            type: Text
            attribute:
              point: ~top_left
              x: 972
              y: 126
              texts: "'&f锚点列表'"
              fontSize: 22
              shadow: true
          锚点滑块:
            type: Texture
            val: 锚点滑块
            attribute:
              point: ~top_left
              x: 1466
              y: 156
              width: 6
              height: 40
              normal: ~120,120,120,200
              maxDragY: 146
          锚点滚动栏:
            type: Scroll
            attribute:
              point: ~top_left
              x: 972
              y: 156
              width: 500
              height: 186
              moveY: "self.parent['锚点滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['锚点滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['锚点滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              anchor_stack:
                val: anchor_row
                type: VStack
                attribute:
                  width: 500
                  spaceBetween: 10
                children:
                  地图项目:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.anchorRows[self.entryKey]
                      visible: self.entry != none
                      width: 500
                      height: 70
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'select_anchor', self.entry['id'])
                    children:
                      地图项目背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['selected'] ? '74,144,226,255' : '52,56,64,255'"
                          hover: "self.parent.entry != none && self.parent.entry['selected'] ? '94,164,246,255' : '72,76,84,255'"
                          shape: ~round_rect
                          radius: 14
                      地图项目状态:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 20
                          y: 18
                          texts: "self.parent.entry != none ? (self.parent.entry['unlocked'] ? '&a● 已解锁' : '&c● 未解锁') : none"
                          fontSize: 18
                          shadow: true
                          through: true
                      地图项目文字:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 20
                          y: 42
                          texts: "self.parent.entry != none ? '&7' + self.parent.entry['displayName'] : none"
                          fontSize: 16
                          shadow: true
                          through: true
          # ─── 路径点列表 ───
          路径点面板:
            type: Texture
            attribute:
              point: ~top_left
              x: 948
              y: 374
              width: 548
              height: 142
              normal: ~255,255,255,25
              shape: ~round_rect
              radius: 18
          路径点标题:
            type: Text
            attribute:
              point: ~top_left
              x: 972
              y: 390
              texts: "'&f路径点 &8(' + var.waypointCount + '/' + var.waypointLimit + '&8)'"
              fontSize: 22
              shadow: true
          路径点滑块:
            type: Texture
            val: 路径点滑块
            attribute:
              point: ~top_left
              x: 1466
              y: 420
              width: 6
              height: 20
              normal: ~120,120,120,200
