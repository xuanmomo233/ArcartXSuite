# AXS QuestGPS 任务指引 HUD — 紫罗兰多追踪版
# 用途: 任务追踪时屏幕左上角常驻 HUD，展示所有追踪中任务的名称、进度、当前目标与导航坐标
# 风格: 紫罗兰毛玻璃，与 questgps_menu 主菜单统一
# 位置: 左上角偏下（x=16, y=220），避开聊天框/血条/小地图
# 数据: 服务端 QuestGpsGuidePacketFactory 发送 init/update 包，最多3张任务卡片

ui:
  isHud: true
  defaultOpen: false
  background: false
  closeDied: true
  through: true
  screenScale: true
  show: true
  level: 3
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包 ID（用于客户端回传服务端）
    #   - active: HUD 是否激活显示
    #   - trackedCount: 追踪中的目标总数
    #   - quests: 追踪任务卡片字典（key="0"~"2"，value含questId/name/label/progressText/taskText/taskDesc/navText/hasNav/navWorld）
    #   - questCount: 卡片数（最多3）
    #   - 兼容字段: questName/navWorld/navX/navY/navZ/hasNav（主追踪目标摘要）
    init: |-
      var.packetId = packet['packetId']
      var.active = packet['active']
      var.trackedCount = packet['trackedCount']
      var.quests = packet['quests']
      var.questCount = packet['questCount']
      var.questKeys = var.quests.keys()
      var.taskIndex = 0
      for(key in var.questKeys){
        item = val.guide_quest_list['追踪卡' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = key
        }
        var.taskIndex = var.taskIndex + 1
      }
      while(var.taskIndex < 3){
        item = val.guide_quest_list['追踪卡' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = none
        }
        var.taskIndex = var.taskIndex + 1
      }
    # packetHandler: update
    # 包字段: 与 init 相同，用于增量更新 HUD 数据
    update: |-
      var.packetId = packet['packetId']
      var.active = packet['active']
      var.trackedCount = packet['trackedCount']
      var.quests = packet['quests']
      var.questCount = packet['questCount']
      var.questKeys = var.quests.keys()
      var.taskIndex = 0
      for(key in var.questKeys){
        item = val.guide_quest_list['追踪卡' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = key
        }
        var.taskIndex = var.taskIndex + 1
      }
      while(var.taskIndex < 3){
        item = val.guide_quest_list['追踪卡' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = none
        }
        var.taskIndex = var.taskIndex + 1
      }
  action:
    load: |-
      var.trackedCount = 0
      var.quests = {}

# ─── 控件树 ────────────────────────────────────────────────────────
# 布局: Adaptive stretch_all + 左上角偏下面板（420宽）
# 结构: 毛玻璃底 + 紫罗兰强调条 + 标题 + 3张追踪任务卡片
# 配色: 紫罗兰 主色170,120,220 底28,22,38,210 抬升50,44,68,245 描边170,120,220,240
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      任务面板:
        type: Canvas
        attribute:
          point: ~top_left
          x: 16
          y: 220
          width: 420
          height: 340
          visible: var.active
        effect:
          offsetAnimate:
            duration: 300
            interpolator: decelerate
            x: -440
            y: 0
        children:
          # ── 面板背景 ────────────────────────────────
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~20,16,30,235
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 3
                color: ~170,120,220,240
          # 紫罗兰强调条（左侧竖条）
          强调条:
            type: Texture
            attribute:
              point: ~top_left
              x: 0
              y: 0
              width: 5
              height: 340
              normal: ~170,120,220,255
              shape: ~round_rect
              radius: 4
          # ── 头部（标题左 + 追踪数量右）─────────────
          任务图标:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 16
              texts: "~&f⬡"
              fontSize: 32
              through: true
          标题:
            type: Text
            attribute:
              point: ~top_left
              x: 48
              y: 16
              texts: "~&f任务追踪"
              fontSize: 32
              through: true
          数量文字:
            type: Text
            attribute:
              point: ~top_right
              x: -16
              y: 16
              texts: "var.trackedCount > 0 ? '&f' + var.trackedCount + ' 个目标' : none"
              fontSize: 32
              through: true
          # ── 头部分隔线 ──────────────────────────────
          头部分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 16
              y: 56
              width: 388
              height: 2
              normal: ~170,120,220,180
          # ── 追踪任务卡片列表（3个固定槽位）───────────
          任务列表:
            val: guide_quest_list
            type: VStack
            attribute:
              point: ~top_left
              x: 16
              y: 68
              width: 388
              spaceBetween: 8
            children:
              追踪卡0:
                type: Canvas
                attribute:
                  point: ~top_left
                  width: 388
                  height: 84
                  entryKey: none
                  visible: self.entryKey != none && var.quests[self.entryKey] != none
                  entry: var.quests[self.entryKey]
                children:
                  项背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~40,32,56,200
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 2
                        color: ~170,120,220,160
                  任务名:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 12
                      y: 6
                      texts: "self.parent.entry != none ? '&f' + self.parent.entry['name'] : none"
                      fontSize: 30
                      through: true
                  进度文字:
                    type: Text
                    attribute:
                      point: ~top_right
                      x: -10
                      y: 6
                      texts: "self.parent.entry != none ? '&f' + self.parent.entry['progressText'] : none"
                      fontSize: 30
                      through: true
                  当前目标:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 12
                      y: 38
                      texts: "self.parent.entry != none ? '&7◈ ' + self.parent.entry['taskText'] : none"
                      fontSize: 26
                      through: true
                  导航坐标:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 12
                      y: 62
                      texts: "self.parent.entry != none && self.parent.entry['hasNav'] ? '&8→ ' + self.parent.entry['navText'] : none"
                      fontSize: 20
                      through: true
              追踪卡1:
                type: Canvas
                attribute:
                  point: ~top_left
                  width: 388
                  height: 84
                  entryKey: none
                  visible: self.entryKey != none && var.quests[self.entryKey] != none
                  entry: var.quests[self.entryKey]
                children:
                  项背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~40,32,56,200
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
