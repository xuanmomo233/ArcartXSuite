# AXS 钓鱼图鉴界面
# 打开方式: /fishing collection 或主界面导航跳转
# 数据交互: packetHandler init
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航（总览/图鉴/奖励/天赋/任务）+ 内容区
#       内容区 = 统计栏 + 标签栏（全部/普通/罕见/稀有/传说）+ 5列网格卡片
# 视觉规范:
#   全屏玻璃 Frosted:24;12,22,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片底 26,34,46,210  卡片描边 80,200,220,240
#   主色（青蓝）50,170,200  已完成 124,196,142  悬停高亮 80,200,220

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包标识符
    #   - playerLevel: 玩家当前钓鱼等级
    #   - currentXp: 玩家当前级内经验值
    #   - totalCaught: 玩家累计捕获鱼的总数
    #   - collectionCount: 已收集图鉴条目数
    #   - totalFishTypes: 鱼种总数
    #   - collectionPercent: 图鉴完成百分比
    #   - fishList: 鱼类列表字典，每项含 id/name/rarity/caught/maxSize/count
    #   - maxFishCount: 鱼类列表最大条目数
    #   - fishIconJson{idx}: 每条鱼的物品图标 JSON（分离模式）
    init: |-
      var.packetId = packet['packetId']
      var.playerLevel = packet['playerLevel']
      var.currentXp = packet['currentXp']
      var.totalCaught = packet['totalCaught']
      var.collectionCount = packet['collectionCount']
      var.totalFishTypes = packet['totalFishTypes']
      var.collectionPercent = packet['collectionPercent']
      var.fishList = packet['fishList']
      var.maxFishCount = packet['maxFishCount']
      var.itemJsons = {}
      if(var.fishList != none){
        for(key in var.fishList.keys()){
          json = packet['fishIconJson' + key]
          if(json != none && json != ''){
            var.itemJsons[key] = json
          } else {
            var.itemJsons[key] = var.emptyItemJson
          }
        }
      }
      var.needRebuild = true
  action:
    # load: 初始化变量 + 视口换算（Adaptive 以 1920x1080 等比缩放）
    load: |-
      var.collectionCount = 0
      var.currentXp = 0
      var.playerLevel = 1
      var.totalCaught = 0
      var.totalFishTypes = 0
      var.collectionPercent = 0
      var.maxFishCount = 0
      var.packetId = 'AXS_FISHING'
      var.itemJsons = {}
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.currentTab = 'all'
      var.needRebuild = false
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    # open: 界面打开后主动请求服务端推送数据
    open: |-
      Packet.send(var.packetId, 'refresh_collection')
    # resize: 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    # tick: 每帧检查是否需要重建网格（标签切换或数据更新时触发）
    tick: |-
      if(var.needRebuild){
        var.needRebuild = false
        while(val.鱼类网格.childrenCount() > 1){
          val.鱼类网格.get(1).remove()
        }
        if(var.maxFishCount > 1){
          for(i in range(1, var.maxFishCount - 1)){
            idx = i.round()
            entry = var.fishList[idx]
            if(entry != none && (var.currentTab == 'all' || entry['rarity'] == var.currentTab)){
              e = val.鱼类网格['鱼卡片'].copy('鱼卡片' + idx)
              e.entryKey = idx
              if(e['图标'] != none){
                e['图标'].seticon()
              }
            }
          }
        }
        if(val.鱼类网格['鱼卡片']['图标'] != none){
          val.鱼类网格['鱼卡片']['图标'].seticon()
        }
      }

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;12,22,38,110
  # 自适配布局：宽高 = 设计分辨率 1920x1080
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~80,200,220,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~50,170,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f钓鱼"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 168
              width: 1
              height: 30
              normal: ~80,200,220,230
          页名:
            type: Text
            attribute:
              point: ~middle_left
              x: 188
              texts: "~&f图鉴"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 40
                  texts: "~&f✕"
                  fontSize: 32
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~80,200,220,240
          导航总览:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_main')
            children:
              总览底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              总览文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f总览"
                  fontSize: 36
                  through: true
          # 当前页：图鉴
          导航图鉴:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            children:
              图鉴底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~50,170,200,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~50,170,200,230
              图鉴高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~50,170,200,255
                  shape: ~round_rect
                  radius: 2
              图鉴文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0图鉴"
                  fontSize: 36
          导航奖励:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_rewards')
            children:
              奖励底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              奖励文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f奖励"
                  fontSize: 36
                  through: true
          导航天赋:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_talents')
            children:
              天赋底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              天赋文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f天赋"
                  fontSize: 36
                  through: true
          导航任务:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 282
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_tasks')
            children:
              任务底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              任务文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f任务"
                  fontSize: 36
                  through: true
          导航饵料:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 348
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_baits')
            children:
              饵料底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '80,200,220,240'"
              饵料文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f饵料"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 430
              width: 264
              height: 2
              normal: ~80,200,220,220

      # ── 内容区（图鉴）──────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~80,200,220,240

          # 统计信息栏
          统计栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 20
              width: "var.contentW - 48"
              height: 80
            children:
              统计背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 2
                    color: ~80,200,220,230
              等级文本:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 10
                  texts: "'&bLv.' + var.playerLevel.round()"
                  fontSize: 34
              经验文本:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 46
                  texts: "'&7经验: &f' + var.currentXp.round()"
                  fontSize: 30
              捕获统计:
                type: Text
                attribute:
                  point: ~top_left
                  x: 300
                  y: 10
                  texts: "'&7捕获: &f' + var.totalCaught.round() + ' 条'"
                  fontSize: 30
              图鉴进度文本:
                type: Text
                attribute:
                  point: ~top_left
                  x: 300
                  y: 46
                  texts: "'&7图鉴: &f' + var.collectionCount.round() + '/' + var.totalFishTypes.round() + ' &7(' + var.collectionPercent.round() + '%)'"
                  fontSize: 30
              # 图鉴完成度进度条
              进度条容器:
                type: Canvas
                attribute:
                  point: ~middle_left
                  x: 560
                  width: "var.contentW - 640"
                  height: 36
                  through: true
                children:
                  进度条背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~26,34,46,210
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 2
                        color: ~80,200,220,240
                  进度条填充:
                    type: Texture
                    attribute:
                      point: ~middle_left
                      x: 4
                      width: "(var.contentW - 648) * var.collectionPercent / 100"
                      height: 28
                      normal: ~50,170,200,240
                      shape: ~round_rect
                      radius: 8
                  进度百分比:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: "var.contentW - 640"
                      texts: "'&f' + var.collectionPercent.round() + '%'"
                      fontSize: 30
                      through: true

          # 标签栏：全部/普通/罕见/稀有/传说
          标签栏:
            type: HStack
            attribute:
              point: ~top_left
              x: 24
              y: 116
              height: 50
              spaceBetween: 12
            children:
              标签_全部:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTab == 'all' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTab == 'all' ? '&f全部' : '&7全部'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTab = 'all'
                    var.needRebuild = true
              标签_普通:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTab == 'common' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTab == 'common' ? '&f普通' : '&7普通'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTab = 'common'
                    var.needRebuild = true
              标签_罕见:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTab == 'uncommon' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTab == 'uncommon' ? '&a罕见' : '&7罕见'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTab = 'uncommon'
                    var.needRebuild = true
              标签_稀有:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTab == 'rare' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTab == 'rare' ? '&9稀有' : '&7稀有'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTab = 'rare'
                    var.needRebuild = true
              标签_传说:
                type: Texture
                attribute:
                  width: 200
                  height: 50
                  normal: "var.currentTab == 'legendary' ? '50,170,200,230' : '26,34,46,200'"
                  shape: ~round_rect
                  radius: 10
                  texts: "var.currentTab == 'legendary' ? '&6传说' : '&7传说'"
                  fontSize: 30
                  center: true
                action:
                  clickLeft: |-
                    var.currentTab = 'legendary'
                    var.needRebuild = true

          # 图鉴滑轨：右侧滚动条轨道
          图鉴滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -16
              y: 186
              width: 12
              height: "var.viewH - 350"
              normal: ~15,25,38,220
              shape: ~round_rect
              radius: 6
            effect:
              stroke:
                width: 2
                color: ~80,200,220,240
          # 图鉴滑块：右侧滚动条滑块
          图鉴滑块:
            type: Texture
            val: 图鉴滑块
            attribute:
              point: ~top_right
              x: -16
              y: 186
              width: 12
              height: 120
              normal: ~50,170,200,220
              maxDragY: "var.viewH - 470"
              shape: ~round_rect
              radius: 6

          # 滚动区：可滚动的鱼类网格容器
          滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 186
              width: "var.contentW - 56"
              height: "var.viewH - 350"
              moveY: "self.parent['图鉴滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['图鉴滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['图鉴滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              # 鱼类网格：5列网格布局
              鱼类网格:
                val: 鱼类网格
                type: HGrid
                attribute:
                  width: "var.contentW - 56"
                  column: 5
                  spaceBetweenX: 14
                  spaceBetweenY: 14
                children:
                  # 鱼卡片模板：自身充当索引0的卡片，copy 从1开始
                  鱼卡片:
                    type: Texture
                    attribute:
                      entryKey: 0.round()
                      entry: var.fishList[self.entryKey]
                      visible: self.entry != none && (var.currentTab == 'all' || self.entry['rarity'] == var.currentTab)
                      width: "(var.contentW - 126) / 5"
                      height: 160
                      normal: "self.entry != none && self.entry['caught'] ? '28,52,48,215' : '26,34,46,200'"
                      shape: ~round_rect
                      radius: 12
                      rarityTag: "self.entry != none ? (self.entry['rarity'] == 'legendary' ? '&6' : (self.entry['rarity'] == 'rare' ? '&9' : (self.entry['rarity'] == 'uncommon' ? '&a' : '&f'))) : '&7'"
                      rarityLabel: "self.entry != none ? (self.entry['rarity'] == 'legendary' ? '传说' : (self.entry['rarity'] == 'rare' ? '稀有' : (self.entry['rarity'] == 'uncommon' ? '罕见' : '普通'))) : ''"
                    effect:
                      stroke:
                        width: 2
                        color: "self.entry != none && self.entry['caught'] ? '124,196,142,230' : '80,200,220,220'"
                    children:
                      # 鱼物品图标（未捕获时不显示，只显示遮罩+问号）
                      图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 1.0
                          x: 14
                          y: 28
                          width: 100
                          height: 100
                          normal: ~18,28,40,180
                          shape: ~round_rect
                          radius: 10
                          visible: "self.parent.entry != none && self.parent.entry['caught']"
                          overwriteText: "~"
                          seticon: "self.setItemIcon(var.itemJsons[self.parent.entryKey])"
                      # 未捕获遮罩：暗色覆盖+问号
                      未捕获遮罩:
                        type: Canvas
                        attribute:
                          x: 14
                          y: 28
                          width: 100
                          height: 100
                          through: true
                          visible: "self.parent.entry != none && !self.parent.entry['caught']"
                        children:
                          遮罩背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~10,15,25,180
                              shape: ~round_rect
                              radius: 10
                              through: true
                          问号:
                            type: Text
                            attribute:
                              point: ~middle_center
                              width: 100
                              texts: "~&7?"
                              fontSize: 56
                              through: true
                      # 鱼名（稀有度着色）
                      鱼名:
                        type: Text
                        attribute:
                          x: 124
                          y: 12
                          width: 180
                          texts: "self.parent.rarityTag + self.parent.entry['name']"
                          fontSize: 32
                          through: true
                      # 稀有度标签
                      稀有度:
                        type: Text
                        attribute:
                          x: 124
                          y: 48
                          width: 180
