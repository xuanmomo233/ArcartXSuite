# Abyss / after-action report: fixed metric columns, not space-padded text.
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonName = packet['dungeonName']
      var.statRows = packet['statRows']
      var.stat0 = var.statRows != none ? var.statRows[0.round()] : none
      var.stat1 = var.statRows != none ? var.statRows[1.round()] : none
      var.stat2 = var.statRows != none ? var.statRows[2.round()] : none
      var.stat3 = var.statRows != none ? var.statRows[3.round()] : none
      var.stat4 = var.statRows != none ? var.statRows[4.round()] : none
      var.stat5 = var.statRows != none ? var.statRows[5.round()] : none
      var.statCount = var.statRows.keys().size()
      var.dirty = true
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.dungeonName = ''
      var.statRows = {}
      var.stat0 = none
      var.stat1 = none
      var.stat2 = none
      var.stat3 = none
      var.stat4 = none
      var.stat5 = none
      var.statCount = 0
      var.记录引用 = {}
      var.记录轮次 = 0
      var.dirty = false
    tick: |-
      if(var.dirty){
        var.dirty = false
        目标数 = var.statCount.round()
        if(val.stats_rows.childrenCount() - 1 != 目标数 - 1){
          for(key in var.记录引用.keys()){
            var.记录引用[key].remove()
          }
          var.记录引用 = {}
          var.记录轮次 = (var.记录轮次 + 1).round()
          模板 = val.stats_rows.get(0)
          模板.entryKey = 0.round()
          if(目标数 > 1){
            for(i in range(1, 目标数 - 1)){
              row = 模板.copy('记录行_' + var.记录轮次 + '_' + i.round())
              row.entryKey = i.round()
              var.记录引用[i.round()] = row
            }
          }
        }
        val.stats_slider.setDragYRatio(0)
      }
    open: |-
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:26;8,10,11,228
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      统计面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1440
          height: 864
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~22,25,25,253
              through: true
            effect:
              stroke:
                width: 3
                color: ~108,82,56,255
          顶部刻度:
            type: Texture
            attribute:
              x: 60
              y: 0
              width: 220
              height: 8
              normal: ~147,61,43,255
              through: true
          眉题:
            type: Text
            attribute:
              x: 60
              y: 34
              texts: ~&6ABYSS   /   AFTER-ACTION REPORT   06
              fontSize: 36
              through: true
          标题:
            type: Text
            attribute:
              x: 58
              y: 88
              texts: "'&f战斗记录  /  &7' + var.dungeonName"
              fontSize: 64
              limit: 28
              through: true
          表头:
            type: Canvas
            attribute:
              x: 60
              y: 176
              width: 1320
              height: 52
            children:
              表头底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~60,47,35,255
                  through: true
              玩家:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 70
                  texts: ~&f远征成员
                  fontSize: 36
                  through: true
              击杀:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -865
                  texts: ~&c击杀
                  fontSize: 36
                  through: true
              伤害:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -585
                  texts: ~&6输出伤害
                  fontSize: 36
                  through: true
              承伤:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -315
                  texts: ~&7承受伤害
                  fontSize: 36
                  through: true
              治疗:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -50
                  texts: ~&a治疗
                  fontSize: 36
                  through: true
          数据滑轨:
            type: Texture
            attribute:
              x: 1398
              y: 246
              width: 10
              height: 504
              normal: ~49,45,38,255
              through: true
          数据滑块:
            type: Texture
            val: stats_slider
            attribute:
              x: 1398
              y: 246
              width: 10
              height: 100
              maxDragY: 404
              normal: ~211,155,78,255
          数据滚动区:
            type: Scroll
            attribute:
              x: 60
              y: 246
              width: 1334
              height: 504
              moveY: val.stats_slider.getDragYRatio()
            action:
              wheel: |-
                ratio = self.moveY - self.wheelValue * 0.12
                if(ratio < 0){ ratio = 0 }
                if(ratio > 1){ ratio = 1 }
                val.stats_slider.setDragYRatio(ratio)
            children:
              数据行:
                type: VStack
                val: stats_rows
                attribute:
                  width: 1320
                  spaceBetween: 12
                children:
                  记录行:
                    type: Canvas
                    attribute:
                      width: 1320
                      height: 74
                      entryKey: 0.round()
                      entry: var.statRows[self.entryKey]
                      visible: self.entry != none
                    children:
                      行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: "self.parent.entryKey % 2 == 0 ? '34,37,37,255' : '28,31,32,255'"
                          through: true
                      编号:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 18
                          texts: "'&7' + (self.parent.entryKey + 1).round()"
                          fontSize: 36
                          through: true
                      姓名:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 70
                          texts: "'&f' + self.parent.entry['name']"
                          fontSize: 48
                          limit: 16
                          through: true
                      击杀值:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -865
                          texts: "'&c' + self.parent.entry['kills'].round()"
                          fontSize: 48
                          through: true
                      伤害值:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -585
                          texts: "'&6' + self.parent.entry['damage'].round()"
                          fontSize: 48
                          through: true
                      承伤值:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -315
                          texts: "'&7' + self.parent.entry['taken'].round()"
                          fontSize: 48
                          through: true
                      治疗值:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -50
                          texts: "'&a' + self.parent.entry['heal'].round()"
                          fontSize: 48
                          through: true
          空态:
            type: Text
            attribute:
              point: ~middle_center
              texts: ~&7尚无战斗记录 · 完成行动后返回查看
              fontSize: 48
              visible: var.stat0 == none
              through: true
          底线:
            type: Texture
            attribute:
              x: 60
              y: 774
              width: 1320
              height: 2
              normal: ~101,77,55,255
              through: true
          注释:
            type: Text
            attribute:
              x: 62
              y: 805
              texts: ~&7行动复盘  /  滚轮浏览所有成员 · 本次副本的击杀、输出、承伤与治疗记录
              fontSize: 36
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -36
              y: 32
              width: 48
              height: 48
            action:
              clickLeft: "Screen.close()"
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~92,39,36,255
                  hover: ~151,59,44,255
                  through: true
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&fX
                  fontSize: 36
                  through: true
