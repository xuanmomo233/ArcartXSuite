# AXS BattlePass 任务列表界面
# 打开方式: 主界面点击任务按钮 或 /bp tasks 命令
# 数据交互: packetHandler init/update/progress
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航（总览/奖励/任务）+ 每日/每周/赛季三区滚动列表
# 视觉规范:
#   全屏玻璃 Frosted:24;30,32,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片 255,255,255,125  卡片浮起 255,255,255,90  描边 255,255,255,165
#   主色（琥珀金）232,180,90   已完成 124,196,142
#   分区色: 每日 232,180,90 / 每周 150,180,210 / 赛季 186,140,232

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 界面初始化时接收服务端任务数据包，写入 UI 变量并动态生成三类任务列表子元素
    # 包字段:
    #   - packetId: 包标识符，用于后续 Packet.send 回传
    #   - dailyTasks: 每日任务数据映射（key 为序号，含 name/description/difficultyDisplay/progress/required/progressPercent/xpReward/completed 等字段）
    #   - weeklyTasks: 每周任务数据映射（字段结构同 dailyTasks）
    #   - seasonTasks: 赛季任务数据映射（字段结构同 dailyTasks）
    #   - dailyTaskCount: 当前已分配的每日任务数量
    #   - weeklyTaskCount: 当前已分配的每周任务数量
    #   - seasonTaskCount: 当前已分配的赛季任务数量
    #   - maxDailyCount: 每日任务最大可分配数量（用于动态生成列表项）
    #   - maxWeeklyCount: 每周任务最大可分配数量
    #   - maxSeasonCount: 赛季任务最大可分配数量
    init: |-
      var.packetId = packet['packetId']
      var.dailyTasks = packet['dailyTasks']
      var.weeklyTasks = packet['weeklyTasks']
      var.seasonTasks = packet['seasonTasks']
      var.dailyTaskCount = packet['dailyTaskCount']
      var.weeklyTaskCount = packet['weeklyTaskCount']
      var.seasonTaskCount = packet['seasonTaskCount']
      var.totalTaskCount = packet['totalTaskCount']
      var.dailyCompletedCount = packet['dailyCompletedCount']
      var.weeklyCompletedCount = packet['weeklyCompletedCount']
      var.seasonCompletedCount = packet['seasonCompletedCount']
      var.maxDailyCount = packet['maxDailyCount']
      var.maxWeeklyCount = packet['maxWeeklyCount']
      var.maxSeasonCount = packet['maxSeasonCount']
      while(val.每日任务列表.childrenCount() > 1){
        val.每日任务列表.get(1).remove()
      }
      // range(a,b) 左闭右闭，生成 a~b 含两端；模板在索引0，故复制 1~count-1 共 count-1 项
      for(i in range(1, var.maxDailyCount - 1)){
        key = i.round()
        e = val.每日任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
      while(val.每周任务列表.childrenCount() > 1){
        val.每周任务列表.get(1).remove()
      }
      for(i in range(1, var.maxWeeklyCount - 1)){
        key = i.round()
        e = val.每周任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
      while(val.赛季任务列表.childrenCount() > 1){
        val.赛季任务列表.get(1).remove()
      }
      for(i in range(1, var.maxSeasonCount - 1)){
        key = i.round()
        e = val.赛季任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
    # packetHandler: update
    # 数据更新时接收服务端任务数据包，刷新 UI 变量并重建任务列表子元素（字段与 init 相同）
    update: |-
      var.packetId = packet['packetId']
      var.dailyTasks = packet['dailyTasks']
      var.weeklyTasks = packet['weeklyTasks']
      var.seasonTasks = packet['seasonTasks']
      var.dailyTaskCount = packet['dailyTaskCount']
      var.weeklyTaskCount = packet['weeklyTaskCount']
      var.seasonTaskCount = packet['seasonTaskCount']
      var.totalTaskCount = packet['totalTaskCount']
      var.dailyCompletedCount = packet['dailyCompletedCount']
      var.weeklyCompletedCount = packet['weeklyCompletedCount']
      var.seasonCompletedCount = packet['seasonCompletedCount']
      var.maxDailyCount = packet['maxDailyCount']
      var.maxWeeklyCount = packet['maxWeeklyCount']
      var.maxSeasonCount = packet['maxSeasonCount']
      while(val.每日任务列表.childrenCount() > 1){
        val.每日任务列表.get(1).remove()
      }
      for(i in range(1, var.maxDailyCount - 1)){
        key = i.round()
        e = val.每日任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
      while(val.每周任务列表.childrenCount() > 1){
        val.每周任务列表.get(1).remove()
      }
      for(i in range(1, var.maxWeeklyCount - 1)){
        key = i.round()
        e = val.每周任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
      while(val.赛季任务列表.childrenCount() > 1){
        val.赛季任务列表.get(1).remove()
      }
      for(i in range(1, var.maxSeasonCount - 1)){
        key = i.round()
        e = val.赛季任务列表['任务项'].copy('任务项' + key)
        e.entryKey = key
      }
    progress: |-
      var.packetId = packet['packetId']
      var.dailyTasks = packet['dailyTasks']
      var.weeklyTasks = packet['weeklyTasks']
      var.seasonTasks = packet['seasonTasks']
      var.dailyTaskCount = packet['dailyTaskCount']
      var.weeklyTaskCount = packet['weeklyTaskCount']
      var.seasonTaskCount = packet['seasonTaskCount']
      var.totalTaskCount = packet['totalTaskCount']
      var.dailyCompletedCount = packet['dailyCompletedCount']
      var.weeklyCompletedCount = packet['weeklyCompletedCount']
      var.seasonCompletedCount = packet['seasonCompletedCount']
  action:
    load: |-
      var.packetId = 'AXS_BATTLEPASS'
      var.dailyTasks = {}
      var.weeklyTasks = {}
      var.seasonTasks = {}
      var.dailyTaskCount = 0
      var.weeklyTaskCount = 0
      var.seasonTaskCount = 0
      var.totalTaskCount = 0
      var.dailyCompletedCount = 0
      var.weeklyCompletedCount = 0
      var.seasonCompletedCount = 0
      var.maxDailyCount = 0
      var.maxWeeklyCount = 0
      var.maxSeasonCount = 0
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放，窗口长宽比不是 16:9 时会多出可用空间
      // viewH / viewW = 换算到设计坐标系后的可用高宽，16:9 时正好 1080 / 1920
      // offX     = Adaptive 水平居中后，设计坐标 x=0 距窗口左边的偏量（超宽屏 > 0）
      // contentW = 内容区宽度（左 372 右 48 边距）
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.taskFilter = 'all'
    # open action 不发任何包：数据由服务端 openTasks() 延迟2tick推送（修复 Java bug 后）
    open: |-
      {}
    # 窗口尺寸变化后重算可用高宽，依赖这些变量的控件尺寸会跟着刷新
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;30,32,38,110
  # 自适配布局：宽高 = 本 UI 的设计分辨率（1920x1080），窗口分辨率变化时按比例缩放子控件
  # 顶部锚点：使 1080 设计高度的顶边与窗口上边对齐，顶栏可紧贴屏幕顶部；
  # 非 16:9 窗口多出来的纵向空间全落在下方，由 var.viewH 分配给左导航/内容区贴住底边；
  # 横向多出的空间（超宽屏）由 var.offX / var.viewW / var.contentW 分配，顶栏与内容区同步铺满
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      # 顶栏沿窗口整宽铺满（超宽屏时向两侧溢出 Adaptive 的 1920 设计宽度）
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~62,66,74,210
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~232,180,90,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f战令"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 168
              width: 1
              height: 30
              normal: ~62,66,74,210
          页名:
            type: Text
            attribute:
              point: ~middle_left
              x: 188
              texts: "~&f任务"
              fontSize: 36
          任务统计:
            type: Text
            attribute:
              point: ~middle_right
              x: -112
              texts: "'&f每日 &f' + var.dailyTaskCount + ' &f· &f每周 &f' + var.weeklyTaskCount + ' &f· &f赛季 &f' + var.seasonTaskCount"
              fontSize: 32
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 40
                  texts: "~&f✕"
                  fontSize: 32
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          导航总览:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_main')
            children:
              总览底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
              总览文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f总览"
                  fontSize: 36
                  through: true
          导航奖励:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_rewards')
            children:
              奖励底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
              奖励文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f奖励"
                  fontSize: 36
                  through: true
          # 当前页：任务
          导航任务:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            children:
              任务底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~232,180,90,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~232,180,90,230
              任务高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~232,180,90,255
                  shape: ~round_rect
                  radius: 2
              任务文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0任务"
                  fontSize: 36
          导航结算:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_settlement')
            children:
              结算底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
              结算文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f结算"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 298
              width: 264
              height: 2
              normal: ~255,255,255,230
          完成度标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 314
              texts: "~&f完成度"
              fontSize: 30
          # 全部任务筛选按钮（重置筛选，显示三类全部任务）
          全部按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 348
              width: 272
              height: 50
            action:
              clickLeft: |-
                var.taskFilter = 'all'
            children:
              全部底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.taskFilter == 'all' ? '245,205,130,180' : '62,66,74,210'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "var.taskFilter == 'all' ? '245,205,130,255' : '255,255,255,230'"
              全部文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 20
                  texts: "var.taskFilter == 'all' ? '&0全部任务' : '&f全部任务'"
                  fontSize: 32
                  through: true
          # 每日完成度（点击筛选每日任务）
          每日完成度:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 410
              width: 272
              height: 62
            action:
              clickLeft: |-
                var.taskFilter = 'daily'
            children:
              每日完成底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.taskFilter == 'daily' ? '232,180,90,180' : '62,66,74,210'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "var.taskFilter == 'daily' ? '232,180,90,255' : '255,255,255,230'"
              每日完成名:
                type: Text
                attribute:
                  point: ~top_left
                  x: 16
                  y: 10
                  texts: "var.taskFilter == 'daily' ? '&0每日' : '&f每日'"
                  fontSize: 32
                  through: true
              每日完成数:
                type: Text
                attribute:
                  point: ~top_right
                  x: -16
                  y: 12
                  texts: "'&f' + var.dailyCompletedCount + '&f/' + var.dailyTaskCount"
                  fontSize: 30
                  through: true
              每日完成条底:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 16
                  y: 44
                  width: 240
                  height: 8
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 4
                  through: true
              每日完成条:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 16
                  y: 44
                  width: "var.dailyTaskCount > 0 ? (type.toNumber(var.dailyCompletedCount) / type.toNumber(var.dailyTaskCount)) * 240 : 0"
                  height: 8
                  normal: ~232,180,90,255
                  shape: ~round_rect
                  radius: 4
                  through: true
          # 每周完成度（点击筛选每周任务）
          每周完成度:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 484
              width: 272
              height: 62
            action:
              clickLeft: |-
                var.taskFilter = 'weekly'
            children:
              每周完成底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.taskFilter == 'weekly' ? '150,180,210,180' : '62,66,74,210'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "var.taskFilter == 'weekly' ? '150,180,210,255' : '255,255,255,230'"
              每周完成名:
                type: Text
                attribute:
                  point: ~top_left
                  x: 16
                  y: 10
                  texts: "var.taskFilter == 'weekly' ? '&0每周' : '&f每周'"
                  fontSize: 32
                  through: true
              每周完成数:
                type: Text
                attribute:
                  point: ~top_right
                  x: -16
                  y: 12
                  texts: "'&f' + var.weeklyCompletedCount + '&f/' + var.weeklyTaskCount"
                  fontSize: 30
                  through: true
              每周完成条底:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 16
                  y: 44
                  width: 240
                  height: 8
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 4
                  through: true
              每周完成条:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 16
                  y: 44
                  width: "var.weeklyTaskCount > 0 ? (type.toNumber(var.weeklyCompletedCount) / type.toNumber(var.weeklyTaskCount)) * 240 : 0"
                  height: 8
                  normal: ~150,180,210,255
                  shape: ~round_rect
                  radius: 4
                  through: true
          # 赛季完成度（点击筛选赛季任务）
          赛季完成度:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 558
              width: 272
              height: 62
            action:
              clickLeft: |-
                var.taskFilter = 'season'
            children:
              赛季完成底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.taskFilter == 'season' ? '186,140,232,180' : '62,66,74,210'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "var.taskFilter == 'season' ? '186,140,232,255' : '255,255,255,230'"
              赛季完成名:
                type: Text
                attribute:
                  point: ~top_left
                  x: 16
                  y: 10
                  texts: "var.taskFilter == 'season' ? '&0赛季' : '&f赛季'"
                  fontSize: 32
                  through: true
              赛季完成数:
                type: Text
                attribute:
                  point: ~top_right
                  x: -16
                  y: 12
                  texts: "'&f' + var.seasonCompletedCount + '&f/' + var.seasonTaskCount"
                  fontSize: 30
                  through: true
              赛季完成条底:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 16
                  y: 44
                  width: 240
                  height: 8
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 4
                  through: true
              赛季完成条:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 16
                  y: 44
                  width: "var.seasonTaskCount > 0 ? (type.toNumber(var.seasonCompletedCount) / type.toNumber(var.seasonTaskCount)) * 240 : 0"
                  height: 8
                  normal: ~186,140,232,255
                  shape: ~round_rect
                  radius: 4
                  through: true
          # 刷新按钮
          刷新按钮:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 14
              y: -18
              width: 272
              height: 52
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'refresh_tasks')
            children:
              刷新背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '245,205,130,255' : '255,255,255,230'"
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 272
                  texts: "~&f刷新任务"
                  fontSize: 32
                  through: true

      # ── 内容区（任务）───────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
