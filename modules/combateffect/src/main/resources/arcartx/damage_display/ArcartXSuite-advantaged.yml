# AXS CombatEffect — 优势克制飘字样式 (advantaged)
# 说明: 元素克制（优势）时显示的伤害数字样式
# 文档: https://wiki.arcartx.com/docs/arcartx_v2/2_simple/9_damage_display

ArcartXSuite-advantaged:
  textureWidth: 44
  textureHeight: 66
  randomMin: 0
  randomMax: 0.2
  # 小数位数：控制伤害数字显示几位小数。
  # 0 = 仅整数（小数部分被截断/舍入）；1 = 显示 1 位小数（如 12.5）；2 = 显示 2 位小数（如 12.50）。
  # 当此值 > 0 时，客户端会从 textures 列表第 11 张取小数点贴图渲染。
  decimalPlaces: 1
  # 贴图列表：
  # 第 1-10 张对应数字 0-9；第 11 张为小数点 "."；第 12 张为千位分隔逗号 ","（可选）。
  textures:
    - "damage/advantaged/0.png"
    - "damage/advantaged/1.png"
    - "damage/advantaged/2.png"
    - "damage/advantaged/3.png"
    - "damage/advantaged/4.png"
    - "damage/advantaged/5.png"
    - "damage/advantaged/6.png"
    - "damage/advantaged/7.png"
    - "damage/advantaged/8.png"
    - "damage/advantaged/9.png"
    # 第 11 张：小数点贴图（decimalPlaces > 0 时使用）
    - "damage/advantaged/dot.png"
