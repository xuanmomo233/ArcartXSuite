# =============================================================================
# 每周任务池
# 分配给玩家的每周任务从这里按 weight 加权随机抽取 weekly-count 个
# 每 7 天自动重置并重新分配，周数自动递增
# =============================================================================

# -------- 示例：完成悬赏任务 --------
weekly-quest-5:
  display-name: "完成悬赏任务"  # 任务显示名称
  description: "本周累计完成5个悬赏任务"  # 任务描述文本
  difficulty: normal  # 难度等级：easy / normal / hard
  event-topic: "axs.questgps.quest_completed"  # 触发任务进度的事件主题
  required-count: 5  # 完成任务所需的目标数量
  base-xp-reward: 500  # 完成后奖励的基础经验值
  conditions: []  # 无条件限制
  increment-strategy:  # 进度增量策略
    type: fixed  # 固定增量：每次事件固定增加指定值
    value: 1  # 每次事件增加的进度值
  weight: 3  # 权重越高，被抽中的概率越大

# -------- 示例：百斩 --------
weekly-kill-100:
  display-name: "百斩"
  description: "本周累计击杀100个敌对生物"
  difficulty: hard
  event-topic: "axs.combateffect.kill_entity"
  required-count: 100
  base-xp-reward: 600
  conditions:  # 触发条件列表，需全部满足才计入进度
    - type: event_payload  # 条件类型：校验事件 Payload 字段
      key: entity_hostile  # 校验的 Payload 字段名
      operator: equals  # 比较运算符：等于
      value: "true"  # 期望的字段值
  increment-strategy:
    type: fixed
    value: 1
  weight: 2

# -------- 示例：累计消费货币 --------
# 通用货币消费追踪任务，支持所有货币提供者（Vault/PlayerPoints/XConomy/Rondo/Command）。
# CurrencyBridgeManager 在每次 withdraw 成功后自动分发 axs.currency.spent 事件，
# payload 包含: currency_id（货币ID）、amount（消费金额）、action（"withdraw"）、balance_after（变动后余额）。
# 可通过 conditions 限制特定货币，或不加条件追踪所有货币消费。
weekly-spend-1000:
  display-name: "消费达人"
  description: "本周累计消费1000金币"
  difficulty: normal
  event-topic: "axs.currency.spent"
  required-count: 1000
  base-xp-reward: 400
  conditions:
    - type: event_payload
      key: currency_id
      operator: equals
      value: money
  increment-strategy:
    type: payload_value
    payload-key: amount
    max-per-event: 500
    scale: 1.0
  weight: 2
