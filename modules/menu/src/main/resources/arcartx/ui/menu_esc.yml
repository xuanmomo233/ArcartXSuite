              网格滚动区:
                type: Scroll
                attribute:
                  x: 112
                  y: 360
                  width: 684
                  height: "var.viewH - 540"
                  moveY: val.grid_slider.getDragYRatio()
                action:
                  wheel: |-
                    ratio = self.moveY - self.wheelValue * 0.12
                    ratio = math.max(0, math.min(1, ratio))
                    val.grid_slider.setDragYRatio(ratio)
                    var.preview = none
                children:
                  按钮网格:
                    type: HGrid
                    val: button_rows
                    attribute:
                      x: 4
                      y: 8
                      column: 4
                      spaceBetweenX: 12
                      spaceBetweenY: 12
                    children:
                      菜单按钮:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.buttonRows[self.entryKey]
                          visible: self.entry != none
                          width: 160
                          height: 156
                          hoverAnim: none
                          pressAnim: none
                          middleScale: "1 - self.pressAnim.get() * 0.04"
                          surface: "(self.isHovered() && self.entry['enabled']) ? '85,102,121,255' : '64,79,98,255'"
                        action:
                          create: |-
                            self.hoverAnim = Smooth(0, 0, 130)
                            self.pressAnim = Smooth(0, 0, 180)
                          enter: |-
                            if(self.entry['enabled']){
                              self.hoverAnim = Smooth(self.hoverAnim.get(), 1, 130)
                            }
                            var.preview = self.entry
                            var.previewTitle = var.labels[self.entryKey]
                            var.previewKey = 'button:' + self.entry['id']
                            var.menuUi.actions['preview']()
                          leave: |-
                            self.hoverAnim = Smooth(self.hoverAnim.get(), 0, 180)
                            if(var.previewKey == 'button:' + self.entry['id']){
                              var.preview = none
                            }
                          clickLeft: |-
                            if(!var.closing && self.entry != none && self.entry['enabled'] && var.actionToken != none && !var.actionBusy){
                              self.pressAnim = Smooth(1, 0, 180)
                              var.actionBusy = true
                              var.actionBusySeconds = 0
                              Sound.self('minecraft:ui.button.click', 1.0, 20)
                              Packet.send(var.packetId, 'click', var.actionToken, self.entry['id'])
                            }
                        children:
                          图标底:
                            type: Texture
                            attribute:
                              x: 3
                              y: "3 - self.parent.hoverAnim.get() * 3"
                              width: 154
                              height: 150
                              normal: self.parent.surface
                              shape: ~rect
                              through: true
                            effect:
                              stroke:
                                width: "(self.parent.isHovered() && self.parent.entry['enabled']) ? 3 : 1"
                                color: "self.parent.isHovered() ? '238,218,175,255' : '157,170,177,255'"
                          顶部细线:
                            type: Texture
                            attribute:
                              x: 12
                              y: 10
                              width: 136
                              height: 1
                              normal: ~132,151,166,255
                              through: true
                          图标:
