# AXS Market — 物品上架界面
# 打开方式: /market sell 或导航跳转
# 布局: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏 + 左侧导航(页面导航) + 内容区(三区横排: 背包+信息+设置)
# 配色: 蓝色系 主色70,150,250 强调140,200,255 底42,50,66,210 描边255,255,255,230
# 数据交互: packetHandler init/update

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: init
    # 首次接收服务端推送的上架配置数据
    # 包字段:
    #   - packetId: 数据包通信 ID
    #   - auctionCurrencies: 拍卖行货币列表
    #   - auctionMaxCurrencyCount: 拍卖行货币最大数量
    #   - auctionDefaultCurrency: 拍卖行默认货币
    #   - auctionPriceMin/Max: 拍卖行价格范围
    #   - auctionMessageMaxLength: 拍卖行留言最大长度
    #   - auctionEnabled: 拍卖行是否启用
    #   - pshopCurrencies: 玩家商店货币列表
    #   - pshopMaxCurrencyCount: 玩家商店货币最大数量
    #   - pshopDefaultCurrency: 玩家商店默认货币
    #   - pshopPriceMin/Max: 玩家商店价格范围
    #   - pshopMessageMaxLength: 玩家商店留言最大长度
    #   - pshopEnabled: 玩家商店是否启用
    #   - action_token: 操作令牌
    init: |-
      var.packetId = packet['packetId']
      var.auctionCurrencies = packet['auctionCurrencies']
      var.auctionMaxCurrencyCount = packet['auctionMaxCurrencyCount']
      var.auctionDefaultCurrency = packet['auctionDefaultCurrency']
      var.auctionPriceMin = packet['auctionPriceMin']
      var.auctionPriceMax = packet['auctionPriceMax']
      var.auctionMessageMaxLength = packet['auctionMessageMaxLength']
      var.auctionEnabled = packet['auctionEnabled']
      var.pshopCurrencies = packet['pshopCurrencies']
      var.pshopMaxCurrencyCount = packet['pshopMaxCurrencyCount']
      var.pshopDefaultCurrency = packet['pshopDefaultCurrency']
      var.pshopPriceMin = packet['pshopPriceMin']
      var.pshopPriceMax = packet['pshopPriceMax']
      var.pshopMessageMaxLength = packet['pshopMessageMaxLength']
      var.pshopEnabled = packet['pshopEnabled']
      var.actionToken = packet['action_token']
      var.selectedMode = var.auctionEnabled ? 'auction' : 'pshop'
      var.syncMode()
      var.actionBusy = false
    # packetHandler: update
    update: |-
      var.auctionCurrencies = packet['auctionCurrencies']
      var.auctionMaxCurrencyCount = packet['auctionMaxCurrencyCount']
      var.auctionDefaultCurrency = packet['auctionDefaultCurrency']
      var.auctionPriceMin = packet['auctionPriceMin']
      var.auctionPriceMax = packet['auctionPriceMax']
      var.auctionMessageMaxLength = packet['auctionMessageMaxLength']
      var.auctionEnabled = packet['auctionEnabled']
      var.pshopCurrencies = packet['pshopCurrencies']
      var.pshopMaxCurrencyCount = packet['pshopMaxCurrencyCount']
      var.pshopDefaultCurrency = packet['pshopDefaultCurrency']
      var.pshopPriceMin = packet['pshopPriceMin']
      var.pshopPriceMax = packet['pshopPriceMax']
      var.pshopMessageMaxLength = packet['pshopMessageMaxLength']
      var.pshopEnabled = packet['pshopEnabled']
      var.actionToken = packet['action_token']
      var.syncMode()
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.packetId = 'AXS_MARKET'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.selectedSlot = none
      var.selectedPrice = none
      var.selectedMessage = none
      var.selectedDuration = 86400
      var.selectedCurrency = none
      var.selectedMode = 'auction'
      var.priceMin = 1
      var.priceMax = 1000000000
      var.messageMaxLength = 50
      var.selectedItemName = none
      var.selectedItemAmount = 0
      var.selectedItemLore = none
      var.selectedItemJson = var.emptyItemJson
      var.auctionCurrencies = {}
      var.auctionMaxCurrencyCount = 0
      var.auctionDefaultCurrency = none
      var.auctionPriceMin = 1
      var.auctionPriceMax = 1000000000
      var.auctionMessageMaxLength = 50
      var.auctionEnabled = true
      var.pshopCurrencies = {}
      var.pshopMaxCurrencyCount = 0
      var.pshopDefaultCurrency = none
      var.pshopPriceMin = 1
      var.pshopPriceMax = 1000000000
      var.pshopMessageMaxLength = 50
      var.pshopEnabled = true
      var.activeCurrencies = {}
      var.maxCurrencyCount = 0
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.syncMode = -> {
        oldMaxCurrencyCount = var.maxCurrencyCount
        if(var.selectedMode == 'auction'){
          var.activeCurrencies = var.auctionCurrencies
          var.maxCurrencyCount = var.auctionMaxCurrencyCount
          var.selectedCurrency = var.auctionDefaultCurrency
          var.priceMin = var.auctionPriceMin
          var.priceMax = var.auctionPriceMax
          var.messageMaxLength = var.auctionMessageMaxLength
        } else {
          var.activeCurrencies = var.pshopCurrencies
          var.maxCurrencyCount = var.pshopMaxCurrencyCount
          var.selectedCurrency = var.pshopDefaultCurrency
          var.priceMin = var.pshopPriceMin
          var.priceMax = var.pshopPriceMax
          var.messageMaxLength = var.pshopMessageMaxLength
        }
        if(var.maxCurrencyCount != oldMaxCurrencyCount){
          while(val.货币列表.childrenCount() > 1){
            val.货币列表.get(1).remove()
          }
          if(var.maxCurrencyCount > 1){
            for(i in range(1, var.maxCurrencyCount - 1)){
              key = i.round()
              e = val.货币列表['货币项'].copy('货币项' + key)
              e.entryKey = key
            }
          }
        }
      }
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.sellInfoW = 510
      var.sellLeftW = var.contentW - 48 - var.sellInfoW
      var.backpackH = 496
    open: |-
      Packet.send(var.packetId, 'sell_open')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.sellInfoW = 510
      var.sellLeftW = var.contentW - 48 - var.sellInfoW
      var.backpackH = 496

controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;20,28,42,110

  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~62,66,74,210
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~70,150,250,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f全球市场"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 232
              width: 1
              height: 30
              normal: ~62,66,74,210
          副标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 252
              texts: "~&7物品上架"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          导航拍卖行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'auction_ui_open')
            children:
              拍卖行底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              拍卖行文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f拍卖行"
                  fontSize: 36
                  through: true
          导航玩家商店:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'pshop_ui_open')
            children:
              玩家商店底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              玩家商店文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f玩家商店"
                  fontSize: 36
                  through: true
          导航系统商店:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'shop_ui_open')
            children:
              系统商店底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
