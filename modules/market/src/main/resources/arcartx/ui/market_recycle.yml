# AXS Market — 回收商店界面
# 打开方式: /market recycle 或导航跳转
# 布局: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏 + 左侧导航(页面导航+回收信息) + 内容区(可回收物品列表+操作)
# 配色: 蓝色系 主色70,150,250 强调140,200,255 底42,50,66,210 描边255,255,255,230
# 数据交互: packetHandler update

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    action_result: |-
      var.actionToken = packet['action_token']
      var.actionBusy = false
      var.actionBusySeconds = 0
    # packetHandler: update
    # 接收服务端推送的可回收物品数据
    # 包字段:
    #   - packetId: 数据包通信 ID
    #   - recyclables: 可回收物品字典（key=序号, value=物品对象含 slot/name/amount/unitPrice/totalPrice）
    #   - recycleItemJson{key}: 各物品的 NBT JSON
    #   - earningsTitle: 收益标题
    #   - earningsTexts: 收益文本字典
    #   - maxEarningsCount: 收益条目最大数量
    #   - multiplier: 回收倍率
    #   - maxRecycleCount: 可回收物品最大数量
    #   - batchConfirm: 是否需要批量确认
    #   - action_token: 操作令牌
    update: |-
      var.itemJsons = {}
      oldMaxRecycleCount = var.maxRecycleCount
      var.packetId = packet['packetId']
      var.inventoryFingerprint = packet['inventoryFingerprint']
      var.protectionVersion = packet['protectionVersion']
      var.autoEffective = packet['autoEffective'] == true
      var.recyclables = packet['recyclables']
      var.earningsTitle = packet['earningsTitle']
      var.earningsTexts = packet['earningsTexts']
      var.maxEarningsCount = packet['maxEarningsCount']
      var.multiplier = packet['multiplier']
      var.maxRecycleCount = packet['maxRecycleCount']
      var.eligibleCount = packet['eligibleCount']
      var.protectedItems = packet['protectedItems']
      var.batchConfirm = packet['batchConfirm']
      var.batchEnabled = packet['batchEnabled']
      var.showBatchConfirm = false
      var.actionToken = packet['action_token']
      for(key in var.recyclables.keys()){
        json = packet['recycleItemJson' + key]
        if(json != none && json != ''){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      var.recycleRenderPending = true
      var.earningsRenderPending = true
      scheduler.delay(50, -> {
        var.renderRecycleRows()
        var.renderEarnings()
      })
      var.actionBusy = false
  action:
    seconds: |-
      if(var.recycleRenderPending){
        var.renderRecycleRows()
      }
      if(var.recycleIconsPending){
        var.applyRecycleIcons()
      }
      if(var.earningsRenderPending){
        var.renderEarnings()
      }
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }
      else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.recycleCopies = {}
      var.earningCopies = {}
      var.recycleGeneration = 0
      var.earningGeneration = 0
      var.renderedRecycleCount = -1
      var.renderedEarningsCount = -1
      var.maxEarningsCount = 0
      var.recycleRenderPending = false
      var.recycleIconsPending = false
      var.earningsRenderPending = false
      var.renderRecycleRows = -> {
        if(val.回收列表 != none){
          if(var.maxRecycleCount != var.renderedRecycleCount){
            for(key in var.recycleCopies.keys()){
              var.recycleCopies[key].remove()
            }
            var.recycleCopies = {}
            var.recycleGeneration = var.recycleGeneration + 1
            if(var.回收列表Rows == none || var.回收列表Rows.size() != (var.maxRecycleCount)){
              网格数据 = []
              if((var.maxRecycleCount) > 0){
                for(网格序号 in range(0, (var.maxRecycleCount) - 1)){
                  网格数据.add(网格序号.round())
                }
              }
              var.回收列表Rows = 网格数据
            }
            var.renderedRecycleCount = var.maxRecycleCount
          }
          var.recycleRenderPending = false
          var.recycleIconsPending = true
          scheduler.delay(50, -> {
            var.applyRecycleIcons()
          })
        }
      }
      var.applyRecycleIcons = -> {
        if(var.回收列表Rows != none && val.回收列表 != none && val.回收列表.childrenCount() == var.回收列表Rows.size()){
          var.recycleIconsPending = false
          if(var.回收列表Rows.size() > 0){
            for(i in range(0, var.回收列表Rows.size() - 1)){
              row = val.回收列表.get(i.round())
              if(row != none && row['物品图标'] != none){
                row['物品图标'].seticon()
              }else{
                var.recycleIconsPending = true
              }
            }
          }
        }
      }
      var.renderEarnings = -> {
        if(val.收益列表 != none){
          if(var.收益列表GridRows == none || var.收益列表GridRows.size() != (var.maxEarningsCount)){
            网格数据 = []
            if((var.maxEarningsCount) > 0){
              for(网格序号 in range(0, (var.maxEarningsCount) - 1)){
                网格数据.add(网格序号.round())
              }
            }
            var.收益列表GridRows = 网格数据
            var.renderedEarningsCount = var.maxEarningsCount
            val.收益滑块.setDragYRatio(0)
          }
          var.earningsRenderPending = false
        }
      }
      var.batchConfirm = true
      var.batchEnabled = false
      var.showBatchConfirm = false
      var.earningsTexts = {}
      var.earningsTitle = '可回收总价值:'
      var.maxRecycleCount = 0
      var.eligibleCount = 0
      var.protectedItems = 0
      var.protectionVersion = ''
      var.confirmProtectionVersion = ''
      var.confirmInventoryFingerprint = ''
      var.autoEffective = false
      var.multiplier = '1.0'
      var.packetId = 'AXS_MARKET'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.actionBusy = false
      var.actionBusySeconds = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
      var.cardW = (var.scrollW - 32) / 3
    open: |-
      Packet.send(var.packetId, 'recycle_preview')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
      var.cardW = (var.scrollW - 32) / 3

