# OnlineRewards · 出勤纪事
# Celadon paper, bronze checkpoints: monthly ledger / online progress / reward archive.
# Packet contracts, action tokens and server-owned calendar selection are unchanged.
ui:
  isHud: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.dailyTimeText = packet['dailyTimeText']
      var.weeklyTimeText = packet['weeklyTimeText']
      var.monthlyTimeText = packet['monthlyTimeText']
      var.totalTimeText = packet['totalTimeText']
      var.offlineSavingsText = packet['offlineSavingsText']
      var.progress = packet['progress']
      var.progressPercent = packet['progressPercent']
      var.progressPercentText = packet['progressPercentText']
      var.progressTitle = packet['progressTitle']
      var.completed = packet['completed']
      var.rewardStage = packet['rewardStage']
      var.rewardCount = packet['rewardCount']
      var.rewardStageText = packet['rewardStageText']
      var.signedToday = packet['signedToday']
      var.signInStatusText = packet['signInStatusText']
      var.signInStreak = packet['signInStreak']
      var.signInTotal = packet['signInTotal']
      var.makeupCardCount = packet['makeupCardCount']
      var.calendarMonthText = packet['calendarMonthText']
      var.calendarCount = packet['calendarCount']
      var.calendarMonthOffset = packet['calendarMonthOffset']
      var.selectedDateText = packet['selectedDateText']
      var.selectedCanMakeup = packet['selectedCanMakeup']
      var.selectedAction = packet['selectedAction']
      var.selectedActionText = packet['selectedActionText']
      var.selectedActionEnabled = packet['selectedActionEnabled']
      var.rewardRows = packet['rewardRows']
      var.periodicRewardRows = packet['periodicRewardRows']
      var.signInRewardRows = packet['signInRewardRows']
      var.calendarRows = packet['calendarRows']
      var.selectedRewardRows = packet['selectedRewardRows']
      var.serverSignInGoalEnabled = packet['serverSignInGoalEnabled']
      var.serverSignInGoalCurrent = packet['serverSignInGoalCurrent']
      var.serverSignInGoalNext = packet['serverSignInGoalNext']
      var.maxRewardCount = packet['maxRewardCount']
      var.maxPeriodicCount = packet['maxPeriodicCount']
      var.maxSigninRewardCount = packet['maxSigninRewardCount']
      var.maxSelectedRewardCount = packet['maxSelectedRewardCount']
      var.actionToken = packet['action_token']
      var.rewardIconJsons = {}
      for(i in range(0, var.maxRewardCount - 1)){
        key = i.round()
        json = packet['rewardIconJson' + key]
        var.rewardIconJsons[key] = var.emptyItemJson
        if(json != none && json != ''){ var.rewardIconJsons[key] = json }
      }
      var.periodicIconJsons = {}
      for(i in range(0, var.maxPeriodicCount - 1)){
        key = i.round()
        json = packet['periodicIconJson' + key]
        var.periodicIconJsons[key] = var.emptyItemJson
        if(json != none && json != ''){ var.periodicIconJsons[key] = json }
      }
      var.signinIconJsons = {}
      for(i in range(0, var.maxSigninRewardCount - 1)){
        key = i.round()
        json = packet['signinIconJson' + key]
        var.signinIconJsons[key] = var.emptyItemJson
        if(json != none && json != ''){ var.signinIconJsons[key] = json }
      }
      var.calendarSignedCount = 0
      if(var.calendarRows != none){
        for(k in var.calendarRows.keys()){
          row = var.calendarRows[k]
          if(row != none && row['status'] == 'signed'){
            var.calendarSignedCount = var.calendarSignedCount + 1
          }
        }
      }
      var.calendarRate = var.calendarCount > 0 ? (var.calendarSignedCount / var.calendarCount * 100).round() : 0
      // ARIA range is inclusive: template + 30 copies = 31 dates.
      if(val.日历网格.childrenCount() == 1){
        template = val.日历网格.get(0)
        for(i in range(1, 30)){
          e = template.copy('日历项_' + i.round())
          e.entryKey = i.round()
        }
      }
      // Keep copy references; do not look up freshly copied rows by name/index.
      if(val.阶段堆叠.childrenCount() - 1 != var.maxRewardCount - 1){
        for(key in var.stageRefs.keys()){ var.stageRefs[key].remove() }
        var.stageRefs = {}
        var.stageGeneration = (var.stageGeneration + 1).round()
        template = val.阶段堆叠.get(0)
        for(i in range(1, var.maxRewardCount - 1)){
          e = template.copy('阶段奖励项_' + var.stageGeneration + '_' + i.round())
          e.entryKey = i.round()
          var.stageRefs[i.round()] = e
        }
      }
      if(var.maxRewardCount > 0){
        e = val.阶段堆叠.get(0)
        e['图标'].seticon()
        for(key in var.stageRefs.keys()){
          e = var.stageRefs[key]
          e['图标'].seticon()
        }
      }
      if(val.周期堆叠.childrenCount() - 1 != var.maxPeriodicCount - 1){
        for(key in var.periodicRefs.keys()){ var.periodicRefs[key].remove() }
        var.periodicRefs = {}
        var.periodicGeneration = (var.periodicGeneration + 1).round()
        template = val.周期堆叠.get(0)
        for(i in range(1, var.maxPeriodicCount - 1)){
          e = template.copy('周期奖励项_' + var.periodicGeneration + '_' + i.round())
          e.entryKey = i.round()
          var.periodicRefs[i.round()] = e
        }
      }
      if(var.maxPeriodicCount > 0){
        e = val.周期堆叠.get(0)
        e['图标'].seticon()
        for(key in var.periodicRefs.keys()){
          e = var.periodicRefs[key]
          e['图标'].seticon()
        }
      }
      if(val.签到堆叠.childrenCount() - 1 != var.maxSigninRewardCount - 1){
        for(key in var.signinRefs.keys()){ var.signinRefs[key].remove() }
        var.signinRefs = {}
        var.signinGeneration = (var.signinGeneration + 1).round()
        template = val.签到堆叠.get(0)
        for(i in range(1, var.maxSigninRewardCount - 1)){
          e = template.copy('签到奖励项_' + var.signinGeneration + '_' + i.round())
          e.entryKey = i.round()
          var.signinRefs[i.round()] = e
        }
      }
      if(var.maxSigninRewardCount > 0){
        e = val.签到堆叠.get(0)
        e['图标'].seticon()
        for(key in var.signinRefs.keys()){
          e = var.signinRefs[key]
          e['图标'].seticon()
        }
      }
      if(val.选中奖励堆叠.childrenCount() - 1 != var.maxSelectedRewardCount - 1){
        for(key in var.selectedRefs.keys()){ var.selectedRefs[key].remove() }
        var.selectedRefs = {}
        var.selectedGeneration = (var.selectedGeneration + 1).round()
        template = val.选中奖励堆叠.get(0)
        for(i in range(1, var.maxSelectedRewardCount - 1)){
          e = template.copy('选中奖励项_' + var.selectedGeneration + '_' + i.round())
          e.entryKey = i.round()
          var.selectedRefs[i.round()] = e
        }
      }
      var.actionBusy = false
