              clickLeft: |-
                var.deletePassword = none
                var.renameName = none
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,50,58,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: 'self.isHovered() ? ''220,230,240,255'' : ''100,110,120,220'''
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f✕
                  fontSize: 36
                  through: true
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: 48 - var.offX
          y: 120
          width: 300
          height: var.viewH - 144
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~100,110,120,220
          导航仓库:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: Packet.send(var.packetId, 'storage')
