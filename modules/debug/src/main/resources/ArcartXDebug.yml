config-version: 1
# AXS Debug Bridge — 服务端调试桥模块
# 作用: 通过 WebSocket 暴露 ArcartXSuite 的调试能力（UI 操控、ARIA 脚本、模块管理、
#       包流拦截等）给外部 MCP Server 调用，使用 JSON-RPC 协议。
# 依赖: ArcartXSuite 本体；无外部插件依赖。
# 注意: 本模块面向个人本地调试使用，不做安全加固，请勿在生产服务器启用。

debug:
  enabled: false  # 显式启用后才启动本地 WebSocket

websocket:
  port: 18899  # WebSocket 监听端口
  # 认证 token，客户端连接时需在 URL 中携带 ?token=xxx
  # 设置至少 32 字符的随机令牌，仅使用字母、数字、连字符和下划线。
  token: ""
  # 只允许绑定回环地址 127.0.0.1 或 ::1。
  host: "127.0.0.1"

packet-capture:
  # 包流拦截环形缓冲容量（记录最近 N 条客户端包）
  buffer-size: 256
  # 是否在捕获时记录包负载内容
  log-payload: false
