# AXS 资源说明
# 用途: Abyss 副本内 HUD —— 副本名/波次/存活/剩余时间条/引导提示
# 由服务端在进本时打开、出本关闭；每秒 update 包刷新。
# 任务展示不在此渲染——委托给 QuestGPS guide HUD（含实时进度）与 Chemdah scoreboard。
ui:
  isHud: true
  defaultOpen: false
  through: true
  show: true
  screenScale: true
  background: false
  closeDied: false
  escClose: false
  level: 6
  packetHandler:
    # packetHandler: update
    # 包字段: dungeonName/status/groupTotal/groupDone/activeGroup/aliveMobs
    #         alivePlayers/totalPlayers/timeText/timeRatio/guideText
    update: |-
      var.dungeonName = packet['dungeonName']
      var.status = packet['status']
      var.statusLabel = packet['statusLabel']
      var.progressLabel = packet['progressLabel']
      var.groupTotal = packet['groupTotal']
      var.groupDone = packet['groupDone']
      var.activeGroup = packet['activeGroup']
      var.aliveMobs = packet['aliveMobs']
      var.alivePlayers = packet['alivePlayers']
      var.totalPlayers = packet['totalPlayers']
      var.timeText = packet['timeText']
      var.timeRatio = packet['timeRatio']
      var.guideText = packet['guideText']
  action:
    load: |-
      var.dungeonName = ''
      var.status = ''
      var.statusLabel = ''
      var.progressLabel = '波次'
      var.groupTotal = 0
      var.groupDone = 0
      var.activeGroup = ''
      var.aliveMobs = 0
      var.alivePlayers = 0
      var.totalPlayers = 0
      var.timeText = ''
      var.timeRatio = 1.0
      var.guideText = ''
      var.accent = '186,140,232,255'
      // 视口换算：Adaptive(1920x1080) 等比缩放后，贴边面板需要 offX 补偿
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      visible: "var.dungeonName != ''"
      point: ~top_center
      width: 1920
      height: 1080
    children:
      副本面板:
        type: Canvas
        attribute:
          point: ~top_right
          x: "-28 + var.offX"
          y: 140
          width: 430
          height: 252
          through: true
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~20,14,36,210
              shape: ~round_rect
              radius: 12
              through: true
          副本名:
            type: Canvas
            attribute:
              x: 16
              y: 12
              width: 398
              height: 28
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: '''&f'' + var.dungeonName'
                  fontSize: 28
                  limit: 13
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          状态:
            type: Canvas
            attribute:
              x: 16
              y: 52
              width: 398
              height: 24
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: '''&7状态  &f'' + var.statusLabel'
                  fontSize: 24
                  limit: 16
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          进度:
            type: Canvas
            attribute:
              x: 16
              y: 86
              width: 398
              height: 24
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: '''&7'' + var.progressLabel + ''  &e'' + var.groupDone.round() + ''/'' + var.groupTotal.round() + ''   &7队员 &a'' + var.alivePlayers.round() + ''/'' + var.totalPlayers.round()'
                  fontSize: 24
                  limit: 27
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          怪物:
            type: Canvas
            attribute:
              x: 16
              y: 120
              width: 398
              height: 24
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: '''&7存活怪物  &c'' + var.aliveMobs.round()'
                  fontSize: 24
                  limit: 20
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          当前波次:
            type: Canvas
            attribute:
              x: 16
              y: 154
              width: 398
              height: 24
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: 'var.activeGroup != '''' ? ''&7当前  &f'' + var.activeGroup : ''&7等待下一目标'''
                  fontSize: 24
                  limit: 16
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          剩余时间:
            type: Canvas
            attribute:
              x: 16
              y: 190
              width: 398
              height: 24
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: '''&7剩余时间  &f'' + var.timeText'
                  fontSize: 24
                  limit: 20
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          时间条底:
            type: Texture
            attribute:
              x: 16
              y: 232
              width: 398
              height: 6
              normal: ~48,40,65,220
              through: true
          时间条:
            type: Texture
            attribute:
              x: 16
              y: 232
              width: "398 * Math.max(0, Math.min(1, var.timeRatio))"
              height: 6
              normal: "var.timeRatio > 0.3 ? var.accent : '235,100,100,240'"
              through: true
      引导面板:
        type: Canvas
        attribute:
          point: ~top_center
          y: 88
          width: 720
          height: 52
          visible: "var.guideText != '' && var.guideText != none"
          through: true
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~20,14,36,200
              shape: ~round_rect
              radius: 10
              through: true
          字:
            type: Canvas
            attribute:
              point: ~middle_left
              x: 24
              width: 672
              height: 28
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: '''&e➤ &f'' + var.guideText'
                  fontSize: 28
                  limit: 22
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
