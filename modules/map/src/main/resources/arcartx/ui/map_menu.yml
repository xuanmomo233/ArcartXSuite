                  x: 10
                  y: 40
                  width: 220
                  height: 268
                  moveY: "self.parent['世界浮层滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['世界浮层滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['世界浮层滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  world_list:
                    val: world_entry
                    type: VStack
                    attribute:
                      width: 220
                      spaceBetween: 6
                    children:
                      地图项目:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.worldRows[self.entryKey]
                          visible: self.entry != none
                          width: 220
                          height: 52
                        action:
                          clickLeft: |-
                            if (self.entry != none) {
                              Packet.send(var.packetId, 'open_world', self.entry['id'])
                              var.worldListOpen = false
                            }
                        children:
                          地图项目背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.entry != none && self.parent.entry['selected'] ? '74,144,226,255' : '52,56,64,255'"
                              hover: "self.parent.entry != none && self.parent.entry['selected'] ? '94,164,246,255' : '72,76,84,255'"
                              shape: ~round_rect
                              radius: 12
                          地图项目图标:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 14
                              texts: "self.parent.entry != none && self.parent.entry['selected'] ? '&e◉' : '&6◎'"
                              fontSize: 30
                              through: true
                          地图项目文字:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 46
                              texts: "self.parent.entry != none ? '&f' + self.parent.entry['displayName'] : none"
                              fontSize: 26
                              through: true
                          # 跨世界传送按钮：只对"非玩家当前世界"的条目显示，
                          # 点击直接传送到该世界出生点（tokenized 写操作）
                          地图项目传送:
                            type: Canvas
                            attribute:
                              point: ~middle_right
                              x: -10
                              width: 40
                              height: 40
                              visible: "self.parent.entry != none && self.parent.entry['id'] != var.playerWorldId"
                            action:
                              clickLeft: |-
                                // 跨世界传送统一走确认框（L16）：类型 teleport_world，
                                // 确认后由对话框按钮发 teleport_to_world
                                if (self.parent.entry != none && var.actionToken != none) {
                                  var.crossWorldPromptType = 'teleport_world'
                                  var.crossWorldTargetWorld = self.parent.entry['id']
                                  var.crossWorldTargetName = self.parent.entry['displayName']
                                  var.crossWorldPromptVisible = true
                                }
                            children:
                              地图项目传送底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: "var.actionToken != none ? '74,144,226,255' : '60,60,66,255'"
                                  hover: "var.actionToken != none ? '94,164,246,255' : '60,60,66,255'"
                                  shape: ~round_rect
                                  radius: 10
                              地图项目传送图标:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: ~&f⚑
                                  fontSize: 32
                                  through: true
