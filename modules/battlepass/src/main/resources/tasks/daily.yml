# -------- 射箭训练 --------
# 监听 ProjectileHitEvent，射箭命中实体才算（不含命中方块）
# condition 匹配 projectileType=ARROW，hitEntity exists 表示命中实体
daily-archery:
  display-name: "射箭训练"
  description: "射箭命中目标20次"
  difficulty: normal
  bukkit-event:
    event-class: "org.bukkit.event.entity.ProjectileHitEvent"
  required-count: 20
  base-xp-reward: 120
  conditions:
    # 只计入箭矢命中（排除雪球/末影珍珠/三叉戟等其他弹射物）
    - type: event_payload
      key: projectileType
      operator: equals
      value: ARROW
    # hitEntity 字段存在 = 命中了实体（而非命中方块或未命中）
    # exists 操作符判断 payload 中是否存在该 key，value 留空
    - type: event_payload
      key: hitEntity
      operator: exists
      value: ""
  increment-strategy:
    type: fixed
    value: 1
  weight: 3

