              texts: "var.b3 != none ? '&f#' + var.b3['rank'].round() + '    &f' + var.b3['name'] + '    &e' + var.b3['time'] + '    &7' + var.b3['completions'].round() + '次' : ''"
              fontSize: 36
          行4:
