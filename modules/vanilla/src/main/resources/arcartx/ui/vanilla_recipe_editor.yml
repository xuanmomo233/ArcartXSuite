ui:
  isHud: false
  defaultOpen: false
  background: true
  escClose: true
  screenScale: true
  through: false
  hide:
  - hotbar
  - crosshair
  - chat_panel
  action:
    load: |-
      var.token = ''
      var.page = '1 / 1'
      var.station = '有序'
      var.selected = ''
      var.target = 0
      var.fieldVersion = -1
      var.materialMode = false
      var.dirty = false
      var.confirm = false
      var.recipes = {}
      var.inventory = {}
      var.cells = {}
      var.notice = ''
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeFade = Fade(80, 900, 220)
    open: Packet.send('AXS:vanilla_recipe_editor', 'ready')
    close: Packet.send('AXS:vanilla_recipe_editor', 'close', var.token)
    tick: |-
      if(var.dirty && var.invIcons != none && var.gridIcons != none && val.resultIcon != none){
        var.dirty = false
        for(i in range(0, 35)){
          row = var.inventory[i.round()]
          var.invIcons[i.round()].setItemIcon(row == none ? '' : row['icon'])
        }
        for(i in range(0, 8)){
          row = var.cells[i.round()]
          var.gridIcons[i.round()].setItemIcon(row == none ? '' : row['icon'])
        }
        row = var.cells[9.round()]
        val.resultIcon.setItemIcon(row == none ? '' : row['icon'])
      }
      if(var.noticeActive){
        opacity = var.noticeFade.get()
        if(opacity > 0){var.noticePeaked = true}
        if(var.noticePeaked && opacity <= 0){var.noticeActive = false}
      }
  packetHandler:
    recipe_editor_state: |-
      var.token = packet['token']
      var.page = packet['page']
      var.station = packet['station']
      var.selected = packet['selected']
      var.recipes = packet['list']
      var.inventory = packet['inventory']
      var.cells = packet['cells']
      var.dirty = true
      if(var.fieldVersion != packet['fieldVersion']){
        var.fieldVersion = packet['fieldVersion']
        val.editorId.setContent(var.selected)
        val.editorPermission.setContent(packet['permission'])
        val.editorAmount.setContent(packet['amount'])
        var.target = 0
        var.confirm = false
      }
      if(packet['message'] != '' && !var.noticeActive){
        var.notice = packet['message']
        var.noticeActive = true
        var.noticePeaked = false
        var.noticeFade.reset()
      }
