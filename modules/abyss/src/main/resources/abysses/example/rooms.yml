        monsters:
          - mob-id: vanilla:zombie
            location: "75,61,12"
            amount: 2
          - mob-id: vanilla:zombie
            location: "66,61,19"
            amount: 2
          - mob-id: vanilla:skeleton
            location: "83,61,19"
            amount: 1
      w1b:  # 首波包B
