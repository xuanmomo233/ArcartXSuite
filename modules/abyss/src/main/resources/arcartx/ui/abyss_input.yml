# AXS 资源说明
# 用途: Abyss 机关输入面板 —— puzzles.yml input 型机关的密码/口令输入
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
#
# 通讯协议:
#   服务端 → init: packetId/action_token/puzzleId/title/hint/length/pattern/masked/attemptsLeft/attemptsText
#   客户端 → Packet.send('abyss', 'input_submit', puzzleId, answer, actionToken)
#   答案永不下发客户端；服务端 PuzzleManager.submitInput 比对。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.puzzleId = packet['puzzleId']
      var.title = packet['title']
      var.hint = packet['hint']
      var.length = packet['length']
      var.pattern = packet['pattern']
      var.masked = packet['masked']
      var.attemptsText = packet['attemptsText']
      val.输入框.length = var.length > 0 ? var.length : 256
      val.输入框.inputPattern = var.pattern
      val.输入框.emptyText = var.hint
      val.输入框.passwordChar = var.masked == '1' ? '*' : ''
      val.输入框.setContent('')
      val.输入框.setFocus(true)
  action:
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'input', var.actionToken, var.viewNonce)
      }
    load: |-
      self.actions['resize']()
      var.viewNonce = ''
      var.packetId = 'abyss'
      var.actionToken = ''
      var.puzzleId = ''
      var.title = ''
      var.hint = ''
      var.length = 16
      var.pattern = ''
      var.masked = '0'
      var.attemptsText = ''
      var.accent = '186,140,232,255'
      var.accentDim = '96,80,140,190'
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
    open: |-
      Packet.send('abyss', 'view_ready', 'input')
      Sound.self('minecraft:block.note_block.pling', 0.8, 12)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:20;8,9,10,205
  自适应全局布局:
    type: Adaptive
    attribute:
      visible: "var.actionToken != ''"
      point: ~top_center
      width: 1920
      height: 1080
    children:
      输入面板:
        type: Canvas
        attribute:
          point: ~top_center
          y: "(var.viewH - 570) / 2"
          width: 860
          height: 570
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~17,19,20,250
              shape: ~round_rect
              radius: 6
            effect:
              stroke:
                width: 2
                color: var.accentDim
          标题标线:
            type: Texture
            attribute:
              point: ~top_left
              x: 36
              y: 72
              width: 788
              height: 2
              normal: var.accent
              through: true
          终端编号:
            type: Text
            attribute:
              point: ~top_left
              x: 36
              y: 30
              texts: ~&6机关校验  /  远征终端
              fontSize: 32
              through: true
          机关档案:
            type: Text
            attribute:
              point: ~top_right
              x: -36
              y: 30
              texts: "'&7' + var.puzzleId"
              fontSize: 32
              limit: 22
              through: true
          标题:
            type: Canvas
            attribute:
              point: ~top_left
              x: 36
              y: 94
              width: 788
              height: 48
              through: true
            children:
              文字:
                type: Text
                attribute:
                  texts: '''&f'' + var.title'
                  fontSize: 48
                  limit: 21
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          提示题:
            type: Text
            attribute:
              point: ~top_left
              x: 38
              y: 168
              texts: ~&6现场线索
              fontSize: 32
              through: true
          线索阅读注:
            type: Text
            attribute:
              point: ~top_right
              x: -36
              y: 168
              texts: ~&7悬停阅读完整线索
              fontSize: 32
              through: true
          提示:
            type: Scroll
            attribute:
              point: ~top_left
              x: 38
              y: 206
              width: 784
              height: 40
              scrollAnim: none
              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
            action:
              enter: "self.scrollAnim = Lerp(0, 1, 6000)"
              leave: "self.scrollAnim = none"
            children:
              线索布局:
                type: HStack
                attribute:
                  height: 40
                children:
                  线索全文:
                    type: Text
                    attribute:
                      texts: "'&7' + var.hint"
                      fontSize: 32
                      through: true
          风险底:
            type: Texture
            attribute:
              point: ~top_left
              x: 36
              y: 260
              width: 788
              height: 50
              normal: "var.attemptsText != '' ? '63,29,25,245' : '32,39,35,245'"
              through: true
          风险标线:
            type: Texture
            attribute:
              point: ~top_left
              x: 36
              y: 260
              width: 4
              height: 50
              normal: ~174,65,42,255
              through: true
          次数行:
            type: Text
            attribute:
              point: ~top_left
              x: 54
              y: 274
              texts: "var.attemptsText != '' ? '&c校验余量  &7/  &f' + var.attemptsText : '&7此机关不限制尝试次数'"
              fontSize: 32
              through: true
          输入题:
            type: Text
            attribute:
              point: ~top_left
              x: 38
              y: 334
              texts: ~&6提交口令
              fontSize: 32
              through: true
          长度提示:
            type: Text
            attribute:
              point: ~top_right
              x: -36
              y: 334
              texts: "'&7上限 ' + var.length.round() + ' 字符 · 回车提交'"
              fontSize: 32
              through: true
          # 输入框留出内边距，独立于按钮和说明区域。
          输入框容器:
            type: Canvas
            attribute:
              point: ~top_left
              x: 36
              y: 376
              width: 788
              height: 66
              through: true
            children:
              输入框底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~8,10,11,250
                  shape: ~round_rect
                  radius: 10
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: "self.parent.isHovered() ? '214,156,76,245' : '112,83,53,210'"
              输入框:
                type: TextBox
                val: "输入框"
                attribute:
                  x: 16
                  y: 13
                  width: 756
                  height: 40
                  length: 16
                  fontSize: 32
                  cursorColor: ~194,139,65
                  emptyText: ~&7输入口令以校验
                  canLoseFocus: true
                action:
                  enter: |-
                    // 回车提交（等价点确认）
                    if(self.getContent() != '') {
                      Packet.send(var.packetId, 'input_submit', var.puzzleId, self.getContent(), var.actionToken)
                    }
          操作区:
            type: HStack
            attribute:
              point: ~bottom_center
              y: -42
              width: 464
              height: 56
              spaceBetween: 24
            children:
              确认按钮:
                type: Canvas
                attribute:
                  width: 240
                  height: 56
                action:
                  clickLeft: |-
                    if(val.输入框.getContent() != '') {
                      Packet.send(var.packetId, 'input_submit', var.puzzleId, val.输入框.getContent(), var.actionToken)
                    }
                children:
                  确认底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~192,139,68,245
                      hover: ~215,162,87,255
                      shape: ~round_rect
                      radius: 10
                      through: true
                  确认字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&0校验并提交
                      fontSize: 32
                      through: true
              取消按钮:
                type: Canvas
                attribute:
                  width: 200
                  height: 56
                action:
                  clickLeft: "Screen.close()"
                children:
                  取消底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~47,53,51,245
                      hover: ~61,66,59,255
                      shape: ~round_rect
                      radius: 10
                      through: true
                    effect:
                      stroke:
                        width: 2
                        color: var.accentDim
                  取消字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f暂不尝试
                      fontSize: 32
                      through: true
