  increment-strategy:
    type: fixed
    value: 1

# -------- 赛季神射手 --------
# 监听 ProjectileHitEvent，射箭命中实体才算
season-archery-1500:
  display-name: "百步穿杨"
  description: "本赛季累计射箭命中目标1500次"
  difficulty: hard
  bukkit-event:
    event-class: "org.bukkit.event.entity.ProjectileHitEvent"
  required-count: 1500
  base-xp-reward: 1800
  conditions:
    - type: event_payload
      key: projectileType
      operator: equals
      value: ARROW
    - type: event_payload
      key: hitEntity
      operator: exists
      value: ""
  increment-strategy:
    type: fixed
    value: 1

