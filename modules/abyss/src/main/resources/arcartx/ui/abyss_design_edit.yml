                              x: -60
                              width: 44
                              height: 36
                            action:
                              clickLeft: |-
                                if(var.editField != '' && var.editField != self.parent.parent.parent.entry['field']){
                                  for(gi in range(0, var.groupCount - 1)){
                                    group = gi == 0 ? val.组容器.get(0) : var.组引用[gi.round()]
                                    if(group.entry['field'] == var.editField){ group['追加框']['框']['输入框'].setContent('') }
                                  }
                                }
                                var.editField = self.parent.parent.parent.entry['field']
                                var.editI = (self.parent.entryKey + self.parent.parent.parent.entry['lineOffset']).round()
                                self.parent.parent.parent['追加框']['框']['输入框'].setContent(self.parent.entry)
                                self.parent.parent.parent['追加框']['框']['输入框'].setFocus(true)
                            children:
                              底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~63,66,58,245
                                  shape: ~round_rect
                                  radius: 6
                                  through: true
                              字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: ~改
                                  fontSize: 32
                                  through: true
