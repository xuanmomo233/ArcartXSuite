# Lakeside field guide / 02 · Specimen plates, four columns with habitat-like waters.
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.playerLevel = packet['playerLevel']
      var.currentXp = packet['currentXp']
      var.totalCaught = packet['totalCaught']
      var.collectionCount = packet['collectionCount']
      var.totalFishTypes = packet['totalFishTypes']
      var.collectionPercent = packet['collectionPercent']
      var.fishList = packet['fishList']
      var.maxFishCount = packet['maxFishCount']
      var.itemJsons = {}
      if(var.fishList != none){
        for(key in var.fishList.keys()){
          json = packet['fishIconJson' + key]
          var.itemJsons[key] = (json != none && json != '') ? json : var.emptyItemJson
        }
      }
      var.needRebuild = true
  action:
    load: |-
      var.collectionCount = 0
      var.currentXp = 0
      var.playerLevel = 1
      var.totalCaught = 0
      var.totalFishTypes = 0
      var.collectionPercent = 0
      var.maxFishCount = 0
      var.packetId = 'AXS_FISHING'
      var.itemJsons = {}
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.currentTab = 'all'
      var.rarityLabels = {'common':'&8普通', 'uncommon':'&2罕见', 'rare':'&1稀有', 'legendary':'&6传说'}
      var.rarityTags = {'common':'&8', 'uncommon':'&2', 'rare':'&1', 'legendary':'&6'}
      var.needRebuild = false
      var.fishRefs = {}
      var.fishGeneration = 0
      var.iconDelay = 0
      var.visibleFishCount = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send(var.packetId, 'refresh_collection')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    tick: |-
      if(var.needRebuild){
        var.needRebuild = false
        for(key in var.fishRefs.keys()){
          var.fishRefs[key].remove()
        }
        var.fishRefs = {}
        var.fishGeneration = (var.fishGeneration + 1).round()
        var.visibleFishCount = 0
        for(i in range(0, var.maxFishCount - 1)){
          idx = i.round()
          entry = var.fishList[idx]
          if(entry != none && (var.currentTab == 'all' || entry['rarity'] == var.currentTab)){
            var.visibleFishCount = var.visibleFishCount + 1
            if(var.visibleFishCount == 1){
              val.鱼类网格.get(0).entryKey = idx
            } else {
              e = val.鱼类网格.get(0).copy('鱼卡片_' + var.fishGeneration + '_' + idx)
              e.entryKey = idx
              var.fishRefs[idx] = e
            }
          }
        }
        var.iconDelay = 2
      }
      if(var.iconDelay > 0){
        var.iconDelay = var.iconDelay - 1
        if(var.iconDelay == 0){
          val.鱼类网格.get(0)['图标'].seticon()
          for(key in var.fishRefs.keys()){
            var.fishRefs[key]['图标'].seticon()
          }
        }
      }
controls:
  全屏玻璃底:
    type: Texture
    attribute: {point: ~stretch_all, normal: '~Frosted:18;20,43,52,170'}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶栏:
        type: Canvas
        attribute: {x: '-var.offX', width: 'var.viewW', height: 96}
        children:
          顶栏底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,250'}}
          标题: {type: Text, attribute: {point: ~middle_left, x: 48, texts: '~&f湖畔手册', fontSize: 54}}
          页名: {type: Text, attribute: {point: ~middle_left, x: 340, texts: '~&7钓鱼 / &f鱼种图鉴', fontSize: 36}}
          关闭按钮:
            type: Canvas
            attribute: {point: ~middle_right, x: -40, width: 112, height: 52}
            action: {clickLeft: 'Screen.close()'}
            children:
              关闭背景: {type: Texture, attribute: {point: ~stretch_all, normal: '~48,75,83,255', hover: '~73,107,106,255', shape: ~round_rect, radius: 12, through: true}}
              关闭文字: {type: Text, attribute: {point: ~middle_center, texts: '~&f关闭', fontSize: 36, through: true}}
      左侧导航:
        type: Canvas
        attribute: {x: '48 - var.offX', y: 120, width: 300, height: 'var.viewH - 144'}
        children:
          导航底: {type: Texture, attribute: {point: ~stretch_all, normal: '~231,222,196,250', shape: ~round_rect, radius: 18}}
          索引标题: {type: Text, attribute: {x: 24, y: 24, texts: '~&8FIELD GUIDE / 目录', fontSize: 36}}
          导航总览:
            type: Canvas
            attribute: {x: 16, y: 88, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_main')"}
            children:
              总览底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              总览文字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f01  垂钓日志', fontSize: 36, through: true}}
          导航图鉴:
            type: Canvas
            attribute: {x: 16, y: 162, width: 268, height: 62}
            children:
              图鉴底: {type: Texture, attribute: {point: ~stretch_all, normal: '~157,190,169,255', shape: ~round_rect, radius: 10, through: true}}
              图鉴文字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&002  鱼种图鉴', fontSize: 36, through: true}}
          导航奖励:
            type: Canvas
            attribute: {x: 16, y: 236, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_rewards')"}
            children:
              奖励底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              奖励文字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f03  成长奖励', fontSize: 36, through: true}}
          导航天赋:
            type: Canvas
            attribute: {x: 16, y: 310, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_talents')"}
            children:
              天赋底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              天赋文字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f04  技艺网络', fontSize: 36, through: true}}
          导航任务:
            type: Canvas
            attribute: {x: 16, y: 384, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_tasks')"}
            children:
              任务底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              任务文字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f05  湖畔委托', fontSize: 36, through: true}}
          导航饵料:
            type: Canvas
            attribute: {x: 16, y: 458, width: 268, height: 62}
            action: {clickLeft: "Packet.send(var.packetId, 'open_baits')"}
            children:
              饵料底: {type: Texture, attribute: {point: ~stretch_all, normal: '~23,49,64,245', hover: '~53,89,96,255', shape: ~round_rect, radius: 10, through: true}}
              饵料文字: {type: Text, attribute: {point: ~middle_left, x: 20, texts: '~&f06  行前饵料', fontSize: 36, through: true}}
          图鉴说明: {type: Text, attribute: {x: 24, y: 580, texts: ['~&8深色鱼种为待发现', '~&8捕获后记录次数', '~&8与最大尺寸'], fontSize: 36}}
      内容区:
        type: Canvas
        attribute: {x: '372 - var.offX', y: 120, width: 'var.contentW', height: 'var.viewH - 144'}
        children:
          内容底: {type: Texture, attribute: {point: ~stretch_all, normal: '~191,209,191,248', shape: ~round_rect, radius: 18}}
          页标题: {type: Text, attribute: {x: 32, y: 24, texts: '~&0鱼种图鉴', fontSize: 64}}
          图鉴进度文本: {type: Text, attribute: {point: ~top_right, x: -40, y: 40, texts: "'&8已记录 ' + var.collectionCount.round() + ' / ' + var.totalFishTypes.round() + ' · ' + var.collectionPercent.round() + '%'", fontSize: 36}}
          统计信息: {type: Text, attribute: {x: 32, y: 108, texts: "'&8Lv.' + var.playerLevel.round() + ' · 经验 ' + var.currentXp.round() + ' · 累计捕获 ' + var.totalCaught.round()", fontSize: 36}}
          标签栏:
            type: HStack
            attribute: {x: 32, y: 164, height: 56, spaceBetween: 12}
            children:
              标签_全部:
                type: Canvas
                attribute: {width: 180, height: 56}
                action:
                  clickLeft: |-
                    var.currentTab = 'all'
                    var.needRebuild = true
                    val.图鉴滑块.setDragYRatio(0)
                children:
                  底: {type: Texture, attribute: {point: ~stretch_all, normal: "var.currentTab == 'all' ? '23,49,64,255' : '231,222,196,255'", shape: ~round_rect, radius: 10, through: true}}
                  字: {type: Text, attribute: {point: ~middle_center, texts: "var.currentTab == 'all' ? '&f全部' : '&0全部'", fontSize: 36, through: true}}
              标签_普通:
                type: Canvas
                attribute: {width: 180, height: 56}
                action:
                  clickLeft: |-
                    var.currentTab = 'common'
                    var.needRebuild = true
                    val.图鉴滑块.setDragYRatio(0)
                children:
                  底: {type: Texture, attribute: {point: ~stretch_all, normal: "var.currentTab == 'common' ? '23,49,64,255' : '231,222,196,255'", shape: ~round_rect, radius: 10, through: true}}
                  字: {type: Text, attribute: {point: ~middle_center, texts: "var.currentTab == 'common' ? '&f普通' : '&0普通'", fontSize: 36, through: true}}
              标签_罕见:
                type: Canvas
                attribute: {width: 180, height: 56}
                action:
                  clickLeft: |-
                    var.currentTab = 'uncommon'
                    var.needRebuild = true
                    val.图鉴滑块.setDragYRatio(0)
                children:
                  底: {type: Texture, attribute: {point: ~stretch_all, normal: "var.currentTab == 'uncommon' ? '23,49,64,255' : '231,222,196,255'", shape: ~round_rect, radius: 10, through: true}}
                  字: {type: Text, attribute: {point: ~middle_center, texts: "var.currentTab == 'uncommon' ? '&f罕见' : '&0罕见'", fontSize: 36, through: true}}
              标签_稀有:
                type: Canvas
                attribute: {width: 180, height: 56}
                action:
                  clickLeft: |-
                    var.currentTab = 'rare'
                    var.needRebuild = true
                    val.图鉴滑块.setDragYRatio(0)
                children:
                  底: {type: Texture, attribute: {point: ~stretch_all, normal: "var.currentTab == 'rare' ? '23,49,64,255' : '231,222,196,255'", shape: ~round_rect, radius: 10, through: true}}
                  字: {type: Text, attribute: {point: ~middle_center, texts: "var.currentTab == 'rare' ? '&f稀有' : '&0稀有'", fontSize: 36, through: true}}
              标签_传说:
                type: Canvas
                attribute: {width: 180, height: 56}
                action:
                  clickLeft: |-
                    var.currentTab = 'legendary'
                    var.needRebuild = true
                    val.图鉴滑块.setDragYRatio(0)
                children:
                  底: {type: Texture, attribute: {point: ~stretch_all, normal: "var.currentTab == 'legendary' ? '23,49,64,255' : '231,222,196,255'", shape: ~round_rect, radius: 10, through: true}}
                  字: {type: Text, attribute: {point: ~middle_center, texts: "var.currentTab == 'legendary' ? '&f传说' : '&0传说'", fontSize: 36, through: true}}
          滚动提示: {type: Text, attribute: {point: ~top_right, x: -32, y: 180, texts: '~&8滚轮翻页', fontSize: 36}}
          图鉴滑轨: {type: Texture, attribute: {point: ~top_right, x: -16, y: 244, width: 12, height: 'var.viewH - 412', normal: '~140,166,151,255', shape: ~round_rect, radius: 6}}
          图鉴滑块:
            type: Texture
            val: 图鉴滑块
            attribute: {point: ~top_right, x: -16, y: 244, width: 12, height: 100, maxDragY: 'var.viewH - 512', normal: '~23,49,64,255', shape: ~round_rect, radius: 6}
          空状态: {type: Text, attribute: {point: ~middle_center, texts: '~&8此分类暂无鱼种记录', fontSize: 48, visible: 'var.visibleFishCount == 0'}}
          滚动区:
            type: Scroll
            attribute: {x: 28, y: 244, width: 'var.contentW - 76', height: 'var.viewH - 412', moveY: "self.parent['图鉴滑块'].getDragYRatio()"}
            action:
              wheel: |-
                self.parent['图鉴滑块'].setDragYRatio(math.max(0, math.min(1, self.moveY - self.wheelValue * 0.1)))
            children:
              鱼类网格:
                type: HGrid
                val: 鱼类网格
                attribute: {width: 'var.contentW - 76', column: 4, spaceBetweenX: 16, spaceBetweenY: 20}
                children:
                  鱼卡片:
                    type: Canvas
                    attribute: {entryKey: 0.round(), entry: 'var.fishList[self.entryKey]', visible: "self.entry != none && (var.currentTab == 'all' || self.entry['rarity'] == var.currentTab)", width: '(var.contentW - 124) / 4', height: 320, rarityTag: "var.rarityTags[self.entry['rarity']]", rarityLabel: "var.rarityLabels[self.entry['rarity']]"}
                    children:
                      卡片底: {type: Texture, attribute: {point: ~stretch_all, normal: '~231,222,196,255', shape: ~round_rect, radius: 16, through: true}}
                      水域底: {type: Texture, attribute: {x: 12, y: 12, width: '(var.contentW - 124) / 4 - 24', height: 160, normal: "self.parent.entry['caught'] ? '99,141,142,255' : '23,49,64,255'", shape: ~round_rect, radius: 12, through: true}}
                      水线: {type: Texture, attribute: {x: 24, y: 142, width: '(var.contentW - 124) / 4 - 48', height: 3, normal: '~181,210,193,150', through: true}}
                      图标:
                        type: Slot
                        attribute: {slotType: ~Icon, itemScale: 1.0, point: ~top_center, y: 32, width: 120, height: 120, normal: '~0,0,0,0', visible: "self.parent.entry['caught']", overwriteText: '~', seticon: 'self.setItemIcon(var.itemJsons[self.parent.entryKey])'}
                      未捕获遮罩: {type: Text, attribute: {point: ~top_center, y: 56, texts: '~&7?', fontSize: 81, through: true, visible: "!self.parent.entry['caught']"}}
                      鱼名: {type: Text, attribute: {x: 20, y: 188, texts: "'&0' + self.parent.entry['name']", fontSize: 36, limit: 8, through: true}}
                      稀有度: {type: Text, attribute: {x: 20, y: 228, texts: "var.rarityLabels[self.parent.entry['rarity']]", fontSize: 36, through: true}}
                      捕获次数: {type: Text, attribute: {x: 20, y: 268, texts: "self.parent.entry['caught'] ? '&8捕获 ' + self.parent.entry['count'].round() + ' 次' : '&8待发现'", fontSize: 36, through: true}}
                      最大尺寸: {type: Text, attribute: {point: ~top_right, x: -20, y: 228, texts: "self.parent.entry['caught'] ? '&8' + self.parent.entry['maxSize'].round() + ' cm' : none", fontSize: 36, through: true}}
