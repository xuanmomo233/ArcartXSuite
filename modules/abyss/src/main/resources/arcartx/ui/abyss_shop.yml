# Abyss / field quartermaster: a scrollable requisition ledger with live coin balance.
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.shopId = packet['shopId']
      var.shopTitle = packet['shopTitle']
      var.coins = packet['coins']
      var.goodsCount = packet['goodsCount']
      var.goodsRows = packet['goods']
      var.iconJsons = {}
      for(key in var.goodsRows.keys()){
        icon = var.goodsRows[key]['iconJson']
        var.iconJsons[key] = icon != none && icon != '' ? icon : var.air
      }
      var.dirty = true
    update: |-
      var.coins = packet['coins']
      val.金币数.texts = '&6' + var.coins.round() + ' 金币'
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.shopId = ''
      var.shopTitle = '商店'
      var.coins = 0
      var.goodsCount = 0
      var.goodsRows = {}
      var.iconJsons = {}
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.dirty = false
      var.商品引用 = {}
      var.商品轮次 = 0
    open: |-
      Sound.self('minecraft:entity.villager.trade', 0.9, 10)
    tick: |-
      if(var.dirty){
        var.dirty = false
        目标数 = var.goodsCount.round()
        if(val.goods_rows.childrenCount() - 1 != 目标数 - 1){
          for(key in var.商品引用.keys()){
            var.商品引用[key].remove()
          }
          var.商品引用 = {}
          var.商品轮次 = (var.商品轮次 + 1).round()
          模板 = val.goods_rows.get(0)
          模板.entryKey = 0.round()
          if(目标数 > 1){
            for(i in range(1, 目标数 - 1)){
              c = 模板.copy('商品行_' + var.商品轮次 + '_' + i.round())
              c.entryKey = i.round()
              var.商品引用[i.round()] = c
            }
          }
        }
        if(目标数 > 0){
          val.goods_rows.get(0)['商品图标'].seticon()
          for(i in range(1, 目标数 - 1)){
            var.商品引用[i.round()]['商品图标'].seticon()
          }
        }
      }
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:26;8,10,11,223
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      商店面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1120
          height: 860
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~22,25,25,253
              through: true
            effect:
              stroke:
                width: 3
                color: ~108,82,56,255
          顶部锈带:
            type: Texture
            attribute:
              width: 1120
              height: 8
              normal: ~145,62,43,255
              through: true
          眉题:
            type: Text
            attribute:
              x: 56
              y: 34
              texts: ~&6ABYSS   /   FIELD QUARTERMASTER   05
              fontSize: 36
              through: true
          标题:
            type: Text
            attribute:
              x: 54
              y: 86
              texts: "'&f' + var.shopTitle"
              fontSize: 64
              limit: 16
              through: true
          金币底:
            type: Texture
            attribute:
              x: 738
              y: 88
              width: 300
              height: 64
              normal: ~54,48,34,255
              through: true
          金币数:
            type: Text
            val: 金币数
            attribute:
              x: 765
              y: 102
              texts: "'&6' + var.coins.round() + ' 金币'"
              fontSize: 48
              through: true
          栏名:
            type: Text
            attribute:
              x: 56
              y: 182
              texts: ~&6补给清单    /    点击物资行申请购买
              fontSize: 36
              through: true
          栏目提示:
            type: Text
            attribute:
              point: ~top_right
              x: -78
              y: 182
              texts: ~&8可用资金不足的物资会显示为灰色
              fontSize: 36
              through: true
          商品列表底:
            type: Texture
            attribute:
              x: 48
              y: 228
              width: 1024
              height: 514
              normal: ~13,16,17,255
              through: true
            effect:
              stroke:
                width: 2
                color: ~88,72,55,255
          列表滑轨:
            type: Texture
            attribute:
              x: 1044
              y: 246
              width: 10
              height: 474
              normal: ~45,43,38,255
              through: true
          列表滑块:
            type: Texture
            val: goods_slider
            attribute:
              x: 1044
              y: 246
              width: 10
              height: 100
              maxDragY: 374
              normal: ~208,155,82,255
          商品滚动区:
            type: Scroll
            attribute:
              x: 66
              y: 246
              width: 954
              height: 474
              moveY: val.goods_slider.getDragYRatio()
            action:
              wheel: |-
                ratio = self.moveY - self.wheelValue * 0.12
                if(ratio < 0){ ratio = 0 }
                if(ratio > 1){ ratio = 1 }
                val.goods_slider.setDragYRatio(ratio)
            children:
              商品列表:
                type: VStack
                val: goods_rows
                attribute:
                  width: 938
                  spaceBetween: 10
                children:
                  商品行:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.goodsRows[self.entryKey]
                      afford: "self.entry != none && self.entry['price'] <= var.coins"
                      visible: self.entry != none
                      width: 938
                      height: 102
                    action:
                      clickLeft: |-
                        if(self.entry != none){
                          Packet.send(var.packetId, 'shop_buy', var.shopId, self.entryKey, var.actionToken)
                          Sound.self('minecraft:ui.button.click', 1.4, 10)
                        }
                    children:
                      行底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: "self.parent.afford ? '34,37,36,255' : '26,28,28,255'"
                          hover: "self.parent.afford ? '62,52,38,255' : '36,32,29,255'"
                          through: true
                        effect:
                          stroke:
                            width: 2
                            color: "self.parent.afford ? '108,84,56,255' : '65,61,53,255'"
                      索引标:
                        type: Text
                        attribute:
                          x: 18
                          y: 32
                          texts: "'&6' + (self.parent.entryKey + 1).round()"
                          fontSize: 36
                          through: true
                      商品图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          x: 64
                          y: 16
                          width: 68
                          height: 68
                          itemScale: 0.84
                          normal: ~50,51,46,255
                          through: true
                          seticon: "self.setItemIcon(var.iconJsons[self.parent.entryKey])"
                      商品名:
                        type: Text
                        attribute:
                          x: 154
                          y: 10
                          texts: "'&f' + self.parent.entry['name']"
                          fontSize: 48
                          limit: 15
                          through: true
                      商品描述:
                        type: Text
                        attribute:
                          x: 154
                          y: 62
                          texts: "'&7' + self.parent.entry['desc0'] + (self.parent.entry['desc1'] != '' ? '  ' + self.parent.entry['desc1'] : '')"
                          fontSize: 36
                          limit: 24
                          through: true
                      价格:
                        type: Text
                        attribute:
                          point: ~top_right
                          x: -24
                          y: 12
                          texts: "self.parent.afford ? '&6' + self.parent.entry['price'].round() + ' 金' : '&c' + self.parent.entry['price'].round() + ' 金'"
                          fontSize: 48
                          through: true
                      购买状态:
                        type: Text
                        attribute:
                          point: ~top_right
                          x: -24
                          y: 64
                          texts: "self.parent.afford ? '&6可购买' : '&7金币不足'"
                          fontSize: 36
                          through: true
          空清单:
            type: Text
            attribute:
              point: ~middle_center
              y: 45
              texts: ~&7补给库存为空 · 继续探索以寻找物资
              fontSize: 48
              visible: var.goodsCount <= 0
              through: true
          提示:
            type: Text
            attribute:
              x: 54
              y: 785
              texts: ~&8补给来源  /  副本魔物掉落金币 · 鼠标滚轮浏览完整清单
              fontSize: 36
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -36
              y: 32
              width: 48
              height: 48
            action:
              clickLeft: "Screen.close()"
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~92,39,36,255
                  hover: ~151,59,44,255
                  through: true
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&fX
                  fontSize: 36
                  through: true
