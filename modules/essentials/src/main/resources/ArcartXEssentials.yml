# ─── 一键砍树 (TreeCapitator) ───
tree-capitator:
  enabled: true
  # 需要的权限节点 (留空 = 无需权限)
  permission: "axs.essentials.treecap"
  # 连锁原木上限（含首块，1-1024），树叶另有同等的处理上限
  max-blocks: 128
  # 需要手持斧头
  require-axe: true
  # 需要潜行触发
  require-sneak: false
  # 连锁原木是否消耗工具耐久，首块按原版规则处理
  consume-durability: true
  # 支持的原木类型 (留空 = 所有原木)
  log-types: []
  # 是否同时破坏树叶
  break-leaves: true
  # 树叶搜索范围 (在原木周围多少格内，0-8)
  leaf-radius: 4

# ─── 背包操作 (InvActions: 补种/整理/工具切换) ───
inv-actions:
  # 自动补种作物
  auto-replant:
    enabled: true
    permission: "axs.essentials.replant"
    # 支持的作物类型
    crops:
      - WHEAT
      - CARROTS
      - POTATOES
      - BEETROOTS
      - NETHER_WART
  # 自动工具切换
  auto-tool:
    enabled: true
    permission: "axs.essentials.autotool"
    # 破坏方块时自动切换到最佳工具
    switch-on-break: true
