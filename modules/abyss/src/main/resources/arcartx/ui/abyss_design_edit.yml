          x: "-60 + var.offX"
          y: 30
          texts: ~&c● 未归档
          fontSize: 32
          visible: var.dirty
          through: true
      # ═══ 左栏：参数校准台 ═══
      左栏底:
        type: Texture
        attribute:
          visible: "var.kindLabel != '配置文件'"
          point: ~top_left
          x: "48 - var.offX"
          y: 130
          width: "var.colW"
          height: "var.viewH - 154"
          normal: ~17,19,20,246
          shape: ~round_rect
          radius: 14
          through: true
        effect:
          stroke:
            width: 1
            color: ~108,91,73,170
      左栏题:
        type: Text
        attribute:
          visible: "var.kindLabel != '配置文件'"
          point: ~top_left
          x: "72 - var.offX"
          y: 150
          texts: ~&6I  /  参数与标定
          fontSize: 42
          through: true
      左栏说明:
        type: Text
        attribute:
          visible: "var.kindLabel != '配置文件'"
          point: ~top_left
          x: "74 - var.offX"
          y: 204
          texts: ~&7编辑基础数值 · 坐标 / 区域需在世界中重新标记
          fontSize: 32
          through: true
      改名壳:
        type: Canvas
        attribute:
          visible: "var.kindLabel != '配置文件' && var.kindLabel != '结算策略'"
          point: ~top_left
          x: "72 - var.offX"
          y: 252
          width: "var.colW - 40"
          height: 54
        children:
          改名标:
            type: Text
            attribute:
              point: ~middle_left
              texts: ~&6ID
              fontSize: 32
              through: true
          框:
            type: Canvas
            attribute:
              point: ~middle_left
              x: 64
              width: "var.colW - 104"
              height: 48
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~11,13,14,250
                  shape: ~round_rect
                  radius: 7
                  through: true
              输入框:
                type: TextBox
                val: rename_input
                attribute:
                  x: 12
                  y: 7
                  width: "var.colW - 128"
                  height: 34
                  length: 256
                  fontSize: 32
                  emptyText: ~&7输入新标识并回车应用
                action:
                  enter: "Packet.send(var.packetId, 'design_rename', var.objKey, self.getContent(), var.actionToken)"
      左滑轨:
        type: Texture
        attribute:
          visible: "var.kindLabel != '配置文件'"
          point: ~top_left
          x: "24 - var.offX + var.colW"
          y: 322
          width: 8
          height: "var.viewH - 368"
          normal: ~44,46,42,245
          through: true
      左滑块:
        type: Texture
        val: 左滑块
        attribute:
          visible: "var.kindLabel != '配置文件'"
          point: ~top_left
          x: "24 - var.offX + var.colW"
          y: 322
          width: 8
          height: 96
          normal: ~194,139,65,255
          maxDragY: "var.viewH - 464"
          shape: ~round_rect
          radius: 4
      左滚动:
        type: Scroll
        attribute:
          visible: "var.kindLabel != '配置文件'"
          point: ~top_left
          x: "72 - var.offX"
          y: 316
          width: "var.colW - 56"
          height: "var.viewH - 362"
          moveY: "self.parent['左滑块'].getDragYRatio()"
        action:
          wheel: |-
            if(self.moveY >= 0 && self.wheelValue > 0){
              self.parent['左滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
            if(self.moveY <= 1 && self.wheelValue < 0){
              self.parent['左滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
            }
        children:
          字段容器:
            type: VStack
            val: 字段容器
            attribute:
              maxSize: 2147483647
              width: "var.colW - 56"
              spaceBetween: 12
            children:
              字段行:
                type: Canvas
                attribute:
                  width: "var.colW - 56"
                  height: 72
                  entryKey: 0.round()
                  entry: "var.fieldRows[self.entryKey]"
                  visible: "self.entry != none"
                children:
                  行底:
                    type: Texture
                    attribute:
                      x: 2
                      y: 2
                      width: "self.parent.width - 4"
                      height: "self.parent.height - 4"
                      normal: ~28,31,30,240
                      shape: ~round_rect
                      radius: 8
                      through: true
                    effect:
                      stroke:
                        width: 1
                        color: "self.parent.isHovered() ? '208,149,73,220' : '94,91,77,125'"
                  标签:
