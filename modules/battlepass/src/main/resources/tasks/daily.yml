# =============================================================================
# 每日任务池
# 分配给玩家的每日任务从这里按 weight 加权随机抽取 daily-count 个
# 每天 0 点自动重置并重新分配
# =============================================================================

# -------- 示例：每日登录 --------
daily-login:
  display-name: "每日登录"  # 任务显示名称
  description: "每天登录游戏即可获得奖励"  # 任务描述文本
  difficulty: easy                # easy / normal / hard
  event-topic: "axs.loginview.login_success"  # 触发任务进度的事件主题
  required-count: 1  # 完成任务所需的目标数量
  base-xp-reward: 100  # 完成后奖励的基础经验值
  conditions: []                  # 无条件限制
  increment-strategy:  # 进度增量策略
    type: fixed  # 固定增量：每次事件固定增加指定值
    value: 1  # 每次事件增加的进度值
  weight: 5                       # 权重越高，被抽中的概率越大

# -------- 示例：击杀僵尸 --------
daily-kill-zombie:
  display-name: "击杀僵尸"
  description: "在主世界击杀20个僵尸"
  difficulty: normal
  event-topic: "axs.combateffect.kill_entity"
  required-count: 20
  base-xp-reward: 150
  conditions:  # 触发条件列表，需全部满足才计入进度
    - type: event_payload  # 条件类型：校验事件 Payload 字段
      key: entity_type  # 校验的 Payload 字段名
      operator: equals  # 比较运算符：等于
      value: zombie  # 期望的字段值
  increment-strategy:
    type: fixed
    value: 1
  weight: 3

# -------- 示例：讨伐Boss --------
daily-damage-boss:
  display-name: "讨伐Boss"
  description: "对Boss累计造成5000点伤害"
  difficulty: hard
  event-topic: "axs.combateffect.damage_dealt"
  required-count: 5000
  base-xp-reward: 200
  conditions:
    - type: event_payload
      key: target_is_boss
      operator: equals
      value: "true"
  increment-strategy:
    type: payload_value          # 动态增量：从 Payload 读取伤害值
    payload-key: damage_amount  # 从 Payload 中读取增量值的字段名
    max-per-event: 1000          # 单次事件最多增加 1000
    scale: 1.0  # 增量缩放系数（1.0 表示不缩放）
  weight: 1
