            attribute:
              point: ~top_right
              x: -12
              y: 330
              width: 10
              height: 50
              normal: ~180,190,200,255
              maxDragY: var.viewH - 574
              shape: ~round_rect
              radius: 5
          余额滚动:
            type: Scroll
            val: 余额滚动
            attribute:
              point: ~top_left
              x: 14
              y: 330
              width: 258
              height: var.viewH - 524
              moveY: self.parent['余额滑块'].getDragYRatio()
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['余额滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['余额滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              余额列表:
                val: 余额列表
                type: RepeatGrid
                attribute:
                  items: "var.余额列表网格数据"
                  flow: ~row
                  column: 1
                  spaceBetweenY: 8
                  maxSize: "var.余额列表网格数据 == none ? 0 : var.余额列表网格数据.size()"
                  width: 258
                children:
