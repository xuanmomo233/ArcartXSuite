# Season expedition journal · 02 / horizontal reward route
# One numbered milestone per column; three cream reward slips per milestone.
ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    rewards: |-
      var.packetId = packet['packetId']
      var.levels = packet['levels']
      var.rewards = packet['rewards']
      var.levelCount = packet['levelCount']
      var.rewardCount = packet['rewardCount']
      var.currentLevel = packet['currentLevel']
      var.actionToken = packet['action_token']
      var.iconJsons = {}
      for(i in range(0, var.rewardCount - 1)){
        key = i.round()
        json = packet['iconJson' + key]
        if(json != none && json != ''){
          var.iconJsons[key] = json
        }else{
          var.iconJsons[key] = var.emptyItemJson
        }
      }
      var.claimableCount = 0
      for(i in range(0, var.rewardCount - 1)){
        key = i.round()
        r = var.rewards[key]
        if(r != none && r['claimable'] == 'true'){
          var.claimableCount = var.claimableCount + 1
        }
      }
      // Keep the YAML template as the first real milestone (server keys start at 1).
      // Save copy references; do not look up newly copied children by name/index.
      if(val.等级列表.childrenCount() != type.toNumber(var.levelCount)){
        for(key in var.levelRefs.keys()){
          var.levelRefs[key].remove()
        }
        var.levelRefs = {}
        var.levelGeneration = (var.levelGeneration + 1).round()
        template = val.等级列表.get(0)
        template.levelKey = 1.round()
        for(i in range(2, var.levelCount)){
          key = i.round()
          e = template.copy('等级列_' + var.levelGeneration + '_' + key)
          e.levelKey = key
          var.levelRefs[key] = e
        }
      }
      // JSON data is ready before any seticon call; template is included.
      if(type.toNumber(var.levelCount) > 0){
        e = val.等级列表.get(0)
        e['免费档卡片']['物品图标'].seticon()
        e['高级档卡片']['物品图标'].seticon()
        e['典藏档卡片']['物品图标'].seticon()
        for(key in var.levelRefs.keys()){
          e = var.levelRefs[key]
          e['免费档卡片']['物品图标'].seticon()
          e['高级档卡片']['物品图标'].seticon()
          e['典藏档卡片']['物品图标'].seticon()
        }
      }
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.packetId = 'AXS_BATTLEPASS'
      var.levels = {}
      var.rewards = {}
      var.iconJsons = {}
      var.levelRefs = {}
      var.levelGeneration = 0
      var.levelCount = 0
      var.rewardCount = 0
      var.currentLevel = 0
      var.claimableCount = 0
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send(var.packetId, 'open_rewards')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
controls:
  全屏玻璃底:
    type: Texture
    attribute: {point: ~stretch_all, normal: '~Frosted:16;24,29,51,235'}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶栏:
        type: Canvas
        attribute: {point: ~top_left, x: '-var.offX', width: var.viewW, height: 96}
        children:
          顶栏底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~29,35,62,255'}
          标题:
            type: Text
            attribute: {point: ~middle_left, x: 48, texts: '~&f战令 / 远征手记', fontSize: 48, through: true}
          页名:
            type: Text
            attribute: {point: ~middle_left, x: 540, texts: '~&e第二章 / 沿途奖励', fontSize: 36, through: true}
          当前等级:
            type: Text
            attribute: {point: ~middle_right, x: -250, texts: "'&f当前路标 / Lv.' + var.currentLevel", fontSize: 36, through: true}
          关闭按钮:
            type: Canvas
            attribute: {point: ~middle_right, x: -48, width: 160, height: 52}
            action:
              clickLeft: Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~44,53,88,255', hover: '~62,73,111,255', shape: ~round_rect, radius: 6, through: true}
              关闭文字:
                type: Text
                attribute: {point: ~middle_center, texts: '~&f合上 / ESC', fontSize: 36, through: true}
      左侧导航:
        type: Canvas
        attribute: {point: ~top_left, x: '48 - var.offX', y: 120, width: 300, height: 'var.viewH - 144'}
        children:
          导航底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~187,140,66,255', shape: ~round_rect, radius: 8}
          目录标题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 26, texts: '~&0远征目录', fontSize: 48, through: true}
          目录副题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 84, texts: '~&0SEASON JOURNAL', fontSize: 36, through: true}
          导航总览:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 154, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_main')
            children:
              总览底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              总览文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0第一章 / 总览', fontSize: 36, through: true}
          导航奖励:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 238, width: 268, height: 72}
            children:
              奖励底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,40,70,255', shape: ~round_rect, radius: 6, through: true}
              奖励文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&f02 / 沿途奖励', fontSize: 36, through: true}
          导航任务:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 322, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_tasks')
            children:
              任务底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              任务文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0第三章 / 任务', fontSize: 36, through: true}
          导航结算:
            type: Canvas
            attribute: {point: ~top_left, x: 16, y: 406, width: 268, height: 72}
            action:
              clickLeft: Packet.send(var.packetId, 'open_settlement')
            children:
              结算底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~207,166,97,255', hover: '~239,223,190,255', shape: ~round_rect, radius: 6, through: true}
              结算文字:
                type: Text
                attribute: {point: ~middle_left, x: 20, texts: '~&0终章 / 结算', fontSize: 36, through: true}
          图例标题:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 530, texts: '~&0路标图例', fontSize: 48, through: true}
          图例说明:
            type: Text
            attribute: {point: ~top_left, x: 24, y: 592, texts: ['~&0金边 / 可以领取', '~&0绿印 / 已经领取', '~&0墨罩 / 尚未解锁'], fontSize: 36, through: true}
          导航提示:
            type: Text
            attribute: {point: ~bottom_left, x: 24, y: -94, texts: ['~&0滚轮横览等级', '~&0拖动底部金色滑块'], fontSize: 36, through: true}
          页码:
            type: Text
            attribute: {point: ~bottom_left, x: 24, y: -32, texts: '~&002 / 04 · 奖励', fontSize: 36, through: true}
      内容区:
        type: Canvas
        attribute: {point: ~top_left, x: '372 - var.offX', y: 120, width: var.contentW, height: 'var.viewH - 144'}
        children:
          内容底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~39,48,80,255', shape: ~round_rect, radius: 8}
          页标题:
            type: Text
            attribute: {point: ~top_left, x: 32, y: 28, texts: '~&f沿途收获', fontSize: 64, through: true}
          页标题说明:
            type: Text
            attribute: {point: ~top_left, x: 34, y: 100, texts: '~&7每个等级是一站；免费、高级、典藏奖励分别记录。', fontSize: 36, through: true}
          空状态:
            type: Canvas
            attribute: {point: ~middle_center, width: 'var.contentW - 100', height: 140, visible: var.rewardCount == 0}
            children:
              空状态文本:
                type: Text
                attribute: {point: ~middle_center, texts: ['~&f奖励路标尚未展开', '~&7当前没有可展示的奖励，稍后再试。'], fontSize: 36, through: true}
          横向滚动区:
            type: Scroll
            attribute: {point: ~top_left, x: 24, y: 160, width: 'var.contentW - 48', height: 'var.viewH - 438', moveX: "self.parent['横向滑块'].getDragXRatio()"}
            action:
              wheel: |-
                if(self.moveX >= 0 && self.wheelValue > 0){
                  self.parent['横向滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                }
                if(self.moveX <= 1 && self.wheelValue < 0){
                  self.parent['横向滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                }
            children:
              等级列表:
                val: 等级列表
                type: HStack
                attribute: {height: 'var.viewH - 438', spaceBetween: 20}
                children:
                  等级列:
                    type: Canvas
                    attribute: {levelKey: 1.round(), levelData: 'var.levels[self.levelKey]', visible: self.levelData != none, width: 264, height: 626}
                    children:
                      路线连线:
                        type: Texture
                        attribute: {point: ~top_left, x: 0, y: 27, width: 264, height: 3, normal: '~187,140,66,255', through: true}
                      等级标题:
                        type: Canvas
                        attribute: {point: ~top_center, y: 6, width: 228, height: 52}
                        children:
                          等级标题底:
                            type: Texture
                            attribute: {point: ~stretch_all, normal: "self.parent.parent.levelData['reached'] == 'true' ? '205,163,84,255' : '67,77,109,255'", shape: ~round_rect, radius: 6, through: true}
                          等级标题文字:
                            type: Text
                            attribute: {point: ~middle_center, texts: "'&f路标 / Lv.' + self.parent.parent.levelData['level']", fontSize: 36, through: true}
                      免费档卡片:
                        type: Canvas
                        attribute: {point: ~top_left, x: 4, y: 76, width: 256, height: 170, entryKey: "self.parent.levelData['freeEntryKey']", entry: 'var.rewards[self.entryKey]', visible: self.entry != none}
                        children:
                          卡片底:
                            type: Texture
                            attribute: {point: ~stretch_all, normal: "self.parent.entry['claimed'] == 'true' ? '220,230,208,255' : '239,232,215,255'", shape: ~round_rect, radius: 6, through: true}
                            effect:
                              stroke: {width: 2, color: "self.parent.entry['claimable'] == 'true' ? '205,163,84,255' : '170,175,161,255'"}
                          档位标签:
                            type: Text
                            attribute: {point: ~top_left, x: 14, y: 10, texts: '~&0免费 / FREE', fontSize: 36, through: true}
                          物品图标:
                            type: Slot
                            attribute:
                              point: ~top_left
                              x: 16
                              y: 62
                              width: 64
                              height: 64
                              normal: ~214,207,189,255
                              slotType: ~Icon
                              itemScale: 0.85
                              seticon: |-
                                iconJson = var.iconJsons[var.levels[self.parent.parent.levelKey]['freeEntryKey']]
                                if(iconJson == none){ iconJson = var.emptyItemJson }
                                self.setItemIcon(iconJson)
                          未解锁遮色:
                            type: Texture
                            attribute: {point: ~top_left, x: 16, y: 62, width: 64, height: 64, normal: '~32,40,70,145', visible: "self.parent.entry['locked'] == 'true' || self.parent.entry['levelReached'] != 'true'", through: true}
                          已领取角标:
                            type: Text
                            attribute: {point: ~top_left, x: 96, y: 68, texts: '~&2已领取', visible: "self.parent.entry['claimed'] == 'true'", fontSize: 36, through: true}
                          未解锁文字:
                            type: Text
                            attribute: {point: ~top_left, x: 96, y: 68, texts: '~&8未解锁', visible: "self.parent.entry['locked'] == 'true' && self.parent.entry['claimed'] != 'true'", fontSize: 36, through: true}
                          等级不足文字:
                            type: Text
                            attribute: {point: ~top_left, x: 96, y: 68, texts: '~&8等级不足', visible: "self.parent.entry['locked'] != 'true' && self.parent.entry['claimed'] != 'true' && self.parent.entry['claimable'] != 'true'", fontSize: 36, through: true}
                          领取按钮:
                            type: Canvas
                            attribute: {point: ~bottom_right, x: -14, y: -14, width: 144, height: 42, visible: "self.parent.entry['claimable'] == 'true'", enable: "!var.actionBusy && var.actionToken != none && var.actionToken != ''"}
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'claim', self.parent.entry['level'], var.actionToken)
                            children:
                              领取背景:
                                type: Texture
                                attribute: {point: ~stretch_all, normal: '~205,163,84,255', hover: '~227,188,118,255', shape: ~round_rect, radius: 4, through: true}
                              领取文字:
                                type: Text
                                attribute: {point: ~middle_center, texts: "var.actionBusy ? '&8处理中' : '&0领取'", fontSize: 36, through: true}
                      高级档卡片:
                        type: Canvas
                        attribute: {point: ~top_left, x: 4, y: 266, width: 256, height: 170, entryKey: "self.parent.levelData['premiumEntryKey']", entry: 'var.rewards[self.entryKey]', visible: self.entry != none}
                        children:
                          卡片底:
                            type: Texture
                            attribute: {point: ~stretch_all, normal: "self.parent.entry['claimed'] == 'true' ? '220,230,208,255' : '239,232,215,255'", shape: ~round_rect, radius: 6, through: true}
                            effect:
                              stroke: {width: 2, color: "self.parent.entry['claimable'] == 'true' ? '205,163,84,255' : '170,175,161,255'"}
                          档位标签:
                            type: Text
                            attribute: {point: ~top_left, x: 14, y: 10, texts: '~&6高级 / PREMIUM', fontSize: 36, through: true}
                          物品图标:
                            type: Slot
                            attribute:
                              point: ~top_left
                              x: 16
                              y: 62
                              width: 64
                              height: 64
                              normal: ~214,207,189,255
                              slotType: ~Icon
                              itemScale: 0.85
                              seticon: |-
                                iconJson = var.iconJsons[var.levels[self.parent.parent.levelKey]['premiumEntryKey']]
                                if(iconJson == none){ iconJson = var.emptyItemJson }
                                self.setItemIcon(iconJson)
                          未解锁遮色:
                            type: Texture
                            attribute: {point: ~top_left, x: 16, y: 62, width: 64, height: 64, normal: '~32,40,70,145', visible: "self.parent.entry['locked'] == 'true' || self.parent.entry['levelReached'] != 'true'", through: true}
                          已领取角标:
                            type: Text
                            attribute: {point: ~top_left, x: 96, y: 68, texts: '~&2已领取', visible: "self.parent.entry['claimed'] == 'true'", fontSize: 36, through: true}
                          未解锁文字:
                            type: Text
                            attribute: {point: ~top_left, x: 96, y: 68, texts: '~&8未解锁', visible: "self.parent.entry['locked'] == 'true' && self.parent.entry['claimed'] != 'true'", fontSize: 36, through: true}
                          等级不足文字:
                            type: Text
                            attribute: {point: ~top_left, x: 96, y: 68, texts: '~&8等级不足', visible: "self.parent.entry['locked'] != 'true' && self.parent.entry['claimed'] != 'true' && self.parent.entry['claimable'] != 'true'", fontSize: 36, through: true}
                          领取按钮:
                            type: Canvas
                            attribute: {point: ~bottom_right, x: -14, y: -14, width: 144, height: 42, visible: "self.parent.entry['claimable'] == 'true'", enable: "!var.actionBusy && var.actionToken != none && var.actionToken != ''"}
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'claim', self.parent.entry['level'], var.actionToken)
                            children:
                              领取背景:
                                type: Texture
                                attribute: {point: ~stretch_all, normal: '~205,163,84,255', hover: '~227,188,118,255', shape: ~round_rect, radius: 4, through: true}
                              领取文字:
                                type: Text
                                attribute: {point: ~middle_center, texts: "var.actionBusy ? '&8处理中' : '&0领取'", fontSize: 36, through: true}
                      典藏档卡片:
                        type: Canvas
                        attribute: {point: ~top_left, x: 4, y: 456, width: 256, height: 170, entryKey: "self.parent.levelData['deluxeEntryKey']", entry: 'var.rewards[self.entryKey]', visible: self.entry != none}
                        children:
                          卡片底:
                            type: Texture
                            attribute: {point: ~stretch_all, normal: "self.parent.entry['claimed'] == 'true' ? '220,230,208,255' : '239,232,215,255'", shape: ~round_rect, radius: 6, through: true}
                            effect:
                              stroke: {width: 2, color: "self.parent.entry['claimable'] == 'true' ? '205,163,84,255' : '170,175,161,255'"}
                          档位标签:
                            type: Text
                            attribute: {point: ~top_left, x: 14, y: 10, texts: '~&5典藏 / DELUXE', fontSize: 36, through: true}
                          物品图标:
                            type: Slot
                            attribute:
                              point: ~top_left
                              x: 16
                              y: 62
                              width: 64
                              height: 64
                              normal: ~214,207,189,255
                              slotType: ~Icon
                              itemScale: 0.85
                              seticon: |-
                                iconJson = var.iconJsons[var.levels[self.parent.parent.levelKey]['deluxeEntryKey']]
                                if(iconJson == none){ iconJson = var.emptyItemJson }
                                self.setItemIcon(iconJson)
                          未解锁遮色:
                            type: Texture
                            attribute: {point: ~top_left, x: 16, y: 62, width: 64, height: 64, normal: '~32,40,70,145', visible: "self.parent.entry['locked'] == 'true' || self.parent.entry['levelReached'] != 'true'", through: true}
                          已领取角标:
                            type: Text
                            attribute: {point: ~top_left, x: 96, y: 68, texts: '~&2已领取', visible: "self.parent.entry['claimed'] == 'true'", fontSize: 36, through: true}
                          未解锁文字:
                            type: Text
                            attribute: {point: ~top_left, x: 96, y: 68, texts: '~&8未解锁', visible: "self.parent.entry['locked'] == 'true' && self.parent.entry['claimed'] != 'true'", fontSize: 36, through: true}
                          等级不足文字:
                            type: Text
                            attribute: {point: ~top_left, x: 96, y: 68, texts: '~&8等级不足', visible: "self.parent.entry['locked'] != 'true' && self.parent.entry['claimed'] != 'true' && self.parent.entry['claimable'] != 'true'", fontSize: 36, through: true}
                          领取按钮:
                            type: Canvas
                            attribute: {point: ~bottom_right, x: -14, y: -14, width: 144, height: 42, visible: "self.parent.entry['claimable'] == 'true'", enable: "!var.actionBusy && var.actionToken != none && var.actionToken != ''"}
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'claim', self.parent.entry['level'], var.actionToken)
                            children:
                              领取背景:
                                type: Texture
                                attribute: {point: ~stretch_all, normal: '~205,163,84,255', hover: '~227,188,118,255', shape: ~round_rect, radius: 4, through: true}
                              领取文字:
                                type: Text
                                attribute: {point: ~middle_center, texts: "var.actionBusy ? '&8处理中' : '&0领取'", fontSize: 36, through: true}
          横向滑轨:
            type: Texture
            attribute: {point: ~top_left, x: 24, y: 'var.viewH - 258', width: 'var.contentW - 48', height: 14, normal: '~67,77,109,255', shape: ~round_rect, radius: 6}
          横向滑块:
            val: 横向滑块
            type: Texture
            attribute: {point: ~top_left, x: 24, y: 'var.viewH - 258', width: 160, height: 14, normal: '~205,163,84,255', hover: '~232,193,122,255', maxDragX: 'var.contentW - 208', shape: ~round_rect, radius: 6}
          底部操作栏:
            type: Canvas
            attribute: {point: ~bottom_left, x: 24, y: -20, width: 'var.contentW - 48', height: 72}
            children:
              操作栏底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~239,232,215,255', shape: ~round_rect, radius: 6}
              可领取提示:
                type: Text
                attribute: {point: ~middle_left, x: 22, texts: "var.claimableCount > 0 ? '&0可收取 / ' + var.claimableCount.round() + ' 项奖励' : '&8暂无可领取奖励，继续推进任务路线。'", fontSize: 36, through: true}
              一键领取按钮:
                type: Canvas
                attribute: {point: ~middle_right, x: -16, width: 240, height: 48, enable: "!var.actionBusy && var.actionToken != none && var.actionToken != ''"}
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send(var.packetId, 'claim_all', var.actionToken)
                children:
                  一键领取背景:
                    type: Texture
                    attribute: {point: ~stretch_all, normal: "var.claimableCount > 0 ? '205,163,84,255' : '214,207,189,255'", hover: '~227,188,118,255', shape: ~round_rect, radius: 4, through: true}
                  一键领取文字:
                    type: Text
                    attribute: {point: ~middle_center, texts: "var.actionBusy ? '&8正在收取…' : '&0一键领取'", fontSize: 36, through: true}
