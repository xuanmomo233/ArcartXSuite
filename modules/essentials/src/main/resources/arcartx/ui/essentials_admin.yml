                children:
                  出生点底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~140,80,180,210
                      hover: ~170,110,210,230
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '200,140,240,255' : '255,255,255,230'"
                  出生点文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f设置出生点"
                      fontSize: 36
                      through: true
