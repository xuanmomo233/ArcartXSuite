# AXS 资源说明
# 用途: Abyss 进本确认框 —— 副本信息确认 + 进入/取消
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/dungeonId/dungeonName/difficulty/desc0..2
    #         minPlayers/maxPlayers/staminaCost/moneyCost/cooldown/timeLimit
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonId = packet['dungeonId']
      var.dungeonName = packet['dungeonName']
      var.difficulty = packet['difficulty']
      var.desc0 = packet['desc0']
      var.desc1 = packet['desc1']
      var.desc2 = packet['desc2']
      var.minPlayers = packet['minPlayers']
      var.maxPlayers = packet['maxPlayers']
      var.staminaCost = packet['staminaCost']
      var.moneyCost = packet['moneyCost']
      var.cooldown = packet['cooldown']
      var.timeLimit = packet['timeLimit']
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.dungeonId = ''
      var.dungeonName = ''
      var.difficulty = ''
      var.desc0 = ''
      var.desc1 = ''
      var.desc2 = ''
      var.minPlayers = 0
      var.maxPlayers = 0
      var.staminaCost = 0
      var.moneyCost = 0
      var.cooldown = 0
      var.timeLimit = 0
      var.accent = '186,140,232,255'
      var.accentDim = '96,80,140,190'
    open: |-
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;16,12,30,220
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      确认面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 560
          height: 520
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;24,19,40,240
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 2
                color: var.accentDim
          标题标线:
            type: Texture
            attribute:
              point: ~top_center
              y: 34
              width: 26
              height: 3
              normal: var.accent
              through: true
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 52
              texts: "'&f' + var.dungeonName"
              fontSize: 64
              limit: 12
              through: true
          难度:
            type: Text
            attribute:
              point: ~top_center
              y: 138
              texts: "'&7难度  &f' + var.difficulty"
              fontSize: 36
              through: true
          条件行:
            type: Text
            attribute:
              point: ~top_center
              y: 196
              fontSize: 36
              through: true
              texts:
                - "'&8人数  &f' + var.minPlayers.round() + '-' + var.maxPlayers.round() + '人   &8体力  &b' + var.staminaCost.round()"
                - "'&8门票  &e' + var.moneyCost.round() + '   &8限时  &f' + var.timeLimit.round() + 's   &8冷却  &f' + var.cooldown.round() + 's'"
          分隔线:
            type: Texture
            attribute:
              point: ~top_center
              y: 296
              width: 440
              height: 1
              normal: ~96,80,140,120
              through: true
          描述:
            type: Text
            attribute:
              point: ~top_center
              y: 316
              fontSize: 36
              through: true
              texts:
                - "'&7' + var.desc0"
                - "'&7' + var.desc1"
                - "'&7' + var.desc2"
          操作区:
            type: HStack
            attribute:
              point: ~bottom_center
              y: -36
              spaceBetween: 24
            children:
              进入按钮:
                type: Canvas
                attribute:
                  width: 170
                  height: 54
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'enter', var.dungeonId, var.actionToken)
                    Screen.close()
                children:
                  进入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~170,120,220,230
                      hover: ~200,150,240,245
                      shape: ~round_rect
                      radius: 10
                      through: true
                  进入字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&0进 入
                      fontSize: 36
                      through: true
              取消按钮:
                type: Canvas
                attribute:
                  width: 170
                  height: 54
                action:
                  clickLeft: "Screen.close()"
                children:
                  取消底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~62,66,74,230
                      hover: ~82,90,105,245
                      shape: ~round_rect
                      radius: 10
                      through: true
                    effect:
                      stroke:
                        width: 2
                        color: var.accentDim
                  取消字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f取 消
                      fontSize: 36
                      through: true
