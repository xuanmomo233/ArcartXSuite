# 水域配置：龙泉湖
# 玩家在此多边形区域内钓鱼时使用此水域配置。
# 可用 /axs fishing water create dragon_lake 命令配合选区工具创建多边形。

# 显示名称（支持颜色代码）
display-name: "&b龙泉湖"

# 所在世界
world: "world"

# 是否启用
enabled: true

# 多边形边界点（x,z），至少需要 3 个点
# 可用选区工具（左键加点、右键闭合、Shift+右键撤销）采集
pos:
  - "100,150"
  - "200,150"
  - "200,250"
  - "100,250"

# 鱼类列表（直接引用 fishes/ 目录下的鱼种 ID）
fishes:
  - "sea_bass"
  - "catfish"
  - "legendary_carp"

# 宝藏列表（直接引用 treasures/ 目录下的宝藏 ID）
treasures:
  - "old_boot"
  - "lost_ring"
  - "ancient_coin"

# 难度修正公式（ARIA 表达式，变量 global.level = 玩家钓鱼等级）
# 龙泉湖难度随等级提升：1级=1.0，50级=1.25，100级=1.5
difficulty-formula: "1.0 + 0.005 * global.level"

# 最低钓鱼等级（低于此等级无法在此水域钓鱼）
min-player-level: 0

# 最高钓鱼等级（高于此等级无法在此水域钓鱼，防高等级刷低级鱼，0 = 不限）
max-player-level: 0

# 饵料在该水域的额外倍率
bait-multipliers:
  worm: 1.5
  corn: 2.0

# 进入此水域钓鱼所需权限（留空 = 无限制）
require-permission: ""

# 浮漂落在芦苇区时，本局轨道靠底部的 6%～24% 为危险带。
# 示例坐标请对准实际水面。鱼连续进入危险带 4 个判定步后开始擦线。
obstacle-zones:
  reeds:
    display-name: "芦苇区"
    pos: ["145,195", "158,195", "158,205", "145,205"]
    track-min: 0.06
    track-max: 0.24
    warning-ticks: 4
    tension-per-tick: 4.0

# 急流经过低水层，鱼冲刺后回稳时会向下多滑一段。示例坐标请对准水面。
current-zones:
  rapids:
    display-name: "湖口急流"
    pos: ["150,190", "172,190", "172,212", "150,212"]
    track-min: 0.04
    track-max: 0.42
    drift-per-tick: -0.016
    carry-ticks: 8

# 示例坐标应对准实际水面及岸边落脚点。
fish-schools:
  rain-carp:
    x: 150.5
    y: 63.0
    z: 200.5
    radius: 8
    active-ticks: 2400
    interval-ticks: 6000
    rain-only: true
    shore: { x: 140.5, y: 64.0, z: 200.5 }
    weights:
      legendary_carp: 2.0
