# ArcartXSuite Chat — 物品预览卡片模板
# 玩家在聊天中使用 [item] 时，通过此卡片展示物品
# 悬浮卡片中的物品槽位即可触发 ArcartX Tooltip
# 卡片宽度与高度由 UI 侧根据 Text 控件实际渲染尺寸自适应
root_control:
  type: card
  attribute:
    width: "Math.max(val.sender_label.width, val.item_name_label.width) + 140 < 300 ? 300 : Math.max(val.sender_label.width, val.item_name_label.width) + 140"
    height: "Math.max(100, val.item_name_label.y + val.item_name_label.height + 20)"
  children:
    background:
      type: Texture
      attribute:
        width: "self.parent.width"
        height: "self.parent.height"
        normal: ~25,25,35,200
        shape: ~round_rect
        radius: 12
      effect:
        stroke:
          width: 2
          color: ~255,255,255,120
    item_slot:
      type: Slot
      attribute:
        width: 80
        height: 80
        x: 10
        y: 10
        slotType: ~Icon
        itemScale: 0.8
      action:
        create: |-
          self.setItemIcon(self.parent.data['itemJson'])
    tooltip_overlay:
      type: Slot
      attribute:
        width: "self.parent.width"
        height: "self.parent.height"
        slotType: ~Icon
        alpha: 0.001
      action:
        create: |-
          self.setItemIcon(self.parent.data['itemJson'])
    sender_label:
      type: Text
      val: sender_label
      attribute:
        fontSize: 64
        x: 100
        y: 15
        texts: "self.parent.data['senderDisplayName'] + ' §7展示了一件物品'"
        through: true
    item_name_label:
      type: Text
      val: item_name_label
      attribute:
        fontSize: 64
        x: 100
        y: 60
        texts: "'§b' + self.parent.data['itemName']"
        through: true
