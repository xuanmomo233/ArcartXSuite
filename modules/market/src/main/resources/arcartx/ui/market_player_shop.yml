                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f我要上架"
                  fontSize: 36
                  through: true
          # ── 商品网格滚动区 ──────────────────────────
          空商品提示:
            type: Text
            attribute:
              point: ~middle_center
              x: 0
              y: -40
              fontSize: 64
              visible: "var.listings == none || var.listings.keys().length == 0"
              texts: "~&8暂无商品"
              through: true
          商品滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -18
              y: 196
              width: 10
              height: "var.viewH - 440"
              through: true
              normal: ~24,50,40,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          商品滑块:
            type: Texture
            val: 商品滑块
            attribute:
              point: ~top_right
              x: -18
              y: 196
              width: 10
              height: 96
              normal: ~183,149,86,255
              maxDragY: "var.viewH - 536"
              shape: ~round_rect
              radius: 4
          商品滚动:
            type: Scroll
            val: 商品滚动
            attribute:
              point: ~top_left
              x: 24
              y: 196
              width: "var.scrollW"
              height: "var.viewH - 440"
              moveY: "self.parent['商品滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['商品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['商品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              商品列表:
                val: 商品列表
                type: HGrid
                attribute:
                  width: "var.scrollW"
                  column: 2
                  spaceBetweenX: 20
                  spaceBetweenY: 20
                children:
                  商品卡片:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.listings[self.entryKey]
                      visible: self.entry != none
                      width: "var.cardW"
                      height: 268
                    children:
                      卡片底:
                        type: Texture
                        attribute:
                          point: ~top_left
                          x: 3
                          y: 0
                          width: "var.cardW - 6"
                          height: 268
                          through: true
                          normal: ~24,50,40,210
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '183,149,86,255' : '255,255,255,230'"
                      商品图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 0.72
                          x: 15
                          y: 12
                          width: 96
                          height: 96
                          normal: ~45,65,48,220
                          shape: ~round_rect
                          radius: 12
                          seticon: "self.setItemIcon(var.itemJsons[self.parent.entryKey] != none ? var.itemJsons[self.parent.entryKey] : var.emptyItemJson)"
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,230
                      商品名称:
                        type: Scroll
                        attribute:
                          x: 132
                          y: 16
                          width: "var.cardW - 150"
                          height: 48
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: "self.scrollAnim = Lerp(0, 1, 2400)"
                          leave: "self.scrollAnim = none"
                        children:
                          名称布局:
                            type: HStack
                            attribute:
                              height: 48
                            children:
                              商品名:
                                type: Text
                                attribute:
                                  texts: "'&f' + self.parent.parent.parent.entry['itemDisplayName']"
                                  fontSize: 48
                                  through: true
                      卖家名:
                        type: Text
                        attribute:
                          x: 132
                          y: 74
                          texts: "'&7卖家: &f' + self.parent.entry['sellerName']"
                          fontSize: 36
                          through: true
                      价格:
                        type: Text
                        attribute:
                          x: 18
                          y: 128
                          texts: "'&e' + self.parent.entry['price'].round() + ' &7' + self.parent.entry['currencyName']"
                          fontSize: 48
                          through: true
                      留言:
                        type: Scroll
                        attribute:
                          x: 18
                          y: 178
                          width: "var.cardW - 36"
                          height: 36
                          visible: "self.parent.entry != none && self.parent.entry['message'] != ''"
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: |-
                            self.scrollAnim = Lerp(0, 1, 2000)
                          leave: |-
                            self.scrollAnim = none
                        children:
                          留言布局:
                            type: HStack
                            attribute:
                              height: 36
                            children:
                              留言文本:
                                type: Text
                                attribute:
                                  x: 0
                                  y: 0
                                  texts: "'&7留言: &f' + self.parent.parent.parent.entry['message']"
                                  fontSize: 36
                                  through: true
                      按钮组:
                        type: HStack
                        attribute:
                          x: 15
                          y: 220
                          width: "var.cardW - 30"
                          height: 40
                          spaceBetween: 12
                        children:
                          购买按钮:
                            type: Canvas
                            attribute:
                              width: "var.cardW - 30"
                              height: 40
                              visible: "self.parent.parent.entry != none && !self.parent.parent.entry['isMine']"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'pshop_buy', self.parent.parent.entry['id'].round(), var.actionToken)
                            children:
                              购买底:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 3
                                  y: 0
                                  width: "var.cardW - 36"
                                  height: 40
                                  through: true
                                  normal: ~35,76,63,255
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  ripple:
                                  stroke:
                                    width: 3
                                    color: "self.isHovered() ? '183,149,86,255' : '255,255,255,230'"
                              购买文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "var.actionBusy ? '&7处理中...' : '&f购买整组'"
                                  fontSize: 36
                                  through: true
                          下架按钮:
                            type: Canvas
                            attribute:
                              width: "var.cardW - 30"
                              height: 40
                              visible: "self.parent.parent.entry != none && self.parent.parent.entry['isMine']"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'pshop_cancel', self.parent.parent.entry['id'].round(), var.actionToken)
                            children:
                              下架底:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 3
                                  y: 0
                                  width: "var.cardW - 36"
                                  height: 40
                                  through: true
                                  normal: ~220,90,90,230
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  ripple:
                                  stroke:
                                    width: 3
                                    color: "self.isHovered() ? '255,120,120,255' : '255,255,255,230'"
                              下架文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "var.actionBusy ? '&7处理中...' : '&f下架我的商品'"
                                  fontSize: 36
                                  through: true
          # ── 底部分页栏 ──────────────────────────────
          上一页:
            type: Canvas
            attribute:
              point: ~bottom_left
              x: 24
              y: -24
              width: 130
              height: 48
              enable: "var.page > 0"
            action:
              clickLeft: |-
                if(var.page > 0){
                  Packet.send(var.packetId, 'pshop_list', (var.page - 1), var.keyword, var.sellerUuid)
                }
            children:
              上一页底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~35,76,63,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '183,149,86,255' : '255,255,255,230'"
              上一页文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f< 上一页"
                  fontSize: 36
                  through: true
          页码:
            type: Text
            attribute:
              point: ~bottom_center
              x: 0
              y: -34
              texts: "'&0' + var.pageText"
              fontSize: 36
          下一页:
            type: Canvas
            attribute:
              point: ~bottom_right
              x: -24
              y: -24
              width: 130
              height: 48
              enable: "var.page < var.totalPages - 1"
            action:
              clickLeft: |-
                if(var.page < var.totalPages - 1){
                  Packet.send(var.packetId, 'pshop_list', (var.page + 1), var.keyword, var.sellerUuid)
                }
            children:
              下一页底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~35,76,63,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '183,149,86,255' : '255,255,255,230'"
              下一页文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f下一页 >"
                  fontSize: 36
                  through: true
