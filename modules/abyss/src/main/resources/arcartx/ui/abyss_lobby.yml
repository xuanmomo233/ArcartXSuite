# AXS 资源说明
# 用途: Abyss 组队大厅 —— 公开队伍列表/搜索/副本筛选/创建队伍/邀请接收/免打扰开关
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/title/hasParty/allowInvite
    #         partyRows{idx:{partyId,name,leader,size,max,dungeonId,dungeonName,joinMode,full}}/partyCount
    #         dungeonRows{idx:{id,name}}/dungeonCount
    #         inviteRows{idx:{partyId,partyName,from}}/inviteCount
    #         keyword/dungeonFilter
    init: |-
      var.resetListScroll = true
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.hasParty = packet['hasParty']
      var.allowInvite = packet['allowInvite']
      var.partyRows = packet['partyRows']
      var.partyCount = packet['partyCount']
      var.dungeonRows = packet['dungeonRows']
      var.dungeonCount = packet['dungeonCount']
      var.inviteRows = packet['inviteRows']
      var.inviteCount = packet['inviteCount']
      var.keyword = packet['keyword']
      var.dungeonFilter = packet['dungeonFilter']
      self.actions['refresh']()
    # packetHandler: lobby_list —— 搜索/筛选/刷新后的列表推送（无 action_token）
    lobby_list: |-
      var.resetListScroll = var.keyword != packet['keyword'] || var.dungeonFilter != packet['dungeonFilter']
      var.allowInvite = packet['allowInvite']
      var.partyRows = packet['partyRows']
      var.partyCount = packet['partyCount']
      var.dungeonRows = packet['dungeonRows']
      var.dungeonCount = packet['dungeonCount']
      var.inviteRows = packet['inviteRows']
      var.inviteCount = packet['inviteCount']
      var.keyword = packet['keyword']
      var.dungeonFilter = packet['dungeonFilter']
      self.actions['refresh']()
    # Generation-bound close notification prevents stale close events cancelling a newly opened screen.

  action:
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'lobby', var.actionToken, var.viewNonce)
      }
    load: |-
      var.已建_party_rows = -1
      var.已建_invite_rows = -1
      var.已建_filter_rows = -1
      var.viewNonce = ''
      var.packetId = 'abyss'
      var.actionToken = ''
      var.hasParty = false
      var.allowInvite = true
      var.partyRows = {}
      var.partyCount = 0
      var.dungeonRows = {}
      var.dungeonCount = 0
      var.inviteRows = {}
      var.inviteCount = 0
      var.keyword = ''
      var.dungeonFilter = ''
      var.searchText = ''
      var.队伍轮次 = 0
      var.队伍引用 = {}
      var.邀请轮次 = 0
      var.邀请引用 = {}
      var.筛选轮次 = 0
      var.筛选引用 = {}
      var.accent = '186,140,232,255'
      var.accentDim = '96,80,140,190'
      var.accentHover = '220,180,255,235'
      var.cardBg = '38,30,58,255'
      var.cardBgHover = '52,40,76,255'
      var.green = '120,200,140,255'
      var.blue = '110,170,240,255'
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.leftW = var.viewW * 0.62
      var.rightX = var.leftW + 28
      var.rightW = var.viewW - var.rightX - 72
    open: |-
      Packet.send('abyss', 'view_ready', 'lobby')
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
    # 重建动态列表（队伍卡片 + 邀请行 + 筛选行）
    refresh: |-
      目标数 = var.partyCount.round()
      if(var.已建_party_rows != 目标数){
        var.已建_party_rows = 目标数
        var.队伍引用 = {}
        var.队伍轮次 = (var.队伍轮次 + 1).round()
        var.party_rows网格数据 = []
        if((目标数 - 1) >= 0){
          for(网格序号 in range(0, 目标数 - 1)){
            var.party_rows网格数据.add(网格序号.round())
          }
        }
      }
      邀请数 = var.inviteCount.round()
      if(var.已建_invite_rows != 邀请数){
        var.已建_invite_rows = 邀请数
        var.邀请引用 = {}
        var.邀请轮次 = (var.邀请轮次 + 1).round()
        var.invite_rows网格数据 = []
        if((邀请数 - 1) >= 0){
          for(网格序号 in range(0, 邀请数 - 1)){
            var.invite_rows网格数据.add(网格序号.round())
          }
        }
      }
      筛选数 = var.dungeonCount.round()
      if(var.已建_filter_rows != 筛选数){
        var.已建_filter_rows = 筛选数
        var.筛选引用 = {}
        var.筛选轮次 = (var.筛选轮次 + 1).round()
        var.filter_rows网格数据 = []
        if((筛选数 - 1) >= 0){
          for(网格序号 in range(0, 筛选数 - 1)){
            var.filter_rows网格数据.add(网格序号.round())
          }
        }
      }
      if(var.resetListScroll){ val.party_slider.setDragYRatio(0) }
