# AXS LoginView — welcome concourse / account overview with a distinct gateway rail.
# Fullscreen sibling of login_view.yml; existing authentication contracts are preserved.
ui:
  isHud: false
  defaultOpen: false
  hide:
    - HUD
    - online
    - 聊天栏
    - 纯色块HUD
    - 纯色块HUD二改
  through: false
  background: true
  escClose: false
  closeDied: true
  show: true
  jei: false
  level: 20
  screenScale: true
  packetHandler:
    init: |-
      var.changeConfirmPassword = none
      var.confirmPassword = none
      var.newPassword = none
      var.oldPassword = none
      var.password = none
      var.packetId = packet['packetId']
      var.type = packet['type']
      var.title = packet['title']
      var.mode = packet['mode']
      var.registered = packet['registered']
      var.playerName = packet['playerName']
      var.serverName = packet['serverName']
      var.online = packet['online']
      var.maxPlayers = packet['maxPlayers']
      var.address = packet['address']
      //var.time = packet['time']
      var.premiumBypass = packet['premiumBypass']
      var.qqBound = packet['qqBound']
      var.bindPrompt = packet['bindPrompt']
      var.result = packet['message']
      var.agreed = false
      var.showRules = false
      var.requireTerms = packet['requireTerms']
    result: |-
      var.result = packet['message']
      var.lastSuccess = packet['success']
      if (var.lastSuccess && var.type == 'change') {
        var.type = 'login'
        var.title = '登录服务器'
        var.oldPassword = none
        var.newPassword = none
        var.changeConfirmPassword = none
      }
    close: |-
      var.result = packet['message']
  action:
    load: |-
      var.maxPlayers = 0
      var.online = 0
      var.packetId = 'AXS_loginview'
      var.agreed = false
      var.showRules = false
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.welcomeW = var.viewW - 940
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.welcomeW = var.viewW - 940
controls:
  全屏底色:
    type: Texture
    attribute: {point: ~stretch_all, normal: '~15,22,29,255'}
  自适应全局布局:
    type: Adaptive
    attribute: {point: ~top_center, width: 1920, height: 1080}
    children:
      顶部导向:
        type: Canvas
        attribute: {x: "64 - var.offX", y: 32, width: "var.viewW - 128", height: 64}
        children:
          信号:
            type: Texture
            attribute: {x: 0, y: 14, width: 8, height: 28, normal: '~224,184,100,255', through: true}
          品牌:
            type: Text
            attribute: {x: 26, y: 8, texts: ~&fArcartX &7/ &eWELCOME GATEWAY, fontSize: 48, through: true}
          页面标识:
            type: Text
            attribute: {point: ~middle_right, texts: ~&702 &f/ 欢迎大厅, fontSize: 36, through: true}
      欢迎概览:
        type: Canvas
        attribute: {x: "64 - var.offX", y: 128, width: "var.welcomeW", height: "var.viewH - 200"}
        children:
          欢迎底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~20,29,38,255', shape: ~round_rect, radius: 18}
          顶部金线:
            type: Texture
            attribute: {x: 44, y: 42, width: 96, height: 6, normal: '~224,184,100,255', through: true}
          欢迎标识:
            type: Text
            attribute: {x: 44, y: 76, texts: ~&e01 / 你的服务器旅程, fontSize: 36, through: true}
          欢迎标题:
            type: Text
            attribute: {x: 44, y: 124, texts: "var.registered ? '&f欢迎回来。' : '&f欢迎加入。'", fontSize: 100, visible: "var.type != none", through: true}
          等待标题:
            type: Text
            attribute: {x: 44, y: 124, texts: ~&f欢迎来到。, fontSize: 100, visible: "var.type == none", through: true}
          服务器名:
            type: Text
            attribute: {x: 44, y: 220, texts: "'&7' + var.serverName", fontSize: 54, limit: 28, through: true}
          玩家标签:
            type: Text
            attribute: {x: 44, y: 306, texts: ~&7即将以此账号进入, fontSize: 36, through: true}
          玩家名:
            type: Text
            attribute: {x: 44, y: 348, texts: "'&f' + var.playerName", fontSize: 72, through: true}
          安全状态:
            type: Canvas
            attribute: {x: 44, y: 452, width: "var.welcomeW - 88", height: 170}
            children:
              状态底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~30,41,50,255', shape: ~round_rect, radius: 10}
              状态条:
                type: Texture
                attribute: {x: 0, y: 0, width: 5, height: 170, normal: "var.premiumBypass ? '134,187,152,255' : '224,184,100,255'", through: true}
              安全标题:
                type: Text
                attribute: {x: 28, y: 22, texts: ~&7账号安全状态, fontSize: 36, through: true}
              密码状态:
                type: Text
                attribute: {x: 28, y: 60, texts: ~&e等待密码验证, fontSize: 48, visible: "var.type == 'login'", through: true}
              注册状态:
                type: Text
                attribute: {x: 28, y: 60, texts: ~&e待创建账号密码, fontSize: 48, visible: "var.type == 'register'", through: true}
              改密状态:
                type: Text
                attribute: {x: 28, y: 60, texts: ~&e正在更新通行凭证, fontSize: 48, visible: "var.type == 'change'", through: true}
              免登状态:
                type: Text
                attribute: {x: 28, y: 60, texts: ~&a身份已验证 · 可免密码进入, fontSize: 48, visible: "var.type == 'bypass'", through: true}
              待绑定状态:
                type: Text
                attribute: {x: 28, y: 60, texts: ~&e身份已验证 · 需完成 QQ 绑定, fontSize: 48, visible: "var.type == 'bypass_unbound'", through: true}
              读取状态:
                type: Text
                attribute: {x: 28, y: 60, texts: ~&7正在读取账号状态, fontSize: 48, visible: "var.type == none", through: true}
              认证来源:
                type: Text
                attribute: {x: 28, y: 118, texts: "var.mode == 'authme' ? '&7认证方式 / AuthMe' : '&7认证方式 / 服务器账号系统'", fontSize: 36, visible: "var.type != none && !var.premiumBypass", through: true}
              绑定要求:
                type: Text
                attribute: {x: 28, y: 118, texts: "var.qqBound ? '&7绑定要求 / 已满足' : '&7绑定要求 / 请按右侧提示完成'", fontSize: 36, visible: var.premiumBypass, through: true}
          安全提醒:
            type: Text
            attribute: {x: 44, y: 650, texts: ~&7账号密码仅用于验证，请勿与他人共享。, fontSize: 36, through: true}
          连接概览:
            type: Canvas
            attribute: {x: 44, y: "self.parent.height - 152", width: "var.welcomeW - 88", height: 112}
            children:
              分隔线:
                type: Texture
                attribute: {x: 0, y: 0, width: "self.parent.width", height: 2, normal: '~62,77,90,255', through: true}
              在线标签:
                type: Text
                attribute: {x: 0, y: 24, texts: ~&7当前在线, fontSize: 36, through: true}
              在线人数:
                type: Text
                attribute: {x: 0, y: 62, texts: "'&e' + var.online.round() + ' &7/ ' + var.maxPlayers.round()", fontSize: 48, through: true}
              地址标签:
                type: Text
                attribute: {x: 340, y: 24, texts: ~&7当前连接 IP, fontSize: 36, through: true}
              地址:
                type: Text
                attribute: {x: 340, y: 66, texts: "'&f' + var.address", fontSize: 36, limit: 30, through: true}
      通行面板:
        type: Canvas
        attribute: {x: "var.viewW - 812 - var.offX", y: 128, width: 748, height: "var.viewH - 200"}
        children:
          面板底:
            type: Texture
            attribute: {point: ~stretch_all, normal: '~25,34,44,255', shape: ~round_rect, radius: 18}
            effect:
              stroke: {width: 2, color: '~66,80,93,255'}
          当前标记:
            type: Texture
            attribute: {x: 40, y: 34, width: 6, height: 28, normal: '~224,184,100,255', through: true}
          通行标识:
            type: Text
            attribute: {x: 62, y: 32, texts: ~&e02 / 完成验证后进入, fontSize: 36, through: true}
          状态标题:
            type: Text
            attribute: {x: 40, y: 82, texts: "'&f' + var.title", fontSize: 64, through: true}
          加载说明:
            type: Text
            attribute: {x: 40, y: 148, texts: ~&7正在读取账号信息，请稍候。, fontSize: 36, visible: "var.type == none", through: true}
          登录说明:
            type: Text
            attribute: {x: 40, y: 148, texts: ~&7输入密码，继续你的服务器旅程。, fontSize: 36, visible: "var.type == 'login'", through: true}
          注册说明:
            type: Text
            attribute: {x: 40, y: 148, texts: ~&7设置独立密码，并再次确认。, fontSize: 36, visible: "var.type == 'register'", through: true}
          改密说明:
            type: Text
            attribute: {x: 40, y: 148, texts: ~&7依次输入旧密码、新密码与确认密码。, fontSize: 36, visible: "var.type == 'change'", through: true}
          登录标签:
            type: Text
            attribute: {x: 40, y: 216, texts: ~&f账号密码, fontSize: 36, visible: "var.type == 'login'", through: true}
          登录密码容器:
            type: Canvas
            attribute: {x: 40, y: 256, width: 668, height: 64, visible: "var.type == 'login'"}
            children:
              输入底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                effect:
                  stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
              登录密码:
                type: TextBox
                attribute: {x: 16, y: 12, width: 636, height: 40, length: 64, emptyText: ~输入密码, fontSize: 36, passwordChar: ~※}
                action:
                  textChange: |-
                    var.password = self.getContent()
          进服须知:
            type: Canvas
            attribute: {x: 40, y: 438, width: 668, height: 46, visible: "(var.type == 'login' || var.type == 'bypass') && var.requireTerms"}
            action:
              click: var.showRules = true
            children:
              条款底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,43,52,255', hover: '~48,59,67,255', through: true, shape: ~round_rect, radius: 6}
              方框:
                type: Texture
                attribute: {x: 16, y: 14, width: 18, height: 18, normal: "var.agreed ? '224,184,100,255' : '32,43,52,255'", through: true}
                effect:
                  stroke: {width: 1, color: '~224,184,100,255'}
              须知文字:
                type: Text
                attribute: {point: ~middle_left, x: 48, texts: "var.agreed ? '&e已同意 &f游玩须知 · 点击重读' : '&f阅读并同意游玩须知 &e>'", fontSize: 36, through: true}
          登录按钮:
            type: Canvas
            attribute: {x: 40, y: 510, width: 668, height: 64, visible: "var.type == 'login'"}
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'login', var.password, var.agreed)
            children:
              登录按钮背景:
                type: Texture
                attribute: {point: ~stretch_all, through: true, normal: '~224,184,100,255', hover: '~245,207,134,255', shape: ~round_rect, radius: 8}
              登录按钮文字:
                type: Text
                attribute: {point: ~middle_center, texts: ~&0验证并加入服务器  >, fontSize: 48, through: true}
          切换修改密码:
            type: Canvas
            attribute: {x: 40, y: 594, width: 668, height: 52, visible: "var.type == 'login'"}
            action:
              clickLeft: |-
                var.type = 'change'
                var.title = '修改密码'
                var.result = none
                var.password = none
                var.oldPassword = none
                var.newPassword = none
                var.changeConfirmPassword = none
            children:
              切换修改密码背景:
                type: Texture
                attribute: {point: ~stretch_all, through: true, normal: '~36,47,59,255', hover: '~50,64,77,255', shape: ~round_rect, radius: 8}
                effect:
                  stroke: {width: 1, color: '~91,107,122,255'}
              切换修改密码文字:
                type: Text
                attribute: {point: ~middle_center, texts: ~&f修改账号密码, fontSize: 36, through: true}
          退出游戏:
            type: Canvas
            attribute: {x: 40, y: 670, width: 668, height: 42, visible: "var.type == 'login' || var.type == 'register'"}
            action:
              clickLeft: |-
                Game.quit()
            children:
              退出游戏背景:
                type: Texture
                attribute: {point: ~stretch_all, through: true, normal: '~29,38,48,255', hover: '~71,44,43,255', shape: ~round_rect, radius: 6}
              退出游戏文字:
                type: Text
                attribute: {point: ~middle_center, texts: ~&7退出游戏, fontSize: 36, through: true}
          免登录状态:
            type: Canvas
            attribute: {x: 40, y: 218, width: 668, height: 174, visible: "var.type == 'bypass'"}
            children:
              状态底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~29,48,45,255', shape: ~round_rect, radius: 10}
              免登录提示:
                type: Text
                attribute: {x: 24, y: 26, texts: ~&a身份已验证, fontSize: 54, through: true}
              免登说明:
                type: Text
                attribute: {x: 24, y: 90, texts: [~&f无需输入密码。, ~&7阅读须知后即可继续。], fontSize: 36, through: true}
          进入服务器:
            type: Canvas
            attribute: {x: 40, y: 510, width: 668, height: 64, visible: "var.type == 'bypass'"}
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'bypass_enter', var.agreed)
            children:
              进入服务器背景:
                type: Texture
                attribute: {point: ~stretch_all, through: true, normal: '~224,184,100,255', hover: '~245,207,134,255', shape: ~round_rect, radius: 8}
              进入服务器文字:
                type: Text
                attribute: {point: ~middle_center, texts: ~&0进入服务器  >, fontSize: 48, through: true}
          免登退出游戏:
            type: Canvas
            attribute: {x: 40, y: 670, width: 668, height: 42, visible: "var.type == 'bypass'"}
            action:
              clickLeft: |-
                Game.quit()
            children:
              免登退出游戏背景:
                type: Texture
                attribute: {point: ~stretch_all, through: true, normal: '~29,38,48,255', hover: '~71,44,43,255', shape: ~round_rect, radius: 6}
              免登退出游戏文字:
                type: Text
                attribute: {point: ~middle_center, texts: ~&7退出游戏, fontSize: 36, through: true}
          绑定说明:
            type: Text
            attribute: {x: 40, y: 148, texts: ~&e完成 QQ 绑定后继续。, fontSize: 36, visible: "var.type == 'bypass_unbound'", through: true}
          绑定提示区:
            type: Canvas
            attribute: {x: 40, y: 204, width: 668, height: 148, visible: "var.type == 'bypass_unbound'"}
            children:
              提示底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~37,43,45,255', shape: ~round_rect, radius: 8}
              提示滑轨:
                type: Texture
                attribute: {x: 646, y: 12, width: 8, height: 124, normal: '~60,72,82,255', through: true}
              提示滑块:
                type: Texture
                attribute: {x: 646, y: 12, width: 8, height: 40, maxDragY: 84, normal: '~224,184,100,255'}
              绑定提示滚动栏:
                type: Scroll
                attribute: {x: 18, y: 12, width: 610, height: 124, moveY: "self.parent['提示滑块'].getDragYRatio()"}
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['提示滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['提示滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  提示内容:
                    type: VStack
                    attribute: {width: 610}
                    children:
                      绑定提示:
                        type: Text
                        attribute: {texts: var.bindPrompt, fontSize: 36, limit: 28, through: true}
          绑定码容器:
            type: Canvas
            attribute: {x: 40, y: 370, width: 668, height: 64, visible: "var.type == 'bypass_unbound'"}
            children:
              输入底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                effect:
                  stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
              绑定码输入框:
                type: TextBox
                attribute: {x: 16, y: 12, width: 636, height: 40, length: 6, emptyText: ~输入 6 位绑定验证码, fontSize: 36}
                action:
                  textChange: |-
                    var.bindCode = self.getContent()
          绑定须知:
            type: Canvas
            attribute: {x: 40, y: 448, width: 668, height: 46, visible: "var.type == 'bypass_unbound' && var.requireTerms"}
            action:
              click: var.showRules = true
            children:
              条款底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,43,52,255', hover: '~48,59,67,255', through: true, shape: ~round_rect, radius: 6}
              方框:
                type: Texture
                attribute: {x: 16, y: 14, width: 18, height: 18, normal: "var.agreed ? '224,184,100,255' : '32,43,52,255'", through: true}
                effect:
                  stroke: {width: 1, color: '~224,184,100,255'}
              须知文字:
                type: Text
                attribute: {point: ~middle_left, x: 48, texts: "var.agreed ? '&e已同意 &f游玩须知 · 点击重读' : '&f阅读并同意游玩须知 &e>'", fontSize: 36, through: true}
          确认绑定:
            type: Canvas
            attribute: {x: 40, y: 522, width: 668, height: 64, visible: "var.type == 'bypass_unbound'"}
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'bind_code', var.bindCode)
            children:
              确认绑定背景:
                type: Texture
                attribute: {point: ~stretch_all, through: true, normal: '~224,184,100,255', hover: '~245,207,134,255', shape: ~round_rect, radius: 8}
              确认绑定文字:
                type: Text
                attribute: {point: ~middle_center, texts: ~&0确认绑定  >, fontSize: 48, through: true}
          未绑定退出游戏:
            type: Canvas
            attribute: {x: 40, y: 670, width: 668, height: 42, visible: "var.type == 'bypass_unbound'"}
            action:
              clickLeft: |-
                Game.quit()
            children:
              未绑定退出游戏背景:
                type: Texture
                attribute: {point: ~stretch_all, through: true, normal: '~29,38,48,255', hover: '~71,44,43,255', shape: ~round_rect, radius: 6}
              未绑定退出游戏文字:
                type: Text
                attribute: {point: ~middle_center, texts: ~&7退出游戏, fontSize: 36, through: true}
          注册标签:
            type: Text
            attribute: {x: 40, y: 198, texts: ~&f设置密码, fontSize: 36, visible: "var.type == 'register'", through: true}
          注册密码容器:
            type: Canvas
            attribute: {x: 40, y: 234, width: 668, height: 64, visible: "var.type == 'register'"}
            children:
              输入底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                effect:
                  stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
              注册密码:
                type: TextBox
                attribute: {x: 16, y: 12, width: 636, height: 40, length: 64, emptyText: ~设置密码, fontSize: 36, passwordChar: ~※}
                action:
                  textChange: |-
                    var.password = self.getContent()
          注册确认标签:
            type: Text
            attribute: {x: 40, y: 316, texts: ~&f再次确认, fontSize: 36, visible: "var.type == 'register'", through: true}
          注册确认容器:
            type: Canvas
            attribute: {x: 40, y: 352, width: 668, height: 64, visible: "var.type == 'register'"}
            children:
              输入底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~16,24,32,255', shape: ~round_rect, radius: 8, through: true}
                effect:
                  stroke: {width: 2, color: "self.isHovered() ? '224,184,100,255' : '79,97,112,255'"}
              注册确认:
                type: TextBox
                attribute: {x: 16, y: 12, width: 636, height: 40, length: 64, emptyText: ~再次输入密码, fontSize: 36, passwordChar: ~※}
                action:
                  textChange: |-
                    var.confirmPassword = self.getContent()
          注册须知:
            type: Canvas
            attribute: {x: 40, y: 438, width: 668, height: 46, visible: "var.type == 'register' && var.requireTerms"}
            action:
              click: var.showRules = true
            children:
              条款底:
                type: Texture
                attribute: {point: ~stretch_all, normal: '~32,43,52,255', hover: '~48,59,67,255', through: true, shape: ~round_rect, radius: 6}
              方框:
                type: Texture
                attribute: {x: 16, y: 14, width: 18, height: 18, normal: "var.agreed ? '224,184,100,255' : '32,43,52,255'", through: true}
                effect:
                  stroke: {width: 1, color: '~224,184,100,255'}
              须知文字:
                type: Text
