    display-name: "末地"
    dimension: ""
    texture: ""
    image-width: 1024
    image-height: 1024
    pixel-offset-x: 0
    pixel-offset-z: 0
    default-zoom: 1.4
    hud-zoom: 0.16
    hud-size: 180
    regions: []
  big_world:
    enabled: true
    display-name: "秋收村寨"
    dimension: ""
