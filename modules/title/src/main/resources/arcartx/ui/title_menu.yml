      }
      已装备数 = var.maxEquippedCount.round()
      现有已装备数 = val.equipped_list.childrenCount() - 1
      if(现有已装备数 != 已装备数 - 1){
        var.刷新轮次 = var.刷新轮次 + 1
        while(val.equipped_list.childrenCount() > 1){
          val.equipped_list.get(1).remove()
        }
        if(已装备数 > 1){
          for(序号 in range(1, 已装备数 - 1)){
            项 = val.equipped_list['已装备模板'].copy('已装备项_' + var.刷新轮次 + '_' + 序号.round())
            项.entryKey = 序号.round()
          }
        }
      }
      // update 包到达，重置防抖标志，恢复按钮可点击
      var.actionBusy = false

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）；置于顶层以覆盖整块屏幕
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;30,32,38,110
  # 自适配布局：宽高 = 本 UI 的设计分辨率（1920x1080），窗口分辨率变化时按比例缩放子控件
  # 顶部锚点：使 1080 设计高度的顶边与窗口上边对齐，顶栏可紧贴屏幕顶部；
  # 非 16:9 窗口多出来的纵向空间全落在下方，由 var.viewH 分配给各栏贴住底边；
  # 横向多出的空间（超宽屏）由 var.offX / var.viewW / var.contentW 分配，顶栏与各栏同步铺满
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      # 顶栏沿窗口整宽铺满（超宽屏时向两侧溢出 Adaptive 的 1920 设计宽度）
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~232,180,90,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~232,180,90,255
              shape: ~round_rect
              radius: 3
          标题:
