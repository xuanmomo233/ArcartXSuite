# TACZ 配件"支持枪械"浏览界面（ax 模式）
# 客户端 mod 悬停配件按 Shift → AXS_GUN_LIST["open"] → 服务端 openUi 本界面。
# 枪数据不走包：open 触发器直接调客户端全局函数 axstooltip.* 获取
# （持有优先排序，前 ownedCount 项绿框标记为已持有）。
# 交互: 滚轮/←→键/按钮翻页，悬停图标顶部显示枪名，ESC/✕关闭。
#
ui:
  escClose: true
  background: false
  through: false
  show: true
  action:
    load: |-
      var.guns = []
      var.ownedCount = 0
      var.page = 0
      var.格子引用 = {}
      var.轮次 = 0
      var.iconJsons = {}
      var.ownedFlags = {}
      var.hoverName = none
      var.dirty = false
    open: |-
      var.guns = axstooltip.getTaczGuns()
      var.ownedCount = axstooltip.getTaczOwnedCount()
      var.page = 0
      var.dirty = true
    # 翻页/重建统一走 dirty 标记：tick 中先按引用删旧格子再按当前页 copy
    tick: |-
      if(var.dirty){
        start = var.page * 60
        count = math.min(var.guns.size() - start, 60)
        var.iconJsons = {}
        var.ownedFlags = {}
        keys = []
        if(count > 0){
          for(i in range(0, count - 1)){
            idx = (start + i).round()
            keys.add(idx)
            var.iconJsons[idx] = var.guns.get(idx)
            var.ownedFlags[idx] = idx < var.ownedCount
          }
        }
        var.gunKeys = keys
        var.hoverName = none
        var.dirty = false
        var.gunIconsDirty = true
      }
    wheel: |-
      pages = math.ceil(var.guns.size() / 60)
      # wheelValue < 0 = 向上滚（前一页），> 0 = 向下滚（后一页）
      if(self.wheelValue < 0 && var.page > 0){
        var.page = var.page - 1
        var.dirty = true
      }
      if(self.wheelValue > 0 && var.page < pages - 1){
        var.page = var.page + 1
        var.dirty = true
      }
    keyPress: |-
      pages = math.ceil(var.guns.size() / 60)
      # 263=LEFT 262=RIGHT（GLFW）；ESC 由 Menu 的 escClose 处理
      if(self.currentKeyPress == 263 && var.page > 0){
        var.page = var.page - 1
        var.dirty = true
      }
      if(self.currentKeyPress == 262 && var.page < pages - 1){
        var.page = var.page + 1
        var.dirty = true
      }
tasks:
  refresh-repeat-grid-icons:
    type: loop
    time: 100
    cycle: 100
    run: |-
      if(var.gunIconsDirty == true && var.gunKeys != none && val.grid != none && val.grid.childrenCount() == var.gunKeys.size()){
        var.gunIconsDirty = false
        if(var.gunKeys.size() > 0){
          for(i in range(0, var.gunKeys.size() - 1)){
            row = val.grid.get(i.round())
            if(row != none && row['图标'] != none){
              row['图标'].seticon()
            }
          }
        }
      }

controls:
  遮罩:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      # 全屏暗化（Menu 已关 vanilla 背景遮罩，自己画）
      暗化:
        type: Texture
        attribute:
          point: ~stretch_all
          normal: ~0,0,0,160
          through: true
      # 960×720 面板：标题/统计/悬停名(36-48 档位字号) → 10×6 网格(72 格/84 距) → 底部翻页行
      面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 960
          height: 720
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~20,20,26,235
              shape: ~round_rect
              radius: 12
              through: true
            effect:
              stroke:
                width: 2
                color: ~90,90,110,255
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 14
              fontSize: 48
              through: true
              texts: ~§b支持枪械
          统计:
            type: Text
            attribute:
              point: ~top_center
              y: 68
              fontSize: 36
              through: true
              texts: "var.guns.size() == 0 ? none : '§7已持有 ' + var.ownedCount.round() + ' / 共 ' + var.guns.size().round() + ' 把'"
          悬停名称:
            type: Text
            attribute:
              point: ~top_center
              y: 110
              fontSize: 36
              through: true
              texts: "var.hoverName == none ? '§7悬停图标查看名称' : var.hoverName"
          网格:
            type: RepeatGrid
            val: grid
            attribute:
              items: var.gunKeys
              flow: ~row
              column: 10
              spaceBetweenX: 12
              spaceBetweenY: 12
              maxSize: 60
              point: ~top_left
              x: 66
              y: 144
              width: 828
              height: 492
            children:
              枪格模板:
                type: Canvas
                attribute:
                  width: 72
                  height: 72
                  entryKey: self.item
                children:
                  底纹:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~40,40,50,255
                      shape: ~round_rect
                      radius: 8
                      through: true
                    effect:
                      stroke:
                        width: 2
                        color: "var.ownedFlags[self.parent.entryKey] ? '60,255,120,255' : '0,0,0,0'"
                  图标:
                    type: Slot
                    attribute:
                      point: ~middle_center
                      width: 64
                      height: 64
                      slotType: ~Icon
                      normal: ~0,0,0,0
                      itemScale: 1.0
                      seticon: "self.setItemIcon(var.iconJsons[self.parent.entryKey])"
                    action:
                      enter: |-
                        if(self.getSlotItemStack() != none){
                          var.hoverName = self.getSlotItemStack().getName()
                        }
                      leave: |-
                        var.hoverName = none
          上一页:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -46
              fontSize: 36
              visible: "var.page > 0"
              texts: ~§f< 上一页
            action:
              clickLeft: |-
                if(var.page > 0){
                  var.page = var.page - 1
                  var.dirty = true
                }
          页码:
            type: Text
            attribute:
              point: ~bottom_center
              y: -46
              fontSize: 36
              through: true
              texts:
                - "~{(var.page + 1).round() + ' / ' + math.max(1, math.ceil(var.guns.size() / 60)).round()}"
          下一页:
            type: Text
            attribute:
              point: ~bottom_right
              x: -20
              y: -46
              fontSize: 36
              visible: "var.page < (math.ceil(var.guns.size() / 60) - 1)"
              texts: ~§f下一页 >
            action:
              clickLeft: |-
                pages = math.ceil(var.guns.size() / 60)
                if(var.page < pages - 1){
                  var.page = var.page + 1
                  var.dirty = true
                }
          关闭:
            type: Text
            attribute:
              point: ~top_right
              x: -14
              y: 10
              fontSize: 36
              texts:
                - '§c✕'
            action:
              clickLeft: |-
                Screen.close()
