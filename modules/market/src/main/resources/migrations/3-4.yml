from-version: 3
to-version: 4
description: "storage.mode 重命名为 storage.shared，值从 sqlite/mysql 映射为 true/false"
operations:
  - type: set-if-missing
    path: storage.shared
    value: true
  - type: rename
    from: storage.mode
    to: storage.shared
  - type: value-map
    path: storage.shared
    mapping:
      "mysql": false
      "sqlite": true
