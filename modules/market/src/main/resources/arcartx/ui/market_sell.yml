              系统商店文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f系统商店"
                  fontSize: 36
                  through: true
          导航回收:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'recycle_ui_open')
            children:
              回收底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              回收文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f回收商店"
                  fontSize: 36
                  through: true
          导航交易历史:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 282
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'history_ui_open')
            children:
              交易历史底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              交易历史文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f交易历史"
                  fontSize: 36
                  through: true
          导航上架:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 348
              width: 272
              height: 58
            children:
              上架底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~70,150,250,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              上架高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~70,150,250,255
                  shape: ~round_rect
                  radius: 2
                  through: true
              上架文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0物品上架"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 14
              y: 420
              width: 272
              height: 1
              normal: ~62,66,74,210
              through: true
          上架提示:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 440
              texts: "~&f上架说明"
              fontSize: 36
              through: true
          说明文本1:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 484
              texts: "~&71. 从背包选择物品"
              fontSize: 32
              through: true
          说明文本2:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 520
              texts: "~&72. 选择上架模式和货币"
              fontSize: 32
              through: true
          说明文本3:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 556
              texts: "~&73. 设置价格和时长"
              fontSize: 32
              through: true
          说明文本4:
            type: Text
            attribute:
              point: ~top_left
              x: 28
              y: 592
              texts: "~&74. 确认上架"
              fontSize: 32
              through: true

      # ── 内容区（三区横排）──────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # ── 左区：背包选择 ──────────────────────────
          背包区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 24
              width: "var.sellLeftW"
              height: "var.backpackH"
            children:
              背包区底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~42,50,66,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              背包标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 16
                  texts: "~&f背包物品"
                  fontSize: 36
                  through: true
              背包提示:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 64
                  texts: "~&7点击选择要上架的物品"
                  fontSize: 32
                  through: true
              背包网格:
                type: HGrid
                attribute:
                  point: ~top_left
                  x: "(var.sellLeftW - 856) / 2"
                  y: 108
                  width: 856
                  column: 9
                  spaceBetweenX: 8
                  spaceBetweenY: 8
                action:
                  create: |-
                    for(i in range(1, 35)){
                      slot = self['背包槽'].copy('背包槽' + i.round())
                      slot.entryKey = (9 + i).round()
                      slot['背包槽位'].id = 9 + i
                    }
                children:
                  背包槽:
                    type: Canvas
                    attribute:
                      entryKey: 9.round()
                      width: 88
                      height: 88
                    action:
                      clickLeft: |-
                        item = self['背包槽位'].getSlotItemStack()
                        if(item != none && item.getType() != 'null' && item.getCount() > 0){
                          if(var.selectedSlot == self.entryKey){
                            var.selectedSlot = none
                            var.selectedItemName = none
                            var.selectedItemAmount = 0
                            var.selectedItemLore = none
                            var.selectedItemJson = var.emptyItemJson
                          } else {
                            var.selectedSlot = self.entryKey
                            var.selectedItemName = item.getName()
                            var.selectedItemAmount = item.getCount()
                            var.selectedItemLore = item.getLore()
                            var.selectedItemJson = item.toJson()
                          }
                          preview = val.信息面板['预览槽']
                          if(preview != none){
                            preview.seticon()
                          }
                          loreList = val.介绍列表
                          if(loreList != none){
                            while(loreList.childrenCount() > 1){
                              loreList.get(1).remove()
                            }
                            if(var.selectedSlot != none && var.selectedItemLore != none){
                              loreCount = var.selectedItemLore.length
                              for(i in range(1, loreCount - 1)){
                                e = loreList['介绍行'].copy('介绍行' + i.round())
                                e.entryKey = i.round()
                              }
                            }
                          }
                        }
                    children:
                      背包槽底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.parent.entryKey == var.selectedSlot ? '70,150,250,255' : '42,50,66,230'"
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 2
                            color: "self.parent.entryKey == var.selectedSlot ? '255,255,255,255' : '255,255,255,180'"
                      背包槽位:
                        type: Slot
                        attribute:
                          id: 9
                          slotType: ~Backpack
                          itemScale: 0.72
                          point: ~stretch_all
                          through: true
                          lock: true

          # ── 中区：信息面板 ──────────────────────────
          信息面板:
            type: Canvas
            val: 信息面板
            attribute:
              point: ~top_left
              x: "var.sellLeftW + 48"
              y: 24
              width: "var.sellInfoW"
              height: "var.viewH - 192"
            children:
              信息面板底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~42,50,66,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              信息标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 16
                  texts: "~&f上架信息"
                  fontSize: 36
                  through: true
              预览槽:
                type: Slot
                attribute:
                  slotType: ~Icon
                  itemScale: 0.72
                  x: 20
                  y: 64
                  width: 120
                  height: 120
                  normal: ~36,42,54,220
                  shape: ~round_rect
                  radius: 12
                  through: true
                  seticon: "self.setItemIcon(var.selectedItemJson)"
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              物品名称:
                type: Text
                attribute:
                  x: 152
                  y: 72
                  texts: "var.selectedItemName != none ? '&f' + var.selectedItemName : '&7未选择物品'"
                  fontSize: 36
                  through: true
              物品数量:
                type: Text
                attribute:
                  x: 152
                  y: 120
                  visible: "var.selectedSlot != none"
                  texts: "'&7数量: &f' + var.selectedItemAmount.round()"
                  fontSize: 32
                  through: true
              物品槽位:
                type: Text
                attribute:
                  x: 152
                  y: 160
                  visible: "var.selectedSlot != none"
                  texts: "'&7槽位: &f' + var.selectedSlot"
                  fontSize: 32
                  through: true
              介绍标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 208
                  texts: "~&f物品描述"
                  fontSize: 36
                  through: true
              介绍滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -12
                  y: 256
                  width: 8
                  height: "var.viewH - 460"
                  normal: ~42,50,66,225
                  shape: ~round_rect
                  radius: 4
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,230
              介绍滑块:
                type: Texture
                val: 介绍滑块
                attribute:
                  point: ~top_right
                  x: -12
                  y: 256
                  width: 8
                  height: 60
                  normal: ~140,200,255,255
                  maxDragY: "var.viewH - 520"
                  shape: ~round_rect
                  radius: 4
              介绍滚动:
                type: Scroll
                val: 介绍滚动
                attribute:
                  point: ~top_left
                  x: 20
                  y: 256
                  width: "var.sellInfoW - 52"
