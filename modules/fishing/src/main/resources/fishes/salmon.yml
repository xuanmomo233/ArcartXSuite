# 鱼类定义：鲑鱼
# 鲑鱼是一种常见的淡水鱼，出现在河流中，白天活跃，难度较低，适合新手
# 鱼类文件位于 fishes/ 目录，每个文件定义一种鱼

id: "salmon"                   # 鱼类唯一标识符
display-name: "鲑鱼"            # 显示名称
rarity: common                 # 稀有度等级（common=常见）
min-size: 15                   # 最小尺寸（厘米）
max-size: 60                   # 最大尺寸（厘米）
base-price: 100                # 基础售价（游戏货币）
base-xp: 20                    # 基础经验值（捕获时获得）
seasons: [spring, fall]        # 可捕获季节（春季、秋季）
weathers: [clear, rain]        # 可捕获天气（晴天、雨天）
time-ranges:                   # 可捕获时间段
  - start: "06:00"             # 开始时间（06:00，清晨）
    end: "19:00"               # 结束时间（19:00，傍晚前，白天时段）
# item: 捕获后掉落的物品定义（IconDefinition 标准格式，与 battlepass/menu 一致）
#   source: 物品来源 — minecraft / mythic / neige / overture / mmoitems
#   id:     物品 ID  — 原版材质名（source: minecraft 时）或外部物品库 ID
#   其他可选字段: amount / name / lore / custom-model-data / glow / texture / texture-url / nbt / skull-texture / color / json
#   MMOItems 额外字段: mmo-type + mmo-id（代替 id）
# icon: 图鉴/小游戏中的鱼图标（字段同 item，未配置时回退到 item）
item:
  source: minecraft
  id: salmon
  amount: 1                    # 物品数量
difficulty: 35                 # 钓鱼难度（0-100，较低难度）
behaviors:                     # 小游戏中鱼的行为模式及权重
  - type: smooth               # 平滑型：鱼缓慢平稳移动
    weight: 0.7                # 权重0.7（主要行为）
  - type: floater              # 上浮型：鱼向轨道顶部移动
    weight: 0.3                # 权重0.3（次要行为）

# ─── 小游戏机制（可选，覆盖全局曲线的 base-rate） ──────────
# 鲑鱼是新手鱼，进度衰减较慢，给玩家更多反应时间
# 仅覆盖 base-rate，formula 沿用全局曲线公式（全局默认 drain=0.02）
progress-drain:
  base-rate: 0.012             # 鱼在绿条外时进度下降较慢（全局默认0.02）

# ─── 奖励（可选） ──────────────────────────────────────
# 大尺寸鲑鱼额外掉落
drops:
  big_salmon_bonus:
    item:
      source: minecraft
      id: salmon
      amount: 2
    weight: 1.0
    condition: "size:50"       # 尺寸≥50cm 时额外掉落2条

# ─── 出现条件（可选） ──────────────────────────────────
# 鲑鱼10级后可遇
min-player-level: 10

# ─── 数据/展示（可选） ─────────────────────────────────
currency-reward:
  currency-id: "money"  # 货币ID，默认money对应Vault经济，自定义货币请改为本体config.yml中currencies节定义的ID

description: "常见的淡水鱼，在河流中游弋，清晨至傍晚均可捕获，适合新手练习。"
icon:
  source: minecraft
  id: salmon
record-weight: 0.5             # 图鉴排序靠后（常见鱼）
