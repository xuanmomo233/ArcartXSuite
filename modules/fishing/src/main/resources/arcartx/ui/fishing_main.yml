# AXS 钓鱼主界面（总览）
# 打开方式: /fishing 或 /fishing main 或 Packet 触发
# 数据交互: packetHandler init/update
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航（总览/图鉴/奖励/天赋/任务）+ 内容区
#       内容区 = 等级大卡 + 图鉴卡 + 统计卡 + 快捷入口 + 最近捕获记录流
# 视觉规范:
#   全屏玻璃 Frosted:24;12,22,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片底 26,34,46,210  卡片描边 50,160,190,180
#   主色（青蓝）50,170,200  已完成 124,196,142  悬停高亮 80,200,220

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 界面初始化时接收服务端数据包，将包字段写入 UI 变量
    # 包字段:
    #   - packetId: 包标识符，用于后续 Packet.send 回传
    #   - seasonName: 当前赛季名称
    #   - playerLevel: 玩家当前钓鱼等级
    #   - maxLevel: 赛季最大等级
    #   - currentXp: 当前等级已获得经验值
    #   - xpForNext: 升下一级所需经验值
    #   - progressRatio: 当前等级进度比例（0~1）
    #   - totalCaught: 累计捕获总数
    #   - perfectCatches: 累计完美捕获次数
    #   - treasureCaught: 累计宝藏捕获次数
    #   - collectionCount: 已收集图鉴条目数
    #   - totalFishTypes: 鱼种总数
    #   - collectionPercent: 图鉴完成百分比
    #   - unspentTalentPoints: 未分配天赋点
    #   - totalTalentPoints: 总天赋点
    #   - unlockedTalentCount: 已点亮天赋数
    #   - claimableRewardCount: 可领取奖励数
    #   - claimedRewardCount: 已领取奖励数
    #   - totalRewardCount: 奖励总数
    #   - recentCatches: 最近捕获记录字典（key 为序号，含 fishId/fishName/rarity/size/perfect/timestamp）
    #   - recentIconJson{idx}: 每条记录的鱼物品图标 JSON
    #   - recentCount: 最近捕获记录条数
    init: |-
      var.packetId = packet['packetId']
      var.seasonName = packet['seasonName']
      var.playerLevel = packet['playerLevel']
      var.maxLevel = packet['maxLevel']
      var.currentXp = packet['currentXp']
      var.xpForNext = packet['xpForNext']
      var.progressRatio = packet['progressRatio']
      var.totalCaught = packet['totalCaught']
      var.perfectCatches = packet['perfectCatches']
      var.treasureCaught = packet['treasureCaught']
      var.collectionCount = packet['collectionCount']
      var.totalFishTypes = packet['totalFishTypes']
      var.collectionPercent = packet['collectionPercent']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.totalTalentPoints = packet['totalTalentPoints']
      var.unlockedTalentCount = packet['unlockedTalentCount']
      var.claimableRewardCount = packet['claimableRewardCount']
      var.claimedRewardCount = packet['claimedRewardCount']
      var.totalRewardCount = packet['totalRewardCount']
      var.recentCatches = packet['recentCatches']
      var.recentCount = packet['recentCount']
      // 构建最近捕获图标映射
      var.recentIconJsons = {}
      if(var.recentCatches != none){
        for(key in var.recentCatches.keys()){
          json = packet['recentIconJson' + key]
          if(json != none && json != ''){
            var.recentIconJsons[key] = json
          } else {
            var.recentIconJsons[key] = var.emptyItemJson
          }
        }
      }
      // 动态生成最近捕获条目（模板在索引0，复制 1~count-1）
      while(val.最近列表.childrenCount() > 1){
        val.最近列表.get(1).remove()
      }
      if(var.recentCount != none && var.recentCount > 1){
        for(i in range(1, var.recentCount - 1)){
          key = i.round()
          e = val.最近列表['捕获条目'].copy('捕获条目' + key)
          e.entryKey = key
        }
      }
      // 数据就绪后触发每个条目图标的 seticon()
      if(val.最近列表['捕获条目'] != none && val.最近列表['捕获条目']['鱼图标'] != none){
        val.最近列表['捕获条目']['鱼图标'].seticon()
      }
      for(i in range(1, var.recentCount - 1)){
        key = i.round()
        e = val.最近列表['捕获条目' + key]
        if(e != none && e['鱼图标'] != none){
          e['鱼图标'].seticon()
        }
      }
    # packetHandler: update
    # 数据更新时接收服务端数据包，刷新 UI 变量（字段与 init 相同）
    update: |-
      var.packetId = packet['packetId']
      var.seasonName = packet['seasonName']
      var.playerLevel = packet['playerLevel']
      var.maxLevel = packet['maxLevel']
      var.currentXp = packet['currentXp']
      var.xpForNext = packet['xpForNext']
      var.progressRatio = packet['progressRatio']
      var.totalCaught = packet['totalCaught']
      var.perfectCatches = packet['perfectCatches']
      var.treasureCaught = packet['treasureCaught']
      var.collectionCount = packet['collectionCount']
      var.totalFishTypes = packet['totalFishTypes']
      var.collectionPercent = packet['collectionPercent']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.totalTalentPoints = packet['totalTalentPoints']
      var.unlockedTalentCount = packet['unlockedTalentCount']
      var.claimableRewardCount = packet['claimableRewardCount']
      var.claimedRewardCount = packet['claimedRewardCount']
      var.totalRewardCount = packet['totalRewardCount']
      var.recentCatches = packet['recentCatches']
      var.recentCount = packet['recentCount']
      var.recentIconJsons = {}
      if(var.recentCatches != none){
        for(key in var.recentCatches.keys()){
          json = packet['recentIconJson' + key]
          if(json != none && json != ''){
            var.recentIconJsons[key] = json
          } else {
            var.recentIconJsons[key] = var.emptyItemJson
          }
        }
      }
      while(val.最近列表.childrenCount() > 1){
        val.最近列表.get(1).remove()
      }
      if(var.recentCount != none && var.recentCount > 1){
        for(i in range(1, var.recentCount - 1)){
          key = i.round()
          e = val.最近列表['捕获条目'].copy('捕获条目' + key)
          e.entryKey = key
        }
      }
      if(val.最近列表['捕获条目'] != none && val.最近列表['捕获条目']['鱼图标'] != none){
        val.最近列表['捕获条目']['鱼图标'].seticon()
      }
      for(i in range(1, var.recentCount - 1)){
        key = i.round()
        e = val.最近列表['捕获条目' + key]
        if(e != none && e['鱼图标'] != none){
          e['鱼图标'].seticon()
        }
      }
  action:
    load: |-
      var.packetId = 'AXS_FISHING'
      var.seasonName = '等待同步'
      var.playerLevel = 1
      var.maxLevel = 100
      var.currentXp = 0
      var.xpForNext = 100
      var.progressRatio = 0
      var.totalCaught = 0
      var.perfectCatches = 0
      var.treasureCaught = 0
      var.collectionCount = 0
      var.totalFishTypes = 0
      var.collectionPercent = 0
      var.unspentTalentPoints = 0
      var.totalTalentPoints = 0
      var.unlockedTalentCount = 0
      var.claimableRewardCount = 0
      var.claimedRewardCount = 0
      var.totalRewardCount = 0
      var.recentCatches = {}
      var.recentCount = 0
      var.recentIconJsons = {}
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.cardW = (var.contentW - 96) / 2
    open: |-
      Packet.send(var.packetId, 'refresh_main')
    # 窗口尺寸变化后重算可用高宽
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.cardW = (var.contentW - 96) / 2

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）；置于顶层以覆盖整块屏幕
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;12,22,38,110
  # 自适配布局：宽高 = 本 UI 的设计分辨率（1920x1080），窗口分辨率变化时按比例缩放子控件
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~50,160,190,120
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~50,170,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f钓鱼"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 168
              width: 1
              height: 30
              normal: ~50,160,190,120
          赛季名:
            type: Text
            attribute:
              point: ~middle_left
              x: 188
              texts: "'&f' + var.seasonName"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 40
                  texts: "~&f✕"
                  fontSize: 32
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~50,160,190,180
          # 当前页：总览
          导航总览:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            children:
              总览底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~50,170,200,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~50,170,200,230
              总览高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~50,170,200,255
                  shape: ~round_rect
                  radius: 2
              总览文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0总览"
                  fontSize: 36
          导航图鉴:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_collection')
            children:
              图鉴底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              图鉴文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f图鉴"
                  fontSize: 36
                  through: true
          导航奖励:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_rewards')
            children:
              奖励底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              奖励文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f奖励"
                  fontSize: 36
                  through: true
          导航天赋:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_talents')
            children:
              天赋底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              天赋文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f天赋"
                  fontSize: 36
                  through: true
          导航任务:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 282
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'open_tasks')
            children:
              任务底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '80,200,220,255' : '50,160,190,180'"
              任务文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f任务"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 364
              width: 264
              height: 2
              normal: ~50,160,190,80
          导航提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 20
              y: -20
              texts: "~&fESC 关闭界面"
              fontSize: 28

      # ── 内容区（总览）───────────────────────────────────
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~50,160,190,180
          页标题:
            type: Text
            attribute:
              point: ~top_left
              x: 32
              y: 26
              texts: "~&f钓鱼总览"
              fontSize: 40
          页标题说明:
            type: Text
            attribute:
              point: ~top_left
              x: 196
              y: 32
              texts: "~&f钓鱼积累经验提升等级，解锁奖励与天赋"
              fontSize: 30

          # 等级大卡
          等级卡片:
            type: Canvas
            attribute:
              point: ~top_left
              x: 32
              y: 84
              width: "var.cardW"
              height: 300
            children:
              等级卡底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~50,160,190,180
              等级标签:
                type: Text
                attribute:
                  point: ~top_left
                  x: 28
                  y: 24
                  texts: "~&f当前等级"
                  fontSize: 32
              等级数字:
                type: Text
                attribute:
                  point: ~top_left
                  x: 26
                  y: 54
                  texts: "'&fLv.' + var.playerLevel.round()"
                  fontSize: 88
              等级上限:
                type: Text
                attribute:
                  point: ~top_left
                  x: 200
                  y: 84
                  texts: "'&f/ ' + var.maxLevel.round()"
                  fontSize: 44
              经验文本:
                type: Text
                attribute:
                  point: ~top_left
                  x: 28
                  y: 172
                  width: "var.cardW - 60"
                  texts: "'&f经验 &f' + var.currentXp.round() + ' &f/ ' + var.xpForNext.round()"
                  fontSize: 34
              进度百分比:
                type: Text
                attribute:
                  point: ~top_left
                  x: "var.cardW - 96"
                  y: 246
                  texts: "'&e' + ((type.toNumber(var.progressRatio) * 100).round()) + '%'"
                  fontSize: 32
              进度条容器:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 28
                  y: 254
                  width: "var.cardW - 140"
                  height: 8
                children:
                  进度条背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~26,34,46,210
                      shape: ~round_rect
                      radius: 4
                  进度条填充:
                    type: Texture
                    attribute:
                      point: ~top_left
                      width: "(type.toNumber(var.progressRatio) > 1 ? 1 : type.toNumber(var.progressRatio)) * (var.cardW - 140)"
                      height: 8
                      normal: ~50,170,200,255
                      shape: ~round_rect
                      radius: 4

          # 图鉴完成度卡
          图鉴卡片:
            type: Canvas
            attribute:
              point: ~top_left
              x: "64 + var.cardW"
              y: 84
              width: "var.cardW"
              height: 300
            children:
              图鉴卡底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~50,160,190,180
              图鉴卡标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 28
                  y: 24
                  texts: "~&f图鉴完成度"
                  fontSize: 36
              图鉴数字:
                type: Text
                attribute:
                  point: ~top_left
                  x: 26
                  y: 60
                  texts: "'&f' + var.collectionCount.round() + ' &f/ ' + var.totalFishTypes.round()"
                  fontSize: 72
              图鉴百分比:
                type: Text
                attribute:
                  point: ~top_left
                  x: 28
                  y: 156
                  texts: "'&e' + var.collectionPercent.round() + '% &f已收集'"
                  fontSize: 34
              图鉴进度条容器:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 28
                  y: 210
                  width: "var.cardW - 60"
                  height: 8
                children:
                  图鉴进度条背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~26,34,46,210
                      shape: ~round_rect
                      radius: 4
                  图鉴进度条填充:
                    type: Texture
                    attribute:
                      point: ~top_left
                      width: "(var.totalFishTypes > 0 ? var.collectionCount / var.totalFishTypes : 0) * (var.cardW - 60)"
                      height: 8
                      normal: ~124,196,142,255
                      shape: ~round_rect
                      radius: 4
              图鉴入口按钮:
                type: Canvas
                attribute:
                  point: ~bottom_left
                  x: 28
                  y: -24
                  width: 200
                  height: 48
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'open_collection')
                children:
                  图鉴入口底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~50,170,200,235
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 3
                        color: "self.isHovered() ? '80,200,220,255' : '50,170,200,230'"
                  图鉴入口文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      width: 200
                      texts: "~&0查看图鉴"
                      fontSize: 32
                      through: true

          # 统计卡片行（4个小卡）
          统计行:
            type: Canvas
            attribute:
              point: ~top_left
              x: 32
              y: 416
              width: "var.contentW - 64"
              height: 110
            children:
              统计行底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,34,46,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~50,160,190,180
              # 累计捕获
              捕获统计:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 16
                  width: "(var.contentW - 120) / 4"
                  height: 78
