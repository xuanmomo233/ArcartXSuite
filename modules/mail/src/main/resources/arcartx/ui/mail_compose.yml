                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~90,48,50,255
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple: null
                      stroke:
                        width: 1
                        color: 'self.parent.isHovered() ? ''175,147,97,255'' : ''151,138,112,150'''
                  返回文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f返回邮箱
                      fontSize: 36
                      through: true
