# AXS 钓鱼天赋网络界面（五系常驻布局）
# 打开方式: /fishing talents 或主界面导航跳转
# 数据交互: packetHandler init/update (AXS_FISHING_TALENTS)
# 布局: 全屏毛玻璃工作台 = 顶栏 + 左侧导航 + 内容区
#       内容区 = 天赋点信息栏 + 滚动树画布（5棵树横向排列+联动天赋底部一排）
#       每棵树 = 网格布局+xy位移调控，Texture纯色块连线，正方形Slot显示icon
# 视觉规范:
#   全屏玻璃 Frosted:24;12,22,38,110  面板玻璃 Frosted:30;255,255,255,100
#   卡片底 26,34,46,210  卡片描边 80,200,220,240
#   主色（青蓝）50,170,200  已点亮 124,196,142  悬停高亮 80,200,220
#   连线已点亮 124,196,142,240  连线可点亮 50,170,200,120  连线锁定 80,200,220,100
#
# Java 端 pushTalentsData 发送字段:
#   packetId, seasonId, level, talentPoints, unspentTalentPoints,
#   unlockedTalents (Map<nodeId, level:int>),
#   trees (Map<treeId, {id, displayName, description, icon, iconJson,
#     nodeCount, nodes: Map<idx, {id, name, description, tier, branch, treeId,
#       unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>}>),
#   links (Map<idx, {id, name, description, tier, branch, treeId,
#     unlocked, level, maxLevel, canLevelUp, effects, prerequisites}>),
#   linkCount
#
# 客户端回包:
#   Packet.send(packetId, 'level_up_talent', nodeId)  — 升级指定节点
#   Packet.send(packetId, 'reset_talents')             — 重置天赋树

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8

  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = {} }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.links = packet['links']
      if(var.links == none){ var.links = {} }
      var.linkCount = packet['linkCount']
      if(var.linkCount == none){ var.linkCount = 0 }
      var.needRebuild = true
    update: |-
      var.packetId = packet['packetId']
      var.seasonId = packet['seasonId']
      var.playerLevel = packet['level']
      var.talentPoints = packet['talentPoints']
      var.unspentTalentPoints = packet['unspentTalentPoints']
      var.unlockedTalents = packet['unlockedTalents']
      if(var.unlockedTalents == none){ var.unlockedTalents = {} }
      var.trees = packet['trees']
      if(var.trees == none){ var.trees = {} }
      var.links = packet['links']
      if(var.links == none){ var.links = {} }
      var.linkCount = packet['linkCount']
      if(var.linkCount == none){ var.linkCount = 0 }
      var.needRebuild = true
  action:
    # load: 初始化变量 + 视口换算 + 树布局参数
    load: |-
      var.packetId = 'AXS_FISHING_TALENTS'
      var.seasonId = ''
      var.playerLevel = 1
      var.talentPoints = 0
      var.unspentTalentPoints = 0
      var.unlockedTalents = {}
      var.trees = {}
      var.links = {}
      var.linkCount = 0
      var.needRebuild = false
      var.iconDelay = 0
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      // 树布局参数（参考萨满天赋树：紧凑、连线明显）
      var.nodeSize = 96
      var.tierGap = 170
      var.colGap = 120
      var.treeW = 700
      var.treeGap = 0
      var.lineW = 8
      var.rootY = 80
      var.canvasW = 3580
      // 联动节点布局：所有联动天赋排在所有树下方一排
      var.linkY = var.rootY + 4 * var.tierGap + 350 + var.nodeSize + 80
      var.linkStartX = 200
      var.linkSpacing = (var.canvasW - 400) / 7
      var.bus1Rel = -50
      var.bus2Rel = -25
      var.sourceBottomY = var.rootY + 2 * var.tierGap + var.nodeSize
      var.treeNames = {}
      var.treeNames['steady'] = '&a稳健'
      var.treeNames['swift'] = '&b迅捷'
      var.treeNames['pressure'] = '&c威压'
      var.treeNames['focus'] = '&d专注'
      var.treeNames['lucky'] = '&e幸运'
      var.treeDescs = {}
      var.treeDescs['steady'] = '绿条稳定性与高度'
      var.treeDescs['swift'] = '降低鱼速与活跃度'
      var.treeDescs['pressure'] = '压制鱼逃离行为'
      var.treeDescs['focus'] = '进度获取与维持'
      var.treeDescs['lucky'] = '经验售价与稀有鱼'
      // 视口换算
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send(var.packetId, 'refresh_talents')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.needRebuild = true
    # tick: 数据变化时重建完整天赋网络
    tick: |-
      if(var.needRebuild){
        var.needRebuild = false
        var.iconDelay = 2
        while(val.树画布.childrenCount() > 3){
          val.树画布.get(3).remove()
        }
        var.treeIds = ['steady', 'swift', 'pressure', 'focus', 'lucky']
        for(ti in range(0, 4)){
          treeIndex = ti.round()
          treeKey = var.treeIds[treeIndex]
          treeData = var.trees[treeKey]
          if(treeData != none){
            treeX = 40 + treeIndex * var.treeW
            titleCtrl = val.树标题模板.copy('树标题_' + treeIndex)
            titleCtrl.x = treeX + var.treeW / 2 - 100
            titleCtrl.y = 0
            titleCtrl.treeId = treeKey
            titleCtrl.visible = true
            nodes = treeData['nodes']
            nodeCount = treeData['nodeCount']
            if(nodeCount == none){ nodeCount = 0 }
            for(i in range(0, nodeCount - 1)){
              key = i.round()
              entry = nodes[key]
              if(entry != none){
                node = val.天赋节点模板.copy('节点_' + treeIndex + '_' + key)
                node.entryKey = key
                node.treeId = treeKey
                node.isLink = false
                tier = type.toNumber(entry['tier']).round()
                branch = entry['branch']
                colOff = 0
                if(tier == 2 || tier == 3){
                  colOff = branch == 'a' ? -var.colGap : var.colGap
                }
                if(tier == 4 || tier == 5){
                  if(branch == 'a'){ colOff = -1.5 * var.colGap }
                  if(branch == 'b'){ colOff = -0.5 * var.colGap }
                  if(branch == 'c'){ colOff = 0.5 * var.colGap }
                  if(branch == 'd'){ colOff = 1.5 * var.colGap }
                }
                nodeY = var.rootY + (tier - 1) * var.tierGap
                if(tier >= 4){ nodeY = nodeY + 350 }
                node.x = treeX + var.treeW / 2 + colOff - var.nodeSize / 2
                node.y = nodeY
                if(tier > 1){
                  parentOff = 0
                  if(tier == 3){ parentOff = colOff }
                  if(tier == 4){
                    parentOff = branch == 'a' || branch == 'b' ? -var.colGap : var.colGap
                  }
                  if(tier == 5){ parentOff = colOff }
                  parentY = tier == 4 ? var.rootY + 2 * var.tierGap : nodeY - var.tierGap
                  gap = nodeY - parentY
                  delta = parentOff - colOff
                  if(delta == 0){
                    lineV = node['连线竖直']
                    lineV.x = (var.nodeSize / 2 - var.lineW / 2).round()
                    lineV.y = (-gap + var.nodeSize).round()
                    lineV.width = var.lineW
                    lineV.height = (gap - var.nodeSize).round()
                    lineV.visible = true
                  } else {
                    lineLV = node['连线L竖']
                    lineLH = node['连线L横']
                    lineLP = node['连线L父竖']
                    topRel = -gap + var.nodeSize
                    routeRel = (topRel / 2).round()
                    lineLV.x = (var.nodeSize / 2 - var.lineW / 2).round()
                    lineLV.y = routeRel
                    lineLV.width = var.lineW
                    lineLV.height = (-routeRel).round()
                    lineLV.visible = true
                    lineLH.y = (routeRel - var.lineW / 2).round()
                    lineLH.height = var.lineW
                    if(delta < 0){
                      lineLH.x = (var.nodeSize / 2 + delta).round()
                      lineLH.width = (-delta).round()
                    } else {
                      lineLH.x = (var.nodeSize / 2).round()
                      lineLH.width = delta.round()
                    }
                    lineLH.visible = true
                    lineLP.x = (var.nodeSize / 2 + delta - var.lineW / 2).round()
                    lineLP.y = topRel.round()
                    lineLP.width = var.lineW
                    lineLP.height = (routeRel - topRel).round()
                    lineLP.visible = true
                  }
                }
              }
            }
          }
        }
        for(i in range(0, var.linkCount - 1)){
          key = i.round()
          entry = var.links[key]
          if(entry != none){
            node = val.天赋节点模板.copy('联动_' + key)
            node.entryKey = key
            node.treeId = 'link'
            node.isLink = true
            prereq1 = entry['prerequisites'][0]
            prereq2 = entry['prerequisites'][1]
            parts1 = prereq1.split('-')
            parts2 = prereq2.split('-')
            tree1 = parts1[0]
            tree2 = parts2[0]
            node.linkTree1 = tree1
            node.linkTree2 = tree2
            treeIndex1 = tree1 == 'steady' ? 0 : (tree1 == 'swift' ? 1 : (tree1 == 'pressure' ? 2 : (tree1 == 'focus' ? 3 : 4)))
            treeIndex2 = tree2 == 'steady' ? 0 : (tree2 == 'swift' ? 1 : (tree2 == 'pressure' ? 2 : (tree2 == 'focus' ? 3 : 4)))
            branch1 = parts1[1].substring(2)
            branch2 = parts2[1].substring(2)
            sourceX1 = 40 + treeIndex1 * var.treeW + var.treeW / 2 + (branch1 == 'a' ? -var.colGap : var.colGap)
            sourceX2 = 40 + treeIndex2 * var.treeW + var.treeW / 2 + (branch2 == 'a' ? -var.colGap : var.colGap)
            // 所有联动节点均匀排列在所有树下方一排
            linkCenter = var.linkStartX + key * var.linkSpacing
            node.x = (linkCenter - var.nodeSize / 2).round()
            node.y = var.linkY
            // 连线：源节点底部 → 垂直下降穿过 T4/T5 间隙 → bus 汇线 → 水平 → 垂直接入联动节点
            sourceRel1 = (sourceX1 - node.x).round()
            sourceRel2 = (sourceX2 - node.x).round()
            targetRel1 = (var.nodeSize / 2 - 10).round()
            targetRel2 = (var.nodeSize / 2 + 10).round()
            sourceBottomRel = (var.sourceBottomY - var.linkY).round()
            p1v = node['联动1竖']
            p1h = node['联动1横']
            p1in = node['联动入竖']
            p2v = node['联动2竖']
            p2h = node['联动2横']
            p2in = node['联动2入竖']
            // 路径1：源1 → bus1 → 联动节点左侧
            p1v.x = (sourceRel1 - var.lineW / 2).round()
            p1v.y = sourceBottomRel
            p1v.width = var.lineW
            p1v.height = (var.bus1Rel - sourceBottomRel).round()
            p1v.visible = true
            p1h.x = (sourceRel1 < targetRel1 ? sourceRel1 : targetRel1).round()
            p1h.y = (var.bus1Rel - var.lineW / 2).round()
            p1h.width = (sourceRel1 < targetRel1 ? targetRel1 - sourceRel1 : sourceRel1 - targetRel1).round()
            p1h.height = var.lineW
            p1h.visible = true
            p1in.x = (targetRel1 - var.lineW / 2).round()
            p1in.y = var.bus1Rel
            p1in.width = var.lineW
            p1in.height = (-var.bus1Rel).round()
            p1in.visible = true
            // 路径2：源2 → bus2 → 联动节点右侧
            p2v.x = (sourceRel2 - var.lineW / 2).round()
            p2v.y = sourceBottomRel
            p2v.width = var.lineW
            p2v.height = (var.bus2Rel - sourceBottomRel).round()
            p2v.visible = true
            p2h.x = (sourceRel2 < targetRel2 ? sourceRel2 : targetRel2).round()
            p2h.y = (var.bus2Rel - var.lineW / 2).round()
            p2h.width = (sourceRel2 < targetRel2 ? targetRel2 - sourceRel2 : sourceRel2 - targetRel2).round()
            p2h.height = var.lineW
            p2h.visible = true
            p2in.x = (targetRel2 - var.lineW / 2).round()
            p2in.y = var.bus2Rel
            p2in.width = var.lineW
            p2in.height = (-var.bus2Rel).round()
            p2in.visible = true
          }
        }
      }
      if(var.iconDelay > 0){
        var.iconDelay = var.iconDelay - 1
        if(var.iconDelay == 0){
          for(ci in range(3, val.树画布.childrenCount() - 1)){
            ctrl = val.树画布.get(ci.round())
            if(ctrl != none && ctrl.entry != none && ctrl['节点图标'] != none){
              ctrl['节点图标'].setItemIcon(ctrl.entry['iconJson'])
            }
          }
        }
      }

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:24;12,22,38,110
  # 自适配布局：宽高 = 设计分辨率 1920x1080
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~80,200,220,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~50,170,200,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f钓鱼"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 168
              width: 1
              height: 30
              normal: ~80,200,220,230
          页名:
            type: Text
            attribute:
              point: ~middle_left
              x: 188
              texts: "~&f天赋树"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
