# AXS CombatEffect — 闪避飘字样式 (dodged)
# 说明: 闪避时显示的提示样式（damage=0，仅显示提示文字/图标）
# 文档: https://wiki.arcartx.com/docs/arcartx_v2/2_simple/9_damage_display

ArcartXSuite-dodged:
  textureWidth: 44
  textureHeight: 66
  randomMin: 0
  randomMax: 0.2
  # 闪避飘字固定 damage=0，永远不显示小数，因此不配置 decimalPlaces 与小数点贴图，且只需要将0的贴图（什么图的都行）
  textures:
    - "damage/dodged/0.png"
    - "damage/dodged/1.png"
    - "damage/dodged/2.png"
    - "damage/dodged/3.png"
    - "damage/dodged/4.png"
    - "damage/dodged/5.png"
    - "damage/dodged/6.png"
    - "damage/dodged/7.png"
    - "damage/dodged/8.png"
    - "damage/dodged/9.png"
