# AXS 钓鱼模块主配置文件
# 配置钓鱼小游戏核心参数、水域定义、鱼类池、宝藏池、UI注册和命令
config-version: 5              # 配置文件版本号

# ─── 调试 ────────────────────────────────────────────
# 开启后输出钓鱼事件、小游戏状态、发包详情等详细日志，生产环境建议关闭。
debug: false

# ─── 数据存储 ────────────────────────────────────────
storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "fishing.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: 1
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_fishing_"

# ─── 跨服数据同步 ──────────────────────────────────────────────
# 多服架构下同步捕获记录等数据（需配合宿主 config.yml 的 cross-server 节使用）
# 单服无需开启
cross-server:
  # 是否启用跨服同步
  enabled: false

# ─── 钓鱼小游戏核心参数 ────────────────────────────────────────
fishing:
  # 是否接管原版钓鱼事件，启用后玩家甩竿会进入 AXS 钓鱼小游戏。
  replace-vanilla: true

  # ─── 小游戏节奏 ────────────────────────────────────────────────
  # 小游戏 tick 刷新间隔（ticks），20 ticks = 1 秒。值越小动画越平滑，CPU 占用越高。
  minigame-tick-interval: 1
  # 单次小游戏基础超时（ticks），超时视为失败。实际超时按鱼难度动态调整：
  #   实际超时 = catch-duration-ticks ×（1 + 鱼难度/100 × catch-duration-difficulty-scale）+ 鱼竿 catch-duration-bonus
  # 低难度鱼超时短（要求快速完成），高难度鱼超时长（给更多尝试机会）。
  catch-duration-ticks: 120
  # 难度对超时的缩放系数：难度 100 时超时增加此比例。0.5 = 难度 100 时超时为基础的 1.5 倍。
  # 设为极小值（0.01）以消除难度对时长的干扰，让成功率主要由公式系数控制。
  catch-duration-difficulty-scale: 0.01
  # 钓鱼冷却时间（ticks）：小游戏结束后多少 ticks 内无法再次触发钓鱼。20 ticks = 1 秒，默认 100 = 5 秒。
  fishing-cooldown-ticks: 100

  # ─── 绿条物理（玩家控制的绿条，UI 中按住鼠标向下移动，松开向上浮） ───
  # 绿条物理包含：持续力（重力/点击力）+ 速度阻尼 + 边界法向力 + 反弹
  # 法向力：绿条紧贴边界时，边界抵消朝向边界的持续推力，防止绿条被钉在底部/顶部。
  # 反弹：碰撞后速度反转并衰减。法向力已解决"卡住"问题，无需强制最小反弹速度。
  #
  # 未按住鼠标时绿条受到的力（正数 → UI 中绿条向上浮），绝对值越大上浮越快。
  bar-gravity: 0.3
  # 按住鼠标时绿条受到的力（负数 → UI 中绿条向下移动），绝对值越大下移越快。
  bar-click-force: -0.3
  # 力缩放系数：bar-gravity 和 bar-click-force 都要乘以此系数后施加到绿条速度上，越大绿条响应越灵敏。
  bar-force-multiplier: 0.03
  # 绿条速度阻尼（0-1）：每 tick 绿条速度乘以此值。越接近 1 惯性越大（滑行越远），越接近 0 越容易停但越迟钝。
  bar-damping: 0.8
  # 绿条碰到轨道顶部/底部时的反弹阻尼（0-1）：碰撞后速度 = 原速度 × 此值。越接近 1 反弹越持久，越接近 0 越像撞墙停下。
  bar-bounce-damping: 0.7

  # ─── 绿条高度（绿条越大越容易覆盖鱼，钓鱼越简单） ────────────────
  # 绿条基础高度（像素），轨道总高 644 像素。玩家等级和钓竿会增加绿条高度。
  base-green-bar-height: 60
  # 玩家每提升 1 级钓鱼等级，绿条增加的高度（像素）。等级越高绿条越大越容易钓。
  height-per-level: 1
  # 难度对绿条高度的缩减比例（0-1）：难度 100 时绿条高度 ×（1 - 此值）。0 = 不缩减，1 = 完全消失。
  # 注意：绿条有动态下限保护，此值越大下限越低，削减效果越明显；此值小时下限较高以保证可玩性。
  # 绝对底线约为轨道高度的 2%（约 13 像素），极端高难度+低等级时绿条不会比这更小。
  difficulty-bar-shrink: 0.4

  # ─── 鱼物理（鱼自动移动，玩家需用绿条追踪鱼） ────────────────
  # 鱼撞到轨道顶部/底部时的反弹力度（0-1）：碰撞后速度 = 原速度 × 此值。越接近 1 反弹越远，越接近 0 越像撞墙停下。
  fish-edge-bounce: 1.5

  # ─── 钓鱼进度（进度从 0% 开始，满 100% = 钓成功，超时 = 失败） ────
  # 进度从 0 开始，玩家需持续命中绿条积累进度到 100% 才成功。离开绿条进度会下降但不会因归零失败。
  #
  # 进度增长/衰减使用 ARIA 表达式自定义函数，gain 和 drain 各自独立配置。
  # 表达式可访问以下变量（绑定到 ARIA global. 命名空间，需用 global. 前缀访问）：
  #   global.progress   — 当前进度值 [0, 1]，gain 和 drain 统一使用实际进度。如需对称处理在公式内自行写 (1 - global.progress)。
  #   global.base_rate  — 基础速率（即下方 base-rate 配置值），方便整体缩放。
  #   global.level      — 玩家钓鱼等级（整数）。
  #   global.difficulty — 鱼调整后难度（1~100）。
  #
  # 表达式返回值 = 本 tick 的基础进度变化量，再乘以等级修正、天赋加成、streak 加成（仅 gain）。
  # Aria 不可用时回退为线性（返回 base_rate）。
  #
  # 注意：drain 的返回值应大于 gain × 预期命中率，否则几乎不会失败。

  # 进度上升曲线（鱼在绿条内时进度增长）
  # 双因子模型：level 和 difficulty 用相同幂次（2.5）相互抵消，确保 L=D 时成功率恒定。
  #   gain = base_rate × (0.43 + 0.35 × (level/100)^2.5 − 0.35 × (difficulty/100)^2.5) × S曲线
  # S 曲线系数：progress=0 → 1.5×；progress=0.5 → 1.7×；progress=1 → 1.9×
  #   难度系数表（无等级加成时）：
  #   D0   → gain系数 = 0.43（基础值）
  #   D30  → gain系数 = 0.43 − 0.35×0.3^2.5 = 0.43 − 0.0173 = 0.4127（低难度微降）
  #   D50  → gain系数 = 0.43 − 0.35×0.5^2.5 = 0.43 − 0.0619 = 0.3681
  #   D100 → gain系数 = 0.43 − 0.35×1.0^2.5 = 0.43 − 0.35  = 0.0800（高难度大幅缩减）
  #   等级完全抵消难度：L50D50 系数 = 0.43（与 L0D0 相同），L100D100 系数 = 0.43
  progress-gain:
    base-rate: 0.04
    formula: "global.base_rate * (0.43 + 0.35 * math.pow(global.level / 100, 2.5) - 0.35 * math.pow(global.difficulty / 100, 2.5)) * (1.5 + 0.4 * (0.5 - 0.5 * math.cos(global.progress * math.PI())))"
  # 进度下降曲线（鱼在绿条外时进度衰减）
  # 双因子模型：level 和 difficulty 用相同幂次（2.5）相互抵消。
  #   drain = base_rate × (1.0 − 0.5 × (level/100)^2.5 + 0.5 × (difficulty/100)^2.5) × U曲线
  #   U曲线 = 1 + 0.5×p + 0.2×(1−p)²，p = 实际进度
  #   难度系数表（无等级加成时）：
  #   D0   → drain系数 = 1.0（基础值）
  #   D30  → drain系数 = 1.0 + 0.5×0.3^2.5 = 1.0246（低难度微增）
  #   D100 → drain系数 = 1.0 + 0.5×1.0^2.5 = 1.50（高难度衰减加快）
  #   等级完全抵消难度：L50D50 系数 = 1.0，L100D100 系数 = 1.0
  # 设计意图：低进度 drain 小（起步宽容）→ 高进度 drain 大（收尾紧张）
  progress-drain:
    base-rate: 0.04
    formula: "global.base_rate * (1.0 - 0.5 * math.pow(global.level / 100, 2.5) + 0.5 * math.pow(global.difficulty / 100, 2.5)) * (1 + 0.5 * global.progress + 0.2 * (1 - global.progress) * (1 - global.progress))"

  # ─── 连续命中加成（streak：持续追踪鱼的奖励） ────────────────
  # 连续在绿条内每达到 streak-threshold ticks，gain 系数递增 streak-bonus-per-step。
  # 离开绿条则 streak 计数重置为 0。鼓励玩家持续追踪鱼，而非频繁脱靶。
  # 每 streak-threshold ticks 增加的 gain 系数（0.1 = +10% gain）。
  streak-threshold: 20
  streak-bonus-per-step: 0.1
  # streak 加成上限（0.5 = 最多 +50% gain），防止无限叠加。
  streak-max-bonus: 0.5

  # ─── 奖励 ────────────────────────────────────────────────
  # 钓起宝藏（treasures/ 目录定义）的基础概率（0.0 ~ 1.0），最终概率 = 此值 + 饵料加成 + 钓竿加成。
  treasure-chance: 0.15
  # 完美捕获（全程鱼未离开过绿条）时的货币奖励倍率。注意：经验完美加成固定 1.5x，不受此配置影响。
  perfect-bonus-multiplier: 1.5

  # ─── 等级修正（玩家钓鱼等级越高，小游戏越轻松） ────────────────
  # 钓鱼等级上限，用于将玩家等级归一化到 [0,1] 参与等级修正计算。与 season.max-level 独立。
  max-level: 100
  # 等级修正基础系数：满级时等级修正的最大值。例如 0.5 = 满级时 lvlMod = 0.5。
  # 以下各 scale 分别控制 lvlMod 对各参数的影响程度，默认 1.0 = 完全应用 lvlMod。
  # 设为 0.5 = 该参数只受一半 lvlMod 影响；设为 0 = 该参数不受等级影响。
  # 注意：progress 公式已内置 level/difficulty 抵消机制，此处各 scale 设极小值避免双重叠加。
  level-modifier-scale: 0.05
  # 鱼移动速度的等级修正系数：鱼速度 ×（1 - lvlMod × 此值）。满级时鱼速度最多减慢 level-modifier-scale × 此值。
  fish-speed-level-scale: 1.0
  # 逃离概率的等级修正系数：逃离概率 ×（1 - lvlMod × 此值）。满级时逃离概率最多降低 level-modifier-scale × 此值。
  flee-chance-level-scale: 1.0
  # 逃离速度的等级修正系数：逃离速度 ×（1 - lvlMod × 此值）。满级时逃离速度最多减慢 level-modifier-scale × 此值。
  flee-speed-level-scale: 1.0
  # 进度上升的等级修正系数：gain ×（1 + lvlMod × 此值）。满级时进度上升最多加快 level-modifier-scale × 此值。
  # 建议设较低值（如 0.3），避免高等级进度增长过快。
  # 注意：progress 公式已内置 level 因子，此处设极小值避免双重叠加。
  progress-gain-level-scale: 0.01
  # 进度下降的等级修正系数：drain ×（1 - lvlMod × 此值）。满级时进度下降最多减慢 level-modifier-scale × 此值。
  # 可独立于 gain-level-scale 调节，例如设 0.5 让高等级衰减明显减慢但增速只轻微加快。
  # 注意：progress 公式已内置 level 因子，此处设极小值避免双重叠加。
  progress-drain-level-scale: 0.01

  # ─── 驱赶机制（鱼在绿条内时偶尔迅速逃离，增加操作难度） ────────
  # 逃离触发条件：鱼在绿条内 + 到达检查时间 + 随机骰 < 逃离概率。
  # 逃离概率 = [flee-base-chance +（鱼难度/100）× flee-chance-per-difficulty] ×（1 - 等级修正×flee-chance-level-scale）×（1 - 天赋减免）。
  # 难度越高逃离越频繁；玩家等级越高逃离概率越低。
  flee-base-chance: 0.1
  flee-chance-per-difficulty: 0.1
  # 逃离速度 = [flee-base-speed +（鱼难度/100）× flee-speed-per-difficulty] ×（1 - 等级修正×flee-speed-level-scale）×（1 - 天赋减免）。
  # 难度越高逃离越快；玩家等级越高逃离速度越慢。
  flee-base-speed: 0.04
  flee-speed-per-difficulty: 0.03
  # 逃离持续 ticks 范围 [min, max)，触发后随机取一个持续时间。
  flee-min-duration: 15
  flee-max-duration: 35
  # 逃离检查间隔 ticks 范围 [min, max)：非逃离状态下，每隔这段随机时间检查一次是否触发逃离。
  flee-check-min-interval: 20
  flee-check-max-interval: 50
  # 逃离结束后冷却 ticks 范围 [min, max)：冷却期间不会再次触发逃离检查。
  flee-cooldown-min: 30
  flee-cooldown-max: 70

# ─── 赛季配置 ────────────────────────────────────────
# 定义当前钓鱼赛季的基本参数与经验成长曲线。
# 赛季结束时重置等级/经验/天赋点/奖励领取记录，永久数据（图鉴）保留。
season:
  season-id: "fishing-s1"
  display-name: "第一赛季"
  max-level: 100
  # 经验成长曲线：转折点断点列表，每项指定一个起始等级（level）与一个 ARIA 表达式（formula）。
  # 表达式以变量 global.level 为入参（绑定值注入到 ARIA global. 命名空间，需用 global. 前缀访问），
  # 计算结果即为"升到该等级所需经验值"（必须 ≥ 1）。
  # 系统按 level 升序选取最大的且不超过目标等级的断点公式求值。
  # 首个断点的 level 必须为 1；断点 level 必须严格递增。
  #
  # 当前曲线：线性 × S曲线增长因子模型
  #   xpForNextLevel = baseXp × level × (1 + a × smoothstep^k)
  #   smoothstep = (level/100)^2 × (3 - 2 × (level/100))   （内联展开，ARIA 无 smoothstep 内置函数）
  #   幂运算用 math.pow（ARIA 中 ^ 是位异或，不是幂）
  #   参数: baseXp=50, a=2, k=1.5
  #
  # 特征：前期近似线性（快速升级给正反馈），中后期 S曲线因子平滑加速（挑战感递增），
  #       全程无拐点突变。满级(100)累计约 187,500 xp。
  # 节奏（每次钓鱼约 5-15 xp，平均 10 xp/次，每小时约 60 次 = 600 xp/h）：
  #   Lv25 约 5 小时、Lv50 约 25 小时、Lv75 约 80 小时、Lv100 约 180 小时。
  # 天赋点（每3级1点）：满级共 33 点，可点亮 25 个树节点 + 8 个联动节点中的部分。
  xp-curve:
    - level: 1
      formula: "50 * global.level * (1 + 2.0 * math.pow(math.pow(global.level / 100, 2) * (3 - 2 * global.level / 100), 1.5))"
  start-date: "2026-01-01"
  end-date: "2030-12-31"

# ─── UI 注册 ────────────────────────────────────────
# 这些 UI 文件位于 arcartx/ui/ 目录，由模块在启动时注册到 ArcartX。
ui:
  # 是否在插件启用时自动注册本模块的 UI。
  register-ui-on-enable: true
  # 是否强制覆盖用户已修改的 UI 文件。
  overwrite-ui-files: false
  # 钓鱼小游戏 UI 的 ID。
  minigame-ui-id: "AXS:fishing_minigame"
  # 鱼类图鉴 UI 的 ID。
  collection-ui-id: "AXS:fishing_collection"
  # 天赋树 UI 的 ID。
  talents-ui-id: "AXS:fishing_talents"
  # 赛季等级奖励 UI 的 ID。
  rewards-ui-id: "AXS:fishing_rewards"
  # 任务列表 UI 的 ID。
  tasks-ui-id: "AXS:fishing_tasks"

# ─── 命令配置 ────────────────────────────────────────
commands:
  # 是否注册 /fishing 命令。
  enabled: true
  # 使用钓鱼命令所需的基础权限节点。
  base-permission: "axs.fishing.use"
