# AXS 资源说明
# 用途: Abyss 副本房间 —— 成员模型舞台 / 目标副本 / 消息流 / 邀请与副本选择副面板
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/hasParty/isLeader/partyName/myUuid/maxMembers
    #         memberRows{idx:{uuid,name,online,leader,ready}}/memberCount
    #         hasDungeon/dungeon{id,name,difficulty,iconJson,desc0,minPlayers,maxPlayers,timeLimit,staminaCost}
    #         feedRows{idx:{sender,text}}/feedCount
    #         applicantRows{idx:{uuid,name}}/applicantCount
    #         listed/joinMode/allReady
    #         allDungeonRows{idx:{id,name,difficulty}}/allDungeonCount
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      self.actions['apply'](packet)
      self.actions['refresh']()
    # packetHandler: update —— 队伍数据变更全量推送（无 action_token）
    update: |-
      self.actions['apply'](packet)
      self.actions['refresh']()
    # packetHandler: online_list —— 邀请副面板的在线玩家列表
    online_list: |-
      var.onlineRows = packet['onlineRows']
      var.onlineCount = packet['onlineCount']
      self.actions['refreshOnline']()
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.hasParty = false
      var.isLeader = false
      var.partyName = ''
      var.myUuid = ''
      var.maxMembers = 4
      var.memberRows = {}
      var.memberCount = 0
      var.hasDungeon = false
      var.dungeon = {}
      var.feedRows = {}
      var.feedCount = 0
      var.applicantRows = {}
      var.applicantCount = 0
      var.listed = false
      var.joinMode = 'APPLY'
      var.allReady = false
      var.myReady = false
      var.allDungeonRows = {}
      var.allDungeonCount = 0
      var.onlineRows = {}
      var.onlineCount = 0
      var.invitePanel = false
      var.dungeonPanel = false
      var.inviteName = ''
      var.chatMsg = ''
      var.成员轮次 = 0
      var.成员引用 = {}
      var.消息轮次 = 0
      var.消息引用 = {}
      var.申请轮次 = 0
      var.申请引用 = {}
      var.在线轮次 = 0
      var.在线引用 = {}
      var.副本轮次 = 0
      var.副本引用 = {}
      var.accent = '212,153,69,255'
      var.accentDim = '113,93,67,215'
      var.accentHover = '241,185,94,255'
      var.cardBg = '30,34,34,255'
      var.cardBgHover = '48,49,44,255'
      var.green = '132,173,118,255'
      var.air = '{"id":"minecraft:air","Count":1b}'
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.leftW = var.viewW * 0.61
      var.rightX = var.leftW + 24
      var.rightW = var.viewW - var.rightX - 72
    open: |-
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
    # 统一读取房间数据（init/update 共用）
    apply: |-
      var.hasParty = packet['hasParty']
      var.isLeader = packet['isLeader']
      var.partyName = packet['partyName']
      var.myUuid = packet['myUuid']
      var.maxMembers = packet['maxMembers']
      var.memberRows = packet['memberRows']
      var.memberCount = packet['memberCount']
      var.hasDungeon = packet['hasDungeon']
      var.dungeon = packet['dungeon']
      var.feedRows = packet['feedRows']
      var.feedCount = packet['feedCount']
      var.applicantRows = packet['applicantRows']
      var.applicantCount = packet['applicantCount']
      var.listed = packet['listed']
      var.joinMode = packet['joinMode']
      var.allReady = packet['allReady']
      var.myReady = packet['myReady']
      var.allDungeonRows = packet['allDungeonRows']
      var.allDungeonCount = packet['allDungeonCount']
    # 重建成员卡片 + 消息流 + 申请列表
    refresh: |-
      目标数 = var.hasParty ? var.memberCount.round() : 0
      if(val.member_row.childrenCount() - 1 != 目标数 - 1){
        for(key in var.成员引用.keys()){
          var.成员引用[key].remove()
        }
        var.成员引用 = {}
        var.成员轮次 = (var.成员轮次 + 1).round()
        模板 = val.member_row.get(0)
        模板.entryKey = 0.round()
        if(目标数 > 1){
          for(i in range(1, 目标数 - 1)){
            r = 模板.copy('成员卡_' + var.成员轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.成员引用[i.round()] = r
          }
        }
      }
      消息数 = var.hasParty ? var.feedCount.round() : 0
      if(val.feed_rows.childrenCount() - 1 != 消息数 - 1){
        for(key in var.消息引用.keys()){
          var.消息引用[key].remove()
        }
        var.消息引用 = {}
        var.消息轮次 = (var.消息轮次 + 1).round()
        模板2 = val.feed_rows.get(0)
        模板2.entryKey = 0.round()
        if(消息数 > 1){
          for(i in range(1, 消息数 - 1)){
            r = 模板2.copy('消息行_' + var.消息轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.消息引用[i.round()] = r
          }
        }
      }
      val.feed_slider.setDragYRatio(1)
      申请数 = var.hasParty && var.isLeader ? var.applicantCount.round() : 0
      if(val.apply_rows.childrenCount() - 1 != 申请数 - 1){
        for(key in var.申请引用.keys()){
          var.申请引用[key].remove()
        }
        var.申请引用 = {}
        var.申请轮次 = (var.申请轮次 + 1).round()
        模板3 = val.apply_rows.get(0)
        模板3.entryKey = 0.round()
        if(申请数 > 1){
          for(i in range(1, 申请数 - 1)){
            r = 模板3.copy('申请行_' + var.申请轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.申请引用[i.round()] = r
          }
        }
      }
      副本数 = var.allDungeonCount.round()
      if(val.dungeon_rows.childrenCount() - 1 != 副本数 - 1){
        for(key in var.副本引用.keys()){
          var.副本引用[key].remove()
        }
        var.副本引用 = {}
        var.副本轮次 = (var.副本轮次 + 1).round()
        模板4 = val.dungeon_rows.get(0)
        模板4.entryKey = 0.round()
        if(副本数 > 1){
          for(i in range(1, 副本数 - 1)){
            r = 模板4.copy('副本行_' + var.副本轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.副本引用[i.round()] = r
          }
        }
      }
      // 目标副本图标：seticon 不随 var 自动重算，数据刷新后手动触发
      val.副本图标.seticon()
    # 在线玩家列表重建（邀请副面板）
    refreshOnline: |-
      在线数 = var.onlineCount.round()
      if(val.online_rows.childrenCount() - 1 != 在线数 - 1){
        for(key in var.在线引用.keys()){
          var.在线引用[key].remove()
        }
        var.在线引用 = {}
        var.在线轮次 = (var.在线轮次 + 1).round()
        模板 = val.online_rows.get(0)
        模板.entryKey = 0.round()
        if(在线数 > 1){
          for(i in range(1, 在线数 - 1)){
            r = 模板.copy('在线行_' + var.在线轮次 + '_' + i.round())
            r.entryKey = i.round()
            var.在线引用[i.round()] = r
          }
        }
      }
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      全屏画布:
        type: Canvas
        attribute:
          x: "-var.offX"
          width: "var.viewW"
          height: "var.viewH"
        children:
          场景磨砂:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:20;14,17,18,245
          黑曜石台面:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~14,17,18,255
            effect:
              gradient:
                color1: ~34,36,34,255
                color2: ~12,15,16,255
                type: 0
                angleDeg: 65
          制图基线:
            type: Texture
            attribute:
              x: 72
              y: 216
              width: "var.viewW - 144"
              height: 2
              normal: ~113,89,59,230
              through: true
          # ── 页眉 ──
          页眉标线:
            type: Texture
            attribute:
              x: 76
              y: 56
              width: 28
              height: 3
              normal: var.accent
              through: true
          品牌标记:
            type: Text
            attribute:
              x: 120
              y: 46
              texts: ~&6ABYSS  /  OPERATIONS TABLE   •   02
              fontSize: 36
              alpha: 0.78
              through: true
          标题:
            type: Text
            attribute:
              x: 72
              y: 104
              texts: ~&f远征整备室
              fontSize: 81
              through: true
          副标题:
            type: Text
            attribute:
              x: 76
              y: 176
              texts: "'&7' + var.partyName + '  ·  ' + var.memberCount.round() + '/' + var.maxMembers.round() + ' 人' + (var.allReady ? '  ·  &a全员就绪' : '')"
              fontSize: 36
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -76
              y: 52
              width: 48
              height: 48
            action:
              clickLeft: "Screen.close()"
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~150,58,58,235
                  hover: ~190,75,75,245
                  shape: ~circle
                  through: true
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f✕
                  fontSize: 36
                  through: true
          # ── 左中：成员模型舞台 ──
          舞台底:
            type: Texture
            attribute:
              x: 56
              y: 230
              width: "var.leftW - 96"
              height: "var.viewH - 400"
              normal: ~18,23,24,255
              through: true
            effect:
              gradient:
                color1: ~35,41,39,255
                color2: ~17,22,23,255
                type: 0
                angleDeg: 90
              stroke:
                width: 2
                color: var.accentDim
          舞台标线:
            type: Texture
            attribute:
              x: 88
              y: 262
              width: 22
              height: 3
              normal: var.accent
              through: true
          舞台标题:
            type: Text
            attribute:
              x: 88
              y: 274
              texts: ~&601  /  编队点名
              fontSize: 36
              through: true
          成员滑轨:
            type: Texture
            attribute:
              x: 88
              y: 780
              width: "var.leftW - 156"
              height: 6
              normal: ~63,65,58,255
              through: true
          成员滑块:
            type: Texture
            val: member_slider
            attribute:
              x: 88
              y: 780
              width: 150
              height: 6
              maxDragX: "var.leftW - 306"
              normal: var.accent
          成员滚动区:
            type: Scroll
            attribute:
              x: 88
              y: 338
              width: "var.leftW - 156"
              height: 420
              moveX: val.member_slider.getDragXRatio()
            action:
              wheel: |-
                ratio = self.moveX - self.wheelValue * 0.12
                if(ratio < 0){ ratio = 0 }
                if(ratio > 1){ ratio = 1 }
                val.member_slider.setDragXRatio(ratio)
            children:
              成员模型行:
                type: HStack
                val: member_row
                attribute:
                  height: 404
                  spaceBetween: 22
                children:
                  成员卡:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.memberRows[self.entryKey]
                      visible: self.entry != none
                      width: 230
                      height: 404
                    children:
                      卡底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~30,36,36,255
                          through: true
                        effect:
                          stroke:
                            width: 2
                            color: "self.parent.entry['leader'] ? var.accent : '80,88,81,200'"
                      岗位编号:
                        type: Text
                        attribute:
                          x: 14
                          y: 10
                          texts: "'&6' + (self.parent.entryKey + 1).round() + ' / CREW'"
                          fontSize: 36
                          through: true
                      成员模型:
                        type: Entity
                        attribute:
                          point: ~top_center
                          x: 0
                          y: 58
                          scale: 3.2
                          uuid: self.parent.entry['uuid']
                          hideTag: true
                          followMouse: true
                      离线遮罩:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~10,13,14,160
                          visible: "!self.parent.entry['online']"
                          through: true
                      队长冠标:
                        type: Text
                        attribute:
                          point: ~top_center
                          y: 274
                          texts: ~&6LEADER / 领队
                          fontSize: 36
                          visible: self.parent.entry['leader']
                          through: true
                      成员名:
                        type: Text
                        attribute:
                          point: ~bottom_center
                          y: -60
                          texts: "'&f' + self.parent.entry['name']"
                          fontSize: 36
                          limit: 12
                          through: true
                      准备状态:
                        type: Text
                        attribute:
                          point: ~bottom_center
                          y: -18
                          texts: "self.parent.entry['ready'] ? '&a已准备' : '&7待准备'"
                          fontSize: 36
                          visible: "self.parent.entry['online'] && !self.parent.entry['leader']"
                          through: true
                      离线状态:
                        type: Text
                        attribute:
                          point: ~bottom_center
                          y: -18
                          texts: ~&c离线 / 无信号
                          fontSize: 36
                          visible: "!self.parent.entry['online']"
                          through: true
                      踢出按钮:
                        type: Canvas
                        attribute:
                          point: ~top_right
                          x: -10
                          y: 10
                          width: 52
                          height: 34
                          visible: "var.isLeader && !self.parent.entry['leader']"
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'party_kick', self.parent.entry['uuid'], var.actionToken)
                        children:
                          踢底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~138,55,40,255
                              hover: ~187,72,46,255
                              through: true
                          踢字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: ~&f踢
                              fontSize: 36
                              through: true
          编队提示:
            type: Text
            attribute:
              x: 88
              y: 802
              texts: ~&8编队席位  /  滚轮或拖动琥珀刻度浏览人员
              fontSize: 36
              through: true
          舞台提示:
            type: Text
            attribute:
              x: 88
              y: "var.viewH - 230"
              texts: ~&7编队未满：点击下方「邀请玩家」补充队员
              fontSize: 36
              visible: "var.memberCount.round() <= 1"
              through: true
          # 示意路线是整备流程，不冒充服务端地牢坐标。
          远征流程图:
            type: Canvas
            attribute:
              x: 88
              y: "var.viewH - 250"
              width: "var.leftW - 156"
              height: 70
              visible: var.memberCount.round() > 1
              through: true
            children:
              路线:
                type: Texture
                attribute:
                  x: 8
                  y: 14
                  width: "var.leftW - 180"
                  height: 2
                  normal: ~101,83,58,255
                  through: true
              集结点:
                type: Texture
                attribute:
                  x: 8
                  y: 8
                  width: 14
                  height: 14
                  normal: var.accent
                  shape: ~circle
                  through: true
              目标点:
                type: Texture
                attribute:
                  x: "(var.leftW - 156) / 2"
                  y: 8
                  width: 14
                  height: 14
                  normal: "var.hasDungeon ? var.accent : '87,94,86,255'"
                  shape: ~circle
                  through: true
              执行点:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -10
                  y: 8
                  width: 14
                  height: 14
                  normal: "var.allReady ? var.accent : '147,59,43,255'"
                  shape: ~circle
                  through: true
              集结标签:
                type: Text
                attribute:
                  x: 8
                  y: 32
                  texts: ~&6编队已集结
                  fontSize: 36
                  through: true
              目标标签:
                type: Text
                attribute:
                  point: ~top_center
                  y: 32
                  texts: "var.hasDungeon ? '&6路线已确定' : '&7等待目标'"
                  fontSize: 36
                  through: true
              执行标签:
                type: Text
                attribute:
                  point: ~top_right
                  x: -10
                  y: 32
                  texts: "var.allReady ? '&6全员就绪' : '&c等待准备'"
                  fontSize: 36
                  through: true
          # ── 右栏 ──
          副本卡底:
            type: Texture
            attribute:
              x: "var.rightX"
              y: 230
              width: "var.rightW"
              height: 300
              normal: ~23,27,28,245
              shape: ~round_rect
              radius: 4
              through: true
            effect:
              stroke:
                width: 2
                color: var.accentDim
          副本卡标线:
            type: Texture
            attribute:
              x: "var.rightX + 26"
              y: 258
              width: 22
              height: 3
              normal: var.accent
              through: true
          副本卡标题:
            type: Text
            attribute:
              x: "var.rightX + 26"
              y: 270
              texts: ~&f02  /  目标情报
              fontSize: 36
              through: true
          副本图标:
            type: Slot
            val: 副本图标
            attribute:
              x: "var.rightX + 26"
              y: 316
              width: 72
              height: 72
              iconSize: 56
              slotType: ~Icon
              normal: var.cardBg
              seticon: |-
                iconJson = (var.hasDungeon && var.dungeon != none && var.dungeon['iconJson'] != none && var.dungeon['iconJson'] != '') ? var.dungeon['iconJson'] : var.air
                self.setItemIcon(iconJson)
              seticonscale: 1.0
              visible: var.hasDungeon
          副本名:
            type: Text
            attribute:
              x: "var.rightX + 116"
              y: 312
              texts: "var.hasDungeon ? '&f' + var.dungeon['name'] : '&8尚未选择'"
              fontSize: 48
              limit: 12
              through: true
          副本信息行:
            type: Text
            attribute:
              x: "var.rightX + 116"
              y: 366
              texts:
                - "var.hasDungeon ? '&7危险等级 &6' + var.dungeon['difficulty'] + '  &7编队 &f' + var.dungeon['minPlayers'].round() + '-' + var.dungeon['maxPlayers'].round() : '&7队长点击「更换副本」'"
                - "var.hasDungeon ? '&7体力消耗 &f' + var.dungeon['staminaCost'].round() + '   &7时限 &6' + var.dungeon['timeLimit'].round() + 's' : '&7选择目标后检查编队条件'"
              fontSize: 36
              visible: "var.hasDungeon || var.isLeader"
              through: true
          副本信息行2:
            type: Text
            attribute:
              x: "var.rightX + 26"
              y: 440
              texts: "var.hasDungeon ? '&7' + var.dungeon['desc0'] : '&7等待队长选择目标副本'"
              fontSize: 36
              limit: 32
              visible: "var.hasDungeon || !var.isLeader"
              through: true
          更换副本按钮:
            type: Canvas
            attribute:
              x: "var.rightX + 26"
              y: 480
              width: 160
              height: 36
              visible: var.isLeader
            action:
              clickLeft: |-
                var.dungeonPanel = true
                var.invitePanel = false
            children:
              更换底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: var.cardBg
                  hover: var.cardBgHover
                  shape: ~round_rect
                  radius: 4
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: var.accentDim
              更换字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f更换副本
                  fontSize: 36
                  through: true
          # ── 右下：消息流 + 队聊 ──
          消息底:
            type: Texture
            attribute:
              x: "var.rightX"
              y: 546
              width: "var.rightW"
              height: "var.viewH - 642"
              normal: ~23,27,28,245
              shape: ~round_rect
              radius: 4
              through: true
            effect:
              stroke:
                width: 2
                color: var.accentDim
          消息标线:
            type: Texture
            attribute:
              x: "var.rightX + 26"
              y: 574
              width: 22
              height: 3
              normal: var.accent
              through: true
          消息标题:
            type: Text
            attribute:
              x: "var.rightX + 26"
              y: 586
              texts: ~&f03  /  无线电频道
              fontSize: 36
              through: true
          消息滑轨:
            type: Texture
            attribute:
              x: "var.rightX + var.rightW - 20"
              y: "var.isLeader && var.applicantCount.round() > 0 ? 790 : 636"
              width: 8
              height: "var.viewH - (var.isLeader && var.applicantCount.round() > 0 ? 944 : 790)"
              normal: ~54,56,50,255
              shape: ~round_rect
              radius: 4
              through: true
          消息滑块:
            type: Texture
            val: feed_slider
            attribute:
              x: "var.rightX + var.rightW - 20"
              y: "var.isLeader && var.applicantCount.round() > 0 ? 790 : 636"
              width: 8
              height: 60
              normal: var.accent
