                  clickLeft: |-
                    if(var.ownerType == 'shared'){
                      Packet.send(var.packetId, 'shared_rename', var.ownerId, var.renameName, var.actionToken)
                    }else{
                      Packet.send(var.packetId, 'personal_rename', var.warehouseId, var.renameName, var.actionToken)
                    }
                children:
