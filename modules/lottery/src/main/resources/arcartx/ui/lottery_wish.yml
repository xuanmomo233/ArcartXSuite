                  hover: ~255,238,196,255
                  shape: ~round_rect
                  radius: 26
              再抽一次文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&0再抽一次"
                  fontSize: 36
                  through: true

      # ════════════════════════════════════════════════════════════
      # 十连结果层: batch_result 包到达后展示，5 列两行
      # ════════════════════════════════════════════════════════════
      十连结果层:
        type: Canvas
        val: 十连结果层
        attribute:
          point: ~stretch_all
          visible: false
        children:
          十连结果底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,14,24,228
          十连标题:
            type: Text
            attribute:
              point: ~top_center
              y: 70
              texts: "'&6本次共获得 ' + var.resultCount.round() + ' 件物品"
              fontSize: 54
              through: true
          十连保底提示:
            type: Text
            attribute:
              point: ~top_center
              y: 120
              texts: "var.guaranteed == true ? '&6本次触发保底' : (var.fatePointTriggered == true ? '&6本次触发命运点' : '')"
              fontSize: 36
              through: true
          十连网格:
            type: HGrid
            val: 十连网格
            attribute:
              point: ~middle_center
              y: -10
              column: 5
              spaceBetweenX: 26
              spaceBetweenY: 28
            action:
              create: |-
                for(i in range(1, 10)){
                  key = i.round()
                  e = self['十连卡片'].copy('十连卡片' + key)
                  e.entryKey = key
                  e['卡片底'].entryKey = key
                  e['星级条'].entryKey = key
                  e['物品槽'].entryKey = key
                  e['物品名'].entryKey = key
                  e['星级文本'].entryKey = key
                  e['UP标记'].entryKey = key
                }
            children:
              十连卡片:
                type: Canvas
                attribute:
                  entryKey: 0.round()
                  width: 240
                  height: 300
                  visible: "var.resultItemJsons != none && var.resultItemJsons[self.entryKey] != none && var.resultItemJsons[self.entryKey] != ''"
                children:
                  卡片底:
                    type: Texture
                    attribute:
                      entryKey: 0.round()
                      point: ~stretch_all
                      normal: ~26,30,44,244
                      shape: ~round_rect
                      radius: 8
                    effect:
                      gradient:
                        color1: ~38,46,72,255
                        color2: ~30,40,64,255
                        type: 0
                        angleDeg: 90
                      stroke:
                        width: 2
                        color: "{var.starColors[var.resultItemStars[self.entryKey]] != none ? var.starColors[var.resultItemStars[self.entryKey]] : '128,128,128,255'}"
                  星级条:
                    type: Texture
                    attribute:
                      entryKey: 0.round()
                      point: ~horizontal_stretch_top
                      height: 6
                      normal: "{var.starColors[var.resultItemStars[self.entryKey]] != none ? var.starColors[var.resultItemStars[self.entryKey]] : '128,128,128,255'}"
                      shape: ~round_rect
                      radius: 4
                      through: true
                  物品槽:
                    type: Slot
                    attribute:
                      entryKey: 0.round()
                      point: ~top_center
                      y: 32
                      slotType: ~Icon
                      width: 140
                      height: 140
                      normal: ~0,0,0,0
                      through: true
                      seticon: "self.setItemIcon(var.resultItemJsons[self.entryKey])"
                  物品名:
                    type: Text
                    attribute:
                      entryKey: 0.round()
                      point: ~bottom_center
                      y: -74
                      texts: "var.resultItemNames[self.entryKey] != none ? '&f' + var.resultItemNames[self.entryKey] : ''"
                      fontSize: 36
                      through: true
                  星级文本:
                    type: Text
                    attribute:
                      entryKey: 0.round()
                      point: ~bottom_center
                      y: -40
                      texts: "var.resultItemStars[self.entryKey] != none ? '&6' + var.resultItemStars[self.entryKey].round() + ' 星' : ''"
                      fontSize: 36
                      through: true
                  UP标记:
                    type: Text
                    attribute:
                      entryKey: 0.round()
                      point: ~bottom_center
                      y: -10
                      texts: "~&6UP"
                      fontSize: 36
                      through: true
                      visible: "var.resultItemUps[self.entryKey] == true"
          十连继续按钮:
            type: Canvas
            attribute:
              point: ~bottom_center
              x: -120
              y: -60
              width: 200
              height: 64
            action:
              click: |-
                val.十连结果层.visible = false
                val.主面板.visible = true
            children:
              十连继续背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~40,48,74,240
                  hover: ~62,78,120,245
                  shape: ~round_rect
                  radius: 26
                effect:
                  stroke:
                    width: 2
                    color: ~226,196,132,235
              十连继续文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f继续"
                  fontSize: 36
                  through: true
          十连再抽按钮:
            type: Canvas
            attribute:
              point: ~bottom_center
              x: 120
              y: -60
              width: 200
              height: 64
              enable: "!var.actionBusy && var.actionToken != '' && var.tenAvailable != false"
            action:
              click: |-
                if(var.pulling != true){
                  if(var.canPullTen){
                    var.pulling = true
                    var.resultPending = false
                    val.十连结果层.visible = false
                    val.等待层.visible = true
                    var.actionBusy = true
                    Packet.send(var.packetId, 'pull', '10', var.actionToken)
                  } else {
                    val.资源不足提示.visible = true
                  }
                }
            children:
              十连再抽背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~255,226,158,255
                  hover: ~255,238,196,255
                  shape: ~round_rect
                  radius: 26
              十连再抽文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&0再抽十连"
                  fontSize: 36
                  through: true

      # ════════════════════════════════════════════════════════════
      # 历史面板: history 包的祈愿记录（模态弹层）
      # ════════════════════════════════════════════════════════════
      历史面板:
        type: Canvas
        val: 历史面板
        attribute:
          point: ~stretch_all
          visible: false
        children:
          历史遮罩:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,14,24,200
          历史弹窗:
            type: Canvas
            attribute:
              point: ~middle_center
              width: 960
              height: 720
            children:
              面板背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~26,30,44,244
                  shape: ~round_rect
                  radius: 12
                effect:
                  gradient:
                    color1: ~38,46,72,255
                    color2: ~30,40,64,255
                    type: 0
                    angleDeg: 90
                  stroke:
                    width: 2
                    color: ~226,196,132,220
              面板标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 20
                  texts: "'&f祈愿记录 · ' + var.historyPoolName"
                  fontSize: 54
                  through: true
              记录条数:
                type: Text
                attribute:
                  point: ~top_left
                  x: 24
                  y: 66
                  texts: "'&7共 ' + var.historyCount.round() + ' 条记录'"
                  fontSize: 36
                  through: true
              历史滑块:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -16
                  y: 110
                  width: 10
                  height: 60
                  normal: ~255,226,158,255
                  maxDragY: 520 - 60
                  dragY: 0
                  shape: ~round_rect
                  radius: 4
              历史视口:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 24
                  y: 110
                  width: 880
                  height: 520
                  moveY: self.parent['历史滑块'].getDragYRatio()
                  through: false
                action:
                  wheel: |-
                    if(self.moveY >= 0){
                      if(self.wheelValue > 0){
                        self.parent['历史滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                      }
                    }
                    if(self.moveY <= 1){
                      if(self.wheelValue < 0){
                        self.parent['历史滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                      }
                    }
                children:
                  历史列表:
                    type: VGrid
                    val: 历史列表
                    attribute:
                      row: 100
                      spaceBetweenY: 12
                    children:
                      历史行:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          width: 860
                          height: 66
                          visible: "var.historyRows[self.entryKey] != none"
                        children:
                          行背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~22,28,44,240
                              shape: ~round_rect
                              radius: 6
