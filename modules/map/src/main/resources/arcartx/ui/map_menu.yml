# AXS 资源说明
# 用途: Map 模块默认全屏地图 GUI。
# 前置依赖: ArcartX + Arcart-Suite-Map 客户端 mod；Map 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.map.enabled + modules.map.password
# 关联文件: ArcartXMap.yml、ui/map_hud.yml
# 重载命令: /axs map reload
#
# 大地图渲染由 Arcart-Suite-Map 客户端 mod 完全接管：
#   - UI 的 tick 每帧调用 mapRenderer.setRegion() 传地图渲染区屏幕坐标
#   - mod 在 Screen.render RETURN 往该区域渲染地形、玩家箭头、标记点
#   - mod 内部处理滚轮缩放、拖拽平移、锚点点击

ui:
  isHud: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.selectedWorldId = packet['selectedWorldId']
      var.selectedWorldName = packet['selectedWorldName']
      var.playerWorldId = packet['playerWorldId']
      var.litEnabled = packet['litEnabled']
      var.litRegions = packet['litRegions']
      var.worldRows = packet['worldRows']
      var.anchorRows = packet['anchorRows']
      var.waypointRows = packet['waypointRows']
      var.externalTargetRows = packet['externalTargetRows']
      var.waypointLimit = packet['waypointLimit']
      var.waypointCount = packet['waypointCount']
      var.canCreateWaypoint = packet['canCreateWaypoint']
      var.clearTrackVisible = packet['clearTrackVisible']
      var.trackingText = packet['trackingText']
      var.detailSelectedType = packet['detailSelectedType']
      var.detailSelectedId = packet['detailSelectedId']
      var.detailTitle = packet['detailTitle']
      var.detailDescription = packet['detailDescription']
      var.detailUnlocked = packet['detailUnlocked']
      var.detailUnlockCostText = packet['detailUnlockCostText']
      var.detailTeleportCostText = packet['detailTeleportCostText']
      var.detailExternalTarget = packet['detailExternalTarget']
      var.detailCanUnlock = packet['detailCanUnlock']
      var.detailCanTeleport = packet['detailCanTeleport']
      var.detailCanTrackAnchor = packet['detailCanTrackAnchor']
      var.detailCanTrackWaypoint = packet['detailCanTrackWaypoint']
      var.detailCanTrackExternal = packet['detailCanTrackExternal']
      var.detailCanDeleteWaypoint = packet['detailCanDeleteWaypoint']
      var.detailCanCreateWaypoint = packet['detailCanCreateWaypoint']
      var.detailClearTrackVisible = packet['detailClearTrackVisible']
      var.detailTrackingText = packet['detailTrackingText']
      var.maxWorldCount = packet['maxWorldCount']
      var.maxAnchorCount = packet['maxAnchorCount']
      var.maxWaypointCount = packet['maxWaypointCount']
      var.maxExternalCount = packet['maxExternalCount']
      var.actionToken = packet['action_token']
      var.crossWorldPromptVisible = false
      var.worldTpl = val.world_entry['地图项目']
      if(var.worldTpl != none) {
        while(val.world_entry.childrenCount() > 1){
          val.world_entry.get(1).remove()
        }
        for(i in range(1, var.maxWorldCount - 1)){
          var.key = i.round()
          var.entry = var.worldTpl.copy('地图项目' + var.key)
          var.entry.entryKey = var.key
        }
      }
      var.actionBusy = false
      var.actionBusySeconds = 0
      if(var.mapRenderer != none) {
        var.mapRenderer.clearMarkers()
        if(var.anchorRows != none) {
          for(key in var.anchorRows.keys()) {
            row = var.anchorRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'anchor', row['displayName'], row['x'], row['z'], row['selected'], row['tracked'], row['unlocked'])
            }
          }
        }
        if(var.waypointRows != none) {
          for(key in var.waypointRows.keys()) {
            row = var.waypointRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'waypoint', row['name'], row['x'], row['z'], row['selected'], row['tracked'], true)
            }
          }
        }
        if(var.externalTargetRows != none) {
          for(key in var.externalTargetRows.keys()) {
            row = var.externalTargetRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'external', row['name'], row['x'], row['z'], row['selected'], row['tracked'], true)
            }
          }
        }
      }
      call_syncWorldDims()
    update: |-
      var.packetId = packet['packetId']
      var.selectedWorldId = packet['selectedWorldId']
      var.selectedWorldName = packet['selectedWorldName']
      var.playerWorldId = packet['playerWorldId']
      var.litEnabled = packet['litEnabled']
      var.litRegions = packet['litRegions']
      var.worldRows = packet['worldRows']
      var.anchorRows = packet['anchorRows']
      var.waypointRows = packet['waypointRows']
      var.externalTargetRows = packet['externalTargetRows']
      var.waypointLimit = packet['waypointLimit']
      var.waypointCount = packet['waypointCount']
      var.canCreateWaypoint = packet['canCreateWaypoint']
      var.clearTrackVisible = packet['clearTrackVisible']
      var.trackingText = packet['trackingText']
      var.detailSelectedType = packet['detailSelectedType']
      var.detailSelectedId = packet['detailSelectedId']
      var.detailTitle = packet['detailTitle']
      var.detailDescription = packet['detailDescription']
      var.detailUnlocked = packet['detailUnlocked']
      var.detailUnlockCostText = packet['detailUnlockCostText']
      var.detailTeleportCostText = packet['detailTeleportCostText']
      var.detailExternalTarget = packet['detailExternalTarget']
      var.detailCanUnlock = packet['detailCanUnlock']
      var.detailCanTeleport = packet['detailCanTeleport']
      var.detailCanTrackAnchor = packet['detailCanTrackAnchor']
      var.detailCanTrackWaypoint = packet['detailCanTrackWaypoint']
      var.detailCanTrackExternal = packet['detailCanTrackExternal']
      var.detailCanDeleteWaypoint = packet['detailCanDeleteWaypoint']
      var.detailCanCreateWaypoint = packet['detailCanCreateWaypoint']
      var.detailClearTrackVisible = packet['detailClearTrackVisible']
      var.detailTrackingText = packet['detailTrackingText']
      var.maxWorldCount = packet['maxWorldCount']
      var.maxAnchorCount = packet['maxAnchorCount']
      var.maxWaypointCount = packet['maxWaypointCount']
      var.maxExternalCount = packet['maxExternalCount']
      var.actionToken = packet['action_token']
      var.worldTpl = val.world_entry['地图项目']
      if(var.worldTpl != none) {
        while(val.world_entry.childrenCount() > 1){
          val.world_entry.get(1).remove()
        }
        for(i in range(1, var.maxWorldCount - 1)){
          var.key = i.round()
          var.entry = var.worldTpl.copy('地图项目' + var.key)
          var.entry.entryKey = var.key
        }
      }
      var.actionBusy = false
      if(var.mapRenderer != none) {
        var.mapRenderer.clearMarkers()
        if(var.anchorRows != none) {
          for(key in var.anchorRows.keys()) {
            row = var.anchorRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'anchor', row['displayName'], row['x'], row['z'], row['selected'], row['tracked'], row['unlocked'])
            }
          }
        }
        if(var.waypointRows != none) {
          for(key in var.waypointRows.keys()) {
            row = var.waypointRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'waypoint', row['name'], row['x'], row['z'], row['selected'], row['tracked'], true)
            }
          }
        }
        if(var.externalTargetRows != none) {
          for(key in var.externalTargetRows.keys()) {
            row = var.externalTargetRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'external', row['name'], row['x'], row['z'], row['selected'], row['tracked'], true)
            }
          }
        }
      }
      call_syncWorldDims()
  action:
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      var.scale = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / var.scale
      var.viewH = Screen.getHeight() / var.scale
      var.offX = (var.viewW - 1920) / 2
      var.mapRenderer = none
      var.showHudSettings = false
      try {
        var.mapRenderer = axsmap.getMapRenderer()
      } catch(e) {
      }
      // 世界ID→MC维度映射下发给 mod（服务端 packet 的 worldRows[].dimension），
      // mod 用它把"选中世界"匹配到对应维度的地形缓存桶
      var.syncWorldDims = -> {
        if(var.mapRenderer == none) { return }
        if(var.worldRows != none) {
          for(key in var.worldRows.keys()) {
            row = var.worldRows[key]
            if(row != none) {
              dim = row['dimension']
              var.mapRenderer.setWorldDimension('' + row['id'], dim == none ? '' : '' + dim)
            }
          }
        }
        // 点亮区域：litEnabled=false → 传 none（全亮不遮罩）；true → 传已解锁区域并集
        var.mapRenderer.setLitRegions('' + var.selectedWorldId,
          var.litEnabled == true ? var.litRegions : none)
      }
      var.call_syncWorldDims = -> {
        if(var.syncWorldDims != none) { var.syncWorldDims() }
      }
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      var.scale = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / var.scale
      var.viewH = Screen.getHeight() / var.scale
      var.offX = (var.viewW - 1920) / 2
    tick: |-
      if(var.mapRenderer != none) {
        // 大地图全屏渲染：渲染区 = 整个窗口
        sw = Screen.getWidth()
        sh = Screen.getHeight()
        var.mapRenderer.setRegion(0, 0, sw, sh, var.scale)
        // 可交互区排除 UI 覆盖区：
        //   顶栏 96px、底部 140px（世界槽位/复位按钮区）
        //   世界浮层展开 → 排除左侧 268px
        //   详情面板弹出 → 排除右侧 448px
        leftExcl = var.worldListOpen ? 268 : 0
        rightExcl = var.detailSelectedType != 'none' ? 448 : 0
        var.mapRenderer.setInteractRegion(leftExcl * var.scale, 96 * var.scale,
          (var.viewW - leftExcl - rightExcl) * var.scale, (var.viewH - 96 - 140) * var.scale)
        var.mapRenderer.setWorldId(var.selectedWorldId)
        // 地图标记点击命中（"type:id"）→ 发包选中目标，服务端回详情面板数据
        hit = var.mapRenderer.getHitMarker()
        if(hit != none && hit != '') {
          var.mapRenderer.clearHitMarker()
          parts = hit.split(':')
          if(parts.length >= 2) {
            if(parts[0] == 'anchor') {
              Packet.send(var.packetId, 'select_anchor', parts[1])
            }
            if(parts[0] == 'waypoint') {
              Packet.send(var.packetId, 'select_waypoint', parts[1])
            }
            if(parts[0] == 'external') {
              Packet.send(var.packetId, 'select_external', parts[1])
            }
          }
        }
      }
    open: |-
      var.packetId = 'AXS_MAP'
      var.selectedWorldId = none
      var.selectedWorldName = '未选择'
      var.worldRows = {}
      var.anchorRows = {}
      var.waypointRows = {}
      var.externalTargetRows = {}
      var.waypointLimit = 0
      var.waypointCount = 0
      var.canCreateWaypoint = false
      var.clearTrackVisible = false
      var.trackingText = '当前未导航'
      var.detailSelectedType = 'none'
      var.detailSelectedId = none
      var.detailTitle = '未选中目标'
      var.detailDescription = '请选择一个锚点或路径点。'
      var.detailUnlocked = true
      var.detailUnlockCostText = none
      var.detailTeleportCostText = none
      var.detailExternalTarget = false
      var.detailCanUnlock = false
      var.detailCanTeleport = false
      var.detailCanTrackAnchor = false
      var.detailCanTrackWaypoint = false
      var.detailCanTrackExternal = false
      var.detailCanDeleteWaypoint = false
      var.detailCanCreateWaypoint = false
      var.detailClearTrackVisible = false
      var.detailTrackingText = '当前未导航'
      var.maxWorldCount = 0
      var.maxAnchorCount = 0
      var.maxWaypointCount = 0
      var.maxExternalCount = 0
      var.actionToken = ''
      var.playerWorldId = ''
      var.crossWorldPromptVisible = false
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.showHudSettings = false
      var.worldListOpen = false
      // 打开菜单默认回到玩家当前位置：清掉上次残留的拖拽/缩放
      if(var.mapRenderer != none) {
        var.mapRenderer.resetView()
      }
    close: |-
      if(var.mapRenderer != none) {
        var.mapRenderer.deactivate()
      }
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          y: 0
          width: "var.viewW"
          height: "var.viewH"
        children:
          # ─── 顶栏 ───
          顶栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 0
              y: 0
              width: "var.viewW"
              height: 96
            children:
              顶栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "~Frosted:30;255,255,255,100"
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,40
              标题色块:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 36
                  width: 6
                  height: 44
                  normal: ~232,180,90,255
                  shape: ~round_rect
                  radius: 3
              地图菜单标题:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 60
                  texts: "'&f地图总览 &8/ &7' + var.selectedWorldName"
                  fontSize: 36
              追踪文字:
                type: Text
                attribute:
                  point: ~middle_center
                  x: -260
                  texts: "'&b' + var.trackingText"
                  fontSize: 32
              # ─── 小地图设置入口（展开悬浮设置面板） ───
              小地图按钮:
                type: Canvas
                attribute:
                  point: ~top_right
                  x: -340
                  y: 26
                  width: 108
                  height: 44
                  enable: "var.mapRenderer != none"
                action:
                  clickLeft: |-
                    var.showHudSettings = !var.showHudSettings
                children:
                  小地图按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.showHudSettings ? '74,144,226,255' : '52,56,64,255'"
                      hover: "var.showHudSettings ? '94,164,246,255' : '72,76,84,255'"
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  小地图按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.showHudSettings ? '&f小地图 &8▴' : '&f小地图 &8▾'"
                      fontSize: 30
                      through: true
              关闭按钮:
                type: Canvas
                attribute:
                  point: ~top_right
                  x: -68
                  y: 26
                  width: 44
                  height: 44
                action:
                  clickLeft: |-
                    Screen.close()
                children:
                  关闭按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~220,80,80,255
                      hover: ~240,100,100,255
                      shape: ~round_rect
                      radius: 12
                  关闭按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f✕
                      fontSize: 32
                      through: true
          # ─── 地图已全屏渲染（mod 在 UI 下层绘制），此处只留加载提示 ───
          地图加载提示:
            type: Text
            attribute:
              point: ~middle_center
              texts: ~&7地图加载中...
              fontSize: 36
              through: true
              visible: "var.mapRenderer == none"
          # ─── 详情面板（点地图标记弹出，原神式浮空卡片；未选中时隐藏）───
          详情面板:
            type: Canvas
            attribute:
              point: ~top_left
              x: "var.viewW - 448"
              y: "(var.viewH - 400) / 2"
              width: 420
              height: 400
              visible: "var.detailSelectedType != 'none'"
            children:
              详情面板底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "~Frosted:30;255,255,255,100"
                  shape: ~round_rect
                  radius: 20
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,50
              # 类型图标 + 标题
              详情类型图标:
                type: Text
                attribute:
                  point: ~top_center
                  y: 28
                  texts: "var.detailSelectedType == 'anchor' ? '&6◈' : (var.detailSelectedType == 'waypoint' ? '&a◆' : '&c◆')"
                  fontSize: 44
                  through: true
              详情标题:
                type: Text
                attribute:
                  point: ~top_center
                  y: 76
                  texts: "var.detailTitle"
                  fontSize: 38
              详情描述:
                type: Text
                attribute:
                  point: ~top_center
                  y: 124
                  texts: "var.detailDescription"
                  fontSize: 26
              解锁费用文字:
                type: Text
                attribute:
                  point: ~top_center
                  x: -105
                  y: 200
                  texts: "'&7解锁: &f' + var.detailUnlockCostText"
                  fontSize: 26
                  visible: "var.detailSelectedType == 'anchor'"
              传送费用文字:
                type: Text
                attribute:
                  point: ~top_center
                  x: 105
                  y: 200
                  texts: "'&7传送: &f' + var.detailTeleportCostText"
                  fontSize: 26
                  visible: "var.detailSelectedType == 'anchor'"
              # 底部按钮区：一行大按钮（主要操作），一行小按钮（次要操作）
              解锁按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 300
                  width: 110
                  height: 44
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    if (var.detailCanUnlock) {
                      var.actionBusy = true
                      Packet.send(var.packetId, 'unlock_anchor', var.detailSelectedId, var.actionToken)
                    }
                children:
                  解锁按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.detailCanUnlock ? '82,196,26,255' : '60,60,66,255'"
                      hover: "var.detailCanUnlock ? '102,216,46,255' : '60,60,66,255'"
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  解锁按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f解锁
                      fontSize: 32
                      through: true
              传送按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 146
                  y: 300
                  width: 110
                  height: 44
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    if (var.detailCanTeleport) {
                      var.actionBusy = true
                      Packet.send(var.packetId, 'teleport_anchor', var.detailSelectedId, var.actionToken)
                    }
                children:
                  传送按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.detailCanTeleport ? '74,144,226,255' : '60,60,66,255'"
                      hover: "var.detailCanTeleport ? '94,164,246,255' : '60,60,66,255'"
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  传送按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f传送
                      fontSize: 32
                      through: true
              追踪按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 268
                  y: 300
                  width: 110
                  height: 44
                action:
                  clickLeft: |-
                    var.isCrossWorld = var.playerWorldId != '' && var.selectedWorldId != var.playerWorldId
                    if (var.isCrossWorld) {
                      var.crossWorldPromptVisible = true
                    } else {
                      if (var.detailSelectedType == 'anchor' && var.detailCanTrackAnchor) {
                        Packet.send(var.packetId, 'track_anchor', var.detailSelectedId)
                      }
                      if (var.detailSelectedType == 'waypoint' && var.detailCanTrackWaypoint) {
                        Packet.send(var.packetId, 'track_waypoint', var.detailSelectedId)
                      }
                      if (var.detailSelectedType == 'external' && var.detailCanTrackExternal) {
                        Packet.send(var.packetId, 'track_external', var.detailSelectedId)
                      }
                    }
                children:
                  追踪按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "(var.detailCanTrackAnchor || var.detailCanTrackWaypoint || var.detailCanTrackExternal) ? '236,180,24,255' : '60,60,66,255'"
                      hover: "(var.detailCanTrackAnchor || var.detailCanTrackWaypoint || var.detailCanTrackExternal) ? '246,200,44,255' : '60,60,66,255'"
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  追踪按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f导航
                      fontSize: 32
                      through: true
              删除按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 356
                  width: 110
                  height: 32
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    if (var.detailCanDeleteWaypoint) {
                      var.actionBusy = true
                      Packet.send(var.packetId, 'delete_waypoint', var.detailSelectedId, var.actionToken)
                    }
                children:
                  删除按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.detailCanDeleteWaypoint ? '220,80,80,255' : '60,60,66,255'"
                      hover: "var.detailCanDeleteWaypoint ? '240,100,100,255' : '60,60,66,255'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  删除按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f删除
                      fontSize: 28
                      through: true
              创建按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 146
                  y: 356
                  width: 110
                  height: 32
                  enable: "!var.actionBusy && var.actionToken != ''"
                action:
                  clickLeft: |-
                    if (var.canCreateWaypoint) {
                      var.actionBusy = true
                      Packet.send(var.packetId, 'create_waypoint', var.actionToken)
                    }
                children:
