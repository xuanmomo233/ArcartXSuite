                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.detailNavigated ? '&f取消' : '&f导航'"
                      fontSize: 36
                      through: true
          # ─── 路径点详情面板（命名/修改描述/导航/删除/分享）───
          路径点详情面板:
            type: Canvas
