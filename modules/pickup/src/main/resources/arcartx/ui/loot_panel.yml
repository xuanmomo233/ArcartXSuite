controls:
  自适应布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
      through: true
    children:
      拾取面板:
        type: Canvas
        attribute:
          point: ~middle_center
          x: 240
          y: 0
          width: 440
          height: var.count * 42 + 124
          visible: "!var.menuOpen && (var.count > 0 || var.busy || var.now < var.resultUntil)"
          through: true
        children:
          操作提示:
            type: Text
            attribute:
              point: ~top_left
              x: 10
              y: 6
              fontSize: 20
              texts: "var.busy ? '&e收取中…' : ('&f[' + var.pickLabel + '] 收取当前类')"
              through: true
          清单位置:
            type: Text
            attribute:
              point: ~top_left
              x: 10
              y: var.count * 42 + 42
              fontSize: 20
              texts: "'&7第 ' + var.position.round() + ' / ' + var.totalCount.round() + ' 类'"
              through: true
          收取状态:
            type: Text
            attribute:
              point: ~top_left
              x: 10
              y: var.count * 42 + 90
              fontSize: 20
              texts: "var.now < var.resultUntil ? var.summary : var.limitHint"
              through: true
          快捷键:
            type: Text
            attribute:
              point: ~top_left
              x: 10
              y: var.count * 42 + 66
              fontSize: 20
              texts: "var.batchEnabled ? '&7[' + var.previousLabel + '/' + var.nextLabel + '] 切换 · [' + var.allLabel + '] 批量 · [' + var.detailsLabel + '] 详情' : '&7[' + var.previousLabel + '/' + var.nextLabel + '] 切换 · [' + var.detailsLabel + '] 详情'"
              through: true
          物品列表:
            type: VStack
            attribute:
              point: ~top_left
              x: 0
              y: 40
              width: 440
              spaceBetween: 4
              through: true
            children:
