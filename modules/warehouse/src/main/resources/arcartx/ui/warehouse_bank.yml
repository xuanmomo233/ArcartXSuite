                  x: 552
                  y: 110
                  width: 12
                  height: 50
                  normal: ~245,205,130,255
                  maxDragY: 608
                  shape: ~round_rect
                  radius: 6
              定期滚动:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 40
                  y: 110
