        type: Scroll
        attribute:
          point: ~top_left
          x: 270
          y: 358
          width: 1170
          height: 480
          moveY: "self.parent['字段滚动滑块'].getDragYRatio()"
        children:
          字段列:
            val: "字段列"
            type: VStack
            attribute:
              width: 1150
              spaceBetween: 6
            children:
              字段0:
                type: Canvas
                attribute:
                  width: 1150
                  height: 48
                  entryKey: 0.round()
                  entry: "var.fieldRows['0']"
                  visible: "var.fieldCount > 0"
                children:
                  行底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~30,24,52,220
                      shape: ~round_rect
                      radius: 6
                      through: true
                  标签:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 14
                      texts: "'&8' + self.parent.entry['label']"
                      fontSize: 26
                      through: true
                  输入壳:
                    type: Canvas
                    attribute:
                      point: ~middle_left
                      x: 240
                      width: 640
                      height: 38
                      visible: "self.parent.entry['editor'] == 'TEXT' || self.parent.entry['editor'] == 'NUMBER'"
                    children:
                      框底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~44,36,66,240
                          shape: ~round_rect
