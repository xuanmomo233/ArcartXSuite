# 固定四行通知：非数字字典键、毫秒时钟、只遍历有效的四个槽位。
ui:
  isHud: true
  defaultOpen: true
  through: true
  escClose: false
  closeDied: false
  show: true
  level: 50
  screenScale: true
  action:
    load: |-
      var.notices = {}
      var.noticeReady = false
    tick: |-
      var.now = Time.currentTime()
      for(i in range(0, 3)){
        key = 'row' + i.round()
        entry = var.notices[key]
        if(entry != none && var.now - entry['born'] >= 8000){
          var.notices[key] = none
        }
      }
  packetHandler:
    notify: |-
      if(!var.noticeReady){
        for(i in range(1, 3)){
          row = val.noticeList['通知行'].copy('通知行' + i.round())
          row.entryKey = 'row' + i.round()
        }
        var.noticeReady = true
      }
      var.notices['row3'] = var.notices['row2']
      var.notices['row2'] = var.notices['row1']
      var.notices['row1'] = var.notices['row0']
      var.notices['row0'] = {'nick': packet['nick'], 'msg': packet['msg'], 'time': packet['time'], 'born': Time.currentTime()}
controls:
  全局:
    type: Adaptive
    attribute:
      point: ~top_right
      width: 1920
      height: 1080
    children:
      通知列表:
        val: noticeList
        type: VStack
        attribute:
          point: ~top_right
          x: -24
          y: 70
          width: 520
          spaceBetween: 8
          through: true
        children:
          通知行:
            type: Texture
            attribute:
              entryKey: ~row0
              entry: var.notices[self.entryKey]
              visible: self.entry != none
              width: 520
              height: 94
              normal: ~24,34,48,245
              shape: ~round_rect
              radius: 10
              through: true
              alpha: "self.entry != none ? Math.max(0, Math.min(1, (8000 - (Time.currentTime() - self.entry['born'])) / 1000)) : 0"
            children:
              来源:
                type: Text
                attribute:
                  x: 14
                  y: 10
                  texts: "self.parent.entry != none ? '&b' + self.parent.entry['nick'] + '  &8' + self.parent.entry['time'] : ''"
                  fontSize: 32
                  limit: 30
                  through: true
              消息:
                type: Text
                attribute:
                  x: 14
                  y: 50
                  texts: "self.parent.entry != none ? '&f' + self.parent.entry['msg'] : ''"
                  fontSize: 36
                  limit: 26
                  through: true
