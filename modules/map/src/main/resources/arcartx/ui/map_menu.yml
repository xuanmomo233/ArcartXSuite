                  point: ~top_left
                  x: 18
                  y: 12
                  texts: ~&8世界列表
                  fontSize: 24
                  through: true
              世界浮层滑块:
                type: Texture
                val: 世界浮层滑块
                attribute:
                  point: ~top_right
                  x: -10
                  y: 40
                  width: 6
                  height: 60
                  normal: ~120,120,120,200
                  maxDragY: 260
              世界浮层滚动栏:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 10
                  y: 40
                  width: 220
                  height: 268
                  moveY: "self.parent['世界浮层滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['世界浮层滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['世界浮层滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  world_list:
                    val: world_entry
                    type: VStack
                    attribute:
                      width: 220
                      spaceBetween: 6
                    children:
                      地图项目:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.worldRows[self.entryKey]
                          visible: self.entry != none
                          width: 220
                          height: 52
                        action:
                          clickLeft: |-
                            if (self.entry != none) {
                              Packet.send(var.packetId, 'open_world', self.entry['id'])
                              var.worldListOpen = false
                            }
                        children:
                          地图项目背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.entry != none && self.parent.entry['selected'] ? '74,144,226,255' : '52,56,64,255'"
                              hover: "self.parent.entry != none && self.parent.entry['selected'] ? '94,164,246,255' : '72,76,84,255'"
                              shape: ~round_rect
                              radius: 12
                          地图项目图标:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 14
                              texts: "self.parent.entry != none && self.parent.entry['selected'] ? '&e◉' : '&6◎'"
                              fontSize: 30
                              through: true
                          地图项目文字:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 46
                              texts: "self.parent.entry != none ? '&f' + self.parent.entry['displayName'] : none"
                              fontSize: 26
                              through: true
