              stroke:
                width: 3
                color: ~80,200,220,240

          # 天赋点信息栏
          信息栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 16
              width: "var.contentW - 48"
              height: 48
            children:
              信息背景:
                type: Texture
