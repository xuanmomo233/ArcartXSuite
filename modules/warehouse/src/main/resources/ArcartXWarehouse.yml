config-version: 4
# AXS Warehouse AXUI
# 作用: AXUI 驱动个人仓库、共享仓库、NBT 分类、银行、多利率定期存款和二级密码。
# 重载: /axs warehouse reload
# 玩家入口: /warehouse 或 /wh 打开 UI，业务操作全部在 AXUI 内完成。
# PAPI: %axswarehouse_total_items%、%axswarehouse_bank_balance_money% 等。

settings:
  debug: false  # 是否输出调试日志
  flush-interval-ticks: 100  # 数据落库间隔（ticks，20 = 1 秒）
  # 共享仓库转让确认等待时长（小时），<=0 表示永不过期。
  transfer-confirm-expire-hours: 24

# 跨服共享仓库编辑锁；MySQL 共享库 + 多子服时建议开启。连接参数见宿主 config.yml cross-server 节。
cross-server:
  enabled: false  # 是否启用跨服编辑锁

ui:
  ui-id: "AXS:warehouse_storage"  # 仓库存储界面 UI ID
  manage-ui-id: "AXS:warehouse_manage"  # 仓库管理界面 UI ID
  bank-ui-id: "AXS:warehouse_bank"  # 银行界面 UI ID
  packet-id: "AXS_WAREHOUSE"  # 客户端通信包标识符
  register-ui-on-enable: true  # 启动时是否自动注册 UI
  overwrite-ui-files: false  # 是否强制覆盖用户已修改的 UI 文件
  # 仓库网格每页显示的槽位数量（控件按此数量动态创建）。
  page-size: 72

storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "warehouse.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: 4
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_warehouse_"

# 二级密码完全由宿主 config.yml 的 security.secondary-password 节统一管控
# （解锁有效期 unlock-timeout-seconds、长度策略 min-length/max-length），本模块不再持有密码配置。

pickup:
  enabled: true  # 服务器总开关：关闭后全服自动入库功能失效，玩家个人开关不生效，管理界面隐藏相关开关
  auto-store-on-pickup: true  # 拾取时是否自动存入仓库（玩家个人设置的默认值）
  auto-store-mythic-loot: false  # 是否自动存入 MythicMobs 自定义掉落物（玩家个人设置的默认值）
  mythic-loot-enabled: true  # 服务器开关：是否允许 MythicMobs 自定义掉落物自动入库（关闭后管理界面隐藏对应开关）
  notify-on-auto-store: true  # 自动存入时是否通知玩家（玩家个人设置的默认值）

search:
  page-size: 18  # 搜索结果每页显示数量
  default-sort: "time"  # 默认排序方式（time / name / amount）

warehouses:
  personal:
    display-name: "&6个人仓库"  # 个人仓库显示名称
    default-owned: true  # 玩家首次使用时是否自动创建
    # 逐格解锁模型：已解锁格数 = base-slots + 已购格数(extra_slots)，上限为 max-slots。
    # 注意：max-slots 是槽位【总数】上限（含初始格），不是"可再购买的格数"。
    # 扩展背包（extrabackpack）与本仓库共用同一存储，两个入口看到同样的格子。
    base-slots: 72  # 初始解锁槽位数
    max-slots: 720  # 槽位总数上限（含初始格）
    slot-price:
      currency: "money"  # 每格所需货币 ID
      amount: 1000  # 每格价格

# 物品分类定义：按"物品注册键"或"NBT 路径"匹配物品归属分类，三种规则为"或"关系。
#   material-ids      注册键精确匹配（minecraft:diamond_sword、tacz:modern_kinetic_gun）
#   material-prefixes 注册键前缀匹配（tacz: 命中全部 TaCZ 物品，apotheosis: 命中全部 Apotheosis 物品）
#   nbt.path+values   NBT/PDC 路径值匹配（path 可用 material / name / custom-model-data / pdc:<key>）
# priority 数字越小越靠前；先命中者优先，全部未命中归入 default: true 的兜底分类。
categories:
  equipment:
    display-name: "装备"  # 分类显示名称
    priority: 10  # 分类排序优先级（数字越小越靠前）
    nbt:
      path: "pdc:arcartx:item_category"  # NBT 匹配路径
      values: ["equipment", "weapon", "armor"]  # 匹配值列表
  material:
    display-name: "材料"
    priority: 20
    nbt:
      path: "pdc:arcartx:item_category"
      values: ["material"]
  consumable:
    display-name: "消耗品"
    priority: 30
    nbt:
      path: "pdc:arcartx:item_category"
      values: ["consumable", "food", "potion"]
  # 原版物品按注册键分类（PDC 标签优先，未打标签的原版物品落这里）
  weapon:
    display-name: "武器"
    priority: 40
    material-ids:
      - "minecraft:wooden_sword"
      - "minecraft:stone_sword"
      - "minecraft:iron_sword"
      - "minecraft:golden_sword"
      - "minecraft:diamond_sword"
      - "minecraft:netherite_sword"
      - "minecraft:bow"
      - "minecraft:crossbow"
      - "minecraft:trident"
      - "minecraft:mace"
  tool:
    display-name: "工具"
    priority: 41
    material-ids:
      # 各材质工具（镐/斧/锹/锄）
      - "minecraft:wooden_pickaxe"
      - "minecraft:wooden_axe"
      - "minecraft:wooden_shovel"
      - "minecraft:wooden_hoe"
      - "minecraft:stone_pickaxe"
      - "minecraft:stone_axe"
      - "minecraft:stone_shovel"
      - "minecraft:stone_hoe"
      - "minecraft:iron_pickaxe"
      - "minecraft:iron_axe"
      - "minecraft:iron_shovel"
      - "minecraft:iron_hoe"
      - "minecraft:golden_pickaxe"
      - "minecraft:golden_axe"
      - "minecraft:golden_shovel"
      - "minecraft:golden_hoe"
      - "minecraft:diamond_pickaxe"
      - "minecraft:diamond_axe"
      - "minecraft:diamond_shovel"
      - "minecraft:diamond_hoe"
      - "minecraft:netherite_pickaxe"
      - "minecraft:netherite_axe"
      - "minecraft:netherite_shovel"
      - "minecraft:netherite_hoe"
      # 杂项工具
      - "minecraft:shears"
      - "minecraft:flint_and_steel"
      - "minecraft:fishing_rod"
      - "minecraft:carrot_on_a_stick"
      - "minecraft:warped_fungus_on_a_stick"
      - "minecraft:brush"
      - "minecraft:spyglass"
      - "minecraft:lead"
  armor:
    display-name: "护甲"
    priority: 42
    material-ids:
      # 头盔
      - "minecraft:leather_helmet"
      - "minecraft:chainmail_helmet"
      - "minecraft:iron_helmet"
      - "minecraft:golden_helmet"
      - "minecraft:diamond_helmet"
      - "minecraft:netherite_helmet"
      - "minecraft:turtle_helmet"
      # 胸甲
      - "minecraft:leather_chestplate"
      - "minecraft:chainmail_chestplate"
      - "minecraft:iron_chestplate"
      - "minecraft:golden_chestplate"
      - "minecraft:diamond_chestplate"
      - "minecraft:netherite_chestplate"
      # 护腿
      - "minecraft:leather_leggings"
      - "minecraft:chainmail_leggings"
      - "minecraft:iron_leggings"
      - "minecraft:golden_leggings"
      - "minecraft:diamond_leggings"
      - "minecraft:netherite_leggings"
      # 靴子
      - "minecraft:leather_boots"
      - "minecraft:chainmail_boots"
      - "minecraft:iron_boots"
      - "minecraft:golden_boots"
      - "minecraft:diamond_boots"
      - "minecraft:netherite_boots"
      # 特殊装备
      - "minecraft:elytra"
      - "minecraft:shield"
      - "minecraft:leather_horse_armor"
      - "minecraft:iron_horse_armor"
      - "minecraft:golden_horse_armor"
      - "minecraft:diamond_horse_armor"
      - "minecraft:wolf_armor"
  enchant_book:
    display-name: "附魔书"
    priority: 43
    material-ids:
      - "minecraft:enchanted_book"
  # 示例：按 mod 命名空间分类（把整页改成你的 mod 前缀即可）
  # mod_items:
  #   display-name: "Mod物品"
  #   priority: 5
  #   material-prefixes: ["tacz:", "apotheosis:"]
  other:
    display-name: "其它"
    priority: 9999  # 兜底分类，优先级最低
    default: true  # 未匹配任何分类的物品归入此分类

bank:
  # 银行展示的全局货币 ID 子集；定义必须存在于宿主 config.yml 的 currencies 中。
  # 未在全局池定义的 ID 会在加载时告警并跳过。
  currencies:
    - money
  deposit-products:
    money_stable_1d:
      enabled: true  # 是否启用此产品
      display-name: "稳健 1 日"  # 产品显示名称
      description: "低门槛短期定存。"  # 产品描述
      currency: "money"  # 存入货币 ID
      duration-seconds: 86400  # 定期时长（秒，86400 = 1 天）
      min-amount: 100  # 最低存入金额
      max-amount: 0  # 最高存入金额（0 = 无上限）
      permission: ""  # 购买所需权限（留空 = 无限制）
      interest-tiers:
        tier_1:
          min: 100  # 此利率档位最低金额
          max: 9999  # 此利率档位最高金额
          rate: 0.01  # 利率（0.01 = 1%）
        tier_2:
          min: 10000
          max: 99999
          rate: 0.015
        tier_3:
          min: 100000
          max: 0  # 0 = 无上限
          rate: 0.02
    money_vip_7d:
      enabled: true
      display-name: "贵宾 7 日"
      description: "权限专属较高收益定存。"
      currency: "money"
      duration-seconds: 604800  # 7 天
      min-amount: 1000
      max-amount: 0
      permission: "ArcartXSuite.warehouse.bank.vip"
      interest-tiers:
        tier_1:
          min: 1000
          max: 49999
          rate: 0.04
        tier_2:
          min: 50000
          max: 0
          rate: 0.06
# 共享仓库配置
shared:
  enabled: true  # 是否启用共享仓库功能
  create-cost:
    currency: "points"  # 创建共享仓库所需货币
    amount: 1000  # 创建费用
  default-level: 1  # 默认共享仓库等级
  levels:
    "1":
      capacity: 144  # 等级 1 容量
      upgrade:
        currency: "points"
        amount: 1000
    "2":
      capacity: 360
      upgrade:
        currency: "points"
        amount: 1800
    "3":
      capacity: 720  # 等级 3 容量（最高级）
  role-names:
    owner: "所有者"  # 所有者角色显示名
    member: "成员"  # 成员角色显示名
    viewer: "观众"  # 观众角色显示名（只读）
  permission-tiers:
    default:
      permission: ""  # 默认权限组（无额外权限要求）
      priority: 0  # 优先级（数字越大优先级越高）
      max-owned: 1  # 可拥有的共享仓库上限
      max-members: 6  # 每个仓库的成员上限
    vip:
      permission: "ArcartXSuite.warehouse.shared.vip"  # VIP 权限节点
      priority: 10
      max-owned: 3
      max-members: 12

# 排序方案定义（搜索结果按此方案排序）
sort-profiles:
  time:
    fields:
      - "updated:desc"  # 按更新时间降序
      - "name:asc"  # 再按名称升序
  name:
    fields:
      - "name:asc"  # 按名称升序
  amount:
    fields:
      - "amount:desc"  # 按数量降序
      - "updated:desc"  # 再按更新时间降序

# ─── 展示柜（Showcase）配置 ────────────────────────────────────────
# 允许玩家将仓库中的物品展示到聊天卡片，供其他玩家查看。
showcase:
  # 是否启用展示柜功能。
  enabled: true
  # 每次发送展示卡片后的冷却时间（秒），最短 5 秒。
  cooldown-seconds: 60
  # 单次展示卡片中最多显示的物品数量，最少 1 个。
  max-items: 9
  # 展示卡片使用的 ArcartX 卡片 ID（EventPacket/Chat 卡片），留空则使用模块内置默认卡片。
  card-id: ""
  # 使用展示柜功能所需的权限节点。
  permission: "arcartxsuite.warehouse.showcase"

# ─── 黑名单 ────────────────────────────────────────
# 匹配任意一条规则的物品将无法存入仓库。
blacklist:
  # 按原版 Material ID 拦截，例如 ["BEDROCK", "COMMAND_BLOCK"]。
  material-ids: []
  # 按 MythicMobs 物品 ID 拦截。
  mythic-item-ids: []
  # 按 NeigeItems 物品 ID 拦截。
  neige-item-ids: []
  # 按 Overture 物品 ID 拦截。
  overture-item-ids: []
  # 按物品种类（kind）拦截，具体可用值取决于物品定义。
  kinds: []
  # 物品显示名包含任意关键词即拦截。
  name-contains:
    - "绑定不可存"
  # 物品 Lore 包含任意关键词即拦截。
  lore-contains:
    - "不可存入仓库"
  # 物品显示名匹配任意正则即拦截。
  name-regex: []
  # 物品 Lore 匹配任意正则即拦截。
  lore-regex: []
  # 只要物品 PDC 或原始 NMS NBT 复合标签中存在任意一个 key 即禁止存入，原始 NBT 会递归检查嵌套 compound/list，只判断 key 存在不比较 value；反射读取失败时安全降级为无原始 NBT 匹配。
  nbt-keys: []

# ─── 额外槽位背包（Extra Backpack）────────────────────────────────────────
# 可选功能，默认关闭。启用后由本模块接管玩家原版背包的 27 个存储格（快捷栏 9 格不受影响）。
# 背包由多个分类页组成（装备/材料/杂物…），每个分类页独立设置容量、上限与付费扩容价格；
# 物品分类由 warehouse 模块自行按 NBT/lore 判断，无需服主在 ArcartX 中配置槽位。
