# 配置文件版本号；用于自动迁移程序识别当前版本并执行升级。
config-version: 2
# AXS Chat
# 作用: 频道聊天、私聊、回复、监听、忽略、禁言、跨服转发、聊天卡片、物品展示和过滤。
# 依赖: ArcartX；PlaceholderAPI、Redis、数据库按功能选用。
# 重载: /axs chat reload
# PAPI 输出:
#   %axschat_current_channel% 当前频道 ID。
#   %axschat_current_channel_display% 当前频道显示名。
#   %axschat_reply_target% 当前 /reply 目标玩家名。
#   %axschat_spy_enabled% 当前玩家是否开启社交监听。
#   %axschat_ignore_count% 当前玩家忽略列表数量。
#   %axschat_muted% 当前玩家是否处于禁言中。
# 可解析的 PAPI: 频道格式、卡片文本和展示文本会按聊天上下文解析 PlaceholderAPI。
# 关联资源: chat/channels/*.yml

settings:
  # 是否输出 Chat 模块调试日志。
  debug: false

  # 当前服务端节点标识；跨服转发或 Redis 去重时会用到。
  server-id: "default"

  # 默认频道 ID；若配置不存在，模块会自动回退到首个有效频道。
  default-channel: "normal"

  # 单条消息最大长度。
  max-length: 256

  # 玩家连续发言冷却，单位毫秒。
  cooldown-millis: 750

  # 重复消息判定窗口，单位毫秒。
  duplicate-window-millis: 4000

# ── 兼容性设置 ───────────────────────────────────────
compatibility:
  other-chat-plugins:
    # 强制接管聊天事件。开启后 AXS 会尽早捕获玩家原始消息，并在事件链末尾再次取消原版/其他插件广播。
    # 仅在服务器安装其他聊天插件并出现消息被改写、重复或复用旧消息时开启。
    force-takeover: false

# ── 存储设置 ─────────────────────────────────────────
storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "<moduleId>.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: <N>
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_<moduleId>_"

# ── 跨服设置 ─────────────────────────────────────────
cross-server:
  enabled: false            # 是否启用跨服聊天转发；需要 Redis 支持

# ── 聊天卡片设置 ─────────────────────────────────────
cards:
  # 提及、私聊、系统提示、物品展示对应的 ArcartX 聊天卡片 ID；留空则不发送卡片。
  mention-card-id: "axs_chat_mention"
  private-card-id: "axs_chat_private"
  system-card-id: "axs_chat_system"
  item-preview-card-id: "axs_item_preview"

  # 全角字符（中文等）占位宽度
  char-width-full: 31
  # 半角字符（英文/数字等）占位宽度，这里我已经调到默认配置最佳值
  char-width-half: 18
  # 文字区最大宽度（超过此值自动换行）
  max-line-width: 750

# ── 功能开关 ─────────────────────────────────────────
function:
  mention:
    # 是否开启 @提及 识别。
    enabled: true
    # 是否允许所有玩家被提及；关闭后只允许可见/可接收对象。
    allow-all: true

  item:
    # 是否开启 [item] 物品展示。
    enabled: true
    token: "[item]"                          # 触发物品展示的占位标记
    format: "&b[&f{item_name}&b x{item_amount}]" # 物品展示格式，{item_name} 为物品名，{item_amount} 为数量
    failed-format: "&c[物品不可用]"           # 物品不可用时显示的替代文本

  # 自定义组件匹配表；为空时不额外替换。
  # 示例:
  # custom-components:
  #   star:
  #     enabled: true
  #     pattern: ":star:"
  #     replacement: "★"
  custom-components: {}

# ── 敏感词过滤 ───────────────────────────────────────
# 【已迁移】敏感词过滤已统一到宿主 config.yml 的 moderation 节。
# 请在 plugins/ArcartXSuite/config.yml 中配置全局敏感词过滤（支持标点穿透防护、白名单、多 URL 云端词库）。
# 此处配置仅作向后兼容保留，不再生效。
filter:
  enabled: false
  cancel-on-match: false
  replacement: "*"
  blocked-words: []
  blocked-patterns: []
  cloud:
    enabled: false
    url: ""
    refresh-minutes: 60

# 频道定义目录，相对于插件数据目录。
channels-directory: "chat/channels"
