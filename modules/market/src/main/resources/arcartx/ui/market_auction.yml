# AXS Market — 拍卖行主界面
# 打开方式: /market 或 /market auction
# 布局: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏 + 左侧导航(页面导航+分类筛选) + 内容区(工具栏+物品网格+分页)
# 配色: 蓝色系 主色70,150,250 强调140,200,255 底42,50,66,210 描边255,255,255,230
# 数据交互: packetHandler update；客户端 Packet.send(var.packetId, action, ...)

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    auction_quote: |-
      if(var.showTradeConfirm && var.tradeMode == 'bid' && packet['id'] == var.tradeId){
        var.quoteBusy = false
        var.quoteAvailable = packet['available']
        var.bidReason = packet['reason']
        if(var.quoteAvailable){
          var.bidCanSubmit = packet['canSubmit']
          var.tradeAmount = packet['amount']
          var.bidMinimum = packet['minimum']
          var.bidCurrent = packet['current']
          var.bidHighest = packet['highest']
          var.bidDebit = packet['debit']
          var.bidHeld = packet['held']
          var.bidDeadline = packet['deadline']
          var.bidProtection = packet['protection']
          val.自定义出价输入.setContent(var.tradeAmount)
          var.bidDirty = false
        } else {
          var.bidCanSubmit = false
        }
      }
    action_result: |-
      var.actionToken = packet['action_token']
      var.actionBusy = false
      var.actionBusySeconds = 0
    # packetHandler: update
    # 服务端推送更新时执行，字段与 init 完全相同
    update: |-
      var.itemJsons = {}
      oldMaxCategoryCount = var.maxCategoryCount
      oldMaxListingCount = var.maxListingCount
      var.packetId = packet['packetId']
      var.page = packet['page']
      var.totalPages = packet['totalPages']
      var.pageText = packet['pageText']
      var.currentCategory = packet['currentCategory']
      var.search = packet['keyword']
      var.elapsed = 0
      var.categories = packet['categories']
      var.categoryTexts = packet['categoryTexts']
      var.listings = packet['listings']
      var.listingTexts = packet['listingTexts']
      var.maxCategoryCount = packet['maxCategoryCount']
      var.maxListingCount = packet['maxListingCount']
      var.actionToken = packet['action_token']
      for(key in var.listings.keys()){
        json = packet['itemJson' + key]
        if(json != none && json != ''){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      if(var.maxCategoryCount != oldMaxCategoryCount){
        while(val.分类列表.childrenCount() > 1){
          val.分类列表.get(1).remove()
        }
        if(var.maxCategoryCount > 1){
          for(i in range(1, var.maxCategoryCount - 1)){
            key = i.round()
          if(val.分类列表['分类项'] != none) {
            e = val.分类列表['分类项'].copy('分类项' + key)
            e.entryKey = key
          }
          }
        }
      }
      if(var.maxListingCount != oldMaxListingCount){
        while(val.物品列表.childrenCount() > 1){
          val.物品列表.get(1).remove()
        }
        if(var.maxListingCount > 1){
          for(i in range(1, var.maxListingCount - 1)){
            key = i.round()
          if(val.物品列表['拍卖卡片'] != none) {
            e = val.物品列表['拍卖卡片'].copy('拍卖卡片' + key)
            e.entryKey = key
          }
          }
        }
      }
      if(var.maxListingCount > 0){
        for(i in range(0, var.maxListingCount - 1)){
          key = i.round()
          if(val.物品列表 != none){
            e = val.物品列表.get(key)
            if(e != none && e['物品图标'] != none){
              e['物品图标'].seticon()
            }
          }
        }
      }
      var.actionBusy = false
  action:
    seconds: |-
      var.elapsed = var.elapsed + 1
      var.refreshSeconds = var.refreshSeconds + 1
      if(var.refreshSeconds >= 5 && !var.actionBusy){
        var.refreshSeconds = 0
        if(!var.showTradeConfirm){
          Packet.send(var.packetId, 'auction_list', var.page, var.currentCategory, var.search, 'refresh')
        } else if(var.tradeMode == 'bid' && !var.bidDirty && !var.quoteBusy){
          var.quoteBusy = true
          Packet.send(var.packetId, 'auction_quote', var.tradeId, var.tradeAmount)
        }
      }
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.showTradeConfirm = false
      var.elapsed = 0
      var.refreshSeconds = 0
      var.tradeMode = ''
      var.quoteBusy = false
      var.bidCanSubmit = false
      var.bidDirty = false
      var.bidReason = ''
      var.search = ''
      var.categoryTexts = {}
      var.currentCategory = 'all'
      var.packetId = 'AXS_MARKET'
      var.page = 0
      var.pageText = '1/1'
      var.totalPages = 1
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.actionBusy = false
      var.actionBusySeconds = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
      var.cardW = (var.scrollW - 32) / 3
    open: |-
      Packet.send(var.packetId, 'auction_list', '0', 'all', none)
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
      var.cardW = (var.scrollW - 32) / 3

