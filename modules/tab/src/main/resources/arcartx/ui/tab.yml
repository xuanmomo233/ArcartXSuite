# tab / tabs/online-tab.yml / packet-handler: tab
# Compact text roster with live PING/TPS telemetry above the list.
# Server-rendered strings are kept intact in clipped name lanes, including title prefixes.
# Eight rows per column, three visible columns; LEFT/RIGHT reaches every remaining column.
ui:
  isHud: true
  hide:
  - player_list
  escClose: false
  defaultOpen: true
  action:
    load: |-
      var.TAB刷新轮次 = 0
      var.TAB在线人数 = 0
      var.单列数量 = 1
      var.第一列人数 = 0
      var.TAB显示 = false
      var.TAB名称位移 = 0
    keyPress: |-
      if(self.currentKeyPress() == "TAB"){
        Packet.send("TAB","update")
        var.单列数量 = math.ceil(var.TAB在线人数 / val.TAB遍历.row)
        var.第一列人数 = math.min(var.TAB在线人数, 8)
        var.TAB显示 = true
        var.TAB名称位移 = 0
        val.TAB横向滑块.setDragXRatio(0)
      }
      if(var.TAB显示 && self.currentKeyPress() == "RIGHT"){
        val.TAB横向滑块.setDragXRatio(math.min(1, val.TAB横向滑块.getDragXRatio() + 1 / math.max(1, var.单列数量 - 3)))
      }
      if(var.TAB显示 && self.currentKeyPress() == "LEFT"){
        val.TAB横向滑块.setDragXRatio(math.max(0, val.TAB横向滑块.getDragXRatio() - 1 / math.max(1, var.单列数量 - 3)))
      }
      if(var.TAB显示 && self.currentKeyPress() == "DOWN"){
        var.TAB名称位移 = math.min(1, var.TAB名称位移 + 0.25)
      }
      if(var.TAB显示 && self.currentKeyPress() == "UP"){
        var.TAB名称位移 = math.max(0, var.TAB名称位移 - 0.25)
      }
    keyRelease: |-
      if(self.currentKeyReleased() == "TAB"){
        var.TAB显示 = false
      }
  packetHandler:
    # Original list payload, text writes, copy sentinel and refresh generation retained.
    tab: |-
      i = 0
      var.TAB刷新轮次 = var.TAB刷新轮次 + 1
      while(val.TAB遍历2.childrenCount() > 1){
        val.TAB遍历2.get(1).remove()
      }
      while(i < packet.size()){
        if(val.player != none){
          TAB = val.player.copy('player_' + var.TAB刷新轮次 + '_' + i.round())
          TAB['player_text'].texts = packet.get(i)
          TAB.visible = true
        }
        i++
      }
      var.TAB在线人数 = packet.size()
      var.单列数量 = math.ceil(var.TAB在线人数 / val.TAB遍历.row)
      var.第一列人数 = math.min(var.TAB在线人数, 8)
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      TAB背景:
        type: Canvas
        attribute:
          point: ~top_center
          y: 24
          width: "24 + 392 * math.min(3, math.max(1, var.单列数量))"
          height: "252 + 44 * math.max(1, var.第一列人数)"
          visible: var.TAB显示
          through: true
        children:
          名册底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,24,44,164
              shape: ~round_rect
              radius: 8
              through: true
          名册规则线:
            type: Texture
            attribute:
              width: "self.parent.width"
              height: 3
              normal: ~35,159,214,230
              through: true
          在线玩家:
            type: Text
            attribute:
              x: 24
              y: 16
              fontSize: 48
              texts: ~&f在线玩家
              through: true
          在线人数:
            type: Text
            attribute:
              point: ~top_right
              x: -24
              y: 24
              texts: "'&b' + var.TAB在线人数.round() + ' &7人'"
              fontSize: 36
              through: true
          # A stable two-cell telemetry strip replaces the old count-dependent footer wrapping.
          信息排列布局:
            type: HStack
            attribute:
              x: 24
              y: 76
              height: 44
              spaceBetween: 16
            children:
              PING:
                type: Canvas
                attribute:
                  width: "(self.parent.parent.width - 64) / 2"
                  height: 44
                  through: true
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~21,37,57,130
                      through: true
                  标签:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 10
                      texts: ~&7PING
                      fontSize: 36
                      through: true
                  文本:
                    type: Text
                    attribute:
                      point: ~middle_right
                      x: -10
                      fontSize: 36
                      texts: ~&f{server.player_ping}
                      through: true
              TPS:
                type: Canvas
                attribute:
                  width: "(self.parent.parent.width - 64) / 2"
                  height: 44
                  through: true
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~21,37,57,130
                      through: true
                  标签:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 10
                      texts: ~&7TPS
                      fontSize: 36
                      through: true
                  文本:
                    type: Text
                    attribute:
                      point: ~middle_right
                      x: -10
                      fontSize: 36
                      texts: ~&f{server.server_tps_1}
                      through: true
          # Keep TAB遍历/TAB aliases, now as useful column headings rather than 120 placeholders.
          TAB遍历:
            type: HStack
            val: TAB遍历
            attribute:
              x: 24
              y: 132
              height: 36
              spaceBetween: 24
              row: 8
            action:
              create: |-
                for(i in range(1, 2)){
                  header = self['TAB'].copy('TAB' + i.round())
                  header.ID = i.round()
                }
            children:
              TAB:
                type: Canvas
                val: TAB
                attribute:
                  width: 368
                  height: 36
                  ID: 0.round()
                  visible: "self.ID < math.min(3, math.max(1, var.单列数量))"
                  through: true
                children:
                  栏目:
                    type: Text
                    attribute:
                      texts: ~&7玩家 / 称号
                      fontSize: 36
                      through: true
          玩家滚动区:
            type: Scroll
            attribute:
              x: 24
              y: 176
              width: "392 * math.min(3, math.max(1, var.单列数量)) - 24"
              height: "44 * math.max(1, var.第一列人数)"
              moveX: val.TAB横向滑块.getDragXRatio()
            action:
              wheel: |-
                val.TAB横向滑块.setDragXRatio(math.max(0, math.min(1, self.moveX - self.wheelValue / math.max(1, var.单列数量 - 3))))
            children:
              玩家画布:
                type: Canvas
                attribute:
                  width: "392 * math.max(1, var.单列数量) - 24"
                  height: "44 * math.max(1, var.第一列人数)"
                  through: true
                children:
                  TAB遍历2:
                    type: VGrid
                    val: TAB遍历2
                    attribute:
                      spaceBetweenY: 4
                      spaceBetweenX: 24
                      row: 8
                    children:
                      player:
                        type: Canvas
                        val: player
                        attribute:
                          width: 368
                          height: 40
                          visible: false
                          through: true
                        children:
                          行底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              normal: ~21,37,57,164
                              through: true
                          行标尺:
                            type: Texture
                            attribute:
                              width: 2
                              height: 40
                              normal: ~137,167,187,190
                              through: true
                          # Explicit custom texts preserves TAB['player_text'].texts assignment.
                          # The inner Text is clipped to its lane and reveals overflow on hover.
                          player_text:
                            type: Scroll
                            attribute:
                              x: 12
                              y: 2
                              width: 344
                              height: 36
                              texts: ~none
                              scrollAnim: none
                              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : var.TAB名称位移"
                            action:
                              enter: "self.scrollAnim = Lerp(0, 1, 3000)"
                              leave: "self.scrollAnim = none"
                            children:
                              玩家文本布局:
                                type: HStack
                                attribute:
                                  height: 36
                                children:
                                  玩家文本:
                                    type: Text
                                    attribute:
                                      fontSize: 36
                                      texts: self.parent.parent.texts
                                      through: true
          空名册:
            type: Text
            attribute:
              x: 36
              y: 180
              texts: "var.TAB刷新轮次 == 0 ? '&7正在同步名册' : '&7暂无在线条目'"
              fontSize: 36
              visible: var.TAB在线人数 == 0
              through: true
          横向滑轨:
            type: Texture
            attribute:
              x: 24
              y: "188 + 44 * math.max(1, var.第一列人数)"
              width: "self.parent.width - 48"
              height: 6
              normal: ~92,121,145,170
              visible: var.单列数量 > 3
              through: true
          横向滑块:
            type: Texture
            val: TAB横向滑块
            attribute:
              x: 24
              y: "188 + 44 * math.max(1, var.第一列人数)"
              width: 120
              height: 6
              maxDragX: "self.parent.width - 168"
              normal: ~35,159,214,230
              hover: ~188,210,224,230
              visible: var.单列数量 > 3
          浏览提示:
            type: Text
            attribute:
              point: ~bottom_left
              x: 24
              y: -16
              texts: "var.单列数量 > 3 ? '&bLEFT / RIGHT &7分栏浏览' : '&7UP / DOWN 浏览长名'"
              fontSize: 36
              through: true
          收起提示:
            type: Text
            attribute:
              point: ~bottom_right
              x: -24
              y: -16
              texts: "var.单列数量 > 3 ? '&7UP / DOWN 浏览长名' : '&7PING 单位 ms / 服务 TPS'"
              fontSize: 36
              visible: var.单列数量 > 1
              through: true
