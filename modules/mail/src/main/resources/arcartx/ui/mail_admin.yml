                          stroke:
                            width: 3
                            color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
                      副面板返回文字_CDK:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&f返回"
                          fontSize: 36
                          through: true
                  副面板标题_CDK:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 130
                      y: 14
                      texts: "~&fCDK 兑换码"
                      fontSize: 36
                  CDK滚动区:
                    type: Scroll
                    attribute:
                      point: ~top_left
                      x: 16
                      y: 72
                      width: "var.contentW - 44"
                      height: "var.viewH - 144 - 120"
                      moveY: "self.parent['CDK滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['CDK滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['CDK滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      CDK列表:
                        val: CDK滚动区
                        type: VStack
                        attribute:
                          width: "self.parent.width - 6"
                          spaceBetween: 6
                        children:
                          CDK行模板:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              isTemplate: true
                              cdkEnabled: true
                              expireMode: 'relative'
                              width: "self.parent.width - 16"
                              height: 56
                            children:
                              CDK行底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
