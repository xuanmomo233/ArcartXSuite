                  行容器:
                    type: VStack
                    attribute:
                      point: ~top_left
                      x: 18
                      y: 86
                      width: "var.colW - 96"
                      spaceBetween: 8
                    children:
                      行:
                        type: Canvas
                        attribute:
                          width: "var.colW - 96"
                          height: 54
                          entryKey: 0.round()
                          entry: "self.parent.parent.entry['lines'][self.entryKey]"
                          visible: "self.entry != none"
                        children:
                          行底:
                            type: Texture
                            attribute:
                              x: 1
                              y: 1
                              width: "self.parent.width - 2"
                              height: "self.parent.height - 2"
                              normal: ~11,13,14,245
                              shape: ~round_rect
                              radius: 6
                              through: true
                            effect:
                              stroke:
                                width: 1
                                color: "self.parent.isHovered() ? '245,205,130,180' : '255,255,255,30'"
                          行号:
                            type: Text
                            attribute:
                              point: ~middle_left
                              x: 12
                              texts: "'&6' + (self.parent.entryKey + self.parent.parent.parent.entry['lineOffset'] + 1).round()"
                              fontSize: 32
                              through: true
                          文:
                            type: Text
