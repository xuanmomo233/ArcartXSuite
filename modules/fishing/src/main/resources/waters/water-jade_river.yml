# 水域配置：翡翠河
# 玩家在此多边形区域内钓鱼时使用此水域配置。

display-name: "&a翡翠河"
world: "world"
enabled: true

# 多边形边界点（x,z），至少需要 3 个点
pos:
  - "500,300"
  - "700,300"
  - "700,400"
  - "500,400"

# 鱼类列表
fishes:
  - "salmon"
  - "catfish"

# 宝藏列表
treasures:
  - "old_boot"
  - "lost_ring"
  - "ancient_coin"

# 难度修正公式：翡翠河难度略低，随等级缓慢提升
difficulty-formula: "0.9 + 0.003 * global.level"

min-player-level: 0
max-player-level: 0

bait-multipliers:
  worm: 1.0
  bread: 1.3

require-permission: ""
