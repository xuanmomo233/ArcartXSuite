                  fontSize: 36
                  through: true
              封禁滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  y: 112
                  width: 12
                  height: "var.viewH - 348"
                  normal: ~40,44,52,225
                  shape: ~round_rect
                  radius: 6
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,230
              封禁滑块:
                type: Texture
                val: 封禁滑块
                attribute:
                  point: ~top_right
                  y: 112
