# ═══ 商店力量档（同价随机档位） ═══
shop_power_t1:
  - "if_var shop_power_lvl == 1"
  - "apply_potion @trigger STRENGTH 0 180"
  - "message @trigger &c⚔ 力量灌注 I：3 分钟"
shop_power_t2:
  - "if_var shop_power_lvl == 2"
  - "apply_potion @trigger STRENGTH 1 120"
  - "message @trigger &c⚔ 力量灌注 II：2 分钟"
shop_power_t3:
  - "if_var shop_power_lvl == 3"
  - "apply_potion @trigger STRENGTH 2 60"
  - "message @trigger &c⚔&l 暴击力量 III：1 分钟（本次上上签！）"


init:
  - "wait 1"
  - "setvar coins 0"
  # 商店力量档位：同价随机（I/II/III 档）
  - "random shop_power_lvl 1 3"

start:
  - "message @all &6═══ 元气试炼之地 ═══"
  - "title @all 10 40 10 &6元气试炼之地|&e三层地牢 · 每次进入皆不相同"
  - "sound @all ENTITY_ENDER_DRAGON_GROWL 1 1"
  - "bossbar @all 1200 RED SOLID &c元气试炼之地"
  # 引导：HUD 目标行 + 路标指向向导（到达跑 guide_guide 段）
  - "guide_point guide 11,62,11 2 &e先与向导·艾琳交谈"

# guide_<navId> 段：到达该导航点时自动运行
guide_guide:
  - "guide_clear guide"
  - "message @all &7右键 艾琳 可交谈并接取讨伐委托"
  # 指引接力：领完委托指向第一战走廊金块垫
  - "guide_point f1_a 25,62,11 2 &e沿红毯穿过东走廊·第一战"

complete:
  - "message @all &a&l通关！深渊领主已陨落！"
  - "title @all 10 60 10 &a&l通关|&e奖励已发放"
  - "grant_reward @all clear_pack"
  - "open_chest_ui @all final_chest"
  - "firework @all BURST GOLD"
  - "wait 5"
  - "exit_dungeon @all"

fail:
  - "message @all &c试炼失败……地牢把你们吐了出来"
  - "wait 2"
  - "exit_dungeon @all"

player-death:
  - "message @all &c{player} 阵亡了！&7将在 8 秒后复活，撑住！"
  - "wait 8"
  - "revive_player @trigger"

all-death:
  - "fail_dungeon"

exit:
  - "message @trigger &7已离开元气试炼之地"
