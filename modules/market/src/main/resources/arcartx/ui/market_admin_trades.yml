                  x: "1240"
                  y: "38"
                  width: "150"
                  height: 44
                  enable: "!var.loading"
                action:
                  clickLeft: |-
                    var.applyFilter()
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~48,67,82,240
                      shape: ~round_rect
                      radius: 8
                  文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&a查询"
                      fontSize: 24
                      through: true
              清空日期:
                type: Canvas
                attribute:
                  x: "1410"
                  y: "38"
                  width: "150"
                  height: 44
                  enable: "!var.loading"
                action:
                  clickLeft: |-
                    var.from = ''
                    var.until = ''
                    val.开始时间输入.setContent('')
                    val.结束时间输入.setContent('')
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~48,67,82,240
                      shape: ~round_rect
                      radius: 8
                  文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&b不限日期"
                      fontSize: 24
                      through: true
              交易类型:
                type: Canvas
                attribute:
                  x: "0"
                  y: "96"
                  width: "250"
                  height: 44
                  enable: "!var.loading"
                action:
                  clickLeft: |-
                    if(var.type == 'ALL'){
                      var.type = 'AUCTION'
                    }
                    elif(var.type == 'AUCTION'){
                      var.type = 'PSHOP'
                    }
                    elif(var.type == 'PSHOP'){
                      var.type = 'SHOP'
                    }
                    elif(var.type == 'SHOP'){
                      var.type = 'RECYCLE'
                    }
                    elif(var.type == 'RECYCLE'){
                      var.type = 'EXCHANGE'
                    }
                    elif(var.type == 'EXCHANGE'){
                      var.type = 'OTHER'
                    }
                    else {
                      var.type = 'ALL'
                    }
                    var.updateDirty()
                children:
                  底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~48,67,82,240
                      shape: ~round_rect
                      radius: 8
                  文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "'&f业务类型: ' + var.typeLabels[var.type]"
                      fontSize: 24
                      through: true
              状态筛选:
                type: Canvas
                attribute:
                  x: "280"
                  y: "96"
                  width: "250"
                  height: 44
                  enable: "!var.loading"
                action:
                  clickLeft: |-
                    if(var.state == 'ALL'){
                      var.state = 'PENDING'
                    }
                    elif(var.state == 'PENDING'){
                      var.state = 'ISSUES'
                    }
                    elif(var.state == 'ISSUES'){
                      var.state = 'PREPARED'
                    }
                    elif(var.state == 'PREPARED'){
                      var.state = 'READY'
                    }
                    elif(var.state == 'READY'){
                      var.state = 'RUNNING'
                    }
                    elif(var.state == 'RUNNING'){
                      var.state = 'REVIEW'
                    }
                    elif(var.state == 'REVIEW'){
                      var.state = 'DONE'
                    }
                    elif(var.state == 'DONE'){
                      var.state = 'FAILED'
                    }
                    elif(var.state == 'FAILED'){
                      var.state = 'CANCELLED'
                    }
                    elif(var.state == 'CANCELLED'){
                      var.state = 'EXPIRED'
