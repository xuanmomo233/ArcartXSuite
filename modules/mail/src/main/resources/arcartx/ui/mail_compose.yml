                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~249,243,230,255
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 1
                    color: 'self.parent.isHovered() ? ''175,147,97,255'' : ''151,138,112,150'''
              背包标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 16
                  y: 12
                  texts: ~&0背包 / 左键单个 · 右键整组
                  fontSize: 36
                  through: true
              背包网格:
                type: HGrid
                val: 背包网格
                attribute:
                  point: ~top_left
                  x: 16
                  y: 56
                  spaceBetweenX: 6
                  spaceBetweenY: 6
                  column: 6
                action:
                  create: |-
                    for(i in range(1,35)){
                      slot = self['槽位0'].copy('slot' + i)
                      slot.id = (9 + i).round()
                      slot.entryKey = (9 + i).round()
                    }
                children:
                  槽位0:
                    type: Slot
                    attribute:
                      width: 70
                      height: 70
                      normal: ~238,228,210,255
                      hover: ~224,216,190,255
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.72
                      slotType: ~Backpack
                      lock: true
                      id: 9.round()
                      entryKey: 9.round()
                    action:
                      clickLeft: Packet.send('AXS_MAIL', 'compose-add-attachment', self.entryKey, '1')
                      clickRight: Packet.send('AXS_MAIL', 'compose-add-attachment', self.entryKey, 'all')
                    effect:
                      stroke:
                        width: 2
                        color: ~255,255,255,230
          底部按钮栏:
            type: HStack
            attribute:
              point: ~bottom_left
              x: 0
              y: -16
              height: 64
              spaceBetween: 16
            children:
              发送按钮:
                type: Canvas
                attribute:
                  width: 200
                  height: 64
                  enable: '!var.actionBusy && var.actionToken != '''''
                action:
                  clickLeft: |-
                    if(!var.actionBusy && var.actionToken != ''){
                      var.actionBusy = true
                      var.actionBusySeconds = 0
                      Packet.send('AXS_MAIL', 'compose-send', var.sessionId, var.composeRecipient, var.composeSubject, var.composeBody, var.composeVault, var.actionToken)
                    }
                children:
                  发送底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: '!var.actionBusy && var.actionToken != '''' ? ''90,48,50,255'' : ''105,104,93,220'''
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple: null
                      stroke:
                        width: 1
                        color: 'self.parent.isHovered() ? ''175,147,97,255'' : ''151,138,112,150'''
                  发送文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f发送邮件
                      fontSize: 36
                      through: true
              返回按钮:
                type: Canvas
