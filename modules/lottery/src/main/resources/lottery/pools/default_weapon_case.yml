      base-weight: 125
    LEGENDARY:  # 传说（红色）
      color: "&d"
      base-weight: 25
    MYTHIC:  # 神话（金色）
      color: "&c"
      base-weight: 5
    SPECIAL:  # 特殊（亮金色，最稀有）
      color: "&6"
      base-weight: 2

  items:  # 武器皮肤物品池
    skin_p250_sand:
      name: "P250 | 沙漠风暴"       # 物品显示名称
      rarity: COMMON               # 稀有度等级（消费级）
      item:
        source: minecraft
        id: "minecraft:stone"
      icon:
        material: STONE
        name: "P250 | 沙漠风暴"
      delivery: DIRECT             # 发放方式：DIRECT（直接发放）

    skin_mp9_storm:
      name: "MP9 | 风暴"
