#
# ArcartXSuite CombatEffect - 连击特效 HUD
# 本 UI 作为 HUD 常驻显示，同时支持两种 combo 数据来源：
#   1. packetHandler "combo" / "combo_milestone" — 服务端包触发（达到阈值时）
#   2. server.combo_count 服务器变量 — 实时同步（需开启 sync-variable）
#
# 推荐方式: 开启 sync-variable 后直接用 {server.combo_count} 显示实时数字，
# packetHandler 仅用于里程碑动画（如 5 连击闪光、10 连击特效）。
#
ui:
  isHud: true
  defaultOpen: true
  action:
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
  packetHandler:
    # packetHandler: combo
    # 包字段:
    #   - combo_count: 当前连击数（整数字符串，由服务端 {combo_count} 变量替换后传入）
    # 说明: 普通连击处理器，更新连击数字并显示；
    #       3 秒内无新连击则自动隐藏并清零
    combo: |-
      var.combo_count = Cast.toInt(packet['combo_count'])
      var.combo_show = true
      var.combo_time = Time.currentTime()
      async {
        while (true) {
          Thread.sleep(500)
          if (Time.currentTime() - var.combo_time > 3000) {
            var.combo_show = false
            var.combo_count = 0
            break
          }
        }
      }
    # packetHandler: combo_milestone
    # 包字段:
    #   - combo_count: 当前连击数（整数字符串，由服务端 {combo_count} 变量替换后传入）
    # 说明: 里程碑连击处理器，更新连击数字并播放里程碑特效动画（显示 2 秒）；
    #       3 秒内无新连击则自动隐藏并清零
    combo_milestone: |-
      var.combo_count = Cast.toInt(packet['combo_count'])
      var.combo_show = true
      var.combo_time = Time.currentTime()
      val.milestone_fx.visible = true
      async {
        Thread.sleep(2000)
        val.milestone_fx.visible = false
      }
      async {
        while (true) {
          Thread.sleep(500)
          if (Time.currentTime() - var.combo_time > 3000) {
            var.combo_show = false
            var.combo_count = 0
            break
          }
        }
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      width: 1920
      height: 1080
      point: ~top_center
      through: true
    children:
      战斗视口:
        type: Canvas
        attribute:
          point: ~top_left
          width: 1920
          height: "var.viewH"
          through: true
        children:
          # 右侧边缘的战术读数；里程碑贴图放在数字上方，不遮挡实时计数。
          连击展示区:
            type: Canvas
            attribute:
              point: ~middle_right
              x: "var.offX - 48"
              y: -90
              width: 256
              height: 184
              visible: "server.combo_count > 0 || var.combo_show"
              through: true
            children:
              连击背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~24,25,28,228
                  shape: ~round_rect
                  radius: 4
                  through: true
              暖银顶线:
                type: Texture
                attribute:
                  point: ~top_left
                  x: 20
                  y: 0
                  width: 216
                  height: 2
                  normal: ~213,195,167,255
                  through: true
              连击侧标:
                type: Texture
                attribute:
                  point: ~top_right
                  width: 3
                  height: 184
                  normal: "val.milestone_fx.visible ? '204,99,57,255' : '130,120,106,255'"
                  through: true
              连击标签:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 16
                  texts: ~&7COMBO
                  fontSize: 36
                  through: true
              # 已同步时以服务器变量为准（含 0）；未同步时显示包内计数。
              连击数字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 20
                  y: -4
                  texts: "server.combo_count != none ? '&f' + server.combo_count.round() : '&f' + var.combo_count.round()"
                  fontSize: 100
                  through: true
              连击状态:
                type: Text
                attribute:
                  point: ~bottom_left
                  x: 20
                  y: -16
                  texts: "val.milestone_fx.visible ? '&6里程碑达成' : '&7连击'"
                  fontSize: 36
                  through: true
              里程碑特效:
                type: Texture
                val: milestone_fx
                attribute:
                  point: ~top_center
                  y: -116
                  normal: ~combat_effect/combo_milestone.png
                  middleScale: 1
                  width: 256
                  height: 102
                  visible: false
                  through: true
