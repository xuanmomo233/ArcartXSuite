                  shape: ~round_rect
                  radius: 8
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: ~181,144,114,210
              无匹配提示:
                type: Text
                attribute:
                  point: ~top_left
                  x: 94
                  y: 565
                  texts: ~&8没有匹配的产物
                  fontSize: 36
                  visible: var.recipeCount == 0
                  through: true
              配方滚动区:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 56
                  y: 408
                  width: 416
                  height: 416
                  moveY: "self.parent['滚动条滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['滚动条滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['滚动条滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  配方展示区:
                    type: HGrid
                    val: 配方展示区
                    attribute:
                      x: 4
                      y: 4
                      width: 408
                      column: 6
                      spaceBetweenX: 6
                      spaceBetweenY: 7
                    children:
                      配方原型:
                        type: Slot
                        attribute:
                          entryKey: 0.round()
                          entry: var.recipes[self.entryKey]
                          visible: self.entry != none
                          width: 62
                          height: 62
                          slotType: ~Icon
                          normal: "var.recipeCanCraft[self.entryKey] == 1 ? '87,115,119,255' : '161,124,104,235'"
                          hover: ~190,131,85,255
                          shape: ~round_rect
                          radius: 8
                          seticon: self.setItemIcon(var.recipeJsons[self.entryKey])
                          itemScale: 0.81
                        action:
                          clickLeft: |-
                            if(var.shiftHeld){
                              recipe = var.recipes[self.entryKey]
                              if(recipe != none){
                                for(key in var.allRecipes.keys()){
                                  r = var.allRecipes[key]
                                  if(r['resultItemId'] == recipe['resultItemId']){
                                    Packet.send('AXS:vanilla_furnace', 'place_ingredients', key)
                                    break
                                  }
                                }
                              }
                            } else {
                              var.selectedRecipe = self.entryKey
                              recipe = var.recipes[self.entryKey]
                              if(recipe != none){
                                var.previewGrid = recipe['previewGrid']
                                slot = val.预览输入槽
                                if(slot != none){
                                  slot.seticon()
                                }
                                result = val.预览输出槽
                                if(result != none){
                                  result.setItemIcon(recipe['resultJson'])
                                }
                              }
                            }
                        effect:
                          stroke:
                            width: "var.recipeBookOpen && var.selectedRecipe == self.entryKey ? 4 : 2"
                            color: "var.recipeBookOpen && var.selectedRecipe == self.entryKey ? '251,190,119,255' : '84,91,93,255'"
