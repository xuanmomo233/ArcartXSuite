# ========== 奖励命令节流 ==========
# 各模块的奖励/结算类控制台命令（发奖、签到、结算等）统一进入队列，
# 每 tick 最多执行此条数，削平全服结算等场景的瞬时尖峰。
# 命令仍在主线程执行（Bukkit API 约束），此处仅控制每 tick 的释放速率。
# 调大可减少到账延迟但尖峰更明显；调小反之。设为 0 表示关闭节流（直发）。
command-throttle-per-tick: 20

modules:
  entitytracker:
    enabled: true
    # EntityTracker 实体追踪
    # 功能：Boss 血条追踪、攻击目标 HUD、伤害统计、掉落预览、奖励发放。
    # 依赖：需安装 MythicMobs（Boss 追踪来源）。
    # 配置文件：modules/entitytracker/src/main/resources/arcartx/ui/ 下的 UI YAML。

  combateffect:
    enabled: true
    # CombatEffect 战斗特效
    # 功能：击杀特效粒子 / 音效、伤害飘字（自定义字体 / 颜色 / 暴击标记）。
    # 关联模块：与 MythicLib / AttributePlus 等属性桥接联动，可读取暴击率等属性。
    # 配置文件：modules/combateffect/ 下的 display 配置。

  eventpacket:
    enabled: true
    # EventPacket 规则引擎，在 data/eventpacket/config.yml 订阅事件并配置动作。
    # 跨服副本奖励要求参与节点使用同一套共享 MySQL、Abyss 和 Mail 存储。

  tab:
    enabled: true
    # Tab 在线列表
    # 功能：自定义玩家列表（TAB）显示内容，支持 PlaceholderAPI 变量、分组排序、页脚信息。
    # 注意：需与 ArcartX 客户端配合使用；纯服务端不会生效。

  title:
    enabled: true
    # Title 称号系统
    # 功能：多槽位称号装备、称号属性加成、称号显示与隐藏、称号授予（通过 EventPacket 触发）。
    # 配置文件：ArcartXTitle.yml（称号定义与属性），修改后执行 /axs title reload。

  conversation:
    enabled: true
    # Conversation 对话系统
    # 功能：NPC 对话树、分支选项、对话内执行命令 / 给予物品、条件分支（PlaceholderAPI 条件）。
    # 配置文件：ArcartXConversation.yml（对话定义与桥接），修改后执行 /axs conversation reload。

  announcer:
    enabled: true
    # Announcer 播报系统
    # 功能：定时全服 HUD 公告（顶部横幅）、打字机式逐字字幕、点击执行指令、条件显示（PAPI 条件）。

  pickup:
    enabled: true
    # Pickup 拾取提示
    # 功能：玩家拾取物品时在屏幕中央显示物品图标与名称（类似 RPG 拾取反馈），支持稀有度颜色区分。

  prop:
    enabled: true
    # Prop 快捷道具
    # 功能：将物品绑定为快捷技能道具，右键 / 按键触发，支持冷却、消耗、PlaceholderAPI 条件判断。
    # 依赖：需 MythicMobs（技能来源）或 AttributePlus / MythicLib（属性道具）。

  onlinerewards:
    enabled: true
    # OnlineRewards 在线奖励
    # 功能：累计在线时长奖励、每日签到、连续签到加成、奖励预览与一键领取。

  loginview:
    enabled: true
    # LoginView 登录界面
    # 功能：自定义登录 / 注册 / 改密 UI，支持密码强度验证、验证码、皮肤头像显示。
    # 认证策略由宿主 authentication.yml 管理，LoginView 只负责交互。

  warehouse:
    enabled: true
    # Warehouse 仓库系统
    # 功能：多页个人仓库、共享仓库（公会 / 队伍）、物品搜索、排序、一键整理、跨服同步。
    # 注意：共享仓库权限在模块内部配置中定义。

  mail:
    enabled: true
    # Mail 邮箱系统
    # 功能：玩家间邮件、系统邮件、附件物品 / 货币、CDK 兑换码、一键领取全部、批量删除。

  chat:
    enabled: true
    # Chat 聊天增强
    # 功能：频道划分（世界 / 附近 / 公会 / 私聊）、聊天卡片（EventPacket 触发）、物品展示、聊天过滤、@提及高亮。

  questgps:
    enabled: true
    # QuestGPS 任务导航
    # 功能：接取 / 放弃任务、任务目标追踪、导航箭头 / 距离提示、任务完成自动提交。
    # 通常与 Chemdah 等任务插件配合，通过 GPS 导航至目标 NPC / 坐标。

  map:
    enabled: true
    # Map 地图系统
    # 功能：自定义世界地图 UI、传送锚点解锁 / 传送、自定义路径点（Waypoint）增删、地图缩放与图层切换。

  essentials:
    enabled: true
    # Essentials 基础工具
    # 功能：玩家管理（/tpa /back /spawn /warp）、安全管控（/invsee /mute）、实用工具（/anvil /enderchest /workbench）。
    # UI 菜单：启用后可通过 /menu 或 ESC 暂停菜单呼出快捷面板。

  regions:
    enabled: true
    # Regions 区域保护
    # 功能：40+ 保护标志（破坏 / 放置 / PvP / 火焰蔓延等）、世界规则、成员权限管理、子区域继承、可视化选区工具。
    # 配置文件：模块内部 regions.yml 定义世界与默认规则。

  market:
    enabled: true
    # Market 全球市场
    # 功能：系统商店（固定价格买卖）、玩家拍卖行（竞拍 / 一口价）、回收商店（自动估价回收物品）。
    # 特性：多货币支持（见 currencies 配置）、跨服同步（需 cross-server 开启）、历史交易记录。

  qqbot:
    enabled: true
    # QQBot QQ 群服互联
    # 功能：OneBot 11 协议对接，QQ 群消息 ↔ 服务器聊天同步、账号绑定、白名单登录控制、群指令查询玩家信息。
    # 前置：需独立 OneBot 实现（如 go-cqhttp / LLOneBot）并填写连接地址与 Token。

  menu:
    enabled: true
    # Menu 通用菜单系统
    # 功能：配置驱动的 ArcartX UI 菜单，支持 ESC 暂停界面替换为自定义菜单、多页面、条件显示、点击执行指令 / 打开子菜单。

  battlepass:
    enabled: true
    # BattlePass 战令系统
    # 功能：免费 / 高级 / 典藏三档通行证、每日 / 每周 / 赛季任务池、等级奖励、赛季制重置、跨服同步。

  fishing:
    enabled: true
    # Fishing 钓鱼系统
    # 功能：星露谷风格钓鱼小游戏（进度条拉扯）、多水域生态（不同水域不同鱼池）、饵料加成、稀有宝藏奖励。

  afkreward:
    enabled: true
    # AfkReward 挂机奖励
    # 功能：多区域挂机奖励、手动/自动 AFK 模式、排行榜、HUD 显示、PlaceholderAPI 变量。

  lottery:
    enabled: true
    # Lottery 抽奖系统
    # 功能：CS 开箱动画、原神祈愿卡池（单抽 / 十连）、保底机制（大小保底）、磨损度系统（影响物品外观价值）。

  vanilla:
    enabled: true
    # VanillaUI 原版界面替换
    # 功能：将原版工作台 / 熔炉界面替换为 ArcartX 自定义 UI，熔炉状态实时推送到客户端。
    # 配置文件：ArcartXVanilla.yml（crafting / furnace 启用开关与 UI id），UI 文件位于模块内 arcartx/ui/。

  tooltip:
    enabled: true
    # Tooltip 物品提示数据采集
    # 功能：接收客户端 Forge mod（ArcartX-Suite-Tooltips）发送的 AXS_TOOLTIP_DATA 网络包，缓存物品 tooltip 文本行与结构化数据，并通过 TooltipDataCapable 能力供其他模块（如 Chat 聊天物品预览）查询；支持将 tooltip 文本注入物品 NBT Lore。
    # 枪械浏览：客户端悬停 TACZ 配件按"查看支持枪械"键（默认 Shift，可改键）打开界面——gun-list.mode=ax 走服务端 AX UI（ui/gun_list.yml），mod 走客户端本地界面；模式经 axstooltip:gunui 通道推送。
    # 前置：需客户端安装 ArcartX-Suite-Tooltips，否则服务端无法获取 tooltip 数据、枪械浏览不可用。
    # 配置文件：ArcartXTooltip.yml（gun-list.mode）；管理命令 /axs tooltip（status 查看缓存与模式、push <玩家> 手动重推模式）。

  abyss:
    enabled: true
    # Abyss 深渊副本系统
    # 功能：多层 Roguelike 地牢实例（房间/波次/传送门链）、队伍管理与匹配、经济/奖励（金币·祭坛·商店·宝箱）、
    #      副本内 NPC/对话/任务联动、Buff 三选一、排行榜、副本内 HUD 与 UI 面板、设计模式（世界内可视化编辑）。
    # 前置：NPC 实体需 Adyeshach；对话 UI 依赖 conversation（桥 Chemdah），任务导航依赖 questgps（桥 Chemdah 任务）；
    #      怪池支持 vanilla:/mythic: 前缀（mythic 需 MythicMobs）。缺软依赖时降级运行（聊天栏兜底对话、无任务追踪），不影响副本主流程。
    # 配置文件：plugins/ArcartX-Suite/data/abyss/abysses/<id>/（示例副本 example 自动生成）；
    #      abysses/<id>/external/ 下的 Chemdah 会话/任务、questgps 任务文件在模板加载时自动部署到对应插件目录。
    # 命令：/abyss enter|lobby|party|stats|top|design；模块管理 /axs abyss。
