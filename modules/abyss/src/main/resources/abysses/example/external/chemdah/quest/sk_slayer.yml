# Chemdah 任务模板。副本 quests.yml 和 NPC 使用相同的 sk_slayer ID。
# 部署：plugins/Chemdah/core/quest/sk_slayer.yml（abyss 启动/重载时自动部署）
# 任务完成后，副本按 quests.yml 的 on-complete 执行奖励。重复接取按 Chemdah 任务规则设置。

sk_slayer:
  meta:
    name: "讨伐深渊魔物"
    type: "副本委托"
  task:
    kills:
      objective: player kill            # 玩家击杀实体（AEntityDeath 系）
      # 默认计任意击杀。要限定"只算副本怪"可加 condition——支持
      # victim(Entity)/weapon(ItemStack)/position(location)/cause 等条件，
      # 例：victim 配实体类型白名单、position 配副本世界名前缀
      # （abyss 实例世界名 = config.yml abyss.world-prefix + 实例id，默认 axs_abyss_*）。
      # condition:
      #   victim: zombie skeleton spider witch blaze wither_skeleton creeper evoker vindicator ravager wither
      goal:
        amount: 15                      # 击杀 15 只魔物
      addon:
        stats:
          visible: true
        track:
          name: '深渊魔物'
          description: '&7击杀地牢魔物 &c{{ quest progress value task kills }}/{{ quest progress target task kills }}'
  addon:
    axs-view:
      sort-order: 50
      allow-abandon: true
      navigation:
        enabled: false
      # 奖励预览对应副本 rewards.yml 的 quest_pack。
      rewards:
        - type: material
          material: EMERALD
          amount: 5
        - type: material
          material: IRON_INGOT
          amount: 8
        - type: text
          display-name: "货币奖励"
          text: "80"
    track:
      scoreboard: true
    ui:
      icon: iron_sword
      description: |-
        &7深入地牢，击杀 &c15 &7只魔物。
        &7向导·艾琳会按约定支付报酬。
  agent:
    accepted: |
      tell colored "&e[委托] &7已接取：讨伐深渊魔物"
    completed: |
      tell colored "&6[委托] &a讨伐深渊魔物 完成！"
