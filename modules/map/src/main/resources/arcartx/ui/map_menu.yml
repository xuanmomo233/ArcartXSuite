# AXS 资源说明
# 用途: Map 模块默认全屏地图 GUI。
# 前置依赖: ArcartX + Arcart-Suite-Map 客户端 mod；Map 模块启用后会自动注册或导出。
# 启用开关: config.yml -> modules.map.enabled + modules.map.password
# 关联文件: ArcartXMap.yml、ui/map_hud.yml
# 重载命令: /axs map reload
#
# 大地图渲染由 Arcart-Suite-Map 客户端 mod 完全接管：
#   - UI 的 tick 每帧调用 mapRenderer.setRegion() 传地图渲染区屏幕坐标
#   - mod 在 Screen.render RETURN 往该区域渲染地形、玩家箭头、标记点
#   - mod 内部处理滚轮缩放、拖拽平移、锚点点击

ui:
  isHud: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.selectedWorldId = packet['selectedWorldId']
      var.selectedWorldName = packet['selectedWorldName']
      var.litEnabled = packet['litEnabled']
      var.litRegions = packet['litRegions']
      var.worldRows = packet['worldRows']
      var.anchorRows = packet['anchorRows']
      var.waypointRows = packet['waypointRows']
      var.externalTargetRows = packet['externalTargetRows']
      var.waypointLimit = packet['waypointLimit']
      var.waypointCount = packet['waypointCount']
      var.canCreateWaypoint = packet['canCreateWaypoint']
      var.clearTrackVisible = packet['clearTrackVisible']
      var.trackingText = packet['trackingText']
      var.detailSelectedType = packet['detailSelectedType']
      var.detailSelectedId = packet['detailSelectedId']
      var.detailTitle = packet['detailTitle']
      var.detailDescription = packet['detailDescription']
      var.detailUnlocked = packet['detailUnlocked']
      var.detailUnlockCostText = packet['detailUnlockCostText']
      var.detailTeleportCostText = packet['detailTeleportCostText']
      var.detailExternalTarget = packet['detailExternalTarget']
      var.detailCanUnlock = packet['detailCanUnlock']
      var.detailCanTeleport = packet['detailCanTeleport']
      var.detailCanTrackAnchor = packet['detailCanTrackAnchor']
      var.detailCanTrackWaypoint = packet['detailCanTrackWaypoint']
      var.detailCanTrackExternal = packet['detailCanTrackExternal']
      var.detailCanDeleteWaypoint = packet['detailCanDeleteWaypoint']
      var.detailCanCreateWaypoint = packet['detailCanCreateWaypoint']
      var.detailClearTrackVisible = packet['detailClearTrackVisible']
      var.detailTrackingText = packet['detailTrackingText']
      var.maxWorldCount = packet['maxWorldCount']
      var.maxAnchorCount = packet['maxAnchorCount']
      var.maxWaypointCount = packet['maxWaypointCount']
      var.maxExternalCount = packet['maxExternalCount']
      var.actionToken = packet['action_token']
      while(val.world_entry.childrenCount() > 1){
        val.world_entry.get(1).remove()
      }
      for(i in range(1, var.maxWorldCount - 1)){
        key = i.round()
        e = val.world_entry['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.anchor_row.childrenCount() > 1){
        val.anchor_row.get(1).remove()
      }
      for(i in range(1, var.maxAnchorCount - 1)){
        key = i.round()
        e = val.anchor_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.waypoint_row.childrenCount() > 1){
        val.waypoint_row.get(1).remove()
      }
      for(i in range(1, var.maxWaypointCount - 1)){
        key = i.round()
        e = val.waypoint_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.external_row.childrenCount() > 1){
        val.external_row.get(1).remove()
      }
      for(i in range(1, var.maxExternalCount - 1)){
        key = i.round()
        e = val.external_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      var.actionBusy = false
      var.actionBusySeconds = 0
      call_syncMarkers()
      call_syncWorldDims()
    update: |-
      var.packetId = packet['packetId']
      var.selectedWorldId = packet['selectedWorldId']
      var.selectedWorldName = packet['selectedWorldName']
      var.litEnabled = packet['litEnabled']
      var.litRegions = packet['litRegions']
      var.worldRows = packet['worldRows']
      var.anchorRows = packet['anchorRows']
      var.waypointRows = packet['waypointRows']
      var.externalTargetRows = packet['externalTargetRows']
      var.waypointLimit = packet['waypointLimit']
      var.waypointCount = packet['waypointCount']
      var.canCreateWaypoint = packet['canCreateWaypoint']
      var.clearTrackVisible = packet['clearTrackVisible']
      var.trackingText = packet['trackingText']
      var.detailSelectedType = packet['detailSelectedType']
      var.detailSelectedId = packet['detailSelectedId']
      var.detailTitle = packet['detailTitle']
      var.detailDescription = packet['detailDescription']
      var.detailUnlocked = packet['detailUnlocked']
      var.detailUnlockCostText = packet['detailUnlockCostText']
      var.detailTeleportCostText = packet['detailTeleportCostText']
      var.detailExternalTarget = packet['detailExternalTarget']
      var.detailCanUnlock = packet['detailCanUnlock']
      var.detailCanTeleport = packet['detailCanTeleport']
      var.detailCanTrackAnchor = packet['detailCanTrackAnchor']
      var.detailCanTrackWaypoint = packet['detailCanTrackWaypoint']
      var.detailCanTrackExternal = packet['detailCanTrackExternal']
      var.detailCanDeleteWaypoint = packet['detailCanDeleteWaypoint']
      var.detailCanCreateWaypoint = packet['detailCanCreateWaypoint']
      var.detailClearTrackVisible = packet['detailClearTrackVisible']
      var.detailTrackingText = packet['detailTrackingText']
      var.maxWorldCount = packet['maxWorldCount']
      var.maxAnchorCount = packet['maxAnchorCount']
      var.maxWaypointCount = packet['maxWaypointCount']
      var.maxExternalCount = packet['maxExternalCount']
      var.actionToken = packet['action_token']
      while(val.world_entry.childrenCount() > 1){
        val.world_entry.get(1).remove()
      }
      for(i in range(1, var.maxWorldCount - 1)){
        key = i.round()
        e = val.world_entry['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.anchor_row.childrenCount() > 1){
        val.anchor_row.get(1).remove()
      }
      for(i in range(1, var.maxAnchorCount - 1)){
        key = i.round()
        e = val.anchor_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.waypoint_row.childrenCount() > 1){
        val.waypoint_row.get(1).remove()
      }
      for(i in range(1, var.maxWaypointCount - 1)){
        key = i.round()
        e = val.waypoint_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      while(val.external_row.childrenCount() > 1){
        val.external_row.get(1).remove()
      }
      for(i in range(1, var.maxExternalCount - 1)){
        key = i.round()
        e = val.external_row['地图项目'].copy('地图项目' + key)
        e.entryKey = key
      }
      var.actionBusy = false
      call_syncMarkers()
      call_syncWorldDims()
  action:
    load: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      var.scale = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / var.scale
      var.viewH = Screen.getHeight() / var.scale
      var.offX = (var.viewW - 1920) / 2
      var.mapMod = none
      var.mapRenderer = none
      try {
        var.mapRenderer = axsmap.getMapRenderer()
      } catch(e) {
      }
      var.syncMarkers = -> {
        if(var.mapRenderer == none) { return }
        var.mapRenderer.clearMarkers()
        if(var.anchorRows != none) {
          for(key in var.anchorRows.keys()) {
            row = var.anchorRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'anchor', row['displayName'], row['x'], row['z'], row['selected'], row['tracked'], row['unlocked'])
            }
          }
        }
        if(var.waypointRows != none) {
          for(key in var.waypointRows.keys()) {
            row = var.waypointRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'waypoint', row['name'], row['x'], row['z'], row['selected'], row['tracked'], true)
            }
          }
        }
        if(var.externalTargetRows != none) {
          for(key in var.externalTargetRows.keys()) {
            row = var.externalTargetRows[key]
            if(row != none) {
              var.mapRenderer.addMarker(row['id'], 'external', row['name'], row['x'], row['z'], row['selected'], row['tracked'], true)
            }
          }
        }
      }
      var.call_syncMarkers = -> {
        if(var.syncMarkers != none) { var.syncMarkers() }
      }
      // 世界ID→MC维度映射下发给 mod（服务端 packet 的 worldRows[].dimension），
      // mod 用它把"选中世界"匹配到对应维度的地形缓存桶
      var.syncWorldDims = -> {
        if(var.mapRenderer == none) { return }
        if(var.worldRows != none) {
          for(key in var.worldRows.keys()) {
            row = var.worldRows[key]
            if(row != none) {
              dim = row['dimension']
              var.mapRenderer.setWorldDimension('' + row['id'], dim == none ? '' : '' + dim)
            }
          }
        }
        // 点亮区域：litEnabled=false → 传 none（全亮不遮罩）；true → 传已解锁区域并集
        var.mapRenderer.setLitRegions('' + var.selectedWorldId,
          var.litEnabled == true ? var.litRegions : none)
      }
      var.call_syncWorldDims = -> {
        if(var.syncWorldDims != none) { var.syncWorldDims() }
      }
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      var.scale = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / var.scale
      var.viewH = Screen.getHeight() / var.scale
      var.offX = (var.viewW - 1920) / 2
    tick: |-
      if(var.mapRenderer != none) {
        // 主面板 top_left x:-offX y:0 铺满窗口，地图渲染区在主面板里 x:24 y:120
        // 地图渲染区在 Adaptive 设计坐标系 = (-offX + 24, 120)
        // 屏幕坐标 = (offX + (-offX + 24)) * scale = 24 * scale
        mapX = 24 * var.scale
        mapY = 120 * var.scale
        mapW = (var.viewW - 540) * var.scale
        mapH = (var.viewH - 144) * var.scale
        var.mapRenderer.setRegion(mapX, mapY, mapW, mapH, var.scale)
        var.mapRenderer.setWorldId(var.selectedWorldId)
      }
    open: |-
      var.packetId = 'AXS_MAP'
      var.selectedWorldId = none
      var.selectedWorldName = '未选择'
      var.worldRows = {}
      var.anchorRows = {}
      var.waypointRows = {}
      var.externalTargetRows = {}
      var.waypointLimit = 0
      var.waypointCount = 0
      var.canCreateWaypoint = false
      var.clearTrackVisible = false
      var.trackingText = '当前未导航'
      var.detailSelectedType = 'none'
      var.detailSelectedId = none
      var.detailTitle = '未选中目标'
      var.detailDescription = '请选择一个锚点或路径点。'
      var.detailUnlocked = true
      var.detailUnlockCostText = none
      var.detailTeleportCostText = none
      var.detailExternalTarget = false
      var.detailCanUnlock = false
      var.detailCanTeleport = false
      var.detailCanTrackAnchor = false
      var.detailCanTrackWaypoint = false
      var.detailCanTrackExternal = false
      var.detailCanDeleteWaypoint = false
      var.detailCanCreateWaypoint = false
      var.detailClearTrackVisible = false
      var.detailTrackingText = '当前未导航'
      var.maxWorldCount = 0
      var.maxAnchorCount = 0
      var.maxWaypointCount = 0
      var.maxExternalCount = 0
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
    close: |-
      if(var.mapRenderer != none) {
        var.mapRenderer.deactivate()
      }
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }

controls:
  # 全屏高模糊不透明毛玻璃背景
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: "~Frosted:24;30,32,38,200"
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          y: 0
          width: "var.viewW"
          height: "var.viewH"
        children:
          # ─── 顶栏 ───
          顶栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 0
              y: 0
              width: "var.viewW"
              height: 96
            children:
              顶栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "~Frosted:30;255,255,255,100"
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,40
              标题色块:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 36
                  width: 6
                  height: 44
                  normal: ~232,180,90,255
                  shape: ~round_rect
                  radius: 3
              地图菜单标题:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 60
                  texts: "'&f地图总览 &8/ &7' + var.selectedWorldName"
                  fontSize: 36
              追踪文字:
                type: Text
                attribute:
                  point: ~middle_center
                  x: -260
                  texts: "'&b' + var.trackingText"
                  fontSize: 32
              # ─── 小地图设置组（直接调客户端 mod，不发包） ───
              小地图设置标签:
                type: Text
                attribute:
                  point: ~middle_left
                  x: "var.viewW - 838"
                  texts: ~&7小地图
                  fontSize: 32
              形状按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.viewW - 718"
                  y: 24
                  width: 110
                  height: 48
                  enable: "var.mapRenderer != none"
                action:
                  clickLeft: |-
                    if (var.mapRenderer != none) {
                      var.mapRenderer.toggleHudShape()
                    }
                children:
                  形状按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~52,56,64,255
                      hover: ~72,76,84,255
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  形状按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.mapRenderer != none && ('' + var.mapRenderer.getHudShape()) == 'CIRCLE' ? '&f圆形' : '&f方形'"
                      fontSize: 32
                      through: true
              大小减按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.viewW - 596"
                  y: 24
                  width: 48
                  height: 48
                  enable: "var.mapRenderer != none"
                action:
                  clickLeft: |-
                    if (var.mapRenderer != none) {
                      var.mapRenderer.adjustHudSize(-25)
                    }
                children:
                  大小减底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~52,56,64,255
                      hover: ~72,76,84,255
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  大小减字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f-
                      fontSize: 32
                      through: true
              大小值文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: "var.viewW - 538"
                  texts: "var.mapRenderer != none ? '&f' + var.mapRenderer.getHudSize().round() + '&8px' : '&8-'"
                  fontSize: 32
              大小加按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.viewW - 462"
                  y: 24
                  width: 48
                  height: 48
                  enable: "var.mapRenderer != none"
                action:
                  clickLeft: |-
                    if (var.mapRenderer != none) {
                      var.mapRenderer.adjustHudSize(25)
                    }
                children:
                  大小加底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~52,56,64,255
                      hover: ~72,76,84,255
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  大小加字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f+
                      fontSize: 32
                      through: true
              缩放减按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.viewW - 382"
                  y: 24
                  width: 48
                  height: 48
                  enable: "var.mapRenderer != none"
                action:
                  clickLeft: |-
                    if (var.mapRenderer != none) {
                      var.mapRenderer.adjustHudZoom(0.8)
                    }
                children:
                  缩放减底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~52,56,64,255
                      hover: ~72,76,84,255
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  缩放减字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f-
                      fontSize: 32
                      through: true
              缩放值文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: "var.viewW - 324"
                  texts: "var.mapRenderer != none ? '&f' + (var.mapRenderer.getHudZoom() * 100).round() + '&8%' : '&8-'"
                  fontSize: 32
              缩放加按钮:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.viewW - 252"
                  y: 24
                  width: 48
                  height: 48
                  enable: "var.mapRenderer != none"
                action:
                  clickLeft: |-
                    if (var.mapRenderer != none) {
                      var.mapRenderer.adjustHudZoom(1.25)
                    }
                children:
                  缩放加底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~52,56,64,255
                      hover: ~72,76,84,255
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '255,255,255,160' : '255,255,255,60'"
                  缩放加字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f+
                      fontSize: 32
                      through: true
              关闭按钮:
                type: Canvas
                attribute:
                  point: ~top_right
                  x: -96
                  y: 24
                  width: 60
                  height: 48
                action:
                  clickLeft: |-
                    Screen.close()
                children:
                  关闭按钮底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~220,80,80,255
                      hover: ~240,100,100,255
                      shape: ~round_rect
                      radius: 12
                  关闭按钮文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f✕
                      fontSize: 36
                      through: true
          # ─── 地图渲染区（mod 渲染地形，在 UI 上层；边框靠外扩环露出） ───
          地图渲染区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 120
              width: "var.viewW - 540"
              height: "var.viewH - 144"
            children:
              # 边框：比地形区外扩 4px。mod 地形画在 UI 上层会盖住内部，
              # 只有外扩的 4px 环露出 → 视觉上是地图外框。
              地图边框:
                type: Texture
                attribute:
                  point: ~top_left
                  x: -4
                  y: -4
                  width: "var.viewW - 540 + 8"
                  height: "var.viewH - 144 + 8"
                  normal: ~255,255,255,0
                  shape: ~round_rect
                  radius: 8
                  through: true
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,140
              地图加载提示:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "'&7地图加载中...'"
                  fontSize: 36
                  through: true
                  visible: "var.mapRenderer == none"
          # ─── 右侧面板 ───
          右侧面板:
            type: Canvas
            attribute:
              point: ~top_left
              x: "var.viewW - 492"
              y: 120
              width: 468
              height: "var.viewH - 144"
            children:
              右侧面板底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "~Frosted:30;255,255,255,100"
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,50
              # 世界列表（横向条）
              世界列表标题:
                type: Text
                attribute:
                  point: ~top_center
                  y: 24
                  texts: ~&f世界列表
                  fontSize: 32
              世界滑块:
                type: Texture
                val: 世界滑块
                attribute:
                  point: ~top_left
                  x: 24
                  y: 122
                  width: 40
                  height: 6
                  normal: ~120,120,120,200
                  shape: ~round_rect
                  radius: 3
                  maxDragX: 380
              世界滚动栏:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 24
                  y: 64
                  width: 420
                  height: 54
                  moveX: "self.parent['世界滑块'].getDragXRatio()"
                action:
                  wheel: |-
                    if(self.moveX >= 0 && self.wheelValue > 0){
                      self.parent['世界滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveX <= 1 && self.wheelValue < 0){
                      self.parent['世界滑块'].setDragXRatio((self.moveX - self.wheelValue * 0.1).round(1))
                    }
                children:
                  world_list:
                    val: world_entry
                    type: HStack
                    attribute:
                      height: 60
                      spaceBetween: 8
                    children:
                      地图项目:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.worldRows[self.entryKey]
                          visible: self.entry != none
                          width: 148
                          height: 60
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'open_world', self.entry['id'])
                        children:
                          地图项目背景:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: "self.parent.entry != none && self.parent.entry['selected'] ? '74,144,226,255' : '52,56,64,255'"
