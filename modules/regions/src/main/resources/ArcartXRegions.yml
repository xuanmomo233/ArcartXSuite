# 配置版本号（请勿手动修改）
config-version: 4
# 区域保护模块
# 区域、成员、旗标和世界默认规则保存在同目录的 regions.yml。
# 修改文件后执行 /axs reload regions。

debug: false

# 选区工具
selection:
  # 选区工具物品 (MATERIAL 名)
  wand-item: WOODEN_AXE
  # 最大选区体积 (方块数)
  max-volume: 500000
  # 每个玩家最大区域数 (0=无限)
  max-regions-per-player: 20

# 区域默认设置
defaults:
  # 新建区域默认优先级
  priority: 0
  # 每个世界的默认区域 ID（/rg worlddefault <世界> 创建）
  global-region-id: "__global__"

# /rg define <ID> [模板] 或 /rg template apply <模板> <区域>
# 模板仅改动列出的标志。支持 allow、deny、none。
templates:
  spawn:
    block-break: deny
    block-place: deny
    chest-access: deny
    pvp: deny
    mob-spawning: deny
    other-explosion: deny
    tnt: deny
    creeper-explosion: deny
    pistons: deny
  public:
    block-break: deny
    block-place: deny
    use: allow
    chest-access: deny
  claim:
    block-break: deny
    block-place: deny
    use: deny
    chest-access: deny
    damage-animals: deny
  arena:
    block-break: deny
    block-place: deny
    pvp: allow
    tnt: deny
    other-explosion: deny

# 进入/离开提示
notifications:
  # 进出区域是否显示 ActionBar 提示
  show-actionbar: true
  # 进出消息显示方式: actionbar / chat / title
  display-mode: actionbar
