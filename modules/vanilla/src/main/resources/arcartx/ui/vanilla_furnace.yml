# 熔炉 / Craft workshop. Fired-clay kiln, indigo process gauges and paper recipe folio.
ui:
  isHud: false
  match:
    - 熔炉界面
  itemSize: 16
  through: true
  escClose: true
  background: true
  closeDied: true
  show: true
  jei: false
  level: 0
  screenScale: true
  action:
    keyPress: |-
      if(self.currentKeyPress == 'LEFT_SHIFT'){
        var.shiftHeld = true
      }
    keyRelease: |-
      if(self.currentKeyReleased == 'LEFT_SHIFT'){
        var.shiftHeld = false
      }
    load: |-
      var.showAll = true
      var.previewGrid = []
      var.searchText = ''
      var.burnTime = 0
      var.burnTimeTotal = 1
      var.cookTime = 0
      var.cookTimeTotal = 1
      var.recipeCanCraft = {}
      var.recipeJsons = {}
      var.recipes = {}
      var.allRecipes = {}
      var.recipeCount = 0
      var.刷新轮次 = 0
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.currentCategory = 'all'
      var.needFilterRefresh = false
      var.shiftHeld = false
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
    tick: |-
      if(var.needFilterRefresh){
        var.needFilterRefresh = false
        var.recipes = {}
        var.recipeJsons = {}
        var.recipeCanCraft = {}
        idx = 0.0
        for(key in var.allRecipes.keys()){
          recipe = var.allRecipes[key]
          cat = recipe['category']
          if(var.currentCategory == 'all' || (var.currentCategory == 'misc' && cat != 'food' && cat != 'building') || cat == var.currentCategory){
            name = recipe['resultName']
            zhName = recipe['resultZhName']
            if(var.searchText == '' || (name != none && name.contains(var.searchText)) || (zhName != none && zhName.contains(var.searchText))){
              canCraft = recipe['canCraft']
              if(var.showAll || canCraft == 1){
                var.recipes[idx.round()] = recipe
                var.recipeJsons[idx.round()] = recipe['resultJson']
                var.recipeCanCraft[idx.round()] = canCraft
                idx = idx + 1
              }
            }
          }
        }
        var.recipeCount = idx.round()
        配方数 = idx.round()
        现有控件数 = val.配方展示区.childrenCount()
        if(现有控件数 > 配方数){
          while(val.配方展示区.childrenCount() > 配方数 && val.配方展示区.childrenCount() > 1){
            val.配方展示区.get(val.配方展示区.childrenCount() - 1).remove()
          }
        }
        if(现有控件数 < 配方数){
          var.刷新轮次 = var.刷新轮次 + 1
          for(序号 in range(现有控件数, 配方数 - 1)){
            icon = val.配方展示区['配方原型'].copy('配方图标_' + var.刷新轮次 + '_' + 序号.round())
            icon.entryKey = 序号.round()
          }
        }
        最大数 = 配方数
        for(i in range(0, 最大数 - 1)){
          icon = val.配方展示区.get(i.round())
          if(icon != none){
            icon.entryKey = i.round()
            icon.seticon()
          }
        }
      }
      if(var.selectedRecipe != none){
        item = val.输入槽.getSlotItemStack()
        var.previewVisible = (item == none || item.getType() == 'null' || item.getCount() == 0)
        resultItem = val.输出槽.getSlotItemStack()
        var.resultVisible = (resultItem == none || resultItem.getType() == 'null' || resultItem.getCount() == 0)
      }
    open: |-
      Packet.send('AXS:vanilla_furnace', 'request_recipe_book')
  packetHandler:
    furnace_state: |-
      var.burnTime = packet['burnTime']
      var.burnTimeTotal = packet['burnTimeTotal']
      var.cookTime = packet['cookTime']
      var.cookTimeTotal = packet['cookTimeTotal']
      var.burning = packet['burning']
    recipe_book_toggle: |-
      var.recipeBookOpen = packet['open']
      if(!var.recipeBookOpen){
        var.selectedRecipe = none
      }
      if(packet['recipes'] != none){
        var.allRecipes = packet['recipes']
        var.needFilterRefresh = true
      }
      if(packet['catIcons'] != none){
        var.catIcons = packet['catIcons']
        if(val.配方书按钮 != none) {
          val.配方书按钮.setItemIcon(var.catIcons['book'])
        }
        if(val.显示切换 != none) {
          val.显示切换.setItemIcon(var.catIcons['toggle'])
        }
        if(val.分类栏['分类_全部'] != none) {
          val.分类栏['分类_全部'].setItemIcon(var.catIcons['all'])
        }
        if(val.分类栏['分类_食品'] != none) {
          val.分类栏['分类_食品'].setItemIcon(var.catIcons['food'])
        }
        if(val.分类栏['分类_建筑'] != none) {
          val.分类栏['分类_建筑'].setItemIcon(var.catIcons['building'])
        }
        if(val.分类栏['分类_杂项'] != none) {
          val.分类栏['分类_杂项'].setItemIcon(var.catIcons['misc'])
        }
      }
  defaultOpen: true
