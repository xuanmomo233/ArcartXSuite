# AXS QuestGPS 任务指引 HUD — 紫罗兰重写版
# 用途: 任务追踪时屏幕左上角常驻 HUD，展示任务名、进度条、目标列表
# 风格: 紫罗兰毛玻璃，与 questgps_menu 主菜单统一
# 位置: 左上角偏下（x=16, y=220），避开聊天框/血条/小地图
# 数据: 服务端 QuestGpsGuidePacketFactory 发送 init/update 包，最多3个目标

ui:
  isHud: true
  defaultOpen: false
  background: false
  closeDied: true
  through: true
  screenScale: true
  show: true
  level: 3
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包 ID（用于客户端回传服务端）
    #   - active: HUD 是否激活显示
    #   - questName: 当前追踪任务名称
    #   - completedCount: 已完成目标数
    #   - totalCount: 总目标数
    #   - progressText: 进度文本（如 "2/5"）
    #   - tasks: 任务目标字典（key=目标ID，value含id/text/description/completed/status字段）
    #   - taskCount: 目标总数（最多3）
    #   - navWorld: 导航点所在世界名
    #   - navX: 导航点 X 坐标
    #   - navY: 导航点 Y 坐标
    #   - navZ: 导航点 Z 坐标
    #   - hasNav: 是否有可用导航点
    init: |-
      var.packetId = packet['packetId']
      var.active = packet['active']
      var.questName = packet['questName']
      var.completedCount = packet['completedCount']
      var.totalCount = packet['totalCount']
      var.progressText = packet['progressText']
      var.tasks = packet['tasks']
      var.taskCount = packet['taskCount']
      var.navWorld = packet['navWorld']
      var.navX = packet['navX']
      var.navY = packet['navY']
      var.navZ = packet['navZ']
      var.hasNav = packet['hasNav']
      var.taskKeys = var.tasks.keys()
      var.taskIndex = 0
      for(key in var.taskKeys){
        item = val.guide_task_list['引导项' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = key
        }
        var.taskIndex = var.taskIndex + 1
      }
      while(var.taskIndex < 3){
        item = val.guide_task_list['引导项' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = none
        }
        var.taskIndex = var.taskIndex + 1
      }
    # packetHandler: update
    # 包字段: 与 init 相同，用于增量更新 HUD 数据
    update: |-
      var.packetId = packet['packetId']
      var.active = packet['active']
      var.questName = packet['questName']
      var.completedCount = packet['completedCount']
      var.totalCount = packet['totalCount']
      var.progressText = packet['progressText']
      var.tasks = packet['tasks']
      var.taskCount = packet['taskCount']
      var.navWorld = packet['navWorld']
      var.navX = packet['navX']
      var.navY = packet['navY']
      var.navZ = packet['navZ']
      var.hasNav = packet['hasNav']
      var.taskKeys = var.tasks.keys()
      var.taskIndex = 0
      for(key in var.taskKeys){
        item = val.guide_task_list['引导项' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = key
        }
        var.taskIndex = var.taskIndex + 1
      }
      while(var.taskIndex < 3){
        item = val.guide_task_list['引导项' + var.taskIndex.round()]
        if(item != none){
          item.entryKey = none
        }
        var.taskIndex = var.taskIndex + 1
      }
  action:
    load: |-
      var.tasks = {}
      var.packetId = 'AXS_QUESTGPS'
      var.active = false
      var.questName = '当前未追踪任务'
      var.completedCount = 0
      var.totalCount = 0
      var.progressText = '0/0'

# ─── 控件树 ────────────────────────────────────────────────────────
# 布局: Adaptive stretch_all + 左上角偏下面板（420宽）
# 结构: 毛玻璃底 + 紫罗兰强调条 + 任务名 + 进度条 + 3个目标项 + 关闭按钮
# 配色: 紫罗兰 主色170,120,220 底28,22,38,210 抬升50,44,68,245 描边170,120,220,240
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      任务面板:
        type: Canvas
        attribute:
          point: ~top_left
          x: 16
          y: 220
          width: 420
          height: 340
          visible: var.active
        effect:
          offsetAnimate:
            duration: 300
            interpolator: decelerate
            x: -440
            y: 0
        children:
          # ── 面板背景 ────────────────────────────────
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~20,16,30,235
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 3
                color: ~170,120,220,240
          # 紫罗兰强调条（左侧竖条）
          强调条:
            type: Texture
            attribute:
              point: ~top_left
              x: 0
              y: 0
              width: 5
              height: 340
              normal: ~170,120,220,255
              shape: ~round_rect
              radius: 4
          # ── 任务头部（任务名左 + 进度文字右）─────────
          任务图标:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 16
              texts: "~&f⬡"
              fontSize: 32
              through: true
          任务名称:
            type: Text
            attribute:
              point: ~top_left
              x: 48
              y: 16
              texts: "'&f' + var.questName"
              fontSize: 32
              through: true
          进度文字:
            type: Text
            attribute:
              point: ~top_right
              x: -16
              y: 16
              texts: "'&f' + var.progressText"
              fontSize: 32
              through: true
          # ── 进度条（横跨面板，任务名下方）────────────
          进度条背景:
            type: Texture
            attribute:
              point: ~top_left
              x: 16
              y: 52
              width: 388
              height: 12
              normal: ~50,40,60,220
              shape: ~round_rect
              radius: 6
          进度条填充:
            type: Texture
            attribute:
              point: ~top_left
              x: 16
              y: 52
              width: "var.totalCount > 0 ? math.max(12, 388 * var.completedCount / var.totalCount) : 12"
              height: 12
              normal: ~170,120,220,235
              shape: ~round_rect
              radius: 6
          # ── 头部分隔线 ──────────────────────────────
          头部分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 16
              y: 72
              width: 388
              height: 2
              normal: ~170,120,220,180
          # ── 目标列表（3个固定槽位）──────────────────
          任务列表:
            val: guide_task_list
            type: VStack
            attribute:
              point: ~top_left
              x: 16
              y: 84
              width: 388
              spaceBetween: 4
            children:
              引导项0:
                type: Canvas
                attribute:
                  point: ~top_left
                  width: 388
                  height: 66
                  entryKey: none
                  visible: self.entryKey != none && var.tasks[self.entryKey] != none
                  entry: var.tasks[self.entryKey]
                children:
                  项背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~40,32,56,200
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 2
                        color: ~170,120,220,160
                  状态图标:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 8
                      y: 4
                      texts: "self.parent.entry != none ? (self.parent.entry['completed'] ? '&a✓' : '&f◈') : none"
                      fontSize: 48
                      through: true
                  任务文字:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 36
                      y: 8
                      texts: "self.parent.entry != none ? (self.parent.entry['completed'] ? '&f&m' + self.parent.entry['text'] : '&f' + self.parent.entry['text']) : none"
                      fontSize: 32
                      through: true
                  任务状态:
                    type: Text
                    attribute:
                      point: ~top_right
                      x: -8
                      y: 8
                      texts: "self.parent.entry != none ? (self.parent.entry['completed'] ? '&a已完成' : '&f进行中') : none"
                      fontSize: 32
                      through: true
                  任务描述:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 36
                      y: 36
                      texts: "self.parent.entry != none ? '&f' + self.parent.entry['description'] : none"
                      fontSize: 32
                      through: true
              引导项1:
                type: Canvas
                attribute:
                  point: ~top_left
                  width: 388
