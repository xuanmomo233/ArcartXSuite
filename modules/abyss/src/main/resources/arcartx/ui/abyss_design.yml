        attribute:
          point: ~top_right
          x: "-72 + var.offX"
          y: 262
          width: 6
          height: "var.viewH - 412"
          normal: ~42,45,44,235
          shape: ~round_rect
          radius: 4
          through: true
      内容滑块:
