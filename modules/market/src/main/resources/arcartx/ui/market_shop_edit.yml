                  height: 52
                  enable: "!var.actionBusy && !var.formLoading && var.actionToken != none && var.actionToken != '' && var.editItemKey != none && var.editItemKey != ''"
                action:
                  clickLeft: |-
                    if(!var.actionBusy && !var.formLoading){
                      var.actionBusy = true
                      form = {}
                      form['revision'] = var.shopRevision
                      form['key'] = var.editItemKey
                      form['type'] = var.fItemType
                      form['displayName'] = var.fItemName
                      form['buyPrice'] = var.fBuyPrice
                      form['sellPrice'] = var.fSellPrice
                      form['currency'] = var.fCurrency
                      form['restockInterval'] = var.fRestockInterval
                      form['applyStock'] = var.applyStock
                      form['stockMode'] = var.fStockMode
                      form['stockAmount'] = var.fStockAmount
                      form['limitPerPlayer'] = var.fLimit
                      form['limitReset'] = var.fLimitReset
                      form['conditions'] = var.fConditions
                      form['commands'] = var.fCommands
                      form['discounts'] = var.fDiscounts
                      form['source'] = var.fItemSource
                      form['itemId'] = var.fItemId
                      form['nbt'] = var.fItemNbt
                      form['iconMode'] = var.fItemIconMode
                      form['iconJson'] = var.fItemIconJson == var.air ? '' : var.fItemIconJson
                      form['iconMaterial'] = ''
                      flag = var.itemNew == true ? '1' : '0'
                      if(var.applyStock){
                        var.pendingSaveShop = var.editShopId
                        var.pendingSaveNew = flag
                        var.pendingSaveJson = json.stringify(form)
                        var.confirmTarget = 'save-stock'
                        var.confirmText = '保存配置并补满实际库存（所有玩家），确定继续？'
                        var.showConfirm = true
                        var.actionBusy = false
                      } else {
                        Packet.send(var.packetId, 'shop_edit_item_save', var.editShopId, flag, json.stringify(form), var.actionToken)
                      }
                    }
                children:
