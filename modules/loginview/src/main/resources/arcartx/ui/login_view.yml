              服规标题:
                type: Text
                attribute: {x: 42, y: 76, texts: ~&f服务器游玩须知, fontSize: 64, through: true}
              阅读提示:
                type: Text
                attribute: {x: 42, y: 148, texts: ~&7滚轮浏览或拖动右侧金色滑块，阅读后确认同意。, fontSize: 36, through: true}
              服规滚动区:
                type: Canvas
