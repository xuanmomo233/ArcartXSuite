              clickLeft: |-
                if(var.page > 0){
                  Packet.send(var.packetId, 'auction_list', (var.page - 1), var.currentCategory, var.search)
                }
            children:
              上一页底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~251,248,239,255
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 1
