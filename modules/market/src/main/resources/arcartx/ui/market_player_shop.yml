# AXS Market — 玩家商店浏览界面
# 打开方式: /market pshop 或导航跳转
# 布局: 玩家柜台 — 卖家目录 / 商品检索 / 双列报价卡 / 固定分页
# 配色: 暖象牙纸面 + 森林绿柜台 + 黄铜强调
# 数据交互: packetHandler pshop_list / pshop_sellers

ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: pshop_list
    # 商品列表包，接收服务端推送的商品数据
    # 包字段:
    #   - packetId: 数据包通信 ID
    #   - page: 当前页码
    #   - totalPages: 总页数
    #   - pageText: 页码显示文本
    #   - keyword: 搜索关键词
    #   - sellerUuid: 当前选中的卖家 UUID
    #   - listings: 商品列表字典（key=序号, value=商品对象）
    #   - listingTexts: 商品显示文本字典
    #   - itemJson{key}: 各商品的 NBT JSON 字符串
    #   - maxItemCount: 商品最大数量
    #   - action_token: 操作令牌
    pshop_list: |-
      var.itemJsons = {}
      oldMaxItemCount = var.maxItemCount
      var.packetId = packet['packetId']
      var.page = packet['page']
      var.totalPages = packet['totalPages']
      var.pageText = packet['pageText']
      var.keyword = packet['keyword']
      var.sellerUuid = packet['sellerUuid']
      var.listings = packet['listings']
      var.listingTexts = packet['listingTexts']
      var.maxItemCount = packet['maxItemCount']
      var.actionToken = packet['action_token']
      for(key in var.listings.keys()){
        json = packet['itemJson' + key]
        if(json != none && json != ''){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      if(var.maxItemCount != oldMaxItemCount){
        for(key in var.listingRefs.keys()){
          var.listingRefs[key].remove()
        }
        var.listingRefs = {}
        var.listingRound = (var.listingRound + 1).round()
        template = val.商品列表.get(0)
        for(i in range(1, var.maxItemCount - 1)){
          key = i.round()
          e = template.copy('商品卡片_' + var.listingRound + '_' + key)
          e.entryKey = key
          var.listingRefs[key] = e
        }
      }
      if(var.maxItemCount > 0){
        val.商品列表.get(0)['商品图标'].seticon()
        for(key in var.listingRefs.keys()){
          var.listingRefs[key]['商品图标'].seticon()
        }
      }
      var.actionBusy = false
    # packetHandler: pshop_sellers
    # 卖家列表包，接收服务端推送的卖家列表
    # 包字段:
    #   - packetId: 数据包通信 ID
    #   - page: 卖家列表页码
    #   - totalPages: 卖家列表总页数
    #   - pageText: 卖家列表页码文本
    #   - sellers: 卖家列表字典（key=序号, value=卖家对象含 uuid/name/activeCount）
    #   - sellerTexts: 卖家显示文本字典
    #   - maxSellerCount: 卖家最大数量
    pshop_sellers: |-
      oldMaxSellerCount = var.maxSellerCount
      var.sellerPage = packet['page']
      var.sellerTotalPages = packet['totalPages']
      var.sellerPageText = packet['pageText']
      var.sellers = packet['sellers']
      var.sellerTexts = packet['sellerTexts']
      var.maxSellerCount = packet['maxSellerCount']
      if(var.maxSellerCount != oldMaxSellerCount){
        while(val.卖家列表.childrenCount() > 1){
          val.卖家列表.get(1).remove()
        }
        if(var.maxSellerCount > 1){
          for(i in range(1, var.maxSellerCount - 1)){
            key = i.round()
            if(val.卖家列表['卖家项'] != none) {
              e = val.卖家列表['卖家项'].copy('卖家项' + key)
              e.entryKey = key
            }
          }
        }
      }
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.listingRefs = {}
      var.listingRound = 0
      var.keyword = ''
      var.packetId = 'AXS_MARKET'
      var.page = 0
      var.pageText = '1/1'
      var.sellerTexts = {}
      var.sellerUuid = ''
      var.totalPages = 1
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.actionBusy = false
      var.actionBusySeconds = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
      var.cardW = (var.scrollW - 20) / 2
    open: |-
      Packet.send(var.packetId, 'pshop_list', '0', '', '')
      Packet.send(var.packetId, 'pshop_sellers', '0')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.scrollW = var.contentW - 72
      var.cardW = (var.scrollW - 20) / 2

