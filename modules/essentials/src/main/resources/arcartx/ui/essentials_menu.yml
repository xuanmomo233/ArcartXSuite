# AXS 资源说明
# 用途: Essentials 玩家功能菜单，支持首页/家/传送点/TPA/设置五个子页面。
# 前置依赖: ArcartX；Essentials 模块启用后自动注册。
# 打开方式: /axs essentials menu
# 数据交互: packetHandler 接收 init 推送；客户端通过 Packet.send('AXS_ESS_MENU', ...) 发送操作指令。
# 布局: 全屏 1920x1080 Adaptive 生活手册 = 欢迎标题 + 横向章节 + 功能工作区
# 视觉规范: 海蓝封面 / 粉笔白纸面 / 深色正文；首页是欢迎枢纽，操作页强调目的地与状态。
# Java List 用 entryKey + get 绑定与引用字典复制，避免无数据模板与 Observer/List 限制。

ui:
  isHud: false
  background: true
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - page: 当前页面 (home/homes/warps/tpa/settings)
    #   - packetId: 服务端回包 ID，用于客户端 Packet.send 回传
    #   - playerName: 玩家名称
    #   - isFlying: 是否正在飞行
    #   - isGod: 是否开启无敌
    #   - isAfk: 是否挂机
    #   - flySpeed: 飞行速度
    #   - walkSpeed: 行走速度
    #   - location: 当前位置信息
    #   - homes: 家列表数据
    #   - homeCount: 家数量
    #   - warps: 传送点列表数据
    #   - warpCount: 传送点数量
    #   - onlinePlayers: 在线玩家列表
    #   - replantEnabled: 自动补种是否开启
    #   - autotoolEnabled: 自动工具切换是否开启
    init: |-
      var.page = packet['page']
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.playerName = packet['playerName']
      var.isFlying = packet['isFlying']
      var.isGod = packet['isGod']
      var.isAfk = packet['isAfk']
      var.flySpeed = packet['flySpeed']
      var.walkSpeed = packet['walkSpeed']
      var.location = packet['location']
      var.homes = packet['homes']
      var.homeCount = packet['homeCount']
      var.warps = packet['warps']
      var.warpCount = packet['warpCount']
      var.onlinePlayers = packet['onlinePlayers']
      var.replantEnabled = packet['replantEnabled']
      var.autotoolEnabled = packet['autotoolEnabled']
      var.rowGeneration = (var.rowGeneration + 1).round()
      if(val.home_data.childrenCount() != math.max(1, var.homes.size())){
        for(key in var.homeRows.keys()){ var.homeRows[key].remove() }
        var.homeRows = {}
        row = val.home_data.get(0)
        for(i in range(1, var.homes.size() - 1)){
          copy = row.copy('home_' + var.rowGeneration + '_' + i.round())
          copy.entryKey = i.round()
          var.homeRows[i.round()] = copy
        }
      }
      if(val.warp_data.childrenCount() != math.max(1, var.warps.size())){
        for(key in var.warpRows.keys()){ var.warpRows[key].remove() }
        var.warpRows = {}
        row = val.warp_data.get(0)
        for(i in range(1, var.warps.size() - 1)){
          copy = row.copy('warp_' + var.rowGeneration + '_' + i.round())
          copy.entryKey = i.round()
          var.warpRows[i.round()] = copy
        }
      }
      if(val.tpa_data.childrenCount() != math.max(1, var.onlinePlayers.size())){
        for(key in var.tpaRows.keys()){ var.tpaRows[key].remove() }
        var.tpaRows = {}
        row = val.tpa_data.get(0)
        for(i in range(1, var.onlinePlayers.size() - 1)){
          copy = row.copy('tpa_' + var.rowGeneration + '_' + i.round())
          copy.entryKey = i.round()
          var.tpaRows[i.round()] = copy
        }
      }
  action:
    load: |-
      var.homes = {}
      var.warps = {}
      var.onlinePlayers = {}
      var.actionToken = ''
      var.flySpeed = '0'
      var.homeCount = '0'
      var.packetId = 'AXS_ESS_MENU'
      var.walkSpeed = '0'
      var.warpCount = '0'
      var.homeRows = {}
      var.warpRows = {}
      var.tpaRows = {}
      var.rowGeneration = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.hubW = var.viewW - 208
      var.tabW = (var.viewW - 224) / 5
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.hubW = var.viewW - 208
      var.tabW = (var.viewW - 224) / 5
    open: |-
      Packet.send(var.packetId, 'refresh', 'home')

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  手册封面:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~16,49,69,255
  # 自适配布局：宽高 = 设计分辨率 1920x1080，窗口分辨率变化时按比例缩放子控件
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # 主面板：随视口延伸的手册纸面
      主面板:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 40
          width: "var.viewW - 96"
          height: "var.viewH - 80"
        children:
          面板底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~239,241,233,255
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # ── 标题栏 ───────────────────────────────────────
          标题栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 0
              y: 0
              width: "self.parent.width"
              height: 96
            children:
              标题栏底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~22,64,86,255
                  shape: ~round_rect
                  radius: 14
              标题栏底线:
                type: Texture
                attribute:
                  point: ~horizontal_stretch_bottom
                  height: 1
                  normal: ~224,233,231,255
              标题色块:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 24
                  width: 6
                  height: 32
                  normal: ~80,180,255,255
                  shape: ~round_rect
                  radius: 3
              标题:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 44
                  texts: "~&fESS / 生活手册"
                  fontSize: 48
              标题竖线:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 404
                  width: 1
                  height: 26
                  normal: ~224,233,231,255
              标题玩家:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 432
                  texts: "'&f' + var.playerName + '  &7/  日常工具与目的地'"
                  fontSize: 36
              关闭按钮:
                type: Canvas
                attribute:
                  point: ~middle_right
                  x: -24
                  width: 104
                  height: 48
                action:
                  clickLeft: |-
                    Screen.close()
                children:
                  关闭背景:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~29,111,147,255
                      hover: ~36,128,160,255
                      shape: ~round_rect
                      radius: 9
                    effect:
                      stroke:
                        width: 2
                        color: "self.isHovered() ? '235,100,100,255' : '255,255,255,230'"
                  关闭文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f关闭"
                      fontSize: 36
                      through: true

          # ── 左侧导航 ─────────────────────────────────────
          导航栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: 32
              y: 112
              width: "var.viewW - 160"
              height: 76
            children:
              导航底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~224,231,228,255
              导航底线:
                type: Texture
                attribute:
                  point: ~horizontal_stretch_bottom
                  height: 2
                  normal: ~184,205,210,255
              # 首页
              导航首页:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 8
                  y: 8
                  width: "var.tabW"
                  height: 60
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'home')
                children:
                  首页底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'home' ? '29,111,147,255' : '224,231,228,255'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "self.parent.isHovered() ? '29,111,147,255' : '184,205,210,255'"
                  首页文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'home' ? '&f01 / 欢迎' : '&801 / 欢迎'"
                      fontSize: 36
                      through: true
              # 家列表
              导航家列表:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.tabW + 20"
                  y: 8
                  width: "var.tabW"
                  height: 60
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'homes')
                children:
                  家列表底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'homes' ? '29,111,147,255' : '224,231,228,255'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "self.parent.isHovered() ? '29,111,147,255' : '184,205,210,255'"
                  家列表文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'homes' ? '&f02 / 我的家' : '&802 / 我的家'"
                      fontSize: 36
                      through: true
              # 传送点
              导航传送点:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.tabW * 2 + 32"
                  y: 8
                  width: "var.tabW"
                  height: 60
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'warps')
                children:
                  传送点底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'warps' ? '29,111,147,255' : '224,231,228,255'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "self.parent.isHovered() ? '29,111,147,255' : '184,205,210,255'"
                  传送点文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'warps' ? '&f03 / 公共传送点' : '&803 / 公共传送点'"
                      fontSize: 36
                      through: true
              # 传送请求
              导航传送请求:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.tabW * 3 + 44"
                  y: 8
                  width: "var.tabW"
                  height: 60
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'tpa')
                children:
                  传送请求底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'tpa' ? '29,111,147,255' : '224,231,228,255'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "self.parent.isHovered() ? '29,111,147,255' : '184,205,210,255'"
                  传送请求文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'tpa' ? '&f04 / 与朋友同行' : '&804 / 与朋友同行'"
                      fontSize: 36
                      through: true
              # 设置
              导航设置:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: "var.tabW * 4 + 56"
                  y: 8
                  width: "var.tabW"
                  height: 60
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'navigate', 'settings')
                children:
                  设置底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.page == 'settings' ? '29,111,147,255' : '224,231,228,255'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: 2
                        color: "self.parent.isHovered() ? '29,111,147,255' : '184,205,210,255'"
                  设置文字:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 20
                      texts: "var.page == 'settings' ? '&f05 / 日常工具' : '&805 / 日常工具'"
                      fontSize: 36
                      through: true
              导航提示:
                type: Text
                attribute:
                  point: ~bottom_left
                  x: 8
                  y: "var.viewH - 292"
                  texts: "~&8ESSENTIALS / ESC 关闭手册"
                  fontSize: 36
                  through: true

          # ── 右侧内容区 ───────────────────────────────────
          内容区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 32
              y: 216
              width: "var.viewW - 160"
              height: "var.viewH - 336"
            children:
              # ─── 首页视图 ───
              首页布局:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 24
                  width: "var.hubW"
                  height: "var.viewH - 384"
                  visible: |-
                    var.page == 'home'
                children:
                  首页标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      texts: "'&0你好，' + var.playerName"
                      fontSize: 72
                  欢迎说明:
                    type: Text
                    attribute:
                      point: ~top_left
                      y: 76
                      texts: "~&8欢迎回来。看看当前状态，或从上方章节选择今天的目的地。"
                      fontSize: 36
                      through: true
                  出行指南:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: "var.hubW * 0.66"
                      y: 124
                      width: "var.hubW * 0.34"
                      height: 444
                    children:
                      指南底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~22,64,86,255
                          shape: ~round_rect
                          radius: 12
                      指南标题:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 28
                          y: 28
                          texts: "~&f今天，去哪里？"
                          fontSize: 54
                          through: true
                      指南家数量:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 28
                          y: 104
                          texts: "'&b' + var.homeCount + ' &f个家 / 私人落脚点'"
                          fontSize: 36
                          through: true
                      指南传送点数量:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 28
                          y: 160
                          texts: "'&b' + var.warpCount + ' &f个公共传送点'"
                          fontSize: 36
                          through: true
                      指南内容:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 28
                          y: 244
                          texts:
                            - "~&7回家 / 保存或返回家位置"
                            - "~&7同行 / 向在线朋友发起请求"
                            - "~&7工具 / 补种、切换、整理"
                          fontSize: 36
                          through: true
                  # 状态卡片
                  状态卡片:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 124
                      width: "var.hubW * 0.62"
                      height: 444
                    children:
                      状态卡底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~224,233,231,255
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,180
                      状态卡标题:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 24
                          texts: "~&3此刻的你"
                          fontSize: 48
                          through: true
                      状态飞行:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 112
                          texts: "'&8飞行  ' + (var.isFlying == 'true' ? '&3开启' : '&8关闭')"
                          fontSize: 36
                      状态无敌:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: "self.parent.width / 2"
                          y: 112
                          texts: "'&8无敌  ' + (var.isGod == 'true' ? '&3开启' : '&8关闭')"
                          fontSize: 36
                      状态闲置:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 176
                          texts: "'&8挂机  ' + (var.isAfk == 'true' ? '&6是' : '&3否')"
                          fontSize: 36
                      状态速度:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 240
                          texts: "'&8飞行速度 &0' + var.flySpeed + '    &8行走速度 &0' + var.walkSpeed"
                          fontSize: 36
                      状态位置:
                        type: Scroll
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 304
                          width: "self.parent.width - 64"
                          height: 40
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: "self.scrollAnim = Lerp(0, 1, 2200)"
                          leave: "self.scrollAnim = none"
                        children:
                          位置横排:
                            type: HStack
                            attribute:
                              height: 40
                            children:
                              位置文字:
                                type: Text
                                attribute:
                                  texts: "'&8位置  &0' + var.location"
                                  fontSize: 36
                                  through: true
                      状态统计:
                        type: Text
                        attribute:
                          point: ~top_left
                          x: 32
                          y: 372
                          texts: "'&8已保存 &3' + var.homeCount + ' &8个家    /    公共站点 &3' + var.warpCount"
                          fontSize: 36

              # ─── 家列表视图 ───
              家列表布局:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 24
                  width: "var.hubW"
                  height: "var.viewH - 384"
                  visible: |-
                    var.page == 'homes'
                children:
                  家列表标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      texts: "~&0我的家 / 私人落脚点"
                      fontSize: 48
                  设置家按钮:
                    type: Canvas
                    attribute:
                      point: ~top_right
                      x: 0
                      y: -2
                      width: 192
                      height: 56
                      enable: "var.actionToken != none && var.actionToken != ''"
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'set_home', var.actionToken, 'home')
                    children:
                      设置家底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~29,111,147,255
                          hover: ~36,128,160,255
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 2
                            color: "self.isHovered() ? '124,196,142,255' : '255,255,255,230'"
                      设置家文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&f设置家"
                          fontSize: 36
                          through: true
                  家列表说明:
                    type: Text
                    attribute:
                      point: ~top_left
                      y: 60
                      texts: "~&8设置家将当前位置保存为 home；同名会更新位置。"
                      fontSize: 36
                      through: true
                  家空状态:
                    type: Text
                    attribute:
                      point: ~top_left
                      y: 164
                      visible: "var.homeCount == '0'"
                      texts: "~&8还没有保存家。点击右上方设置家，留下第一个落脚点。"
                      fontSize: 36
                      through: true
                  家滑轨:
                    type: Texture
                    attribute:
                      point: ~top_right
                      y: 120
                      width: 12
                      height: "var.viewH - 504"
                      normal: ~194,211,213,255
                      shape: ~round_rect
                      radius: 6
                  家滑块:
                    type: Texture
                    val: 家滑块
                    attribute:
                      point: ~top_right
                      x: 0
                      y: 120
                      width: 12
                      height: 72
                      normal: ~29,111,147,255
                      maxDragY: "var.viewH - 576"
                      shape: ~round_rect
                      radius: 6
                  家滚动栏:
                    type: Scroll
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 120
                      width: "var.hubW - 24"
                      height: "var.viewH - 504"
                      moveY: "self.parent['家滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      homes_list:
                        val: home_data
                        type: VStack
                        attribute:
                          x: 0
                          y: 0
                          width: "var.hubW - 24"
                          spaceBetween: 8
                        children:
                          家项目:
                            type: Canvas
                            attribute:
                              entryKey: 0.round()
                              entry: "self.entryKey < var.homes.size() ? var.homes.get(self.entryKey) : none"
                              visible: self.entry != none
                              width: "var.hubW - 32"
                              height: 96
                            children:
