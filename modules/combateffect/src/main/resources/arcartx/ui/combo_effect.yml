#
# ArcartXSuite CombatEffect - 连击特效 HUD
# combo_sync 接收实时计数，0 表示结束。combo / combo_milestone 保留阈值提示。
#
ui:
  isHud: true
  defaultOpen: true
  packetHandler:
    combo_sync: |-
      var.combo_count = Cast.toInt(packet)
      var.combo_live = var.combo_count > 0
      var.combo_until = none
      if (var.combo_count <= 1) {
        var.milestone_until = none
      }
    # packetHandler: combo
    # 包字段:
    #   - combo_count: 当前连击数（整数字符串，由服务端 {combo_count} 变量替换后传入）
    # 说明: 连击变量未启用时，普通提示显示 3 秒。
    combo: |-
      var.combo_count = Cast.toInt(packet['combo_count'])
      if (var.combo_live != true) {
        var.combo_until = Time.currentTime() + 3000
      }
    # packetHandler: combo_milestone
    # 包字段:
    #   - combo_count: 当前连击数（整数字符串，由服务端 {combo_count} 变量替换后传入）
    # 说明: 里程碑高亮持续 2 秒，连续触发时从最近一次重新计时。
    combo_milestone: |-
      var.combo_count = Cast.toInt(packet['combo_count'])
      now = Time.currentTime()
      var.milestone_until = now + 2000
      if (var.combo_live != true) {
        var.combo_until = now + 3000
      }
  action:
    tick: |-
      if (var.combo_until != none || var.milestone_until != none) {
        now = Time.currentTime()
        if (var.milestone_until != none && now >= var.milestone_until) {
          var.milestone_until = none
        }
        if (var.combo_until != none && now >= var.combo_until) {
          var.combo_until = none
          var.combo_count = 0
        }
      }

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      width: 1920
      height: 1080
      point: ~stretch_all
    children:

      连击展示区:
        type: Canvas
        attribute:
          width: 300
          height: 120
          x: 1560
          y: 350
          point: ~top_left
          visible: "var.combo_count != none && var.combo_count > 0"
        children:

          连击背景:
            type: Texture
            attribute:
              normal: ~0,0,0,120
              shape: ~round_rect
              radius: ~8
              width: 300
              height: 120
              point: ~top_left

          连击数字:
            type: Text
            attribute:
              texts: "(var.milestone_until != none ? '&6' : '&f') + (var.combo_count ?? 0).round()"
              shadow: false
              fontSize: 72
              center: true
              x: 150
              y: 8
              point: ~top_left

          连击标签:
            type: Text
            attribute:
              texts: "'&eCOMBO'"
              shadow: false
              fontSize: 28
              center: true
              x: 150
              y: 80
              point: ~top_left

          里程碑特效:
            type: Texture
            attribute:
              normal: ~0,0,0,0
              shape: ~round_rect
              radius: ~8
              width: 300
              height: 120
              point: ~top_left
              visible: "var.milestone_until != none"
            effect:
              stroke:
                width: 2
                color: ~255,200,84,235
