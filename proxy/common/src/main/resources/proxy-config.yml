# ArcartXSuite Proxy 配置
# 路径: plugins/ArcartXSuite-Proxy/proxy-config.yml

debug: false

# 是否拒绝离线模式玩家登录（基于 UUID 版本粗略判定，后端 AccountTypeServiceImpl 会精确判定）
deny-offline: true
kick-offline-message: "&c本服务器仅支持正版/LittleSkin 账号登录"

# 是否为离线玩家自动分配 UUID（通常保持 true）
auto-assign-uuid: true

# ========== 多方认证（authlib-injector 混合登录）==========
# 群组服混合登录（正版 + LittleSkin）配置。
# 使用 /axsproxy auth setup 生成启动脚本后，用 start-mixed-auth 脚本启动代理端。
#
# 【混合登录流程】
#   1. start-mixed-auth 脚本先独立启动本地 Yggdrasil 混合代理（端口见下方 mixed-proxy-port）
#   2. 脚本再启动 BungeeCord/Velocity，带 -javaagent:authlib-injector.jar=http://127.0.0.1:<端口>
#   3. 玩家连接时，authlib-injector 向本地代理发 hasJoined 请求
#      代理先查 Mojang → 未命中查 LittleSkin，记录每个 UUID 的认证来源
#   4. 玩家进入后端子服时，后端 AXS 的 AccountTypeServiceImpl 查询本地代理获取权威账号类型
#
# 【后端子服配置】
#   后端 Paper 子服的 AXS config.yml 中设置：
#     auth.enabled: true
#     auth.yggdrasil-source: "https://littleskin.cn/api/yggdrasil?mixed"
#     auth.mixed-proxy-port: <与下方相同的端口>
#   注意：后端子服必须与代理端在同一台机器（127.0.0.1）。
auth:
  # 是否启用 authlib-injector 相关功能（混合登录 / 外置登录）。默认禁用。
  enabled: false
  # 启动时自动检测 authlib-injector 版本并提示更新
  auto-check-version: false
  # Yggdrasil 认证源（用于 /axsproxy auth setup 生成启动脚本）
  # 【混合登录】URL 包含 ?mixed 时，AXS 会生成先启动本地混合代理的脚本
  # 【仅外置】改为纯 LittleSkin："https://littleskin.cn/api/yggdrasil"
  yggdrasil-source: "https://littleskin.cn/api/yggdrasil?mixed"
  # 本地混合代理监听端口（固定）。start-mixed-auth 脚本与后端子服都使用此端口。
  # 必须是未被占用的端口（1-65535）。
  mixed-proxy-port: 25599
  # 混合代理监听地址。
  # 【单机群组服】127.0.0.1（默认，仅本机可访问，最安全）
  # 【跨机群组服】改为代理端机器的内网 IP（如 10.0.0.5）或 0.0.0.0（全部网卡）。
  #   跨机模式下强烈建议同时配置 mixed-proxy-token 和 mixed-proxy-allow-ips 防止未授权访问。
  mixed-proxy-bind-host: "127.0.0.1"
  # account-source 接口鉴权 token（跨机模式必配）。
  # 后端子服 config.yml 的 auth.mixed-proxy-token 必须与此处一致。
  # 单机模式（127.0.0.1）无需配置，留空即可。
  mixed-proxy-token: ""
  # 允许访问 account-source 接口的客户端 IP 白名单（跨机模式推荐配置）。
  # 仅列出的 IP 可查询账号类型。单机模式留空即可。
  # 示例：["10.0.0.6", "10.0.0.7"]
  mixed-proxy-allow-ips: []

# Yggdrasil 认证源列表（仅用于 /axsproxy status 显示，不参与实际认证逻辑）
# 实际认证由 authlib-injector + 本地混合代理完成
sources:
  - name: Mojang
    api-url: "https://sessionserver.mojang.com/"
    enabled: true
    allow-offline-fallback: false
  - name: LittleSkin
    api-url: "https://littleskin.cn/api/yggdrasil"
    enabled: true
    allow-offline-fallback: false
