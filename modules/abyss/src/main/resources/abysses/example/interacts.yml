lever_1:
  type: RIGHT_CLICK_BLOCK
  location: "324,62,68"
  required-block: LEVER
lever_2:
  type: RIGHT_CLICK_BLOCK
  location: "331,62,68"
  required-block: LEVER
lever_3:
  type: RIGHT_CLICK_BLOCK
  location: "338,62,68"
  required-block: LEVER
lever_4:
  type: RIGHT_CLICK_BLOCK
  location: "345,62,68"
  required-block: LEVER

# ═══ 战利品宝箱 ═══
abyss_chest:
  type: RIGHT_CLICK_BLOCK
  location: "131,61,75"
  required-block: CHEST
  script:
    - "open_chest_ui @trigger abyss_chest"
    - "sound @trigger BLOCK_CHEST_OPEN 1 1"

abyss_chest3:
  type: RIGHT_CLICK_BLOCK
  location: "531,61,75"
  required-block: CHEST
  script:
    - "open_chest_ui @trigger abyss_chest_t3"   # 终层独立奖池（rewards.yml）
    - "sound @trigger BLOCK_CHEST_OPEN 1 1"
