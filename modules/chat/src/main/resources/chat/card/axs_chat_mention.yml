# ArcartXSuite Chat — @提及通知卡片模板
# 当有人在聊天中 @你 时显示此卡片
# 卡片宽度与高度由 UI 侧根据 Text 控件实际渲染尺寸自适应
root_control:
  type: card
  attribute:
    width: "Math.max(val.title_label.width, val.message_label.width) + 200 < 500 ? 500 : Math.max(val.title_label.width, val.message_label.width) + 200"
    height: "Math.max(100, val.message_label.y + val.message_label.height + 20)"
  children:
    background:
      type: Texture
      attribute:
        width: "self.parent.width"
        height: "self.parent.height"
        normal: ~25,25,35,200
        shape: ~round_rect
        radius: 12
      effect:
        stroke:
          width: 2
          color: ~255,255,255,120
    icon:
      type: Text
      attribute:
        fontSize: 200
        x: 25
        y: "self.parent.height/2 - 5"
        texts: "'§b@'"
        through: true
    title_label:
      type: Text
      val: title_label
      attribute:
        fontSize: 64
        x: 160
        y: 15
        texts: "self.parent.data['senderDisplayName'] + ' §7在 §f' + self.parent.data['channel'] + ' §7中提到了你'"
        through: true
    message_label:
      type: Text
      val: message_label
      attribute:
        fontSize: 64
        x: 160
        y: 60
        through: true
        texts:
          - "'§7' + self.parent.data['msg0']"
          - "self.parent.data['msg1'] != none ? '§7' + self.parent.data['msg1'] : none"
          - "self.parent.data['msg2'] != none ? '§7' + self.parent.data['msg2'] : none"
          - "self.parent.data['msg3'] != none ? '§7' + self.parent.data['msg3'] : none"
          - "self.parent.data['msg4'] != none ? '§7' + self.parent.data['msg4'] : none"
          - "self.parent.data['msg5'] != none ? '§7' + self.parent.data['msg5'] : none"
          - "self.parent.data['msg6'] != none ? '§7' + self.parent.data['msg6'] : none"
          - "self.parent.data['msg7'] != none ? '§7' + self.parent.data['msg7'] : none"
          - "self.parent.data['msg8'] != none ? '§7' + self.parent.data['msg8'] : none"
          - "self.parent.data['msg9'] != none ? '§7' + self.parent.data['msg9'] : none"
