# 模块命令元数据
#
# plugin.yml 只声明核心管理命令 arcartxsuite。模块命令不再预声明，
# 由模块启用时通过 CommandMap 动态注册（模块未启用/被禁用时不占用命令名，
# 避免与其他同功能插件产生命令冲突）。
#
# 结构与 plugin.yml 的 commands 段一致；模块调用
# ModuleContext#registerCommand(name, executor) 时自动套用这里的
# permission/description/usage/aliases。未在此表中的命令名（如
# essentials 配置里用户自定义的 command-aliases）仍可注册，但没有
# Bukkit 层 permission 拦截，由执行器自行校验。
commands:
  ess:
    description: Essentials 玩家命令（/axs essentials 缩写）
    usage: /ess <action> [args...]
    aliases: [axsess]
    permission: axs.essentials.menu
  # ─── Essentials 简写别名（预置，可在 ArcartXEssentials.yml command-aliases 中增删）───
  fly:
    description: 飞行开关
    usage: /<command> [player]
    permission: axs.essentials.fly
  god:
    description: 无敌开关
    usage: /<command> [player]
    permission: axs.essentials.god
  gm:
    description: 游戏模式切换
    usage: /<command> <0|1|2|3|s|c|a|sp|survival|creative|adventure|spectator> [player]
    permission: axs.essentials.gamemode
  heal:
    description: 治疗
    usage: /<command> [player]
    permission: axs.essentials.heal
  feed:
    description: 喂食
    usage: /<command> [player]
    permission: axs.essentials.feed
  tp:
    description: 传送到玩家
    usage: /<command> <player> [target]
    permission: axs.essentials.teleport
  top:
    description: 传送到顶部
    usage: /<command>
    permission: axs.essentials.teleport
  back:
    description: 返回上次位置
    usage: /<command>
    permission: axs.essentials.back
  home:
    description: 传送到家
    usage: /<command> [name]
    permission: axs.essentials.home
  sethome:
    description: 设置家
    usage: /<command> [name]
    permission: axs.essentials.sethome
  delhome:
    description: 删除家
    usage: /<command> [name]
    permission: axs.essentials.delhome
  warp:
    description: 传送到传送点
    usage: /<command> <name>
    permission: axs.essentials.warp
  setwarp:
    description: 设置传送点
    usage: /<command> <name>
    permission: axs.essentials.setwarp
  delwarp:
    description: 删除传送点
    usage: /<command> <name>
    permission: axs.essentials.delwarp
  spawn:
    description: 传送到出生点
    usage: /<command>
    permission: axs.essentials.spawn
  setspawn:
    description: 设置出生点
    usage: /<command>
    permission: axs.essentials.setspawn
  tpa:
    description: 发送传送请求
    usage: /<command> <player>
    permission: axs.essentials.tpa
  tpahere:
    description: 发送传送到此请求
    usage: /<command> <player>
    permission: axs.essentials.tpa
  tpaccept:
    description: 接受传送请求
    usage: /<command>
    permission: axs.essentials.tpa
  tpdeny:
    description: 拒绝传送请求
    usage: /<command>
    permission: axs.essentials.tpa
  tppos:
    description: 传送到坐标
    usage: /<command> <x> <y> <z>
    permission: axs.essentials.teleport
  vanish:
    description: 隐身开关
    usage: /<command>
    permission: axs.essentials.vanish
  hat:
    description: 戴帽子
    usage: /<command>
    permission: axs.essentials.hat
  repair:
    description: 修复手持物品
    usage: /<command>
    permission: axs.essentials.repair
  enderchest:
    description: 打开末影箱
    usage: /<command> [player]
    permission: axs.essentials.enderchest
  workbench:
    description: 打开工作台
    usage: /<command>
    permission: axs.essentials.workbench
  anvil:
    description: 打开铁砧
    usage: /<command>
    permission: axs.essentials.anvil
  trash:
    description: 打开垃圾桶
    usage: /<command>
    permission: axs.essentials.trash
  nick:
    description: 设置昵称
    usage: /<command> <nick|off>
    permission: axs.essentials.nick
  seen:
    description: 查看玩家信息
    usage: /<command> <player>
    permission: axs.essentials.seen
  inv:
    description: 查看玩家背包
    usage: /<command> <player>
    permission: axs.essentials.inv
  sit:
    description: 坐下
    usage: /<command>
    permission: axs.essentials.sit
  lay:
    description: 躺下
    usage: /<command>
    permission: axs.essentials.lay
  sort:
    description: 整理背包
    usage: /<command>
    permission: axs.essentials.sort
  speed:
    description: 设置速度
    usage: /<command> <fly|walk> <1-10>
    permission: axs.essentials.speed
  time:
    description: 设置时间
    usage: /<command> <day|night|noon|midnight|set <ticks>>
    permission: axs.essentials.time
  weather:
    description: 设置天气
    usage: /<command> <clear|rain|thunder>
    permission: axs.essentials.weather
  ban:
    description: 封禁玩家
    usage: /<command> <player> [reason]
    permission: axs.essentials.ban
  tempban:
    description: 临时封禁
    usage: /<command> <player> <duration> [reason]
    permission: axs.essentials.ban
  unban:
    description: 解封玩家
    usage: /<command> <player>
    permission: axs.essentials.unban
  mute:
    description: 禁言
    usage: /<command> <player> [reason]
    permission: axs.essentials.mute
  tempmute:
    description: 临时禁言
    usage: /<command> <player> <duration> [reason]
    permission: axs.essentials.mute
  unmute:
    description: 解除禁言
    usage: /<command> <player>
    permission: axs.essentials.unmute
  kick:
    description: 踢出玩家
    usage: /<command> <player> [reason]
    permission: axs.essentials.kick
  warn:
    description: 警告玩家
    usage: /<command> <player> [reason]
    permission: axs.essentials.warn
  sudo:
    description: 以玩家身份执行命令
    usage: /<command> <player> <command>
    permission: axs.essentials.sudo
  rg:
    description: Regions 玩家命令（/axs regions 缩写）
    usage: /rg <action> [args...]
    aliases: [axsrg]
    permission: axs.regions.select
  afk:
    description: 玩家挂机命令
    usage: /<command> [toggle|status|start <区域>|end|list|top]
    aliases: [axsafk]
    permission: arcartxsuite.afkreward.use
  afkreward:
    description: 玩家挂机奖励命令
    usage: /<command> [toggle|status|start <区域>|end|list|top]
    aliases: [axsafkreward]
    permission: arcartxsuite.afkreward.use
  title:
    description: 玩家称号命令
    usage: /<command> open|equip <titleId>|unequip <groupId|all>|hide <titleId>|unhide <titleId>
    aliases: [axstitle]
    permission: arcartxsuite.title.use
  warehouse:
    description: 玩家仓库命令
    usage: /<command> [open]
    aliases: [wh, axswarehouse]
    permission: arcartxsuite.warehouse.use
  mail:
    description: 玩家邮箱命令
    usage: /<command> open|compose|claimall|deleteall|cdk <code>
    aliases: [axsmail]
    permission: arcartxsuite.mail.use
  chat:
    description: 玩家聊天命令
    usage: /<command> channel|toggle|ignore|unignore|socialspy|redpacket <normal|lucky> <金额> <个数> [祝福]|grab <id>
    aliases: [axschat]
    permission: arcartxsuite.chat.use
  msg:
    description: 玩家私聊命令
    usage: /<command> <player> <message>
    aliases: [axsmsg]
    permission: arcartxsuite.chat.msg
  reply:
    description: 玩家回复私聊命令
    usage: /<command> <message>
    aliases: [r, axsreply]
    permission: arcartxsuite.chat.msg
  onlinerewards:
    description: 玩家在线奖励与签到命令
    usage: /<command> open|status|signin|top <daily|weekly|monthly|total> [page]
    aliases: [axsonlinerewards]
    permission: arcartxsuite.onlinerewards.use
  signin:
    description: 签到命令（onlinerewards 别名）
    usage: /<command> open|status|signin|top <daily|weekly|monthly|total> [page]
    aliases: [axssignin]
    permission: arcartxsuite.onlinerewards.use
  questgps:
    description: 玩家任务导航命令
    usage: /<command> open|cleartrack|hud [on|off|toggle]
    aliases: [axsquestgps]
    permission: arcartxsuite.questgps.use
  tab:
    description: Tab 列表玩家命令（管理命令见 /axs tab）
    usage: /<command> view [name]|page <id> <next|prev|N>|refresh
    aliases: [axstab]
    permission: arcartxsuite.tab.use
  map:
    description: 玩家地图命令
    usage: /<command> open [world]|hud [on|off|toggle]|cleartrack
    aliases: [axsmap]
    permission: arcartxsuite.map.use
  market:
    description: 全球市场命令（拍卖行/系统商店/回收）
    usage: /<command> [shop|auction|sell|recycle|history|my|search|cancel]
    aliases: [mk, ah, axsmarket]
    permission: arcartxsuite.market.use
  pickup:
    description: 玩家拾取功能开关
    usage: /<command> [on|off|status]
    aliases: [axspickup]
    permission: arcartxsuite.pickup.use
  qqbot:
    description: QQ机器人绑定命令
    usage: /<command> bind <验证码>|unbind|info
    aliases: [axsqqbot]
    permission: arcartxsuite.qqbot.use
  menu:
    description: 玩家菜单命令
    usage: /<command> open <菜单ID>|list
    aliases: [axsmenu]
    permission: arcartxsuite.menu.use
  fishing:
    description: 玩家钓鱼命令
    usage: /<command> [sell|sell all]
    aliases: [axsfishing]
    permission: arcartxsuite.fishing.use
  lottery:
    description: 玩家抽奖命令
    usage: /<command> <open|info|history> <奖池ID> | claim | help
    aliases: [axslottery]
    permission: arcartxsuite.lottery.use
  bp:
    description: 玩家战令命令
    usage: /<command> [open|tasks|help]
    aliases: [battlepass, axsbp]
    permission: arcartxsuite.battlepass.use
  abyss:
    description: 深渊地牢命令
    usage: /<command> [enter <地牢>|leave|list|info|stamina|rank [地牢]|party|ui]
    aliases: [axsabyss]
    permission: arcartxsuite.abyss.use
  party:
    description: 地牢队伍命令
    usage: /<command> [create|invite <玩家>|accept|leave|kick <玩家>|leader <玩家>|chat <消息>|list|disband]
    aliases: [axsparty]
    permission: arcartxsuite.abyss.party
