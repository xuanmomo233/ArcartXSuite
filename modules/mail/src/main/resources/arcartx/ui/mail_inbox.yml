# AXS Mail 收件箱（翠绿信使重写版）
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航 + 内容区
# 布局: 左导航(收件箱/日志/写信/兑换码/管理 + 底部摘要) + 内容区(筛选栏 + 邮件列表 + 详情 + 操作栏 + CDK)
# 配色: 翠绿信使 主色80,180,120 底30,32,38,110 抬升36,38,48,245 描边60,64,82,220
# 逻辑: packetHandler/action/val引用/entryKey/copy 与原版一致，仅重构布局结构与配色

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  show: true
  through: false
  screenScale: true
  level: 8
  itemSize: 16
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  action:
    load: |-
      var.messages = {}
      var.filterMode = 'all'
      var.totalCount = 0
      var.unreadCount = 0
      var.claimableCount = 0
      var.selectedId = none
      var.selectedSubject = none
      var.selectedSenderName = none
      var.selectedSourceText = none
      var.selectedStatusText = none
      var.selectedCreatedAt = none
      var.selectedExpiresAt = none
      var.selectedBody = ['&f暂无正文']
      var.selectedAttachmentSummary = '无附件'
      var.selectedClaimable = false
      var.cdkCode = none
      var.maxMailCount = 0
      var.isAdmin = false
      var.actionBusy = false
      var.actionBusySeconds = 0
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    open: |-
      Packet.send('AXS_MAIL', 'refresh')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - messages: 邮件列表（Map，键为索引，每项含 id/subject/sender_name/source_text/status_text/preview/unread/claimable/source_type 等子字段）
    #   - filter_mode: 当前筛选模式（all/unread/claimable/system/player/preset/cdk）
    #   - total_count: 收件箱邮件总数
    #   - unread_count: 未读邮件数
    #   - claimable_count: 可领取邮件数
    #   - selected_id: 当前选中邮件的 ID
    #   - selected_subject: 选中邮件的标题
    #   - selected_sender_name: 选中邮件的发件人名称
    #   - selected_source_text: 选中邮件的来源描述文本
    #   - selected_status_text: 选中邮件的状态描述文本
    #   - selected_created_at: 选中邮件的创建时间
    #   - selected_expires_at: 选中邮件的到期时间
    #   - selected_body: 选中邮件的正文内容（列表形式，每行一个元素）
    #   - selected_attachment_summary: 选中邮件的附件摘要文本
    #   - selected_claimable: 选中邮件是否可领取
    #   - maxMailCount: 邮件列表最大显示条数（用于动态生成列表项）
    #   - is_admin: 当前玩家是否为管理员（控制管理导航项显隐）
    init: |-
      var.messages = packet['messages']
      var.filterMode = packet['filter_mode'] != none ? packet['filter_mode'] : 'all'
      var.totalCount = packet['total_count']
      var.unreadCount = packet['unread_count']
      var.claimableCount = packet['claimable_count']
      var.selectedId = packet['selected_id']
      var.selectedSubject = packet['selected_subject']
      var.selectedSenderName = packet['selected_sender_name']
      var.selectedSourceText = packet['selected_source_text']
      var.selectedStatusText = packet['selected_status_text']
      var.selectedCreatedAt = packet['selected_created_at']
      var.selectedExpiresAt = packet['selected_expires_at']
      var.selectedBody = packet['selected_body']
      var.selectedAttachmentSummary = packet['selected_attachment_summary']
      var.selectedClaimable = packet['selected_claimable']
      var.maxMailCount = packet['maxMailCount']
      var.isAdmin = packet['is_admin']
      var.actionBusy = false
      var.actionBusySeconds = 0
      while(val.mail_list.childrenCount() > 1){
        val.mail_list.get(1).remove()
      }
      for(i in range(1, var.maxMailCount - 1)){
        key = i.round()
        e = val.mail_list['邮件项目'].copy('邮件项目' + key)
        e.entryKey = key
      }
    # packetHandler: update（字段与 init 相同）
    update: |-
      // 保存旧数量，用于判断是否需要重建列表
      oldMaxMailCount = var.maxMailCount
      var.messages = packet['messages']
      var.filterMode = packet['filter_mode'] != none ? packet['filter_mode'] : var.filterMode
      var.totalCount = packet['total_count']
      var.unreadCount = packet['unread_count']
      var.claimableCount = packet['claimable_count']
      var.selectedId = packet['selected_id']
      var.selectedSubject = packet['selected_subject']
      var.selectedSenderName = packet['selected_sender_name']
      var.selectedSourceText = packet['selected_source_text']
      var.selectedStatusText = packet['selected_status_text']
      var.selectedCreatedAt = packet['selected_created_at']
      var.selectedExpiresAt = packet['selected_expires_at']
      var.selectedBody = packet['selected_body']
      var.selectedAttachmentSummary = packet['selected_attachment_summary']
      var.selectedClaimable = packet['selected_claimable']
      var.maxMailCount = packet['maxMailCount']
      var.isAdmin = packet['is_admin']
      var.actionBusy = false
      var.actionBusySeconds = 0
      // ── 邮件列表：仅在数量变化时重建 ──
      if(var.maxMailCount != oldMaxMailCount){
        while(val.mail_list.childrenCount() > 1){
          val.mail_list.get(1).remove()
        }
        for(i in range(1, var.maxMailCount - 1)){
          key = i.round()
          e = val.mail_list['邮件项目'].copy('邮件项目' + key)
          e.entryKey = key
        }
      }

# ─── 控件树 ────────────────────────────────────────────────────────
# 布局: 顶栏(标题色块+标题+关闭) + 左导航(5项+摘要) + 内容区(筛选+列表+详情+操作+CDK)
# 配色: 翠绿信使 深底浅字 — 抬升面36,38,48 凹槽28,30,40 描边60,64,82 强调80,180,120
# fontSize: 48(顶栏标题) / 36(区域标题/按钮/信息) / 32(小标签) — 全部标准档位
controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;30,32,38,110
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~60,64,82,220
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~80,180,120,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&fAXS 邮箱"
              fontSize: 48
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ──────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # 当前页：收件箱
          导航收件箱:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            children:
              收件箱底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~80,180,120,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              收件箱高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~80,180,120,255
                  shape: ~round_rect
                  radius: 2
              收件箱文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&0收件箱"
                  fontSize: 36
          导航日志:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'logs')
            children:
              日志底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              日志文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f日志"
                  fontSize: 36
                  through: true
          导航写信:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'compose')
            children:
              写信底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              写信文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f写信"
                  fontSize: 36
                  through: true
          导航管理:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 216
              width: 272
              height: 58
              visible: "var.isAdmin == true"
            action:
              clickLeft: |-
                Packet.send('AXS_MAIL', 'admin')
            children:
              管理底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
              管理文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "~&f管理"
                  fontSize: 36
                  through: true
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 298
              width: 264
              height: 2
              normal: ~60,64,82,220
          摘要标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 316
              texts: "~&f邮箱概览"
              fontSize: 36
          摘要总数:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 362
              texts: "'&f总数 &b' + var.totalCount.round()"
              fontSize: 32
          摘要未读:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 402
              texts: "'&f未读 &b' + var.unreadCount.round()"
              fontSize: 32
          摘要可领取:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 442
              texts: "'&f可领取 &b' + var.claimableCount.round()"
              fontSize: 32

      # ── 内容区 ──────────────────────────────────────────
      # 范式: 大白毛玻璃底(255,255,255,100) + 暗色面板分区(36,38,48,210)
      # 布局: 筛选栏(顶) + 邮件列表(左暗色面板) + 详情(右暗色面板) + 底部操作+CDK合并栏
      内容区:
        type: Canvas
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          # 内容区大白毛玻璃底
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~255,255,255,230
          # 筛选栏
          筛选栏:
            type: HStack
            attribute:
              point: ~top_left
              x: 24
              y: 20
              spaceBetween: 8
            children:
              筛选全部:
                type: Canvas
                attribute:
                  width: 96
                  height: 40
                action:
                  clickLeft: |-
                    var.filterMode = 'all'
                    Packet.send('AXS_MAIL', 'filter', 'all')
                children:
                  筛选全部底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.filterMode == 'all' ? '80,180,120,230' : '36,38,48,245'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: "var.filterMode == 'all' ? '80,180,120,255' : '255,255,255,230'"
                  筛选全部文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.filterMode == 'all' ? '&0全部' : '&f全部'"
                      fontSize: 32
                      through: true
              筛选未读:
                type: Canvas
                attribute:
                  width: 96
                  height: 40
                action:
                  clickLeft: |-
                    var.filterMode = 'unread'
                    Packet.send('AXS_MAIL', 'filter', 'unread')
                children:
                  筛选未读底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.filterMode == 'unread' ? '80,180,120,230' : '36,38,48,245'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: "var.filterMode == 'unread' ? '80,180,120,255' : '255,255,255,230'"
                  筛选未读文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.filterMode == 'unread' ? '&0未读' : '&f未读'"
                      fontSize: 32
                      through: true
              筛选可领取:
                type: Canvas
                attribute:
                  width: 112
                  height: 40
                action:
                  clickLeft: |-
                    var.filterMode = 'claimable'
                    Packet.send('AXS_MAIL', 'filter', 'claimable')
                children:
                  筛选可领取底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.filterMode == 'claimable' ? '80,180,120,230' : '36,38,48,245'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: "var.filterMode == 'claimable' ? '80,180,120,255' : '255,255,255,230'"
                  筛选可领取文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.filterMode == 'claimable' ? '&0可领取' : '&f可领取'"
                      fontSize: 32
                      through: true
              筛选系统:
                type: Canvas
                attribute:
                  width: 96
                  height: 40
                action:
                  clickLeft: |-
                    var.filterMode = 'system'
                    Packet.send('AXS_MAIL', 'filter', 'system')
                children:
                  筛选系统底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.filterMode == 'system' ? '80,180,120,230' : '36,38,48,245'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: "var.filterMode == 'system' ? '80,180,120,255' : '255,255,255,230'"
                  筛选系统文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.filterMode == 'system' ? '&0系统' : '&f系统'"
                      fontSize: 32
                      through: true
              筛选玩家:
                type: Canvas
                attribute:
                  width: 96
                  height: 40
                action:
                  clickLeft: |-
                    var.filterMode = 'player'
                    Packet.send('AXS_MAIL', 'filter', 'player')
                children:
                  筛选玩家底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.filterMode == 'player' ? '80,180,120,230' : '36,38,48,245'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: "var.filterMode == 'player' ? '80,180,120,255' : '255,255,255,230'"
                  筛选玩家文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.filterMode == 'player' ? '&0玩家' : '&f玩家'"
                      fontSize: 32
                      through: true
              筛选预设:
                type: Canvas
                attribute:
                  width: 96
                  height: 40
                action:
                  clickLeft: |-
                    var.filterMode = 'preset'
                    Packet.send('AXS_MAIL', 'filter', 'preset')
                children:
                  筛选预设底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.filterMode == 'preset' ? '80,180,120,230' : '36,38,48,245'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: "var.filterMode == 'preset' ? '80,180,120,255' : '255,255,255,230'"
                  筛选预设文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.filterMode == 'preset' ? '&0预设' : '&f预设'"
                      fontSize: 32
                      through: true
              筛选CDK:
                type: Canvas
                attribute:
                  width: 96
                  height: 40
                action:
                  clickLeft: |-
                    var.filterMode = 'cdk'
                    Packet.send('AXS_MAIL', 'filter', 'cdk')
                children:
                  筛选CDK底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.filterMode == 'cdk' ? '80,180,120,230' : '36,38,48,245'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      stroke:
                        width: 3
                        color: "var.filterMode == 'cdk' ? '80,180,120,255' : '255,255,255,230'"
                  筛选CDK文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "var.filterMode == 'cdk' ? '&0CDK' : '&fCDK'"
                      fontSize: 32
                      through: true

          # 邮件列表区（左侧暗色面板）
          邮件列表区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: 76
              width: 540
              height: "var.viewH - 144 - 76 - 76"
            children:
              列表底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              邮件滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -12
                  y: 12
                  width: 10
                  height: "self.parent.height - 24"
                  normal: ~40,44,52,225
                  shape: ~round_rect
                  radius: 5
                effect:
                  stroke:
                    width: 2
                    color: ~120,220,160,230
              邮件滑块:
                type: Texture
                val: 邮件滑块
                attribute:
                  point: ~top_right
                  x: -12
                  y: 12
                  width: 10
                  height: 50
                  normal: ~80,180,120,230
                  maxDragY: "self.parent.height - 74"
                  shape: ~round_rect
                  radius: 5
              左侧滚动栏:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 14
                  y: 12
                  width: "self.parent.width - 40"
                  height: "self.parent.height - 24"
                  moveY: "self.parent.parent['邮件滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent.parent['邮件滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent.parent['邮件滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  mail_stack:
                    val: mail_list
                    type: VStack
                    attribute:
                      width: "self.parent.width - 20"
                      spaceBetween: 8
                    children:
                      邮件项目:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.messages[self.entryKey]
                          width: "self.parent.width"
                          height: 88
                          visible: "self.entry != none && (var.filterMode == 'all' || (var.filterMode == 'unread' && self.entry['unread'] == true) || (var.filterMode == 'claimable' && self.entry['claimable'] == true) || (var.filterMode == 'system' && self.entry['source_type'] == 'system') || (var.filterMode == 'player' && self.entry['source_type'] == 'player') || (var.filterMode == 'preset' && self.entry['source_type'] == 'preset') || (var.filterMode == 'cdk' && self.entry['source_type'] == 'cdk'))"
                        action:
                          clickLeft: |-
                            Packet.send('AXS_MAIL', 'select', self.entry['id'])
                        children:
                          项目底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~36,38,48,245
                              shape: ~round_rect
                              radius: 10
                            effect:
                              stroke:
                                width: 3
                                color: "self.isHovered() ? '120,220,160,255' : '255,255,255,230'"
                          未读圆点:
                            type: Texture
                            attribute:
                              point: ~top_left
                              x: 12
                              y: 12
                              width: 8
                              height: 8
                              normal: ~235,180,90,255
                              shape: ~circle
                              visible: "self.parent.entry['unread'] == true"
                          主题文字:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 30
                              y: 10
                              texts: "'&f' + self.parent.entry['subject']"
                              fontSize: 32
                          元信息文字:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 30
                              y: 42
                              texts: "'&f' + self.parent.entry['sender_name'] + '  &b' + self.parent.entry['source_text']"
                              fontSize: 32
                          预览文字:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 30
                              y: 64
                              texts: "'&f' + self.parent.entry['preview']"
                              fontSize: 32

          # 邮件详情区（右侧暗色面板）
          邮件详情区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 588
              y: 76
              width: "var.contentW - 588 - 24"
              height: "var.viewH - 144 - 76 - 76"
            children:
              详情底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~36,38,48,210
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 3
                    color: ~255,255,255,230
              详情滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -12
                  y: 20
                  width: 10
                  height: "self.parent.height - 40"
                  normal: ~40,44,52,225
                  shape: ~round_rect
                  radius: 5
                effect:
                  stroke:
                    width: 2
                    color: ~120,220,160,230
              详情滑块:
                type: Texture
                val: 详情滑块
                attribute:
                  point: ~top_right
                  x: -12
                  y: 20
                  width: 10
                  height: 50
                  normal: ~80,180,120,230
                  maxDragY: "self.parent.height - 90"
                  shape: ~round_rect
                  radius: 5
              详情滚动栏:
                type: Scroll
                attribute:
                  point: ~top_left
                  x: 20
                  y: 20
                  width: "self.parent.width - 52"
                  height: "self.parent.height - 40"
                  moveY: "self.parent['详情滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['详情滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['详情滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  详情内容:
                    type: VStack
                    attribute:
                      width: "self.parent.width - 52"
                      spaceBetween: 16
                    children:
                      详情主题:
                        type: Text
                        attribute:
                          texts: "var.selectedSubject == none ? '&f未选择邮件' : '&b' + var.selectedSubject"
                          fontSize: 48
                      详情元信息:
                        type: Text
                        attribute:
                          texts: "'&f发件人 &b' + var.selectedSenderName + '  &f来源 &b' + var.selectedSourceText + '  &f状态 &b' + var.selectedStatusText"
                          fontSize: 32
                      详情时间:
                        type: Text
                        attribute:
                          texts:
                            - "'&f创建 &b' + var.selectedCreatedAt"
                            - "'&f到期 &b' + var.selectedExpiresAt"
                          fontSize: 32
                      详情附件:
                        type: Text
                        attribute:
                          texts: "'&f附件 &b' + var.selectedAttachmentSummary"
                          fontSize: 32
                      详情正文:
                        type: Text
                        attribute:
                          texts: "var.selectedBody"
                          fontSize: 36

