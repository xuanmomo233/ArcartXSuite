                      texts: "var.pointBalanceRows != none && var.pointBalanceRows[self.entryKey] != none ? '&7' + ((var.pointBalanceRows[self.entryKey]['displayName'] != none ? var.pointBalanceRows[self.entryKey]['displayName'] : '') != none ? (var.pointBalanceRows[self.entryKey]['displayName'] != none ? var.pointBalanceRows[self.entryKey]['displayName'] : '') : '') : ''"
                      fontSize: 32
                  余额:
                    type: Text
                    attribute:
                      entryKey: 0.round()
                      point: ~middle_left
                      x: 60
                      y: 14
                      texts: "var.pointBalanceRows != none && var.pointBalanceRows[self.entryKey] != none ? '&6' + ((var.pointBalanceRows[self.entryKey]['amount'] != none ? var.pointBalanceRows[self.entryKey]['amount'] : 0) != none ? (var.pointBalanceRows[self.entryKey]['amount'] != none ? var.pointBalanceRows[self.entryKey]['amount'] : 0) : 0) : ''"
                      fontSize: 36
          兑换滑块:
            type: Texture
            attribute:
              point: ~top_right
              x: -16
              y: 156
              width: 10
              height: 60
              normal: ~255,226,158,255
              maxDragY: 500 - 60
              dragY: 0
              shape: ~round_rect
              radius: 4
          兑换视口:
            type: Scroll
            attribute:
              point: ~top_left
              x: 24
              y: 156
              width: 1040
              height: 500
              moveY: self.parent['兑换滑块'].getDragYRatio()
              through: false
            action:
              wheel: |-
                if(self.moveY >= 0){
                  if(self.wheelValue > 0){
                    self.parent['兑换滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                  }
                }
                if(self.moveY <= 1){
                  if(self.wheelValue < 0){
                    self.parent['兑换滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                  }
                }
            children:
              兑换列表:
                type: VGrid
                val: 兑换列表
                attribute:
                  column: 1
                  spaceBetweenY: 12
                action:
                  create: |-
                    for(i in range(0, 20)){
                      key = i.round()
                      e = self['兑换行'].copy('兑换行' + key)
                      e.entryKey = key
                      e['商品图标'].entryKey = key
                      e['商品名称'].entryKey = key
                      e['消耗文本'].entryKey = key
                      e['限购文本'].entryKey = key
                      e['兑换按钮'].entryKey = key
                    }
                children:
                  兑换行:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      width: 1020
                      height: 96
                      visible: "var.exchangeRows != none && var.exchangeRows[self.entryKey] != none"
                    children:
                      行背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~22,28,44,240
                          shape: ~round_rect
                          radius: 8
                      商品图标:
                        type: Slot
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 16
                          slotType: ~Icon
                          width: 64
                          height: 74
                          normal: ~0,0,0,0
                          seticon: "self.setItemIcon(var.exchangeRows != none && var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['icon'] != none && var.exchangeRows[self.entryKey]['icon'] != '' ? var.exchangeRows[self.entryKey]['icon'] : var.air)"
                      商品名称:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 96
                          y: -18
                          texts: "var.exchangeRows != none && var.exchangeRows[self.entryKey] != none ? '&f' + ((var.exchangeRows[self.entryKey]['name'] != none ? var.exchangeRows[self.entryKey]['name'] : '') != none ? (var.exchangeRows[self.entryKey]['name'] != none ? var.exchangeRows[self.entryKey]['name'] : '') : '') : ''"
                          fontSize: 36
                      消耗文本:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_left
                          x: 96
                          y: 18
                          texts: "var.exchangeRows == none || var.exchangeRows[self.entryKey] == none || var.exchangeRows[self.entryKey]['costRows'] == none || var.exchangeRows[self.entryKey]['costRows'][0] == none ? '' : ('&7消耗 &6' + (var.exchangeRows[self.entryKey]['costRows'][0]['displayName'] != none ? var.exchangeRows[self.entryKey]['costRows'][0]['displayName'] : '') + ' x' + (var.exchangeRows[self.entryKey]['costRows'][0]['amount'] != none ? var.exchangeRows[self.entryKey]['costRows'][0]['amount'] : 0) + (var.exchangeRows[self.entryKey]['costRows'][1] != none ? ' &7+ &6' + (var.exchangeRows[self.entryKey]['costRows'][1]['displayName'] != none ? var.exchangeRows[self.entryKey]['costRows'][1]['displayName'] : '') + ' x' + (var.exchangeRows[self.entryKey]['costRows'][1]['amount'] != none ? var.exchangeRows[self.entryKey]['costRows'][1]['amount'] : 0) : ''))"
                          fontSize: 32
                      限购文本:
                        type: Text
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_right
                          x: -200
                          texts: "var.exchangeRows == none || var.exchangeRows[self.entryKey] == none ? '' : (var.exchangeRows[self.entryKey]['limit'] != none && var.exchangeRows[self.entryKey]['limit'] == 0 ? '&7不限购' : '&7剩余 ' + (var.exchangeRows[self.entryKey]['remaining'] != none ? var.exchangeRows[self.entryKey]['remaining'] : 0) + '/' + (var.exchangeRows[self.entryKey]['limit'] != none ? var.exchangeRows[self.entryKey]['limit'] : 0))"
                          fontSize: 32
                      兑换按钮:
                        type: Texture
                        attribute:
                          entryKey: 0.round()
                          point: ~middle_right
                          x: -16
                          width: 160
                          height: 66
                          normal: "{var.exchangeRows != none && var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] != none && var.exchangeRows[self.entryKey]['canExchange'] == true ? '226,196,132,255' : '28,34,54,230'}"
                          hover: "{var.exchangeRows != none && var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] != none && var.exchangeRows[self.entryKey]['canExchange'] == true ? '255,246,214,255' : '28,34,54,230'}"
                          shape: ~round_rect
                          radius: 28
                          texts: "var.exchangeRows != none && var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] != none && var.exchangeRows[self.entryKey]['canExchange'] == true ? '&f兑换' : '&7已达上限'"
                          center: true
                          fontSize: 34
                        effect:
                          stroke:
                            width: 2
                            color: ~110,148,204,150
                        action:
                          click: |-
                            if(var.exchangeRows != none && var.exchangeRows[self.entryKey] != none && var.exchangeRows[self.entryKey]['canExchange'] != none && var.exchangeRows[self.entryKey]['canExchange'] == true){
                              Packet.send(var.packetId, 'exchange_buy', var.exchangeRows[self.entryKey]['id'], var.actionToken)
                            }
          兑换空态:
            type: Text
            attribute:
              point: ~middle_center
              texts:
                - ~&8暂无可兑换内容
              fontSize: 36
              visible: "var.exchangeCount != none && var.exchangeCount == 0"
          兑换关闭:
            type: Texture
            attribute:
              point: ~bottom_center
              y: 20
              width: 200
              height: 56
              normal: ~30,38,58,246
              hover: ~36,46,72,246
              shape: ~round_rect
              radius: 6
              texts: "~&f关闭"
              center: true
              fontSize: 36
            action:
              click: "val.兑换面板.visible = false"
