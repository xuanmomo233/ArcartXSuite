schema-version: 1
# 仅在 LoginView 模块启用时读取并执行认证策略。
# 宿主认证策略修改后需重启；重载 LoginView 只更新界面。
backend: standalone
# 中心节点使用 auth-center/config/node.example.yml 的完整配置；策略由中心统一提供。
realm-id: local
timezone: Asia/Shanghai
login-timeout-seconds: 300
ingress:
  # auto 根据直连服的 online-mode 选择入口：在线使用微软会话，离线由玩家在游戏内注册或登录。
  # password 要求 online-mode=false 且关闭代理转发。玩家通过服务器的 IP 或域名连接。
  # online 信任微软在线握手；local-mixed 使用本机混合网关核验身份，两者都不收本服密码。
  # signed-proxy 供受信任的代理后端使用，只接受签名验证。
  type: auto
  gateway-url: http://127.0.0.1:25599
  # password 入口默认开启 password-login，玩家各自设置本服账号密码。
  audience: local-node
  # signed-proxy 必须填入代理启动日志中的公钥。可以为轮换期配置多个公钥，最多8项。
  # - issuer: proxy-main
  #   public-key: BASE64_X509_PUBLIC_KEY
  #   providers: [microsoft, littleskin, center]
  trusted-proxies: []
password:
  min-length: 8
  max-length: 128
  max-attempts: 5
  cooldown-seconds: 300
requirements:
  terms: true
  qq-binding: false
terms:
  version: '1'
  lines:
    - '请遵守服务器规则，禁止利用漏洞或破坏他人游戏体验。'
    - '请保护账号凭据，不向他人提供密码和验证码。'
performance:
  workers: 2
  queue-capacity: 128
