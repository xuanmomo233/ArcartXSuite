# AXS 资源说明
# 用途: Abyss 副本战斗统计 —— 击杀/伤害/承伤/治疗
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/dungeonName/statRows{idx:{name,kills,damage,taken,heal}}
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.dungeonName = packet['dungeonName']
      var.statRows = packet['statRows']
      var.stat0 = var.statRows != none ? var.statRows[0.round()] : none
      var.stat1 = var.statRows != none ? var.statRows[1.round()] : none
      var.stat2 = var.statRows != none ? var.statRows[2.round()] : none
      var.stat3 = var.statRows != none ? var.statRows[3.round()] : none
      var.stat4 = var.statRows != none ? var.statRows[4.round()] : none
      var.stat5 = var.statRows != none ? var.statRows[5.round()] : none
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.dungeonName = ''
      var.statRows = {}
      var.stat0 = none
      var.stat1 = none
      var.stat2 = none
      var.stat3 = none
      var.stat4 = none
      var.stat5 = none
      var.accent = '186,140,232,255'
      var.accentDim = '96,80,140,190'
    open: |-
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;16,12,30,210
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      统计面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 680
          height: 480
        children:
          面板背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;24,19,40,240
              shape: ~round_rect
              radius: 16
            effect:
              stroke:
                width: 2
                color: var.accentDim
          标题标线:
            type: Texture
            attribute:
              point: ~top_center
              y: 28
              width: 26
              height: 3
              normal: var.accent
              through: true
          标题:
            type: Text
            attribute:
              point: ~top_center
              y: 44
              texts: "'&f战斗统计  &7-  &f' + var.dungeonName"
              fontSize: 54
              through: true
          表头底:
