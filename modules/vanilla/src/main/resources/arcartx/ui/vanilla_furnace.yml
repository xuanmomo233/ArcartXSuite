                width: 1
                color: "var.recipeBookOpen ? '120,190,255,255' : '0,0,0,180'"
              ripple:
                duration: 1200
                color: ~255,255,255,100
                width: 0.05
          输入槽:
            type: Slot
            val: 输入槽
            attribute:
              x: -30
              y: -72
              width: 21
              height: 21
              slotType: ~Container
              id: 0
              normal: ~Frosted:0;95,95,95,255
              hover: ~Frosted:0;255,255,255,255
              shape: ~round_rect
              radius: 6
              point: ~middle_center
              itemScale: 0.7
              visible: true
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
          预览输入槽:
            type: Slot
            val: 预览输入槽
            attribute:
              x: -30
              y: -72
              width: 21
              height: 21
              slotType: ~Icon
              seticon: self.setItemIcon(var.previewGrid[0])
              normal: ~Frosted:0;40,40,40,180
              itemScale: 0.7
              point: ~middle_center
              alpha: "var.selectedRecipe != none && var.recipeBookOpen && var.previewVisible ? 1 : 0"
              through: true
              visible: true
          燃料槽:
            type: Slot
            attribute:
              x: -30
              y: -24
              width: 21
              height: 21
              slotType: ~Container
              id: 1
              normal: ~Frosted:0;95,95,95,255
              hover: ~Frosted:0;255,255,255,255
              shape: ~round_rect
              radius: 6
              point: ~middle_center
              itemScale: 0.7
              visible: true
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
          # 燃料进度条：用 Texture + 动态宽度纯色块模拟（原 Progress+贴图）
          进度条底:
            type: Texture
            attribute:
              x: -30
              y: -48
              width: 46
              height: 7
              normal: ~Frosted:0;60,60,60,220
              shape: ~round_rect
              radius: 3
              point: ~middle_center
              visible: true
          燃料进度条:
            type: Texture
            attribute:
              x: -53
              y: -48
              width: "46 * (var.burnTimeTotal > 0 ? (var.burnTime / var.burnTimeTotal) : 0)"
              height: 7
              normal: ~255,140,40,255
              shape: ~round_rect
              radius: 3
              point: ~middle_left
              visible: true
          # 燃烧进度条：用 Texture + 动态宽度纯色块模拟（原 Progress+贴图）
          燃烧进度条底:
            type: Texture
            attribute:
              x: 18
              y: -47
              width: 23
              height: 13
              normal: ~Frosted:0;60,60,60,220
              shape: ~round_rect
              radius: 3
              point: ~middle_center
              visible: var.burning
          燃烧进度条:
            type: Texture
            attribute:
              x: 6.5
              y: -47
              width: "23 * (var.cookTimeTotal > 0 ? (var.cookTime / var.cookTimeTotal) : 0)"
              height: 13
              normal: ~255,200,40,255
              shape: ~round_rect
              radius: 3
              point: ~middle_left
              visible: var.burning
          输出槽:
            type: Slot
            val: 输出槽
            attribute:
              x: 50
              y: -47
              width: 23
              height: 23
              slotType: ~Container
              id: 2
              normal: ~Frosted:0;120,190,255,200
              hover: ~Frosted:0;255,255,255,255
              shape: ~round_rect
              radius: 8
              point: ~middle_center
              itemScale: 0.7
              visible: true
            effect:
              stroke:
                width: 2
                color: ~0,0,0,255
          预览输出槽:
            type: Slot
            val: 预览输出槽
            attribute:
              x: 50
              y: -47
              width: 23
              height: 23
              slotType: ~Icon
              seticon: self.setItemIcon(var.air)
              normal: ~Frosted:0;40,40,40,180
              point: ~middle_center
              itemScale: 0.7
              alpha: "var.selectedRecipe != none && var.recipeBookOpen && var.resultVisible ? 1 : 0"
              through: true
              visible: true
          配方书面板:
            type: Canvas
            attribute:
              x: 0
              y: 0
              width: 0
              height: 235
              visible: var.recipeBookOpen
              point: ~middle_left
              scale: 0.8
            children:
              面板背景:
                type: Texture
                attribute:
                  point: ~middle_right
                  normal: ~Frosted:25;80,80,80,235
                  width: 223
                  height: 235
                  scale: 0.8
                  visible: true
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,180
              搜索框:
                type: TextBox
                val: 搜索框
                attribute:
                  x: -43
                  y: -67
                  width: 100
                  height: 10
                  emptyText: ~搜索配方...
                  fontSize: 10
                  background: ~Frosted:0;60,60,60,220
                  point: ~middle_right
                  visible: true
                action:
                  textChange: |-
                    var.searchText = self.getContent()
                    var.needFilterRefresh = true
              显示切换:
                type: Slot
                val: 显示切换
                attribute:
                  x: -19
                  y: -67
                  width: 19
                  height: 19
                  slotType: ~Icon
                  normal: "var.showAll ? '120,190,255,230' : '255,255,255,150'"
                  shape: ~round_rect
                  radius: 6
                  itemScale: 0.6
                  point: ~middle_right
                  visible: true
                action:
                  clickLeft: |-
                    var.showAll = !var.showAll
                    var.needFilterRefresh = true
                effect:
                  stroke:
                    width: 1
                    color: "var.showAll ? '120,190,255,255' : '0,0,0,180'"
                  ripple:
                    duration: 1200
                    color: ~255,255,255,100
                    width: 0.05
              分类栏:
                type: VStack
                val: 分类栏
                attribute:
                  x: -137
                  y: 0
                  point: ~middle_right
                  spaceBetween: 1
                  width: 20
                  visible: true
                children:
                  分类_全部:
                    type: Slot
                    attribute:
                      width: 19
                      height: 19
                      slotType: ~Icon
                      normal: "var.currentCategory == 'all' ? '120,190,255,230' : '255,255,255,150'"
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.7
                      visible: true
                    action:
                      clickLeft: |-
                        var.currentCategory = 'all'
                        var.needFilterRefresh = true
                    effect:
                      stroke:
                        width: 1
                        color: "var.currentCategory == 'all' ? '120,190,255,255' : '0,0,0,180'"
                      ripple:
                        duration: 1200
                        color: ~255,255,255,100
                        width: 0.05
                  分类_食品:
                    type: Slot
                    attribute:
                      width: 19
                      height: 19
                      slotType: ~Icon
                      normal: "var.currentCategory == 'food' ? '120,190,255,230' : '255,255,255,150'"
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.7
                      visible: true
                    action:
                      clickLeft: |-
                        var.currentCategory = 'food'
                        var.needFilterRefresh = true
                    effect:
                      stroke:
                        width: 1
                        color: "var.currentCategory == 'food' ? '120,190,255,255' : '0,0,0,180'"
                      ripple:
                        duration: 1200
                        color: ~255,255,255,100
                        width: 0.05
                  分类_建筑:
                    type: Slot
                    attribute:
                      width: 19
                      height: 19
                      slotType: ~Icon
                      normal: "var.currentCategory == 'building' ? '120,190,255,230' : '255,255,255,150'"
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.7
                      visible: true
                    action:
                      clickLeft: |-
                        var.currentCategory = 'building'
                        var.needFilterRefresh = true
                    effect:
                      stroke:
                        width: 1
                        color: "var.currentCategory == 'building' ? '120,190,255,255' : '0,0,0,180'"
                      ripple:
                        duration: 1200
                        color: ~255,255,255,100
                        width: 0.05
                  分类_杂项:
                    type: Slot
                    attribute:
                      width: 19
                      height: 19
                      slotType: ~Icon
                      normal: "var.currentCategory == 'misc' ? '120,190,255,230' : '255,255,255,150'"
                      shape: ~round_rect
                      radius: 6
                      itemScale: 0.7
                      visible: true
                    action:
                      clickLeft: |-
                        var.currentCategory = 'misc'
                        var.needFilterRefresh = true
                    effect:
                      stroke:
                        width: 1
                        color: "var.currentCategory == 'misc' ? '120,190,255,255' : '0,0,0,180'"
                      ripple:
                        duration: 1200
                        color: ~255,255,255,100
                        width: 0.05
              配方滚动区:
                type: Scroll
                attribute:
                  x: -30
                  y: 8
                  width: 103
                  height: 129
                  point: ~middle_right
                  moveY: "self.parent['滚动条滑块'].getDragYRatio()"
                  visible: true
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['滚动条滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['滚动条滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  配方展示区:
                    type: HGrid
                    val: 配方展示区
                    attribute:
                      spaceBetweenX: 2
                      spaceBetweenY: 2
                      column: 5
                      visible: true
                    children:
                      配方原型:
                        type: Slot
                        attribute:
                          entryKey: 0.round()
                          entry: var.recipes[self.entryKey]
                          visible: self.entry != none
                          width: 19
                          height: 19
                          slotType: ~Icon
                          normal: "var.recipeCanCraft[self.entryKey] == 1 ? '120,190,255,230' : '255,180,180,170'"
                          hover: ~Frosted:0;255,255,255,240
                          shape: ~round_rect
                          radius: 6
                          seticon: self.setItemIcon(var.recipeJsons[self.entryKey])
                          itemScale: 0.7
                        action:
                          clickLeft: |-
                            if(var.shiftHeld){
                              recipe = var.recipes[self.entryKey]
                              if(recipe != none){
                                for(key in var.allRecipes.keys()){
                                  r = var.allRecipes[key]
                                  if(r['resultItemId'] == recipe['resultItemId']){
                                    Packet.send('AXS:vanilla_furnace', 'place_ingredients', key)
                                    break
                                  }
                                }
                              }
                            } else {
                              var.selectedRecipe = self.entryKey
                              recipe = var.recipes[self.entryKey]
                              if(recipe != none){
                                var.previewGrid = recipe['previewGrid']
                                slot = val.预览输入槽
                                if(slot != none){
                                  slot.seticon()
                                }
                                result = val.预览输出槽
                                if(result != none){
                                  result.setItemIcon(recipe['resultJson'])
                                }
                              }
                            }
                        effect:
                          stroke:
                            width: 1
                            color: "var.recipeCanCraft[self.entryKey] == 1 ? '120,190,255,255' : '0,0,0,180'"
                          ripple:
                            duration: 1200
                            color: ~255,255,255,100
                            width: 0.05
              滚动条轨道:
                type: Texture
                attribute:
                  x: -18.5
                  y: 8
                  width: 5
                  height: 129
                  normal: ~Frosted:0;60,60,60,200
                  shape: ~round_rect
                  radius: 2
                  point: ~middle_right
                  visible: true
              滚动条滑块:
