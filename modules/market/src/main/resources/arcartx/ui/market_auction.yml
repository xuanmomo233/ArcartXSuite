                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f刷新"
                  fontSize: 36
                  through: true
          我要上架按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -24
              y: 24
              width: 140
              height: 48
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'sell_ui_open')
            children:
              我要上架底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~80,200,120,230
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '120,220,140,255' : '255,255,255,230'"
              我要上架文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f我要上架"
                  fontSize: 36
                  through: true
          # ── 物品网格滚动区 ──────────────────────────
          空物品提示:
            type: Text
            attribute:
              point: ~middle_center
              x: 0
              y: -40
              fontSize: 64
              visible: "var.listings == none || var.listings.keys().length == 0"
              texts: "~&8暂无拍卖物品"
              through: true
          物品滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -18
              y: 88
              width: 8
              height: "var.viewH - 348"
              normal: ~42,50,66,225
              shape: ~round_rect
              radius: 4
            effect:
              stroke:
                width: 2
                color: ~255,255,255,230
          物品滑块:
            type: Texture
            val: 物品滑块
            attribute:
              point: ~top_right
              x: -18
              y: 88
              width: 8
              height: 80
              normal: ~140,200,255,255
              maxDragY: "var.viewH - 428"
              shape: ~round_rect
              radius: 4
          物品滚动:
            type: Scroll
            val: 物品滚动
            attribute:
              point: ~top_left
              x: 24
              y: 88
              width: "var.scrollW"
              height: "var.viewH - 348"
              moveY: "self.parent['物品滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['物品滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              物品列表:
                val: 物品列表
                type: HGrid
                attribute:
                  width: "var.scrollW"
                  column: 3
                  spaceBetweenX: 16
                  spaceBetweenY: 16
                children:
                  拍卖卡片:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.listings[self.entryKey]
                      visible: self.entry != none
                      width: "var.cardW"
                      height: 300
                    children:
                      卡片底:
                        type: Texture
                        attribute:
                          point: ~top_left
                          x: 3
                          y: 0
                          width: "var.cardW - 6"
                          height: 300
                          through: true
                          normal: ~42,50,66,210
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
                      物品图标:
                        type: Slot
                        attribute:
                          slotType: ~Icon
                          itemScale: 0.72
                          x: 15
                          y: 12
                          width: 96
                          height: 96
                          normal: ~36,42,54,220
                          shape: ~round_rect
                          radius: 12
                          seticon: "self.setItemIcon(var.itemJsons[self.parent.entryKey] != none ? var.itemJsons[self.parent.entryKey] : var.emptyItemJson)"
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,230
                      收藏按钮:
                        type: Canvas
                        attribute:
                          x: "var.cardW - 45"
                          y: 12
                          width: 30
                          height: 30
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'auction_favorite', self.parent.entry['id'].round(), var.currentCategory, var.search)
                        children:
                          收藏底:
                            type: Texture
                            attribute:
                              point: ~top_left
                              x: 2
                              y: 0
                              width: 26
                              height: 30
                              through: true
                              normal: ~36,42,54,220
                              shape: ~round_rect
                              radius: 8
                            effect:
                              stroke:
                                width: 2
                                color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
                          收藏文字:
                            type: Text
                            attribute:
                              point: ~middle_center
                              texts: "self.parent.parent.entry['isFavorite'] ? '&e★' : '&7☆'"
                              fontSize: 36
                              through: true
                      名称:
                        type: Text
                        attribute:
                          x: 123
                          y: 16
                          texts: "'&f' + self.parent.entry['name']"
                          fontSize: 36
                          through: true
                      卖家:
                        type: Text
                        attribute:
                          x: 123
                          y: 52
                          texts: "'&7卖家: &f' + self.parent.entry['seller']"
                          fontSize: 32
                          through: true
                      低价:
                        type: Text
                        attribute:
                          x: 123
                          y: 88
                          texts: "'&e低价: &f' + self.parent.entry['price'] + ' &7' + self.parent.entry['currencyName']"
                          fontSize: 32
                          through: true
                      当前出价:
                        type: Text
                        attribute:
                          x: 123
                          y: 124
                          texts: "self.parent.entry['canBid'] ? '&7当前出价: &f' + self.parent.entry['bid'] + ' &7' + self.parent.entry['currencyName'] : '&7当前出价: &f无'"
                          fontSize: 32
                          through: true
                      留言:
                        type: Scroll
                        attribute:
                          x: 123
                          y: 160
                          width: "var.cardW - 138"
                          height: 36
                          scrollAnim: none
                          moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
                        action:
                          enter: |-
                            self.scrollAnim = Lerp(0, 1, 2000)
                          leave: |-
                            self.scrollAnim = none
                        children:
                          留言布局:
                            type: HStack
                            attribute:
                              height: 36
                            children:
                              留言文本:
                                type: Text
                                attribute:
                                  x: 0
                                  y: 0
                                  texts: "'&7留言: &f' + (self.parent.parent.parent.entry['message'] != none && self.parent.parent.parent.entry['message'] != '' ? self.parent.parent.parent.entry['message'] : '无')"
                                  fontSize: 32
                                  through: true
                      剩余时间:
                        type: Text
                        attribute:
                          x: 123
                          y: 196
                          texts: "'&7剩余: &a' + self.parent.entry['timeLeft']"
                          fontSize: 32
                          through: true
                      按钮组:
                        type: HStack
                        attribute:
                          x: 15
                          y: 248
                          width: "var.cardW - 30"
                          height: 40
                          spaceBetween: 12
                        children:
                          出价按钮:
                            type: Canvas
                            attribute:
                              width: "var.cardW - 30"
                              height: 40
                              visible: "self.parent.parent.entry != none && self.parent.parent.entry['canBid'] && !self.parent.parent.entry['canCancel']"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'auction_bid', self.parent.parent.entry['id'].round(), self.parent.parent.entry['minBid'], var.actionToken)
                            children:
                              出价底:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 3
                                  y: 0
                                  width: "var.cardW - 36"
                                  height: 40
                                  through: true
                                  normal: ~220,150,50,230
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  ripple:
                                  stroke:
                                    width: 3
                                    color: "self.isHovered() ? '255,180,60,255' : '255,255,255,230'"
                              出价文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "~&f出价"
                                  fontSize: 32
                                  through: true
                          取消按钮:
                            type: Canvas
                            attribute:
                              width: "var.cardW - 30"
                              height: 40
                              visible: "self.parent.parent.entry != none && self.parent.parent.entry['canCancel']"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'auction_cancel', self.parent.parent.entry['id'].round(), var.actionToken, var.page, var.currentCategory, var.search)
                            children:
                              取消底:
                                type: Texture
                                attribute:
                                  point: ~top_left
                                  x: 3
                                  y: 0
                                  width: "var.cardW - 36"
                                  height: 40
                                  through: true
                                  normal: ~220,90,90,230
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  ripple:
                                  stroke:
                                    width: 3
                                    color: "self.isHovered() ? '255,120,120,255' : '255,255,255,230'"
                              取消文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  texts: "~&f取消"
                                  fontSize: 32
                                  through: true
          # ── 底部分页栏 ──────────────────────────────
          上一页:
            type: Canvas
            attribute:
              point: ~top_left
              x: 24
              y: "var.viewH - 248"
              width: 130
              height: 48
              enable: "var.page > 0"
            action:
              clickLeft: |-
                if(var.page > 0){
                  Packet.send(var.packetId, 'auction_list', (var.page - 1), var.currentCategory, var.search)
                }
            children:
              上一页底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              上一页文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f< 上一页"
                  fontSize: 36
                  through: true
          页码:
            type: Text
            attribute:
              point: ~middle_center
              x: 0
              y: "var.viewH - 240"
              texts: "'&f' + var.pageText"
              fontSize: 36
          下一页:
            type: Canvas
            attribute:
              point: ~top_right
              x: -24
              y: "var.viewH - 248"
              width: 130
              height: 48
              enable: "var.page < var.totalPages - 1"
            action:
              clickLeft: |-
                if(var.page < var.totalPages - 1){
                  Packet.send(var.packetId, 'auction_list', (var.page + 1), var.currentCategory, var.search)
                }
            children:
              下一页底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '140,200,255,255' : '255,255,255,230'"
              下一页文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f下一页 >"
                  fontSize: 36
                  through: true
