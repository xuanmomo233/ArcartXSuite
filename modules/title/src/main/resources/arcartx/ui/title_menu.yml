            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~232,180,90,240
          右栏滚动区:
            type: Scroll
            attribute:
              point: ~top_left
              x: 14
              y: 16
              width: 380
              height: "var.rightScrollH"
              moveY: "self.parent['右栏滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['右栏滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['右栏滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              右栏内容:
                type: VStack
                attribute:
                  width: 380
                  spaceBetween: 12
                children:
                  已装备标题:
                    type: Text
                    attribute:
                      fontSize: 48
                      texts: "~&f当前已装备"
                  已装备列表:
                    val: equipped_list
                    type: VStack
                    attribute:
                      width: 380
                      spaceBetween: 8
                    children:
                      已装备模板:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.equippedByGroup[self.entryKey]
                          width: 380
                          height: 52
                          visible: self.entryKey != none && self.entry != none
                        children:
                          已装备底:
                            type: Texture
                            attribute:
                              point: ~stretch_all
                              through: true
                              normal: ~255,255,255,125
                              shape: ~round_rect
                              radius: 10
                            effect:
                              stroke:
                                width: 2
                                color: ~255,255,255,165
                          已装备信息:
                            type: Text
                            attribute:
                              point: ~top_left
                              x: 10
                              y: 6
                              texts:
                                - "'&f' + self.parent.entry['group_name'] + ': ' + (self.parent.entry['title_id'] == none ? '&7未装备' : self.parent.entry['display_name'])"
                                - "self.parent.entry['title_id'] != none ? '&f' + self.parent.entry['quality_name'] : ''"
                              fontSize: 32
                              visible: self.parent.entry != none
                              through: true
                  当前装备属性标题:
                    type: Text
                    attribute:
                      fontSize: 48
                      texts: "~&f当前装备属性"
                  当前装备属性值:
                    type: Text
                    attribute:
                      fontSize: 36
                      lineSpace: 12
                      texts: "var.displayAttributesText != none && var.displayAttributesText != '' ? var.displayAttributesText : '&7暂无属性'"
                  当前收集属性标题:
                    type: Text
                    attribute:
                      fontSize: 48
                      texts: "~&f当前收集属性"
                  当前收集属性值:
                    type: Text
                    attribute:
                      fontSize: 36
                      lineSpace: 12
                      texts: "var.collectionAttributesText != none && var.collectionAttributesText != '' ? var.collectionAttributesText : '&7暂无属性'"
                  总属性标题:
                    type: Text
                    attribute:
                      fontSize: 48
                      texts: "~&f总属性汇总"
                  总属性汇总值:
                    type: Text
                    attribute:
                      fontSize: 36
                      lineSpace: 12
                      texts: "var.totalAttributesText != none && var.totalAttributesText != '' ? var.totalAttributesText : '&7暂无属性数据'"
                  主展示标题:
                    type: Text
                    attribute:
                      fontSize: 48
                      texts: "~&f当前主展示"
                  主展示值:
                    type: Text
                    attribute:
                      fontSize: 36
                      texts: "var.displayTitleName != none && var.displayTitleName != '' ? '&f' + var.displayTitleName : '&0未设置'"
          右栏滑块轨道:
            type: Texture
            attribute:
              point: ~top_left
              x: 406
              y: 16
              width: 10
              height: "var.rightScrollH"
              normal: ~60,50,80,200
              shape: ~round_rect
              radius: 5
              through: true
          右栏滑块:
            type: Texture
            val: 右栏滑块
            attribute:
              point: ~top_left
              x: 406
              y: 16
              width: 10
              height: 40
              normal: ~232,180,90,220
              shape: ~round_rect
              radius: 5
              maxDragY: "var.rightScrollH - 40"
          # ── 操作按钮区（固定在右侧栏底部）──────────────
          按钮行1:
            type: HStack
            attribute:
              point: ~top_left
              x: 14
              y: "var.btnRow1Y"
              width: 412
              height: 42
              spaceBetween: 12
            children:
              设为主展示按钮:
                type: Canvas
                attribute:
                  width: 196
                  height: 42
                  visible: var.selectedIsEquipped && !var.selectedIsDisplayTitle
                action:
                  clickLeft: |-
                    Packet.send('AXS_TITLE_MENU', 'set_display', var.selectedId)
                children:
                  设为主展示底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~232,180,90,210
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~232,180,90,230
                  设为主展示文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&0设为主展示"
                      fontSize: 36
                      through: true
              装备按钮:
                type: Canvas
                attribute:
                  width: 196
                  height: 42
                  visible: var.selectedCanEquip
                  enable: "!var.actionBusy"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send('AXS_TITLE_MENU', 'equip', var.selectedId)
                children:
                  装备底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~232,180,90,210
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~232,180,90,230
                  装备文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&0装备本组"
                      fontSize: 36
                      through: true
              卸下本组按钮:
                type: Canvas
                attribute:
                  width: 196
                  height: 42
                  visible: var.selectedIsEquipped
                  enable: "!var.actionBusy"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send('AXS_TITLE_MENU', 'unequip_group', var.selectedGroupId)
                children:
                  卸下本组底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~124,196,142,210
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~124,196,142,230
                  卸下本组文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&0卸下本组"
                      fontSize: 36
                      through: true
          按钮行2:
            type: HStack
            attribute:
              point: ~top_left
              x: 14
              y: "var.btnRow2Y"
              width: 412
              height: 42
              spaceBetween: 12
            children:
              全部卸下按钮:
                type: Canvas
                attribute:
                  width: 196
                  height: 42
                  enable: "!var.actionBusy"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send('AXS_TITLE_MENU', 'unequip_all')
                children:
                  全部卸下底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~62,66,74,210
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~255,255,255,165
                  全部卸下文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f全部卸下"
                      fontSize: 36
                      through: true
              隐藏按钮:
                type: Canvas
                attribute:
                  width: 196
                  height: 42
                  visible: var.selectedOwned && !var.selectedHidden
                  enable: "!var.actionBusy"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send('AXS_TITLE_MENU', 'hide', var.selectedId)
                children:
                  隐藏底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~62,66,74,210
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~255,255,255,165
                  隐藏文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&f隐藏"
                      fontSize: 36
                      through: true
              取消隐藏按钮:
                type: Canvas
                attribute:
                  width: 196
                  height: 42
                  visible: var.selectedOwned && var.selectedHidden
                  enable: "!var.actionBusy"
                action:
                  clickLeft: |-
                    var.actionBusy = true
                    Packet.send('AXS_TITLE_MENU', 'unhide', var.selectedId)
                children:
                  取消隐藏底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: ~232,180,90,210
                      shape: ~round_rect
                      radius: 14
                    effect:
                      stroke:
                        width: 2
                        color: ~232,180,90,230
                  取消隐藏文字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: "~&0取消隐藏"
                      fontSize: 36
                      through: true
          刷新按钮:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: "var.btnRefreshY"
              width: 412
              height: 42
            action:
              clickLeft: |-
                Packet.send('AXS_TITLE_MENU', 'refresh')
            children:
              刷新底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~62,66,74,210
                  shape: ~round_rect
                  radius: 14
                effect:
                  stroke:
                    width: 2
                    color: ~255,255,255,165
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f刷新"
                  fontSize: 36
                  through: true
