# AXS 资源说明
# 用途: Abyss 地牢浏览器 —— 左侧地牢卡片列表 + 右侧详情面板 + 进入/队伍/刷新
# 布局: 全屏磨砂底 + 渐变底幕 + 页眉 + 左列滚动列表 + 右列详情
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
# 重载命令: /axs abyss reload
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  level: 8
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 回包通道
    #   - action_token: 操作令牌
    #   - title: 界面标题
    #   - dungeonRows: 地牢卡片数据(整数字符串key)
    #   - dungeonCount: 地牢总数
    #   - hasParty / partyText: 队伍状态
    init: |-
      if(packet['view_nonce'] != none){ var.viewNonce = packet['view_nonce'] }
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.title = packet['title']
      var.dungeonRows = packet['dungeonRows']
      var.iconJsons = {}
      for(key in var.dungeonRows.keys()){ var.iconJsons[key] = var.dungeonRows[key]['iconJson'] }
      var.dungeonCount = packet['dungeonCount']
      var.hasParty = packet['hasParty']
      var.partyText = packet['partyText']
      previousId = var.selectedId
      var.selEntry = none
      var.selectedId = ''
      // 重建卡片列表（模板在索引0，按轮次命名防冲突）
      目标数 = var.dungeonCount.round()
      if(var.已建_dungeon_rows != 目标数){
        var.已建_dungeon_rows = 目标数
        for(key in var.卡片引用.keys()){
          var.卡片引用[key].remove()
        }
        var.卡片引用 = {}
        var.卡片轮次 = (var.卡片轮次 + 1).round()
        模板 = val.dungeon_rows.get(0)
        模板.entryKey = 0.round()
        if(目标数 > 1){
          for(i in range(1, 目标数 - 1)){
            c = 模板.copy('地牢卡片_' + var.卡片轮次 + '_' + i.round())
            c.entryKey = i.round()
            var.卡片引用[i.round()] = c
          }
        }
      }
      var.iconsPending = true
      // 默认选中第一张卡片
      if(目标数 > 0){
        var.selEntry = var.dungeonRows[0.round()]
        var.selKey = 0.round()
        var.selectedId = var.selEntry['id']
      }
      for(key in var.dungeonRows.keys()){
        if(var.dungeonRows[key]['id'] == previousId){
          var.selEntry = var.dungeonRows[key]
          var.selectedId = previousId
          var.selKey = key
        }
      }
      if(previousId != var.selectedId){ val.list_slider.setDragYRatio(0) }
    # Generation-bound close notification prevents stale close events cancelling a newly opened screen.

  action:
    close: |-
      if(var.actionToken != '' && var.viewNonce != ''){
        Packet.send(var.packetId, 'close_view', 'browser', var.actionToken, var.viewNonce)
      }
    load: |-
      var.iconJsons = {}
      var.iconsPending = false
      var.已建_dungeon_rows = -1
      var.viewNonce = ''
      var.packetId = 'abyss'
      var.actionToken = ''
      var.title = '深渊回廊'
      var.dungeonRows = {}
      var.dungeonCount = 0
      var.hasParty = false
      var.partyText = '未组队'
      var.selEntry = none
      var.selKey = -1
      var.selectedId = ''
      var.卡片轮次 = 0
      var.卡片引用 = {}
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.accent = '186,140,232,255'
      var.accentDim = '96,80,140,190'
      var.accentHover = '220,180,255,235'
      var.cardBg = '38,30,58,255'
      var.cardBgActive = '68,52,96,255'
      var.cardBgHover = '52,40,76,255'
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.leftW = var.viewW * 0.6
      var.rightW = var.viewW - var.leftW
    open: |-
      Sound.self('minecraft:item.book.page_turn', 0.9, 14)
    tick: |-
      if(var.iconsPending){
        var.iconsPending = false
        目标数 = var.dungeonCount.round()
        // 数据就绪后触发每张卡片图标 seticon（属性不随 var 自动重算）
        if(目标数 > 0){
          val.dungeon_rows.get(0)['图标'].seticon()
          if(目标数 > 1){
            for(i in range(1, 目标数 - 1)){
              var.卡片引用[i.round()]['图标'].seticon()
            }
          }
        }
      }
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      visible: "var.actionToken != ''"
      point: ~top_center
      width: 1920
      height: 1080
    children:
      全屏画布:
        type: Canvas
        attribute:
          x: "-var.offX"
          width: "var.viewW"
          height: "var.viewH"
        children:
          场景磨砂:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:24;8,10,11,245
              through: true
          暮色底幕:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~10,12,13,242
              through: true
            effect:
              gradient:
                color1: ~30,27,25,255
                color2: ~8,11,12,255
                type: 0
                angleDeg: 65
          # ── 页眉 ──
          页眉标线:
            type: Texture
            attribute:
              x: 76
              y: 56
              width: 28
              height: 3
              normal: var.accent
              through: true
          品牌标记:
            type: Text
            attribute:
              x: 120
              y: 46
              texts: ~&6A B Y S S   /   E X P E D I T I O N
              fontSize: 24
              alpha: 0.78
              through: true
          标题:
            type: Text
            attribute:
              x: 72
              y: 104
              texts: var.title
              fontSize: 48
              limit: 20
              through: true
          引导语:
            type: Text
            attribute:
              x: 76
              y: 176
              texts: ~&7远征地图   /   标记裂隙，核查危险与补给后出发
              fontSize: 24
              through: true
          队伍状态底色:
            type: Texture
            attribute:
              point: ~top_right
              x: -150
              y: 62
              width: 240
              height: 48
              normal: ~34,37,37,245
              through: true
            effect:
              stroke:
                width: 2
                color: var.accentDim
          队伍状态:
            type: Text
            attribute:
              point: ~top_right
              x: -166
              y: 72
              texts: "'&6队伍 / &f' + var.partyText"
              fontSize: 24
              through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~top_right
              x: -76
              y: 52
              width: 48
              height: 48
            action:
              clickLeft: "Screen.close()"
            children:
              关闭底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~96,39,35,235
                  hover: ~156,59,46,245
                  through: true
              关闭字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&fX
                  fontSize: 24
                  through: true
          分隔线:
            type: Texture
            attribute:
              x: 76
              y: 232
              width: "var.leftW - 152"
              height: 1
              normal: ~132,87,62,195
              through: true
          地图标题:
            type: Text
            attribute:
              x: 76
              y: 260
              texts: ~&601   /   裂隙坐标
              fontSize: 32
              through: true
          地图注释:
            type: Text
            attribute:
              x: 78
              y: 320
              texts: ~&7按危险等级核查每处入口 · 点击标记查看行动简报
              fontSize: 24
              through: true
          地图纵轴:
            type: Texture
            attribute:
              x: 105
              y: 388
              width: 2
              height: "var.viewH - 520"
              normal: ~132,87,62,150
              through: true
          # ── 左列：地图标记滚动列表 ──
          左侧区域:
            type: Canvas
            attribute:
              width: "var.leftW"
              height: "var.viewH"
            children:
              空提示:
                type: Canvas
                attribute:
                  x: 76
                  y: 460
                  width: "var.leftW - 152"
                  height: 160
                  visible: var.dungeonCount <= 0
                children:
                  空标题:
                    type: Text
                    attribute:
                      point: ~top_center
                      texts: ~&f当前没有可用的裂隙
                      fontSize: 36
                      through: true
                  空说明:
                    type: Text
                    attribute:
                      point: ~top_center
                      y: 56
                      texts: ~&7行动档案尚未解锁 · 请稍后重试
                      fontSize: 24
                      through: true
              卡片滑轨:
                type: Texture
                attribute:
                  point: ~top_right
                  x: -58
                  y: 388
                  width: 10
                  height: "var.viewH - 520"
                  normal: ~29,31,31,235
                  shape: ~round_rect
                  radius: 5
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: var.accentDim
              卡片滑块:
                type: Texture
                val: list_slider
                attribute:
                  point: ~top_right
                  x: -58
                  y: 388
                  width: 10
                  height: 120
                  normal: var.accent
                  maxDragY: "var.viewH - 640"
                  shape: ~round_rect
                  radius: 5
              卡片滚动区:
                type: Scroll
                attribute:
                  x: 76
                  y: 388
                  width: "var.leftW - 158"
                  height: "var.viewH - 520"
                  moveY: val.list_slider.getDragYRatio()
                action:
                  wheel: |-
                    ratio = self.moveY - self.wheelValue * 0.12
                    if(ratio < 0){ ratio = 0 }
                    if(ratio > 1){ ratio = 1 }
                    val.list_slider.setDragYRatio(ratio)
                children:
                  卡片列表:
                    type: VStack
                    val: dungeon_rows
                    attribute:
                      maxSize: 2147483647
                      width: "var.leftW - 176"
                      spaceBetween: 12
                    children:
                      地牢卡片:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: var.dungeonRows[self.entryKey]
                          active: "self.entry != none && var.selectedId == self.entry['id']"
                          visible: self.entry != none
                          width: "var.leftW - 176"
                          height: 136
                        action:
                          clickLeft: |-
                            if(self.entry != none){
                              var.selEntry = self.entry
                              var.selKey = self.entryKey
                              var.selectedId = self.entry['id']
                              Sound.self('minecraft:ui.button.click', 1.4, 10)
                            }
                        children:
                          卡片底色:
                            type: Texture
                            attribute:
                              x: 36
                              y: 2
                              width: "self.parent.width - 38"
                              height: "self.parent.height - 4"
                              normal: "self.parent.active ? var.cardBgActive : var.cardBg"
                              hover: var.cardBgHover
                              through: true
                            effect:
                              stroke:
                                width: "self.parent.active ? 4 : 3"
                                color: "self.parent.active ? var.accent : (self.parent.isHovered() ? var.accentHover : var.accentDim)"
                          选中侧线:
                            type: Texture
                            attribute:
                              x: 17
                              y: 54
                              width: "self.parent.active ? 12 : 8"
                              height: 12
                              alpha: "self.parent.active ? 1 : (self.parent.isHovered() ? 0.72 : 0.42)"
                              normal: var.accent
                              shape: ~round_rect
                              radius: 2
                              through: true
                          图标底座:
                            type: Texture
                            attribute:
                              x: 62
                              y: 24
                              width: 78
                              height: 78
                              normal: ~47,49,46,255
                              alpha: "(self.parent.active || self.parent.isHovered()) ? 1 : 0.74"
                              through: true
                          图标:
                            type: Slot
                            attribute:
                              slotType: ~Icon
                              x: 72
                              y: 34
                              width: 58
                              height: 58
                              itemScale: 0.82
                              normal: ~0,0,0,0
                              through: true
                              seticon: "self.setItemIcon(var.iconJsons[self.parent.entryKey])"
                          名称:
                            type: Text
                            attribute:
                              x: 164
                              y: 20
                              texts: "'&f' + self.parent.entry['name']"
                              fontSize: 32
                              limit: 14
                              through: true
                          难度人数:
                            type: Text
                            attribute:
                              x: 164
                              y: 72
                              texts: "'&7' + self.parent.entry['difficulty'] + '   &7' + self.parent.entry['minPlayers'].round() + '-' + self.parent.entry['maxPlayers'].round() + '人' + (self.parent.entry['partyRequired'] ? '   &c需组队' : '')"
                              fontSize: 24
                              through: true
                          冷却标记:
                            type: Text
                            attribute:
                              point: ~middle_right
                              x: -20
                              y: 38
                              texts: "self.parent.entry['cooldownLeft'] > 0 ? '&c封锁 ' + self.parent.entry['cooldownLeft'].round() + 's' : (self.parent.entry['running'] > 0 ? '&6进行中' : '&7可部署')"
                              fontSize: 24
                              through: true
          # ── 右列：目的地行动简报 ──
          详情底:
            type: Texture
            attribute:
              x: "var.leftW + 12"
              y: 246
              width: "var.rightW - 88"
              height: "var.viewH - 320"
              normal: ~22,25,26,245
            effect:
              stroke:
                width: 2
                color: var.accentDim
          详情标题标线:
            type: Texture
            attribute:
              x: "var.leftW + 66"
              y: 322
              width: 22
              height: 3
              normal: var.accent
              visible: var.selEntry != none
              through: true
          简报编号:
            type: Text
            attribute:
              x: "var.leftW + 66"
              y: 280
              texts: ~&602   /   目的地简报
              fontSize: 24
              through: true
          详情标题:
            type: Text
            attribute:
              x: "var.leftW + 66"
              y: 350
              texts: "var.selEntry != none ? '&f' + var.selEntry['name'] : '&7待标记裂隙'"
              fontSize: 44
              limit: 12
              through: true
          详情难度:
            type: Text
            attribute:
              x: "var.leftW + 68"
              y: 438
              texts: "var.selEntry != none ? '&c危险等级   &f' + var.selEntry['difficulty'] : ''"
              fontSize: 24
              through: true
          详情条件行:
            type: Text
            attribute:
              lineSpace: 8
              x: "var.leftW + 68"
              y: 494
              fontSize: 24
              through: true
              texts:
                - "var.selEntry != none ? '&7人数  &f' + var.selEntry['minPlayers'].round() + '-' + var.selEntry['maxPlayers'].round() + '人   &7体力  &b' + var.selEntry['staminaCost'].round() : ''"
                - "var.selEntry != none ? '&7门票  &e' + var.selEntry['moneyCost'].round() + '   &7冷却  &f' + var.selEntry['cooldown'].round() + 's   &7运行中  &f' + var.selEntry['running'].round() : ''"
                - "var.selEntry != none && var.selEntry['partyRequired'] ? '&c该地牢需要组队进入' : ''"
                - "var.selEntry != none && var.selEntry['cooldownLeft'] > 0 ? '&c冷却剩余: ' + var.selEntry['cooldownLeft'].round() + 's' : ''"
          详情描述标线:
            type: Texture
            attribute:
              x: "var.leftW + 68"
              y: 670
              width: "var.rightW - 198"
              height: 1
              normal: ~129,86,57,185
              visible: var.selEntry != none
              through: true
          详情描述:
            type: Canvas
            attribute:
              x: var.leftW + 68
              y: 704
              width: var.viewW - var.leftW - 136
              height: 120
              through: true
            children:
              文字:
                type: Text
                attribute:
                  lineSpace: 8
                  fontSize: 24
                  texts:
                  - 'var.selEntry != none ? ''&7'' + var.selEntry[''desc0''] : '''''
                  - 'var.selEntry != none ? ''&7'' + var.selEntry[''desc1''] : '''''
                  - 'var.selEntry != none ? ''&7'' + var.selEntry[''desc2''] : '''''
                  point: ~top_left
                  width: self.parent.width
                  height: self.parent.height
                  limitControl: self.parent
                  through: true
          操作区:
            type: HStack
            attribute:
              x: "var.leftW + 68"
              y: "var.viewH - 166"
              height: 54
              spaceBetween: 16
            children:
              进入按钮:
                type: Canvas
                attribute:
                  width: 220
                  height: 54
                  visible: var.selEntry != none
                action:
                  clickLeft: |-
                    if(var.selectedId != '' && var.selectedId != none){
                      Packet.send(var.packetId, 'open_confirm', var.selectedId, var.actionToken)
                      Screen.close()
                    }
                children:
                  进入底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~187,121,61,245
                      hover: ~224,163,79,255
                      through: true
                  进入字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&0部署远征
                      fontSize: 24
                      through: true
              队伍按钮:
                type: Canvas
                attribute:
                  width: 140
                  height: 54
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'open_party_ui', var.actionToken)
                children:
                  队伍底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~62,65,61,235
                      hover: ~98,91,70,245
                      through: true
                  队伍字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f编 队
                      fontSize: 24
                      through: true
              刷新按钮:
                type: Canvas
                attribute:
                  width: 140
                  height: 54
                action:
                  clickLeft: |-
                    Packet.send(var.packetId, 'refresh_browser', var.actionToken)
                children:
                  刷新底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~36,40,41,235
                      hover: ~67,62,49,245
                      through: true
                    effect:
                      stroke:
                        width: 2
                        color: var.accentDim
                  刷新字:
                    type: Text
                    attribute:
                      point: ~middle_center
                      texts: ~&f刷 新
                      fontSize: 24
                      through: true
          底部提示:
            type: Text
            attribute:
              x: 76
              y: "var.viewH - 60"
              texts: ~&7行动提示  /  单击地图标记选择目的地 · 出发前核查体力、门票与队伍限制
              fontSize: 24
              alpha: 0.6
              through: true
