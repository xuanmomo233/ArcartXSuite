                  height: 60
                  normal: ~220,120,120,255
                  maxDragY: "var.viewH - 408"
                  shape: ~round_rect
                  radius: 6
              封禁滚动栏:
                type: Scroll
                attribute:
                  point: ~top_left
                  y: 112
                  width: "var.contentW - 82"
                  height: "var.viewH - 348"
                  moveY: "self.parent['封禁滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['封禁滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['封禁滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  bans_list:
                    val: ban_data
                    type: VStack
                    attribute:
                      x: 0
                      y: 0
                      width: "var.contentW - 82"
                      spaceBetween: 8
                    children:
                      封禁行:
                        type: Canvas
                        attribute:
                          entryKey: 0.round()
                          entry: "self.entryKey < var.bans.size() ? var.bans.get(self.entryKey) : none"
                          visible: self.entry != none
                          width: "var.contentW - 90"
                          height: 104
