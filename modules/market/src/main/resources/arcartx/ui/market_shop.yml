# AXS Market — 系统商店界面
# 打开方式: /market shop [商店ID]
# 数据交互: packetHandler init/update；客户端 Packet.send(var.packetId, action, ...)

ui:
  isHud: false
  defaultOpen: false
  hide:
    - HUD
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: init
    # 首次收到服务端数据包时执行，初始化系统商店界面所有变量和动态控件
    # 包字段:
    #   - packetId: 数据包通信 ID（用于客户端 Packet.send 回传）
    #   - shopId: 当前商店 ID（如 "example_shop"）
    #   - shopName: 当前商店显示名称
    #   - shops: 商店列表字典（key=序号, value=商店对象含 id/displayName 等）
    #   - shopTexts: 商店显示文本字典（key=序号, value=带颜色码的商店名）
    #   - shopIconJson{key}: 各商店列表图标的物品 JSON（如 shopIconJson0、shopIconJson1...）
    #   - items: 商品列表字典（key=序号, value=商品条目含 name/price/stock/limitText/key 等）
    #   - shopItemJson{key}: 各商品的 NBT JSON 字符串（如 shopItemJson0、shopItemJson1...）
    #   - maxShopCount: 最大商店数量（用于动态复制商店项控件）
    #   - maxItemCount: 最大商品数量（用于动态复制商品项控件）
    #   - action_token: 操作令牌（防重放攻击，购买时回传）
    init: |-
      var.packetId = packet['packetId']
      var.shopId = packet['shopId']
      var.shopName = packet['shopName']
      var.shops = packet['shops']
      var.shopTexts = packet['shopTexts']
      var.items = packet['items']
      var.itemJsons = {}
      var.shopIcons = {}
      for(key in var.shops.keys()){
        json = packet['shopIconJson' + key]
        if(json != none && json != ''){
          var.shopIcons[key] = json
        } else {
          var.shopIcons[key] = var.emptyItemJson
        }
      }
      var.maxShopCount = packet['maxShopCount']
      var.maxItemCount = packet['maxItemCount']
      var.actionToken = packet['action_token']
      for(key in var.items.keys()){
        json = packet['shopItemJson' + key]
        if(json != none){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      while(val.商店列表.childrenCount() > 1){
        val.商店列表.get(1).remove()
      }
      for(i in range(1, var.maxShopCount - 1)){
        key = i.round()
        e = val.商店列表['商店项'].copy('商店项' + key)
        e.entryKey = key
      }
      for(i in range(0, var.maxShopCount - 1)){
        key = i.round()
        e = val.商店列表.get(i.round())
        if(e != none && e['商店图标'] != none){
          e['商店图标'].entryKey = key
          e['商店图标'].seticon()
        }
      }
      while(val.商品列表.childrenCount() > 1){
        val.商品列表.get(1).remove()
      }
      for(i in range(1, var.maxItemCount - 1)){
        key = i.round()
        e = val.商品列表['商品项'].copy('商品项' + key)
        e.entryKey = key
      }
      for(i in range(0, var.maxItemCount - 1)){
        key = i.round()
        e = val.商品列表.get(i.round())
        if(e != none && e['商品图标'] != none){
          e['商品图标'].entryKey = key
          e['商品图标'].seticon()
        }
      }
      var.actionBusy = false
    # packetHandler: update
    # 服务端推送更新时执行，字段与 init 完全相同，用于刷新商店列表和商品数据
    # 包字段: 同 init（packetId/shopId/shopName/shops/shopTexts/items/
    #   shopIconJson{key}/shopItemJson{key}/maxShopCount/maxItemCount/action_token）
    update: |-
      var.packetId = packet['packetId']
      var.shopId = packet['shopId']
      var.shopName = packet['shopName']
      var.shops = packet['shops']
      var.shopTexts = packet['shopTexts']
      var.items = packet['items']
      var.itemJsons = {}
      var.shopIcons = {}
      for(key in var.shops.keys()){
        json = packet['shopIconJson' + key]
        if(json != none && json != ''){
          var.shopIcons[key] = json
        } else {
          var.shopIcons[key] = var.emptyItemJson
        }
      }
      var.maxShopCount = packet['maxShopCount']
      var.maxItemCount = packet['maxItemCount']
      var.actionToken = packet['action_token']
      for(key in var.items.keys()){
        json = packet['shopItemJson' + key]
        if(json != none){
          var.itemJsons[key] = json
        } else {
          var.itemJsons[key] = var.emptyItemJson
        }
      }
      while(val.商店列表.childrenCount() > 1){
        val.商店列表.get(1).remove()
      }
      for(i in range(1, var.maxShopCount - 1)){
        key = i.round()
        e = val.商店列表['商店项'].copy('商店项' + key)
        e.entryKey = key
      }
      for(i in range(0, var.maxShopCount - 1)){
        key = i.round()
        e = val.商店列表.get(i.round())
        if(e != none && e['商店图标'] != none){
          e['商店图标'].entryKey = key
          e['商店图标'].seticon()
        }
      }
      while(val.商品列表.childrenCount() > 1){
        val.商品列表.get(1).remove()
      }
      for(i in range(1, var.maxItemCount - 1)){
        key = i.round()
        e = val.商品列表['商品项'].copy('商品项' + key)
        e.entryKey = key
      }
      for(i in range(0, var.maxItemCount - 1)){
        key = i.round()
        e = val.商品列表.get(i.round())
        if(e != none && e['商品图标'] != none){
          e['商品图标'].entryKey = key
          e['商品图标'].seticon()
        }
      }
      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    # action: open
    # UI 打开时执行，初始化所有变量为默认空值，然后向服务端请求商店列表
    # 发送数据包: Packet.send(packetId, 'shop_list', 商店ID)
    open: |-
      var.packetId = 'AXS_MARKET'
      var.shopId = none
      var.shopName = '系统商店'
      var.shops = {}
      var.shopIcons = {}
      var.shopTexts = {}
      var.items = {}
      var.itemJsons = {}
      var.shopScrollRatio = 0
      var.itemScrollRatio = 0
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.maxShopCount = 0
      var.maxItemCount = 0
      var.quantity = 1
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      Packet.send(var.packetId, 'shop_list', none)

controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~stretch_all
      width: 1920
      height: 1080
    children:
      主面板:
        type: Canvas
        attribute:
          point: ~middle_center
          width: 1400
          height: 860
        children:
          背景:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~28,30,42,244
              shape: ~round_rect
              radius: 24
            effect:
              stroke:
                width: 2
                color: ~90,170,255,150
              shadow:
                xOffset: 0
                yOffset: 4
                blur: 12
                color: ~0,0,0,140

          标题:
            type: Text
            attribute:
              x: 42
              y: 24
              texts: "~&e{var.shopName}"
              fontSize: 100
          副标题:
            type: Text
            attribute:
              x: 42
              y: 78
              texts: "~&7系统商店"
              fontSize: 32

          关闭按钮:
            type: Canvas
            attribute:
              x: 1322
              y: 28
              width: 48
              height: 48
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~180,70,70,210
                  hover: ~Frosted:0;220,90,90,230
                  shape: ~round_rect
                  radius: 12
                effect:
                  stroke:
                    width: 1
                    color: ~255,130,130,120
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  width: 48
                  texts: "~&f✕"
                  fontSize: 48
                  through: true

          # ── 左侧商店列表 ──────────────────────────────
          商店卡片:
            type: Texture
            attribute:
              x: 32
              y: 110
              width: 240
              height: 720
              normal: ~42,45,58,220
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: ~90,170,255,50
            children:
              商店标题:
                type: Text
                attribute:
                  x: 20
                  y: 16
                  texts: "~&e商店列表"
                  fontSize: 36
              商店纵向滑块:
                type: Texture
                val: 商店纵向滑块
                attribute:
                  x: 220
                  y: 60
                  width: 6
                  height: 50
                  normal: ~120,120,120,200
                  maxDragY: 590
              商店滚动:
                type: Scroll
                val: 商店滚动
                attribute:
                  x: 14
                  y: 60
                  width: 206
                  height: 640
                  moveY: "self.parent['商店纵向滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['商店纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['商店纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  商店列表:
                    val: 商店列表
                    type: VStack
                    attribute:
                      width: 200
                      spaceBetween: 8
                    children:
                      商店项:
                        type: Texture
                        attribute:
                          entryKey: 0.round()
                          entry: var.shops[self.entryKey]
                          visible: self.entry != none
                          width: 200
                          height: 48
                          normal: "self.entry != none && self.entry['id'] == var.shopId ? '70,150,250,230' : '56,58,70,200'"
                          hover: ~Frosted:0;255,255,255,80
                          shape: ~round_rect
                          radius: 12
                        action:
                          clickLeft: |-
                            Packet.send(var.packetId, 'shop_list', self.entry['id'])
                        effect:
                          stroke:
                            width: 1
                            color: ~90,170,255,50
                        children:
                          商店图标:
                            type: Slot
                            attribute:
                              entryKey: 0.round()
                              slotType: ~Icon
                              itemScale: 0.8
                              x: 12
                              y: 8
                              width: 32
                              height: 32
                              through: true
                              seticon: "self.setItemIcon(var.shopIcons[self.entryKey])"
                          商店名称:
                            type: Text
                            attribute:
                              x: 52
                              y: 0
                              width: 140
                              height: 48
                              texts: "var.shopTexts[self.parent.entryKey]"
                              center: false
                              fontSize: 28
                              through: true
                          强调条:
                            type: Texture
                            attribute:
                              x: 0
                              y: 10
                              width: 4
                              height: 28
                              visible: "self.parent.entry != none && self.parent.entry['id'] == var.shopId"
                              normal: ~140,200,255,240
                              shape: ~round_rect
                              radius: 2
                              through: true

          # ── 右侧商品区 ──────────────────────────────
          商品卡片:
            type: Texture
            attribute:
              x: 290
              y: 110
              width: 1078
              height: 720
              normal: ~42,45,58,220
              shape: ~round_rect
              radius: 18
            effect:
              stroke:
                width: 2
                color: ~90,170,255,50
            children:
              # ── 数量工具栏（全局数量，左键±1 右键±10）──
              工具栏底条:
                type: Texture
                attribute:
                  x: 14
                  y: 10
                  width: 1050
                  height: 44
                  normal: ~36,38,48,200
                  shape: ~round_rect
                  radius: 10
                  through: true
                effect:
                  stroke:
                    width: 1
                    color: ~90,170,255,40
              数量标签:
                type: Text
                attribute:
                  x: 30
                  y: 26
                  texts: "~&7购买数量"
                  fontSize: 24
                  through: true
              数量步进器:
                type: HStack
                attribute:
                  x: 140
                  y: 14
                  spaceBetween: 10
                children:
                  减按钮:
                    type: Canvas
                    attribute:
                      width: 36
                      height: 36
                      tip: "~左键 -1，右键 -10"
                    action:
                      clickLeft: |-
                        if(var.quantity > 1){
                          var.quantity = var.quantity - 1
                        }
                      clickRight: |-
                        if(var.quantity > 10){
                          var.quantity = var.quantity - 10
                        } else {
                          var.quantity = 1
                        }
                    children:
                      减背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~56,58,70,220
                          hover: ~Frosted:0;255,255,255,80
                          shape: ~round_rect
                          radius: 10
                      减文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 36
                          texts: "~&f-"
                          fontSize: 26
                          through: true
                  数量文本:
                    type: Text
                    attribute:
                      y: 12
                      texts: "~&7数量: &f{var.quantity.round()}"
                      fontSize: 24
                      through: true
                  加按钮:
                    type: Canvas
                    attribute:
                      width: 36
                      height: 36
                      tip: "~左键 +1，右键 +10"
                    action:
                      clickLeft: |-
                        var.quantity = var.quantity + 1
                      clickRight: |-
                        var.quantity = var.quantity + 10
                    children:
                      加背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~56,58,70,220
                          hover: ~Frosted:0;255,255,255,80
                          shape: ~round_rect
                          radius: 10
                      加文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          width: 36
                          texts: "~&f+"
                          fontSize: 26
                          through: true

              商品纵向滑块:
                type: Texture
                val: 商品纵向滑块
                attribute:
                  x: 1062
                  y: 64
                  width: 6
                  height: 50
                  normal: ~120,120,120,200
                  maxDragY: 596
              商品滚动:
                type: Scroll
                val: 商品滚动
                attribute:
                  x: 10
                  y: 64
                  width: 1052
                  height: 646
                  moveY: "self.parent['商品纵向滑块'].getDragYRatio()"
                action:
                  wheel: |-
                    if(self.moveY >= 0 && self.wheelValue > 0){
                      self.parent['商品纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                    if(self.moveY <= 1 && self.wheelValue < 0){
                      self.parent['商品纵向滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                    }
                children:
                  商品列表:
                    val: 商品列表
                    type: HGrid
                    attribute:
                      width: 1052
                      column: 3
                      spaceBetweenX: 16
                      spaceBetweenY: 16
                    children:
                      商品项:
                        type: Texture
                        attribute:
                          entryKey: 0.round()
                          entry: var.items[self.entryKey]
                          visible: self.entry != none
                          width: 340
                          height: 300
                          normal: ~50,53,66,220
                          hover: ~Frosted:0;90,150,230,80
                          shape: ~round_rect
                          radius: 16
                        effect:
                          stroke:
                            width: 1
                            color: ~90,170,255,40
                        children:
                          商品图标:
                            type: Slot
                            attribute:
                              entryKey: 0.round()
                              slotType: ~Icon
                              itemScale: 1.1
                              x: 126
                              y: 16
                              width: 88
                              height: 88
                              normal: ~40,42,54,220
                              shape: ~round_rect
                              radius: 12
                              through: true
                              seticon: "self.setItemIcon(var.itemJsons[self.entryKey])"
                          名称:
                            type: Text
                            attribute:
                              x: 170
                              y: 116
                              center: true
                              texts: "self.parent.entry != none ? '&f' + self.parent.entry['name'] : none"
                              fontSize: 28
                              through: true
                          价格:
                            type: Text
                            attribute:
                              x: 170
                              y: 148
                              center: true
                              texts: "self.parent.entry != none ? '&e价格: &f' + self.parent.entry['price'] : none"
                              fontSize: 24
                              through: true
                          库存:
                            type: Text
                            attribute:
                              x: 170
                              y: 180
                              center: true
                              texts: "self.parent.entry != none ? '&7库存: &f' + self.parent.entry['stock'] : none"
                              fontSize: 20
                              through: true
                          限购:
                            type: Text
                            attribute:
                              x: 170
                              y: 206
                              center: true
                              texts: "self.parent.entry != none && self.parent.entry['limitText'] != none ? '&c' + self.parent.entry['limitText'] : none"
                              fontSize: 18
                              through: true
                          购买按钮:
                            type: Canvas
                            attribute:
                              x: 110
                              y: 240
                              width: 120
                              height: 40
                              visible: "self.parent.entry != none && var.shopId != none"
                              enable: "!var.actionBusy && var.actionToken != ''"
                            action:
                              clickLeft: |-
                                var.actionBusy = true
                                Packet.send(var.packetId, 'shop_buy', var.shopId, self.parent.entry['key'], var.quantity, var.actionToken)
                            children:
                              购买背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~60,180,100,200
                                  hover: ~Frosted:0;80,220,120,80
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  stroke:
                                    width: 1
                                    color: ~80,255,140,120
                              购买文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 120
                                  texts: "var.quantity > 1 ? '&f购买 x' + var.quantity.round() : '&f购买'"
                                  fontSize: 42
                                  through: true
              空商品提示:
                type: Text
                attribute:
                  x: 539
                  y: 380
                  center: true
                  fontSize: 100
                  visible: "var.items == none || var.items.keys().length == 0"
                  texts: "~&8暂无商品"
                  through: true
