      var.actionBusy = false
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    load: |-
      var.actionToken = ''
      var.calendarCount = 31
      var.makeupCardCount = 0
      var.serverSignInGoalCurrent = 0
      var.serverSignInGoalNext = 0
      var.signInStreak = 0
      var.signInTotal = 0
      var.currentPage = 'signin'
      var.currentRewardTab = 'stage'
      var.emptyItemJson = '{"id":"minecraft:air","Count":1b}'
      var.actionBusy = false
      var.actionBusySeconds = 0
      var.stageRefs = {}
      var.periodicRefs = {}
      var.signinRefs = {}
      var.selectedRefs = {}
      var.stageGeneration = 0
      var.periodicGeneration = 0
      var.signinGeneration = 0
      var.selectedGeneration = 0
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.calendarW = (var.contentW - 96) * 0.62
      var.previewW = (var.contentW - 96) * 0.38
    open: |-
      var.calendarRate = 0
      var.dailyTimeText = '0分钟'
      var.monthlyTimeText = '0分钟'
      var.offlineSavingsText = '0分钟'
      var.packetId = 'AXS_ONLINE_REWARDS'
      var.progressPercentText = '0'
      var.progressTitle = '等待同步'
      var.rewardStageText = '0/0'
      var.selectedActionText = '等待同步'
      var.totalTimeText = '0分钟'
      var.weeklyTimeText = '0分钟'
      Packet.send(var.packetId, 'refresh')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.calendarW = (var.contentW - 96) * 0.62
      var.previewW = (var.contentW - 96) * 0.38
controls:
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;32,49,44,170
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: var.viewW
          height: 112
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~224,237,227,250
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 3
              normal: ~157,114,70,255
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 8
              height: 54
              normal: ~157,114,70,255
          标题:
            type: Text
            attribute:
              point: ~top_left
              x: 76
              y: 18
              texts: ~&0出勤纪事
              fontSize: 54
          标题副文:
            type: Text
            attribute:
              point: ~top_left
              x: 78
              y: 76
              texts: ~&8ONLINE REWARDS / 在线奖励
              fontSize: 36
          签到状态底:
            type: Texture
            attribute:
              point: ~middle_left
              x: 470
              width: 244
              height: 56
              normal: "var.signedToday ? '177,207,188,255' : '219,192,153,255'"
              shape: ~round_rect
              radius: 8
          签到状态:
            type: Text
            attribute:
              point: ~middle_left
              x: 492
              texts: "'&0' + var.signInStatusText"
              fontSize: 36
          刷新按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -176
              width: 124
              height: 56
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'refresh')
            children:
              刷新底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~204,223,209,255
                  hover: ~235,225,202,255
                  shape: ~round_rect
                  radius: 8
                effect:
                  stroke:
                    width: 2
                    color: "self.isHovered() ? '157,114,70,255' : '153,179,162,255'"
              刷新文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&0刷新
                  fontSize: 36
                  through: true
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -48
              width: 104
              height: 56
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~55,77,66,255
                  hover: ~112,83,62,255
                  shape: ~round_rect
                  radius: 8
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: ~&f关闭
                  fontSize: 36
                  through: true
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 144
          width: 300
          height: "var.viewH - 176"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~218,232,221,250
              shape: ~round_rect
              radius: 12
          目录标题:
            type: Text
            attribute:
              point: ~top_left
              x: 24
              y: 28
              texts: ~&8纪事目录
              fontSize: 36
          导航签到:
            type: Canvas
            attribute:
              point: ~top_left
              x: 16
              y: 90
              width: 268
              height: 76
            action:
              clickLeft: |-
                var.currentPage = 'signin'
            children:
              签到底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.currentPage == 'signin' ? '55,77,66,255' : '233,241,234,255'"
                  shape: ~round_rect
                  radius: 8
                effect:
                  stroke:
                    width: 2
                    color: "self.isHovered() ? '174,128,77,255' : '170,190,175,255'"
              签到导航文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 20
                  texts: "var.currentPage == 'signin' ? '&f01  签到日历' : '&001  签到日历'"
                  fontSize: 36
                  through: true
              签到高亮条:
                type: Texture
                attribute:
                  point: ~middle_right
                  x: -8
                  width: 4
                  height: 40
                  normal: ~199,158,104,255
