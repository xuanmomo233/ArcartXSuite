# ============================================================
#  文件用途: Chat 模块消息文件
#  定义 Chat 模块所有命令反馈、状态提示和错误消息的文本内容。
# ------------------------------------------------------------
#  支持 & 颜色码（如 &c 红色）和 {0} {1} 占位符。
#  修改后执行 /axs reload chat 即可生效。
# ============================================================

prefix: "&3◆ &6ArcartXSuite &7| &r"  # 消息前缀，所有 Chat 模块消息前自动添加

# ── 通用 ──────────────────────────────────────────────
common:
  service-down: "&c服务未启动。"              # 核心服务未运行时的提示
  module-down: "&c聊天模块当前未启用。"        # Chat 模块未启用时的提示
  unknown: "&e未知命令，使用 /{0} chat help"  # 未知子命令提示
  only-player: "&c该命令只能由玩家执行。"      # 非玩家（控制台）执行限制提示
  no-permission: "&c你没有权限执行这个命令。"  # 权限不足提示

# ── help ──────────────────────────────────────────────
help:
  title: "&6Chat 管理命令"                              # 帮助标题
  status: "&7{0} status&f - 查看模块状态"               # status 子命令说明
  mute: "&7{0} mute <玩家> <时长> [原因]&f - 禁言"      # mute 子命令说明
  unmute: "&7{0} unmute <玩家>&f - 解除禁言"            # unmute 子命令说明
  spy: "&7{0} spy <玩家> <on|off>&f - 私聊监听"         # spy 子命令说明
  redpacket: "&7{0} redpacket <normal|lucky|预设ID> <金额> <个数>&f - 发放红包"  # redpacket 子命令说明

# ── status ────────────────────────────────────────────
status:
  title: "&6Chat 状态"                          # 状态信息标题
  channels: "&7频道数: &f{0}"                   # 已加载频道数量
  cache-state: "&7缓存状态: &f{0}"              # 玩家缓存状态摘要
  cache-mute: "&7缓存禁言: &f{0}"               # 禁言缓存摘要
  cross-server: "&7跨服通道: &f{0}"             # 跨服通道连接状态

# ── mute / unmute / spy ───────────────────────────────
mute:
  usage: "&e用法: /axs chat mute <玩家> <时长> [原因]"  # mute 命令用法提示
unmute:
  usage: "&e用法: /axs chat unmute <玩家>"             # unmute 命令用法提示
spy:
  usage: "&e用法: /axs chat spy <玩家> <on|off>"       # spy 命令用法提示

# ── player ────────────────────────────────────────────
player:
  no-permission-msg: "&c你没有权限使用私聊。"                    # 私聊权限不足
  current-channel: "&7当前频道: &f{0}"                          # 当前所在频道
  toggle-status: "&7私聊接收 / 提及接收 / 社交监听: &f{0} &7/ &f{1} &7/ &f{2}"  # 三项开关状态
  reply-status: "&7最近私聊对象 / 忽略数: &f{0} &7/ &f{1}"     # 回复目标与忽略数
  channel-usage: "&e用法: /{0} channel <id>"                   # channel 子命令用法
  toggle-usage: "&e用法: /{0} toggle <private|mentions> [on|off]"  # toggle 子命令用法
  toggle-invalid: "&c状态只能是 on 或 off。"                    # 无效开关值
  ignore-usage: "&e用法: /{0} ignore <player>"                 # ignore 子命令用法
  unignore-usage: "&e用法: /{0} unignore <player>"             # unignore 子命令用法
  chat-usage: "&e用法: /{0} channel|toggle|ignore|unignore|socialspy|redpacket|grab"  # chat 总用法
  msg-usage: "&e用法: /{0} <player> <message>"                 # msg 命令用法
  reply-usage: "&e用法: /{0} <message>"                        # reply 命令用法
  redpacket-usage: "&e用法: /{0} redpacket <normal|lucky> <总金额> <个数> [祝福语]"  # 发红包用法
  grab-usage: "&e用法: /{0} grab <红包ID>"                     # 抢红包用法
  help:
    title: "&6聊天 命令"
    channel: "&7/chat channel <频道ID>&f - 切换聊天频道"
    toggle: "&7/chat toggle <private|mentions> [on|off]&f - 切换私聊/提及接收"
    ignore: "&7/chat ignore <玩家>&f - 忽略玩家私聊"
    unignore: "&7/chat unignore <玩家>&f - 取消忽略玩家"
    socialspy: "&7/chat socialspy [on|off]&f - 切换社交监听"
    redpacket: "&7/chat redpacket <normal|lucky> <金额> <个数> [祝福]&f - 发送红包"
    grab: "&7/chat grab <id>&f - 领取红包"
    links: "&7/chat party、/chat meeting、/chat ready、/chat share&f - 小队和分享"
    preferences: "&7/chat subscribe、/chat unsubscribe、/chat quiet、/chat mentions&f - 频道偏好和提及"
    reports: "&7/chat history、/chat report&f - 最近消息和举报"

