# 文件用途: 常规武器箱卡池数据定义。
# 定义 CS 开箱风格武器箱的消耗、稀有度权重和武器皮肤物品池。
# 类型为 CASE（CS 开箱），使用钥匙开启，包含7个稀有度等级。

id: "default_weapon_case"  # 卡池唯一标识
type: CASE  # 卡池类型：CASE（CS 开箱）
enabled: true  # 是否启用
display-name: "常规武器箱"  # 显示名称
description: |-  # 卡池描述文本
  常规武器箱
  使用武器箱钥匙开启，可获得各种稀有度的武器皮肤。
  包含从消费级到隐秘级的多款皮肤，更有罕见特殊级掉落！
up-item-icon: '{"id":"minecraft:chest","Count":1b}'  # UP 物品图标（JSON 格式）
# up-item-icon、points.*.icon 与奖品的 icon 都支持完整图标定义（与 Menu 模块一致）：
#   material / amount / name / lore / custom-model-data / glow
#   skull-texture / color / source + id / mmo-type + mmo-id
#   json / texture / texture-url / nbt
# nbt 支持两种写法：
#   nbt:
#     CustomTag: "value"                       # 写法一：键值映射，逐个写入字符串标签
#   nbt: "{CustomTag:'value',Unbreakable:1b}"  # 写法二：整段 SNBT 字符串

# cost 必须使用条目列表；显式空列表才表示免费奖池。
cost:
  single:
    - type: ITEM
      id: "CaseKey"
      amount: 1
      display-name: "CaseKey"
  ten:
    - type: ITEM
      id: "CaseKey"
      amount: 10
      display-name: "CaseKey"

points:
  dust:
    display-name: "尘辉"
    icon: "minecraft:quartz"
    per-pull: 1
    rarity:
      COMMON: 1
      RARE: 2
      EPIC: 4

case:  # 开箱机制参数
  rarity-settings:  # 稀有度权重配置（base-weight 越大越常见）
    COMMON:  # 普通（灰色）
      color: "&f"  # 显示颜色代码
      base-weight: 15625  # 基础权重
    UNCOMMON:  # 不凡（浅蓝灰）
      color: "&b"
      base-weight: 3125
    RARE:  # 稀有（蓝色）
      color: "&9"
      base-weight: 625
    EPIC:  # 史诗（紫色）
      color: "&5"
      base-weight: 125
    LEGENDARY:  # 传说（红色）
      color: "&d"
      base-weight: 25
    MYTHIC:  # 神话（金色）
      color: "&c"
      base-weight: 5
    SPECIAL:  # 特殊（亮金色，最稀有）
      color: "&6"
      base-weight: 2

  items:  # 武器皮肤物品池
    skin_p250_sand:
      id: "skin_p250_sand"  # 物品唯一标识
      name: "P250 | 沙漠风暴"  # 物品显示名称
      rarity: COMMON  # 稀有度等级（消费级）
      plugin-type: NeigeItems  # 物品来源插件类型：NeigeItems
      plugin-id: "P250_SandDune"  # 物品来源插件内部 ID
      delivery: DIRECT  # 发放方式：DIRECT（直接发放）

    skin_mp9_storm:
      id: "skin_mp9_storm"
      name: "MP9 | 风暴"
      rarity: UNCOMMON  # 稀有度等级（工业级）
      plugin-type: NeigeItems
      plugin-id: "MP9_Storm"
      delivery: DIRECT

    skin_m4a4_cyber:
      id: "skin_m4a4_cyber"
      name: "M4A4 | 赛博危情"
      rarity: RARE  # 稀有度等级（军规级）
      plugin-type: NeigeItems
      plugin-id: "M4A4_CyberSecurity"
      delivery: DIRECT

    skin_usps_printstream:
      id: "skin_usps_printstream"
      name: "USP-S | 印花集"
      rarity: EPIC  # 稀有度等级（受限级）
      plugin-type: NeigeItems
      plugin-id: "USPS_Printstream"
      delivery: DIRECT

    skin_ak47_redline:
      id: "skin_ak47_redline"  # 物品唯一标识
      name: "AK-47 | 红线"  # 物品显示名称
      rarity: LEGENDARY  # 稀有度等级
      plugin-type: NeigeItems  # 物品来源插件类型：NeigeItems
      plugin-id: "AK47_Redline"  # 物品来源插件内部 ID
      delivery: DIRECT  # 发放方式：DIRECT（直接发放）

    skin_awp_dragon:
      id: "skin_awp_dragon"
      name: "AWP | 巨龙传说"
      rarity: MYTHIC  # 神话级（金色）
      plugin-type: NeigeItems
      plugin-id: "AWP_DragonLore"
      delivery: DIRECT

    skin_karambit_fade:
      id: "skin_karambit_fade"
      name: "★ 爪子刀 | 渐变"
      rarity: SPECIAL  # 特殊级（罕见特殊，刀/手套）
      plugin-type: NeigeItems
      plugin-id: "Karambit_Fade"
      delivery: DIRECT
