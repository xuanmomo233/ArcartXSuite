                              through: true
                          摘要:
                            type: Text
                            attribute:
                              entryKey: 0.round()
                              point: ~middle_left
                              x: 230
                              texts: "var.historyRows[self.entryKey] != none ? var.historyRows[self.entryKey]['summary'] : ''"
                              fontSize: 36
                              through: true
              历史空态:
                type: Text
