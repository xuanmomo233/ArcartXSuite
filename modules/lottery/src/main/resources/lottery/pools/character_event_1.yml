# 文件用途: 角色活动祈愿卡池数据定义。
# 定义角色活动祈愿的消耗、保底机制、概率参数和各星级物品池（UP/常驻）。
# 类型为 GACHA（原神祈愿），5星保底90抽，UP角色概率50%。

id: "character_event_1"  # 卡池唯一标识
type: GACHA  # 卡池类型：GACHA（原神祈愿）
enabled: true  # 是否启用
display-name: "角色活动祈愿"  # 显示名称
description: |-  # 卡池描述文本
  角色活动祈愿
  在本祈愿中，5星角色「星辰」的获取概率将大幅提升！
  5星保底90抽，4星保底10抽，UP角色概率50%。
# UP 物品图标
up-item-icon:
  source: "mythicmobs"
  id: "LottoStarCharacter"
# 未配置 up-item-icon 时自动使用 UP 5星奖品（CASE 池为最高稀有度奖品）的物品作为图标；up-item-icon 配置可以省略。
# 奖品未配置 icon 时使用该奖品 item 生成的物品作为图标。
# 图标配置分为物品库物品与自定义物品，两种写法二选一。
# up-item-icon:
  #############################################################
  # --- 物品库物品：source + id（与下方 material 写法二选一） ---
  # -------------------------------
  # source: "mythicmobs"                         # 物品库来源
  # id: "LottoStarCharacter"                     # 物品库物品 ID
  ############################################################
  # --- MMOItems 物品：source + mmo-type + mmo-id ---
  # -------------------------------
  # source: "mmoitems"
  # mmo-type: "ARMOR"                         # MMOItems 类型
  # mmo-id: "LOTTO_STAR_HELMET"               # MMOItems 物品 ID
  ############################################################
  # --- 自定义物品：material 及其它字段 ---
  # material: NETHER_STAR                      # Minecraft 材质
  # amount: 1                                  # 图标数量
  # name: "星辰"                               # 图标名称
  # lore:                                      # 图标 Lore
  #   - "&7自定义图标说明"                      # Lore 文本
  # custom-model-data: 0                       # 自定义模型数据
  # glow: true                                 # 是否显示附魔光效
  # skull-texture: "base64..."                 # 玩家头颅纹理
  # color: "#FF5555"                           # 可染色材质的颜色
  #
  # --- nbt写法二选一 ---
  # nbt:                                       # 图标 NBT 键值映射写法，与下方整段 SNBT 写法二选一
  #   CustomTag: "value"                       # 图标 NBT 键值
  # 或者
  # nbt: "{CustomTag:'value',Unbreakable:1b}"  # 图标 NBT 整段 SNBT 写法，与上方键值映射二选一
  #
  # ---ArcartX 读取物品的 icon / url NBT 来渲染自定义贴图（详见ArcartX wiki：自定义物品贴图）---
  # texture: "item"                            # 写入 icon NBT，渲染 resource/item_icon/ 下的贴图（手持 / AX-UI）；子目录用 "xxx/xxx"
  # texture-url: "menu/icon.png"               # 写入 url NBT，仅用于原版 GUI(箱子菜单)图标，支持文件路径 / 网络链接 / GIF
  ############################################################
  # --- 直接发送 json/NBT 给 slot 控件（完全自定义物品） ---
  # json: '{"id":"minecraft:diamond","Count":1b}'  # 完整物品 JSON；配置后不再叠加其它字段或 texture/texture-url/nbt
  ####################################################################################################################

cost:
  single:
    - type: CURRENCY
      id: "gem"
      amount: 160
      display-name: "原石"
      icon:
        material: DIAMOND
        name: "原石"
    - type: ITEM
      amount: 1
      display-name: "纠缠之缘"
      icon:
        material: AMETHYST_SHARD
        name: "纠缠之缘"
      matcher:
        material-ids:
          - AMETHYST_SHARD
        lore-contains:
          - "纠缠之缘"
        nbt-values:
          axs:lottery_token: "intertwined_fate"
  ten:
    - type: CURRENCY
      id: "gem"
      amount: 1600
      display-name: "原石"
      icon:
        material: DIAMOND
        name: "原石"
    - type: ITEM
      amount: 10
      display-name: "纠缠之缘"
      icon:
        material: AMETHYST_SHARD
        name: "纠缠之缘"
      matcher:
        material-ids:
          - AMETHYST_SHARD
        lore-contains:
          - "纠缠之缘"
        nbt-values:
          axs:lottery_token: "intertwined_fate"

# 积分产出规则：gacha 的 rarity key 使用星级（3/4/5），case 使用奖池中定义的 rarity 名称
points:
  stardust:
    display-name: "星尘"
    icon:
      material: AMETHYST_SHARD
      name: "星尘"
    per-pull: 1
    rarity:
      "4": 2
      "5": 10

gacha:  # 祈愿机制参数
  pool-type: CHARACTER  # 卡池类型：CHARACTER（角色池）
  pity-5star: 90  # 5星硬保底抽数
  pity-4star: 10  # 4星硬保底抽数
  soft-pity-start: 73  # 软保底起始抽数（之后概率递增）
  soft-pity-increment: 0.06  # 软保底每次递增量
  base-5star-rate: 0.006  # 5星基础概率（0.6%）
  base-4star-rate: 0.051  # 4星基础概率（5.1%）
  up-rate: 0.5  # UP 物品在对应星级中的概率（50%）
  shared-pity-group: "character_events"  # 共享保底分组（同组卡池共享保底计数）

  up-5star-items:  # UP 5星物品池（概率提升）
    star_character:
      name: "星辰"  # 物品显示名称
      item:
        source: mythicmobs
        id: "LottoStarCharacter"
      # 未配置 icon 时使用 item 生成的物品作为图标。
      delivery: DIRECT  # 发放方式：DIRECT（直接发放）
      weight: 1  # 权重（同池内相对概率）

  standard-5star-items:  # 常驻 5星物品池（未命中 UP 时的 fallback）
    moon_character:
      name: "月影"
      item:
        source: mythicmobs
        id: "MoonCharacter"
      delivery: DIRECT
      weight: 1

  up-4star-items:  # UP 4星物品池（概率提升）
    star_sword:
      name: "星光剑"
      item:
        source: neigeitems
        id: "StarSword"
      delivery: DIRECT
      weight: 1

  standard-4star-items:  # 常驻 4星物品池（未命中 UP 时的 fallback）
    wind_bow:
      name: "风之弓"
      item:
        source: neigeitems
        id: "WindBow"
      delivery: DIRECT
      weight: 1

  star3-items:  # 3星物品池（保底之外的基础掉落）
    material_common:
      name: "普通材料"
      item:
        source: minecraft
        id: "minecraft:stone"
      delivery: DIRECT
      weight: 1

    # COMMAND 投递不发放物品，因此无需配置 item。
    # commands 和 extra-commands 均支持 {player}、{uuid}、{amount}、{item} 占位符。
    command_demo:
      name: "命令奖励示例"
      delivery: COMMAND
      commands:
        - "give {player} minecraft:stone 1"
      weight: 1
