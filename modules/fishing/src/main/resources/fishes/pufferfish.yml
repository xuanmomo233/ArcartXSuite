# 鱼类定义：河豚
# 河豚是一种不常见的海洋鱼类，夏季午后出现，以突进式行为为主，难度中等
# 鱼类文件位于 fishes/ 目录，每个文件定义一种鱼

id: "pufferfish"               # 鱼类唯一标识符
display-name: "河豚"            # 显示名称
rarity: uncommon               # 稀有度等级（uncommon=不常见）
min-size: 5                    # 最小尺寸（厘米）
max-size: 25                   # 最大尺寸（厘米）
base-price: 200                # 基础售价（游戏货币）
base-xp: 35                    # 基础经验值（捕获时获得）
seasons: [summer]              # 可捕获季节（仅夏季）
weathers: [clear, rain]        # 可捕获天气（晴天、雨天）
time-ranges:                   # 可捕获时间段
  - start: "12:00"             # 开始时间（12:00，正午）
    end: "16:00"               # 结束时间（16:00，午后时段）
item:                          # 捕获后掉落的物品定义
  source: "minecraft"          # 物品来源（minecraft=原版物品）
  id: "pufferfish"        # 原版物品ID（河豚）
  amount: 1                    # 物品数量
difficulty: 55                 # 钓鱼难度（0-100，中等难度）
behaviors:                     # 小游戏中鱼的行为模式及权重
  - type: dart                 # 突进型：鱼快速跳跃移动
    weight: 0.8                # 权重0.8（主要行为）
  - type: floater              # 上浮型：鱼向轨道顶部移动
    weight: 0.2                # 权重0.2（次要行为）

# ─── 小游戏机制（可选，覆盖全局配置） ──────────────────
# 河豚突进型行为，逃离较频繁但速度不快
flee-params:
  base-chance: 0.30            # 逃离概率较高（全局默认0.25）
  base-speed: 0.03             # 逃离速度中等（全局默认0.04）
  min-duration: 12             # 逃离持续较短（全局默认15）

# 多阶段行为：河豚越钓越暴躁
behavior-stages:
  stage1:
    threshold: 0.0             # 进度 0% 起：正常突进
    behaviors:
      - type: dart
        weight: 0.8
      - type: floater
        weight: 0.2
  stage2:
    threshold: 0.6             # 进度 60% 后：加入之字型
    behaviors:
      - type: dart
        weight: 0.5
      - type: zigzag           # 之字型：规律性左右摆动
        weight: 0.3
      - type: floater
        weight: 0.2

# ─── 奖励（可选） ──────────────────────────────────────
# 货币奖励
currency-reward:
  currency-id: "coin"
  amount: 30

# 完美捕获额外掉落
drops:
  perfect_bonus:
    item:
      source: "minecraft"
      id: "prismarine_shard"
      amount: 2
    weight: 1.0
    condition: "perfect"       # 完美捕获时掉落海晶碎片

# ─── 出现条件（可选） ──────────────────────────────────
biomes: [ocean, beach, lukewarm_ocean]  # 仅在海洋类生物群系出现

# ─── 数据/展示（可选） ─────────────────────────────────
description: "夏季午后出现在海洋中的不常见鱼类，受惊时会快速突进，需把握节奏。"
icon-texture: "minecraft:pufferfish"
record-weight: 0.8
