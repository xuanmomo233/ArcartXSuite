# ArcartXSuite Mail — 新邮件通知卡片模板
# 象牙色信纸 / 酒红封印 / 主题阅读区 / 全宽打开邮箱操作带。
# 保持所有数据文字为 root_control 的直接子控件，self.parent.data 仍为卡片数据。
# 宽度跟随最长文字，高度跟随完整主题（msg0–msg9）及操作带，不采用全屏 Adaptive。
root_control:
  type: card
  attribute:
    width: "Math.max(600, Math.max(Math.max(val.notice_label.x + val.notice_label.width, val.title_label.x + val.title_label.width), Math.max(val.subject_heading.x + val.subject_heading.width, Math.max(val.subject_label.x + val.subject_label.width, val.open_label.x + val.open_label.width))) + 28)"
    height: "Math.max(260, val.subject_label.y + val.subject_label.height + val.open_label.height + 72)"
  children:
    background:
      type: Texture
      val: mail_surface
      attribute:
        width: "self.parent.width"
        height: "self.parent.height"
        normal: ~246,239,222,250
        hover: ~255,247,231,255
        shape: ~round_rect
        radius: 12
      effect:
        stroke:
          width: 2
          color: ~176,149,119,235
      action:
        click: |-
          Chat.say('/axsmail')
    letter_art:
      type: Canvas
      attribute:
        x: 24
        y: 28
        width: 100
        height: 90
        through: true
      children:
        letter_paper:
          type: Texture
          attribute:
            x: 2
            y: 8
            width: 96
            height: 72
            normal: ~235,220,192,255
            shape: ~round_rect
            radius: 6
            through: true
          effect:
            stroke:
              width: 2
              color: ~180,151,118,255
        fold_left:
          type: Texture
          attribute:
            x: 10
            y: 28
            width: 46
            height: 2
            rotate: 32
            normal: ~180,151,118,255
            through: true
        fold_right:
          type: Texture
          attribute:
            x: 44
            y: 28
            width: 46
            height: 2
            rotate: -32
            normal: ~180,151,118,255
            through: true
        seal:
          type: Texture
          attribute:
            x: 22
            y: 18
            width: 56
            height: 56
            normal: ~112,42,58,255
            shape: ~circle
            through: true
          effect:
            stroke:
              width: 2
              color: ~157,76,86,255
    icon:
      type: Text
      attribute:
        fontSize: 48
        x: "74 - self.width / 2"
        y: "74 - self.height / 2"
        texts: "'§f✉'"
        through: true
    letter_rule:
      type: Texture
      attribute:
        x: 138
        y: 24
        width: 2
        height: "val.subject_label.y + val.subject_label.height - 24"
        normal: ~211,191,162,255
        through: true
    notice_label:
      type: Text
      val: notice_label
      attribute:
        fontSize: 36
        x: 158
        y: 20
        texts: ~§4新邮件送达
        through: true
    title_label:
      type: Text
      val: title_label
      attribute:
        fontSize: 48
        x: 158
        y: "val.notice_label.y + val.notice_label.height + 12"
        texts: "'§8来自  §0' + self.parent.data['senderName']"
        through: true
    subject_paper:
      type: Texture
      attribute:
        x: 150
        y: "val.subject_heading.y - 10"
        width: "self.parent.width - 170"
        height: "val.subject_label.y + val.subject_label.height - val.subject_heading.y + 22"
        normal: ~235,224,202,255
        shape: ~round_rect
        radius: 8
        through: true
    subject_heading:
      type: Text
      val: subject_heading
      attribute:
        fontSize: 36
        x: 176
        y: "val.title_label.y + val.title_label.height + 20"
        texts: ~§8邮件主题
        through: true
    subject_label:
      type: Text
      val: subject_label
      attribute:
        fontSize: 54
        x: 176
        y: "val.subject_heading.y + val.subject_heading.height + 10"
        through: true
        texts:
          - "'§0' + self.parent.data['msg0']"
          - "self.parent.data['msg1'] != none ? '§0' + self.parent.data['msg1'] : none"
          - "self.parent.data['msg2'] != none ? '§0' + self.parent.data['msg2'] : none"
          - "self.parent.data['msg3'] != none ? '§0' + self.parent.data['msg3'] : none"
          - "self.parent.data['msg4'] != none ? '§0' + self.parent.data['msg4'] : none"
          - "self.parent.data['msg5'] != none ? '§0' + self.parent.data['msg5'] : none"
          - "self.parent.data['msg6'] != none ? '§0' + self.parent.data['msg6'] : none"
          - "self.parent.data['msg7'] != none ? '§0' + self.parent.data['msg7'] : none"
          - "self.parent.data['msg8'] != none ? '§0' + self.parent.data['msg8'] : none"
          - "self.parent.data['msg9'] != none ? '§0' + self.parent.data['msg9'] : none"
    open_band:
      type: Texture
      attribute:
        x: 16
        y: "self.parent.height - self.height - 16"
        width: "self.parent.width - 32"
        height: "val.open_label.height + 28"
        normal: "val.mail_surface.isHovered() ? '135,51,68,255' : '112,42,58,255'"
        shape: ~round_rect
        radius: 8
        through: true
    open_arrow:
      type: Canvas
      attribute:
        x: 32
        y: "val.open_label.y + val.open_label.height / 2 - 10"
        width: 24
        height: 20
        through: true
      children:
        arrow_line:
          type: Texture
          attribute:
            x: 0
            y: 9
            width: 20
            height: 2
            normal: ~255,247,231,255
            through: true
        arrow_top:
          type: Texture
          attribute:
            x: 12
            y: 5
            width: 10
            height: 2
            rotate: 45
            normal: ~255,247,231,255
            through: true
        arrow_bottom:
          type: Texture
          attribute:
            x: 12
            y: 13
            width: 10
            height: 2
            rotate: -45
            normal: ~255,247,231,255
            through: true
    open_label:
      type: Text
      val: open_label
      attribute:
        fontSize: 48
        x: 76
        y: "self.parent.height - self.height - 30"
        texts: ~§f点击打开邮箱  §f/axsmail
        through: true
