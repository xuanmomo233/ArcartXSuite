# 鱼竿定义：木制钓竿
# 基础钓竿 — 示例配置，新手默认钓竿
# 鱼竿物品通过 PDC 标签 axs_fishing_rod_id 识别
# 鱼竿文件位于 rods/ 目录，每个文件定义一种鱼竿
#
# ⚠ 鱼竿识别仅依赖 PDC 标签，本文件不定义鱼竿物品材质。
#    要让某个物品库的物品成为鱼竿，需在该物品库配置里写入 NBT:
#    PublicBukkitValues."arcartx-suite:axs_fishing_rod_id" = "wooden_rod"
#    namespace "arcartx-suite" 来自主插件名 ArcartX-Suite 的小写。
#    物品库配置示例见各物品库目录下的 fishing_rod.yml。

id: "wooden_rod"               # 鱼竿唯一标识符（PDC 标签 axs_fishing_rod_id 的值）
# 宝藏概率加成（加到基础概率上）
treasure-chance-bonus: 0.05    # 宝藏概率额外+5%
# 绿条高度加成（像素）
green-bar-height-bonus: 8      # 小游戏绿色目标条高度+8像素（更容易捕获）
# 小游戏持续时间加成（ticks）
catch-duration-bonus: 60       # 小游戏持续时间+60 ticks（3秒，更充裕的操作时间）
# 经验倍率
exp-multiplier: 1.1            # 捕获经验×1.1倍
# 等级限制（玩家赛季等级）
min-player-level: 0            # 最低等级，0=无下限要求
max-player-level: 0            # 最高等级，0=无上限要求
