              x: 20
              y: 570
              texts: ~&e02 / 物品分类
              fontSize: 48
          分类滑轨:
            type: Texture
            attribute:
              point: ~top_right
              x: -12
              y: 612
              width: 10
              height: var.viewH - 780
              normal: ~53,40,33,245
              shape: ~round_rect
              radius: 5
            effect:
              stroke:
                width: 2
                color: ~224,194,152,230
          分类滑块:
            type: Texture
            val: 分类滑块
            attribute:
              point: ~top_right
              x: -12
              y: 612
              width: 10
              height: 50
              normal: ~190,122,79,255
              maxDragY: var.viewH - 830
              shape: ~round_rect
              radius: 5
          分类滚动:
            type: Scroll
            val: 分类滚动
            attribute:
              point: ~top_left
              x: 14
              y: 612
              width: 258
              height: var.viewH - 780
              moveY: self.parent['分类滑块'].getDragYRatio()
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              分类列表:
                type: VStack
                val: 分类列表
                attribute:
                  width: 258
                  spaceBetween: 8
                children:
                  项:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      entry: var.categories[self.entryKey]
                      visible: self.entry != none
                      width: 258
                      height: 48
                    action:
                      clickLeft: Packet.send(var.packetId, 'category', self.entry['id'])
                    children:
                      项底:
                        type: Texture
                        attribute:
                          point: ~middle_center
                          width: self.parent.width - 6
                          height: self.parent.height
                          through: true
                          normal: 'self.parent.entry != none && self.parent.entry[''id''] == var.categoryId ? ''105,66,47,250''
                            : ''56,43,36,255'''
                          shape: ~round_rect
                          radius: 12
                        effect:
                          stroke:
                            width: 3
                            color: 'self.isHovered() ? ''241,208,157,255'' : (self.parent.entry != none && self.parent.entry[''id'']
                              == var.categoryId ? ''226,179,124,255'' : ''112,83,64,235'')'
                      项字:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 18
                          texts: '''&f'' + var.categoryTexts[self.parent.entryKey]'
