              fontSize: 26
              through: true
          结果:
            type: Scroll
            attribute:
              x: "240"
              y: "var.pageH - 112"
              width: "var.pageW - 280"
              height: 32
              scrollAnim: none
              moveX: "self.scrollAnim != none ? self.scrollAnim.get() : 0"
            action:
              enter: |-
                self.scrollAnim = Lerp(0,1,2500)
              leave: |-
                self.scrollAnim = none
            children:
              文本:
                type: Text
                attribute:
                  x: 0
                  y: 0
                  texts: "'&7' + var.resultMsg"
                  fontSize: 24
                  through: true
  选择保护物品:
