                              fontSize: 20
                              through: true
                          领取按钮:
                            type: Canvas
                            attribute:
                              point: ~bottom_right
                              x: -8
                              y: -8
                              width: 72
                              height: 32
                              visible: "self.parent.entry != none && self.parent.entry['claimable'] == 'true'"
                            action:
                              clickLeft: |-
                                Packet.send(var.packetId, 'claim', self.parent.entry['level'], var.actionToken)
                            children:
                              领取背景:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  through: true
                                  normal: ~80,160,100,240
                                  hover: ~Frosted:0;100,200,130,255
                                  shape: ~round_rect
                                  radius: 16
                                effect:
                                  stroke:
                                    width: 1
                                    color: ~120,220,150,200
                              领取文字:
                                type: Text
                                attribute:
                                  point: ~middle_center
                                  width: 72
                                  texts: "~&f领取"
                                  fontSize: 20
                      # 典藏档卡片
                      典藏档卡片:
