# AXS Market — 个人回收保护
ui:
  isHud: false
  defaultOpen: false
  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  jei: false
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    action_result: |-
      var.actionToken = packet['action_token']
      if(packet['rejected'] == true){
        var.pending = false
        var.busy = false
        var.resultMsg = '会话已刷新，请重新确认设置'
      } else if(!var.pending){
        var.busy = false
      }
    guard_unavailable: |-
      var.ready = false
      var.autoStatus = '自动回收已暂停，正在读取或保存保护设置'
      var.pending = packet['saving'] == true
      var.busy = var.pending
      var.loading = false
      var.resultMsg = packet['message']
    guard_result: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.resultMsg = packet['message']
      if(packet['pending'] != true && packet['saving'] != true){
        var.pending = false
        var.busy = false
        var.loading = false
        if(packet['success'] == true){
          var.showConfirm = false
          var.showPicker = false
          var.pickToken = ''
        }
      } else if(!var.pending){
        var.loading = false
      }
    guard_pick: |-
      if(!var.showPicker){
        return
      }
      var.actionToken = packet['action_token']
      var.confirmVersion = packet['version']
      var.pickToken = packet['token']
      var.confirmName = packet['name']
      var.confirmText = packet['description']
      var.confirmIcon = (packet['icon'] != none && packet['icon'] != '') ? packet['icon'] : var.air
      var.confirmMode = 'add'
      var.showPicker = false
      var.showConfirm = true
      var.busy = false
      scheduler.delay(50, -> {
        if(val.确认物品 != none){
          val.确认物品.seticon()
        }
      })
    guard_data: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      if(var.showConfirm && !var.pending && var.confirmVersion != packet['version']){
        var.showConfirm = false
        var.pickToken = ''
        var.resultMsg = '保护设置已变化，请重新选择并确认'
      }
      var.version = packet['version']
      var.pending = packet['saving'] == true
      var.busy = var.pending
      var.autoEnabled = packet['auto']
      var.autoStatus = packet['autoStatus']
      var.page = packet['page']
      var.pages = packet['pages']
      var.pageText = packet['pageText']
      var.kind = packet['kind']
      var.total = packet['total']
      var.maximum = packet['maximum']
      var.rules = packet['rules']
      var.count = packet['count']
      var.ready = packet['ready'] == true && !var.pending
      var.loading = false
      var.icons = {}
      if(var.count > 0){
        for(i in range(0, var.count - 1)){
          key = i.round()
          var.icons[key] = (packet['ruleIcon' + key] != none && packet['ruleIcon' + key] != '') ? packet['ruleIcon' + key] : var.air
        }
      }
      var.rulesRenderPending = true
      scheduler.delay(50, -> {
        var.renderRuleRows()
      })
  action:
    load: |-
      var.packetId = 'AXS_MARKET'
      var.actionToken = ''
      var.ready = false
      var.loading = true
      var.pending = false
      var.busy = false
      var.version = ''
      var.confirmVersion = ''
      var.ruleCopies = {}
      var.ruleGeneration = 0
      var.rulesRenderPending = false
      var.iconsPending = false
      var.autoEnabled = false
      var.autoStatus = '正在读取个人设置'
      var.kind = 'ALL'
      var.rules = {}
      var.icons = {}
      var.count = 0
      var.renderedCount = -1
      var.total = 0
      var.maximum = 200
      var.page = 0
      var.pages = 1
      var.pageText = '1/1'
      var.resultMsg = ''
      var.pickKind = 'EXCLUDE'
      var.pickToken = ''
      var.confirmMode = ''
      var.confirmName = ''
      var.confirmText = ''
      var.confirmRule = ''
      var.showPicker = false
      var.showConfirm = false
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.confirmIcon = var.air
      var.retrySeconds = 0
      var.renderRuleRows = -> {
        if(val.保护行区 != none){
          if(var.count != var.renderedCount){
            for(key in var.ruleCopies.keys()){
              var.ruleCopies[key].remove()
            }
            var.ruleCopies = {}
            var.ruleGeneration = var.ruleGeneration + 1
            if(var.count > 1){
              for(i in range(1, var.count - 1)){
                e = val.保护行区.get(0).copy('保护行_' + var.ruleGeneration.round() + '_' + i.round())
                e.entryKey = i.round()
                var.ruleCopies[i.round()] = e
              }
            }
            var.renderedCount = var.count
            val.保护滑块.setDragYRatio(0)
          }
          var.rulesRenderPending = false
          var.iconsPending = true
          scheduler.delay(50, -> {
            var.applyRuleIcons()
          })
        }
      }
      var.applyRuleIcons = -> {
        if(val.保护行区 != none){
          var.allIconsReady = true
          if(var.count > 0){
            row = val.保护行区.get(0)
            if(row['保护图标'] != none){
              row['保护图标'].seticon()
            }
            else{
              var.allIconsReady = false
            }
            for(key in var.ruleCopies.keys()){
              row = var.ruleCopies[key]
              if(row['保护图标'] != none){
                row['保护图标'].seticon()
              }
              else{
                var.allIconsReady = false
              }
            }
          }
          var.iconsPending = !var.allIconsReady
        }
      }
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.pageW = var.viewW - 96
      var.pageH = var.viewH - 72
      var.listW = var.pageW * 0.58
      var.detailW = var.pageW - var.listW - 72
    open: |-
      Packet.send(var.packetId, 'guard_open', '0', 'ALL')
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
      var.pageW = var.viewW - 96
      var.pageH = var.viewH - 72
      var.listW = var.pageW * 0.58
      var.detailW = var.pageW - var.listW - 72
    seconds: |-
      if(var.rulesRenderPending){
        var.renderRuleRows()
      }
      if(var.iconsPending){
        var.applyRuleIcons()
      }
      var.retrySeconds = var.retrySeconds + 1
      if(var.pending && var.retrySeconds >= 8){
        var.retrySeconds = 0
        var.resultMsg = '正在确认保存结果，可关闭后重新打开查看'
        Packet.send(var.packetId, 'guard_refresh', var.page, var.kind)
      } else if(!var.busy && !var.showConfirm && !var.showPicker && var.retrySeconds >= 8){
        var.retrySeconds = 0
        Packet.send(var.packetId, 'guard_refresh', var.page, var.kind)
      }

controls:
  全屏底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:28;16,23,33,242
  自适应布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      页面:
        type: Canvas
        attribute:
          x: "48 - var.offX"
          y: 36
          width: "var.pageW"
          height: "var.pageH"
          enable: "!var.showPicker && !var.showConfirm"
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~25,34,47,240
              shape: ~round_rect
              radius: 14
          标题:
            type: Text
            attribute:
              x: "28"
              y: "22"
              texts: "~&f个人回收保护"
              fontSize: 40
              through: true
          说明:
            type: Text
            attribute:
              x: "28"
              y: "80"
              texts: "~&7逐件、批量、自动回收都跳过受保护物品。保护规则不改物品NBT。"
              fontSize: 26
              through: true
          返回回收:
            type: Canvas
            attribute:
              x: "var.pageW - 220"
              y: "24"
              width: "190"
              height: 44
              enable: "!var.pending"
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'guard_back')
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~48,67,82,240
                  shape: ~round_rect
                  radius: 8
              文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f返回回收界面"
                  fontSize: 24
                  through: true
          个人自动回收:
            type: Canvas
            attribute:
              x: "28"
              y: "128"
              width: "340"
              height: 44
              enable: "var.ready && !var.pending && !var.busy && !var.loading && var.actionToken != ''"
            action:
              clickLeft: |-
                if(var.autoEnabled){
                  var.pending = true
                  var.busy = true
                  Packet.send(var.packetId, 'guard_auto', '0', var.version, var.actionToken)
                } else {
                  var.confirmVersion = var.version
                  var.confirmMode = 'auto'
                  var.confirmName = '开启个人自动回收'
                  var.confirmText = '开启后，拾取的可回收且未受保护物品将被自动出售。'
                  var.confirmIcon = var.air
                  var.showConfirm = true
                  scheduler.delay(50, -> {
                    val.确认物品.seticon()
                  })
                }
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~48,67,82,240
                  shape: ~round_rect
                  radius: 8
              文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "var.autoEnabled ? '&e关闭个人自动回收' : '&b开启个人自动回收'"
                  fontSize: 24
                  through: true
          自动状态:
            type: Text
            attribute:
              x: "400"
              y: "138"
              texts: "'&7' + var.autoStatus"
              fontSize: 26
              through: true
          排除此材质:
