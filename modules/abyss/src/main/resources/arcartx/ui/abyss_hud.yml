# AXS 资源说明
# 用途: Abyss 副本内 HUD —— 小型战术遥测；任务细节交由 QuestGPS / Chemdah。
# 由服务端进本时打开、出本关闭；每秒 update 包刷新。
ui:
  isHud: true
  defaultOpen: false
  through: true
  show: true
  packetHandler:
    update: |-
      var.dungeonName = packet['dungeonName']
      var.status = packet['status']
      var.groupTotal = packet['groupTotal']
      var.groupDone = packet['groupDone']
      var.activeGroup = packet['activeGroup']
      var.aliveMobs = packet['aliveMobs']
      var.alivePlayers = packet['alivePlayers']
      var.totalPlayers = packet['totalPlayers']
      var.timeText = packet['timeText']
      var.timeRatio = packet['timeRatio']
      var.guideText = packet['guideText']
  action:
    load: |-
      var.dungeonName = ''
      var.status = ''
      var.groupTotal = 0
      var.groupDone = 0
      var.activeGroup = ''
      var.aliveMobs = 0
      var.alivePlayers = 0
      var.totalPlayers = 0
      var.timeText = ''
      var.timeRatio = 1.0
      var.guideText = ''
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      任务遥测:
        type: Canvas
        attribute:
          point: ~top_right
          x: "-28 + var.offX"
          y: 300
          width: 348
          height: 206
          through: true
        children:
          铁壳:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~12,15,17,202
              through: true
            effect:
              stroke:
                width: 2
                color: ~99,90,76,200
          左侧警戒条:
            type: Texture
            attribute:
              x: 0
              y: 0
              width: 5
              height: 206
              normal: "var.timeRatio <= 0.3 ? '172,64,46,255' : '206,151,67,255'"
              through: true
          分隔:
            type: Texture
            attribute:
              x: 18
              y: 48
              width: 312
              height: 2
              normal: ~89,79,64,205
              through: true
          副本名:
            type: Text
            attribute:
              x: 18
              y: 12
              texts: "'&6ABYSS / &f' + var.dungeonName"
              fontSize: 36
              limit: 20
              through: true
          编队进度:
            type: Text
            attribute:
              x: 18
              y: 58
              texts: "'&7阶段 &6' + var.groupDone.round() + '&8 / &f' + var.groupTotal.round() + (var.activeGroup != '' && var.activeGroup != none ? '  &7' + var.activeGroup : '')"
              fontSize: 36
              limit: 23
              through: true
          威胁与存活:
            type: Text
            attribute:
              x: 18
              y: 100
              texts: "'&c敌 ' + var.aliveMobs.round() + '    &7队员 &f' + var.alivePlayers.round() + '&8 / &f' + var.totalPlayers.round()"
              fontSize: 36
              through: true
          倒计时:
            type: Text
            attribute:
              point: ~bottom_right
              x: -20
              y: -22
              texts: "'&7剩余  &6' + var.timeText"
              fontSize: 36
              through: true
          时间条底:
            type: Texture
            attribute:
              x: 18
              y: 190
              width: 312
              height: 5
              normal: ~62,57,51,255
              through: true
          时间条:
            type: Texture
            attribute:
              x: 18
              y: 190
              width: "312 * (var.timeRatio < 0 ? 0 : (var.timeRatio > 1 ? 1 : var.timeRatio))"
              height: 5
              normal: "var.timeRatio <= 0.3 ? '181,67,48,255' : '217,158,69,255'"
              through: true
      路线提示:
        type: Canvas
        attribute:
          point: ~top_center
          y: 84
          width: 514
          height: 52
          visible: "var.guideText != '' && var.guideText != none"
          through: true
        children:
          指令底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~15,17,18,190
              through: true
            effect:
              stroke:
                width: 2
                color: ~104,86,58,195
          指令线:
            type: Texture
            attribute:
              x: 0
              width: 6
              height: 52
              normal: ~196,132,55,255
              through: true
          路线文字:
            type: Text
            attribute:
              point: ~middle_left
              x: 18
              texts: "'&6路线指令  &f' + var.guideText"
              fontSize: 36
              limit: 25
              through: true
