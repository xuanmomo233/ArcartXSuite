                      height: 44
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'accept_tpa', var.actionToken)
                    children:
                      接受底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~50,140,80,210
                          hover: ~70,170,100,230
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 2
                            color: "self.isHovered() ? '124,196,142,255' : '255,255,255,230'"
                      接受文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&f接受"
                          fontSize: 36
                          through: true
                  拒绝传送请求按钮:
                    type: Canvas
                    attribute:
                      point: ~top_right
                      x: 0
                      y: -2
                      width: 90
                      height: 44
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'deny_tpa', var.actionToken)
                    children:
                      拒绝底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~180,50,50,210
                          hover: ~220,70,70,230
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 2
                            color: "self.isHovered() ? '235,100,100,255' : '255,255,255,230'"
                      拒绝文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&f拒绝"
                          fontSize: 36
                          through: true
                  玩家滑块:
                    type: Texture
                    val: 玩家滑块
                    attribute:
                      point: ~top_right
                      x: -6
                      y: 100
                      width: 6
                      height: 50
                      normal: ~120,120,120,200
                      maxDragY: 370
                  传送请求滚动栏:
                    type: Scroll
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 100
                      width: 726
                      height: 420
                      moveY: "self.parent['玩家滑块'].getDragYRatio()"
                    action:
                      wheel: |-
                        if(self.moveY >= 0 && self.wheelValue > 0){
                          self.parent['玩家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                        if(self.moveY <= 1 && self.wheelValue < 0){
                          self.parent['玩家滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                        }
                    children:
                      tpa_list:
                        val: tpa_data
                        type: VStack
                        attribute:
                          x: 0
                          y: 0
                          width: 726
                          spaceBetween: 8
                        children:
                          传送请求玩家项目:
                            type: Canvas
                            attribute:
                              entry: var.onlinePlayers[self.key]
                              visible: self.entry != none
                              width: 720
                              height: 52
                            action:
                              clickLeft: |-
                                Packet.send(var.packetId, 'send_tpa', var.actionToken, self.entry)
                            children:
                              玩家项目底:
                                type: Texture
                                attribute:
                                  point: ~stretch_all
                                  normal: ~62,66,74,210
                                  hover: ~80,90,110,230
                                  shape: ~round_rect
                                  radius: 10
                                effect:
                                  ripple:
                                  stroke:
                                    width: 2
                                    color: "self.isHovered() ? '120,200,255,255' : '255,255,255,180'"
                              传送请求玩家名称:
                                type: Text
                                attribute:
                                  point: ~middle_left
                                  x: 20
                                  texts: "'&f' + self.parent.entry"
                                  fontSize: 36
                                  through: true

              # ─── 设置视图 ───
