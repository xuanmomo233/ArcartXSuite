# AXS 资源说明
# 用途: Abyss 副本宝箱 —— roll 好的奖励物品展示 + 单个/全部领取
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    # packetHandler: init
    # 包字段: packetId/action_token/chestTitle/itemCount/itemJson0..itemJson8
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.chestTitle = packet['chestTitle']
      var.itemCount = packet['itemCount']
      var.itemJson0 = packet['itemJson0']
      var.itemJson1 = packet['itemJson1']
      var.itemJson2 = packet['itemJson2']
      var.itemJson3 = packet['itemJson3']
      var.itemJson4 = packet['itemJson4']
      var.itemJson5 = packet['itemJson5']
      var.itemJson6 = packet['itemJson6']
      var.itemJson7 = packet['itemJson7']
      var.itemJson8 = packet['itemJson8']
      var.dirty = true
      self.actions['applyIcons']()
  action:
    load: |-
      var.accent = '217,163,81,255'
      var.accentDim = '117,86,59,235'
    open: |-
      Sound.self('minecraft:block.chest.open', 0.9, 10)
      self.delayAction(300, 'applyIcons')
    applyIcons: |-
      for(i in range(0, 8)){
        val.物品网格.get(i.round()).seticon()
      }
      var.dirty = false
    tick: |-
      if(var.dirty){
        self.actions['applyIcons']()
      }
