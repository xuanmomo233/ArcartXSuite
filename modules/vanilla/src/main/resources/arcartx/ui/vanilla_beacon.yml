ui:
  isHud: false
  match:
  - 信标界面
  defaultOpen: true
  background: true
  escClose: true
  closeDied: true
  screenScale: true
  through: var.whLayoutEnabled && var.whAvailable && !var.carrying && !var.recipeOpen && val.warehouseGrid != none && val.warehouseGrid.isHovered()
    && var.whMenu == '' && !var.whPinHovered
  jei: false
  itemSize: 16
  hide:
  - hotbar
  - crosshair
  - player_state
  - experience_bar
  - chat_panel
  action:
    load: |-
      // 服务器在 UI 注册前写入仓库布局能力。
      var.whLayoutEnabled = false
      var.carrying = false
      var.whAvailable = false
      var.whResolved = false
      var.whRows = {}
      var.whDirty = false
      var.whToken = ''
      var.whSearch = ''
      var.whCategory = '全部'
      var.whSort = '默认'
      var.whPage = '—'
      var.whHasPrevious = false
      var.whHasNext = false
      var.whCount = '—'
      var.recipeOpen = false
      var.recipeResolved = false
      var.recipeHasNext = false
      var.recipes = {}
      var.recipeKeys = {}
      var.recipeDirty = false
      var.recipePage = 0
      var.recipeSearch = ''
      var.recipeName = '选择配方'
      var.recipeSelection = ''
      var.recipePageText = '1 / 1'
      var.onlyCraftable = false
      var.cook = 0
      var.burn = 0
      var.whMenu = ''
      var.whMenuPage = 0
      var.whMenuCount = 0
      var.whCategories = {}
      var.whCategoryCount = 0
      var.whSortOptions = {}
      var.whSortCount = 0
      var.whSearchTicks = 0
      var.whPageStep = 0
      var.recipePageStep = 0
      var.previewDirty = false
      var.whPinHovered = false
      var.fillBusy = false
      var.fillMessage = ''
      var.noticeActive = false
      var.noticeText = ''
      var.noticeDetail = ''
      var.noticeFade = Fade(80, 1000, 220)
      var.noticePeaked = false
      var.utilityStatus = ''
      var.utilityTitle = '信标'
      var.originalTitle = ''
      var.utilityMechanism = ''
      var.utilityOccupancy = '—'
      var.utilityAmount = ''
      var.utilityUsed = 0
      var.utilitySlots = 1
      var.beaconTier = 0
      var.beaconSupported = false
      var.beaconPowers = {}
      var.beaconPrimary = ''
      var.beaconSecondary = 'none'
      var.beaconSettings = ''
      var.beaconToken = ''
      var.beaconPayment = false
      var.beaconCurrent = '未设置'
      var.noticeLines = []
      var.noticeCount = 1
    open: |-
      var.noticeActive = false
      var.noticePeaked = false
      var.noticeText = ''
      var.noticeDetail = ''
      var.originalTitle = self.getOriginalName()
      if(var.originalTitle != ''){var.utilityTitle = var.originalTitle}
      if(var.whLayoutEnabled){Packet.send('AXS:vanilla_beacon', 'warehouse_panel', 'open')}
      Packet.send('AXS:vanilla_beacon', 'utility_open')
      val.workshopHeaderIcon.setItemIcon('{"id":"minecraft:beacon","Count":1b}')
      val.beaconPowerspeed.setItemIcon('{"id":"minecraft:sugar","Count":1b}')
      val.beaconPowerhaste.setItemIcon('{"id":"minecraft:iron_pickaxe","Count":1b}')
      val.beaconPowerresistance.setItemIcon('{"id":"minecraft:iron_chestplate","Count":1b}')
      val.beaconPowerjump.setItemIcon('{"id":"minecraft:rabbit_foot","Count":1b}')
      val.beaconPowerstrength.setItemIcon('{"id":"minecraft:blaze_powder","Count":1b}')
      val.beaconPayment0.setItemIcon('{"id":"minecraft:iron_ingot","Count":1b}')
      val.beaconPayment1.setItemIcon('{"id":"minecraft:gold_ingot","Count":1b}')
      val.beaconPayment2.setItemIcon('{"id":"minecraft:emerald","Count":1b}')
      val.beaconPayment3.setItemIcon('{"id":"minecraft:diamond","Count":1b}')
      val.beaconPayment4.setItemIcon('{"id":"minecraft:netherite_ingot","Count":1b}')
    close: Packet.send('AXS:vanilla_beacon', 'warehouse_panel', 'close', var.whToken)
    tick: |
      carried = self.getCarriedItemStack()
      var.carrying = carried != none && carried.getCount() > 0
      if(var.whDirty && var.whCells != none){
        var.whDirty = false
        for(i in range(0, 23)){
          idx = i.round()
          cell = var.whCells[idx]
          row = var.whRows[idx]
          if(cell != none){
            cell['Hit'].id = row == none ? 'axs_wh_entry_empty' : row['clickId']
            cell['Icon'].setItemIcon(row == none ? '' : row['icon'])
          }
        }
      }
      if(var.whSearchTicks > 0){
        var.whSearchTicks = var.whSearchTicks - 1
        if(var.whSearchTicks == 0){ Packet.send('AXS:vanilla_beacon', 'warehouse_panel', 'search', var.whSearch) }
      }
      if(var.whPageStep != 0){
        direction = var.whPageStep < 0 ? 'prev' : 'next'
        permitted = var.whPageStep < 0 ? var.whHasPrevious : var.whHasNext
        var.whPageStep = 0
        if(var.whAvailable && permitted){ Packet.send('AXS:vanilla_beacon', 'warehouse_panel', 'page', direction) }
      }
      var.whPinHovered = false
      if(var.whCells != none){
        for(i in range(0, 23)){
          pinCell = var.whCells[i.round()]
          if(pinCell != none && pinCell['置顶按钮'].isHovered()){ var.whPinHovered = true }
        }
      }

      if(var.noticeActive){
        var.noticeOpacity = var.noticeFade.get()
        if(var.noticeOpacity > 0){ var.noticePeaked = true }
        if(var.noticePeaked && var.noticeOpacity <= 0){
          var.noticeActive = false
          var.noticePeaked = false
          var.noticeText = ''
          var.noticeDetail = ''
        }
      }
  packetHandler:
    warehouse_panel: |-
      var.whAvailable = packet['available']
      var.whResolved = true
      var.whHasPrevious = var.whAvailable && packet['hasPreviousPage']
      var.whHasNext = var.whAvailable && packet['hasNextPage']
      if(var.whAvailable){
        var.whToken = packet['token']
        var.whRows = packet['rows']
        var.whPage = packet['page']
        var.whSort = packet['sort']
        var.whCategory = packet['category']
        var.whCount = packet['count']
      }else{
        var.whRows = {}
      }
      var.whDirty = true
      var.whCategories = var.whAvailable ? packet['categories'] : {}
      var.whCategoryCount = var.whAvailable ? packet['categoryCount'] : 0
      var.whSortOptions = var.whAvailable ? packet['sorts'] : {}
      var.whSortCount = var.whAvailable ? packet['sortCount'] : 0
    placement_state: |-
      var.fillBusy = packet['busy']
      var.fillMessage = packet['message']
      if(!packet['busy']){
        noticeMessage = packet['message']
        if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
          var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
          noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
          var.noticeLines = noticeWrapped.split('\n')
          var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
          var.noticeFade.reset()
          var.noticePeaked = false
          var.noticeActive = true
        }
      }
    ui_notice: |-
      noticeMessage = packet['message']
      if(noticeMessage != none && noticeMessage != '' && !var.noticeActive){
        var.noticeText = noticeMessage.replaceAll('(?i)[&§][0-9A-FK-ORX]', '')
        noticeWrapped = var.noticeText.replaceAll('(.{22})(?=.)', '$1\n')
        var.noticeLines = noticeWrapped.split('\n')
        var.noticeCount = math.max(1, math.min(12, var.noticeLines.size()))
        var.noticeFade.reset()
        var.noticePeaked = false
        var.noticeActive = true
      }
    utility_state: |-
      var.utilityStatus = packet['status']
      var.beaconTier = packet['tier']
      var.beaconSupported = packet['supported']
      var.beaconPowers = packet['powers']
      var.beaconToken = packet['token']
      var.beaconPayment = packet['hasPayment']
      var.beaconCurrent = packet['currentLabel']
      if(var.beaconSettings != packet['settings']){
      var.beaconSettings = packet['settings']
      var.beaconPrimary = packet['currentPrimary']
      var.beaconSecondary = packet['currentSecondary']
      }
