# 文件用途: 原神祈愿风格抽奖界面（AXS:lottery_wish）的客户端 UI 配置。
# 本文件只负责渲染与交互回传，抽奖概率、保底、消耗与积分兑换全部由服务端处理。
# 布局架构: 全屏 Frosted 玻璃底 + Adaptive ~top_center 1920x1080
#           -> 两区骨架（顶栏 + 左侧导航 + 内容区），内容区内分中主区 + 右侧栏
#           + 等待/单抽结果/十连结果三个全屏覆盖层
#           + 历史/详情/兑换/资源不足四个弹层（visible 切换，单文件多视图）。
# 配色: 祈愿星辉蓝 主色120,160,235 底22,26,38,110 抬升44,52,72,245 描边120,160,235,240
# 星级语义色: 5★金232,180,90 / 4★紫186,140,232 / 3★灰196,200,208
# 抽奖流程为「包驱动」: 点击只发请求并进入等待态，result / batch_result 到达后才展示结果；
# 若服务端只回 update（消耗不足等失败情形），等待态会被自动解除。
ui:
  isHud: false

  hide:
    - hotbar
    - experience_bar
    - crosshair
    - item_name
    - jump_bar
    - mount_health
    - player_state
    - player_health
    - armor_level
    - food_level
    - air_level
  through: false
  background: false
  escClose: true
  closeDied: true
  show: true
  level: 8
  itemSize: 16
  screenScale: true
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包 ID，回传操作时使用
    #   - poolName / poolType / poolDescription: 当前卡池名称、类型与描述
    #   - poolList: 卡池名称列表（key 为 "0"、"1"… 的纯数字字符串）
    #   - currentPoolIndex: 当前卡池索引
    #   - poolCount: 当前 packetId 对应的卡池总数
    #   - guaranteedUp / fatePoints / fateTarget: 玩家 UP 保证状态与命运点状态
    #   - fatePointCap: 命运点上限
    #   - softPityStart / softPityIncrement: 软保底起点与递增值
    #   - upRate / base5Rate / base4Rate: UP、基础 5 星与基础 4 星概率
    #   - action_token: 操作令牌，每次 update 换发，回传时必须带上
    #   - upItemName / upItemStar / upItemDesc / upItemIcon: UP 物品展示信息（无描述时 upItemDesc 为空）
    #   - pity4 / pity5: 玩家当前 4 星、5 星累计未出次数
    #   - pity4Limit / pity5Limit: 保底上限次数，0 表示未知
    #   - guaranteeDesc: 服务端格式化好的保底说明文案
    #   - costRows / costTenRows: 单抽与十连的消耗条目（含 type/id/amount/displayName/icon/owned）
    #   - tenAvailable: 当前卡池是否配置了十连消耗，false 时隐藏十连按钮
    #   - resourceRows: 当前卡池涉及的资源余额
    # 说明: owned 为 -1 表示余额未知（外部货币桥不可用），界面显示 "—" 且不判定为不足。
    init: |-
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.packetId = packet['packetId']
      var.poolName = packet['poolName']
      var.poolType = packet['poolType']
      var.poolDescription = packet['poolDescription']
      var.poolList = packet['poolList']
      var.currentPoolIndex = packet['currentPoolIndex']
      var.poolCount = packet['poolCount']
      var.actionToken = packet['action_token']
      var.upItemName = packet['upItemName']
      var.upItemStar = packet['upItemStar']
      var.upItemDesc = packet['upItemDesc']
      var.guaranteedUp = packet['guaranteedUp']
      var.guaranteedUpText = packet['guaranteedUpText']
      var.guaranteedNotUpText = packet['guaranteedNotUpText']
      var.guaranteedUnknownText = packet['guaranteedUnknownText']
      var.guaranteedStatusText = packet['guaranteedStatusText']
      var.upItemIcon = packet['upItemIcon']
      var.pity4 = packet['pity4']
      var.pity5 = packet['pity5']
      var.pity4Limit = packet['pity4Limit']
      var.pity5Limit = packet['pity5Limit']
      var.guaranteeDesc = packet['guaranteeDesc']
      var.costRows = packet['costRows']
      var.costTenRows = packet['costTenRows']
      var.tenAvailable = packet['tenAvailable'] == true
      var.resourceRows = packet['resourceRows']
      // itemJson 分离模式（§7）：从 packet 顶层字段构建图标字典
      var.costIconJsons = {}
      if(var.costRows != none){
        for(key in var.costRows.keys()){
          json = packet['costIconJson' + key]
          var.costIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      var.costTenIconJsons = {}
      if(var.costTenRows != none){
        for(key in var.costTenRows.keys()){
          json = packet['costTenIconJson' + key]
          var.costTenIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      var.resourceIconJsons = {}
      if(var.resourceRows != none){
        for(key in var.resourceRows.keys()){
          json = packet['resourceIconJson' + key]
          var.resourceIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      // 资源充足检查（owned < 0 表示余额未知，不判定为不足）
      var.canPull = true
      if(var.costRows != none){
        for(key in var.costRows.keys()){
          row = var.costRows[key]
          if(row != none && row['owned'] != none && row['owned'] >= 0 && row['amount'] != none && row['owned'] < row['amount']){
            var.canPull = false
          }
        }
      }
      var.canPullTen = true
      if(var.costTenRows != none){
        for(key in var.costTenRows.keys()){
          row = var.costTenRows[key]
          if(row != none && row['owned'] != none && row['owned'] >= 0 && row['amount'] != none && row['owned'] < row['amount']){
            var.canPullTen = false
          }
        }
      }
      // UP 物品图标
      val.UP物品槽.seticon()
      // 卡池导航按钮: 根据实际奖池数量动态创建
      poolCount = var.poolCount != none ? var.poolCount : 0
      for(i in range(0, poolCount)){
        key = i.round()
        if(i > 0){
          existing = val.卡池导航列表['卡池按钮' + key]
          if(existing == none){
            btn = val.卡池导航列表['卡池按钮'].copy('卡池按钮' + key)
            btn['卡底'].entryKey = key
            btn['名称'].entryKey = key
          }
        }
        e = val.卡池导航列表.get(key)
        if(e != none){
          e.entryKey = key
        }
      }
      // 消耗区与资源栏图标
      for(i in range(0, 3)){
        key = i.round()
        e = val.单抽消耗区.get(key)
        if(e != none){
          e['图标'].seticon()
        }
        t = val.十连消耗区.get(key)
        if(t != none){
          t['图标'].seticon()
        }
        r = val.资源栏.get(key)
        if(r != none){
          r['图标'].seticon()
        }
      }
      var.actionBusy = false
    # packetHandler: update
    # 包字段与 init 相同，用于切换卡池、抽奖结束后刷新数据。
    # 额外职责: 若处于等待态但本次没有结果包（抽奖失败），解除等待态回到主界面。
    update: |-
      var.packetId = packet['packetId']
      var.poolName = packet['poolName']
      var.poolType = packet['poolType']
      var.poolDescription = packet['poolDescription']
      var.poolList = packet['poolList']
      var.currentPoolIndex = packet['currentPoolIndex']
      var.poolCount = packet['poolCount']
      var.actionToken = packet['action_token']
      var.upItemName = packet['upItemName']
      var.upItemStar = packet['upItemStar']
      var.upItemDesc = packet['upItemDesc']
      var.guaranteedUp = packet['guaranteedUp']
      var.guaranteedUpText = packet['guaranteedUpText']
      var.guaranteedNotUpText = packet['guaranteedNotUpText']
      var.guaranteedUnknownText = packet['guaranteedUnknownText']
      var.guaranteedStatusText = packet['guaranteedStatusText']
      var.upItemIcon = packet['upItemIcon']
      var.pity4 = packet['pity4']
      var.pity5 = packet['pity5']
      var.pity4Limit = packet['pity4Limit']
      var.pity5Limit = packet['pity5Limit']
      var.guaranteeDesc = packet['guaranteeDesc']
      var.costRows = packet['costRows']
      var.costTenRows = packet['costTenRows']
      var.tenAvailable = packet['tenAvailable'] == true
      var.resourceRows = packet['resourceRows']
      // itemJson 分离模式（§7）：从 packet 顶层字段构建图标字典
      var.costIconJsons = {}
      if(var.costRows != none){
        for(key in var.costRows.keys()){
          json = packet['costIconJson' + key]
          var.costIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      var.costTenIconJsons = {}
      if(var.costTenRows != none){
        for(key in var.costTenRows.keys()){
          json = packet['costTenIconJson' + key]
          var.costTenIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      var.resourceIconJsons = {}
      if(var.resourceRows != none){
        for(key in var.resourceRows.keys()){
          json = packet['resourceIconJson' + key]
          var.resourceIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      // 资源充足检查（owned < 0 表示余额未知，不判定为不足）
      var.canPull = true
      if(var.costRows != none){
        for(key in var.costRows.keys()){
          row = var.costRows[key]
          if(row != none && row['owned'] != none && row['owned'] >= 0 && row['amount'] != none && row['owned'] < row['amount']){
            var.canPull = false
          }
        }
      }
      var.canPullTen = true
      if(var.costTenRows != none){
        for(key in var.costTenRows.keys()){
          row = var.costTenRows[key]
          if(row != none && row['owned'] != none && row['owned'] >= 0 && row['amount'] != none && row['owned'] < row['amount']){
            var.canPullTen = false
          }
        }
      }
      val.UP物品槽.seticon()
      // 卡池导航按钮: 根据实际奖池数量动态创建
      poolCount = var.poolCount != none ? var.poolCount : 0
      for(i in range(0, poolCount)){
        key = i.round()
        if(i > 0){
          existing = val.卡池导航列表['卡池按钮' + key]
          if(existing == none){
            btn = val.卡池导航列表['卡池按钮'].copy('卡池按钮' + key)
            btn['卡底'].entryKey = key
            btn['名称'].entryKey = key
          }
        }
        e = val.卡池导航列表.get(key)
        if(e != none){
          e.entryKey = key
        }
      }
      // 消耗区与资源栏图标
      for(i in range(0, 3)){
        key = i.round()
        e = val.单抽消耗区.get(key)
        if(e != none){
          e['图标'].seticon()
        }
        t = val.十连消耗区.get(key)
        if(t != none){
          t['图标'].seticon()
        }
        r = val.资源栏.get(key)
        if(r != none){
          r['图标'].seticon()
        }
      }
      // 抽奖失败时服务端只回 update: 解除等待态
      if(var.pulling != none && var.pulling == true && var.resultPending != none && var.resultPending != true){
        var.pulling = false
        val.等待层.visible = false
        val.左侧导航.visible = true
        val.内容区.visible = true
      }
      var.actionBusy = false
    # packetHandler: result（单抽结果）
    # 包字段:
    #   - resultCount: 结果数量
    #   - resultItemJsonN: 各物品 itemJson（分离模式，N 为序号）
    #   - resultItemNames / resultItemStars / resultItemUps: 结果映射（key 为 "1" 起的数字字符串）
    #   - resultCountRequested: 请求抽取数量
    #   - guaranteed: 本次是否触发大保底
    #   - fatePointTriggered: 本次是否触发命运点
    #   - pity4 / pity5: 抽后的保底计数
    #   - highestStar: 本次最高星级
    result: |-
      var.resultCount = packet['resultCount']
      var.resultItemNames = packet['resultItemNames']
      var.resultItemStars = packet['resultItemStars']
      var.resultItemUps = packet['resultItemUps']
      var.guaranteed = packet['guaranteed'] == true
      var.fatePointTriggered = packet['fatePointTriggered'] == true
      var.pity4 = packet['pity4']
      var.pity5 = packet['pity5']
      var.highestStar = packet['highestStar']
      var.resultPending = true
      // itemJson 分离模式（§7）：从 packet 顶层字段构建 var.resultItemJsons
      var.resultItemJsons = {}
      if(var.resultItemNames != none){
        for(key in var.resultItemNames.keys()){
          json = packet['resultItemJson' + key]
          if(json != none && json != ''){
            var.resultItemJsons[key] = json
          } else {
            var.resultItemJsons[key] = var.air
          }
        }
      }
      val.单抽结果卡片['物品槽'].seticon()
      Sound.self(var.highestStar >= 5 ? 'minecraft:entity.player.levelup' : (var.highestStar == 4 ? 'minecraft:block.note_block.chime' : 'minecraft:entity.item.pickup'), var.highestStar >= 5 ? 1.15 : (var.highestStar == 4 ? 1.05 : 0.95), 20)
      async {
        Thread.sleep(var.revealMs)
        val.等待层.visible = false
        val.单抽结果层.visible = true
        var.pulling = false
        var.resultPending = false
      }
    # packetHandler: batch_result（十连结果，字段与 result 相同）
    batch_result: |-
      var.resultCount = packet['resultCount']
      var.resultItemNames = packet['resultItemNames']
      var.resultItemStars = packet['resultItemStars']
      var.resultItemUps = packet['resultItemUps']
      var.guaranteed = packet['guaranteed'] == true
      var.fatePointTriggered = packet['fatePointTriggered'] == true
      var.pity4 = packet['pity4']
      var.pity5 = packet['pity5']
      var.highestStar = packet['highestStar']
      var.resultPending = true
      // itemJson 分离模式（§7）：从 packet 顶层字段构建 var.resultItemJsons
      var.resultItemJsons = {}
      if(var.resultItemNames != none){
        for(key in var.resultItemNames.keys()){
          json = packet['resultItemJson' + key]
          if(json != none && json != ''){
            var.resultItemJsons[key] = json
          } else {
            var.resultItemJsons[key] = var.air
          }
        }
      }
      for(i in range(0, 10)){
        key = i.round()
        e = val.十连网格.get(key)
        if(e != none){
          e['物品槽'].seticon()
        }
      }
      Sound.self(var.highestStar >= 5 ? 'minecraft:entity.player.levelup' : (var.highestStar == 4 ? 'minecraft:block.note_block.chime' : 'minecraft:entity.item.pickup'), var.highestStar >= 5 ? 1.15 : (var.highestStar == 4 ? 1.05 : 0.95), 20)
      async {
        Thread.sleep(var.revealMs)
        val.等待层.visible = false
        val.十连结果层.visible = true
        var.pulling = false
        var.resultPending = false
      }
    # packetHandler: history（祈愿记录）
    # 包字段:
    #   - historyPoolName: 卡池名称
    #   - historyCount: 记录条数
    #   - historyRows: 记录行（含 pullTime/pullCount/itemsJson/pityAtPull/guaranteed/timeText/summary）
    # 说明: 界面只使用服务端格式化好的 timeText 与 summary，不在客户端解析时间戳。
    history: |-
      var.historyPoolName = packet['historyPoolName']
      var.historyCount = packet['historyCount']
      var.historyRows = packet['historyRows']
      // 根据实际历史条目数动态创建行
      historyCount = var.historyCount != none ? var.historyCount : 0
      for(i in range(0, historyCount)){
        key = i.round()
        if(i > 0){
          existing = val.历史列表['历史行' + key]
          if(existing == none){
            e = val.历史列表['历史行'].copy('历史行' + key)
            e['时间'].entryKey = key
            e['摘要'].entryKey = key
          }
        }
        row = val.历史列表.get(key)
        if(row != none){
          row.entryKey = key
        }
      }
      val.历史面板.visible = true
    # packetHandler: details（卡池详情）
    # 包字段:
    #   - detailPoolName / detailCount / detailRows: 卡池名称、条目数与条目行（name/rarity/weight）
    #   - detailPity5 / detailPity4: 5 星、4 星保底次数
    #   - detailBase5Rate / detailBase4Rate / detailUpRate: 基础概率与 UP 概率
    details: |-
      var.detailPoolName = packet['detailPoolName']
      var.detailCount = packet['detailCount']
      var.detailRows = packet['detailRows']
      var.detailPity5 = packet['detailPity5']
      var.detailPity4 = packet['detailPity4']
      var.detailBase5Rate = packet['detailBase5Rate']
      var.detailBase4Rate = packet['detailBase4Rate']
      var.detailUpRate = packet['detailUpRate']
      // 根据实际详情条目数动态创建行
      detailCount = var.detailCount != none ? var.detailCount : 0
      for(i in range(0, detailCount)){
        key = i.round()
        if(i > 0){
          existing = val.详情列表['详情行' + key]
          if(existing == none){
            e = val.详情列表['详情行'].copy('详情行' + key)
            e['名称'].entryKey = key
            e['稀有度'].entryKey = key
            e['权重'].entryKey = key
          }
        }
        row = val.详情列表.get(key)
        if(row != none){
          row.entryKey = key
        }
      }
      val.详情面板.visible = true
    # packetHandler: exchange（积分兑换商店）
    # 包字段:
    #   - pointBalanceRows: 玩家各类积分余额（含 id/displayName/amount，不含 icon）
    #   - pointBalanceCount: 积分类型数量
    #   - pointIconJsonN: 各积分图标 itemJson（分离模式，N 为序号）
    #   - exchangeCount: 商品数量
    #   - exchangeRows: 商品行（含 id/name/costRows/limit/used/remaining/canExchange，不含 icon）
    #   - exchangeIconJsonN: 各商品图标 itemJson（分离模式，N 为序号）
    exchange: |-
      var.pointBalanceRows = packet['pointBalanceRows']
      var.pointBalanceCount = packet['pointBalanceCount']
      var.exchangeCount = packet['exchangeCount']
      var.exchangeRows = packet['exchangeRows']
      // itemJson 分离模式（§7）：从 packet 顶层字段构建图标字典
      var.pointIconJsons = {}
      if(var.pointBalanceRows != none){
        for(key in var.pointBalanceRows.keys()){
          json = packet['pointIconJson' + key]
          var.pointIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      var.exchangeIconJsons = {}
      if(var.exchangeRows != none){
        for(key in var.exchangeRows.keys()){
          json = packet['exchangeIconJson' + key]
          var.exchangeIconJsons[key] = json != none && json != '' ? json : var.air
        }
      }
      for(i in range(0, 3)){
        key = i.round()
        p = val.积分余额栏.get(key)
        if(p != none){
          p['图标'].seticon()
        }
      }
      // 根据实际兑换商品数动态创建行并设图标
      exchangeCount = var.exchangeCount != none ? var.exchangeCount : 0
      for(i in range(0, exchangeCount)){
        key = i.round()
        if(i > 0){
          existing = val.兑换列表['兑换行' + key]
          if(existing == none){
            e = val.兑换列表['兑换行'].copy('兑换行' + key)
            e['商品图标'].entryKey = key
            e['商品名称'].entryKey = key
            e['消耗文本'].entryKey = key
            e['限购文本'].entryKey = key
            e['兑换按钮'].entryKey = key
          }
        }
        row = val.兑换列表.get(key)
        if(row != none){
          row.entryKey = key
          row['商品图标'].seticon()
        }
      }
      val.兑换面板.visible = true
  action:
    seconds: |-
      if(var.actionBusy){
        var.actionBusySeconds = var.actionBusySeconds + 1
        if(var.actionBusySeconds >= 3){
          var.actionBusy = false
          var.actionBusySeconds = 0
        }
      }else{
        var.actionBusySeconds = 0
      }
    # load 事件: 初始化星级配色、界面状态变量与视口换算
    load: |-
      var.starColors = {}
      var.starColors[3] = '196,200,208,255'  // 3 星 - 灰
      var.starColors[4] = '186,140,232,255'  // 4 星 - 紫
      var.starColors[5] = '232,180,90,255'   // 5 星 - 金
      var.starColors[none] = '128,128,128,255'
      var.air = '{"id":"minecraft:air","Count":1b}'
      var.revealMs = 1600       // 等待层到结果层的过场时长（毫秒）
      var.pulling = false       // 是否正在祈愿（防连点）
      var.resultPending = false // 本次祈愿是否已收到结果包
      var.pointBalanceRows = {}
      var.exchangeRows = {}
      var.exchangeCount = 0
      var.actionToken = ''
      var.actionBusy = false
      var.actionBusySeconds = 0
      // 视口换算：Adaptive 以 1920x1080 等比缩放
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.rightW = 320                            // 右侧栏固定宽
      var.centerW = var.contentW - var.rightW - 24  // 中主区吃剩余
    # open 事件: 每次打开界面复位所有层
    open: |-
      var.pulling = false
      var.resultPending = false
      val.左侧导航.visible = true
      val.内容区.visible = true
      val.等待层.visible = false
      val.单抽结果层.visible = false
      val.十连结果层.visible = false
      val.历史面板.visible = false
      val.详情面板.visible = false
      val.兑换面板.visible = false
      val.资源不足提示.visible = false
    # resize 事件: 窗口尺寸变化后重算视口变量
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.rightW = 320
      var.centerW = var.contentW - var.rightW - 24

# ─── 控件树（书写顺序即叠层顺序，弹层写在最后）────────────────────

controls:
  # ═══ 全屏毛玻璃底 ═══
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;22,26,38,110

  # ═══ 自适应全局布局 ═══
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ──────────────────────────────────────────
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~120,160,235,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~120,160,235,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f祈愿"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 168
              width: 1
              height: 30
              normal: ~120,160,235,230
          卡池名:
            type: Text
            attribute:
              point: ~middle_left
              x: 188
              texts: "'&f' + var.poolName"
              fontSize: 36
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~44,52,72,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '160,200,255,255' : '120,160,235,240'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航（卡池列表，300 宽）──────────────────────
      左侧导航:
        type: Canvas
        val: 左侧导航
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~120,160,235,240
          导航标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 20
              texts: "~&f卡池"
              fontSize: 36
          导航标题线:
            type: Texture
            attribute:
              point: ~top_left
              x: 20
              y: 68
              width: 260
              height: 2
              normal: ~120,160,235,230
          卡池导航列表:
            type: VStack
            val: 卡池导航列表
            attribute:
              point: ~top_left
              x: 14
              y: 88
              width: 272
              spaceBetween: 12
            children:
              卡池按钮0:
                type: Canvas
                attribute:
                  entryKey: 0.round()
                  width: 272
                  height: 58
                  visible: "var.poolList != none && self.entryKey < var.poolList.size()"
                action:
                  clickLeft: |-
                    if(!var.actionBusy){
                      var.actionBusy = true
                      var.actionBusySeconds = 0
                      Packet.send(var.packetId, 'switch_pool', self.entryKey, var.actionToken)
                    }
                children:
                  卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      through: true
                      normal: "var.currentPoolIndex == self.parent.entryKey ? '120,160,235,210' : '44,52,72,245'"
                      shape: ~round_rect
                      radius: 10
                    effect:
                      ripple:
                      stroke:
                        width: "var.currentPoolIndex == self.parent.entryKey ? 4 : 3"
                        color: "var.currentPoolIndex == self.parent.entryKey ? '255,255,255,255' : (self.isHovered() ? '160,200,255,255' : '120,160,235,240')"
                  高亮条:
                    type: Texture
                    attribute:
                      point: ~middle_left
                      x: 8
                      width: 4
                      height: 28
                      normal: ~120,160,235,255
                      shape: ~round_rect
                      radius: 2
                      visible: "var.currentPoolIndex == self.parent.entryKey"
                      through: true
                  名称:
                    type: Text
                    attribute:
                      point: ~middle_left
                      x: 28
                      texts: "var.poolList != none ? (var.currentPoolIndex == self.parent.entryKey ? '&0' + var.poolList[self.parent.entryKey] : '&f' + var.poolList[self.parent.entryKey]) : ''"
                      fontSize: 36
                      through: true

      # ── 内容区（两区骨架，内部分中主区 + 右侧栏）────────────
      内容区:
        type: Canvas
        val: 内容区
        attribute:
          point: ~top_left
          x: "372 - var.offX"
          y: 120
          width: "var.contentW"
          height: "var.viewH - 144"
        children:
          内容底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~120,160,235,240

          # ── 中主区：UP 展示 + 保底 + 抽卡（var.centerW 宽）────────
          中主区:
            type: Canvas
            attribute:
              point: ~top_left
              x: 0
              y: 0
              width: "var.centerW"
              height: "var.viewH - 144"
            children:
              # ── UP 展示卡 ────────────────────────────────
              UP展示卡:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 24
                  width: "var.centerW - 48"
                  height: 360
                children:
                  UP卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~44,52,72,245
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: ~120,160,235,240
                  UP标签:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 24
                      texts: "~&fUP 物品"
                      fontSize: 36
                  UP物品槽:
                    type: Slot
                    val: UP物品槽
                    attribute:
                      point: ~middle_center
                      y: -10
                      width: 120
                      height: 120
                      normal: ~44,52,72,245
                      shape: ~round_rect
                      radius: 12
                      slotType: ~Icon
                      itemScale: 0.85
                      seticon: "self.setItemIcon(var.upItemIcon != none && var.upItemIcon != '' ? var.upItemIcon : var.air)"
                  UP物品名:
                    type: Text
                    attribute:
                      point: ~middle_center
                      y: 130
                      texts: "var.upItemName != none ? '&f' + var.upItemName : ''"
                      fontSize: 36
                  UP星级:
                    type: Text
                    attribute:
                      point: ~middle_center
                      y: 150
                      texts: "var.upItemStar != none ? '&e' + '★'.repeat(var.upItemStar.round()) : ''"
                      fontSize: 36
                  UP描述:
                    type: Text
                    attribute:
                      point: ~middle_center
                      y: 170
                      texts: "var.upItemDesc != none && var.upItemDesc != '' ? '&f' + var.upItemDesc : ''"
                      fontSize: 36

              # ── 保底进度卡 ────────────────────────────────
              保底卡:
                type: Canvas
                attribute:
                  point: ~top_left
                  x: 24
                  y: 408
                  width: "var.centerW - 48"
                  height: 240
                children:
                  保底卡底:
                    type: Texture
                    attribute:
                      point: ~stretch_all
                      normal: ~44,52,72,245
                      shape: ~round_rect
                      radius: 12
                    effect:
                      stroke:
                        width: 3
                        color: ~120,160,235,240
                  保底标题:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 24
                      texts: "~&f保底进度"
                      fontSize: 36
                  五星文本:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 72
                      texts: "var.pity5Limit != none && var.pity5Limit > 0 ? '&f5★ &e' + var.pity5 + '&f / ' + var.pity5Limit : '&f5★ &e' + var.pity5"
                      fontSize: 36
                  五星条容器:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 112
                      width: "var.centerW - 104"
                      height: 8
                    children:
                      五星条底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~44,52,72,245
                          shape: ~round_rect
                          radius: 4
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,165
                      五星条填充:
                        type: Texture
                        attribute:
                          point: ~top_left
                          width: "var.pity5Limit != none && var.pity5Limit > 0 ? (var.pity5 / var.pity5Limit) * (var.centerW - 104) : 0"
                          height: 8
                          normal: ~232,180,90,255
                          shape: ~round_rect
                          radius: 4
                  四星文本:
                    type: Text
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 136
                      texts: "var.pity4Limit != none && var.pity4Limit > 0 ? '&f4★ &d' + var.pity4 + '&f / ' + var.pity4Limit : '&f4★ &d' + var.pity4"
                      fontSize: 36
                  四星条容器:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 28
                      y: 176
                      width: "var.centerW - 104"
                      height: 8
                    children:
                      四星条底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~44,52,72,245
                          shape: ~round_rect
                          radius: 4
                        effect:
                          stroke:
                            width: 2
                            color: ~255,255,255,165
                      四星条填充:
                        type: Texture
                        attribute:
                          point: ~top_left
                          width: "var.pity4Limit != none && var.pity4Limit > 0 ? (var.pity4 / var.pity4Limit) * (var.centerW - 104) : 0"
                          height: 8
                          normal: ~186,140,232,255
                          shape: ~round_rect
                          radius: 4
                  保底说明:
                    type: Text
                    attribute:
                      point: ~bottom_left
                      x: 28
                      y: -16
                      texts: "var.guaranteeDesc != none ? '&f' + var.guaranteeDesc : ''"
                      fontSize: 36

              # ── 抽卡按钮（底部）──────────────────────────────
              抽卡区:
                type: Canvas
                attribute:
                  point: ~bottom_left
                  x: 24
                  y: -24
                  width: "var.centerW - 48"
                  height: 56
                children:
                  单抽按钮:
                    type: Canvas
                    attribute:
                      point: ~bottom_left
                      x: 0
                      y: 0
                      width: "var.tenAvailable ? (var.centerW - 72) / 2 : var.centerW - 48"
                      height: 56
                    action:
                      clickLeft: |-
                        if(!var.pulling && !var.actionBusy){
                          if(var.canPull){
                            var.pulling = true
                            var.resultPending = false
                            var.actionBusy = true
                            var.actionBusySeconds = 0
                            val.左侧导航.visible = false
                            val.内容区.visible = false
                            val.等待层.visible = true
                            Packet.send(var.packetId, 'pull', '1', var.actionToken)
                          }else{
                            val.资源不足提示.visible = true
                          }
                        }
                    children:
                      单抽底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~120,160,235,235
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '160,200,255,255' : '160,200,255,230'"
                      单抽文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&0祈愿 1 次"
                          fontSize: 36
                          through: true
                  十连按钮:
                    type: Canvas
                    attribute:
                      point: ~bottom_left
                      x: "var.tenAvailable ? (var.centerW - 72) / 2 + 24 : 0"
                      y: 0
                      width: "(var.centerW - 72) / 2"
                      height: 56
                      visible: "var.tenAvailable"
                    action:
                      clickLeft: |-
                        if(!var.pulling && !var.actionBusy){
                          if(var.canPullTen){
                            var.pulling = true
                            var.resultPending = false
                            var.actionBusy = true
                            var.actionBusySeconds = 0
                            val.左侧导航.visible = false
                            val.内容区.visible = false
                            val.等待层.visible = true
                            Packet.send(var.packetId, 'pull', '10', var.actionToken)
                          }else{
                            val.资源不足提示.visible = true
                          }
                        }
                    children:
                      十连底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~44,52,72,245
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '160,200,255,255' : '120,160,235,240'"
                      十连文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&f祈愿 10 次"
                          fontSize: 36
                          through: true

          # ── 右侧栏：消耗 + 资源 + 功能入口（var.rightW 宽）──────────
          右侧栏:
            type: Canvas
            attribute:
              point: ~top_left
              x: "var.centerW + 24"
              y: 0
              width: "var.rightW"
              height: "var.viewH - 144"
            children:
              # ── 单抽消耗 ──────────────────────────────────
              单抽消耗标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 20
                  texts: "~&f单抽消耗"
                  fontSize: 36
              单抽消耗区:
                type: VStack
                val: 单抽消耗区
                attribute:
                  point: ~top_left
                  x: 16
                  y: 64
                  width: "var.rightW - 32"
                  spaceBetween: 8
                children:
                  消耗条目0:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      width: "var.rightW - 32"
                      height: 56
                      visible: "var.costRows != none && var.costRows[self.entryKey] != none"
                    children:
                      条目底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~44,52,72,245
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 3
                            color: ~120,160,235,240
                      图标:
                        type: Slot
                        attribute:
                          point: ~middle_left
                          x: 10
                          width: 36
                          height: 36
                          slotType: ~Icon
                          itemScale: 0.8
                          seticon: "self.setItemIcon(var.costIconJsons != none && var.costIconJsons[self.parent.entryKey] != none ? var.costIconJsons[self.parent.entryKey] : var.air)"
                      名称:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 56
                          texts: "var.costRows != none && var.costRows[self.parent.entryKey] != none ? '&f' + var.costRows[self.parent.entryKey]['displayName'] : ''"
                          fontSize: 36
                      数量:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -12
                          texts: "var.costRows != none && var.costRows[self.parent.entryKey] != none ? '&e' + var.costRows[self.parent.entryKey]['amount'].round() : ''"
                          fontSize: 36
              # ── 十连消耗 ──────────────────────────────────
              十连消耗标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 260
                  texts: "~&f十连消耗"
                  fontSize: 36
              十连消耗区:
                type: VStack
                val: 十连消耗区
                attribute:
                  point: ~top_left
                  x: 16
                  y: 304
                  width: "var.rightW - 32"
                  spaceBetween: 8
                children:
                  消耗条目0:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      width: "var.rightW - 32"
                      height: 56
                      visible: "var.costTenRows != none && var.costTenRows[self.entryKey] != none"
                    children:
                      条目底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~44,52,72,245
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 3
                            color: ~120,160,235,240
                      图标:
                        type: Slot
                        attribute:
                          point: ~middle_left
                          x: 10
                          width: 36
                          height: 36
                          slotType: ~Icon
                          itemScale: 0.8
                          seticon: "self.setItemIcon(var.costTenIconJsons != none && var.costTenIconJsons[self.parent.entryKey] != none ? var.costTenIconJsons[self.parent.entryKey] : var.air)"
                      名称:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 56
                          texts: "var.costTenRows != none && var.costTenRows[self.parent.entryKey] != none ? '&f' + var.costTenRows[self.parent.entryKey]['displayName'] : ''"
                          fontSize: 36
                      数量:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -12
                          texts: "var.costTenRows != none && var.costTenRows[self.parent.entryKey] != none ? '&e' + var.costTenRows[self.parent.entryKey]['amount'].round() : ''"
                          fontSize: 36
              # ── 资源余额 ──────────────────────────────────
              资源标题:
                type: Text
                attribute:
                  point: ~top_left
                  x: 20
                  y: 500
                  texts: "~&f资源余额"
                  fontSize: 36
              资源栏:
                type: VStack
                val: 资源栏
                attribute:
                  point: ~top_left
                  x: 16
                  y: 544
                  width: "var.rightW - 32"
                  spaceBetween: 8
                children:
                  资源条目0:
                    type: Canvas
                    attribute:
                      entryKey: 0.round()
                      width: "var.rightW - 32"
                      height: 56
                      visible: "var.resourceRows != none && var.resourceRows[self.entryKey] != none"
                    children:
                      条目底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          normal: ~44,52,72,245
                          shape: ~round_rect
                          radius: 10
                        effect:
                          stroke:
                            width: 3
                            color: ~120,160,235,240
                      图标:
                        type: Slot
                        attribute:
                          point: ~middle_left
                          x: 10
                          width: 36
                          height: 36
                          slotType: ~Icon
                          itemScale: 0.8
                          seticon: "self.setItemIcon(var.resourceIconJsons != none && var.resourceIconJsons[self.parent.entryKey] != none ? var.resourceIconJsons[self.parent.entryKey] : var.air)"
                      名称:
                        type: Text
                        attribute:
                          point: ~middle_left
                          x: 56
                          texts: "var.resourceRows != none && var.resourceRows[self.parent.entryKey] != none ? '&f' + var.resourceRows[self.parent.entryKey]['displayName'] : ''"
                          fontSize: 36
                      余额:
                        type: Text
                        attribute:
                          point: ~middle_right
                          x: -12
                          texts: "var.resourceRows != none && var.resourceRows[self.parent.entryKey] != none ? (var.resourceRows[self.parent.entryKey]['owned'] != none && var.resourceRows[self.parent.entryKey]['owned'] >= 0 ? '&a' + var.resourceRows[self.parent.entryKey]['owned'].round() : '&f—') : ''"
                          fontSize: 36
              # ── 功能入口（底部）──────────────────────────────
              功能入口:
                type: Canvas
                attribute:
                  point: ~bottom_left
                  x: 16
                  y: -16
                  width: "var.rightW - 32"
                  height: 184
                children:
                  历史按钮:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 0
                      width: "var.rightW - 32"
                      height: 56
                    action:
                      clickLeft: |-
                        if(!var.actionBusy){
                          var.actionBusy = true
                          var.actionBusySeconds = 0
                          Packet.send(var.packetId, 'history')
                        }
                    children:
                      历史底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~44,52,72,245
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '160,200,255,255' : '120,160,235,240'"
                      历史文字:
                        type: Text
                        attribute:
                          point: ~middle_center
                          texts: "~&f祈愿记录"
                          fontSize: 36
                          through: true
                  详情按钮:
                    type: Canvas
                    attribute:
                      point: ~top_left
                      x: 0
                      y: 64
                      width: "var.rightW - 32"
                      height: 56
                    action:
                      clickLeft: |-
                        if(!var.actionBusy){
                          var.actionBusy = true
                          var.actionBusySeconds = 0
                          Packet.send(var.packetId, 'details')
                        }
                    children:
                      详情底:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: ~44,52,72,245
                          shape: ~round_rect
                          radius: 10
                        effect:
                          ripple:
                          stroke:
                            width: 3
                            color: "self.isHovered() ? '160,200,255,255' : '120,160,235,240'"
                      详情文字:
