                              slotType: ~Icon
                              x: 42
                              y: "24 - self.parent.hoverAnim.get() * 3"
                              width: 76
                              height: 76
                              itemScale: 1.18
                              normal: ~0,0,0,0
                              through: true
                              seticon: "self.setItemIcon(var.iconJsons[self.parent.entryKey])"
                          标签:
                            type: Text
                            attribute:
                              point: ~top_center
                              y: 120
                              texts: "'&f' + var.labels[self.parent.entryKey]"
                              fontSize: 48
                              limit: 8
                              through: true
                          悬停下线:
                            type: Texture
                            attribute:
                              x: 53
                              y: 148
                              width: 54
                              height: 2
                              normal: ~247,228,188,255
                              alpha: self.parent.hoverAnim.get()
                              through: true
                          禁用遮色:
