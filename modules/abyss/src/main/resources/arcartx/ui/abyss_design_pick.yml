# AXS 资源说明
# 用途: Abyss 设计模式副面板 —— 在当前流程节点内添加对象（类型卡片挑选）
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
#
# 通讯协议:
#   服务端 → init: packetId/action_token/nodeKey/kindRows{idx:{kind,icon,label,mark,kindColor}}/kindCount
#   客户端 → Packet.send('abyss', 'design_pick', kind, nodeKey, token)
#     mark=point: 关面板后标记杖右键落点；region: 左键A/右键B；none: 直接创建开编辑
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.nodeKey = packet['nodeKey']
      var.kindRows = packet['kindRows']
      var.kindCount = packet['kindCount']
      // 卡片 copy（§15.5 引用字典 + 轮次名 + 数量变化才重建）
      卡片目标数 = var.kindCount.round()
      if(val.类型网格.childrenCount() - 1 != 卡片目标数 - 1){
        for(key in var.卡片引用.keys()){
          var.卡片引用[key].remove()
        }
        var.卡片引用 = {}
        var.轮次 = (var.轮次 + 1).round()
        模板 = val.类型网格.get(0)
        模板.entryKey = 0.round()
        for(i in range(1, 卡片目标数 - 1)){
          e = 模板.copy('卡_' + var.轮次 + '_' + i.round())
          e.entryKey = i.round()
          var.卡片引用[i.round()] = e
        }
      }
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.nodeKey = ''
      var.kindRows = {}
      var.kindCount = 0
      var.卡片引用 = {}
      var.轮次 = 0
    open: |-
      Sound.self('minecraft:ui.button.click', 0.8, 8)
controls:
  全屏磨砂:
    type: Texture
    attribute:
      point: ~stretch_all
      normal: ~Frosted:30;10,8,20,230
      through: true
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~middle_center
      width: 1920
      height: 1080
    children:
      面板:
        type: Texture
        attribute:
          point: ~middle_center
          width: 940
          height: 500
          normal: ~18,14,30,242
          shape: ~round_rect
          radius: 18
          through: true
        effect:
          stroke:
            width: 2
            color: ~186,140,232,200
      标题色块:
        type: Texture
        attribute:
          point: ~top_center
          y: -304
          width: 8
          height: 36
          normal: ~186,140,232,255
          shape: ~round_rect
          radius: 4
          through: true
      标题:
        type: Text
        attribute:
          point: ~top_center
          y: -300
          texts: ~&f添加对象
          fontSize: 42
          through: true
      提示:
        type: Text
        attribute:
          point: ~top_center
          y: -246
          texts: ~&8标记方式：黄色=点杖落点 · 蓝色=杖圈选区域 · 绿色=直接创建
          fontSize: 24
          through: true
      类型网格:
        type: HGrid
        val: 类型网格
        attribute:
          point: ~middle_center
          y: 10
          width: 860
          height: 300
          hSpace: 18
          vSpace: 18
          column: 4
        children:
          卡:
            type: Canvas
            attribute:
              width: 195
              height: 128
              entryKey: 0.round()
              entry: "var.kindRows[self.entryKey]"
              visible: "self.entry != none"
            action:
              clickLeft: "Packet.send(var.packetId, 'design_pick', self.entry['kind'], var.nodeKey, var.actionToken)"
            children:
              底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  normal: ~30,25,48,235
                  shape: ~round_rect
                  radius: 12
                  through: true
                effect:
                  stroke:
                    width: 2
                    color: "self.parent.isHovered() ? self.parent.entry['kindColor'] + ',255' : '255,255,255,50'"
              图标:
                type: Text
                attribute:
                  point: ~top_center
                  y: 18
                  texts: "self.parent.entry['icon']"
                  fontSize: 40
                  through: true
              名:
                type: Text
                attribute:
                  point: ~middle_center
                  y: 16
                  texts: "'&f' + self.parent.entry['label']"
                  fontSize: 30
                  through: true
              标记底:
                type: Texture
                attribute:
                  point: ~bottom_center
                  y: -12
                  width: 100
                  height: 26
                  normal: ~14,11,24,240
                  shape: ~round_rect
                  radius: 8
                  through: true
              标记字:
                type: Text
                attribute:
                  point: ~bottom_center
                  y: -16
                  texts: "self.parent.entry['mark'] == 'point' ? '&e点杖落点' : (self.parent.entry['mark'] == 'region' ? '&b杖选区域' : '&a直接创建')"
                  fontSize: 20
                  through: true
      取消钮:
        type: Canvas
        attribute:
          point: ~bottom_center
          y: -296
          width: 150
          height: 48
        action:
          clickLeft: "Packet.send(var.packetId, 'design_back', var.actionToken)"
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~56,50,74,235
              shape: ~round_rect
              radius: 9
              through: true
            effect:
              stroke:
                width: 1
                color: "self.parent.isHovered() ? '255,255,255,200' : '255,255,255,60'"
          字:
            type: Text
            attribute:
              point: ~middle_center
              texts: ~返回主面板
              fontSize: 28
              through: true
