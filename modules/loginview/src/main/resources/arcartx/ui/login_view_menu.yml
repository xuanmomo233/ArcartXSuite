              修改确认:
                type: TextBox
                attribute: {x: 16, y: 12, width: 636, height: 40, length: 64, emptyText: ~再次输入新密码, fontSize: 36, passwordChar: ~※}
                action:
                  textChange: |-
                    var.changeConfirmPassword = self.getContent()
          修改按钮:
            type: Canvas
            attribute: {x: 40, y: 510, width: 668, height: 64, visible: "var.type == 'change'"}
