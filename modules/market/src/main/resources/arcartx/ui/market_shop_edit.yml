            var.pendingNavigation = -> {
              var.actionBusy = true
              if(var.view == 'item' && !var.itemNew){
                Packet.send(var.packetId, 'shop_edit_item', var.editShopId, var.editItemKey)
              } else {
                var.view = 'shop'
                Packet.send(var.packetId, 'shop_edit_shop', var.editShopId)
              }
            }
            var.navigate()
