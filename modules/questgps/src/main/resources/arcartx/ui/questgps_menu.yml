# AXS QuestGPS 任务总览菜单 — 紫罗兰重写版
# 范式: 全屏玻璃底 + Adaptive(~top_center,1920x1080) + 顶栏贴顶铺满 + 左侧导航 + 内容区
# 布局: 左导航(分页切换+分类筛选滚动) + 内容区(左任务列表 + 右任务详情)
# 配色: 紫罗兰 主色170,120,220 底28,22,38,110 抬升50,44,68,245 描边170,120,220,240
# 逻辑: packetHandler/action/val引用/entryKey/copy 与原版一致，仅重构布局结构与配色

ui:
  isHud: false
  background: false
  escClose: true
  closeDied: true
  through: false
  screenScale: true
  show: true
  level: 8
  itemSize: 16
  packetHandler:
    # packetHandler: init
    # 包字段:
    #   - packetId: 数据包 ID（用于客户端回传服务端）
    #   - categories: 分类字典（key=分类ID，value含id/name/selected字段）
    #   - pages: 分页字典（key=页面ID，value含名称等）
    #   - quests: 任务字典（key=任务ID，value含id/name/state/summary/selected/trackable字段）
    #   - tasks: 目标字典（key=目标ID，value含id/text/status/completed/tracked字段）
    #   - rewards: 奖励字典（key=奖励ID，value含title/description/itemJson字段）
    #   - categoryId: 当前选中分类 ID
    #   - pageId: 当前选中页面 ID（available/active/completed）
    #   - categoryName: 当前分类显示名
    #   - pageName: 当前页面显示名
    #   - availableCount: 可接取任务数
    #   - activeCount: 进行中任务数
    #   - completedCount: 已完成任务数
    #   - questCount: 当前列表任务总数
    #   - navigationReady: 导航功能是否就绪
    #   - selectedQuestId: 当前选中任务 ID
    #   - selectedQuestName: 当前选中任务名称
    #   - selectedQuestState: 当前选中任务状态文本
    #   - selectedQuestPath: 当前选中任务路径文本
    #   - selectedQuestDescriptionText: 当前选中任务描述
    #   - trackSummary: 追踪摘要文本
    #   - canAccept: 是否可接取任务
    #   - canAbandon: 是否可放弃任务
    #   - canTrackQuest: 是否可追踪任务
    #   - canTrackTask: 是否可追踪目标
    #   - canClearTrack: 是否可清除追踪
    #   - questTracked: 当前任务是否已追踪
    #   - taskCount: 目标总数
    #   - rewardCount: 奖励总数
    init: |-
      var.packetId = packet['packetId']
      var.categories = packet['categories']
      var.pages = packet['pages']
      var.quests = packet['quests']
      var.tasks = packet['tasks']
      var.rewards = packet['rewards']
      var.categoryId = packet['categoryId']
      var.pageId = packet['pageId']
      var.categoryName = packet['categoryName']
      var.pageName = packet['pageName']
      var.availableCount = packet['availableCount']
      var.activeCount = packet['activeCount']
      var.completedCount = packet['completedCount']
      var.questCount = packet['questCount']
      var.navigationReady = packet['navigationReady']
      var.selectedQuestId = packet['selectedQuestId']
      var.selectedQuestName = packet['selectedQuestName']
      var.selectedQuestState = packet['selectedQuestState']
      var.selectedQuestPath = packet['selectedQuestPath']
      var.selectedQuestDescriptionText = packet['selectedQuestDescriptionText']
      var.trackSummary = packet['trackSummary']
      var.canAccept = packet['canAccept']
      var.canAbandon = packet['canAbandon']
      var.canTrackQuest = packet['canTrackQuest']
      var.canTrackTask = packet['canTrackTask']
      var.canClearTrack = packet['canClearTrack']
      var.questTracked = packet['questTracked']
      var.taskCount = packet['taskCount']
      var.rewardCount = packet['rewardCount']
      var.catKeys = var.categories.keys()
      while(val.cat_list.childrenCount() > 1){
        val.cat_list.get(1).remove()
      }
      var.catIndex = 0
      for(key in var.catKeys){
        if(val.cat_list['分类模板'] != none){ item = val.cat_list['分类模板'].copy('分类项' + var.catIndex.round()) }
        item.entryKey = key
        var.catIndex = var.catIndex + 1
      }
      var.qKeys = var.quests.keys()
      while(val.quest_list.childrenCount() > 1){
        val.quest_list.get(1).remove()
      }
      var.qIndex = 0
      for(key in var.qKeys){
        if(val.quest_list['任务模板'] != none){ item = val.quest_list['任务模板'].copy('任务项' + var.qIndex.round()) }
        item.entryKey = key
        var.qIndex = var.qIndex + 1
      }
      var.tKeys = var.tasks.keys()
      while(val.task_list.childrenCount() > 1){
        val.task_list.get(1).remove()
      }
      var.tIndex = 0
      for(key in var.tKeys){
        if(val.task_list['目标模板'] != none){ item = val.task_list['目标模板'].copy('目标项' + var.tIndex.round()) }
        item.entryKey = key
        var.tIndex = var.tIndex + 1
      }
      var.rKeys = var.rewards.keys()
      var.rewardItemJsons = {}
      for(key in var.rKeys){
        rewardEntry = var.rewards[key]
        if(rewardEntry != none && rewardEntry['itemJson'] != none){
          var.rewardItemJsons[key] = rewardEntry['itemJson']
        }
      }
      while(val.reward_list.childrenCount() > 1){
        val.reward_list.get(1).remove()
      }
      var.rIndex = 0
      for(key in var.rKeys){
        if(val.reward_list['奖励模板'] != none){ item = val.reward_list['奖励模板'].copy('奖励项' + var.rIndex.round()) }
        item.entryKey = key
        var.rIndex = var.rIndex + 1
      }
      for(i in range(1, var.rIndex)){
        if(val.reward_list != none){ item = val.reward_list.get(i.round()) }
        if(item != none && item['奖励图标'] != none){
          item['奖励图标'].seticon()
        }
      }
    # packetHandler: update
    # 包字段: 与 init 相同，用于增量更新菜单数据
    # 优化: 只更新数据变量，仅在数量变化时才 remove+copy，避免每次刷新全量重建导致闪烁
    update: |-
      // 保存旧数量，用于判断是否需要重建列表
      oldCatCount = var.categories != none ? var.categories.keys().size() : 0
      oldQuestCount = var.quests != none ? var.quests.keys().size() : 0
      oldTaskCount = var.tasks != none ? var.tasks.keys().size() : 0
      oldRewardCount = var.rewards != none ? var.rewards.keys().size() : 0
      var.packetId = packet['packetId']
      var.categories = packet['categories']
      var.pages = packet['pages']
      var.quests = packet['quests']
      var.tasks = packet['tasks']
      var.rewards = packet['rewards']
      var.categoryId = packet['categoryId']
      var.pageId = packet['pageId']
      var.categoryName = packet['categoryName']
      var.pageName = packet['pageName']
      var.availableCount = packet['availableCount']
      var.activeCount = packet['activeCount']
      var.completedCount = packet['completedCount']
      var.questCount = packet['questCount']
      var.navigationReady = packet['navigationReady']
      var.selectedQuestId = packet['selectedQuestId']
      var.selectedQuestName = packet['selectedQuestName']
      var.selectedQuestState = packet['selectedQuestState']
      var.selectedQuestPath = packet['selectedQuestPath']
      var.selectedQuestDescriptionText = packet['selectedQuestDescriptionText']
      var.trackSummary = packet['trackSummary']
      var.canAccept = packet['canAccept']
      var.canAbandon = packet['canAbandon']
      var.canTrackQuest = packet['canTrackQuest']
      var.canTrackTask = packet['canTrackTask']
      var.canClearTrack = packet['canClearTrack']
      var.questTracked = packet['questTracked']
      var.taskCount = packet['taskCount']
      var.rewardCount = packet['rewardCount']
      var.catKeys = var.categories.keys()
      // ── 分类列表：仅在数量变化时重建 ──
      if(var.catKeys.size() != oldCatCount){
        while(val.cat_list.childrenCount() > 1){
          val.cat_list.get(1).remove()
        }
        var.catIndex = 0
        for(key in var.catKeys){
        if(val.cat_list['分类模板'] != none){ item = val.cat_list['分类模板'].copy('分类项' + var.catIndex.round()) }
          item.entryKey = key
          var.catIndex = var.catIndex + 1
        }
      }
      var.qKeys = var.quests.keys()
      // ── 任务列表：仅在数量变化时重建 ──
      if(var.qKeys.size() != oldQuestCount){
        while(val.quest_list.childrenCount() > 1){
          val.quest_list.get(1).remove()
        }
        var.qIndex = 0
        for(key in var.qKeys){
        if(val.quest_list['任务模板'] != none){ item = val.quest_list['任务模板'].copy('任务项' + var.qIndex.round()) }
          item.entryKey = key
          var.qIndex = var.qIndex + 1
        }
      }
      var.tKeys = var.tasks.keys()
      // ── 目标列表：仅在数量变化时重建 ──
      if(var.tKeys.size() != oldTaskCount){
        while(val.task_list.childrenCount() > 1){
          val.task_list.get(1).remove()
        }
        var.tIndex = 0
        for(key in var.tKeys){
        if(val.task_list['目标模板'] != none){ item = val.task_list['目标模板'].copy('目标项' + var.tIndex.round()) }
          item.entryKey = key
          var.tIndex = var.tIndex + 1
        }
      }
      var.rKeys = var.rewards.keys()
      var.rewardItemJsons = {}
      for(key in var.rKeys){
        rewardEntry = var.rewards[key]
        if(rewardEntry != none && rewardEntry['itemJson'] != none){
          var.rewardItemJsons[key] = rewardEntry['itemJson']
        }
      }
      // ── 奖励列表：仅在数量变化时重建 ──
      if(var.rKeys.size() != oldRewardCount){
        while(val.reward_list.childrenCount() > 1){
          val.reward_list.get(1).remove()
        }
        var.rIndex = 0
        for(key in var.rKeys){
        if(val.reward_list['奖励模板'] != none){ item = val.reward_list['奖励模板'].copy('奖励项' + var.rIndex.round()) }
          item.entryKey = key
          var.rIndex = var.rIndex + 1
        }
      }
      // 重新触发奖励图标 seticon（数据变了但 seticon 不会自动刷新）
      for(i in range(1, val.reward_list.childrenCount())){
        if(val.reward_list != none){ item = val.reward_list.get(i.round()) }
        if(item != none && item['奖励图标'] != none){
          item['奖励图标'].seticon()
        }
      }
  action:
    load: |-
      var.packetId = 'AXS_QUESTGPS'
      var.categories = {}
      var.quests = {}
      var.tasks = {}
      var.rewards = {}
      var.rewardItemJsons = {}
      var.emptyItemJson = '{"id": "minecraft:air","Count":1b}'
      var.pageName = '可接取'
      var.availableCount = 0
      var.activeCount = 0
      var.completedCount = 0
      var.questCount = 0
      var.navigationReady = false
      var.selectedQuestName = '暂无任务'
      var.selectedQuestDescriptionText = '当前分类下没有可展示的任务。'
      var.trackSummary = '当前未设置导航'
      var.canAccept = false
      var.canAbandon = false
      var.questTracked = false
      var.taskCount = 0
      var.rewardCount = 0
      // 视口换算：Adaptive 以 1920x1080 设计基准等比缩放
      // viewH / viewW = 换算到设计坐标系后的可用高宽，16:9 时正好 1080 / 1920
      // offX     = Adaptive 水平居中后，设计坐标 x=0 距窗口左边的偏量（超宽屏 > 0）
      // contentW = 内容区宽度（左 372 右 48 边距），detailW = 右详情区宽度
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.detailW = var.contentW - 528
      var.detailScrollW = var.detailW - 24
      var.taskScrollH = (var.viewH - 620) / 2
    open: |-
      Packet.send(var.packetId, 'refresh')
    # 窗口尺寸变化后重算可用高宽，依赖这些变量的控件尺寸会跟着刷新
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewH = Screen.getHeight() / s
      var.viewW = Screen.getWidth() / s
      var.offX = (var.viewW - 1920) / 2
      var.contentW = var.viewW - 420
      var.detailW = var.contentW - 528
      var.detailScrollW = var.detailW - 24
      var.taskScrollH = (var.viewH - 620) / 2

# ─── 控件树 ────────────────────────────────────────────────────────
controls:
  # 全屏毛玻璃底（真高斯模糊世界背景）；置于顶层以覆盖整块屏幕
  全屏玻璃底:
    type: Texture
    attribute:
      point: ~stretch_all
      through: true
      normal: ~Frosted:24;28,22,38,110
  # 自适配布局：宽高 = 本 UI 的设计分辨率（1920x1080），窗口分辨率变化时按比例缩放子控件
  # 顶部锚点：使 1080 设计高度的顶边与窗口上边对齐，顶栏可紧贴屏幕顶部
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      # ── 顶栏 ───────────────────────────────────────────
      # 顶栏沿窗口整宽铺满（超宽屏时向两侧溢出 Adaptive 的 1920 设计宽度）
      顶栏:
        type: Canvas
        attribute:
          point: ~top_left
          x: "-var.offX"
          width: "var.viewW"
          height: 96
        children:
          顶栏底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
          顶栏底线:
            type: Texture
            attribute:
              point: ~horizontal_stretch_bottom
              height: 1
              normal: ~170,120,220,230
          标题色块:
            type: Texture
            attribute:
              point: ~middle_left
              x: 48
              width: 6
              height: 36
              normal: ~170,120,220,255
              shape: ~round_rect
              radius: 3
          标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 68
              texts: "~&f任务导航"
              fontSize: 48
          标题竖线:
            type: Texture
            attribute:
              point: ~middle_left
              x: 220
              width: 1
              height: 30
              normal: ~170,120,220,230
          副标题:
            type: Text
            attribute:
              point: ~middle_left
              x: 240
              texts: "var.categoryName != none ? '&f' + var.categoryName + ' &f· &f' + var.pageName : '&f' + var.pageName"
              fontSize: 36
          追踪摘要:
            type: Text
            attribute:
              point: ~middle_right
              x: -260
              texts: "'&f' + var.trackSummary"
              fontSize: 32
          关闭按钮:
            type: Canvas
            attribute:
              point: ~middle_right
              x: -40
              width: 40
              height: 40
            action:
              clickLeft: |-
                Screen.close()
            children:
              关闭背景:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: ~50,44,68,245
                  shape: ~round_rect
                  radius: 10
                effect:
                  stroke:
                    width: 3
                    color: "self.isHovered() ? '220,180,255,255' : '170,120,220,240'"
              关闭文字:
                type: Text
                attribute:
                  point: ~middle_center
                  texts: "~&f✕"
                  fontSize: 36
                  through: true

      # ── 左侧导航 ───────────────────────────────────────
      左侧导航:
        type: Canvas
        attribute:
          point: ~top_left
          x: "48 - var.offX"
          y: 120
          width: 300
          height: "var.viewH - 144"
        children:
          导航底:
            type: Texture
            attribute:
              point: ~stretch_all
              normal: ~Frosted:30;255,255,255,100
              shape: ~round_rect
              radius: 14
            effect:
              stroke:
                width: 3
                color: ~170,120,220,240
          # 分页：可接取
          导航可接取:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 18
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'switch_page', 'available')
            children:
              可接取底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.pageId == 'available' ? '170,120,220,210' : '50,44,68,245'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: "var.pageId == 'available' ? 4 : 3"
                    color: "var.pageId == 'available' ? '255,255,255,255' : (self.isHovered() ? '220,180,255,255' : '170,120,220,240')"
              可接取高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~170,120,220,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.pageId == 'available'"
                  through: true
              可接取文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.pageId == 'available' ? '&0可接取' : '&f可接取'"
                  fontSize: 36
                  through: true
              可接取数量:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -16
                  texts: "'&f' + var.availableCount.round()"
                  fontSize: 32
                  through: true
          # 分页：进行中
          导航进行中:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 84
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'switch_page', 'active')
            children:
              进行中底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.pageId == 'active' ? '170,120,220,210' : '50,44,68,245'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: "var.pageId == 'active' ? 4 : 3"
                    color: "var.pageId == 'active' ? '255,255,255,255' : (self.isHovered() ? '220,180,255,255' : '170,120,220,240')"
              进行中高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~170,120,220,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.pageId == 'active'"
                  through: true
              进行中文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.pageId == 'active' ? '&0进行中' : '&f进行中'"
                  fontSize: 36
                  through: true
              进行中数量:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -16
                  texts: "'&f' + var.activeCount.round()"
                  fontSize: 32
                  through: true
          # 分页：已完成
          导航已完成:
            type: Canvas
            attribute:
              point: ~top_left
              x: 14
              y: 150
              width: 272
              height: 58
            action:
              clickLeft: |-
                Packet.send(var.packetId, 'switch_page', 'completed')
            children:
              已完成底:
                type: Texture
                attribute:
                  point: ~stretch_all
                  through: true
                  normal: "var.pageId == 'completed' ? '170,120,220,210' : '50,44,68,245'"
                  shape: ~round_rect
                  radius: 10
                effect:
                  ripple:
                  stroke:
                    width: "var.pageId == 'completed' ? 4 : 3"
                    color: "var.pageId == 'completed' ? '255,255,255,255' : (self.isHovered() ? '220,180,255,255' : '170,120,220,240')"
              已完成高亮条:
                type: Texture
                attribute:
                  point: ~middle_left
                  x: 8
                  width: 4
                  height: 28
                  normal: ~170,120,220,255
                  shape: ~round_rect
                  radius: 2
                  visible: "var.pageId == 'completed'"
                  through: true
              已完成文字:
                type: Text
                attribute:
                  point: ~middle_left
                  x: 28
                  texts: "var.pageId == 'completed' ? '&0已完成' : '&f已完成'"
                  fontSize: 36
                  through: true
              已完成数量:
                type: Text
                attribute:
                  point: ~middle_right
                  x: -16
                  texts: "'&f' + var.completedCount.round()"
                  fontSize: 32
                  through: true
          # 分隔线
          导航分隔线:
            type: Texture
            attribute:
              point: ~top_left
              x: 18
              y: 232
              width: 264
              height: 2
              normal: ~170,120,220,220
          # 分类筛选标题
          分类标题:
            type: Text
            attribute:
              point: ~top_left
              x: 20
              y: 250
              texts: "~&f分类筛选"
              fontSize: 36
          # 分类滚动区
          分类滚动:
            type: Scroll
            attribute:
              point: ~top_left
              x: 14
              y: 296
              width: 244
              height: "var.viewH - 458"
              moveY: "self.parent['分类滑块'].getDragYRatio()"
            action:
              wheel: |-
                if(self.moveY >= 0 && self.wheelValue > 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
                if(self.moveY <= 1 && self.wheelValue < 0){
                  self.parent['分类滑块'].setDragYRatio((self.moveY - self.wheelValue * 0.1).round(1))
                }
            children:
              分类列表:
                val: cat_list
                type: VStack
                attribute:
                  width: 244
                  spaceBetween: 8
                children:
                  分类模板:
                    type: Canvas
                    attribute:
                      entryKey: none
                      entry: var.categories[self.entryKey]
                      visible: self.entryKey != none && self.entry != none
                      width: 244
                      height: 48
                    action:
                      clickLeft: |-
                        Packet.send(var.packetId, 'switch_category', self.entry['id'])
                    children:
                      分类背景:
                        type: Texture
                        attribute:
                          point: ~stretch_all
                          through: true
                          normal: "self.parent.entry != none && self.parent.entry['selected'] ? '170,120,220,210' : '50,44,68,245'"
