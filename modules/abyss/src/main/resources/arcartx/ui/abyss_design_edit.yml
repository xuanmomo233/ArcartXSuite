# AXS 资源说明
# 用途: Abyss 设计模式对象编辑面板 —— 标量字段编辑 + 脚本/列表行编辑
# 前置依赖: ArcartX；Abyss 模块启用后自动注册导出。
#
# 通讯协议:
#   服务端 → init/update: packetId/action_token/objKey/objId/kindLabel/kindIcon/
#     summary/dirty/fieldRows{idx:{name,editor,label,value,options}}/fieldCount/
#     groupRows{idx:{field,label,lines{idx},lineCount}}/groupCount
#   客户端 → Packet.send('abyss', ...):
#     design_set <objKey> <field> <value> <token>       标量/开关提交
#     design_cycle <objKey> <field> <token>            CYCLE 下一值
#     design_remark <objKey> <field> <token>           开始标记(coord/region)
#     design_rename <objKey> <newId> <token>           重命名
#     design_line_add <objKey> <field> <text> <token>
#     design_line_set <objKey> <field> <idx> <text> <token>
#     design_line_del <objKey> <field> <idx> <token>
#     design_line_move <objKey> <field> <idx> <dir> <token>
#     design_back <token>                              返回主面板
#   行内"改": 点行内容 → 装入该组输入框 + var.editG/var.editI 记编辑态 → 提交走 line_set
ui:
  isHud: false
  defaultOpen: false
  background: false
  closeDied: true
  escClose: true
  through: false
  screenScale: true
  show: true
  packetHandler:
    init: |-
      var.packetId = packet['packetId']
      var.actionToken = packet['action_token']
      var.objKey = packet['objKey']
      var.objId = packet['objId']
      var.kindLabel = packet['kindLabel']
      var.icon = packet['kindIcon']
      var.summary = packet['summary']
      var.dirty = packet['dirty']
      var.fieldRows = packet['fieldRows']
      var.fieldCount = packet['fieldCount']
      var.groupRows = packet['groupRows']
      var.groupCount = packet['groupCount']
      var.editG = -1
      var.editI = -1
      for(i in range(0, 12)){
        if(var.fieldRows['' + i] != none){
          e = var.fieldRows['' + i]
          if(e['editor'] == 'TEXT' || e['editor'] == 'NUMBER'){
            val.字段列.get(i)['输入壳']['输入框'].setContent(e['value'])
          }
        }
      }
    update: |-
      var.objId = packet['objId']
      var.summary = packet['summary']
      var.dirty = packet['dirty']
      var.fieldRows = packet['fieldRows']
      var.fieldCount = packet['fieldCount']
      var.groupRows = packet['groupRows']
      var.groupCount = packet['groupCount']
      var.editG = -1
      var.editI = -1
      for(i in range(0, 12)){
        if(var.fieldRows['' + i] != none){
          e = var.fieldRows['' + i]
          if(e['editor'] == 'TEXT' || e['editor'] == 'NUMBER'){
            val.字段列.get(i)['输入壳']['输入框'].setContent(e['value'])
          }
        }
      }
  action:
    load: |-
      var.packetId = 'abyss'
      var.actionToken = ''
      var.objKey = ''
      var.objId = ''
      var.kindLabel = ''
      var.icon = ''
      var.summary = ''
      var.dirty = false
      var.fieldRows = {}
      var.fieldCount = 0
      var.groupRows = {}
      var.groupCount = 0
      var.editG = -1
      var.editI = -1
    open: |-
      Sound.self('minecraft:block.note_block.pling', 0.8, 8)
