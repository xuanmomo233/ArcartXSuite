# AXS AFKReward — 休憩状态条
ui:
  id: AXS:afk_reward_hud
  isHud: true
  defaultOpen: true
  level: 20
  through: true
  show: true
  packetHandler:
    update: |-
      var.area = packet['area']
      var.time = packet['time']
      var.next = packet['next']
      var.players = packet['players']
      var.session_rewards = packet['session_rewards']
      var.session_time = packet['session_time']
      var.visible = packet['visible'] == true || packet['visible'] == 'true' == true || packet['visible'] == 'true'
  screenScale: true
  action:
    load: |-
      var.visible = false
      var.area = ''
      var.time = ''
      var.next = '0'
      var.players = '0'
      var.session_rewards = '0'
      var.session_time = ''
      self.actions['resize']()
    resize: |-
      sx = Screen.getWidth() / 1920
      sy = Screen.getHeight() / 1080
      s = sx < sy ? sx : sy
      var.viewW = Screen.getWidth() / s
      var.viewH = Screen.getHeight() / s
      var.offX = (var.viewW - 1920) / 2
controls:
  自适应全局布局:
    type: Adaptive
    attribute:
      point: ~top_center
      width: 1920
      height: 1080
    children:
      休憩状态:
        type: Canvas
        attribute:
          point: ~top_right
          x: var.offX - 32
          y: 132
          width: 480
          height: 224
          visible: var.visible
        children:
          底:
            type: Texture
            attribute:
              point: ~stretch_all
              through: true
              normal: ~30,49,39,225
              shape: ~round_rect
              radius: 12
          色带:
            type: Texture
            attribute:
              point: ~top_left
              through: true
              normal: ~158,178,114,255
              x: 0
              y: 24
              width: 4
              height: 176
          区域:
            type: Text
            attribute:
              x: 24
              y: 20
              texts: '''&f'' + var.area'
              fontSize: 54
              through: true
              limit: 22
          倒计时:
            type: Text
            attribute:
              x: 24
              y: 68
              texts: '''&a'' + var.next + '' &7秒后发放奖励'''
              fontSize: 54
              through: true
              limit: 24
          收益:
            type: Text
            attribute:
              x: 24
              y: 120
              texts: '''&f已获 '' + var.session_rewards + '' 次  &7·  区域 '' + var.players + '' 人'''
              fontSize: 36
              through: true
              limit: 30
          时长:
            type: Text
            attribute:
              x: 24
              y: 164
              texts: '''&7本轮 '' + var.time + ''  累计 '' + var.session_time'
              fontSize: 36
              through: true
              limit: 38
