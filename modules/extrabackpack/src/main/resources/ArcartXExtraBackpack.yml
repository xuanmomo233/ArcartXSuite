# ArcartXSuite ExtraBackpack - 额外背包模块配置
# 多分类额外背包系统，支持装备/材料/杂物等分类页，每页独立容量与付费扩容。
# 重载: /axs reload extrabackpack
# 管理命令: /axs extrabackpack help|status|info|give|reset
config-version: 2

settings:
  # 是否输出调试日志
  debug: false
  # 槽位数据异步落盘间隔（ticks，20 = 1 秒，最小 20）。
  # 槽位改动先记内存态并标脏，周期任务批量写库；玩家退出/关闭背包/模块停用时同步落盘。
  flush-interval-ticks: 100

ui:
  # 插件启用时是否自动注册背包 UI
  register-ui-on-enable: true
  # 是否覆盖用户已修改的 UI 文件
  overwrite-ui-files: false

storage:
  # shared: true 共享存储模式（推荐，性能较好），数据库连接由本体统一管控。
  # 各模块共用本体 config.yml（plugins/ArcartX-Suite/config.yml）的 storage 节配置。
  shared: true
  #
  # —— shared: false 时，必须配置下方字段启动自建存储模式（不推荐） ——
  # 存储模式：sqlite 或 mysql。
  # mode: "sqlite"
  #
  # —— SQLite 存储 ——
  # SQLite 文件名（相对模块数据目录）。
  # sqlite:
  #   file: "<moduleId>.db"
  # JDBC 连接池大小，SQLite 建议保持 1。
  # pool-size: <N>
  #
  # —— MySQL 存储 ——
  # 在此处填写 MySQL 连接信息 = 本模块「自建」独立 HikariCP 连接池，不复用本体连接。
  # 以下配置仅在 mode 设为 mysql 时生效：
  # mysql:
  #   host: "127.0.0.1"
  #   port: 3306
  #   database: "arcartxsuite"
  #   username: "root"
  #   password: ""
  #   table-prefix: "axs_<moduleId>_"

# ─── 额外背包配置 ───
extra-backpack:
  # 是否启用额外背包功能（false 时模块不注册 UI、不响应任何操作）
  enabled: true
  # 分类页定义，键名即分类 ID
  categories:
    # 装备分类
    equipment:
      # 分类显示名称
      display-name: "装备"
      # 分类排序优先级 (数值越小越靠前)
      priority: 10
      slots:
        # 初始槽位数
        initial: 9
        # 最大槽位上限
        max: 27
      price:
        # 购买槽位使用的货币类型 (points/vault)
        currency: "points"
        # 每个槽位的价格
        per-slot: 100
      # 物品自动归类匹配规则
      match:
        nbt:
          # NBT 路径，用于读取物品分类标签
          path: "pdc:arcartx:item_category"
          # 匹配的标签值列表，物品标签值在此列表中则归入该分类
          values: ["equipment", "weapon", "armor"]
    # 材料分类
    material:
      display-name: "材料"
      priority: 20
      slots:
        initial: 9
        max: 27
      price:
        currency: "points"
        per-slot: 80
      match:
        nbt:
          path: "pdc:arcartx:item_category"
          values: ["material"]
    # 杂物分类 (兜底分类，未匹配其他分类的物品归入此处)
    other:
      display-name: "杂物"
      priority: 9999
      # 是否为默认分类 (未匹配其他分类的物品自动归入)
      default: true
      slots:
        initial: 9
        max: 27
      price:
        currency: "points"
        per-slot: 60
